<!doctype html>
<html lang="zh-CN" style="background:#070912">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070912">
<title>私人歌单 · B612星空点歌台 · WM的空间站</title>
<meta name="description" content="WM的空间站私人歌单：83首精选曲库，支持随机来1-5首、待点与已点极简切换。">
<link rel="preload" as="image" href="assets/sky-b612.webp">
<style>
  :root{
    --bg:#070912; --ink:#f4f6fb; --dim:#9aa5b8; --line:rgba(255,228,158,.16);
    --gold:#ffd875; --mint:#7ef2b8; --rose:#ff8da1; --blue:#7fe3ff;
    --card:linear-gradient(165deg,rgba(16,22,40,.90),rgba(10,14,26,.94));
  }
  *{box-sizing:border-box}
  html,body{margin:0; background:var(--bg); overscroll-behavior-y:none}
  body{
    min-height:100svh; color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    background:var(--bg) url(assets/sky-b612.webp) center/cover no-repeat fixed;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(circle at 50% 14%, rgba(126,242,184,.12), transparent 55%),
               linear-gradient(180deg,rgba(7,9,18,.68),rgba(7,9,18,.88) 52%,#070912 100%);
  }
  .wrap{position:relative; z-index:1; width:min(900px,93vw); margin:0 auto; padding:20px 0 70px}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px}
  .back{
    display:inline-flex; align-items:center; gap:8px; text-decoration:none; color:#ffe6a3;
    font-weight:700; font-size:13px; padding:7px 14px; border-radius:999px;
    background:rgba(14,19,34,.84); border:1px solid rgba(255,224,140,.24); transition:transform .2s, background .2s;
  }
  .back:hover{background:var(--gold); color:#161004; transform:translate3d(-2px,0,0)}
  .back svg{width:14px;height:14px}
  .badge{
    display:inline-flex; align-items:center; gap:8px; padding:6px 13px; border-radius:999px;
    background:rgba(126,242,184,.10); border:1px solid rgba(126,242,184,.28);
    font:600 11px/1 ui-monospace,monospace; letter-spacing:.08em; color:#c8ffdf;
  }
  .badge i{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint)}

  /* 顶部：标题 + 随机来 1-5 首 */
  .story-head{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    padding:16px 20px; margin-bottom:14px; border-radius:20px;
    border:1px solid var(--line); background:var(--card);
    box-shadow:0 20px 50px -30px rgba(0,0,0,.85);
  }
  .sh-copy h1{margin:0; font-size:clamp(22px,3.6vw,30px); font-weight:900; letter-spacing:-.02em}
  .sh-copy h1 em{font-style:normal; color:var(--mint)}
  .sh-copy .quote{margin:3px 0 0; font-size:12.5px; color:#ffefb8; opacity:.86}

  .dice-bar{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
  .dice-lbl{font-size:12.5px; font-weight:800; color:var(--gold); margin-right:2px; white-space:nowrap}
  .dice-n{
    appearance:none; border:1px solid rgba(255,216,117,.45);
    background:linear-gradient(180deg,rgba(255,228,148,.22),rgba(255,194,71,.12));
    color:#ffe8a3; font:800 13px/1 inherit; padding:9px 13px; border-radius:11px; cursor:pointer;
    transition:all .16s ease; white-space:nowrap;
  }
  .dice-n:hover, .dice-n.on{
    background:linear-gradient(180deg,#ffe494,#ffc247); color:#181002; border-color:var(--gold);
    transform:translateY(-1px); box-shadow:0 10px 22px -10px rgba(255,216,117,.65);
  }

  /* 🎲 随机抽出的 1-5 首结果展示盒 */
  .pick-box{
    display:none; flex-direction:column; gap:10px;
    padding:14px 16px; margin-bottom:14px; border-radius:18px;
    background:linear-gradient(145deg,rgba(255,216,117,.14),rgba(126,242,184,.08),rgba(12,17,32,.92));
    border:1px solid rgba(255,216,117,.42);
  }
  .pick-box.on{display:flex}
  .pick-top{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap}
  .pick-title{font-weight:800; font-size:13.5px; color:var(--gold); display:flex; align-items:center; gap:6px}
  .pick-acts{display:flex; gap:8px; flex-wrap:wrap}
  .pick-btn{
    appearance:none; border:1px solid rgba(255,255,255,.16); background:rgba(255,255,255,.06);
    color:#fff; font:700 12px/1 inherit; padding:7px 12px; border-radius:9px; cursor:pointer;
  }
  .pick-btn.ok{background:var(--mint); border-color:var(--mint); color:#04150e}
  .pick-btn:hover{opacity:.92}
  .pick-list{display:flex; gap:8px; flex-wrap:wrap}
  .pick-item{
    display:inline-flex; align-items:center; gap:8px; padding:8px 13px; border-radius:12px;
    background:rgba(7,10,18,.78); border:1px solid rgba(255,216,117,.35);
    color:#fff; font-size:13.5px; font-weight:700; cursor:pointer; transition:border-color .16s;
  }
  .pick-item small{color:var(--dim); font-weight:500; font-size:12px}
  .pick-item em{font-style:normal; font-size:11px; padding:3px 7px; border-radius:6px; background:rgba(126,242,184,.16); color:var(--mint)}
  .pick-item.done{opacity:.55; border-color:rgba(126,242,184,.4)}
  .pick-item.done b{text-decoration:line-through}

  /* 极简三态切换（待点 / 已点 / 全部） + 歌手快筛 */
  .filter-box{margin-bottom:12px; display:grid; gap:8px}
  .state-bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .state-tab{
    appearance:none; border:1px solid rgba(255,255,255,.14); background:rgba(14,19,34,.82);
    color:#c6d0e2; font:800 13.5px/1 inherit; padding:10px 18px; border-radius:12px; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; transition:all .16s ease;
  }
  .state-tab i{font-style:normal; font:700 11.5px/1 ui-monospace,monospace; padding:3px 7px; border-radius:999px; background:rgba(255,255,255,.08)}
  .state-tab.on{background:var(--mint); border-color:var(--mint); color:#04150e}
  .state-tab.on i{background:rgba(4,21,14,.18); color:#04150e}

  .artist-bar{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; padding-bottom:2px; align-items:center}
  .artist-bar::-webkit-scrollbar{display:none}
  .chip{
    appearance:none; border:1px solid rgba(255,255,255,.11); background:rgba(14,19,34,.75);
    color:#aeb8cc; font:600 12px/1 inherit; padding:6px 11px; border-radius:9px; cursor:pointer;
    white-space:nowrap; transition:all .16s ease; display:inline-flex; align-items:center; gap:5px;
  }
  .chip i{font-style:normal; font:600 10px/1 ui-monospace,monospace; opacity:.65}
  .chip:hover{color:#fff; border-color:rgba(255,224,140,.35)}
  .chip.on{background:rgba(127,227,255,.22); border-color:var(--blue); color:#e2f9ff; font-weight:700}

  .panel{
    border:1px solid var(--line); border-radius:20px; background:var(--card);
    box-shadow:0 26px 60px -34px rgba(0,0,0,.9); overflow:hidden;
  }
  .toolbar{
    display:flex; align-items:center; gap:9px; padding:12px 16px;
    border-bottom:1px solid rgba(255,255,255,.07); flex-wrap:wrap;
  }
  .search{
    flex:1 1 180px; min-width:140px; display:flex; align-items:center; gap:8px;
    padding:8px 12px; border-radius:11px; background:rgba(7,10,18,.68);
    border:1px solid rgba(255,255,255,.12);
  }
  .search svg{width:14px;height:14px;color:#7f8b9e;flex:0 0 auto}
  .search input{
    flex:1; min-width:0; background:none; border:0; outline:0; color:var(--ink);
    font:inherit; font-size:13.5px;
  }
  .search input::placeholder{color:#667286}
  .count{
    font:600 11.5px/1 ui-monospace,monospace; letter-spacing:.04em; color:#ffe6a3;
    padding:0 4px; white-space:nowrap;
  }
  .btn{
    appearance:none; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.06);
    color:#dce4f2; font:700 12px/1 inherit; padding:8px 12px; border-radius:10px; cursor:pointer;
    transition:all .16s ease; white-space:nowrap;
  }
  .btn:hover{border-color:var(--gold); color:#181002; background:var(--gold)}

  .adder{display:none; gap:8px; padding:12px 16px; border-bottom:1px solid rgba(255,255,255,.08); flex-wrap:wrap; background:rgba(7,10,18,.55)}
  .panel.unlocked .adder{display:flex}
  .field{
    flex:1 1 130px; min-width:110px; padding:8px 10px; border-radius:9px;
    background:rgba(14,19,34,.85); border:1px solid rgba(255,255,255,.14);
    color:var(--ink); font:inherit; font-size:13px; outline:0;
  }
  .field:focus{border-color:var(--gold)}

  ol.list{list-style:none; margin:0; padding:4px 0}
  .row{
    display:flex; align-items:center; gap:10px; padding:11px 16px;
    border-bottom:1px solid rgba(255,255,255,.05); transition:background .18s ease;
  }
  .row:last-child{border-bottom:0}
  .row:hover{background:rgba(255,255,255,.035)}
  .row.picked{background:rgba(255,216,117,.12); border-left:3px solid var(--gold)}
  .row.sung{opacity:.48}
  .row.sung .title{text-decoration:line-through}
  .num{
    width:24px; flex:0 0 24px; text-align:right;
    font:600 11px/1 ui-monospace,monospace; color:#667286;
  }
  .meta{flex:1; min-width:0; cursor:pointer; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
  .title{font-weight:800; font-size:15px; color:#f4f7fc}
  .artist{color:var(--dim); font-size:12.5px}

  .row-acts{display:flex; align-items:center; gap:6px}
  .state-btn{
    appearance:none; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05);
    color:#d0daec; font:700 12px/1 inherit; padding:7px 14px; border-radius:9px; cursor:pointer;
    transition:all .16s; white-space:nowrap;
  }
  .state-btn:hover{border-color:var(--gold); color:var(--gold)}
  .state-btn.on{background:rgba(126,242,184,.18); border-color:var(--mint); color:var(--mint)}
  .del{
    display:none; appearance:none; border:0; background:none; cursor:pointer;
    color:#9c7878; padding:5px 7px; border-radius:7px; line-height:0;
  }
  .panel.unlocked .del{display:inline-flex}
  .del:hover{color:#ff9c9c; background:rgba(255,120,120,.14)}

  .empty{padding:40px 18px; text-align:center; color:#7d889c; font-size:13.5px}
  .empty b{display:block; color:#b8c4d8; font-weight:700; margin-bottom:6px; font-size:14.5px}

  .foot{
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin-top:14px; color:#8894a8; font-size:12px;
  }
  .mini{
    appearance:none; background:none; border:0; color:#a8b4c8; font-size:12px; cursor:pointer;
    padding:4px 2px; border-bottom:1px dotted rgba(255,224,140,.3);
  }
  .mini:hover{color:var(--gold); border-color:var(--gold)}

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translate(-50%,12px); z-index:80;
    padding:10px 16px; border-radius:11px; font-size:13px; color:#181002; font-weight:700;
    background:linear-gradient(180deg,#ffe494,#ffc247);
    box-shadow:0 16px 36px rgba(0,0,0,.6); opacity:0; pointer-events:none;
    transition:opacity .22s ease, transform .22s ease;
  }
  .toast.on{opacity:1; transform:translate(-50%,0)}

  @media(max-width:560px){
    body{background-attachment:scroll}
    .story-head{padding:14px 15px}
    .dice-n{padding:8px 10px; font-size:12px}
    .state-tab{padding:9px 13px; font-size:12.5px}
    .row{padding:10px 12px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      返回 B612 空间站
    </a>
    <span class="badge"><i></i>ASTEROID B612 · 私人歌单</span>
  </div>

  <div class="story-head">
    <div class="sh-copy">
      <h1>✦ 私人<em>歌单</em></h1>
      <p class="quote">点歌名一键复制；不知道唱啥直接点右侧「随机来 1–5 首」。</p>
    </div>
    <div class="dice-bar" id="diceBar">
      <span class="dice-lbl">🎲 随机来：</span>
      <button class="dice-n" type="button" data-n="1">1首</button>
      <button class="dice-n" type="button" data-n="2">2首</button>
      <button class="dice-n" type="button" data-n="3">3首</button>
      <button class="dice-n" type="button" data-n="4">4首</button>
      <button class="dice-n" type="button" data-n="5">5首</button>
    </div>
  </div>

  <!-- 🎲 随机抽歌展示盒 -->
  <div class="pick-box" id="pickBox">
    <div class="pick-top">
      <span class="pick-title" id="pickTitle">🎲 为你随机抽中：</span>
      <div class="pick-acts">
        <button class="pick-btn ok" id="pickMarkAll" type="button">✓ 全部标为已点</button>
        <button class="pick-btn" id="pickAgain" type="button">🔄 换一批</button>
        <button class="pick-btn" id="pickClose" type="button">收起</button>
      </div>
    </div>
    <div class="pick-list" id="pickList"></div>
  </div>

  <!-- 极简三态 Tab（待点 / 已点 / 全部） + 歌手筛选 -->
  <div class="filter-box">
    <div class="state-bar" id="stateBar"></div>
    <div class="artist-bar" id="artistBar" aria-label="歌手快筛"></div>
  </div>

  <div class="panel" id="panel">
    <div class="toolbar">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
        <input id="q" type="search" placeholder="搜歌名或歌手（如：陈奕迅、周杰伦、海阔天空）" autocomplete="off">
      </label>
      <span class="count" id="count">0 首</span>
      <button class="btn" id="lockBtn" type="button">➕ 加歌</button>
      <button class="btn" id="resetSungBtn" type="button">重置已点</button>
    </div>

    <div class="adder">
      <input class="field" id="t" placeholder="歌名（必填）" autocomplete="off">
      <input class="field" id="a" placeholder="歌手（如：陈奕迅）" autocomplete="off">
      <button class="btn" id="addBtn" type="button" style="border-color:var(--mint);color:var(--mint)">+ 添加到歌单</button>
    </div>

    <ol class="list" id="list"></ol>
  </div>

  <div class="foot">
    <span>💡 点击任意歌名即可复制；点右侧「待点 / ✓ 已点」切换状态。</span>
    <button class="mini" id="restoreDefaultBtn" type="button">恢复默认83首歌单</button>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  var KEY = 'wmv587.ktv.v2';
  var SUNG_KEY = 'wmv587.ktv.sung.v2';

  var RAW_GROUPS = [
    ['陈奕迅', [
      '阿牛','白玫瑰','红玫瑰','失忆蝴蝶','信心花舍','打回原形','单车','浮夸','富士山下','黑暗中漫舞',
      '黑夜不再来','今天等我来','今天只做一件事','K歌之王','苦瓜','落花流水','任我行','明年今日','你的背包','不要说话',
      '一丝不挂','葡萄成熟时','七百年后','裙下之臣','斯德哥尔摩情人','热带雨林','人来人往','谁来剪月光','Shall we talk','沙龙',
      '伤信','十年','十面埋伏','岁月如歌','天下无双','陀飞轮','我的快乐时代','无人之境','夕阳无限好','喜帖街',
      '谢谢侬','心的距离','遥远的她','阴天快乐','吟游诗人','约定','粤语残片','最后派对','最佳损友','最冷一天','1874'
    ]],
    ['李健', ['贝加尔湖畔','假如爱有天意','传奇','风吹麦浪']],
    ['梁博', ['曾经是情侣','出现又离开','男孩']],
    ['BEYOND', ['海阔天空','大地','光辉岁月','喜欢你','真的爱你']],
    ['周杰伦', ['夜曲','稻香','东风破','菊花台','烟花易冷','以父之名']],
    ['古巨基', ['必杀技','爱得太迟']],
    ['赵雷', ['成都','鼓楼','我们的时光','阿刁']],
    ['李荣浩', ['李白','麻雀','模特','爸爸妈妈','年少有为']],
    ['王力宏', ['大城小爱','我们的歌','好心分手']]
  ];

  var DEFAULT = [];
  RAW_GROUPS.forEach(function(g){
    var artist = g[0], list = g[1];
    list.forEach(function(title){
      DEFAULT.push({ t: title, a: artist });
    });
  });

  var panel = document.getElementById('panel');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');
  var qEl = document.getElementById('q');
  var tEl = document.getElementById('t');
  var aEl = document.getElementById('a');
  var lockBtn = document.getElementById('lockBtn');
  var toastEl = document.getElementById('toast');
  var stateBar = document.getElementById('stateBar');
  var artistBar = document.getElementById('artistBar');
  var pickBox = document.getElementById('pickBox');
  var pickTitle = document.getElementById('pickTitle');
  var pickList = document.getElementById('pickList');

  var curState = 'todo'; // 'todo' (待点) | 'done' (已点) | 'all' (全部)
  var curArtist = 'all';
  var pickedIndices = [];
  var lastPickCount = 3;
  var sungMap = loadSung();
  var songs = load();
  var unlocked = false;

  function normSong(s){
    return {
      t: String(s.t || '').trim(),
      a: String(s.a || '').trim()
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      if (!raw) return DEFAULT.map(normSong);
      var arr = JSON.parse(raw);
      if (!Array.isArray(arr) || !arr.length) return DEFAULT.map(normSong);
      return arr.filter(function(s){ return s && typeof s.t === 'string'; }).map(normSong);
    }catch(e){ return DEFAULT.map(normSong); }
  }

  function loadSung(){
    try{ return JSON.parse(localStorage.getItem(SUNG_KEY) || '{}') || {}; }
    catch(e){ return {}; }
  }
  function saveSung(){
    try{ localStorage.setItem(SUNG_KEY, JSON.stringify(sungMap)); }catch(e){}
  }
  function persist(){
    try{ localStorage.setItem(KEY, JSON.stringify(songs)); }
    catch(e){ toast('保存失败：浏览器限制了本地存储'); }
  }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 2000);
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
    });
  }

  function renderPicks(){
    if (!pickedIndices.length){
      pickBox.classList.remove('on');
      return;
    }
    pickBox.classList.add('on');
    pickTitle.textContent = '🎲 随机来 ' + pickedIndices.length + ' 首（点歌名复制 / 点卡片标为已点）：';
    pickList.innerHTML = pickedIndices.map(function(idx){
      var s = songs[idx];
      if (!s) return '';
      var sKey = s.t + '|' + s.a;
      var isDone = !!sungMap[sKey];
      return '<span class="pick-item' + (isDone ? ' done' : '') + '" data-pidx="' + idx + '">' +
        '<b>' + esc(s.t) + '</b> <small>' + esc(s.a) + '</small> ' +
        '<em>' + (isDone ? '✓ 已点' : '点我标已点') + '</em></span>';
    }).join('');
  }

  function rollRandom(n){
    lastPickCount = n;
    /* 优先从当前歌手/搜索下的“待点”里抽；如果不够则从全部待点里抽 */
    var basePool = songs.map(function(s, idx){ return { s: s, idx: idx }; }).filter(function(item){
      var s = item.s;
      if (curArtist !== 'all' && s.a !== curArtist) return false;
      var q = (qEl.value || '').trim().toLowerCase();
      if (q && (s.t + ' ' + s.a).toLowerCase().indexOf(q) < 0) return false;
      return !sungMap[s.t + '|' + s.a];
    });
    if (!basePool.length){
      basePool = songs.map(function(s, idx){ return { s: s, idx: idx }; }).filter(function(item){
        return !sungMap[item.s.t + '|' + item.s.a];
      });
    }
    if (!basePool.length){
      basePool = songs.map(function(s, idx){ return { s: s, idx: idx }; });
    }
    /* 洗牌抽取前 n 首 */
    var pool = basePool.slice();
    for (var i = pool.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
    }
    var chosen = pool.slice(0, Math.min(n, pool.length));
    pickedIndices = chosen.map(function(c){ return c.idx; });

    [].slice.call(document.querySelectorAll('#diceBar .dice-n')).forEach(function(b){
      b.classList.toggle('on', Number(b.getAttribute('data-n')) === n);
    });

    render();
    toast('🎲 已随机抽出 ' + pickedIndices.length + ' 首歌');
  }

  document.getElementById('diceBar').addEventListener('click', function(e){
    var b = e.target.closest('[data-n]');
    if (!b) return;
    rollRandom(Number(b.getAttribute('data-n')) || 1);
  });

  document.getElementById('pickAgain').addEventListener('click', function(){
    rollRandom(lastPickCount || 3);
  });
  document.getElementById('pickClose').addEventListener('click', function(){
    pickedIndices = [];
    render();
  });
  document.getElementById('pickMarkAll').addEventListener('click', function(){
    pickedIndices.forEach(function(idx){
      var s = songs[idx];
      if (s) sungMap[s.t + '|' + s.a] = true;
    });
    saveSung();
    render();
    toast('✓ 已将抽中的 ' + pickedIndices.length + ' 首全部标为已点');
  });

  pickList.addEventListener('click', function(e){
    var item = e.target.closest('[data-pidx]');
    if (!item) return;
    var idx = Number(item.getAttribute('data-pidx'));
    var s = songs[idx];
    if (!s) return;
    var sKey = s.t + '|' + s.a;
    sungMap[sKey] = !sungMap[sKey];
    if (!sungMap[sKey]) delete sungMap[sKey];
    saveSung();
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(s.t).catch(function(){});
    }
    render();
    toast((sungMap[sKey] ? '✓ 已标为已点并复制：《' : '已恢复待点：《') + s.t + '》');
  });

  function renderFilters(){
    var doneCount = 0;
    songs.forEach(function(s){
      if (sungMap[s.t + '|' + s.a]) doneCount++;
    });
    var todoCount = songs.length - doneCount;

    var states = [
      { id: 'todo', label: '待点', cnt: todoCount },
      { id: 'done', label: '✓ 已点', cnt: doneCount },
      { id: 'all',  label: '全部歌单', cnt: songs.length }
    ];
    stateBar.innerHTML = states.map(function(st){
      return '<button type="button" class="state-tab' + (curState === st.id ? ' on' : '') + '" data-st="' + st.id + '">' +
        st.label + ' <i>' + st.cnt + '</i></button>';
    }).join('');

    var counts = {};
    var order = [];
    songs.forEach(function(s){
      if (!s.a) return;
      if (!counts[s.a]) order.push(s.a);
      counts[s.a] = (counts[s.a] || 0) + 1;
    });
    artistBar.innerHTML = '<button type="button" class="chip' + (curArtist === 'all' ? ' on' : '') + '" data-art="all">全部歌手 <i>' + songs.length + '</i></button>' +
      order.map(function(art){
        return '<button type="button" class="chip' + (curArtist === art ? ' on' : '') + '" data-art="' + esc(art) + '">' +
          esc(art) + ' <i>' + counts[art] + '</i></button>';
      }).join('');
  }

  function getFiltered(){
    var q = (qEl.value || '').trim().toLowerCase();
    return songs.map(function(s, idx){ return { s: s, idx: idx }; }).filter(function(item){
      var s = item.s;
      var isDone = !!sungMap[s.t + '|' + s.a];
      if (curState === 'todo' && isDone) return false;
      if (curState === 'done' && !isDone) return false;
      if (curArtist !== 'all' && s.a !== curArtist) return false;
      if (q && (s.t + ' ' + s.a).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function render(){
    renderPicks();
    renderFilters();
    var filtered = getFiltered();
    var pickedSet = {};
    pickedIndices.forEach(function(i){ pickedSet[i] = true; });

    countEl.textContent = filtered.length + ' 首';

    if (!filtered.length){
      var emptyMsg = curState === 'done' ? '<b>还没有已点的歌曲</b>在「待点」里点右侧按钮或顶部「随机来1-5首」试试吧' : '<b>没有匹配的歌曲</b>换个歌手或切换全部歌单看看';
      listEl.innerHTML = '<li class="empty">' + emptyMsg + '</li>';
      return;
    }

    listEl.innerHTML = filtered.map(function(item, i){
      var s = item.s, idx = item.idx;
      var sKey = s.t + '|' + s.a;
      var isSung = !!sungMap[sKey];
      var isPicked = !!pickedSet[idx];
      return '<li class="row' + (isSung ? ' sung' : '') + (isPicked ? ' picked' : '') + '" data-row-idx="' + idx + '">' +
        '<span class="num">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="meta" data-copy="' + esc(s.t) + '" title="点击复制歌名">' +
          '<span class="title">' + esc(s.t) + '</span>' +
          '<span class="artist">' + esc(s.a || '') + '</span>' +
        '</span>' +
        '<span class="row-acts">' +
          '<button class="state-btn' + (isSung ? ' on' : '') + '" type="button" data-sung="' + esc(sKey) + '">' + (isSung ? '✓ 已点' : '待点') + '</button>' +
          '<button class="del" type="button" data-del="' + idx + '" aria-label="删除">' +
            '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>' +
          '</button>' +
        '</span>' +
      '</li>';
    }).join('');
  }

  stateBar.addEventListener('click', function(e){
    var b = e.target.closest('[data-st]');
    if (!b) return;
    curState = b.getAttribute('data-st');
    render();
  });
  artistBar.addEventListener('click', function(e){
    var b = e.target.closest('[data-art]');
    if (!b) return;
    curArtist = b.getAttribute('data-art');
    render();
  });

  listEl.addEventListener('click', function(e){
    var sungBtn = e.target.closest('[data-sung]');
    if (sungBtn){
      var k = sungBtn.getAttribute('data-sung');
      sungMap[k] = !sungMap[k];
      if (!sungMap[k]) delete sungMap[k];
      saveSung();
      render();
      return;
    }

    var delBtn = e.target.closest('[data-del]');
    if (delBtn && unlocked){
      var dIdx = Number(delBtn.getAttribute('data-del'));
      var removed = songs.splice(dIdx, 1)[0];
      persist();
      render();
      if (removed) toast('已删除《' + removed.t + '》');
      return;
    }

    var copyEl = e.target.closest('[data-copy]');
    if (copyEl){
      var text = copyEl.getAttribute('data-copy');
      if (navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(function(){
          toast('✓ 已复制歌名：《' + text + '》');
        }).catch(function(){});
      }
    }
  });

  document.getElementById('resetSungBtn').addEventListener('click', function(){
    sungMap = {};
    pickedIndices = [];
    saveSung();
    curState = 'todo';
    render();
    toast('✓ 已将全部歌曲重置为「待点」');
  });

  document.getElementById('restoreDefaultBtn').addEventListener('click', function(){
    songs = DEFAULT.map(normSong);
    sungMap = {};
    pickedIndices = [];
    persist();
    saveSung();
    curState = 'todo';
    curArtist = 'all';
    render();
    toast('✓ 已恢复默认 83 首歌单');
  });

  lockBtn.addEventListener('click', function(){
    unlocked = !unlocked;
    panel.classList.toggle('unlocked', unlocked);
    lockBtn.textContent = unlocked ? '✓ 完成' : '➕ 加歌';
    if (unlocked) setTimeout(function(){ tEl.focus(); }, 80);
    render();
  });

  function addSong(){
    var t = tEl.value.trim();
    var a = aEl.value.trim() || (curArtist !== 'all' ? curArtist : '陈奕迅');
    if (!t){ tEl.focus(); return; }
    songs.unshift({ t: t, a: a });
    tEl.value = '';
    tEl.focus();
    persist();
    render();
    toast('✓ 已添加《' + t + '》- ' + a);
  }

  document.getElementById('addBtn').addEventListener('click', addSong);
  tEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') aEl.focus(); });
  aEl.addEventListener('keydown', function(e){ if (e.key === 'Enter') addSong(); });
  qEl.addEventListener('input', render);

  render();
})();
</script>
</body>
</html>

    if (reduce){ if (caret) caret.style.display = 'none'; return; }
    typed.textContent = '';
    if (caret) caret.classList.add('on');
    var i = 0;
    (function step(){
      if (i < NAME.length){
        typed.textContent += NAME.charAt(i++);
        setTimeout(step, 85);
      } else {
        setTimeout(function(){
          if (!caret) return;
          caret.classList.remove('on');
          caret.style.transition = 'opacity .9s ease';
        }, 1500);
      }
    })();
  }

  if (intro){
    var skip = reduce || innerWidth < 640 || sessionStorage.getItem('wmv-intro') === '1';
    if (skip){
      intro.remove();
      typeName();
    } else {
      sessionStorage.setItem('wmv-intro', '1');
      setTimeout(function(){
        intro.classList.add('done');
        setTimeout(function(){ intro.remove(); typeName(); }, 300);
      }, 1200);
    }
  } else {
    typeName();
  }

  /* 在线时间 */
  var clock = document.getElementById('clock');
  function tickClock(){
    if (!clock) return;
    var d = new Date();
    clock.textContent = '在线 · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tickClock();
  setInterval(tickClock, 20000);

  /* 卡片光斑跟随 */
  document.querySelectorAll('a.card').forEach(function(card){
    card.addEventListener('pointermove', function(e){
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });

  /* 鼠标环境光 */
  var glow = document.getElementById('glow');
  if (glow && matchMedia('(pointer:fine)').matches){
    document.body.classList.add('has-pointer');
    var gx = innerWidth/2, gy = innerHeight/2, cx = gx, cy = gy;
    addEventListener('pointermove', function(e){ gx = e.clientX; gy = e.clientY; }, {passive:true});
    (function loop(){
      cx += (gx - cx) * 0.08; cy += (gy - cy) * 0.08;
      glow.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)';
      requestAnimationFrame(loop);
    })();
  }

  /* 星野 */
  var cv = document.getElementById('stars');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  var W, H, stars = [], shooters = [];

  function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(420, (W * H) / 4200));
    stars = [];
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.25 + 0.25,
        a: Math.random() * 0.55 + 0.12,
        tw: Math.random() * 0.02 + 0.004,
        ph: Math.random() * Math.PI * 2,
        vy: Math.random() * 0.012 + 0.004
      });
    }
  }
  resize();
  addEventListener('resize', resize);

  function spawnShooter(){
    if (reduce) return;
    var fromLeft = Math.random() > 0.5;
    shooters.push({
      x: fromLeft ? -60 : W + 60,
      y: Math.random() * H * 0.45,
      vx: (fromLeft ? 1 : -1) * (5.5 + Math.random() * 3),
      vy: 1.6 + Math.random() * 1.1,
      life: 1
    });
    setTimeout(spawnShooter, 7000 + Math.random() * 12000);
  }
  setTimeout(spawnShooter, 3500);

  var t = 0;
  function frame(){
    t += 1;
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.y += s.vy;
      if (s.y > H + 2){ s.y = -2; s.x = Math.random() * W; }
      var alpha = s.a * (0.62 + 0.38 * Math.sin(t * s.tw + s.ph));
      ctx.beginPath();
      ctx.fillStyle = 'rgba(226,238,255,' + alpha.toFixed(3) + ')';
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }

    for (var j = shooters.length - 1; j >= 0; j--){
      var m = shooters[j];
      m.x += m.vx; m.y += m.vy; m.life -= 0.012;
      var g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
      g.addColorStop(0, 'rgba(255,255,255,' + Math.max(0, m.life * 0.85) + ')');
      g.addColorStop(1, 'rgba(94,224,168,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12); ctx.stroke();
      if (m.life <= 0 || m.x < -200 || m.x > W + 200 || m.y > H + 100) shooters.splice(j, 1);
    }
    requestAnimationFrame(frame);
  }
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
<script>
(function(){
  var bot = document.getElementById('bot');
  if (!bot) return;
  var bubble = document.getElementById('bubble');
  var pupils = [].slice.call(bot.querySelectorAll('.pupil'));
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var sayTimer, actTimer;

  function say(text, ms){
    if (!bubble) return;
    bubble.textContent = text;
    bubble.classList.add('on');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(function(){ bubble.classList.remove('on'); }, ms || 1700);
  }

  var lines = {
    scan:    ['扫描中… 帅得超出范围', '识别结果：猛哥本人', '舱内环境正常'],
    wink:    ['看见你了', '视觉模组正常', '眨眼 0.12s'],
    core:    ['能量 100%', '核心稳定，随时待命', '已接上空间站主电源'],
    wave:    ['你好，猛哥', '挥手 · 收到', '欢迎回来'],
    antenna: ['信号 +1', '正在联系地面', '链路质量 98%']
  };

  function act(name){
    var list = lines[name];
    if (!list) return;
    var text = list[Math.floor(Math.random() * list.length)];
    if (!reduce){
      var cls = {scan:'scanning', wink:'blink', core:'charged', wave:'waving', antenna:'pulse'}[name];
      bot.classList.remove('scanning','blink','charged','waving','pulse');
      void bot.offsetWidth;
      bot.classList.add(cls);
      clearTimeout(actTimer);
      actTimer = setTimeout(function(){
        bot.classList.remove(cls);
      }, name === 'wink' ? 170 : 1100);
    }
    say(text);
  }

  bot.addEventListener('click', function(e){
    var p = e.target.closest ? e.target.closest('[data-act]') : null;
    act(p && p.dataset.act ? p.dataset.act : 'scan');
  });

  bot.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); act('scan'); }
  });

  /* 眼睛跟着鼠标 */
  if (!reduce){
    var raf = 0, lastX = 0, lastY = 0;
    function track(){
      raf = 0;
      var r = bot.getBoundingClientRect();
      if (!r.width) return;
      var cx = r.left + r.width / 2;
      var cy = r.top + r.height * 0.34;
      var dx = lastX - cx, dy = lastY - cy;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      var m = Math.min(3.4, d / 26);
      var x = (dx / d) * m, y = (dy / d) * m;
      var t = 'translate(' + x.toFixed(2) + ' ' + y.toFixed(2) + ')';
      for (var i = 0; i < pupils.length; i++) pupils[i].setAttribute('transform', t);
    }
    window.addEventListener('pointermove', function(e){
      lastX = e.clientX; lastY = e.clientY;
      if (!raf) raf = requestAnimationFrame(track);
    }, { passive: true });

    var blinkTimer;
    (function idleBlink(){
      blinkTimer = setTimeout(function(){
        bot.classList.add('blink');
        setTimeout(function(){ bot.classList.remove('blink'); }, 150);
        idleBlink();
      }, 3200 + Math.random() * 4200);
    })();
    window.addEventListener('pagehide', function(){ clearTimeout(blinkTimer); }, { once: true });
  }

  setTimeout(function(){ say('已对接空间站', 2200); }, 2400);
})();
</script>
</body>
</html>

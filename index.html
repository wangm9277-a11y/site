<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060a">
<title>wmv587</title>

<meta property="og:description" content="一个私人的小站，放点工具和入口。">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235ee0a8'/%3E%3Cstop offset='1' stop-color='%237aa2ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%2305060a'/%3E%3Ccircle cx='32' cy='32' r='13' fill='none' stroke='url(%23g)' stroke-width='4'/%3E%3C/svg%3E">
<style>
  :root{
    --ink:#eef1f7; --muted:#96a0b3; --line:rgba(255,255,255,.09);
    --accent:#5ee0a8; --accent2:#7aa2ff;
    --glass:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018));
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{background:#05060a;scroll-behavior:smooth}
  body{
    position:relative; min-height:100svh; color:var(--ink);
    font:16px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased; overflow-x:hidden;
    background:#05060a url("assets/bg.webp") center/cover no-repeat fixed;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(120% 90% at 50% -20%,rgba(5,6,10,0) 30%,rgba(5,6,10,.55) 72%,#05060a 100%),
      linear-gradient(180deg,rgba(5,6,10,.25),rgba(5,6,10,.55) 55%,rgba(5,6,10,.9));
  }
  #stars{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; opacity:.9}
  .aurora{position:fixed; inset:-20% -10%; z-index:0; pointer-events:none; filter:blur(70px); opacity:.55}
  .aurora i{position:absolute; display:block; border-radius:50%; mix-blend-mode:screen; animation:drift 22s ease-in-out infinite alternate}
  .aurora i:nth-child(1){width:52vw;height:52vw;left:-8%;top:-10%;background:radial-gradient(circle at 35% 35%,rgba(94,224,168,.42),transparent 62%)}
  .aurora i:nth-child(2){width:46vw;height:46vw;right:-6%;top:2%;background:radial-gradient(circle at 60% 40%,rgba(122,162,255,.38),transparent 64%);animation-delay:-7s}
  .aurora i:nth-child(3){width:44vw;height:44vw;left:24%;bottom:-22%;background:radial-gradient(circle at 50% 50%,rgba(176,110,255,.26),transparent 66%);animation-delay:-13s}
  @keyframes drift{
    0%{transform:translate3d(0,0,0) scale(1)}
    50%{transform:translate3d(3%,4%,0) scale(1.08)}
    100%{transform:translate3d(-3%,-2%,0) scale(1.02)}
  }
  .cursor-glow{
    position:fixed; left:0; top:0; width:520px; height:520px; margin:-260px 0 0 -260px;
    z-index:1; pointer-events:none; opacity:0; transition:opacity .5s ease;
    background:radial-gradient(circle,rgba(94,224,168,.11),rgba(122,162,255,.06) 40%,transparent 68%);
    mix-blend-mode:screen;
  }
  body.has-pointer .cursor-glow{opacity:1}

  .wrap{position:relative; z-index:2; width:100%; max-width:1060px; margin:0 auto; padding:34px 22px 40px}
  header{display:flex; align-items:center; justify-content:space-between; gap:16px}
  .badge{
    display:inline-flex; align-items:center; gap:9px; padding:7px 14px; border-radius:999px;
    background:rgba(94,224,168,.08); border:1px solid rgba(94,224,168,.22);
    color:var(--accent); font-size:12.5px; letter-spacing:.06em;
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.82)}}
  .status{color:var(--muted); font-size:12.5px; letter-spacing:.04em; display:inline-flex; align-items:center; gap:7px}
  .status::before{content:""; width:5px;height:5px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}

  main{padding:clamp(56px,12vh,120px) 0 0}
  .keep{white-space:nowrap}
  h1{
    font-size:clamp(38px,7.4vw,72px); line-height:1.06; letter-spacing:-.035em;
    margin:0 0 18px; font-weight:700;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) both;
  }
  .grad{
    background:linear-gradient(104deg,#ffffff 8%,#cfe4ff 38%,#5ee0a8 78%,#9ff5cd 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 60px rgba(94,224,168,.18);
  }
  .sub{
    margin:0; color:var(--muted); font-size:clamp(15px,1.6vw,17px); max-width:34em;
    animation:rise .9s cubic-bezier(.2,.7,.2,1) .08s both;
  }
  .rule{height:1px; width:100%; margin:clamp(38px,6vh,64px) 0 26px;
    background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 45%,transparent);
    animation:rise 1s cubic-bezier(.2,.7,.2,1) .14s both}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .grid{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(296px,1fr)); perspective:900px}
  a.card{
    --ac:94,224,168; position:relative; display:flex; flex-direction:column; gap:9px; overflow:hidden;
    text-decoration:none; color:inherit; padding:20px 20px 18px; border-radius:20px;
    background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(16px) saturate(1.25); -webkit-backdrop-filter:blur(16px) saturate(1.25);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 18px 40px -30px rgba(0,0,0,.9);
    transition:transform .35s cubic-bezier(.2,.7,.2,1), border-color .35s ease, box-shadow .35s ease, background .35s ease;
    animation:rise .8s cubic-bezier(.2,.7,.2,1) both;
    transform-style:preserve-3d;
  }
  a.card::after{
    content:""; position:absolute; inset:-1px; border-radius:21px; pointer-events:none; opacity:0;
    background:radial-gradient(340px 200px at var(--mx,50%) var(--my,0%),rgba(var(--ac),.16),transparent 62%);
    transition:opacity .35s ease;
  }
  a.card:hover{transform:translateY(-4px); border-color:rgba(var(--ac),.36); background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.025))}
  a.card:hover::after{opacity:1}
  .top{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.07); color:#c9d2e2;
    transition:color .3s ease, background .3s ease, border-color .3s ease}
  a.card:hover .ico{color:rgb(var(--ac)); background:rgba(var(--ac),.10); border-color:rgba(var(--ac),.30)}
  .arrow{color:#5b6474; font-size:17px; transition:transform .3s ease,color .3s ease}
  a.card:hover .arrow{color:rgb(var(--ac)); transform:translateX(3px)}
  .t{font-weight:600; font-size:16.5px; letter-spacing:-.01em}
  .d{color:var(--muted); font-size:13.5px; line-height:1.55; margin-top:-4px}


  /* 打字光标 */
  .caret{display:inline-block; width:.11em; height:.82em; margin-left:.06em; vertical-align:-.04em;
    border-radius:2px; background:linear-gradient(180deg,#9ff5cd,#5ee0a8); box-shadow:0 0 14px rgba(94,224,168,.65);
    opacity:0; transition:opacity .35s ease}
  .caret.on{opacity:1; animation:caretBlink 1.05s steps(1,end) infinite}
  @keyframes caretBlink{0%,55%{opacity:1}56%,100%{opacity:.12}}

  /* 开场 */
  #intro{position:fixed; inset:0; z-index:60; display:grid; place-items:center; overflow:hidden;
    background:radial-gradient(70% 60% at 50% 48%,#0a1120 0%,#05060a 62%);
    transition:opacity .75s ease, visibility .75s ease}
  #intro.done{opacity:0; visibility:hidden}
  #intro .core{width:52px; height:52px; border-radius:50%;
    background:radial-gradient(circle at 38% 32%,#d8ffef,#5ee0a8 46%,rgba(94,224,168,.05) 74%);
    box-shadow:0 0 60px 18px rgba(94,224,168,.28); animation:coreIn 1.15s cubic-bezier(.2,.7,.2,1) both}
  #intro .ring{position:absolute; width:110px; height:110px; border-radius:50%;
    border:1px solid rgba(94,224,168,.5); animation:ringOut 1.5s cubic-bezier(.2,.7,.2,1) both}
  #intro .ring.b{animation-delay:.18s; border-color:rgba(122,162,255,.45)}
  #intro .word{position:absolute; bottom:27vh; color:#93a0b5; font-size:11px; letter-spacing:.52em;
    text-transform:uppercase; opacity:0; animation:introWord .8s ease .3s both}
  @keyframes coreIn{0%{transform:scale(.35); opacity:0}45%{opacity:1}100%{transform:scale(1); opacity:1}}
  @keyframes ringOut{0%{transform:scale(.25); opacity:0}35%{opacity:.9}100%{transform:scale(3.1); opacity:0}}
  @keyframes introWord{to{opacity:1}}

  /* 页面切换 */
  @view-transition{navigation:auto}
  ::view-transition-old(root){animation:vtOut .22s ease both}
  ::view-transition-new(root){animation:vtIn .3s ease both}
  @keyframes vtOut{to{opacity:0}}
  @keyframes vtIn{from{opacity:0}}

  a.card:focus-visible{outline:2px solid rgba(var(--ac),.75); outline-offset:4px}
  a:focus-visible{outline:2px solid rgba(94,224,168,.7); outline-offset:3px}

  footer{position:relative}
  footer{
    margin-top:clamp(48px,8vh,80px); padding-top:22px; border-top:1px solid rgba(255,255,255,.06);
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    color:#6b7484; font-size:12.5px;
  }
  footer a{color:#8b95a6; text-decoration:none; border-bottom:1px dotted rgba(255,255,255,.18); padding-bottom:1px}
  footer a:hover{color:var(--accent)}
  .sig{letter-spacing:.18em; font-size:11px; color:#596273; text-transform:uppercase}

  @media(max-width:560px){
    body{background-attachment:scroll}
    .wrap{padding:26px 18px 34px}
    .aurora{filter:blur(56px)}
    .cursor-glow{display:none}
  }
  @media(prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important; transition:none!important}
  }
</style>
</head>
<body>
<div id="intro" aria-hidden="true"><span class="ring"></span><span class="ring b"></span><span class="core"></span><span class="word">wmv587</span></div>
<canvas id="stars"></canvas>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="cursor-glow" id="glow" aria-hidden="true"></div>

<div class="wrap">
  <header>
    <span class="badge"><span class="dot"></span>WMV587.ASIA</span>
    <span class="status"><span id="clock">在线</span></span>
  </header>

  <main>
    <h1>你好，我是 <span class="keep"><span class="grad" id="typed">wmv587</span><span class="caret" id="caret"></span>。</span></h1>
    <p class="sub">一个私人的小站，放点工具和入口。</p>
    <div class="rule"></div>

    <nav class="grid" aria-label="站点导航">
      <a class="card" style="--ac:233,238,247" href="https://github.com/">
        <div class="top">
          <span class="ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 7 4 12l5 5"/><path d="M15 7l5 5-5 5"/></svg></span>
          <span class="arrow">→</span>
        </div>
        <span class="t">GitHub</span>
        <span class="d">代码与项目</span>
      </a>

      <a class="card" style="--ac:122,162,255" href="https://www.deepseek.com/">
        <div class="top">
          <span class="ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.2 13.9 10 20.8 12l-6.9 2L12 20.8 10.1 14 3.2 12 10.1 10z"/></svg></span>
          <span class="arrow">→</span>
        </div>
        <span class="t">DeepSeek</span>
        <span class="d">模型与文档</span>
      </a>

      <a class="card" style="--ac:245,190,120" href="/notes/">
        <div class="top">
          <span class="ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h8.5L18 7v13.5H6z"/><path d="M9.5 11h5M9.5 14.5h5"/></svg></span>
          <span class="arrow">→</span>
        </div>
        <span class="t">笔记</span>
        <span class="d">零散的记录</span>
      </a>

      <a class="card" style="--ac:94,224,168" href="/tools/">
        <div class="top">
          <span class="ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.1"/><path d="M12 3.4v2.5M12 18.1v2.5M3.4 12h2.5M18.1 12h2.5M6 6l1.8 1.8M16.2 16.2 18 18M18 6l-1.8 1.8M7.8 16.2 6 18"/></svg></span>
          <span class="arrow">→</span>
        </div>
        <span class="t">小工具</span>

      </a>

      <a class="card" style="--ac:170,140,255" href="/tools/qianqian.html">
        <div class="top">
          <span class="ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.6 18.6 15.2H5.4z"/><path d="M12 20.4 5.4 8.8h13.2z"/></svg></span>
          <span class="arrow">→</span>
        </div>
        <span class="t">乾乾学易</span>
        <span class="d">六十四卦经传精研与上下卦推演</span>

    </nav>
  </main>

  <footer>
    <span>由 <a href="https://pages.github.com/">GitHub Pages</a> 托管 · 2026</span>
    <span class="sig">wmv587</span>
  </footer>
</div>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* 开场 + 标题打字 */
  var intro = document.getElementById('intro');
  var typed = document.getElementById('typed');
  var caret = document.getElementById('caret');
  var NAME = 'wmv587';

  function typeName(){
    if (!typed) return;
    if (reduce){ if (caret) caret.style.display = 'none'; return; }
    typed.textContent = '';
    if (caret) caret.classList.add('on');
    var i = 0;
    (function step(){
      if (i < NAME.length){
        typed.textContent += NAME.charAt(i++);
        setTimeout(step, 85);
      } else {
        setTimeout(function(){
          if (!caret) return;
          caret.classList.remove('on');
          caret.style.transition = 'opacity .9s ease';
        }, 1500);
      }
    })();
  }

  if (intro){
    var skip = reduce || innerWidth < 640 || sessionStorage.getItem('wmv-intro') === '1';
    if (skip){
      intro.remove();
      typeName();
    } else {
      sessionStorage.setItem('wmv-intro', '1');
      setTimeout(function(){
        intro.classList.add('done');
        setTimeout(function(){ intro.remove(); typeName(); }, 300);
      }, 1200);
    }
  } else {
    typeName();
  }

  /* 在线时间 */
  var clock = document.getElementById('clock');
  function tickClock(){
    if (!clock) return;
    var d = new Date();
    clock.textContent = '在线 · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  tickClock();
  setInterval(tickClock, 20000);

  /* 卡片光斑跟随 */
  document.querySelectorAll('a.card').forEach(function(card){
    card.addEventListener('pointermove', function(e){
      var r = card.getBoundingClientRect();
      card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      card.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });

  /* 鼠标环境光 */
  var glow = document.getElementById('glow');
  if (glow && matchMedia('(pointer:fine)').matches){
    document.body.classList.add('has-pointer');
    var gx = innerWidth/2, gy = innerHeight/2, cx = gx, cy = gy;
    addEventListener('pointermove', function(e){ gx = e.clientX; gy = e.clientY; }, {passive:true});
    (function loop(){
      cx += (gx - cx) * 0.08; cy += (gy - cy) * 0.08;
      glow.style.transform = 'translate3d(' + cx + 'px,' + cy + 'px,0)';
      requestAnimationFrame(loop);
    })();
  }

  /* 星野 */
  var cv = document.getElementById('stars');
  if (!cv) return;
  var ctx = cv.getContext('2d');
  var dpr = Math.min(devicePixelRatio || 1, 2);
  var W, H, stars = [], shooters = [];

  function resize(){
    W = innerWidth; H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var n = Math.round(Math.min(420, (W * H) / 4200));
    stars = [];
    for (var i = 0; i < n; i++){
      stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.25 + 0.25,
        a: Math.random() * 0.55 + 0.12,
        tw: Math.random() * 0.02 + 0.004,
        ph: Math.random() * Math.PI * 2,
        vy: Math.random() * 0.012 + 0.004
      });
    }
  }
  resize();
  addEventListener('resize', resize);

  function spawnShooter(){
    if (reduce) return;
    var fromLeft = Math.random() > 0.5;
    shooters.push({
      x: fromLeft ? -60 : W + 60,
      y: Math.random() * H * 0.45,
      vx: (fromLeft ? 1 : -1) * (5.5 + Math.random() * 3),
      vy: 1.6 + Math.random() * 1.1,
      life: 1
    });
    setTimeout(spawnShooter, 7000 + Math.random() * 12000);
  }
  setTimeout(spawnShooter, 3500);

  var t = 0;
  function frame(){
    t += 1;
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      s.y += s.vy;
      if (s.y > H + 2){ s.y = -2; s.x = Math.random() * W; }
      var alpha = s.a * (0.62 + 0.38 * Math.sin(t * s.tw + s.ph));
      ctx.beginPath();
      ctx.fillStyle = 'rgba(226,238,255,' + alpha.toFixed(3) + ')';
      ctx.arc(s.x, s.y, s.r, 0, 6.2832);
      ctx.fill();
    }

    for (var j = shooters.length - 1; j >= 0; j--){
      var m = shooters[j];
      m.x += m.vx; m.y += m.vy; m.life -= 0.012;
      var g = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 12, m.y - m.vy * 12);
      g.addColorStop(0, 'rgba(255,255,255,' + Math.max(0, m.life * 0.85) + ')');
      g.addColorStop(1, 'rgba(94,224,168,0)');
      ctx.strokeStyle = g; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 12, m.y - m.vy * 12); ctx.stroke();
      if (m.life <= 0 || m.x < -200 || m.x > W + 200 || m.y > H + 100) shooters.splice(j, 1);
    }
    requestAnimationFrame(frame);
  }
  if (!reduce) requestAnimationFrame(frame);
})();
</script>
</body>
</html>

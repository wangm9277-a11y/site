<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>wmv587</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141418; --line:#232329;
    --text:#ececf1; --muted:#8b8b96; --accent:#5ee0a8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .glow{
    position:fixed; inset:-30% -10% auto -10%; height:60vh; pointer-events:none;
    background:radial-gradient(60% 60% at 50% 0%, rgba(94,224,168,.13), transparent 70%);
    filter:blur(10px);
  }
  main{position:relative; width:100%; max-width:560px}
  .badge{
    display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px;
    background:rgba(94,224,168,.09); border:1px solid rgba(94,224,168,.25);
    color:var(--accent); font-size:13px; letter-spacing:.3px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
  h1{font-size:clamp(34px,9vw,52px); line-height:1.1; margin:20px 0 10px; letter-spacing:-.02em}
  .sub{color:var(--muted); font-size:15px; margin:0 0 28px}
  .grid{display:grid; gap:12px}
  @media(min-width:520px){ .grid{grid-template-columns:1fr 1fr} }
  a.card{
    display:block; text-decoration:none; color:inherit;
    background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:16px 18px; transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  a.card:hover, a.card:active{transform:translateY(-2px); border-color:#3a3a44; background:#17171c}
  .card .row{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .card .t{font-weight:600; font-size:16px}
  .card .d{color:var(--muted); font-size:13.5px; margin-top:4px}
  .arrow{color:#55555f; font-size:18px}
  .card:hover .arrow{color:var(--accent)}
  footer{margin-top:32px; color:#5d5d68; font-size:12.5px; text-align:center}
  footer a{color:#7d7d89; text-decoration:none; border-bottom:1px dotted #3a3a44}
</style>
</head>
<body>
<div class="glow"></div>
<main>
  <span class="badge"><span class="dot"></span>wmv587.asia</span>
  <h1>你好，我是 wmv587。</h1>
  <p class="sub">一个私人的小站，放点工具和入口。</p>

  <div class="grid">
    <a class="card" href="https://github.com/">
      <div class="row"><span class="t">GitHub</span><span class="arrow">→</span></div>
      <div class="d">代码与项目</div>
    </a>
    <a class="card" href="https://www.deepseek.com/">
      <div class="row"><span class="t">DeepSeek</span><span class="arrow">→</span></div>
      <div class="d">模型与文档</div>
    </a>
    <a class="card" href="/notes/">
      <div class="row"><span class="t">笔记</span><span class="arrow">→</span></div>
      <div class="d">零散的记录</div>
    </a>
    <a class="card" href="/tools/">
      <div class="row"><span class="t">小工具</span><span class="arrow">→</span></div>
      <div class="d">随手写的小东西</div>
    </a>
  </div>

  <footer>
    由 <a href="https://pages.github.com/">GitHub Pages</a> 托管 · 2026
  </footer>
</main>
</body>
</html>

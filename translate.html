<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080a">
<title>五语互译 · WM的空间站</title>
<meta name="description" content="中文、英文、日语、维吾尔语、蒙古语极速双向互译，支持在线秒翻与本地离线引擎自动切换。">
<style>
  :root{
    --bg:#07080a; --ink:#ececf1; --dim:#8b8b96; --line:rgba(255,255,255,.09);
    --mint:#5ee0a8; --blue:#7fe3ff; --amber:#f5be78; --glass:rgba(18,21,28,.66);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    min-height:100svh; color:var(--ink);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    background:var(--bg) url(assets/bg.webp) center/cover no-repeat fixed;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:linear-gradient(180deg,rgba(7,8,10,.76),rgba(7,8,10,.92) 40%,#07080a 100%);
  }
  .wrap{position:relative; z-index:1; width:min(880px,92vw); margin:0 auto; padding:26px 0 70px}

  .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:28px}
  .back{display:inline-flex; align-items:center; gap:7px; text-decoration:none; color:var(--dim); font-size:13px; transition:color .25s}
  .back:hover{color:var(--mint)}
  .back svg{width:14px;height:14px}
  .badge{
    display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px;
    background:rgba(127,227,255,.09); border:1px solid rgba(127,227,255,.26);
    font:600 11px/1 ui-monospace,monospace; letter-spacing:.14em; color:#c8f3ff;
  }
  .badge i{width:5px;height:5px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px var(--blue)}

  .kick{font:600 11px/1 ui-monospace,monospace; letter-spacing:.2em; text-transform:uppercase; color:var(--mint); margin-bottom:10px}
  h1{margin:0 0 8px; font-size:clamp(30px,6vw,44px); line-height:1.1; letter-spacing:-.03em; font-weight:800}
  h1 em{font-style:normal; background:linear-gradient(92deg,#fff 8%,#cfe4ff 42%,var(--mint) 84%);
    -webkit-background-clip:text; background-clip:text; color:transparent}
  .lead{color:var(--dim); font-size:14px; margin:0 0 16px}

  .status-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
  .mode{display:inline-flex; align-items:center; gap:7px;
    font:600 11px/1 ui-monospace,monospace; letter-spacing:.06em; color:#8fd8c0;
    padding:6px 11px; border-radius:999px; background:rgba(94,224,168,.08); border:1px solid rgba(94,224,168,.22)}
  .mode i{width:6px; height:6px; border-radius:50%; background:var(--mint); box-shadow:0 0 8px var(--mint)}
  .auto-toggle{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; color:#9aa5b6; cursor:pointer; user-select:none}
  .auto-toggle input{accent-color:var(--mint); cursor:pointer}

  .langs{display:grid; gap:9px; margin-bottom:14px}
  .langrow{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
  .langrow .side{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
  .lbl{flex:0 0 32px; font:600 10.5px/1 ui-monospace,monospace; letter-spacing:.12em; color:#6c7888}
  .pill{
    appearance:none; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.035);
    color:#9aa5b6; font:600 12.5px/1 inherit; padding:8px 12px; border-radius:9px; cursor:pointer;
    transition:all .2s ease;
  }
  .pill:hover{color:#e8eef7; border-color:rgba(255,255,255,.22)}
  .pill.on{color:#07120d; background:linear-gradient(180deg,#8ff0c6,#5ee0a8); border-color:#5ee0a8; box-shadow:0 6px 18px -10px #5ee0a8}
  .swap{
    appearance:none; border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.05);
    color:#8b95a6; width:32px; height:32px; border-radius:9px; cursor:pointer; line-height:0;
    display:grid; place-items:center; transition:all .2s ease;
  }
  .swap:hover{color:var(--mint); border-color:rgba(94,224,168,.4)}
  .swap svg{width:15px;height:15px}

  .quick-bar{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:12px}
  .quick-bar span{font:600 10.5px/1 ui-monospace,monospace; color:#657080; margin-right:2px}
  .q-chip{appearance:none; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03);
    color:#8b95a6; font-size:11.5px; padding:4px 9px; border-radius:7px; cursor:pointer; transition:.2s}
  .q-chip:hover{color:#e2f8ef; border-color:rgba(94,224,168,.35); background:rgba(94,224,168,.07)}

  .panels{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  .pane{
    border:1px solid var(--line); border-radius:18px; background:var(--glass);
    backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 1px 0 rgba(255,255,255,.05) inset; overflow:hidden; display:flex; flex-direction:column;
  }
  .pane textarea{
    display:block; width:100%; min-height:170px; flex:1; resize:vertical; padding:16px 18px;
    background:none; border:0; outline:0; color:var(--ink); font:inherit; font-size:15.5px; line-height:1.65;
  }
  .pane textarea::placeholder{color:#5b6472}
  .pane .out{
    min-height:170px; flex:1; padding:16px 18px; white-space:pre-wrap; word-break:break-word;
    font-size:15.5px; line-height:1.65; color:#eaf8f1;
  }
  .pane .out.empty{color:#5b6472}
  .bar{
    display:flex; align-items:center; gap:8px; padding:10px 14px;
    border-top:1px solid rgba(255,255,255,.06); flex-wrap:wrap;
  }
  .bar .meta{flex:1; min-width:70px; font:600 10.5px/1 ui-monospace,monospace; letter-spacing:.08em; color:#67707f}
  .tbtn{
    appearance:none; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.04);
    color:#b9c2d0; font:600 12px/1 inherit; padding:7px 11px; border-radius:8px; cursor:pointer;
    transition:all .2s ease; display:inline-flex; align-items:center; gap:5px;
  }
  .tbtn:hover{color:#eafff6; border-color:rgba(94,224,168,.4); background:rgba(94,224,168,.08)}
  .tbtn:disabled{opacity:.4; cursor:not-allowed}
  .tbtn svg{width:13px;height:13px}
  .go{
    width:100%; margin-top:14px; padding:14px; border:0; border-radius:14px; cursor:pointer;
    background:linear-gradient(180deg,#8ff0c6,#4fd6a0); color:#04120c;
    font:800 15px/1 inherit; letter-spacing:.02em;
    box-shadow:0 18px 40px -22px rgba(94,224,168,.9);
    transition:transform .15s ease, filter .2s ease;
  }
  .go:hover{filter:brightness(1.05)}
  .go:active{transform:translateY(1px)}
  .go[disabled]{filter:grayscale(.5); opacity:.65; cursor:not-allowed}
  .go .hint{font-weight:600; font-size:11.5px; opacity:.65; margin-left:8px}

  .err{margin-top:8px; color:#ffb0b0; font-size:12.5px; min-height:18px}
  .note{margin-top:14px; color:#6b7484; font-size:12px; line-height:1.7}

  .hist{display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; align-items:center}
  .chip{
    appearance:none; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.03);
    color:#8b95a6; font-size:12px; padding:6px 10px; border-radius:8px; cursor:pointer;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:240px;
    transition:all .2s ease;
  }
  .chip:hover{color:#dfe8f2; border-color:rgba(255,255,255,.18)}
  .tagline{display:inline-flex; align-items:center; gap:6px; font:600 10.5px/1 ui-monospace,monospace; letter-spacing:.06em; color:#6f7a8a}
  .tagline i{width:4px;height:4px;border-radius:50%;background:var(--mint)}

  @media(max-width:720px){
    .panels{grid-template-columns:1fr}
    .pane textarea,.pane .out{min-height:130px}
  }
  @media(max-width:560px){
    body{background-attachment:scroll}
    .wrap{padding:20px 0 56px}
    .pill{padding:7px 9px; font-size:11.5px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <a class="back" href="/">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      返回 WM的空间站
    </a>
    <span class="badge"><i></i>FAST TRANSLATE · 5 TONGUES</span>
  </div>

  <div class="kick">Instant Five-Tongue Translator</div>
  <h1>五语<em>极速互译</em></h1>
  <p class="lead">中文 · English · 日本語 · ئۇيغۇرچە · Монгол хэл，在线秒翻与本地离线引擎二合一。</p>

  <div class="status-bar">
    <span class="mode" id="mode"><i></i><span>多通道极速引擎已就绪（约 0.5 秒出译文）</span></span>
    <label class="auto-toggle"><input type="checkbox" id="autoTr" checked> 输入停顿自动翻译</label>
  </div>

  <div class="langs">
    <div class="langrow">
      <span class="lbl">原文</span>
      <div class="side" id="srcPills" role="group" aria-label="原文语言"></div>
      <button class="swap" id="swap" type="button" title="交换语言" aria-label="交换语言" style="margin-left:auto">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h13l-3.5-3.5M20 15H7l3.5 3.5"/></svg>
      </button>
    </div>
    <div class="langrow">
      <span class="lbl">译文</span>
      <div class="side" id="tgtPills" role="group" aria-label="译文语言"></div>
    </div>
  </div>

  <div class="quick-bar">
    <span>快测：</span>
    <button class="q-chip" type="button" data-q="真正重要的东西，用眼睛是看不见的，要用心去感受。">小王子名言</button>
    <button class="q-chip" type="button" data-q="你好，很高兴认识你，请问去车站怎么走？">日常问路</button>
    <button class="q-chip" type="button" data-q="The stars are beautiful, because of a flower that cannot be seen.">英文译中</button>
  </div>

  <div class="panels">
    <div class="pane">
      <textarea id="input" placeholder="输入或粘贴要翻译的内容（支持自动秒翻，或按 Ctrl/⌘ + Enter）" spellcheck="false" maxlength="3000"></textarea>
      <div class="bar">
        <span class="meta" id="metaIn">0 字</span>
        <button class="tbtn" id="clear" type="button">清空</button>
        <button class="tbtn" id="paste" type="button">粘贴</button>
      </div>
    </div>

    <div class="pane">
      <div class="out empty" id="out" aria-live="polite">译文会立刻出现在这里</div>
      <div class="bar">
        <span class="tagline" id="engine"><i></i>等待输入</span>
        <span class="meta" style="text-align:right" id="metaOut"></span>
        <button class="tbtn" id="copy" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5.5 15V6.5A2 2 0 0 1 7.5 4.5H15"/></svg>
          复制
        </button>
        <button class="tbtn" id="speak" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h3l4 3.5v-11L7 10z"/><path d="M15.5 9.5a3.5 3.5 0 0 1 0 5"/><path d="M18 7a7 7 0 0 1 0 10"/></svg>
          朗读
        </button>
      </div>
    </div>
  </div>

  <button class="go" id="go" type="button">立即翻译<span class="hint">Ctrl + Enter</span></button>
  <div class="err" id="err" role="alert"></div>

  <div class="hist" id="hist"></div>

  <p class="note">
    已将「在线极速通道」与「本机离线引擎」合二为一：平时直接走毫秒级多通道并发直连（0.5–1.5 秒出结果，无冷却等待）；如果电脑启动了本地 127.0.0.1:8099 离线模型，会自动切换为纯离线翻译。
  </p>
</div>

<script>
(function(){
  /* 五语配置：包含 GTX 极速代码、MyMemory 代码、LLM 提示名与语音合成代码 */
  var LANGS = [
    { id:'zh', label:'中文',     gtx:'zh-CN', prompt:'Simplified Chinese',  mm:'zh-CN', say:'zh-CN' },
    { id:'en', label:'English',  gtx:'en',    prompt:'English',             mm:'en-US', say:'en-US' },
    { id:'ja', label:'日本語',   gtx:'ja',    prompt:'Japanese',            mm:'ja-JP', say:'ja-JP' },
    { id:'ug', label:'ئۇيغۇرچە', gtx:'ug',    prompt:'Uyghur (Arabic script)', mm:'ug-CN', say:'' },
    { id:'mn', label:'Монгол',   gtx:'mn',    prompt:'Mongolian (Cyrillic script)', mm:'mn-MN', say:'' }
  ];
  var byId = {};
  LANGS.forEach(function(l){ byId[l.id] = l; });

  var HKEY = 'wmv587.tr.hist';
  var PKEY = 'wmv587.tr.pair';

  var input = document.getElementById('input');
  var out = document.getElementById('out');
  var goBtn = document.getElementById('go');
  var errEl = document.getElementById('err');
  var metaIn = document.getElementById('metaIn');
  var metaOut = document.getElementById('metaOut');
  var engineEl = document.getElementById('engine');
  var histEl = document.getElementById('hist');
  var speakBtn = document.getElementById('speak');
  var autoTrEl = document.getElementById('autoTr');

  var pair = load(PKEY) || { s:'auto', t:'en' };
  var src = pair.s, tgt = pair.t;
  var lastOut = '';
  var reqSeq = 0;
  var debounceTimer = null;

  function load(k){
    try{ return JSON.parse(localStorage.getItem(k) || 'null'); }catch(e){ return null; }
  }
  function save(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){}
  }

  var srcBox = document.getElementById('srcPills');
  var tgtBox = document.getElementById('tgtPills');

  function buildPills(){
    srcBox.innerHTML = '';
    [{ id:'auto', label:'自动识别' }].concat(LANGS).forEach(function(l){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pill' + (src === l.id ? ' on' : '');
      b.textContent = l.label;
      b.addEventListener('click', function(){
        src = l.id; syncPair(); buildPills();
        if (input.value.trim()) translate();
      });
      srcBox.appendChild(b);
    });
    tgtBox.innerHTML = '';
    LANGS.forEach(function(l){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'pill' + (tgt === l.id ? ' on' : '');
      b.textContent = l.label;
      b.addEventListener('click', function(){
        tgt = l.id; syncPair(); buildPills();
        if (input.value.trim()) translate();
      });
      tgtBox.appendChild(b);
    });
  }

  function syncPair(){
    save(PKEY, { s: src, t: tgt });
    updateSpeak();
  }

  function detect(text){
    if (/[؀-ۿ]/.test(text)) return 'ug';
    if (/[Ѐ-ӿ]/.test(text)) return 'mn';
    if (/[぀-ヿ]/.test(text)) return 'ja';
    if (/[一-鿿]/.test(text)) return 'zh';
    return 'en';
  }

  /* 通道零：本机离线服务（127.0.0.1:8099，静默探测） */
  var LOCAL = 'http://127.0.0.1:8099';
  var localOk = false;

  async function probeLocal(){
    if (location.protocol === 'https:') return;
    try{
      var ctl = new AbortController();
      var timer = setTimeout(function(){ ctl.abort(); }, 600);
      var r = await fetch(LOCAL + '/health', { signal: ctl.signal, cache: 'no-store' });
      clearTimeout(timer);
      if (r.ok){
        var d = await r.json();
        if (d && d.ok){
          localOk = true;
          var el = document.getElementById('mode');
          if (el) el.querySelector('span').textContent = '本地 NLLB 离线引擎已连接 · 零流量秒翻';
        }
      }
    } catch(e){}
  }

  async function localTranslate(from, to, text){
    var r = await fetch(LOCAL + '/translate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, src: from, tgt: to })
    });
    if (!r.ok) throw new Error('LOCAL_HTTP');
    var d = await r.json();
    if (!d || !d.ok || !d.translation) throw new Error('LOCAL_FAIL');
    return { text: d.translation.trim(), engine: '本地离线引擎' };
  }

  /* 通道一：Google GTX 极速直连（支持中/英/日/维/蒙全语种，约 0.3~0.8s） */
  async function gtxTranslate(from, to, text){
    var sl = byId[from] ? byId[from].gtx : 'auto';
    var tl = byId[to] ? byId[to].gtx : 'en';
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, 3500);
    var url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' +
      encodeURIComponent(sl) + '&tl=' + encodeURIComponent(tl) + '&dt=t&q=' + encodeURIComponent(text);
    var r = await fetch(url, { signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('GTX_HTTP');
    var d = await r.json();
    if (!Array.isArray(d) || !Array.isArray(d[0])) throw new Error('GTX_BAD');
    var outTxt = d[0].map(function(seg){ return (seg && seg[0]) || ''; }).join('').trim();
    if (!outTxt) throw new Error('GTX_EMPTY');
    return { text: outTxt, engine: '极速直连通道' };
  }

  /* 通道二：MyMemory 翻译接口（约 0.6~1.2s） */
  async function mmTranslate(from, to, text){
    var a = byId[from], b = byId[to];
    if (!a || !b || !a.mm || !b.mm) throw new Error('NO_MM');
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, 4000);
    var r = await fetch('https://api.mymemory.translated.net/get?q=' +
      encodeURIComponent(text.slice(0, 500)) + '&langpair=' + a.mm + '|' + b.mm, { signal: ctl.signal });
    clearTimeout(timer);
    if (!r.ok) throw new Error('MM_HTTP');
    var d = await r.json();
    var t = d && d.responseData && d.responseData.translatedText;
    if (!t || /MYMEMORY WARNING/i.test(t)) throw new Error('MM_EMPTY');
    return {
      text: t.replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&').trim(),
      engine: '云端快译通道'
    };
  }

  /* 通道三：Pollinations 免密钥大模型兜底 */
  async function llmTranslate(from, to, text){
    var sys = 'Translate from ' + byId[from].prompt + ' to ' + byId[to].prompt + '. Output ONLY the translation.';
    var ctl = new AbortController();
    var timer = setTimeout(function(){ ctl.abort(); }, 7000);
    var r = await fetch('https://text.pollinations.ai/openai', {
      method: 'POST',
      signal: ctl.signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'openai-fast',
        temperature: 0.1,
        messages: [{ role:'system', content: sys }, { role:'user', content: text }]
      })
    });
    clearTimeout(timer);
    if (!r.ok) throw new Error('LLM_HTTP');
    var d = await r.json();
    var txt = (d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content) || '';
    if (!txt.trim()) throw new Error('LLM_EMPTY');
    return { text: txt.trim(), engine: 'AI 语义通道' };
  }

  function cacheKey(f, t, text){
    var h = 5381;
    for (var i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
    return 'wmv587.tr2.' + f + '.' + t + '.' + (h >>> 0);
  }

  async function translate(){
    var text = input.value.trim();
    if (!text){
      out.textContent = '译文会立刻出现在这里';
      out.classList.add('empty');
      engineEl.innerHTML = '<i></i>等待输入';
      metaOut.textContent = '';
      return;
    }

    var from = src === 'auto' ? detect(text) : src;
    var to = tgt;
    if (from === to){
      to = (from === 'zh') ? 'en' : 'zh';
      tgt = to;
      syncPair();
      buildPills();
    }

    var mySeq = ++reqSeq;
    var t0 = performance.now();
    errEl.textContent = '';
    goBtn.disabled = true;
    goBtn.innerHTML = '正在秒翻…';
    engineEl.innerHTML = '<i></i>并发请求中…';

    var key = cacheKey(from, to, text);
    var cached = load(key);

    try{
      var resObj = null;
      if (cached && cached.v === text && cached.r){
        resObj = { text: cached.r, engine: '本地秒开缓存' };
      } else {
        if (localOk){
          try{ resObj = await localTranslate(from, to, text); }
          catch(e){ localOk = false; }
        }
        if (!resObj){
          /* 多通道并发竞速：谁最快成功就用谁，几百毫秒出结果 */
          try {
            resObj = await Promise.any([
              gtxTranslate(from, to, text),
              mmTranslate(from, to, text)
            ]);
          } catch (eFast) {
            resObj = await llmTranslate(from, to, text);
          }
        }
        save(key, { v: text, r: resObj.text, t: Date.now() });
      }

      if (mySeq !== reqSeq) return;
      var ms = Math.max(10, Math.round(performance.now() - t0));
      lastOut = resObj.text;
      out.textContent = resObj.text;
      out.classList.remove('empty');
      metaOut.textContent = resObj.text.length + ' 字 · ' + (ms / 1000).toFixed(2) + 's';
      engineEl.innerHTML = '<i></i>' + resObj.engine;
      pushHistory(text, resObj.text, from, to);
      updateSpeak();
    } catch(e){
      if (mySeq !== reqSeq) return;
      errEl.textContent = '网络通道繁忙，请再点一次「立即翻译」试试';
      engineEl.innerHTML = '<i></i>请求超时';
    } finally {
      if (mySeq === reqSeq){
        goBtn.disabled = false;
        goBtn.innerHTML = '立即翻译<span class="hint">Ctrl + Enter</span>';
      }
    }
  }

  function pushHistory(srcText, res, from, to){
    var list = load(HKEY) || [];
    list = list.filter(function(x){ return x.in !== srcText; });
    list.unshift({ in: srcText, out: res, from: from, to: to, at: Date.now() });
    list = list.slice(0, 8);
    save(HKEY, list);
    renderHistory();
  }

  function renderHistory(){
    var list = load(HKEY) || [];
    histEl.innerHTML = '';
    if (!list.length) return;
    var label = document.createElement('span');
    label.className = 'tagline';
    label.innerHTML = '<i></i>最近记录：';
    histEl.appendChild(label);
    list.forEach(function(x){
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'chip';
      b.textContent = x.in.replace(/\s+/g, ' ').slice(0, 24);
      b.title = x.in + ' → ' + x.out;
      b.addEventListener('click', function(){
        input.value = x.in;
        src = x.from; tgt = x.to;
        syncPair(); buildPills(); updateMeta();
        out.textContent = x.out; out.classList.remove('empty');
        lastOut = x.out; metaOut.textContent = x.out.length + ' 字';
        engineEl.innerHTML = '<i></i>历史记录';
      });
      histEl.appendChild(b);
    });
  }

  function updateSpeak(){
    var l = byId[tgt];
    var ok = l && l.say && 'speechSynthesis' in window;
    speakBtn.disabled = !ok;
    speakBtn.title = ok ? '朗读译文' : '当前浏览器不支持该语种朗读';
  }

  function speak(){
    if (!('speechSynthesis' in window) || !lastOut) return;
    var l = byId[tgt];
    if (!l || !l.say) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(lastOut);
    u.lang = l.say;
    u.rate = 0.96;
    speechSynthesis.speak(u);
  }

  function updateMeta(){
    var n = input.value.length;
    metaIn.textContent = n + ' 字' + (src === 'auto' && n ? ' · 识别为 ' + byId[detect(input.value)].label : '');
  }

  input.addEventListener('input', function(){
    updateMeta();
    if (!autoTrEl.checked) return;
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(function(){
      if (input.value.trim()) translate();
    }, 480);
  });

  input.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      clearTimeout(debounceTimer);
      translate();
    }
  });

  goBtn.addEventListener('click', function(){
    clearTimeout(debounceTimer);
    translate();
  });

  document.querySelectorAll('.q-chip').forEach(function(btn){
    btn.addEventListener('click', function(){
      input.value = btn.getAttribute('data-q');
      src = 'auto';
      var det = detect(input.value);
      if (tgt === det) tgt = det === 'zh' ? 'en' : 'zh';
      buildPills();
      updateMeta();
      translate();
    });
  });

  document.getElementById('clear').addEventListener('click', function(){
    clearTimeout(debounceTimer);
    input.value = ''; out.textContent = '译文会立刻出现在这里'; out.classList.add('empty');
    lastOut = ''; metaOut.textContent = ''; errEl.textContent = '';
    engineEl.innerHTML = '<i></i>等待输入'; updateMeta(); input.focus();
  });

  document.getElementById('paste').addEventListener('click', async function(){
    try{
      var t = await navigator.clipboard.readText();
      if (t){ input.value = t; updateMeta(); translate(); }
    }catch(e){ errEl.textContent = '请直接按 Ctrl + V 粘贴'; }
  });

  document.getElementById('copy').addEventListener('click', async function(){
    if (!lastOut) return;
    try{
      await navigator.clipboard.writeText(lastOut);
      var btn = document.getElementById('copy');
      var old = btn.innerHTML; btn.textContent = '✓ 已复制';
      setTimeout(function(){ btn.innerHTML = old; }, 1200);
    }catch(e){ errEl.textContent = '复制失败，请手动选中复制'; }
  });

  document.getElementById('swap').addEventListener('click', function(){
    if (src === 'auto'){
      src = detect(input.value || '中');
      tgt = tgt === src ? 'en' : tgt;
    } else {
      var s = src; src = tgt; tgt = s;
    }
    if (lastOut && input.value.trim()){
      input.value = lastOut;
    }
    syncPair(); buildPills(); updateMeta();
    if (input.value.trim()) translate();
  });

  speakBtn.addEventListener('click', speak);

  buildPills();
  probeLocal();
  updateMeta();
  updateSpeak();
  renderHistory();
})();
</script>
</body>
</html>

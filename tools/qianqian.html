<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-orientation="portrait" data-ratio="20:9">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="乾乾学易" />
  <meta name="application-name" content="乾乾学易" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" id="metaThemeColor" content="#F7F4EC" />
  <link rel="apple-touch-icon" id="appleTouchIconLink" href="" />
  <link rel="icon" type="image/png" id="faviconLink" href="" />
  <link rel="manifest" id="pwaManifestLink" href="" />
  <title>乾乾学易 · 六十四卦经传精研与上下卦推演</title>
  <style>
    :root {
      /* Light Theme: 宋韵宣纸 · 玉石玄墨 (Oriental Luxury Editorial) */
      --bg-workspace: #EAE4D7;
      --bg-paper: #F7F4EC;
      --bg-card: #FCFBF7;
      --bg-elevated: #F1ECE1;
      --bg-glass: rgba(252, 251, 247, 0.92);
      --ink-primary: #181715;
      --ink-secondary: #3D3934;
      --ink-muted: #736B5E;
      --ink-faint: #A39B8B;
      --border-hairline: rgba(140, 122, 91, 0.18);
      --border-accent: rgba(168, 139, 92, 0.38);

      /* High-craft Yao & Seal Palette */
      --vermilion: #B8332A;
      --vermilion-soft: rgba(184, 51, 42, 0.10);
      --vermilion-glow: rgba(184, 51, 42, 0.26);
      --gold-bronze: #A88652;
      --gold-light: #D4BE98;

      /* Distinct Yang vs Yin Yao Bar Colors */
      --yang-fill-start: #23211E;
      --yang-fill-end: #38342F;
      --yang-stroke: #141311;
      --yin-fill-start: #706B63;
      --yin-fill-end: #857F75;
      --yin-stroke: #5E5952;
      --yao-active-start: #C8372D;
      --yao-active-end: #9E231B;

      /* Bagua Compass Palette (Light: Warm Antique Ivory Jade & Gilt Bronze) */
      --compass-rim-1: #E5CFA3;
      --compass-rim-2: #BA965E;
      --compass-rim-3: #8F6D3B;
      --compass-rim-4: #CFAF78;
      --compass-rim-stroke: #7A5C30;
      --compass-dial-center: #FDFCF9;
      --compass-dial-mid: #F3EDE0;
      --compass-dial-edge: #E3D9C6;
      --compass-inner-ring-bg: rgba(246, 240, 228, 0.92);
      --compass-core-center: #FFFDF9;
      --compass-core-mid: #F8F3E8;
      --compass-core-edge: #EBE2D0;
      --compass-trigram-text: #2C2823;
      --compass-inner-text: #5A4628;
      --compass-yang-bar: #A67C46;
      --compass-yin-bar: #7D7467;
      --compass-center-char: #B8332A;
      --compass-ring-line: rgba(156, 126, 78, 0.28);
      --compass-tick-color: #A88652;

      --shadow-frame: 0 24px 60px rgba(28, 22, 14, 0.14), 0 4px 14px rgba(28, 22, 14, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      --shadow-card: 0 4px 14px rgba(36, 28, 18, 0.05), 0 1px 3px rgba(36, 28, 18, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.82);
      --fade-bottom: linear-gradient(to bottom, rgba(247, 244, 236, 0), #F7F4EC 85%);

      --font-serif: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    html[data-theme="dark"] {
      /* Dark Theme: 玄夜鎏金 · 紫禁暮色 (Obsidian & Bronze Gold) */
      --bg-workspace: #0B0B0C;
      --bg-paper: #131315;
      --bg-card: #1B1B1E;
      --bg-elevated: #232327;
      --bg-glass: rgba(27, 27, 30, 0.94);
      --ink-primary: #EFECE6;
      --ink-secondary: #C7C1B6;
      --ink-muted: #8E877B;
      --ink-faint: #5C574F;
      --border-hairline: rgba(212, 190, 152, 0.12);
      --border-accent: rgba(212, 190, 152, 0.30);

      --vermilion: #D94E43;
      --vermilion-soft: rgba(217, 78, 67, 0.15);
      --vermilion-glow: rgba(217, 78, 67, 0.35);
      --gold-bronze: #C9A66B;
      --gold-light: #8A7248;

      /* Dark Mode Yang (Warm Ivory Gold) vs Yin (Deep Slate Jade) */
      --yang-fill-start: #E5DAC3;
      --yang-fill-end: #CBB994;
      --yang-stroke: #F3EAD8;
      --yin-fill-start: #6E6A63;
      --yin-fill-end: #57534D;
      --yin-stroke: #858078;
      --yao-active-start: #E04F44;
      --yao-active-end: #B83228;

      /* Bagua Compass Palette (Dark: Warm Imperial Amber-Jade & Burnished Gold) */
      --compass-rim-1: #F0DCB4;
      --compass-rim-2: #C9A368;
      --compass-rim-3: #8E6B38;
      --compass-rim-4: #DFC089;
      --compass-rim-stroke: #B08D54;
      --compass-dial-center: #352E25;
      --compass-dial-mid: #2B241D;
      --compass-dial-edge: #211B15;
      --compass-inner-ring-bg: rgba(56, 47, 37, 0.95);
      --compass-core-center: #42382C;
      --compass-core-mid: #342C22;
      --compass-core-edge: #282119;
      --compass-trigram-text: #F5EDE0;
      --compass-inner-text: #E8C98E;
      --compass-yang-bar: #E5C283;
      --compass-yin-bar: #A89B87;
      --compass-center-char: #EF5B50;
      --compass-ring-line: rgba(226, 194, 138, 0.28);
      --compass-tick-color: #DFBF86;

      --shadow-frame: 0 28px 68px rgba(0, 0, 0, 0.72), 0 0 1px rgba(212, 190, 152, 0.28), inset 0 1px 0 rgba(255, 245, 225, 0.06);
      --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 245, 225, 0.05);
      --fade-bottom: linear-gradient(to bottom, rgba(19, 19, 21, 0), #131315 85%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-workspace);
      color: var(--ink-primary);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .workspace-shell {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
    }

    /* Main Folio Frame: Sized & Scaled Dynamically by applyViewportLayout() with ZERO top/bottom blank bars */
    .folio-frame {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-paper);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform-origin: center center;
      transition: background-color 0.3s ease;
    }

    .folio-frame.framed-card {
      border-radius: 18px;
      border: 1px solid var(--border-accent);
      box-shadow: var(--shadow-frame);
    }

    /* Subtle classical watermark background pattern */
    .folio-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.32;
      background-image: radial-gradient(var(--border-hairline) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    /* ==================== UPPER / LEFT OPERATION ZONE ==================== */
    .upper-zone {
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      padding: 9px 14px 8px;
      padding-top: calc(9px + env(safe-area-inset-top, 0px));
      display: flex;
      flex-direction: column;
      gap: 7px;
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-paper);
    }

    /* 1. Top Header Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 26px;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .brand-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 23px;
      height: 23px;
      border-radius: 5px;
      background: linear-gradient(145deg, #C8382E 0%, #9E2219 100%);
      color: #FFF9F2;
      border: 1px solid rgba(255, 238, 210, 0.32);
      box-shadow:
        0 2px 6px var(--vermilion-glow),
        inset 0 1px 1px rgba(255, 255, 255, 0.28),
        inset 0 -1px 2px rgba(60, 10, 6, 0.35);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-seal svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .app-title {
      font-family: var(--font-serif);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--ink-primary);
    }

    .top-right-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Circular Xiaozhuan Action Buttons (归 · 变 · 衍) next to Settings */
    .seal-circle-btn {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-accent);
      box-shadow: var(--shadow-card);
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      position: relative;
      transition: transform 0.16s ease, border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .seal-circle-btn svg {
      width: 15.5px;
      height: 15.5px;
      display: block;
      overflow: visible;
    }

    .seal-circle-btn .seal-char {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
      display: block;
      letter-spacing: 0;
      transform: translateY(0.3px);
      pointer-events: none;
    }

    .seal-circle-btn:hover:not(:disabled) {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }

    .seal-circle-btn:active:not(:disabled) {
      transform: scale(0.92);
    }

    .seal-circle-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* Highlighted state when a Yao is selected and ready to transform (变), or when 衍 is in progress */
    .seal-circle-btn.ready-accent {
      border-color: var(--vermilion);
      color: var(--vermilion);
      background-color: var(--vermilion-soft);
      box-shadow: 0 2px 7px var(--vermilion-glow);
    }

    .seal-circle-btn[data-yan-step="1"] {
      border-color: var(--gold-bronze);
      color: var(--gold-bronze);
      box-shadow: 0 0 0 1.5px rgba(166, 130, 76, 0.28);
    }

    .seal-circle-btn[data-yan-step="2"] {
      border-color: var(--vermilion);
      color: var(--vermilion);
      background-color: var(--vermilion-soft);
      box-shadow: 0 0 0 2px var(--vermilion-glow);
    }

    @keyframes sealPulseOnce {
      0% { transform: scale(0.88); }
      55% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .seal-circle-btn.pulse-anim {
      animation: sealPulseOnce 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Search Keyword Highlight Mark */
    mark.search-hl {
      background-color: rgba(184, 58, 46, 0.18);
      color: var(--vermilion);
      font-weight: 600;
      border-radius: 3px;
      padding: 0 2px;
      box-shadow: 0 1px 0 rgba(184, 58, 46, 0.38);
    }

    html[data-theme="dark"] mark.search-hl {
      background-color: rgba(214, 90, 74, 0.26);
      color: #F2796B;
      box-shadow: 0 1px 0 rgba(214, 90, 74, 0.45);
    }

    /* Pure Icon Settings Button (No text label per user request) */
    .settings-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .settings-icon-btn {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-accent);
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: var(--shadow-card);
    }

    .settings-icon-btn:hover,
    .settings-icon-btn.active {
      border-color: var(--vermilion);
      color: var(--vermilion);
      transform: rotate(22deg);
    }

    /* Settings Popover Panel */
    .settings-popover {
      position: absolute;
      top: calc(100% + 7px);
      right: -36px;
      width: 258px;
      background-color: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-accent);
      border-radius: 13px;
      padding: 10px 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      gap: 7.5px;
      opacity: 0;
      transform: translateY(-6px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 60;
    }

    .settings-popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    html {
      --theme-taiji-a: #FFFFFF;
      --theme-taiji-b: #181715;
    }

    html[data-theme="dark"] {
      --theme-taiji-a: #EFECE6;
      --theme-taiji-b: #000000;
    }

    html .settings-popover {
      background-color: #FFFFFF;
      border-color: rgba(0, 0, 0, 0.10);
    }

    html[data-theme="dark"] .settings-popover {
      background-color: #000000;
      border-color: rgba(255, 255, 255, 0.14);
    }

    .theme-taiji {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      background: transparent;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: rotate(0deg);
      transition: transform 0.34s cubic-bezier(0.34, 0.02, 0.2, 1);
      will-change: transform;
      margin: 3px 0 0;
      align-self: center;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-taiji .t-light {
      display: none;
    }

    html[data-theme="dark"] .theme-taiji .t-dark {
      display: none;
    }

    html[data-theme="dark"] .theme-taiji .t-light {
      display: inline;
    }

    .theme-taiji svg {
      width: 32px;
      height: 32px;
      display: block;
      pointer-events: none;
    }

    html.theme-fading,
    html.theme-fading body,
    html.theme-fading .folio-frame,
    html.theme-fading .top-bar,
    html.theme-fading .trigram-card,
    html.theme-fading .content-scroll,
    html.theme-fading .commentary-section,
    html.theme-fading .commentary-body,
    html.theme-fading .settings-popover {
      transition: background-color 0.26s ease, color 0.26s ease, border-color 0.26s ease, box-shadow 0.26s ease;
    }

    .set-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .set-label {
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink-muted);
    }

    .set-seg {
      display: flex;
      align-items: center;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }

    .set-opt-btn {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 5px;
      padding: 4px 3px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
      white-space: nowrap;
      text-align: center;
    }

    .set-opt-btn:hover:not(.active) {
      color: var(--ink-primary);
      background-color: rgba(168, 134, 82, 0.10);
    }

    .set-opt-btn.active {
      background-color: var(--vermilion);
      color: #FFFDF9;
      font-weight: 600;
      box-shadow: 0 1px 5px var(--vermilion-glow);
    }

    /* High-Craft Inlaid Jade & Gilt-Bronze Sequence Plaque */
    .gua-seq-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink-primary);
      background: linear-gradient(160deg, var(--bg-card) 0%, var(--bg-elevated) 55%, rgba(168, 134, 82, 0.16) 100%);
      border: 1px solid var(--border-accent);
      padding: 3.5px 9px 3.5px 8px;
      border-radius: 7px;
      cursor: pointer;
      box-shadow:
        0 2px 6px rgba(28, 22, 14, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 0 0 1.5px rgba(168, 134, 82, 0.14);
      transition: background-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] .gua-seq-badge {
      background: linear-gradient(160deg, #2B2620 0%, #1F1B17 60%, rgba(201, 166, 107, 0.20) 100%);
      border-color: rgba(212, 184, 134, 0.42);
      color: #F3ECE0;
      box-shadow:
        0 3px 9px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 244, 220, 0.14),
        inset 0 0 0 1.5px rgba(201, 166, 107, 0.16);
    }

    .gua-seq-badge::before {
      content: "❖";
      font-size: 8.5px;
      color: var(--gold-bronze);
      opacity: 0.85;
      line-height: 1;
    }

    .gua-seq-badge:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }

    /* ==================== 2. UNIFIED DIVINATION & NAVIGATION WORKSPACE ==================== */
    /* Portrait Mode 2x2 Grid:
       - Top-Left (sliders): Upper & Lower Trigram Sliders (flatter & wide so all 8 乾坤震巽坎离艮兑 pips show clearly)
       - Top-Right (bagua): Dual-Ring Rotating Bagua Astrolabe + Full Name & Pinyin
       - Bottom-Left (navzone): 4 Canwu Buttons (above 导语 row) + 导语..总论 row + 初九..上六 row (shifted left to free bottom-right!)
       - Bottom-Right (liuyao): Original full-size Sculpted 6-Yao Symbol placed directly BELOW Bagua! */
    .ops-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 114px;
      grid-template-rows: 118px 108px;
      grid-template-areas:
        "sliders bagua"
        "navzone liuyao";
      gap: 7px 10px;
      align-items: stretch;
    }

    /* Flatter Trigram Selector Cards so 8 Trigram Pips (乾坤震巽坎离艮兑) always display completely */
    .trigram-selectors {
      grid-area: sliders;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      height: 118px;
      min-width: 0;
    }

    .trigram-card {
      position: relative;
      height: 56px;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border-accent);
      border-radius: 10px;
      padding: 3px 5px 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      cursor: grab;
      touch-action: none;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .trigram-card:hover {
      border-color: var(--gold-bronze);
    }

    .trigram-card.is-dragging {
      cursor: grabbing;
      border-color: var(--vermilion);
      box-shadow: 0 3px 12px var(--vermilion-soft), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .trigram-card-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 29px;
    }

    .trigram-step-btn {
      width: 20px;
      height: 24px;
      border-radius: 5px;
      background: transparent;
      border: none;
      color: var(--ink-faint);
      font-family: var(--font-sans);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.15s ease;
      flex-shrink: 0;
      z-index: 3;
    }

    .trigram-step-btn:hover {
      background-color: var(--bg-paper);
      color: var(--ink-primary);
    }

    .trigram-step-btn:active {
      color: var(--vermilion);
      transform: scale(0.9);
    }

    /* Interactive 1:1 Follow-Finger 3D Cylindrical Drum Stage */
    .trigram-stage {
      flex: 1;
      height: 29px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 360px;
      mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%);
    }

    .trigram-slot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .trigram-neighbor {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      pointer-events: none;
      opacity: 0.25;
      transition: opacity 0.15s ease;
    }

    .trigram-neighbor-prev {
      left: -78%;
      transform: scale(0.85) rotateY(20deg);
    }

    .trigram-neighbor-next {
      left: 78%;
      transform: scale(0.85) rotateY(-20deg);
    }

    .trigram-card.is-dragging .trigram-neighbor {
      opacity: 0.72;
    }

    .trigram-slot.slide-in-from-right {
      animation: trigramInRight 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .trigram-slot.slide-in-from-left {
      animation: trigramInLeft 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes trigramInRight {
      0% { transform: translate3d(36px, 0, 0) rotateY(-18deg) scale(0.9); opacity: 0.25; }
      100% { transform: translate3d(0, 0, 0) rotateY(0deg) scale(1); opacity: 1; }
    }

    @keyframes trigramInLeft {
      0% { transform: translate3d(-36px, 0, 0) rotateY(18deg) scale(0.9); opacity: 0.25; }
      100% { transform: translate3d(0, 0, 0) rotateY(0deg) scale(1); opacity: 1; }
    }

    .trigram-nature-char {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      color: var(--ink-primary);
    }

    .trigram-meta-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.1;
    }

    .trigram-gua-char {
      font-family: var(--font-serif);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      white-space: nowrap;
    }

    .trigram-pos-tag {
      font-family: var(--font-sans);
      font-size: 8.5px;
      color: var(--ink-muted);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    /* 8-Trigram Quick Pips Bar: 8-column equal grid so all 8 characters (乾坤震巽坎离艮兑) NEVER clip */
    .trigram-pips {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      align-items: center;
      padding: 2px 2px 0;
      border-top: 1px solid var(--border-hairline);
    }

    .trigram-pip-btn {
      background: none;
      border: none;
      font-family: var(--font-serif);
      font-size: 10px;
      color: var(--ink-muted);
      padding: 0.5px 0;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.15s ease;
      line-height: 1.25;
      text-align: center;
      width: 100%;
    }

    .trigram-pip-btn:hover {
      color: var(--ink-primary);
      background-color: var(--bg-paper);
    }

    .trigram-pip-btn.active {
      color: var(--vermilion);
      font-weight: 700;
      background-color: var(--vermilion-soft);
    }

    /* Top-Right in Portrait / Top-Left in Landscape: Concentric Dual-Ring Bagua Astrolabe Medallion */
    .compass-col {
      grid-area: bagua;
      height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .compass-svg-wrap {
      width: 98px;
      height: 98px;
      position: relative;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
    }

    .compass-svg-wrap:hover {
      transform: scale(1.025);
    }

    .compass-svg-wrap:active {
      transform: scale(0.975);
    }

    .compass-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    #compassOuterRing,
    #compassInnerRing {
      transform-origin: 54px 54px;
      will-change: transform;
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .compass-fullname {
      height: 16px;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 3px;
      color: var(--ink-secondary);
      text-align: center;
      white-space: nowrap;
      line-height: 1;
    }

    .compass-zh {
      font-family: var(--font-serif);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink-primary);
    }

    .compass-dot {
      font-family: var(--font-sans);
      font-size: 10.5px;
      color: var(--gold-bronze);
    }

    .compass-py {
      font-family: "Lucida Grande", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    /* Original Full-Size Sculpted 6-Yao Symbol Box:
       - Portrait: Placed directly BELOW Bagua (grid-area: liuyao)
       - Landscape: Placed directly BELOW Sliders (grid-area: liuyao) */
    .hexagram-center-col {
      grid-area: liuyao;
      height: 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border-accent);
      border-radius: 11px;
      padding: 7px 6px 5px;
      box-shadow: var(--shadow-card);
    }

    .yao-svg-wrap {
      width: 74px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .yao-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .yao-hit-group {
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center;
    }

    .yao-hit-group:hover {
      transform: scaleX(1.04);
    }

    .yao-bar-shape {
      transition: background-color 0.22s ease, border-color 0.22s ease, color 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease, transform 0.22s ease;
    }

    .trigram-pair-caption {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.8px;
      color: var(--ink-muted);
      white-space: nowrap;
      line-height: 1;
    }

    /* ==================== 3. NAVIGATION & CANWU 4-BUTTONS ZONE ==================== */
    /* Portrait Mode (grid-area: navzone, Bottom-Left of Upper Zone):
       - Shifted left so Bottom-Right is freed up for the full-size 6-Yao box under Bagua
       - .canwu-strip (4 pure buttons, no white background box) sits ABOVE #guaTabRow
       - .nav-group (导语 row + 初九 row) sits below .canwu-strip */
    .nav-and-canwu-zone {
      grid-area: navzone;
      height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      min-width: 0;
    }

    .canwu-strip {
      order: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4.5px;
      background: transparent;
      border: none;
      padding: 0;
      height: 34px;
    }

    .relation-btn {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 7px;
      padding: 2px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .relation-btn:hover {
      border-color: var(--vermilion);
      background-color: var(--vermilion-soft);
    }

    .relation-btn:active {
      transform: scale(0.97);
    }

    .relation-type {
      font-family: var(--font-sans);
      font-size: 8.5px;
      color: var(--gold-bronze);
      font-weight: 600;
      line-height: 1.05;
      flex-shrink: 0;
    }

    .relation-gua {
      font-family: var(--font-serif);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-primary);
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-group {
      order: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      flex: 1;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-elevated);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-hairline);
      height: 33px;
    }

    .text-btn {
      position: relative;
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      border-radius: 6px;
      font-family: var(--font-serif);
      color: var(--ink-muted);
      cursor: pointer;
      padding: 2px 1px;
      line-height: 1.15;
      transition: background-color 0.18s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.18s cubic-bezier(0.22, 1, 0.36, 1), color 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s cubic-bezier(0.22, 1, 0.36, 1), transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-row-gua .text-btn {
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .btn-row-yao .text-btn {
      font-size: 11px;
      font-weight: 500;
    }

    .btn-row-yao .text-btn.yong-btn {
      font-size: 10px;
    }

    .text-btn:hover:not(:disabled):not(.active) {
      color: var(--ink-primary);
      background-color: rgba(168, 134, 82, 0.08);
    }

    .text-btn.active {
      color: #FFFDF9;
      background-color: var(--vermilion);
      font-weight: 600;
      box-shadow: 0 2px 6px var(--vermilion-glow);
    }

    .text-btn:disabled {
      color: var(--ink-faint);
      opacity: 0.4;
      cursor: default;
    }

    /* ==================== LANDSCAPE MODE ARCHITECTURE (html[data-orientation="landscape"]) ==================== */
    /* 1. Left-Right Proportion Matches Portrait Upper-Lower Ratio (~37% Left Studio : ~63% Right Reading Folio)
       2. Inside Left Studio (.ops-workspace):
          - Left Sub-column:
            * Top (bagua): Dual-Ring Rotating Bagua Astrolabe placed ABOVE the other parts on the left ("横屏模式八卦放到左侧其他部分的上方")
            * Middle (sliders): Flatter Upper & Lower Trigram Sliders (with all 8 乾坤震巽坎离艮兑 pips visible)
            * Bottom (liuyao): Full-size Sculpted 6-Yao Symbol placed BELOW the sliders ("六爻符号放到滑动的下方")
          - Right Sub-column (navzone — to the right of Bagua & Sliders & 6-Yao):
            * Top: 导语..总论 & 初六..上六 arranged vertically as two side-by-side columns
            * Bottom: 4 Canwu buttons (without white background box) stacked vertically BELOW the 导语 & 初六 columns */
    html[data-orientation="landscape"] .folio-frame {
      display: grid;
      grid-template-columns: 38% 62%;
      grid-template-rows: minmax(0, 1fr);
    }

    html[data-orientation="landscape"] .upper-zone {
      height: 100%;
      padding: 10px 18px 12px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(18px + env(safe-area-inset-left, 0px));
      border-bottom: none;
      border-right: 1px solid var(--border-accent);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    html[data-orientation="landscape"] .ops-workspace {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      width: 100%;
      height: 100%;
      margin: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 116px minmax(0, 1.15fr) auto;
      grid-template-areas:
        "bagua"
        "sliders"
        "liuyao"
        "navzone";
      gap: 10px;
      align-items: stretch;
    }

    html[data-orientation="landscape"] .compass-col {
      height: 100%;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      padding: 12px 16px 6px;
      box-shadow: var(--shadow-card);
    }

    html[data-orientation="landscape"] .compass-svg-wrap {
      width: auto;
      height: calc(100% - 26px);
      max-width: 100%;
      aspect-ratio: 1 / 1;
    }

    html[data-orientation="landscape"] .compass-zh {
      font-size: 16px;
    }

    html[data-orientation="landscape"] .compass-py,
    html[data-orientation="landscape"] .compass-dot {
      font-size: 14px;
    }

    html[data-orientation="landscape"] .trigram-selectors {
      height: 116px;
      gap: 8px;
      justify-content: center;
    }

    html[data-orientation="landscape"] .trigram-card {
      height: 54px;
      flex: 0 0 auto;
      padding: 3px 7px 2px;
    }

    html[data-orientation="landscape"] .trigram-card-main {
      height: 28px;
    }

    html[data-orientation="landscape"] .trigram-stage {
      height: 28px;
    }

    html[data-orientation="landscape"] .trigram-meta-col {
      flex-direction: row;
      align-items: baseline;
      gap: 4px;
    }

    html[data-orientation="landscape"] .hexagram-center-col {
      height: 100%;
      min-height: 0;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      padding: 10px 14px;
    }

    /* Right Sub-Column in Landscape: Vertical 导语/初六 columns at top + Vertical 4 Canwu buttons below */
    html[data-orientation="landscape"] .nav-and-canwu-zone {
      height: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
    }

    html[data-orientation="landscape"] .nav-group {
      order: 2;
      flex: 0 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    html[data-orientation="landscape"] .btn-row {
      flex-direction: row;
      height: auto;
      padding: 0;
      gap: 8px;
    }

    html[data-orientation="landscape"] .text-btn {
      flex: 1 1 0;
      padding: 12px 4px;
      font-size: 16.5px;
      letter-spacing: 1px;
    }

    html[data-orientation="landscape"] .btn-row-yao .text-btn.yong-btn {
      font-size: 13.5px;
    }

    html[data-orientation="landscape"] .canwu-strip {
      order: 1;
      flex: 0 0 auto;
      height: auto;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    html[data-orientation="landscape"] .relation-btn {
      flex: 1 1 0;
      flex-direction: row;
      justify-content: center;
      gap: 6px;
      padding: 8px 8px;
      border-radius: 8px;
    }

    html[data-orientation="landscape"] .relation-type {
      font-size: 12.5px;
    }

    html[data-orientation="landscape"] .relation-gua {
      font-size: 14.5px;
    }

    html[data-orientation="landscape"] .trigram-pip-btn {
      font-size: 11.5px;
    }

    html[data-orientation="landscape"] .trigram-nature-char {
      font-size: 20px;
    }

    html[data-orientation="landscape"] .trigram-gua-char {
      font-size: 13px;
    }

    html[data-orientation="landscape"] .trigram-pos-tag {
      font-size: 10px;
    }

    /* 矮横屏（手机/小窗）回退：导航回到右侧竖列，保证罗盘与六爻仍有足够高度 */
    @media (max-height: 620px) {
      html[data-orientation="landscape"] .folio-frame {
        grid-template-columns: 37% 63%;
      }

      html[data-orientation="landscape"] .ops-workspace {
        grid-template-columns: minmax(0, 1fr) 104px;
        grid-template-rows: minmax(0, 1fr) 102px minmax(0, 1.1fr);
        grid-template-areas:
          "bagua   navzone"
          "sliders navzone"
          "liuyao  navzone";
        gap: 8px 10px;
      }

      html[data-orientation="landscape"] .compass-col {
        padding: 6px 8px 4px;
        gap: 5px;
        border-radius: 12px;
      }

      html[data-orientation="landscape"] .compass-zh { font-size: 12px; }
      html[data-orientation="landscape"] .compass-py,
      html[data-orientation="landscape"] .compass-dot { font-size: 10.5px; }

      html[data-orientation="landscape"] .trigram-selectors {
        height: 102px;
        gap: 6px;
      }

      html[data-orientation="landscape"] .trigram-card {
        height: 48px;
        padding: 2px 5px 2px;
      }

      html[data-orientation="landscape"] .trigram-card-main,
      html[data-orientation="landscape"] .trigram-stage {
        height: 24px;
      }

      html[data-orientation="landscape"] .trigram-pip-btn { font-size: 9px; }

      html[data-orientation="landscape"] .hexagram-center-col {
        padding: 7px 8px 5px;
      }

      html[data-orientation="landscape"] .nav-and-canwu-zone {
        height: 100%;
        justify-content: space-between;
        gap: 5px;
      }

      html[data-orientation="landscape"] .nav-group {
        order: 1;
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4.5px;
      }

      html[data-orientation="landscape"] .btn-row {
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 3px;
        gap: 2.5px;
      }

      html[data-orientation="landscape"] .text-btn {
        width: 100%;
        flex: 1 1 auto;
        max-height: 84px;
        padding: 2px 1px;
        font-size: 11.5px;
        letter-spacing: 0;
      }

      html[data-orientation="landscape"] .btn-row-yao .text-btn.yong-btn { font-size: 10.5px; }

      html[data-orientation="landscape"] .canwu-strip {
        order: 2;
        flex: 0 0 auto;
        flex-direction: column;
        gap: 4.5px;
      }

      html[data-orientation="landscape"] .relation-btn {
        flex: none;
        width: 100%;
        justify-content: space-between;
        gap: 0;
        padding: 5px 7px;
        border-radius: 7px;
      }

      html[data-orientation="landscape"] .relation-type { font-size: 9.5px; }
      html[data-orientation="landscape"] .relation-gua { font-size: 11px; }
    }

    /* ==================== LOWER / RIGHT CONTENT READING ZONE ==================== */
    .lower-zone {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-paper);
    }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px 48px;
      padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      user-select: text;
    }

    html[data-orientation="landscape"] .content-scroll {
      padding: 4px 24px 48px;
      padding-right: calc(24px + env(safe-area-inset-right, 0px));
      padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    }

    .content-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .content-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .content-scroll::-webkit-scrollbar-thumb {
      background-color: var(--border-accent);
      border-radius: 4px;
    }

    /* 4.1 Sticky Original Scripture Card */
    .original-sticky-wrap {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 10px 0 8px;
      background-color: var(--bg-paper);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .original-quote-box {
      position: relative;
      background-color: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-left: 3.5px solid var(--vermilion);
      border-radius: 6px 12px 12px 6px;
      padding: 9px 13px;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .original-quote-box:hover {
      border-color: var(--border-accent);
      border-left-color: var(--vermilion);
    }

    .original-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
      min-height: 20px;
    }

    .original-label-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .original-tag {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--vermilion);
      background-color: var(--vermilion-soft);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .original-sub-note {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* Secondary Switcher for Yao (爻辞 / 小象) */
    .sub-switch-group {
      display: inline-flex;
      align-items: center;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .sub-switch-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--ink-muted);
      cursor: pointer;
      padding: 2px 9px;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }

    .sub-switch-btn:hover:not(.active) {
      color: var(--ink-primary);
    }

    .sub-switch-btn.active {
      background-color: var(--vermilion);
      color: #FFFDF9;
      font-weight: 600;
    }

    .original-text {
      font-family: var(--font-serif);
      font-size: calc(var(--comm-font-size, 15.5px) * 1.12);
      font-weight: 600;
      line-height: 2.22;
      letter-spacing: 0.5px;
      color: var(--ink-primary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      padding-top: 3px;
    }

    .original-text ruby,
    .wenyan-quote-text ruby {
      ruby-align: center;
      ruby-position: over;
      margin: 0 1px;
    }

    .original-text rt,
    .wenyan-quote-text rt {
      font-family: "Lucida Grande", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--vermilion);
      letter-spacing: 0px;
      font-kerning: normal;
      line-height: 1.15;
      user-select: none;
      -webkit-user-select: none;
    }

    .original-text ruby.ruby-common rt,
    .wenyan-quote-text ruby.ruby-common rt {
      color: var(--gold-bronze);
      font-weight: 400;
    }

    .pinyin-mode-btn {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 5px;
      padding: 2px 7px;
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--gold-bronze);
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
      margin-left: auto;
    }

    .original-text.expanded {
      display: block;
      -webkit-line-clamp: unset;
    }

    .expand-toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px dashed var(--border-hairline);
    }

    .tiny-action-btn {
      background: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.8px;
      color: var(--gold-bronze);
      cursor: pointer;
      padding: 2px 0;
    }

    .tiny-action-btn:hover {
      color: var(--vermilion);
    }

    /* 4.2 Commentary Section */
    .commentary-section {
      padding-top: 4px;
    }

    #compassWrap { cursor: pointer; }

    .pure-sheet {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(18, 14, 10, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .pure-sheet.open {
      opacity: 1;
      pointer-events: auto;
    }

    .pure-sheet-panel {
      width: min(430px, 100%);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(20, 14, 8, 0.32);
      transform: translateY(8px) scale(0.985);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .pure-sheet.open .pure-sheet-panel {
      transform: translateY(0) scale(1);
    }

    .pure-sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .pure-sheet-name {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--ink-primary);
    }

    .pure-sheet-close {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink-muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .pure-sheet-close:hover { color: var(--vermilion); }

    .pure-sheet-body {
      padding: 4px 6px 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .pure-row {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 9px 8px;
      border-radius: 9px;
      cursor: pointer;
      transition: background-color 0.16s ease;
    }

    .pure-row:hover { background: var(--vermilion-soft); }

    .pure-row-yao {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding-top: 1px;
    }

    .pure-row-label {
      font-family: var(--font-sans);
      font-size: 9px;
      color: var(--ink-muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .pure-bar { display: block; border-radius: 1px; }
    .pure-bar.yang { width: 22px; height: 3px; background: var(--ink-secondary); }
    .pure-bars-yin { display: flex; gap: 4px; }
    .pure-bar.yin { width: 9px; height: 3px; background: var(--ink-secondary); }

    .pure-row-text {
      flex: 1;
      min-width: 0;
      font-family: var(--font-serif);
      font-size: 13.5px;
      line-height: 1.62;
      color: var(--ink-primary);
    }

    .pure-row.is-gua .pure-row-text {
      color: var(--ink-secondary);
      font-weight: 600;
    }

    .pure-row-tail {
      flex: 0 0 auto;
      align-self: center;
      color: var(--ink-faint);
      font-size: 11px;
    }

    .edition-flip {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--bg-glass);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .edition-flip.on {
      opacity: 1;
      pointer-events: auto;
    }

    .edition-flip .taiji {
      width: 156px;
      height: 156px;
      display: block;
      border-radius: 50%;
      background: var(--bg-card);
      box-shadow: 0 14px 38px rgba(28, 22, 14, 0.20);
    }

    .edition-flip .taiji.spin {
      animation: taijiHalfTurn 0.54s cubic-bezier(0.42, 0, 0.3, 1) forwards;
    }

    @keyframes taijiHalfTurn {
      from { transform: rotate(0deg); }
      to { transform: rotate(180deg); }
    }

    .comm-edition-tag {
      font-family: var(--font-sans);
      font-size: 10.5px;
      letter-spacing: 1.5px;
      line-height: 1.4;
      color: var(--ink-muted);
      padding: 0 0 7px;
      user-select: none;
    }

    .comm-edition-tag.orig {
      color: var(--vermilion);
    }

    .commentary-header {
      display: none;
    }

    :root {
      --comm-font-size: 15.5px;
      --orig-font-size: 17.5px;
      --wenyan-font-size: 16px;
    }

    .commentary-body p {
      font-family: var(--font-serif);
      font-size: var(--comm-font-size, 15.5px);
      line-height: 1.94;
      color: var(--ink-secondary);
      text-align: justify;
      text-indent: 2em;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .commentary-body p:last-child {
      margin-bottom: 0;
    }

    .wenyan-entry {
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .wenyan-entry:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .wenyan-quote {
      background-color: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-left: 3px solid var(--vermilion);
      border-radius: 4px 10px 10px 4px;
      padding: 8px 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .wenyan-seg-tag {
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--vermilion);
      margin-bottom: 4px;
    }

    .wenyan-quote-text {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      line-height: 2.2;
      color: var(--ink-primary);
      padding-top: 3px;
    }

    /* 4.3 Bottom Functional Fade Mask */
    .bottom-fade-mask {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38px;
      pointer-events: none;
      z-index: 6;
      background: var(--fade-bottom);
    }

    /* ==================== 64-HEXAGRAM INDEX & SEARCH DRAWER ==================== */
    .index-drawer {
      position: absolute;
      inset: 0;
      z-index: 50;
      background-color: var(--bg-paper);
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .index-drawer.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .drawer-header {
      padding: 12px 16px 10px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      border-bottom: 1px solid var(--border-hairline);
      background-color: var(--bg-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: var(--ink-primary);
    }

    .drawer-close-btn {
      background-color: var(--vermilion-soft);
      border: 1px solid transparent;
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--vermilion);
      cursor: pointer;
      padding: 4px 12px;
    }

    .drawer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 8px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 6px 26px 6px 10px;
      font-family: var(--font-serif);
      font-size: 13px;
      color: var(--ink-primary);
      outline: none;
    }

    .search-input::placeholder {
      color: var(--ink-faint);
      font-family: var(--font-sans);
      font-size: 11.5px;
    }

    .search-clear-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--ink-muted);
      font-size: 14px;
      cursor: pointer;
      display: none;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .seq-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    html[data-orientation="landscape"] .seq-grid {
      grid-template-columns: repeat(8, 1fr);
    }

    .seq-cell {
      background-color: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
      padding: 7px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
      box-shadow: var(--shadow-card);
    }

    .seq-cell:hover {
      border-color: var(--gold-bronze);
      transform: translateY(-1px);
    }

    .seq-cell.current {
      border-color: var(--vermilion);
      background-color: var(--vermilion-soft);
    }

    .seq-cell-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-sans);
      font-size: 9.5px;
      color: var(--ink-faint);
      margin-bottom: 2px;
    }

    .seq-cell-name {
      font-family: var(--font-serif);
      font-size: 16.5px;
      font-weight: 600;
      color: var(--ink-primary);
      margin: 2px 0;
    }

    .seq-cell.current .seq-cell-name {
      color: var(--vermilion);
    }

    .seq-cell-full {
      font-family: var(--font-sans);
      font-size: 10px;
      color: var(--ink-muted);
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background-color: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid var(--border-hairline);
      text-align: center;
      padding: 6px 2px;
      font-size: 12px;
    }

    .matrix-table th {
      background-color: var(--bg-elevated);
      color: var(--ink-muted);
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 10.5px;
    }

    .matrix-cell {
      cursor: pointer;
      color: var(--ink-secondary);
      font-family: var(--font-serif);
      font-weight: 500;
    }

    .matrix-cell:hover {
      color: var(--vermilion);
      background-color: var(--vermilion-soft);
    }

    .matrix-cell.current {
      color: #FFFDF9;
      background-color: var(--vermilion);
      font-weight: 600;
    }

    .search-result-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .search-item {
      padding: 9px 12px;
      border: 1px solid var(--border-hairline);
      border-left: 3px solid var(--gold-bronze);
      border-radius: 6px 10px 10px 6px;
      background-color: var(--bg-card);
      cursor: pointer;
    }

    .search-item:hover {
      border-left-color: var(--vermilion);
    }

    .search-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .search-item-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--vermilion);
    }

    .search-item-snippet {
      font-family: var(--font-serif);
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink-secondary);
    }

    /* Toast */
    .folio-toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background-color: var(--ink-primary);
      color: var(--bg-paper);
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 1px;
      padding: 7px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 70;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    .folio-toast.visible {
      opacity: 0.96;
      transform: translateX(-50%) translateY(0);
    }
  
    /* 六爻区：符号撑满、居中；「上X · 下Y」已移除 */
    .hexagram-center-col,
    html[data-orientation="landscape"] .hexagram-center-col {
      justify-content: center;
      gap: 0;
    }

    .yao-svg-wrap,
    html[data-orientation="landscape"] .yao-svg-wrap {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: none;
      padding: 0;
    }

    .yao-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* ==================== 启动横竖屏选择 ==================== */
    .launch-veil {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      background:
        radial-gradient(130% 100% at 50% -10%, rgba(94, 72, 40, 0.44) 0%, rgba(20, 18, 15, 0) 58%),
        radial-gradient(90% 70% at 50% 110%, rgba(94, 26, 20, 0.22) 0%, rgba(10, 10, 11, 0) 60%),
        #0C0C0D;
      font-family: var(--font-serif);
      opacity: 1;
      transition: opacity 0.3s ease;
      overscroll-behavior: contain;
    }

    .launch-veil.closing {
      opacity: 0;
      pointer-events: none;
    }

    .launch-panel {
      width: min(680px, 100%);
      text-align: center;
      color: #EFECE6;
      animation: launchRise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    @keyframes launchRise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .launch-seal {
      width: 46px;
      height: 46px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      color: #FFF6E8;
      font-size: 25px;
      line-height: 1;
      background: linear-gradient(160deg, #C8382E, #8E1D14);
      border-radius: 7px;
      box-shadow: inset 0 0 0 1px rgba(255, 246, 232, 0.28), 0 10px 26px rgba(0, 0, 0, 0.4);
    }

    .launch-title {
      margin: 18px 0 0;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      color: #F3EFE6;
    }

    .launch-kicker {
      margin: 12px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: #8D8578;
    }

    .launch-kicker i {
      width: 42px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201, 166, 107, 0.5), transparent);
    }

    .launch-options {
      margin-top: 34px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .launch-option {
      position: relative;
      appearance: none;
      -webkit-appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 26px 18px 22px;
      cursor: pointer;
      color: #DCD5C7;
      background: linear-gradient(180deg, rgba(32, 31, 31, 0.92), rgba(19, 19, 21, 0.94));
      border: 1px solid rgba(212, 190, 152, 0.2);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
    }

    .launch-option::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(212, 190, 152, 0.1);
      border-radius: 9px;
      pointer-events: none;
      transition: border-color 0.22s ease;
    }

    .launch-option:hover {
      border-color: rgba(212, 190, 152, 0.58);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
      transform: translateY(-2px);
    }

    .launch-option:hover::before {
      border-color: rgba(212, 190, 152, 0.24);
    }

    .launch-option:active {
      transform: translateY(0) scale(0.992);
    }

    .launch-option:focus-visible {
      outline: 1px solid rgba(201, 166, 107, 0.85);
      outline-offset: 3px;
    }

    .launch-glyph {
      width: 64px;
      height: 64px;
      color: #C9A66B;
    }

    .launch-glyph svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .launch-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .launch-orient-name {
      font-size: 22px;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: #F3EFE6;
    }

    .launch-spec {
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 1.95;
      letter-spacing: 0.05em;
      color: #9A9284;
    }

    .launch-note {
      margin-top: 24px;
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #6B655B;
    }

    @media (max-width: 600px) {
      .launch-options {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 26px;
      }

      .launch-option {
        flex-direction: row;
        text-align: left;
        gap: 18px;
        padding: 18px;
      }

      .launch-glyph {
        width: 54px;

  <script>
    const ZHOUYI_BUNDLE = {"gua":{"01":{"id":"01","cnNum":"〇一","name":"乾","pinyin":"qián","fullName":"乾为天","shortFullName":"天天乾","upper":"乾","lower":"乾","upperNature":"天","lowerNature":"天","lines":[1,1,1,1,1,1],"yaoLabels":["初九","九二","九三","九四","九五","上九","用九"],"blocks":{"P":"乾为六十四卦之首。其体六画皆阳，故名之曰乾。阳画作一，取奇数；阴画作二，取偶数，奇偶即阴阳之所由分。“乾下乾上”四字，乃后人为标明卦体而加的注，不是经文。此处之乾，指三画之乾，八经卦之一；下者内体，上者外体。两乾相叠，乃成六画之乾。六十四卦之成，无一例外，都是八个三画卦彼此相重。\n旧说伏羲既画八卦，又重为六十四，相承已久，然无可验证。可断言者，八卦与六十四卦之起，为时极早而已。《周礼·大卜》记三代之易，夏曰《连山》，殷曰《归藏》，周曰《周易》，三书并列，而皆以八者为经、六十四者为别。二易既在《周易》之前，则八卦六十四卦之源，至迟不逾夏代。\n最初只有三画之卦八，每卦表物之一性。乾之三画，所表者健也。八者之性各止于一，亘古不移；而所取之象则甚宽，随地随时而改易：乾之于象，或天或马或首或父或君，都无不可。然而八者终不足以尽天下之事，遂两两相重而为六十四。这一层演进，实即认识由抽象而进于具体：六画之卦，性较切近，象亦较有定准。\n三画之健，犹是一重之健；六画则乾上重乾，健而又健，其性乃至健。象之层面亦然：三画之乾可天可马可父，六画之乾则有所专主。孔子《象传》言“天行健，君子以自强不息”，《序卦传》言“有天地然后万物生焉”，两处合看，可知六画之乾所取者天。天于万物为最阳，于健为最盛。六画之乾，其性即天之纯阳至健；健而益健，此全卦之骨，而六爻之纲也。明乎此，则乾之所以为乾者思过半矣。\n乾之居首，非偶然也，实为殷周之际观念转折之一大标识。母统之重，殷制为然，故其易《归藏》置坤于乾前；父统之重，周制为然，故《周易》反之而乾先坤后。有周一朝之礼法制度，几乎处处寓此先后之意。乾坤之列于诸卦之首，与周人的宇宙论正相应和。\n作《易》者以天地为万物所自出，谓两间所有，唯万物而已。《系辞》云“易与天地准”，其道足以弥纶天地；又云“与天地相似”，“范围天地之化而无过，曲成万物而无遗”。其书该天地而无所不包，故有天道焉，有人道焉，有地道焉。如此则《易》为天地及万物之写照，天地及万物乃《易》所据之底本；盖《易》所摹者，天地之全道，无有遗于其外者也。乾坤取天地之象，天地居万物之先，故其位最尊；屯蒙以下取万物之象，故次之。\n《乾凿度》以乾坤为阴阳之本、万物之祖，其言最当。《系辞传》既拟乾坤于《易》之门，又拟之于缊，语异而指同。读《易》者于乾坤二卦，当具两层眼光：其一，它们是六十四卦中的两卦，自有本卦之义；其二，它们又是诸卦所从出，为众卦之根柢，此层尤不可忽。故读乾一卦，已握六十四卦之枢机；其义既通，诸卦皆可迎刃而解。","G":"乾，元亨利贞。","G.N":"一卦之上，以文字标之，是为乾。符号之设，于《易》最要：苟无其画而仅有其文，则《易》失其为《易》矣。一卦之义，全由六画之配合而见。然画既立而无名以命之，亦不能行于世，故画定而名生，名生而辞系。八经卦之画、六十四别卦之重，果出谁手？古人立说互异，纷然莫衷一是，皆不足以取信。今所能言者，其起于邃古、当原始之世耳。卦名与卦辞之作，旧归文王，其证亦薄，大抵在殷周之间。总之，画者与辞者未必同人，而其时相距甚远，则无可疑者矣。\n卦画之下所系四字，即卦辞也。卦辞又谓之彖，故孔子释卦辞之文曰《彖传》。彖者，断也，谓断其义、括其要。彖辞以最少之字，总一卦之归。诸卦之彖，多假物象以见义，如坤之“元亨利牝马之贞”，取牝马为象；乾之“元亨利贞”，则字面无物，径以抽象之辞出之。\n乾固取象于天，然所取者非天之形，乃天之性。天之性，一字尽之曰健。乾即健也。健之为状，谓天体循轨而行，无一刻之停，无他力能止之、能改之。卦辞之所以用此四字，正为状健。健者，全卦之纲领；四字合而观之为健，分而观之为元、亨、利、贞。\n古人以四时配四字，其说可从，盖四时者天运之显征也。四时代迁，乃天运最显之验；古人于寒暑往复之际，见天之动，见天行之健。《论语》载孔子叹天不言而四时自运、百物自生，正此意也。不径举春夏秋冬而必曰元亨利贞者，盖举四时则健之义为所限；曰元亨利贞，则上可指天时，下可指人事，如仁义礼智四德，以及凡有乾健之义者，皆得以之相摄。四字之所以活而不滞，正在于此。圣人之取象立辞，往往如此：不专系于一事，而后能周于万事。\n以天时言：元当春，一岁之首，物所由生；亨当夏，物所由长；利当秋，物所由成；贞当冬，物所由藏。以修德言：元犹仁，亨犹礼，利犹义，贞犹智。四者各为一义，而脉络相贯，缺一不可，必四者备而后健之全体可见，非可偏举也。\n他卦之辞，亦有具此四字者，然或增字以别之，或有元亨而无贞，或有亨利贞而阙元，或独举元亨，或独举利贞。增损其一，义即不备；义不备，则乾健之实亡。此四字之所以独归诸乾，而他卦不得而假借也。唯乾纯乾纯刚、健之至者，乃能尽此四字而无歉；舍乾而语此，则四字徒为虚设而已。此其所以为乾也。圣人立辞之慎，于此可见；而乾健之义，亦由是而立。","Y1.T":"初九，潜龙勿用。","Y1.N":"乾卦之初爻，其名曰初九。“潜龙勿用”，则其爻辞。爻辞者，释一爻之指者也，与卦辞相为经纬。六十四卦之爻辞，旧有文王、周公二说，今皆无以为定；然谓其与卦辞非一人所作，而先后相去不远，同出于殷周之际，盖近于实。\n就其字而析之，初以标位，九以表爻。卦之六位，画自下起，其首为初，其末为上，其间则为二、三、四、五。初者，位之始也；九者，阳之目也。阳爻而居首位，故系之曰初九。末爻于义当称终，而《易》称上；首爻于义当称下，而《易》称初。此互文相通之法也：首言初，则末自含终；末言上，则首自含下。若首初而末终，末上而首下，则两端之义各止于一，不能兼也。古人属辞，类多如此。\n阳爻之系以九，其源在筮。行筮以四十九策，经分二、挂一、揲四、归奇四节，所余之数不出七、八、九、六。七与九为奇，属阳，得之画阳；六与八为偶，属阴，得之画阴。凡此四节，谓之四营；三变而一爻成，十有八变而一卦具。此筮之所以成卦也。此《周易》所以系九六而不系七八之故也。其法详《系辞传上》。然《周易》阳爻百九十二，皆系九而不系七；阴爻百九十二，皆系六而不系八。何也？九六能变，七八不能变，而《周易》所占者在变爻故也。相传《连山》《归藏》先于《周易》，其所占用不变之爻，疑其阴阳当系七八而不系九六。\n乾之取象于天，而六爻乃取象于龙，与《说卦传》乾为天、震为龙之目不合。此类抵牾，他卦亦多有，读者每以为惑。汉儒创互体、纳甲、爻辰、五行、飞伏诸例以弥缝之，立说愈繁，而窒愈甚。至王弼而其蔽始去。王氏之意，谓取象但求其义之所存：义既主健，虽舍马可也；爻既取顺，虽舍牛可也。象者，达意之具，本无定执。卦者，一时之局也。乾之为时，其德为健，即所谓元亨利贞，故取象于天。爻者，一时之中之一节，变动不居，本属动态。乾之六爻，欲于动中见健，则必也有升有降，有上下，有小大，有潜有见，有跃有飞，其变乃周。孰能如是？马不能，天亦不能，能之者唯龙。龙本非实有之物，出于人意所造，目不得见，故其贵无上；以之状乾之六爻，最为切合。故曰象者活物，死执之则失之矣。观象而求其义，义既得，则象可忘也。执象以疑义，则终身不解矣。盖象之为用，止于达意；义得则象可忘，《易》之通义然也。\n“初九，潜龙勿用”。潜，藏也。勿用，谓不施为。初九之象，阳在卦下。阳道将萌而未萌，故譬之于蛰龙：欲动而不能，亦不宜于动。人之当此，惟有晦处以俟时，未可轻有施为。","Y2.T":"九二，见龙在田，利见大人。","Y2.N":"见，读为现。田，地之表也。六位配三才：五与上属于天，三与四属之人，初与二属之地。二居地位之尽，其上即田，故九二之辞曰“见龙在田”。龙至是已去潜出隐，见于地上，正属施为见效之候。自天时言，阳气之伏者已升而出地，万物将苏；以人言之，此爻刚而不过，居下体之中，是大人之象也。凡称大人，必德位两备者当之；九二无君位而有君德，故亦得此称。\n乾与他卦有一异：他卦往往一爻一象，一爻当一人；乾则六爻共此一象，自潜至亢，所状皆一龙；其所当之人亦只一人，自“勿用”以至“有悔”，皆一人历时而境遇屡迁，表现屡易。龙为贵物，所当者非常人，而又得中，故名之曰大人。大人之德既成而出，其泽必下逮于天下，天下皆愿见之，故曰“利见大人”。","Y3.T":"九三，君子终日乾乾，夕惕若，厉，无咎。","Y3.N":"三而以阳居之，故曰九三。三于位不中，故不以大人称；九三以阳处阳，位得其正，故系以君子之称。位有阴阳：初、三、五皆奇，其位为阳；二、四皆偶，其位为阴。阳居阳、阴居阴者为正，反是则不正。得正为善，失正为不善。初与上处卦之两端，位非其位，正不正无所施。二与五皆得中，中之重于正也久矣；中而且正，斯为最美；即令不正，亦可以中而取之。至于三与四，一卦之得失系焉，正不正所关尤切。\n九三阳居阳而得正，此其能“终日乾乾，夕惕若，厉，无咎”之故也。终日乾乾者，自朝至暮戒惧自强，不肯少懈；夕惕若者，日入犹怀忧惧，不敢自宽。若，语辞；厉，危也。九三居下体之上，正当多凶之地，本宜有咎；唯其刚健得正，昼既乾乾，夕复惕惧，故咎可转而归于无。","Y4.T":"九四，或跃在渊，无咎。","Y4.N":"四而以阳居之，故曰九四。五位为君，四与之邻，处乎危疑之区；九为阳而处阴，尤当谨畏，未可妄动。可进则进，不可则退，迟速一听于时，故有龙或跃或止于渊之象。或者，不定之辞。跃者，踊而起也。跃异于飞：飞则去渊，跃则飞之先声，欲飞而未飞者也。渊者，水之最深，龙之所宅也。或跃而出，或留于渊，二者何从，视时与势而后决。九四能之。以阳居阴，于位不正，此其短；然亦有其长：阳主进，阴主退，阳而在阴，正可随宜进退。四又处上体之初，方下体既终而上体方始，正变革之地，其进退亦未定也。既能量时而后动，见可而后趋，咎安从生。","Y5.T":"九五，飞龙在天，利见大人。","Y5.N":"五而以阳居之，故曰九五。此爻也，性刚而体健，位居乎中，又得其正，而所居者为君位，六十四卦之中，求其兼备如此者，盖未有先之者也。然在乾则又有进焉。乾之体，纯阳而无杂，其至健也；故其九五，刚健之中又有其纯，中正之中又有其粹。刚健中正，纯粹以精，德与位两得，是阳气自下而升，至是而极于天；龙亦如是：始潜，继见，继惕，继跃，而今飞矣。以人言之，则德崇位尊，刚健中正而纯粹，已造圣人之域。圣人者，君子大人中之至高明者也，其养、其智、其才、其位，足以应万变而有余，譬犹龙之在天，高洁自由，云雷风雨交作于下，天下咸被其利。如是之大人，正天下所愿见也。","Y6.T":"上九，亢龙有悔。","Y6.N":"上而以阳居之，故曰上九。末位曰上，六画尽于此。位至于极，事至于终，时已过中，故视初爻为逊。故位在初者多获免，位在上者每难救，其势然也。\n卦之上爻，善不善皆由积微而盛，由盛而穷，穷则当变。盖有终古不变者，亦有势不容不变者。不善而极则将反于善，爻辞示人以促成之方；善而极则将反于不善，爻辞示人以保守之径。其效或吉或凶，或悔或吝，爻辞皆予简明之断。必成者直系以吉，必败者直系以凶。其成败未判、系乎人之自为者，过而知改则系以有悔，过而不改则系以吝。悔者吉之先也，有过而知改，有弊而知去，其势可趋于善；吝者凶之本也，有过而不改，有弊而不除，其势必陷于恶。\n是故上爻之义大抵易知，不若他爻之一爻数义、难于究诘。然亦当知：上爻之属悔、属吝者，辞多不明言悔吝，其旨每寓于所取之象中，是在读者自得之耳。\n乾之上九“亢龙有悔”，辞意昭然，尤易晓。亢者，过也。九五飞龙在天，龙之位已极高，阳之气已极盛，刚健中正，无可复加。及乎上九，龙已亢，阳已过，正当止进就退之时；于此犹进而不退，则必转而之反面，此悔之所由来。有悔者，事已有失而犹可图，行已有愆而犹可改。亢者上九之境地，悔者上九之修持。上九之所以可救，全赖此一悔。能悔，则识时而知变，乾道遂不至终亢。此上爻之所以独重乎悔也，读《易》者所宜深察。","Y7.T":"用九，见群龙无首，吉。","Y7.N":"六爻既毕，乾系“用九”，坤系“用六”，此二卦之所以异于他卦也。乾之“用九”，谓六爻皆取九而不用七；坤之“用六”，则六爻尽六而无取于八。\n七、八、九、六果何物乎？卦成于筮。揲蓍用策四十九，历四营、三变而余一数，其数不出四者：非七即八，非八即九，非九即六。九与七为奇，属阳，得之画阳；六与八为偶，属阴，得之画阴。如是者六，而六爻具，一卦成。九与七同为阳爻，然九为变，七不变；六与八同为阴爻，然六为变，八不变。就成卦言之，变与不变无以异；就占言之，则相去甚远。及其既成而筮，则视其变者以为断，不变者置而勿问。如乾之六阳，孰九孰七，初无定数；《易》则以九占，不以七占，以九变而七不变耳。\n所谓变者，其爻虽阳，势将化阴；虽阴，势将化阳。变与不变，何以分属此四数？其故在于古人之数观。数之推移，乃质与量互转之过程。阳以进为道，阴以退为道；故老阳为九，老阴为六，少阳为七，少阴为八。盖阳数以九为极，阴数以六为极，极则老矣；物之老，未有不变其质者。阳之性主进，九既老，进无可进，势不得不退，退则成八，阳遂为阴。阴之性主退，六既老，退无可退，势不得不进，进则成七，阴遂为阳。九、六之化，越其类而反其性，是为质变，故系之以变爻。七犹未老，可进而未进，进则为九，其阳自若；八犹未老，可退而未退，退则为六，其阴自若。七、八之迁，仅进而益进、退而益退，未离其类，是为量变，故不谓之变爻。\n明乎此四数之别，又明乎九、六能变而七、八不能，与夫《周易》占变不占不变，则“用九”之义可得而说。乾之筮也，六阳或尽得九而无七。九既为变，必化而为六，是全卦竟转为坤矣。然其为坤，固非坤之本相；其为乾，又已将化为坤。于此可见作《易》者既怀乾坤阴阳相对之见，又怀乾坤阴阳互转之见。欲显乾中有坤、坤中有乾、乾坤终始相生之理，乃于乾之六爻之后巧缀“用九”二字，而系之曰“见群龙无首，吉”。此辞也，兼有乾之性与坤之性。朱子之解，谓其尽变而刚济以柔，最得此爻之旨。“见群龙”三字，状阳德之纯、刚健之至也；“无首”二字，状阴德之顺、柔顺之极也。以健为体而以顺为用，健而不失乎顺，吉固其所也。程子则解“无首”为不以己为首，谓刚健之才当使天下推之，而不当自据其首，其义亦通。\n要之，此四字之训，与今人所云者，名是而旨非。六十四卦皆有六爻俱变之事，而“用九”“用六”独系于乾坤，何也？乾坤为《易》之门，乾坤之义明，则诸卦有所统。又二卦之体纯而不杂，六爻俱变，所变者仍归于一，故可总举而名之。其余六十二卦阴阳错杂，虽六爻尽变，其变也驳而不纯，故不得以“用九”“用六”称之。","T":"彖曰：大哉乾元，万物资始，乃统天。云行雨施，品物流形，大明终始，六位时成，时乘六龙以御天。乾道变化，各正性命，保合太和，乃利贞。首出庶物，万国咸宁。","T.N":"“《彖》曰”之称，非其旧也。古本皆作“《彖传》曰”，刻者省文，乃去其一字。卦下所系之辞即是彖，故孔子释此辞之文得名《彖传》。孔子赞《易》，为篇十，为种七，《彖传》其一也。十篇者，世称“十翼”：上彖、下彖、上象、下象、上系、下系、文言、说卦、序卦、杂卦，其序如此。《艺文志》所记《易经》十二篇，正二经与十翼之合数也。是知汉世官本，传附经后而各自为卷，未尝掺而一之。\n其始乱之者，费直也。费氏传古文《易》，取《彖》《象》置于每卦之末，经传之界遂移。东汉之末，郑玄、王弼先后为《易》作注，所用即费氏本。二人既承其例，又欲使读者易晓，乃更进一步，以《彖传》缀于卦辞之下，以《象传》缀于《彖传》之后及诸爻爻辞之下，经与传遂混而为一。费直所授，犹只以彖象列于一卦辞爻既毕之后；郑、王则分之各系其处。独乾卦尚存费氏旧第，《彖》《象》与《文言》皆在全卦经文之后，不与卦爻辞相属。\n《彖传》者，释卦辞之书也。其释之序，大抵先名而后辞，凡以明一卦之义而已。释名之据有三：曰象，曰德，曰体。三者或兼或偏，初无定例。释名之句，首出者尤要，余皆缘之而发。至其释辞，体例亦不画一：或依卦名之义而推衍之，或杂取象德体以说之，甚且名与辞牵混而难分。此不足异，卦名与卦辞本自相贯通，其义一也，故释名释辞，往往互为表里。八纯卦者，乾坤坎离震艮巽兑是也；其中唯坎一卦兼释名，其余七者所释止于辞。乾之《彖传》即不辨卦名，径就其下四字而解之。\n乾之取象为天，卦辞初未之及；孔子推天道以说乾，而其象始著。然乾之象天，非即天也。天指其形体，乾指其性。天之所以为天者健也；不息之健，即所谓乾。名二而实一。天既有健之性，故乾可为天；虽然，健之性非天所独，故乾之所象亦不限于天，而阳、父、君、马皆得而称焉。\n取象何以独取天？盖具健之性者，天为其至大，举天而众物尽摄其中。尤有进者：万物之所由始者惟天，他物虽健而非始。故孔子即以此语状乾元之盛。\n“乾元”者，一义而非二义，谓乾之元，非乾与元并列也。乾之元，即四字中之元。不单言元而必系于乾，正以见其为乾之元而非他物之元；唯乾之元，乃有万物资始、统天之效。元之训，为始为大，指物之初生而言：物非此则无所资以有其始。“乃统天”三字，虽只道一元字，而天地生物之序已尽在其中：有春之发生，而后有夏之长、秋之成、冬之藏。《序卦传》谓有天地乃有万物，与此正相表里：天地为物始，乾坤为卦祖，未有乾而诸卦可得而自生者也。\n“云行雨施，品物流形”，释卦辞之亨也。四者之中，元也、利也、贞也皆有明文可指，而亨独无专释之语；循文求义，此二语之释亨，断然可见。然此亨非泛然凡物之亨，乃乾之亨也。谓乾元既生万物，物遂入于长养之期，天道之行无不通畅，而见之于云雨、形品之间。“云行雨施”主乎气，气者物之质，故为气之亨；“品物流形”主乎形，形者物之貌，故为形之亨。物受资于天，质与形俱立，遂各依其类而分，可以按而别之。流者，如水之流；流形云者，谓自其动处观物之形，形在生生不息之中，既成而未尝凝滞。品物即万物，而不曰万物者，正欲著其分类别形之意。\n右数语皆言天道，而此三句则由天以及人。《彖传》之体，例先象与天道，而后及于人事；盖即天道以论人事，复由人事以见天道，二者本相一致，故言象言天之后，必归之于人。此三句所告者，乃人所以用乾之元亨也。“大明终始”者，欲人于乾道之终始见得分明：元非常住，必终于贞；贞非断灭，即元之复起。又当知六爻之动，一一以时为准：可潜而潜，可见而见，可惕而惕，可跃而跃，可飞而飞，可亢而亢，未尝有一毫成心于其间。六龙之变，一言以蔽之，时而已矣。明乎此，则可以“御天”。所谓御天，谓执此道以驭之，而施之于人伦日用之常。前文之“统天”，言乾具四德，一元足以统贯之，是就乾之体言；此之“御天”，则就乾之用言，谓人当执此道以施于事。\n“乾道变化”以下，若专为利贞而发，其实元亨亦在其中。盖所云者，正谓乾道之变如何而后“乃利贞”；既涉乾道之变，则元亨岂能外之？乾道、乾元，名异而实同，皆主乎变。自其变之所始言之，谓之乾元；自元递进，以至于贞，贞尽则元又生，循环而无端。乾道所陈，亦此四者相生之序，而不称乾元者，所重不在端始，而在其全过程耳。\n“变化”二字，古今异义。今人合为一词，古人则析为二：渐移者谓之变，积渐而至于改质者谓之化。“乾道变化”，历元亨之段，至是而“各正性命，保合太和”，利贞乃成，而全功告毕。\n乾道行至利之候，万物将趋于成，当此之时，物各得其所具之性命、所值之地位与其存在之价值，是谓各得其正。此利之候也。性命二字联为一词，所指则一，盖即凡物凡人所由以成其为此物此人者也。羽者、鳞者、动者、植者，其类至殊，皆缘所禀之性命本不同耳。古人析之曰：道分而命立，一形而性成。《大戴记》与《中庸》皆尝言之。命与性，本一体而两称，特所从观者异耳。所谓道，指气之流衍、生而不穷者，今人所谓自然律者是也。一者，一个、一类之谓。自其出于自然所赋者言，则谓之命；自其为此物此类所以异于彼物彼类者言，则谓之性。性者命之性，出于天而不出于人；命则寓于性中，千态万状，未可以一例齐之。\n“各正性命”云者，既许世界之统一，又许万物之差殊，信一切存在皆有其理，一切相与皆得其和。然物虽长成定形，犹未充、未熟，必更有“贞”之一境。譬如一稻，历夏日照润，已结实矣，而颗粒未满，必待培养凝蓄，至可获之候，其生长之程乃完。此即所谓贞。贞非止息之谓，正所以为后元之地；贞而不已，元乃复生。\n《彖传》释贞，取“保合太和”为说。保合者，谓也；太和者，宾也。太和是气，气者抽象之存在，目不可见，而实即物质，古人拟之为气而字之曰太和。此气者，天地絪缊所成，阴阳交会所凝，冲融而无乖戾，故被以“太和”之名。所谓乾道变化、各正性命，究其实非他，正此气之变化、此气之各正性命耳。及贞之候，则贵乎保合：保者常存，合者常和。气运不已而无所乖戾，物赖以生赖以成；至是则护持而勿失，融合而勿离，久而不散，圆满充塞，无毫发之憾，贞之谓也。即此一段，可见《易》家发展之见：于万物之差殊最所留意，于世界之和洽尤再三致意。\n“乾道变化”以下诸句，皆言天道、言自然之律；此二句乃言人之所以法天而致之用，即用《易》之事也。“乾道变化”至“乃利贞”，言乾道之利贞；此二句，则言以乾道之利贞施于人事，是人之利贞也。\n观“首出庶物，万国咸宁”之语，可知所指在治人者，在圣人，在大人物，而非庶民。有国有天下者，宜取乾道之利贞以为则，居上而物自归，不蕲宁而宁自至。庶物犹万物也。自然界中，物各正其性命，各有所归，皆乾道变化自然之效，初无主宰者存于其间，亦无须有此。移之于人事，则圣人法“各正性命”之意以“首出庶物”，为天下长而已，非以主宰自居；制作非无，然皆顺物之自然，不强人所难。此与“用九”之辞所谓“见群龙无首，吉”者正合；所谓无首，谓不肯以己据首出之名。\n然则“首出”云者，其归趣仍在“无首”也。六位之龙，其隐其显，其危其安，其腾其极，无一不系于时；非唯飞然：潜亦出也，见亦出也，六位之中，位位皆有出。其出也，顺乎天而因乎时，非有所矫拂而然。二语之指，归于一揆：皆戒夫人之自为首耳。\n“保合太和”者，“乾道变化，各正性命”之所致，即四德之贞。物至此时而成熟已极，太和之气历长久之运而圆满具足。推之于世，其理不异：圣人在上而不自表异，任万国各安其分，则争端自息，天下自和。于此可见《易》家一可注意之政治理想：所求者，社会之和洽与理性之统一也。","X":"象曰：天行健，君子以自强不息。","X.N":"右为《象传》。其目有二：“大象”统全卦而立义，次《彖传》之后；“小象”随爻而释，分系于六爻爻辞之下。二体虽同为全卦而发，其法度则迥别。\n《彖传》释名，或据象，或据德，或据体，初无定式；“大象”则专取上下二体，卦德卦体皆置不问。“大象”之立言也，专就人事，而未尝及于天道；《彖传》则必自天道推及人事。《彖传》所陈人事，主于效动趋时，各有专属；“大象”所设，则多系于先王、大人、后、君子，或与《彖传》相发，或别出一义而了不相蒙，大抵孔子借以申易理、施于人事者。\n“大象”之辞极有法度，六十四卦几同一格：前标上下二象与卦名，后示所当为与其所以为之方。其前一层，八纯卦与他卦不同，上经四纯与下经四纯又不同。上经四纯之词，体居其先：乾、坤、坎、离，所系者天行、地势、水洊至、明两作；下经四纯，则用居其先：震、艮、巽、兑，所系者洊雷、兼山、随风、丽泽。\n至于乾坤，其例又殊。他卦皆著一“重”字，明其两体相叠；乾坤则不著重，不云重天、重地。天岂可叠？一而已足，故但曰天行。地亦只一，不可得重，故但曰地势。坤曰“地势坤”，犹举卦名；乾曰“天行健”，则舍名而举德。行者，道也；天行，犹言天道。天道之要，在健。德既在健，名义相即，遂舍乾而标健焉。所谓健，谓其运而不穷也。天体之行，四时代序，昼夜相推，历年千百而未有穷已，亦未有愆忒，健之至也。君子之于健也，取以为则，故自策自励而无时或已。盖其德与天同出，无须借力于外而能自行。息者，止也；不息，即不已。所谓君子，谓有德而居位者，通天子、诸侯、大夫、士而为首；故“大象”之称君子，实赅有职之人。所云先王，盖指开国垂统者；所云后，则诸侯之君耳。","Y1.X":"潜龙勿用，阳在下也。","Y1.XN":"“小象”六节，具于此下；其体随爻为释，与《文言》之浑沦者异。然其说多疏，未若《文言传》之探赜索隐，抉发精微。此六条本当冠以“《象》曰”二字，以别于后文之《文言》。“阳”以释龙，“下”以释潜。爻辞取龙为象，其义颇奇，“小象”虑读者不解，故曰“阳在下”，明爻辞所云之龙，实指阳气；阳气未出地上，犹伏于地下也。\n《易》之卦爻辞，未见阴阳二字。“阳在下”见于乾之初，“阴始凝”见于坤之初，阴阳二字于是始入于辞。名既立，则刚柔、健顺、动静、尊卑、大小、奇偶、进退、往来之属，皆由是而显矣。","Y2.X":"见龙在田，德施普也。","Y2.XN":"见，读为现。田，谓地之表。施，犹今语所谓影响。阳气昔伏于地中，今已腾出地表而昭然可见；虽未及乎跃与飞，然阳既在田，圣人既出，天下之人自必普受其化。","Y3.X":"终日乾乾，反复道也。","Y3.XN":"昼则乾乾不已，至夕犹怀惕惧，不肯以一息自宽，此何义也？是即所谓“反复道”也。三之位，居二体之介，其途有二：可上可下。其动不出二途：由高趋下为反，由下跻上为复。两途循环，所履者一辙而已。易道之变，千转万移，而非漫无纪律，究其极，亦往复于斯道耳。自然之象，足以显此义者，莫如昼夜之代。君子终日乾乾，朝惕夕厉，亦犹盘旋此道而未曾止息。","Y4.X":"或跃在渊，进无咎也。","Y4.XN":"四之位，当二体之交，进退未有定也。其辞曰“或跃在渊”，则或腾而去，或留而处，二者皆听其自择。然其位宜于有为而进，故“小象”曰“进无咎”。爻辞虑其不量时宜而躁进，乃著一“或”字以存疑。","Y5.X":"飞龙在天，大人造也。","Y5.XN":"“小象”之例，以“大人”当爻辞之“龙”，以“造”当爻辞之“飞”；所谓“大人造”，犹云飞龙之在天也。九五之大人与九二异：九二具君德而无君位，九五则德与位兼之。至其云“造”，则谓体乾之健，不循细行，而措施及于天下，圣人分内之事也。","Y6.X":"亢龙有悔，盈不可久也。","Y6.XN":"自初九潜藏以至九五飞天，爻进而善亦进；及乎上九而亢，亢者过也，亦盈也。不独境遇亢，其心亦亢。善既过度，则必趋坏，此“有悔”之所由。“有悔”兼二义：一则其势将坏，一则其心知悔。","Y7.X":"用九，天德不可为首也。","Y7.XN":"揲蓍之际，乾之六爻若尽得九而无七，则九为变爻，当化而为六，全卦遂转为坤。是乾也而将变坤，既变坤而实未尝离乾，此即所谓“用九”。六爻皆九，故谓之天德。天德者，至粹至纯，无纤芥之疵，善之极而无以复加者也。其为德也全，其为准也无偶，不若刚柔仁义之倚于一偏；唯其无偶，故不能为首。譬诸动静阴阳，互为始终，孰先孰后，本不可分。“用九”既是天德，又当乾坤递转之会，其不可为首也明矣。人之处此，慎勿自居人首。自居为首，人反不以为首；唯不自居，乃能实为人首。然此唯具天德者能之，寻常庸众，固未足与论为首与否。","W1":"文言曰：元者善之长也，亨者嘉之会也，利者义之和也，贞者事之干也。君子体仁，足以长人，嘉会足以合礼，利物足以和义，贞固足以干事。君子行此四德者，故曰乾元亨利贞。","W1.N":"自“《文言》曰”以下迄于篇末，皆《文言》之文。《文言》为十翼之一。十翼之中，独乾坤二卦有此，他卦无之。其故盖在乾坤为《易》之缊、之门户、之根柢，六十二卦莫非自二卦而出；以其关系至重，故不惮反复申说，且借以为学《易》者之式，使人知读《易》当如是。至“文言”二字之义，刘瓛谓依文而言其理，故以立名，是否果当，未敢定也。要之，《文言》者，专为释乾坤而作。其中屡见“何谓也”“子曰”之文，疑是孔子答弟子之问，而弟子录之，与《论语》之体裁正相似。其书虽非孔子手笔，而所陈之义必出于孔子，即径以为孔子之作，亦无不可。\n上所引者，穆姜之辞，《左传》襄公九年载之。穆姜之为此言，先于孔子之生。孔子为弟子讲“乾元亨利贞”，举其语以相证，弟子因录之。穆姜所言，大抵当世通行之旧说，非其一人之创解。于此可见以义理解《易》，其来甚早，孔子之前已有之；而孔子《易传》所发挥者，本书中所固有，非凭虚而造。然则《易传》之义，固在《易》之中，亦在孔子之身，两面俱可说得。\n“元亨利贞”四字，初时或一见而可解；自周初以至春秋，历时二百余年，至是乃须疏说，穆姜之论由是而作。其后穆姜之语亦渐不可晓，注疏之事又起。元者，始也，大也。凡善之所自起，皆得谓之元，故元为众善之长。春者，善之长之最著者也，万物之生，未有不自春始。亨者，通也；嘉者，美也。美之会，犹言美之聚。物既春生，至夏而盛茂，凡善之美者，皆会聚于斯，是为亨。利者，收敛而成熟也。秋至而物敛而成，其气肃杀；然肃杀之中自有宜者在，是之谓义。义之和云者，谓虽当肃杀，而物各有所归，秩然而不乱。以人事言之，利者天下安恬之候，人人各止其所，各修其职。贞者，正而固也。冬则生息闭藏，万善至是而究其成。以人事言之，贞者人之脊干，事之所赖以立者；譬之人身，有定向而不移，有定守而不夺，是也。\n“君子体仁足以长人”以下四句，乃就君子之修养言，与天之四德相配而为说。天有其四德，人亦有其四德。见于天者，四时代嬗是其验；见于人者，仁义礼智当其目。元之在人曰仁：君子以仁为体，凡立身行己，一以仁为本。仁者百行之首，唯体乎仁而以之为先，故能长人，为人之长而统之，此“体仁足以长人”之说也。亨之在人曰礼：礼之为数，至三百三千之繁，而条理秩然，与万物之嘉美会聚者适相类，故曰“嘉会足以合礼”。利之在人曰义：物各得其宜而后和，故曰“利物足以和义”。贞之在人曰智：智者事之干也，守正而不迁，固执而不去，故曰“贞固足以干事”。“君子行此四德者，故曰乾元亨利贞”者，孔子既引前人之说，乃自下断语：谓君子者，行仁义礼智之人也；乾道虽深微难测，人能行此四德，则谓之元亨利贞矣。由孔子此断观之，《易》固兼言天道与人事，而所归终在人事。\n“君子”一称，随世而变，非有定指。其初盖为一阶级之名：诸侯之子谓之公子，天子之子谓之王子，则君子者，君之子也，其为贵族、为治人者，不待辨而明。其相对者，则劳力之小人也。孔颖达则以为居上临民、爱民如子者之通称，自天子以至有采之大夫，皆在其列；是亦以君子归之治人者。然此特得其一偏耳。其后世变，君子于阶级之义之外，复有品格之目：德厚者谓之君子，德薄者谓之小人。《论语》所记“固穷”之叹，正为君子言之；若小人，则一穷而无所不至矣。若君子果专指有位者，则“固穷”之语无所施：有位之人，何由而穷？然则君子之名，兼德与位而言，二者不可偏废，而德尤为本。","W2":"初九曰潜龙勿用，何谓也？子曰，龙德而隐者也。不易乎世，不成乎名，遯世无闷，不见是而无闷，乐则行之，忧则违之，确乎其不可拔，潜龙也。","W2.N":"自此以下，乃就君子观乾之象而以之施于修身者，反复言之，其详且尽如此；质言之，即教人所以学《易》之方也。乾坤二卦之《文言》为此，实欲为后之六十二卦立一楷模，使学者知卦爻之辞虽简，而所含至富，苟徒求之字句之间，必无由入。观乾《文言》之于君子修养再三申说，可知《易》虽兼天道与人道，而其用心终在人道一边。以下多用弟子发问、夫子作答之体，条理分明，大较不难通晓。\n“初九潜龙勿用，何谓也”一节，专释“勿用”之义，语语属人事，未涉天道。“勿用”者，隐也。隐非易事，常人不能；能之者必其有龙德者乎。孔子意中之怀龙德者，君子、大人乃至圣人是也，然亦不尽以此自限，常人而修龙德，固未尝不可。隐之一字，最易招误，人每以为见弃于时、不为世用，故孔子推明之：连用三“不”字、两“无”字、两“则”字，以见隐者非时不我用而我不获用，乃明知时之不可为，遂不为耳。其间“遯”字最要，隐之实，即寓于遯。\n“不易乎世”，遯之初境也，犹为浅层，然亦不可少：必其志其说，不为流俗所摇，邦无道则至死不贰，不肯与世浮沉，而后“不成乎名”可几。“不成乎名”，乃真遯也。到此地位，正如《庄子·逍遥游》所记宋荣子：天下尽誉之而不足以劝，天下尽非之而不足以沮；毁誉在人而不在己，斯为真隐。夫隐遯亦可以得名，而必“不成乎名”者，正以其所为遯者，非欲洁身自好、以清高自标也。\n遯世已难，“遯世无闷”则尤难。遯则孤立于世而人不知，在常人最为苦事；而有龙德者自信不疑，行之如常。“不见是而无闷”，更进一境：遯世犹龙之蛰，人尚知其龙也；今则并其是否龙而不可辨，谓之鱼亦可，谓之蛇亦可。如此而心无所动，其去忘我也几希，疑若与老庄清静无为之教同归。然观下文“乐则行之，忧则违之”二语，则断非道家之说。所谓乐，己心以为乐；所谓忧，己心以为忧。行者，为之；违者，不为也。可乐则出而有为，可忧则伏而无所为，终不肯枉道以徇人。此志坚定，“确乎其不可拔”，非外力所得而夺。是入世之怀，与出世之学迥不相侔。要之，隐非逃世，乃审时也；时可则为，时不可则止。龙德之隐，非以自洁，实以存道于己，待时而后动。后世山林之士，避世而不与事，与圣人之隐，相去远矣。此其所以异也。","W3":"九二曰见龙在田，利见大人，何谓也？子曰，龙德而正中者也。庸言之信，庸言之谨。闲邪存其诚，善世而不伐，德博而化。《易》曰见龙在田，利见大人，君德也。","W3.N":"九二之于初九，同具龙德，而所处之时不同，故其修于己、施于世者亦异，非可以一概而论也。总而论之：九二已去乎隐，而未及乎跃，正当乍见于田之候。六爻莫非龙德，而九二所独者，在得中。谓之“正中”，所重仍在其中。二位属阴，九为阳爻，以阳居阴，于正为不得；然以其处中也，中之为贵，于《易》为最，既得

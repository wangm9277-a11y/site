嫡，妹妹只能从姊而嫁作娣。六三不正，本是妹妹，竟想充作姊姊嫁作嫡。这当然办不到，结果必“反归以娣”。是妹妹，还是要作为妹妹从姊嫁作娣。","Y3.XN":"六三位不当，一个不正的女人要用不正的办法嫁出去，即“归妹以须”，结果行不通，还要“反归以娣”，用其所当用的办法嫁。六三所以会干出这种事情来，关键的问题是它位不当即不正。","Y4.N":"九四爻象与六三有相似之处，九四不正无正应，六三也不正无正应。那么，为什么辞有不同呢？因为六三与九四二爻爻象虽大体相似，却也有所差异。六三以柔居刚又过乎中，九四以刚居柔又未及中。同为不正，以刚居柔好于以柔居刚。同为不中，未及中好于过乎中。九四不正无应，是以过时未嫁；但九四以刚居柔且未及中，过时未嫁是由于有所待，或待得佳配，或待年父母国，不是无人愿娶而难嫁。九四这样的迟归是主动的、有时的，到了该嫁的时候一定嫁，不是无限期的。六三则不然，六三既不正无应，又以柔居刚，又过乎中，是由于难嫁而采取“归妹以须”的不正当办法强嫁。","Y4.XN":"九四之所以推迟嫁期，是出于自己的志愿。为什么志愿愆期呢？是“有待而行”。行，嫁。“有待而行”，有所等待而嫁。总之，愆期决定于九四自己，不决定于他人。","Y5.N":"泰卦六五讲帝乙归妹，此爻又讲帝乙归妹。《周易》一再提及帝乙归妹，说明历史上确有商王帝乙嫁妹之事。六五居尊位，是妹中最为尊贵的，故有“帝乙归妹”之象。古代诸侯一娶九女，有嫡有媵有侄娣，这是制度，即便是帝王也不能违反。帝乙把自己的妹妹下嫁给臣下做侄娣，而不是做嫡夫人。六五这位女子，其高贵的出身，就像帝乙的妹妹，也依礼义的要求嫁与人做娣。“其君之袂，不如其娣之袂良”，它的衣着穿戴比嫡夫人还要好。不过好也要有个限度，娣的衣着穿戴如果超过嫡夫人，就有夺嫡之嫌了，夺嫡必凶。六五虽尊贵但却得中有应，它必安于本分，不会使自己娣的地位高过嫡。犹如“月几望”，月至十五将盈而未盈。所以吉。","Y5.XN":"帝乙嫁妹与人作娣，娣衣着穿戴好过其嫡。这是由于六五位尊得中，以高贵的身份出嫁的缘故。","Y6.N":"归妹卦是讲古代婚嫁中的侄娣制度的，诸爻无不取象侄娣。上六阴虚而无应，故有“女承筐无实，士刲羊无血”之象。筐实羊血都是祭祀必用之物。古代诸侯承先祖奉祭祀，亲自割牲取血，夫人负责筹办苹藻之类盛诸筐篚之中以为祭品。这就是说，在诸侯“一娶九女”的九女之中只有嫡夫人有资格与诸侯共承宗庙祭祀，侄娣是不能参与的。士大夫的情况也大体如此。一般说来，妇人在祭祀时有承事筐篚以奉苹藻的资格，但须是嫡。上六以阴居阴且下无正应，无实而虚，名存而实亡；她作为一个妇人似乎有资格与丈夫一起主持祭祀，然而实际没有资格，因为她是娣不是嫡。她承筐，但筐中无实，是个空筐，不能祭祀。祭祀先人必须夫妇共同进行，她既承筐无实，她的丈夫也就刲羊无血。没有苹藻可供，没有牲血可荐，祭祀根本不能进行。她有丈夫，但妻不是她。她作为一个地位卑贱的娣，处在上六的时候，境遇很不好，她无论干什么或不干什么都无所利。","Y6.XN":"承事一个空筐，像似能奉祭祀，实际上不能。作为一个女人，她有丈夫，但妻子不是她。她的地位卑，而今又处在上六阴柔而虚的时候，所以境遇如此。","Z":"归妹与渐是反对卦。艮下巽上构成渐，即风山渐。渐的中爻皆正。渐取象女归，由女子婚嫁必备六礼，必有一个循序渐进的过程的现象中，抽象出渐的概念。事物的进行要循序渐进，就像女子婚嫁有一个过程合礼那样合理。归妹则由兑下震上构成，即雷泽归妹。归妹中爻皆不正而且柔乘刚。归妹取象归妹，它要说明的道理是极其复杂而难以把握，以至于作《易》者竟未能给它抽象出一个明确的概念来。我们只能说归妹所取之义恰与女归相反。不过作《易》者对两卦的扬抑态度是清楚的。渐卦卦辞许以“女归吉利贞”，女子循序渐进，合礼地嫁人，绝对的吉。归妹卦辞则直书“征凶无攸利”，绝对的凶。表明他认为女子作嫡是正的，合礼的，作侄娣是不正的，违礼的。渐与归妹两卦反映了殷周之际婚姻事实和婚姻观念的变化。群婚制早已为父系的一夫一妻的个体婚制所代替，个体婚制成为婚姻制度的主流。群婚制的残余，作为个体婚制的必要补充，通过一夫多妻的形式，被长久地保留下来。殷代存在一夫多妻现象，周人把一夫多妻现象肯定下来，作为一种礼制加以承认。这就是后人所称的嫡庶制。作《易》者于渐卦取象女归，于归妹卦取象归妹，实际上是对嫡庶制的一种观念上的承认。嫡庶制将女人的婚嫁普遍地划分为两类。嫁作嫡的一类，合礼又合理，自不待言，故渐卦取其渐进之义而已。嫁作庶的一类(嫁与诸侯的又称侄娣)，周人表现出矛盾的心态，故归妹卦辞取谴责意向，认为它先于男又少于男，既失礼又失时，而诸爻爻辞却多有肯定。孔子作《彖传》发明了归妹卦中蕴藏着的深刻意义。孔子指出侄娣制度亦即女子嫁作庶的伟大意义，正确地把这种制度同生育传代联系起来，而生育传代又像天地交感而化生万物那样合情合理。孔子还有未明白说出的意思，即嫡庶制保证男系的生育传代。没有男系的生育传代，何以有嫡长子的继世；没有嫡长子的继世，何以有贵族宗法制的确立；没有贵族宗法制的确立，何以有西周诸政治制度的建构和西周社会的稳定发展。孔子说归妹是天地之大义，是建立在他对《周易》和殷周历史有深刻的理解的基础上的，绝非故作夸张之辞。"},"55":{"P":"《序卦传》说：“得其所归者必大，故受之以丰。丰者大也。”得其所归者必大，这种说法未免牵强。《序卦传》欲将64卦的序列一一找出逻辑联系来的想法是可取的，正确的，许多卦之间的联系确有逻辑性，而有些卦之间的联系显然缺乏必然性，《序卦传》的解释有失牵强，也未足怪。丰这一卦离下震上，震是动，离是明。明可以照，动可以亨。能照能亨，然后足致丰大。","G.N":"丰，盛大。盛大的东西必亨通。但是丰卦说的盛大不是一般的盛大，是无与伦比的盛大，绝对的盛大。只有王所统治的天下够得上盛大。天下之王至尊至贵，天下之财物至富至有，天下之人口至繁至庶，天下之土地至广至大。什么人能够致天下之盛大呢？“王假之”，只有王能够致天下之盛大。盛大的东西有亨的一面，也有忧的一面。月盈则亏，日中则昃，盛大超过极点，必转为衰。盛大之中包含着衰，这是值得忧虑的。然而可以“勿忧”，只要知道“宜日中”，保持“日中”的状态，盛大即可不转为衰。日中即一日之正午。正午时候日光最足最盛最普遍。至此为止，不要超过正午；超过正午，日就偏斜，乃至走向衰落。将这自然的规律引申到人事上来也是一样。统治者的统治盛大到了极点必转为衰落，统治者知道这个道理，务要持盈保泰，不使自己的统治之盛超过极限。由此可见，丰卦讲的不是丰什么，丰是怎样的问题，而是如何致丰保丰的问题。","T.N":"“丰，大也。明以动，故丰。”以卦德解释卦名。丰即盛大。“明以动”\n解释怎样致丰，不是解释什么是丰。“明以动”的“以”字与“而”字不同。“以”与“而”虽都是连接词，用“而”字表明它所连接的两个词一样重要，用“以”字则表明重在前一个词。“明以动”强调的是“明”，“动”是次要的。“明以动”，是以明而动，动之以明，所以致丰。就是说，处丰者必明，昏是绝对不可以的。与“刚以动故壮”之强调“刚”，“顺以说故聚”之强调“顺”，意义是一样的。又丰与噬嗑不同。二卦皆以明动致亨，噬嗑“动而明”，既须动又须明，先动后求明，得明而后可亨。丰卦是明已然存在，无须求，明而后动，不期而亨。\n“王假之，尚大也。勿忧宜日中，宜照天下也”。丰之盛大，唯有王者能够达到。王者统治全天下，所有既大，其保天下治天下之道亦大。故云王者尚大。王者所尚之大，既是所尚之天下社会大，也是所以保天下治天下之道大。王者保天下治天下的根本途径是以盛明普照天下，无所不周，无所不至。怎样才能做到这一点呢？务须保持像“日中”那样的状态，使光照最充足最普遍。日未中，光照不及；日既中则昃，光照愈益不足。唯在日中之时，可常明不昏，常中不昃。此解释卦辞。\n“日中则昃，月盈则食。天地盈虚，与时消息，而况于人乎，况于鬼神乎。”这是孔子在解释卦辞之后，又发明卦辞外之意。所谓卦辞外之意，实为卦辞本有之意，辞未之及而已。经过孔子的发明，原始、朴素、艰涩难懂的卜筮语言，变成具有深刻理论意义的哲学思考了。孔子由卦辞“宜日中”一语联想到“日中则昃，月盈则食”的自然现象。日至中而盛极，盛极即将昃昳；月至望日而满盈，满盈即将亏缺。孔子把人们习见的日月盛衰盈亏的现象作为自然的规律提出来。接着指出盈虚变化乃是天地间的普遍性规律，不是日月特有的现象，即所谓“天地盈虚，与时消息”。整个天地，整个自然界，都处在盈虚盛衰的不断变化中，所有的变化都是“与时消息”，以时为进退的，时间决定变化的性质，时间是变化的基本条件。孔子根据这一卦的卦辞，得出一个深刻的辩证法结论，给一个比较具体的命题赋予了一般的意义，实在不简单。\n“而况于人乎”，天地尚且“与时消息”，何况人呢，人也必当如此。这就涉及到中国古代哲学中的天人关系问题。古人总是把人类社会同自然界联系起来，认为天与人是合一的。自然界有什么样的规律，人类社会也应当有什么样的规律，因此人应当顺应自然。在顺应自然的问题上，道家的主张是绝对的，因为道家过分强调人是自然的一部分，泯灭人的主体性。儒家则尽可能地把人从自然界中分离出来，比较强调人对自然的主体性意义，因此儒家既重视自然对人的制约作用，主张人必须顺应自然，也反映出人应当改造自然的主体意识。古人讲到自然的时候，使用的是“天”这个概念。古人使用“天”这个概念，含义很复杂，我们不宜一概而论。一般说，统治阶级在政治意义上使用“天”概念的时候，“天”是超自然的，神秘的，是有意识的主宰。而在古代讲理论的学者那里，“天”即自然，即独立于人的意识之外的广大自然界。道家和儒家讲的天，都属于后一种含义。孔子《彖传》所说“天地盈虚”的天，连同那个地，所指显然是自然界。\n“况于鬼神乎”的鬼神，也不是宗教观念中的那个超自然的神秘之物。这个鬼神是什么，宋人讲的很清楚。程颐说是“造化之迹”，张载认为是阴阳“二气之良能”，朱熹说“天地举全体而言，鬼神指其功用之迹，似有人所为者。”依他们的看法，天地变化多端，万物生生不已，神奇难测，却又有轨有迹，像似有人暗中主宰着，其实又没有。这看不见但可以觉察到的无形无体的东西，《周易》称之曰鬼神。鬼神其实就是今日我们说的不依人的意志为转移的客观规律。宋人的理解是正确的。他们的认识代表着整个儒家的观点。儒学不相信有什么超自然并主宰自然的鬼神存在。","X.N":"丰卦离下震上，震为雷，离为火，故曰雷火丰。孔子这里讲“雷电皆至”，电指什么呢？电是离。《周易》的八经卦有各自的性质，如乾的性质是健，坤的性质是顺，震的性质是动，离的性质是丽，这性质是不变的。乾的性质无论在什么情况下都是健，离的性质无论在什么情况下都是丽。八经卦的取象则是灵活不定的。乾可以象天也可以象马，离可以象火也可以象曰象电。离既象火象电都可以，这里离取象电更合适些，所以说“雷电皆至”。孔子以为君子观“雷电皆至”之象，可以用以“折狱致刑”。折狱，审判案件；致刑，动用刑罚。审判案件最要紧的是明察虚实，了解情况。动用刑罚则必须轻重适中而不滥。电是明照，明照正合于折狱。雷是威断，威断恰宜于致刑。“雷电皆至丰”与“电雷噬嗑”(“雷电噬嗑”应为“电雷噬嗑”)有所不同。“电雷噬嗑”，明照在先，威动于后，是先解决立法的问题，故云“明罚敕法”。“雷电皆至丰”，威在上，明在下，是实际应用法律以断狱，故云“折狱致刑”。","Y1.N":"配主指九四。旬，均。尚，嘉尚。初九不言丰，因为初九还没有达到丰的程度。“遇其配主”，初九把九四看作自己的配主，自己的伙伴，正想前往相从，与之合作，共同达到丰的目的。“虽旬无咎，往有尚”，虽然初九与九四都是阳刚之才，是敌应的关系，但是却能够相从以合作，共同努力以致丰。初九这样做不但没有过咎，而且是值得嘉尚的。为什么初九与九四都是阳刚，是敌应关系，却能够相从合作而无咎呢？别的卦爻取刚柔相应，丰卦取明动相资。初九是明之初，九四是动之初。因为明与动相资，所以初九与九四相资，相资则不相应也相应了。","Y1.XN":"初九与九四都是阳刚，保持均势状态为好，可以无咎。初九倘若欲超过九四，破坏与九四的均势，就有灾了。","Y2.N":"蔀，蒙蔽。丰其蔀，当丰的时候，本应是光明的，然而光明却受到蒙蔽。六二居中得正，是离卦之主，有日中之象。斗是北斗星，卦中指六五。日中见斗，是说六二与六五的关系。六二本在日中，正是光明灿烂的白天，却看见了只有在夜间才能看见的北斗，说明白天变成了黑夜，光明被昏暗障蔽了。六五以阴柔居尊位，是个昏暗之君。六二往从于六五，必遭猜疑忌疾。六二唯一的办法是“有孚发若”，以自己的一片至诚之心，以求六五的感悟，六五感悟了，则障去疑消，疑疾变成信任，结果还是吉的。六二之所以有“日中见斗，往得疑疾”之象，主要在于明动不相资。六二乃离明之主，居中得正，是处明而能明的，六五居动之体，阴柔不正，是居动却不能动的。一个能明，一个不能动，是明动不相资。明动不相资，故不能成其丰。不能成其丰，故有“日中见斗”之象。不过六二毕竟是离明之主，有中正之才，它能够以“有孚发若”的精神克服“往得疑疾”的困境而最终得吉。","Y2.XN":"六二以自己的诚信，感发六五的心志。假若感发成功，则吉。六二虚中，故有孚，六五也虚中，故可发。六二以诚信感发六五之心志，能够成功。","Y3.N":"沛即旆，遮蔽之物。沫，极小的无名小星。丰其沛，日中见沫，情况比六二丰其蔀，日中见斗更严重。六二丰其蔀，好像日未全蚀，仅能看见北斗星，九三丰其沛，好像日全蚀了，连无名的小星也看得见，光明已完全被昏暗所代替。九三以阳刚居明体之上又得正，本应是能明的，何以所遭遇之昏暗甚于六二和九四？关键的问题是上六不能与之相资。明与动相资方可成丰，九三与上六正应，但是上六阴柔处在无位之地，又在震之终，震之终则止，干脆不能动了。明而不能动，所以有丰其沛，日中见沫之象。九三以刚阳至明之才处在至昏的境遇，纵欲有所为，无奈其明已伤，也不可有所为了。有所为必有咎，只好“折其右肱”，人作事主要靠右肱，右肱折掉，便无可作为，无可作为则无咎。","Y3.XN":"九三境况不如六二，六二虽丰其蔀，但所遇之六五毕竟居中得正，可以有孚发若，可共济大事，而九三丰其沛，所应之上六，以阴柔居震之极，居动不动，昏昧已甚，九三不可与之共大事。九三知道自己处于这样的境况，绝对不可有所作为了，所以“折其右肱”。","Y4.N":"九四丰其蔀，日中见斗，取象与六二同。九四虽然是阳刚，又是上体震之主，但是它处在大臣的地位，自己不中不正而遇六五阴暗柔弱之君，不可能致其丰大，所以有丰其蔀，日中见斗之象，这是一方面。另一方面，九四与初九都是阳爻又都居初，处在相应的地位，有明动相须的关系。初九有“遇其配主”之象，九四有“遇其夷主”之象。因为它们有明动相资的关系，所以作为明之主的初九求动以为主，在它看来，九四是它的配主；作为动之主的九四求明以为主，在它看来，初九是它的夷主。九四与初九明动相济，正当有为之时，故一“吉”一“往有尚”。\n值得注意的是，九四与六二辞相同，义亦相类，那么二爻究竟有什么不同呢？同是丰蔀见斗，九四因为不中不正，六二则由于居中。九四遇其夷主吉，由于它与初九明动相济，又肯下求初九以为夷主，六二有孚发若吉，则因为它居中。","Y4.XN":"九四与六二之蔀斗皆指六五言。九四丰其蔀，因为它位不当，以阳居阴且在高位，不中不正。日中见斗，因为幽不明，君阴柔而臣不中正，昏暗遮蔽了光明。遇其夷主吉，是由于九四下求于初九，致使阳刚相遇，这本身就是吉的行为。","Y5.N":"丰六爻唯初九与六五不言丰。初九不言丰，以其当丰而尚未丰；六五不言丰，以其居君之位，以得贤为庆，不以自己富有为丰。六五是柔弱之君，在上而阴暗，六二视之为蔀而不往，往则必有疑疾。六二是章美之才，在下而光明，而六五虽阴暗却有柔中之德，能够来致在下章美之才而用之。六五如此，必有福庆美誉而吉。六五是丰卦之主，卦辞所说“王假之”，即指此爻而言。卦义重在以光明普照天下，六五能够担当起这个责任，它本身虽不是明体，却有柔中之德，它善于来致并且借助六二之章美光明之才，达到丰大天下的目标。以中德致丰保丰，恰与卦辞“勿忧宜日中”之义合。","Y5.XN":"六五自己柔暗，却善用章美光明之才以致丰保丰，六五居君位它所致之丰乃天下之丰，它所得之吉，乃天下之吉。丰以天下，吉以天下，故曰有庆。","Y6.N":"上六一爻最为不济，丰六爻唯上六一爻凶。上六与六五本来都有问题，六二与九四之丰其蔀都是六五造成的。六二丰其蔀由于以六五为应，九四丰其蔀由于上承六五。但是六五毕竟有中德，蔽人而终不自蔽，到底有来章之吉。上六则不然，上六正应于九三，造成九三之丰其沛不待言，更严重的是它蔽人又自蔽，故不免于凶，情况与明夷之上六相似。原因在于，它以阴柔之质居丰之终，动之极，又在无位之地，高亢昏暗，自绝于人，自蔽之甚，几乎不可救药。“丰其屋”，丰大自己的住宅，比喻上六亢然自高，志得意满，飞扬跋扈。“蔀其家”，丰其屋的结果怎样呢？不但未使自家门闾高大，反倒把自家障蔽起来，孤立起来。“阙其户，阒其无人”，它深居简出，只知有己，不见有人。它不见有人，人也不见有它，无人与之来往，所以自户窥其室，寂无一人，它陷入了绝对的孤立。见斗见沫，犹有所见，上六昏暗至极，以至于“阙其户，阒其无人”，竟连人也看不见了。“三岁不觌”，三岁，长久，觌，见。上六孤立自蔽，自绝于人，不见有人，亦不为人所见的状况长时期不会改变。陷于自蔽而不能拔，其凶必矣。","Y6.XN":"丰其屋，谓上六处丰之极，高高在上，不交于下，自绝于人，就像在天空飞翔一样。阙其户，阒其无人，这种孤立的局面，完全是由它自己造成的，是它自己把自己“藏”了起来。上六自高自大，自蔽自藏，自致其凶，都是因为丰大太过的缘故。杨雄说“炎炎者灭，隆隆者绝。观雷观火，为盈为实，天收其声，地藏其热，高明之家，鬼瞰其室”，正合丰卦上六之义。","Z":"丰卦诸爻皆以明暗为吉凶。初九、六二、九三三爻都在明体，有明德，所以或吉或无咎。九四、六五、上六三爻都在动体，无明德，以能求明为吉，以不能求明为凶。又，丰卦六爻以明动相资，同德相辅为好，不取阴阳相应。初九与九四都是阳爻，若在它卦，这是敌应的关系，不好。而在丰卦，初九与九四是明动相资，同德相辅，好。九三与上六为阴阳正应，在它卦，这是很好的，而在丰卦则很不好，九三不免于折肱，上六则凶甚。"},"56":{"P":"《序卦传》说：“丰者，大也。穷大者必失其居，故受之以旅。”丰是盛大，旅是羁旅；丰大至于极点，必将失去其所居；失其所居，便成了羁旅之人了。所以丰卦之后次之以旅卦。旅之为卦艮下离上，山止于下，火炎于上，有去其所止而不居之象，又离在外，有丽乎外之象，故曰旅。","G.N":"旅虽失其所居，但未至于困，故可以亨。然而只可以小亨，不可以大亨。从卦才看，旅之所以可小亨，是因为六五是卦主，它以柔得中而顺乎刚。旅之所以不可大亨，是因为处旅困之时须有阳刚中正助于下，方可致大亨，而旅卦没有。小亨而能守旅之正则吉。大亨固然利于贞正，旅小亨，似乎可以苟且失正，其实不然，小亨也须守正道方可得吉。","T.N":"“旅小亨，柔得中乎外而顺乎刚，止而丽乎明，是以小亨旅贞吉也”。此《彖传》未释卦名而专释卦辞。从卦才看，旅之所以“小亨旅贞吉”，关键在于六五这一爻。六五是卦之主，它以柔居于外卦又得中，而且顺乎二刚之间。柔中，在外，顺刚，知处屈以求伸，正合乎旅道的要求。旅卦下体艮止，上体离明，合上下体看，止而丽乎明。止而丽乎明，则能寄寓守正，不之邪暗。旅六五处外，柔中，顺刚，上离下艮，止而丽乎明，故可以小亨，可以旅贞吉。\n“旅之时义大矣哉”。古人安土重迁，把寄居异国，流落他乡看作极严重的事情，天下事都当随时各适其宜，而旅的处境最难把握，旅的意义最难尽知。如果把握得好，一个人可以因旅而兴；把握得不好，一个人可以因旅而亡。所以旅之亨虽小，而孔子却说它“时义大矣哉”。","X.N":"山上有火，艮下离上，止而明，止而不处，有旅象，所以叫做旅。君子观旅之象，处理狱讼，既要明慎用刑又要不留狱。艮下离上，止而明，君子用刑要明而慎。止而不处，君子不留狱。用刑实即判决，留狱是久拖不判。判决要明察审慎，不可草率，但也不应长期拖着不判。","Y1.N":"琐琐，鄙猥琐细。斯，此。六以阴柔之才居旅之始，是意志柔弱，目光短浅，只知养其小体不知养其大体的人。这样的人处在旅困的时候，想的干的完全是眼前小利，身边琐事，不可能有大的作为，不唯于国于民不利，对于自己其实也是一种灾患。初六的这种灾患是它自取的。","Y1.XN":"爻辞讲初六的行为可贱，象辞揭示初六的志意可鄙。行为琐细可贱是由于局促、猥陋、穷迫，一副小人的狭窄心胸造成的。","Y2.N":"六二以阴爻居阴位，得正又处中，有柔顺中正之德。有柔顺之德而处于旅的时候是很好的。柔顺中正，所以能够即次，能够怀资，能够得童仆之贞。次，舍。即次，旅中有住处。资，资财。怀资，身上有钱花。贞，正。得童仆贞，得到童仆的诚心帮助、照顾。一个人羁旅在异国他乡，能够有适当的居处，有足够的钱花，有童仆的真诚帮助、照料，可以说再好不过了。为什么不言吉？人在旅的时候，能免于灾害就算不错了，哪里还谈得上吉！童仆指初六，初六比于六二，初六自己琐琐无大志，而在六二看来却是一个真诚可信赖的童仆。","Y2.XN":"“旅即次，怀其资，得童仆贞”，这三条中“得童仆贞”是重要的。人在旅困中如果能得到一个忠诚服务的童仆的帮助，“旅即次，怀其资”便容易做到，可以终无尤悔。","Y3.N":"厉，危厉，危险。九三以阳居阳，得位，六二以阴居阴，也得位，所以都有次象。九三与六二都得位，都有次象，爻辞却截然相反，六二“旅即次”，旅中得到居住的场所；九三“旅焚其次”，旅中虽有居住场所但被焚掉。六二“得童仆贞”，得到童仆的忠诚帮助；九三“丧其童仆贞”，原有童仆的忠诚帮助，而今却丧失掉了。为什么六二很好，九三很不好呢？这是由于六二柔顺得中谦下，九三过刚居上不得中的缘故。九三既过刚过中，焚次丧仆，其危厉便是必然的了。","Y3.XN":"下，童仆。九三过刚而不中，既有“旅焚其次”之哀伤，又丧其童仆，失掉童仆的忠诚帮助，处境是危历的。人在旅时，本来亲者寡，只有童仆朝夕相与，而今九三刚暴过甚，视童仆如旅人，童仆必也视它如旅人，离之而去。责任在九三，不在童仆。九三“以旅与下”，把童仆视作旅人，因而丧失掉童仆的帮助，乃“其义丧也”。义，道，理。童仆离之而去，是合乎道理的，必然的。","Y4.N":"资，齐，利。资斧，锋利的斧子。九四居柔且在上体之下，用柔能下，这在旅的时候是适宜的，故有“旅于处，得其资斧”之象。“旅于处”，旅于异国他乡，有安身之地。“得其资斧”，得到“资斧”以自卫，不至于受到伤害。这是九四较好的一面。但“旅于处”不如“旅即次”好。“旅即次”，旅居异国，有所次舍，只是临时居留，不能久处，意谓旅居异国的生活是暂时的。“旅于处”，犹如诸侯之寓公或作为人质出疆的臣子，虽不必遭遇大灾，而旅困他乡的生活却长久不能结束。所以，“旅于处”仅仅好于“旅焚其次”而已。况且九四还有不好的一面。九四以阳居阴，居非正位，尽快结束旅困生活的志向不得遂，故“我心不快”。“我”指九四自己。","Y4.XN":"六二以阴居阴，得位，故“旅即次”，九四以阳居阴，未得位，故“旅于处”。未得位即穷处不得志。在穷处不得志的时候，虽然尚可“得其资斧”，不至于遭到伤害，但是心志毕竟不快。","Y5.N":"五在别的卦取君义，在旅卦则不然。人君是不可以旅的，旅则丧失君位，故旅六五不取君义。旅卦六爻中六五是最好的，它有光明柔顺中正之德，恰适合处旅之道，故有“射雉一矢亡，终以誉命”之象。亡如“秦无亡矢遗镞”之亡。射雉虽必费去一矢，但所得毕竟甚多。誉，令誉。命，爵命。“终以誉命”，终必获致令闻和爵命。","Y5.XN":"逮，及。上逮，及于上。六五虽不取君义，却也是代表士大夫获致高位的。上逮，言其地位声望已经很高。","Y6.N":"在旅的时候，以谦下柔和得中为好，而上九刚而不中，所处最高，比九三尤为刚亢，在旅卦六爻中是最不好的。它栖高处亢，正当危地，有鸟巢之象。它又在离体，离为火，有焚象，故曰“鸟焚其巢”。先笑，谓上九初以居他人之上而自喜；后号咷，谓上九终因巢焚而悲。牛，顺物。丧牛，上九丧失至顺之德，刚亢至于极点，故凶。","Y6.XN":"九三“以旅与下”，是视童仆如旅人的意思。上九“以旅在上”，是既处旅时又以尊高自处，骄肆不羁的意思。九三曰“其义丧”，上九曰“其义焚”，二者用意相同。爻辞说“丧牛于易”是什么意思呢？小象释之以“终莫之闻也”，是说上九过刚而高亢，彻底失掉柔顺之性，所得以它得到的必是无可挽回的可悲结局。","Z":"凡卦爻都是阳刚胜阴柔，阳刚总比阴柔为好。但是旅卦则不是这样。旅卦之阴爻胜于阳爻。六二与六五都以柔顺得吉，九三与上九皆因阳刚致凶。六二与六五，以六五为最好，六二次之。九三与上九，上九最凶，九三次之。九四是阳爻，但它以阳居阴，有用柔能下之象，所以“旅于处，得其资斧”，比九三、上九为好。又，旅卦与他卦一样，也以得中为好。六二与六五之所以吉，不唯由于是阴爻，还由于它们得中。初六虽是阴爻，却“旅琐琐，斯其所取灾”，原因就在于它是处不得中而卑以自辱的人。九三与上九之所以获厉致凶，是因为它们既是阳刚之爻又处高居上，其位不中。二、五柔顺而得中，最好。初六虽柔顺却不中，故不好。可见《易》是贵中的，贵中在《易》里具有普遍意义，贵柔则是有条件的，不是普遍的。"},"57":{"P":"《序卦传》说：“旅而无所容，故受之以巽。巽者入也。”旅，如同天空之云，水上之萍，飘浮无定，往往无所容纳。然而无所容纳的局面不会永远继续下去，总有一天会有所容纳，故旅卦之后次之以巽卦。巽的意义是入。巽之入不是一般的入，是一阴伏于内，二阳入而散之的入。是阳入而解决阴的问题，不是阴入而解决阳的问题。总之一句话，巽之入是阳入，不是阴入。从入的程度看，巽之入不是皮毛的入，形式的入，而是入于其内，察其细微的入。是深入内里的入，因此卦名曰巽。","G.N":"巽是入的意思。入于事物的内里以解决存在的问题。在自然界，风吹浮云，把积阴吹散；在人的思想，洞察几微，了解内心的隐曲；在国家事物，清除奸慝，扫尽弊端，三者都非深入事物的内里不能解决问题。不过，巽一般是修敝举废，不像蛊卦那样，事物坏极了而加以彻底的更新改造，故曰小亨。于天下之事物，既然已经察知明白，必见诸行动，故曰利有攸往，在行动中须有有刚德之人指导，故曰利见大人。","T.N":"巽卦《彖传》全部是总论卦义的，而用“是以”二字作结。巽之为卦巽下巽上，是为“重巽”。巽为风，风吹万物，无所不入。由自然界看到人事，知人君之发布教令亦如风之鼓吹万物，无所不入。然而风只是鼓吹而已，人君则须先行体察民情物理，然后叮咛告诫之，故曰“申命”。“重巽以申命”，是以小亨。巽卦之上下二巽体，都是阳爻居于二、五之位，一阴爻处在二阳爻之下，这叫做“刚巽乎中正而志行，柔皆顺乎刚”。“刚巽乎中正而志行”，是以“利有所往”。“柔皆顺乎刚”，九二与九五以阳刚处中正之位，初六与六四二阴出而顺从之，是以“利见大人”。","X.N":"随，相继之义。巽下巽上，两风相重，叫做随风巽。随风巽，如风之入物，无所不至，无所不顺。孔子认为君子研究巽这一卦应将随风巽的道理应用在“申命行事”上。“申命”，先行告诫叮咛，使民众相信上命可行当行；“行事”，申命然后见诸行动。君子要做到的先说到，说到的一定做到，则民众百姓从之必如风之迅速。","Y1.N":"巽是申命行事之卦。申命行事，最要紧的是令出必行，或进或退，必有一定，进退不决是绝对不行的。初六阴柔处下承刚而不中，是卑巽太过，志意恐畏，柔懦不决之人，所以，是进是退，不能决断。“利武人之贞”，其所利在武人之贞。假若初六能勉为武人贞固坚强之志，那就好了。","Y1.XN":"疑与治二字相对应。疑，两可不决，主意不定。治，一定不乱，或进或退，无有疑虑。小象指出爻辞所云，主要是志疑志治的问题。初六阴柔处下，有或进或退，志疑不定之象，应用象武人那样贞固勇决以消除疑虑。","Y2.N":"巽，入。床下是阴暗之处，阴邪之物往往隐伏在那里。入于床下，深入到床底下去，把隐伏在那里的见不得光明的阴邪之物察看得清清楚楚，然后着手除掉它们。史巫，据《周礼》记载，史掌卜筮，卜筮占吉凶。巫掌祓禳，祓禳消灾害。纷若是繁复的意思。“用史巫纷若”，就字面看，是说借助史巫的力量消除阴邪灾害，实际上是比喻九二既能“巽在床下”，深入了解掌握问题的真相，又能频繁地申命，周到地行事，亦即采取积极有效的措施加以解决。九二如此认真尽申命行事之道，当然是吉无咎的。","Y2.XN":"九二得吉无咎，是因为它以刚居中，有刚中之德，在纷然众多的申命行事中善于把握中道，不使过或不及。","Y3.N":"巽者入也。但巽之入不是一般的入，是人君申命行事以深入人心的入。频巽，不同于重巽。重巽以申命，虽然三令五申。但申的是一个命，命无更改。频巽则是今日一命，明日一命，纷更无常，使人无所适从。九三如此频巽，屡失屡巽，屡巽屡失，命令不行，所以致吝。","Y3.XN":"小象将九三频巽致吝的原因归咎于志穷。志穷又与志疑不同。志疑是面对不同的选择，拿不准主意，犹豫不决，志疑是可以治救的，它拿不准主意，想办法让它拿准主意就是了。而志穷则是其志虽欲巽，然而毫无实际的办法。志穷是不好治救的。唯致吝而已。九三之所以如此，根本的原因在于它刚而过乎中。","Y4.N":"六四阴柔无援，居四阳之间，承乘皆刚，处境不利，该当有悔。但是，六四也有有利的一面，它上承九五，以阴居阴，依尊履正，自己不是阳刚，却能顺乎阳刚，所以有悔也可以亡。六四与初六同样处于二阳之下，但六四的情况好于初六。初六居重巽之下，犹有进退之疑，六四则居高当位，有用事之功效的。田，田猎。田猎是武事，有兴利除害的意义。所谓三品，古人以为是为干豆为宾客为充庖的三类禽兽，其实三品不必定指哪三品；“田获三品”是田获盛多的意思，解获三狐，此获三品，当是所获者多，不止于狐。","Y4.XN":"有功指田猎有获。田猎有获谓六四申命行事有功。","Y5.N":"九五是巽卦之主，它的根本特点在于一个贞字。它由于贞而吉，而悔亡，而无不利。吉，悔亡，无不利，全由于一个贞字所致。贞是什么？贞即是《彖传》所云“刚巽乎中正而志行”的“中正”。九五在巽卦中是发布命令的，中正对于它是极重要的。因为它本身中正，是以得吉；因为它本身中正，则内无疑心，外无疑事，是以悔亡；因为它本身中正，则所申之命如流水之源，无所不至，故无不利。\n“无初有终”与“先庚三日，后庚三日”讲的是一个道理，应合起来看。庚字在此含两层意义，第一，庚在十天干中居后而且临近终了；第二，庚即变更，更改。三日不是确指三天，是表示相当长一段时间的意思。这两句话总的含义是，国家社会发生弊病，需要改革。要改革就需要制定政策，发布命令。制定改革的政策、命令，应特别注意做到谨慎，不可躁进躁动。先庚即发布改革命令之前要有“三日”即相当长的考虑、酝酿的时间。后庚即发布改革命令之后，要有“三日”即相当长的试行，总结经验的时间。又，巽卦是讲权的，就国家社会说，它讲的是改革，是中兴，不是改朝换代，更不是社会革命，所以叫做“无初有终”。九五在申命行事时如果能够做到先三日后三日，便可获吉。一爻前后二吉字是有区别的。前吉是九五本身固有的，后吉是有条件的，可能实现也可能不实现，关键在于能否做到“先庚三日，后庚三日”。\n本爻“先庚三日，后庚三日”和蛊卦卦辞“先甲三日，后甲三日”，是《易》中极难理解的地方。关于这个问题，古人主要有两种说法。一是郑玄说，一是王弼说。郑玄以为，“甲者造作新令之日。甲前三日，取改过自新，故用辛也。甲后三日，取丁字之义，故用丁也”。朱熹《周易本义》承郑玄说，说：“甲日之始，事之端也。先甲三日，辛也；后甲三日，丁也。”关于先庚后庚，郑说无存，但据其先甲后甲之说推之，其意可知。朱熹《周易本义》说：“庚更也，事之变也。先庚三日，丁也；后庚三日，癸也。丁所以叮咛于其变之前，癸所以揆度于其变之后。”王弼《周易注》说：“甲者创制之令也。创制不可贵之以旧，故先之三日后之三日，使令洽而后乃诛也。”又说：“申命令谓之庚。夫以正齐物，不可卒也。民迷固久，直不可肆也。故先申三日，令著之后，复申三日，然后诛而无咎怨矣。甲庚，皆申命之谓也。”程颐《易传》承王弼说，说：“甲，数之首，事之始也。如辰之甲乙，甲第甲令，皆谓首也，事之端也，治蛊之道，当思虑其先后三日，盖推原先后，为救弊可久之道。先甲谓先于此，究其所以然也。后甲谓后于此，虑其将然也。一日二日至于三日，言虑之深，推之远也。究其所以然，则知救人之道；虑其将然，则知备之之方。善救则前弊可革，善备则后利可久。”又说：“甲者，事之首，庚者变更之首。制作政教之类，则曰甲，举其首也。发号施令之事则云庚，庚犹更也，有所变更也。”又说：“命令之出，有所变更也。无初，始末善也。有终，更之始善也。若已善则何用命也，何用更也。先庚三日，后庚三日吉者，出命更改之道，当如是也。甲者事之端也，庚者变更之始也。十干戊己为中，过中则变，故谓之庚。事之改更，当原始要终，如先甲后甲之义。”上录郑朱与王程二说有根本之不同。前说将甲、庚释为创制或申命之日，将先后三日释为对民众之叮咛宣教，后说则将甲、庚释作创制之命或改制之令，将先后三日释作统治者自己之思前虑后，小心谨慎。又，前说不甚明了甲庚之不同，后说则明确指出甲是创制，是制作政教之类，庚是更改，是发号施令之事。关于这最后一点，《周易折中》所引龚焕之说最为明通可取。龚说：“蛊卦辞言先甲后甲，巽爻辞言先庚后庚。事坏而至蛊，则当复始。甲者事之始，故《彖传》以先甲后甲为终则有始也。事久而有弊，不可以不更，庚者事之变，故巽爻辞以先庚后庚为无初有终也。夫事之坏而新之，是谓终则有始；事之弊而革之，是谓无初有终。终则有始，如创业主君，新一代之法度也。无初有终，如中兴之主，革前朝之弊事也。”王、程之说是正确的，龚焕是申明王、程之说的。","Y5.XN":"正中就是中正，小象为叶韵而倒转。九五之吉，包括爻辞中前后两个吉字。贞吉之吉和先庚后庚之吉，都是由于九五以刚居刚，居中得正所致。","Y6.N":"巽，入。床下，阴邪隐伏之处。巽在床下，表明察之甚深。察之甚深，本是好事，所以九二巽在床下获吉无咎。怎奈上九处巽之穷，以刚居亢位，巽极当变而不知变，欲行九二之道却无九二之时。同是“巽在床下”，在九二为有为之象，在上九则是过巽之举。凡事不当为而为，必过；过则必有失；所以九二“用史巫纷若吉无咎”，而上九竟“丧其资斧贞凶”。资，古本作齐，盖因承旅卦同音而误作资。齐斧，齐物之斧。在此实际上是比喻适时应变行权的能力。居巽极之时，失去刚断，不能行权，固守此道走下去，岂有不凶之理！","Y6.XN":"“巽在床下”，是过于巽之象。上九之所以有“巽在床下”之象，原因就在于它处在全卦之上，巽至于穷极的时候。“丧其资斧，正乎凶也”，上九以刚居亢，处巽之极，失去了应变行权，遇事决断的能力，固守此道走到底，必凶。","Z":"《说卦传》和《序卦传》都说“巽者入也”，而《杂卦传》说“巽伏也”。入和伏并无抵牾，是一致的。巽之为卦是巽下巽上，上下二巽都是二阳在上而一阴在下。从阴的角度说，一阴伏于二阳之下，巽就是伏。从阳的角度说，二阳在一阴之上，必入于阴而制之，巽就是入。阴之伏与阳之入相反相成，互以为用。没有阴之伏，便无阳之入；没有阳之入，也就没有阴之伏。然而巽卦之卦义强调的是入不是伏。《杂卦传》是在同兑卦对照谈巽时才说巽是伏的。兑卦是一阴在二阳之上，阴是见的，而巽卦恰好相反，阴是伏的。然则巽之入是什么意思呢？巽为风，巽之入是风吹万物无所不入的入。比如风吹浮云，扫散积阴，就是巽入之入。可见巽之入并非单纯的入，入之后还有制的问题。引申到国家事务，巽之入就是统治者申命行事，通过发布深入人心，深入事理的政教命令，以解决除奸、厘弊等问题。巽之义是入，入之义不仅仅是入，还含有制的意义在内，所以《说卦传》说万物“齐乎巽”，“齐也者，言万物之絜齐也”。巽入，就其效果说，有絜齐万物的作用，絜齐也就是制。言万物“齐乎巽”，并不妨碍我们说巽卦之义是入。巽的根本含义是入，没有入，亦便无所谓制，无所谓絜齐万物了。这是说，整个一卦之义，在一卦之中，初六与六四是伏于内之阴，是四个阳爻入而制之之对象。巽之入义，正是取之于阳入制于阴这一点上。但是，具体到每一爻的爻义，情况就不同了。不仅四个阳爻是入而制之的主体，初四与六四两个阴爻也是入而制之的主体。六爻在整个巽的时代将起到什么作用，要看它们各自的才质与时位如何了。初六质柔居下，进退不决，“利武人之贞”，需要的是刚决果断。六四虽亦阴柔，然而居高当位又承九五，故不唯无进退之疑，且有田获三品之功。九三与上九的问题过于中，九三过中又过刚，故“频巽”，屡巽屡失，屡失屡巽，达不到入而制之的目的，必吝。上九过中又以刚居亢，处无位之地，有“巽在床下，丧其资斧”之象，非但无益，而且有害，其凶必矣。《易》贵中，巽尤贵中，九二与九五，是《彖传》所谓“刚巽乎中正而志行”者，九二能尽申命之道，故吉无咎，九五居尊中正，先庚后庚，慎始思终，从权适变，最善行巽之道，故吉而又吉。"},"58":{"P":"《序卦传》说：“巽者入也。入而后说之，故受之以说。兑者说也。”说“入而后说之，故受之以说”，是牵强的，入与说谈不上有必然的联系。“兑者说也”，说明兑本来就是说，兑、说本为一字，犹如咸卦之咸与感同为一字一样。咸就是感，兑都是说。有人把咸说成是无心之感，把兑说成是无言之说，是不对的。","G.N":"兑即说，说亦即悦。兑之为卦兑下兑上，上下二体都是一阴在二阳之上，有喜见于外之象。说是致亨之道，我能说于物，物必说而与于我。我说物与，足以致亨。“利贞”是戒辞。为说之道，利于贞正。不是随便怎样求说都能致亨的。如果不以正道求说，求说是为满足一己之私欲，那就是邪谄，不惟不能致亨，还要有悔吝了。","T.N":"“兑说也”，解释卦名，兑就是说。喜说，和说。此与咸卦《彖传》说“咸感也”，意思是相类的。\n“刚中而柔外，说以利贞”，这两句话直接解释卦辞。自整个一卦看来，一阴在二阳之上，阳说阴而阴说于阳，故有说义。卦之二、五都是阳爻，是谓刚中，三、上都是阴爻，是谓柔外。刚中而柔外，是兑亨利贞的两点根据。刚中，阳刚居中，有中心诚实之象，故能利贞。柔外，阴爻在外，有接物和柔之象，故能说亨。刚中与柔外互为条件，缺一不可。如果只有柔外而无刚中，便会说而不正；说而不正，便不是说而是谄了。如果只有刚中而无柔外，便会说而不亨；说而不亨，便不是说而是暴了。唯有既刚中又柔外，方可“说以利贞”。\n“是以顺乎天而应乎人”，自此句以下，是孔子对兑卦卦辞卦义的体会和发挥。兑卦刚中而柔外，包含着天之道和人之道在内。因为刚中，所以诚信；诚信则顺乎天理。因为柔外，所以和顺；和顺则应乎人心。孟子讲的“中心悦而诚服也”，就是孔子这里讲的“顺乎天而应乎人”的意思。孔子认为，圣明的统治者，在行说之道的时候，只考虑如何顺乎天而应乎人，不想怎样使天下人拥护自己。天下人中心悦而诚服，不过是他顺乎天而应乎人的客观结果，不是他的初始居心。\n“说以先民，民忘其劳；说以犯难，民忘其死。说之大，民劝矣哉”。虽然圣明的统治者绝不为了取说于民而行说之道，但是，只要他在行说之道的时候，能够顺乎天而应乎人，那么，他必然会“说以先民”，平时就注意使人民饱食，暖衣，养生送死无憾；必然会“说以犯难”，遇到危难例如战争的时候，依人民说不说，赞成不赞成为根据，决定仗打与不打。总之，能够使民说在先。能够使民说在先，需要人民出力时，民就忘其劳；需要人民打仗的时候，民就忘其死。统治者弄好了说道，人民可以自劝。所以孔子感叹说：说之道多么伟大呀。","X.N":"丽，附丽。丽泽。二泽相附丽。二泽相附丽，必彼此浸润滋益。君子观丽泽之象，乃以朋友讲习。朋友是与己志同道合的人。讲是讲未明的道理，习是习未熟的事物。朋友讲习是志同道合的朋友聚会一处，互相讲习，彼此切磋。这样做比独学无友，孤陋寡闻好得多。朋友讲习是人生最大的快乐，而且这种快乐虽过而无害。《论语》以学之不讲为忧，以学而时习为说，以有朋远来为乐，其用意正与兑卦大象同。","Y1.N":"说中本有和义，说必和而和则可说。初九是阳爻，居说体而处最下，又无所系应，是能够以和为说的。因为是阳刚，所以不邪谄；因为处下，所以无上求之念；因为无所系应，所以随时处顺，心无所系无所为，以和而已。以和为说，无所偏私，故吉。","Y1.XN":"行未疑，行为未有可疑。未有可疑，是说未发见它有什么过失。初九处说在下而又不是中正，所以小象指出它行未疑，如果它居中得正，那就用不着说行未疑了。","Y2.N":"九二以刚居中，有诚实之德，在说的时候，它是以孚信为说的人。说而不失刚中，说以孚信，故吉。不过九二承比六三阴柔小人，是本该有悔的，因为它有刚中之德，能够自守不失，做到和而不同，悔可以亡。","Y2.XN":"初九小象曰行未疑，此云信志。初与二比较看，为初易而为二难。初九距离六三阴柔小人尚远，不但志可信，其行亦未可疑。九二与六三阴柔小人近比，其志可以信而其行则未免致疑。故初与二同获吉，而二多“悔亡”二字。","Y3.N":"六三阴柔不中正又居阳位，动而来求初与二二阳之说，故曰来兑。来兑亦即求说。说自有道，说是不可故意来求的；既然是公然来兑，便是失道求说；失道求说，所以凶。","Y3.XN":"六三不中不正且上无应与，全卦六爻之中，它的位最为不当，所以凶。它不能如九二孚兑之志可信，更不如初九和兑之不特志可信，行亦未疑。","Y4.N":"商兑，说之不以正道则不说。未宁，即便说了，也要保持警惕，绝不以为可说，就安而溺之与之说。九四虽然所处非正，但毕竟是阳刚之质，它能够做到“商兑未宁”。因为能够做到“商兑未宁”，所以虽然介疾而有喜。疾，疾病。喜，病去。介疾有喜，是说九四近比于六三，介于邪害之间，如果安而溺之，则必受到六三的毒害。然而九四质本阳刚，能够介然守正，虽近于疾病，却可不为疾病所侵，疾病终究可去。","Y4.XN":"九四居近君之大臣位，它的喜不仅是它一身之喜，可能影响到天下国家都得到好处，故曰“有庆也”。","Y5.N":"阴剥阳，小人剥君子，小人道长，谓之剥，故称小人为剥。孚于剥，即孚于小人，亦即孚于上六。九五阳刚居君位，得乎中正，是最能尽说道之善的一爻，它面临的问题是密比于上六。上六既是小人，就要剥君子，它为了取说于九五，总要用巧言令色将自己的祸心包藏起来。所以告诫九五，当你诚心相信小人的感人的巧言令色的时候，一定要明白这是危厉的，从而心存危惧，不使自己受小人之巧言令色的迷感。","Y5.XN":"此小象言位正当之义，与履九五同。兑九五爻辞告诫孚于剥有厉，是因为九五处在尊位，密比于阴柔之上六，正好有一个如何对待小人求说于己的问题，它爻不如九五这样阳刚中正，位正当，不存在“孚于剥有厉”的问题。","Y6.N":"上六引兑与六三来兑，都是小人主动说于君子，都是不好的。但是上六之引兑与六三之来兑也有不同之处。六三以柔居刚，它动而求阳之说，故曰来说。来说是公开的，不加掩饰的，容易被人察觉，所以六三自己致凶。上六以柔居柔，它静而诱阳之说，故曰引兑。引兑是隐蔽的，其剥于阳的祸心是巧言令色包藏着的，不易被察觉。所以告诫与它密比的九五要心存危厉，时刻提防它的阴谋得逞。而对于上六自身却不言凶。","Y6.XN":"光，广，大。未光，未得广大。谁未得广大？上六。上六什么未得广大？上六以阴剥阳，以小人剥君子的坏作用未广大。上六的坏作用为什么未得以广大？因为引兑虽求说隐蔽，暗藏危厉，但由于受它引兑的九五有所警惕，不上它的当，它的坏作用未得施展广大。","Z":"兑就是说，兑卦之义实际上是讲人与人之间如何建立和说的关系问题。与人建立和说的关系，是一件好事情，各方面都不至于反对，所以说亨，说而可以致亨。但与人和说是有条件的，说必以贞正为先决条件。说不以正道，则为邪谄，邪谄是君子所不取的。说之中包含着和的意义。说之义与《论语》说的“君子和而不同”是一致的。从整个一卦看，要达到“所以利贞”的要求即实现合于道的正确的说，需要刚中而柔外，缺一不可。引申到人的身上，必须内里刚健诚笃而表现柔和巽顺。若分别看六爻的情况，便有所不同了。首先，六爻中凡阳刚之爻皆吉，阴柔之爻皆凶。这是因为刚则有节，柔则无度的缘故。其次，各阳爻虽吉，却也有差别。初九和兑吉，以和为说，无所偏私，是最好的一爻。九二有刚中之德，固然很好，但是它承比六三阴柔小人，故孚兑吉之外多悔亡二字。九五阳刚中正居尊位，亦有有厉之诫，甚至不如九四“介疾有喜”。这说明作《易》的人认为在说的时候，近比小人者，纵然自身有刚中之德，也要备加小心。因为小人伺机求说于君子，而内心包藏着时刻要剥你的祸心。六三来兑与上六引兑，是求兑不以道的表现。说不是故意求的，是自然产生的。君子不求说于人，行道而已。只要是有意来求说，结果无不凶。上六引兑，求说之心隐蔽，不易被察觉，所以对于它自身说，吉凶悔吝尚不能确定，而对君子的危害比六三更严重，九五须牢记“孚于剥有厉”的警戒，时刻防备它。"},"59":{"P":"《序卦传》说：“兑者说也。说而后散之，故受之以涣。涣者离也。”涣就是离，就是散。人在忧愁的时候，气血就结聚；在喜悦的时候，气血就舒散。可见，说有散义。因为说有散义，所以兑卦之后次之以涣卦。涣之为卦坎下巽上，风在水上吹过，水遇风则涣散，故卦名曰涣。","G.N":"涣，涣散。涣卦的卦义是在天下涣散的时代，如何治涣的问题。天下涣散，谁来治呢？当然是王。王用什么办法治涣呢？主要是假有庙。庙是宗庙，是奉祀祖考的地方。遇有大事大故，王要至宗庙求助于先人。宗庙祭祀会唤起人们的宗族意识乃至国家意识，进而增强人们的心理凝聚力，以促成天下国家度过难关。王既假有庙，获得先人的佑助，便不是解决小问题，是要济大难，故曰利涉大川。又，涣卦坎下巽上，木行水上，有利涉大川之象。利贞，利于贞正。此贞正当不是戒辞，是说涣卦有贞正的条件和可能性。卦中四与五两爻得正位，所以利贞。","T.N":"“涣亨，刚来而不穷，柔得位乎外而上同”。凡《易》中所谓刚柔往来者，全是本之于乾坤二经卦的。涣卦坎下巽上，下体坎本是坤，中爻变成坎。上体巽本是乾，初爻变而成巽。坎在内卦，故云刚来。巽在外卦，故云柔得位乎外。“刚来”，刚在下体。“而不穷”，未穷极于下，而处得其中。“柔得位乎外”柔爻居四，以阴居阴，故曰得位乎外。“而上同”，虽未得中，但是与九五之中近比，即上同于九五。同于九五就是从中。九二刚来居内而不穷于险。六四柔得位乎外又从于九五之中，内刚外顺，有济涣之象，故云“亨，利涉大川，利贞”。\n“王假有庙，王乃在中也”。王是谁呢？王在卦中是九五。九五居上体之中，居中得正，最得“王假有庙”之义。“利涉大川，乘木有功也”，此卦坎下巽上，巽为木，坎为水，有乘木水上以涉川之象，故云“乘木有功”。","X.N":"风行水上，有涣散之象。先王观此象乃享于帝，立庙以收合人心。","Y1.N":"初六处涣之初，涣散刚刚开始，是拯涣最好的时候。但是，初六阴柔，自己不能独力拯涣，谁来帮助它呢？它在卦中没有正应，然而近比九二，九二也没有正应，却有刚中之才。无应对无应，倒可以亲比相求，九二愿意也有能力帮助初六拯涣。初六有九二的帮助，就像人借用壮马之力可以致远一样，刚刚开始的涣散，能够及早拯救，故吉。","Y1.XN":"初六之所以能够以阴柔拯涣得吉，关键在一个顺字。它既能顺从九二刚中之才，又能顺乎时，拯涣于方难之始。","Y2.N":"除初六外，诸爻皆以涣字开头，意谓在涣散的时候。九二处在下体坎险之中，其有悔可知。若能“奔其机”则悔可亡。奔，急往。机，可以俯凭而安坐的类似小凳的东西。“奔其机”，急速离开危境到安稳的地方去。在涣卦里，初六与九二皆无正应，二者阴阳亲比，处在相依相赖的互济互助关系中。在初六看来，九二是它可以托付的马；在九二的眼里，初六是它可以俯凭安坐的机。初六有九二刚中的帮助而且是拯涣于方难之始，所以得吉；九二已处险中，助己者又是阴柔之才，故仅得悔亡而已。","Y2.XN":"九二居险之中，由于急就于初六，求得一个安稳的去处而亡其悔，其愿因此得遂。","Y3.N":"六三与上九正应，在别的卦里很少有吉义，唯独涣卦不同。涣卦六三应于上九，有忘身徇上之象。六三是阴柔之质，且不中不正，本有私于己之心，但是它居于阳位，应于上九，毕竟能够散其为己之私心，增其济时之大志，故得无悔。然而终不能救时之涣，止于自身无悔而已。","Y3.XN":"六三能够以阴柔之质，不中不正之位，做到散其私心，忘身徇上，主要因为它志在外。志在外指六三应于上九而言。","Y4.N":"六四是成卦之主，居阴得正，上承九五，下无应与，有涣其群之象，是心无私匿，行无偏党，能当济涣大任的人。涣其群，处在天下国家涣散的时代，六四作为一个公而无私的大臣，尽散朋党，解除割据，把一切有害于统一的小群势力尽行涣释。六四能够如此，必得大善之吉。六四不但能涣释朋党、割据等小群，更重要的是它还能使整个天下或一个国家混于一，把小的群变成大的群。这就是爻辞下一截所谓“涣有丘”。\n“匪夷所思”，是说这不是一般人的思虑所能及的。","Y4.XN":"在涣的时代，能够散其小群，聚为大群，得大善之吉，功德广大，影响亦广大。","Y5.N":"涣是坏事也是好事。九五“涣汗其大号”就是好事。人体郁结风寒，汗发散出去，就好了。在这样的时候，人体需要的是涣汗。涣汗是好事。天下国家犹如人之体，积弊久了，也要产生疾病，出现各种险难，长久下去，必发生大问题。为了涣险释难，解决问题，天下国家也要“涣汗”，即像人体那样发一身大汗，将天下国家长期淤积壅滞的疾病尽行驱除。天子诸侯哀痛迫切，至诚恳恻发出的大号即革旧布新的大命令之类就是大汗。大号之出，天下国家之大难可解。九五以阳刚中正居尊位，处在涣的时代，恰似能够发革旧布新之大号以解天下国家之大难的天子诸侯，故有“涣汗其大号”之象。“涣王居”，王居指人君即天子诸侯之所居，实际上也就是天子诸侯。“涣汗其大号”这样的大职任，别人是担当不了的，只有居尊位的天子诸侯担当，方可无咎。","Y5.XN":"“小象”以正位释爻辞之王居。九五居尊位，故曰王居。九五又阳刚中正，故称正位。九五之所以能够担当起“涣汗其大号”的重任，端在于它阳刚居中以守至正，如北辰之居其所。","Y6.N":"涣，远。血，人体见血，乃受伤害之标志。此血字可迳理解为伤害。“涣其血”与“涣其汗”有区别。“涣其汗”是疾病郁结在身内，涣汗以除之。“涣其血”是伤害在身外，涣血以违之。在涣卦中，下体坎，有伤害之象。上九距离下坎最远，所以它能够“去逖出，无咎，”，远远地避开伤害而得无咎。去，表示不再来；出，表示不再入。“去逖出”，远远地避开伤害，永不再接近它。","Y6.XN":"人体中之汗可以涣发，人体中之血不可涣发；“涣其血”，实谓在涣的时代，如何躲避外部恶势力对己身的伤害问题，孔子恐人们误以为是涣发体中之血，而指明“远害也”。实际上，如果不是孔子指明，我们的确很难理解“涣其血”的含义是什么。","Z":"涣卦有涣散的意义也有治涣济涣的意义。因为能治涣济涣，所以卦辞曰“涣亨”。涣卦为什么有治涣济涣的意义呢？主要由于涣卦“刚来而不穷，柔得位乎外而上同”。“刚来”指九二。九二刚阳而居中。“柔得位乎外”指六四，六四以柔居柔在外卦，故云“得位乎外”。“上同”谓六四巽顺于九五。六四上同于九五，这一点很重要。九五居中，六四上同于九五，就是从中。处涣的时代，四与二同德亲比而守中，足以治涣济涣，故亨。\n涣卦六爻爻义与卦之义基本一致。涣卦六爻独初六曰“用拯马壮吉”而不云涣。这是因为初六居卦之初，涣的形势尚未出现就及早发现及早拯救的缘故。其余诸爻皆以涣字当头，意谓涣的问题已经形成，不是拯救而是如何治涣济涣的问题了。九二“涣奔其机悔亡”，急速离开危境奔向安稳之地。六三“涣其躬无悔”，比九二进一步，不是奔而是解决自身之涣了。至于六四“涣其群元吉”和九五“涣汗其大号，涣王居无咎”，则是君臣合力治天下之涣。上九“涣其血，去逖出，无咎”，出涣远害而无咎。总之，初、二、上三爻讲拯涣出涣，三、四、五三爻讲治涣济涣，都与卦义相合。"},"60":{"P":"《序卦传》说：“涣者离也。物不可以终离，故受之以节。”事物既已离散，就要有所节制，不可能永久离散下去，所以涣卦之后次之以节卦。节之义为何？《杂卦传》说“节止也”，也说“艮止也”。那么节之止与艮之止有何区别？孔颖达说：“节者，制度之名，节止之义。”朱熹说：“节，有限而止也。”可见节之止，是一种限制，使事物不至于发展太过，适可而止。艮之止，是静止不动的止，它要求人们该动则动，不该动则止，即根本不动。艮之止回答的是人们的行为选择问题，即强调人们知道什么事当行重要，知道什么事当止更重要。而节之止回答的是人们的行为控制问题，即告诫人们明白，纵然是当行的事情，也要有一个限度，不宜过分，即适可而止。节之为卦泽上有水，泽中已有水，泽上又有水，泽之容有限，水满则不容，正是有节之象，故名曰节。","G.N":"卦辞分两层，“节亨”是一层，“苦节不可贞”又是一层。不该做的事，根本不应当去做，所以不存在节的问题。只有当做的事，即好事，才有节的问题。当做的事，好事，但做的不够，还处在不及的状态，这也不存在节的问题。做的是当做的好事，而且已经做到相当充分的程度，却又善于节制，适可而止，不使过分，这就是节。做事能做到这种地步，亨是没有疑问的。然而问题往往就出在这个节上，古今中外不乏节而失节的教训。节本身也有个节的问题。节最易过，过度的节也就同根本无节一样了。节之过是苦节，苦节不可贞。贞在此是长久的意思。苦节不可长久。苦节如果长久，不仅不能亨，还要出大问题。","T.N":"“节亨，刚柔分而刚得中。”这是以卦变释卦辞。节卦的卦变与贲卦相似。贲卦是柔来而文刚，刚上而文柔；节卦则是柔来而节刚，刚上而节柔。贲卦因为刚柔太纯，质而无文，需要以文饰。节卦因为刚柔过盛而无节，需要加以节制。所不同的是贲卦卦变的结果是柔得中，而节卦卦变的结果是刚得中。节是贵中的，节刚得中，故亨。\n“苦节不可贞，其道穷也”。节贵乎中，节若能够处中，就亨。亨与穷相对应。节若不能处中，即节过了头，就变成苦节了。苦节是失度的节，过中的节。苦节与无节同样有害。苦节不可能长久，因为它的道是穷的，穷必变，变则通。苦节是没有前途的，它必然要变，或者变苦节为适中的节，或者走向毁灭。\n“说以行险，当位以节，中正以通”。说以行险，是就卦体言。当位以节，中正以通则专指九五一爻。节之为卦兑下坎上，故有“说以行险”之象。所谓险，是讲节的，节免不了有阻碍难通的问题。所谓说，是讲亨的，节而可以说，说明节的安稳自如，顺畅亨通。说以行险，节而能亨，不是苦节。“当位以节，中正以通”，再从九五这一爻的特点进一步阐释节亨之义。当位，是以九五之位言。九五居尊位，有能节天下国家之势。中正，是以九五之德言。九五以阳居阳，居中得正，能通天下之志。就全卦看，说以行险，就九五一爻看，居尊位得中正，都说明节卦能够说而不苦，通而不穷，也就是说，能够节亨。\n“天地节而四时成，节以制度，不伤财，不害民”。以下是孔子解释完卦辞之后做的体会和发挥。认为人类社会有节，自然界也有节，有节是天地人都有的普遍规律。社会的节是根据天地节而来的。天地节，即是刚之节柔，柔之节刚。刚柔相节而生成春夏秋冬四时。冬不可无限长，要由春来节制它，使它适可而止，这是刚节柔。夏也不可无限长，要由秋来节制它，使它适可而止，这是柔节刚。如果天地无节，则大冬大夏而已，哪里还有四时！此曰“天地节而四时成”，革《彖传》则说“天地革而四时成”，只差一个字。二卦虽都讲四时成，都讲天地，但侧重点不同。节谓限止，革谓改易。天地节是说后边的季节限止前边的季节，故成春夏秋冬。天地革的结果也成春夏秋冬，但革的意思是说后边的季节革易前边的季节而加以取代。古人认为自然界的规律与人世间的规律是一样的，自然界有什么规律，人世间就有什么规律。人世间的规律可以在自然界寻得根据，自然界的规律也可以在人世间找到它的影响。自然界有“天地节而四时成”，人世间就有“节以制度，不伤财，不害民”。这三句话讲的是国家财政支出收入的问题。国家要量入为出，节制花钱。节制的办法是制定适当的制度。用制度保证花钱合理。国家花钱如果没有制度节约，就要伤财，伤财就要加重人民负担，也就要害民。伤财和害民总是相联系的，所以孔子讲“节用而爱人”。","X.N":"泽是潴水之陂，周围必有防堤加以控制，使水不至于流溢。泽之容水量有限度，超过限度就要溢出。有限度就是节，故泽上有水为节。君子观了泽上有水的节象，乃制数度，议德行。数，一十百千万。度，分寸尺丈引。制数度，依人的尊卑贵贱等级制定所用宫室、冠服、车旗、器用等的多少大小亦即制定礼数等差。德，藏于内心为德。行，表现于外为行。议德行，考察论定人的思想表现是否中节合礼，是否无过不及，然后任用之，使皆得其宜。","Y1.N":"户庭，户外之庭。不出户庭，呆在家中不动，什么地方也不去，什么人也不接触，什么事情也不干，绝对的慎言慎行。这样做，当然是无咎的。初九为什么能够慎言慎行竟至于“不出户庭”呢？因为初九阳刚在下，居得其正，当节之初，恰是知节能止的人处在节初当止之时，故不出户庭无咎。","Y1.XN":"通塞即节制，知通塞即知节。节既不是一味的通，也不是一味的塞。当通之时通，当塞之时塞，可谓知节。初九处于节之始，是当塞的时候。当塞之时而不出户庭，是谓知塞。知塞而云知通塞，这是为什么？这是因为当节之时通塞不可一定。当塞知塞谓知通塞，当通知通亦谓知通塞，犹今语知深浅，知好歹，知凉热一样。","Y2.N":"泽中开始蓄水时，水尚少，这时的问题是如何固塞堤防，使水不至于流走，这就是节，初九正属于这种情况，故云不出户庭。待水渐盛以至于满盈，则当启窦以泄，使水有所溢出，这也是节，九二该属于这种情况。可是九二无视情况的变化，守着初九的老办法，依然不出门庭，便是失节了。在节的时候，当通不通，岂有不凶之理。","Y2.XN":"就事之理说，泽之水始至，泽当塞不当通，故初九不出户庭无咎。泽之水既至，泽当通不当塞，而九二不出门庭，故凶。就爻之象看，初九刚而处下，是不当有为的时候，九二刚而处中，是应当有为的时候，应当有为而不为，必凶。九二之所以如此，关键的问题是它失时而至于极。","Y3.N":"从成卦之初看，六三在下体是以柔节刚的。从生爻之后看，六三过乎中而不正，乘刚临险，是不知节的。不过六三柔顺而和说，虽不知节，却能嗟伤以自悔。《易》是补过之书，六三既嗟伤自悔，谁还能怨咎它呢！","Y3.XN":"虽不节，却知其不节而自悔，又谁得而咎之！","Y4.N":"六四与六三不同，六三以阴居阳，失位而处在兑泽之极，因而溢而不节。六四以阴居阴，当位得正而顺承九五中正之君，故为安节，安节故能致亨。所谓安节，不是勉勉强强以为节，是循乎成法，制节谨度以为节。六四居上体坎之下，亦即坎水之下流。水上溢为无节，水下流为有节。又，六四柔顺居正，有水流平地安澜之象，故不但有节，且为安节。","Y4.XN":"六四能安节，能致亨的原因不是一个，最为重要的是它上承九五刚中之道以为节。","Y5.N":"九五刚中居尊位，是节卦之主，《彖传》所说“当位以节，中正以通”，指的正是九五。九五之节是甘节。甘是味之中，甘可以受和。和就是节咸苦酸辛等偏味而使之适中。甘节是无过无不及的节，恰到好处的节。甘节不同于安节。安节只行于己，唯自安而已，而别人未必安。甘节是九五居中履正，人君以节天下国家的节，这种节既施之于己，也施之于人，天下国家上下人等都不以为苦，故得吉。甘节实行起来影响很大，功效很大，往则有可尊尚。","Y5.XN":"节贵乎中。九五得甘节之吉，根本的原因是它居位处中，当位以节，无过无不及。","Y6.N":"上六居节之极，节已过中。过中的节，人们不堪忍受，故云苦节。又，上六处险之极，也有苦义。苦节不可贞，不是长久之道。如果固守苦节，坚持地施行下去，必凶。然而上六若知悔，能够损过而从中，终止苦节，则凶可以亡。节上六悔亡一语与别的卦的悔亡辞相同，但意义不一样。","Y6.XN":"九五甘节，卦辞的节亨，通过九五表现出来。上六苦节，卦辞的苦节不可贞，通过上六表现出来。苦节贞则凶，是以不可贞。节发展到上六苦节的时候，已至穷途末路。","Z":"节的意义是对事物的运动变化发展加以适当的限制。自然界有自然界的节，故有四时的交替。社会有社会的节。社会的节，情况比较复杂，但是道理与自然界是一样的。人们为了对自身的行为加以限制而制定制度，就是社会的节。节卦下体是兑，兑为泽为止，故初九与九二皆曰不出，六三是泽止满盈而溢，故曰不节。上体是坎，坎为水为流，故六四曰安节，九五曰甘节，上六水流而竭曰苦节。下体由泽取义，故下体有通塞的问题。上体由水取义，故上体有甘苦的问题。节贵乎中，在节卦里，得中不得中最为关键。九五得中，为甘节。由于九五得中为甘节，所以卦辞才言“节亨”。上六过中，为苦节。由于上六过中为苦节，所以卦辞才说“苦节不可贞”。又，《彖传》说“当位以节”，节卦六爻以当位为好，不当位为不好。初九与九二相比，初九当位不出户庭无咎，九二不当位不出门庭则凶。六三与六四相比，六四以柔居柔得正为安节，六三以柔居刚不正则为不节。"},"61":{"P":"《序卦传》说：“节而信之，故受之以中孚。”节必须有信。制度制定出来，要看执行。执行的问题主要看人们是否信守。一般说，上头信守，下边信从，就做到了“节而信之”。所以节卦之后次之以中孚。中孚为卦泽上有风，风行泽上而感动于水中，故曰中孚。中孚是诚信的意思。中孚兑下巽上，分上下二体看，则上下二五都是阳中实，合上下二体为一卦看，则四阳在外，二阴在内，为中虚。中实为信之质，中虚为信之本。内外皆中实而全体中虚，有中孚之象。","G.N":"中孚豚鱼吉，卦名与卦辞连着为义，与“同人于野”、“履虎尾”、“艮其背”等同例。信发于中，谓之中孚。诚信在中心，连愚钝无知的豚鱼也能感动而孚信之，则世上没有什么东西不能感动不能孚信，能如此，必得吉。以如此至诚之心涉险难，没有什么样的险难不能克济，故云利涉大川。不过诚信有正与不正之别。要君子之中孚，不要小人之中孚，故戒之以利贞。","T.N":"“中孚，柔在内而刚得中，说而巽，孚乃化邦也”。柔在内而刚得中，是中孚之所以为中孚的两个不可或缺的条件。中孚，信发于中，中心至诚之信，它需要中虚又需要中实。中孚兑下巽上正好具备这两点。上下二体都以刚居中，是中实。全卦六爻四阳在外二阴在内，是中虚。就人说，心中不虚则有所牵累，有所牵累就不能信。心中不实也不行，心中不实则无所主，无所主则失其信。说而巽，中孚为卦上巽下说，在上的以至诚顺巽于下，在下的以有孚说从其上。这样，中孚的教化作用能够施及于整个邦国。\n“豚鱼吉，信及豚鱼也”。豚鱼吉，即中孚豚鱼吉。中孚能够信及于豚鱼，说明豚鱼难信；豚鱼难信，而中孚以中心至诚能信及之，说明中孚无所不能信。以中孚涉险难，犹如乘木渡河那样方便可行，而且又像坐空船一般安全无覆没之虞。\n“中孚以利贞，乃应乎天也”。中孚是信发于中，中心诚信。信发于中，中心诚信，必须贞正，像天之道即自然规律那样公正而无偏私。如果信发于中，中心诚信，而心却不贞正，那就越是中孚越坏。","X.N":"泽是止水，风在止水上行，寂而感，虚而通，风感水受，有至诚无所不入之象，是为中孚。君子观中孚之象，应用到政治上，能做到议狱缓死。议狱，判决之前进行充分的讨论，以求其入中之出，把所有可疑的或者不能据以定罪的东西都查出来。缓死，判决死刑之后从缓执行，尽量在犯人必死的罪行中找出可以不死的因素。经过议狱而判刑或经过缓死而处决，在君子来说，能做到了尽忠尽诚；在犯人来说，可谓无所遗憾。","Y1.N":"虞是安的意思，燕也是安的意思。中孚之卦以全卦内外上下共成一孚，六爻皆不取外应，专以能绝断系应者为孚。因为中孚之卦，孚在其中，无待于外，无求于外，所以六爻无应者吉，有应者凶。初九与六四是正应，本应该是凶的，但是初九能够安处于下，自守自虞，不假它求，故得吉。这个吉是由于它自安于下，绝系于外而致，故曰虞吉。“有它不燕”，是说假若初九心有所动，志变而求孚于六四，那就不得其安了。简言之，虞则燕，不虞则不燕矣。","Y1.XN":"处中孚之始，自信自守自安，孚在其中，“未变”是不变无他求之志，故得虞吉。","Y2.N":"九二阳刚居中，是中孚之实，以其至诚，最能与同气同类相感相通。纵然它现在处六三、六四二阴之下，暗昧幽隐，不易为人所知，但由于它中实至诚，行不失信，它的同类无论在多么遥远的地方，也能听到它的声音。犹如“鸣鹤在阴，其子和之。我有好爵，吾与尔靡之”。鸣鹤指九二自身。\n它在六三、六四二阴之下，故云在阴。其子指初九。《易》中凡言子言童，一般多指初爻。鸣鹤在阴，其子和之，说的是初九和九二。鹤鸣子和，九二言行至诚，虽处幽深，其同类也能感而应之。爵指爵禄。吾指九二自己。尔，你。靡，分散。“我有好爵”，他若有了爵禄这些名利的东西，“吾与尔靡之”，我必与你分散共有，绝不自己一人享受。孔子在《系辞传》里对中孚九二爻辞有所发挥，说：“‘鸣鹤在阴，其子和之，我有好爵，吾与尔靡之’。子曰，君子居其室，出其言善，则千里之外应之，况其迩者乎！居其室，出其言不善，则千里之外违之，况其迩者乎！言出于身加乎民，行发乎迩见乎远。言行，君子之枢机。枢机之发，荣辱之主也。言行，君子之所以动天地也，可不慎乎！”孔子强调君子当慎言慎行，善言善行，看来似乎与爻辞之义有别，实际上是一致的。中孚九二爻辞之义是，君子以至诚感人，人无不自然来应。至诚之言行，当然必是善言善行。恶言恶行是不可以谓之至诚的。","Y2.XN":"鹤鸣是由中而发的，无所求的鸣。子和也是由中而应的，无所求的和。鸣与和都是天然相感，出于中心之愿。","Y3.N":"自一卦而论，六三与六四构成中虚，是中孚成卦的重要因素，但自爻看来就不同了。六四以阴居阴得正，位近于君，上从九五，下不系于初，而六三则阴柔不中不正，而且与上九正应；中孚诸爻以无应无系为好，六三与上九正应，说明它的心动于外，系于物，丧失了自信力，处在中孚的时代，却没有中孚的特点，故曰“得敌”。敌，匹，配。应当自主自信自立的时候，它却什么都依赖匹配：“或鼓或罢”，人家鼓他也鼓，人家不鼓他也不鼓；“或泣或歌”，人家泣他也泣，人家歌他也歌。作止无常，哀乐无定，作止哀乐完全系之于物，自己不能坦然自安，远不如初九之虞吉。","Y3.XN":"六三的根本问题是以阴处阳，居不当位。居不当位，则心无所主，行止全系于外，因此或鼓或罢，或泣或歌，变改无定。","Y4.N":"月几望，月亮将盈而犹未盈。马匹，谓初九为六四之匹。马匹亡与六三之得敌意义相反。六四以阴居阴得正，位近于九五之君，有月几望之象。月几望实际上是比喻六四的处境。六四近于君，得到九五的信任，其地位是极高的，如同月亮要满盈但尚未满盈。这是最好的。假若六四的地位达到极盛的程度，以至于与九五之君相匹敌，那就等于月望了，月望即将亏，灾祸也就快来了。马匹亡，六四上从九五而下绝初九之系应。六四既近比九五又与初九正应，而在中孚之卦，只允许孚于一方面，不允许两方面都孚。六四孚于九五与初九哪一方面呢？它孚于九五而绝于初九，这就叫马匹亡。马匹亡与得敌，含义正好相反。六三系于上九曰得敌。六四绝系于初九，曰马匹亡。六四绝系于初九是有根据的。《易》中凡取六四与初九相应之义，都因为六四上不遇九五。如果六四上遇九五，则取从上之义，而与初九之应就不论了。","Y4.XN":"类即应。绝类上，绝初九之应而上从九五之君。六三心系于上九为“得敌”，而六四志绝乎初九之匹，曰“马匹亡”。得敌不好，匹亡好。为何六四马匹亡而六三得敌？因为六四位正，六三位不正。又，易例六四承九五者本多吉，六三应上九者本多凶。","Y5.N":"挛，拘挛。《彖传》所谓“孚乃化邦”，指的就是九五这一爻。九五刚健中正而居君位，又无私应之累，恰是人君之孚。人君之孚与在下诸爻之孚不同。在下诸爻居下位，居下位之孚只要中有实德，不系于外即可。九五乃人君，它必须也能够以孚天下国家为实德，以诚信固结天下国家，然后可以无咎。","Y5.XN":"九五能够将天下国家之人心感通一致，固结得像拘挛一样，根本的原因是它位正当。位正当，以阳居阳，居中得正，正当君位。","Y6.N":"上九处外而居上，当中孚之终，实际上已经不是中孚之道了，所以有“翰音登于天”之象。翰，高飞。翰音，音飞得很高，以至于登至天上。“翰音登于天”，声闻很高，而实不相副之谓。上九缺乏纯诚之心，笃实之道，一味追求虚名，而以矫伪为尚。这种虚声无实的人，是绝不会有所作为的，贞固于此，而不知改，其凶可知。此爻与九二“鸣鹤在阴，其子和之”，意义正好相反。九二孚于中，故在阴而子和；上九孚于外，飞而求显，鸣而求信，故“翰音登于天”人所耻之，无人和之。","Y6.XN":"“翰音登于天”，虚声无实，声闻过情，怎么可能长久？或者改过反诚，以信实为本，或者贞固守此以致凶。","Z":"中孚之卦义是信发于中，中有实德而不迁于外。信发于中，中有实德，可以信及愚钝的豚鱼，更不必说人了。中孚诸爻爻义与卦义是紧密联系着的。因为中孚强调中有实德而不迁于外，所以六爻无应者吉，有应者凶。初九与六四本来正应，但在中孚卦里不取应义。初九孚在其中，无待于外，有应而不假求于应，故曰虞吉，有它不燕。同样六四也如此。六四本应于初九，但是它宁上从九五，也不取应初九之义，所以月几望，马匹亡。卦中最好的两爻是九二和九五。九二以刚居柔，所处得中，而且在二阴之下，是静晦而无求于物的人。它越是无求于物，物越是来应和它，故有鹤鸣子和之象。九二无系应，九五也无系应。九二无系应，中有实德，不迁于外，不过为一己之事，并不涉及他人。九五则有孚挛如，它刚健中正，正当尊位，亦无私应之累，它之中有实德，影响的就不是自己一人而是天下国家了。九五作为人君，以孚天下国家为实德，故必以中心之诚信固结天下国家，有如挛如一般不可分解。六三与上九是中孚卦中最为不好的两爻。六三不中不正，或鼓或罢，或泣或歌，动息忧乐不由自主而完全系乎其所信之人，故曰“得敌”，“得敌”指言有应，应于上九。上九的情况更坏于六三，上九处外而居上，属于无纯诚笃实之心，徒务其虚声外饰，以矫伪为尚的一类，其最大的特点是声闻与实绩不副，中孚之道在上九这里其实已不复存在。"},"62":{"P":"《序卦传》说：“有其信者必行之，故受之以小过。”中孚是讲信的。人有所信，必表现于行动，有行动必有所过，因此小过次诸中孚之后。小过是小者过，小事过和过之小。小过卦之所以名之曰小过，因为小过为卦山上有雷，雷在山上震响，其声高过常，故为小过。又，阴谓小，小过之为卦四阴在外，二阳在内，是阴多于阳，小者过也，故为小过。","G.N":"过是过其常，矫枉过正，过以就于正的意思。小过则是小事过，不是大事过。大事谓关系天下国家之事，小事谓日用常行之事。君子虽行贵得中，但是在有的时候，要想求中，却非过一点不可，过一点也为了求中。当过而过，然后可以亨通。小过亨，是小事过而亨。利贞，利于正。此卦之言“利贞”与它卦不同。它卦言“利贞”之贞所指具有抽象的性质，凡是正的，不是不正的，都可以列入它的范围，而小过之“利贞”之贞所指则是极为具体的。下文之“可小事不可大事”，“不宜上宜下”，即是小过“利贞”之贞。在小过的时代，可过者小事而已，大事是不可过的，可过于小而不可过于大，可以小过而不可以甚过。能如此即为正，反之则为不正。“飞鸟遗之音，不宜上宜下”，也是小过“利贞”之贞的内容。飞鸟遗之音，谓过之不远；不宜上宜下，谓过的方向宜向下不宜向上。同样是小过，向上过凶，向下过则吉。比如礼，向上过奢过慢则凶，向下过恭过俭则吉。","T.N":"“小过，小者过而亨也。”《易》阳为大，阴为小，卦中四阴二阳，是为小者过。天底下往往有些事物失之于偏颇，为了矫正而使之反于中，必须比之于常理小有所过。小有所过，偏方可反于中。矫枉过正，过反于中，其用无穷而亨，故曰小者过而亨。\n“过以利贞，与时行也”。《易》贵得中，过本来是不好的。过则不中，不中则不可谓正。然而卦辞却说小过利贞，小过而利于正，根本的原因是“与时行”。在小过之时，随时之宜，当过而过，则过不是过，过是为了中。这种过其实就是中。如果时当过而不过，那倒是不正了。\n“柔得中，是以小事吉也。刚失位而不中，是以不可大事也”。此以卦之才解释卦之“可小事不可大事”。柔得中谓阴爻居二与五之中。阴柔得中，能致小事吉，不能济大事。柔顺之人能行小事；柔而得中，故曰小事吉。做大事必须刚阳之才，非刚阳之才绝难济大事。在小过卦中，恰好刚阳居，于三与四，失位而不中；失位则刚阳之才不得发挥作用，不中则才过乎刚，是以在小过之时不可做大事。犹如刚健之人本能行大事，无奈今失位不中，故曰不可大事。\n“有飞鸟之象焉。飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也”。“有飞鸟之象焉”一句不类孔子《彖传》之语，很可能是后世解者的话在辗转抄书时误入的。“飞鸟遗之音”，比喻过之不远。“不宜上宜下”，是指小过的方向，即向上小过还是向下小过的问题。卦辞指出小过宜向下不宜向上，《彖传》则说明小过之所以宜下不宜上，是因为“上逆而下顺也”。飞鸟遗音，向上则逆，向下则顺。逆则必凶，顺则能获大吉。总而言之，小过可过于顺不可过于逆，可过于下不可过于上，可过于柔不可过于刚。","X.N":"雷在山上，止而不动，威而不猛，乃小过之象。人处在小过之时，不能不过，也不可太过，只应小过。君子法小过之象，应用到实践上，可以“行过乎恭，丧过乎哀，用过乎俭”。世上事物都有一定的质的标准。不及或过那个标准便不是那个事物。但是有些事物可过，过之而不为过。如行之过恭，不失其为行；丧之过哀，不失其为丧；用之过俭，不失其为用，就是可以过的事物。过是向下过，不是向上过，亦即卦辞说的“不宜上宜下”。如果向上过，行不是过恭而是过慢，丧不是过哀而是过易，用不是过俭而是过奢，便是“宜上”，小过“不宜上宜下”，若硬是反其道而行之，必致凶。","Y1.N":"小过这一卦由三、四两阳爻和初、二、五、上四阴爻组成。两阳爻在中，四阴爻在外，初与上两阴爻则更在外，都是阴过而不得中，所以凶。自卦象看，如果全卦是个鸟的话，那么初与上便是鸟翅之末，它不当飞。又，初六在艮体之下，恰是应当栖宿的时候，而它竟不能自禁而飞，故以飞而致凶。","Y1.XN":"飞鸟之过，一往而不及反，非但从旁不能救止，就是初六自己亦有不能自主之势。初六致凶是肯定的，谁也无可如何。","Y2.N":"六二柔顺处下，有中正之德，在小过六爻之中是最好的一爻。它或过或不及，都能适时当分而不愆于中，亦即当过而过，当不及而不及，权之以取中，是以虽过而无过，虽不及而无不及。“过其祖，遇其妣”，谓六二遇六五。遇是当的意思。祖，祖父，指九四。妣，祖姑，指六五。六二过九四而遇六五，似乎过分，然而不为过分。六二与六五都是阴爻，可为妣妇关系。在古代，孙妇就是要祔于祖姑，与祖姑同列。这是合于礼的。是当过而不为过。“不及其君，遇其臣”，谓六五遇六二。六二不敢及其君六五，六五反过来却可与其臣六二遇。这表现六二守柔居下，不失臣节，是当不及而不为不及。六二有中正之德，能过祖遇妣而不为过，遇其臣不及于君而不为不及，表面看是过和不及，实际上都是适时当分亦即适中的，故无咎。","Y2.XN":"在小过的时候，凡小者什么都有过的可能，唯独臣是不可过其君的。这说明作《易》者的君臣名分观念是不含糊的。","Y3.N":"九三处在阴过而阳失位之时，以阳居阳而得正，不免为诸阴柔小人所忌恨，处境很不好。在小过之时，九三应当过什么呢？九三应当过防于小人，以免为小人伤害。九三自己有个致命的弱点，即它以刚居刚，过于刚。过刚则容易不把小人放在眼里，而不为之过防。九三过防小人之先，应首先过防自身过于刚的弱点。然而九三实际上不大可能做到，它将自恃刚强而不过于周防，不屑于谨小慎微，结果遭到戕害，故凶。","Y3.XN":"凶如何，言凶之甚。阴过于阳，必害阳；小人盛于君子，必害君子。九三不知过防小人而为小人戕害。这样的凶是最厉害的，故云“凶如何”。","Y4.N":"在阴过的时候，九三与九四都“刚失位而不中”，然而九三以刚居刚，是纯刚，故凶。九四以刚居柔，刚而不过，故有无咎之义。“弗过遇之”，九四既不过刚，则当能够随合时宜，灵活对待。但是九四毕竟是阳刚之质，所以它应当时刻心存戒惧，不要往，不要去柔而以刚进，否则将有危厉。“勿用永贞”，正当阴过而阳刚失位的时候，小人绝对不肯从阳，九四应当随时处顺，不可固守其常。","Y4.XN":"以九居四，是位不当，因为位不当，所以不过刚。由于不过刚，九四才应当“弗过遇之”，也才能够“弗过遇之”。如果不“弗过遇之”而有所往，有所前进，则必有危厉，这是九四应当戒惧的。九四岂可长此以往而不知变！","Y5.N":"六五爻义主要是说不可能有所作为，纵使想有所作为，也不会成功。“密云不雨，自我西郊”，阴云密布，天将欲雨，然而雨下不来，因为风自西方吹来，西风是不易下雨的。小过有“不宜上宜下”之义，六五在卦之上体，又居尊位，正是上而未下的状态。这在小过之时是不宜有所为的，不有所为还好，若有所为那就不会得好结果。“公弋取彼在穴”，“公”当指六五自己，“彼”当指六二。弋，射而兼有取义。六二在艮体又伏于二阳之下，有鸟未飞而栖于穴之象。鸟未飞而栖于穴，正符合小过“不宜上宜下”之义，所以六五想取之以为己之助。但是六五是不能成功的，六五与六二是敌应，它得不到六二的帮助。密云以西风不能致雨，鸟在穴岂可弋取！","Y5.XN":"六五作为一阴已过乎阳，居阳之上，阴阳不和，故不能为雨。","Y6.N":"上六之过是阴柔小人之过，它居震之极，其飞已高，过而不知止，以至于亢，过而至于亢，哪里还能有所遇！结果必丽于网罗而致凶。这就是灾眚，眚由灾致，灾由自取。","Y6.XN":"六五小象言“已上”，是过未至于极之义。此言“已亢”，是谓过之已甚，过之不能更过。","Z":"《易》中阳为大阴为小。为卦二阴函四阳谓之大过，四阴函二阳则谓之小过。大过像栋桡，小过像飞鸟。小过之义主要在于小，在于下。大事过或者过于大，在上或者志欲上，都不好。就是说，小过可小事不可大事，宜下不宜上，上逆下顺。在有的时候，有的事物，欲得中则必须过于中，欲矫枉则必须过于正。但是这只适用于小事，不适用于大事，小事过也是有限度的小过，不可以无限度地甚过。过，只能向下过，不能向上过。小过卦义与六爻之义是紧密相联系的。最能从反面表达卦义的是初与上两爻。初六处在最下，于时未过，于位亦在下，犹如鸟在栖宿之时，这本是好的，然而它志欲上，不能自禁而飞，终于致凶。上六阴柔小人又居小过之极，是属于过而不能知止的一类，正如鸟飞无所寄托，过而弗遇，必遭罗网，其所致之凶，实非一般，甚乃无异于灾眚。六二与六五都是阴柔得中，但是结果有所不同，六二既有中正之德，又处在下体，正合小过宜下不宜上之义，所以它或过或不及都适其时应其分而得其中，是六爻中最好的一爻。六五也是阴柔得中，但是它居于尊位，居尊位在它卦是好的，而在小过就不好了。因为它在上体，阴至于五，已经过甚，有违于小过不宜上宜下之义，故有密云不雨之象，想有所作为，其实不能有所作为。九三与九四二阳爻都不得中，是众阴柔所欲加害的对象，它们的问题是如何预为之防。防也要过防，即过于周防，过于早防，谨小慎微地防。九三则以刚居刚，而自恃其刚，不肯过为之备，故凶。九四虽也是刚阳，然而它居柔，不是过刚，又处于上体之下，所以有无咎之义，只要它随时处顺，安静不动，便什么事情也不会有。总之，小过亨，但有两个条件，一是可小事不可大事，二是不宜上宜下。六爻中凡符合这两条的，就无咎。违背这两条的，就凶。卦辞言“大吉”，而爻辞竟无一条言吉，无咎就是最佳的了。可见小过，从理论上说，是亨是大吉的，而一旦落实在实际上，如何处理好小过的问题就不容易了。"},"63":{"P":"《序卦传》说：“有过物者必济，故受之以既济。”《序卦传》所讲的这两句话，用以解释小过之后次之以既济的道理，显然是牵强的。然而《序卦传》在讲下一卦未济时说“物不可穷也，故受之以未济终焉”，却极为精卓，它把《易经》关于64卦排列的整体思想深刻地揭示出来了。依据“物不可穷也，故受之以未济终焉”的说法，我们可以看出《易经》作者将既济、未济两卦放在64卦之最后，是有其深刻的原因的。既济列在64卦倒数第二卦，与小过其实并没有什么必然联系。不管64卦倒数第三卦是哪一卦，其倒数第二卦是既济，当是肯定无疑的。这是因为《易经》作者对64卦的排列有一个总体的认识。他把64卦看作世间万事万物的一个大的发展过程。乾坤两卦是这个过程的开始，中间60卦是这个过程的展开，既济、未济是这个过程的结束。乾坤两卦居首以及首乾次坤的意义，开始时已经讲过。其余60卦每两卦可视为一环，环环相扣，构成了事物变化发展的长过程。既然64卦是个事物变化发展的过程，就必然有个结束的时候，所以最后倒数第二卦是既济。既济表示斗争已经止息，乾坤已经毁灭，事物已经穷尽。然而实际上斗争不能止息，乾坤不能毁灭，事物不能穷尽。所谓止息、毁灭、穷尽，不过是旧的过程结束，新的过程开始罢了。所以既济之后是未济，就表示斗争没有止息，乾坤没有毁灭，事物没有穷尽。旧的过程结束，新的过程将开始。64卦之最终两卦是既济、未济，其意义如同将乾坤两卦置诸64卦开头一样深刻，它反映《易经》作者具有清晰的“物不可穷”的伟大辩证观点。关于既济卦名的含义，古人意见有歧异。有人说既济是出险济难的意思，有人说既济说的是天下万事万物已成已济。从字面上看，“既”是已然之辞，“济”字《尔雅》释作渡，合起来是已经渡过。渡过的当然是大江大河，引申开来，当然就是出险济难之意。从既济的卦体结构看，上体是坎，也极容易使人理解为出险济难，因为凡上体是坎的卦如屯、需、蹇、节等，多言险象。不过既济有所不同，既济的含义应当比出险济难深广得多，抽象得多。《杂卦传》说“既济定也”，用一个定字概括既济之义，从表面上看，似乎不甚贴切，仔细揣摩，是再中肯不过了。定是什么意思？事物发展到一定程度，形成一种形态，暂时或者表面上不再变动，这就是定。因为既济定表示事物已经达到穷尽的地步，所以《序卦传》于未济卦说“物不可穷也，故受之以未济终焉”。物不可穷，正说明既济所处的地位从表面上看是穷，而实际上并没有穷。在64卦中泰、否、咸、恒、损、益、既济、未济等8卦六爻皆有应。在这8卦中既济与未济又比较特殊。即既济六爻都当位，阴爻都居阴位，阳爻都居阳位。未济六爻都不当位，阴爻都居阳位，阳爻都居阴位。六爻皆有应皆当位，表明矛盾全解决了，事物已发展到了穷尽的时候，没有什么可发展的了，一切都已经定了，这不正是既济卦在64卦中所表现出的本质特点吗！","G.N":"小字当是衍文。64卦中无“亨小”之义。如旅小亨，巽小亨，确实是小亨，而既济则是亨之大者，不应言“小亨”。孔子《彖传》言“既济亨，小者亨也”，意谓既济不只大事济，大道济，大德济，大人物济，小事也能济，小道小德小人物也能济，在既济这个时代，举凡天下事无论大小，无不能济。假使卦辞有“小”字，孔子《彖传》不应曰既济亨，只有以“既济亨”为断，才可看出《彖传》“既济亨”是卦辞，“小者亨”是孔子解释卦辞之辞。“初吉”，是说在既济之初，事无不吉。“终乱”，是说既济不能终吉，既济至一定程度，就要穷，穷则生变，变成未济。未济六爻皆不当位，是既济的否定，对于既济来说，它无异是乱。故云“初吉终乱”。不过，既济虽有“初吉终乱”之象，人在既济之时未必都是终乱。乱与不乱，还在人自身的掌握。如果人能够慎终如始，一直保持清醒的头脑，则虽有终乱之道亦复可济。","T.N":"“既济亨，小者亨也”。处在既济的时候，大者亨自不待言，即便是小者也都亨，无所不亨，故曰既济。既济是皆济，已经济的意思。如果未亨或者小者未亨，便不可谓既济了。\n“利贞，刚柔正而位当也”。既济阴爻在阴位，阳爻在阳位，六位都当位得正，故曰“利贞”。\n“初吉，柔得中也”。易以刚中为善，而既济未济都以柔中为善。这是因为既济以内卦为主，既济之所以为既济，主要在内卦，至外卦则走向未济了，故初吉归诸柔中。柔中指六二，在一卦之中，初与二皆为始。未济亦以内卦为主，至外卦则将转为既济，故以六五柔得中而致亨。\n“终止则乱，其道穷也”。卦辞言“初吉终乱”，“终乱”主要是强调天之道。孔子《彖传》讲“终止则乱”，显然是重“人之故”。“终乱”一语所强调的是终字，意谓事物初吉则终必乱，这是一般的规律。“终止则乱”则突出止字，强调人的因素是重要的。意谓人不知“终乱”的道理而终止，则必乱；若知“终乱”的道理而不止，则可不乱。天下之事，不进则退，人为的因素至关重要。“终止则乱”，不是终能致乱，人于其终而有止心，才是乱的根源。就一个人说，处平安无事，心满意足之时，则止心生，止心生则怠惰不勤，怠惰不勤则有患而不知为之防，有患而不知为之防则乱必不可免。就天下国家说，太平既久，则人苟安，止于逸乐；此时君临天下国家者，最当深自省惧，至兢至慎，不使至于止极。止极则衰乱接踵而至。其道已穷，理当必变。","X.N":"水性润下而居上，火性炎上而居下，水火相济，是为既济。既济虽然不是有患之时，但是患必生于既济之后。君子观既济之象应当知道思患而豫防之。处既济之时，人们极易以为无患而生止心；以为无患而生止心，则无患乃生患。在既济这种时候，君子贵于思患，贵于豫防。思患，思其终必有患。豫防，防于其始而使其终无患。","Y1.N":"初九以阳居下，上应于六四，又在火体，其上进之志锐甚，这在既济之初是极为不利的。在既济之初应当止其进，若进而不已，必有悔吝。可是初九按其本性说，欲进之志特甚，不花极大的气力是难以止其进的，故“曳其轮，濡其尾”乃得无咎。车欲前行，倒曳其轮，使之不得进，可见止进用力之大。狐之济水，必揭其尾，今不揭其尾而濡其尾，使之不克济，可见止进决心之坚。","Y1.XN":"“曳其轮”乃“曳其轮，濡其尾”的省语。言“曳其轮，义无咎也”，其实是说，“曳其轮，濡其尾，义无咎也”。义，道，理。曳其轮，濡其尾，自常理看应是有咎的，但是在既济初九这一爻，其道本来是无咎的。","Y2.N":"《彖传》讲的“柔得中”即指六二而言。六二以阴居阴，居中得正，与九五中正之君正应，应当顺利得行其志，无奈时已既济，九五不再是有为之君，无意重用六二这个柔顺中正的贤才。六二此时大可不必急于济世，患得患失，逐逐无已，应当自守中正之道以待时变，时一旦变，今日失掉的必将复得，故曰“妇丧其茀，勿逐，七日得”。六二以柔居柔，故称妇。茀，车茀。古人乘车，男子立乘，妇人坐乘。妇人坐乘必有车茀，车茀是掩车门之帘。现在车茀丧失了，车不能前行了。怎么办？勿逐。丧失就丧失，不必寻找它，七日将复得。震六二与此皆云“勿逐，七日得”，可见《易》言丧而复得皆以七日为期。盖日之数以十为盈，五日得盈数之半，不及半则称三日，过半则称七日。“七日得”是说丧而复得的时间不会多于五日，也不会至于十日。也就是说，时间不能太短，也不会太长，终究会得的。不可云“十日得”，十日是盈数，说“十日得”，就意味着永远不能得了。总之，七日是就人事上的迟速而言，不是从卦气的角度上说的。","Y2.XN":"六二丧而复得，今不得行，终必得行，根本的原因是它守中正之道，中正之道是不可能终废的。倘若无中正之道，或有中正之道而不知守，则“七日得”就无从谈起。","Y3.N":"既济这一卦，从六爻的发展看，有一个自未济到既济的过程。初九与六二居卦之下位，是欲济而未济之时，这时宜曳轮濡尾，丧茀勿逐，止于进，慎于行。至于九三，内卦到了终极，未济而既济了。九三当未济而达于既济的时候，本身又是以刚居刚，具备文明之德，它有责任也有能力完成既济的大业，故有高宗伐鬼方之象。高宗是商代著名的明王中兴之君武丁，他振衰拨乱，远伐不服，使国家由未济达到既济。高宗的中兴事业不唯伐鬼方，举伐鬼方以为代表而已。伐鬼方“三年克之”，说明国家中兴，由未济而既济，不是简单易行的事情，需要长时期的艰难奋斗方可实现。而且说明使国家中兴，由未济而达于既济，不是随便什么人都能胜任的，只有具备文明之德，刚武之威的殷高宗那样的人才能担此重任。“小人勿用”，不要任用小人，若任用小人，国家不但不能既济，反而会更加丧乱。","Y3.XN":"惫，疲惫。惫也，用三年的时间战胜鬼方，元气耗伤极大，已经疲惫不堪了。","Y4.N":"繻当作濡，谓渗漏。衣袽，废弃不用的破衣烂衫。古人乘船济水，船上豫备衣袽，一旦出现濡漏，则用以塞之。舟船济水不必每次都出现濡漏现象，但是衣袽却必须每次都豫备。这是古人生活中司空见惯的事情，几乎不假思索即可知晓个中的道理。而《易经》作者将它用到爻辞里，它就有了抽象的哲学意义。既济这一卦有告诫人们思患豫防的用意，六四这一爻在下体之上，正是既济已经实现的时候，而且处多惧之地，近君居险，它最需要无患思患，思患防患。它取“繻有衣袽”为象，是再恰当不过的了。又加上“终日戒”一语，更增加了六四需要思患防患的畏惧感和紧迫感，无时无刻不处在戒惧状态，不可有瞬息的懈怠。实际上祸患并未发生，而在六四的认识上却要以为祸患马上就要发生。","Y4.XN":"六四为什么要“终日戒”，为什么能够“终日戒”，就是因为它有所疑，疑患之将至。疑患之将至，方能保持防患的高度警惕性。在一般情况下，疑不是好事；在特殊的情况下，当疑而不疑也不好。","Y5.N":"“实受其福”，意义与得吉大体相同。“实受其福”，是谁受其福呢？是“实”受其福。《易》以阴为虚，以阳为实。九五是阳爻，所处坎体又是阳卦，可见受其福也就是获吉的是九五自身。“东邻杀牛，不如西邻之禴祭”有两层含义，既是对九五的警戒，也是对九五“实受其福”的有利处境的肯定。“杀牛”，杀牛以祭，是盛祭。禴祭，黍稷沼毛以祭，是薄祭。东邻西邻是彼此之词，不宜确指东邻西邻各为谁，更不可指认东邻西邻各是卦中哪一爻。东邻西邻不过是用以指代两种不同的祭祀而已。一种是用大牲的盛祭，盛祭可以致福但不一定能致福；另一种是用黍稷沼毛的薄祭，薄祭也可以致福但不一定能致福。致福与否关键不在于祭之盛与薄，而在于主祭人是否心怀诚敬；是否心怀诚敬的标志是多方面的，而为首的亦即根本的一条是看祭的时候是不是适宜恰当。祭之时过或不及都是不诚敬的表现。古人所谓“祭，时为大”正是此义。祭而不当时，纵然用牛，也难致福；祭而当时，虽用沼毛，也必致福。九五爻辞言东邻西邻的问题，意在告诫它祭祀勿忘诚敬，勿忘“祭时为大”，勿追求表面之文，要务内在之质。因为九五阳刚中正居君位，阳刚中正之君，正当天下国家既济治平，物大丰盛之时，骄奢易萌而诚敬之心必不足。爻辞告诫它：你勿自恃天下国家已进入既济治平的时代而忘却了祭祀以时不以盛。引申开来，是说九五最要紧的事情是注意时的问题，别忘记“既济”已经到来，“未济”就在后面，这是爻辞的一方面意义。另一方面，告诫归告诫，实际归实际。就全卦的实际情况看，下卦离奠定了既济的基础，上卦坎则享受既济之福。九五居上卦坎且为坎之主，享受既济之福的，显然非九五莫属。九五刚中居尊，也有主祭之象。从九五的角度说，别人祭用大牲，我祭用黍稷沼毛，虽人盛我薄，但我阳刚居中，实而得时，受福的必是我。","Y5.XN":"杀牛之盛祭不如不杀牛之薄祭。因为薄祭虽薄却当时，当时就好；盛祭虽盛却时不当，时不当便不好。祭之致福与否不在表面的文，而在内在之实。在祭祀的问题上，实也就是时。《易》阳实阴虚，阳大阴小。“吉大来”的“大”字，即爻辞的“实”字。“吉”字即爻辞的“福字”。“吉大来也”谓时候既然已到，大福不求而自来。《汉书·郊祀志》杜邺所谓“德修荐薄，吉必大来”，就是这个意思。","Y6.N":"从画卦时的顺序说，初爻为始为本，上爻为终为末。从成卦的角度看，上爻是卦之首，初爻是卦之尾。“濡其首”指的是上六自身。厉，危厉，危险，但尚未及于凶。危厉还有转危为安的可能，至于凶便无可挽救了。上六处在既济之终，坎险之上，自己又是阴柔之才，其道穷极已达到了衰乱的地步，像狐涉水而濡溺其首，可谓危厉极了。济水涉险而不虑前，遂至于淹没了脑袋，危厉可想而知。卦辞讲的“终乱”，《彖传》所谓“道穷”，在上六这一爻表现出来了。","Y6.XN":"“何可久”，不可以久。“何可久”，有两层意思。从客观的规律说，物不可以终穷，穷极必变，既济终了，未济即将开始，濡其首的危厉局面不会持续太久。从主观的愿望说，是作《易》者告诫上六及早知危而反，濡首之厉切不可久溺，否则厉就要转为凶了。《易》中言厉，都包含一定的深意，不是决绝之语，与言凶言悔言吝是不同的。《易》中屯上六、否上九、离九三、中孚上九、小过九四以及本爻小象言“何可久”、“何可长”、“终不可长”等，都是劝诫翻然改悟而不迷溺的意思。","Z":"既济这一卦在64卦的排列系列中占有重要的地位。既济与未济联结在一起，构成整个64卦排列系列中绝对不可或缺的关键的一环，它的重要意义简直可以同乾坤二卦相媲美。有了这两卦，我们才得以看到《周易》关于事物发展思想的完整性和彻底性。《周易》的作者把事物看作有始有终，终而复始，有生有灭，生生不息的过程。过程由天地之分开始，故乾坤两卦居首；有天地之分，然后万物以生，故乾坤二卦之后排列着其余诸卦；事物的运动变化有内在的必然联系，过程中包含着一个个阶段，如同链条般依次连结，故诸卦的排列环环相扣，井然有序；过程必有穷尽之日，矛盾总有解决之时，故它的终结看来是既济。既济六爻皆应又皆当位，矛盾消失了，乾坤或几乎息，物或几乎穷，然而乾坤不能息，物不可穷。旧过程息，新过程又生。旧过程的终结应是新过程的开始，所以既济像似终结不是终结，未济不似终结却是终结。既济恰巧处在新旧过程的联结点上，它不是新过程的开始，却联结着新过程的开始；它不是未济，却孕育着未济。把既济安排在64卦之后而又不是最后，《易》作者运用哲学匠心，把他的“物不可穷”的伟大思想表达得如此巧妙、深刻和富有魅力，以致于我们在数千年后的今天来读它仍要不止一次地惊叹不已。既济一卦的思想反映在它的卦辞和《彖传》里。“既济亨”，六爻皆应皆正，斗争止息了，问题解决了，大事小事无不亨。物极必反，既济而将未济，所以“初吉终乱”。《易》讲天道更为人谋，既指出发展的必然性，也鼓吹人的能动性，所以虽然“初吉终乱”，但是人若知终而不止，则可有终而无乱。唯其如此，无论卦义爻义无不蕴含着无患思患，思患防患的良苦用心。从全卦总体上看，下体离三爻由初至三渐渐进入既济，故而是好的，不见凶咎。不过人处在既济的状态，必须时刻思患而豫为之防，故也不见吉。初九以刚居下应四，须曳轮不进，濡尾止济，方可无咎。六二亦须小心谨慎，虽可行但不苟行，唯需待而已。至于九三，以刚居刚，处内卦之终，经过“高宗伐鬼方”的长期艰难斗争，事方克济。既济之最大问题思患豫防，故戒之以“小人勿用”。上体坎，出明而入险，既济开始向未济变化，三爻皆渐渐不好。六四“繻有衣袽，终日戒”，须终日思患防患，时刻保持如坐敝舟而水将骤至的意识，才可能免患，不好的端倪已经显露出来。九五强调求实不求文，要诚不要盛，杀牛不若禴祭，用意也是示以警惧，处在既济治平，物大丰盛之时，要紧的是守以损约，行以诚敬，更加表明既济至于九五，就时来说，表面上好，其实不好。上六的时不好至极，濡首之厉，等于宣布未济的时代已经来临，犹如饮酒已至酩酊，开花已至离披，时运过于不佳。然而毕竟要到未济而未到未济，濡其首只是厉而已，尚未至于凶，若人之主观符合客观，认识清楚，患不是不可避免，故小象说濡首之厉，“何可久也”。"},"64":{"P":"《序卦传》说：“物不可穷也，故受之以未济终焉。”64卦发展到既济这一卦，事物似乎已经到了穷尽的地步，乾坤或几乎息矣，矛盾消失了，斗争止息了，问题解决了。但是乾坤不能息，斗争不能止，“物不可穷”，所以既济之后还有未济。因为既济不是旧过程的结束，旧过程的结束应当包括新过程的开始，所以64卦的最后一卦是未济不是既济。物不可穷，是说事物的变化无有穷尽，一个过程终止了，接着是下一个过程，过程连着过程，生生不已，没有止境。整个《周易》是一部讲变易的书，64卦的排列蕴含变化的思想，只是没作文字的说明罢了。孔子作《序卦传》把《易经》里面存在但未能讲明的“物不可穷”的伟大的辩证法思想讲明了。“物不可穷”的思想既属于《易经》也属于孔子的《易大传》。“物不可穷”的思想集中地反映在未济这一卦上，未济即未穷，未穷即生生不已之义。为卦坎下离上，火在水上，火向上而水向下，不相为用，而且六爻皆不当位，故为未济。","G.N":"既济亨，未济亦亨，二亨的含义有所不同。既济亨，大事亨，小事亦亨，大者亨，小者亦亨，无所不亨。未济亨，则小者不能亨，亦即小道小德不能亨。又，既济亨是已然之亨，亨已成为现实；未济亨是未然之亨，亨只是一种可能性，终究能亨不能亨，要看事态的发展和主观的努力如何。汔，几。小狐，相对于老狐而言。老狐戒慎知惧，履水犹听，唯恐陷入，涉水就更不忘举尾，故可以济。小狐则不知畏慎而果于济，看来几乎就要济了，但是它不知举尾而濡其尾，到底是未能济。濡其尾而不丧生就算大幸了，更何有所利？总而言之，未济卦辞之义是，未济能亨，但是“老狐”能亨，“小狐”不能亨，亦即大者能亨，小者不能亨。","T.N":"“未济亨，柔得中也”。既济和未济都以柔得中为善。既济之柔得中在六二，未济之柔得中在六五。既济以内卦为主，至外卦则转向未济了；转向未济就要“终乱”了，所以既济之初吉必得之于六二柔得中。未济也以内卦为主，至外卦则转向既济了，但是只有在转向既济的时候才有亨可言，所以未济之亨根据不在内卦，而在外卦六五之柔得中。\n“小狐汔济，未出中也”。小狐汔济，所指是九二，九二处在坎险之中，上有六五之应，处未济而将济的时候，它应当出险，似乎也能够出险，但是它未能出险，因为它是阳刚；阳刚在未济这一卦里都失位，发挥不了它应有的作用，急于求进却无力出险，结果才有小狐汔济濡尾之患。\n“濡其尾，无攸利，不续终也”。不续终，有始无终，开始挺果敢，但不能继续而终之。顾首不顾尾，济了头却濡了尾，头尾不相接续。因为不续终，所以无所往而利。既济“终止则乱”，未济不续终则无所往而利，可见克终之难。值得注意的是，同是“濡其尾”一语，在既济是敬慎不轻进的意思，在未济则变成了有始无终，浮躁冒进之谓。\n“虽不当位，刚柔应也”。这两句话已不是解释卦辞，是孔子讲过卦辞之后谈自己的体会。未济虽然六爻皆不当位，看来欲济似乎很难，但是未济也有有利的方面，它的六爻刚柔两两相应，上下内外都相与，如果能够克服不利，发扬有利，量力度时，虑善而动，则未济亦可济。","X.N":"火性炎上而在上，水性润下而在下。在上的往上去，在下的往下来，二者不能相交，也不能相互为用，所以才是未济。火在水上，算不算各得其所的正常现象呢？朱熹《周易本义》说“水火异物，各居其所”，以为是正常现象。程颐《易传》说“火在水上，非其处也”，以为不是正常现象。从下文“君子以慎辨物居方”的“慎”字看，程说是对的。不然，火在水上已是各止其所了，君子何必还要慎呢！“辨物”与“居方”是互文。物与方同义，都是指世间万事万物的品类而言，“辨物”是说分别世间万事万物的种类，不使混淆。“居方”是说把世间万事万物加以分别之后还要使之各得其所。这是个重要问题，君子务必慎重对待，否则像未济那样火在水上，是不行的。“辨物居方”，重点在“居方”，亦即强调如何使物各止其所当止的问题。此与同人大象的“君子以类族辨物”既相似又不同。二者都是要求辨物，这一点相同。同人大象“类族辨物”的目的在于在世间不同事物中存异求同，以达到“和而不同”的境界。异就是不同，同就是和。而未济大象“慎辨物居方”强调的不是求同，恰恰相反，是要把不同的事物分辨开来，使之各止其所。","Y1.N":"初六阴柔居坎险之下，上与九四正应。居于坎险必不安于坎险，应于九四必欲上行，所以它非要济不可。然而它自己阴柔，力不从心，九四不是中正之才，也不会来援助它，故有濡其尾之象。古语说：“狐欲渡河，无如尾何”，今狐濡尾，自不能济。力不能进却不自量力而进，欲济而终不能济，实可羞吝。此云“濡其尾”，既济初九亦云“濡其尾”，辞虽同而义不同。此云“濡其尾”，喻不当济而急于济，彼云“濡其尾”，喻当济而慎于济。急于济而不能济，故吝；慎于济而能不济，故无咎。","Y1.XN":"极，终。“亦不知极”，犹云不知其终。开始就如此莽撞，终局如何亦必不知，与《彖传》“不续终”义含。","Y2.N":"曳其轮，倒曳其轮使车不进。九二以刚居柔得中且上应六五，其力是足以济的。但它身在坎险之中，又处未济之时未可以大用，曳其轮，正是不敢轻进，待时而动。本可以进却自止不进，故为得正而吉。既济初九曳其轮，未济九二亦曳其轮，二者义同而位不同，位不同亦即时不同。九二刚中有中德还要与既济初九一样曳其轮，说明未济处境尤艰，比既济更须遇事小心，不宜轻进。","Y2.XN":"九二以阳居阴，位并不正，何以言“贞吉”？原因是易例正未必中，中无不正。《易》中九二、六五往往言“贞吉”，就是因为它们得中，《易》贵中，得中即包含着正了。此爻小象将此义讲明白了。“中以行正”，九二之得正，是由于它居中的缘故。","Y3.N":"此爻之义最为难明。既说“征凶”，不宜有所行动，又说“利涉大川”，宜有所行动。古人为了弥合矛盾，尽力圆通，然而无不穿凿附会，难以令人信服。唯朱熹《周易本义》说“疑利字上当有不字”，值得考虑。古人辗转抄书，脱一个字并不奇怪。如果有一个不字，“利涉大川”原来是“不利涉大川”，爻义便极通顺。既济以内卦为主，由初九、六二以至于九三，渐致既济。初与二还在发展中，至九三才算真正达到既济。未济也以内卦为主，至六三已达未济之终，过此则近于济，所以六三明言“未济”。六三在坎险之上，应当出险也可以出险，但是它正当未济的时候，又是阴柔之才，不中不正，实际上没有能力出险以济，故曰征凶。做一点小事情或许可以，欲涉大川，济大难，干大事业，是绝对不行的。","Y3.XN":"未济六爻全不当位，而小象独于六三言“位不当”，是因为未济由六三而成，而居三的又是个阴柔之才。以阴柔之才居阳位，是六三“征凶”的主要原因。","Y4.N":"此贞吉是戒辞，意谓九四本有悔，如果能够贞吉则悔可以亡。九四不正又不中，何以曰贞？此贞字宜释作贞固、固守，用今语表述即坚定不渝之意。那么，九四应当固守什么？九四的悔又在哪里？九四的悔在于它虽是阳刚却居阴柔之位，其位不正。又九四由于以阳居阴，位不正，虽然它已经出了坎险并且未济已过中，开始向既济转化，有了可济的希望，但真正能济，也绝非轻易之事，它必须像“震用伐鬼方，三年有赏于大国”那样，竭尽阳刚之力，坚持不懈地去争取，方可克济获吉而悔亡。“伐鬼方”是当时尽人皆知的伟大、正义、艰苦的事业，一提到它，人们立即会想到全力以赴，艰苦卓绝的精神和胜利后天下既济治平的景象。既济九三与未济九四皆有“伐鬼方”之象，这是因为既济未济二卦是既反又对的关系，既济的九三反过来就是未济九四，故其象相同。这种情况在《易》里并非绝无仅有。损与益是相反关系，损六五言“十朋之龟”，反过来就是益之六二，故又言“十朋之龟”。夬与姤由于同样的原因，九四与九三都取“臀无肤，其行次且”之象。不过因为位不同，相同的象在不同的卦里也有些具体的差别。既济至九三，既济之大局已定，故云“三年克之”，表示伐鬼方已经胜利。未济九四则未济刚刚过去，既济尚在争取中，故云“震用伐鬼方”，表示征伐正在进行。“三年有赏于大国”，言三年之间犒赏军队经常不断。与师九二的“王三锡命”同，而与师上六之“大君有命”不同。战争进行中犒赏，是强调对战争用力之甚，战后论功行赏，是突出胜利后施政之谨。又，九三、九四皆非君位，何以言殷明王高宗之事？原来《易》有的论其位其人，有的论其时其事。这两爻所论的是在上下卦之交的时和伐鬼方的事，而与是否君位和伐鬼方者为谁无涉。","Y4.XN":"“贞吉悔亡”，正是九四的志愿要达到的目标。九四所处之时很好，九三在卦中代表未济，未济已过，九四正在未济开始转为济的时候，又能竭尽全力，坚持不懈地像“伐鬼方”那样求济，它一定会济，会获吉，会悔亡。这是它的志愿的实现。","Y5.N":"未济卦有三“贞吉”，意义略有不同。九四“贞吉”的贞字是贞固、固守的意思，“贞吉”是戒辞。九二与六五“贞吉”之贞应释作正。九二与六五虽位皆不正，但由于得中。得中即可认为也得正。所以九二与六五的“贞吉”不是戒辞，乃是爻象中固有的。六五为什么能够贞吉而无悔？因为六五居离体之中，是文明之主，以柔居刚而应于九二之刚。既文明又虚心求在下之贤，九二亦乐于辅佐它。《彖传》所说“未济亨柔得中也”指的正是它。它由贞正而吉，由吉而无悔，是理所当然的。无悔好于悔亡。悔亡是有悔而悔亡。无悔则是根本没有悔，《易》中四、五两爻连言悔亡、无悔的，除未济外还有咸卦和大壮，情况略同。值得注意的还有一点，此爻爻辞有两个“吉”。前一个“吉”，是得之于贞正，得于之于六五的德，可谓德之吉。后一个吉是由于“君子之光有孚”而得，是因功得吉。六五是文明之主，故称“君子之光”。六五处在未济的时代，以自己的才德变未济为既济，使天下国家由乱而达于治，它的功和它的德是相称的，故曰“有孚吉”。六五逢未济之世，其光辉倍于常时，犹如雨后之日光，焚余之山色可见。","Y5.XN":"君子之光的吉，是由于它的光不是一般的光而是晖光的缘故。晖即辉，是光之散。只有极盛的光才能生晖。爻辞中前一个吉是贞吉之吉。贞吉之吉是德之吉，这种吉只影响到六五自身，是自身之吉。后一个吉是晖吉之吉。晖吉是功之吉，这种吉影响到天下，是天下之吉。","Y6.N":"既济卦最终必发展为未济，故既济上六有濡其首之厉。未济卦最终必发展为既济，故未济上九言“有孚于饮酒无咎”。不过凡事无不有个限度，超过限度，好事也会变成坏事，所以爻辞接着就告诫说：“濡其首，有孚，失是”，即饮酒自乐应有度，若沉湎于酒，耽饮而至于濡首，那就会因此而失掉“有孚”。","Y6.XN":"这是说饮酒须掌握分寸，不使过中。全易“小象”言节者凡四，皆与坎或离有关。蹇九五在坎体居中，刚而中正，“小象”曰“中节”。家人九三在离体，刚而不中，“小象”曰“失家节”。鼎上九在离体，以阳居阴，刚而能柔，“小象”曰“刚柔节”。未济上九在离体。离为火，火本炎上，离又在卦之上，过中不正，“小象”曰“不知节”。可见《易》所言“节”，归根结底是“中”的问题。","Z":"未济这一卦与既济是反对的关系，把既济的卦画自下而上倒过来就是未济。具有反对关系的卦在64卦中不止既济与未济，而既反又对的卦则只有泰否和既济未济。至于既反又对，六爻又皆应的卦，64卦中唯既济未济而已。既济未济的关系在64卦中极为特殊，其特殊的程度仅次于乾坤二卦。乾坤二卦是64卦之首，既济未济是64卦之终。乾坤两卦合观可视为《易》之门，既济未济合为一卦可看成既是旧过程的终结又是新过程的开始。所以既济未济两卦几乎密不可分。极为明显的一点是，既济初上濡尾濡首，未济亦然。伐鬼方与曳其轮，二卦共象，唯差一位而已。两卦皆由坎离组成而所重皆在离。既济离在下，初九至九三三爻讲如何谨慎求济。上卦是坎险，六四至上六三爻渐渐走向未济，表明“物不可穷”。未济离在上而坎在下，说明既济的终就是未济的始，既济之时已经包含着未济。未济内三爻讲未济之事，初六有濡尾之吝，九二言曳轮之贞，六三戒以征凶位不当。而外三爻进入离体，离为明，情况逐渐好转，九四伐鬼方有赏，未济将变为济，但需经过艰苦的斗争。六五君子之光有孚，吉而又吉，天下既济治平之日又至矣。至上九有孚于饮酒无咎，天下既已升平，饮酒自乐可无咎，然而不可沉湎于酒而不知节，于是又埋下了危险的契机。从64卦的全过程看，既济是这个长过程的终结，然而“物不可穷”，在旧过程终结的同时，新过程又开始了。把既济未济两卦作为一个独立的整体考察，不难发现，它们正反映了易变易的终始之义。这个终始之义绝不能归结为循环论。应该承认，它们已经意识到了一个伟大的真理，即：事物总是按着否定之否定的形式向前发展。"}}};

    function annotateScriptureHtml(rawText) {

            }

        const ch = chars[i];
        const py = pyArr[i];

          if (parsed.pinyinMode === "rare" || parsed.pinyinMode === "all" || parsed.pinyinMode === "off") state.pinyinMode = parsed.pinyinMode;
          if (parsed.aspectRatio === "20:9" || parsed.aspectRatio === "16:10" || parsed.aspectRatio === "auto") state.aspectRatio = parsed.aspectRatio;
          if (parsed.orientation === "portrait" || parsed.orientation === "landscape") state.orientation = parsed.orientation;
          if (parsed.uiScale === "auto" || parsed.uiScale === "0.75" || parsed.uiScale === "0.85" || parsed.uiScale === "1") state.uiScale = parsed.uiScale;
          if (parsed.fontSize === "13.5" || parsed.fontSize === "15.5" || parsed.fontSize === "18" || parsed.fontSize === "20.5") state.fontSize = parsed.fontSize;
          if (parsed.scrollPositions && typeof parsed.scrollPositions === "object") state.scrollPositions = parsed.scrollPositions;
          if (Array.isArray(parsed.historyStack)) state.historyStack = parsed.historyStack.slice(-40);
        }
      } catch (e) {}
      applyTheme(state.theme);
      applyOrientationDefaults();
      applyViewportLayout();
      applyFontSize(state.fontSize);
      updateSettingsUI();
      updateSealActionButtons();
    }

    function applyFontSize(sizeStr) {

      // 字号按“视觉像素”定义：整体缩放 s 时反向补偿，使 75% 下仍显示 100% 时的字号
      const visualPx = parseFloat(state.fontSize) || 15.5;
      const s = state.appliedScale || 1;
      const commPx = visualPx / s;
      document.documentElement.style.setProperty("--comm-font-size", commPx.toFixed(2) + "px");
      updateSettingsUI();
    }

    // Zero-Blank-Space Multi-Ratio & Orientation Layout Engine
    // Guarantees 100% vertical height coverage (zero top/bottom blank bars) even at 75% or 85% scale!
    function applyViewportLayout() {
      const folio = document.getElementById("folioFrame");
      if (!folio) return;

      document.documentElement.setAttribute("data-orientation", state.orientation);
      document.documentElement.setAttribute("data-ratio", state.aspectRatio);

      const vw = window.innerWidth || 390;
      const vh = window.innerHeight || 844;
      const screenRatio = vw / vh;

      let boxW = vw;
      let boxH = vh;
      let isFramedDesktopCard = false;

      if (state.aspectRatio === "auto") {
        boxW = vw;
        boxH = vh;
      } else {
        const ratioNum = state.aspectRatio === "20:9" ? (20 / 9) : (16 / 10);
        if (state.orientation === "portrait") {
          const targetPortraitRatio = 1 / ratioNum; // 9/20 (0.45) or 10/16 (0.625)
          // Always fill 100% of vertical screen height (boxH = vh) so there is NEVER any top/bottom blank space!
          boxH = vh;
          if (screenRatio > targetPortraitRatio * 1.25 && vw >= 560) {
            boxW = Math.round(vh * targetPortraitRatio);
            isFramedDesktopCard = true;
          } else {
            boxW = vw;
          }
        } else {
          const targetLandscapeRatio = ratioNum; // 20/9 (2.222) or 16/10 (1.6)
          if (vw >= vh) {
            // Device is in landscape: always fill 100% height (boxH = vh) so there is zero top/bottom blank space!
            boxH = vh;
            if (screenRatio > targetLandscapeRatio * 1.12 && vw >= 900) {
              boxW = Math.round(vh * targetLandscapeRatio);
              isFramedDesktopCard = true;
            } else {
              boxW = vw;
            }
          } else {
            // Device is held vertically while previewing Landscape mode: fit targetLandscapeRatio cleanly
            boxW = vw;
            boxH = Math.min(vh, Math.max(320, Math.round(vw / (targetLandscapeRatio * 0.85))));
            isFramedDesktopCard = boxH < vh;
          }
        }
      }

      folio.classList.toggle("framed-card", isFramedDesktopCard);

      // Compute optimal internal scale `s` so content never clips and matches the comfortable ~75-85% visual density on 20:9 phones
      let s = 1;
      if (state.uiScale !== "auto") {
        s = parseFloat(state.uiScale) || 1;
      } else {
        if (state.orientation === "portrait") {
          // Reference internal width: 445px for 20:9 (so a 360px 20:9 phone automatically gets ~80% comfortable scale), 415px for 16:10 / auto
          const refW = state.aspectRatio === "20:9" ? 445 : (state.aspectRatio === "16:10" ? 415 : 410);
          const refH = state.aspectRatio === "20:9" ? 780 : 680;
          s = Math.min(1, boxW / refW, boxH / refH);
        } else {
          // Reference internal width for Landscape Left-Right layout: 960px for 20:9, 900px for 16:10 / auto
          const refW = state.aspectRatio === "20:9" ? 960 : 900;
          const refH = state.aspectRatio === "20:9" ? 430 : 460;
          s = Math.min(1, boxW / refW, boxH / refH);
        }
      }

      // Ensure minimum internal width so 8 trigram pips and landscape matrix never clip even if user picked 100% on a tiny screen
      const minRequiredW = state.orientation === "landscape" ? 840 : 385;
      const minRequiredH = state.orientation === "landscape" ? 395 : 610;
      s = Math.min(s, boxW / minRequiredW, boxH / minRequiredH);
      s = Math.max(0.32, Math.min(1.15, s));

      state.appliedScale = s;

      // Expand internal layout dimensions by 1/s so that after transform: scale(s), the visual box is EXACTLY boxW x boxH with ZERO top/bottom blank space!
      const internalW = Math.round(boxW / s);
      const internalH = Math.round(boxH / s);

      folio.style.width = `${internalW}px`;
      folio.style.height = `${internalH}px`;
      folio.style.transform = Math.abs(s - 1) < 0.005 ? "none" : `scale(${s.toFixed(4)})`;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function highlightTextHtml(rawText, query) {
      if (!rawText) return "";
      const q = (query || "").trim();
      if (!q) return escapeHtml(rawText);
      const parts = rawText.split(q);
      if (parts.length === 1) return escapeHtml(rawText);
      const escapedQ = `<mark class="search-hl">${escapeHtml(q)}</mark>`;
      return parts.map(p => escapeHtml(p)).join(escapedQ);
    }

    function formatParagraphsHtml(rawText) {
      if (!rawText) return "<p>（原书无此节讲解）</p>";
      const hl = (state.highlightQuery || "").trim();
      const lines = rawText.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      return lines.map(line => `<p>${hl ? highlightTextHtml(line, hl) : escapeHtml(line)}</p>`).join("");
    }

    const COMM_ORIG = ZHOUYI_BUNDLE.orig || {};

    function pickComm(gua, key) {
      if (state.commentaryEdition === "orig") {
        const o = COMM_ORIG[gua && gua.id];
        if (o && typeof o[key] === "string") return o[key];
      }
      return (gua && gua.blocks && gua.blocks[key]) || "";
    }

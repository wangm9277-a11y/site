用我之强。晋卦大象说“自昭明德”，意谓我用我之明。","Y1.N":"晋如，升进。摧如，抑退。初六以阴柔居卦之初，晋之始，不以进退为虑，进亦可，不进亦可。可进则动而进，故晋如，不可进则抑而退，故摧如。无论晋如摧如，自己都坚守正道。能够如此，没有不获吉。然而初六毕竟处于晋之初，不易得到上下的理解和信任，当此之际，宜处之以宽裕，既不汲汲于进，也不悻悻于不进。雍容宽裕如此，自然无咎。","Y1.XN":"可进则进，宜退则退。得进不喜，见摧不馁，我行我正。“未受命”，初六尚未受命做官，无官守亦无言责，进退主动自如，绰绰然有余裕。","Y2.N":"晋卦初三四上四爻都刚柔相应，唯六二与六五无应。六二自身又是以柔居中得正，有中正柔顺之德，不是强于进之辈，所以不以进为喜，而以进为忧，有晋如愁如之象。六二能如此便是贞，贞则必得吉。从长远的角度看，六二会“受兹介福，于其王母”的。介福，大福。王母，祖母。六二虽无应援，自进有困难，但它具有中之正德，时间久了，人们了解它了，必有与之同德的人主动来请它出去，让它晋升，给它厚禄，使它享受大福。谁能对六二如此垂青，当然是六五了。六五即是“王母”。二与五如果是正应，便有君臣之象，如果不是正应，是以阴应阴，便有妣妇之象。妣妇之象，不说母而说王母，是根据古代昭穆制度而来的。孙妇祔于祖姑，不祔于姑。孙妇与祖姑相配。《易》以相配比喻相应，所以称六五为王母。","Y2.XN":"推原六二受福之由，只缘六二居中守正。唯其居中守正，才不求骤进而终得进。","Y3.N":"六三以阴居阳位，不中不正，本当有悔，但六三处于下体坤之上，最为柔顺，且与上九正应，有上行之志。初六与六二二阴也都想上进，因而赞成六三顺乎上，并且同六三一起行动。对于六三来说，行动得到同志的拥护，既获众允，悔必亡矣。","Y3.XN":"六三与上九正应，其志在上行，获得初六与六二二阴的信赖和支持，还能有什么悔呢。初六罔孚，未获众允；六二受福，犹为有待；六三则志获众允，进而上行已变为现实了。","Y4.N":"鼫与硕同，鼫鼠犹《诗经》所云硕鼠，硕鼠之性，贪而畏人。九四以一阳居近君之位，从卦辞的角度看，它相当于康侯，然而爻辞却完全相反，不但不说它是康侯，反而说它有鼫鼠之象。这是因为卦义所主在柔，而九四以刚居柔，居位不当，时义亦相违。贪据高位，又失柔顺之道，对于下面势必上进的三阴存畏忌之心。处在晋的时候，九四如有持禄保位，固守鼫鼠一样的这些问题，其危厉可知。","Y4.XN":"九四的根本问题是位不当。首先是以刚居柔，爻位不当。其次，以贪而畏忌之才居近君之位，是才不胜位，从事理上说，亦可谓位不当。","Y5.N":"六五以柔居尊位，本当有悔。然而六五是晋卦之主，《彖传》所说的顺而丽乎大明的康侯，指的就是它。它是大明之主，下皆顺附，所以其悔得亡。六五毕竟是柔顺之才，且在晋的时候，易有失得之累。六五作为大明之主应当注意这个问题。对于众人，尤其对于贤能之士，要推诚任用，发挥他们的作用；不要自任其明，忧得忧失。能失得勿恤，则往吉而无不利。","Y5.XN":"六五作为大明之主，推诚用贤，不忧失不忧得，如此以往，乃国家之福庆。","Y6.N":"角，兽类之角。邑，自己辖下的私邑。上九以刚居晋之极，情况很不好。因为晋卦如《彖传》所说，“顺而丽乎大明，柔进而上行”，主柔而恶刚，柔好刚不好，而且上九已至晋之穷，没有再进的余地了。所以象之以“晋其角”。“晋其角”是要进而无可进，无可进而又急躁要进，这样必有危厉。“维用伐邑”，是说唯独把急躁求进的气力和劲头用到伐邑上，则可以使危厉的处境变为吉，变为无咎。伐邑，是反身克己的意思，把注意力放到解决自己的内部问题上来，也就是知进也知退，变进为退。不过这样做，虽可以吉无咎，但是到底有失中正，无中和之德，严格地说，还是吝的。","Y6.XN":"维用伐邑，既已得吉而无咎，又说贞吝，这是因为其道未光大。严格地要求，上九不中不正，于道未为尽善，纵然有以过刚退而自治之功，终不免于可吝。","Z":"《周易》晋、升、渐三卦都讲进，而意义有所不同。晋卦之进如日出地上，明盛而进，其义最优。升卦之进如木之方生，其义不如晋。渐卦之进如木之既生而以渐高大，其义又不如升。晋卦之进是“柔进而上行”的，用柔而不用刚，柔进好而刚进不好。卦中六爻四阴二阳，阴多吉而阳多厉。下三爻皆柔顺而属坤体，初六、六二吉，六三悔亡。上三爻中九四、上九厉且吝，最为不好，因为它们是阳刚又不当位。唯六五以柔阴居尊位，正合《彖传》所说“顺而丽乎大明，柔进而上行”之义，是晋卦之主，所以是六爻中最好的一爻，往吉无不利。"},"36":{"P":"《序卦传》说：“晋者进也。进必有所伤，故受之以明夷。夷者伤也。”夷是伤的意思，晋进不已，进到一定程度时，没有不受伤的。所以晋卦之后次之以明夷。明夷离下坤上，明入地中，与晋卦恰成反对。晋卦是明盛之卦，明君在上，群贤并进。明夷是昏暗之卦，昏君在上，明者受伤。明夷之时，日不是出于地上，而是入于地中，一则是明者伤，一则是昏而暗。","G.N":"夷，伤。《杂卦传》说：“明夷，诛也。”其实诛也是伤的意思。明夷，明入地中，就社会来说，是政治黑暗的时代，君子处在这样的时代，唯一正确的道路是知艰难而不失贞正，绝对不可随世倾邪，依人步趋。《周易》爻辞言“利艰贞”的有噬嗑九四、大畜九三，而以“利艰贞”一语作卦辞的，则只有明夷一卦。可见明夷对于君子来说是个忧患的时代。","T.N":"“明入地中，明夷”，用卦象解释卦名。本卦与晋卦都是《彖传》与大象同辞。\n“内文明而外柔顺，以蒙大难，文王以之”。内卦是离，离有文明之象。外卦是坤，坤有柔顺之象。表明一个人内有文明之德而外能柔顺。昔日文王就是这样，文王在纣王暴虐的时代，由于内文明而外柔顺，故能蒙大难而免于祸患。\n“利艰贞，晦其明也。内难而能正其志，箕子以之”。君子处在明夷这个黑暗艰险的时代，唯一可行的出路是利艰贞。利艰贞，包含两个层次的含义。一是处艰难要晦藏其明，二是处艰难要不失其正。箕子的行为可以说是“利艰贞”的典型表现。箕子处在殷纣之时，能够佯狂披发以晦其明，又能自守其志，为囚奴而不改其正，箕子是纣王近亲，纣王之难于箕子来说是家难，家难关系同姓一家之内，故曰内难。纣王之难对于文王来说关系天下人的命运，故曰大难。","X.N":"君子观明入地中之象，认识到临民治众应用晦而明。用晦而明，是明藏在晦之中，表面上是晦，实际上是明。这是一条很重要的政治经验。后世政治家们常说的“水至清则无鱼，人至察则无徒”，与此义正同。","Y1.N":"初九以阳处明夷之初，距离明夷之受伤害还远着呢，但君子有见几之明，不待难作而及早遯避。遯避又尽量行动迅速，所以称“于飞”；既迅速了又尽量隐蔽不被人察觉，所以称“垂其翼，”即敛翼而下行。“君子于行”，一旦决定丢弃禄位而离去，便急速走开，宁可“三日不食”也不能停步，即使主人有非议，也在所不顾。","Y1.XN":"君子见难将作，乃及早迅速离去。于飞、于行、攸往、不食，都是义所当然。","Y2.N":"六二以阴居阴，居中得正，柔顺之至且为明之主，是善于顺时自处的君子，但是在明夷的时候也不免受到小人的伤害。“夷于左股”，伤害并不严重。“用拯马壮吉”，六二能够采取强有力的办法迅速、及时地加以拯救，可以避免伤害而得吉。吉只是避免伤害而已，不是说此时可以有所作为了。","Y2.XN":"六二作为明之主，在明夷的时候能够避免伤害而得吉，主要因为它顺以则，即虽柔顺但不失其中正之则。","Y3.N":"南，前方，也是明方。狩，狩猎以除害。南狩，前进狩猎以除害。大首，暗方的魁首。九三处明体之上，是至明在下而为下之上，而上六处坤之上，暗之极，是至暗在上而为暗之首。九三与上六正相敌应，为至明克至暗之象，“不可疾贞”，谓克获暗方的大首是首要的，至于整个社会和一般老百姓的问题，要有渐进的过程，不能遽革。这应是指武王伐纣事。","Y3.XN":"南狩之志，谓除害安民，大得谓大得志。","Y4.N":"初九、六二、九三居明体，在暗外，均为明而见夷者。六四进入坤体。坤在全卦来说是暗。君子进入暗处，应当设法离去，以不受暗之伤害。六四有条件做到这一点。六四居坤之下，陷入暗地尚浅，而且柔而得正，不过“入于左腹”而已。这一爻讲的是商周之际微子去商适周的事。“于出门庭”，谓微子以纣王暴虐，覆亡在即，乃毅然行遯，离开自己的家族商王朝而投奔周人。“获明夷之心”，谓微子所以这样做是由于获得了明夷之心。明夷之心，谓明夷之理，亦即君子处在明夷之时应当怎样办。","Y4.XN":"“入于左腹”是爻辞全文的略语。“获心意”即是“获明夷之心”。微子行遯，等于对自己家族的背叛，他要克服这种心理上的压力，就要有一种更为强大的信念作为他去商适周即弃暗投明的思想基础。","Y5.N":"《易》一般以五为君位，但《易》重变动随时，有时五虽居君位但不是君。明夷就是以上六为君，六五为臣。上六以阴居阴，居于阴暗伤明之极，是明夷的主，很像商纣王。六五切近阴暗伤明之主，有直接被伤害的危险，很像箕子。箕子的处境极艰难，犹如明夷六五之于上六，正之则势不敌，救之则力不足，去之则义不可。箕子处理得很妥当，他既不正之，不救之，也不去之，他采取晦其明的办法，佯狂为奴以免于害，而内心却坚守正道不变。这就是“箕子之明夷”。爻辞说“箕子之明夷”，意谓箕子的处境及其解决办法如此。","Y5.XN":"“箕子之贞”的意义在于明是不可息的。箕子佯狂为奴，身体受辱，而明没有息灭，明指箕子在万难中未尝间断的希冀君心悔悟的耿耿一念。倘若箕子也像微子那样行遯，或者像比干那样死去，或者自己之明不晦，身不可保，那么，明也就息了。所以古人认为殷之三仁皆为之不易，而为箕子尤难。","Y6.N":"古人以为此爻所说的是商纣王亡国之象，从六五爻辞明言“箕子之明夷”来看，是可信的。上六居全卦之终，又为明夷之主，下五爻之明皆为其所夷，纣王之所为与此正合。下五爻爻辞皆曰“明夷”，唯上六曰“不明晦”。“不明晦”是不明而晦，外晦内亦晦，彻里彻外的晦，真正的晦。晦而明或者明而晦乃是外晦而内明，似晦而实明。登天，在位之象。初登于天，开始时即位为天子。入地，失位之象。后入于地，以亡国失位而告终。","Y6.XN":"纣王初为天子时居高而明，照及四方，还是不错的。后来变得昏暗无道，终致入于地，这是由于他“失则”了。“失则”亦即失道。上六之“失则”与六二之“顺则”相对应。顺则所以为文王，失则所以为纣王。","Z":"《杂卦传》说“明夷，诛也。”诛也是伤的意思。明夷的夷字在此亦作伤解。明夷二字的意思就是明受到暗的伤害。这从卦象和爻象上是看得清楚的。明夷为卦离下坤上，离有明象，坤有暗象，日入地中，明受到暗的伤害。从爻象看，下三爻属于明体，都是明，这不成问题。六四与六五虽属于坤体，居于暗地，但从爻的角度看，这两爻本身也是明。明夷六爻，下五爻皆明，唯有上六一爻是不明而晦。上六是昏之主，六二是明之主。此与丰卦略相似。所不同者，丰卦是明中之昏，虽昏犹明；明夷是昏极而不复明。明夷之君不在五而在上，此与它卦也是不同的。明夷卦中主要显示明与暗的关系问题，亦即下边五爻各自怎样对待明夷，怎样对待上六这个昏君暗主的威胁。下五爻皆曰“明夷”如何，唯上六不曰明夷而曰不明晦。说明上六不明而晦，其余五爻都为它所夷。但是下五爻并未采取对抗的态度，它们的态度是明而晦。而各爻的具体表现又因时而异。六二力能救，则“用拯”以救之；九三力能正，则“南狩”以正之；六五晦其明，守其正，是谓箕子之明夷；初九与六四属于无责于斯世的那一类，处明夷之时，全身守正而已，故初九行不及食，六四于出门庭。上六则不明晦，以昏暗至极而终。\n这一卦讲的显然是殷周之际文王与纣王的事。爻辞已经明确言及箕子，孔子的《彖传》更用文王事纣的特点说明卦内文明而外柔顺。卦中所表现出的政治思想主要有以下几点。对待昏君暗主，应采取外晦内明亦即如文王“三分天下有其二，以服事殷”及箕子佯狂为奴而内守其正的对策。君主统治国家，应自治用明，治民用晦。用晦而明，不尽用其明，宽厚大度以容物和众，纣王是反面的典型，他自治用晦，治民用明，发展下去则终于成为不明而晦的暴君，以至于身殒国亡。纣王理所当然地成为《周易》唾弃的对象。"},"37":{"P":"《序卦传》说：“夷者伤也。伤于外者必反其家，故受之以家人。”家人即一家之人，亦即一般所谓家庭。在家庭诸多关系中，夫妇关系是根本。在社会诸多结构中，家庭结构是根本。为卦离内巽外，风自火出，风自内而出，有自家而及于外之象。古人所谓齐家治国平天下，似亦含有此义。自六爻观之，六二与九五，是女居中得正于内，男居中得正于外，有男女各得其正之象。因此，卦曰家人。","G.N":"贞，正。利女贞，是说家人之道，关键的问题是看家中主妇正不正，正则一家正，不正则一家不正。在这里只说“利女贞”而不及男人，并不是重视女人，恰恰相反，是表现出对女人的卑视。因为“利女贞”一语，是以男人为主体，女子不过是男人的附属物，意思是说男子齐家的基本问题是“女贞”。古人所说“修身齐家治国平天下”，亦全指男子言，女子(还有小人)是不包括在内的。“利女贞”是说男子要齐家，必靠女子贞。所谓女子之贞仅仅在男人统治的家中才有意义。","T.N":"“家人，女正位乎内，男正位乎外。男女正，天地之大义也”。女指六二，六二以阴居阴，又居中得正，属于内卦，所以叫做“女正乎内”。男指九五，九五以阳居阳，又居中得正，属于外卦，所以叫做“男正乎外”。家人之道，真实就是家庭中男女夫妇关系的问题。女在内正，男在外正，家庭的问题就解决了。卦辞只说“利女贞”，没讲男子如何。《彖传》则男女都讲。因为《周易》所说的家庭是一夫一妻制的家庭，家庭必由男女双方组成，言及家庭，涉及男女两面是必然的。卦辞言女而不言男，乃男尊女卑思想的反映。实际上卦辞中包含着男子，只是未显现出来。卦辞的全部意思应是男子齐家，利女贞。“男女正，天地之大义也”，此言有两层意义：古人讲天人关系，认为天人一致，认为人间的事情在自然界全可以找到根据。《周易》也是如此，讲到男女夫妇，就联系到天地。这是一。第二，《周易》认为男女关系就是天地关系。天地关系即天尊地卑。男女正，正就正在男尊女卑上。卦中代表男子的九五在上在外，代表女子的六二在下在内，恰是男尊女卑之象。\n“家人有严君焉，父母之谓也”及其以下诸句，是孔子作《彖传》时解释完卦辞之后另作的发挥。男女正是家人之道的根本。男女正，其余诸关系皆正。家正则天下定。定亦是正。治国平天下由家正开始，这种思想与“个体家庭是文明社会的细胞形态”的现代观念是可以接通的。","X.N":"君子观家人风自火出之象，知风化之本自家出，家之本自身出。修身是根本，修身主要表现在言与行两个方面，言必有物，行必有恒。物，事。恒，常。言有物，说话有事实根据，不讲空话假话。行有恒，做事要有一定的规矩，要有始有终，不能想干什么就干什么，也不可半途而废。","Y1.N":"初九以阳刚居于家人之始。就初说，有闲的必要性，就九说，有闲的可能性。处在家人的时候，初九当闲也能闲。闲，防闲，如畜养牛羊以栅栏，不使跑掉。防闲应在开始时就做，亡羊补牢，毕竟为时已晚。治家，开始时就立下规矩加以教育、约束，可以免悔。如果一开始就放任自流，伦序搞乱了，子弟变坏了，将不堪收拾。","Y1.XN":"在问题尚未出现时就加以防闲，使之根本就不能变坏。一旦志变了，再去防闲，所伤已多，后果不好。","Y2.N":"六二以阴居阴，处中得正，在夫妇关系中它代表妇亦即家庭主妇。遂，自专。《公羊传》“大夫无遂事”的遂字即自专的意思，与此遂字义同。大夫出国参与聘问会盟诸事，须依国君之命而行，不得自作主张，擅行其事。家庭里的妇人也是如此。妇人的职责是主中馈，主持一家人的饮食和筹办祭祀。“无攸遂”，是说什么都要听丈夫的，不能自作主张。妇人“无攸遂，在中馈”，才贞才吉。","Y2.XN":"六二以阴居阴，居中得正，所行之贞是妇人之贞，所得之吉，是妇人之吉。妇人之吉，由它顺从而卑巽得来。","Y3.N":"九三以阳处刚，得正但不居中，又居下体之极，有一家之长治家过严之象。过严过宽都不好，应以适中为宜。然而在不可得中的情况下，与其过宽不如过严。嗃嗃，严厉之声。过严虽使家人嗃嗃喘叫，有悔有厉，但最终还是吉的。若过宽，虽可令妻子儿女一时嘻嘻高兴，而终究是吝。悔者自凶而吉，吝者自吉而凶。吝的结果是凶。","Y3.XN":"“家人嗃嗃，未失也”，治家与其过宽，使妇子嘻嘻高兴而失家节，不如“家人嗃嗃”过严而未为甚失。过于严必有所失，但未为甚失。过于宽则失家节，知和而和之，不知以礼节之，后果是不会好的。","Y4.N":"《易》中爻辞言富的多为阳，如小畜九五；言不富的多为阴爻，如泰卦六四，无妄六二。家人六四为什么阴爻取富象？这是由于四在它卦为臣道，在家人卦为妻道的缘故。在一家之中，父是主教的，负责一家的礼仪表率；母是主食的，负责一家的收藏撙节。富家的职责当然落到六四身上。富家不免聚敛，从而招致怨尤，六四却能富家而得大吉，主要因为它以柔居柔得正又在巽体。家人卦中六爻，六二与六四两个阴爻是代表家庭主妇的，它的事情一是主中馈，一是富家，到此已经全备了。","Y4.XN":"六四在巽体，故曰顺；以柔居柔，故曰在位。顺，可协调内外之情。在位，能安排家中诸项生计。因为顺而在位，故能富家又得大吉。","Y5.N":"假与格古字通用，有感格之义。九五以阳刚中正居尊位，为家人之主，《彖传》所说的“男正位乎外”，即指九五而言。因九五居尊位，故以王言格。王假有家，家长以自身的模范行为感格他的家中人，使家中父父子子兄兄弟弟夫夫妇妇各安其分，以相敦睦，无须忧劳费力就可得吉。","Y5.XN":"王假有家，从感情上把一家之父子兄弟夫妇长幼和谐起来，使他们莫不相爱。","Y6.N":"上九以阳居上，处卦之终，治家之道到了完成的时候，揭出治家之根本在于反身修己。治家最要紧的是有孚有威，威自孚来，孚从反身来。治家者以身教，方可联属一家人之心，取得一家人之信；联属一家人之心，取得一家人之信，方可为一家人所敬畏。故云“有孚威如”。有孚威如，得终吉。言终吉，知其始未必吉，然而归根结底必吉。","Y6.XN":"“小象”强调上九之威不是自己作威，是人家敬畏。敬畏不是靠声色严厉求得的，敬畏得之于反身修己。治家须威严，威严当先行于己。不先行于己，则人不服。可见，治家之道在于反身修己而已。","Z":"家人卦主要是讲夫妇关系的。卦中六爻有男女之异而无君子小人之分。代表男子的四爻，初九曰闲，九三曰厉，上九曰威，九五王假有家，都以刚严为正。代表女子的两爻，六二在中馈，六四富家，皆以柔顺为正。\n卦中明显地反映出男尊女卑思想。男人是主体，女人只是作为男人的附属物而存在。女人的价值仅仅表现在它对男人和家庭所作的贡献上。它们在家庭中的职责是主中馈，协调家庭成员间的关系，并尽量使家庭生活变得宽裕富有。然而论及权利，则丝毫没有它们的份。它们“无攸遂”，它们贞正可以导致家庭的顺利和兴旺。“女正位乎内，男正位乎外，男女正”，依照孔子的思想来看，这是“天地之大义也”。\n在家庭之中，丈夫是一家之长，拥有极大的权力，但是它必须用反身修己的方法沟通与家庭成员间感情上的联系，它不能将威严强加到家庭成员的头上，这使我们知道，《周易》经传作者所反映的家庭观点，尽管有男人对女人的压迫，却不见有奴隶身份的人在其中。\n《周易》有一个极其不凡的思想一再使我们惊叹不已。这就是关于一夫一妻制的家庭与文明时代几乎同时产生的观念。咸卦经传已经有明确的表述，至家人卦又有进一步的说明。《彖传》“正家而天下定”和“男女正，天地之大义”的说法实际上等于发现了个体婚制的家庭是社会的细胞形态的真理。"},"38":{"P":"《序卦传》说：“家道穷必乖，故受之以睽。睽者乖也。”睽的意义是睽乖离散。家道必有穷日，家道穷则必睽乖离散，所以家人之后次之以睽卦。睽之为卦上离下兑，离为火，火炎向上；兑为泽，泽润向下。一个在上且向上，一个在下且向下，有二体相违之象。又离为中女，兑为少女，二女虽同居，但毕竟要嫁到不同的人家，也有相违之象。因此这一卦名曰睽。","G.N":"小事吉是说处在睽的时候，事情已经睽了，不合了，不应以忿疾之心强为之合睽，应当采取温和柔顺的办法，周旋委曲，慢慢解决问题。","T.N":"“睽，火动而上，泽动而下，二女同居，其志不同行”，解释卦名曰睽的意义。睽卦上体离，下体兑，火向上而泽向下，虽在同一卦中而所为却不同。离为中女，兑为少女，二女虽住在同一室中，各思其归，所想却不同。二事有同的一面，同时又有不同的一面，不同的一面还很明显很深刻，这就是睽。睽乖的两个事物必须有同为前提，根本不相干的两个事物无所谓睽。\n“说而丽乎明，柔进而上行，得中而应乎刚，是以小事吉”，此以卦才解释卦辞。从卦体看，“火动而上，泽动而下。二女同居，其志不同行”，讲的是事物动而相睽的一面。从卦才亦即卦德看，讲的是事物有睽而必合的一面。兑说而附丽离明，有利于睽而合，“柔进而上行”，有利于睽而合，“得中而应乎刚”，也有利于睽而合。睽而不合，天地万物便要停止发展，便要息灭。睽而必合，主要是柔在起作用。因为是柔的作用而得吉，所以叫小事吉。\n“天地睽而其事同也，男女睽而其志通也，万物睽而其事类也。睽之时用大矣哉”。在从卦体和卦才两方面讲完事物动而相睽和睽而必合的关系之后，孔子接着进一步阐发睽的普遍意义和应用价值。睽，看来不是好事，而实际万事万物没有睽是不行的。睽的用处大着呢。天地是最大的睽，天在最上，地在最下，正是因为有天地之睽，才有四时变化，才有万物萌生。男女是最显著的睽，正是因为有男女之睽，才有阴阳交感，才有人的生育蕃衍。世间万物千差万别，是最普遍的睽，正是因为有万物之睽，万物才能有类，有类才能有合。假若没有睽，则将是天地浑沌，男女不分，万物无殊，合也就无从谈起。","X.N":"君子观睽之象，应用到实际生活中，要以同而异。睽卦提示的道理是事物睽而合，有睽必有合。也就是说，事物同是以异为前提的。没有睽的合，没有异的同，是不足取的。所以告诫说：以同而异。君子处于世上，要同中求异，保持自己的个性和特色。“以同而异”与《论语》“和而不同”的说法一致。没有异的同要不得，犹如无五音之分的音乐一样，听不得。","Y1.N":"初九以阳刚居卦之初，是以刚动于下之象，所以有悔，然而初九又与九四敌应，敌应在睽的时候属于同德相与而相遇，所以可以亡其悔，使有悔变成无悔。初九处睽之初，是睽而未深的时候，这时求合睽的最好办法是安静以俟，不急于求同。好像马跑了，越追马越跑；索性不追它，它反倒容易自己跑回来。还要宽裕从容，不轻率立异。好像与我交恶的人欲来见我，我忿激不见，往往隔阂益深，甚至永远不得合睽；一见则睽情可立释而得无咎。","Y1.XN":"初九处睽之始，睽违刚刚开始，还不深刻，这时恶人主动来与我合，我应逊而见之，以不使睽违加深而得咎。","Y2.N":"按照《春秋》书法，礼仪齐全的会见叫会，礼仪简约的会见叫遇。巷是贴近宫墙的小路。君臣宾主相见，升堂由庭不由巷。九二与六五正应，《彖传》所谓“得中而应乎刚”即指此二爻的关系。九二要与六五相见相合的愿望十分迫切，以至于“遇主于巷”。与主相见，礼仪简约不备而且升堂由巷不由庭，循墙而走，态度是谦逊又谦逊，谨密又谨密，有卦辞所谓小事吉的意思，无咎是必然的。","Y2.XN":"九二遇主于巷，虽谦逊谨密，极尽委曲，但并不是违背正道的诡遇。","Y3.N":"六三与上九正应，有与上九相合之志，但是受到严重的阻碍，前有九四牛掣之阻，后有九二舆曳之牵。六三虽是阴柔，但处刚位，处刚而志行，它要强力前进，结果“天且劓”，首受髡，鼻被截，受了重伤。尽管九三如此不顺利，它到底与上九是正应，睽到了极点，必然会合，所以无初有终。开始受九四、九二的阻隔，是无初；最后终于与上九合，是有终。","Y3.XN":"“见舆曳”，六三欲与上九合而受阻，是因为六三所处之位不当。六三之位不当，一则它以阴爻居阳位，二则它处九二之上，是乘刚。无初有终，六三虽初受阻，为上九所疑，可是最终必得到上九的理解，与上九相遇而合。这是因为六三所遇到的是刚明之才。","Y4.N":"孤，无应援。元夫指初九。阳爻居初，故称元夫。交孚，双方以诚相见，信任无疑。九四处在睽离之时，居二阴之间，下无应援，处境危厉有咎。九四也有有利的一面，它与初九不是正应，但都是阳爻，都在一卦之下，地位相应，在睽离的时代，它们同德相亲，以至诚相见相合，没有什么危厉不能度过，纵然有危厉，也可无咎。","Y4.XN":"九四与初九至诚交孚而得无咎，交孚无咎则睽可以合，孤可以有朋，这是由于九四与初九求合之志得行的结果。","Y5.N":"六五是阴爻，当睽的时代，居尊位，应当有悔。但它以柔居中，有九二与之正应，其悔可以亡。厥宗，指九二。六五把九二看作自己的宗而与之亲近。六五与九二以中道相应，说明它们之间的睽离微浅而易合，有如肌肤柔脆易咬，一咬便深入。厥宗来噬肤，九二积极来与六五合睽，六五也前往与之合，于是睽将不睽了。悔亡了，还有什么咎？","Y5.XN":"六五与九二阴阳正应，九二既来如噬肤，六五亦往与之合，岂止无咎，还必有庆。","Y6.N":"上九本来有六三与它正应，实在不孤。爻辞说睽孤，是上九自睽孤。它居睽卦之终，是睽之极；阳刚居上，是刚之极；在离之上，又是用明之极。睽极则乖戾，刚极则暴躁，明极则多疑。乖戾、暴躁、多疑的特性促使它对自己的亲党六三妄生疑端。它看六三仿佛是一头肮脏的猪，又背负着泥巴，非常可恶。进而又怀疑六三“载鬼一车”，是个罪恶很大的人。鬼本无有，而见载之一车，说明上九已经虚妄、猜疑到了极点，以至于张弧欲射。然而物极必反，疑极则释，仔细一看，原来不是负涂之猪，不是载鬼一车，不是寇仇，而是婚媾，乃脱弧，放下已经张开的弧。“往遇雨则吉”，比喻怀疑解除了，睽极而合，自今以往，阴阳和畅，一向的疑心完全消失，所以得吉。","Y6.XN":"爻辞说的见豕、见鬼、张弧，全是猜疑。疑则睽，睽则孤。现在猜疑都解除了，如同阴阳合和畅通，雨终于下了一样，不睽也不孤了。","Z":"睽卦六爻都是先睽后合。内卦三爻都是睽而有所待，外卦三爻都是反而有所应。就是说，在内卦，三爻还都是睽，至外卦三爻就发展为合了。初九丧马勿逐，有所睽离，至九四则遇元夫，合了。九二委曲求遇，还处在睽离状态，至六五则厥宗噬肤，合了。六三舆曳牛掣，欲合不得合，至上六遇雨吉，合了。综观睽卦六爻的变化，从中可以看出一个重要的道理，就是世间事物睽久必合。久睽固然可以，但不能终睽。这是客观的规律。就主观上的态度说，睽离双方应当遵循卦辞小事吉的思想，推诚守正，委曲宽宏，去私去疑。如此则睽必合。"},"39":{"P":"《序卦传》说：“睽者乖也，乖必有难，故受之以蹇。蹇者难也。”处在睽乖的时候，必有蹇难，所以睽卦之后次之以蹇卦。蹇的意思是险阻，是难。蹇卦坎在上而艮在下，坎险在前，艮止在后，不能前进，所以这一卦叫蹇。","G.N":"处在蹇的时候，去西南有利，去东北不利。西南、东北只是比喻，不是说人处蹇时要一直往西南走而不可去东北。根据《说卦传》所说，坤是西南之卦，艮是东北之卦。坤为地，艮为山。坤是顺易之地，体顺而易，走起来容易。艮是艰险之地，体止而险，不容易从险境中走出来。“利西南，不利东北”，实际上是说，处在蹇的时候，要顺处平易之地，切勿止于艰险之中。“利见大人，贞吉”，国家处在蹇难之时，最需要有圣贤亦即伟大人物出来济难。而济难最重要的一点是坚守正道，万不可入于邪滥。守正道则吉，入于邪滥，即使苟免于难，亦不足取。","T.N":"“蹇，难也，险在前也。见险而能止，知矣哉”。此解释卦名蹇的含义。蹇训难，屯亦训难，虽都训难，但意义并不相同。屯卦的难是屯难，即事物刚刚开始而未得通畅的难。险在前面，后面是动，动乎险中。蹇卦的难是险阻艰难的难，险也在前，但后面是止，止乎险中。蹇卦与蒙卦也有相似之处，都由坎与艮组成，但艮止在外在内不同。蒙卦险在内而止于外。止于外，是心欲进因受阻而不得进，故曰蒙。蹇卦险在前而止于内。止于内，是见险而能止，有所见而不妄进，故《彖传》称知。\n“蹇利西南，往得中也。不利东北，其道穷也”。自此以下解释卦辞。\n在蹇的时候，处平易之地容易济蹇，有利。西南是坤方，坤为顺易，故曰“利西南”。利西南，其实是说利于顺处平易之地。为什么“利西南”呢？由于“往得中”。“往得中”指九五而言。九五刚阳居中得正，是往而得处平易之地。问题是九五处在上体坎险之中，怎么能说是处平易之地？这是因为蹇卦上体坎本来是坤，经乾之一爻再索而得中男，变为坎。坤之所以变为蹇，关键在九五这一爻，而九五的特点是“往得中”。卦辞言“利西南”的根据正是九五往得中这一点，至于九五处坎险之中的问题便不予考虑了。卦辞为什么说“不利东北”？因为在蹇之时如果选择东北方向，便等于走向绝路。东北是艮方，艮体止而险。当蹇难之时更止于危险之地而不知变，岂不等于蹇上加蹇。蹇已至极，不易克济。\n“利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉”。“利见大人”说的是九五。天下国家处在蹇的时候，最需要圣贤人物出来救济。从卦上看，这个圣贤人物就是九五，它能够完成济蹇的伟大功业，并且可以同时将社会治理好，使国家走上正路。实现此任务的唯一途径是行大正之道。蹇卦具备这个条件，它的六爻除初六外，其余五爻皆当正位，所以得贞吉。即便初六，虽以阴居阳位，但阴而处下，也算是得正位。蹇是处逆境，不是处顺境，但是在蹇的时候，如果有杰出人物出来行济蹇之道即顺时而处，贞正而行，则可以有功，可以正邦。蹇之“时用”不是很大吗！","X.N":"山有险阻之象，水有险陷之象，上下都是险，所以叫蹇。君子观蹇难之象，受到启发，乃反身修德。人在外界受到艰难险阻，一时不易克济，最好的办法是反求诸己而加强自我修养，寻找并克服自身存在的问题。自身没有问题，就加勉加励以待时。后来孟子说的“行有不得者，皆反求诸己”，义与此同。","Y1.N":"往，向上进。来，止而不进。往蹇，初六居蹇卦之始，以止而不进为好，若往上进，就将更加深入于蹇了。来誉，若止而不进，则有美誉。那么初六到底往蹇还是来誉呢？初六肯定不会往蹇的，因为初六处止之初，去险最远，具有独见前识，能够见险而知止以待其时。","Y1.XN":"往蹇来誉，往不好，止而不往好。不往又怎样出蹇呢？最好的办法是待时。现在是往蹇之时，应见几而止，时未可往则不往，待时可往而后往。","Y2.N":"王臣指六二而言。六二柔顺中正，与九五正应，是为中正之君所信任之臣，故谓王臣。王臣蹇蹇的两个蹇字，一个说九五，一个说六二。九五处在坎险之中，正在蹇难之时，是一个蹇字。六二不顾自己虽中正却是阴柔之才的弱点，犯难济君王九五的蹇难，是又一个蹇字。王臣蹇蹇，六二济君王蹇难之中的行动，实际上是以蹇济蹇，不易取得成功，但是它“匪躬之故”，不是为了自己，是为了匡救王室，即便达不到目的，而其志意毕竟可嘉。","Y2.XN":"无尤，没有过错。六二其志在济君之蹇，虽然不能成功，亦不为过错。蹇卦之初六、九三、六四、上六四爻，皆根据其去险远近，其势可否，确定或往或来，唯独六二正应于九五，二者有君臣关系，所以不计去险远近，不管其势可否，不讲往也不讲来，只说蹇蹇而已，而且不以为六二不知。六二为君王九五济蹇，非为自己。只此一点就够了，无论成败均无过尤，更不必问吉凶得失。","Y3.N":"往蹇，往则蹇。九三与上六为正应，然而上六阴柔而且无位，没有力量应援九三，九三若在实际上没有应援的情况下进入与自己相邻比的坎险之境，必蹇，故曰往蹇。若九三不向上进而来反，情况便不同了。九三以阳居阳得正位，处于下体之上，下面的初六、六二两个柔爻必附依于九三。来反，就是下来而不向上去，还归自己的原位置。九三这样做，既可不上往而蹇，又能得到初六、六二二阴爻的喜欢和亲附。","Y3.XN":"内卦艮之三爻，九三一阳处二阴之上，是内亦即在下二阴爻所依赖的力量。在蹇的时候，阴柔不能自立，所以它们喜爱九三，亲附九三。","Y4.N":"往蹇，往则入于坎险更深。来连，来则与在下诸爻相连合。往蹇不好，来连好。来连，能与众爻连合，是处蹇的最好办法。下面众爻为什么会与六四连合呢？九三与六四相亲相比，初六、六二两爻与六四同为阴爻，有同类相与的关系。而且六四得正，在下三爻也得正，初六虽以阴居阴，但阴柔而处下，也可谓得正。可见六四与在下三爻同志，下三爻都从附于它，与它连合。","Y4.XN":"当位实，即是当位正。正不曰正而曰实，是因为这里讲上下之交；上下之交，诚实最为重要。当位实，表现在两方面。首先表现在六四上。六四居上位，不向上进而来下，与在下诸爻同志，足以得众，又以阴居阴，是为当位实。其次表现在在下三爻得正上。九三以阳居阳，六二以阴居阴，是为当位实。初六虽不得正，但以阴居下，也为得其实。诸爻共处蹇难，能够相交以实，所以六四来下才能使诸爻连合起来。","Y5.N":"诸爻都以往为蹇，意思是不要有所往。当国家社会处于蹇难之时，大家都不往，便无法度过蹇难。六二与九五在君位臣位，它们应当往，所以六二曰蹇蹇，九五曰大蹇。为什么叫大蹇？九五居君位，君在蹇难之中，是天下之大蹇。九五当蹇之时又处在坎险之中，也是大蹇。有这两层原因，所以曰大蹇。朋来，指有贤臣来相辅佐。六二在下以中正相应，对于九五来说，正是其朋来助。当天下方蹇之时，九五之君得六二中正之臣辅助，为什么不言吉？因为大蹇必须有刚阳中正之臣来辅方可济，六二虽居中得正但身为阴柔，无力济天下之蹇，赞助而已，不能成大功。易中凡六五与九二相应的，多助而有功，如蒙、泰之类。凡九五与六二相应的，则其功多不足，如屯、否之类。","Y5.XN":"九五履中得正，不改其节，进止得宜，有同志之贤臣来辅，故曰朋来。","Y6.N":"上六处在全卦之极，不可能再往了，对于它来说，不来就是往。犹如初六处全卦之最下，不往就是来一样。上六若处在蹇极之地不来，便要坏事，便要永远蹇下去，得不到克济。如果上六来从九五，求九三，得到二刚阳之助，阨塞穷蹙就要变成硕了。硕是硕大宽裕的意思。硕大宽裕只是蹇的程度得到缓解而已，还不是彻底摆脱蹇境。因为上六乃阴柔之才，不是刚阳中正，是出不了蹇的。尽管出不了蹇，在蹇极之时能得到一定的缓解，也就算吉了。大人指九五，利见大人指上六见九五。上六从于九五，是因为它们有相比的关系。九五自身不说有济蹇之功，甚至需要六二来辅助，到了上六反而显示出九五的作用来了，这是为什么？这是因为各爻地位、处境不同，取义往往也不同。九五居坎险之中，无刚阳之助，它济不了蹇。但是从上六的角度看，九五是有大德之人，若获到它的帮助，便有济蹇的可能。一卦之中各爻取义不同的情况比较多，如屯卦初九志行正，而六二则视之为寇。","Y6.XN":"利见大人，以从贵也，无疑指九五说的。上六与九五是一阴一阳，一卑一尊，说“以从贵”，是为了明确指明爻辞所说的大人肯定是九五，不是别爻。“志在内”的内指谁，前人说法不一。或以为指九五，或以为指九三，或以为指九三和九五。看来以指九三和九五两爻为可取，因为九三在内卦又与上六正应，上六不能没有它的应援，九五与上六切比，更是上六求助的对象，讲到上六之志，不应抛开九五。小象下文再提“利见大人，以从贵也”，又讲九五，看来重复，其实不重复。“志在内”指九三和九五两爻，“以从贵”再讲九五，意在使九五的作用突出出来。又，《易》中爻辞言“利见大人”的，除乾卦九二和九五外，只此一爻。而且诸卦上六遇九五的，凶吝者多而吉者绝少，此爻却得吉，这一点是值得玩索的。","Z":"蹇卦卦辞与爻辞意义比较贴切。卦辞有见险而能止的思想，也有处险亦当进的思想。这两方面的意思在爻辞中也有反映。六爻除六二与九五外，皆以往为蹇，就是说，往不好，来好，亦即进不好，止好。初六距离险境最远，其止最先，有独识先见之明，《彖传》称其知。九三往蹇来反，以往为蹇，以来为反，赞许其处蹇而得其所，得其众。六四往蹇来连，往则蹇，不往则得与在下三爻相连合，为众所从附。上六虽处蹇卦之极，身为阴柔之才，但是只要它来而不往，则蹇可纾，吉可得。处险亦当进的思想表现在六二与九五两爻上。六二与九五不言往来，讲蹇蹇、大蹇，意思是应当往。九五曰“朋来”，六二曰“匪躬”，二者是君臣的关系，相与济蹇，是它们义不容辞的责任。犹如国家处在蹇难之时，别人可以不往，君王和大臣怎么可以不往呢。它们的往有一定的条件，就是居中得正。这个思想与卦辞说的“利西南”、“利见大人，贞吉”是一致的。还有卦辞讲“贞吉”，诸爻除初六外都得正，上六得吉，其余诸爻亦皆不言凶咎。总而言之，蹇卦是处逆境的卦。处于逆境之中最要紧的是见险而能止，但是有止亦必有往，处蹇世之君臣就当担起济天下国家之蹇的重任。卦辞讲利见大人，爻辞也讲利见大人，正是这个意思。蹇卦看来并不怎么好，不过如果统治者能够把握好蹇卦之“时用”，把蹇卦的思想恰当地应用到政治上，其用处是不可忽视的。"},"40":{"P":"《序卦传》说：“蹇者难也。物不可以终难，故受之以解。”解字读谢音。事物总要变化，蹇难发展到一定程度，必然要散。解就是散，所以解卦放在蹇卦之后。解为卦上边是震，下边是坎。震是动，坎是险。震在外，坎在内，动于险外，有出乎险而患难解散之象。又震为雷，坎为雨，雷雨已作，阴阳已和，问题已经解决，也有解之象。解卦是天下患难解散的时代。","G.N":"西南乃坤方，坤宽大简易。在天下刚刚摆脱患难，进入解的时候，国家宜静不宜动，应实行宽大简易的政策，不要无事找事，无事求功，即所谓“无所往，其来复吉”。如果真的有了问题，那就要及早抓紧解决，不可等到无可挽救甚至出了乱子的时候才处理，即所谓“有攸往，夙吉”。简而言之，处于解的时候，无事宜静不宜动，有事宜速不宜迟。","T.N":"“解，险以动，动而免乎险，解”。这是解释卦名。坎为险，震为动。险在内，动在外，所以叫险以动。险以动包括险与动两个方面。没有险则无所谓难，没有难则无所谓出难。有难而不动则不能出难，有难而不出，便不是解。险以动，动而免乎险，亦即动而出于险外，才是解。解卦从卦画看，与蹇卦相反，从卦体看，与屯卦相反。三卦比较起来，蹇是止于险下，不如屯动乎险中，屯动乎险中又不如解动乎险外。\n“解利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也”。这是解释卦辞。西南是坤方，《说卦传》说坤为众。“往得众”，是说九四往入坤体，使坤变成了震。“得中”与“有功”皆指九二。解是蹇之反，解之九二相当于蹇之九五，解之九四相当于蹇之九三。蹇之九五为得中，解之九二为得中。解之九二居中而不动，用九四之动以免乎险。\n“天地解而雷雨作，雷雨作而百果草木皆甲坼，解之时大矣哉”。上边已将卦辞解释完毕，这里进一步推阐解卦蕴含着的深刻意义。孔子用自然现象讲解的道理。冬天天地否结，阴阳不通，春天来临，天地否结之气交通而解散，于是雷雨作。雷雨作就是自然界中最大最明显的解的现象。由于雷雨作而接着出现的百果草木甲坼，萌动生长，也是一种解的现象。人类社会和自然界一样，也有解的现象，而且同样具有规律性。到了应当解的时候，必须解。","X.N":"这个君子有司法权力，显然是统治阶级。统治阶级观解卦雷雨作之象，从中悟出一个道理来，天地尚有解散而雷雨作以致使百果草木甲坼的季节，对人民的刑罚怎可没有轻缓的时候。君子要赦过宥罪。过，过失；罪，罪恶。赦谓释免，宥谓宽宥。是过失，可以赦免不罚，是罪恶亦当宽宥轻罚。这反映了古代的一种法律思想。古代司法讲究赦宥，如《周礼·司刺》掌赦宥之法，有所谓三赦三宥然后用刑之说。","Y1.N":"初六居解卦之初，正是患难既解的时候，又以柔居刚，以阴应阳，具有柔而能刚的特点。柔而能刚，又处在患难已解的好时候，安静无事，自处得宜，所以无咎。《易》中恒九二悔亡，大壮九二贞吉，解初六无咎，爻辞只有二字，言简意赅，象已在爻中，故不再言象。","Y1.XN":"初六与九四正应，是谓刚柔相济。在患难已解，天下无事的时候，处理问题刚柔得宜，其义无咎。","Y2.N":"这一爻讲在解的时候君子如何除去小人的问题。田是田猎，田猎在古代有除害的意义。获，捉获。引伸开来，捉获也就是除掉。三狐，三只狐，指卦中三阴爻而言。三阴爻是代表小人的。黄，中色。矢，箭，其特点是直。黄矢，中而且直，是九二亦即君子的优秀品质。天下国家的患难，从政治上说，莫不由小人造成。要解天下国家之患难，必须有除掉小人的适当办法。柔不行，刚而过也不行。九二以刚居柔，是刚而不过于刚，刚中有柔，是直而不过于直，是中直。君子有中直的品质，能够除掉狡猾的狐即小人，以此得吉。","Y2.XN":"君子除小人，固然要以直去邪，但是直而不中，过于直，则往往坏事。九二之所以能够获三狐，得吉，关键在于它得中道。","Y3.N":"《系辞传上》对这一爻有解释，它说：“子曰，作《易》者其知盗乎。《易》曰‘负且乘，致寇至’。负也者，小人之事也。乘也者，君子之器也。小人而乘君子之器，盗思夺之矣。上慢下暴，盗思伐之矣。慢藏诲盗，冶容诲淫。《易》曰‘负且乘，致寇至’，盗之招也。”意思是这样的，小人背负，君子乘车。今小人背负着东西立在君子乘的车上。盗一见君子之器竟被小人占据了，就要下手抢夺。这从国家或者君上的角度说，把君子之器给了不该给的小人，无异于慢藏诲盗，冶容诲淫，教唆人们觊觎他们不该得到的东西。这样做的结果是“致寇至”。致寇至包括两方面含义，一方面是小人而乘君子之器即“负且乘”，必招致盗寇来夺。另一方面是国家或君上慢藏其名器，不辨贤否，使小人得居君子之位，必招致寇戎来伐。六三为什么有“负且乘”之象呢？六三是阴柔之小人居君子阳刚之位，极像本应背负东西步行的小人乘了只有君子才能乘的车，背负着东西又乘在车上。","Y3.XN":"可丑，是就负且乘的小人说，又谁咎，是就上慢下暴的国家说。小人而窃据君子之位，小人以为荣，君子以为耻。国家而慢藏其名器，令小人居高位，招致寇戎来伐，完全是咎由自取，谁也勿怨。","Y4.N":"解是去小人之卦。九四是阳爻，在卦中是代表君子的。它的责任是解去小人，引进君子。小人不去，则君子不进。“解而拇”即解去小人。解去小人，方可“朋至斯孚”。“朋至斯孚”，君子之朋不但来了，而且能够彼此取得信任。“解而拇”的“而”，是“你”的意思，指九四自己。拇，脚之拇趾。拇居人体之下，地位卑微，在此卦中指初六而言，象征小人。","Y4.XN":"九四以阳居阴，不中不正，而且应于初六，比于六三，所处极为不当，容易被小人所附丽。因此它必须特别注意“解而拇”，解去小人，方可“朋至斯孚”。","Y5.N":"六五居君位，是解卦之主，就人事说，六五是人君。不过它不是阳刚之君，而是阴柔之君，所以应特别注意分辨君子小人的问题。在用人方面，要用贤勿贰，去邪勿疑，使“君子维有解”，君子所亲者必君子，所解去者必小人。让大家都知道，君子为所用，小人必为所解，没有空子可钻。不仅有孚于君子，更要“有孚于小人”。使小人相信不改邪归正是没有前途的，从而去掉侥幸之心。","Y5.XN":"君子果真有解，即君子见用，小人解去，则小人也相信小人吃不开，小人没有出路，是或改恶从善，或自行退去.","Y6.N":"《系辞传上》对此爻有解释，说：“子曰，隼者禽也。弓矢者器也。射之者人也。君子藏器于身，待时而动，何不利之有。动而不括，是以出而有获，语成器而动者也。”解卦主要讲怎样去小人的问题。处上六这个阶段，去小人要采取怎样的办法？孔子认为爻辞里有两点意思。一个是藏器，一个是待时。用今语讲就是条件成熟，抓准时机。条件成熟，抓准时机，则动而不括，行动起来没有阻碍，“获之无不利”，一定能够射获那个隼。隼是鸷害之禽，在此指上六而言。狐和隼都是说小人。狐说小人柔邪的一面，隼说小人凶狠的一面。上六以阴柔居一卦之上，解已达于极点，而尚未被解去，说明上六是个顽强的小人，不易去掉。墉，墙，高墉即高墙。上六阴鸷而居高，解已达极点，是射隼而获之的最好时机。君子之器已成，又能抓住这个最好时机，捉获、除掉上六这个小人是没有问题的。公用之“公”非指上六，是指人世间居公位的人，它在解上的时候应以射隼的办法除掉小人。","Y6.XN":"悖，较大的乱子。乱子归根结底是由小人造成的。解悖，实际上是解去小人。“公用射隼”就是解小人。小人解则悖解，悖解则国家安宁。","Z":"解卦经文又一次提出君子与小人的概念。古人讲君子、小人，有时指剥削者与劳动者即统治阶级与被统治阶级，有时则指道德意义上的不同的两种人，即道德高尚的人、善的人和道德卑劣的人、恶的人。道德意义上不同的两种人都属于剥削阶级即统治阶级，特别是在政治上有权有势的一类。解卦讲的君子与小人的划分就是道德意义上的。解卦的主旨是讲在政治上如何解去小人的问题。六爻除初六外，其余五爻都有去小人之象。九二“田获三狐，得黄矢”，阳刚君子以直去小人之邪，然而居中不正，是中直又不过乎直，恰是解去小人的最佳办法。六三“负且乘，致寇至，贞吝”，从国家或最高统治者的角度说，最重要的问题是不要慢其名器，不辨贤否，使小人窃据君子之位。九四“解而拇，朋至斯孚”，是务必去小人，小人不去，君子不来。六五“有孚于小人”，人君应任贤勿贰，去邪勿疑，使小人也知道为恶没有前途，促使枉者直而不仁者远。上六“公用射隼”，实际上是说对待强有力的小人要藏器于身，待时而动，一旦时机成熟，立即下手去之，绝不迟疑。此爻与卦辞“有攸往夙吉”一语相当，而前四爻与爻辞“其来复吉”大体一致。但是爻辞之义与卦辞也有不同之处。卦辞强调无所往，即强调静，所云是患难既解之后的事情。爻辞反复讲如何解去小人，似乎尚有小人未去，患难还未全解。"},"41":{"P":"《序卦传》说：“解者缓也。缓必有所失，故受之以损。”解卦与损卦之间好像没有明显的内在联系，《序卦传》讲的损次解后的道理的确有些牵强、肤浅。然而这并不妨碍我们说《易经》作者将64卦按照一定的原则加以排列，其中包含着深刻的辩证法思想。因为他具有事物互相联系的思想，才去努力寻求导致卦与卦之间互相联结的那个必然性。卦与卦之间的必然的亦即内在的联系是存在的，但是它的排列毕竟由人为完成，其中有牵强、肤浅之处实无足为怪。孔子作《序卦传》，发现了64卦顺序的深刻用意，并且将它揭示出来，他在哲学上的贡献，与《易经》作者比，有过之而无不及。\n此卦之所以名损，主要因为它是损下益上。按照卦变的规律，此卦内卦可以看成乾，外卦可以看成坤，乾的第三爻上去放到坤的第三爻的位置上，坤的第三爻往下来放到乾的第三爻的位置上。如此乾坤交错，损下益上的结果，便形成了损卦。损与益相反，损是损下益上，益是损上益下。损上损下都是损阳刚之有余，补阴柔之不足，何以损下益上曰损而损上益下曰益？从政治上说，下边老百姓血汗被剥损、搜刮到上边统治者那里去，看来是损下益上了，而实际上上边也受损了。因为民为邦本，本固邦宁，百姓受损无异于统治的根基受损。","G.N":"卦名曰损是专指损下益上而言，卦辞“有孚元吉无咎可贞利有攸往”，是就一般的损而言，不专指损下益上。什么人的损，什么样的损，只要是应当损的，都在它的范围之内。卦名得自损下益上的特殊意义，卦辞则转为适用于任何方面的一般意义。\n卦辞中“有孚”一语最为关键，其次“二簋可用享”也重要。“元吉”等十个字，是由“有孚”决定的。如果你的损合乎时宜，损所当损，为多数人所相信，符合人心，便可以得元吉，可以无咎，可以为正，甚乃无往而不可。那么，损而有孚“曷之用”？损而有孚将怎样表现出来呢？回答是“二簋可用享”。用“二簋可用享”比喻损要损过而就中，把浮末的、有害的部分损掉，留下事物之根本的、必要的部分。用享祀之礼最能说明损的道理。享祀之礼，繁文缛节最严重，外表的文饰极容易超过内心之诚敬，文饰一旦超过诚敬，诚敬便成为虚伪。把过分的文饰损掉，方可保存诚敬。诚敬就是享祀之礼的根本。说“二簋可用”，意谓享祀之礼不在供物多少，只要心存诚敬，即便最简约的二簋，也可用以享祀“上帝鬼神。”簋是用来盛稻粱黍稷的器物。享祀之礼，最多的用八簋，一般的用四簋，最少的用二簋。","T.N":"“损，损下益上，其道上行”。道，损之道。损之道自下向上行。也就是说，下损，上也跟着损。损下益上的结果并非下损而上益，而是下损上亦损，所以卦名曰损。假若下损而上益，卦名就不该曰损了。\n“损而有孚”，比卦辞“损有孚”增加一个“而”字，含义更加明白无误：损必须有孚，得到人们的信任，方可得“元吉无咎可贞利有攸往”。孔子重点解释“曷之用，二簋可用享”二句，特别强调时的问题，连用三句话，从具体到一般，一步深似一步地指出，在损的时候，能否掌握准时候是至关重要的。孔子无论思想还是行动，都十分重视时的问题，所以孟子说“孔子圣之时者也”。《易经》也特别强调时的问题。卦辞文字简直，但内里蕴含着时的思想，孔子发掘出来，写进《彖传》里。“二簋应有时”，享祀用二簋，损去繁文浮饰，以求厚本损末，但是损要有界限，必要的文饰不可损。文饰未过而损或者损之过甚都不对。正确的办法是看准时候，时当损则损，时不当损则不损，时当重损则重损，时当轻损则轻损，万万不可拘泥。“损刚益柔有时”。刚为有余，可损；柔为不足，不可损。损是“损刚益柔”，益也是“损刚益柔”。损也罢益也罢，都必须依时而行。不当时不可损，不当时也不可益。讲损把益包括进来，使时的普遍性意义加深一步。接着讲“损益盈虚，与时偕行”，或损或益，或盈或虚，都依时而定。损益之外又言及盈虚，实际上是把损益应当有时的问题由人事方面扩展到自然界。前云“有时”，此云“与时偕行”，意在指出损益盈虚有时既是主体应遵循的准则，也是客体自身存在的客观规律。至此，时的问题具有了最一般性的意义。","X.N":"山在上，泽在下，水气或向上润或向下浸，都有损下之象。君子观损之象，落实到修身方面，最为切要的莫过于惩忿窒欲。忿，忿怒，情感冲动失控。人往往因一时之忿而坏大事，造成终身遗憾。所以有忿应当惩，应当止息。苏轼《留侯论》说：“匹夫见辱，拔剑而起，挺身而斗。此不足为勇也。天下有大勇者，卒然临之而不惊，无故加之而不怒。”所云正是惩忿的意思。欲，各种私欲。一切恶端往往自私欲产生。窒欲，把私欲闭住，不使它发挥作用，导致危害。儒家学派不是禁欲主义者，儒家仅仅主张寡欲，而不一般地反对人欲。此处讲窒欲，里边也有个“时”的问题。窒欲是以一定的时间条件为前提的，不合时的欲要窒，合时的欲不可窒。","Y1.N":"已，竟。已事，竟事，做完了事。遄，速。遄往，速往。损必须是损刚益柔又损下益上。初九与六四是正应的关系。六四以阴柔居上位，初九以阳刚在下；初九应当损自己去益六四，六四也依赖初九来益它。这是没有问题的，问题在于初九是否因自己益了六四而居功自美。如果能够“已事遄往”，事情做完就迅速离去，不居其功，则无咎。否则，若自享成功之美，便不是损己益上，也不符合为下的本分，就要有咎了。六四阴柔，依赖初九来益它，初九应当加以斟酌，适度地损己以益六四，不使过与不及。","Y1.XN":"尚与上通，上指六四，六四依赖于初九，初九益于六四，二者志同道合，所以初九已事遄往无咎。","Y2.N":"九二以阳刚居中，处在损刚益柔的时候，处境对它不利，它居柔位而在说体，又与六五阴柔之君正应，极容易失掉其刚中之德。九二在这种情况下，最好的办法是贞，贞即是守其中。如果有所征，有所前行，则离中失正，必凶。“弗损益之”，九二作为一个处下的阳爻，它本当损下益上，损刚益柔，但是它的情况特殊，它若自损，则反倒不能益上，只有它不自损，方能益上。就人事方面说，人处在损之九二这种时候，应自守而不妄进，看来好像无益于君上和国家，而从根本上说，它自守不妄进，会造成尊德乐道的风尚，对国家带来的益处往往更大。东汉的严子陵垂钓富春江，不给光武帝作官，似乎未给皇家做出什么贡献，然而实际上贡献极大，正所谓桐江一丝，系汉九鼎，帮了刘秀的大忙。这是“弗损益之”的一个极好例证。","Y2.XN":"九二以阳居阴位，本来不正，爻辞为什么说九二利于正呢？小象解释说九二“中以为志也”。“中以为志”即以中为志。九二虽不正，但居中位。《周易》最重时，其次重中，再次重正。都是说，中重于正。九二既志存于中，那么正也就包含在内了。一般说来，正不必中，而中则正。","Y3.N":"下卦本是乾，乾三画都是阳爻，损去其中上边一个阳爻以益上卦。上卦本是坤，坤三画都是阴爻。现在由于下卦损一个阳爻来益它，它的上边的一个阴爻变为阳爻，下卦上边的一个阳爻变为阴爻。这就是“三人行则损一人”的意思。简单说来，“三人行”即下卦三阳爻，“损一人”即三个阳爻损去一个。这正符合卦义损下益上，损刚益柔的要求。“一人行，则得其友”，指全卦六爻两两相与的关系。初九与九二，同德相比，六四与六五，也是同德相比；六三与上九虽非同德相比，却是正应。这些都是两两相与的关系。两两相与，亦即“一人行则得其友”。涉及六爻的问题，为什么在六三爻辞表达出来？因为六三正是当损之爻。此卦所以为损，是由它决定的。\n“三人行则损一人，一人行则得其友”这两句爻辞所云是天地间最大也最明显的损益，具有极大的抽象意义。孔子作《系辞传》，对此作过哲学意义上的说明。《系辞传》说：“天地絪缊，万物化醇；男女构精，万物化生。《易》曰‘三人行则损一人，一人行则得其友’，言致一也。”这里强调的是二。天地是最大的二，男女是最明显的二。天地、男女，泛指阴阳两仪。天地也好，男女也好，既是一阴一阳，势必絪缊交密，精气交构，以致精醇专一，化生万物。也就是说，天地万物莫不合二而生一。在万物生成、发展过程中，追求的是一，经由的是二。没有二便没有一，二必发展为一。二自何来？是三必损一，是一必得一，结果都是二。二自损益来。损益是自然界和人类社会的普遍性规律。","Y3.XN":"一人行则得友而成为二，三人行则必损一人也成为二。成二方可致一，致一方可生生不息。三不必是三，三可概指二以上的任何数。二以上的任何数都要损去其余部分而留下二。因为二则相与，三则相疑。什么是疑？一对一，相与并无疑问。一对两个一，就有疑问了。另外两个一中究竟哪一个一与这个一相与，不能确定。不能确定就是疑。怎么办？“三人行则损一人”，将三损去一，变成二。","Y4.N":"疾，疾病，或者说缺点错误。六四阴柔与初九阳刚正应。初九损刚而来益六四。益六四，就是损六四之柔而益之以刚，把六四的毛病、缺点、错误全损掉，故曰“损其疾”这是“损其疾”的一方面含义。“损其疾”还有另一方面含义。六四以阴柔处上，与初九阳刚正应，当损的时候，又应于阳刚，它能够自损阴柔以从刚，即自损其不善以从善。“遄”字指初九。“使遄”，六四自损其疾的行为，促使初九迅速前来益它，共同合力损六四之疾。初九损下益上，损刚益柔，行动来得迅速，六四自损其阴柔之疾也来得迅速。两方面都迅速，所以有喜；有喜，所以无咎。","Y4.XN":"《周易》多言“有喜”，此处言“亦可喜”，似乎有所不同。此“亦可喜也”很可能站在初九的立场说。意谓六四不吝其疾，主动自损之，以受初九之益，与初九配合得很好。这在初九看来，是可喜的。","Y5.N":"或，不一定之辞，来益者很多，不能确指。“十朋之龟”，最值钱的元龟、大龟。古代以贝为货币，两贝为一朋。朋是货币单位。古代货币种类不一，而单位称朋的，唯贝一种。据《汉书·食货志》，龟宝有四品，第一品元龟岠髯长尺二寸，直二千一百六十，为大贝十朋。六五以顺居中而且处尊，与九二之阳刚正应，有人君虚中自损以顺在下之贤者之象。六五既受天下众人损己以来益，又能虚中自损，而且决心很大，纵然给它最值钱的“十朋之龟”，它也不会动摇，不会拂违众意。因此得元吉。","Y5.XN":"上指上九。佑，福佑。六三与上九正应，六三是要损己益上的。又因为上九与六五比，所以它将受益于六三的东西归诸六五。是谓“自上佑也”。","Y6.N":"上九以阳刚居损之终，损至于极点，应当变为不损了。这时对于上九说来，面临两种选择：一是阳刚居上以损削于下，是一条得咎的道路；二是能损但不行其损，变而以阳刚之道益于下，是一条无咎得正得吉因而利有攸往的道路。上九选择的是后一条道路。居上却能“弗损益之”，故能“得臣无家”。“得臣”谓得天下人心归服。“无家”谓归服的人很多，不分远近内外。“得臣无家”与“四海为家”的意思相似。大意是说，上九能得到众多天下人的臣服。\n上九和九二爻辞都有“弗损益之”句，用辞完全相同，而指却不一样。损卦下体三爻皆取自损以益于人之义，所以九二的“弗损”，谓弗损自己，“益之”谓益于人。九二处下体，本应损己益人，由于它特殊，所以它能够益人却不必损己。上九的“弗损”谓弗损人，“益之”谓益自己。它能够益己却不必损人。","Y6.XN":"上九居上位，居上位而“弗损益之”，正是君子应当做的。君子之志就在于不损人而益之。“弗损益之”，君子之志得以实现。","Z":"损，减损，剥损。损卦之所以名损，是根据此卦有损下益上之象。损下益上，表面上看是损了下边益了上边，其实是既损了下又损了上。犹如垒土，取下之土以增上之高，下危上亦危，下损上亦损。从政治上说，损下益上，剥民奉君，统治者盘剥人民以肥已，其结果也是下损上亦损，人民受到损害，归根结底统治者也必然受到损害，不会稳固。这是卦名曰损的意义。卦名的损，含义完全是反面的、不好的。\n然而卦辞的损，含义则极灵活，所有的损都包括在内，不专指损下益上。国家、社会、个人，上上下下，方方面面皆可用损。损在卦辞里主要的是正面含义。损是好事，不是坏事，前提是损所当损。怎样才算损所当损？首先内心要“有孚”，内心孚诚，依理办事，不以主观好恶决定损与不损。其次，损要“有时”，主观的愿望必须符合客观的时。时当损则必损，时不当损则必不损。损而有孚、有时，损就是好事，就会元吉无咎可贞利有攸往。\n损卦有一个突出的特点：六爻皆应，爻辞也与卦辞应。这在64卦中实不多见。六爻之中，初九与六四，九二与六五，六三与上九，两两皆正应。每爻之义都可在卦辞中寻到根据。初九小象曰“上合志”，九二小象曰“中以为志”，上九小象曰“大得志”，与卦辞所说“有孚”意合。九二爻辞曰“利贞”，上九爻辞曰“贞吉”，与卦辞“可贞”有关。六四爻辞曰“无咎”即卦辞之“无咎”。六五爻辞曰“弗克违，元吉”与卦辞所云“元吉”意义一致。还有，初九爻辞之“遄往”，六四爻辞之“使遄”以及上九爻辞之“攸往”，皆当源自卦辞之“利有攸往”。六爻爻辞中，上九爻辞与卦辞尤为贴切。所云“无咎，贞吉，利有攸往”，与卦辞同。虽不言“有孚元吉”，但云“弗损益之”，“得臣无家”，知其“有孚元吉”之义实尽在不言中。就64卦之大多数看，爻辞与卦辞往往不搭拢，说明卦辞、爻辞大约非出自一人之手。那么损卦之卦辞、爻辞何以如此通贯和谐？说作爻辞的人对损卦卦义体会特深，有深刻的实践经验，可能是恰当的答案。\n损卦包含着极其重要的政治思想，它提出了怎样处理好君臣上下的利害关系问题。其中卦辞赋予损以抽象的意义，它指示任何阶级、阶层和个人运用损的手段为自己开辟道路的最为一般的途径，这个途径是：损而有孚，内心至诚而且为人所理解所信赖；损而有时，时当损则损，时不当损则不损。损不能一般地说好或不好，损要因时而定。六爻爻辞则进一步把损的意义由抽象上升到具体，从五个方面展示损之道的具体内容。初九之益六四，九二之益六五，六三之益上九，是自损以益人。六四损其疾，六五或益之，是损己以从人。初九以自损益人而又酌损，是损之损。九二与上九弗损益之，是不损之损。六三损一人而得友，是损之益。"},"42":{"P":"《序卦传》说：“损而不已必益，故受之以益。”损的反面是益，损发展到一定程度必转变为益，故益卦继损卦。震下巽上为什么名曰益呢？从象上看，雷与风是相益的关系，风骤则雷迅，雷激则风烈，两相助益，所以叫做益。从义上看，益卦与损卦相反，损卦是损下益上，故曰损。益卦是损上益下，故曰益。为什么损下益上曰损，损上益下曰益？上与下利害本来相关，下为上之本，损下则伤本。损下益上，实际上是下损上亦损，上下通一损，故曰损。益下则本固，本固则枝荣。损上益下，实际上是下益上亦益，上下通一益，故曰益。","G.N":"益，增益。益卦卦辞与损卦卦辞有相似之处。卦名曰损专取损下益上之义，而卦辞所讲却是损的最一般意义，凡是损所当损，不论君臣上下谁对谁的损，都在它的包括之内。益卦也如此，益卦卦名曰益，专取损上益下之义，而卦辞所讲却是益的最一般意义，凡属有益于天下国家人群之事，不论君臣上下谁对谁的益，都在它的包括之内。“利有攸往，利涉大川”，利于有所往，有所作为；利于济大难，图大事，做大事情。别的卦言利往则不言利涉，益卦兼言之，是由于益卦强调兴利的缘故。“利有攸往”里本已含有“利涉大川”的意思，此处言利往又言利涉，意在告诫人们天下事往往有因主动争取方可获益的情况，一旦遇上济变之机会便当奋力以求，争得有益的结果，切不可坐失时机。","T.N":"“益，损上益下，民说无疆，自上下下，其道大光”，这四句是解释卦名的。益与损相反，损之兑下艮上反过来变为益的震下巽上。自卦变的角度看，损是损下益上，即三之阳爻上行至上，上之阴爻下来至三，损在下之刚益在上之柔。益是损上益下，即四之阳爻下来至初，初之阴爻上行至四，损在上之刚益在下之柔。自政治的角度看，损于上而益下，人民得到益处，人民欢悦无有穷尽。“自上下下”，语意承接“损上益下”来，含义是一致的，只是程度又加深一步，说明统治者不仅能够实行益之道，而且能够发扬光大。\n“利有攸往，中正有庆。利涉大川，木道乃行”。此四句解释卦辞。益卦六爻皆应，与损卦相同。唯损卦九二与六五居中不得正，益卦适得其反，九二与六五变为六二与九五，既居中又得正，此益卦不同于损卦之处。又中又正，以之益天下，天下必受其福庆。如此则无往而不利。不仅寻常无事之时天下得益于它，而且越是处在天下有大险大难的境况，越能显示出它的巨大的济变的作用。越是危险艰难，越是益道大行之时。因为益卦上体巽，巽为木，木可济川，有“利涉大川”的效用。\n“益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行”。解释卦辞之后，进一步赞誉益道之伟大。“益动而巽”二句就卦德讲益在政治上的意义。震动，振作有为；巽顺，深入有渐。所以功业日益发展，无有限量。“天施地生”二句就卦义讲益在大自然中的表现。“天施”犹言“大哉乾元，万物资始”，“地生”犹言“至哉坤元，万物资生”。“其益无方”，恰如春夏时节，品物咸亨，其益的作用广大无穷，无所不在。“凡益之道”二句合人事、自然两方面言损上益下之道唯在一个“时”字，时当益则益，时当损则损。在自然界，春不至不生，夏不至不长；在人事上，岁不歉不与，时无灾不赈。总而言之，益之道“与时偕行”讲的是规律问题。益有规律，在天道，气候既至，不会不益；在人道，时候正当，不可不益。","X.N":"风与雷有相益的关系，有迅疾的特点。君子效法风雷相益的关系，迁善改过，益莫大焉。君子效法风雷迅疾的特点，见善则即迁，知过则速改，不可犹豫。两个则字用得极恰当，看得出孔子着眼于迁善改过须雷厉风行，及时奋迅，无所疑贰这一点上。","Y1.N":"益卦同于损卦，爻辞之义与卦辞之义有贴切的一面。益卦成卦之义在于损四益初，故初九是成卦之主，它的爻辞的内容与卦辞的内容意义相同。“利用为大作”，作大益于天下之事，与卦辞“利有攸往，利涉大川”大致同义。问题是初九毕竟位卑处下，它作大事业必须六四予以辅助，不能独力进行。它必须把事情做得尽善尽美，得元吉，方可无咎。行不至善，不得元吉，则不但自己有咎，还要累及六四亦得咎。《易》中凡言吉无咎，意思都是说得吉而后可以无咎，这一条爻辞尤为著明。","Y1.XN":"厚事，大事，大的事情，大的事业。初九在一卦之最下，本不当干关乎天下利害的大事业，大事情，由于有六四信任它，支持它，它才能干大事业。因此它必须完全干好，得元吉，支持它的六四才算知人，它自己才算胜任。不然的话，则六四得咎，初九自己亦得咎。","Y2.N":"益卦是损卦之反。损卦之六五倒过来便成为益卦的六二，所以两爻的取象相同。损六五在上体，是受益者，因为损卦卦义是损下益上。益卦六二在下体，也是受益者，因为益卦卦义是损上益下，都是受益者。所以爻辞都说：“或益之，十朋之龟，弗克违。”天下很多人都来益损之六五和益之六二，纵然给它们最值钱的“十朋之龟”，它们也不会拂违众意，不与来益者合作。两爻不同之处是损六五得元吉，益六二得永贞吉。损六五称“元吉”，是因为六五以柔居刚。柔能虚受，刚可固守，是最理想的求益的条件。益之六二称“永贞吉”，是因为益之六二尽管居中而体柔，有虚中之象，容易得天下人来益之，又有九五刚阳之应，然而它有一个弱点，它以柔居柔，爻与位皆阴。它若要获吉，应特别注意永守不变，常久贞固。享于帝，祭祀上帝。“王用享于帝”，是极大极严肃的事情。六二虚中柔顺而能永贞，是受益之臣，王即便用它享上帝，犹当得吉，更无论其他了。","Y2.XN":"六二中正虚中，天下人都愿来益之。这对于六二来说，是不召而至，不是它中心之所期望。六二本无求益之意，而益自来。说“自外来”指外卦九五来益六二未为不可，因为九五与六二正应，九五来益六二是自然的。但是爻辞既云“或益之”，“或”字意谓来益者众，定非一人，就说明“自外来”者是包括九五在内的许多人。“自外来”有非中心所望，不期而来之意。","Y3.N":"“益之用凶事无咎”，六三阴柔不中不正，不当得益于人。然而六三处于下体之上，相当于统治百姓的郡守县令之类的官员。六三以阴居阳位，与上九阳刚正应，又处在震动之极，有刚决果敢，居民之上而能为益于民之象，所以能用凶事，无咎。“凶事”，凶荒札瘥之年，官府守令开仓赈济百姓。“用凶事”，在益的时候，六三采用岁饥而赈恤的办法实现损上益下。凶岁能够赈济百姓，当然是无咎的。不过，要“有孚中行”，要“告公用圭”。有孚是有诚信，既有信于上，也有信于下。只是有诚亦不可，还要中行，中行即行中道。六三在下体之上本不居中，何以曰“中行”？从一卦之上下二体看，二与五各居中，从一卦之全体看，三与四并居中，故益卦三与四两爻皆曰“中行”。有人把此“中行”一词同春秋时代晋国的中行氏联系起来，以为这里的中行就是中行氏，是没有根据的。“告公用圭”，圭是古代用作传递信息的证物，大夫们对外或对上打交道，在比较正式的场合，要拿着圭作为本人身份的凭证。“公”于此卦指六四。六四是近君的大臣。六三居下卦之上，并非无位，但它不可专行，它要赈济百姓，须向六四请示报告，即所谓“告公用圭”。获致批准方可开仓济民。","Y3.XN":"损上益下“用凶事”，荒歉之年官府开仓赈灾以益百姓，所用之粟米本是取之于民的，是民间固有之物，不须另外求益。","Y4.N":"益卦与损卦相反。益卦六四恰当于损卦六三。损卦六三反映损卦损下以益上的思想，益卦六四爻辞与损卦六三相类，反映益卦损上以益下的思想。益下，从政治角度说，莫大于益民，而在古代，最大最重要的益民举动莫过于迁国。六四怎样实现迁国呢？六四在卦中主于益下，但它不在君位，做事不得自专，迁国大事尤须告公，请示君上同意。由于六四与六三在全卦里居中，有中行之德，所以它能够得到公的信从、支持。“利用为依”，用是用六四，与六二“王用享于帝”的用字义同。为依的依字可按《左传》隐公六年“我周之东迁，晋郑焉依”的意义理解。古代诸侯迁国，或依王室或依大国，必有所依。无所依不利，但有所依必须以益民顺下为前提。迁国而不益民顺下，纵然有依，亦不利。六四由于有中行之德，这两条都具备。","Y4.XN":"六四按它的本性说，是以益民为志的。以益民为志，所以告公而获从。","Y5.N":"有孚，心存至诚而为人所信。惠心，惠民之心。惠我德，民惠我之德。九五以刚阳中正居尊位，又有六二中正与它相应，以如此之德、才、位，心存至诚地惠益天下之民，天下之民受其恩惠，其得元吉自不待言。前一个“有孚”是九五孚于下民，后一个“有孚”是下民孚于九五。上下皆有孚，上感而下应，上下相通。九五有一个至诚的惠民的心；反馈回来，民则惠九五之德。这里的心与德是一回事，在九五自己看来是心，自民的角度看来这心即是德。损卦六五受下之益而得“元吉”，益卦九五仅仅有一个惠民(即益民)的心，未必已付诸施行，便得“勿问元吉”，元吉而勿须问，比单说元吉更高一个层次。这说明《周易》已经有了重民思想。","Y5.XN":"“勿问之矣”有孚惠心得元吉肯定无疑，勿用置问。孔子特别把“勿问”一语提出来加以强调，表明他认为人君有无惠民之心是极端重要的。民反过来惠君之德，对于君来说，是大得志，亦即最大的成功。得志，成功，在哪一点上呢？不在于民“惠我德”，而在于君上能够有办法获致民“惠我德”。","Y6.N":"上九处在益卦的极点，本身又是阳刚，求益过甚而无厌，结果走向反面，不唯不能受益，反而必遭损。没有人来益它，倒是有人来击它。为什么会如此？关键的问题是它立心勿恒，必凶。勿同无。立心指立益下之心，勿恒指益下之心无恒。损卦讲损下益上，损下是一时权宜之计，不可恒久。益卦讲损上益下，益下乃千古不易之规，贵在恒久。益卦上九，处在益下的时候，本该坚持益下，但是它做不到，它以阳刚居益之极，求益过甚，益下变为损下，益下之心不恒久。此理应用到政治上，统治者对民取而不与，侵夺之，刮削之，民心不仅不益它，还要反抗它。","Y6.XN":"偏辞，《经典释文》说“偏音篇，孟作徧，云周匝也”。徧字可以写作偏，偏辞就是偏辞。偏辞其实就是逻辑学上说的全称肯定判断或全称否定判断。“莫益之”是个全称否定判断。所有的人都不益它，无一例外。自外来，不期而来。心里不期望它来，而它偏要来。来是必然的，不可避免的。六二小象“或益之，自外来也”，上九小象“或击之，自外来也”。二小象除益与击意义正反不同外，其余是一样的。","Z":"益卦作为卦名的益字取损上益下为义，而在卦辞里面益的内涵则扩大了。不仅仅损上益下，凡是兴利的事情都在它的范围之内。“利有攸往，利涉大川”适用于君臣上下国家个人等等一切方面，它强调做大事，济大难，干大事业；在干的过程中要抓住时机，主动行动，不坐以待时。\n诸爻爻辞与卦辞有有联系的一面，如初九爻辞“利用为大作”即卦辞之“利有攸往，利涉大川”之意。但也有联系不大的一面，其余诸爻讲的都是如何益下的问题，与卦辞几乎无涉。确切一点说，爻辞着重阐发统治者怎样益民及民怎样受益的思想。六二或益之，六三益之用凶事，六四为依迁国，九五有孚惠心，上九莫益之，或击之，从正面和反面阐述恤民、利民、从民、益民的深刻意义。后来早期儒家的德治仁政主张可能与《周易》此卦的启示有一定的关系。\n益卦三、四两爻爻辞提出“中行”一词，值得注意。“中行”很可能是当时常见的一般用语，其义当为履正奉公，言行合乎中道而不悖。有人以为中行指春秋晋国的中行氏，没有任何根据，不可信。"},"43":{"P":"《序卦传》说：“益而不已必决，故受之以夬。夬者决也。”夬训决。《说文》，“决，行流也。”段注改作“下流”水流前行，对于任何阻碍有必去之之势。在夬卦里，决是决去的意思，讲阳如何决去阴，君子如何决去小人。从卦来看，乾下兑上这一卦之所以名曰夬，是因为五个阳爻在下，一个阴爻在上，诸阳继续长进，就要把一个阴爻决去了，这正是君子道长，小人消衰将尽的时候。为什么夬卦次于益卦之后，是因为益之极必决而后止，所以益之后次夬。","G.N":"夬之为卦下五刚而上一柔，在十二辟卦中是三月之卦。卦辞在讲阳怎样决阴，君子怎样决小人的问题上，着重强调警戒危惧，谨慎行事。“扬于王庭”一句是主要的。它说明在夬的时候，五阳去一阴，似乎并不难，但是实际上很不简单，小人(指上爻)正在君侧用事，要把它决去是不容易的。必须认真对待。首先把小人的罪恶“扬于王庭”，使小人无地自容，使君上和众人认识它的真面目。纵然如此，君子仍不可掉以轻心，还要“孚号有厉”，即以至诚之心号召众人而又心存危惧。那么是否对小人诉诸武力呢？不，不可诉诸武力，要“告自邑，不利即戎”。告，告戒。自，从。即，从。从自己所居的邑开始，由近及远，去告诫人们警惕小人，但不可从戎尚武，从戎尚武是不利的。“不利即戎”，却要“利有攸往”，有所作为，有所前进，抓住五阳逼一阴的时机，决去小人。君子不采取主动行动，小人是不会自行决去的。","T.N":"“夬，决也，刚决柔也。健而说，决而和”。解释卦名的含义。夬的意义是决，夬就是决。卦中五阳在下，一阴在上，阳长阴衰，有刚决柔之象，所以卦名曰夬。“健而说，决而和”，是两句赞语。《彖传》在解释完卦名之后又加上两句赞语，一般是为了给下文解释卦辞做准备的。这赞语往往起承上启下的作用。“健而说，决而和”，以上下二体讲卦才。下体是乾，乾是健，上体是兑，兑是说。健而能说，亦即决而能和。决而能和，是夬的最佳状态。刚既要决柔，君于既要决小人，又要方法得当，不至于因为做法有所失误而把事情搞糟。\n“扬于王庭，柔乘五刚也。孚号有厉，其危乃光也”。自此以下解释卦辞。扬于王庭，把小人的罪过宣扬于王朝大庭。小人的罪过是什么呢？小人的罪过是柔乘五刚。小人居君子之上，乘势欺凌君子。“孚号有厉”，君子心存危厉，唯其心存危厉，君子之道方可光大。\n“告自邑，不利即戎，所尚乃穷也”。君子决去小人，应采取“告自邑”的和缓手段，不宜从戎尚武。如果君子专用威猛，以尚武取胜，便是决而不和，便是其道穷矣。\n“利有攸往，刚长乃终也”。复卦卦辞说“利有攸往”，《彖传》释为“刚长也”。夬卦卦辞也说“利有攸往”，《彖传》则释为“刚长乃终也”。刚自复卦开始长，至夬卦时，刚长至五，阴只剩一了。阳再前进一步决去一阴，卦就变为纯阳而为乾了。变为纯乾，刚长的全部过程乃“终”，才算完成。复卦“利有攸往”，犹如平地始起一篑，孔子喜其进，所以说“刚长”。夬卦“利有攸往”，犹如土累九仞，尚亏一篑，孔子恐其止，所以说“刚长乃终也”。","X.N":"需卦讲“云上于天”，云上于天为需，泽尚有待。今夬卦讲“泽上于天”，泽上于天，一旦决注便成雨，雨施而滋润天下。君子观此象，要以之施禄，不要以之居德。居德与施禄，意义相反。居是吝而不施，积而不散。德在此处有恩泽、恩惠的意思。君子最忌“居德”不施。“施禄及下”，把恩泽、好处散施给下民，是最为可取的。","Y1.N":"凡爻辞言趾的，多在初爻。夬卦与大壮有相似之处，夬五阳一阴，大壮四阳一阴，只差一画。大壮初九曰“壮于趾，征凶”，夬卦初九曰“壮于前趾，往不胜，为咎”，两卦取象一致，爻义基本相同。都是说初九以阳刚居乾体，本属在上之物，而今身居卑下，不免使任壮往之气，壮于趾或壮于前趾，锐意前进而上除君侧之小人，其实力量相去悬殊，必败无疑。夬卦初九多一个“前”字，前进的意思更加重一些。“前”字在此作动词用，“前趾”意谓将脚趾向前迈，也就是前进。“壮于前趾”即壮于前进。“壮于趾”和“壮于前趾”，都是躁动的表现。说“往不胜，为咎”，强调“不胜”，强调“为”，意在指出初九之败实非时势造成，完全是咎由自取。","Y1.XN":"“不胜而往”，讲的是一种心态。夬卦告诫人们，在决的时候，最重要的是无论在怎样的情况下都要保持着一种危惧感，即便有胜利的把握，也切切不可掉以轻心，更何况“不胜而往”！咎自何来？咎是自己做成的。夬之时，胜心不可有，知其不可胜而妄想取胜之心尤不可有。","Y2.N":"九二在夬卦六爻中是最好的一爻。九二爻辞完全体现了卦辞“孚号有厉”，“不利即戎”那种强调君子决小人应时刻不忘危惧警戒的精神。“惕号”，心怀警惕而外孚号同志，戒备严密，处无事若有事，虽有小人阴谋，必无所伺隙。“莫夜有戎，勿恤”。莫，暮。小人乘夜晚举兵来袭，亦不足忧虑。此处有事若无事。君子欲决小人，必戒备小人，有了戒备方可无患。因为能惕，所以勿恤，因为能处无事若有事，所以处有事时若无事。犹如征战，平素无事却终日钦钦如临大敌，及临阵则志气安闲，仿佛不欲战。","Y2.XN":"“有戎勿恤”，不是故意表现遇事不慌，安闲自在，是说明它临事不忧，居中制胜，胸中自有它的道在。从爻象看，九二以刚居柔，刚而不过，有似老成，与初九以刚居刚，少年喜事好胜者不同。但是九四也是以刚居柔，何以九四不如九二？关键在于九二居乾体之中，得中道。《易》贵中，九二虽不正，但因为得中，位不正，义也正了。夬九二与大壮九二情况略同，故都称得中。","Y3.N":"此爻大意谓君子决去小人主要看其内心是否坚决，内心若坚决，虽暂时与小人和合共处，受到同志的误解、责难，也没有关系，只要最后把小人决去，就无咎。《彖传》所说“决而和”，亦即此意。\n頄，颧骨。“壮于頄”，九三以刚居刚，居乾体之上，刚亢外露，心中欲决去小人的意向，悻悻然表现在脸面上。其结果必凶，“壮于頄，有凶”，是九三的一方面情况，一种可能性。九三还有另一方面情况，另一种可能性。九三作为一个君子，有坚决决去小人的夬夬之志，然而表面表现缓和。它独与上六这个小人正应，有“独行遇雨，若濡”之象。雨指上六，上六是兑卦的主爻，泽上于天，故称雨。九三应于上六不是出于本心，故称遇。濡也是表面现象，不是真濡，故称若。九三看来好像被上六这个雨濡染了，与之同流合污了，而其实是和而不同，“君子夬夬”之志坚定不移。众君子不免误解它，甚至“有愠”于它，但这是暂时的，最终必无咎。","Y3.XN":"开始时“若濡”，“有愠”，似乎与小人有了私爱的关系，甚乃同志者也愠怒于它，而最终却是无咎的。因为它有“君子夬夬”之志，迟早它要把小人决掉。","Y4.N":"九四以阳居阴，不中不正，虽有决去小人之志，但其刚壮之性使它急于前进而不知处之以缓。所以有“臀无肤，其行次且”之象。臀部没有肉，坐不下；坐不下，就必须走。走起来又次且(与趑趄同)难行，前进不得。处境是很艰难的。怎么办呢？唯一的办法是“牵羊”，羊指九四自身，牵羊是九四自牵其羊。羊的特性是善触，不把角触坏不罢休。九四如果能自牵其羊，把自己的羊一般的狠性制止住，就可以无悔了。不过这只是一种可能性，能否实现，要看九四能否闻言而信。九四很可能“闻言不信”。因为人在无所忧虑畏惧的时候，警戒之言不易听进去。","Y4.XN":"九四的一切问题都由它的位不当即不中不正来。由于以刚居柔，位不当，所以才“臀无肤，其行次且”，不能前进而一定要前进。“牵羊”之言是忠告，它也难以听进去。孔子作“小象”，惋惜之，激励之，说：“聪不明也！”“聪不明”《易》中凡两见，除此爻外还有噬嗑上九。聪不明，听之不聪之意。聪本来是说耳聪，明本来是说目明。两字结成“聪不明”句式时，聪字充当主语，相当于耳听，而明字便具有了聪义。","Y5.N":"苋陆，马齿苋，一年生草本植物，感阴气多和柔脆易折是它的特点。\n“苋陆夬夬”之象，说明九五切比于小人上六，受阴气的影响较大，作为决阴之主，竟与众阳要决的小人关系密切，有咎是当然的。另一方面，九五刚阳中正居尊位，有夬夬之志亦有夬夬之力，能够断绝与上六的关系且把它决掉。夬夬，重夬，夬而又夬。夬的对象是上六。九三应于上六，九五比于上六，为避免不能夬的嫌疑，所以都连用两个夬字，以加重九三、九五决去小人的坚定感。九五能够以中行之道即中道解决好与上六的关系，即决之又不过暴，故可无咎。","Y5.XN":"因为中未光，所以要贵于中行。不是说虽已中行而犹未光。什么是“中未光”？“中未光”是中心未光，亦即思想上还有问题。九五以阳刚近比于阴柔，思想感情上不可能没有系累，这就非常需要注意在实际行动上力行中正之道。","Y6.N":"夬卦发展到上六这一爻，阳长至极点，阴消到尽头，正是众君子得时，小人失势之际，小人被消尽的形势已定，小人无须号咷畏惧，终必得凶。","Y6.XN":"号读平声，不读去声。小人至此已经必然消亡，形势无可改变，不可能再长久。虽号也无济于事。但是，不可长久的是小人之道，决去小人之道，不必决去小人之人。","Z":"夬是阳决阴，君子决小人之卦。为卦五阳在下盛进，一阴在上衰退。君子得时，小人失势，小人被消尽的形势已定，不过时间早晚的问题。然而卦辞爻辞却不因此而稍为懈怠，相反倒是以警戒危惧为诫，深切丁宁，无所不至，以为越是容易成功的事情，做起来越要谨慎小心。卦辞“有厉”，九二“惕号”，九四“牵羊”，莫不强调这一思想。夬卦五阳决一阴，与四阳逐二阴的大壮略相似，都有刚壮过甚之虞，以阳居阳者为尤甚，初九之“壮于趾”，九三之“壮于頄”之类即是。所以作《易》的人于夬之诸爻谆谆告戒阳决阴，君子决小人要自制其刚壮之性，做到“决而和”，既要决之又要和之，既要和之又要决之。九二与九五两爻更要决之以中道、中行。"},"44":{"P":"《序卦传》说：“夬者决也。决必有遇，故受之以姤。姤者遇也。”《经典释文》、马王堆帛书《易经》以及《杂卦传》，姤均作遘。姤即遘。遘训遇。遇是不期而遇的意思。古代诸侯会盟，期而会叫会，不期而会叫遇。姤卦为什么次于夬卦之后？夬是决，决是分。姤是遇，遇是合。物合而未分，谈不到遇。只有分开的东西才有相遇的可能，所以夬卦之后次之以姤。姤卦巽下乾上，巽下乾上为什么名曰姤？一则巽下乾上有风行天下之象，风行天下，接触万物，有遇的含义。二则为卦一阴生于下而与刚阳不期而会，有遇的意思，所以卦名曰姤。","G.N":"姤卦一阴始生，接着将是二阴生，三阴生，四阴生，发展的趋势是阴长阳消，阴将盛长壮大，这是“女壮”的表现。按照《周易》作者的观点，女壮不是好事是坏事。因为女壮必男弱，女壮而男弱，则男尊女卑、夫刚妻柔的关系将被颠倒。所以在姤的时候，“勿用取女”。人在主观上要注意努力避免任何有利于加强阴柔或女子的作法。","T.N":"“姤遇也，柔遇刚也”，解释卦名。姤的含义是遇。此卦所以名姤，是因为柔遇刚，而不是刚遇柔。柔遇刚何以称姤？夬卦五阳在下一阴在上，阳再长一步，一阴决去则为纯乾。乾是四月之卦但不可次夬。夬之后是五月之卦姤，姤一阴生于下，不期而猝然遇于刚。因此孔子揭示出姤的实质是遇，遇的实质是柔遇刚。\n“勿用取女，不可与长也”，解释卦辞。长应读长久之长。一阴既然已生，其势必逐渐盛大。阴盛则阳必衰，这渐盛之阴将要把阳胜过，把阳消尽。对于这个阴，不可长久相与，犹如一个气质、性格盛过男人的女人，男人不可娶她组织家庭，与之长久生活，所以卦辞曰“勿用取女”。“勿用取女”反映《周易》经与传的作者有着深刻的男尊女卑、崇男抑女的思想。\n“天地相遇，品物咸章也”，解释完卦名、卦辞之后，孔子对姤卦的时义加以推阐。阴遇阳，柔遇刚，不好。然而从整个宇宙的角度看，阴遇阳，柔遇刚，又很好。阴遇阳，就是天地相遇，天地交感。天地相遇相交感的效用是极其伟大的，它生出万物，万物彰明畅茂。\n“刚遇中正，天下大行也”，刚指九五而言，九五以刚阳居中得正，故曰“刚遇中正”。“刚遇中正”，从政治上说，天子有刚阳之德又中正居尊位，于是姤之道大行于天下，是什么阻力也阻挡不了的。\n“姤之时义大矣哉”，姤是坏事也是好事。究竟是坏事还是好事，界限怎样划，关键在于一个时字，时宜则姤是好事，时不宜则姤是坏事。好事坏事全在判断、掌握。朱熹说“几微之际，圣人所谨”，正是此意。","X.N":"天下有风，风行天下，普遍接触万物，与万物相遇，这就是姤。后是什么？《尔雅·释诂》：“林、烝、天、帝、皇、王、后、辟、公、侯，君也。”这里的后就是王。后体察了姤之象，应用到政治统治上，就要“施命诰四方”，把自己的命令下达到四方，使天下所有的人，所有的角落都知道，都照办。姤卦“大象”与观卦相似，但也不尽相同。姤卦天下有风，风无处不吹，后的命令无处不到，而观是风行地上，先王亲自出巡，所到之处有限。","Y1.N":"初六是姤卦之主，姤卦之所以为姤卦，就在此一爻。卦辞讲“女壮”，是就全卦而言，此爻辞讲一阴如何微弱，所指只初六一画。爻辞之意是强调阴虽处在微弱之时，但它是要渐长的，君子此时最要注意设法制止它，不使它向前长进，一旦它壮大起来，就不能制了。全部爻辞分两截说，“系于金柅贞吉”是一截，以下又是一截。柅是止车之物，即车上的制动器。柅既可制动，使车停止不前，且柅又是金子做的，其制动的效果可谓百无一失。这还不算，金柅之外又以绳索系之，牢而又牢，固而又固，车是不可能前进了。初六一阴生于下，力量微弱，最易被人忽略，任其发展下去，将来必成大害。君子察之于先，及早“系于金柅”，制止之使其不得前进。如此可得“贞吉”，此“贞吉”是静止吉，不是正吉。爻辞的下一截讲的是另一面意思，假如君子不“系于金柅”而“有攸往”，任初六一阴前进，则必“见凶”。最后一句用猪的形象和行为比喻初六，进一步告诫君子要见微知著，防患未然。“羸豕”，瘦弱的猪，将来必肥壮，故从其发展看，瘦弱的猪亦可畏。“孚蹢躅”，虽瘦弱，但也跳跃蠢动，急于前进。初六就像一只阴躁的瘦猪，君子要在它还是个瘦猪的时候就制住它，不让它肥壮。","Y1.XN":"“系于金柅，柔道牵也”，理解初六小象，牵字很关键。《易》里凡是用牵字的，从小畜九二“牵复吉”至此，都是牵制的意思，即往回拉，牵制着使之不得前进，而不是往前拉。这里的“柔道牵也”，是把柔道往回拉，使它不能前进。阴柔之道必须有所牵制，使它不至于盛长。","Y2.N":"鱼是阴物。“包有鱼”的鱼指初六。是九二包初六这条鱼。九二阳刚居中，与初六亲比，既有“包有鱼”的责任，也有“包有鱼”的能力。“包有鱼”的意思主要是制阴，制止阴柔之道发展。其次还有一个容阴的意义。什么是容阴？九二居中，能够恰当地处理与小人的关系，对人采取兼容的态度，不使矛盾激化。制阴之义和容阴之义都通过这个包字表达出来。制阴之义是主要的，根本的，容阴也是为了制阴，两层含义实不抵触。“不利宾”，即不利于外。初六阴柔之鱼已为亲比之刚中九二所包所止，外人得不到鱼了。","Y2.XN":"九二“包有鱼，”首先把始生于下而其势渐长的初六一阴制止住，不使前进，以义言之，不可使遇于宾。","Y3.N":"此爻爻义与夬卦九四大体相同。“臀无肤，其行次且”，臀部无肉，坐不下；坐不下就必须走，走起来又次且难行，行动不得，处境十分艰难。九三为什么这样呢？因为它过刚不中，处在姤的时候，有求遇初六即制止初六的愿望。这制阴的愿望促使它虽艰难也要行动，然而它所处的位置又决定它不该求乎初六之遇，制乎初六之阴，仅凭着自己的主观愿望一定要那样做，是危险的。不过也没有大问题，九三毕竟是刚阳得正，不至于迷惑到底，假若它能认清自己的处境，不妄动，则可以无大咎。","Y3.XN":"牵，还是牵制的意思。九三“其行次且”，行动艰难，说明它不应该也不可能牵制阴柔之初六。初六“小象”“柔道牵”，是说可以把阴柔之道牵制住。此爻小象“行未牵”，意义相反，是说九三牵制阴柔之道的愿望实现不了。","Y4.N":"九四与初六乃正应，本应起到制阴的作用，但它实际上制不了初六之阴柔。这固然是由于九二亲比初六，已将初六制止住了，九四已无阴柔可制，不过若从九四自身检查，也存在着严重的问题。九四以刚居阴，不中又不正，它不能容阴也不能制阴，与九二“包有鱼”之义相反，故云“包无鱼”。此与夬卦九三爻义相似。夬九三当决阴之任，却“壮于頄”，恃刚壮而怒形于色。此爻当制阴之任，却“包无鱼”，疾恶小人而远离之。两爻都缺乏包容之度量，更无制服阴柔小人之好办法，所以一个“有凶”，一个“起凶”。“起凶”即生凶，与“有凶”意义相同。","Y4.XN":"无鱼之凶，主要是由于九四不中不正因而对于小人不能包而容之造成的。不能容之便不能制之。不能容民亦不能制民，民则远于我。其实不是民远我，而是我远民。","Y5.N":"九五与初六无比也无应，即无遇阴的机会，不遇阴便难于制阴。然而九五阳刚中正，它是有办法制阴的。“以杞包瓜”，九五象木高叶大的杞树，初六象在地之瓜，九五象高大之杞包在地之瓜一样把初六包住。包住不等于解决。解决尚须时间，尚须等待。“含章”就是这个意思。含蓄不露，不动声色，静以待之，总有一日会“有陨自天”，瓜熟而蒂脱，落到地上。初六一阴终被制服。","Y5.XN":"九五之所以能含章，含蓄不露，善于等待，因为它阳刚中正。非阳刚中正是做不到的。志，人的主观意志。舍，违背。命，客观的规律。“志不舍命”，人的主观意志不违背客观的规律。姤卦一阴始生于下，阴长阳消，是客观的规律。客观的规律不可违背，但九五有制阴的坚强意志，它顺应规律，采取“含章”的途径，使初六一阴像瓜熟蒂落一样被制服。瓜熟蒂落，自然而然，合乎规律，正是“有陨自天”。“有陨自天”既是规律也是九五的意志所致。因此小象说“有陨自天，志不舍命也”。后世荀子所云“制天命而用之”，义与此同。","Y6.N":"上九刚而居最上，像一个角长在头上，等于姤卦之角，故云“姤其角”。姤卦与夬卦相反，夬卦初九反过来就是姤卦上九。夬卦初九“壮其前趾”，姤卦上九“姤其角”，都距离阴爻最远。夬卦初九不能决阴，即便它一定要前进，也不能成功，且必为咎。姤卦上九不能遇阴，故不能制阴，是可吝的。但是有一点与夬卦初九不同。夬卦初九既居初，就要有所前进，而姤卦上九居上，不可能再前进了，制阴已不是它份内的事，故无咎。很像一个隐居世外的人，世上出了乱子，它既不能救，也不参与，没有功也没有过。","Y6.XN":"姤其角，君子处姤之极，不遇阴不制阴，虽然没有过咎，也是可羞可惭之事。这是因为它处于姤卦穷极的缘故。","Z":"姤卦反映出来的思想宜从两方面看，卦辞是从宏观方面讲的意义，诸爻爻辞是从微观方面讲阳制阴即君子制小人的原则。姤的意义是柔遇刚，阴渐壮，阳渐消，所以姤之事不是美事，姤之名不是美名。但是在有的时候，有的情况下，姤又是美事又是美名，甚至自然界和人类社会不可没有姤，例如天地是阴阳相遇，君臣是阴阳相遇，男女是阴阳相遇，阴阳相遇即是姤，有了姤才有万物的生长，社会的稳定，人类的繁衍。就是说，阳刚好，然而没有阴柔不行；阴阳相须相得才有世界。问题在于阴与阳的关系永远处在变动之中，阴长阳消，阳长阴消，盛衰消息，无有尽头。于是就产生了人类如何掌握、控制、利用阴阳消长规律的问题。人要明察阴阳变化的几微，审慎行动，尽可能使变化朝有利于自己方面发展。\n怎样明察几微，审慎行动，使阴阳变化有利于自己，这个问题主要反映在六爻爻辞上。姤卦爻辞把阴阳的关系具体地落到人世间君子与小人的问题上来。在小人渐盛，君子渐衰的形势下，君子如何制小人，不是简单的事情。六条爻辞中九五的思想最为深刻重要。君子对待得势的小人，要像杞叶包瓜那样先把它包住，然后含而不露，等待“有陨自天”，瓜熟蒂落。其中含有既重规律又不放弃人事，既重人事又不违规律的义蕴。其余如九二“包有鱼”强调君子欲制小人必先善于容小人，九四“包无鱼”从反面说君子包容小人方能制服小人的道理，九三“臀无肤”讲制小人之艰难不易，初六“系于金柅”，告诫君子勿以为小人势力尚微，就不重视它，要趁它还很微弱的时候就加以制之，使不得发展，这些都深刻地表达了一种思想：阴柔小人自有它存在发展的理由和根据，阳刚君子亦当有它制服阴柔小人的适宜办法。任何简单化的态度都将引来无穷尽的凶咎。上九“姤其角”这一爻远离小人，不能及也不能制，不能与乱亦不能救乱，俨然世外君子。看来似乎与姤卦之义无涉，其实生活中恰恰不乏这等人这等事，《易》作者写进来，尤能表明他思想的细致、全面、周密。"},"45":{"P":"《序卦传》说：“姤者遇也。物相遇而后聚，故受之以萃。萃者聚也。”萃的意义是聚。物相会遇必成群，成群即萃聚，所以姤卦之后次之以萃。","G.N":"第一个亨字是衍文。各本卦名下原无亨字，唯独王肃本有，王弼本因之。孔子《彖传》就没有亨字。假音格，作至讲。“有庙”就是庙。有字如有虞氏、有夏氏之有，没有意义。“王假有庙”即王至庙。王至庙干什么？祭祀。古代国家有大事如出征打仗等，天子诸侯必至庙祭祖考，表示他决定要打仗，是秉承或者符合先人意志的，用此把人们的思想统一起来，聚合起来。萃卦卦辞的主旨就是讲如何将天下人聚合起来，而古人认为萃聚天下人的最大最有效的办法莫过于入庙祭，所以卦辞说“萃，王假有庙”。欲萃聚天下人，除“王假有庙”外，还须“利见大人”，还须“利贞”。大人指天子诸侯最高层的统治者。人聚则乱，物聚则争，作《易》者认为天下萃聚了，不可没有王公大人的统治，否则萃聚就要变为乱和争。萃聚也还必须正。萃聚不以正，便是苟合悖聚，是不巩固的。“用大牲，吉”，此接上文“王假有庙”来。萃是万物盛多，国家富有的时代。这时期祭祀应该用大牲，不用小牲，即对待鬼神要丰厚，不可吝啬。古代以祭为国之大事，所以，虽说的是祭享，实际上一切事情都包括了。当天下国家富有之时，一切事情都应从厚不从薄。天下国家民富物丰，最是有为之时，所以“利有攸往”。","T.N":"“萃，聚也。顺以说，刚中而应，故聚也。”萃训聚。以下从卦德卦体角度讲所以能聚的原因，而未进一步解释卦名萃的内涵。为卦坤下兑上，坤之德顺，兑之德说，故曰“顺以说”。又九五阳刚处中正之位，而下边有六二的应助，所以能够萃聚。\n“王假有庙，致孝享也”，王于庙中祭享，对待先人要在思想上表现出最大的孝心来，在物质上拿出最大的贡献来。总之要有至诚之心。王者萃聚天下人之心，自己要像祭祀时对待先人那样有至诚之心。用在庙中祭祀先人那样的至诚之心来对待天下人，从而把天下人萃聚起来，是没有问题的。\n“利见大人亨，聚以正也”，大人指统治阶级，不是一般人。只有统治阶级能够把天下人萃聚起来。如果不是统治阶级而萃聚天下人，就要闹乱子了。由王公大人萃聚天下人，是萃以正道，否则就是萃以邪道了。\n“用大牲吉，利有攸往，顺天命也”。物丰的时候，其用宜厚，物乏的时候，其用宜薄。萃是物资丰富的时代，在萃的时代，人们的消费享用要相应地充足一些，祭祀也要用大牲。萃既是富有的时代，当然也就是有可为的时代，在这时候，利有攸往，有所作为，有所行动。这是“顺天命”的。“天命”，宋人理解为天理，其实就是规律。\n“观其所聚，而天地万物之情可见矣”。这是孔子解释卦辞之后自己所做的发挥。《彖传》言“天地万物之情”的共有三卦，咸卦说“观其所感”，强调的是情之通；恒卦说“观其所恒”，强调的是情之久；萃卦说“观其所聚”，强调的是情之同。三卦虽各有特点，但是各有自己的规律在起作用却是共同的。萃卦讲天地万物之聚。物聚的规律是同，王弼说的“方以类聚，物以群分。情同而后乃聚，气合而后乃群”，正是这个意思。","X.N":"为卦坤下兑上，有泽上于地之象。泽既上于地，则水必聚，所以名曰萃。君子观萃之象，应用到治国上要“除戎器，戒不虞”。除，整治、修缮。“除戎器，戒不虞”，整治兵器，加强武备，以防范国家出乱子。孔子把萃聚与“除戎器，戒不虞”联系起来，其作为中间环节的思想是：物聚人盛，必有争，争必乱，为防争防乱，必须豫为之戒备。","Y1.N":"初六与九四正应，本该与九四相萃聚，只是由于上卦有九四和九五两个阳爻，使初六对九四的信赖发生动摇，以至于疑乱不一，既想萃于九四又要萃于九五，与九四有孚而不终。其结果必“乃乱乃萃”。两乃字不一样。前个乃字是虚字，无义。后个乃字训你。你(初六)有孚不终，就要乱了你的萃聚的步调。不过这也没有大问题，只要初六以至诚迫切之心，号咷着求萃于九四，九四一定会高高兴兴地来与之应，即与之萃。如此，则“一握为笑”。手一握的短暂时间，就可变号咷为欢笑，得萃其所当萃。所以初六“勿恤”，不要怕。要大胆前往。大胆前往，必无咎。","Y1.XN":"初六面对九四、九五两阳，疑乱不一，不能抉择，根本的原因是初六的心志乱了，思想乱了。","Y2.N":"引，援引。孚，诚。禴，简薄的祭祀。六二以阴居阴，履中得正，与九五正应。九五是中正之君，六二是中正之臣，六二理应萃于九五，但须有九五来援引它，它自己不宜主动前往。因援引而不是因自荐萃聚于九五，才可以得吉而无咎。“孚乃利用禴”，说六二与九五相萃聚，以诚信为根本，犹如祭祀，只要中心诚敬，仪节无论怎样简，祭品无论怎样薄，都可以。","Y2.XN":"六二居中得正，自持中道而不变。所以与九五萃聚需要援引，而不自进；即便经援引而与九五之君聚合了，也依然守中道不变。","Y3.N":"萃的时代利见大人，大人是九五，六三与九五非应非比，欲求萃而不得，不免发出嗟叹之声。形势对于六三无所利。不过出路还是有的，六三与九四亲比，若往求萃于九四，九四会接受的。萃聚于九四，亦可无咎。但是六三无正应而亲比于九四，毕竟所聚非正，所以有小吝。","Y3.XN":"萃卦下体三阴，初六、六二都与上体之阳相萃聚，唯独六三不中不正，无所应与。尽管如此，处在萃的时代，总是要萃的。六三在下欲萃于上，上亦欲来萃于下之六三。六三既能往求萃于上，虽小吝但可无咎。“上巽也”之上指九四，九四居说体，故曰上巽。","Y4.N":"九四只有得大吉方可无咎。萃卦与比卦相似，比卦五阴都比九五一阳，萃卦四阴都萃聚于九五、九四二阳。九五与九四又有不同，九五得尊位而九四无尊位。无尊位而得众心，下体群阴都来萃聚于它，其实并非好事，极易得咎。若想无咎，必须大吉。犹如益卦初九，在下位而任大事，也必得无吉而可无咎。大是周遍的意思，做事无所不周，无所不正，达到至善至美的程度，谓之大吉。","Y4.XN":"九四得大吉方可无咎。为什么对九四要求如此严苛呢？因为九四位不当。《易》里凡言“位不当”，表面上都是说爻位不当，其实往往是借爻位当不当发明时位之当与不当。此爻之位不当，说的是以阳刚而迫近于君。","Y5.N":"九四的问题是无位，九五的问题是有德无德。九五是萃卦之主。处在萃的时代，作为萃卦之主的九五，重要的是有其位，更重要的是有其德。有其位而无其德，则天下之人必有许许多多不信我，不服我，这就叫做“匪孚”。天下人好像在说，在上之君就其位说，他要萃我们，而就其德说，他并不想萃我们。这对于九五很不利，要有悔的。怎么办呢？唯一的办法是反身修己，做到“元永贞”而后可能悔亡。元，善，长，是为君的一种德性。元，又加上永恒贞固，这三条是作为君上的人极为重要的修养。","Y5.XN":"光，广，大，全面。九五有其位而无其德，天下人“匪孚”，不信服于它，它的王者之志未能全面实现、光大。","Y6.N":"赍咨涕洟，嗟叹哭泣。上六为什么嗟叹哭泣呢？因为上六处在萃卦之极，当萃极将散的时侯，欲萃而不得萃。很像受贬斥在外，不得君父亲近的放臣屏子，心中既充满怨艾，又有一腔求萃之热情，自然而然地嗟叹哭泣。求萃的心志坚定不移，最终还是能得萃的，所以无咎。","Y6.XN":"上即外，放臣屏子身在外但心未安于外，赍咨涕洟，哓哓号泣，求萃于君父之心，一日未尝止息。","Z":"萃卦与比卦有相似之处。比卦坤下坎上，一个阳爻五个阴爻。萃卦坤下兑上，两个阳爻四个阴爻。两卦都以九五为主。比卦五个阴爻都与九五比。萃卦情况要复杂些，它有九五和九四两个阳爻，四个阴爻有的萃于九五，也有的萃于九四。对于四阴来说，主要的问题是如何萃于九五。对于二阳来说，主要的问题是如何萃于众阴。九四居臣位而得众心，大吉方可无咎。九五萃有位，刚阳中正居尊，以此萃天下固然无咎，但是关键是看它有德无德。由此可见，萃卦有很强的政治性。它讲萃聚问题是有前提的。它不提倡人际之间任何情况的萃聚，它要求的是下对上的萃聚，臣民对君上的萃聚，萃聚的核心是王公大人。以王公大人为核心的萃聚是正，不以王公大人为核心的萃聚则为不正。卦辞说“王假有庙，利见大人”，《彖传》解释说“利见大人，聚以正也”，正是此意。\n萃卦还有一显著的特点，六爻无论有应无应，当位不当位，皆云无咎。这其实并不奇怪，方以类聚，物以群分，凡人或物，情性相同，自然相聚合。在或聚或散的时候，最能表现天地万物之真情。这就是萃。当萃之时，曰号，曰笑，曰嗟，曰咨，曰涕洟，欢欣悲戚，都是真情的表露，所以六爻一概无咎。萃卦强调聚合，与老庄鼓吹孤独截然相反。《周易》思想不同于老庄，于此可见一斑。"},"46":{"P":"《序卦传》说：“萃者聚也。聚而上者谓之升，故受之以升。”物积聚起来，必然增高，增高必向上，所以萃卦之后次之以升。升的含义是前进而上。升之为卦巽下坤上，巽为木，坤为地，木在地下，必萌发生长而向上增高，有升之象。","G.N":"64卦卦辞只说元亨而别无他辞的有大有和鼎两卦，说元亨也有他辞但无戒辞的有升一卦。就是说，64卦中唯大有、鼎，升三卦讲元亨而不加任何条件，不加任何限制，突出地强调元亨，别的卦都不如此。虽比卦与大有相似，井卦与鼎卦相似，但是比与井二卦所云都是普通百姓的事情，而大有与鼎二卦所云则在养贤，尚贤。渐卦与升卦也相似，升是向上，渐也是向上；升所云是贤者之升，渐所云也是贤者之渐。渐不言元亨而升言元亨者，是因为渐是贤者有所需待而进，升是贤者得时，无所阻碍而登。“用见大人，勿恤，南征吉，”当升的时候，自己的才智、道德的修养成熟了，还要用以见大人，得到大人即王公圣贤的提携。不必忧虑志不得遂，尽管南征就是了。南征是前进的意思。前进得吉。","T.N":"“柔以时升”，这一句是解释卦名的。升的含义就是升，但是是怎样的一种升呢？是这样的一种升：其起点是初六，初六居下体巽之下，阴自此始生，然后向上发展以极于上。犹如一棵树，自根部开始滋生，生长向上，以至于枝叶繁盛。这种升有两个特点。一、是柔升不是刚升；二、是以时而升，不是躁进。“柔以时升”的柔所指显然是初六，不是六四、六五，也不是上体坤。\n“巽而顺，刚中而应，是以大亨”，这几句是解释卦辞的。“大亨”应为“元亨”。“元亨”作为卦辞，必与卦名有联系。就是说，卦名曰升，升之中已经包含了“元亨”的意义。《彖传》又从卦德卦体两方面进一步发掘“元亨”的底蕴，但也不出乎卦名之中。“巽而顺，刚中而应”两句连解释卦名升并以解释卦辞的元亨。这可以与无妄对照看。升卦与无妄相对，无妄“动而健，刚中而应”，升卦“巽而顺，刚中而应”。一个是“动而健”，下动而上健，九五刚中应于六二，顺乎自然，应乎规律，是谓无妄，无妄而元亨；一个是“巽而顺”，下巽而上顺，九二刚中正应于六五，能巽而顺，其升以时，所以元亨。\n“用见大人勿恤，有庆也”，有庆犹今语所谓好事。“用见大人勿恤”，得见大人，则升是肯定无疑的，勿庸忧虑了。这对于个人来说，升路已开，了无阻碍，是好事，对于天下人来说也将是好事。凡事不仅于己好，于天下人也好，谓之有庆。\n“南征吉，志行也”南通常是所面对的方向，南征即向前方行进。向前进即可实现其升的志愿，取得成功。","X.N":"升卦巽下坤上，下边是木，上边是地，有木生于地中之象。木生于地中，由幼小细嫩之芽长成枝叶繁茂的大树，是一个日积月累、从容积渐的过程。其间不可躁，不可逆，不可助长，宜顺理而进，以时而行。君子观升之象，应用到修养和政治上，要念念谨慎，事事谨慎，日日谨慎。德行与政绩都要积小以成高大，切不可幻想一朝成大事大名，而弃小善不为。","Y1.N":"允，信。升之为卦巽下坤上，巽好像木，初六巽主居下，好像木之根。木之根在地下，有地中养料和水分的滋养，其向上生长而成为大树，是没有疑问的。升卦之所以为升卦，关键在于下卦巽，有地而无木何以升；巽之所以为巽，关键在于初六，木而无根何以为木。升卦初六最为重要。《彖传》谓“柔以时升”之柔即指初六，所以卦中六爻唯初六曰大吉。与升相对的无妄，情形与此类似。其《彖传》云“刚自外来而为主于内”的主亦指初爻而言，初爻的地位极重，故无妄六爻也唯初九曰吉。","Y1.XN":"上指上体三阴。初六居下，柔进而上，与上体之三阴同志；它要升，三阴也要升；它的升受到众同志的信赖和配合，所以允升大吉。","Y2.N":"孚，诚信。此爻辞与萃六二相似。萃六二因中虚而孚，上与九五相应，此爻因中实而孚，上与六五相应。二爻虽虚实不同，而有孚于上，却是一样的。萃六二有孚于上是为了求萃，此爻有孚于上是为了求升。前者以柔应刚，后者以刚应柔，刚柔所居不同，其以至诚相感则不殊，因而《彖传》都说：“刚中而应”。“孚乃利用禴”的孚字很重要，表明必孚乃利于用禴，若不孚则不利于用禴。禴是简质无文的祭祀。“利用禴”比喻阳刚之臣事柔弱之君，以至诚之心相感通而不用文饰，方可无咎。当升之时，本来以柔为好，九二以阳刚得无咎，主要是因为它居中。可以说，初六大吉以柔，九二无咎以中。","Y2.XN":"有庆是好事，有喜也是好事，而含义略有不同。前者意谓己有福庆而又及于别人，及于天下，它涉及的面较广；后则只关自己，不关涉别人，所谓有喜，是就事情本身而言，事情是好事，把好事办成却又不损失什么不妨碍什么，甚至还会带来另外的好处。九二以至诚求升于上，是处升之时最好的为臣之道，不唯无咎而已，还可以行刚中之道，把自己的事情办好。故云有喜。","Y3.N":"九三升虚邑，无凶咎之辞，亦无吉利之辞，总的说来有好的一面，也有不够好的一面。什么是升虚邑？阳为实，阴为虚，当升的时候，九三以阳刚之才进临于坤，如入无人之邑。说如入无人之邑，不过是比喻，比喻九三勇于前进，无所畏忌。在升的时候，如此上进，是不至于有凶咎的。然而九三以刚居刚，过于刚，毕竟不适合升卦重柔的要求。九二、六五居中，它不居中；初六、六四柔顺，它不柔顺。所以诸爻言吉言无咎，而九三独无。","Y3.XN":"九三过刚，勇于前进，如入无人之邑，果敢而无所犹疑。吉凶如何不可定，结果将取决于九三自身的主观努力。","Y4.N":"亨宜读享。《周易》言“王用享”者共三处，随卦上六“王用亨于西山”，益卦六二“王用享于帝”，本爻“王用亨于岐山”，句式大体相同，都是说王用如此爻之人，以亨于上帝山川，不是说王就是此爻。一般说，王是指五。升卦此爻之王亦当指五。六四上承六五，是近君之臣，处境其实不好。好在六四以阴居阴，是柔顺之才，上顺君之升，下顺民之进，而自己则止于其所，很有点像“三分天下有其二，以服事殷”的周文王。周文王居诸侯之位而继续求升的心计和办法，是不一般的，极有典型意义。六四再要上升，便是要取六五之王位而代之了，那就要像周文王那样做。然而做起来实难，所以只有做到“王用亨于岐山”方可得吉，得吉方可无咎。那么，“王用亨于岐山”是什么意思？王指六五，六五用六四祭岐山，说明六四表现十分驯顺，十分诚敬，也十分纯洁，以至于六五对它信赖无疑，竟用以祭亨山川。","Y4.XN":"谁顺事？六四。顺事谁？六五。怎样顺事？“王用亨于岐山”，即“三分天下有其二，以服事殷”。","Y5.N":"升阶就是已经升到阶之上而至于堂了，升到高处了。升到高处，居于尊位，下有九二刚中之应，可能得吉，但必须贞。贞字在此当固讲。六五乃阴柔之质，它必守贞正，方可得吉。如果不贞正，犹疑多变，对于贤者，今日信之用之，明日不信不用，信而不笃，用而不终，绝不会得吉。","Y5.XN":"自初六始升，至六五升到了极处，故初六小象说“上合志”，六五小象说“大得志”。","Y6.N":"“冥升”与豫卦上六“冥豫”，意思相同。豫乐到了极点，以至于昏冥，故云“冥豫”，升进到了极点，以至于昏冥，故云“冥升”。“冥豫”和“冥升”都不是好的意思。“冥豫”、“冥升”与晋卦上九“晋其角”的意义亦同，都是知进不知退，能进不能退。晋上九是阳爻，故称“角”，豫、升上六是阴爻，故称“冥”，这是它们的不同之处。\n“利于不息之贞”，是说上六还有好的一面，它能够自省自治，不以盛满自居，所以虽“冥升”却无凶咎。","Y6.XN":"“消不富”，消而使不富的意思。“冥升在上”，势位满盛，应自我消损，尽力使之不富，不满盛。","Z":"《易》中升卦与晋卦、渐卦意义略同，都是进的意思，而进的程度有所不同。晋卦是明出地上，有如太阳升起，明盛向上，是最好的进。升如木由始生而终成大树的过程，依时而长，并无阻碍，义虽不如晋优，但也算挺好。渐是木既生之后渐渐高大，有一个需待的问题，义不如升好，更不如晋好。\n升有地中升木之象，所以所谓升实际上是柔之升，不是刚之升。柔之升，特点是以时升。以时升则必从容渐进，顺势而行，故卦辞曰元吉。而六爻爻辞亦尽善，并无凶咎悔吝之语。这在64卦中是不多见的。六五贞固坚定，初六与之合志，九二有喜，九三无疑，六四顺事，上六居卦之终，虽冥升，却也有消不富的自知之明。整个说来，升卦表现出一种上下和谐的势态，就政治上说，好像人们同朝共事，同心一德，已上者不抑下，未上者不袭上，绝无尔猜我疑之事。"},"47":{"P":"《序卦传》说：“升而不已必困，故受之以困。”升是自下往上升。自下往上升须用力气，如果上进不已，必力竭气乏而困，所以升卦之后次以困卦。困是疲惫困乏的意思。为什么坎下兑上这一卦名为困？因为，若水在泽上则泽中有水，今水在泽下，是泽中干涸无水之象。泽中应有水而无水，正是困乏的表现。又，兑阴在坎阳之上，上六阴爻在九四、九五二阳之上，九二陷在初六、六三二阴之中，都是阳刚为阴柔所揜蔽，在人事则是君子为小人所揜蔽，君子处于受困之时。","G.N":"困，穷厄委顿，道穷力竭，本是亨的反义，而卦辞竟以亨释困，不是说凡是在困的时候都能亨。困而亨是有条件的。困穷的处境可以激励人的心志，磨炼人的毅力，促使人出困求通。困能够逼迫人把困转变为亨通。不过，“贞大人吉，无咎，”只有守正道的大人君子才能变困为亨，才能得吉而无咎，寻常百姓是办不到的。“有言不信”，在困的时候，说话没有人相信。自己申辩，往往结果更坏。","T.N":"“困，刚揜也”。此解释卦名为什么叫困。答曰：“刚揜也”。从卦画的角度看，困就是刚揜。刚揜，兑为阴在上，坎为阳在下；上六在二阳爻之上，九二陷在二阴爻之中。总之，刚为柔所揜蔽，阳刚君子为阴柔小人所揜蔽。\n“险以说，困而不失其所亨，其唯君子乎”，自此以下以卦德解释卦辞。这几句解释卦辞中那个亨字。困与亨意义相反，卦辞却说“困亨”，“困亨”即《彖传》说的“困而不失其所亨”，既处困境，又能亨通。困卦为什么能够如此？因为它由下坎上兑组成，坎之德险，兑之德说，为卦“险以说”，由于处险，而能致说，开始困而后得亨。是不是无论什么人都能够因困而亨，始困终亨呢？不是。君子处困之时，能亨；小人处困之时，不能亨。君子能“险以说”，小人不能“险以说”。孔子所说“君子固穷，小人穷斯滥矣”，正是这个意思。\n“贞大人吉，以刚中也”。刚中，指卦中九二与九五而言。九二与九五都是刚爻而且居中，故曰“刚中”。《易》极重视刚中，刚代表君子，中表示君子处困境尤善守正道。因为卦中有“刚中”，所以卦辞才说“贞大人吉无咎”。“有言不信，尚口乃穷也”，人处在困的时候，任凭你怎样会说，人家也不会相信你。摆脱困境的最好办法是靠行动而不是靠口说。你若一定靠口说，即“尚口”，那就要“穷”，犹如走入死胡同，不能亨通。","X.N":"《彖传》用“刚揜”解释卦名困，而大象则把困解释为“泽无水”。说明大象看问题的角度与《彖传》不同。不仅困卦如此，全《易》64卦都是这样。大象的思想与卦辞、《彖传》从根本上说当然是一样的，而谈问题的焦点却又有很大的差异。可以认为全部64卦大象有自己的独特的体系。大象说困就是泽无水，那么人处在泽无水般困境的时候，应当怎么办呢？大象回答说：“君子以致命遂志”。豁出性命，实现夙愿。当生命与信仰不能兼得的时候，要杀身成仁，舍生取义，不可苟且偷生。三军可夺帅，匹夫不可夺志，可做“致命遂志”的注脚。","Y1.N":"初六的处境很不利，它几乎没有摆脱困境的希望。人走路用脚趾，坐下来用臀。走则趾在最下，坐则臀在最下。株木是没有枝叶的树。幽谷，深谷，低洼的河谷。觌，见。初六以阴柔之质处在最卑下的地位，又居坎险之下，自己无力走出困境，需要有九四来援助它，庇护它。可是九四以阳居阴，不中不正，自己还受到阴的揜蔽，哪有可能支援初六以济困！因此，初六的处境极端艰难，很像坐困于无枝无叶的株木之下，毫无庇护，而且已经进入幽谷，以至于“三岁不觌”，长时间看不见“其所亨”。就人说，一个人在卑暗穷陋之中，陷而不能拔，坐而不能迁，一困到底。","Y1.XN":"初六陷于深困而不能拔，是由于它自己昏暗不明造成的。","Y2.N":"困有身之困有道之困，小人之困是身之困，君子之困是道之困。小人的困是吃饭穿衣亦即维持生存的问题。初六的困就是小人之困。君子的困表现在道不能通，志不能行上。在困卦中三个阳爻代表君子，它们的困是君子之困。九二是阳爻，九二之困是君子之困，亦即道困，与初六小人困于株木不同。\n酒食，好饭好菜。有好饭好菜吃，表明生活水平很高。绂是蔽膝，用在膝前的东西。朱绂是蔽膝中高贵的一种。是诸侯或天子三公才能使用的。“朱绂方来”，表明九二是个地位极高的大官。有酒饭吃，有朱绂用，这在小人应该是够亨通的了，而在君子却适成为困。“困于酒食，朱绂方来”，意谓一个大官陷入困境。这种困是道困。比如他的政治主张得不到天子诸侯的理解和支持，或者遭到政敌的阻碍和反对等等。处于这种困境的九二该怎么办呢？办法不外乎两方面，一是“利用享祀”，利于用享祀。祭祀上帝鬼神，求得神明的理解和保佑。古代的统治阶级自己并不真信鬼神，他们祭祀上帝鬼神，不过是寻求精神寄托以达到心理平衡罢了。二是征凶，行动就要凶；反过来说，不要行动，即可无咎。","Y2.XN":"同样是困，困于酒食毕竟生活不成问题，比困于株木要好。这是因为九二居中，有中德。因居中有中德所以有庆。","Y3.N":"石指九四，蒺藜指九二。九四阳爻像个坚硬的石头阻挡着六三，使之不得前进。九二像带刺的蒺藜一样使之坐不下，退不得。由于前有九四后有九二，六三进不得退不得，进退维谷，陷于困境。“入于其宫”的宫是三，“不见其妻”的妻是六。伤于外者必反其家。六三妄行在外而取困，回到家里呆着总可以吧，也不行，回家又见不到妻子。出困出不去，处困处不得，名辱身危，死期将至，凶。困卦三阴爻中，六三的处境最坏，几乎无可挽救。","Y3.XN":"据于蒺藜，谓六三乘九二之刚。在《易》里，乘刚是很严重的事情。“据于蒺藜”，等于坐在刺上，是不能安稳的。小象只言“据于蒺藜”，不言“困于石”，是举重包轻，说了重的，轻的就包括了。不祥，不好的征兆。“入于其宫，不见其妻”，是走上厄运的开始，丧身亡家之不幸将接踵而至。","Y4.N":"九四是阳刚之爻，在这一卦里显然与九二一样，是个有官在身的人，它的困是道困不是身困。“来徐徐”，来得迟疑徐缓。《易》中所谓往，是自下向上去；所谓来，是自上向下来。九四与初六是正应，九四为了摆脱困境，想要取得初六的配合、帮助，但是不可性急，所以初六告诫它说：“姑且徐徐而来！”“困于金车”，金车不是一般老百姓乘坐的，有金车的人必是大人君子，所以“困于金车”不同于困于株木幽谷，是君子之道困，不是小人之身困。九四与九五二阳刚同为上六阴柔所揜，是不大得志的时候，只可沉潜养晦，从容以俟。处此困境虽可吝，但是“有终”，结果还是好的。","Y4.XN":"九四位在上，而其心志则与初六相应，它不是孤立无援的。九四以阳居阴，是不当位。不当位不好，但是九四“有与”，“有与”弥补了“不当位”的弱点。“有与”是有朋友，有同道者。“有与”指谁呢？指九五，九五与九四近比，二者处境相同，利害一致。九四因为有九五之与，所以才“有终”。","Y5.N":"理解这一爻，劓刖两个字很重要。古人对这两个字的解释分歧很大。王弼的本子用的是劓刖这两个字，宋人程颐、朱熹沿袭王弼，也用这两个字，解为截鼻和刖足。这样解释劓刖二字，当然是对的，但是放在整个爻辞里就显得勉强难通。《周易》原文究竟是不是劓刖这两个字呢，应该研究。《经典释文》说荀、王肃本“劓刖”作“臲卼”，云“不安貌”，又引郑玄说“劓刖当为倪仉”。清人惠栋作《周易述》，将劓刖改作臲卼，释作不安貌。这是根据字音确定的。劓、臲可能同音，刖、卼可能同音，《庄子·德充符》说：“鲁有兀者王骀。”称刖足者为兀。可见困卦九五劓刖应该是臲卼。二字写法又有不同。《尚书·秦誓》说“邦之杌陧”，“杌陧”即“臲卼”。宋人不重视文字，沿袭王弼的错误，把劓刖二字释作截鼻刖足。清人重汉学，讲究文字考据，因此惠栋把这两个字弄明白了，是可取的。“乃徐有说”的说字，历来有悦、说、脱几种读法。这里应当读如脱。赤绂与九二的朱绂是同一种东西，是蔽膝，赤绂比朱绂的等次要低。“利用祭祀”与九二的“利用祭祀”义同。\n这样一来，九五爻辞的含义就比较清楚了，大体与九二相似。九五虽阳刚居君位，但在困卦里不取它的君象，把它作为一般的爻对待，取象同于九二，与九二不同之处是它位高而益困。九五与作为居高位着赤绂的大人君子，在政治上陷于困境，到处得不到理解和支持，形势极为严峻，终日处在臲卼不安的状态。它别无他途，只有“乃徐有说”，在沉稳坚定，从容不迫的奋争中寻求解脱。至于精神方面，既受困于人，就当求感于神，“利用祭祀”，在与鬼神的感通中寻求精神支柱。","Y5.XN":"开始之时为小人所揜，上下无与，臲卼（杌陧）不安，正是不得志的时候，以后“乃徐有说”，慢慢地得以济困。九五之所以能够济困，因为它中直，中直即中正，居中得正的意思。中正而云中直，是为了与下面的福字叶韵。“利用祭祀，受福也”，君子为人所困，乃寻求神明的感知，从中获得精神力量，获得好处。","Y6.N":"全卦六爻中九二、九四、九五都不言吉，初六、六三以阴柔而不免于困，唯上六得吉，这是什么缘故？从客观的形势上说，上六困于葛藟的缠束之中，处在臲卼（杌陧）危动的高险之地，已不是初六困于株木，入于幽谷，三岁不觌的那种安然不动的境况了。上六受困已至极点，物极必反，困极就要通了。从上六主观的努力看，它应该因势而行，争取出困。“动悔有悔”，前一个悔字指事言，意谓上六当困极之时，动辄有悔，时时处处事事受困。后一个悔字指心言，是说上六能够自觉地认识到自己的艰难处境，动辄有悔，而不动更有悔。越知有悔越能悔，能悔则往而出于困，故爻辞断之以“征吉”。","Y6.XN":"上六困于葛藟缠束之中而不能变，是因为它暂时还没掌握困极以出困的道理，因此处之未当。但这只是暂时的，一旦它“动悔有悔”，采取主动行动，必出困而获吉。为什么能出于困而获吉？关键在于行动。若如初六那样坐困，怎能出困获吉！","Z":"困的基本含义是刚揜，即阳刚受阴柔之揜。困卦讲的困有两类：寻常百姓的困，表现在生存问题上，是为身之困。大人君子的困，表现在政治斗争上，是为道之困。困已经存在，已经成为现实，因此困卦的着眼点是怎样处困出困的问题。困卦站在阳刚亦即大人君子的立场上讲话，卦辞明确说：“困，亨。贞大人吉，无咎。”困而能亨，但必须是大人君子。在被统治阶级小人则不可能得吉而无咎。在九二、九四与九五三个阳爻里就如何摆脱困境的问题上，有两点是值得玩味的。“来徐徐”，“乃徐有说”，强调阳刚受困时一定不能急躁，要从容不迫，徐图出困之计。这是一。二是强调“利用享祀”，“利用祭祀”。表面上看这好像是鼓吹迷信，其实是提出了一个受困者需要精神支柱的重要问题。受困者在人间得不到理解，自然求诸鬼神，求诸鬼神，与其说是对鬼神的信仰，还不如说借以表达自己坦诚的心迹，寻求精神寄托和自我安慰。另外还有一点值得注意，困卦卦辞讲“有言不信”，告诫人们处困出困勿靠口说，要重视行动。行动与否则须因时而定。时不宜动不可躁动，九二“征凶”即是。时当动不可不动，上六“征吉”即是。\n困卦初六、六三、上六都不是善于处困境的人，初六最下，坐而困，没有出困的可能，也没有出困的愿望。六三处境最坏，进退维谷，处出皆凶，一派困死之象。唯上六可获吉，亦因困极必变，形势有利。这是因为这三爻全是阴柔，阴柔在困卦中代表平民百姓，而平民百姓属于“穷斯滥矣”的一类，他们做不到《彖传》所谓“困而不失其所亨”。困卦扬大人君子抑平民百姓的思想倾向，表明《易》作者的阶级观念是鲜明的。"},"48":{"P":"《序卦传》说：“困乎上者必反下，故受之以井。”这话是承上卦困“升而不已必困”讲下来的。事物不能永远上升。上升不已就是困，困的结果必然反于下。古人认为世间之物以井为最处下，所以井卦次之于困卦之后。《序卦传》这种说法是有些牵强的。可见《序卦传》对64卦的排列次序的理解，在总体思想上是正确的，但不是每一卦都讲得贴切。井卦巽下坎上。坎为水，巽为木且有入义。巽木下入而坎水上升，恰有井之象。","G.N":"“改邑不改井”，人们居住的邑落一般说不易变动，但有时候也不免要变动，而井一旦打成便绝对不能变动了。邑落变了，人们迁徙了，井还是依旧在那里。“无丧无得”，井水是恒久稳定的，你汲它，它也不见少；你不汲它，它也不见多。“往来”，来来往往的人们。“井井”，前井字是动词，后井字是名词。“往来井井”，来来往往的人们都使用这个井。井是大家共用的。这三句话是讲井的特点的。“改邑不改井”、“无丧无得”两句讲井的恒久性，“往来井井”一句讲井的效用的周遍性。\n“汔至亦未繘井，羸其瓶，凶”。汔，几。繘，绠，即汲水用的绳子。羸，败，坏。瓶，汲水用的陶罐。用绳子拴着陶罐汲水，水到几乎要汲上来但还未汲上来的时候，陶罐坏了，水没有汲上来。事情做到接近成功的时候却没有成功，这不是凶吗！","T.N":"“巽乎水而上水，井”。巽，入。入乎水而上水，有井之象，故卦名曰井。\n“井养而不穷也”，井之出水，义在养人。井水无得无丧，往来皆所取给，其养人是没有穷尽的。\n“改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也”。这几句话是对卦辞的解释。卦辞“无丧无得，往来井井”两句意与“改邑不改井”句同，故不复出。《彖传》只讲“改邑不改井”一句，实际上另两句也包含在内了。“改邑不改井”以下三句卦辞都是讲井有恒久的性质的。井之所以有恒久的性质，是有根据的。根据就在于井卦二、五两爻皆以刚阳居中，有刚中之德。因为有刚中之德，所以能够恒久。井的功用是出水。虽汲水将成，但毕竟未成而中途失败，水终于未汲上来，这与根本没把绳子下到井里，结果是一样的，都是无功。井未起井的作用。为什么中途失败，未获成功，即为什么凶呢？因为汲水用的陶罐坏了。","X.N":"井卦巽下坎上，木在下而水在上，有如水本在井底，却能汲上来供人饮用，有井水上行之象。君子观察井卦之象，根据井水上行养人的道理，实行劳民劝相的政治。劳民，养民。劝相，劝诱百姓相助相养。","Y1.N":"初六以阴柔居下，上无应援，无上水之象。井是供人汲水饮用的，而今为什么无上水了呢？因为人不来食用它的水了。人为什么不来食用它的水了呢？因为井底有泥秽沉滞，久不渫治，井水污浊不可食。井泥不食，久而久之便成了无水的旧废之井了。旧废之井，人既不来汲水，水不复上，则鸟兽也不来光顾了。","Y1.XN":"初六有井泥之象，人不来食它，它成了无用之物，原因就在于它最在井底，处井卦之下。人所不食，鸟兽也不光顾，成了旧废之井。爻辞讲“旧井无禽”是什么意思呢？是说初六一时为人禽所共弃舍。","Y2.N":"井的功用是水上出而养人，有水上出好，无水上出或有水不能上出不好。井卦因此也是向上好，在下不好。九二是阳刚之才，这一点是好的。但是九二居下卦而且上无应爻而比于初六，这一点极不好，使它在下而不能向上。爻辞用“井谷射鲋，瓮敝漏”两句话说明它在下而不能向上的不利处境。井谷是井底出水的穴窍。井底有出水的穴窍，能出水，说明不是泥井。不过水不多，其功仅仅够射鲋的。射，注。鲋，或以为鲫鱼，或以为蛤蟆。鲫也罢，蛤蟆也罢，都是井底之阴物。“井谷射鲋”，是说自井的角度看，九二像井谷之泉，下注于鲋而已，不能上出。若就人在井上汲水而言，则九二好像“瓮敝漏”，有人用瓮来汲水，似乎水可以上出了，然而无奈瓮是坏的，漏水的，水还是汲不上去。就是说，井中之水无论如何也上不去，井发挥不了井的作用。九二是阳刚之才，本可以养人济物，然而不能养人济物，关键的问题是它上无应援。","Y2.XN":"无与，无应援。九二是阳爻，九五也是阳爻，故九二无应援。井以上出为功，九二是阳刚之才，本可济用，但由于它居下卦而上无应援，只能落个“井谷射鲋，瓮敝漏”的境地。假若它有应援即有与的话，那就会汲引而上成井之功了。","Y3.N":"渫，治。“井渫不食”，井已经渫治，脏物清除掉了，水清洁可食了，但是还是无人用它食它。“为我心恻”，人们在心里怜恻它。以下是怜恻的内容。这井里的水是清洁可汲可食的。如果王若明的话，定会起用九三这个贤才，那将对大家都有好处。九三以阳居阳得正又志应于上六，是有用之才。可是它居井下之上，有才而未得其用，犹如井水清洁可食而无人食。","Y3.XN":"小象的意思是说，井水干净而不汲用，多可惜！行恻，行道之人皆以为恻，非指九三自以为恻。行道之人都“求王明”，任用九三这个贤才，使我们大家都受福，都得到好处。","Y4.N":"甃，砌累，修治。井甃，井修治了。六四之爻象有两个特点，一是以阴居阴，处得其正，二是阴柔才弱。这两个特点决定它但能修治自守而无济物之功。就井来看，恰像坏了的井经过修治，不至于废弃，虽无大功，亦可免咎。","Y4.XN":"小象指出井甃无咎的实质是修井。井经过修治，虽不能起多大的作用，但毕竟可用，不至于废弃。不至于废弃，仅能免咎而已。","Y5.N":"洌，甘洁。井泉以寒为美，甘洁之寒泉，出来的水清凉甜美，可为人食，人们也喜欢食。井达到这个程度，可谓尽善尽美了。九五以阳刚中正居尊位，其才其德，完备无缺，正当井洌寒泉之象。九五与九三都是洁泉，为什么九五言食而九三言不食？因为九三居井甃之下，乃未汲之泉，所以说“不食”。九五是已汲之泉，所以说“食”。又，“井洌寒泉”既是井之尽善尽美者，何以不言吉？因为井以上出为成功，而九五毕竟未至于上，“井洌寒泉”可食而未及于食，故不言吉。","Y5.XN":"“寒泉之食”乃“井洌寒泉食”的省语。九五有“井洌寒泉食”之象，完全由于它阳刚居中得正，德与位皆善。就井泉而言，中正则泉源常裕而寒，无物可污。就人事言，刚阳中正，必为有利于众人。","Y6.N":"收是汲水，幕是井盖。从井中汲水，水汲上来之后，不要把井口封闭盖死，好让别的人随便来汲水。井是公共的，大家都可使用。卦辞所谓“往来井井”就是这个意思。有孚即有信，在此有信亦即谓井水源出不穷，久汲不见少，不汲不见多，正是卦辞说的“无丧无得”。元吉，大善之吉，再好不过了。井以上出为用，越往上越好。上六居井卦之最上，水已汲上来了，大功告成了，所以言元吉。64卦大多数至卦终时为极为变，情况不怎么好，唯独井卦与鼎卦，至上爻而有功成业就的意义，称元吉、大吉。","Y6.XN":"别的卦，元吉不在上爻。上爻不得元吉。井卦上爻却得元吉，元吉竟在上爻，这是因为井道以上出为用，至上爻，井道大功告成的缘故。","Z":"井卦六爻三阳三阴，三阳象井泉，三阴象井。九二“井谷射鲋”，九三“井渫不食”，九五“井洌寒泉”，讲射讲渫讲洌，恰是泉之象。初六“井泥不食”，六四“井甃无咎”，上六“井收勿幕”，讲泥讲甃讲收，正是井之象。如果依次排列，又各泉有各泉的特点，各井有各井的特点。初六“井泥不食”，似方掘之井；六四“甃无咎”，似已修之井；上六“井收勿幕”，似已汲之井。九二“井谷射鲋”，似始达之泉；九三“井渫不食”，似已洁之泉；九五“井洌寒泉食”，似可食之泉。若以两爻为一例，则初六、九二都在井之下，为泥为谷，全是不见于用的废井。九三、六四都在井之中，为渫为甃，都是将见于用的井，井之道至此已经完备。九五、上六皆在井之上，为洌为收，是已见于用的井，井的功用已发挥了出来，井道至此大功告成。\n64卦里有些卦爻辞与卦辞并不贴切，而有些卦的爻辞与卦辞则相关甚密。井卦上六爻辞言“井收勿幕”，意义与卦辞“改邑不改井，无丧无得，往来井井”完全吻合，井卦显然属于后一种类型。"},"49":{"P":"《序卦传》说：“井道不可不革，故受之以革。”井这种东西有个特点，它一经掘成便常久存在，所谓“改邑不改井”是也。唯其常久存在，必然需要清理、修治，亦即需要革。所以井卦之后次之以革卦。这个革字，用现代的眼光看，就是改革、革命。这一卦对我们将有很大启发。革之为卦离下兑上，泽中有火，火水是两个相灭相息之物，现在处在一起，水灭火，火涸水，有相变革之象，故卦名曰革。革卦是水在上而火在下，水之性向下，火之性向上。在上者性向下，在下者性向上，二者相就相剋相变革。假设性向上的火在上而性向下的水在下，二者相违行，那么就不是革而是睽了。","G.N":"已字应读作已(yǐ)，不应读作巳(sì)。孚，信。革，变革旧的事物。变革旧的事物不是轻而易举的事情。人们对旧的事物早已习惯了，适应了，你一下子要变革人们早已习惯，早已适应的东西，人们是绝对不会马上理解、接受的。变革要取得人们的理解和信服，需要一定的时间。“已日乃孚”即是这个意思。\n元亨，大亨，大通。事物旧了，坏了，亦即穷了，才要变革。变革的目的是旧变新，穷变通，所以革之而可以元亨。贞，正。利贞，利于正道。变革旧事物是极难的事情，必须遵循正道去做，倘若任意胡来，则一定失败。能够坚持正道去进行变革，纵使时间久，险阻多，最终也将成功，成功则悔亡。","T.N":"“革，水火相息，二女同居其志不相得，曰革”。一般说来，《彖传》包括释卦名、释卦辞和孔子自述体会三部分。这句话照例是解释卦名的。革卦离下兑上，由泽与火组成。泽为水，水在火上，火在水下，水火相息相灭而不相容，有革的意思。但是离下坎上也是水在火上，何以不相息，不曰革？这是因为坎之水是动水，火不能息之；泽之水是止水，止水在上而火炎上，能息之。泽火曰革，还有另一层含义。革卦下体是离，离是中女。上体是兑，兑为少女。中女与少女在一起，有二女同居其志不相得之象。不相得即相克相息，这也是卦名曰革的一个根据。\n“已日乃孚，革而信之”，这句话以下至“其悔乃亡”，是解释卦辞的。“已日乃孚”的已字应当怎样读怎样讲？这个问题古人的看法从来不一样。有人读作已经的已(yǐ)，有人读作戊己庚辛的己(jǐ)，还有人读作辰巳午未的巳(sì)。读已经的已(yǐ)是对的。“已日”就是“浃日”，“浃日”就是十日。古人用天干地支纪日，天干共十个，叫做日；地支共十二个，叫做辰。天干循环一周共十日，叫“浃日”，地支循环一周共十二辰，叫“浃辰”。“浃日”、“浃辰”都是一周的意思。这里的“已日”也是过了一周即十日的意思。但是这里用“已日”，只是个象征性的说法，不是说仅仅十天，是说一个周期，一个历史阶段。“已日乃孚”，革命或者改革要得到人们的理解和拥护，需要经过一段时间，甚至需要经过整整一段历史时期，绝对不可以把革命或改革看作一朝一夕即可告成的事情。\n“文明以说，大亨以正”。离为文明，兑为说。文中两个以字各有侧重。上句重在文明，是说在革的过程中能够做到文明，则事理周尽，以此而顺人心。“文明以说”，文明是根本的。下句重在正，革以正行之，则无不亨通。“大亨以正”，正是根本的。《彖传》凡用以字连接的两个词语，无论正倒，皆可互用。例如“顺以动”，反过来说“动而以顺行”，意义是一样的。两个词语中必有一个是重点，孰为重点，当视前后文义而定。\n“革而当，其悔乃亡”。这句话是解释卦辞“悔亡”的。“悔亡”本身无须解释，要解释的是革卦为什么“悔亡”。卦辞讲“元亨利贞悔亡”，利贞而元亨，利贞而悔亡。利贞是元亨的根据，也是悔亡的根据。“利贞”如何是“元亨”的根据，上文“大亨以正”一句已经解释过了。现在要说明“利贞”是“悔亡”的根据，为不使用词重复，乃云“革而当，其悔乃亡”。其实当即正，正即贞。“革而当，其悔乃亡”，与说“利贞，其悔乃亡”意思相同。革是艰难的，极易有悔；革必至当，方可无悔。\n“天地革而四时成。汤武革命，顺乎天而应乎人。革之时大矣哉”。这几句话是孔子对革的意义的体会和发挥。孔子用一个在当时看来最典型、最有代表性的事例即“汤武革命”来说明人世间的革，是顺乎天而应乎人，亦即适应客观的规律而进行的，并非任凭人的主观意志随便而为。革有个时间的问题，不到革的时候不能革，到了革的时候不能不革。孔子对革的这一段体会，有两点是重要的。第一，孔子讲到天的时候所指的确是自然界和自然规律而不是上帝和鬼神。即说天地革而形成春夏秋冬四时交替变化，便排除了上帝的任何意义。这证明孔子不是有神论者。第二，孔子第一次提出了革命的概念。指出成汤放桀、武王伐纣是顺天应人即合乎规律，合乎时宜的革命行为。孔子研究革卦能够想到革命的问题，赞美革命的行为，看到社会历史发展到一定的时候要发生变革，发生革命，实在是很伟大的。","X.N":"泽中有火，水火相息，是为革，革即变。古人首先看到的最大、最显著、最易理解的变化是春夏秋冬四时的交替。因此孔子认为君子观察四时变革，应当从中悟出个治历明时的道理，做好历法的工作。治历明时，不是说历法应当改革。","Y1.N":"革是大事，不可轻易为之。革要得其时，在其位，有其才，审虑慎动，而后可以成功，可以无悔。初九不具备革的条件。论时，初九居初，不是当革的时候；论位，初九在下，不是可革的地位；论才，初九阳刚且处离体，有躁动的特点，没有适应革的才能。总之，初九处革的时代却不可革。它应该以中顺之道巩固自守，不可轻举妄动。巩，包束。黄，中色。牛，顺物。革，皮。“巩用黄牛之革”，初九应当以中顺之道，用坚韧的牛皮将自己包束起来，不使妄动。《易》中言“黄牛之革”者，除本爻外还有遯卦六二。遯卦六二居中有应，欲遯而不可遯；革卦初九在下无应，当革而不可革。两爻旨意不同，而所用“黄牛之革”一语的意义却是一致的。","Y1.XN":"“巩用黄牛”系“巩用黄牛之革”的省语。爻辞讲“巩用黄牛之革”，以中顺之道，用坚韧的牛皮将自己包束起来，巩固起来，不使轻举妄动。小象说这实质上是说初九当革之初始，不当有所作为，即不当革。","Y2.N":"已读作已经的已(yǐ)。“已日”与卦辞讲的“已日”是一样的。都是指一个过程，一个历史阶段而言。不过卦辞讲“已日乃孚”，此爻辞讲“已日乃革之”，两句话中“已日”的具体含义有所不同。卦辞讲的“已日”系指革之前的一段时间，“已日乃孚”是说革之后需要有一段时间才能取得人们的理解和信任。此爻辞讲的“已日”系指革之前的一段时间，“已日乃革之”是说革之前要有一个过程，使革的形势达到成熟，不革人们便不能照旧生活下去的程度，这时才能采取革的行动。六二柔顺而中正，又为文明之主，有应于上，革的条件具备了，可以革了。如果它能够做到“已日乃革之”，不失时机地实行变革、革命，那么一定“征吉，无咎”，取得胜利。","Y2.XN":"经过“已日”即一段时间的发展，证明旧的东西非革不可，那就应当果断地采取革的行动。爻辞说“征吉无咎”，小象进一步称作“行有嘉”，指出“已日革之”必有嘉美之功。","Y3.N":"九三自身的条件与六二不同。六二以阴居阴，居中得正；九三以阳居阳，过刚而且不中，乃躁动之才。如果九三以过刚不中之才躁动以往，结果必凶。那么，九三贞固自守可以吗？也不可以。九三处在当革的时候，贞固自守不采取行动，也是危厉的。采取行动则凶，贞固自守则厉，那么应当怎么办？唯一的办法是“革言三就，有孚”，亦即革，但必须十分小心审慎，得到人们的理解和信任之后方可行动。“革言”，关于革的言论。三，多。就，成，合。“三就”，对革的言论，须经过多次反复的研究，审慎周密的考虑，证明确实合理可行，没有问题，并且“有孚”，得到人们的信任，这时就可以革了。","Y3.XN":"革言已经三就，事已做到至审至当，还往哪里去呢？哪里也不要去，走革的路是对的。","Y4.N":"下三爻处在当革未革，欲革难革之时，必当小心审慎从事，力求革命稳步发动，一举成功，故三爻辞皆明著革字。明著革字，表明革命能否成功还是问题。至于上体九四，革道已成，不再明著革字，而唯言“悔亡，有孚改命，吉”。这时，革命成功了，“悔亡”了，“有孚”了，人们理解了，满意了。“改命”实际上就是革命。《左传》宣公三年王孙满答楚庄王问鼎说：“周德虽衰，天命未改。”旧朝代还在，就叫天命未改；新朝代已立，就叫天命已改。所以，“改命”其实就是改朝换代。天命不是上帝旨意，天命是孟子说的“莫之为而为”，“莫之致而至”的自然规律。天命改与不改，什么时候改，不依人的主观愿望而转移，是有像自然规律一样的客观规律决定着的。王孙满答楚庄王说“天命未改”，意思就是正告他，周朝尚未到垮台的时候，你想夺权夺不了。\n在古代，周代殷是人们最熟悉因而最典型的改命。周代殷包含两部分内容，一是武王伐纣灭殷，建立周政权，取得天下。二是周朝建立之后，周公制定新的典章制度，取代殷朝的典章制度。旧政权换新政权，旧制度换新制度，旧朝换新朝，就是改命。改命即《彖传》讲的“汤武革命”的革命，从爻象解释九四爻辞，九四以阳居阴，合当有悔。可是九四阳刚，有革之才；卦已过中，当水火之际，处革之时，刚柔相济，不偏不过，有革之用。九四既具备这些优越条件，革之必当，有悔也将无悔，故曰“悔亡”。","Y4.XN":"信志即有孚之谓。小象曰“信志也”，意谓革的根本问题是有孚，上上下下都心向往之，则可以改命而得吉。","Y5.N":"九五阳刚居中得正在尊位，是大人。大人是变革的主体，以大人之道进行变革、革命，肯定是顺乎天应乎人，至当至美的。以大人之道进行变革、革命，有一个更重要的特点，即大人之变是“虎变”。大人之变，文明可见，事理炳著，没有阴谋可疑之事，天下人看得清清楚楚，知道大人之变顺天应人，大公至正，无须占卜就完全信任了。大人之变为什么称“虎变”？因为虎(还有龙)有大人之象，也因为大人之变，事理明著，犹如虎身之文炳然易见。","Y5.XN":"大人进行的革命已经成功，这时候发号施令，简而明了，正像虎之斑文，大而疏朗。","Y6.N":"上六不同于九五。九五言大人言虎变，上六言君子言豹变，九五是革命创制之时，上六是革命成功之后继世守成之时。以周朝建国为例，大人虎变是文王武王革命创制，事理明著，犹如虎变之文采彪炳。君子豹变，是成王康王继体守成，润色鸿业，犹如豹变之文理细密。君子既是统治阶级人物，那么小人便是被统治的庶人百姓了。庶人百姓处在治于人的地位，不掌握文化，对于革命由于缺乏认识、理解，往往是“革面”不革心。“革面”，表面上赞成革命，而内心则未必有认识，更谈不上心悦诚服。\n“征凶，居贞吉”。至上六之时，革道已成，最宜安静守正，若居而守正则吉。天下之事，未革的时候，主要的问题是革。条件一旦成熟，则“征吉”，采取行动是吉的。革道已成之后，主要的问题不是革而是守了，这时候最重要的事情是“居贞”守成。九三与上六皆曰“征凶”，而九三“贞厉”，贞有危厉；上六“贞吉”，贞而得吉，这是因为什么？因为二爻所处之时不同。九三是革命之前，上六是革命成功之后。九三处革命之前，“征凶”是戒其条件不备不可妄动，“贞厉”是戒其既处当革之时，不可不动。上六处革命已经成功之后，“征凶”是戒其不可复革；继续革命，不断革命，势必致凶。“居贞吉”是说革命已成功，重要的是如何安静守成，故居贞则吉。","Y6.XN":"原书此处无小象，故亦无小象讲解。可参九五「大人虎变，其文炳也」之释：九五当革命创制之时，文采昭著；上六当革命成功之后，但润色鸿业，故取象于豹之文理细密。","Z":"总的说来，革卦讲的就是革命的问题。卦辞“革，已日乃孚，元亨，利贞，悔亡”，指出革命的胜利前途及其必备的条件。“元亨”，“悔亡”，革命一定取得成功。革命成功应有三个条件，一是“乃孚”，革命之后要努力取得人们的信任；二是“已日”，革命后要有一段相当长的时间才能做到“乃孚”，急躁是不行的；三是“利贞”，革命不可失于正道，革命不失正道，方可“乃孚”、“悔亡”。这些观点都是很重要的。六爻的爻辞，思想与卦辞一致，不过所讲的问题比卦辞更深入。下体三爻讲革命之前的问题。初九“巩用黄牛之革”，革命的时机尚不成熟，条件还不具备，不可轻举妄动。六二“已日乃革”，条件已具备，可以革了，但不可遽革。九三“革言三就”，革命要审慎小心，考虑周到。上体三爻讲革命之后的问题。九四“有孚改命”，革道已成。九五“大人虎变”，革命创业之时，所为著明，天下晓然。\n上六“君子豹变”，此继体守成之时，所为安静守正，深邃遒密。经过“虎变”又“豹变”，结果天下大变，革道大成。\n孔子的《彖传》对革卦的思想作了深刻的理论阐释。孔子说的“天地革而四时成，汤武革命，顺乎天而应乎人，革之时大矣哉”这段话有极深刻的哲学意义，既是对革卦含义的开掘，也是自我思想的发挥。他把天地四时的变化变革看成是没有任何主宰的自然运动，而人类社会的发展与自然界的运动在具有客观性这一点上，是一致的。这里，孔子没有给上帝留下一点余地。指出“汤武革命”这一新鲜概念并且指出革命的合理性，更加证明孔子是一位伟大的智者。\n革卦关于大人、君子是发动革命的主体，小人只能“革面”，顺从大人、君子革命的观点，看上去似乎有问题，其实是完全正确的。因为历史事实的确如此。古代的革命和改革是在统治阶级内部进行的。奴隶们从未形成为独立的自觉的阶级，不曾用胜利的起义推翻过旧政权、旧制度。他们总是在统治阶级发动的斗争中不是扮演政治上的附庸就是充当军事上的小卒。"},"50":{"P":"《序卦传》说：“革物者莫若鼎，故受之以鼎。”这个说法是有问题的。我们知道，革与鼎两卦意义相对应，革是去故，改变旧的事物；鼎是取新，建设新的事物。《杂卦传》讲“革，去故也；鼎，取新也”，是正确的，可取的。鼎卦之所以名鼎，既取其象也取其义。取其象，从全卦来看，很像一种器。最下一爻是阴爻，象器之足；二、三、四三爻是阳爻，阳为实，中实而容物，象器之腹；上二爻，一象器之耳，一象器之铉。器而有足有腹有耳有铉，正是鼎之象。从上下二体来看，上体中虚，下体有足承之，也是鼎之象。取其义，则巽下离上，木入于火，有燃烧之义，燃烧而假之以器，故有烹饪之义。有烹饪之义，便是鼎。64卦以实物名卦者唯井与鼎而已。","G.N":"吉字是衍文，原文应为“元亨”。卦辞除元亨外别无它辞，唯有鼎与大有两卦。元亨即大通的意思。革卦卦辞也讲元亨，但多有戒辞，就是说，革卦之元亨，是有条件的，不按条件要求去办，不得元亨。鼎卦之元亨没有条件，这是因为鼎取新，是建立一个新社会，所以元亨，大通，而革是革故，是革去一个旧社会，施行起来十分复杂，所以没有“已日乃孚”、“利贞”诸条件不可能得元亨。","T.N":"“鼎，象也。以木巽火，烹饪也”。此两句解释卦名。鼎卦之鼎字取自实物鼎，是根据实物鼎之象而来的。就是说，鼎卦象鼎，有了鼎才有鼎卦；不是鼎象鼎卦，有了鼎卦才有鼎。鼎依其用途可分为两类。一类是重器，用以象征权力，如夏铸九鼎的鼎，不是寻常日用之物，不能用以烹饪。另一类是寻常日用的，用以烹饪之鼎，古人吃牲肉，先用镬将肉煮熟，然后放入鼎里，加进佐料，鼎下烧火，令五味调和。吃时将肉取出置诸俎上。鼎卦所象之鼎即这后一类鼎。鼎卦巽下离上，巽为风，离为火，火风鼎，恰象鼎下升火，用以烹饪肉类。故鼎卦名鼎。\n“圣人亨，以享上帝，而大亨以养圣贤”。解释过卦名之后，接着以享帝养贤两句指明卦义之所在。鼎卦卦义与井卦有相似之义。井卦主养民，鼎卦主享帝养贤，而归根结底是养贤。鼎的功用是烹饪，烹饪的意义在于享神和养人。享神养人之中最大也最重要的是享上帝和养贤。而享上帝与养贤是有区别的。享上帝只用一个享字，而养贤则曰“大亨”。这是因为“享帝贵诚，用犊而已”(朱熹语)。郊天用特牲，只杀一个其角才茧栗般大的小牛犊，用鼎亨(即烹饪之)，然后奉献上帝。仅仅亨一个茧栗小牛，故曰亨不曰大亨。养贤之礼贵丰，燕享宾客用太牢不用特性，即用牛、羊、豕三牲。三牲具有，且牛之角尺，可谓丰厚之极，故曰大亨。\n“巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨”。这是解释卦辞元亨的。鼎卦为什么可致元亨呢？鼎卦下体是巽，巽有顺义。上体是离，离有明义，明而中虚且在上，有目明之象。卦中无耳聪之象，言耳聪者，乃因言目明连类而及。六五是柔爻，柔本应居下，而今进而上行至尊位，居尊处中，下与九二刚阳正应。这样，鼎卦就下体看，巽顺于理，卑巽下贤，就上体看，聪明睿智，柔而应刚，得乎中道，是以可致元亨。","X.N":"鼎有端正安重之象，君子观鼎之象要以之正位凝命。凝命，凝其所受之命。革卦讲改命，鼎卦讲凝命，改命是革掉旧政权，凝命是巩固新政权。凝字意义与荀子《议兵》说的“兼并易能也，唯坚凝之难焉”的凝字义同。","Y1.N":"爻一般一爻取一象，此爻一爻取两象。“鼎颠趾，利出否”是主要一象。“得妾以其子”是对前两句的比拟，可谓象中之象。初六处鼎卦之下，象鼎之趾。鼎之趾在下是正常的，而现在初六上应九四，有颠趾之象。鼎而颠趾，是不正常的，不好的。但是，鼎颠趾，鼎趾在上，鼎口在下，可以“利出否”。否，恶物。鼎中陈积之污秽之物可以一泻而出有利于鼎之去故纳新，泻恶受美。这又是正常的，是好的。“得妾以其子”，是比拟“鼎颠趾，利出否”的。二者说法不一样，但含义相同。妾是贱人，子是贵者。妾有两方面的特点，她是低贱之人，但在一定的情况下她可以为君子生下一个奉祭祀承先祖的儿子。君子不应当进御妾，进御妾是不正常的，不好的。但是进御妾能使妾生下贵子以承君子的宗绪，这又是正常的，好的。此爻辞告诫人们，看问题不仅看它坏的一面，还要看到它的在坏的一面中包含着的好的一面。“鼎颠趾”与“得妾”，不好。不好中却又有好。“鼎颠趾”可使鼎致洁取新，“得妾”可使妾生贵子。所以，看似有咎，实则无咎。","Y1.XN":"“鼎颠趾”，鼎趾在下支持鼎身，是正常的，不悖的。现在鼎趾颠而在上，是不正常的，有悖的。然而实际上“未悖也”，因为鼎可以因此将陈积的否恶污秽之物倾出，有利于致洁纳新，有悖之中包含着未悖。“利出否，以从贵也”句中省了“得妾以其子”。“从贵”是初六应于九四。“以从贵也”是对“利出否”和“得妾以其子”两句的解释。“利出否”，可以取新；取新便是“从贵”。“得妾以其子”，得妾可生子；生子亦即“从贵”。","Y2.N":"九二以阳刚居中，乃鼎中有实之象。仇，配，与“君子好逑”的逑字义同。疾，妒害。初六阴柔而与九二相比，阴阳相比则相从，相从则有阴柔妒害阳刚的可能。自九二的立场说，“我仇有疾”，我的对立面初六乃阴柔小人，它近比于我，势必要妒害我。我应该怎样对待呢？“不我能即”。我要以刚中自守，不恶而严，使之无隙可乘，不能即我。如是则吉。","Y2.XN":"鼎而有实，好像一个人很有才干。“慎所之也”，一个有才干的人应当慎于所行，万不可把方向搞错了。搞错了方向就要犯错误。九二做得很好，它能不暱于初六而上从六五之正应，这正是“慎所之”的表现。尤，过尤，怨尤。九二既能刚中自守，慎其所行，则初六虽有妒害之心，终因九二无隙可乘，无过尤可指，其怨尤之念也就自消自灭了。","Y3.N":"鼎三与井三象虽有异而意大体仿佛。它们都居下体之上而未为时所用。井卦九三以阳刚居得其正，有济用之才，犹如清洁之泉居井之下，未为人们所用。鼎卦九三，以阳刚居巽之上，刚而能巽，有济务之才，亟须五来赏识它，重用它。然而三与五根本不存在应的关系，二者是不易相通的，犹如“鼎耳革，其行塞”。鼎耳指六五，革，变革。鼎要用铉贯耳方可移动，今鼎耳发生变革，不能举移，五的行动受到阻塞，不能通于九三。就九三自身来说，其处境正像“雉膏不食”，鼎中盛着美食佳肴，可为人食，人却不一定来食。然而这仅是一方面，问题还有另一方面，即“方雨，亏悔，终吉”。六五是文明之主，九三上承文明之体，且善于刚正自守，六五终究会来求九三。毕竟六五是阴，九三是阳，阴阳正和而成雨。九三开始虽有不遇之悔，最终却当有相遇之吉。","Y3.XN":"《象传》所云义，一般是道或理的意思。失其义，就是失其道。此云“失其义”，不是说鼎九三之行为失其道，而是说鼎九三之爻象失其道。怎么失其道了呢？《易》卦中诸爻一般讲比应乘承的关系。此爻言“鼎耳革，其行塞”，说的是九三与六五的关系，而九三与六五既非比非乘非承，亦非应，故云“失其义”，“失其义”即失其道。","Y4.N":"此爻之意孔子作《系辞传》已有极明确的说法。《系辞传》说：“德薄而位尊，知小而谋大，力少而任重，鲜不及矣。《易》曰：‘鼎折足，覆公餗，其形渥，凶。’言不胜其任也。”鼎九四为什么会有折足，覆餗，形渥，即不胜其任之象呢？这是因为：第一，鼎卦以九二、九三、九四三阳爻为实，而九四恰是处在鼎实满盈的地位，有倾覆之象；第二，九四以阳刚之才，居上体之下又反应于初六，即承于君又施于下，是它力所不能及的。况且九四应于初六，初六已颠趾，岂有不折足覆餗之理！第三，就人事说，九四是居大臣之位，任天下之事的人，而它不求贤智之士辅助自己，却应于初六，任用不可任用的阴柔小人，说明它不胜其任，必将把事情弄糟，也有“鼎折足”之象。鼎之九四有这些不利的情况其实并不奇怪，在易爻中，凡九四应于初六，一般都有损而无助。“覆公餗”的餗怎么讲？古人的意见很分歧。《左传》昭公七年记孔子先人正考父之庙中鼎铭说：“饘于是，鬻于是，以糊余口。”鬻亦作粥。粥即饘，饘即餗。据《左传》，知鼎中所盛之餗不是别的，就是或稀或稠的粥饭。九四近君居大臣之位，故曰公餗。渥，沾濡。“形渥”，鼎折足，倒下了，里边的粥饭流淌出来，浇得九四浑身汁沈淋漓，十分难堪。辱至其身，灾及其身，故凶。","Y4.XN":"九四作为当天下之任的大臣，不称职，不胜任，弄得个折足覆餗形渥的结果，哪里还有信可言呢！","Y5.N":"鼎的作用欲发挥出来以利天下，关键的问题在于能够举措移动，否则虽有实而无所施用。欲使鼎能够举措移动，必有虚中之耳与可贯之铉。这两个条件六五是具备的。六五本身在鼎卦之上，受铉以举鼎，有鼎耳之象。上九在鼎之外，贯耳以举鼎，有铉之象。耳不是一般的耳，是黄耳。黄是中色。中色之耳亦即虚中之耳。虚中这一点是重要的，耳不虚中，铉是贯不进来的。上九是阳爻，故曰金铉。金铉也不是一般之铉，是坚强之铉。虚中之耳，纳以坚强之铉，举鼎是不成问题的了。但是这仅是六五已有的客观条件；六五毕竟以阴居阳，位不得正，它欲使黄耳受金铉由可能变为现实，还要努力守正，故爻辞在黄耳金铉之后更曰利贞。","Y5.XN":"《易》以阴为虚，阳为实，鼎之六五是阴爻，阴爻无实德。但是《易》更贵中，鼎之六五以中为实，它之所以为鼎卦之主，得鼎之道，完全由于它居中，得中道。","Y6.N":"鼎卦与井卦爻越往上越好。井之用在水，水汲而出井方为用，故井上六曰元吉。鼎之用在食，食烹而出鼎方为用，故鼎上九曰大吉无不利。鼎上九，乃一阳横在鼎耳之上，有铉象。同是上九一铉，自六五之柔看来，它是阳刚，是金铉；而自上九自身而言，以阳居阴，刚而能温，它又是玉铉。玉铉的特点是刚柔适宜，动静不过。鼎上九处在功成致用的地位，只要善处就好。恰好玉铉的特点适应这一要求，所以大吉无不利。","Y6.XN":"为什么称上九为玉铉？因为上九“刚柔节”。什么是“刚柔节”？上九体刚履柔，刚柔适宜而不过，与乾卦上九之亢龙不同，是谓刚柔之节。","Z":"64卦中鼎与井二卦直接取器物为象，井卦总体象井，鼎卦总体象鼎。\n井和鼎的各个构成部分都可以在各自的卦中找到相应的爻。鼎有足在下，故鼎卦之初为足。鼎之腹大而居中，故鼎卦之二、三、四为腹。鼎之上有耳，外有铉，故鼎卦之五为耳，上为铉。而诸爻爻象则莫不与鼎之相应部位的功用有关。鼎足在下支承鼎身，故鼎卦初六曰颠趾。鼎腹大而居中，有盛物之功用，故九二曰有实，九三曰雉膏，九四曰公餗。鼎耳在上，故六五曰黄耳。鼎外有铉，故上九曰玉铉。卦中有足有腹有耳有铉，合起来正是一个完整的鼎的形象。鼎之各部分是相互作用的，鼎卦之各爻也相互作用。如鼎卦九四是腹不是足却曰折足，是因为九四正应于初六，九四所谓折足之足系指初六。鼎卦之六五是耳不是铉却曰金铉，是因为六五比于上九，六五所谓金铉之铉，系指上九。又，六五为耳，九三亦曰耳，是因为九三与六五不存在应的关系，而有鼎耳革之象。\n就卦义来看，鼎卦与大有有惊人的相似之处。大有卦辞直曰元亨，鼎卦卦辞也直曰元亨。大有上九曰吉无不利，鼎卦上九亦曰大吉无不利。这是因为这两卦都以尚贤养贤为义的缘故。而且卦中尚贤养贤之义全表现在上九与六五两爻的关系上。上九刚德为贤，六五尊而尚之，是为尚贤。两卦卦辞所谓元亨，其意义全在上九吉无不利或大吉无不利上表现出来。大有与鼎卦还有一个与别的卦不同的共同特点，两卦之“大象”皆曰天命。大有“大象”说“顺天休命”，鼎卦“大象”曰“正位凝命。”一个说顺天命，一个说凝天命。两个天命都是莫之为而为，莫之致而至的客观必然性，即事物变化发展的规律，不是超自然的上帝之旨意。顺命凝命都是适应规律而尽人事的意思。"},"51":{"P":"《序卦传》说：“主器者莫若长子，故受之以震。”震卦继鼎卦之后，是因为鼎是器，器要有主器之主。在古代实行宗法制度的情况下，最有资格主器的是长子。据《说卦传》“乾，天也，故称乎父。坤，地也，故称乎母。震一索而得男，故谓之长男”的说法，震为长男。长男有主器之义，所以鼎卦之后次之以震卦。震卦一阳生于二阴之下，动而上进，有震动之象，故为震。震亦即动，动而不曰动而曰震，是由于震不仅有动而惊惧之义，且有雷的震奋之象。","G.N":"震卦卦辞讲的是人的一种心态和涵养。是什么心态和涵养呢？简言之，是惧和不惧。惧和不惧是对立的两种心态和涵养，怎能合在一起？惧和不惧其实是一种心态和涵养的两个方面，不能分开。人遇事能惧，能惧必至于能不惧，不惧由于能惧。能惧又能不惧，故亨。\n“震来虩虩”一句讲人有事能惧。“震来”在人的心中，不在人的心外。“震来”是人心中的一种恐惧感。“震来”其实就是惧。虩音隙(xì)。虩虩是形容“震来”的。“震来”与“虩虩”是同步产生，同步存在的同一心态。“震来”是惧，“虩虩”是指示这惧的状态、程度和性质的。整个“震来虩虩”这句话的意思是，恐惧得周环顾虑，不敢自宁。这种恐惧是小心、戒慎、不敢掉以轻心，绝非胆小怕事，畏葸不前之谓。\n“笑言哑哑，震惊百里，不丧匕鬯”，三句讲平时遇事知惧即能够“震来虩虩”的人，一旦猝然遇上重大事故，反而能不惧。不惧到什么程度呢？“笑言哑哑”。大事当前，仍能言笑和适，镇定若素，有事犹如无事，这是一种常人难为的非凡气度。“震惊百里，不丧匕鬯”二句既进一步补足“笑言哑哑”之意，又指出身负重任的人尤当有此涵养。\n“震惊百里，不丧匕鬯”，天上打着响彻百里的雷，人们无不为之震惊，然而正在主祭的人却身闲气静，不动声色，乃至手中拿着的匕和鬯不因为雷惊而失落，祭祀照常进行。雷震是瞬间事，不容人们经过思考再作反应。人们对雷震的反应几乎是出自心理本能。因此古人认为它最能考验人的修养。匕，祭祀时用的木制器具，用以升鼎中之牲肉至俎上。鬯，用秬黍酒和郁金香调制而成的一种高级的有香气的酒。祭祀时所做非止匕牲和荐鬯二事，然而唯此二事由祭主亲自做。卦辞用“震惊百里，不丧匕鬯”一语做比喻，说明人无论遇上什么危厉之事都要从容不迫，尤其主祭的天子、诸侯以及贵族家族中的大宗子、小宗子，更该做到“震惊百里，不丧匕鬯”，纵然天崩地裂也无所畏惧的程度。古人极重视人的这种涵养。《书》云“纳于大麓，烈风雷雨弗迷”，《孟子》说大丈夫“威武不能屈”等等，无不强调对社会对人民负有责任的人在大事难事乃至危事面前必须有所不惧的涵养。","T.N":"此《彖传》未对震卦卦名作解释，但举卦辞“震亨”二字原文而已。“震亨”，说明人有事由惧而得亨，更无他义。\n“震来虩虩，恐致福也”，人遇事而有恐惧之心，反躬修己，审慎为之，则必因恐惧而反致福。“笑言哑哑，后有则也”，人对待事情，无论怎样轻而易举，也要有所恐惧。这只是一方面，另一方面，无论怎样艰难、危厉，也应无所畏惧，言笑从容，镇定自若。则，法，常。有则，出处语默皆不失常态。“震惊百里，惊远而惧迩也”，惊指雷而言，惊远，雷惊的面很远很广。惧指人而言，惧迩，人惧在近处。人遇“震惊百里”之雷，势必恐惧，但是作为人君继承人的长子却不可因遇“震惊百里”之雷而恐惧，他应该“不丧匕鬯”。“不丧匕鬯，出可以守宗庙社稷，以为祭主也”，(《彖传》脱“不丧匕鬯”四字)出是继世而主祭的意思。作为人君的长子，有“震惊百里，不丧匕鬯”的修养和气度，先君去世，他便可以出而继世而主祭，挑起领导国家的重任了。","X.N":"洊，再。洊雷，上下皆雷，两个雷。君子观洊雷威震之象，做到既恐惧又修省。恐惧修省是君子的“洊雷”，是君子应具有的素养，它们自在君子的心中，不是平时不知恐惧，遇有雷震而临时恐惧。君子存恐惧之心，是有一个雷一个震，因有恐惧之心而有修省之行，是又有一个雷一个震。既恐惧又修省，洊雷自在其中。","Y1.N":"震初九爻辞同于卦辞，只多后与吉二字，小象又同于《彖传》，这在全《易》384爻中是独一无二的。初九爻辞之所以同于卦辞，是因为震卦之卦义是讲人的一种心态和涵养的，它的主旨是说人遇上难事危事的时候，问题再小，也要心存恐惧，修省自身，审慎而为之；同时，问题再大，也要从容镇定，无所畏惧。人的这种涵养，宜初时就有；初时没有，待到出了事情，临时想要恐惧修省，是办不到的。所以做爻辞的人把体现震卦卦义的爻辞系诸初九。再者，震卦之用在下，而初九居下体之下，有阳明之德，是震卦之主，它最能体现震卦卦义。\n爻辞中后与吉二字值得注意。有了这两个字，“震来虩虩”，“笑言哑哑”的两句话的关系显得十分清楚。“震来虩虩”，有遇事知惧之心，能恐惧修省，然后方能“笑言哑哑”，即遇事言笑自如，和适安详而能不惧。能惧而后能不惧，不惧由于能惧。能惧而又能不惧，得吉。“震来虩虩”即能惧与“笑言哑哑”即能不惧相比，前者是首要的，根本的。","Y1.XN":"此与《彖传》同。","Y2.N":"六二以阴居阴，既有中德又得正，是善处震的人。震来厉，当震之来而危厉。此“震来”意义与卦辞相同，是恐惧的意思，是自我心中的一种恐惧感。六二乘初九阳刚之上，处境不利，其恐惧感格外严重，甚至达到危厉的程度。但是实际上没有什么问题，六二有中德，它能够恰当地处理它所遇到的问题。亿，猜度，估量。亿丧贝，六二知道自己目前处境不好，非暂时损失掉宝货即至关重要的东西不可。必须失掉的，就让它失掉，不吝惜。跻，升。九，多。陵，高冈。跻于九陵，升到高高的九陵之上，意谓飘然远举，失掉的东西任它失掉而“勿逐”，不去追它。“七日得”，到了一定的时候，失掉的东西，还会重新得到。“七日得”，除此爻外还见于既济之六二。为什么都以七日为期呢？王引之《经义述闻》说：“盖日之数十，五日而得其半。不及半则称三日，过半则称七日。欲明失而复得多不至十日，则云七日得”。王说可取。","Y2.XN":"初九是刚爻，乘刚是乘初九。小象言“乘刚”的，除本爻外还有屯六二、豫六五、噬嗑六二、困六三。困六三之“乘刚”是乘坎之中爻，其余诸爻“乘刚”都是乘震之初。“乘刚”之爻一般都是不好之中有好，或者暂不好而最终转为好。","Y3.N":"六三以阴柔居阳位，所处不正，有震苏苏之象。苏苏，精神失落，意气沮丧。平时尚且如此苏苏不振，今六三所处不正，又当震之时，其有眚可知。眚，过失。震行与苏苏相对。六三倘能反其沮丧失落之气，因震惧而奋往前行至九四，去不正而就正，则可变灾为福，变有眚为无眚。","Y3.XN":"震惧当虩虩，不当苏苏。虩虩是好的，苏苏是不好的。六三为什么震苏苏，苏苏缓散呢？因为它以阴柔居阳位，所处之位不中又不正。","Y4.N":"泥，滞溺。遂，无反之意。遂泥，陷入滞溺的困境，不能自反自拔。震遂泥，震亨的反义。自卦爻之象看，震则动，动则通；自人事看，震则既恐惧修省又勇敢振奋，亦通。震遂泥恰是震亨的反面，处震却不能恐惧修省以自守，欲动又不能勇敢振奋以前行，震之道已丧失殆尽。犹如一个人正当困心衡虑之时，纵有无限抱负，竟不得寸步施展。九四为什么会有如此艰难的震遂泥之象呢？因为九四虽与初九都居震之下，都有决定震之所以为震的意义，而且都不居中，但是初九以一阳动乎二阴之下，得震之本象，故其辞得与卦辞合，而九四既以刚处柔，失刚健之道，又陷于四阴之间，更不能振奋自反，故其辞适与卦辞悖。","Y4.XN":"光，广。未光，未得广大。九四震遂泥，由于其处境不好，既失刚健之道又陷入重阴之中，故其志气不得施展，不得广大。","Y5.N":"六五与六二有相似之处。二与五的震厉是相同的，都是说能够以恐惧之心对待事物；二与五在居中，有中德，因而能够亿度事理这一点上也是相同的。不同之处是，六二在下震之上，故称震来厉，六五在重震之上，故称“震往来厉”。往亦厉，来亦厉，多一个往字，表示六五在任何情况下都能保持恐惧修省的积极审慎心态。二与五还有一点不同，二者都以居中，有中道取胜，然而表现不一样。六二“丧贝”，六五“无丧有事”。“有事”指祭祀，“无丧有事”指不失祭祀宗庙社稷的权力。六二居下位，有的是宝货；宝货可以失，失亦可复得。六五居君位，守的是宗庙社稷，宗庙社稷不可失，失而不可复得。","Y5.XN":"“震往来厉”，讲的是一种恐惧的心态，意思是说，六五时刻心存恐惧，无时不在忧患之中。“危行”，心存恐惧，不忘忧患，表现在行动上，能够事事自危。“其事在中”，六五的关键问题在于居中。《周易》最贵中道。二与五居中，纵然其位不正，往往也是好的。三与四其位虽正，因为不中，往往也是不好的。中则不违于正，正不必中，这是《周易》的一条重要原则。六五居中，有中道，所以能够无丧有事，能够坚守宗庙社稷为祭主。“大无丧也”，大作动词用，意谓以“无丧有事”为大，大其得中能“无丧有事”。六五关键的一环是得中，有中道，六五首要的问题是“无丧有事”。后者是由前者决定的。","Y6.N":"索索，消索而几近不存。矍矍，慌乱而几近不固，震索索，恐惧过甚，以至于志气殚索。视矍矍，恐惧过甚，以至于视瞻徊徨，心神不固。上六之所以震索索，视矍矍，是由它以阴柔之质，居不中不正，又处震动之极决定的。一个震索索，视矍矍的人，最宜控制自己的行动，使震索索、视矍矍的情况不再发展，否则必凶。躬，上六自身。邻，近于身者。上六的问题是恐惧过甚，解决的办法是未雨绸缪，在尚未过甚的时候就采取措施使之不至于过甚。“震不于其躬，于其邻”，在震恐邻近其身而未及其身之时，先行控制，使不至于极，这就可以无咎了。婚媾，指与自己亲近的同道者。这是些识见凡俗的人。它们目光短浅，只知相诱以安乐，不知祸患之将至，看到作为它们首领的上六如今见几而豫为之图，就“有言”纷纷。上六则当为所当为，对于婚媾之“有言”，完全不必理睬。","Y6.XN":"上六恐惧过甚，乃由于过中，未得中道。过中而不得中道，本来是凶的，但是毕竟可以无咎，原因就在于它能见邻戒而知惧，在未极之前先行改变态度，使不至于因恐惧过甚而索索、矍矍。","Z":"震卦之卦象卦辞与诸爻之爻象爻辞关联极为紧密。卦的本象是雷是震，爻的本象也是雷是震。卦辞讲人遇事能惧和能不惧的心态、涵养问题，诸爻辞也莫不如此。初九是震卦的主爻，初九爻辞与卦辞同，初九小象又与《彖传》同，这在全易384爻中是独一无二的。震卦由两个三画震卦重合而成，初与四两个阳爻是成卦之爻，震之所以为震，全在于它们。但是初与四在卦中的地位大不相同，初九一阳动于二阴之下，最得震之本象，最当震之始，最知震之来，最先知恐惧修省，最能反映卦之义。九四虽也是一阳居二阴之下，无奈它以阳处阴，不中又不正，且陷于四阴之间，滞溺难反，处震不能守，欲动不能奋，恰似一个人志气未遂，困心衡虑，处在进退难决的矛盾心态之中。因此震卦之亨在初九，不在九四。二与五都是阴爻，二得正，五不得正；二得正固然好，五不得正也无妨，《易》多以中为美，中比正为重，既有中德，正也就含于其中了。二、五都有中德，然而二居下，五处尊位，故爻象又有不同。二有中德，所以贝丧而可复得；五有中德，则所守者宗庙社稷根本不能失，不可失。合观震卦六五爻辞和卦辞以及《彖传》，知《易》不仅为君子谋不为小人谋，更为人君谋不为百姓谋。六三以阴居刚，所以不正，故其象不如六二，六二勿逐即可复得，六三必行方能无眚。上六以阴柔处震之极，索索矍矍，一派惊慌失措，志殚气竭的消极气象，不如六三之“震行无眚”，尤不如六五之“无丧有事”。还有一点务须明了，震卦揭示的是心理不是事理，是心境不是处境，是心态不是事态。一言以蔽之，震主人之心，不主物之理。"},"52":{"P":"《序卦传》说：“震者动也。物不可以终动，止之，故受之以艮。艮者止也。”事物之动止总是相因的，动则必有止，止则必有动。震即是动，艮即是止。所以震卦之后次之以艮卦。艮即是止，而卦名艮不名止，是因为艮除止义之外还有山之象，有安重坚实之意。这是止义不能包括的。又，艮一阳居二阴之上。阴性静，二阴在下静止不动。阳性动，但是一阳既已至于上，则性动也不能动了。下静上止，故为艮。艮止，畜亦止。艮止与畜止有所不同，艮止是自我安止，畜止乃外力制止。","G.N":"这四句话中，“艮其背”一句是主要的，根本的。以下三句是由它决定的，也是说明它的。如果把全部卦辞加以简化，那么说成“艮其背，无咎”也是可以的。艮的意义是止，止可以无咎，但有一定的条件，不是任何情况下的止都可以无咎。“艮其背”方可无咎。“艮其背”是说止应当止在恰当的地方，止其所当止，止得其所。说止的场合要恰当，实际上也包括止的时机问题在内了。为什么取“背”为象说明止其所当止之意呢？因为“背”是人体中唯一止而不动且又自身不得见的部位，是最理想的止处，其他任何部位都不兼有这两个条件。卦之所以以背为象，从卦体和爻位上都可找到根据。自卦体看，二阴在下，一阳在上，阴阳各止其所，屹然不动，止而不交，有相背不见之象。“不获其身”就是进一步强调这种相背不见之象的。止于其背，连自身的身体都不获见，说明背得相当严重。自爻位看，艮是八纯卦之一，上下各爻峙而不应，互不相与，也是相背不见之象。“行其庭，不见其人”就是进一步强调峙而不应，互不相与这种相背不见之象的。诸爻同在一卦，近在咫尺却各不相与，就像人们同行在一个院庭里却谁也看不见谁一样，更说明背得严重。","T.N":"“艮，止也。时止则止，时行则行。动静不失其时，其道光明”。这一段话解释卦名艮的意义。艮就是止。但是止的意义并不简单，不能以为停止不动才是止。其实止还包含着行的意义在内。这一点一般人不易领会，所以孔子特殊加以说明。止于止是止，止于行也是止。我们坚持不懈地干一件事情，就是止于行的止。后来我们发现情况变了，这件事情必须停止，不宜再干了，这就是止于止的止。坚持干什么，是止于行；坚持不干什么，是止于止。两种止实行起来都要看场合，要止在恰当的场合，就是要“艮其背”。这个场合不仅是空间上的场合，也是时间上的场合，而且归根结底是时间上的场合。“时止则止”，时要求止于止，就止于止。“时行则行”，时要求止于行，就止于行。或止于止，或止于行，时是决定性的因素。《易》贵时，孔子也贵时。时的观念在全部儒家哲学中占有重要地位。“其道光明”，是孔子对止之道的赞语。自卦象看，艮之体明确、显著、笃实，有光明之义，所以《易》言光明多在艮体。从社会心理看，什么事情有了一定的准数，人们心中有了底，就感到光明。艮是止，止是定，定则明。比如今日中国之改革，人民看到中央态度坚决，政策稳定，决心止于改革，要将改革坚持不懈地进行到底，就像吃了定心丸，心中托底有定，所想所见自然光明。\n“艮其止”以下解释卦辞。卦辞言“艮其背”，此《彖传》改曰“艮其止”，可见背即止。“艮其背”即“艮其止”，接着用“止其所也”一句解释“艮其止”，说明背乃止的场合，“艮其止”就是止其所当止的场合。上文已言及，所谓止其所当止的场合，主要是说止要止在恰当的时候上。“上下敌应，不相与也”，卦之上下体地位相当的两爻有应的关系。一阴一阳谓之相应，相应则相与，相与则有交往。若同为阳或同为阴则不相应，不相应谓之敌应，敌应则不相与，不相与则不相交往，不相交往即各止于其所；各止于其所，所以“不获其身，行其庭，不见其人”，所以“无咎”。","X.N":"艮卦上体下体都是山，故为兼山。两雷两风两水两火两泽都有互相交往的可能，唯独两山并立不可能有往来，各在各的位置上而不相干涉，有止之象。君子观察艮卦兼山各止其所，互不干涉之象，“以思不出其位”。这里，思与位是关键性的字眼。思是“心之官则思”的思，亦即思考、思虑、思想的思，与行相对应的思。位当与《彖传》所谓“止其所”的所字同义，即场合、时候的意思。“思不出其位”，思是主词，“不出其位”是谓词。全句回答思应当是怎样的。如果以为思是谓词，“不出其位”是宾词，全句是回答思什么的，那就错了。思应当是怎样的？思应当不出其位，思所当思。思也要止在恰当的场合，恰当的时候，勿过勿不及。用现代语言说，就是思想要切合实际，过了就是空想，不及则陷于保守。","Y1.N":"“艮其趾”，艮之于脚趾。脚趾居人体最下，人动趾先动，趾动是人动之始。人事之止不外乎两种情况：止于行，即应当做的事坚持做；止于止，即不应当做的事坚持不做。什么事当做，开始就要做；什么事不当做开始就不做。如此方可无咎。做什么或不做什么，止于始尚且往往不能止于终，何况连止于始都做不到呢！初六艮其趾，是能够止于始，因而得无咎的。但是初六阴柔之才，止于始之后是否能止于终还是问题，所以要求它“利永贞”，常久坚持，贞固到底，切勿半途而废。","Y1.XN":"看爻象，初六以柔爻居刚位，本不为正，但是观爻义，事当止又能止于始，又未为失正。","Y2.N":"六二居中得正，是懂得并且掌握止之道的；什么事情应当坚持做，即应当止于行，什么事情不应当坚持做，即应当止于止，它是明白的。然而它处在下位，上与六五不应，行动要受卦之主爻九三的制约，没有自行其是的便利，故有“艮其腓”之象。腓是腿肚，腿肚自己不能动要随股之动而动。“艮其腓”，意谓六二对于艮止的问题，孰当止于行，孰当止于止，自己心里清清楚楚，但是实行起来自己不能做主，要受制于它人。它人指九三，九三虽为一卦之主，是主乎止的，但它刚而失中，且居下体之上，自己既不晓得止道之宜，又不肯降而下求于六二。六二虽有中正之德，也得不到它的信从。结果六二“不拯其随”。拯救不了九三的错误主张，只好违心地随着九三的意见去做，表面上委曲妥贴，无形迹可见，内心自然是不快的。","Y2.XN":"听，从。退听，从下。六二不拯九三的错误而采取随和九三的态度，是由于九三不听它的，不得已而为之。","Y3.N":"九三以刚居刚，正而不中，而且处在下体之极，上下之际.它对于止道的实质，对于止道的根本精神，是不理解不掌握的。止道贵时，一件事情是坚持地做还是坚持地不做，顺依据时间的变化，灵活掌握，有进有退。彼时当坚持地做，就坚持地做，此时当坚持地不做，就坚持地不做，一切依时间条件为转移。九三则不然，它把止的问题看得很死，很确定，很绝对。它止在一件事情，一个问题上，就一止到底，不再变化。有如一个国家由于某种必要的原因与别国中止交往关系，在当时是自然的，合理的，因而也是有益的；然而它不顾时间的变化，永远与别国不相往来，结果与世睽绝，自己把自己孤立起来，封闭起来，合理就变成不合理，有益就变成有害了。九三的这种态度，如果用人体部位做比喻，就叫做“艮其限”。限，人体上体与下体交际的地方，即腰胯。止于腰胯这个部位，等于把上下体隔断，使不相从属，不相通融。“列其夤”是“艮其限”的引申和补充。列，裂绝。夤，膂，是连结上下体的东西，把夤裂绝了，人体将分离为二。“厉薰心”，说明“艮其限”的后果严重。厉，危厉。薰，烧灼。“厉薰心”，危厉烧灼其心。九三过刚不中，处在止的时代，以为欲止就求绝对的止，欲静就求绝对的静，不知道动静行止应随时，一味固执地求静，结果反招致危厉烧灼其心，使之坐卧不得静。","Y3.XN":"九三“艮其限”的要害问题是时不当止而强为之止，时当变止为不止而强为之不变，结果心欲静而反招致危厉烧灼其心，使躁动不得静。这是由于九三无中德的缘故。","Y4.N":"六四虽亦无中德，但以阴居阴，纯是静体，在止的时代能够做到心静身安，行止以时，情况要比九三艮其限为好，故云“艮其身，无咎”。六四称“艮其身”，是因为六四在卦之下体之上，上体之下，恰像人体腹上膈下即身的部位。自爻象看如此，自爻义看则“艮其身”可有两层意义。第一，六四既已进入上体，便不存在九三“艮其限”那样把上下体分隔开的情况了。“艮其身”有不分部位，能够总止其身，不为躁动的意义。第二，“艮其身”也有自止其身，反躬修己的意义。人之自身的问题不外乎言行二事，六四艮其身，能够时当言则言，时当行则行，时不当言当行，则不妄言妄行。总而言之，能够止之以时。六四能够总止其身，不为躁动；自止其身，止之以时，故无咎。","Y4.XN":"“止诸躬”就是“艮其身”。将“其”字换成“诸”字，是在于强调“艮其身”是止之于身，是自己解决自己的问题。","Y5.N":"辅即口，是人说话的器官。六五居上位，与口的位置相当，故云“艮其辅”。“艮其辅”，是止之于口。止的意义根本在一个时字，时当止则止，时不当止则不止。时当止则止，是止；时不当止而不止，也是止。所以，止之于口，不是缄默不言，是时当言则言，时不当言则不言。时当言而言，则言而有序，先后缓急中节不乱。六五以阴居阳位，位不正，是以本有悔，但是六五居中而有中德，能“艮其辅，言有序”，所以有悔悔亦亡。","Y5.XN":"正字乃衍文。《周易》是有韵的。六四小象言“止诸躬”，上九小象言“以厚终”，此当言“以中也”，况六五以阴居阳，位本不正，不应言“正”。“艮其辅，以中也”，六五因为居中有中德，所以能“艮其辅”。","Y6.N":"敦，厚，笃实。上九以阳刚居止之极，有坚笃于止，敦厚于止之象，故曰“敦艮”。一般来说，卦发展到上的时候，事情已至于极点，该往反面转化了，而艮上九却不过而为敦，止不但未变，反而止的更加敦厚笃实了。与初六艮其趾对照看，艮其趾无咎，而敦艮吉，可知艮卦强调善始，更强调善终。犹如一个人止于善重要而难能，一辈子到死都止于善，更其重要而难能。上九敦艮何以得吉？上九与九三是艮卦仅有的两阳爻，都居于二阴爻之上，有成卦之主的意义，九三位当上下体之交，在时不可止的时候止，故危厉。上九在全卦之终，在时当止的时候止，故吉。又，上九称吉，与卦体有关。临上六敦临吉，复六五敦复无悔，都因为卦之上体为坤，坤为土，土有厚象。艮卦上体为艮，艮为山，山乃土地之突起，比土更有厚象，故艮上九曰敦艮吉。又，64卦中上爻得吉者无多，而上体为艮的蒙、蛊、贲、大畜、颐、剥、损、艮8卦之上九皆称吉，可见艮上九称吉非出偶然，是有其一定的卦象为根据的。","Y6.XN":"从爻象说，上九居艮之极，处兼山之上，有厚终之象。从爻义说，止重于始而难于终止，始固属不易，而止终尤难；始止而至于终止，才算真能止。能终于止，非一朝一夕事，必须长久积厚而后成“敦艮”，得敦艮之吉。总之，上九得敦艮之吉，是由于得止之终；得止之终，是由于得积之厚。","Z":"艮卦和咸卦一样，以人身取象，取象的人体部位也与咸卦大体一致，只是相差一位。这是由于各自取心为象的爻位不同的缘故。咸以四为心，故五为背，上为口；艮以三为心，故四为背，五为口。艮之初为趾，咸之初为拇，其实一样，都指足而言。咸二艮二皆言腓，艮二和咸三皆言随。\n艮卦所言之止，是主体自止，即止我，不是止物。止的含义，用今语表达就是坚持。坚持干什么是止，坚持不干什么也是止。止，可止于止，也可止于行，因此，有静态的止，也有动态的止。坚持不干什么，是静态的止；坚持干什么，是动态的止。止的反义是不止，不是静；止与静有关系，但不能等同。不止的反义是止，不是动；不止与动有关系，但不能等同。止，无论在怎样的情况下都具有正面意义，所以艮卦不言凶咎悔吝。艮卦所讲，实际上是人的自我控制能力的问题。止就是坚持，坚持的最为重要的问题是有始有终，所以艮之初六艮其趾曰“无咎”，而上九敦艮言“吉”。坚持不能不靠他人尤其上级的支持，但是别人或上级分明错了，不能救而拯之，只能从而随之，是令人遗憾的事，所以艮之六二艮其腓，不拯其随，曰“其心不快”。坚持干一件什么事情或者坚持不干一件什么事情，关键的问题是看准时候；时当坚持则坚持，时不当坚持则不坚持。如果在最不该坚持的时候坚持了，甚乃达到僵化的程度，那就像将人之上下体固定不得屈伸或者分隔开来不得通融一样，必将招致麻烦和危害。所以艮之九三艮其限，列其夤，曰“厉薰心”。坚持干什么或坚持不干什么，主要是自我修养，反躬修己的问题。止我不止物，当止而止，灵活进退，才是正确的。所以艮之六四艮其身而言“无咎”。坚持的问题更重要的一方面表现在人用以言语的口上。话当讲则必讲，话不当讲则必不讲；讲而轻重缓急有序，不乱讲。如此则纵然有悔亦将无悔。"},"53":{"P":"《序卦传》说：“艮者止也。物不可以终止，故受之以渐。渐者进也。”渐是进，止的结果必有进，这是屈伸消息之理，所以艮卦之后次之以渐卦。渐是进，但不是一般的进，而是渐进，渐进亦即缓进。缓进，也不是一般的缓进，而是有次序的缓进。渐进之所以缓，不是因为别的，仅仅因为进而有序。简言之，渐是不越次序因而缓慢地进。这一卦之所以名曰渐，从卦体上看，是这样的：为卦艮下巽上，木在山上，木因山而高。木之高是有根据的，不是偶然的，恰像进而有序，故名曰渐。","G.N":"《易》64卦中有4卦借用夫妇和男女关系讲哲学道理。这4卦是咸、恒、渐和归妹。同是讲夫妇、男女关系，又各有不同的侧重。咸与恒主要讲个体家庭中的夫妇关系，渐与归妹则侧重在女子出嫁的问题上。其中恒与渐更重夫妇之义，咸与归妹更重男女之情。因此4卦的取象不同，卦义也不同。渐卦取象“女归”，亦即女子出嫁这个具体事物以揭示做事应循序渐进的卦义。这就与咸卦之“取女”不同。“取女”，是男子娶女，“女归”是女子嫁男。“取女”与“女归”本是一个事物的两个方面，然而咸卦卦辞取象“取女”，是讲天地万物相感通的道理；渐卦卦辞取象“女归”，则是讲事物循序渐进的规律。为什么说“女归”能够说明事物循序渐进的规律呢？因为古代女子出嫁不是想办就可以办的事，它必须有媒介，有纳采、问名、纳吉、纳征、请期、亲迎等六个步骤，缺一不可。依照这个循序渐进的过程出嫁，是正常的，合礼的，因而也是吉的。女子若不按这个过程完婚，便是私奔了。私奔是不会吉的。世间循序渐进的事物很多，为什么渐卦偏偏取“女归”之象呢？这是因为“女归”是生活中最常见，最能为人们所理解的循序渐进的事物。“利贞”一语在《易》中有不同的含义，大体上有三种情况。有的是戒辞，如损之九二，处阴居说，有不正之嫌，曰“利贞”是告诫它务必注意守正。有的，事是因，贞是果，曰“利贞”带和称花它于贞。有的，贞是因，事是果，曰“利贞”实际上是说由于贞而有利于某事的实现。渐卦卦辞曰“利贞”即属于此种情况。渐卦取象“女归”，“女归”这种事情其本身就是贞正的；由于“女归”有贞正的特点，所以实行起来必吉。\n渐卦与下一卦归妹都是讲女子婚嫁的，那么它们有什么不同呢？简单地说，它们反映的是古代女子嫁人的两种情况。渐卦讲“女归”，是一种正规的，典型的婚嫁，男方通过媒介及纳采、问名、纳吉、纳征、请期、亲迎六个步骤将她娶过去做嫡妻即正夫人。女子的这种婚嫁，反映的事理是循序渐进。归妹卦讲“归妹”，“归妹”反映古代女子婚嫁中的一种特殊现象即侄娣制度。侄娣制度是怎样的一种制度呢？《公羊传》庄公十九年说：“媵者何？诸侯娶一国，则二国往媵之，以侄娣从。侄者何？兄之子也。娣者何？弟也。诸侯一聘九女，诸侯不再娶。”《公羊传》隐公七年又说：“叔姬归于纪。”何休注说：“叔姬者，伯姬之媵也。至是乃归者，待年父母国也。妇人八岁备数，十五从嫡，二十承事君子。”根据《公羊传》的记载和何休的解释，我们知道，诸侯一生结婚一次，一次娶九个女人。九女中有一个是嫡妻即夫人。嫡妻的妹妹或侄女也要随着嫁过来两位。若当时年纪太小，就等到十五岁时嫁过来，二十岁时与那位诸侯过夫妇生活。这两个女人就叫侄叫娣，也叫媵。诸侯从一个国里娶一位夫人和两位侄娣，另外两个国还要主动嫁过来两位女子，这两位女子也叫媵。每位侄还要有两位侄娣随着嫁过来，年纪太小也要待年于父母之国，待到十五岁成人时嫁过去。诸侯一娶九女，九女中有六位侄娣。侄娣随从姑姊嫁给同一个男人，这就是侄娣制度。侄娣的婚嫁与嫡相比，有两点不同之处，一是由于年幼，嫁期往往拖后；二是没有纳采、问名、纳吉、纳征、请期、亲迎等等过程，到时候主动给人家送过去就算完事。归妹卦说的正是侄娣的这种婚嫁。侄娣的婚嫁是原始社会群婚制的遗迹，为当时社会所承认，因而是合于礼的，与一般的私奔不同。但是它与嫡的典型婚嫁方式也不一样，它没有一个循序渐进的过程。归妹这一卦恰是从侄娣婚嫁的这一特点上取义。它既有不循序渐进的不好的一面，又有为当时社会所承认的合礼并合理的一面。","T.N":"“渐之进也，女归吉也”。渐有进义，但是渐不等于进。渐与进的关系不同于晋与进的关系。晋就是进，而渐不是进，渐只是进的一种情况。说“渐之进”，说明不是别的进，是渐之进。“渐之进”，要害在渐字上，它强调的是渐不是进。渐之进，能够做到“女归”那样稳妥有序则吉。\n“进得位，往有功也。进以正，可以正邦也。其位，刚得中也。止而巽，动不穷也”。这几句话都是解释“利贞”，为“利贞”一语找根据的。渐与归妹是反对卦，归妹之二、三、四、五爻皆不得位，现在归妹之下体兑进而成为渐卦上体巽，于是二、三、四、五均得位，而九五不但得位，而且得中。因为进得位，所以九五以刚阳居阳位又得中。九五刚得中，就是往有功。“进以正”以下，含义与“进得位，往有功也”相同。含义相同，却又重申一次，是为了强调渐卦之所以利贞，是因为二、二、四、五诸爻得正位，九五更得中，“进以正”，其实就是“进得位”；“可以正邦”，其实就是“有功”、“以正”和“得位”是“有功”和“正邦”的根据；“有功”和“正邦”是“以正”和“得位”的效果。“其位”指五，居五的是阳爻，故曰“刚得中”。强调“刚得中”，是恐怕人们误认“得位”是六二柔得中。渐卦艮下巽上，故云“止而巽”。下止则凝静不躁，上巽则欲动不急，恰有渐之进的气象。渐之进，也是动不穷的意思。因为得正，因为刚得中，所以能够把渐之进的意义很好地发挥出来，故云“利贞”。","X.N":"山上有木，木因山而高，其高有因，是有渐义。君子观渐之象，以居贤德善俗。贤字可能是衍文。居，积。德是君子自身的品德修养，俗是社会的风俗风气，一个是修己，一个是化俗，做好这两件事都需要有一个渐进的过程，不能设想一朝一夕见成效。既然居德善俗皆须以渐，人们就应该从小事做起，日积月累以成其大。","Y1.N":"渐卦卦辞取女子婚嫁之象，而诸爻爻辞皆以鸿取象。鸿即雁，是一种水鸟，其性群行有序，往来以时，也切合渐的意义。雁有别有序，所以古代婚礼用雁。婚礼用雁，雁在人们的观念中便与女归发生联系，因此渐之诸爻取鸿象。干是水边，距水最近的地方。“鸿渐于干”，雁群栖于水中，现在到了飞往远方的时候了，但是鸿雁这种禽鸟飞行有先后次序，它绝不一下子飞出好远，它的飞有个渐的过程。初六居于最下，又是阴柔软弱之才，而且上无应援，不具备一下子远飞的条件。它只可渐于水之干。渐于水之干是最适宜的。“小子厉，有言，无咎”，小子，年幼无知的人。年幼无知的人目光短浅，能见眼前的事，不能见久远的事。它看见鸿渐于干，就发怨言，抱怨鸿本可以一下子飞出老远，却飞于水边即止。不过，“有言”也无妨，鸿渐于干是正确的，没有过咎。","Y1.XN":"小子厉无咎，是义无咎。小子想的是表面道理，而初六所为则是根本正确的，符合渐之义。初六在下，所以要进；初六是阴柔之才，所以不躁；初六上无应援，所以能渐。倘依小子之见，初六用刚以急进，就违离渐之义了，不唯不能进，而且必有咎。","Y2.N":"六二阴爻居阴位，柔顺中正，上有九五之应，条件比起初六来大为好转，可以渐于磐了。磐，水边之大石。渐于磐，比渐于干更进一步，而且稳固安全，没有危厉。六二居中得位，九五亦居中得位，两爻以中正之道相应，这对于六二说来是再安全不过的了。所以它可以“饮食衎衎”，和乐得志，而必吉。","Y2.XN":"爻辞言“饮食衎衎”，是比喻六二渐于磐之和乐得志，不是说它素饱。孔子恐人们误解爻义，乃以“不素饱”加以指明。素，空，白。素饱即《诗经》所说的素餐。不素饱，不是白吃饭不干事。","Y3.N":"陆是高平之地，亦即平原。九三在下卦之上，有鸿渐于陆之象。九三以阳居阳，是过刚而失中，又上无应援，此时以安处平陆，守正待时为最适宜，最符合渐之道，任何有所前进的念头和行动都是不利的。但是九三有过刚之质，又处在渐进之时，非常有可能不该进而进，从而失渐之道而致凶，故有“夫征不复，妇孕不育”的告戒之辞。夫指九三自身，妇指六四。征，行。复，反。九三与六四乃阴阳相比相亲相求，最容易苟合。九三倘若不能守正自持而与六四苟合，便是知行不知反，虽孕而不育，必致凶无疑。九三求婚媾不可，御寇则有利。一切非理而至的，都是寇。守正待时，防御寇至，就是御寇。九三能御寇则利，不能御寇则凶。","Y3.XN":"九三夫征不复，是失渐之正，一失到底，不知反顾，等于叛离了自己的同类。群是类，丑也是类。渐卦诸爻都善，唯独九三失正而凶，故云“离群丑”。妇人必由正当的夫妇关系方得孕育子嗣，然而九三与六四以私情相合，是违背“女归”的渐之道的，所以它们不能孕育，故云“妇孕不育，失其道也”。既“离群丑”又“失其道”，怎么办呢？利用御寇，即自守以正，御止其恶。不但自守以正，御止其恶，还要使小人也不至于陷于不义，故云“顺相保也”。","Y4.N":"鸿雁的脚趾是连着的，不能握枝，按其本性说，它不能栖于树上。可是现在六四已进入巽体，巽为木，鸿雁渐之于木了，到了它不应当到的地方，处境很不好。六四没有应援，又以阴柔之质据九三阳刚之上，阳刚是要上进的，不会甘处阴柔之下；六四就像鸿雁栖于树一样，是立不安稳的。不过六四也有有利的一面，它上承九五，以阴承阳，恰好合乎“女归”之义，如果能够顺以事上，也可转危为安。犹如鸿渐于木不好，倘若能得到一个横平的枝柯，也可以立得稳，转不好为好，故曰无咎。","Y4.XN":"“鸿渐于木”是不安，“或得其桷”是安。六四能够转不安为安，原因是它以阴爻居阴位又处巽体，有顺巽之德。顺，柔顺，顺从。巽，善于行权，处事灵活。","Y5.N":"陵，高岗，是鸿雁所能栖息的最高处。九五是君位，故取象“鸿渐于陵”。九五与六二为正应，而且都居中得正，有中正之德，这是最符合“女归”之义的，应当说九五的境况最好。但是，处于渐之时，好事坏事都不能来得快，须有一个过程。妇指六二，九五与六二其间隔着六四与九三，阻碍着不能相合，故有“妇三岁不孕”之象。“三岁”意谓时间很长，非必三年。九五有中正之德，迟早它要冲破九三与六四的阻隔而与六二相合的。不正只能敌中正于一时，而“终莫之胜”，终久不能得逞，战胜不了九五，九五必吉。","Y5.XN":"终莫之胜吉，是渐之吉。九五与六二以中正敌六四与九三之阻隔，经过长时期的斗争，最终战胜邪恶，达到了结合的目的，实现了结合的愿望。","Y6.N":"九三曰“鸿渐于陆”，此又曰“鸿渐于陆”，这就出现了同一卦中爻象重复的问题。宋人以为陆当作逵，逵是云路，理由是陆与仪不叶韵而逵与仪叶韵。但这是宋时的韵，在《周易》成书的时代逵与仪实非同韵。看来，陆就是陆，宋人改陆为逵不可信据。孔颖达说：“上九与三处卦上，故并称陆。”孔氏的解释可从。上九处卦之终，渐之极，位之外，是进处高洁，不为位累，故曰“鸿渐于陆”。上九犹如贤人之高致，超然于进退之外，看来似乎对国家社会无甚用处，但是“其羽可用为仪”，它的表现，它的不为位累的高尚节操，却足可为世人之表率、楷模，无用之中包含着有用。","Y6.XN":"上九什么不可乱？上九志不可乱。上九什么志不可乱？上九处在无位之地，本来是无用的，但是它志意高洁，不为位累，超然进退之外，其志卓然不可乱。因为其志不可乱，所以“其羽可用为仪”，可以作为世人之表率，所以吉。","Z":"渐卦以女归为义，必阴阳相应合于卦义者为好，阴阳不应而与卦义不合者不好。初六无应，所以“小子厉”，六二应于九五，所以得安于磐石，“饮食衎衎”。九三无应，所以有“夫征不反，妇孕不育”之象。六四亦无应，却有集木得桷无咎之象，是因为它承九五，以阴承阳，合于女归之义。上九的情况特殊，居全卦之终，处无位之地，反倒以无应为好。因为无应，才得以无累于位，超然于进退之外而得吉。\n渐卦诸爻情况比较复杂的是九五。九五与六二是渐卦唯一正应的两爻。从九五的角度看，自己是夫，六二是妇。九五与六二正应，夫妇结合，本不该成为问题，只是由于它们之间有九三与六四阻隔着而不得结合。\n同样因受阻隔而不得结合，六二“饮食衎衎吉”，九五却“妇三岁不孕”，这是因为六二与九五的身份不同。六二犹为未嫁之女，是《杂卦传》所谓“女归待男行也”的人，等待男子来娶它是它的本分。它以自己柔顺中正的品格，从容待时，不急于进，故吉。九五是当娶之男，积极主动地娶女是它的本分，九三与六四的阻碍对它是很不利的，使它一时不能与六二结合，故有“妇三岁不孕”之象。虽然如此，但它有中正之德，什么邪恶力量也战胜不了它，且必为它所战胜，故必有终吉。"},"54":{"P":"《序卦传》说：“渐者进也。进必有所归，故受之以归妹。”渐虽不是进，但有进义；进必有所至，所以渐也有归义。渐既有归义，故渐卦之后次之以归妹。归妹是渐的反对卦，取象取义都与渐卦不同。渐卦取象女归，女归是女之归，女之归有循序渐进的渐义，渐卦取义就取在女之归这个归字上。女之归反映的是古代女子出嫁与人做嫡妻即正夫人的那种婚嫁情况。归妹取象归妹，归妹是归之妹，归妹卦取义就取在归之妹这个妹字上。妹是少女，少女自嫁而不待娶，反映的是古代女子出嫁与人做侄娣的那种婚嫁情况。这种婚嫁没有一个循序渐进的过程。归妹从妹字上取义，故其义恰与循序渐进之渐义相反。","G.N":"咸卦、恒卦、渐卦、归妹四卦都是取嫁娶之义的，前三卦卦辞或吉或利，都很好，唯独归妹一卦为凶。就是在全部64卦中，卦辞没有一点好处的，也只有否与归妹两卦。归妹这一卦为什么征凶又无攸利？从卦象看来，归妹兑下震上，“说以动”。“说以动”本没什么不好，但是动而不当就不好了。归妹六爻之二、三、四、五这四爻位都不正。初与上虽然位正，但阳在阴下，其位也不为正。除位不正以外，归妹卦义也不正。归殊卦下体是兑，兑为少女；上体是震，震为长男。少女在长男之下，乃少女从长男。少女从长男，其情以说而动。这样的婚嫁，男女之情胜过夫妇之义，按照古人的观念，是不正的，所以卦辞曰“征凶，无攸利”。不能动，动则凶；无往，往则无所利。","T.N":"“归妹，天地之大义也。天地不交而万物不兴。归妹，人之终始也”。\n归妹卦反映的是古代女子婚嫁中的侄娣制度，侄娣制度实际上是更古的时代的群婚制的残余。群婚制在《周易》成书的时代，在人们已经有了显著的男尊女卑观念情况下，含有女子不经过男子迎娶而主动从男的意义，是不合于礼义的，故卦辞言归妹征凶无攸利。但是归妹还有另一方面的意义，归妹毕竟是讲阴从阳，女从男，男女之情的。男女之情虽不必合礼，却必合理。孔子深刻地看准了归妹卦的这方面的意义，他作《彖传》，在言归妹之凶以前先言归妹的合理性及其在人类自身繁衍上的伟大作用。孔子认为男女交感，男女配合，使人类生生相续，代代不穷，如同天地相遇而有万物生一样自然，一样合理。然后再强调一句归妹乃关乎人之终始的大问题，不可等闲看待。所谓人之终，是说男女婚配；所谓人之始，是说人之生育。合而言之，人之终始问题，其实就是男女关系问题。\n“说以动，所归妹也”。自卦德说，兑说在下，震动在上，是说以动。说以动则徇乎情，与咸卦的止而说根本不同。自卦象看，女在男下，女先于男，主动从男，所欲归者是女。又，在下的是少女，在上的是长男，少女从长男，是所归者是少女不是长女，是侄娣不是嫡。所欲归者是女，所归者是少女，故云“所归妹也”。卦德说以动，则主乎情；卦象所归妹，则失于礼。既主乎情又失于礼，故凶。\n“征凶，位不当也。无攸利，柔乘刚也”。归妹这一卦之所以征凶无攸利，除了所归妹，说以动以外，还有位不当和柔乘刚两点。四方面的原因是相关联的。大率卦之德以说而动，不可能不失正；中爻失正，又必有乘刚之过。中爻不正，则阴阳失常，三五柔乘刚，则刚柔不顺。阴阳失常，刚柔不顺，凶是不可避免的。家人、睽、渐和归妹四卦都涉及男女关系，家人以中爻得位而正，睽以中爻失位而乖。渐以中爻得位而吉，归妹以中爻失位而凶。","X.N":"泽上有雷，阳动于上，阴感而从之，有女从男之象，故为归妹。归妹卦是从女子特别是少女的角度看问题的，那么从君子即男子、丈夫的立场看待归妹这一卦，应当悟出什么道理呢？孔子说君子应当永终知敝。永终谓男女配合，使生息嗣续，永久其传。敝是终的反面，知敝谓知有永终则必有敝坏，知有敝坏而预为之备，使生息嗣续不断。从具体的夫妇关系来说，永终即白头偕老之意，知敝谓君子要意识到归妹这种婚姻极易因生离隙而敝坏。归妹不同于恒卦之巽而动，渐卦之止而巽；归妹是说以动，少女因情说而动，这样的婚姻缺乏道义的基础，久必敝坏。君子知其有敝坏的可能，则当先为防备，思永其终。引申开来考虑，不唯夫妇有反目之时，天下之事莫不有终有敝，君子当远虑其终而防其敝坏。","Y1.N":"初九居于卦之最下又无正应，是娣不是嫡。是个怎样的娣呢？初九刚阳处说体而居于下，是个为人贤贞而卑顺的娣。然而娣非正配，纵然有贤德，也不过自善其身以承事君子而已，不太可能施展更大的作为。它很像一个跛子，虽能履地行路，然而免于废而已，不能及远。古代女子婚嫁须备具六礼，渐次而行，婚龄亦有一定的界限。不备六礼而嫁为失礼，少长非偶为失时，而侄娣不受此限。侄娣从嫡而归，六礼不备不为失礼。侄娣可以待年，少长非偶不嫌失时。就是说侄娣制度是社会承认的。故卦辞言征凶，而初九爻辞变征凶为征吉。","Y1.XN":"女子不备六礼而自嫁，是不正常的。但如果是侄娣的身份从嫡而嫁，那么，不备六礼，也是正常的。娣“跛能履吉”，是因为娣虽无内助的资格，却能安于其分，辅佐嫡夫人承助君子。","Y2.N":"九二实际上还是讲娣。眇能视和跛能履，意义是一样的。跛子两足一正一偏而能走路，眇者两目一昏一明而能视物，都是比喻娣的。娣位居偏侧，在夫妇生活中不允它有所作为，但是它在辅佐嫡夫人方面毕竟能发挥一定的作用。九二与初九也有不同之处，九二刚中，说明它是个意志坚定的贤慧女子，这一点是高于初九的。然而处境不如初九，初九无正应；无正应不好，决定它卑居娣的地位。九二有正应，但是是以阳应阴，本身有妇象，又与阴应，是反类现象，应而反类比无应更糟。九二处于这种境况，表明它作为娣，虽有一个夫君，但不是好夫君，时刻有遭遗弃的可能。所幸九二刚中，“利幽人之贞”，能够像被拘囚的、失去自由的幽人那样自执其志，坚如磐石，至死不渝，可望保持娣的地位，不发生变故。","Y2.XN":"虽夫君不贤，但九二作为娣，坚守幽人之正，矢志不渝，以己之贤对待夫君之不贤，是它分内应有的正常表现，不为过分，也不为不及。","Y3.N":"六三以阴居阳，不正又无应，是个不好嫁的女人，故有“归妹以须”之象。须，姊；娣，妹。姊与妹相对待。姊姊可嫁与人作

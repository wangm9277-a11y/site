        subSwitchGroup.style.display = "inline-flex";
        subSwitchGroup.innerHTML = `
          <button type="button" class="sub-switch-btn ${state.yaoSubMode === 'T' ? 'active' : ''}" data-yaosub="T">爻辞</button>
          <button type="button" class="sub-switch-btn ${state.yaoSubMode === 'X' ? 'active' : ''}" data-yaosub="X">小象</button>
        `;
        subSwitchGroup.querySelectorAll("button[data-yaosub]").forEach(btn => {
          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            const sub = btn.getAttribute("data-yaosub");
            if (state.yaoSubMode !== sub) {
              saveCurrentScrollPosition();
              state.yaoSubMode = sub;
              state.highlightQuery = "";
              state.isOriginalExpanded = false;
              saveState();
              renderContentZone(gua, true);
            }
          });
        });
      }

      state.currentCleanOriginal = origStr;
      const hl = (state.highlightQuery || "").trim();
      if (hl && origStr.includes(hl) && origStr.length > 52) {
        state.isOriginalExpanded = true;
      }
      const isScriptureMode = (mode === "G" || mode === "T" || mode === "X" || mode.startsWith("Y"));
      originalTextEl.innerHTML = isScriptureMode ? annotateScriptureHtml(origStr) : highlightTextHtml(origStr, hl);
      originalTextEl.classList.toggle("expanded", state.isOriginalExpanded);

      if (origStr.length > 52) {
        expandToggleBar.style.display = "flex";
        btnToggleExpand.textContent = state.isOriginalExpanded ? "收起经文" : "展开全文";
      } else {
        expandToggleBar.style.display = "none";
      }

      commentaryBody.innerHTML = formatParagraphsHtml(commStr);

      applyScrollOrSearchJump(contentScroll, resetScroll);

      updateCanwuButtons(gua);
      updateSealActionButtons();
    }

    function applyScrollOrSearchJump(contentScroll, restoreSaved) {
      if (!contentScroll) return;
      const hl = (state.highlightQuery || "").trim();
      if (hl) {
        requestAnimationFrame(() => {
          const commMark = document.querySelector("#commentaryBody mark.search-hl");
          if (commMark) {
            const stickyWrap = document.getElementById("originalStickyWrap");
            const stickyH = (stickyWrap && stickyWrap.style.display !== "none") ? stickyWrap.offsetHeight : 0;
            const targetTop = Math.max(0, commMark.offsetTop - stickyH - 18);
            contentScroll.style.scrollBehavior = "auto";
            contentScroll.scrollTop = targetTop;
            requestAnimationFrame(() => { contentScroll.style.scrollBehavior = ""; });
          } else {
            contentScroll.style.scrollBehavior = "auto";
            contentScroll.scrollTop = 0;
            requestAnimationFrame(() => { contentScroll.style.scrollBehavior = ""; });
          }
        });
        return;
      }
      if (restoreSaved) {
        const key = getScrollKey();
        const savedTop = state.scrollPositions[key] || 0;
        contentScroll.style.scrollBehavior = "auto";
        contentScroll.scrollTop = savedTop;
        requestAnimationFrame(() => { contentScroll.style.scrollBehavior = ""; });
      }
    }

    function updateCanwuButtons(gua) {
      const cuoLines = gua.lines.map(l => 1 - l);
      const zongLines = [...gua.lines].reverse();
      const jiaoId = PAIR_TO_ID[`${gua.lower}_${gua.upper}`];
      const huLowerLines = [gua.lines[1], gua.lines[2], gua.lines[3]];
      const huUpperLines = [gua.lines[2], gua.lines[3], gua.lines[4]];

      const cuoId = findGuaIdByLines(cuoLines);
      const zongId = findGuaIdByLines(zongLines);
      const huId = findGuaIdByLines([...huLowerLines, ...huUpperLines]);

      setRelationBtn("btnRelCuo", "relCuoText", cuoId);
      setRelationBtn("btnRelZong", "relZongText", zongId);
      setRelationBtn("btnRelJiao", "relJiaoText", jiaoId);
      setRelationBtn("btnRelHu", "relHuText", huId);
    }

    function findGuaIdByLines(targetLines) {
      const key = targetLines.join(",");
      for (const id in GUA_DATA) {
        if (GUA_DATA[id].lines.join(",") === key) return id;
      }
      return "01";
    }

    function setRelationBtn(btnId, textId, targetGuaId) {
      const btn = document.getElementById(btnId);
      const txt = document.getElementById(textId);
      if (!btn || !txt) return;
      const g = GUA_DATA[targetGuaId];
      txt.textContent = g.fullName;
      btn.onclick = () => {
        switchToGua(targetGuaId);
      };
    }

    let contentRafId = null;

    function renderAll(resetScroll = true, animInfo = null) {
      const gua = GUA_DATA[state.guaId];
      normalizeModeForGua(gua);

      document.getElementById("guaSeqNum").textContent = `第 ${gua.cnNum} 卦 ▾`;

      const upTrigram = TRIGRAM_MAP[gua.upper];
      const lowTrigram = TRIGRAM_MAP[gua.lower];

      const upPrev = TRIGRAM_LIST[(upTrigram.index - 1 + 8) % 8];
      const upNext = TRIGRAM_LIST[(upTrigram.index + 1) % 8];
      const lowPrev = TRIGRAM_LIST[(lowTrigram.index - 1 + 8) % 8];
      const lowNext = TRIGRAM_LIST[(lowTrigram.index + 1) % 8];

      const updateSlotContent = () => {
        document.getElementById("upperNatureText").textContent = gua.upperNature;
        document.getElementById("upperNameText").textContent = `${gua.upper} · ${upTrigram.attr}`;
        document.getElementById("lowerNatureText").textContent = gua.lowerNature;
        document.getElementById("lowerNameText").textContent = `${gua.lower} · ${lowTrigram.attr}`;

        const upPrevEl = document.getElementById("upperPrevPreview");
        const upNextEl = document.getElementById("upperNextPreview");
        const lowPrevEl = document.getElementById("lowerPrevPreview");
        const lowNextEl = document.getElementById("lowerNextPreview");
        if (upPrevEl) upPrevEl.innerHTML = `<span class="trigram-nature-char">${upPrev.nature}</span><div class="trigram-meta-col"><span class="trigram-gua-char">${upPrev.name} · ${upPrev.attr}</span><span class="trigram-pos-tag">上卦</span></div>`;
        if (upNextEl) upNextEl.innerHTML = `<span class="trigram-nature-char">${upNext.nature}</span><div class="trigram-meta-col"><span class="trigram-gua-char">${upNext.name} · ${upNext.attr}</span><span class="trigram-pos-tag">上卦</span></div>`;
        if (lowPrevEl) lowPrevEl.innerHTML = `<span class="trigram-nature-char">${lowPrev.nature}</span><div class="trigram-meta-col"><span class="trigram-gua-char">${lowPrev.name} · ${lowPrev.attr}</span><span class="trigram-pos-tag">下卦</span></div>`;
        if (lowNextEl) lowNextEl.innerHTML = `<span class="trigram-nature-char">${lowNext.nature}</span><div class="trigram-meta-col"><span class="trigram-gua-char">${lowNext.name} · ${lowNext.attr}</span><span class="trigram-pos-tag">下卦</span></div>`;
      };

      if (animInfo && animInfo.which) {
        const slotEl = document.getElementById(animInfo.which === "upper" ? "upperTrigramDisplay" : "lowerTrigramDisplay");
        slotEl.classList.remove("slide-in-from-right", "slide-in-from-left");
        updateSlotContent();
        if (!animInfo.fromDrag) {
          const inClass = animInfo.dir > 0 ? "slide-in-from-right" : "slide-in-from-left";
          void slotEl.offsetWidth;
          slotEl.classList.add(inClass);
        }
      } else {
        updateSlotContent();
      }

      renderTrigramPips(gua);
      renderHexagramSvg(gua);
      var _pairCap = document.getElementById("trigramPairCaption");
      if (_pairCap) _pairCap.textContent = `上${gua.upper} · 下${gua.lower}`;

      state.outerRingAngle = getShortestTargetAngle(state.outerRingAngle, upTrigram.index);
      state.innerRingAngle = getShortestTargetAngle(state.innerRingAngle, lowTrigram.index);

      const outerRingEl = document.getElementById("compassOuterRing");
      const innerRingEl = document.getElementById("compassInnerRing");
      if (outerRingEl) outerRingEl.style.transform = `rotate(${state.outerRingAngle}deg)`;
      if (innerRingEl) innerRingEl.style.transform = `rotate(${state.innerRingAngle}deg)`;

      const compassNameEl = document.getElementById("compassGuaName");
      compassNameEl.textContent = gua.name;
      compassNameEl.setAttribute("font-size", gua.name.length > 1 ? "15.5" : "21.5");
      compassNameEl.setAttribute("x", "54");
      compassNameEl.setAttribute("y", "54.5");

      document.getElementById("compassFullName").innerHTML = `<span class="compass-zh">${gua.fullName}</span><span class="compass-dot">·</span><span class="compass-py">${gua.pinyin.normalize('NFC')}</span>`;

      const hasWenyan = Boolean(gua.blocks["W1"]);
      document.getElementById("btnTabWenyan").disabled = !hasWenyan;

      document.querySelectorAll("#guaTabRow .text-btn").forEach(btn => {
        const tab = btn.getAttribute("data-tab");
        btn.classList.toggle("active", state.activeMode === tab);
      });

      renderYaoButtons(gua);
      updateCanwuButtons(gua);

      // If triggered from a finger drag/swipe, schedule the heavy scripture/commentary DOM build on the next animation frame so the drum & Bagua rotation start in <1ms with zero frame drop!
      if (animInfo && animInfo.fromDrag) {
        if (contentRafId) cancelAnimationFrame(contentRafId);
        contentRafId = requestAnimationFrame(() => {
          renderContentZone(GUA_DATA[state.guaId], resetScroll);
          contentRafId = null;
        });
      } else {
        renderContentZone(gua, resetScroll);
      }
    }

    function stepTrigram(which, delta, fromDrag = false) {
      const gua = GUA_DATA[state.guaId];
      const currentName = which === "upper" ? gua.upper : gua.lower;
      const curIdx = TRIGRAM_MAP[currentName].index;
      const nextIdx = (curIdx + delta + TRIGRAM_LIST.length) % TRIGRAM_LIST.length;
      const nextTrigramName = TRIGRAM_LIST[nextIdx].name;

      const newUpper = which === "upper" ? nextTrigramName : gua.upper;
      const newLower = which === "lower" ? nextTrigramName : gua.lower;
      const nextGuaId = PAIR_TO_ID[`${newUpper}_${newLower}`];

      if (nextGuaId) {
        triggerHaptic(8);
        pushHistorySnapshot();
        state.guaId = nextGuaId;
        state.activeMode = "G";
        state.highlightQuery = "";
        state.yanStep = 0;
        state.isOriginalExpanded = false;
        saveState();
        renderAll(true, { which, dir: delta, fromDrag });
      }
    }

    function selectSpecificTrigram(which, trigramName) {
      const gua = GUA_DATA[state.guaId];
      const currentName = which === "upper" ? gua.upper : gua.lower;
      if (currentName === trigramName) return;

      const curIdx = TRIGRAM_MAP[currentName].index;
      const nextIdx = TRIGRAM_MAP[trigramName].index;
      const dir = nextIdx > curIdx ? 1 : -1;

      const newUpper = which === "upper" ? trigramName : gua.upper;
      const newLower = which === "lower" ? trigramName : gua.lower;
      const nextGuaId = PAIR_TO_ID[`${newUpper}_${newLower}`];

      if (nextGuaId) {
        pushHistorySnapshot();
        state.guaId = nextGuaId;
        state.activeMode = "G";
        state.highlightQuery = "";
        state.yanStep = 0;
        state.isOriginalExpanded = false;
        saveState();
        renderAll(true, { which, dir });
      }
    }

    // 罗盘 → 当前卦经传速览（整个盘为一体，中心所示为何卦即取何卦）
    function yaoBarsHtml(lines, idx) {
      if (lines[idx] === 1) return '<span class="pure-bar yang"></span>';
      return '<span class="pure-bars-yin"><span class="pure-bar yin"></span><span class="pure-bar yin"></span></span>';
    }

    function openPureSheet() {
      const id = state.guaId;
      const gua = GUA_DATA[id];
      const sheet = document.getElementById("pureSheet");
      const nameEl = document.getElementById("pureSheetName");
      const bodyEl = document.getElementById("pureSheetBody");
      if (!gua || !sheet || !bodyEl) return;

      nameEl.textContent = gua.fullName + "　第 " + gua.id + " 卦";

      let html = "";
      const guaCi = (gua.blocks && gua.blocks["G"]) || "";
      html += '<div class="pure-row is-gua" data-mode="G">' +
        '<div class="pure-row-yao"><span class="pure-row-label">卦辞</span></div>' +
        '<div class="pure-row-text">' + escapeHtml(guaCi) + '</div>' +
        '<span class="pure-row-tail">›</span></div>';

      for (let k = 1; k <= 6; k++) {
        const ciRaw = (gua.blocks && gua.blocks["Y" + k + ".T"]) || "";
        const ci = ciRaw.replace(/^(初[六九]|[六九][二三四五]|上[六九])[，,、]\s*/, "");
        const label = (gua.yaoLabels && gua.yaoLabels[k - 1]) || ("第" + k + "爻");
        html += '<div class="pure-row" data-yao="' + k + '">' +
          '<div class="pure-row-yao"><span class="pure-row-label">' + label + '</span>' +
          yaoBarsHtml(gua.lines, k - 1) + '</div>' +
          '<div class="pure-row-text">' + escapeHtml(ci) + '</div>' +
          '<span class="pure-row-tail">›</span></div>';
      }

      bodyEl.innerHTML = html;
      bodyEl.scrollTop = 0;
      sheet.classList.add("open");
      sheet.setAttribute("aria-hidden", "false");

      bodyEl.onclick = function (ev) {
        const row = ev.target.closest(".pure-row");
        if (!row) return;
        const yao = row.getAttribute("data-yao");
        const mode = yao ? ("Y" + yao) : "G";
        const sub = state.yaoSubMode === "X" ? "X" : "T";
        closePureSheet();
        switchToGua(id, mode, sub, "", true);
      };
    }

    function closePureSheet() {
      const sheet = document.getElementById("pureSheet");
      if (!sheet) return;
      sheet.classList.remove("open");
      sheet.setAttribute("aria-hidden", "true");
    }

    function initPureSheet() {
      const sheet = document.getElementById("pureSheet");
      if (!sheet) return;
      const closeBtn = document.getElementById("pureSheetClose");
      if (closeBtn) closeBtn.addEventListener("click", closePureSheet);
      sheet.addEventListener("click", function (e) {
        if (e.target === sheet) closePureSheet();
      });
      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") closePureSheet();
      });
      // 整个罗盘为一体：点任何处，都取中心所示之卦
      // 捕获阶段拦截，避免同时触发罗盘自身的点击（会弹卦盘抽屉）
      document.addEventListener("click", function (e) {
        const wrap = e.target.closest ? e.target.closest("#compassWrap") : null;
        if (!wrap) return;
        e.stopPropagation();
        e.preventDefault();
        openPureSheet();
      }, true);
    }

    function switchToGua(targetGuaId, targetMode = "G", targetYaoSub = "T", highlightQuery = "", recordHistory = true) {
      if (!GUA_DATA[targetGuaId]) return;
      if (recordHistory && (targetGuaId !== state.guaId || targetMode !== state.activeMode || targetYaoSub !== state.yaoSubMode)) {
        pushHistorySnapshot();
      } else {
        saveCurrentScrollPosition();
      }
      state.guaId = targetGuaId;
      state.activeMode = targetMode;
      state.yaoSubMode = targetYaoSub;
      state.highlightQuery = highlightQuery || "";
      state.yanStep = 0;
      state.isOriginalExpanded = false;
      saveState();
      renderAll(true, { which: "upper", dir: 1 });
    }

    function selectYao(yaoKey) {
      saveCurrentScrollPosition();
      if (state.activeMode === yaoKey) {
        state.yaoSubMode = state.yaoSubMode === "T" ? "X" : "T";
      } else {
        state.activeMode = yaoKey;
        state.yaoSubMode = "T";
      }
      state.highlightQuery = "";
      state.isOriginalExpanded = false;
      saveState();
      renderAll(true);
    }

    // 「变」：爻变之卦（选中某一爻后点击变爻，进入对应的之卦并保持该爻选中）
    function transformActiveYao() {
      if (!state.activeMode || !state.activeMode.startsWith("Y")) return;
      const gua = GUA_DATA[state.guaId];
      if (!gua) return;

      let targetGuaId = null;
      let targetMode = state.activeMode;

      if (state.activeMode === "Y7") {
        // 用九（乾六爻皆变之坤） / 用六（坤六爻皆变之乾）
        const flippedAll = gua.lines.map(l => 1 - l);
        targetGuaId = findGuaIdByLines(flippedAll);
        targetMode = "G";
      } else {
        const yaoNum = parseInt(state.activeMode.slice(1), 10);
        if (isNaN(yaoNum) || yaoNum < 1 || yaoNum > 6) return;
        const newLines = [...gua.lines];
        newLines[yaoNum - 1] = 1 - newLines[yaoNum - 1];
        targetGuaId = findGuaIdByLines(newLines);
        targetMode = "Y" + yaoNum;
      }

      if (targetGuaId && GUA_DATA[targetGuaId]) {
        triggerHaptic(12);
        const btnBian = document.getElementById("btnBian");
        if (btnBian) {
          btnBian.classList.remove("pulse-anim");
          void btnBian.offsetWidth;
          btnBian.classList.add("pulse-anim");
        }
        if (state.pendingYanCopy) {
          state.pendingYanCopy = false;
          copyDivinationToClipboard(state.guaId, state.activeMode, targetGuaId);
        }
        switchToGua(targetGuaId, targetMode, "T", "", true);
      }
    }

    // 「归」：返回上一卦
    function returnToPrevGua() {
      if (state.historyStack.length === 0) return;
      saveCurrentScrollPosition();
      const prev = state.historyStack.pop();
      if (!prev || !GUA_DATA[prev.guaId]) return;
      triggerHaptic(8);
      const btnGui = document.getElementById("btnGui");
      if (btnGui) {
        btnGui.classList.remove("pulse-anim");
        void btnGui.offsetWidth;
        btnGui.classList.add("pulse-anim");
      }
      state.guaId = prev.guaId;
      state.activeMode = prev.activeMode || "G";
      state.yaoSubMode = prev.yaoSubMode || "T";
      state.highlightQuery = "";
      state.yanStep = 0;
      state.isOriginalExpanded = false;
      saveState();
      renderAll(true, { which: "upper", dir: -1 });
    }

    // 「衍」：点击三次后随机进入一卦与一爻，再点「变」即可变爻
    function handleYanClick() {
      triggerHaptic(10);
      const btnYan = document.getElementById("btnYan");
      if (btnYan) {
        btnYan.classList.remove("pulse-anim");
        void btnYan.offsetWidth;
        btnYan.classList.add("pulse-anim");
      }
      state.yanStep = (state.yanStep || 0) + 1;
      if (state.yanStep < 3) {
        updateSealActionButtons();
        return;
      }
      state.yanStep = 0;
      state.pendingYanCopy = true;
      const randGuaNum = Math.floor(Math.random() * 64) + 1;
      const randGuaId = String(randGuaNum).padStart(2, "0");
      const randYaoNum = Math.floor(Math.random() * 6) + 1;
      switchToGua(randGuaId, "Y" + randYaoNum, "T", "", true);
    }

    // Silky-Smooth 120Hz Follow-the-Finger Drum & Coupled Bagua Ring Swipe Handler
    // Works anywhere on .trigram-card (including starting on pips or arrows!) without blocking taps
    function attachSwipeHandler(cardEl, slotId, which) {
      let startX = null;
      let startY = null;
      let startTime = 0;
      let isDragging = false;
      const slotEl = document.getElementById(slotId);
      const ringId = which === "upper" ? "compassOuterRing" : "compassInnerRing";

      // 跟手参数：一格 56px，最多跟 2.5 格，越界加阻尼
      const STEP_PX = 56;
      const FOLLOW_LIMIT = STEP_PX * 1.15;
      const RUBBER = 0.25;
      const DEG_PER_STEP = 45;

      const damped = (dx) => {
        const a = Math.abs(dx);
        if (a <= FOLLOW_LIMIT) return dx;
        return Math.sign(dx) * (FOLLOW_LIMIT + (a - FOLLOW_LIMIT) * RUBBER);
      };

      const updateFollowTransform = (rawDx) => {
        const scale = state.appliedScale || 1;
        const f = damped(rawDx / scale);
        const ringEl = document.getElementById(ringId);
        const rotY = Math.max(-22, Math.min(22, (-f / STEP_PX) * 9));
        slotEl.style.transform =
          `translate3d(${f.toFixed(1)}px, 0, 0) rotateY(${rotY.toFixed(1)}deg)`;
        if (ringEl) {
          const baseAngle = which === "upper"
            ? (state.outerRingAngle || 0)
            : (state.innerRingAngle || 0);
          ringEl.style.transition = "none";
          ringEl.style.transform =
            `rotate(${(baseAngle + (f / STEP_PX) * DEG_PER_STEP).toFixed(1)}deg)`;
        }
      };

      const finishDrag = (rawDx, rawDy) => {
        const scale = state.appliedScale || 1;
        const dx = rawDx / scale;
        const dy = rawDy / scale;
        const elapsed = Math.max(1, performance.now() - startTime);
        const velocity = Math.abs(dx) / elapsed;
        const ringEl = document.getElementById(ringId);

        cardEl.classList.remove("is-dragging");
        if (ringEl) ringEl.style.transition = "";

        if (!isDragging) {
          slotEl.style.transition = "transform 0.26s cubic-bezier(0.22, 1, 0.36, 1)";
          slotEl.style.transform = "translate3d(0,0,0) rotateY(0deg)";
          return;
        }

        // 松手吸附：鼓轮一次只露出一个邻卦，落点也只走一格
        const f = damped(dx);
        let steps = 0;
        if (Math.abs(f) >= STEP_PX * 0.5) {
          steps = f > 0 ? -1 : 1;
        } else if (Math.abs(dx) > 16 && velocity > 0.5) {
          steps = dx > 0 ? -1 : 1;
        }

        if (steps !== 0) {
          cardEl._justDragged = true;
          setTimeout(() => { cardEl._justDragged = false; }, 80);

          const dir = steps > 0 ? 1 : -1;
          stepTrigram(which, steps, true);

          const enterOffset = dir > 0 ? 26 : -26;
          slotEl.style.transition = "none";
          slotEl.style.transform = `translate3d(${enterOffset}px, 0, 0) rotateY(0deg)`;
          requestAnimationFrame(() => {
            slotEl.style.transition = "transform 0.26s cubic-bezier(0.22, 1, 0.36, 1)";
            slotEl.style.transform = "translate3d(0,0,0) rotateY(0deg)";
          });
        } else {
          slotEl.style.transition = "transform 0.26s cubic-bezier(0.22, 1, 0.36, 1)";
          slotEl.style.transform = "translate3d(0,0,0) rotateY(0deg)";
        }
      };

      // Touch events (allows starting anywhere on the card, even over pips/buttons)
      cardEl.addEventListener("touchstart", (e) => {
        if (e.touches.length === 1) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          startTime = performance.now();
          isDragging = false;
          slotEl.classList.remove("slide-in-from-right", "slide-in-from-left");
        }
      }, { passive: true });

      cardEl.addEventListener("touchmove", (e) => {
        if (startX === null || e.touches.length === 0) return;
        const rawDx = e.touches[0].clientX - startX;
        const rawDy = e.touches[0].clientY - startY;
        if (!isDragging && Math.abs(rawDx) > 3.5 && Math.abs(rawDx) >= Math.abs(rawDy) * 0.65) {
          isDragging = true;
          slotEl.style.transition = "none";
          cardEl.classList.add("is-dragging");
        }
        if (isDragging) {
          if (e.cancelable) e.preventDefault();
          updateFollowTransform(rawDx);
        }
      }, { passive: false });

      const onTouchEndOrCancel = (e) => {
        if (startX === null) return;
        let rawDx = 0, rawDy = 0;
        if (e.changedTouches && e.changedTouches.length > 0) {
          rawDx = e.changedTouches[0].clientX - startX;
          rawDy = e.changedTouches[0].clientY - startY;
        }
        finishDrag(rawDx, rawDy);
        startX = null;
        startY = null;
        isDragging = false;
      };

      cardEl.addEventListener("touchend", onTouchEndOrCancel, { passive: true });
      cardEl.addEventListener("touchcancel", onTouchEndOrCancel, { passive: true });

      // Mouse drag events (desktop & tablet trackpad/mouse)
      let mouseDownX = null;
      let mouseDownY = null;
      const onMouseMove = (e) => {
        if (mouseDownX === null) return;
        const rawDx = e.clientX - mouseDownX;
        const rawDy = e.clientY - mouseDownY;
        if (!isDragging && Math.abs(rawDx) > 3.5) {
          isDragging = true;
          slotEl.style.transition = "none";
          cardEl.classList.add("is-dragging");
        }
        if (isDragging) {
          updateFollowTransform(rawDx);
        }
      };
      const onMouseUp = (e) => {
        if (mouseDownX === null) return;
        const rawDx = e.clientX - mouseDownX;
        const rawDy = e.clientY - mouseDownY;
        window.removeEventListener("mousemove", onMouseMove);
        window.removeEventListener("mouseup", onMouseUp);
        finishDrag(rawDx, rawDy);
        mouseDownX = null;
        mouseDownY = null;
        isDragging = false;
      };
      cardEl.addEventListener("mousedown", (e) => {
        mouseDownX = e.clientX;
        mouseDownY = e.clientY;
        startTime = performance.now();
        isDragging = false;
        slotEl.classList.remove("slide-in-from-right", "slide-in-from-left");
        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", onMouseUp);
      });
    }

        const yaoLabel = (benGua.yaoLabels && benGua.yaoLabels[n - 1]) || "";
        yaoPart = "第" + cn + "爻（" + yaoLabel + "）";

        "请结合卦辞、爻辞与变爻之象，详细分析吉凶走向，并针对所测之事给出具体建议。";

    function showToast(msg) {
      const toast = document.getElementById("folioToast");
      toast.textContent = msg;
      toast.classList.add("visible");
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {

      }, 1800);

    function copyTextToClipboard(text, toastMsg = "已复制经文") {
      if (!text) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(toastMsg);
        }).catch(() => {
          fallbackCopy(text, toastMsg);
        });
      } else {
        fallbackCopy(text, toastMsg);
      }
    }

    function fallbackCopy(text, toastMsg) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast(toastMsg);
      } catch (e) {
        showToast("复制完成");
      }
    }

    function renderSearchResults(container, query) {
      const results = [];
      const qLower = query.toLowerCase();

      for (let i = 1; i <= 64; i++) {
        const id = String(i).padStart(2, "0");
        const g = GUA_DATA[id];

        if (
          g.id === query ||
          g.name.includes(query) ||
          g.fullName.includes(query) ||
          g.shortFullName.includes(query) ||
          g.pinyin.toLowerCase().includes(qLower)
        ) {
          results.push({
            guaId: id,
            mode: "G",
            yaoSub: "T",
            title: `${id} ${g.fullName}（${g.pinyin}）`,
            snippet: g.blocks["G"]
          });
        }

        for (const bKey in g.blocks) {
          const fullCode = `${id}.${bKey}`;
          const text = pickComm(g, bKey);
          if (fullCode.toLowerCase() === qLower || text.includes(query)) {
            let mode = "G";
            let yaoSub = "T";
            if (bKey === "P") mode = "P";
            else if (bKey.startsWith("G")) mode = "G";
            else if (bKey.startsWith("T")) mode = "T";
            else if (bKey.startsWith("X")) mode = "X";
            else if (bKey.startsWith("W")) mode = "W";
            else if (bKey === "Z") mode = "Z";
            else if (bKey.startsWith("Y")) {
              mode = bKey.split(".")[0];
              yaoSub = bKey.includes("X") ? "X" : "T";
            }

            const idx = text.indexOf(query);
            let snippet = text;
            if (idx !== -1 && text.length > 68) {
              const start = Math.max(0, idx - 18);
              const end = Math.min(text.length, idx + 48);
              snippet = (start > 0 ? "…" : "") + text.slice(start, end) + (end < text.length ? "…" : "");
            } else if (text.length > 68) {
              snippet = text.slice(0, 66) + "…";
            }

            results.push({
              guaId: id,
              mode,
              yaoSub,
              title: `${id} ${g.fullName}`,
              snippet
            });
            if (results.length >= 45) break;
          }
        }
        if (results.length >= 45) break;
      }

      if (results.length === 0) {
        container.innerHTML = `<div style="padding: 32px 0; text-align: center; color: var(--ink-muted); font-size: 13px;">未检索到与「${escapeHtml(query)}」相关的经传或讲解</div>`;
        return;
      }

      let html = `<div class="search-result-list">`;
      results.forEach((r, idx) => {
        html += `
          <div class="search-item" data-ridx="${idx}">
            <div class="search-item-head">
              <span class="search-item-title">${highlightTextHtml(r.title, query)}</span>
            </div>
            <div class="search-item-snippet">${highlightTextHtml(r.snippet, query)}</div>
          </div>
        `;
      });
      html += `</div>`;
      container.innerHTML = html;

      container.querySelectorAll(".search-item").forEach(item => {
        item.addEventListener("click", () => {
          const r = results[parseInt(item.getAttribute("data-ridx"), 10)];
          closeDrawer();
          switchToGua(r.guaId, r.mode, r.yaoSub, query, true);
        });
      });
    }

          bgGrad.addColorStop(1, "#8E1D14");
          ctx.fillStyle = bgGrad;
          ctx.beginPath();
          ctx.roundRect(0, 0, 512, 512, 112);
          ctx.fill();

          ctx.strokeStyle = "rgba(255, 244, 224, 0.45)";
          ctx.lineWidth = 14;
          ctx.beginPath();
          ctx.roundRect(38, 38, 436, 436, 76);
          ctx.stroke();

          ctx.save();
          ctx.scale(512 / 24, 512 / 24);
          ctx.strokeStyle = "#FFF9F0";
          ctx.lineWidth = 1.55;
          ctx.lineCap = "round";
          ctx.lineJoin = "round";

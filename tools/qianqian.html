<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-orientation="portrait" data-ratio="20:9">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="乾乾学易" />
  <meta name="application-name" content="乾乾学易" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="theme-color" id="metaThemeColor" content="#F7F4EC" />
  <link rel="apple-touch-icon" id="appleTouchIconLink" href="" />
  <link rel="icon" type="image/png" id="faviconLink" href="" />
  <link rel="manifest" id="pwaManifestLink" href="" />
  <title>乾乾学易 · 六十四卦经传精研与上下卦推演</title>
  <style>
    :root {
      /* Light Theme: 宋韵宣纸 · 玉石玄墨 (Oriental Luxury Editorial) */
      --bg-workspace: #EAE4D7;
      --bg-paper: #F7F4EC;
      --bg-card: #FCFBF7;
      --bg-elevated: #F1ECE1;
      --bg-glass: rgba(252, 251, 247, 0.92);
      --ink-primary: #181715;
      --ink-secondary: #3D3934;
      --ink-muted: #736B5E;
      --ink-faint: #A39B8B;
      --border-hairline: rgba(140, 122, 91, 0.18);
      --border-accent: rgba(168, 139, 92, 0.38);

      /* High-craft Yao & Seal Palette */
      --vermilion: #B8332A;
      --vermilion-soft: rgba(184, 51, 42, 0.10);
      --vermilion-glow: rgba(184, 51, 42, 0.26);
      --gold-bronze: #A88652;
      --gold-light: #D4BE98;

      /* Distinct Yang vs Yin Yao Bar Colors */
      --yang-fill-start: #23211E;
      --yang-fill-end: #38342F;
      --yang-stroke: #141311;
      --yin-fill-start: #706B63;
      --yin-fill-end: #857F75;
      --yin-stroke: #5E5952;
      --yao-active-start: #C8372D;
      --yao-active-end: #9E231B;

      /* Bagua Compass Palette (Light: Warm Antique Ivory Jade & Gilt Bronze) */
      --compass-rim-1: #E5CFA3;
      --compass-rim-2: #BA965E;
      --compass-rim-3: #8F6D3B;
      --compass-rim-4: #CFAF78;
      --compass-rim-stroke: #7A5C30;
      --compass-dial-center: #FDFCF9;
      --compass-dial-mid: #F3EDE0;
      --compass-dial-edge: #E3D9C6;
      --compass-inner-ring-bg: rgba(246, 240, 228, 0.92);
      --compass-core-center: #FFFDF9;
      --compass-core-mid: #F8F3E8;
      --compass-core-edge: #EBE2D0;
      --compass-trigram-text: #2C2823;
      --compass-inner-text: #5A4628;
      --compass-yang-bar: #A67C46;
      --compass-yin-bar: #7D7467;
      --compass-center-char: #B8332A;
      --compass-ring-line: rgba(156, 126, 78, 0.28);
      --compass-tick-color: #A88652;

      --shadow-frame: 0 24px 60px rgba(28, 22, 14, 0.14), 0 4px 14px rgba(28, 22, 14, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.75);
      --shadow-card: 0 4px 14px rgba(36, 28, 18, 0.05), 0 1px 3px rgba(36, 28, 18, 0.03), inset 0 1px 0 rgba(255, 255, 255, 0.82);
      --fade-bottom: linear-gradient(to bottom, rgba(247, 244, 236, 0), #F7F4EC 85%);

      --font-serif: "Noto Serif SC", "Songti SC", "STSong", "Source Han Serif SC", "SimSun", serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    html[data-theme="dark"] {
      /* Dark Theme: 玄夜鎏金 · 紫禁暮色 (Obsidian & Bronze Gold) */
      --bg-workspace: #0B0B0C;
      --bg-paper: #131315;
      --bg-card: #1B1B1E;
      --bg-elevated: #232327;
      --bg-glass: rgba(27, 27, 30, 0.94);
      --ink-primary: #EFECE6;
      --ink-secondary: #C7C1B6;
      --ink-muted: #8E877B;
      --ink-faint: #5C574F;
      --border-hairline: rgba(212, 190, 152, 0.12);
      --border-accent: rgba(212, 190, 152, 0.30);

      --vermilion: #D94E43;
      --vermilion-soft: rgba(217, 78, 67, 0.15);
      --vermilion-glow: rgba(217, 78, 67, 0.35);
      --gold-bronze: #C9A66B;
      --gold-light: #8A7248;

      /* Dark Mode Yang (Warm Ivory Gold) vs Yin (Deep Slate Jade) */
      --yang-fill-start: #E5DAC3;
      --yang-fill-end: #CBB994;
      --yang-stroke: #F3EAD8;
      --yin-fill-start: #6E6A63;
      --yin-fill-end: #57534D;
      --yin-stroke: #858078;
      --yao-active-start: #E04F44;
      --yao-active-end: #B83228;

      /* Bagua Compass Palette (Dark: Warm Imperial Amber-Jade & Burnished Gold) */
      --compass-rim-1: #F0DCB4;
      --compass-rim-2: #C9A368;
      --compass-rim-3: #8E6B38;
      --compass-rim-4: #DFC089;
      --compass-rim-stroke: #B08D54;
      --compass-dial-center: #352E25;
      --compass-dial-mid: #2B241D;
      --compass-dial-edge: #211B15;
      --compass-inner-ring-bg: rgba(56, 47, 37, 0.95);
      --compass-core-center: #42382C;
      --compass-core-mid: #342C22;
      --compass-core-edge: #282119;
      --compass-trigram-text: #F5EDE0;
      --compass-inner-text: #E8C98E;
      --compass-yang-bar: #E5C283;
      --compass-yin-bar: #A89B87;
      --compass-center-char: #EF5B50;
      --compass-ring-line: rgba(226, 194, 138, 0.28);
      --compass-tick-color: #DFBF86;

      --shadow-frame: 0 28px 68px rgba(0, 0, 0, 0.72), 0 0 1px rgba(212, 190, 152, 0.28), inset 0 1px 0 rgba(255, 245, 225, 0.06);
      --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.36), inset 0 1px 0 rgba(255, 245, 225, 0.05);
      --fade-bottom: linear-gradient(to bottom, rgba(19, 19, 21, 0), #131315 85%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-workspace);
      color: var(--ink-primary);
      font-family: var(--font-serif);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .workspace-shell {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 0;
    }

    /* Main Folio Frame: Sized & Scaled Dynamically by applyViewportLayout() with ZERO top/bottom blank bars */
    .folio-frame {
      position: relative;
      flex-shrink: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-paper);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform-origin: center center;
      transition: background-color 0.3s ease;
    }

    .folio-frame.framed-card {
      border-radius: 18px;
      border: 1px solid var(--border-accent);
      box-shadow: var(--shadow-frame);
    }

    /* Subtle classical watermark background pattern */
    .folio-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.32;
      background-image: radial-gradient(var(--border-hairline) 1px, transparent 1px);
      background-size: 18px 18px;
    }

    /* ==================== UPPER / LEFT OPERATION ZONE ==================== */
    .upper-zone {
      position: relative;
      z-index: 10;
      flex: 0 0 auto;
      padding: 9px 14px 8px;
      padding-top: calc(9px + env(safe-area-inset-top, 0px));
      display: flex;
      flex-direction: column;
      gap: 7px;
      border-bottom: 1px solid var(--border-hairline);
      background: var(--bg-paper);
    }

    /* 1. Top Header Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 26px;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer;
    }

    .brand-seal {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 23px;
      height: 23px;
      border-radius: 5px;
      background: linear-gradient(145deg, #C8382E 0%, #9E2219 100%);
      color: #FFF9F2;
      border: 1px solid rgba(255, 238, 210, 0.32);
      box-shadow:
        0 2px 6px var(--vermilion-glow),
        inset 0 1px 1px rgba(255, 255, 255, 0.28),
        inset 0 -1px 2px rgba(60, 10, 6, 0.35);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    .brand-seal svg {
      width: 16px;
      height: 16px;
      display: block;
    }

    .app-title {
      font-family: var(--font-serif);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 3px;
      color: var(--ink-primary);
    }

    .top-right-controls {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    /* Circular Xiaozhuan Action Buttons (归 · 变 · 衍) next to Settings */
    .seal-circle-btn {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-accent);
      box-shadow: var(--shadow-card);
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      position: relative;
      transition: transform 0.16s ease, border-color 0.2s ease, color 0.2s ease, background-color 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    .seal-circle-btn svg {
      width: 15.5px;
      height: 15.5px;
      display: block;
      overflow: visible;
    }

    .seal-circle-btn .seal-char {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 600;
      line-height: 1;
      display: block;
      letter-spacing: 0;
      transform: translateY(0.3px);
      pointer-events: none;
    }

    .seal-circle-btn:hover:not(:disabled) {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }

    .seal-circle-btn:active:not(:disabled) {
      transform: scale(0.92);
    }

    .seal-circle-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* Highlighted state when a Yao is selected and ready to transform (变), or when 衍 is in progress */
    .seal-circle-btn.ready-accent {
      border-color: var(--vermilion);
      color: var(--vermilion);
      background-color: var(--vermilion-soft);
      box-shadow: 0 2px 7px var(--vermilion-glow);
    }

    .seal-circle-btn[data-yan-step="1"] {
      border-color: var(--gold-bronze);
      color: var(--gold-bronze);
      box-shadow: 0 0 0 1.5px rgba(166, 130, 76, 0.28);
    }

    .seal-circle-btn[data-yan-step="2"] {
      border-color: var(--vermilion);
      color: var(--vermilion);
      background-color: var(--vermilion-soft);
      box-shadow: 0 0 0 2px var(--vermilion-glow);
    }

    @keyframes sealPulseOnce {
      0% { transform: scale(0.88); }
      55% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .seal-circle-btn.pulse-anim {
      animation: sealPulseOnce 0.26s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Search Keyword Highlight Mark */
    mark.search-hl {
      background-color: rgba(184, 58, 46, 0.18);
      color: var(--vermilion);
      font-weight: 600;
      border-radius: 3px;
      padding: 0 2px;
      box-shadow: 0 1px 0 rgba(184, 58, 46, 0.38);
    }

    html[data-theme="dark"] mark.search-hl {
      background-color: rgba(214, 90, 74, 0.26);
      color: #F2796B;
      box-shadow: 0 1px 0 rgba(214, 90, 74, 0.45);
    }

    /* Pure Icon Settings Button (No text label per user request) */
    .settings-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .settings-icon-btn {
      width: 27px;
      height: 27px;
      border-radius: 50%;
      background-color: var(--bg-card);
      border: 1px solid var(--border-accent);
      color: var(--ink-secondary);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      box-shadow: var(--shadow-card);
    }

    .settings-icon-btn:hover,
    .settings-icon-btn.active {
      border-color: var(--vermilion);
      color: var(--vermilion);
      transform: rotate(22deg);
    }

    /* Settings Popover Panel */
    .settings-popover {
      position: absolute;
      top: calc(100% + 7px);
      right: -36px;
      width: 258px;
      background-color: var(--bg-glass);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border-accent);
      border-radius: 13px;
      padding: 10px 12px;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      display: flex;
      flex-direction: column;
      gap: 7.5px;
      opacity: 0;
      transform: translateY(-6px) scale(0.97);
      pointer-events: none;
      transition: opacity 0.18s ease, transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 60;
    }

    .settings-popover.open {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    html {
      --theme-taiji-a: #FFFFFF;
      --theme-taiji-b: #181715;
    }

    html[data-theme="dark"] {
      --theme-taiji-a: #EFECE6;
      --theme-taiji-b: #000000;
    }

    html .settings-popover {
      background-color: #FFFFFF;
      border-color: rgba(0, 0, 0, 0.10);
    }

    html[data-theme="dark"] .settings-popover {
      background-color: #000000;
      border-color: rgba(255, 255, 255, 0.14);
    }

    .theme-taiji {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      background: transparent;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transform: rotate(0deg);
      transition: transform 0.34s cubic-bezier(0.34, 0.02, 0.2, 1);
      will-change: transform;
      margin: 3px 0 0;
      align-self: center;
      -webkit-tap-highlight-color: transparent;
    }

    .theme-taiji .t-light {
      display: none;
    }

    html[data-theme="dark"] .theme-taiji .t-dark {
      display: none;
    }

    html[data-theme="dark"] .theme-taiji .t-light {
      display: inline;
    }

    .theme-taiji svg {
      width: 32px;
      height: 32px;
      display: block;
      pointer-events: none;
    }

    html.theme-fading,
    html.theme-fading body,
    html.theme-fading .folio-frame,
    html.theme-fading .top-bar,
    html.theme-fading .trigram-card,
    html.theme-fading .content-scroll,
    html.theme-fading .commentary-section,
    html.theme-fading .commentary-body,
    html.theme-fading .settings-popover {
      transition: background-color 0.26s ease, color 0.26s ease, border-color 0.26s ease, box-shadow 0.26s ease;
    }

    .set-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .set-label {
      font-family: var(--font-sans);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink-muted);
    }

    .set-seg {
      display: flex;
      align-items: center;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 7px;
      padding: 2px;
      gap: 2px;
    }

    .set-opt-btn {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 5px;
      padding: 4px 3px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-secondary);
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
      white-space: nowrap;
      text-align: center;
    }

    .set-opt-btn:hover:not(.active) {
      color: var(--ink-primary);
      background-color: rgba(168, 134, 82, 0.10);
    }

    .set-opt-btn.active {
      background-color: var(--vermilion);
      color: #FFFDF9;
      font-weight: 600;
      box-shadow: 0 1px 5px var(--vermilion-glow);
    }

    /* High-Craft Inlaid Jade & Gilt-Bronze Sequence Plaque */
    .gua-seq-badge {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-family: var(--font-serif);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink-primary);
      background: linear-gradient(160deg, var(--bg-card) 0%, var(--bg-elevated) 55%, rgba(168, 134, 82, 0.16) 100%);
      border: 1px solid var(--border-accent);
      padding: 3.5px 9px 3.5px 8px;
      border-radius: 7px;
      cursor: pointer;
      box-shadow:
        0 2px 6px rgba(28, 22, 14, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.65),
        inset 0 0 0 1.5px rgba(168, 134, 82, 0.14);
      transition: background-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.2s cubic-bezier(0.22, 1, 0.36, 1), color 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.2s cubic-bezier(0.22, 1, 0.36, 1), transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    html[data-theme="dark"] .gua-seq-badge {
      background: linear-gradient(160deg, #2B2620 0%, #1F1B17 60%, rgba(201, 166, 107, 0.20) 100%);
      border-color: rgba(212, 184, 134, 0.42);
      color: #F3ECE0;
      box-shadow:
        0 3px 9px rgba(0, 0, 0, 0.48),
        inset 0 1px 0 rgba(255, 244, 220, 0.14),
        inset 0 0 0 1.5px rgba(201, 166, 107, 0.16);
    }

    .gua-seq-badge::before {
      content: "❖";
      font-size: 8.5px;
      color: var(--gold-bronze);
      opacity: 0.85;
      line-height: 1;
    }

    .gua-seq-badge:hover {
      border-color: var(--vermilion);
      color: var(--vermilion);
    }

    /* ==================== 2. UNIFIED DIVINATION & NAVIGATION WORKSPACE ==================== */
    /* Portrait Mode 2x2 Grid:
       - Top-Left (sliders): Upper & Lower Trigram Sliders (flatter & wide so all 8 乾坤震巽坎离艮兑 pips show clearly)
       - Top-Right (bagua): Dual-Ring Rotating Bagua Astrolabe + Full Name & Pinyin
       - Bottom-Left (navzone): 4 Canwu Buttons (above 导语 row) + 导语..总论 row + 初九..上六 row (shifted left to free bottom-right!)
       - Bottom-Right (liuyao): Original full-size Sculpted 6-Yao Symbol placed directly BELOW Bagua! */
    .ops-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 114px;
      grid-template-rows: 118px 108px;
      grid-template-areas:
        "sliders bagua"
        "navzone liuyao";
      gap: 7px 10px;
      align-items: stretch;
    }

    /* Flatter Trigram Selector Cards so 8 Trigram Pips (乾坤震巽坎离艮兑) always display completely */
    .trigram-selectors {
      grid-area: sliders;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
      height: 118px;
      min-width: 0;
    }

    .trigram-card {
      position: relative;
      height: 56px;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border-accent);
      border-radius: 10px;
      padding: 3px 5px 2px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-card);
      cursor: grab;
      touch-action: none;
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .trigram-card:hover {
      border-color: var(--gold-bronze);
    }

    .trigram-card.is-dragging {
      cursor: grabbing;
      border-color: var(--vermilion);
      box-shadow: 0 3px 12px var(--vermilion-soft), inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .trigram-card-main {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 29px;
    }

    .trigram-step-btn {
      width: 20px;
      height: 24px;
      border-radius: 5px;
      background: transparent;
      border: none;
      color: var(--ink-faint);
      font-family: var(--font-sans);
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.15s ease;
      flex-shrink: 0;
      z-index: 3;
    }

    .trigram-step-btn:hover {
      background-color: var(--bg-paper);
      color: var(--ink-primary);
    }

    .trigram-step-btn:active {
      color: var(--vermilion);
      transform: scale(0.9);
    }

    /* Interactive 1:1 Follow-Finger 3D Cylindrical Drum Stage */
    .trigram-stage {
      flex: 1;
      height: 29px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 360px;
      mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%);
    }

    .trigram-slot {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .trigram-neighbor {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      pointer-events: none;
      opacity: 0.25;
      transition: opacity 0.15s ease;
    }

    .trigram-neighbor-prev {
      left: -78%;
      transform: scale(0.85) rotateY(20deg);
    }

    .trigram-neighbor-next {
      left: 78%;
      transform: scale(0.85) rotateY(-20deg);
    }

    .trigram-card.is-dragging .trigram-neighbor {
      opacity: 0.72;
    }

    .trigram-slot.slide-in-from-right {
      animation: trigramInRight 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .trigram-slot.slide-in-from-left {
      animation: trigramInLeft 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes trigramInRight {
      0% { transform: translate3d(36px, 0, 0) rotateY(-18deg) scale(0.9); opacity: 0.25; }
      100% { transform: translate3d(0, 0, 0) rotateY(0deg) scale(1); opacity: 1; }
    }

    @keyframes trigramInLeft {
      0% { transform: translate3d(-36px, 0, 0) rotateY(18deg) scale(0.9); opacity: 0.25; }
      100% { transform: translate3d(0, 0, 0) rotateY(0deg) scale(1); opacity: 1; }
    }

    .trigram-nature-char {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      color: var(--ink-primary);
    }

    .trigram-meta-col {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.1;
    }

    .trigram-gua-char {
      font-family: var(--font-serif);
      font-size: 11.5px;
      font-weight: 600;
      color: var(--ink-secondary);
      white-space: nowrap;
    }

    .trigram-pos-tag {
      font-family: var(--font-sans);
      font-size: 8.5px;
      color: var(--ink-muted);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    /* 8-Trigram Quick Pips Bar: 8-column equal grid so all 8 characters (乾坤震巽坎离艮兑) NEVER clip */
    .trigram-pips {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      align-items: center;
      padding: 2px 2px 0;
      border-top: 1px solid var(--border-hairline);
    }

    .trigram-pip-btn {
      background: none;
      border: none;
      font-family: var(--font-serif);
      font-size: 10px;
      color: var(--ink-muted);
      padding: 0.5px 0;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease, transform 0.15s ease;
      line-height: 1.25;
      text-align: center;
      width: 100%;
    }

    .trigram-pip-btn:hover {
      color: var(--ink-primary);
      background-color: var(--bg-paper);
    }

    .trigram-pip-btn.active {
      color: var(--vermilion);
      font-weight: 700;
      background-color: var(--vermilion-soft);
    }

    /* Top-Right in Portrait / Top-Left in Landscape: Concentric Dual-Ring Bagua Astrolabe Medallion */
    .compass-col {
      grid-area: bagua;
      height: 118px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .compass-svg-wrap {
      width: 98px;
      height: 98px;
      position: relative;
      cursor: pointer;
      transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
      flex-shrink: 0;
    }

    .compass-svg-wrap:hover {
      transform: scale(1.025);
    }

    .compass-svg-wrap:active {
      transform: scale(0.975);
    }

    .compass-svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    #compassOuterRing,
    #compassInnerRing {
      transform-origin: 54px 54px;
      will-change: transform;
      transition: transform 0.48s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .compass-fullname {
      height: 16px;
      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 3px;
      color: var(--ink-secondary);
      text-align: center;
      white-space: nowrap;
      line-height: 1;
    }

    .compass-zh {
      font-family: var(--font-serif);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink-primary);
    }

    .compass-dot {
      font-family: var(--font-sans);
      font-size: 10.5px;
      color: var(--gold-bronze);
    }

    .compass-py {
      font-family: "Lucida Grande", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 11px;
      font-weight: 500;
      color: var(--ink-muted);
    }

    /* Original Full-Size Sculpted 6-Yao Symbol Box:
       - Portrait: Placed directly BELOW Bagua (grid-area: liuyao)
       - Landscape: Placed directly BELOW Sliders (grid-area: liuyao) */
    .hexagram-center-col {
      grid-area: liuyao;
      height: 108px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border-accent);
      border-radius: 11px;
      padding: 7px 6px 5px;
      box-shadow: var(--shadow-card);
    }

    .yao-svg-wrap {
      width: 74px;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .yao-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      display: block;
    }

    .yao-hit-group {
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: center;
    }

    .yao-hit-group:hover {
      transform: scaleX(1.04);
    }

    .yao-bar-shape {
      transition: background-color 0.22s ease, border-color 0.22s ease, color 0.22s ease, box-shadow 0.22s ease, opacity 0.22s ease, transform 0.22s ease;
    }

    .trigram-pair-caption {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-sans);
      font-size: 9.5px;
      font-weight: 500;
      letter-spacing: 0.8px;
      color: var(--ink-muted);
      white-space: nowrap;
      line-height: 1;
    }

    /* ==================== 3. NAVIGATION & CANWU 4-BUTTONS ZONE ==================== */
    /* Portrait Mode (grid-area: navzone, Bottom-Left of Upper Zone):
       - Shifted left so Bottom-Right is freed up for the full-size 6-Yao box under Bagua
       - .canwu-strip (4 pure buttons, no white background box) sits ABOVE #guaTabRow
       - .nav-group (导语 row + 初九 row) sits below .canwu-strip */
    .nav-and-canwu-zone {
      grid-area: navzone;
      height: 108px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      min-width: 0;
    }

    .canwu-strip {
      order: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4.5px;
      background: transparent;
      border: none;
      padding: 0;
      height: 34px;
    }

    .relation-btn {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 7px;
      padding: 2px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
      white-space: nowrap;
      overflow: hidden;
    }

    .relation-btn:hover {
      border-color: var(--vermilion);
      background-color: var(--vermilion-soft);
    }

    .relation-btn:active {
      transform: scale(0.97);
    }

    .relation-type {
      font-family: var(--font-sans);
      font-size: 8.5px;
      color: var(--gold-bronze);
      font-weight: 600;
      line-height: 1.05;
      flex-shrink: 0;
    }

    .relation-gua {
      font-family: var(--font-serif);
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-primary);
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .nav-group {
      order: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 4px;
      flex: 1;
    }

    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-elevated);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-hairline);
      height: 33px;
    }

    .text-btn {
      position: relative;
      flex: 1;
      height: 100%;
      background: transparent;
      border: none;
      border-radius: 6px;
      font-family: var(--font-serif);
      color: var(--ink-muted);
      cursor: pointer;
      padding: 2px 1px;
      line-height: 1.15;
      transition: background-color 0.18s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.18s cubic-bezier(0.22, 1, 0.36, 1), color 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.18s cubic-bezier(0.22, 1, 0.36, 1), transform 0.18s cubic-bezier(0.22, 1, 0.36, 1);
      white-space: nowrap;
      text-align: center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-row-gua .text-btn {
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .btn-row-yao .text-btn {
      font-size: 11px;
      font-weight: 500;
    }

    .btn-row-yao .text-btn.yong-btn {
      font-size: 10px;
    }

    .text-btn:hover:not(:disabled):not(.active) {
      color: var(--ink-primary);
      background-color: rgba(168, 134, 82, 0.08);
    }

    .text-btn.active {
      color: #FFFDF9;
      background-color: var(--vermilion);
      font-weight: 600;
      box-shadow: 0 2px 6px var(--vermilion-glow);
    }

    .text-btn:disabled {
      color: var(--ink-faint);
      opacity: 0.4;
      cursor: default;
    }

    /* ==================== LANDSCAPE MODE ARCHITECTURE (html[data-orientation="landscape"]) ==================== */
    /* 1. Left-Right Proportion Matches Portrait Upper-Lower Ratio (~37% Left Studio : ~63% Right Reading Folio)
       2. Inside Left Studio (.ops-workspace):
          - Left Sub-column:
            * Top (bagua): Dual-Ring Rotating Bagua Astrolabe placed ABOVE the other parts on the left ("横屏模式八卦放到左侧其他部分的上方")
            * Middle (sliders): Flatter Upper & Lower Trigram Sliders (with all 8 乾坤震巽坎离艮兑 pips visible)
            * Bottom (liuyao): Full-size Sculpted 6-Yao Symbol placed BELOW the sliders ("六爻符号放到滑动的下方")
          - Right Sub-column (navzone — to the right of Bagua & Sliders & 6-Yao):
            * Top: 导语..总论 & 初六..上六 arranged vertically as two side-by-side columns
            * Bottom: 4 Canwu buttons (without white background box) stacked vertically BELOW the 导语 & 初六 columns */
    html[data-orientation="landscape"] .folio-frame {
      display: grid;
      grid-template-columns: 38% 62%;
      grid-template-rows: minmax(0, 1fr);
    }

    html[data-orientation="landscape"] .upper-zone {
      height: 100%;
      padding: 10px 18px 12px;
      padding-top: calc(10px + env(safe-area-inset-top, 0px));
      padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      padding-left: calc(18px + env(safe-area-inset-left, 0px));
      border-bottom: none;
      border-right: 1px solid var(--border-accent);
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
    }

    html[data-orientation="landscape"] .ops-workspace {
      flex: 1 1 auto;
      min-height: 0;
      max-height: none;
      width: 100%;
      height: 100%;
      margin: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) 116px minmax(0, 1.15fr) auto;
      grid-template-areas:
        "bagua"
        "sliders"
        "liuyao"
        "navzone";
      gap: 10px;
      align-items: stretch;
    }

    html[data-orientation="landscape"] .compass-col {
      height: 100%;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(180deg, var(--bg-card) 0%, var(--bg-elevated) 100%);
      border: 1px solid var(--border-hairline);
      border-radius: 14px;
      padding: 12px 16px 6px;
      box-shadow: var(--shadow-card);
    }

    html[data-orientation="landscape"] .compass-svg-wrap {
      width: auto;
      height: calc(100% - 26px);
      max-width: 100%;
      aspect-ratio: 1 / 1;
    }

    html[data-orientation="landscape"] .compass-zh {
      font-size: 16px;
    }

    html[data-orientation="landscape"] .compass-py,
    html[data-orientation="landscape"] .compass-dot {
      font-size: 14px;
    }

    html[data-orientation="landscape"] .trigram-selectors {
      height: 116px;
      gap: 8px;
      justify-content: center;
    }

    html[data-orientation="landscape"] .trigram-card {
      height: 54px;
      flex: 0 0 auto;
      padding: 3px 7px 2px;
    }

    html[data-orientation="landscape"] .trigram-card-main {
      height: 28px;
    }

    html[data-orientation="landscape"] .trigram-stage {
      height: 28px;
    }

    html[data-orientation="landscape"] .trigram-meta-col {
      flex-direction: row;
      align-items: baseline;
      gap: 4px;
    }

    html[data-orientation="landscape"] .hexagram-center-col {
      height: 100%;
      min-height: 0;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      padding: 10px 14px;
    }

    /* Right Sub-Column in Landscape: Vertical 导语/初六 columns at top + Vertical 4 Canwu buttons below */
    html[data-orientation="landscape"] .nav-and-canwu-zone {
      height: auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 8px;
    }

    html[data-orientation="landscape"] .nav-group {
      order: 2;
      flex: 0 0 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    html[data-orientation="landscape"] .btn-row {
      flex-direction: row;
      height: auto;
      padding: 0;
      gap: 8px;
    }

    html[data-orientation="landscape"] .text-btn {
      flex: 1 1 0;
      padding: 12px 4px;
      font-size: 16.5px;
      letter-spacing: 1px;
    }

    html[data-orientation="landscape"] .btn-row-yao .text-btn.yong-btn {
      font-size: 13.5px;
    }

    html[data-orientation="landscape"] .canwu-strip {
      order: 1;
      flex: 0 0 auto;
      height: auto;
      display: flex;
      flex-direction: row;
      gap: 8px;
    }

    html[data-orientation="landscape"] .relation-btn {
      flex: 1 1 0;
      flex-direction: row;
      justify-content: center;
      gap: 6px;
      padding: 8px 8px;
      border-radius: 8px;
    }

    html[data-orientation="landscape"] .relation-type {
      font-size: 12.5px;
    }

    html[data-orientation="landscape"] .relation-gua {
      font-size: 14.5px;
    }

    html[data-orientation="landscape"] .trigram-pip-btn {
      font-size: 11.5px;
    }

    html[data-orientation="landscape"] .trigram-nature-char {
      font-size: 20px;
    }

    html[data-orientation="landscape"] .trigram-gua-char {
      font-size: 13px;
    }

    html[data-orientation="landscape"] .trigram-pos-tag {
      font-size: 10px;
    }

    /* 矮横屏（手机/小窗）回退：导航回到右侧竖列，保证罗盘与六爻仍有足够高度 */
    @media (max-height: 620px) {
      html[data-orientation="landscape"] .folio-frame {
        grid-template-columns: 37% 63%;
      }

      html[data-orientation="landscape"] .ops-workspace {
        grid-template-columns: minmax(0, 1fr) 104px;
        grid-template-rows: minmax(0, 1fr) 102px minmax(0, 1.1fr);
        grid-template-areas:
          "bagua   navzone"
          "sliders navzone"
          "liuyao  navzone";
        gap: 8px 10px;
      }

      html[data-orientation="landscape"] .compass-col {
        padding: 6px 8px 4px;
        gap: 5px;
        border-radius: 12px;
      }

      html[data-orientation="landscape"] .compass-zh { font-size: 12px; }
      html[data-orientation="landscape"] .compass-py,
      html[data-orientation="landscape"] .compass-dot { font-size: 10.5px; }

      html[data-orientation="landscape"] .trigram-selectors {
        height: 102px;
        gap: 6px;
      }

      html[data-orientation="landscape"] .trigram-card {
        height: 48px;
        padding: 2px 5px 2px;
      }

      html[data-orientation="landscape"] .trigram-card-main,
      html[data-orientation="landscape"] .trigram-stage {
        height: 24px;
      }

      html[data-orientation="landscape"] .trigram-pip-btn { font-size: 9px; }

      html[data-orientation="landscape"] .hexagram-center-col {
        padding: 7px 8px 5px;
      }

      html[data-orientation="landscape"] .nav-and-canwu-zone {
        height: 100%;
        justify-content: space-between;
        gap: 5px;
      }

      html[data-orientation="landscape"] .nav-group {
        order: 1;
        flex: 1 1 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4.5px;
      }

      html[data-orientation="landscape"] .btn-row {
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 3px;
        gap: 2.5px;
      }

      html[data-orientation="landscape"] .text-btn {
        width: 100%;
        flex: 1 1 auto;
        max-height: 84px;
        padding: 2px 1px;
        font-size: 11.5px;
        letter-spacing: 0;
      }

      html[data-orientation="landscape"] .btn-row-yao .text-btn.yong-btn { font-size: 10.5px; }

      html[data-orientation="landscape"] .canwu-strip {
        order: 2;
        flex: 0 0 auto;
        flex-direction: column;
        gap: 4.5px;
      }

      html[data-orientation="landscape"] .relation-btn {
        flex: none;
        width: 100%;
        justify-content: space-between;
        gap: 0;
        padding: 5px 7px;
        border-radius: 7px;
      }

      html[data-orientation="landscape"] .relation-type { font-size: 9.5px; }
      html[data-orientation="landscape"] .relation-gua { font-size: 11px; }
    }

    /* ==================== LOWER / RIGHT CONTENT READING ZONE ==================== */
    .lower-zone {
      position: relative;
      z-index: 1;
      flex: 1 1 auto;
      min-width: 0;
      min-height: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background-color: var(--bg-paper);
    }

    .content-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px 48px;
      padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      user-select: text;
    }

    html[data-orientation="landscape"] .content-scroll {
      padding: 4px 24px 48px;
      padding-right: calc(24px + env(safe-area-inset-right, 0px));
      padding-bottom: calc(48px + env(safe-area-inset-bottom, 0px));
    }

    .content-scroll::-webkit-scrollbar {
      width: 4px;
    }

    .content-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .content-scroll::-webkit-scrollbar-thumb {
      background-color: var(--border-accent);
      border-radius: 4px;
    }

    /* 4.1 Sticky Original Scripture Card */
    .original-sticky-wrap {
      position: sticky;
      top: 0;
      z-index: 5;
      padding: 10px 0 8px;
      background-color: var(--bg-paper);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .original-quote-box {
      position: relative;
      background-color: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-left: 3.5px solid var(--vermilion);
      border-radius: 6px 12px 12px 6px;
      padding: 9px 13px;
      box-shadow: var(--shadow-card);
      cursor: pointer;
      transition: border-color 0.2s ease;
    }

    .original-quote-box:hover {
      border-color: var(--border-accent);
      border-left-color: var(--vermilion);
    }

    .original-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
      min-height: 20px;
    }

    .original-label-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .original-tag {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--vermilion);
      background-color: var(--vermilion-soft);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .original-sub-note {
      font-family: var(--font-sans);
      font-size: 11px;
      color: var(--ink-muted);
    }

    /* Secondary Switcher for Yao (爻辞 / 小象) */
    .sub-switch-group {
      display: inline-flex;
      align-items: center;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .sub-switch-btn {
      background: transparent;
      border: none;
      border-radius: 4px;
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 1px;
      color: var(--ink-muted);
      cursor: pointer;
      padding: 2px 9px;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
    }

    .sub-switch-btn:hover:not(.active) {
      color: var(--ink-primary);
    }

    .sub-switch-btn.active {
      background-color: var(--vermilion);
      color: #FFFDF9;
      font-weight: 600;
    }

    .original-text {
      font-family: var(--font-serif);
      font-size: calc(var(--comm-font-size, 15.5px) * 1.12);
      font-weight: 600;
      line-height: 2.22;
      letter-spacing: 0.5px;
      color: var(--ink-primary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-overflow: ellipsis;
      word-break: break-word;
      padding-top: 3px;
    }

    .original-text ruby,
    .wenyan-quote-text ruby {
      ruby-align: center;
      ruby-position: over;
      margin: 0 1px;
    }

    .original-text rt,
    .wenyan-quote-text rt {
      font-family: "Lucida Grande", "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--vermilion);
      letter-spacing: 0px;
      font-kerning: normal;
      line-height: 1.15;
      user-select: none;
      -webkit-user-select: none;
    }

    .original-text ruby.ruby-common rt,
    .wenyan-quote-text ruby.ruby-common rt {
      color: var(--gold-bronze);
      font-weight: 400;
    }

    .pinyin-mode-btn {
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 5px;
      padding: 2px 7px;
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--gold-bronze);
      cursor: pointer;
      transition: background-color 0.18s ease, border-color 0.18s ease, color 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease, transform 0.18s ease;
      margin-left: auto;
    }

    .original-text.expanded {
      display: block;
      -webkit-line-clamp: unset;
    }

    .expand-toggle-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 5px;
      padding-top: 4px;
      border-top: 1px dashed var(--border-hairline);
    }

    .tiny-action-btn {
      background: none;
      border: none;
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.8px;
      color: var(--gold-bronze);
      cursor: pointer;
      padding: 2px 0;
    }

    .tiny-action-btn:hover {
      color: var(--vermilion);
    }

    /* 4.2 Commentary Section */
    .commentary-section {
      padding-top: 4px;
    }

    #compassWrap { cursor: pointer; }

    .pure-sheet {
      position: fixed;
      inset: 0;
      z-index: 9000;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(18, 14, 10, 0.42);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .pure-sheet.open {
      opacity: 1;
      pointer-events: auto;
    }

    .pure-sheet-panel {
      width: min(430px, 100%);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--border-accent);
      border-radius: 14px;
      box-shadow: 0 20px 50px rgba(20, 14, 8, 0.32);
      transform: translateY(8px) scale(0.985);
      transition: transform 0.24s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
    }

    .pure-sheet.open .pure-sheet-panel {
      transform: translateY(0) scale(1);
    }

    .pure-sheet-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .pure-sheet-name {
      font-family: var(--font-serif);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--ink-primary);
    }

    .pure-sheet-close {
      width: 26px;
      height: 26px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--ink-muted);
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }

    .pure-sheet-close:hover { color: var(--vermilion); }

    .pure-sheet-body {
      padding: 4px 6px 10px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .pure-row {
      display: flex;
      gap: 9px;
      align-items: flex-start;
      padding: 9px 8px;
      border-radius: 9px;
      cursor: pointer;
      transition: background-color 0.16s ease;
    }

    .pure-row:hover { background: var(--vermilion-soft); }

    .pure-row-yao {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding-top: 1px;
    }

    .pure-row-label {
      font-family: var(--font-sans);
      font-size: 9px;
      color: var(--ink-muted);
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .pure-bar { display: block; border-radius: 1px; }
    .pure-bar.yang { width: 22px; height: 3px; background: var(--ink-secondary); }
    .pure-bars-yin { display: flex; gap: 4px; }
    .pure-bar.yin { width: 9px; height: 3px; background: var(--ink-secondary); }

    .pure-row-text {
      flex: 1;
      min-width: 0;
      font-family: var(--font-serif);
      font-size: 13.5px;
      line-height: 1.62;
      color: var(--ink-primary);
    }

    .pure-row.is-gua .pure-row-text {
      color: var(--ink-secondary);
      font-weight: 600;
    }

    .pure-row-tail {
      flex: 0 0 auto;
      align-self: center;
      color: var(--ink-faint);
      font-size: 11px;
    }

    .edition-flip {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: var(--bg-glass);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .edition-flip.on {
      opacity: 1;
      pointer-events: auto;
    }

    .edition-flip .taiji {
      width: 156px;
      height: 156px;
      display: block;
      border-radius: 50%;
      background: var(--bg-card);
      box-shadow: 0 14px 38px rgba(28, 22, 14, 0.20);
    }

    .edition-flip .taiji.spin {
      animation: taijiHalfTurn 0.54s cubic-bezier(0.42, 0, 0.3, 1) forwards;
    }

    @keyframes taijiHalfTurn {
      from { transform: rotate(0deg); }
      to { transform: rotate(180deg); }
    }

    .comm-edition-tag {
      font-family: var(--font-sans);
      font-size: 10.5px;
      letter-spacing: 1.5px;
      line-height: 1.4;
      color: var(--ink-muted);
      padding: 0 0 7px;
      user-select: none;
    }

    .comm-edition-tag.orig {
      color: var(--vermilion);
    }

    .commentary-header {
      display: none;
    }

    :root {
      --comm-font-size: 15.5px;
      --orig-font-size: 17.5px;
      --wenyan-font-size: 16px;
    }

    .commentary-body p {
      font-family: var(--font-serif);
      font-size: var(--comm-font-size, 15.5px);
      line-height: 1.94;
      color: var(--ink-secondary);
      text-align: justify;
      text-indent: 2em;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .commentary-body p:last-child {
      margin-bottom: 0;
    }

    .wenyan-entry {
      margin-bottom: 22px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .wenyan-entry:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .wenyan-quote {
      background-color: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-left: 3px solid var(--vermilion);
      border-radius: 4px 10px 10px 4px;
      padding: 8px 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }

    .wenyan-seg-tag {
      font-family: var(--font-sans);
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--vermilion);
      margin-bottom: 4px;
    }

    .wenyan-quote-text {
      font-family: var(--font-serif);
      font-size: 16px;
      font-weight: 600;
      line-height: 2.2;
      color: var(--ink-primary);
      padding-top: 3px;
    }

    /* 4.3 Bottom Functional Fade Mask */
    .bottom-fade-mask {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 38px;
      pointer-events: none;
      z-index: 6;
      background: var(--fade-bottom);
    }

    /* ==================== 64-HEXAGRAM INDEX & SEARCH DRAWER ==================== */
    .index-drawer {
      position: absolute;
      inset: 0;
      z-index: 50;
      background-color: var(--bg-paper);
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .index-drawer.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .drawer-header {
      padding: 12px 16px 10px;
      padding-top: calc(12px + env(safe-area-inset-top, 0px));
      border-bottom: 1px solid var(--border-hairline);
      background-color: var(--bg-card);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .drawer-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .drawer-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2.5px;
      color: var(--ink-primary);
    }

    .drawer-close-btn {
      background-color: var(--vermilion-soft);
      border: 1px solid transparent;
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--vermilion);
      cursor: pointer;
      padding: 4px 12px;
    }

    .drawer-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .search-input-wrap {
      flex: 1;
      position: relative;
      background-color: var(--bg-elevated);
      border: 1px solid var(--border-hairline);
      border-radius: 8px;
    }

    .search-input {
      width: 100%;
      background: transparent;
      border: none;
      padding: 6px 26px 6px 10px;
      font-family: var(--font-serif);
      font-size: 13px;
      color: var(--ink-primary);
      outline: none;
    }

    .search-input::placeholder {
      color: var(--ink-faint);
      font-family: var(--font-sans);
      font-size: 11.5px;
    }

    .search-clear-btn {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--ink-muted);
      font-size: 14px;
      cursor: pointer;
      display: none;
    }

    .drawer-body {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px 24px;
      padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    }

    .seq-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    html[data-orientation="landscape"] .seq-grid {
      grid-template-columns: repeat(8, 1fr);
    }

    .seq-cell {
      background-color: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: 10px;
      padding: 7px 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, transform 0.16s ease;
      box-shadow: var(--shadow-card);
    }

    .seq-cell:hover {
      border-color: var(--gold-bronze);
      transform: translateY(-1px);
    }

    .seq-cell.current {
      border-color: var(--vermilion);
      background-color: var(--vermilion-soft);
    }

    .seq-cell-top {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-sans);
      font-size: 9.5px;
      color: var(--ink-faint);
      margin-bottom: 2px;
    }

    .seq-cell-name {
      font-family: var(--font-serif);
      font-size: 16.5px;
      font-weight: 600;
      color: var(--ink-primary);
      margin: 2px 0;
    }

    .seq-cell.current .seq-cell-name {
      color: var(--vermilion);
    }

    .seq-cell-full {
      font-family: var(--font-sans);
      font-size: 10px;
      color: var(--ink-muted);
    }

    .matrix-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      background-color: var(--bg-card);
      border-radius: 10px;
      overflow: hidden;
    }

    .matrix-table th,
    .matrix-table td {
      border: 1px solid var(--border-hairline);
      text-align: center;
      padding: 6px 2px;
      font-size: 12px;
    }

    .matrix-table th {
      background-color: var(--bg-elevated);
      color: var(--ink-muted);
      font-family: var(--font-sans);
      font-weight: 500;
      font-size: 10.5px;
    }

    .matrix-cell {
      cursor: pointer;
      color: var(--ink-secondary);
      font-family: var(--font-serif);
      font-weight: 500;
    }

    .matrix-cell:hover {
      color: var(--vermilion);
      background-color: var(--vermilion-soft);
    }

    .matrix-cell.current {
      color: #FFFDF9;
      background-color: var(--vermilion);
      font-weight: 600;
    }

    .search-result-list {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .search-item {
      padding: 9px 12px;
      border: 1px solid var(--border-hairline);
      border-left: 3px solid var(--gold-bronze);
      border-radius: 6px 10px 10px 6px;
      background-color: var(--bg-card);
      cursor: pointer;
    }

    .search-item:hover {
      border-left-color: var(--vermilion);
    }

    .search-item-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 3px;
    }

    .search-item-title {
      font-family: var(--font-serif);
      font-size: 14px;
      font-weight: 600;
      color: var(--vermilion);
    }

    .search-item-snippet {
      font-family: var(--font-serif);
      font-size: 13px;
      line-height: 1.65;
      color: var(--ink-secondary);
    }

    /* Toast */
    .folio-toast {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background-color: var(--ink-primary);
      color: var(--bg-paper);
      font-family: var(--font-sans);
      font-size: 12px;
      letter-spacing: 1px;
      padding: 7px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 70;
      white-space: nowrap;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
    }

    .folio-toast.visible {
      opacity: 0.96;
      transform: translateX(-50%) translateY(0);
    }
  
    /* 六爻区：符号撑满、居中；「上X · 下Y」已移除 */
    .hexagram-center-col,
    html[data-orientation="landscape"] .hexagram-center-col {
      justify-content: center;
      gap: 0;
    }

    .yao-svg-wrap,
    html[data-orientation="landscape"] .yao-svg-wrap {
      flex: 1 1 auto;
      width: 100%;
      height: 100%;
      min-height: 0;
      max-height: none;
      padding: 0;
    }

    .yao-svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* ==================== 启动横竖屏选择 ==================== */
    .launch-veil {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
      background:
        radial-gradient(130% 100% at 50% -10%, rgba(94, 72, 40, 0.44) 0%, rgba(20, 18, 15, 0) 58%),
        radial-gradient(90% 70% at 50% 110%, rgba(94, 26, 20, 0.22) 0%, rgba(10, 10, 11, 0) 60%),
        #0C0C0D;
      font-family: var(--font-serif);
      opacity: 1;
      transition: opacity 0.3s ease;
      overscroll-behavior: contain;
    }

    .launch-veil.closing {
      opacity: 0;
      pointer-events: none;
    }

    .launch-panel {
      width: min(680px, 100%);
      text-align: center;
      color: #EFECE6;
      animation: launchRise 0.55s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }

    @keyframes launchRise {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: none; }
    }

    .launch-seal {
      width: 46px;
      height: 46px;
      margin: 0 auto;
      display: grid;
      place-items: center;
      color: #FFF6E8;
      font-size: 25px;
      line-height: 1;
      background: linear-gradient(160deg, #C8382E, #8E1D14);
      border-radius: 7px;
      box-shadow: inset 0 0 0 1px rgba(255, 246, 232, 0.28), 0 10px 26px rgba(0, 0, 0, 0.4);
    }

    .launch-title {
      margin: 18px 0 0;
      font-size: 30px;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-indent: 0.34em;
      color: #F3EFE6;
    }

    .launch-kicker {
      margin: 12px auto 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-family: var(--font-sans);
      font-size: 11.5px;
      letter-spacing: 0.3em;
      text-indent: 0.3em;
      color: #8D8578;
    }

    .launch-kicker i {
      width: 42px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201, 166, 107, 0.5), transparent);
    }

    .launch-options {
      margin-top: 34px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .launch-option {
      position: relative;
      appearance: none;
      -webkit-appearance: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 26px 18px 22px;
      cursor: pointer;
      color: #DCD5C7;
      background: linear-gradient(180deg, rgba(32, 31, 31, 0.92), rgba(19, 19, 21, 0.94));
      border: 1px solid rgba(212, 190, 152, 0.2);
      border-radius: 14px;
      overflow: hidden;
      transition: border-color 0.22s ease, transform 0.22s ease, box-shadow 0.22s ease;
    }

    .launch-option::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px solid rgba(212, 190, 152, 0.1);
      border-radius: 9px;
      pointer-events: none;
      transition: border-color 0.22s ease;
    }

    .launch-option:hover {
      border-color: rgba(212, 190, 152, 0.58);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
      transform: translateY(-2px);
    }

    .launch-option:hover::before {
      border-color: rgba(212, 190, 152, 0.24);
    }

    .launch-option:active {
      transform: translateY(0) scale(0.992);
    }

    .launch-option:focus-visible {
      outline: 1px solid rgba(201, 166, 107, 0.85);
      outline-offset: 3px;
    }

    .launch-glyph {
      width: 64px;
      height: 64px;
      color: #C9A66B;
    }

    .launch-glyph svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .launch-copy {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .launch-orient-name {
      font-size: 22px;
      letter-spacing: 0.28em;
      text-indent: 0.28em;
      color: #F3EFE6;
    }

    .launch-spec {
      font-family: var(--font-sans);
      font-size: 12px;
      line-height: 1.95;
      letter-spacing: 0.05em;
      color: #9A9284;
    }

    .launch-note {
      margin-top: 24px;
      font-family: var(--font-sans);
      font-size: 11px;
      letter-spacing: 0.14em;
      color: #6B655B;
    }

    @media (max-width: 600px) {
      .launch-options {
        grid-template-columns: 1fr;
        gap: 10px;
        margin-top: 26px;
      }

      .launch-option {
        flex-direction: row;
        text-align: left;
        gap: 18px;
        padding: 18px;
      }

      .launch-glyph {
        width: 54px;

      '#launchVeil [data-launch-orient].is-picked .launch-orient-name::after{content:" · 载入中"}';

于天命而无求胜之心；中有所蓄，是以甘于退抑而无自矜之色。此语可味。盖理得于中者不与人竞，实积于己者无须自炫；反是，则中虚者常骄，内足者常抑。\n以五阴一阳成卦者，其数有六。阳穷于上者剥，阳动于下者复，此消息之候也；阳处下体之中者师，处上体之中者比，此众所归之候也；其在二体之际者，谦与豫是已。谦则孤阳退处于下，位在下体之上、上体之下；豫则阳奋而出，位在上体之下、下体之上。九三一爻，即爻辞所称“有终”之君子。","T":"彖曰：谦亨。天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。","T.N":"“谦亨，天道下济而光明，地道卑而上行”三句，就上下二体之性以明卦辞“谦亨”之旨。天道者何？下体艮中之阳是已。艮体一阳横亘于二阴之上，其光不掩，故取光明之象。今艮屈居下体，本宜在上而反就下，谦义即由此起。虽处下，光明不因之而损；有光明，亨在其中矣。外体为坤，地之道也；地以卑为性，卑即谦义所存。然地以卑下之质而据上体之位，卑者进而居上，是以谓之“上行”；上行则亨。\n“天道亏盈而益谦”以下，备论谦之所致，凡天地人鬼，其情皆右谦而左盈。析而观之，盈未有不招损者，谦未有不获益者。天之运也，日昃于中天之后，月亏于既满之时，常取其有余者以裨不足者，此谦之所以受福也。地之形也，高岸或坠而为谷，深谷或起而为陵，凡隆满者皆削而注于卑下，此变盈而流谦也。所谓鬼神，不过造化之迹；造化者，天人之际共循之则也，盛满则祸集，亏抑则福归。凡此皆就外在之实理言，初不系乎人之好恶。人之情则厌盈而喜谦，亦莫不然。谦之为至德，于此可见；能抑然自下者，殆可以免于倾覆。“谦尊而光，卑而不可逾”，谓谦之为道，不以位之高下而异：居尊而能谦，其德愈光，为人仰慕；处卑而能谦，其德愈峻，为人所不能逾。至“君子之终也”一语，则见尊卑虽殊，能始终不渝者唯君子；谦之为德，既切要，又难能。","X":"象曰：地中有山，谦。君子以裒多益寡，称物平施。","X.N":"此即所谓大象。其体例本非以释卦辞。孔子玩一卦之象与辞，心有所触，别抒己见，以诏学者推之于日用云为。是以此段之义，当属孔门，与古经初无直接关涉。\n“地中有山，谦”，地虽卑而中含山岳，外见不足，中藏有余，谦象在是。孔子之所告者，在位有土之人也：自天子、诸侯而下，逮于公卿大夫。此辈临御民物，当取谦象为法，行“裒多益寡”之事，而致其平。所重者非一人之自抑，乃推谦道以施于有政。\n裒读为掊，义取。裒多益寡者，取彼之有余以增此之不足也。《汉书·律历志》以铢、两、斤、钧、石五者为权，权之为用，在度物之轻重而使之均。是知称物平施，本谓以权衡量物。物之轻重，本为客观之实；然临秤之际能否使之持平，则系乎操秤之人。\n主政者取谦卦之义而施于国：损其偏积者以补其空乏，又令亲疏、远近、小大、短长各安其位而不相逾。孔子之学，于此寓平均之义，亦未尝废差等之序。","Y1.T":"初六，谦谦君子，用涉大川，吉。","Y1.N":"谦之六位，初为最下；初六以柔处之，是谦而又谦者也，“谦谦”之名由此而立。真能践此者，唯君子耳，小人不足以与于斯。凡物过盛则败，诸事过甚则失，独谦之一道不闻以过为病。君子既谦而又谦，以之涉大川而尚吉，则安处无事之日，吉更可知。“用涉大川”与“利涉大川”语意有别：言“利涉”者，重在有其济险之才力；言“用涉”者，重在君子怀谦谦之德，居人之后而不争先，故险难当前，无不可越。","Y1.X":"象曰：谦谦君子，卑以自牧也。","Y1.XN":"牧者，养也；自牧，即自养其德。君子之所以能谦而又谦者，以其取谦卑之道涵养此心，久而不倦故也。","Y2.T":"六二，鸣谦，贞吉。","Y2.N":"谦德形于声气、接于耳目者，谓之鸣。全卦之枢在九三：众柔独阳，卦之所以名谦者在此。自九三观之，二近而比，上远而应；雄倡雌从，阳发阴承，二与上之得名以此。谦以蕴内为正，暴外非宜；六二柔质居柔位，处下体之中，所据既正，故发而亦吉。贞者正也，正而后吉，不正则反是。","Y2.X":"象曰：鸣谦贞吉，中心得也。","Y2.XN":"小象复举“鸣谦贞吉”四字，而以“中心得也”释之。谦而至形于声气，本非美德；唯其发于中心，非由矫饰，故吉。","Y3.T":"九三，劳谦，君子有终，吉。","Y3.N":"谦之六画，阴居其五，阳仅一画，即九三也；五柔环而归之，其位最重，是成卦之主。以其为卦主，故爻辞与卦辞立义略同。卦辞云“谦亨，君子有终”，爻辞易“亨”为“吉”，又于“谦”上增一“劳”字。功著于时，而自处若无一能，则“劳谦”之目归之。谦已难矣，劳而谦为尤难。暂焉行之于一时，勉强可及；苟能积久而不迁，毕世守之，斯非盛德之士莫能任也。唯君子可以久处，故吉亦唯君子得之。《系辞》推其义，谓有劳而不自伐、有功而不居德，许为“厚之至”，正以其能以下人。\n九三既为卦主，孤阳介于五柔之间，群阴共宗之；论其功宜居上位，而今顾居下体之下，功高而位卑，劳而不伐之象见焉。","Y3.X":"象曰：劳谦君子，万民服也。","Y3.XN":"“万民服也”一句，所以释爻辞“劳谦，君子有终，吉”。万者盈数，其义为大；万民犹言庶众。夫有大功而不自矜、不自我夸伐，甘心处于人下，守之终其身者，必为众庶所归附。爻辞所谓“君子有终，吉”，意即在此。","Y4.T":"六四，无不利，㧑谦。","Y4.N":"㧑者，挥也。“㧑谦”，谓发摅其谦德，使动静语默、出处进退之间皆有谦焉。“无不利，㧑谦”，犹云于㧑谦无所不利，凡所施为，未有不宜。六四何以必尽发其谦而后无不利？盖四位逼近至尊，本属多惧之乡，戒慎固其分内。而况上则六五以谦柔御下，下则九三以劳谦事上，四居二者之间：事上宜恭，接下宜巽，谦德于此不容不尽。尽之，非惟理所当然，亦且实受其利。","Y4.X":"象曰：无不利㧑谦，不违则也。","Y4.XN":"尽发其谦，于六四之位分所当然，非过也；措之而得其宜，亦不戾于法度。故曰“不违则”。","Y5.T":"六五，不富以其邻，利用侵伐，无不利。","Y5.N":"富者，实而有余之谓。在《周易》义例，阳为实、为富，阴为虚、为贫。以者，用也，其义为操持左右。邻者，附丽于主之义，推而广之，则臣民皆是。所谓“以其邻”，谓能左右其众，为众所戴也。“富以其邻”，在《易》为恒例：阳处尊而得中，力足以制其旁比之阴，小畜九五当之。今谦之六五乃以阴柔而居尊位，居然亦能使臣民信从，故爻辞系以“不富以其邻”，此则变例也。\n所以能然者，以其以柔道临下，德在谦顺，不隔绝于臣民，臣民亦乐附之。然五之为爻，阴也，坤道也；坤以虚为体，虚则不富，安能保其无不服者？其有不服，则以侵伐继之，无所往而不利；如其无之，兵革固无所用。以九三较之，则所见相反：三为阳，实而有余，众阴咸服，兵无所施；五为阴，虚而不足，故不免于有不服。","Y5.X":"象曰：利用侵伐，征不服也。","Y5.XN":"“利用侵伐，无不利”何由而然？曰：以“征不服”也。六五体柔而位尊，谦顺其德也，然天下岂尽帖然？有非谦所能喻者，则兵革随之。孔子言“利用侵伐，征不服也”，其意若曰：人君之治，以文德为先；文德既至而犹有不服，则兵亦不得已而用。以兵加不服，于义为正当，非与行谦之道相妨也。是知孔子之重德治，非谓废兵；德礼所不能化，兵威固在其度内。","Y6.T":"上六，鸣谦，利用行师。征邑国。","Y6.N":"谦卦之中，六二与上六并称“鸣谦”，推其所以鸣，皆系于九三：二与之比，六与之应也。既同系于九三，又同得鸣谦之名，而所处之位不同，故所收之效亦异。六二之谦发于外，而中有积德为之本，是以贞而吉。上六则谦虽著于外，所处实为不佳：柔而居柔，顺之至也；位在一卦之上，谦之至也。以极顺之质，处极谦之地，谦而过其度，反为失中，未可谓美。其鸣也，本欲求应于九三；然九三以一阳为众阴之主，遍应群阴，不能独应乎己。计无复之，乃以“利用行师，征邑国”者自达其谦。“利用行师”，利于用刚武也；“征邑国”，所征者止于己之封内。意盖在自了己事，不事外求，此正其所以为谦也。","Y6.X":"象曰：鸣谦，志未得也。可用行师，征邑国也。","Y6.XN":"六二之鸣，以其“中心得”，位中而德正，所蓄者实也。上六之鸣，以其“志未得”；志未得者，居谦之尽处，而自视歉然，常若有所不给也。有不足则思补，补之之术则曰“可用行师”，即藉刚武以自见。然刚武虽用，终不施于外，仅“征邑国”而已，亦自解其难耳。","Z":"谦卦六爻，吉凶之判与他卦异。下体三画无不当于吉，上体三画稍杀，然亦俱得利辞，悔吝凶咎绝无一焉，此其特异者也。盖卦以谦立义，谦之为德，随所处而皆可自免，故不择地而安。初六体柔处下，谦而又谦，失道寡矣；君子当此，虽大险可涉，患害无自而生。六二柔得中位，正而自守，德积于衷而声达于外，其吉以正。九三负成卦之任，功最高而位反居下体之下，君子如是，终其身吉。六四介于上下之间：上为谦巽之君，下为劳谦之臣，多惧之地也，而动止云为，无一不宜于㧑谦，盖谦之发扬，本以尽为贵。六五、上六并居上体之高，在谦则为失位：五虑有不服，故舍谦而言侵伐；上求应不得，故因鸣谦而言行师。侵伐行师云者，究其归趣，皆以行谦，故有利而无咎。\n孔子所为《彖传》，有可深味者。其言天地鬼神与人莫不贵谦而恶其反，人道恶盈而好谦，天道、地道、鬼神亦皆背盈而向谦，是谦为可好，盈为可恶。此见孔子一至要之旨：人道与天道本无二致，人道之则必映于天道之中，所谓天人合一者是已。其说虽甚朴，而实不谬。以今语明之，人类社会之律与自然之律有共通处，合二者而抽绎之，非即哲学乎？然当辨者，孔子之天人合一与汉儒所言迥异。汉儒所谓，实为天人感应，谓天降灾异以警人，使人去恶就善，是天有意志而司赏罚，其说杂于禨祥；孔子则视人道天道均为客观之律，未尝以天为有神。"}},"16":{"id":"16","cnNum":"一六","name":"豫","pinyin":"yù","fullName":"雷地豫","shortFullName":"雷地豫","upper":"震","lower":"坤","upperNature":"雷","lowerNature":"地","lines":[0,0,0,1,0,0],"yaoLabels":["初六","六二","六三","九四","六五","上六"],"blocks":{"P":"豫字之义，古训所存者三，皆相近而不甚相远。其一为安逸闲暇之豫，其二为和悦通畅之豫：二者本相贯通，同以乐为归，而与忧为对。其三则为事先备具之豫，谓能察几微于未著，先为之所。此三义者，前二易晓，第三者似与乐无涉，而实未尝不相通。盖事预则立，措置既得其当，所获自善；所获既善，则心安体舒，不期乐而乐至。抑犹有一说：前之人创制立法，为其后者奠其基、厚其积，后之人拱手受之，不躬其劳而享其逸，亦足致和乐。俗谚所谓前人植树、后人得荫，正此谓也。\n豫之次乎谦，亦有说焉。《序卦传》曰有大而能谦必豫，盖谓：居养既厚，内实有余，而能以谦巽自将者，其究必享安和之福。然则豫者，非攘取之所得，乃谦德之自成者也。\n至卦名之所以立，可由三途窥之。一在卦德：外体震主动，内体坤主顺，顺居下而动在上，动不违乎顺，故名之豫。二在卦主：阳画唯一，九四当之，五柔悉归其下；又得坤体承于内，上下相孚，动而无所扞格，故名之豫。三在二象：震为雷，坤为地，雷藏地中，奋出而声作，宣畅和乐之意寓焉，故名之豫。","G":"豫，利建侯行师。","G.N":"利建侯行师之云，于二体取义。豫之外体为震，震为长子，有诸侯之象；内体为坤，坤为众，有三军之象。二者具而两事并举，故系此辞。试与他卦相较：屯体有震而阙坤，故止言建侯；师体有坤而阙震，故止言行师。此见圣人之辞非苟而已。\n再从二体之性观之。震出乎坤上，是动而得顺：上之人有所建立，下之众翕然顺从，如周革殷命而广封同姓，封建之谓也。坤承乎震下，是顺以从动：上之人有所征讨，下之众相与协从，如汤征自葛始，东西南北无怨，行师之谓也。","T":"彖曰：豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎！天地以顺动，故日月不过而四时不忒。圣人以顺动，则刑罚清而民服。豫之时义大矣哉。","T.N":"此三句者，前二就体取义，后一就德取义，合之而卦名以立。就体而言，一卦六画，阳爻独九四一画，是全体所归之主人。上下五阴莫不附而从之，向背既一，其志遂无所挠，故曰刚应而志行。志行于天下则天下豫，行于一国则一国豫，行于一家则一家豫，其理一也。就德而言，内体顺，外体动，动倡于上而顺承于下，豫之所由成也。\n《彖传》有定例：举卦德者，内体先而外体后。豫内坤外震，故其辞曰顺以动，不曰动以顺。二者所系之连词不同，义亦随之而异。凡用而字者，两义齐举，无分轻重，小畜之健而巽、讼之险而健是也，既健复巽，既险复健，未有偏主。凡用以字者，则一轻一重，前字为纲而后字为目。此卦云顺以动，所重者在顺，不在动。故名豫之故，顺为要义，或可谓之关键。使上动而下不应，或动而不本于顺，则豫之名无所立矣。\n豫，顺以动，故天地如之，而况建侯行师乎，此以卦德释卦辞也。顺以动三字，实以顺为动之前提。凡人事之动，大而治国家平天下，必也上合天理，下洽人心，即所谓依乎规律，不得已而后动；苟背理拂情，轻举妄动，未有不偾败者。天行之健、地气之运，亦惟顺是以动，故能成其豫。所谓顺，非阿徇之谓，循理而行、无所拂逆之谓也；动不离乎顺，则所动皆当于理。天地且然，而况建侯行师系乎众庶生死，岂容逆理而妄动哉。\n天地以顺动，故日月不过，而四时不忒。圣人以顺动，则刑罚清而民服。《易》之立教，以天地人三才之动皆当有则。天地之顺动，即循自然之序而行也。日月不过与四时不忒，二者似分而实合：躔度不失，则节候自正，初非两事。王者取法天地，其治民亦当以顺动。法之所禁，宜即民所不欲；法之所许，宜即民所欲为。顺民心而政令出焉，则刑简而民服。\n豫之时义大矣哉，此叹辞也。叹之云者，非徒歆动之，欲人于此卦反复沉思而深识其旨耳。夫时、义、用三者，六十四卦之所同有；孔子系《彖》，独标其目于十二卦，盖取一类以示例，非谓自余五十二卦而外便可废此三目也。其标时大矣哉者四卦：颐、解、大过、革，皆大事大变，机括在前，时之先后一差，则事随之成败。其标时义大矣哉者五卦：豫、随、遯、姤、旅，迹近细微，而意寄深远。屯、豫同有利建侯之辞，所指则异：屯所急在时，豫所重在义。其标时用大矣哉者三卦：坎、睽、蹇，本非美事，然用之有术，因时而动，往往转败为功。三目之名虽分，其归则一：皆欲人审所处、善其用而已。","X":"象曰：雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。","X.N":"雷之出于地，古人所信也。雷非自外飞入，乃地气郁积之久，逼而后通，破土而出，与阴气搏击，其声遂震。雷之为物，最能鼓荡和气，发舒万物之生意，宣畅而和乐，故坤下震上之卦以豫名。\n先王以作乐崇德，殷荐之上帝，以配祖考：句首以字当用字解，句末以字当而字解。殷训盛，配训妃、训对。先王取雷出地奋之象以为则，效其声之和，法其义之和，播之金石丝竹而成乐，以昭明己德。祭飨之际，举此乐盛陈于上帝之前，又取己德上比于祖考。\n对上称荐，对祖称配，文异而意实相足：荐上帝者，祖考亦在其中；祭上帝有乐，祭祖考亦有乐，其礼皆盛。德之配乎祖考者，亦即其配乎上帝者也。合而观之，豫卦所蕴甚远，上报乎帝，下述乎祖，此作乐崇德之大典，皆自雷出地奋之象感发而成。","Y1.T":"初六，鸣豫，凶。","Y1.N":"初六体柔而居最下，独与豫之主九四相应。此如不中不正之小人，值上下耽乐之时，而为上所宠任，意得志满，不自敛抑，其乐之至也，形于声音，举止之间尽露浅躁之态，凶在其中矣。\n夫鸣者，情动于中而发于声，非可勉强为者也。然所感者异，则其鸣之得失亦异。谦上六曰鸣谦，豫初六曰鸣豫，同此一鸣，而所从出者殊。上六之感由于九三，其鸣也，有不愿久居尊位之心，是欲以鸣致谦者也，故吉；初六之感由于九四，其鸣也，怀安于逸乐之意，是挟豫以自鸣者也，故凶。","Y1.X":"象曰：初六鸣豫，志穷凶也。","Y1.XN":"逸豫本非恶，不善处之则恶。耽于此者为恶，当其始而已耽，又漫无戒惧，则恶之尤者。初六鸣豫，豫方始而声已扬，其器量可知，其志气可知，凶何足怪。","Y2.T":"六二，介于石，不终日，贞吉。","Y2.N":"豫之一卦有可异者：凡与九四相牵系者，应之与比之皆是，不凶则悔，不悔则疾，未有得吉者。初六应之而凶，六三比之而悔，六五比之而贞疾，其验如此。独六二巍然于五阴之中，与九四绝无系援，虽处乐地而无恋恋不舍之情。\n其静也，确乎自守，坚介如石，虽置之顺遂优裕之境，不足以摇其中。其动也，见几而作，不俟终日，问题甫萌即加剖判，断然舍去，无少濡滞；朝所当为，不待夕而后办。\n所以能然者，以其居中得正，而外无所系，有确然自守之象。然此特就所处之位言之，仅可谓有其资。资者，可以为善之具耳。欲使具者为实，果于获吉，则在乎人之自力于贞。贞者，守正而弗迁也。","Y2.X":"象曰：不终日贞吉，以中正也。","Y2.XN":"六二静而介然不乱，动而断然不疑，其本则在阴居阴位，处中而履正。","Y3.T":"六三，盱豫悔，迟有悔。","Y3.N":"六三之境，视六二悬绝。六二阴居阴，处中履正，外绝系援，故能介如石，不俟终日。六三则柔而居刚，位不中不正，又密比于九四，是以所发者为盱豫而非介于石，所患者为迟而非不终日。盱者，张目上视之谓。盱豫之义有二：希意承颜以取悦于上，而不能自立，一也；沉溺于乐，徘徊观望，迟疑而无断，二也。然六三虽柔，所居究为阳位，故犹存悔悟之机。悔之效验，系于其人之自处：翻然改图，决而速，则坏者可转为好；若迟回不决，则悔之又悔矣。古有字与又通，迟有悔即迟又悔也。","Y3.X":"象曰：盱豫有悔，位不当也。","Y3.XN":"六三之盱豫而致悔，其源在位不当，谓所处不中不正也。","Y4.T":"九四，由豫，大有得，勿疑，朋盍簪。","Y4.N":"九四为豫之主爻，豫之名所由立，系于此爻。自爻言之，五阴皆说而附之，因之而获安豫。自象言之，四为震体之主，震者雷也，万物之生意，未有不自雷而发者。推之乎人事，则四以刚德处积弱之余，而身任天下之重，众恃之而为安。\n大有得者，即《彖传》刚应而志行之谓：五阴归于一阳，所求无违，所向无阻。\n然所谓由豫而大有得者，非安坐而可致也。九四于此，尚有事焉：必也勿疑，必也朋盍簪，而后其境可几。即此一端，可见爻辞所诏，不过循时势而呈之趋向，为可以有然之途，而非一定不易之局；吉与凶、悔与吝，皆系于所遇之条件，未可执一而断。圣人立教，恒勉人力趋乎吉，力避乎凶，即凶悔之来，亦求减其分数，初未尝以命定之说自限。\n九四既以一身任天下之豫，其责重，其力孤。欲使同德者输心相与，唯在推诚布公，宽弘接下，不内自猜疑。疑去则朋盍簪，同道之人乃速合而并力。盍者，合也。簪之训，旧有聚、速两解，此从速义。","Y4.X":"象曰：由豫大有得，志大行也。","Y4.XN":"此与《彖传》刚应而志行相发。九四得由豫、得大有得，其本在以一阳受五阴之应，志无所屈而大行于时。通观六爻，唯此一爻所言者大，与全卦之旨相符；余五爻各就所处立说，事较切近，未必尽合卦义。","Y5.T":"六五，贞疾，恒不死。","Y5.N":"六五之辞曰贞疾，曰恒不死。疾者，身之患也；不死者，患而未至倾覆也。夫六五以柔质据尊位，是无刚德而居大位者也。无刚德者，处宴安则易纵，居大位则易骄，其以逸乐致亡，乃分所应得，且不啻有余。而孟子尝论国之存亡：内无守法之臣与辅弼之士，外无邻敌之虞，则其国恒亡。今五也，内实有九四焉，绳其愆而纠其谬，是以不亡；不惟不亡，且能持久，而所患仅止于疾。\n贞者，正也。然此贞也，非求诸己之谓，乃取正于人之谓。故贞疾云者，非谓受人之正而反以得疾；正谓赖人之正，故虽疾而终不至于死耳。","Y5.X":"象曰：六五贞疾，乘刚也。恒不死，中未亡也。","Y5.XN":"六五以柔懦之君，处逸豫之世，按理当以骄侈致亡，而竟止于有疾不入于亡，何故？以其乘刚也：九四以刚居下，为之辅弼，时加匡正，故不敢纵情于乐。夫疾与死相邻，而曰恒不死，则中未亡也一语尽之。就爻位观，五虽柔弱不足恃，然所居之中位犹在。譬之于人，中气未绝，命脉尚存，所以不死。","Y6.T":"上六，冥豫，成有渝，无咎。","Y6.N":"冥者，昏昧之谓。冥豫者，沉酣于乐，迷而不反也。上六柔居卦终，位不中不正，适当豫之尽处，昏冥汩没，凶征已著，若无可挽者。而爻辞乃曰成有渝，无咎，宜凶而卒不至于凶，此中寓事物转化之理，至为深切。\n夫冥豫之状，视之若沉沦已极，药石无所施；而正惟其处豫之终，物至极度则反，转机即伏于此，故有翻然向善而免咎之理。人无论处何等冥豫之地，苟能去恶从善，勇于改过，则冥之凶可化为渝之无咎。","Y6.X":"象曰：冥豫在上，何可长也。","Y6.XN":"孔子系之曰何可长也，其旨盖有两端。乐之过甚，至昏顽而不知止，积日累月，凶必及之：此示祸之烈，使人知惧。豫而至乎其极，势穷则变，有不容不变者：此明理之常，使人知几。","Z":"豫卦所蕴，约而分之，正面反面二者而已。卦辞与《彖传》之文——利建侯行师也，顺以动也——皆从正面立论，明致豫有其方，亦明致豫之极盛。至于六爻，其与卦辞、《彖传》相承者，独九四一爻耳；九四为卦之主，又卦中唯一之阳也。自余五爻，其辞与其小象，则各据所处之势位——势位者，谓其于九四或应或比、或远或近——反而言之，以见溺于豫者之祸，而为人指避就之涂。《杂卦传》以怠字释豫，其说明属此面。\n豫之一字，善事也，亦能为不善。处得其道则福随之，处失其道则患随之。故豫之在众，所宜有也；豫之在念，所不宜有也。卦中五阴，其吉凶之差，视去四之远近而定：远者吉，近者凶。\n六二于四，应也无，比也亦无，故为最吉；能察几微，速去怠豫之地而不居。初六独与之相应，为最凶；溺于豫端，不能自振，凶所必至。余三爻则居二者之间。六三、六五皆比于四，俱非美。三之所贵在速悔，稍迟则又悔矣；五虽居豫之时，赖人之正，而不获自纵。上六处豫之穷，其怠已顽，然穷则变，及时而改，犹得无咎。"}},"17":{"id":"17","cnNum":"一七","name":"随","pinyin":"suí","fullName":"泽雷随","shortFullName":"泽雷随","upper":"兑","lower":"震","upperNature":"泽","lowerNature":"雷","lines":[1,0,0,1,1,0],"yaoLabels":["初九","六二","六三","九四","九五","上六"],"blocks":{"P":"“随”之训为从，朱熹与清人查慎行皆主之，其说不可易。然从非漫然相顺，其义在通晓时变、不为故常所拘。至于其间孰主孰宾，则诸家持论纷然。程颐兼取两面，谓物之从己与己之从物并存；《周易折中》独主己从物，而以物之来随为响应之效。二说相较，后说为长。盖人际相接，先有我就人，而后人来就我；彼之从违，视我之向背而定，非彼能自为主也。\n震下兑上之体，何以系以随名？析而观之，内卦震也，其德为动，其性属阳；外卦兑也，其德为说，其性属阴。阳降而居阴下，动者发乎内，说者应乎外，随之势成焉。更即卦画求之：六画之中，刚者尽处柔者之下，亦随义也。凡卦或以阳体处阴体之下，或以刚画居柔画之下，兼此二者，六十四卦中惟此一卦，命名之意即在于此。推之人群：贵者肯居于贱者之下，博闻者肯问于寡闻者，皆随也。\n《序卦传》系随于豫之后，谓悦豫既至，则物必来附。以理揆之，所据未为坚确；然由此可知孔子之意——六十四卦之次第非出偶然，彼固尝求其条贯矣。盖卦序之相承，其间自有脉络可寻，非后人所得妄易也。","G":"随，元亨，利贞，无咎。","G.N":"随之云者，舍己而顺物也，故可致大亨。然随非漫无所执，其间有节焉：所当随者从之，所不当随者则不可苟同。贞正者，其本也；本立而后亨通可几，咎悔可免。若舍正而专言从，古人斥为诡随；诡随者不惟无以致亨，咎且不免。此随之所以有节，而非苟合者所得假借也。\n《左传》襄公九年载穆姜之事：筮遇随卦，史官劝其速行以避死，盖取卦辞“元亨利贞无咎”为吉。穆姜自谓虽得此卦亦不能免，以己不具四德；无德而随，咎安可逃？\n穆姜以元亨利贞为四德，其失也。四德之目，独乾卦足以当之，元、亨、利、贞各为一义；他卦之辞则不可援此为例。然其言随而无咎必有所待，则深契卦辞之旨。","T":"彖曰：随，刚来而下柔，动而说，随。大亨贞无咎，而天下随时。随时之义大矣哉。","T.N":"“随，刚来而下柔，动而说，随”者，释卦名之辞也。其中“刚来而下柔”一句，古今凡两解。\n一为卦体之说。刚谓内体之震，震本阳卦；柔谓外体之兑，兑本阴卦。阳卦之位宜在阴卦之上，今震顾自屈而居兑下，是以大让小、以贵下贱，随义生焉。\n一为卦变之说。汉魏诸儒有以卦变言者，虞翻、荀爽开其先，蜀才踵其后。虞翻之说云：否之上体本乾，乾之一画降入坤初，是刚来而居于下也。蜀才之论亦然：卦自否来，上体之刚降而处初，初位之柔升而上行，动在内而说在外，故名为随。朱熹《本义》亦主之。诸家和会若此，然于《易》之本旨有违，未可遵用。\n苏氏轼之说独为可据。其言曰：《易》中凡称刚柔往来相易者，皆推本于乾坤。乾以一阳施于坤，替去坤中之一阴，三男之卦由是而成，其数阳一而阴二；故此类卦中见“刚来”二字，正谓源出于坤，乾来化之也。坤以一阴施于乾，替去乾中之一阳，三女之卦由是而成，其数阴一而阳二；故此类卦中见“柔来”二字，正谓源出于乾，坤来化之也。由此言之，凡涉此辞，必三男三女相配之卦；不在此列，则无此语。说见苏轼《东坡易传》之贲卦《彖传》。\n六子同出乾坤之交，苏说可验于《说卦传》：乾坤父母也，一索得震为长男、得巽为长女，再索得坎为中男、得离为中女，三索得艮为少男、得兑为少女。苏说为长。准此，则“刚来而下柔”之刚，乃乾之一画，来而易坤之初画，坤初由柔改刚，是之谓“刚来而下柔”。刚既来居于下，随义遂立。\n“动而说，随”者，就二体之德以释名也。震之德为动，兑之德为说。内既动，则外不能不悦；动既发乎内，则应之于外者自不能已。动固是随，说亦是随；说之随由动之随而致，而动之随已涵说之随于其中。二者相因，随义乃备。\n“大亨贞无咎，而天下随时，随时之义大矣哉”，则释卦辞也。《周易》于“时”字最所措意。孔子之识时，视前人尤深。孟子称“孔子，圣之时者也”，取一时字括其学之宗旨，可谓得其要。孔子之作《易传》，于时字再三致意，非无故也。\n随之所难，不在随而在正。随而得正，大亨无咎可期；一失其正，咎且继之，遑论乎亨。然则正与不正，何以辨之？曰：无定准也，视其时而已。时当随则随，时不当随则止，故曰“天下随时”。末句之赞，正谓随之为事人所易能，而能各当其可、不失其时，则难之难者。","X":"象曰：泽中有雷，随。君子以嚮晦入宴息。","X.N":"泽中有雷之象：雷藏于泽，泽被雷鼓而动，是其为随也。君子玩此象，知一身之作息当与天时相应，故“嚮晦入宴息”。昼往则夜来，夜尽则昼复，光阴迭代而不居；明作之时宜自强，向暮之时宜退息。事至而应，各以其候，是即随时。起居之细既当如此，则凡大者远者，从可知矣。嚮读为向，晦者冥也，嚮晦谓日入而天色将昏。","Y1.T":"初九，官有渝，贞吉，出门交有功。","Y1.N":"六爻之相与，皆舍正应而取近邻；初二、二三、三四、五上，四双相比，卑者顺乎尊，下者承乎上，此全卦之通例也。\n初九以阳居初，为一卦之主。阳者阴之所宗，宗而主之者，古谓之官。既为众柔所宗，则阴之来随，乃其常分。然处随之时，不宜以主自处；当审乎时势，权其轻重，可随则随，是为“官有渝”。所变者事，所守者正；正既不亏，吉可知已。\n“出门交有功”者，出乎门庭之外，与异姓疏远之人相接，而不溺于门内之亲暱。“出门”设为譬况之辞，明其所交非私爱，交出于正；正则无所失，无所失则有功。交也者，随也，而此爻独不言随，何也？初九既为成卦之主，又属阳刚，阳固阴之主也，主无随人之理，故变其文曰交。","Y1.X":"象曰：官有渝，从正吉也。出门交有功，不失也。","Y1.XN":"爻辞先标“从正”，正者其枢也。为主而能自屈以下人，所趋果出于正，吉斯应之；一涉偏邪，则悔吝踵至。交必于户庭之外者，绝燕私之累，斯其交无所不正。末言“不失”，止是守正弗渝耳。","Y2.T":"六二，系小子，失丈夫。","Y2.N":"同为随也，而刚随之与柔随之，其辞有别：初九以刚下人，直谓之随；六二以柔附人，则谓之系。名异而实同。\n爻辞所称小子与丈夫，其目安在？曰：小子谓六三，丈夫谓初九。《易》之恒例，阳大而阴小，六三阴也，故系以小子之称；初九阳也，故被以丈夫之名。六二体柔而位中，柔则易牵，中则未定，其象为依人而立，不能自持。就其为心，非不欲兼系小子而又不失丈夫，然势有所格，终不可得。\n盖随卦之取义在比不在应，且主下随上。六二之近者惟六三，故不得不随三；既随三，则初九自远，二者无由兼与。此非独卦例为然，验之人事亦尔：处随之时，欲君子小人并容而两随之，必无是理；纵暂焉周旋，终必舍君子而昵于小人。凡随之所向，正与邪不并立，善与恶不并存，是与非不两遂：倚于邪则背于正，溺于恶则弃于善，逐于非则远于是。六二既系六三，其不能兼随初九，决矣。","Y2.X":"象曰：系小子，弗兼与也。","Y2.XN":"“系小子”者，省文也，具言之当云“系小子，失丈夫”。系于六三，则初九不得不舍，两系之势无所施。纵其心欲兼，而究竟所成，亦止于系小子而失丈夫耳。","Y3.T":"六三，系丈夫，失小子。随有求得，利居贞。","Y3.N":"随以比取义，以应为后，且贵上不贵下。故六三之“系丈夫”，所指者九四；其“失小子”，所指者六二。既系于四，则于二自疏，得于此者不得不舍于彼。\n卦义以阴之随阳为得。三与四地相邻近，以柔附刚，情易相投，有求而必获。然此二爻皆居非其位，其相与也，最易缘随以求，求其所不当求，得其所不当得。当此之际，六三所宜者，“利居贞”而已——守正为贵，与其有求，无宁无求。","Y3.X":"象曰：系丈夫，志舍下也。","Y3.XN":"此谓六三系乎上之九四，而舍乎下之六二也。其势与六二之系三失初正同，而所以异者，在“弗兼与”与“志舍下”二语。“弗兼与”者，六二之心本欲小子丈夫并系，君子小人两得；而卒也系小子、失丈夫，知其势不可兼。“志舍下”者，六三之初念即以系四舍二为定，本无兼系之图，非势夺之，志自舍之也。","Y4.T":"九四，随有获，贞凶。有孚在道，以明，何咎。","Y4.N":"九四上承九五，其地为近君之地，势本危疑。今又“随有获”焉——获者，众心归之之谓。声名既盛，浸浸乎与九五相埒，危孰甚焉。“贞凶”云者，谓固执此局而不知变，则凶自取也。然救之有道：“有孚在道”是也。凡存诸心、见诸事者，既竭其诚，又协于道；更济之以“以明”，则嫌隙自消，何咎之有？","Y4.X":"象曰：随有获，其义凶也。有孚在道，明功也。","Y4.XN":"“随有获贞凶”者，非谓凶已前定，乃言以义揆之，凶有其理，祸端可致云尔。人能自力于挽救，则凶可避。其机惟在“有孚在道”一语。所谓有孚在道，谓以实事自见，使上下晓然知其功之所在。“明功”非自陈其伐也；正相反，乃使人之知我者，见我心之光明洞达，所守者在义，初不计其功。","Y5.T":"九五，孚于嘉，吉。","Y5.N":"嘉，犹善也；孚，诚也、信也。此爻之孚，兼有随从之义。九五以阳居尊，位得其正，而中体充实。于六二之应、九四之比，举无所嫌亦无所疑，惟善是从。纯诚内充，自能感格于众；众之感也，亦以诚应，非以势合。\n然则曷为不言随而言孚？盖随之为道，得中为贵，过则失之。随之而过，非“孚于嘉”矣。九五之孚，中实而不虚，天下所谓善者，从而后之，而未尝越其节，故其辞曰“孚于嘉”。","Y5.X":"象曰：孚于嘉吉，位正中也。","Y5.XN":"所以然者，位与德兼也。位正，则凡所随者举无非善；德中，则虽善是从，而恰止其分，不至已甚。","Y6.T":"上六，拘系之，乃从维之。王用亨于西山。","Y6.N":"《易》中凡外体为兑者，大过、咸、兑诸卦是已；其五、上二爻皆悦而后动，比而不正。随亦兑在外也，而独异于此：随之为卦，义在刚之下柔，五上二爻虽有相随之分，却不生不正之嫌。\n“拘系之，乃从维之”者，既拘挛而系之，又从而绳约而维之，随之为随，其固结如此。上六不言系小子，亦不言系丈夫，独举拘系为言，何也？以其所系者在九五，而九五者君也、王也。“王用亨于西山”，谓九五身为王，亦下随上六，甚至以待贤之礼待之，信之无疑，至使主祭，以享山川上帝。亨与享通。西山者，周之岐山也。","Y6.X":"象曰：拘系之，上穷也。","Y6.XN":"随之道至上来而尽。物穷则变，随穷则转而为不随。就人事言之，恰如人之抗志高蹈、弃世独往而不复返者。然上六之于九五，有相随之义存焉，故虽艰屯，终必抑其绝世之怀，不肯竟去。是以他阴爻止言系，而此爻言拘系、言乃从维之。上六之随，其难倍于诸爻，于此可见。","Z":"随之上体兑，兑柔也；下体震，震刚也。刚居柔下，一也。六画之序，阴皆在上，阳皆在下，刚又在柔下，二也。论其常，柔宜承刚，今则反是，刚顾下于柔。以刚下柔，随道无不通，卦名之立，正取诸此。\n卦之六爻，阴阳各三。其取义也，不问应与不应，惟以两相比者为相随。随虽一也，而辞各有当：初九曰交，九四曰随，九五曰孚，其间不能无别。初九“出门交有功”，所重在随之始，戒其偏系而溺于私暱。九四“随有获”，则随已成功，戒其当此之时必有孚在道，以防随之为事由吉转凶。九五之“孚于嘉”，则见随道至此已贵中实，而所向尤不可不择于善。\n阴爻凡三：二也、三也、上也，其辞皆曰系，未有言随者。系者，随之一端，非随之外别有所谓。特以三爻皆阴柔之质，当其随也，情每牵于所昵，视三阳爻为逊一等。"}},"18":{"id":"18","cnNum":"一八","name":"蛊","pinyin":"gǔ","fullName":"山风蛊","shortFullName":"山风蛊","upper":"艮","lower":"巽","upperNature":"山","lowerNature":"风","lines":[0,1,1,0,0,1],"yaoLabels":["初六","九二","九三","六四","六五","上九"],"blocks":{"P":"蛊之为字，非“事”之谓。无事而事从中起，是之谓蛊，而所起者又非美事。木之为器，气郁于内而不得宣，虫蠹由是而滋，精神日敝，久乃朽败——蛊之取象，正在于此。人之有疾，世之有乱，皆此类也：弊坏至极，而事端于是乎生。\n《序卦》以为悦而随人者，事必继之，故随之后受以蛊，且训蛊为事。夫悦以相随，本属美事；美事久而不返，未有不生弊者，此二卦相次之故也。\n再即卦画求之。下体为巽，上体为艮，而以风处山下取象。风以鼓动为功，一为山所拦，则回薄于崖壑，草木失其条达，其久必蠹，名卦曰蛊，取此。\n抑又有说焉。体分阴阳：艮阳在上，巽阴居下，其位判然。六位之列亦复如是，刚画居尊，柔画居卑。合卦与爻而观，六十四卦之中，刚柔之位如此两截者，更无他卦。上下悬隔而不接，刚柔相望而不通，久绝而生事，亦蛊名之一义。","G":"蛊，元亨，利涉大川。先甲三日，后甲三日。","G.N":"积渐不通，久而事生，此蛊之所以为蛊也。然则卦辞何以系之以“元亨”？曰：物理极则必反。壅者到得尽头，反成大通之机。就一国言之，乱者治之根，蛊者饬之阶；乱象既见，治局终有出现之日。\n所不可不知者，治不因乱而自来，通不待时而自至。事有可为之理，而未必有成；必也人以其力赴之，然后理者为实。可能性存于客观，成就则系于人为，二者缺一不可。不种者不获，不奋者不兴。祸乱既作，必经修剔整顿，涉过艰危，然后可望大治，此“利涉大川”之所指。\n治蛊本非易事，非足智多虑、慎重将事者不能，故必“先甲三日，后甲三日”而后可。甲之为义，事之所由起也。先甲者，未治之先，推究致蛊之因，稽其得失，以定整饬之方；后甲者，既治之后，审察事势所趋，以定持守之计。三云者，多之谓；三日云者，谓所见者远、所思者深。","T":"彖曰：蛊，刚上而柔下，巽而止，蛊。蛊元亨而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。","T.N":"“刚上而柔下”一句，所以释卦名。此语可自卦体看，亦可自卦变看。自卦体言：上体为艮，其质刚；下体为巽，其质柔。以爻言之，上九居上体之终而其画刚，初六居下体之始而其画柔。刚柔既不交接，上下复相隔绝，蛊之名由此而立。自卦变言：上体之坤，得乾之一阳来居其上，遂成上九，柔体因而转刚，据于尊位；下体之乾，得坤之一阴来居其初，遂成初六，刚体因而转柔，处于卑位。然则此语所判，只在蛊之所由生，未及蛊之所以治。刚者在上而高亢，不肯下交；柔者在下而卑巽，无力相救；隔绝既久，蛊坏乃成。\n“巽而止”者，亦释卦名。巽者柔顺之德也，其弊在委靡：临大事而迟回，无直前之勇，安于积习而惮于改作；重以艮止当前，事无可为，弊无可解，日积月累而蛊成，理之必至。\n“蛊元亨而天下治也”以下，乃释卦辞。元亨者，治蛊之方也。蛊之极，乱之所由起；乱之尽，治之所由开。亨通之至，治象自成，此其所以系元亨也。\n“利涉大川，往有事也”。蛊坏之世，譬如洪流当前，渺无津涯，非一苇可度。此时惟有鼓勇而前，不疑不慑；然而既往，则艰虞纷至，待理之事无穷。水停则腐，枢转则不蠹，处蛊坏之世而畏难苟安，终无出理；惟不惮烦难、勇于有行，乃可济此洪流，转乱为治。\n“先甲三日，后甲三日，终则有始，天行也”。夫子合人事与天道而观之，见人世之变与自然界之运本无二致。社会坏至蛊极，必有一番收束，而后入于全新之境；旧者终，即新者始。此终始相承之律，犹斗柄迁移、四时代谢，夜尽而昼来，冬残而春继。","X":"象曰：山下有风，蛊。君子以振民育德。","X.N":"风之行也，遇山而止，激荡于崖谷之间，草木为之披折，此蛊坏之象。反而言之，风善动而能鼓物，山善静而能畜物；动以鼓之，静以畜之，振起与涵养之意交存焉。君子当蛊之世，取两象而并用之：民志易靡，则以风之动振之；民质易漓，则以山之厚育之。","Y1.T":"初六，干父之蛊，有子，考无咎，厉终吉。","Y1.N":"器物久置不用，虫生于其中，是谓蛊；人久酣豢于宴乐，疾作于其身，是谓蛊；天下久安而无事，弊伏于其间，是谓蛊。是知蛊之来也，非一朝一夕之故，往往阅一世而形见，故卦中诸爻每以父子为况。\n爻辞之设，或据时位，或据才质，此爻则两义兼之。初六，阴也，居下体之下，其上又无正应；以才具言，以力量言，皆未足以任治蛊之责。然时位一节，初六却占其利：蛊在初萌，陷溺未深，着手尚易。故爻辞许其为子能干父之蛊——父所造之弊，子起而理之；有子若此，父可免于咎矣。然所居者毕竟是蛊之时，危机犹伏，安得以蛊浅之故而漫不加省？故又系之曰“厉终吉”。盖能治而不敢恃其能治，危者乃所以为安也。","Y1.X":"象曰：干父之蛊，意承考也。","Y1.XN":"子掩父之失，其事如禹之承鲧。自外视之，若与父志相违；夷考其实则不然。过既消除，功赖以成，正所以继父之志也。考者，父之称。","Y2.T":"九二，干母之蛊，不可贞。","Y2.N":"九二以阳刚之质，上应六五之阴柔，而成母子之象。治母之蛊，其事与治父之蛊不同。九二刚而失正，六五柔而处尊；以刚阳之子而理柔尊之母，若求效太急、持论过直，未有不败其事者，故爻辞系以“不可贞”之戒。《易》爻无不予人以贞，而独此爻言不可贞。所谓不可贞，非谓可不贞，谓不可执一己之见、径情而直遂耳；惟以至诚行之，委曲周旋，力所可及则为，力所不及则止。","Y2.X":"象曰：干母之蛊，得中道也。","Y2.XN":"盖九二之体属巽，而后得中；以刚下系于柔，两不相掩，适为刚柔之中道。","Y3.T":"九三，干父之蛊，小有悔，无大咎。","Y3.N":"九三以刚爻而据阳位，刚过而不居中，持此以治父蛊，宜其“小有悔”。然九三本属巽体，位又得正，大体足以胜任，蛊可整治；虽有纤芥之悔，终不至酿成大咎。","Y3.X":"象曰：干父之蛊，终无咎也。","Y3.XN":"九三居巽体而位正，刚断之才是其所长；从事治蛊，中涂或不免小失，要其归宿，无大咎也。","Y4.T":"六四，裕父之蛊，往见吝。","Y4.N":"“裕父之蛊”与“干父之蛊”，其义正相反对。干者，把捉在手、奋力向前，如救沉溺、扑焚燎，不容片刻之缓。裕者，宽缓纵弛之谓；弊已深重，而犹从容暇豫，不肯措手。以爻位按之：六四之阴，爻也；阴位，位也；两柔相叠，其质已弱。所居又在艮止之末，止则安于故常。怯者不能断，怠者不肯动；二者并集，则前人之弊日增于其手，断无收拾之望。循是不改，蛊日以深，故曰“往见吝”。","Y4.X":"象曰：裕父之蛊，往未得也。","Y4.XN":"“往未得”者，即“往见吝”之互文：以宽缓处蛊，非惟无益于解纷，且将使纷日甚。","Y5.T":"六五，干父之蛊，用誉。","Y5.N":"此爻就子之治父蛊、嗣君之治先君之蛊，更进一层立论。六五处尊而得中，治蛊之才具也；其质则阴柔，承顺之德也。才与德兼，故能除前人之弊，而仍不没前人之名，爻辞所谓“干父之蛊，用誉”者以此。","Y5.X":"象曰：干父用誉，承以德也。","Y5.XN":"六五既治父蛊，又推美于父：蛊患以除，亲声无损。迹其所为，盖以德事父，非以才胜父也。","Y6.T":"上九，不事王侯，高尚其事。","Y6.N":"上九一爻，辞义颇异。它不言治蛊，而曰“不事王侯”，似与卦旨相离；实不然，其所论仍是治蛊，特所从入之角度与余五爻不同耳。上九处卦之尽头，四顾无援，亦无所应，遂超然立于蛊事之外。譬若不任事之人，遭天下无事之际，似无所施为。爻辞云“不事王侯，高尚其事”，其意盖谓：不事王侯之情，本身即是一事；此一事非寻常之事，乃以高尚为其事者也。昔贤钓于桐江，一竿之丝而系汉家九鼎，意正类此。","Y6.X":"象曰：不事王侯，志可则也。","Y6.XN":"上九不事王侯，自其表而观，类乎遗世独立之士，于世之蛊坏若罔闻知。究其实，彼亦未尝不治蛊，所治者人心之蛊，非世务之蛊也。与道家避世之旨，判然不同。故夫子于小象发之曰“不事王侯，志可则也”，明其志有可法者在。","Z":"事之坏也，非一日之故，积弊既久而后成，是名曰蛊。物、人、社会，三者皆有之。卦之名蛊，其义具于《彖传》“刚上而柔下，巽而止，蛊”一语。此中“刚上而柔下”，说的本是卦变；卦变之例甚繁，已详于贲卦，兹不复出。\n所当先辨者：蛊卦之重点，不落在蛊所由来，而落在蛊既成之后如何措置。既已成事实，则致由一节可置，而治法不可不讲。治之必待有为，《序卦》所以训蛊为事也。卦辞“元亨，利涉大川，先甲三日，后甲三日”，所条陈者尽是治蛊之事。\n《彖传》释之，其意若曰：世乱既极，则治为必至，如天行之有常，非人力所能遏；然而人事之勤亦不可废，故有涉川之勇，有先甲后甲之详。\n抑尚有可辨者。蛊卦系“先甲三日，后甲三日”，《彖传》以“终则有始”释之；巽之九五则以先庚后庚为辞，而许以无初有终。二者相近而实不同。甲者，事之所始。坏而至蛊，旧者尽矣，新者方来，故谓“终则有始”，谓“先甲后甲”。庚者，改也，事之更革也。事久弊生而未抵于蛊，及时改易可也；初虽未善，其后必归于善，此“无初有终”之所以云，而先庚后庚之所由系也。以史事况之：巽九五之辞，有似变法；蛊卦之辞，《彖传》以终始为说，有似易代。"}},"19":{"id":"19","cnNum":"一九","name":"临","pinyin":"lín","fullName":"地泽临","shortFullName":"地泽临","upper":"坤","lower":"兑","upperNature":"地","lowerNature":"泽","lines":[1,1,0,0,0,0],"yaoLabels":["初九","九二","六三","六四","六五","上六"],"blocks":{"P":"临之受名，承乎蛊卦。《序卦传》次临于蛊后，谓蛊为治事之卦，事既治则可以有营为，营为既广则规摹自大，临之所以得大名者在此。程颐取卦画为说，谓二画之阳浸盛于下，临之名由此立。合二体观之，兑泽在下，坤地在上，泽伏于地中。地于万物最为卑下，本无以临人；然更有卑于地者，则泽是已。岸者，泽上之地也，与水相薄而为之界，水止于岸，地覆其上，临之象可见。就其实指而言，临者，事物方兴之态势，非徒上下相压之谓。卦画六位，二阳居下，四阴在上。复卦仅初九一画为阳，至临而初九、九二两阳并见，阳德浸盛，正当其会。惟其盛，故能临。","G":"临，元亨利贞，至于八月有凶。","G.N":"元亨者，大亨也；利贞者，利于守正也。四字并列，而轻重有辨：元亨非无因而至，其因即在于利贞。临之为卦，以刚临柔，以大临小，与复之体段迥别。复者，阴柔穷极而一阳乍还；临者，二阳已至，进逼于四阴。第就二卦之辞相较，复举一亨而止，临则增益至三字，其故安在？一阳初还，其亨出于自然，本无待于戒勉，是以不复言正。二阳浸盛，气锐而势张，最易纵肆而失度，非守正无以保其元亨。此四字之权衡也。盖系辞者，予之而必有所责，许其亨而即示以守正之途，非漫然相许而已。\n十二辟卦之目，汉儒京房所立，其端即自“八月有凶”一语启之。其法取十二卦，自复而临而泰而大壮而夬而乾，为阳长之六；自姤而遯而否而观而剥而坤，为阴长之六。以配岁中十二月：阴极生一阳者复，当建子，于夏时为十一月；二阳继之者临，当建丑，为十二月；三阳则泰，当建寅，为一月；积至六画皆阳，是为乾，当建巳，为四月。阳既穷则阴生，一阴来者姤，当建午，为五月；二阴继之者遯，当建未，为六月；三阴则否，当建申，为七月；阴积至六画皆阴，是为坤，当建亥，为十月。此十二卦配月之说，未必古经本有此目，殆后人因临辞而推演之耳。然取复卦大象至日闭关、商旅不行之文相参，则其来亦有自，未可尽斥为无据。\n所谓八月，非指岁中之八月。自复之一阳数起，历临、泰、大壮、夬、乾、姤，至于二阴之遯，前后凡八阅月。质言之，乃自十一月逆计之第八月，非八月之月分也。\n“至于八月有凶”，其实即谓至遯而凶。遯何以致凶？盖二卦之画，适相颠倒故也。临当二阳方生，气机向盛，故有元亨之美；及乎遯，则二阳已易为二阴，长消之势倒置，向之所盛者转而向衰，此凶所由起。然凶之为言，特示其几，非谓祸已及身而不可解。祸福之来，操之在人，苟能戒惧修省，凶可化而为无凶。\n自建丑之临，至建未之遯，中历泰、大壮、夬、姤诸卦，其势皆有此一转变，何独临之卦辞系以此语？盖临居阳长之极盛，盛则易骄，最须于此时预知物极必反之理，怀履薄临深之惧。复则一阳始生，力未充，势未盛，此语未至其时，无庸早计。若泰、大壮、夬，则阳长已过其中，境象渐入于衰，其虑患也易；及其衰征既著而后言之，则言之已晚，不若临之先事而戒也。","T":"彖曰：临，刚浸而长，说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。","T.N":"“刚浸而长，说而顺，刚中而应”三语，皆所以立临之名。先就一卦之体言之：浸者渐也，非骤然而长，乃日久月深、潜移默运之长。凡物之渐而长者，其生机必厚，其力必绵。复仅一阳还于地下，至临则积渐而成二阳，阳德日伸，有奔轶绝尘、莫能遏止之概，此临之所以为临也。次就二体言之：下兑上坤，兑为说，坤为顺。以说言，则阳之进也舒徐而不迫；以顺言，则阴之退也翕合而不违。刚前而柔后，大主而小从，以大临小之象，于此宛然。末就九二言之：二为成卦之主，刚而在中。刚则强，中则不溢，盛而未至于亢。上与六五为正应：君降己以交于臣，臣输诚以事其君，两情相与，阴阳合德，故其力足以临其所临，非徒以位相压而已。\n“大亨以正，天之道也”，乃夫子释卦辞四字之言。其意为：刚既浸长，说而且顺，刚中而应，则其致大亨而合于正，有不期然而然者。此非人力所造，乃天之道，即自然之律。天之道的骨子，一言以蔽之，阴阳消长而已。\n消长既为自然之律，则人处其间，能识之、能顺之而已，违之不可，改之尤不可。阳进则阴必退，阴进则阳必退；阳进阴退之局，终必转为阴进阳退，此铁案不可移者也。卦自复之一阳，积至临之二阳，阳德方昌，阴德方杀。当此之际，人每狃于目下之盛，而忘盛之必衰、消之必长。\n夫子于“至于八月有凶”之下，断以“消不久也”四字，正指破卦辞之底蕴。消不久者，谓阴之见消，为时无几也。今二阳方长，四阴方消，然消至八月，及乎遯，则阳不复长而阴始长矣。阴之消既不能久，则八月之凶自不能免。此语所以告人者：处得意之时，当先虑其反。夫子之意，人之道犹天之道，天行虽非人所能拒，而事未至而为之备，则灾可杀、害可避，此正人事之所得为也。","X":"象曰：泽上有地，临。君子以教思无穷，容保民无疆。","X.N":"泽上有地，就二体之位言之，地据乎上，泽处乎下，二者相与之际，即所谓临。以象显之，是上者俯而向下者施；顺言之，则曰以上临下。临之为义，有一成而不可易者：必上之临下，下之受临，其势顺而不逆。若倒置而相反，则不得谓之临矣。然地之临泽、上之临下，其所以能然，非德非力，惟在乎所处之势位。此在造化，本属自然之象，即前所谓天之道。\n及施于人事，则谓之人之故。人事之中，临之大且著者，无过天子诸侯君临天下国家，质言之，即治者之于民。治者之临民，其本质亦一势位之事。盖国家之为物，不论其以何辞自饰，处阶级之中，终以强力为骨。\n然孔子自创儒家，别立一义。其所尚者德治，欲以教化感人，而使民自趋于善；于行政之督责、刑罚之惩创，则以为末而弗先。要其归，欲使人中心悦服，而不以势屈之。彼取平日教民保民之旨，附丽于临卦泽地之象，以为其说立一思理之根。\n由是，孔子于泽上有地之象，所见较前人为深。地者土也，泽者水也；土之象为治者，水之象为庶民。土与水，浸润浃洽而不可离，治者之于民亦当如是。如是者何？亲民是已。亲民非他，即教之保之也。析其目，则曰“教思无穷，容保民无疆”。此二语者，又可于土水之际更求其证。\n水，天下之至柔也。以土制水，宜若无难；然苟以险隘阂之，则水必奔决四出，溃隄坏防而后止。土之性则宽厚，未尝与水力争，惟以其广衍之体，予水以容身之地，水乃安而为泽，受其涵濡而不为患。治者之遇民，正当如土之含水：不塞其流，不夺其居，使之有所归而安于泽。\n土与水相濡相渍，密而无间，治者于此得“教思无穷”之义。教思云者，非发号施令之谓，乃出于中心之诚，虑之也远，施之也久，绵绵不绝，而无有穷期。\n土以其广大之体拥护广衍之水，治者于此得“容保民无疆”之义。容保云者，法坤土之含弘，于民无所择、无所拒；所容者广，所保者众，无畛域之限，无止息之时。","Y1.T":"初九，咸临，贞吉。","Y1.N":"咸者，感也，两情相与而通之谓。凡卦之初、上二爻，例不系以得位失位，而多取初终之义为断；临则不然，独以初九之得位居正为言。初九值阳长之候，位又当正，所应者六四，亦以阴居阴而得其正。两正相求，故系之曰贞吉。\n然初九之临六四，非徒恃其位而已。其相接也，以阴阳相感为枢。以德相感，则六四乐就之；以势相逼，则六四未必从。乐就者，感之效也，故其临为感临。感临之得贞吉，理有必至。\n“贞吉”二字，在《易》中例有三义，此处乃平列之辞，谓既正且吉耳。以阳画处阳位，其位既正；又与六四相应，其交既亲。正与吉，皆非幸致。","Y1.X":"象曰：咸临贞吉，志行正也。","Y1.XN":"初九得咸临之贞吉，其故在志行不失其正。所以能正，则以阳居阳而位当，外与六四相应，所行自无偏颇。","Y2.T":"九二，咸临，吉无不利。","Y2.N":"九二值阳德方盛之会，上应居尊之六五，其得名与初九同，亦曰咸临。然二爻之取义有别：初九以刚处刚，位正而吉；九二不以位胜，以刚而居中、上应于五而吉。刚既处中，则贞之一字可以不论；其吉则与初九无异——咸临本即含吉，吉为已然之效，非待占而后决。二之刚中而应，所居既优，不惟见吉，凡有所为，亦将无适而不利，此亦必然之势。《易》之为教，正与中并重，而于中尤严，于刚之中尤三致意焉。","Y2.X":"象曰：咸临吉无不利，未顺命也。","Y2.XN":"“未顺命”一语，最为难明。朱子《本义》但书“未详”，后来诸家歧解纷出，皆未得其肯綮。今姑阙之，以俟知者。","Y3.T":"六三，甘临，无攸利。既忧之，无咎。","Y3.N":"卦辞与《彖传》言临，皆主刚之临柔、大之临小。爻辞则分二途：初、二两阳，犹承大临小之义；自三以下四阴，则皆就势位为说，所谓上临下者是也。\n六三以阴画据阳位，不中且不正；位在下体之上，又当兑说之尽处。有临人之位，而无临人之德，其所恃以临者，惟口舌之甘，以悦下取容而已，故谓之甘临。甘则非德，无德而临，宜其无所利也。\n然六三亦非遂无自新之路。使其能察初二两阳处己之下，方浸浸然而上进，于是抑然自持，守正而不苟，知危而预为之忧，则向之咎者可转而无咎。","Y3.X":"象曰：甘临，位不当也。既忧之，咎不长也。","Y3.XN":"六三之取“甘临”，其病根只在一“位不当”。甘临者必有咎；然既有咎而知忧，忧而知改，则咎不积于久，终亦可以无咎。","Y4.T":"六四，至临，无咎。","Y4.N":"六四之体，柔画处柔位，其位既正；下与初九相与，又有应援。所居在坤体之下，去兑为最近，故其临得“至”之名。至者，言其地之切近也。无咎之故，尽在于此。","Y4.X":"象曰：至临无咎，位当也。","Y4.XN":"三、四同系无咎，而三劳于忧，四安而无事，其分在位居之当否。所谓当者，有二说：一谓六四以阴居阴，其位得正；一谓四在上下二体之交，于临之时最为得地。","Y5.T":"六五，知临，大君之宜，吉。","Y5.N":"知字破读，音同“智”，谓明照于事，非见闻记诵之知。六五体柔而位居中，所应者九二，刚而在中者也。五不自有其能，举临下之柄以授之。收天下之才为己才，合天下之明为己明，此南面者所当具之识。用是以驭天下国家，吉不待卜而见。","Y5.X":"象曰：大君之宜，行中之谓也。","Y5.XN":"《易》之为道，中以可贵。大君不以一己之见为见，而合众见以为见；取臣工之明，用以临制天下国家，其枢在“行中”一语。中者何？施设之间有节，不偏于刚，不偏于柔：过宽则事弛而不举，过察则细苛而伤体，二者皆非中之所许。","Y6.T":"上六，敦临，吉无咎。","Y6.N":"敦者厚也。以敦笃之厚德临下，是上六之所独，故名敦临。上六与六三，其取象适成对照。六三处下体兑之终，兑主说，说之极则流于媚，有小人之状，故曰甘临。上六居上体坤之终，坤主厚，厚之极则为朴，有君子之状，故曰敦临。\n更以刚柔之际言之：上六于初、二两阳，本无正应，而阴柔之性，例不能无所求于阳。初二两阳固未尝有意于上，上六乃不恤其尊而下与之接，不恃其高而俯以从之，此为阴从阳、尊从卑，其情笃，其意诚，厚之至也。夫以阴柔而据上位，本非临人之地；苟往而临之，咎必随之。上六独以敦厚自处，能以其柔顺乎刚，故得吉；既吉，则咎自无所容。","Y6.X":"象曰：敦临之吉，志在内也。","Y6.XN":"爻辞言“志在内”，所向者初、二两阳，不在外也。上六于卦本无正应，初二亦未尝与之为应。顾其体属阴，阴不能自固，必依于阳；故不俟彼之来，而先屈己以下之，此其志之所以在内。柔而能顺，顺而能笃，吉自此出。","Z":"临之二体，阳处其下，阴处其上，于月为建丑，阳气方进而未艾，是阳道向盛之候也。临兼二义：刚之临柔，一也；上之临下，二也。卦辞所取，在前一义。其系以元亨利贞，非徒许之，实兼戒之：刚之临柔，固可致元亨，然盛极则反，阳之长终且为阴之长，此处最宜早辨。\n初、九二皆刚也，其临皆以刚临柔，与卦旨相合。初与六四为应，二与六五为应，当阳德浸长之时，其感乎阴者，比他卦之应尤为深切，故皆得吉。抑其得吉，又各有本：初九以阳处阳，位得其正；九二以阳处中，不偏不倚。正与中，皆吉之所由立也。\n自三以下四阴，则皆取上临下之义。然四爻所遭不同，其辞亦异。六三之甘，以口舌媚人者也，小人之道也，能自忧则咎可免。六四所处既优，地又近下，故直断以无咎。六五柔顺而在尊，不自有其知，收众人之明为己用，故吉。上六敦朴，心系乎下，甘从二阳，故吉且无咎。"}},"20":{"id":"20","cnNum":"二〇","name":"观","pinyin":"guān","fullName":"风地观","shortFullName":"风地观","upper":"巽","lower":"坤","upperNature":"风","lowerNature":"地","lines":[0,0,0,0,1,1],"yaoLabels":["初六","六二","六三","六四","九五","上九"],"blocks":{"P":"临者，大之义也。物之既大，则为众所瞻，故《序卦》以观承临。然“观”字实兼二义、具二音，不可不辨。上之人自具仪型以示下者，是自上示下之观：宫阙巍然，榜曰观阙，令人仰而望之，卦辞所取在此，音读去声。下之人视上之作为、上之人察下之得失者，是自下观上之观，六爻所取在此，音读平声。以卦象求之，坤处其内，巽居其外，风自行于地上，吹拂万类而无不到，有周遍观览之象。以爻位求之，二阳在上，四阴承之；阳刚既据尊位，四阴环而仰瞩，亦观之义也。卦名之立，盖兼此数者。","G":"观，盥而不荐，有孚颙若。","G.N":"读去声者，卦辞之“观”也，其义为在上者示仪于下。卦体二阳居上，四阴处下，在下者仰视在上者，正如天子诸侯端居尊位，容止庄严，周旋恭敬，为臣民之仪表，使观者感于中而化于外。然感人之效，果何由而致？曰：惟诚与敬而已。爻辞假庙祭为喻：“盥”与“荐”，祭之二节也。祭节非一，独举此二者，为其时之心最可验耳。祭之初，承祭者先洗手，当此之时，心无他及，专一严肃，可谓至矣；及“荐”而进献祭品，中怀已渐散漫，不复有盥手之际“祭如在”的光景。故“不”字当读为“未”。“盥而不荐”者，谓君上欲为臣民树庄敬之范，使之观感而受教，则己心须常如祭时盥而未荐那一刻，精诚不杂，始终如一。“有孚颙若”则就臣民一边说。颙者，仰望之貌。上之人果能庄严诚敬如盥而未荐，则下之人自将各竭其孚诚，颙然向之而观仰。","T":"彖曰：大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。","T.N":"孔子释卦名，取卦体与卦德为说，“大观在上，顺而巽，中正以观天下”是也。两处“观”字，并当读去声，义归一致：上之人先立其表，而后天下得从而仰之。所谓“大观在上”，专指二阳；然不径曰“在上”而曰“大观在上”，则顺巽之德、中正之体，凡所以为观者，悉在其中矣。下体坤，上体巽，是能顺能巽；中正者，九五当之，阳爻居阳位，得中而位正。合此三者，乃足以观天下。释卦辞者曰“观盥而不荐，有孚颙若，下观而化也”。君上居尊而尽诚尽敬，声息不闻；下之视上，本无督责相加，而诚心自向，遂不觉化于其中。故上无所动，下已肃然；上无所言，下已孚然。妙用盖如此。此“观”字读平声。至“观天之神道，而四时不忒。圣人以神道设教，而天下服矣”，则又进一层，专言观之道，其“观”读去声。天之有观道，犹人之有观道；人之观道本乎天，抑或谓二者初无二致。然则天之观道，何以不径以“天之道”为名，而必缀一“神”字？神者，谓天沉默无言而四时代谢、未尝差忒耳，非宗教所谓神也。天未尝有一言，而岁功自成，此其所以为神。圣人为君、为治，体此神道，知天不言而四时自行、万物自生、不差累黍之奥，于是施其德教，是即己之观道，“以神道设教”者是也。教行于民，而民无不诚服。总而名之：治者之观道，法天而立，不言而信，不动而敬，使百姓潜移默化于不自知，斯为神道设教。孔子“道之以德，齐之以礼”之旨，实寓于此。","X":"象曰：风行地上，观。先王以省方，观民设教。","X.N":"风之行于地上，无所不到，此周遍之象也。先王观象而有所取，于是巡行方国，遍察民情土俗；既得其情，乃设教化，使民有所观仰。省方者，所以观民，其观读平声；设教者，所以为民之观，其观读去声。","Y1.T":"初六，童观，小人无咎，君子吝。","Y1.N":"“观”之名，在卦与在爻，取义不同：卦主观示，是自具仪型以示人；爻主观瞻，则转为人观我，而非我示人。一卦之中，九五为卦主，余五爻所观者皆在此。观之为道，又以远近分优劣：去之愈近，所见愈真；稍远则依稀，太远则茫昧。初六以阴柔之质，居一卦之底，于九五为最远。远而又柔，其视九五也，无所睹见，譬如童稚，知识未开，目力尚弱，物在目前而不能辨，故其象为“童观”。此在小人则宜：庶民识见本浅，不谙天子诸侯之所以为观，固其分也。若君子亦复如是，与编氓同其昏暗，斯可鄙矣。","Y1.X":"象曰：初六童观，小人道也。","Y1.XN":"此爻之象，取诸细民，非所以责成人。位卑而无远识，在小人为固然，故可恕；君子居高目远，若亦蒙蒙如童稚，则耻矣。","Y2.T":"六二，窥观，利女贞。","Y2.N":"《说文》训“窥”为“闪”，谓自门内窥外，闪身而窃视也。六二与九五为正应，其所当归向而观者，非九五而谁？然二体阴暗，质又柔弱，识量不宏，于九五刚阳中正之道，终不能洞然尽见。辟如自门隙窥人，一端偶得，全体难明。所可恃者，二以阴爻处中得正，有柔顺守中之美；假令其人为女子，则守此窥观，不失为正，未始不利。","Y2.X":"象曰：窥观女贞，亦可丑也。","Y2.XN":"《易》之吉凶，随人而异：君子小人不同科，丈夫女子亦不同条。求之他卦，恒之六五，系妇人则谓之吉，系丈夫则谓之凶，可为比例；此爻之旨亦然。盖身为丈夫，立乎阳刚中正之九五前，仅得仿佛，所守与女子之贞无异，斯亦可丑矣。","Y3.T":"六三，观我生，进退。","Y3.N":"二居中，三不居中，以此论爻，通常二中而三否。至于观卦，则所重不在中否，而在距九五之远近。六三居下体之上端，又当上体之下际，恰在两地之间。论其远，尚未至“童观”之茫昧；论其近，又不逮“观国”之分明。既处进退之交，则不必区区于观五，返而自观可也：审己所处，时当进则进，不当进则止。爻辞系以“观我生，进退”，正为此。","Y3.X":"象曰：观我生进退，未失道也。","Y3.XN":"六三体柔而居阳位，又当上下二体之交，能自量其德才、自审其境遇，而后定其出处去留，于进退之道未尝有失。此与《论语》所记“用之则行，舍之则藏”正相契合。","Y4.T":"六四，观国之光，利用宾于王。","Y4.N":"观卦诸爻，其义皆系于九五一身。诸爻所观，又视其与九五之远迩而分。初六以阴居阳，去九五最远，所见蒙蒙，故曰“童观”；六二阴居阴位，相去亦遥，所见略胜而仍不明，故曰“窥观”。独六四逼近九五，又居得其正，其观最为昭著，是以谓之“观国之光”。所谓观国，其实所观者九五也。九五为阳刚中正之君，何以不曰观君而曰观国？此见《易》之作者以君为国之表，君国一体，观君即所以观国。“利用宾于王”云者，六四密迩君侧，君上盛德之光为其所深见，故于“宾于王”一途最为相宜。所谓宾于王，谓仕进王朝，居官任事，效其力于王所。古者国有贤能，则人君以宾礼礼之；士之进而仕于朝，因谓之宾。","Y4.X":"象曰：观国之光，尚宾也。","Y4.XN":"“尚”者，志尚也。所谓尚宾者，其志在进而立于朝，思有以自见也。六四之为人，未遇则洁身自守，既遇则兼济天下；苟无明君，姑舍之而已。今亲睹九五之明，见国家盛德光华如此，自当起而任职，为君国生民效力。此其志之所存，故象以“尚宾”表之。","Y5.T":"九五，观我生，君子无咎。","Y5.N":"观之一卦，爻之观九五者四，而自观者二：六三与九五也。九五阳刚而处中得正，又据君之位，为一卦之主。天下之教化隆污，皆系于其一身之感召；民风之醇漓、臣民之向背，即其德教深浅之验也。然则君之自知，将何所取则？必先观民。民之观既审，则己之实自见。使民俗淳厚而具君子之风，则其素所履行者，信为君子之道矣。道既君子，化以德而不以刑，咎何由生？","Y5.X":"象曰：观我生，观民也。","Y5.XN":"“我生”云者，谓出于我、成于我者也。民之风俗，民之德行，孰使之然？皆自我而出。表正则影端，源洁则流清；欲察己德之厚薄，但观民俗之醇疵，思过半矣。故“观我生”一语，实即“观民”。","Y6.T":"上九，观其生，君子无咎。","Y6.N":"上九之“观其生”，与九五“观我生”同条共贯，非另立一义也。九五者，君之位也，卦之主也，其辞遂以“我”称；上九无君位而所言仍属君道，“我”字无所归，故变文言“其”。“其”者，指九五。身在君位之外，而议君位之事，此上九之观所以异于诸爻。两爻之辞大略相同，所差止此一字，正以所论本为一事。观九五之生，即观民也。","Y6.X":"象曰：观其生，志未平也。","Y6.XN":"“志未平”，即志之未安也。“观其生”三字，寓忧国忧民之怀。上九位非人君，而德与九五同、心与九五合，故以九五之忧为忧。夫君之观民，将以省身而察己；然民之风俗德行，果否尽善，殊未可必。九五自“观我生”于内，上九复助之“观其生”于外。盖治乱之数未定，盛衰之几难测，中心耿耿，是以志不能平。","Z":"观卦之体，四阴处下而二阳居上。以消息言，阴方盛而阳将退，宜系以凶咎之辞；然卦辞无凶咎者，非偶然也，取义异耳。盖此卦虽具阴盛之形，亦有九五在：阳刚而中，位乎其正。作《易》者略其阴盛，就阳刚之君端拱得位者立义，是以观卦所论，独在上之人君如何以中正庄敬为天下所观。卦与爻复有别：卦主示下，爻主瞻上。瞻上者以远近为差，去九五近则善，远则否；近则所接者大、所见者昭、所感者亲，故愈近愈佳。此卦所蕴，神道设教之义，用舍行藏之义，以德化民之义，以至轻忽妇女之陋，皆于此见之。凡此本《易经》所自有，孔子特为之抉而出之；使无孔子，后人至今亦莫能通。而孔子所抉出者，与《论语》所记孔子之旨趣契若针芥，故谓《易大传》之义即孔子之义，无不可也。就中尤要者，为“神道设教”一义，其质则属唯物。此义《周易》有之，孔子亦有之。两家之意，神非具意志、赋人格之上帝也。神果何指？其在《系辞》，则曰“蓍之德圆而神”，明其不测；曰“阴阳不测之谓神”，正以名之。彖传则径以“天之神道”为目，此又一证也。凡此所谓，皆彼无声无臭之自然运化而已。此运化也，非人志所能左右，有时且出人意计之外；天地阴阳，万变而不居，深奥而难穷，望之若无物不宰，实未尝有宰之者。是则所谓神也。天具此神道，故四时之行无所僭差。人君则焉：泯其声，隐其形，尽诚而尽信，以观感移人，以德教率众，推此道于天下，斯谓“以神道设教”。至于治者崇祭祀之典，使民畏鬼神而驯然服从，己则初不之信，此亦“以神道设教”之类。可知神道设教者，政术之一端耳；用此术者，实不奉鬼神，其意中之神，不过自然与自然之默运潜移、变化不穷者。此中底蕴，孔子固已洞然，特以世变所拘，未克摧陷而廓清之。必待荀子《天论》，斯义始白：君子以之为文，百姓以之为神；文者吉而神者凶，其辨如此。"}},"21":{"id":"21","cnNum":"二一","name":"噬嗑","pinyin":"shì kè","fullName":"火雷噬嗑","shortFullName":"火雷噬嗑","upper":"离","lower":"震","upperNature":"火","lowerNature":"雷","lines":[1,0,0,1,0,1],"yaoLabels":["初九","六二","六三","九四","六五","上九"],"blocks":{"P":"《序卦传》把噬嗑列在可观之后，以为物既可观，乃能有合；又以“嗑”训“合”，其义即此。\n卦名二字，宜分别看。噬者啮也，嗑者合也。口中横着一物，上下相隔而闭不拢，须待啮去，然后能合。名之曰噬嗑，正取先噬后嗑之序。\n震下离上，何以独当此名？其象有两重可验。一者，一阳居初，一阳居上，三阴夹处其中。阳主实，阴主虚，两头实而中间虚，俨然一张开的口。二者，徒然张口而口中空无一物，那便成山雷颐了；此卦九四一阳横亘于三阴之内，恰似异物鲠在喉间，齿不得交。欲其合，非先噬不可，此所以不名颐而名噬嗑。\n作《易》者未尝拘于口舌之间。凡物之相隔者，必去其所隔而后合，这条道理推而广之，便是人间世相。天下事每每乖隔而不谐，推原其故，总因有物间于其中。事无巨细，皆坐此病；作者拈出其中最大者立论，遂借卦象发挥，专讲国家以刑狱锄奸去慝之事。即此一端，亦可见《周易》于刑罚一路并不轻忽。\n犹有当辨者：颐卦亦初上二阳、中列四阴，与其爻画相近，而取象各别；至若贲卦，离下艮上，上下两阳而中含一阳，与噬嗑几乎同构，似乎亦可系以此名。然而噬之功必待下体之动，贲有离而无震，动象不存，故终不得为噬嗑。","G":"噬嗑，亨，利用狱。","G.N":"卦名连读，实含两义：一为噬，一为嗑。物塞于口，则口闭而嗑不得成；闭而不合，闭塞之象遂见，亨与通两皆无有。必也啮而去之，然后可望其通。名既曰噬嗑，则噬与嗑皆已著效，亨即在此二字之中。其所以能亨，正因间隔之物已去；就人世间说，去间的手段叫做“用狱”。\n用狱与用刑不可混为一谈。用刑只是加之以威，用狱则须推究情伪、剖断是非，其事在刑之先而重于刑。故卦辞举“用狱”而不言用刑，爻辞却屡言刑，二者各有所指，非偶然也。通观六爻，可分两截：初、上居首尾，是受刑的一方；中间四爻处卦腹，是行刑的一方。而六五以柔质处尊，遂为用狱之主。","T":"彖曰：颐中有物曰噬嗑。噬嗑而亨，刚柔分，动而明，雷电合而章，柔得中而上行，虽不当位，利用狱也。","T.N":"《彖》以卦体立说。颐者口也，口中有物，其卦为噬嗑。震下离上，九四横亘于三阴之间，正如齿间鲠物而不得交。既不得交，则必啮之而后能合，名之所由立也。若无物可噬，则此卦当为颐而非噬嗑。\n自“噬嗑而亨”以下，皆释卦辞。卦辞本作“噬嗑亨”，《彖传》于中间着一“而”字，读作“噬嗑而亨”，于是因果之序显豁：有物则噬，噬毕则嗑，嗑则亨。一字之增，而经意愈明。\n“刚柔分，动而明，雷电合而章”，就此卦爻画与卦德而言。卦中阴阳之画各三，其数适均，刚柔错居而彼此不混，故谓之“刚柔分”。然阴阳适均者不止此卦，何以独于此致意？盖“刚柔分”者，有分辨之别象；此卦所主在用狱，而察狱之本正在明辨，故特举之。更进一层，“刚柔分”与“雷电合”相连，恰成“噬嗑而亨”的首尾：前一句属静，上下未交，噬犹未发；后一句属动，动者在下，明者在上，噬与嗑皆已毕矣。静动相衔，未噬而噬、噬而嗑、嗑而亨的次第便完整托出，卦辞“亨”字遂有所据。\n末句“柔得中而上行”，所指者六五。柔质而据刚位，就位分言为不当；然所贵者不在位而在中——柔而能中，又宅至尊之地，此其所以可用。盖治狱之失有二：失于宽者由柔，失于暴者由刚。六五不倚一偏，体柔而履刚，执中以为衡，故最宜于听断。《易》之通例，柔当在下、刚当在上。故刚爻而居下体者，其辞不曰上行而曰“来”，讼、无妄、涣三卦皆是也。柔爻而反跻五位者，其辞不曰来而曰“上行”，晋、睽、鼎与此卦皆是也。","X":"象曰：雷电噬嗑，先王以明罚敕法。","X.N":"此卦之象，《易》例当称电雷，今本作雷电，恐是传写之误。石经出于蔡邕，其文正作“电雷”；程、朱二子亦谓当从电而在雷先。电即是火，故电雷噬嗑也就是火雷噬嗑。火之德在明，明则物无遁形；雷之德在威，威则物皆震慑。在上者观此卦象，所当取法的正是这一明一威，用以明罚敕法。\n称“先王”而不称“君子”，颇见分寸：明罚敕法乃制法立度之事，非一人之修为，故系之于先王。\n所谓明罚，是预先将何种行为犯何科、当坐何罪，逐一著为条格，明白揭之于众，使人知所避就，不至误蹈刑网。所谓敕法，是把已定的法令制度颁行民间，郑重告诫，使人有所忌惮，力求免于触犯。两者用意相通，都是要居上位者在刑罚一事上把力气用在事前的禁防，而非事后的惩创。此即孔子之意。\n孔子之治道，以德为枢，以礼为舆，“道之以德，齐之以礼”是也；然于刑，固未尝一笔抹去。其于刑罚，有两处最可注意。其一，治国以德教为先，杀戮终非善法。季康子尝问为政，意在去无道而就有道，隐然以杀为可。孔子对曰：“子为政，焉用杀。”其不许杀也审矣。其二，刑出于不得已，然必教之于前，而后可以加罚；故其言曰“不教而杀谓之虐”。此论足以概儒家全体。儒家言刑与法家判然两途：法家以法为万能，儒家则以教化为本。荀子虽礼法并称，其归宿仍在儒门，不得据此便目为法家。","Y1.T":"初九，屦校灭趾，无咎。","Y1.N":"初九当一卦之初，地居最下，无位可名；在社会则取象于庶人——《礼记》所谓“礼不下庶人”者，正此辈也。《系辞传》释此爻，即就此立论：此辈所计者利害，仁义非其所恤。有小过而不予痛惩，则不知畏，亦不肯改。故御之之术，莫如“小惩而大诫”：过在毫发，即随事予罚，使之知惧而迁善，则过失不至积而成大。形似加罚，实为曲全，在彼辈正是福也。\n“校”者，木制之械具，加于手足以拘系之者；“屦”本是鞋，句中借为动词，谓著之于足。合二字言之，即以此械加之于足，如纳履然。“灭”宜训“没”，义为遮没，非创伤之谓。械仅掩及足趾，是“灭趾”也，六爻之中此为最轻之刑。罚轻而不过，其人遂不至陷于大罪，受刑者之所以“无咎”也。","Y1.X":"象曰：屦校灭趾，不行也。","Y1.XN":"足械加身，其人举步不得，此其表也。就里处看，正借这一点轻惩，断其继续为恶之路，勿令沿着罪途一路走去。","Y2.T":"六二，噬肤灭鼻，无咎。","Y2.N":"六二与六五为相应之爻。六五以柔居尊，操用狱之柄；六二居下卦之中，乃奉法行刑之人。以柔顺中正之德临刑，则权衡不爽，罪与罚两相准当，不致畸轻畸重，受刑者亦易心服。\n“噬肤灭鼻”，取深于用刑之象。肤者，禽兽身上不与骨相连之肉，如豕之下膊，柔脆易入，齿能陷其中，深至没鼻。“噬肤”谓其奏效之速，不待烦刑而人已服罪；“没鼻”则谓其入之深、治之严。惟六二有柔顺中正之德，罚必丽于罪，故虽深严而仍不失其宜，是以无咎。","Y2.X":"象曰：噬肤灭鼻，乘刚也。","Y2.XN":"六二以阴柔之质，压于初九阳刚之上，是所谓“乘刚”。爻辞言“噬肤灭鼻”而系以“无咎”，盖六二柔顺中正，既能深于用刑，又能使人心服，二者本可兼致。“小象”乃曰“噬肤灭鼻，乘刚也”，则谓其刑之深，实由乘刚之势所成。","Y3.T":"六三，噬腊肉，遇毒，小吝，无咎。","Y3.N":"“腊”读与“息”同。肉经风戾而干，古谓之腊。其物多取小兽全躯为之，故坚而难入；藏之既久，味厚而或生毒。“噬腊肉，遇毒”，谓所噬既韧且毒，齿未及肉而毒已中人。六三所处，正类乎此。\n六三亦行刑之人，然以阴爻而居阳位，位失其中，质又非正。以此治人，人不肯服；非但不服，更结怨于被刑者，反受其伤。虽然，所失亦小。当噬嗑之世，间隔不可不去，去之不能无用刑，刑固不可已者。行之而未尽善，虽足称吝，究未尝有大咎。","Y3.X":"象曰：遇毒，位不当也。","Y3.XN":"同为用刑，六三却不如六二。六二直云“无咎”，六三则先“小吝”而后“无咎”，分别正在所处之位。其所以小吝，病在爻位不当：既不处中，又不以阴居阴。己身未正，则不能折服有罪之人，反为其所怨毒，此“遇毒”之所由来。","Y4.T":"九四，噬干胏，得金矢，利艰贞，吉。","Y4.N":"同一九四，置于全卦与置于爻位，取象适相反。就卦体观之，九四正是鲠于口中的那件异物，是社会里妨碍谐和安宁的消极之力，属当噬当去之列；就爻位观之，它却转身成了去间之人，是执刑者。《易》中卦象与爻象每每不相应，或由卦辞、爻辞不出于一时一人之手。\n九四居中间四爻之中，独为阳刚，以刚质而近君侧，治狱之才、断难之能，六爻中无出其右。“噬干胏”者，胏为肉之附骨者，干而益坚，视腊肉尤难下咽，而九四能噬之。故诸爻多系“无咎”，独此爻直系以“吉”。\n其所以能啮此难噬、办此难案、服此难服之人，赖有一长：“得金矢”。金取其刚，矢取其直，谓所秉者刚直不阿之德。然德性虽美，犹是虚器；必于临事之际实做“利艰贞”三字，不避艰难，不夺于势，守正而持原则，然后难案可断、难人可服。","Y4.X":"象曰：利艰贞，吉未光也。","Y4.XN":"九四所禀者“金矢”之德，刚而不挠，才与势皆足以任断狱之事，故“噬干胏”而获吉。然具其才者未必遂其事：可致之势与已然之效，中间尚隔一层。必于案牍之间实落做去，使《象》所谓“吉未光”者转为“吉光”，方为真得。此则在“艰贞”二字上用功。","Y5.T":"六五，噬干肉，得黄金，贞厉，无咎。","Y5.N":"历数前爻：六二噬肤，六三噬腊，九四噬干胏，所噬一节难于一节。至六五而噬干肉，反较前为易。其故安在？在于“得黄金”。黄为中央之色，见其居中而不偏，且身当君位；金为刚坚之物，见其以柔履刚，又有九四阳刚在下为之佐。有此二者，是处境优于诸爻。\n然条件虽优，本体终是柔质。柔者易弛，居尊者易骄，欲其行事无失而终获“无咎”，仍须守着“贞厉”二字：一面守正不移，一面常怀危惧，不敢以易心处难事。","Y5.X":"象曰：贞厉无咎，得当也。","Y5.XN":"《象》言“得当”，非谓爻位得其当。六五以柔居刚，于位本不当；此“当”字，说的是处事得当。柔质而治狱，能守正、能虑危，终以致无咎，是皆人力所为，非关位分之当否。","Y6.T":"上九，何校灭耳，凶。","Y6.N":"“何”当读去声，其义为负为戴，与“荷”相通，非诘问之辞。“校”是木制械具，此处当是加于颈肩之枷。\n上九与初九遥相对，同为受刑者。枷荷在肩，加于颈项，其制甚巨，竟至掩没两耳。“灭耳”者，状其枷之大、没及于耳，非谓截耳也。古有刵刑，去耳而罚轻；此云“何校灭耳”，掩没及耳，正是重刑之象。\n上九何以罹此重罚而占凶？盖其始也，视小恶为无伤而不肯去；积之既久，遂至恶不可掩、罪不可解，终以怙恶自败，非他人所能致也。\n《易》例初爻与上爻为一始一终，其辞多相呼应。此卦初爻之辞曰“屦校灭趾，无咎”，其义在惩小而诫大：过方萌动，即从轻责之，彼乃知过而革，革之于始。逮乎上九，一卦已尽，恶与噬俱至其极；罪既盘结而不可解，恶既充盈而不可掩，则舍重刑更无他法。","Y6.X":"象曰：何校灭耳，聪不明也。","Y6.XN":"上九之罚如此其重，咎不在人而在己，其病只坐“聪不明”三字。耳之职本在听，径言“不聪”可矣，何以系一“明”字？“聪不明”，犹言听无所闻：忠告在前而不入，有耳而未尝尽耳之用。“聪”单举时本已含明；此处聪、明并举，则“聪”只当一“耳”字看，而“明”才是耳之所以为用。","Z":"读此卦，当于卦爻之中细味《易》家与孔子论法之意。孔子于《大象》揭出“明罚敕法”，可见其未尝否认刑罚之有助于治国。彼虽盛言“道之以德，齐之以礼”，以德化为先，谓“道之以政，齐之以刑”为非善策，甚且不取为政以杀，然于用刑之必要，固未尝一概排而去之。\n其与法家分野正在此处。法家惟法惟刑是务，以威民为能；孔子则主明罚敕法，欲使法与罚晓然共见，民知所避，知所惮，而卒归于无犯。“明罚敕法”之要，偏重者在“明”，不在“罚”；在“敕”，不在“法”。所以昭示者为主，所以惩创者为辅；其归趣在教之于先、防于未然，而非临事制之、加之以刑。故此法仍统摄于德治之内，为其一端，非别立一帜。\n卦辞“噬嗑亨，利用狱”，已透出作者对于暴力统治的自觉。物在口中，不噬则不合，不合则不亨；此理至普遍，于人类群居之事实无所不在。父子、夫妇、兄弟、朋友之间，皆有当噬当嗑之事。而作者独取国家生活中必须动刑狱这一最大者立象，断非偶然，盖其胸中已有明确的暴力统治观念。\n然此卦所显，主导者为人治主义，非法治主义。观其用罚，斤斤于人之贤否而不专于罪之轻重：初九初犯，其罚薄；上九屡戒而不悟，恶盈罪贯，罚乃加重。就执刑者言，其意尤明：九四“得金矢，利艰贞”，六五“贞厉无咎”，所论皆一身之修养，非制度之约束。卦体亦然：上体为离，离主于明，而明正是治狱第一义。断狱者明与不明，系乎案之得失；而明与不明，又归之于德。执事者惟重一己品行之修，而不恃客观之法，则其归宿必为人治。"}},"22":{"id":"22","cnNum":"二二","name":"贲","pinyin":"bì","fullName":"山火贲","shortFullName":"山火贲","upper":"艮","lower":"离","upperNature":"山","lowerNature":"火","lines":[1,0,1,0,0,1],"yaoLabels":["初九","六二","九三","六四","六五","上九"],"blocks":{"P":"贲读为毕，其义为饰，饰之谓文。质言之，饰者加于本体之上的修饰，故文与质常相对而并存。孔子尝以绘事明之：素粉之底既具，彩色乃有所施；底不素，则五色无所附丽。质者文之底，文者质之华，二者之序由此可推。人群之为群，非徒合聚而已。噬嗑言合，合则通矣；然既合而处，势不能无尊卑之等、先后之序。将此等第序列发见于仪节度数之间，是为礼文。故社会当其和合之时，必有文以饰其本，《序卦传》次贲于噬嗑，正以此故。\n以卦体求之：下离上艮，离为火而其德明，艮为山而其德止。山下有火，明著而止有所限，于文之象为近。以卦变求之，柔自外来而饰刚，刚自内往而饰柔，刚柔上下交相错，文之象亦具焉。名卦曰贲，盖取诸此。\n儒者论治，最重质文之剂。其意以为：人类社会断无去文而可立者；傥质有余而文不足，节文不备，则上下无以相维，而世且滞而不进；傥文有余而质不足，华饰日增，本实日削，则其敝亦足以乱。荀子斥墨子之蔽，谓其滞于用而昧于文，所执即此权衡也。道家则反是：以自然为宗，以素朴为贵，欲人之少私寡欲，而于节文度数、伦理纲常，举以为不足存而悉废之。其说与历史演进之需相违，后世施于政事，终不敌儒家文质之论见重，亦理之自然。","G":"贲亨，小利有攸往。","G.N":"全卦所陈，一言蔽之曰：饰不可以无本。质者本也，文者其饰也；二者相对而立，而轻重有归，质居其主。质立矣，从而润色之，其道乃通，卦辞所以系“亨”也。然既通矣，循例当言“利有攸往”，此独系以“小”者何？盖谓文之为用，不可过盛；文而胜质，则所务者在毫末，所遗者在根本。本既遗矣，通者将复为塞，故以“小”限之。","T":"彖曰：贲亨，柔来而文刚，故亨。分刚上而文柔，故小利有攸往，天文也。文明以止，人文也。观乎天文以察时变，观乎人文以化成天下。","T.N":"卦辞“贲亨”之亨，于文为羡，当是衍字。“柔来而文刚，故亨”云者，本为释卦名而设：柔来而刚得所文，斯谓之贲，非为卦辞之亨设辞也。故“贲”字之下不宜更有“亨”字。“天文也”一语之上，王弼所见本尚有“刚柔交错”四字，后世传写夺去，宜为补足。\n卦变之说，古今聚讼，而可据者惟苏氏《东坡易传》与程氏《伊川易传》两家。苏氏尝辨之曰：刚柔有往来、有上下、有相易，《易》中屡见，而人见其最显于贲之《彖》，遂据以推每卦之从来，谓贲自泰变，不知此说之误也。夫一卦之可变者，极其数至于六十三，宁独一贲为然？知泰之能变而为贲，而不知贲之亦能变而为泰，则所谓从来者，果安在耶？其论相易之本，则以乾坤为源。盖坤体纯阴，乾以一阳入而化其阴之一画，震、坎、艮三男由是而立，其体皆二阴而一阳；故三男之卦系以“刚来”者，非他，正示其本出于坤，而刚为乾所加也。乾体纯阳，坤以一阴入而化其阳之一画，巽、离、兑三女由是而立，其体皆二阳而一阴；故三女之卦系以“柔来”者，亦非他，正示其本出于乾，而柔为坤所加也。凡系此辞者，必三男三女相配之卦，他卦则无之。贲之《彖》兼举二语，此外蛊、咸、恒、损、益五卦亦然：刚上柔下者蛊与恒，柔上刚下者咸，损下而益上者损，损上而益下者益。六者之取，皆适然而遇，非有定格。阴阳相配之卦，其数十八，而所取者六，其义安在？夫圣人之取以为卦也，其术不止一端：象也，爻也，变也，刚柔之相易也，随所宜而用焉，贲盖取末一术者。刚柔相易特诸术之一耳，适有所取则系其辞，不取则默焉而已。\n程氏之说则曰：刚上柔下、损上益下云者，谓刚居上而柔居下、损于上而益于下，皆据已成之卦而为之辞，非谓就一卦之中有所升沉迁转也。若讼、若无妄，其辞皆有“刚来”，使果自外来，则所指者当在上体，而实无之。五为尊位，柔而得居之者，其辞辄曰“柔进而上行”；柔之为物，宜在下位，今据尊位，则其进可知，非自下体腾而上之谓。先儒昧于卦变所自，见其出于乾坤，而误以为贲出于泰。夫乾坤交而重为泰，泰固已自成矣，安得复由泰而变哉？下体之离，本乾之中爻变而成；上体之艮，本坤之上爻变而成。离居内，故曰“柔来”；艮居上，故曰“刚上”；非自下体而之上也。六子者乾坤之变，六十四卦者八卦之重，其原皆一，无所假于他卦。\n合两家而观，卦变之说可得而言者四。其一，六十四卦之中有卦变者十有八，余皆无与。此十八卦，其上下二体必以一阳卦与一阴卦相配，阳卦谓震、坎、艮，阴卦谓巽、离、兑。如贲，上体艮，阳也；下体离，阴也。如益，上体巽，阴也；下体震，阳也。其二，阳卦之本为坤，乾以一刚易其柔，乃成震、成坎、成艮；阴卦之本为乾，坤以一柔易其刚，乃成巽、成离、成兑。故卦变之实，不过刚柔之相易：上下体之中，阴卦之柔爻，乾假坤以易之者也；阳卦之刚爻，坤假乾以易之者也。若二体俱阳、俱阴，或一体为乾、为坤，则卦变无所施。其三，所谓刚柔相易，就成卦之始言之，指乾坤之互易，非谓卦成之后刚柔升降而互换其位。贲之上体出于坤，其上九之刚则受之于乾；下体出于乾，其六二之柔则受之于坤。是岂泰卦上六与九二一升一降、彼此相易之谓乎？其四，《易》中可言卦变者虽有十八，而《彖传》实取此义者，惟贲、蛊、咸、恒、损、益六卦而已。\n明乎此，乃可论“柔来而文刚”之义。刚者质也，柔者文也。柔来而文刚，是当质胜之日，适有文焉为之调济，使质与文适相当，是以卦辞系之以“亨”。“分刚上而文柔”则不然，其意非谓刚之往饰乎柔也；柔必得刚而后成其为文，文必附质而后立，否则无质之文，不得谓之文矣。文之过盛，非有质以节之不可；文而至于太过，其敝必生，是以卦辞系之以“小利有攸往”。\n由是言之：质胜而济之以文，则塞者通，此“柔来而文刚”之所以系“亨”也；文胜而济之以质，则过者节，然文终不可以太过，此“刚上而文柔”之所以系“小利有攸往”也。此二语之下，当有“刚柔交错”四字以结之。一往一复，刚柔互为其饰，交错之名所由立。质之所在，文必随之；而文之力终不足以掩质。二者相准而不相逾，此理本自具足，故以“天文”系之。凡此，皆自卦变立说以释卦辞者也。\n至于“文明以止，人文也”，则又自卦德立说。下体离，火也，其德为明；上体艮，山也，其德为止。止者，节之、限之之谓。文明而不知节，则流；有节有量，其明乃可久。然所谓节与量者，初无定程，视人之所为而轻重焉。人之用心果能尽其力，则节文得中；不尽其力，则失之。其责在人而不在天，故不得名之曰天文，而特名之曰人文。\n“观乎天文，以察时变”者，所观兼天象与卦象而言。自卦象观之：刚不能无柔，柔不能胜刚，二者交错而质文各得其分，此其常也；然气数之运，时或偏于刚，或偏于柔，或质太过，或文太过，则常者有时而变。观者当随其时以察之，偏则救之，过则损之，使归于平。\n“观乎人文，以化成天下”者，所观即前所谓“文明以止”。文明固不可废，然必有所止；无止以制之，则文明日溢而失其正。故止者，非遏文明使不进也，止其过而已，止其敝而已。观乎此而以之化民成俗，则天下之节度仪文由是而立。","X":"象曰：山下有火，贲。君子以明庶政，无敢折狱。","X.N":"《易》之取象于治狱者四卦，噬嗑、丰、旅、贲是也。噬嗑与丰，体为火雷、雷火之交互，其义在威与明并举：威以詟之，明以照之。旅与贲，体为火山、山火之交互，其义在明与慎相济。旅之火居山上，是止在明外，明有所止而后能审；审而明，则案无留牍，狱无滞囚，判决各以其时。贲之火居山下，明藏于内而止见于外，明而知止，则听断之际不敢率易，此所谓“无敢折狱”也。折狱之要，在得其实情；而贲主文饰，与治狱之所求正相反。孔子既受贲卦，遂以“无敢折狱”为诫，欲治狱者尽去缘饰而一归于情实。至于舞智以弄法，务深文以刻核，缘饰其事而锻炼成狱者，尤在此诫所必斥。","Y1.T":"初九，贲其趾，舍车而徒。","Y1.N":"六爻同处贲时，而所贲各别。内体三画，柔自外来以文其刚，刚既有余，所欠者柔，故其功在致柔。外体三画，刚自内往以文其柔，柔既不乏而刚为不足，故其功在存刚。初九之趾、六二之须、九三之濡如，三爻并系于柔；而初九居贲之初，受饰最浅。趾者，人身之至下，其职在行。饰见乎趾，明其贲方发端而已。“舍车而徒”，释者谓舍其车而不乘，徒行于路。就趾之能行而言，则所饰者微，几于素而无文矣。初九与六四两体相对，彼此交贲；初言“舍车”，四言“白马”，取义正相近。初九位在最下，舆马之可乘者不在其前，是以言舍车；六四则据上体之始，行有舆从，其势足以驾，是以称白马。","Y1.X":"象曰：舍车而徒。义弗乘也。","Y1.XN":"舍车而徒，非矫情以立异者流也，乃其中有所主，发而为当然之节。众以乘舆为饰，而彼以徒步为饰；取舍之际，自有其度。","Y2.T":"六二，贲其须。","Y2.N":"须者何？颊颐间之毛也。毛之在面，本无用而有用：其用在于润色仪容，使面貌可观。然毛不能自持，必依颐而生。古人以“皮之不存，毛将安傅”为喻，正为此发：颐既去，毛固无所丽矣。\n六二之与九三，两皆无应，地又相邻，近而相取，遂以相贲。六二纯阴，实为贲卦之主，全卦之指归可于此爻而见：文必附质，文者饰其质而止，不能变易其质；其动其静，一以所附之质为断。须之于颐，即文之于质也。六二纯柔，柔则文；九三纯刚，刚则质。二之与三，是文质相与；三兴则二与之兴，三止则二与之止。爻辞所以系之曰“贲其须”。就受饰之浅深相较，二已进于一矣：一之贲，几不成贲，直是素而已；二则既有其饰，饰乃为饰。毛虽附颐而生，然既生乎颐，则固卓然一饰物，非复虚位也。","Y2.X":"象曰：贲其须，与上兴也。","Y2.XN":"六二之上为九三。象辞之“兴”，谓起而动作也。二之从三，犹须之从颐：颐动则须俱动，颐止则须俱止，无自专之力。故“贲其须”之云，其实指文之受制于质；物之美恶善恶系乎其质，非系乎其文，非系乎外之形貌。","Y3.T":"九三，贲如濡如，永贞吉。","Y3.N":"九三一阳，夹处二阴之间：下比六二，上比六四，两柔交相来饰，是谓上下皆贲。贲之盛，莫过于此，故其辞曰“贲如”。凡物盛则易迁，一有不察，反道随之。饰至于盛，文且掩质，故又曰“濡如”。濡者，状其膏润充溢、光采鲜泽之貌。《易》中凡言“某如某如”者，多含两可未定之意，非决辞也。“贲如濡如”，既美其充盈，复虑其太过而至于灭质，故继之曰“永贞吉”。贞之为言正也。九三以阳居阳，其位本正，所难者非正于一时，乃能永守而不失耳。久而不变其守，则阴柔不足以移之，文有所节而不至掩质，吉斯可长保矣。","Y3.X":"象曰：永贞之吉，终莫之陵也。","Y3.XN":"陵者，侮之也，又含胜而加其上之意。爻系“永贞之吉”，正谓文虽盛而质不可掩，柔虽昵而刚不可屈。此吉非俄顷可徼，必持久而后致；守之既久，则终身由之而不改。至“终莫之陵”之云，盖言文之势虽盛，终无能加于质。永与终二字，前后相承。","Y4.T":"六四，贲如皤如，白马翰如，匪寇婚媾。","Y4.N":"皤，发之白也；翰，马之白也。白与素同气，皆去华就实之谓。六四居上体艮止之端，贲极而宜反于素，其时适然，故辞曰“贲如皤如”。在贲之时，四固当尚饰，此“贲如”之所由云；然四出乎离明之外，当艮止之初，又下与初九刚爻相应，其心固有崇质而返素者，此“皤如”之所由云。两念并陈，迟疑莫决，而究其所归，则在皤如，即无所饰之谓。下文“白马翰如”正以此为验：彼白马翰如而来者，初九也。初九“舍车而徒”，与四之皤如气相求，是四之同心，非四之仇雠，乃四之婚媾耳。四之究竟，以刚而文柔，以质而济文，舍华就朴，以朴素为贲者也。","Y4.X":"象曰：六四，当位疑也。匪寇婚媾，终无尤也。","Y4.XN":"疑者，两端而不定之谓。自其大者言之，四为贲之四，身在贲世，礼当尚文，“贲如”其正也。自其细者言之，四居离明之外、艮止之始，时方由文而趋质，所处之地自使之素以为绚。二者交战于中，久而不能决，终乃归于“皤如”。归于皤如，则坦然无复尤悔，何也？“匪寇婚媾”故也。初九之志与四同，四既皤如，彼则舍车，白马翩翩而来，相与为婚媾，尚何怨尤之可言。","Y5.T":"六五，贲于丘园，束帛戋戋，吝，终吉。","Y5.N":"丘园者，指上九而言，二字并列成义。丘谓城邑近旁之高坂，园谓城外不远之圃，皆去喧嚣而就闲旷之地。上九与六五，一刚一柔，地相比近。彖辞既言“刚上而文柔”，则上九当往饰六五，六五当受其饰。“贲于丘园”，即贲于上九之谓，谓六五所受之饰出于上九也。其归趣在敦本，在崇素而返质。上九所处，安闲朴素之乡，非朝市之比；朝市繁华，其文炽然，丘园则不然。束帛者，馈遗之礼；戋戋者，微少之状。所受之礼微少至此，几于吝矣。然所谓吝，即俭之谓也。先王之礼，宁失于俭而不敢失于奢；俭之胜奢，固已久矣。吝之于形迹若不足，而究其终则吉。合外体三爻观之，皆言贲极而反朴、以质济文之事，而六五较六四为尤进。","Y5.X":"象曰：六五之吉，有喜也。","Y5.XN":"爻辞之义，一“吉”字尽之矣。夫文胜而贲极之日，独能反于朴素，其事岂易言哉；非其中实有可乐，未易强而至也。所谓“有喜”，即此心之乐乎是而已，非有所慕于外而然。其喜果何自来？盖好之深则乐之至，昔人论学之语，可借以明此。","Y6.T":"上九，白贲，无咎。","Y6.N":"上九居艮止之尽，彖传所谓“文明以止”，至是而极。其崇本返质之分量，视六四、六五为远过。六四“贲如皤如”，贲自贲而白自白，二者犹二也；六五之贲于丘园、束帛戋戋，亦步趋于反本而未造其极。上九直曰“白贲”，则白即贲，贲即白，二者混而为一。饰之极处，反若无饰。然其所谓无，非果空无一物也；不设色而已，不假采而已，即以质素为其饰也。《杂卦传》称“贲无色”，一言而尽贲之体段。夫贲者，五采相宣、绚烂以饰者也；白者，无色，素朴而无文者也。二者本截然相戾，而圣人合之曰“白贲”，曰“贲无色”，是相反而适以相成。两对立者绾结为一，可见《周易》作者于对立面之统一，确有明白无疑之见。","Y6.X":"象曰：白贲无咎，上得志也。","Y6.XN":"白贲者，无饰之饰，以质为文也。上九身在贲世，而所尚在质，绝去华采，得无为违时而有咎乎？曰：不然。上九处一卦之上，位之所在，义当归于白贲；白贲既合于质文交养之则，又惬其崇质尚实之心，何咎之有。","Z":"贲以文饰为名，而文不能离质以自立，故其书虽言文，所究者实文质之相与。\n分上下二体而观，取义各异。下体“柔来而文刚”，是以文为文者也；主其文者，柔来之柔，六二是已。六二“贲其须”，须为至虚之物，不能自存，必随九三而兴，随九三而止。此见质固须文以为之饰，而文终不能舍质以独行，二者不容相离。上体“刚上而文柔”，是以质为文者也；主其质者，刚上之刚，上九是已。上九直标“白贲”，文而至于无文，色而至于无色，其义尽于此矣。此见质文皆不可阙，而质视文为尤根本、尤要重。\n就六爻细核之，不事文华者三：初九“舍车而徒”，一也；六五“贲于丘园，束帛戋戋”，二也；上九“白贲”，则不惟不事文华，且以质素为文矣，三也。其余三爻：六四“皤如”而贲于初九，六二“贲其须”而必附于九三，皆有所依而后成饰；独九三“贲如濡如”为饰之至盛，然亦有“永贞吉”之戒。由是观之，贲卦之于文饰，其持论至为审慎：方其言饰，所重者不在饰而在本。《周易》此种致思之方，殊可玩味。\n然则《周易》果欲弃文而存质、右质而左文乎？是则大不然。弃文存质者，道家门庭之论也。《周易》与《易大传》，其出于孔门者，皆质文并举而无偏。在儒者，质与文相反而适相成，本为对立之统一；二者阙一不可，而质常处于主导。老庄于对立统一之几，察之至熟，其书可诵之隽语往往而在；独至文质之际，则坚执见素抱朴、还归自然之说，取“牛马四足”而斥“穿牛鼻、络马首”之为，凡出于人为之饰，一切排而去之，遂自陷于形而上学而不悟。自社会演进之迹观之，道家去文之论，其悖于时势有断然者，不足采也；《周易》与传《易》之儒，则依乎现实以立说，顺历史之向以立论，即其思理，要为有光。"}},"23":{"id":"23","cnNum":"二三","name":"剥","pinyin":"bō","fullName":"山地剥","shortFullName":"山地剥","upper":"艮","lower":"坤","upperNature":"山","lowerNature":"地","lines":[0,0,0,0,0,1],"yaoLabels":["初六","六二","六三","六四","六五","上九"],"blocks":{"P":"贲之与剥，相为终始。文饰者，物之华也；华极则实尽，亨极则衰生。《序卦传》系剥于贲之后，正以文胜而亨尽，穷则必反耳。剥之为名，取零落衰谢之义；然泛言凋敝不足以尽之，此卦专主阴之侵阳：一柔自下萌动，浸淫长养，驯致充满，遂合五阴以消一阳。阳当受蚀之际，卦由是得剥名焉。剥复相寻，亦天地盈虚之常也。","G":"剥，不利有攸往。","G.N":"剥之时，柔盛而刚衰。刚者君子，柔者群小：群小用事，则君子不宜有所往。盖天时人事俱不右君子，故藏器以待，可也；贸然前进，则非所宜。","T":"彖曰：剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也，君子尚消息盈虚，天行也。","T.N":"剥卦所咏，一言以蔽之，阳为阴所蚀而已。柔浸长而刚日削，彖所谓“柔变刚”，正谓刚见夺于柔、见代于柔，非两敌相角之谓也。\n其验可循卦画而得：纯乾六刚，一变为姤则一柔居下；再变为遯则二柔；三变为否则柔居其半；四变为观则柔已逾三；五变为剥，五柔压一刚于上，刚几无遗类矣。柔日以进，刚日以退，卦遂以剥名。\n夬之为卦，一柔踞于五刚之上，彖许之曰“刚决柔”。剥与夬适相反，而不曰“柔决刚”，独曰“柔变刚”，何也？《易》为君子谋，不为小人谋故也。君子之去小人，一举而尽，故其辞决；小人之蚀君子，如萋菲之浸润，渐渍而不觉，故其辞变。一字之间，褒贬寓焉。刚柔之相胜，其机甚微，而其势甚长，此又读剥者所宜察也。故观剥者不于其剥之日，而于其未剥之先。\n“不利有攸往，小人长也”者，谓斯时当巽言屈体以避害，蓄力待时而后动。所以然者，群小之党方张，君子舍此更无他途也。复与剥相反：复之彖称“利有攸往”而系以“刚长”；剥则称“不利有攸往”，不曰柔长而径曰“小人长”，盖欲使君子洞然于祸机，勿轻举以取祸耳。\n“顺而止之，观象也”：坤在下，艮在上，有顺而止之象。君子观此，处群小剥刚之世，惟坚贞自守，顺时而止，斯为得之。\n“君子尚消息盈虚，天行也”：尚者，尊奉之谓。消长盈虚，本天道之自然；人事进退，亦莫能外之。君子奉此为则，而不倒行以逆之，则处剥之道尽矣。","X":"象曰：山附于地，剥。上以厚下安宅。","X.N":"地之上有山，山之趾反入于地，是高者不得不俯而就卑也，其象为圯为剥。凡坏圯之形，未有不自下先者；下既亏，则上虽隆亦危。故在上者取此以施政，必先固其基、厚其下，膏泽及于编氓，然后所居之位乃安。昔人谓民为邦本，本固则邦宁，义与此合。","Y1.T":"初六，剥床以足，蔑贞凶。","Y1.N":"初六处一卦之底，正是群阴之最下者，故取象于床足见剥。足者，床所恃以立；床者，人所倚以息。床在人下，足又在床下，剥自足始，见柔之蚀刚必由下起也。蔑即灭没之谓，贞则当作固守不移解。当此之时，君子惟顺时而止，与之推移；若胶执前见而不知权变，则凶必及之矣。","Y1.X":"象曰：剥床以足，以灭下也。","Y1.XN":"床足见蚀，特剥之发端耳。由是而进，势将次第上侵，故《象》以“灭下”言之。其言下者，正见既没其下，犹未肯止，剥且及上云尔。","Y2.T":"六二，剥床以辨，蔑贞凶。","Y2.N":"辨者，床身上下分界之木也。初既没其足，今又进而及辨，剥势已上移一层。处此者，以审识时势为急，去其固执，顺时敦尚，庶可自全；不则凶。","Y2.X":"象曰：剥床以辨，未有与也。","Y2.XN":"“未有与”者，谓上无应爻，孤立而无援也。六二柔顺得中，位复履正，本可自拔于群阴之外，不为剥刚之事；乃竟至剥辨者，咎在无刚以应之耳。六三虽失中不正，然有正应，其情势遂与六二迥别。","Y3.T":"六三，剥之无咎。","Y3.N":"初至四凡四阴，独六三系以无咎，何也？以其与上九刚阳正应也。三固犹在剥刚之列，然既有正应，则无戕害之心，迹虽同乎群小，志已归于君子矣。","Y3.X":"象曰：剥之无咎，失上下也。","Y3.XN":"五阴之中，三适居其间：上二阴，下二阴，而三独应乎刚。既离其党，则虽当剥之时，不为剥之事，此无咎所由得也。曷为不言吉？三虽翻然从阳，孤力单弱，仅足自免于咎而已，安所得吉？","Y4.T":"六四，剥床以肤，凶。","Y4.N":"剥自足而辨，群小节节上侵，至六四则迫近人躯，故有“剥床以肤”之象。肤者，床上之人之肌肤也。受剥者至此，其为患已深。爻辞不系贞凶而径曰凶，见凶之至，无所假借，非人力所能回。","Y4.X":"象曰：剥床以肤，切近灾也。","Y4.XN":"《象》以切近灾为言，正点出祸迫之状。自卦爻观之：上九为仅存之阳，六五居至尊之位，柔之蚀刚至四而极。自人观之：剥足剥辨，犹在床之外围；及于肤，则通体皆危，祸已成形矣。","Y5.T":"六五，贯鱼，以宫人宠，无不利。","Y5.N":"六五于诸阴中最异。自初至四，皆言如何蚀刚；至五则不言蚀，而转言承。其故安在？上九一阳孤峙于上，不可摇动，五虽欲剥而无从措手也。夫柔之性，势得则骄以陵人，计尽则俯而相下。五既逼近上九，与之相比，剥既不能，则惟有顺承之一途耳。\n鱼为阴类，以喻五以下之众柔；宫人谓宫壸侍御之属，以喻五之与上也。五居尊而为一卦众柔之长，统摄诸阴如以绳贯鱼，率之以上承刚阳，如宫人得幸于君，因以邀恩庇。当剥之时，不剥刚而反附之，其无不利也宜矣。盖剥人者终自剥，附人者亦终自固也。","Y5.X":"象曰：以宫人宠，终无尤也。","Y5.XN":"尤者，过也。“以宫人宠”，乃小人见宠之象，非君子见宠也。小人得宠，本非美事；然剥世之中，五能率众柔以承刚，揆之于义，犹未为过。","Y6.T":"上九，硕果不食，君子得舆，小人剥庐。","Y6.N":"剥至终爻，诸阳尽去，独余上九，如硕大之果孤悬而未尝见食。不曰“未食”而曰“不食”，明此一阳之存，非众柔姑置之、亦非偶尔漏之，盖消长盈虚自有限度，刚不可尽，天行然也。譬之树焉，枝叶虽残，果在则种在，春气一至，复生有期。\n“君子得舆，小人剥庐”，一事之两面也。舆者，车也，众柔在下而宗于一阳，如乱极之世人心思治，咸愿推戴而载之，此君子之所以得舆也。庐者，屋也，小人剥刚，若务尽而后已，则在上者倾，在下者亦失所庇覆，虽欲求一安身之地而不得，此其所以自剥其庐也。","Y6.X":"象曰：君子得舆，民所载也。小人剥庐，终不可用也。","Y6.XN":"“君子得舆”，见剥极之世，君子反为黎庶所归戴；“小人剥庐”，见群小自收其敝，其剥君子也，适以自毁其托身之所。","Z":"卦辞系以“不利有攸往”，就一卦大体言之：柔壮刚微，阳之处境无可称善。爻辞则随位而异：凡任剥者必凶，剥阳之辈皆不得安。是以六五承刚而获无不利，六三应刚而仅得无咎；初、二、四则躬行剥刚之事，凶皆不免。\n卦中君子与小人、上与民诸名目并见，知系辞之时，尊卑之等已判，社会久入于文明。观彖传所言，作者初无所谓上帝鬼神，以为人事之迁流与阴阳之代谢，同受一定之则所驱，非人之意欲所能夺。象传又言“厚下安宅”，言“民所载也”，则《易传》作者固已深识固本之要在乎厚民。不信鬼神而拳拳于民，其民本之见虽朴，而实赅备。"}},"24":{"id":"24","cnNum":"二四","name":"复","pinyin":"fù","fullName":"地雷复","shortFullName":"地雷复","upper":"坤","lower":"震","upperNature":"地","lowerNature":"雷","lines":[1,0,0,0,0,0],"yaoLabels":["初九","六二","六三","六四","六五","上六"],"blocks":{"P":"剥之上九，阳已穷矣。穷则无可复之，故不得不返而下。此《序卦》所以谓物无终尽之理，而受复于剥之后也。盖阴阳相推，阴之力足以为剥，而不足以为尽；剥至于极，即阳之还也。自上一返，自下而生，其间无分寸之隙可容止息，剥、复二卦相次，正为此耳。\n“复”之名，取诸返本。就爻象观之，五阴在上，一阳承其下，阴既穷而阳复。就天时观之，夏正之十月阴至盛矣，逮冬至交于子月，而阳气已动于地黄之中。就人事观之，阳者君子之象；君子之运既消而濒于尽，亦未有不复反而后亨者。","G":"复，亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。","G.N":"卦辞首系以“复，亨”，明复之所在，亨自随之。剥极而阳返于下，六爻之中阳仅其一，孤亦甚矣；然此一阳者，生于下而志在上，方兴而未艾。冬至一阳初动，百物随之萌芽，其气之舒，非人力所得而遏。五阴虽盛，居其上者终归披靡，曾不能为在下之阳作梗。\n“出入无疾，朋来无咎”：出、入二字，皆系于长养之事。反而藏于内者谓之入，充而达于外者谓之出。阳先萌于内体，后乃浸及外体，犹天地之阳自地中发端，渐以向外。疾者，害也。一阳之生，其力本微，而群阴卒莫能伤，盖有“朋”焉为之援，是以“无咎”。朋者，众阳之伦，初九之党也。咎之训，于天道为差忒，于人事为阻塞，同指所遇之不通。复之时，阳既自下而起，必有他阳合势并力，与群阴相持而后胜，阻碍既去，咎乃可免。\n“反复其道，七日来复，利有攸往”：道者，阴阳二者迭为进退、互为盈虚之定则也。反复者，阳进则阴退，阴进则阳退之谓。其进退一依乎定则而不失其次，故曰“反复其道”。自姤之一阴生，历遯、否、观、剥、坤，更七变而复合：阴日以长，阳日以消，至是而复见一阳，故曰“七日来复”。复则阳为主而阴为客，君子之运日隆，小人之势日蹙，是以“利有攸往”；若在剥，则阴为主而阳为客，其占为“不利有攸往”。一利一不利，全系于刚之消长，此其所以为《易》也。","T":"彖曰：复亨，刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎！","T.N":"“刚反”二字先出，“动而以顺行”继之，彖于卦辞之“复亨”与“出入无疾，朋来无咎”，实兼释之。剥取“顺而止”为义，复取“顺而行”为义。处剥则止，处复则行，君子所遇不同，其迹遂异；而所以能止能行者，同出于一“顺”。顺之为言，非委靡之谓，谓不拂乎自然之序、不违乎消息之律也。然此句之要，尤在“刚反”：卦辞何以系“复”以“亨”？其根据、其实质，尽在阳刚之一反。天道至复而通，通非幸致；消极必反，反则日长，长则无所不通。\n“天行也”承“反复其道，七日来复”而言。天地阴阳之运动，即所谓天行。剥之尽阳，非阳之自绝，阴极而阳不得不反耳。一阳复生，遂成复卦，此岂有人焉主张于其间？天地阴阳之律自如此。\n“利有攸往”系于“刚长也”，与“刚反”同主一阳，而用意各有所指，故其义不得而混。刚之反也，剥中之一阳穷于上而回于下，复卦由是而立：此为复之始，其功在转剥为复，故其效为亨。刚之长也，反之既定，一阳自下而渐升：此为复之成，其功在积微成著，故其效为“利有攸往”。剥彖以“小人长”为词，而系之“不利有攸往”；复彖以“刚长”为词，而系之“利有攸往”。同一攸往，而予夺迥别，圣人作《易》之意，为君子谋，不为小人谋，于此可见。\n“复其见天地之心乎”，此赞叹之辞，须先问：心果何物？古训“心之官则思”，凡虑之所出、谋之所定、百体之所听命，皆属焉。天地何思何虑，何谋之预，而乃有“心”可指？曰：孔子之言，譬喻之辞耳，非谓天地真有一心也。天地虽无心，而万物之生灭相续，阴阳之消长代更，盈虚消息，无一息之间断，其有序如此，其不息如此，宛然若有一物焉为之主张。孔子之所云，谓其似有，非谓其真有。然则天地之心安在？曰：在他卦所谓“消息盈虚”者是已，在不为人之好恶所移之自然规律而已。\n规律之在天地，无时不然，无处不有，而独举复卦以当之，何也？凡物之见，愈微则愈真。阴之剥阳，势若尽矣，而阳未尝有尽；其穷于上也，即返于下，复之名由此立。方其返也，一阳潜于五阴之下，动而未形，藏而未出，而生机已满；五阴重叠，压之抑之，终无以止其长。以形观之，阳已尽矣，而不可尽；以势观之，阳至孤矣，而实至强，天下无物能尼之使不上。自然规律之不可违，于此时最易验。若夫泰之三阳，品物咸亨，所见者惟蕃衍充盛之状，而心之真反隐。故曰“复其见天地之心”，非他卦无之，见之不如复之切耳。\n邵雍咏复，有句云“冬至子之半，天心无改移”，有句云“一阳初动处，万物未生时”，又有句云“玄酒味方淡，大音声正希”，而终之以“此言如不信，更请问包牺”，皆所以形容此彖，读之而旨趣了然。天地之心，岁岁年年、朝朝暮暮，无一刻之停，亦无一刻之易；而验之最亲者，唯在子月之中、冬至之候。何也？一阳初动，动之微者其发必大；万物未生，生之微者其成必盛。玄酒淡而味真，大音希而声远，正此意也。","X":"象曰：雷在地中，复。先王以至日闭关，商旅不行，后不省方。","X.N":"象以“雷在地中”立义，正阳初返之候。先王、后，皆有位者之称。观此象者，知微阳方动，不宜撄扰，故当至日行安静之政：关门下键而不启，行人止步而不通，天子亦屏巡守之事而不省方。所以必于至日者何？按十二辟卦之序，复当子月，于岁为十一月；冬至一阳始萌，正在此月。其气甚微，护之唯恐不及，故以静御动，以不扰养其将动，使新阳不至为外物所伤。","Y1.T":"初九，不远复，无祗悔，元吉。","Y1.N":"凡物本有而失之，失而复得，斯谓之复；本无而忽有，则不得以复名。复卦所论，正是阳已见剥，今又还归于初之事。复有远近，亦有早晚；近而复者早，远而复者晚，早复固胜于晚复。初九居一卦之初，其复为最近、为最早，故曰“无祗悔”，而系以“元吉”。祗者，抵也；“无祗悔”，谓不至于悔。以人身言之：有过而能自知，知而能自改，甚且过未形于外而先革之，则不至于悔——此即“不远复”之谓，盖其失未远而即返也。","Y1.X":"象曰：不远之复，以修身也。","Y1.XN":"君子修身，其道在“不远而复”。修身之要，不过两事：知过则速改，见不善则速迁于善。改固所重，而尤重其早、其快。","Y2.T":"六二，休复，吉。","Y2.N":"休者，美也；“休复”犹言复之休美者。复而休美，吉之道也。六二何以致此？位乎下体之中，居阴而得其正，又密迩于初九，志在从阳故也。","Y2.X":"象曰：休复之吉，以下仁也。","Y2.XN":"此“仁”非仁爱之谓，乃“人”之借字；古音同者相通，《论语》“井有仁焉”，其字亦当读“人”。“下仁”即下人：屈己以下于人之谓。此与修身一贯——修身者反求诸己，下人者降心从人。六二亲事初九，是已。","Y3.T":"六三，频复，厉无咎。","Y3.N":"震之为体也动，六三居其末，动极而失静，是以躁。改过者，贵乎觉之早而更之速；一更之后，永不再蹈，斯为上也。六三不然：其复频矣，犯而改，改而旋犯，失之既数，反之亦数，比于“不远”“休”二者，相去远矣，故系之“厉”。厉也者，危之辞也。然“频复”岂尽无取乎？数失而数复，犹愈于终迷不返、有过而惮改者。析而言之：累失则危，累复则可无咎。","Y3.X":"象曰：频复之厉，义无咎也。","Y3.XN":"数失而数返，固处危地；然肯于回头向善，终是长处。","Y4.T":"六四，中行独复。","Y4.N":"六四位居上体之下，其上其下各两阴爻，己独处群阴之中，故称为“中行”。此爻以阴居阴，位得其正，又与初九为正应，故称为“独复”。身处众阴之间而独能向复，可见其志可嘉。然自客观言之，所居者阴位，所应之初九又恰当阳气至微之际，援之无力，故虽有其志而实无所施为。爻辞不言吉、亦不言无咎，正以此故。","Y4.X":"象曰：中行独复，以从道也。","Y4.XN":"所从者，初九也。九以阳刚处下，其道为善，其途为正。小象特标“从道”二字，正见六四独复之志在乎循道，而非有所利而为之。","Y5.T":"六五，敦复，无悔。","Y5.N":"敦者，厚也。初九为一卦之主，六五与之初无系应，宜若有悔；然以其居中也，能自复也，故悔亡。六五之“无悔”与初九之“无祗悔”，未可混同：初九“不远复”，弃恶从善方始，故曰“无祗悔”；六五“敦复”，去恶向善之功已积而厚，故曰“无悔”。他卦言敦者多在上爻，临之上六曰“敦临”，艮之上九曰“敦艮”，皆取积厚至于极处之义；而此卦六五已言“敦复”，何也？盖上六为“迷复”，迷而不能复，则复之极处不得不归之六五。就实际言，复至六五，固已造其极矣。","Y5.X":"象曰：敦复无悔，中以自考也。","Y5.XN":"“自考”犹云自成。六五以柔处上体之中，所守者中德，所成就者亦即此中。成者何？成其复而已。六二比初九，六四应初九，皆有所藉；六五于初九无比无应，而独能自成为复，此其所以异也。","Y6.T":"上六，迷复，凶。有灾眚，用行师，终有大败，以其国君凶，至于十年不克征。","Y6.N":"上六居复之终，柔而无力，其象为迷而不知返。迷复者，昏惑失路，终不回头之谓。人有过于身而不自悔，歧之中又有歧，一直走去，凶固其所必至。灾自外至，眚由己生；“有灾眚”，则外至与己生者并集矣。然外至之灾，其端仍起于己生之眚，病根只在一“迷”字。迷而不复，则左亦不可，右亦不可，一动即蹈于咎：以之行师，终归大败；以之临国，君必及凶。十者，数之穷也。“十年不克征”，非谓待十年而后可征，谓此迷不改，则永无克征之期，灾眚永在，大败永终，君之凶亦永不解耳。","Y6.X":"象曰：迷复之凶，反君道也。","Y6.XN":"道者，所由之正路也。能复则循路而行，迷而不复则背之而驰；背之，凶无以免。“反君道也”之释，何所据乎？爻辞曰“以其国君凶”，小象因即以君道为言。夫君临一位，抚百姓、理万几，其道在以善复天下；今也昏迷不复，非反其道而何？反君道者，迷复之至大者也。小象举此，而凡为迷所困者悉在其中矣；等而下之，众人之迷复，亦孰非反道以致凶者。","Z":"彖于复独致叹焉，曰“复其见天地之心乎”。天地之心一语，解者纷然。或以为静是，或以为动是，或又以天地之心为生物之心，谓其生生而不穷。三说各有所当，然皆未为扼要。以愚论之，天地之心非他，即万物之间刚柔相摩、阴阳迭运之规律耳，固无所不在。虽无所不在，而唯当复之际呈露最著。盖其时阳若已尽而忽返于下，貌若寂然，中实盎然，于剥尽阳生之客观规律，形容得最为分明，非他卦所能及，此复之所以独当此叹也。\n一卦之主，在初九。初九与上六，一居复之初，一居复之终；一不远即返，一终迷不返，适成对照。六五曰敦复，敦者厚也，复之固者也，与六三适相反；六三曰频复，频者屡也，复之摇而不固者也。六四曰独复，略近于六二之休复，而所以复者异：六四以应，六二以比。"}},"25":{"id":"25","cnNum":"二五","name":"无妄","pinyin":"wú wàng","fullName":"天雷无妄","shortFullName":"天雷无妄","upper":"乾","lower":"震","upperNature":"天","lowerNature":"雷","lines":[1,0,0,1,1,1],"yaoLabels":["初九","六二","六三","九四","九五","上九"],"blocks":{"P":"卦次无妄于复后，《序卦传》谓“复则不妄”，意盖如是：人复于善，则妄缘自息也。卦名无妄，训为无虚妄；无虚妄者，实之谓。阳实阴虚，乃《易》之通义。复者，阴既消而阳来复之候，阳复则实，实继复后，故受之以无妄。其体震下乾上：震，动也；动而因乎天道，则为无妄。稍涉人伪，则所动者妄矣。","G":"无妄，元亨利贞，其匪正有眚，不利有攸往。","G.N":"此卦之辞，当分作两层：先立其正，后矫其偏。“无妄，元亨利贞”，正说也。上体乾，乾是天道的别名，元亨利贞四者为其所固有；下体震，则动之谓。顾动有二途：循天理而动，与徇人欲而动，其判甚严。循天者，顺自然也；徇人者，任人为也。顺自然以往，天下无可阻之地，元亨而利贞，乃其必至。“其匪正有眚，不利有攸往”，矫偏之说也。既不循天而任私意以动，则所趋已入于邪僻。邪僻者，眚之所由生；眚既生，则虽欲有所往而无所利。眚之为言，适与无妄相反。《说文》以目翳释之：目中蒙翳则视不见物，无妄之明既蔽，其不为有妄者几希。","T":"彖曰：无妄，刚自外来而为主于内，动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往，无妄之往，何之矣。天命不佑，行矣哉。","T.N":"“刚自外来而为主于内”，此语指内体之震而言。震之成，由坤而变：《说卦传》以乾坤相索，一索得男者谓之长男，即震是也。乾来索坤，坤之初爻由阴易阳、由柔易刚，积而成震。故初九一画之刚，其源出于外体之乾，来处既在外，则“刚自外来”之说也。又其爻居内体而为卦所倚，成卦之功系焉，则“为主于内”之说也。究其实，无妄之所以为无妄，全在此爻，是谓卦主。孔子系《彖》，拈出卦主之例者，独此一卦，他卦无闻。至王弼《易略例》广推其义，以为卦卦皆当有主；其见甚卓，后世遵之，无有异辞。\n“动而健”，言内外二体；“刚中而应”，言二与五两爻。动出于下，健见于上，二体相合而“动而健”之象成。九五以刚居中也，而位又得其正，是为“刚中”；六二以柔居中，位亦正，而下应九五，是为“而应”。有是二者为之本，故能“大亨以正”。所谓大亨以正，其实即元亨利贞之异文。“天之命”者，天之道也；以今语达之，则自然规律是已。“大亨以正，天之命也”与乾卦之元亨利贞同揆，皆谓四德出于自然之则，非有所造作于其间。\n《彖传》之称“刚中而应”者，师、临、萃、升及无妄，凡五卦；称“大亨以正”者，萃、临、无妄，凡三卦；至“天之命也”一语，则唯无妄独有之。盖无妄拈出天命，正欲明大亨以正之效出于天道自然，非人力可强致。\n“无妄之往，何之矣。天命不佑，行矣哉”，此释“其匪正有眚，不利有攸往”者也。自人事言之：当无妄之世，所贵在守正而已。非分之福，不可幸而取；非分之祸，亦不可幸而免。惟抱正以听于自然，即所谓弗往。若于此时而有所往，则“何之矣”——茫茫然将安归乎？盖天命所不佑，无可往之地也。“行矣哉”者，言所为拂乎规律，其可行乎哉，必不能也。","X":"象曰：天下雷行，物与无妄。先王以茂对时育万物。","X.N":"“天下雷行”，雷之动也，依乎客观之理，春发而冬收，未尝有差忒。盖雷者天之号令，其出有序，其藏有时，非偶然也。“物与无妄”，则谓万物随雷而起，大之与小、高之与下，飞者潜者动者植者，各秉自然所赋之“性命”，以生以长以动，亦未尝有差忒。在上者体此精义而施于治，“以茂对时育万物”。茂者，勉也；对者，顺而应之也。“时育万物”之“时”，最为吃紧。天之生物，皆循四序而行；治民者之于百姓，下逮草木昆虫，亦必循四序而为之所，使各得其宜。古人于“时”至为郑重，朔政之制行于中土甚早，即其明验。朔政者，月令之谓，随季候以定事，农功为尤要；何季既至，则举何事。凡百作为，皆不可逆天时。","Y1.T":"初九，无妄，往吉。","Y1.N":"初九为无妄之主，前所谓“刚自外来而为主于内”者是已。其体阳刚，居卦之初，动机方萌而即与天合，由是而前，安有不吉？然试以初九之辞比观于卦辞、《彖传》，则见其不类。卦辞兼陈正反：守正者大通，失正者不利于所往；《彖传》复申之，以为无妄而往，将何所底止。是全卦论往，吉凶利钝皆非一定，视守正与否而分；守正者动出乎天，失正者动出乎人。出乎天则其往皆利，出乎人则其往皆碍。初九之辞则径曰“无妄往吉”，若初九无往不可，往即得吉，更无商量余地者，其辞为独决。\n所以异者何也？卦辞、《彖传》统论一时之全局，初九则局中第一步耳。初九既主一卦，阳刚而在初，性分所在，动必因天，行必循正，吉之来也，非幸而致。故其辞绝去犹豫，与他爻之斟酌分寸者不同。","Y1.X":"象曰：无妄之吉，得志也。","Y1.XN":"初九阳刚而在卦初，随顺自然，合于规律，不纵私欲以妄行，故所至通达，无有阻遏，其志得伸。","Y2.T":"六二，不耕获，不菑畬，则利有攸往。","Y2.N":"六二柔而在阴位，位与体协，有安分自守、于外无所觊觎之象。安分而不觊觎，故其象为不耕获、不菑畬。方耕而遽求其获，是耕获也；初菑而遽期其为畬，是菑畬也。爻辞皆以“不”字断之，明其只任目前之劳，不责未然之效。人之用心如此，则所往无不利。","Y2.X":"象曰：不耕获，未富也。","Y2.XN":"富者，利之谓。未者，非也、不也。言不当于方耕之际，先存获利之心。","Y3.T":"六三，无妄之灾，或系之牛，行人之得，邑人之灾。","Y3.N":"无妄六爻，位位皆无妄也。六三以柔居三，位既不中，体又非正，故不免于灾，是为无妄之灾。夫无妄之灾，非己所致：身无纤过，而祸自外至。譬如邑中有人系牛于此，行道者攘之而去，而邑居者反受其累，诘问拘执，皆集其身。在邑人言之，此真无妄之灾也已。","Y3.X":"象曰：行人得牛，邑人灾也。","Y3.XN":"牛既为行道者所攘，邑居者反坐其罪，此邑人之灾也；灾而无自致之由，则无妄之灾也。此类之来，非人力所能避。人惟有自求无妄而已，至若祸福之降，一听诸天。","Y4.T":"九四，可贞，无咎。","Y4.N":"九四与初九为应，同处无妄之世，而所居之位相远，故其义随之而变。初九阳刚，当动之始，其所宜在行，故系“往吉”；九四阳刚，而在乾体，其所宜在止，故系“可贞无咎”。彼以进而得吉，此以不进为贞，趋向正相反。贞者，守而不迁之谓，非徒不往，亦且不行。守之既固，咎乃可免。","Y4.X":"象曰：可贞无咎，固有之也。","Y4.XN":"九四之免于咎，其故在己而不在人：中有可贞之实，故守之而安，非假借于外也。顺此实而贞焉，咎斯免；反此实而不贞，咎必及。处九四之地者，能识此意，则止而不进，福不萌幸得之想，祸不存苟免之心，其终亦复何咎之有。","Y5.T":"九五，无妄之疾，勿药有喜。","Y5.N":"“无妄之疾”，与六三“无妄之灾”相似而不同。九五得系“勿药有喜”，其故在其位之尊。盖九五阳刚，处中得正而据尊位，无妄之极，无可复加，真实无妄者也；本无致疾之缘，而疾忽然加之。疾自外至，不由内生，故曰无妄之疾。以九五当之，不足深忧：不药即药，不治即治，终必“有喜”。有喜云者，谓疾不待攻而自退。他卦之辞兼举疾与喜者，合此爻而得三：损之六四、兑之九四，位并在外体，取义约略相通。","Y5.X":"象曰：无妄之药，不可试也。","Y5.XN":"遇无妄之疾者，善处之法惟在守正安常，坦然不加料理，听其自愈，疾将自去。若遽试以药，是自己疑其守正安常之未是，而先自败其生理；疾未必去，而它疾继之矣。“无妄之药，不可试也”，此理推之于社会人事，亦无不然。治国者其政既已验诸事实而见为可行，则当坚持而贯彻之；纵有谤议，甚而诋诃，不可因之而易辙。若闻异论而中摇，是举其国以试药也，其祸可胜道哉。","Y6.T":"上九，无妄，行有眚，无攸利。","Y6.N":"上九之不善，全系于一“行”字上。眚非天降，由行而招。此爻处卦之终，位既不当，又居乾体之极，时已过矣；过时者宜静，宜居，不宜动，不宜出。当此而犹欲前，则本无妄者即成妄矣。纵使其行原出于无妄，亦必“有眚”而“无攸利”。\n眚之与灾，卦辞爻辞互见。二者祸同而源别：祸自外抵者为灾，过由己作者为眚。六三之丧牛，衅非己起，是灾而非眚；上九之躁动，咎自己招，最当戒惧。","Y6.X":"象曰：无妄之行，穷之灾也。","Y6.XN":"爻辞“无妄之行”，与《彖传》“无妄之往”一义。行虽本于无妄，宜若无失；然行之不正，或行非其时，则失之矣。上九所坐，正在乾体既穷，所处非时，与乾上九“亢龙有悔”同其机，故两处小象并以“穷之灾”为言。爻辞言眚，指其志言：时既穷而不可行，乃必欲行，祸由己出，故系以眚。小象言灾，指其遇言：厄于时穷而受祸，祸从外来，故系以灾。","Z":"无妄之要，一言蔽之：循规律、顺自然而已。处此世者，不妄求，不苟得，进止各有其宜，动静行藏一断于时。时之为义，于无妄尤显。六爻皆无妄也，而位异则时异，时异则效殊。初九位正，又居卦主之地，适当无妄之初，故所如皆吉。上九位不当，处无妄之末，时已逝矣，故其行虽无妄，犹不免“有眚，无攸利”。诸爻大率类此。六二之于初九为近，辞亦系“利有攸往”，以其当动，动则吉而有利。九四之“可贞”，九五之“勿药”，则与上九“行有眚”同趣，以其当静，静则无咎而有喜，动则不免于眚。《易》之重时，此卦为尤著。六爻之时既别，吉凶之趣遂分，读此卦者所宜先辨也。\n所谓时，实即主客相待之问题。时会既移，人之识见与其举措皆当随移。必也审时度势，顺乎自然，按客观之实择至当之路。初九六二，动则吉且利，故动；九四，静则无咎，故静；六三九五，横遭无妄之灾、无妄之疾，非人谋所能前知而豫避，际此惟有静俟其变，他无可为。总之，处无妄之世，主观之合于客观为第一义；客观既改，主观不容不改。\n又有一端可议者：《易》中内外相应，例以刚柔相配为美，无妄则反是。初九、九四两刚相敌，敌应非美也，而此则美：初九往吉，九四无咎。六二之与九五、六三之与上九，皆正应也，正应宜美，而此则否：六三有灾，九五有疾，上九有眚。是知爻之得失，不尽系于应之正敌，尤系于时。"}},"26":{"id":"26","cnNum":"二六","name":"大畜","pinyin":"dà xù","fullName":"山天大畜","shortFullName":"山天大畜","upper":"艮","lower":"乾","upperNature":"山","lowerNature":"天","lines":[1,1,1,0,0,1],"yaoLabels":["初九","九二","九三","六四","六五","上九"],"blocks":{"P":"大畜上承无妄。《序卦传》以为物必有实而后可畜；无妄者，实也，故大畜次之。所谓无妄，中藏实理而无虚饰之谓。有其实，乃能积渐而畜，二卦相次，正为此故。以画观之，乾居下、艮居上，天之至大而藏于山，所畜不亦大乎。畜之为义有二：一曰聚，一曰止。天在山中，言其聚也；乾健而受制于艮，言其止也。然物惟止而后能积，故止之一义，亦自畜聚而出。","G":"大畜，利贞，不家食吉，利涉大川。","G.N":"卦名大畜，取义于上下二体：下乾为天，上艮为山。天之至大，而山能容之；乾之至健，而艮能止之。所畜者既非一物之细，故不曰小畜而曰大畜。就一身而言，人之所当畜者，莫大于学与德。然学德之畜，不徒计其浅深多寡，尤在辨其正与不正。充于内者实，见于行者正，然后有裨于家国天下，卦辞所以系之曰“利贞”。畜之既大且正，则当出而效用于世；使独善自养，仅为一己之福，非天下国家之福也。若穷居而自食于家，则向之所谓吉者，转为其反。盖才德充盈之人，又复逢时得位，必能济国家之大艰、夷天下之巨险，此“不家食吉”与“利涉大川”之所以相继而系也。","T":"彖曰：大畜，刚健笃实辉光，日新其德。刚上而尚贤，能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。","T.N":"彖传先以才德立说。“刚健笃实辉光，日新其德”者，正所以申明卦名。乾之德刚健，艮之德笃实：刚健则物欲不能牵，笃实则浮华不能入。两体相摩相荡，刚者引笃者以益其健，笃者资刚者以固其实，辉光交映于外，而其德日进于内，一日复一日而无已。人能如是，则才之所蓄者不穷，德之所积者日厚，大畜之名，由此而立。\n次释“刚上而尚贤，能止健，大正也”。上九以阳刚踞一卦之顶，是谓刚上；其位居六五之上，以刚乘柔，尊崇之义生焉。尚贤者，畜贤之谓也。艮加于乾上，其用在止。然“止健”与“健而止”判然两事：言健而止，不过以止济健；言止健，则止之中自有畜养之意，所止之健，即贤者之才德。故“能止健”与“尚贤”异辞而同指。以国言之，蓄聚贤才而养之，乃政之最大而最正者，孔子于此拈出《周易》的人才之思。\n又释“不家食吉，养贤也”。贤者不当穷居而自食，当受禄于天子诸侯，宣力于邦国。自朝廷言之，此即养贤之政、畜才之术。孔子释卦辞，仍以人才为说，前后一意贯之。\n终释“利涉大川，应乎天也”。才既养矣，必待用之；用之，则其效见于济难。自贤者一面言，当任天下之艰、排国家之难，而不以一己之安为安。其所以能然者，以所应者天也。应之者谁也？六五是已；六五者，君也。天谓何？下体之乾是已。六五下与乾之中爻九二相应，君求贤而贤应君，是之谓应乎天。动而顺天，则险无不济，难无不解。","X":"象曰：天在山中，大畜，君子以多识前言往行，以畜其德。","X.N":"山之大，未足当天；而天之大，反纳于山。畜之极盛，无逾于此，此卦所以称大畜也。君子观其象，知吾身所当畜者不在外物，乃在学与德，于是孜孜焉增益其所未足。学之与德，析言之则二，合言之则一：皆由学而入，皆缘学而广。其道奈何？曰“多识前言往行”——博考前圣昔贤之言行，涵泳而履践之，德遂以成。大畜所畜者德，小畜所畜者亦德，然小畜止于文采之修饰，其德小；大畜则充实光辉，其德大。二卦之别，正在此耳。","Y1.T":"初九，有厉，利已。","Y1.N":"厉者，危也。已者，止也。初九以刚爻处刚位，居乾体之下，其势本欲上行，而六四据其上以为之阻。当此而不度其力，恃刚直前，则危必及之；即幸而暂进，终亦不能越六四之限。处此之道，莫如自止：不动于欲进之心，而安于所止之分。","Y1.X":"象曰：有厉利已，不犯灾也。","Y1.XN":"初九刚健，锐于上进，而前有六四为之闲。刚者不耐抑，遂将愤激而不择可否，于不可进之地勉强一逞。一逞则灾随之，此必然之势。爻辞系以“有厉利已”，正告之曰：不知止，则祸至。","Y2.T":"九二，舆说輹。","Y2.N":"说者，脱也。复为伏兔，车箱之下、轴所凭以转者；车既不行，则脱而去之。“舆说复”者，车解其行具而止也。其止也，非为人所制而不得已，乃自厌其进，释轭而休。九二之象如此，与初九有辨焉：同为阳刚，同为外体之柔所止，此其同也；初九刚而失中，九二刚而得中，此其异也。《易》之道莫重于中。失中者遇阻，畏而不敢前；得中者无待于畏，度其不可过刚，遂自敛而止。","Y2.X":"象曰：舆说輹，中无尤也。","Y2.XN":"“舆说复”，谓解驾自休，非被人止。“尤”犹言过。九二刚而得中，中德在己，故能裁量进退，脱辐而不前，未尝有躁进之失。","Y3.T":"九三，良马逐，利艰贞，曰闲舆卫，利有攸往。","Y3.N":"九三位刚而质刚，三画皆阳，纯乾之体也，故爻辞取良马为况。逐者，疾驰而前之谓。此“曰”字旧有异读，朱子《本义》从“日”为训，谓即朝夕之日。闲者，习也；舆者，车也；卫者，护身之具也。“日闲舆卫”，谓日日操习御车与自卫之事，不以一日之安而废。大畜之例，两爻相应则相止：初九见止于六四，九二见止于六五。上九与九三同居阳位，两阳之间本无阴阳相与之义，故彼此无所禁。不惟不相止，二刚同欲奋兴，又有同志之象。九三将进，上九不惟不禁，且与之协力而俱进，于是九三得以驰骤如良马矣。然天下事当从两面观：愈是坦途无碍之时，愈须以艰虞自处，戒慎而不敢肆。九三本刚健居正，又得上九为援，故爻辞既许其进，复戒以知难守正，必日日习于舆卫，然后“利有攸往”可言。","Y3.X":"象曰：利有攸往，上合志也。","Y3.XN":"九三得以“利有攸往”，其机在上九：彼不惟不加禁抑，且与合志而同趋。盖他卦之常例，应者为得，敌者为睽；独此卦反是——应则相止，敌则相求。一卦之体，遂与诸卦异其用。","Y4.T":"六四，童牛之牿，元吉。","Y4.N":"童牛，犊之未生角者。牿则施于角上之横木，牛碍于木，遂不能以角抵触。六四处上体，艮之用在止；柔爻居柔位，位既当而德复正，其下与初九为应。应者相求，亦相禁制，故初九为六四所畜。初九在一卦之底，诸阳之中最为微弱，以六四制之，力有余裕。天下事莫不然：恶方萌而治之，隙初开而塞之，用力不多而成功甚易。“童牛之牿，元吉”，所喻即此。牿譬六四，犊角之未出譬初九。角未出而先设防，使终无以触物，善之善者也，故系以元吉。盖祸患之来，当其微而易图，待其著则难矣。","Y4.X":"象曰：六四元吉，有喜也。","Y4.XN":"所畜者弱，所施者早，故事半而功全，所以元吉；元吉则喜可知已。","Y5.T":"六五，豮豕之牙，吉。","Y5.N":"豕者，猪也。豮者，去其势也。豕性刚躁，牙利而善啮，故取以为喻。六五以柔居尊而处中，能畜九二之刚。顾其事不如六四之易：九二刚暴之质已壮，犹之衅已成而后治，其难自倍。虽然，难而非不可为也，在扼其要而已。豕之伤人者牙，而牙不足治；所当治者其性。去其势，则暴者驯，虽有牙而无能为害。治本而不治末，此畜刚者之术也。六五之止九二，虽费曲折，然以柔道驭刚，终底于成，故吉。","Y5.X":"象曰：六五之吉，有庆也。","Y5.XN":"六五之于六四，其得失各有在。就止物之功言，六四遏之于始萌，最为得手，故元吉；六五制之于渐壮，其力较费，故第言吉。就所居之位言，则六四不及六五。六五南面而行，一动而及于天下，故曰有庆；六四所及止于一身，故曰有喜。辞之轻重，非苟然也。","Y6.T":"上九，何天之衢，亨。","Y6.N":"何读如贺，与负荷之荷通。衢者，四通之途。天衢云者，喻其行之无碍耳。上九当与九三参看。他卦之常，阴阳有应则为美；此卦则初四、二五皆应，应而反成阻隔。至于上九则不然。其于九三也，刚与刚遇，非有阴阳相求之义，而心期默契，趣向无违。九三欲行，上九亦欲行。上九处一卦之末，畜道至此而穷，穷则复通，塞者不得不开；又为此卦之主，一身负荷尚贤之任。当应天行道之会，其行也如天衢之荡荡，纵其所如而无所阻。卦辞“不家食吉，利涉大川”与彖传“刚上而尚贤”之旨，于是乎荟萃于一爻。自国言之，为养才用才之事；自人言之，为效忠邦国、有立于世之事。","Y6.X":"象曰：何天之衢，道大行也。","Y6.XN":"上九之为人，或为所养之贤，或为养贤用贤者，二者皆可。要之，其德蕴于中者既已丰满盈溢，至此当出而见于用。蕴之于己者谓之德，推之于国与天下而见于事者谓之道。上九以身任重，居畜之终，其才其德于是尽展，如“荷天之衢”然，四达八通而莫之夭阏，所谓“道大行也”，正指此也。","Z":"大畜之旨，合孔子彖、象之释而观之，不过畜聚与畜止二端。卦辞与彖传、大象所言，多主于聚；爻辞与小象所言，多主于止。孔子又不止于象数，更由虚入实，直以养贤用贤当之。\n六爻之辞，以止为主，而聚之义亦寓其中，究其归，则皆所以发明养贤用贤之道。初九“有厉”，见难而知止也。九二居中，解辐而休，审乎时可止而自止也。九三之于上九，非应而合，时可进则进，其进也如良马之骤，然必有以闲习之、节制之，未可一往而前。六四牿童牛，能销恶于未萌、杜患于初动。六五豮豕牙，能操其要而解其纷。至乎上九，所畜已满，满则通，畜道于是大行，无复隔阂，荡荡然若天衢之四辟。\n若以尚贤之义贯之：有厉与脱辐，是贤者未得其时，犹之“家食”，为大川所限而不得进。牿牛、豮豕，是中人以下者早受教戒、得根本之治。及乎良马之逐，贤路渐开，虽有崎岖，日习舆卫，则进而无咎。至“何天之衢”，则大川已济，险阻尽夷，贤者之途广辟而无所碍矣。"}},"27":{"id":"27","cnNum":"二七","name":"颐","pinyin":"yí","fullName":"山雷颐","shortFullName":"山雷颐","upper":"艮","lower":"震","upperNature":"山","lowerNature":"雷","lines":[1,0,0,0,0,1],"yaoLabels":["初九","六二","六三","六四","六五","上九"],"blocks":{"P":"物既畜聚于前，则继之者惟在所以养之，使之生息不匮，《序卦》所以承大畜而以颐次之也。其为卦，震居下，艮居上，四阴错处其中，一阳各据其表。噬嗑之体，中藏九四一阳，有似口中含物；拔去此物，口形乃见。虚者居中，实者分峙于两端，加以下动而上止，咀嚼吞吐之状宛然，人之进食也。口之所资以奉身者，饮食是已；养之与颐，义本相通，卦名由是而立。然颐之所赅，不止一身：自孔子推言之，天地以之育万物，人主以之养贤而逮万民，士庶以之养身而兼养德，举凡涵育长养之事，悉在其中。","G":"颐，贞吉，观颐，自求口实。","G.N":"颐之为义虽广，约之不过二端：曰养人，曰自养。所谓观颐，即观其所养；所观者不在受养之人，而在施养之术何如。所谓自求口实，即观其自养；所观者亦不在口体之奉，而在养身养德之方何如。二端虽分，其要归于一“正”字：所养合于正斯吉，不合于正则凶，吉凶之分，全系于此。","T":"彖曰：颐，贞吉，养正则吉也。观颐，观其所养也。自求口实，观其自养也。天地养万物，圣人养贤以及万民。颐之时大矣哉。","T.N":"养之得吉，系乎正与不正而已，卦辞“颐贞吉”所揭者此也。然正之为正，其界域甚宽，《易》但示以大纲，至若某事当缓、某事当急，则随其时、因其人、即其事而权之，非一言可尽。孔孟荀之论此，亦未尝执一。大体言之，义重于利，故伯夷、叔齐不食周粟，而孔子许其高；至于编户之民，则又以饱暖为先务。孔子谓既富且庶，然后可施教化；孟子言凶岁之民救死不暇，奚暇治礼义。先后之序，于此可见。\n观其所养与观其自养，析之则两，合之则一。施之于人、取之于己，所向虽殊，而所争只在一事：其道正耶？否耶？正无定格，或先道义，或先衣食，孰为当务，视时之所宜而已。\n至若“天地养万物，圣人养贤以及万民，颐之时大矣哉”，则孔子已养之一事推极于自然与人事之间，以谓上关天运，下系民生，其重如此。天地之育物也，雨旸有节，四时代嬗，阴阳迭运而无愆，此即天地之正。圣人法之，其养贤以及万民也，亦必有常度有定序。盖圣人在上位，其所养者以贤为急，贤者得所，然后万民蒙其泽，养贤正所以养民也。","X":"象曰：山下有雷，颐。君子以慎言语，节饮食。","X.N":"雷动乎山之下：动者在下，止者在上，口颊之状也。口颊之为用，出者为言，入者为食，二者皆由之。君子观此象，于言则不敢易出，于食则不敢过取。何也？言之既发，无路可返；食之既入，无路可出。世所谓祸由口生、病自口入者，正谓此也。以一身言，言自为言，食自为食；以一国言，号令文告皆其言，赋税租入皆其食。为政者于号令尤忌轻发，于赋敛尤忌无度，出入之间一有颠倒，则所损者大矣。","Y1.T":"初九，舍尔灵龟，观我朵颐。","Y1.N":"舍者，弃去之谓；尔、我，则彼此相呼之辞。灵龟者，龟之通灵而能久，绝粒亦可以生。朵颐者，口颊鼓动、馋涎欲下之貌。初九与六四为应。以才而言，初九刚明，自有可养之资，不必外求，犹龟之不食而自全；然其所居者动体，动则欲生，遂不能守，反舍己之刚而羡人之养，是阳者下视于阴而垂其涎也，凶何以免。爻辞乃假六四之口以责之：尔固灵龟也，不待人养而自存，今奈何弃其所以灵，而向我啧啧耶？阳之职在养阴，今倒而求养于阴，失其分矣，故凶。","Y1.X":"象曰：观我朵颐，亦不足贵也。","Y1.XN":"初九之才，刚而能明，在《易》例中本属可尚。然孟子尝有大人小人之辨：所养在大，则为大人；所养在小，则为小人。初九挟阳刚之资，而垂涎于口腹，所营者小体也。才虽足取，用违其道，则亦何可尚焉。","Y2.T":"六二，颠颐，拂经于丘颐，征凶。","Y2.N":"颠者，倒置之谓；拂经者，违其常道之谓。颐之六爻，其失也或颠或拂：颠则向下而求，拂则向上而求。六二与初九相比，就近取给，本有可求之地，然求之而不得；于是越六五而攀上九，常道既违，上九不应其求，六五亦以见越而衔之。所求者未获，所近者先伤，以此为行，凶固宜然。","Y2.X":"象曰：六二征凶，行失类也。","Y2.XN":"所谓失其类，谓六二之失六五也。二与五同为阴爻，本以类相与，今舍之而他往，故曰失。","Y3.T":"六三，拂颐，贞凶，十年勿用，无攸利。","Y3.N":"拂颐者，越位而上求于上九也。六三之势与六二异：六二比于初九，犹有邻可依；六三环顾上下，别无藉手，所可归者惟上九耳。上九与之正应，应而求焉，于义未为不正，故系之以贞。然则贞而何以凶？曰：是爻之质限之也。以阴居阳，位既不中，体复不正，又处动之极，居心好动而履于邪，凡所欲得，必曲意以营之，求养于人而无所不至，其凶有必至者。“十”者，数之终也；十年勿用，言终无所可用，往则无利。","Y3.X":"象曰：十年勿用，道大悖也。","Y3.XN":"“十年勿用”四字，下语极重。六三之失非小小愆尤，故象辞以“道大悖”断之。卦辞云“颐贞吉”，此爻乃曰“拂颐贞凶”，与卦义正相背反，是谓大悖。悖者，逆也；养人自养之道，至是而根本倾覆矣。尝计《易》中言“贞凶”者凡八：屯、师、随、巽、节、中孚六卦列于外体，处内体者止二爻，恒卦初六与颐卦六三当之。六卦居外，皆本有应爻可援，而卒不能免，足见病不在应，而在本爻以柔居刚、位失而德偏也。","Y4.T":"六四，颠颐吉，虎视眈眈，其欲逐逐，无咎。","Y4.N":"六四体柔而位正，居大臣之地，下与初九相应。以柔自处，则力不足以自给，更无论泽及天下；故转而求助于在下之贤，取初九之刚以为养。在上者反资于卑下，是之谓颠颐。然六四柔顺而守正，其求也以道，初九无不乐应，故吉。自初九言之，下比于四而求焉，则失己之守；自六四言之，上求于初而得焉，则为得所赖。此吉凶之所以殊也。\n同一颠颐，在四则吉，在二则征凶，何故？盖卦分两体：上体三爻，所志在道，所求者大体之养，故皆得吉；下体三爻，所志在物，所求者小体之养，故皆致凶。位之上下，即所求之雅俗系焉。\n“虎视眈眈”，状其目注一物、旁无所迁；“其欲逐逐”，谓其求之不已、不得则不止。六四之求初九也，如虎之搏食，既专而无二心，复续而无倦意，期于必得而后已。居上而求德，所求者又下之贤，此为求养之正，故终无咎。由此观之：内足自养、绝粒而寿者，莫如龟，故初九取龟；外求于人、稍不专不恒则无功者，莫如虎，故六四取虎。象之各异，正以其所求有内外之别也。","Y4.X":"象曰：颠颐之吉，上施光也。","Y4.XN":"六四当大臣之任，不以下求为耻，能得初九刚阳之应，所求既遂，是以吉也。“上施光”者，光之为言广也、大也。推之国政，是人君由养贤一路，而德意遍及于四方，贤者既举，万民亦赖以安，养贤养民之事，一举而两得焉。","Y5.T":"六五，拂经居贞吉，不可涉大川。","Y5.N":"何谓拂经？己无以自养，而仰给于在上者，是矣。何谓居贞？安守其位，不轻有所作为，是矣。六五之质，柔顺而居尊。君之职本在养人，然以柔顺之质当之，力有不逮，其事遂不得不倚于臣。二与五非正应，故所倚者不在二而在上九。上九刚而在上，下乘柔顺之五；五所托者，彼能任之。五惟端拱守正，不纷更、不轻动，则吉可致。至于大川之涉则未可——艰险之会，仍须付之臣下，非己所能独任也。","Y5.X":"象曰：居贞之吉，顺以从上也。","Y5.XN":"六五拂经而居贞，何以能吉？盖其才虽不及刚阳，其德则能以柔顺下人，一心从上九，藉其力以覆育天下，故己不必自用而其功自成。《彖传》所谓“圣人养贤以及万民”，正指此爻之事。","Y6.T":"上九，由颐，厉吉，利涉大川。","Y6.N":"阳主实，阴主虚。实者能以与人，虚者必取于人。颐之四阴，咸仰给于上下两阳，而两阳之中，上九为之主。上九居艮止之顶，四阴之养皆自此而出，故曰由颐。由颐者宜得吉矣，然其位不过人臣，以臣而当养天下之责，居高位而任重事，苟不常存戒惧，祸必随之；惟其危厉，是以得吉，故曰厉吉。“利涉大川”与“厉吉”相为表里，其中兼含二义：所治者艰大，故有危；能济此艰大，故有吉。","Y6.X":"象曰：由颐厉吉，大有庆也。","Y6.XN":"庆之大者，非一人所独享；上九之得此，实天下同蒙其福。其危厉而终获吉，功亦不尽在己：六五居上，信之任之，顺而听之，故彼得以成其事。六五小象之言，适与此相发：彼之居贞而吉，岂贞固自守所能致？亦曰顺以从上，取上九之力为己力耳。","Z":"颐之为卦，所论者养而已。自人己相接言之，有养人、有自养；自所养之实言之，有养德、有养体。养人者公，公则善；自养者私，私则未善。然自养之中又有辨：德为大，体为小。此特举其常耳，孰善孰否，未可执一，仍当随事而衡。\n试以卦体证之。上体为艮，止而能容，三爻大率以养人为事，公而善矣；而六四独求养于初九，非养人者也。非公而亦得吉，何欤？为其柔顺，以阴居阴而位正，求不逾分故也。下体为震，动而外驰，三爻率皆乏自给之资，待人而后给；既待人而给，则所志者物而非德，故悉凶。\n卦辞曰“颐贞吉”，言得正则吉也。六三则柔处刚位，位偏而不中，性复好动而溺于邪，其凶自取，无足怪者。若初九以刚居刚而位正，六二既中且正，宜若有吉而无凶，而竟不免于凶，则非其人之失，乃其时之穷也。是知《易》之所谓正，非一定不移之衡，随时而变；其立义有定式，其取用则至活。盖思维之活，正缘世事之繁，生活本无定格，则立言者亦不能以一律拘之。"}},"28":{"id":"28","cnNum":"二八","name":"大过","pinyin":"dà guò","fullName":"泽风大过","shortFullName":"泽风大过","upper":"兑","lower":"巽","upperNature":"泽","lowerNature":"风","lines":[0,1,1,1,1,0],"yaoLabels":["初六","九二","九三","九四","九五","上六"],"blocks":{"P":"以体言之，下巽为木，上兑为泽；木居泽下，水没其杪，过之形已具。泽本以润木为事，养之而反没之，过孰甚焉，名之所由立，其在此乎？然《序卦》所以次之者，尚有一层：养道既尽，物皆充然而有动意，动而求逾其分，则过自此生，大过之所以承颐也。若问过之实，则曰阳过也。阳在《易》例称大，阳既过，名遂以大过归之。此义既立，可推而广之：凡超出常格、造乎极至、较寻常为独巨者，皆大过之类也。然不可以“过犹不及”相混。彼言中道，过与不及同为一偏，皆待矫而正；此言形势之偏重，重心倾于一方，非矫之谓也。","G":"大过，栋桡，利有攸往，亨。","G.N":"栋者，屋脊之檩，椽与瓦皆倚之而立；桡者，曲而不直之谓。大过以四阳成体，《易》中四阳之卦凡十五，而独此受大过之名，其故不在阳数之众，而在四阳连聚于中，二阴退处于本末——初六居首为本，上六居终为末。本末既皆柔弱，中央独见刚盛，强弱之势倒置矣。四阳者，栋也；栋之所托，正在本末。托者无力承当，则栋虽刚亦不得不曲，栋桡之象由是成。当此之时，非有攸往、非有所作为，不足以通其塞，故曰亨。移之于国政，大过即危机之会；必大有所设施，方能转危而为安。","T":"彖曰：大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。大过之时大矣哉。","T.N":"“大过，大者过也”，一语已尽。大者谓阳，阳过则卦名立。四阳比连而处中，其中二、五两爻以刚据要位而主事，二阴则被斥于外。阳之过如此，大过之实亦如此。\n次言“栋桡，本末弱也”，与上句非二事。刚之所以见为过，正缘本末之弱；本末之所以见为弱，亦由中四之过。栋之曲也，两因并存，单举其一则偏。\n若夫“刚过而中，巽而说行，利有攸往，乃亨”，则舍象而专论爻才，以明其可为之势。象之所呈，中强末弱，栋桡诚有之矣；才之所具，则解之有道。何也？中四爻刚虽过，而二、五各得其中，又皆任事之爻，处事自能以中为准，不至以刚偾事；初、上二爻处内外之端，一以巽入，一以和说，行乎其间，众情自附。刚得中而柔顺从，二者合，往而亨也，可前定矣。\n终之曰“大过之时大矣哉”，所以叹时也。时何以大？为其所遭之事非常。立君、兴国、改易风俗，皆非小小补苴可了；时不至则事无所附，时至而材不称则事亦无成。故大过之世，正过人之才驰骛之世也。","X":"象曰：泽灭木，大过。君子以独立不惧，遯世无闷。","X.N":"泽之于木，润之者其常，没之者其变；本以养木为事，终乃灭木以成灾，事至乎极，卦以是名。君子玩象，不徒观物，而以自厉：所树者非常人之节也。处显则挺然自持，众论沸而弗移；处隐则泊然无求，举世遗而弗愠。见于政事，当其任则断然必行，非毁交集而不顾；去其位则退无怼心，声名销落而不悔。","Y1.T":"初六，藉用白茅，无咎。","Y1.N":"孔子释此爻，分三层言之。先言物置平地，本已无虞；次言更加衬垫，遂可无患，所谓“何咎之有”者此也；终乃断以“慎之至也”，而申之曰：茅之为物至微，所系则重，循是道以行，失者鲜矣。合而观之，爻旨惟在敬慎。然慎亦有多寡之别：仅足寡过者，寻常之慎也，未足成务；举大事者，非慎之至极，不能有功。初六当大过之初，质柔位卑，与刚无忤；行事之际，唯恐有失。置物于地，于理已安，犹嫌其未尽，再藉以茅，务使一毫无失而后已。","Y1.X":"象曰：藉用白茅，柔在下也。","Y1.XN":"象辞取“藉用白茅”，所标者二：一为其质之柔，一为其位之卑。初六体阴，在大过之初，上应九四——柔而处下，两端俱备。此语与刚在上者相形而立，非孤立之辞也。然基不厚则高者危，本不固则刚者折；初六之力诚不能自振，善在能敬能慎、自处得宜，九四之栋遂不至倾偃。","Y2.T":"九二，枯杨生梯，老夫得其女妻，无不利。","Y2.N":"“梯”字古无定诂，程颐训根，差为近之，今从程氏。九二所逢，阳过之世；过非可嘉，故取枯槁之杨、衰暮之夫为况。顾其位居刚过之始，体柔而得中，上不应五，下则密迩于初六：以过刚之人，而肯折节纳柔，刚柔遂得交通。杨枯矣，根株更萌；夫老矣，嗣续有托，生育之功不以此而废。过未及极，又有近比之助，老夫女妻之象所以成也。他卦之常，刚爻得刚位为善；独大过时刚已病其过，必待柔以和之，故其刚爻居柔位者反吉，居刚位者转失。","Y2.X":"象曰：老夫女妻，过以相与也。","Y2.XN":"九二之刚已过，而初六适与之近比，老夫女妻之象生焉。夫老，阳过之征也；得女以配，则刚柔相济，向之衰者复有生育之能。","Y3.T":"九三，栋桡凶。","Y3.N":"卦辞言栋，统中指四阳；至爻辞，则栋之分属止在九三、九四两爻，而桡之象独系于三。何哉？三以刚处刚，刚而又刚，过而不中故也。夫当大过之世，欲有所建立，必也有人左右之、扶掖之。九三刚气太盛，有违中和，接物不能与人相和，人亦无肯为之辅者。以独任之身，当至重之寄，力所不给，势所必颓，屋倾栋折，凶之至也。","Y3.X":"象曰：栋挠之凶，不可以有辅也。","Y3.XN":"九三之凶，其枢在无辅，而尤在不可有辅。以爻象言，三与上六本为正应，上六非不可辅之者；然三处大过之时，刚而不过、居位不中，又在巽体，巽极则将变，其志与上六自不相从——上六无意来应，三亦无系恋于上六之意。以事理言，栋居室之中央，承重而无所倚，本非可旁加撑拄之物。两义相合，则栋桡之凶无所避也。","Y4.T":"九四，栋隆吉，有它吝。","Y4.N":"栋隆之义，与桡正相反：桡者中折而下曲，隆者特起而高。九四刚而在柔位，刚得柔济，其力足以任大过之重，故不惟不折，更见其高，吉所由致也。然四之刚柔相配，本已自足；顾与初六有正应之系，情有所牵，是谓“有它”。有它则不能无累，虽未至倾败，吝亦不免。\n三、四同居卦中，并有栋象，一凶一吉，不可不辨。辨之有三：论爻德，三也刚上加刚，四也刚而以柔自处，一异也。论卦位，三居下体之尽，下体上盈下歉，歉则在末者虚，虚则所载易欹；四居上体之初，上体下盈上歉，盈则在基者实，实则所荷能立，二异也。论相承之序，三处四之下，四处三之上；居下者桡亦在下，居上者隆亦在上，三异也。","Y4.X":"象曰：栋隆之吉，不桡乎下也。","Y4.XN":"九四获吉之由，爻辞已自道破，曰“不桡乎下”而已。盖能与初六断绝系应，不以刚而从柔，栋斯隆矣。假令牵于初六，曲其身以下就，则吉不可得，而吝随之。","Y5.T":"九五，枯杨生华，老妇得其士夫，无咎无誉。","Y5.N":"士夫者，年少而为之夫者也。大过之刚，过则为病，然病有可解：近于柔而与之比，则刚有所受，不至于孤亢。九二、九五皆比于柔，故二爻俱有生意；而生意之厚薄，则不可同日语。请先言五。五处刚过之穷，本身又刚，所与比者上六，上六为过阴，又居卦末，其气已微而将尽，故有枯杨生华、老妇士夫之象。华缀枝端，于干之枯无补；夫虽方壮，所偶者老，嗣息终不可期。次言二。二在刚过之初，得中而居柔，所与比者初六，初六者卦之本，其机方新，故有枯杨生梯、老夫女妻之象，往无不利。以占言之，五不逮三之凶，亦不逮四之吉，两无所归，第曰无咎无誉而已。","Y5.X":"象曰：枯杨生华，何可久也。老妇士夫，亦可丑也。","Y5.XN":"枯杨而能生华，是一线之生意犹未尽绝也。然华之所生在末，根本之枯如故，不惟无补，且将使残阳余气骤然而尽，其能久乎？老妇谓上六，士夫谓九五。上六阴过已极，故以老妇称之。九五亦阳过之极，而谓之士夫者何？盖五之年未必少，取与老妇相形，则犹为壮，是以有士夫之目。老妇本已不育，虽得壮夫，终亦无成。在九五言之，与枯杨生华何异——外观若可喜，实非佳事。","Y6.T":"上六，过涉灭顶，凶，无咎。","Y6.N":"上六处大过之终，其位则无位也，泽灭木之象至是而显，故占为过涉灭顶而凶。以才言之，柔而弱；以时言之，阳过之极。当此二者相会，六固无可为之势；若强使主事，灭顶之祸必矣。此一面也。又有一面：上六之可取者亦在此。其为阴柔，又为兑说之主，从容随顺，本其所长；纵遇不利，亦不至以刚激之故重增其不利。其委蛇周旋于大过之末，无损于事，人亦无得而咎之。","Y6.X":"象曰：过涉之凶。不可咎也。","Y6.XN":"所谓不可咎者，非谓灭顶之凶可以不咎也。盖上六既蹈此凶，其德柔顺而和说，能婉转斡旋其间，使事不至于益坏，故在论者，不当以怨咎加之。","Z":"大过一卦，取古代政治生活中屡见之刚过为素材，化而为一个抽象命题，其义遂通于后世。卦辞数言，括之最简而最明。“栋桡”二字，可读作一种危殆之局：君强而臣弱，上重而下轻，政令之权过盛而民生之资过削，凡此皆可纳于栋桡之下。外观未始不安静，其中则危机充塞、令人不得喘息；欲破此局而推之向前，途辙惟一——“利有攸往”，有所施为、有所更革而已。孔子于《彖传》叹“大过之时大矣哉”，是其已知此卦所系者为国之命脉；又于《象传》为秉政者立出处之准：见用则独立不惧，断然行之；不遇则遯世无闷，人不知而不愠，守己以俟时。此意至今日读之，犹觉其思理深长，非一时一地之言也。\n抑犹有一义当辨。通常之例，六爻两两相配，初配四、二配五、三配上，谓之应。大过独不尽然。观其六画之布，上下相准：四阳同处中央，二阴各缀两端，形既中分，义亦相对。故其立象，不循相应之常，而取反对为法。三与四为耦，并言栋，而隆归四、桡归三；二与五为耦，并言枯杨，而华在五、梯在二；初与上为耦，一为藉茅示慎，一为灭顶告凶。行此例者，以大过为最著，此外颐、中孚、小过三卦亦同。至若正不正之辨，诸卦皆以爻位相配为准：阳在阳位、阴在阴位者为正，正则吉，否则否。大过独反其例。刚之为患已甚，又处以刚位，是以过益过也。故其爻之吉，多在柔位；其凶，多在刚位。大壮一卦，亦近此旨。"}},"29":{"id":"29","cnNum":"二九","name":"坎","pinyin":"kǎn","fullName":"坎为水","shortFullName":"水水坎","upper":"坎","lower":"坎","upperNature":"水","lowerNature":"水","lines":[0,1,0,0,1,0],"yaoLabels":["初六","九二","六三","六四","九五","上六"],"blocks":{"P":"《序卦》以“物不可以终过”承之，谓凡物过极则反，坎所以继大过而起。就卦义论，坎与大过适相反对：大过为阳之亢，坎为阳之陷。一阳厕于两阴之间，四围皆阴，此陷之势也，故坎训为陷。阳之为道，亢则有陷；进而逾度，坎陷随之。陷之为言，即险难之谓也。阳之将陷，其几在于过而不已；圣人于大过之后系以坎，正欲人知亢极之可畏。卦名冠以“习”，据《彖传》“重险也”之释，习者，重也。两坎相叠，险上复险，是以称习坎。八纯之卦，其七皆以一字为名，独坎增习，其故可思。先儒所解，亦颇不一致。或谓乾健、坤顺、震动、艮止，七卦之德皆属正面，坎独以险为德，险非美事，故加习字以见险之重叠、险之艰难，欲人加意焉。此说于义亦通。","G":"习坎，有孚，维心亨，行有尚。","G.N":"所谓孚，即信；言有孚，谓其有信。坎之象为水，水之性主于流，其流必趋下。境遇虽殊，趋下之性未尝一改，此即其信，故曰水有信。“维心亨”者，亦就水言心。水岂有心？就其行止有常、奔赴不已，若别有一物主之者，遂谓之有心耳。百川赴海，穿山越壑，其形则颠连于险阻之中，其心则未尝不通。质言之，水之性不移，昼夜奔流；遇险而滞者其形，不为险所遏者其志。末句“行有尚”，程《传》以“有功”立训，谓险可出则其行足尚；今从之。","T":"彖曰：习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也。王公设险以守其国，险之时用大矣哉。","T.N":"“习坎，重险也”一句，乃释卦名之所由立。卦之所主在险；两坎相重而后名习，坎既为险，则习坎者，重险之谓也。险而曰重，则非一端之阻，乃层累相因、去其一而其一犹在者也。\n水之行也，流而不盈。流与盈本相反对：趋下而前行者谓之流，满而不泄者谓之盈。故“不盈”非有所不足，正言其流之不止。水之性本长流，虽置身险难，昼夜不息，“而不失其信”，此即其信之所在。\n“维心亨”何由而致？曰：以刚中也。九二、九五两爻皆阳刚而处中，卦有刚中，则心亨而孚立，故曰“乃以刚中也”。刚中在卦为美，坎得之，是以“有孚”，是以“维心亨”。\n“行有尚，往有功也”者，行乎险而信不失，其行足嘉，可以出险，可以脱困，而终底于成。\n至若“天险不可升也”以下数语，则孔子系《彖》时自抒所见，非为卦辞作解。孔子于《易传》，每留意推经义以施于政事。坎之为卦，险而复险，自常情言之，于人不利；然孔子见险有时而利，谓可藉以守国御寇，“王公设险以守其国”是也。此意恐非《周易》所本有：《周易》成于殷周之际，其时尚未有设险守国之事。武王伐纣，师自今之西安东出，坦行至河南，途中未尝有险阻之碍。逮春秋，秦穆公图东略，袭郑之师还经崤山，为晋所邀，覆军尽没，匹马只轮不返，桃林之塞实佐晋成功。春秋以前，未闻以设险守国者，孔子盖举之为新义。及战国，设险乃遍行于国防，列国筑城之外，更筑长城。于此可见：险在常时为害，在特定之时则不惟有用，且有大用。故孔子叹曰“险之时用大矣哉”。","X":"象曰：水洊至，习坎。君子以常德行，习教事。","X.N":"洊者，再也、仍也。内坎既尽，外坎复来；前水方过，后水随至，相仍不已，卦之所以名习坎也。君子体之，得二义焉：德之存乎己者，守而有常，不以境迁而改；教之施于人者，习而弥熟，不以日久而辍。","Y1.T":"初六，习坎，入于坎窞，凶。","Y1.N":"习坎者，重险也。初六以阴柔之质，居重险最下，上无正应，旁无援助，身已没于险中而力不足以自拔，故其占为凶。窞者，坎中陷下之处；“入于坎窞”，则由险而更入于险，险中之险也。","Y1.X":"象曰：习坎入坎，失道凶也。","Y1.XN":"同是入险，初六独至坎中之陷，且入而不得出，其故安在？盖阴柔而居初，位不当，行不由正故也。正路既失，则一陷不可复振。譬之小人涉难，不循理以求济，徒冀幸于万一，究亦愈陷愈深而已。","Y2.T":"九二，坎有险，求小得。","Y2.N":"九二为两阴所夹，身已在险，自无不险之理。然其与初六异者：初六柔而无守，九二则刚而得中。虽不足以尽脱于险，若求小小之济、办当前之事，尚自可能。为九二者，不当以所济者小而遂已也；大者固由积小而成。","Y2.X":"象曰：求小得，未出中也。","Y2.XN":"“求小得”之故，《象》以一语蔽之，曰“未出中也”。君子身在险中而不为险所窘，正以其能安于险：不期于大获，只就实处用力，量力而取，为目下所能为者而已。","Y3.T":"六三，来之坎坎，险且枕，入于坎窞，勿用。","Y3.N":"来者，自外入内；之者，自内出外。六三居下坎之上，前险将终，后险复起，进亦有险，退亦有险。“来之坎坎”，言来亦坎、去亦坎，两端俱塞。处此者，唯当偃息伏枕，静以待之，不宜有所举动；一有作为，则陷溺益深，亦“入于坎窞”矣。","Y3.X":"象曰：来之坎坎，终无功也。","Y3.XN":"“来之坎坎”之时，最忌躁急求生。然六三以阴居阳，位既不中，体亦不正，其势必不能安，必求速出于险，故终无成功之望。","Y4.T":"六四，樽酒，簋贰，用缶，纳约自牖，终无咎。","Y4.N":"樽酒者，一樽之酒。簋为盛黍稷之器，即今之饭器；其形圆者曰簋，方者曰簠。缶则瓦器之质朴无饰者。贰者，副也。“樽酒，簋贰，用缶”，谓置酒一樽，副以饭一簋，而承之者皆用瓦。此古代燕享之礼也。燕享之礼，仪节最为繁缛，排场最为讲求；今乃一酒一饭、瓦器盛之，简朴至于极处。\n“纳约”者，进结于君上之谓。牖，窗也。古者居室，户在东而牖在西，牖为室中受光之一处，亦即其明处。人之识见，亦各有其如牖之明处。欲使人悟难悟之理，当就其明处引之；若从其暗处强说，终不可入。昔赵太后不欲以爱子长安君质于齐，谏者尽不入，触龙一言而解。触龙非有异术，特因太后所念在长安君之久富贵，遂以质齐正所以久富贵者进说。其所攻者，太后之明处也，故言易入而效立见。“纳约自牖”，正谓与人缔交、使人见信，当自其识见之明处措意。\n六四取此象，所论者君臣之际也。以六四与君相近，职居辅弼，其地易惧，时复在险，故宜如燕享之只用“樽酒簋贰用缶”，一以质实无文自处；而以“纳约自牖”之道，求君上之谅察与信倚。如是，终得无咎。","Y4.X":"象曰：樽酒簋贰，刚柔际也。","Y4.XN":"际者，交接之谓。“刚柔际”指九五与六四而言，一刚一柔，相交相接。九五与六四之关系，就爻位说是上下相与，就人伦说即君臣相与。“樽酒簋贰”，乃六四爻辞之省文。《小象》之意，谓爻辞所陈种种，总归刚柔交际、君臣相与一事。","Y5.T":"九五，坎不盈，祗既平，无咎。","Y5.N":"“坎不盈”，谓水以常流之故，不至满盈。祗者，抵也、适也。“祗既平，无咎”，言抵于既平，然后可以无咎。九五阳刚而居中，得刚中之美，故能守其流而不盈之常；虽险未全出，而咎终可免。","Y5.X":"象曰：坎不盈，中未大也。","Y5.XN":"九二、九五同得中位，同禀阳刚，而所遭之势不同：二曰“坎有险”，五曰“坎不盈”。言险，见险之实；言不盈，示出险之途。盖出险之机，全系于不满；所谓不盈，正谓未充然而大也。五以阳刚处尊，位高势盛，然而未尝自满；不自满，故水流之态得以长久。","Y6.T":"上六，系用徽纆，置于丛棘三岁不得，凶。","Y6.N":"系者，缚也。徽与纆皆缚囚之绳：合三股为徽，合两股为纆。丛棘者，拘系罪人之所，实即圜土之狱；于四周墙头密置荆棘，使不得越，故有丛棘之名。“系用徽纆，置于丛棘”，缚之以绳而投之狱中。“三岁不得”，按《周礼·司圜》收教罢民之法，罪之上者三年而舍，其怙恶不悛、擅出圜土者则杀；是囚满三年犹不见释，终且就戮，其为凶可知。三岁者，言其久，非必实计三年。上六何以致此极凶？盖其质本阴柔，而位在重险之尽，沦溺已深，断无自脱之理。","Y6.X":"象曰：上六失道凶三岁也。","Y6.XN":"凶之所自生，溯其本则曰失道。所谓失道，非他，阴柔而据险之终，时与位皆不足恃而已。","Z":"合全卦观之，其立义有三：一者险之为险，通乎万事；二者处险行险，有其常则；三者六爻各系，随位而异其方。\n险之取象，起于阳之受困：一阳见掩于二阴，左右皆阴，包之挟之，阳失所据，是以为险。循此而推，高者天有不可阶之阻，厚者地有山川丘陵之阻，杂然者人世有机阱风波之阻。险之害人，固其常也；然偶亦可供人驱使，转而为我之利。至此，险遂不复为空名，而可条陈、可剖析矣。\n卦辞以水之流而不盈设象，其中寓有处险者所可循之则。身临险地，当如水之不顾而前，即卦辞所谓“有孚”、“维心亨”者是已。身既在险，心不可随而俱溺。古人有言，“哀莫大于心死”；心不死，则出险终有其期。水在坎中，未尝不倒行而就下；人之困于险者亦然：持正不移，就其分所得为者为之，而纤毫冀幸之心不存。\n通观六爻，吉之一字未尝一见，险中自处之难、脱险之不易，概可知矣。初、上两端，处二、五两阳之外，隔绝而无援，凶居其最，几于无可出之望。二仅仅小得，五仅仅不盈，处之得宜，出险或尚可期。若三若四，其境在初、上与二、五之中：三则以能俟为贵，四则以质实而谨为贵。如此，乃可无咎。"}},"30":{"id":"30","cnNum":"三〇","name":"离","pinyin":"lí","fullName":"离为火","shortFullName":"火火离","upper":"离","lower":"离","upperNature":"火","lowerNature":"火","lines":[1,0,1,1,0,1],"yaoLabels":["初九","六二","九三","九四","六五","上九"],"blocks":{"P":"《序卦传》以陷训坎，谓既陷于险，必有所依而后出，故离承其后。《说卦传》则以丽训离。离之所以为离，在其为附丽，非今语离散之谓，亦非华美之称。险中无依则难自脱，必附于可附者而后安，此坎后所以次离也。就卦画观之，上下二体并是阳，而一阴介乎其间，附丽之状昭然。二与五皆阴，阴虚而能受，明所自出，故离为明。离又取象于火：火之形外虚，不能自生于无，必托于薪而后有光。","G":"离，利贞，亨，畜牝牛，吉。","G.N":"离训为丽，其义即附丽。今人语汇中，离与合相对，恰在附丽的反面，古人何以反以丽释离？此关涉古人用字之例：一字常兼赅正反两训，“乱”可作“治”用即是其证，离之训丽亦同此例。明乎此，则知以丽训离非出于误，实古义之存。\n天下之物，未有不相依而立者。山川动植，人事酬酢，彼此之间总有一种相附相丽的关系在。此理不待远求，即一身之所处而可见。以人而言，生于世间便不能无所依凭：立身须有凭藉，治业须有专攻，用心须有蕲向，立志须有奔赴——凡此皆人之所丽。所丽既得，能否由此而亨，先看所依者正与不正，其次则看自身修为如何。所依不正，虽劳而少功；所依既正而己不能顺应，亦终扞格而难合。卦辞教人以“畜牝牛”：牛性本顺，牝牛则顺之至者。盖谓所依既择定其正，尚须养就其顺，如牝牛然。此种品格断非旦夕可致，必经积久砥砺；辞下一“畜”字，正取畜养之义，养则日久月深，非一朝夕之功，所畜者非他，即此柔顺之德而已。","T":"彖曰：离，丽也。日月丽乎天，百谷草木丽乎土。重明以丽乎正，乃化成天下，柔丽乎中正，故亨，是以畜牝牛吉也。","T.N":"“离，丽也。日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下”，数语为卦名作释。离之所以名，取附丽之义；而附丽之状遍于天地间：日月光悬于空而运行不穷，草木根著于地而萌生长养，皆人所共见之丽。卦名所标，即此物象。至“重明以丽乎正”一句，则就卦之两体立说。明德为离所专主，而此卦上体下体并是离，两明相叠，重明之名由是而立。“丽乎正”者，丽于正也。正何所指？二与五是已，而尤以六二为主，以其阴爻处中、位复得正，成卦之主在焉。推之事理，所依者为何物可不必问，要必归于正：所亲为正人，所营为正事，所接为正物，所循为正道。\n“柔丽乎中正，故亨，是以畜牝牛吉”，则释卦辞者也。卦辞许亨、许畜牝牛吉，其据在于卦具柔附于正之象。柔者，六二六五两阴是；中正者，二五两位是。就五而言，阴居阳位，中得而正未得，彖所谓“柔丽乎中”者此也；就二而言，阴居阴位，中与正兼，彖所谓“柔丽乎中正”者此也。彖传统言“柔丽乎中正”，二爻兼摄其中。唯所丽者中正，故亨；唯以柔而丽中正，故畜牝牛吉。一句而双答：所依在中正，是以通；能依者为柔，其顺如牝牛，是以吉。","X":"象曰：明两作，离。大人以继明照于四方。","X.N":"作者，兴起之义。“明两作”，谓一明既出，一明复出，起而又起，前后相续而不间断。大人取此象以施于治道，于是“继明照于四方”。所谓大人，自道德学问言则圣贤，自位势言则天子诸侯。继者，续而不绝之谓。前王所立之明德，后嗣当世世承之、日以光大，使光照遍及海内。","Y1.T":"初九，履错然，敬之无咎。","Y1.N":"离之下体三爻，取一日之景为喻：初为晨光初吐，二为日正亭午，三为日已过午。履者，践也、藉也。足迹所践，纷错而漫无端绪，此即所谓错然。晨起而“履错然”，正是一日经营之始。始之系于终者甚大——事之成败，其根往往已于发端时伏下。当此之际，所贵在敬慎；敬慎则咎可免，慢易则咎必至。初九处下体，如日方出；且其体既刚，其位亦刚，两刚相叠，求进之心最锐，履之所以错也。然其以刚处明体，明则能察，亦非全无审慎之力；果能敬以自持，咎可无也。","Y1.X":"象曰：履错之敬，以辟咎也。","Y1.XN":"履已错然，其势欲动，而终以敬慎自抑、未敢轻发者，正为避咎而然。初九之质有两面：刚而又刚，居下则思奋而上趋；刚而居明，则又能自察而不敢冒进。","Y2.T":"六二，黄离，元吉。","Y2.N":"五色各有方位，黄居其中，故为中色；古人品第众色，亦以此为最贵最吉。六二以阴爻处阴位，位正；又居下体之中。离卦之主爻即在此。彖传“柔丽乎中正”与“畜牝牛吉”两语，所指正是此爻。通六爻而较之，其德纯、其位当、其时宜，无所欠缺，可谓尽善。爻辞所以许以“元吉”，又以中色为喻而称“黄离”，其故在此。坤六五言“黄裳元吉”，取义与此相类。","Y2.X":"象曰：黄离元吉，得中道也。","Y2.XN":"黄者中色。爻辞拈一“黄”字状六二，所着眼处正在其居中也。六二固是既中且正，然二者相较，中为尤要；中既举，正则不待言而自寓。","Y3.T":"九三，日昃之离，不鼓缶而歌，则大耋之嗟，凶。","Y3.N":"下体三爻配一日之早晚：初如朝日，二如亭午，三则日昃矣。昃者，日体西倾、天色向暮之候。以人生况之，便如年入衰境，芳华已谢，去日苦多。九三居下体之尽，光明将穷，处境本已不佳。而其所以更不佳者，在以刚爻处刚位，越乎中道而无中德——中德既亏，则衰朽与死亡一端便难善处。于是方寸乱而哀乐失其节：“不鼓缶而歌，则大耋之嗟。”缶，瓦器，古人叩之以节歌而取乐；耋，指年迈之人；嗟，叹也。晚岁所宜，在不以迟暮自伤，亦不以旷达自喜。九三则反是：非于不当乐之时而歌，即于不当哀之时而叹。凶之所以至也。","Y3.X":"象曰：日昃之离，何可久也。","Y3.XN":"日之倾、人之老，皆理数之自然。倾则向落，老则向尽，岂能久驻？惟明者知其如此，故不以生为可欣，不以死为可戚，歌嗟两忘，一任其自然而已。","Y4.T":"九四，突如其来如，焚如，死如，弃如。","Y4.N":"九四以阳处上体之初，位既不中，又复不当，明过而刚过。刚盛之势，如炎火猝然腾起，来者不及措手；燥烈之焰，如物在炉中，销铄无余。爻辞所以有死如、弃如之象。祸既至于死亡捐弃，其凶无须更论。","Y4.X":"象曰：突如其来如，无所容也。","Y4.XN":"九四之“突如其来如”，刚暴而昏，终致焚、死、弃三者并至，为世所共弃。然推其本，非世人弃之，乃其自燔自烁，祸由己作也。","Y5.T":"六五，出涕沱若，戚嗟若，吉。","Y5.N":"坎与离皆以得中为贵。离之六二、六五并处中位，故同归于吉。然二之辞安而繇元吉，五之辞危而仅得吉，分别只在位之当否：六二阴居阴，处中而位正；六五阴居阳，处中而位不当。位不当，是以有危。顾六五究竟是柔爻居中，柔能调剂离体之阳燥，故能处危而自知其危，当盛而预忧其盛。其惧之切，至于涕泗滂沱；其忧之深，至于嗟叹不已。吉即由此而得。","Y5.X":"象曰：六五之吉，离王公也。","Y5.XN":"六五之吉，又有一义：其所附丽者，乃王公在上之正位。位既尊，复能烛于事理，知所忧、知所惧，此其所以吉也。","Y6.T":"上九，王用出征，有嘉折首，获匪其丑，无咎。","Y6.N":"卦之上位，上九当之，其体则阳。由四、五相承而下，至此而离道告终；刚健与明智，亦俱造其极限。惟其刚明至此，乃能任察奸慝、行威罚之事。王使之出征，以讨不义。于所讨之地，必有权衡：“有嘉折首，获匪其丑。”首谓元凶渠帅，丑谓胁从之众。诛止其人，而附和者不问、不伤。如此，可以无咎。","Y6.X":"象曰：王用出征，以正邦也。","Y6.XN":"王者举兵，志在正邦；而邦之正，实自正己始。故其师多耀威而不交兵，必不得已而后战；战则诛其倡乱者一人而止，断不使无辜受戮。","Z":"离卦所论，是附丽——即人处于世间彼此相依的那种关系，以及处此关系的方法。卦爻之象所寄寓的义理，颇为繁富而深切。\n坎、离二卦，同以得中为贵，而其所以为贵者不尽同。坎为阴险之卦，阴柔易溺，故必有刚以振之；坎又为水，水趋下，得刚在中则不陷溺，是以坎之彖称“维心亨，乃以刚中”——中与刚并重也。离则阳燥之卦，阳亢易炎，故必有柔以和之；离又为火，火炎上，得顺在中则不躁突，是以离之彖称“柔丽乎中正”、“畜牝牛吉”——中、柔、正三者并重也。然离之贵柔，意在以柔济刚，使刚柔相调；与老聃所倡贵柔、以柔胜刚者，旨趣迥别，未可混为一谈。\n离之重中，尤过于坎。六二、六五各据上下两体之中，是以皆吉。而柔、中、正三者兼至者为最上：六五柔而得中，惜其位不当，故止于吉；六二柔而得中，位复当而德复正，故进于元吉。六二为成卦之主，处离之时，众美咸萃于一身，“柔丽乎中正”，遂膺“黄离”至美至善之目。卦辞“利贞亨，畜牝牛吉”之意，盖已涵蓄于此爻。\n若九四，则一卦之中最劣者。其刚躁而不中不正，情性类于烈火猝燃，既不见容于天下，天下亦无有容之者，“焚如，死如，弃如”，势所必至。此爻从反面揭出柔、中、正三者处离之要，经传作者于此所寄之理，哲学意味甚深，尤当措意。至于初九之戒慎于始，九三之不欣生不戚死，上九“有嘉折首，获匪其丑”所存古军礼之遗意，皆离卦多层次思想脉络中不可略去的一环。"}},"31":{"id":"31","cnNum":"三一","name":"咸","pinyin":"xián","fullName":"泽山咸","shortFullName":"泽山咸","upper":"兑","lower":"艮","upperNature":"泽","lowerNature":"山","lines":[0,0,1,1,1,0],"yaoLabels":["初六","六二","九三","九四","九五","上六"],"blocks":{"P":"《序卦传》于下经之前，先举“有天地然后有万物”一语，以为万物立本；自此以下，一气贯注：万物既具，乃分男女；男女既分，乃成夫妇；夫妇既成，而父子相续；父子既定，而君臣有位；君臣既辨，而上下有别；上下既别，而礼义有所施设。依此推衍，上经三十卦至离而止，咸以下三十四卦别为下经。是以离卦之终不为咸卦之始，下经自开生面，非续前绪。读下经者，当别作一局观之，未可以前绪之馀波相待。\n如此，则六十四卦似有两重起头。初重为乾与坤，古人称之易之缊、易之门，卦画之众皆自此流出。次重即咸与恒，其位视初重为降，宜包孕于初重所展之全程中。天地、万物二喻，属之初重；男女、夫妇以及父子、君臣、上下、礼义诸喻，则属之次重。乾坤取天地之象，众卦取万物之象，此初重之喻也；男女夫妇取咸恒之象，父子君臣以下取诸卦之象，则次重之喻也。孔子取譬，本欲明乾坤为全《易》之冠、咸恒为下经之冠，其据确然，如天经地义之不可易；而不期然流露其朴素的宇宙观与历史观，其事虽朴，而大体不误。\n咸与感音义相同。上古书感作咸，心旁为后起。卦名取义，在彼此交相感应。感应之理，随处可验，而最易晓、最习见者，莫过于男女夫妇；夫妇又为人伦之始，文明社会诸般现象皆自此发端。取夫妇以明感应，于义为最惬。\n卦体上兑下艮：上为少女，下为少男，两少相感，其情尤笃。自其德而观：艮以止为德，体段笃厚，所止者朴诚；兑以说为德。男持朴诚以相接，女悦怿而顺从，情亲既定，夫妇之道成。\n乾坤居首，取象天地，天地自是两个物事；咸恒居下经之首，皆取象夫妇，而夫妇只是一事。故言乾坤，可分阴阳两仪；言咸恒，则合为一伦。咸不为夫、恒不为妇，此其与乾坤之例所以分道。下经之始，取象已由分而合，由物而伦，亦可见自兹以往，《易》渐即于人事。","G":"咸，亨利贞，取女吉。","G.N":"咸者，感也，而不止于男女之相慕。举凡天地间之物类，人伦中之尊卑，皆有其感与不感。君之于臣，上之于下，父之于子，亲故之相与，莫不各有感应存乎其间。感通则彼此和顺，事无难处者。顾感必有所利，所利惟在正：以正而感，斯亨；不以正而感，则亨者亦窒。“取女吉”云者，言娶妇若此而后得吉也。","T":"彖曰：咸，感也。柔上而刚下。二气感应以相与。止而说，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平。观其所感，而天地万物之情可见矣。","T.N":"“咸，感也”，一语道破，孔子的意思即是如此。考《周易》成书之世，感字尚未造出，仅有咸字；逮孔子时，咸旁始分化出从心之感。\n“柔上而刚下”者何谓？上六一柔居上体，九三一刚居下体，柔者在上，刚者在下，阴阳于是有交感之机。咸卦得名，正由此一处。然上体为兑，二刚一柔，何以置两刚不言而独举其柔？下体为艮，二柔一刚，何以置两柔不言而独举其刚？其故在于卦变，而卦变之迹恰落在这一个柔爻与一个刚爻上。上体之兑本为三画之乾，坤以一柔施之，消去其居上之刚，兑形乃成；下体之艮本为三画之坤，乾以一刚施之，消去其居上之柔，艮形乃成。一柔一刚，来往于两体之间，泽山之所以为咸，枢纽即在此。全《易》具卦变之义者十八卦，其上下二体皆以一阴卦配一阳卦；而《彖传》实取卦变以立说者仅六卦，咸居其一。其详可参本书贲卦《彖传》之解。\n“二气感应以相与”，兼内外而言。下体为山，上体为泽，两气自相贯通；六位内外，又爻爻皆有匹应。内既有通，外复有应，故合称二气相应。阴阳二气一升一降，交乎中而协于一，是之谓“相与”。\n“止而说，男下女”，则就二体之德言之。内体守止，外体致悦；两体相承，其合也本于朴诚，非徒貌饰。艮为少男而在下体，兑为少女而在上体，男先屈于女，故曰“男下女”。凡此，皆所以申明二气感应之事。\n“是以亨利贞，取女吉也”，乃结上二义：柔上刚下而二气感应相与，一也；止而说、男下女，二也。二者具，而亨利贞、取女吉之占随之。\n“天地感而万物化生，圣人感人心而天下和平。观其所感，而天地万物之情可见矣。”此与坎卦《彖传》同类，皆孔子释卦辞已毕，辍而复申己意。其推广感应，遍及自然与人事，而目光所注，终在人间。盖《易》之为书，切于世用，虽好称天道，而其归趣实在民。此处所谓圣人，非寻常人，乃指有位之王侯。王者以己之感动天下之心，则人心安和，四境无事，而民帖然听命。此是孔子当日之政治见解，亦为彼时历史条件所限定。至于治者能否真感被治者之心，须分别观之；孔子之意，殆谓在上者不当不尔，亦非必不可尔。天地万物之情本无从知，孔子则以观其所感为知此情之途径。\n《彖传》之中，标“天地之心”者，独复卦一见；标“天地万物之情”者，于咸而外尚有恒、萃。取心者只就天地立说，取情者则兼摄万类；心止一见，情乃屡出。大抵心之所指，落在阴阳迭为消长、生生不穷这一层自然之序上；情之所指，则是此序在外的几般显现，所见者非一。","X":"象曰：山上有泽，咸。君子以虚受人。","X.N":"泽居山巅，二物相衔，其气象自相通。君子玩此，悟受人之道在于虚。虚者，空其衷而无所主：宽以容众，平以持己，不豫设成见于先，人于是乐以其情相告。","Y1.T":"初六，咸其拇。","Y1.N":"拇者，足之大指也。初六处下体之下，所感尚浅，取此为象。指虽微动，而足未举，终不足以进。","Y1.X":"象曰：咸其拇，志在外也。","Y1.XN":"此爻与九四为应。所感者四，四居外体，故小象谓之志在外。","Y2.T":"六二，咸其腓，凶，居吉。","Y2.N":"腓者，胫后之肉，俗谓小腿肚。人行则足未举而腓先摇，腓摇而后足随。六二以柔居下体，上应九五，其势正如腓之在人。故其所发，每有轻举妄动、亟求其应之嫌；果尔则凶。然此爻柔顺而中正，苟能安处不动，待九五之下求，则吉可必。","Y2.X":"象曰：虽凶居吉，顺不害也。","Y2.XN":"以才而论，六二得中处正，又上应九五，本无可议。所虑者，当感之时，此爻易先自摇动，往求于五。求应先动，凶所由生；安静自守，吉乃可保。所谓居，非死守不动之谓，特不倡其先、不发其妄耳。不先不妄，即是顺；顺者，循理而行也。循理则吉，违理则凶。","Y3.T":"九三，咸其股，执其随，往吝。","Y3.N":"股居身下足上，全无自主之权，动止一随乎下：足举则俱举，足驻则俱驻。九三在下体之终，正与股之位相当。“执其随”云者，谓其执守随之之见而不移。此爻以刚处止体之极，按理当静而不当动；乃见初、二两柔竞起，己亦随之俱起。执者，坚执不舍，必欲尾二爻而行也。以此而往，吝必不免。","Y3.X":"象曰：咸其股，亦不处也。志在随人，所执下也。","Y3.XN":"不处，即是不止而动。初、二二爻皆以柔主，感物而先摇。九三本体刚健，却见人动便不自安，亦复随之。刚而失守，进退不能自主，反以随人为志，其行之卑，于此可见。","Y4.T":"九四，贞吉悔亡，憧憧往来，朋从尔思。","Y4.N":"爻辞中并言“贞吉悔亡”者，《周易》凡四卦，皆先系占辞而后系象辞：巽在九五，大壮、未济及此卦并在九四。四之位，以刚处之则失其正；失正者，悔之阶也。今曰贞吉悔亡，谓能守其正，则吉而悔可消。然正与不正，悔与无悔，此处全从感上计较：感而失正则悔生，感而合正则吉且无悔。\n四者，人心之所寓也；其位介乎两体，而往来之象生焉。“憧憧往来”之往来，当依孔子之说解为日月寒暑之往来，即自然界彼感此应、此感彼应之常态。人之处世，接物应人，亦当如是：循自然之理以往来，不以己私参于其间。着一“憧憧”于往来之上，则往来遂为私意所驱，非复循理之往来矣。憧憧者，营营于一身之私利，迫促不安而往而应也。今日厚甲以邀其感，明日惠乙以望其报，往来缠绵，系念不肯放下，惟恐其不我应也。“朋从尔思”者，感人以私，则来者必寡；少数之人缘私而附，遂成尔之朋，究其实则党比而已。\n《系辞传》尝释此爻：天下何所思，何所虑，殊涂而同归，百虑而一致；日月迭代而明生，寒暑更迭而岁成；屈者往而伸者来，屈伸相感而利出；尺蠖屈身以求伸，龙蛇蛰伏以存身；义既精而通于神，乃可施之于事；身既安而物亦利，乃可积之以崇其德；更进于此，非思议所及，能穷神而知化，其德斯为盛矣。孔子之意，正所以矫正“憧憧往来，朋从尔思”之失：自然之感无私而有序，人之感物亦当如是，理当感则感，理当应则应，不杂一毫私虑。","Y4.X":"象曰：贞吉悔亡，未感害也。憧憧往来，未光大也。","Y4.XN":"小象以“未感害也”释之：感而缘私，害乃随之；感而不涉私意，则害无自生。心不系于私而应物，是即守正，正则吉而悔去。若“憧憧往来，朋从尔思”，所感者私也。私则所接必狭，所得不过三五比昵之徒，故断以“未光大”。光者，广也；未光大，谓其感未能推而广之，不能遍及天下之人。","Y5.T":"九五，咸其脢，无悔。","Y5.N":"脢者，夹脊之内，居心之后，为其所背而不睹。九五据尊，本当推赤诚以通天下之心；乃下应六二，上又与上六相比。系于二而悦于上，则所接之地狭，非天子诸侯所宜出此。故曰“咸其脢”：取譬于背，凡己私所向，悉背而去之，转求所不见之众。此为人主所以通天下之志，由之则悔可无。","Y5.X":"象曰：咸其脢，志末也。","Y5.XN":"末，谓上六。爻辞言“咸其脢”，正欲九五舍其私昵，以诚感天下。告之如此，非无因而发：此爻实有其病。其志在末，与上六相邻而比，故心常系于上六，惟此是感而已。","Y6.T":"上六，咸其辅颊舌。","Y6.N":"辅者，牙车，居于口中；颊者，腮也。舌一摇，则牙车与腮俱动，三者相牵而语声出焉。写此爻者止用一口字足矣，乃叠举辅、颊、舌，盖有厌薄之意，正如俗语讥便佞者以摇唇鼓舌。上六以柔主兑，居卦之终，感道至此已尽。其德不足以立诚，遂以唇吻代心意。言浮于实，动而莫应，凶咎之至，可前定矣。","Y6.X":"象曰：咸其辅颊舌，滕口说也。","Y6.XN":"滕、腾二字通用。腾口者，谓奋其唇舌，惟言语是恃。感道至此已穷，无可复施，所存者独一口舌。","Z":"孔子于本卦《序卦传》着语最多，其宇宙观与社会历史观，缘此而得完整吐露。首曰“有天地然后有万物”：天地即自然界，而自然界何自而生、其先更有何物，孔子未尝措一辞。可见在其意中，自然界不由无而为有，亦非造作而成。参以《系辞传》“易有大极，是生两仪”之文，其宇宙观之为唯物论，殆无疑义。\n次言万物既立而有男女，男女既别而有夫妇。此语道破初民演进之一大事实：人群尝历群婚之阶，专偶之制乃随群婚之衰而代兴。孔子又见专偶一家之确立，为初民转入文明之世的枢机。故其续言夫妇既定而父子生，父子既立而君臣出，君臣既辨而上下分，上下既分而礼义有所措置。由夫妇上推国之缘起，是已察知专偶既立而文明之局遂开；且于礼之秘密有所发：礼与阶级之制同时并起，华美外饰之内，包着森严的等差。孔子于《中庸》复谓仁莫先于亲亲，义莫重于尊贤，亲疏有杀，贤不肖有等，而礼由是生，则更认定礼自阶级与血缘两端映出等级制度。孔子固不知唯物史观为何物，然其古史之识所臻之识见，在当时无与比肩；即以今日马克思主义之眼光衡量，犹具相当分量，未可以其时代之古而轻之。\n卦爻辞之所道，每每不合，而咸卦尤著。卦辞系以“取女吉”，因婚娶而立象，其立论举天地人群之大体；六爻则绝口不涉婚娶，亦不言男女，惟各就身之一体取象，所论者狭而近。一宏一纤，其取径判然不同，此亦《易》中一例也。初感于拇，二感于腓，三感于股，五感于脢，上感于辅颊舌，皆举人身之一部位，即以其部位与外物相感。四独异：处上下二体之间，在咸卦中所以象心，而爻辞不言感心。古人谓心司思虑，故取象于心的九四，所论在人接应外物之际如何端正其思。\n咸之取象人身，略同于艮，所异者咸主感而艮主止，感属动而止属静。而咸之诸爻，其吉不逮艮，其凶反过之；至其末爻，两卦判然：咸上六感于辅颊舌而不吉，艮上九敦艮而吉。卦爻辞之相违如此，甚且小有抵牾，此不可不加留意，盖可推知二者殆非一手所作，其成书之层累，于此亦略可窥见。"}},"32":{"id":"32","cnNum":"三二","name":"恒","pinyin":"héng","fullName":"雷风恒","shortFullName":"雷风恒","upper":"震","lower":"巽","upperNature":"雷","lowerNature":"风","lines":[0,1,1,1,0,0],"yaoLabels":["初六","九二","九三","九四","六五","上六"],"blocks":{"P":"《序卦》以恒承咸，谓夫妇相守，其道贵久，久而能常，则恒之名立焉。咸之所言者，夫妇耳；夫妇之道，贵在终身相守而不渝，故咸之后必继以恒。恒者，久常之谓也。恒之名，何以独取于久常耶？咸何以主交感？兑为少女而在上，艮为少男而在下，男先屈于女，相感之义由是生焉。恒之体则反是：震上而巽下，尊者男而卑者女，长女乃居长男之下；且震动于表，巽顺于里，男宜乎外，女宜乎内。古人以为一夫一妇之室，其常经正在于此。故恒不主交感，而主久常。","G":"恒，亨，无咎，利贞，利有攸往。","G.N":"恒之为言，常且久也。道而可久，斯能亨通；亨通则咎无从生。使所守之道本不足以持久，则咎必及之，未有不败者。是故一卦之中，恒含两义：一曰无咎之恒，执常而不迁者是已，惟其正，故无咎，卦辞系以利贞，言当守之而勿易；二曰有咎之恒，运行而不息者是已，惟其不正，故有咎，卦辞系以利有攸往，言当有所作为、有所更革。二者相须而后备，合而观之，恒之道乃全。偏举其一而遗其一，皆非也。","T":"彖曰：恒，久也。刚上而柔下。雷风相与，巽而动，刚柔皆应，恒。恒亨无咎，利贞，久于其道也。天地之道，恒久而不已也。利有攸往，终则有始也。日月得天而能久照，四时变化而能久成，圣人久于其道而天下化成。观其所恒，而天地之情可见矣。","T.N":"彖之释卦名，先立训诂：恒者，久也。继举四事，以明其所以久。其一，刚上而柔下。刚指九四，柔指初六；刚处上体，柔处下体，尊卑之位既定，则名分不乱，序定故能久。此语兼卦变而言：上体之震，其先为坤，乾以一刚施之，易去坤之一柔，震形乃成；下体之巽，其先为乾，坤以一柔施之，易去乾之一刚，巽形乃成。一刚一柔，互易而各安其位，久之义寓焉。其二，雷风相与。此取象于物：雷动则风生，风起则雷应，二者相须，交助成势，是为天地之常道。其三，巽而动。下体巽，其德为顺；上体震，其德为动。顺以动者，循理而行，非妄动也，循理则能久。其四，刚柔皆应。六爻之位，刚柔两两相配，无孤而无与者，配定则和，和则能久。凡此四者，皆含常久之义，卦名之曰恒，由此而立。\n辞云恒亨无咎利贞者，谓亨且无咎之恒，未有不本于正。正而后能久于其道，故申之曰久于其道也。天地之运，惟其不已，是以能久；此天地之所以为天地。至若利有攸往，则又别发一义，系之曰终则有始。盖恒非凝滞不动之谓：假令天地之间有一物焉，凝然而不迁，则其久也，正其所以速亡，故不动不变者不可以言恒。物至其极，未有不穷；穷则不得不变，变而后无不通，通则能久。是故随时迁易，正恒久之术，卦辞之所以言利有攸往也。往者何？终而复始而已；终而复始，即所谓变化。由是观之，恒非徒守其故也，变固寓乎其中；而变之所行，要不出乎恒之外。二者相函，恒道乃备。\n又自天而及于人：日月附丽于天而能久照，四时更迭代迁而能久成，圣人之于天下亦犹是。古所谓明天道、察民故者，正谓此也。天之道者，自然之律；民之故者，人事之迹。二者并举，而所重终在民之故，在社会历史一面。凡此，皆以能变而后久；人群之化，亦惟圣人久于其道——恒而能变，变而不失其恒，守其正而不胶——然后秩然有序之群生，可得而成。\n末章之意，谓就日月之久照、四时之久成、圣人之化成观之，则天地间万类之情无不见；此解前卦已详，不重出。","X":"象曰：雷风恒，君子以立不易方。","X.N":"雷之与风，就其状而观，迅疾而起，俄顷而止，若最无定者。然即其变而索其常，则固有不变者存焉。一岁之内，雷未有不发之时，风未有不作之候；雷起而风从，风至而雷应，二者相依为用，岁岁如此。君子观之，知变者其迹，不变者其理，故立身行事必有所守，不以境迁而改其方。人事之来，酬酢万端，应之者初无定法；而所以自立者，则当卓然有所树，确乎其不可移。","Y1.T":"初六，浚恒，贞凶，无攸利。","Y1.N":"浚者，深之也；贞者，固之也；无攸利者，与利有攸往正相翻。恒道贵久，而久非旦夕之功。凡天下之事，皆有日就月将、铢积寸累之序，非可一朝而致。当恒之时，此意尤不可忘。初六居一卦之初，正宜为长久之计。然其体柔而所居则刚，其质属巽而失于躁急，方有事焉，即求之过深、望之太速，譬如掘井者欲一锹而及泉。故其象为浚恒。如此而固守不舍，凶必及之，无所往而利也。","Y1.X":"象曰：浚恒之凶，始求深也。","Y1.XN":"浚恒之凶，病在始事之初即求之过深。久者非骤致，惟渐乃能积。初六处恒之初，所宜者渐耳，而乃急求深入，欲速则反不达，凶之所由也。","Y2.T":"九二，悔亡。","Y2.N":"爻辞于大壮九二止言贞吉，于解初六止言无咎，于此爻止言悔亡，三者皆直断其效而不复推其故。盖爻象已显，无待繁说也。悔亡者，本有悔而终归于无之辞；悔之所以能无，必有其由。恒之诸爻，位正者为常，九二阳爻而居阴位，其位不正；不正则宜有悔。然《易》道所重莫如中，而恒之一卦尤以中为贵。九二刚而在中，外与六五相应，静则居得其中，动亦不失其中。既能恒久于中，则正自在其中矣。中德足以胜之，悔之所以亡也。","Y2.X":"象曰：九二悔亡，能久中也。","Y2.XN":"九二刚而居中，久守不失，故悔得亡。六五之位亦中，而体则阴柔，是以有夫子之凶。","Y3.T":"九三，不恒其德，或承之羞，贞吝。","Y3.N":"九三以刚居刚，位非不正，然刚过而不中：过则不受制，不中则不能安。志又上比于上六，舍其所守而从人，故有不恒其德之象。不恒其德者，反覆无常之人也。人有常者，善则终善，恶则终恶，犹可豫计；惟反覆者最难：方示我以善，我因与之共事，未几而所守已移，遂分承其辱。遇此辈，惟有引绝而已；固结不舍，羞吝必矣。","Y3.X":"象曰：不恒其德，无所容也。","Y3.XN":"德无常守之人，非特见弃于众，即其内省，亦将茫然无地以自处。","Y4.T":"九四，田无禽。","Y4.N":"田者，猎也；禽者，飞走之总名。田而无禽，谓终岁驰逐于原野，而获无所获，用力虽多，其人则无功之譬也。九四阳爻而处阴位，于位为不正，于体又非中。既失其中，复失其正，则所守者虽能持久，要无成绩之可言。","Y4.X

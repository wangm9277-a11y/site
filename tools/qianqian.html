:"“《彖》曰”照古本当作“《彖传》曰”，后世的刻本删去“传”字，变为“《彖》曰”。卦下之辞即卦辞为“彖”。孔子解释卦辞的文字叫“《彖传》”。孔子为《易经》共作传十篇七种。《彖传》是其中的一种。这十篇传也叫“十翼”。“十翼”依次排列是：一、《上彖》；二、《下彖》；三、《上象》；四、《下象》；五、《上系》；六、《下系》；七、《文言》；八、《说卦》；九、《序卦》；十、《杂卦》。《汉书·艺文志》著录“《易经》12篇”。12篇包括上经下经和“十翼”。可见在汉代，官方的本子，10篇传附在两篇经之后，经与传不混。唯独传古文《易》的费直将《彖传》、《象传》放在每一卦的后面，开始打乱经传不混的格局。至东汉末郑玄和魏人王弼先后给《周易》作注，使用的是费直的古文《易》本子，一方面是继承费氏的作法，一方面也是为了读者学《易》方便易懂，乃进一步将《彖传》、《象传》附在经文卦爻辞之后，使经与传混合到一起。费直授《易》，还只是将《彖传》、《象传》放在一卦卦辞和六爻爻辞讲完之后，郑玄和王弼注《易》则进一步将《彖传》放在卦辞之后，《象传》放在《彖传》之后和每爻爻辞之后。只有乾卦保持费直的原办法，《彖传》、《象传》和《文言》放在全卦经文之后。《彖传》是解释卦辞的。一般说，先解释卦名，然后解释卦辞。解释卦名卦辞的目的是解释一卦之义。解释卦名主要根据卦象、卦德和卦体。有的三者兼取，有的但取其一、二。《彖传》中解释卦名之文字以第一句为最重要。《彖传》解释卦辞的文字，体例也不一律，有的根据卦名的意义展开说卦辞，有的杂取卦象、卦德、卦体说卦辞，释卦辞与释卦名牵混到一起，不易分开。这也不奇怪，因为卦辞与卦名本来就相连相通，意义一致。64卦中乾、坤、坎、离、震、艮、巽、兑8个纯卦除坎卦外，《彖传》都只释卦辞，不释卦名。乾卦《彖传》不解卦名，开始就直接释“乾元亨利贞”之辞。\n“大哉乾元，万物资始，乃统天”。卦辞讲乾而未及乾之取象是天，至孔子作《彖传》以天道发明乾义，才指明乾卦取象天。乾之取象是天，但不就是天。天是指天的形体而言，乾是就天的性质而言。天的性质是健，健而无息是乾，乾就是健。乾与健是一回事，天有健的性质，所以乾可以是天。但是具有健的性质的不止于天，还有别的，所以乾也可以为阳为父为君为马等等。那么为什么乾卦取象天而不取象别的？因为天是具有健的性质之诸事物中最大的一个，举天便什么都概括了。更重要的是，天是万物之所以始，别的具有健之性质的事物则不是。所以孔子作《彖传》用“万物资始，乃统天”来赞誉“乾元”之伟大。“乾元”是什么？“乾元”是一个意思，不是两个意思，是乾之元，不是乾和元。乾之元就是“元亨利贞”的元。说乾之元，不单说元，是为强调是乾之元，不是任何其他事物的元。只有乾之元才有“万物资始，乃统天”的作用。元训始训大，是万物始生的状态，万物资之于它而发生而开始。“乃统天”，虽然只讲了一个元字，但是元字把天地生万物的规律全包括了。天地创生万物，有了春天的发生才有夏天的亨，秋天的利和冬天的贞。这段《彖传》与《序卦传》讲的“有天地然后万物生焉”，意义相通，既是说天地是万物之始，也是说乾坤是《易》之门，是64卦的祖宗。有了乾卦才可能产生其他诸卦。\n“云行雨施，品物流形”。此释卦辞亨字。卦辞“元亨利贞”四字，《彖传》元利贞三字皆见，独亨字不见。“云行雨施，品物流形”两句，就其文义看，为释亨字当属无疑。这个亨不是一般随便什么事物的亨，而是乾之亨。说的是在乾元创生万物之后，万物进入长成养育之时；这时候天道运行，无所不亨通，表现为“云行雨施，品物流形”。“云行雨施”是气之亨，气是万物之质。“品物流形”是形之亨，形是万物之形。万物经由天资生之后，形质皆具，物各分类，可为区别。流即水流之流。流形，自动态看万物之形，万物之形永远处在生生不息的变化中，它们的形既是肯定的，又是否定的。品物即万物。不曰万物曰品物，意在强调物各分类，物各有形。\n“大明终始，六位时成，时乘六龙以御天”。以上几句是讲天之道，这三句由天之道引申到人之道。《彖传》有这样一个特点，它总是先讲易象和天道，而后讲到人事问题。参照天道讲人事，通过人事看天道。天道与人事是一致的，讲过易象与天道之后，必应用到人事上。这三句告诉人们如何将乾之元亨加以应用的问题。“大明终始”，研究乾卦，明白乾道有终始，有元而有贞，无贞亦无以为元；明白乾卦之六爻全是因时而成，随时而顺，时当潜则潜，时当见则见，时当惕则惕，时当跃则跃，时当飞则飞，时当亢则亢。六龙即乾六爻的变化全决定在一个时字上。人们明白了乾之道的这些特点，就要以之“御天”。“御天”，人要驾御乾之道，推行于人事。上文言“统天”，是说乾有“元亨利贞”四德，而一个元字把“元亨利贞”亦即乾之道都统摄都该贯包括了，总之是讲乾之体的问题。此言“御天”，是说乾之用的问题，人应该掌握乾之道以应用到人事上。\n“乾道变化，各正性命，保合太和，乃利贞”。这几句话看上去似只讲“利贞”，实际上虽是讲“利贞”，“元亨”也包括了。因为它讲“乾道变化”如何如何“乃利贞”，“乾道变化”岂不有“元亨”在内。乾道与乾元是一回事。都是讲变化的。就变化之本始说，叫乾元；由元开始，而亨而利而贞，然后开始新的元。乾道所言也是元亨利贞的变化，叫乾道而不称乾元，因为这里强调的不是变化的本始而是整个过程。“变化”一词与今语不同。今语“变化”只是一个词，古代“变化”则有二义。变是事物的渐变，化是由渐变而达于质变。“乾道变化”经过“大哉乾元，万物资始，乃统天”和“云行雨施，品物流形”的元亨阶段，至今已“各正性命，保合太和”，乃实现“利贞”，整个“乾道变化”的过程宣告完成。乾道变化到了利的阶段，万物即将走向成熟，这时每一物在变化中都获得自己特有的性命、存在的价值和应有的位置。万物各有各的性命，各有各的存在价值，各有各的位置，即各得其正。这是利的阶段。性命，是由两个字组成的词，其实是一个东西，它就是决定物之所以为物，人之所以为人的根本性质。世上飞潜动植之所以品类各殊，都因为各自性命不同。《大戴礼记》说：“分于道谓之命，形于一谓之性。”《中庸》说：“天命之谓性”。可见性命是一事而二义，一个东西自两面看，自有不同的意义。道即气化流行，生生不已的乾之道，也就是自然规律。一，一个，一类。从是自然所赋予的角度说，它就叫命，从是决定此一个物、一类物与彼一个物、一类物的差别的角度说，它就叫性。性，是命之性，是自然赋予，不是人为。命，是性之命，是各有差别，非千篇一律。“各正性命”，承认世界的统一性和万物的差异性，相信万事万物的存在是合理的，万事万物间的关系是和谐的。“各正性命”，表明千差万别的品物生长了，定形了，但是尚未充满，尚未成熟，还必须有一个“贞”的阶段。犹如一棵稻，经过夏日的光照雨润，结实了，却未籽粒饱满，需要进一步培养，使凝蓄成熟，达到可以收获的程度，才算完成了全部的生长过程。这就是“贞”。《彖传》释贞为“保合太和”。“保合”是谓词，“太和”是宾词。“太和”是气，气是一种抽象，一种存在。因为它是抽象的，所以人看不见。实际上它就是物质。古人把它想象为一种气，取名“太和”。太和之气也就是天地氤氲之气，阴阳会合之气，亦即冲和之气。所谓“乾道变化，各正性命”，其实质不是别的，正是太和之气的变化，太和之气的“各正性命”。到了“贞”的阶段，需要“保合太和”。保谓常存，合谓常和。“保合太和”，使太和之气常运不息，永远融洽无偏；万物得此气以生以成，至此又保而合之，存而久之，已完满成足，无少欠缺。由《彖传》的这一段话，我们看得出，《周易》的作者的发展观，很重视事物的差异性，强调物质世界的和谐性。\n“首出庶物，万国咸宁”。上文“乾道变化”以下诸句讲天道，讲自然的规律，这两句讲如何法天道并应用到人事上，即用《易》的问题。“乾道变化”至“乃利贞”是讲乾道之利贞，此二句是讲乾道之利贞应用到人事上，是人的利贞问题。既云“首出庶物，万国咸宁”，便知所指是统治阶级，是圣人，是大人物，不是庶民百姓。君临天下国家的天子诸侯须效法乾道之利贞，以使“首出庶物”，以求“万国咸宁”。庶物即万物。在大自然中，万物各正其性命，各有其归宿，乃乾道变化自然而致，不须有也没有什么力量来主宰它们。反映到人事上，圣人效法“各正性命”而“首出庶物”，做天下人的领袖而已，并不主宰天下。制作也是有的，不过顺其自然，不给人们强加什么。此与乾用九爻辞“见群龙无首吉”之义吻合。“见群龙无首”，无自为天下人之首。《彖传》云“首出”，其实还是无首。龙之在潜在见在惕在跃在飞在亢，均依时而定。“首出”不专在飞，潜龙也有“首出”，六爻都有“首出”。此“首出”是因任自然，依时转移的，绝非强出头。所以说，“首出庶物”与“群龙无首”意思一样，也是不自为天下人之首。“保合太和”是“乾道变化，各正性命”的结果，是乾道四德之贞，万物发展到此时，达到完全成熟的状态。太和之气经过长久发展，今已完满成足。社会的情况也是如此，圣人首出庶物而不自为天下人之首，任凭天下万国各得其所，各安其事，则万国自然和谐相安，无侵无争。这里表现了《周易》的一个值得注意的政治观点，即追求社会的和谐与理性的统一。","X.N":"这是《象传》。《象传》有“大象”与“小象”之分。“大象”针对全卦而言，列在《彖传》之后，“小象”解释爻辞，分别列于六爻爻辞之后。“大象”与《彖传》都针对全卦而发，但二者有很大的不同。《彖传》释卦名或举卦象或举卦德或举卦体不定，“大象”则专取卦之上下两象立义，不问卦德与卦体。《彖传》总是由天道而及人事，“大象”则只讲人事。《彖传》所讲的人事是效动趋时，各有所指，“大象”所讲的人事大多为先王、大人、后、君子设计，有的与《彖传》相发明，有的则自立一义，而与《彖传》根本没有关系，完全是孔子对易理的发挥和应用。“大象”的用语十分规范，64卦几乎是一样的格式，前部分指出上下两象及卦名，后部分指示应当做什么和怎样做。这前一部分内容，8个纯卦与其余诸卦不同。上经4个纯卦与下经4个纯卦又不同。上经4个纯卦乾曰“天行”，坤曰“地势”，坎曰“水洊至”，离曰“明两作”，是体在前用在后。下经4个纯卦震曰“洊雷”，艮曰“兼山”，巽曰“随风”，兑曰“丽泽”，是用在前体在后。乾坤二卦与其他六卦还不同。它卦言重，指明两个三画卦重叠成一卦，乾坤二卦不言重，不说重天重地。因为天只有一个，不可重；一个就可以说明问题，不必重，故称天行。地也只有一个，不可重，一个就可以说明问题，不必重，故称地势。乾与坤又有不同，坤卦言“地势坤”，称卦名。乾卦言“天行健”，不称卦名乾而称健。行，道。天行，天道。天道的本质特点是健。健是乾之德，乾就是健，故“大象”以卦德替卦名，而称“天行健”。健是运行不息的意思。天之运行，四时交替，昼夜更迭，岁岁年年无有止息，无有差忒，故云“天行健”。君子效法天道之健，以自强不息。君子与天共一乾德，故能自强，无须外力而自我前行。息是止，不息，即不停止。君子，有德又有位的人，含盖整个统治阶级。“大象”讲君子，天子诸侯大夫士都包括在内。“大象”称先王，指前时开国创典的天子。称后，指诸侯国君。","Y1.XN":"自此以下六节文字是“小象”，“小象”是解释爻辞的。“小象”对爻辞的解释不够充分，不象《文言传》对易理挖掘得那样深刻。这六条“小象”应有“《象》曰”二字，以区别于下面的《文言》。阳释龙，下谓潜。爻辞取象于龙，很是奇特，“小象”恐人不解，释之云“阳在下”，表明爻辞所谓的龙，指的是阳气，阳气尚未升出地面，还潜在地下。《易》卦辞与爻辞无阴阳二字。“小象”在乾初九言“阳在下”，在坤初六言“阴始凝”，第一次提到阴阳二字。阴阳之名既立，动静、健顺、刚柔、奇偶、大小、尊卑、进退、往来等等就显示出来了。","Y2.XN":"见，现。田，土地。施，犹今语之影响。阳气已由地下升到地上，出现在地面上。虽然还没有达到跃或飞的程度，但是阳气已见田，圣人已出世，天下人必然普遍受到它的影响。","Y3.XN":"终日乾之又乾，至夕犹惕，不敢一息稍懈。这是什么意思呢？这就是“反复道”。九三在上下体之中，可以进而上，可以退而下。自上而下曰反，自下而上曰复。反反复复同在一条路上，易道变化无穷，但不是任意变化，变化不过是反复其道而已。表现“反复道”的自然现象莫过于昼夜交替，君子终日乾乾，朝乾夕惕，总在道上反复盘旋而无止息。","Y4.XN":"九四处上下之交，居进退之位。“或跃在渊，”跃而出渊也可，不跃而在渊也可。但是九四应当有为而进，所以“小象”说“进无咎”。爻辞唯恐它不顾时当时不当而冒进，才用“或”字而疑之。","Y5.XN":"“大人”释“龙”字，“造”释“飞”字，“大人造”即“飞龙在天”之义。造即作。九五之大人不同于九二，九二之大人有君德而无君位，九五之大人有君德又有君位。九五之“大人造”，是体乾行健不为小道，而有造于天下，作圣人之所当作。","Y6.XN":"从初九潜龙勿用到九五飞龙在天，一爻胜似一爻，到上九以至于亢，亢即过即盈。不但客观形势亢，主观意识也亢。好过了度，就要变坏了。这就是“有悔”。“有悔”含两层意思，既是客观上要变坏，也是主观上知改悔。","Y7.XN":"在行筮的时候，乾卦六爻如果所得没有七，全是九，由于九是变爻，要变为六，那么整个乾卦将变为坤。是乾却要变坤，变坤却仍是乾，这就叫“用九”。用九，六爻都是九，所以称天德。天德是至纯至粹，毫无瑕疵的德，好得无以复加的德。它是全面的，无匹配的，不像刚柔仁义之类的德那样倚于一偏。因此它不可能为首。犹如动静、阴阳，总是互相转化，分不清谁先谁后。“用九”作为天德，它既是至乾，又将变坤，处在乾坤转变之中，不可为首。人处在这样的时候，切切不可自为人首。若自为人首，人们恰恰不能以之为首；唯其不自为人首，方可实际上为人之首。但是必须是有天德的人，一般的平庸之辈谈不上为首不为首的问题。","W1.N":"自此以至于末，是《文言》。《文言》是“十翼”之一。《文言》只有乾坤两卦有，别的卦没有。这可能因为乾坤两卦是“易”之缊，“易”之门，“易”之根本，其余诸卦皆自乾坤两卦出，乾坤两卦太重要，需要反复加以说明，给学习以下诸卦做出示范，使人们知道《易》应当怎样学。“文言”这两个字是什么意思，刘瓛说：“依文而言其理，故曰文言。”未知是否。总之，《文言》是专门解释乾卦和坤卦的。《文言》里多有“何谓也”、“子曰”等字样，很可能是孔子答弟子问，弟子作的记录，同《论语》的情况近似。虽不是孔子亲笔写，但其思想肯定是属于孔子的，说《文言》是孔子作，也未为不可。\n这一段话是《左传》襄公9年穆姜讲的。穆姜讲此话时，孔子尚未出生。孔子在给弟子讲“乾元亨利贞”时引用了这段话，由弟子记录下来。穆姜讲的话很可能是当时社会上普遍流行的成说，不是她自己的理解。可见从思想理论的角度解释《易经》，早在孔子以前就有了。说明孔子作的《易传》所阐述的思想是《易经》自身固有的，不是孔子的杜撰。不过，孔子《易传》的思想既属于《易经》本身，也属于孔子。\n“元亨利贞”这四个字原来可能是一看就懂，后来随着周初至春秋200多年历史的发展，到了春秋时代就需要解释了。所以才有穆姜讲的这段话，后来穆姜这样的话人们也不懂了，于是又有注疏。元是始、大的意思。一切善的事物的开始，都可以叫做元，所以说元是善之长，善之首。春天是最典型、最易见的“善之长”。万物出生，都在春天开始。亨即通，嘉是美好。嘉之会，嘉美的荟萃。万物在春天开始发生，到了夏天达到旺盛畅茂，一切善的、美的，都荟萃于此时，是为亨。利是收缩、成熟，当秋天时，万物收缩、成熟，应该肃杀了。肃杀是合于义的。“义之和”，是说虽然有肃杀景象，万物却是和谐不乱，各有各的归宿。引申于人事，利是社会稳定之时，人们各安其分，各守其职，各尽其责。贞有正而固的意思。冬天，生机完固，收藏于内，一切善的、美的东西至此宣告完成。就人事说，贞是人们做事取得成功的骨干。具体点说，贞仿佛是一个人有正确的方向，坚定的意志。“君子体仁足以长人”，这以下四句，是把“元亨利贞”进一步应用到君子的修养上，对照地说。天有天的元亨利贞，人有人的元亨利贞。表现自然界的元亨利贞，最明显的是春夏秋冬；表现人的元亨利贞，最大的是仁义礼智。元，表现在君子的修养上就是仁。君子以仁为体，以仁为立身行事的根本。仁是君子修养之首，君子唯其以仁为体，修养以仁为首，才能长人，做人们的首长，统治人们，故云“君子体仁足以长人”。亨，于自然界为夏，于人则合礼。礼号称三百三千，最为繁富，正与万物嘉美会聚相似，故云“嘉会足以合礼”。利，于自然界为秋，于人则为义，故云“利物足以和义”。贞，于自然界为冬，于人则为智。智是人们行事之骨干，唯智者能够坚持正确的方向和坚定的意志，固守不去，故云“贞固足以干事”。“君子行此四德者，故曰乾元亨利贞”这句话是孔子引用过前人成说后，自己做出的结论。意谓君子是行此仁义礼智四德的人，乾道虽然精深莫测，只要行此四德，便叫元亨利贞。从孔子的这个结论我们可以看出，《易经》讲天之道也讲人之故，但归根结底则是讲人之故。\n关于“君子”这个词有必要加以说明。“君子”是历史的概念，有个变化的过程。“君子”最早肯定是个阶级的概念。就象诸侯之子称公子，天子之子称王子一样，君子就是君之子。君之子当然是贵族，是统治阶级。与之相对应的则是小人，劳力者。孔颖达说：“言君子者，谓君临上位，子爱下民，通天子诸侯兼公卿大夫有地者”。也是说君子是统治阶级。但是这只说对了一半。经过历史的发展，君子除有阶级的含义以外，又有了区分道德品质的意义。君子是道德高尚的人，小人是道德低劣的人。《论语》“君子固穷，小人穷斯滥矣”一语就是证明。如果君子只是统治阶级，那么“君子固穷”一句便不可理解，统治阶级怎么会穷呢？","W2.N":"自此以下全面、充分、反复地讲解君子观乾卦，如何应用到自己的道德修养上，亦即具体地讲解怎样学《易》的问题。乾卦和坤卦《文言》这样做，实际上是给学习以后62卦做出一个榜样，告诉学《易》者知道《易》卦爻辞看来文字简约，里边包含的内容却十分丰富。对它们只从字面作简单了解是学不好《易》的。从乾《文言》反复讲解君子修养问题看，《周易》天之道人之故都讲，然而它的最终的思考目标还是人之故。自此以下的文字多采取弟子问孔子答的方式进行讲解，眉目清楚，大体上说，并不十分难理解。“初九潜龙勿用，何谓也”这一段文字解释“勿用”的意义，全说人事而不及天道。“勿用”是什么意思？“勿用”是隐。隐不是简单的事情，一般人做不到，唯有有龙德的人能隐。在孔子的心目中有龙德的人是君子大人乃至圣人一类，却也不排除普通的人可能具有龙德的修养。隐这个词的内涵极易令人发生误解，以为是不为时所用，所以孔子加以深入的说明，用三个“不”字，两个“无”字，两个“则”字，指出隐不是为时所弃不得为，而是知时不济不可为而不为。此处“遯”字极关键，隐就体现在遯上。“不易乎世”，是遯的第一层，仅是初步。不过这一步也很重要，只有能够做到自己的意志、主张不为世俗所移易，邦无道，至死不变己志，不与之同流合污，方能实现“不成乎名”。“不成乎名”才是真遯。做到“不成乎名”这一步，就象《庄子·逍遥游》说宋荣子那样，“举世誉之而不加劝，举世非之而不加沮”，非誉不在物而在我，达到了真正隐遯的境界。隐遯本身也可以成名，然而“不成乎名”，是因为这个隐遯并非为了洁身自好，故作清高。遯世已经不易，“遯世无闷”当然更难。遯世必然孤立于世而不为人知，这在常人本是极苦恼的事，然而有龙德之人却能自信不悔，行之若素。“不见是而无闷”，是又进乎一层，遯世如龙之蛰伏，犹可知其为龙，现在“不见是”，连它是不是龙也成为问题，可能是鱼是蛇亦未可知。在此情况下依然“无闷”，已经达到忘我的程度，似乎与道家自然无为，抱朴返真的思想合流了。但是从下面“乐则行之，忧则违之”两句可知，绝对不是道家的东西。乐，我心以为乐；忧，我心以为忧。行谓为之，违谓不为。乐行忧违，是说天下有道我就见而有所为，天下无道我就隐而无所为，绝不枉道以徇人。这坚定的意志“确乎其不可拔”，任凭什么力量也不能动摇。这是入世的思想，与道家的出世主义截然不同。","W3.N":"九二与初九虽都是龙德，但是由于时不同，二者在道德修养与道德实践上也不同。总的说来，九二已离隐但未至于跃，是乍见于田的时候。六爻全是龙德，九二特殊之处是它处正中。说“正中”，主要还是中。二是阴位，九是阳爻，阳爻居阴位，本不为正，因为它是中，中在《周易》最为重要，既处中，不正也可谓正，故曰“正中”。九五也处中，九五是君位，故有君德又有君位。九二处中而非居君位，故有君德而无君位。庸，常。“庸言之信，庸言之谨”，讲话经常信实，行为经常谨慎。闲是马圈的栅栏，使马不得跑掉，也使野兽不得进入。“闲邪存其诚”，防范邪恶不使侵于心，保持内心之诚。《周易》极重视这个诚字，认为它是一切修养的根本和出发点，倘若心无诚，就别无可言了。因为能够防闲邪恶而存其诚，所以才能言信行谨。《周易》阳为实，阴为虚。实则诚，故乾九二言诚。虚则生敬，故坤九二言敬。诚敬二字字不同，义却相去无远。诚则敬，敬必诚。言诚，重在诚但也含敬义；言敬，重在敬而诚义亦在其中。伐，矜夸。为天下国家做出好事，做出大贡献，却不夸其德，不有其功。德博，德施普，其德影响广大。化，教化，改变。“德博而化”是说化物。化物与上文的“善世”同义，“善世”即“兼善天下”之意。化物得之于自化，善其身方能善天下。能言信行谨，闲邪存诚，善世不伐，才能“德博而化”。“君德也”一句有两层意思，一是说以上自化化物，善身善世之德，是大人的事情，一般人做不到；二是说九二自身就是有君德的大人。大人非另有所指；九二虽无君位但有君德。","W4.N":"九三这一爻处在下体之上，君德早已表现出来了。现在在三这个危地，应当干什么呢？应当终日乾乾不懈，不间断地奋斗。奋斗什么呢？孔子说，就是进德修业。进德与修业是同一件事情的两个方面，不是两件事情。不能理解为进德是讲品德，修业是讲业务。进德是德，修业也是德。进德是指内心的修养，修业是内心的修养如何表现于外的问题。“忠信所以进德也”，进德的问题根本一点是忠信，做到忠信方能进德。进德，自我内心的进取精神，一种理想的追求，做到一天比一天进步，一天比一天振作，天天有所前进。天天进步需要以忠信为前提。忠信其实就是实，就是真。天天进步，必须是存在的，不是停留在口头上，必须是真实的，不是假的。就像种谷，谷籽入土后必然天天生长直至萌发，但是前提是一定要有谷籽，若无谷籽或谷籽是假的，生长萌发便无从谈起。这是讲自我内心的进德问题。表现在外面又当怎样呢？应当“居业”。居，存而不失，永远保持。业，也是德，是表现在外面可见的德。合起来说，“居业”，常常如此，不稍间断，也就是今日如此，明日亦如此之意。“居业”的途径是“修辞立其诚”。修辞即言语。人的外部表现是多方面的，为什么单举“修辞”作代表？因为言语最能直接表达思想却往往不为人们重视，人们最容易轻视言语，以为言语是随意之事，而不计较。“修辞立其诚”，诚亦即前面讲的忠信。讲话必须一字是一字，一句是一句，容不得半点虚假，嘴上讲的全是心中有的，心口如一，这就是“立其诚”。前云“修业”，后云“居业”，有何不同？二者是一回事。业指德的外在表现。言“修业”，重在强调德之进；言“居业”，重在强调德之守。“进德”，修养要日新又日新，天天有所进步；进步不是盲目的，须有一定的奋斗目标，然后奔着目标去做，这就叫“知至至之”。“知至”，心中知道自己的奋斗目标是什么。“至之”，为达到目标而努力。“知至至之”一句的重点是“知”，“知”即自觉精神。人在未做之前先有一个自觉精神，就距达到目标差不远了，所以说，“可与几也”。“居业”，亦即守业。内心有忠信的人方能“修辞立其诚”；“修辞立其诚”的问题是如何坚持不变，今日如此，明日也如此，这就叫“知终终之”。“知终”，知道终身当如此；“终之”，既知终身当如此，便实际上做到终身如此。“知终终之”一句的重点是行，行即力行、行动。人能够坚持终身“修辞立其诚”，便“可与存义”了。“存义”是守义不变，“知终终之”的道理经常存在心里。以上这一段是对“君子终日乾乾夕惕若”的解释。“是故”以下是解释“无咎”的。九三居下卦之上，故曰“居上位”；它又在上卦之下，故曰“在下位”。居上位也能惕，所以不骄；在下位也能惕，所以不忧。“乾乾因其时而惕”，所以能上能下，不骄不忧，虽处危地，也可无咎。","W5.N":"“上”与“进”，释“跃”字。“下”与“退”，释“在渊”。“无常”，“无恒”，释“或”字。“非为邪”，“非离群”，“欲及时”，释为什么无咎。“或跃在渊”，主要是时的问题。时当上当进则上则进，时当下当退则下则退，一切随时而不可必。君子处在乾九四之时该当如此。但是归根结底还是要上要进。因为九四“进德修业欲及时”，所以可上应及时上，可进应及时进，故无咎。","W6.N":"同声相应以下七句，以“圣人作而万物睹”一句为主。“圣人作”释“飞龙在天”，“万物睹”释“利见大人”。上面的“同声相应，同气相求”六句，全是同类相感的意思，说明为什么“圣人作而万物睹”，为什么“利见大人”。九五既有君德又有君位，是六爻里最好的一爻。“圣人作而万物睹”，作，兴起。物，人。圣人兴起，万人都来仰望他，亲近他，接受他的引导、教化。“本乎天者亲上，本乎地者亲下”两句进一步扩大说天地间同类感应的道理，也是为了说明为什么“圣人作而万物睹”，为什么“利见大人”。“本乎天者”指动物，“本乎地者”指植物。因为动物无不头向上而足在下，植物无不本在下而末在上。动物中禽兽的头多是横生的，只有人才是真正头在上的，所以此处实际上还是指人类而言。圣人与万人是同类，圣人出乎其类而兴起，则万人必亲而从之。其道理如同“本乎天者亲上”一样，是“各从其类”。","W7.N":"“六位时成”，亢也是六龙之一位，而云“贵而无位”，这是因为上九在一卦之最高处，可以称“贵”，然而它不是君不是臣，没有政治上的地位，所以说贵而无位。上九居于高处，居高应当有民，然而它无民。无民指下无阴言。贤人指九五以下各爻。贤人是有的，而且就在下面，但是贤人不来辅佐它。高高在上却无位无民无贤人辅佐，处境极为不利，是故“动而有悔”。上九是亢龙，不宜动，然而人不能总不动；一动则有悔，有悔即有过错。有悔是知道有过错，又知道改悔。知道改悔则事情必将好转。","W8.N":"孔子作《文言》反复玩索乾六爻的爻辞，正是《系辞传》所谓“君子居则观其象而玩其辞”的意思。也是给读《易》者做出一个榜样，告诉人们64卦全应如此读。《易经》与《书经》、《诗经》等不同，《书经》、《诗经》之类的书一字一句有比较确定的意义，通过训诂的方法查明字句的含义即可，而《易经》的卦爻辞，词义是不确定的，多方位的，甚至是模糊的，训诂的方法解决不了它的问题，它需要多方面的玩索、揣摩。“潜龙勿用，下也”，谓乾之初爻宜勿用，因为它在乾之下，不可用。","W9.N":"“见龙在田”，龙刚刚露出地面，作用尚未得充分发挥，是因为“时舍”，还未到它充分发挥作用之时。现在它只有君德而无君位。","W10.N":"九三终日乾乾，是干什么呢？是行事。行什么事？行其当行之事，即进德修业，乾乾不息。","W11.N":"“试”释“跃”字。可以跃，可以在渊，归根结底还是要跃。究竟时可跃不可跃，不能由他人决定，必须自己通过试行来决定。","W12.N":"九五有君德又有君位，是天子诸侯之类，是有国有天下的，他们的统治不是一般的统治，是最高最上的统治。","W13.N":"上九居卦之终，龙已至过亢的时候，量变发展到穷的地步。“穷则变，变则通，通则久。”量变至于穷，即将发生质变。所以这时要“有悔”，要改变，否则就有灾，故曰“穷之灾”。","W14.N":"非一身一家一国之治，而是天下之治。此“治”字是治乱的治，与上文“上治”的“治”用法有异。九五只是一爻，故云“上治”，在上以治下。用九而称乾元，很显然包括乾六爻在内，故云“天下治”，天下大治。\n潜龙勿用，阳气潜藏。\n以上七条自人事的角度释爻辞，自此以下七条从时的角度释爻辞。潜龙勿用，是阳气潜藏的时候。\n见龙在田，天下文明。\n“见龙在田”，是天下文明的时候。藏起来是气，显现出来就是光。阴晦阳明，九二阳光显现，有天下文明之象。\n终日乾乾，与时偕行。\n天行昼夜一周为一日，健而无有止息，九三终日乾乾，日乾夕惕，与天行一样没有止息，故曰“与时偕行”。\n或跃在渊，乾道乃革。\n革，变。九四处在下乾已终，上乾开始的时候。九三为下乾，至九四变而为上乾。由下乾而入于上乾，是乾道改革之时，故云“乾道乃革”。此就卦画解释九四取象“或跃在渊”之意。\n飞龙在天，乃位乎天德。\n乾九五既居君位又有君德，可谓位乎天德。倘只有君位而无君德，则只可谓位乎天位而已。\n亢龙有悔，与时偕极。\n九三“与时偕行”则无悔，上六时已至极，与之偕极则穷，故有悔。乾卦上下六爻分别相应。初与四为始，初潜藏，四乃革潜为跃。二与五为中，二文明，五乃天德。三与上为终，三与时偕行，上则偕极。\n乾元用九，乃见天则。\n则，规律。天则，自然的规律。乾元用九，乾之六爻皆变而为坤，表明天道有变而无常。天道变换无过无不及，是有限节的，春夏秋冬总是各有其限地交替，而且冬去春来，终始相因，无所谓首。乾元亨利贞，贞极而复归于元，与天道一致，故云“乾元用九，乃见天则”。","W15.N":"这里把卦辞元亨利贞又解释一番。《文言传》开始时重在论人事，把元亨利贞作为四德分开来讲。至此从人事转为论天道，所以又将元亨利贞合起来说。“乾元”，以元统摄元亨利贞四德。“始亨”与“乾始”两个“始”字与元同义。卦辞所谓“乾元”，是什么意思呢？孔子说“始而亨者也。”乾元不是另外有个东西，它就是气之始而亨。亨即亨通发展。卦辞所谓“利贞”是什么意思呢？“利贞”就是乾元的性情，不是另外有个“利贞”存在。何以知之？从乾元之所能可知。乾元好像春天，春天是生物之始，元也是生物之始。元为生物之始，能以美利利天下，凡天下之物无所不受其利。“不言所利”，乾卦卦辞只言利，不言利什么，因为乾元之所利太广大，天地之间无所不包，若言所利是什么，那就限定了，把无所不利的范围大大缩小了。“利贞者，性情也”，性情是什么？既然是乾元的性情，那么性情就是一个健字。健是乾之本性，表现出来就是情。《易经》将性情二字并言始于此。性与情其实是一回事。性是从静态看，情是从动态看。物生于春，始于元，然后是一个动的过程，动极而至于收敛而归藏，又回到静的状态。贞之后又是元。由贞而元，由静而动，终而复始，生生之道无有穷尽之时。假若但言性而不言情，则意味着止于贞，止于静，贞后无元，静中无动，那也就不是生生不息的健了。","W16.N":"孔子极赞乾元亨利贞的伟大。伟大就伟大在“刚健中正，纯粹精”上。乾卦六爻皆刚，故云刚健。“中正”是全《易经》的要领，孔子在乾卦首先提起。中指二与五而言，二居下体之中，五居上体之中，二与五都是中。都是中却不必都正。阳爻居阳位，阴爻居阴位为正。乾卦九二是阳爻居阴位，不正。九五阳爻居阳位，正。乾卦独九五中正，九二中而不正。每卦都有一爻是一卦之主，乾卦卦主即是九五，“刚健中正”就是指九五言。《易》中384爻，中爻128；128中爻里中而正者64，中而不正者亦64。64个中而正的爻中，唯有乾卦九五刚健中正。乾卦九五是纯乾的中正。别的卦虽可中正但不是纯乾。又，乾德之妙，“刚健中正”也不能尽，孔子因此在“刚健中正”之外更加“纯粹精”三字。两卦不杂曰纯，八个纯卦是。阴阳不杂曰粹，乾坤两卦是。乾坤两卦既纯又粹。其余六纯卦则纯而不粹。精，纯粹之至。“纯粹精”是最为纯粹，纯粹得不能再纯粹。","W17.N":"“六爻发挥”，发挥什么呢？发挥“刚健中正，纯粹精”。“旁通情”，即“六爻发挥”，把乾卦的卦义全面、充分地发挥出来。","W18.N":"九五是乾卦之主，乾卦“刚健中正，纯粹精”之德，九五全具备。九五统摄着六爻之德。六爻之德如潜、见、惕、跃、飞、亢等都是对九五之德即乾之德的发挥。九五处于高位，兼统六爻，其象为飞龙在天，代表着整个乾卦。它“时乘六龙以御天”，以时为准驾御六爻，时当潜则潜，时当见则见，时当惕则惕，时当跃则跃，时当飞则飞，以此反映着天道即自然规律。飞龙在天，必云行雨施，阴阳和畅，膏泽普及，而使天下康平。这也就是乾元之以美利利天下。","W19.N":"自此以下，再次发挥六爻未尽之意。这一段讲初九潜龙勿用。成德，已成之德；行，行动，表现。君子须将自己的德修养完满无缺，然后方可有所行动，有所作为。德与行是一致的，藏在内心未露，就是德，表现为行动，就是行。初九已经成德，既已成德，就可以每天都见诸行动了。然而初九爻辞却曰潜龙勿用，不要有所为，不要有所行，这是因为初九处在潜的时候。潜的意思是隐而未见，隐而未见即行而未成，行而未成亦即德之未成。一句话，初九处于潜时，当隐不当见。","W20.N":"这段话讲九二。九二龙已露出地面之上，是无君位而有君德的大人。所谓君德，应具备学、问、宽、仁这四个条件。“学以聚之”，学要广泛涉猎，多所闻见，把应当学的知识都学到手，不令遗漏。“问以辨之”，学聚之后要多请教知识更渊博的人，以分辨是非精粗。“宽以居之”，宽，度量弘大，优游不迫。学既聚，问既辨，尤须有弘大广阔的度量，以容纳众流。“仁以行之”，学聚问辨又宽以居之，剩下来的问题是如何行动。君子行当以仁为根本。仁是四德之首，也是四德之全，人而能仁，其余的修养都不难做到。九二虽具君德，亦由学问而成，实非天生造就，而功夫全在体仁行仁上。","W21.N":"九三以刚居刚，故曰重刚。一卦之中二与五是中，三不中，故曰“重刚而不中”。九三居三不居五，故曰“上不在天”。又居三不居二，故曰“下不在田”。“上不在天，下不在田”两句实际上还是说九三不中。总而言之，九三处于危惧之地。处境不好，但是九三能因时顺处，乾乾兢惕，故虽危而不至于有咎。","W22.N":"九四以阳居阴，不是重刚，故重字可能是衍文，九四“上不在天，下不在田”与九三同，唯多“中不在人”一句。卦爻以五、上为天道，初、二为地道，天地之间的三、四是人道。三、四虽都属人道，但比较起来，九三近二远五，正是人道，九四近五远二，上近于天而下远于地，不是人所当处之地，故云“中不在人”。全文意思是说，九四虽然“刚而不中”，与九三近似，但是九三位卑近下，向上为难，其危大，其忧深；九四则阳德渐盛，去五亦近，易于上进，问题仅在于或进或退，犹豫不定，其忧较浅。“或跃在渊”的“或”字，是疑的意思。能疑故无咎。疑不是狐疑的疑，此疑乃或进或退不遽加决断，而详加审度之谓。\n夫大人者，与天地合其德，与日月合其明，与四时合其序，与鬼神合其吉凶。先天而天弗违，后天而奉天时。天且弗违，而况于人乎！况于鬼神乎！\n这一段话讲的是九五。九五是乾卦之主，乾之德集中地表现在九五上。九五是既有君德又有君位的大人，大人具有天德，他的修养可谓到家了。他的思想、意识和行为可与天地、日月、四时、鬼神合拍。看来几近不可思议，其实不然。他所以能够如此，是因为他是知天命的人，也是从心所欲不逾矩的人。天命即自然规律。他充分地认识了自然规律，并且能够顺应自然规律，甚至可以说在一定程度上获得了自由。大人之德之明之序之吉凶能与天地、日月、四时、鬼神合拍，并不奇怪，只是由于他刚健中正纯粹精，与自然规律相通。这里的鬼神也不是宗教迷信的鬼神，所指乃造化之迹，亦即自然规律的功用。吉凶不过是成败得失而已。先天后天以下诸句阐释大人必然得到天地鬼神的配合和人的拥护。“先天而天弗违”，做没有先例的事情，干开创性的事业，天道不违背它。其实是说大人有天德，本来就与自然规律相通相合。“后天而奉天时”，做时势决定非做不可的事情，也能合乎自然规律。大人做事，天且不违，人还能违吗？此人不是个体的人，是群体的人，是人类社会，是人类社会的规律。就是说乾九五这样的大人做事既符合自然规律也符合社会规律。","W23.N":"此释上九“亢龙有悔”的亢字。亢龙之亢字是过度的意思。事物总有两方面。进好，进过了度就要走向反面而转为退，有进必有退。存好，存过了度就要走向反面而转为亡，有存必有亡。得好，得过了度就要走向反面而转为丧，有得必有丧。乾于上九，龙而至于亢，是时势之必然，客观之规律，主观上无法避免，但是人在主观上却可能认识这个规律，从而顺应这个规律，使不至于致害。然而做到这一点极难，人处在亢的时候，总是得意忘返。进而知退，存而知亡，得而知丧，能够掌握进退存亡的分寸的，唯有圣人而已，一般人是做不到的。","Z":"《周易》是周代之《易》。它与殷代之叫做《归藏》或《坤乾》的《易》的根本区别是《坤乾》首坤次乾，《周易》颠倒过来，变为首乾次坤。首坤次乾变为首乾次坤，反映社会意识形态的重大变化。殷易《坤乾》以坤为首，反映“殷道亲亲”。《周易》首乾次坤，反映“周道尊尊”。“殷道亲亲”强调血缘关系，在君位继承上重母统，传弟，说明殷代氏族制的影响还重。“周道尊尊”强调政治关系，在君位继承上重父统，传子，说明周代阶级社会已经完全确立。由“亲亲”变为“尊尊”，这重大的历史变革反映在《周易》之中，而《周易》书中最能表达这一变革的是乾卦居首。\n乾卦是64卦之一，由6个卦画组成，它的6个卦画都是阳爻，所谓“阳之纯而健之至也”。乾卦与其余63卦一样，有其自己的性质、特点和意义。但是它又与其他诸卦有所不同，它在64卦中占有特殊的地位。它是“阴阳之根本，万物之祖宗”。其余62卦都是由乾与坤发展而来。所以《系辞传》说“乾坤其《易》之门”，“乾坤其《易》之缊”。《周易》作者认为易法天，易之理是天之道的模拟。他们之所以强调乾坤二卦是其余62卦的祖宗，是《易》之门，《易》之缊，是由他们的宇宙观决定的。他们认为天地是万物之本原，“有天地然后万物生焉，盈天地之间者唯万物”。天地由何而来，他们不再追问。乾坤生诸卦犹天地生万物。这反映作《易》者具有虽然朴素但却正确的宇宙观。\n乾卦和其余63卦一样，由经传两部分组成。经的部分包括卦名、卦画、卦辞、爻辞，传的部分包括《彖传》、《象传》、《文言传》。《象传》分“大象”与“小象”两类。《文言传》独乾坤二卦有，其余各卦没有。乾卦由6个阳爻构成，是纯阳至健，故卦名曰乾。从乾之《彖传》和“大象”看，乾卦取象天。取象天，卦名却曰乾而不曰天，这是因为卦名反映卦之性、卦之义，不反映卦之象。卦名为什么不反映卦之象？因为在一卦之中取象是手段而不是目的，目的在卦之性质，卦的含义。乾卦之乾就是健。健是乾卦的性质和意义所在。整个乾卦要讲的是健。天最能反映健的特点，所以乾卦取天为象。天只是健之象而不是健本身，故乾卦名乾不名天。乾卦的卦辞是“元亨利贞”四字。乾卦卦名的这个乾字的意义就是健，健是运动变化不息的意思。合起来说是乾是健，分开来说是元亨利贞。元亨利贞就是乾，就是健。“元亨利贞”四字是说天的运动变化的。古人讲的天其实是指太阳而言，可以说天就是太阳。《礼记·郊特性》说“大报天而主日。”《汉书·魏相传》说：“天地变化必由阴阳，阴阳之分以日为纪。”太阳的运动(实际上是地球运动，太阳相对地不动)造成寒暑变化，四时交替。因此古人用春夏秋冬四时解元亨利贞。元是春天，亨是夏天，利是秋天，贞是冬天。贞过去又是元，冬过去又是春，这样永不停息地运动变化，把健的特点充分地表达出来了。乾卦卦辞取天为象，而六个爻辞取龙为象。卦辞与爻辞取象不同，是64卦的通例，绝大多数卦都如此。这是由卦与爻特点不同决定的。王弼说“卦者时也，爻者适时之变者也”。卦代表一个时代，只要未出这个时代，都具有这个时代的特点。乾卦的性质是健，只要还属于乾卦，它就具有健的性质，从这个意义上说，卦是相对地不变的，是静态的。六爻自下而上构成一卦，一爻代表一个时代中的不同发展阶段，所以爻是相对地变化的，是动态的。一个是静态的，一个是动态的，取象自然不宜相同。卦是静态的，故取一个象即可；爻是动态的，故往往须取多个象，即便六爻取同一象，这一象也必须能反映动态。乾卦取象天，天能反映出健的特点来。如果六爻还取象天，那就等于说六爻只有健的共性，没有各自的个性。爻而没有个性，便失去了爻存在的意义。所以乾卦取象天而六爻以龙为象。乾卦六爻是讲天地之气和君子之道的。天地之气有升降，君子之道有行藏，龙是人们想象中能潜能飞的动物，故乾六爻取龙为象。龙是阳物，而且是变化多端，神灵不测的阳物，用龙之动来表现乾六爻之动，再恰当不过。天能表现健，龙不但能表现健，还能表现变化中的健。乾之卦爻取象不同，进一步说明卦的性质是固定不变的，乾是健，乾在任何情况下都是健，而爻的取象则灵活多变。乾可以象天，也可以象龙，等等。我们读《易》，不可把“象”看死，不可以为什么一定象什么。\n乾卦的传的部分，首先是《彖传》。《彖传》是解释卦辞的，一般有两部分内容，一部分解释卦名，一部分解释卦辞。唯乾坤坎离震艮巽兑8个纯卦不释卦名，直接解释卦辞。解释卦辞一般都以卦德、卦象、卦位为依据，有的三者兼取，有的但取一、二。乾《彖传》开始言天，即依据乾之卦象作解。接着讲“六位时成，时乘六龙”，说明乾卦六位以九五为最尊，九五处于天位，具备六爻之德，这是根据卦位释卦辞。就其所阐述的内容看，《彖传》总是以卦象与天道杂言，以人事问题作结。这说明卦之取象都是天道方面的问题，而讲天道的目的是为了落实到人事上。乾卦《彖传》正是如此。乾《彖传》含有极丰富的哲学思想，其中“乾道变化，各正性命，保合太和，乃利贞”一段话尤其值得注意。它讲万物怎样由元亨发展到利贞，讲利贞是怎样一种状态。它提出万物经过乾道变化而各正性命，保合太和的观点。关于“性命”这个词语，古人有多种多样的解释，往往烦琐。其实“性命”不过是某物之所以为某物的本质规定性。“各正性命”，是既承认万物的共性又肯定万物各有个性。天地间之每一物无不有它自己生成、存在的理由、价值和意义，它们“各正性命”，自己生，自己长，自己灭，没有一个超自然物主宰它们。可见《周易》的思想与宗教格格不入。万物不但“各正性命”，还能各自“保合太和”，“保合”是动词，保合什么？要保合的是“太和”。“太和”是什么？“太和”是阴阳会合冲和之气。一个收敛成熟之物，是阴阳二气会合冲和的结果。作《易》者强调物成于阴阳二气之会合冲和，说明他们重视万物各自内部的和谐与统一。《周易》讲万物“各正性命”，各得其宜，不相妨害，讲万物“保合太和”，内里是阴阳冲和之气，所描述的是一个充满无限生机和一片和气的和谐、统一的世界。这大概是儒家及整个中国传统文化贵和思想的源头。\n乾卦除《彖传》、《象传》之外，还有《文言传》。《文言传》发挥《彖传》与《象传》未尽之意，多角度多层次地解释乾卦卦辞和六爻爻辞。后面的坤卦同此。卦辞与爻辞，《彖传》与《象传》本来已经讲清楚，孔子还要另作《文言传》，反反复复地再作解释，其用意很可能是让学《易》者懂得易之卦辞与爻辞含义十分灵活，从不同的角度，不同的层面，可以有不同的理解，应仔细玩索，耐心寻绎。如果把易卦爻辞看死，以为只有一种意义别无其他，那就永远懂不了“易”。孔子作《文言传》详析乾卦和坤卦是给学《易》者做出一个示范，让人们对其余62卦都要像《文言传》这样加以理解。"},"02":{"P":"这是64卦的第二卦，卦名曰坤，它由六个阴爻组成。“坤下坤上”是注文，指明六画卦坤，其内卦是三画卦坤，外卦也是三画卦坤。六画卦坤与六画卦乾是相对应的两卦。分开来看，它们有各自的性质和特点，合起来又是无法分离的整体。三画卦乾的性质是健，六画卦乾的性质则是至健；三画卦坤的性质是顺，六画卦坤的性质则是至顺。有健才有所谓顺，有顺才有所谓健。健与顺是互为前提，对立统一的。犹如天地、阴阳、男女之两两不可分割一样。所以古人说乾坤是“阴阳之根本，万物之祖宗”，是“《易》之门”，“《易》之缊”，而不单言乾单言坤。《序卦传》说“有天地然后有万物”，正是把天地生万物与乾坤成诸卦看成是一回事。乾与坤共成诸卦，不可有乾无坤，天与地合生万物，不可有天无地。天与地是同步的，乾与坤也是同步的。天地是万物之首，乾坤是64卦之首。从万物与64卦生成的意义上说，万物之首是天地而不仅是天，64卦之首是乾坤而不仅是乾。《周易》64卦把坤卦次于乾卦之后，是必然的，与周人的宇宙观是符合的。《周易》以乾坤为64卦之首，其深刻的哲学意义，须分两层看。古代之易，《连山》易以艮卦为首，其用意我们虽不甚清楚，但是它既不重视乾与坤，那么它不具有64卦自乾坤生成的思想，则是肯定的；说明夏代不晓得“有天地然后有万物”的道理，而周人即明确提出了万物生于天地的观念。这是第一层意义。第二层，《归藏》易以坤乾为首，反映殷人已经把坤卦与乾卦提到了重要地位，使之居64卦之首；然而它不了解“大哉乾元，万物资始，乃统天”，“至哉坤元，万物资生，乃顺承天”的意义，依然没有天地生万物的意识，没有确立64卦生诸乾坤的观念。《周易》首乾次坤，才真正把“有天地然后有万物”和64卦生诸乾坤，乾坤是“《易》之门”、“《易》之缊”的思想完整、深刻地表达出来。","G.N":"乾卦卦辞“元亨利贞”四字，是用天道变化的四个层次表达乾卦纯刚至健的性质。孔子把这四个字理解为四德。四德具备的人、事、物，具有乾健的性质。用四德表达的这种乾健的性质，带有极大的抽象性和普遍性。坤卦卦辞也讲“元亨利贞”，但在“贞”字前加上“牝马”这样一个定语，对“贞”字加以限制，意谓坤卦之“贞”与乾卦之“贞”不同，是“牝马之贞”，而不是一般的“贞”，于是“贞”的含义由全而偏了，于是“元亨利贞”不是均衡的四德了，而变成了有所偏重的“元亨”与“利牝马之贞”的三层含义，而且重点显然在“利牝马之贞”，不在“元亨”。“君子有攸往”及其以下诸语则是“利牝马之贞”的进一步发挥。所以弄明白“利牝马之贞”一句的含义是理解坤卦卦辞的关键。《黑鞑事略》一书关于北方少数民族畜牧生活的记述对我们理解“利牝马之贞”一语极有启发。它说：“其牡马留十分壮好者，做伊刺马种，外余者多骗了，所以无不强壮也。伊刺者公马也，不曾骗，专管骒马群，不入骗马队。骗马、骒马各自为群队也。又其骡马群每伊刺马一匹管骒马五六十匹。骒马出群，伊刺马必咬踢之使归。它群伊刺马逾越而来，此群伊刺马必咬踢之。”由此可见，牝马要受牡马的约束，顺从牡马的管辖。牡马应刚健启强，牝马应柔弱顺从。牡马有牡马的贞正，牝马有牝马的贞正。坤卦的性质是顺。顺什么？顺乾。坤须顺乾，所以乾卦讲元亨，坤卦也讲元亨。坤须顺乾但不同于乾，坤要突出一个“顺”字，所以乾卦讲“利贞”而坤卦讲“利牝马之贞”。“利牝马之贞”，是说坤以守顺乾之正为利。\n“君子有攸往，先迷后得主”。“君子有攸往”句是总起下文的。君子在有所作为，有所行动的时候，不论做什么都要遵循“先迷后得主”的原则。但这是指处在坤顺地位的人、事、物而言的。处在坤顺地位的人、事、物，要顺从处在乾健地位的人、事、物，坤居乾健之后，绝对不可与乾健争先。坤顺要以乾健为主，而不可自为主。“迷”与“得主”是相对应的两个词语，迷是失主的意思。怎样做才能得主而不至于失主呢？要为后不为先。《老子》之“三宝”有“不敢为天下先”一宝，很可能是受了《周易》“先迷后得主”的影响。但是《老子》一书在更大的程度上是在殷易《归藏》即《坤乾》的影响下写成的，它贵柔，重母性，所以它讲“不敢为天下先”，绝对地提倡为后不为先。这与《周易》“先迷后得主”的思想不同。“先迷后得主”的尚后不尚先是有条件的，是说坤顺不可超越乾健而为先，坤顺要以乾健为先而己居后，要以乾健为主而己为配。仅仅是说坤顺在对待自己与乾健的关系上应该如此。《周易》没有讲一切性质的人、事、物在一切的情况下都不为先。\n“利西南得朋，东北丧朋，安贞吉”。“西南”与“东北”两个方位词应怎样理解呢？有的人把它们同邵雍的先天八卦后天八卦联系起来解释，解释不通。程颐和朱熹说“西南阴方，东北阳方”是可从的。西南代表阴方，东北代表阳方，似乎是一种古老的观念。《礼记·乡饮酒礼》说：“四面之坐象四时也。天地严凝之气始于西南而盛于西北，此天地之尊严气也，此天地之义气也。天地温厚之气始于东北而盛于东南，此天地之盛德气也，此天地之仁气也。主人者尊宾，故坐宾于西北，而坐介于西南以辅宾。宾者接人以义者也，故坐于西北。主人者接人以德厚者也，故坐于东南，而坐僎于东北，以辅主人也。”《乡饮酒礼》的这个说法很可能与《周易》坤卦西南、东北同出于一种古老的认识，即把西方视作阴方，把东方视作阳方。那么，坤卦曰“利西南得朋，东北丧朋”是什么意思呢？“西南得朋”与“东北丧朋”同样有利。朋是朋类。得朋丧朋是与上文“得主”相照应的。作为坤来说，其根本的问题是如何得到乾健作己之主。得到乾健作己之主就吉，失掉乾健之主则凶。坤顺怎样方可得主呢？“东北丧朋”。东北是阳方，代表乾，就坤对乾的态度说，应当忠诚不贰；欲忠诚不贰，根本的问题是“丧朋”，即引类相先而不为阿党。“西南得朋”，西南是阴方，代表坤，就坤对乾效劳的方式说，应当竭尽全力；欲竭尽全力，根本的问题是“得朋”。丧朋得朋是一个问题的两个方面。坤对乾既然要顺，要得到乾为己之主，就要一方面不结私党而效忠于乾，一方面联合众力而效劳于乾。“安贞吉”，坤能够自动自觉、心甘情愿地顺于乾，故吉。\n乾之爻取龙象，坤之卦取马象，而《说卦传》说“乾为马，坤为牛，震为龙”等等，或以为卦爻之取象与《说卦传》不合。其实不是不合，而是很合。《说卦传》讲的乾坤震巽各象什么，不过是举例，并非说乾一定象马，坤一定象牛，震一定象龙。某卦某爻象什么是极灵活的，不可拘泥。龙能够表达出乾健的性质，故乾六爻取龙象不取马象。马能够表达坤顺的性质，故坤卦取马象不取牛象。牛虽温顺，却不能表达坤顺于乾健的特定关系，因为坤只顺于乾健而不顺于其他别的任何事物，牛则对一切事物都顺。只有牝马，对别的什么都不顺，仅仅顺于牡马。在骒马群中，牝马顺于伊刺马的这种现象，十分准确、恰当地表达了在乾坤两卦这一对矛盾中，坤顺于乾的这种特定的关系。作《易》者取象如此之精巧，构思如此之聪明，实在令人折服。","T.N":"“至哉坤元，万物资生，乃顺承天。”此三句释“坤元”，此言“至哉坤元”而乾卦《彖传》言“大哉乾元”。乾元为大，坤元为至，大与至是有区别的。乾象天，天之体大而无疆，无所不包；坤象地，地之体广而有限，无所不尽。坤之体不如乾之体大，但是坤是效法乾的，坤效法乾至乾之大而后已，故乾元曰大，则坤元曰至。乾《彖传》“万物资始”，而坤曰“万物资生”。天地合德，共生万物，在生成万物的问题上，天地不可或缺，没有哪一个也不行，那么何以于乾曰“资始”而于坤曰“资生”？始与生有何区别？这很象人之生于父母。从父亲那里得到气质，父亲给他奠定了生命的基础，然而形体是从母亲那里获得的。说“万物资始”，是说万物自乾那里开始得到生命之气质；说“万物资生”，是说万物从坤那里获得生命的形体。乾元，万物资之以始，这是没有任何条件的，就是说，是无待的，是以能大，是以无疆。坤元，万物资之以生，这是有条件的，就是说，是有待的，是以能至，是以有限。坤待乾而行，乃能至于大。万物有了乾的气质，方可有坤的形体。接着的“乃顺承天”一句是点睛之笔，很能说明问题。它点出坤的性质是顺乾承乾，以乾为主而己为配。它使我们知道，坤须顺承乾，乾亦须坤来顺承，万物恰是在乾坤合德的作用中生成，乾坤合德但并不是等夷，在生成万物的造化过程中，乾为主，坤为配，坤只是在顺承乾之行而行的时候，自己的行为才是有意义的。\n“坤厚载物，德合无疆，含弘光大，品物咸亨”。这几句是释亨的。主要的意思还是强调乾主坤配的关系。无疆是天之大德。“天行健”，是从动的角度或从时间说，天是运行不已的；“无疆”，是从静的角度或从空间说，天是无所不覆的。“坤厚”，坤积顺而成厚。“载物”，凡地所生之物，即其所载之物。地之所载，无一非天之所覆，故曰“德合无疆”。“德合无疆”是坤之持载配天之无疆，亦即坤配乾，地配天。“含弘光大，品物咸亨”，是讲过坤之德与乾之德的关系之后又极赞坤德之伟大。“含弘光大”四字古人一字一义作解，含是无所不包，弘是无所不有，光是无所不著，大是无所一德深厚，无所不包容，无所不持载，没有什么东西不在它的怀抱之中。正因为如此，它才有资格做乾德之配。“光大”就是广大。《易》中光字有二义，一为光明照耀，一为广。光字在这里训作广，最为恰当。广大，是“含弘”的加重义，意在进一步加深人们对坤德伟大深厚的印象。万物在坤这个伟大深厚的环境中生存、驰骋，当然是顺畅亨通的了。\n“牝马地类，行地无疆，柔顺利贞，君子攸行”。这一节文字释“利牝马之贞，君子有攸往”二句。“地类”即阴类，阴类即指坤言，“牝马地类”，是说卦辞所谓牝马是代表坤顺的。换句话说，坤顺取牝马为象。牝马行地，是必须顺从或者说效法乾健之无疆的。何以见得呢？下一句不是说“柔顺利贞”吗！如果把全部四句话连着讲下来，这样理解似乎是有道理的：坤卦好比牝马，它要受牡马的管束，它的所作所为必须以柔顺为正，顺承乾健。君子之所行，概当如此。更概括一些地说，牝马行地，讲的是坤之象；柔顺利贞，讲的是坤之德。合言之，坤顺以从乾健，是坤之正道，君子应当效此以行。\n“先迷失道，后顺得常。西南得朋，乃与类行。东北丧朋，乃终有庆”。这一段话释卦辞“先迷后得主，利西南得朋，东北丧朋”三句。上文说过，坤顺从乾而动，是坤当守的正道。如果坤不顺从乾而动，自己先于乾而动，那便会迷失方向，走入歧途，其实质是丧失了坤之所以为坤的正道。“后顺得常”，是以“后顺”解“得常”。坤本当居乾之后，唯乾是从。倘居先则为逆，居后则为顺，居后为顺乃是坤之常道。“类”是同类，“乃与类行”，与同类在一起。“西南得朋，乃与类行”，“西南”即阴方亦即坤，在顺承乾，服事乾的过程中，能够团结它的同类共同行动，这是正确的，有利的。从另一个角度说，它又要做到“东北丧朋”才算最后取得成功，即所谓“乃终有庆”。东北是阳方，阳方即是乾。“东北丧朋”，坤在服事、顺从乾的时候，还要与自己的同类在思想上划清界限，不与之结党营私。这样做才是完满的，才是成功的。总之，既要善于团结自己的人，又不结为私党，是坤顺而从乾健的本分。两方面都做到，方可谓最后“有庆”，完满成功。\n“安贞之吉，应地无疆”。此最后两句释“安贞吉”。“安贞吉”，主要就人事言。有坤德的君子，有如坤之厚德载物一般，器量深厚，有才而不露，可以与坤地之无疆相应。如此能够像大地一般安静不躁又能守正的人，必获吉。坤《彖传》有三个“无疆”，所指是不同的。“德合无疆”，是坤之德配乾之德，此“无疆”指乾德言。“行地无疆”是坤法乾之行而行，此“无疆”亦指乾德言。“应地无疆”，是讲人法坤之德，此“无疆”指坤德言。无论哪一个“无疆”，都含有空间的无限性和时间的永恒性二义。","X.N":"乾卦“大象”曰“天行健”，坤卦则曰“地势坤”，两句话是相对应的。天与地对应，行与势对应，健与坤对应。天与地对应，容易理解，没有问题。行与势的对应就需要说明。行即道，是名词。“天行”就是天道。天道是动态的，动的特点是什么？天动的特点是健。坤不曰“地行”而曰“地势”，因为地道是静态的(这是古人的看法，实际上地也是动的)，故曰势。曰“天行”，是说天道的特点。曰“地势”，其实也是说地道的特点。乾直接称健，而坤却称卦名坤而不直接称顺。这是什么缘故？古人有不同的解释。朱熹说这只是当时用字时偶得，并没有什么深意，学者不必穿凿求说。看来朱熹说的对。坤就是顺，“地势坤”即地势顺。从地之形势看，实在看不出顺来。古人有的说地之形势高下相因，顿伏相仍，所以说“地势顺”，这完全是附会，不足凭信。王弼说：“地形不顺，其势顺”，是对的。但是他没有说其势如何顺。孔颖达说：“地势方直，是不顺也，其势承天，是其顺也”，是说得极中肯的。地之所以顺，是因为天尊地卑，地势承天。换言之，坤之所以顺，是因为乾刚健而坤柔顺，坤顺于乾。“君子以厚德载物”，古人有的说，因为地是厚的，所以才顺；若地很薄，则高下相因就倾陷了，谈不到顺。也是牵强之言。地本来就是厚的，故称“厚德”。至于说顺，上文说过，地之顺是顺承天，因为天高地下，才说地势顺。地势顺与地之厚扯不上关系。不过，从坤之德说，顺与厚却不能说毫不相干，犹如人，柔顺的人往往宽厚，宽厚的人往往柔顺。“大象”讲“君子以厚德载物”，意在告诚学《易》的人要效法坤地之厚德，容载万物。君子要以坤地一般宽厚的胸怀包容天下之人与物，使天下之人无不以为安，甚乃鸟兽虫鱼草木也无不以我为命。相反，刻薄寡恩，险诈狭隘，是绝对要不得的。","Y1.N":"初六，阴爻居初位。六是阴爻之名，八也是阴爻之名。但是六是老阴，老阴将变为阳，是变爻。八是少阴，少阴不能变为阳，是不变爻，而《周易》占变爻，不占不变爻，故《周易》192个阴爻全名六不名八。坤卦初六爻辞曰“履霜坚冰至”，意义比较容易理解。这是一个象，象也就是用一个形象作比喻，借用这个形象作比喻以说明一个道理。用象说明道理，是《周易》的重要特点。为什么不直接讲出道理而用象来作比喻呢？这是因为如果直说，必然说死说偏，只有用象来表达，才能把卦爻的意义讲圆活，讲完满。64卦与384爻各取什么象，看来似乎有规律，其实是很灵活的。如乾卦卦辞曰“元亨利贞”，实际上是以天为象，但又不明说，根据《彖传》我们才知道它是取象天的。乾之六爻不取天象取龙象。坤与乾相对应，乾卦卦辞取天为象，则坤卦当取地为象，然而坤却取象牝马，而坤之六爻则取象多样而绝不言马。“履霜坚冰至”是这样的象：脚下既已踏霜，坚冰必将到来。它的意义是说，阴始生于下，其端甚微，而其势必盛。引申一步，告诚人们要见微以知著，防渐而杜微。阴能消阳，柔能败刚，小人能剥君子，全有一个由始甚微而渐盛的过程。意思是说，对于它们要毖之于小，慎之于微，善于在它们势力还很微小的时候，就识破它们，及早防范、消弭。","Y1.XN":"“履霜坚冰”的“坚冰”二字可能是衍文，因为履霜与坚冰不是同时事，说履霜是阴始凝可，说坚冰是阴始凝则不可。又据《三国志·魏文帝纪》注文记太史许芝引此象辞，“履霜”之上有“初六”二字，“履霜”之下无“坚冰”。古本很可能作“初六履霜”，后世转抄讹误，遂变为“履霜坚冰”。驯，狎顺。“驯致其道，至坚冰也”，意思是说，既已履霜，阴气已开始凝聚，发展下去，必然导致坚冰。言及人事，“其道”乃小人之道，小人之道开始时虽微小，然而积渐驯习，因循而长，必至于盛。爻辞曰“坚冰至”，是强调事情发展的结果，“小象”曰“至坚冰”，是强调事情的起始。乾初九“小象”曰“阳在下”，坤初六“小象”曰“阴始凝”，提出阴阳二字，意在说明九就是阳，六就是阴，一部《周易》正是384个阴爻和阳爻对立统一，交错变化的过程。有人据《周易》经文不见阴阳二字，断言《周易》不讲阴阳，这是一种极端错误的观点。九六是阴阳，乾坤也是阴阳。孔子不仅于乾坤二卦之初爻明确点出九六就是阴阳，在《易传》的其他部分又多次讲到过阴阳，如《系辞传》讲“乾，阳物也；坤，阴物也，阴阳合德而刚柔有体”，“阴阳不测之谓神”，“一阴一阳之谓道”等等。若说《周易》不讲阴阳，《周易》也就不复存在了。其实阴阳没什么神秘，阴阳不过是事物对立统一着、不断变化着的两个方面罢了。《周易》比较特殊之处，是它一方面承认“阴阳合德”不可相无，另一方面又强调阳淑阴慝，阳好阴不好，把崇高的、善良的、正确的，都归诸阳，把卑微的、丑恶的、错误的，都归诸阴，采取扶阳抑阴的态度。","Y2.N":"64卦每一卦都有卦主，卦主是代表这一卦的，这一卦的特点由卦主比较完备地表现出来。乾卦的卦主是九五，因为九五有天之象，居君之位，又刚健中正四者具备，乾之道在此显现出来。坤卦的卦主不是六五而是六二。因为坤卦唯六二最纯粹。六五虽然在尊位，却是阴居阳，中而不正。六四以阴居阴，正而不中。六三以阴居阳，不中又不正。只有六二柔顺中正四者具备，而且居臣之位，有地之象。爻辞“直方大，不习无不利”确实极准确地表达了坤卦的本质特点。这主要表现在两个方面。第一，“直方大”三字，方是讲坤的。乾为圆则坤为方，方是坤之德。坤之方与乾之圆相对应。乾体圆，坤效之以方，故坤至静而德方。至于直与大二字《系辞传》说乾“其动也直”，《彖传》说“大哉乾元”，说明直与大是乾之德，不是坤之德。不是坤之德，为什么坤之主爻六二把直方大连起来说呢？这是因为坤以乾之德为己德，或者说，坤是效法乾的。乾体圆，坤则效之以来方。乾性直，坤亦未尝不直。乾无疆，则坤德合无疆，与乾并其大。那么，坤之方怎样能与乾之直、乾之大联系起来呢？就事理上说，大凡方的东西必首先要直，不直何以成方？而其趋势总以大为极。犹如几何学上所谓线面体的关系，没有直线不可成面，没有面不能成体，没有体何以言大？这里充分地表达出坤的特点：坤总是效法乾，因顺乾，绝不独特地表现自己。坤之德仅仅在与乾发生联系的时候才有实在的意义。于是就有了第二点，乾为圆，圆者动；坤为方，方者静。故曰“不习无不利”。“不习”，谓坤之道因任自然，莫之为而为，一切顺从乾德而行，其间并无自己的增加造设。这样做，对于坤来说，没有任何不利。这大概就是《系辞传》所说的“坤以简能”的意思，与《老子》之“自然无为”近似。《老子》的思想根源可以追溯到殷易《坤乾》，坤六二“不习无不利”一语极可能就是《周易》里保留着的《坤乾》思想的残迹。","Y2.XN":"“直以方”的“以”字作“而”字解，“而”在此是连词。直而方，是又直又方的意思。爻辞讲“直方”，直与本是乾之德，为什么坤六二爻辞讲方之外又讲直呢？孔子怕学《易》者不明白，乃答之曰“六二之动”。乾刚坤柔，这是肯定的。乾动坤静，这也是肯定的。但是，是不是坤只有柔而不可有刚呢？不是的。是不是坤只是静而不能动呢？也不是的。我们知道，坤的性质是顺，顺什么，顺乾。坤总是效乾而动，效乾而行。坤虽然至静，然而一旦乾的影响施加到它的身上，它就要顺之而动，而动机一发即不可遏止屈挠，于是坤便也有了直的特点。坤自身本来所具有的方的特点，其实也要通过六二之动表现出来。坤是静的，待乾之动机施之于坤，坤便能陶冶万物，使各有定形，不可移易。陶冶万物，使各有定形，就是六二之动，同时也是坤之方。因此可以说，坤柔中有刚，静中有动。唯其如此，它才能“直以方”。“光”字在《周易》中有二义，一是光明之意，一是广大之意。这里的“光”字其实就是“广”的意思。“地道光”，应释作地道广大。六二为什么能够“不习无不利”，孔子回答说：“地道光也”。六二是坤之主爻，六二完全能够代表坤卦之德。“不习无不利”不仅是六二一个爻的特点，也是整个坤卦的特点，故曰“地道光”。“地道光”，地道广大，亦即坤之德“直方”。“直方”的实质不是别的，是法乾之德，效乾之行，自己则因任自然而动，莫之为而为，这岂不恰是“不习无不利！”","Y3.N":"六三这一爻不中不正，比不了一卦之主的六二，却又与六四不同。六四以阴居阴，全是阴柔，没有一丝阳气，六三以阴爻居阳位，阴之中包有阳在内，有半动半静的特点，所以有“含章可贞”之象。章，文而成章，本是外露之物，而六三毕竟是阴爻主静，有坤之含弘光大之德，且居下卦之上，为得位之爻，它能够含晦章美，常久贞守，不使外露。六三以阴居阳，又有动的一面，它“含章可贞”并非永远无所作为，它要“或从王事”，对于“王事”则动而从之，为之效劳。此“从”字甚关紧要。“从”，表明它顺从人家做事，不为事始，有唱乃应；更不为事主，待命而发。“王事”之“王”指乾。坤卦与它卦以五为君者不同。坤卦六爻皆为臣道。此“或”字尤堪注意。乾九四讲“或跃在渊”，坤六三讲“或从王事”。两爻都处在进退未定之际，唯退曰“在渊”，曰“含章”，而“跃”与“从王事”之进则皆曰“或”，这是因为作《易》者想告诫人们要慎于进，不急于进。在《周易》中阳是主进的，阴是主退的。乾九四阳居阴，坤六三阴居阳，有阴有阳，可进可退，故强调进宜慎不宜急。对比之下，乾九三与坤六四就不同了。乾九三阳居阳，阳主进，故曰“乾乾”；坤六四阴居阴，阴主退，故曰“括囊”。“无成有终”，进一步讲坤六三应当怎样“从王事”。上文说过，坤卦六爻皆是臣位，实际上它们都以乾为君。六三即要“从王事”，即从乾，那么它就有一个怎样从的问题。第一，它必当也能够“无成”。“无成”不是无所作为，无所成就；“无成”是功成而不居，有美归之于君。第二，虽“无成”但必须“有终”，“有终”是虽然有功不居，但是却要尽职尽分，一丝不苟地做成做好自己当做的事情。若把“无成有终”理解为所做之事当做十分，只做五六分，不须做尽，那就根本错了。","Y3.XN":"“含章可贞，以时发也”，“含章”不是永远含晦不发。“含章”只是说平时不发，到了该发的时候则一定要发。按经文之意，“以时发”的“时”系指“从王事”言。“含”与“发”相对应，平素不“含”，则无所谓“发”；“发”而不以“时”，随时皆“发”，则无所谓“含”。喜露圭角的人不能“含章”。不能“含章”的人不能“以时发”。可以说，“含章”与“以时发”是一件事的两个方面。“或从王事，知光大也”，实际是说“或从王事，无成有终，知光大也”。“知光大”，知之广大。坤六三为什么能做到“或从王事，无成有终”呢？根本的原因在于它“知光大”，即眼光深远，胸中宽广。眼光深远，胸中宽广的人，自然含晦。平常的人何尝不欲含晦，然而怎奈胸中浅狭，只能做些锄治骄矜，深匿名迹的表面功夫，不曾有根本上的认识，稍有一功一善，就觉得按捺不住，非表现出来不可，岂能含晦！犹如坛小水多，任你怎样遏抑固闭，水终将溢出来。假若是个大坛子，则水自不泛溢，全不须另费力气。","Y4.N":"六四不同于六三，六三以阴居阳位，有静也有动，可退亦可进，当“含章”亦当“从王事”。六四则以阴居阴，又在危惧之地，上下不交，无承无应，恰是贤人不得不隐藏的时候。六四也恰是知几的君子，完全能够以柔德目处，做到“括囊，无咎无誉”。“括囊”，扎上囊口，里面的东西，全不使出来。含晦缄默，恶不为，善也不为，善恶一概括而不形。恶不为则无咎，善不为则无誉。平常人徒知咎可以致罪，不知誉可以为害。其实，有誉即可致咎。誉与咎无宁说是一回事。《庄子·养生主》之“为善无近名，为恶无近刑，缘督以为经”，与此爻义近。","Y4.XN":"此“小象”曰“括囊无咎”不曰“无誉”，是省语，其实“无誉”是在内的。“括囊”的实质是谨慎，“无咎无誉”的实质是“不害”。由于“括囊”，所以“无咎无誉”；由于谨慎，所以无害。孔子用“慎不害”一语将爻辞的实质揭示出来。","Y5.N":"黄，黄色。黄色代表什么，古人有两种说法，一说东西南北中各用青、白、赤、黑、黄五种颜色表示，黄色代表中；一说天玄地黄，在天与地相对应的时候，玄色代表天，黄色代表地。这里的黄色是代表中还是代表地，古人亦有二说。有人说这个黄代表中，是中之色，有人说代表地，是地之色。仔细寻绎，还是后说强一些。第一，紧接着上六爻辞即曰：“龙战于野，其血玄黄”。“其血玄黄”，以黄与玄连举，显然玄指乾指天指阳，黄指坤指地指阴。《仪礼·士冠礼》经文“玄端玄裳黄裳杂裳可也”下，郑注说：“上士玄裳，中士黄裳，下士杂裳。杂裳者，前玄后黄，《易》曰夫玄黄者天地之杂也，天玄而地黄。”郑注引的《易》正是坤卦《文言传》里解释坤上六爻辞“其血玄黄”的话。郑玄认为玄裳的“玄”是天之色，黄裳的“黄”是地之色，是正确的。六五言“黄裳”，上六言“其血玄黄”，两爻相比邻，同一个“黄”字不应有两解。第二，从事理上说，五就是中，已经明白无疑，何须更用黄色来表示，只有将“黄”字理解为地之色，代表坤的时候，“黄”字在此才有意义。古人的衣服，穿在上身的叫衣，穿在下体的叫裳。裳很像围裙，系在腰上。衣与裳相对，衣在上象乾，裳在下象坤。黄与裳合而言之，讲的就是坤之柔顺之道。坤以在下为正，乾以在上为正，所以二与五皆中而乾之天德在九五，曰“飞龙在天，利见大人”，坤之地道在六二，曰“直方，大，不习无不利”。反之，二不是乾之正位，故乾九二有阳德而在下，五不是坤之正位，故坤六五在上而有阴德。“元吉”即大吉。“黄裳元吉”，不过是说，一个人处在坤的时代，虽然地位高了，但也要保持柔顺之德，如此方可得大吉。","Y5.XN":"“文在中”可与六三的“以时发”对照看。六三“含章”，是说坤之柔顺的美德含晦未发，然而不能总不发，时候适宜便要发。六五“黄裳”，是说坤之柔顺的美德已然表露，然而这美德不是虚假的，是有它的内在依据的，故曰“文在中”。六三所居之位不中，章须含而不露，待时而发，六五则柔顺居中，正是“黄裳”外见，“含章”已发之时，然而文非由外袭，文德实具于其中。","Y6.N":"一卦可以看作一个时代，一爻则是一个时代中的一个发展阶段。乾卦自初至上，是一个完整的发展过程，即乾健如何由潜而见而惕而跃而飞以至于亢而有悔的过程。乾健的发展过程是自我表现、自我变化发展的过程。坤卦自初至上也是一个发展过程，但坤的本质特点是顺，坤顺乾，阴顺阳，因此坤卦六爻实际上是一个坤顺乾、阴顺阳的发展过程。坤卦的每一步变化都反映着它顺乾、顺阳的发展程度。初六“履霜”，阴气开始凝聚，六二“直方”已具备了阴柔中正的全部坤德，六三“含章”，含晦不露，却又随时准备为乾效劳而不居功。六四“括囊”，阴顺发展到相当的程度，以至于晦藏缄默。六五“黄裳”，坤顺之道日臻完美，居高位却能固守柔顺之德，至上六则发展到极盛的地步，顺转为逆，坤顺乾变为坤敌乾乃至与乾战。爻辞不言阴与阳战而曰“龙战于野”，是故意不承认阴敌阳的这个现实，把阴与阳战或坤与乾战的现实用“龙战于野”的另一种说法表达出来。“战于野”，仿佛不是阴逼阳、坤敌乾造成的战事，倒是阳主动出击到外面来与阴战，与《春秋》“天王狩于河阳”几乎同一书法。因为要点出是阳主动出击到外面来与阴战，不是阴主动逼至阳之腹地与阳战，所以称“龙战于野”。古代国家的统治中心地带曰国，国外曰郊，郊外曰野。言“龙”，意在强调是阳与阴战，不是阴与阳战，因为阴敌阳不可言。言“野”，意在指明战于国之外，非战于国之中，进一步掩饰阴逼于阳的事实。“其血玄黄”，有人说“血”是血战，甚乃血流漂杵的意思。其实不然，“其血玄黄”一语重点在“玄黄”而不在“血”。天为玄，地为黄。“玄黄”合言乃天地混杂、乾坤莫辨之意。天地混杂，乾坤莫辨，这在古人的思想观念中是最糟不过的事情。所以爻辞尽管不言悔吝，而“其血玄黄”的后果比悔吝更要严重。","Y6.XN":"上爻是当变之爻。乾卦《文言传》说“亢龙有悔，穷之灾也”，坤卦“小象”言“龙战于野，其道穷也”，意义一致。乾之道发展到上爻，就到了穷极的地步，穷则变，变方能通。“亢龙有悔”是乾道至于穷极而造成的。“龙战于野，其血玄黄”，天地不分，阴阳莫辨，也是坤道盛极而穷所造成的结果。","Y7.N":"“用六”的意义与乾卦“用九”一样。“用九”是乾卦六个阳爻都用九不用七，“用六”是坤卦六个阴爻都用六不用八。筮得坤卦时，六爻虽皆阴，但有的可能是六，有的可能是八。六是老阴，是变爻；八是少阴，是不变爻。《周易》占变爻不占不变爻。假设坤卦六爻皆六，都是变爻，那么便用这六个六来占；六是变爻，六个六皆变为七，即变为阳爻，全卦也就由坤之乾了。坤虽变为乾，坤性依然在，坤性虽还在，却已有乾的影响。故作“易”者特为此设辞曰“利永贞”，意谓阴柔不能固守而变为阳，变为阳却又不是阳，则利在永贞。乾坤二卦都讲元亨利贞，然而乾重元以元为统，坤重贞以贞为主，故坤之贞为“牝马之贞”。坤之本质特点是顺乾，一方面与乾合德，共生万物，故乾元亨，坤也元亨；一方面以乾为君，顺承乾。此处言“利永贞”而不及元亨，其用意很明显，是在突出强调坤用六变卦之顺承乾的一面。","Y7.XN":"《易经》以阳为大，以阴为小，坤用六诸爻皆阴变阳，始小而终大，故曰以大终。","W1.N":"孔子于64卦特别重视乾坤两卦，认为这两卦意义极其深远，与其他诸卦不同，所以在乾坤两卦特为作《文言传》，对卦爻辞反复地加以分析说明。坤卦《文言传》共七段文字，依次解释卦辞及六爻爻辞。这一段解释卦辞。卦辞《彖传》已全面解释过了，《文言传》再作解释，意在加深理解，进一步抓住要领。乾卦情形同此。不过也有所不同。乾《文言传》对卦辞“元亨利贞”四字，字字作解，因为四个字各自有独立的意义，不字字作解不足以说明。坤《文言传》对卦辞只取“后得主”一语，其余多作赞辞，而分析的重点则在“顺承天”三字上，这大概由于坤卦爻辞取象比较复杂，卦义不易把握的缘故。“坤至柔而动也刚，至静而德方，后得主而有常。”乾至刚，坤至柔，这是乾与坤的固有本性，但是坤之柔须在随乾而动的过程中表现出来；乾健不息，坤则随着乾健的影响而生长万物，承载万物；生长万物，承载万物就是动；动则必然表现出刚的性质。乾动，坤也随着动；乾刚，坤也随着有刚。坤是至静的，静本身无形无迹，无法看得见；坤之至静要从它的德之方处看。换言之，坤之至静表现在它的“方”上。方即六二爻辞“直方”的“方”。“方”即是坤在乾的影响之下，陶铸万物，飞潜动植，使各有定形的稳固性与普遍性。从坤随乾动的这个情况看，坤虽至柔，然而“其动也刚”，坤虽至静，然而其德亦方；以乾为先，自己处后，即“后得主”，才是坤之不可移易的特点，柔也罢，静也罢，都是以乾先坤后为前提的。顺便指出，《老子》贵柔贵后，以为天下之至柔可以胜天下之至坚，主张不为天下先，与《周易》坤卦的思想看似一致，然而根本不同。《老子》崇柔抑刚，扶阴抑阳，将坤放在为首的地位。它说的不为天下先，是一切居后，居一切后的意思，《周易》坤卦则强调乾先坤后，坤居乾后，不是一切事物在一切情况下都居后。这个差别是极其重要的，因为《老子》思想渊源于殷易《归藏》，《归藏》是首坤次乾的。《周易》虽也与《归藏》不无关系，但是《周易》已将《归藏》的原则加以改造，首坤次乾，变为首乾次坤。这是根本性的变化。以下“含万物而化光”句与《彖传》之“含弘万物，品物咸亨”，义同，不再赘述。“坤道其顺乎，承天而时行”，此二句带有总结的意义，将坤之“至柔”、“至静”、“后得主”诸特点最后归结到“顺”字上。“顺”才是坤的根本性质，如同“健”是乾的根本性质一样。“坤道其顺乎”！坤道就是一个“顺”字，讲得斩钉截铁，勿庸置疑。顺谁？任是谁都顺吗？不是。坤只顺天顺乾。顺是胡乱顺吗？也不是。天动地随，天以时行，坤亦以时行。天不超前不落后，坤亦不超前不落后。“承天而时行”一句说出，把坤顺的性质讲得周到深刻，全无罅隙。现在我们回过头去体味一下“利牝马之贞”的卦辞肯定会觉得豁然洞晓，了无窒碍。","W2.N":"这是孔子对坤初六“履霜坚冰至”的体会，也是解释。余庆，福及子孙。余殃，祸及后世。长期养成的善或不善，影响极深远。先时种下的祸根，要很久以后才结出恶果，例如弑君弑父之事，绝非一朝一夕偶然发生，它是由来已久，积渐而成。问题乍出现时，往往微不足道，人们不知不辨，结果导致大祸。这些都是说“履霜坚冰至”的道理。孔子说，“履霜坚冰至”是讲顺的。这就有了问题。顺是坤之本性，坤之至德，与乾健一样，其意义是正面的，而初六“履霜坚冰至”讲的是阴道由微而渐盛的道理。阴道乃小人之道。小人之道与坤卦卦辞以及《彖传》、坤《文言传》第一节所讲的坤之道是不一致的。这该如何理解？这是因为“易”中卦辞与爻辞的意向在乾卦完全相同，都是正面的，卦辞讲乾健，爻辞也都从正面讲乾健，不同的不过是爻辞从动态的角度讲罢了。坤卦则不然，坤卦卦辞讲坤顺，讲坤之德，是正面意义的，所以“大象”讲“地势坤，君子以厚德载物”，而爻辞有的讲阴道是代表小人的，其意向与卦辞相反。初六爻辞“履霜坚冰至”，乃小人之道由微而盛、终构成大害之谓，所云也是一个“顺”字，然而不是卦辞坤顺承乾之义。这种顺，是君子应该逆而制之的。爻辞之义与卦辞之义不同甚乃违背的现象，在以下诸卦中我们还将不时见到。","W3.N":"坤《文言传》的这段文字解释六二爻辞“直方，大，不习无不利”。六二是坤卦卦主，它柔顺而中正，具有坤卦的全部美德，卦辞所讲的坤的性质它全包括了。这一爻，其意向与卦辞相同，都是君子之道。坤之道“直方，大，不习无不利”，那么君子法坤之道应该如何付诸实行呢？孔子在此一一加以指点。“直其正也”，“直”里面包含着“正”在内。直上直下，率意径行，算不上“直”；“直”还要“正”，胸中洞然，没有纤毫的委曲。“君子敬以直内”的“敬”，是心中专一，并无杂念，每遇事只管专一去做，不为苟且。\n“方其义也”，“方”里面包含着“义”在内。只是方方正正，四平八稳，算不上“方”；“方”还要有“义”，处理事情是非曲直分明，行所当行，止所当止。“敬以直内”指人的内部修养，“义以方外”言人的外部表现。一个人自内外两方面把住了关，无事，胸中洞然专一，不染些许杂念；有事，是非截然明白，对的去做，错的不做，方方正正，各得其宜，于是做人的问题便全解决了。“敬义立而德不孤”，敬与义两项做到，德也就不孤了。所谓“德不孤”，是说内外交养，表里相资，其德影响至广，天地之间，四海之内，凡为善者无不与之同，与之应。可见“不孤”也就是大。敬做到了，义做到了，德便自然不孤了。“敬义立而德不孤”，实际上也就是“直方大”在一个人身上的实现。实现了“直方大”便可“不习无不利”，自己不必增加造设，一切因任自然，法乾而行，莫之为而为。这样，便“不疑其所行也”，尽管去应事接物，全不必怀疑自己所做所为的正确性。","W4.N":"这一段文字释六三爻辞。从坤与乾的关系上说明问题。坤虽然自身有才美，但是要“含之”，不表现出来，不使有所成名；这样做是为了“以从王事”，为乾的事业服务。坤不是自己没有条件成名，是“弗敢成”，不敢使自己成名。爻辞在“或从王事”之后讲“无成有终”，说坤虽然有美不成名，有功不伐功，却一定把事业妥善地完成。《文言传》则进一步点出坤的“有终”是“代有终”，代乾有终，完成的是乾的事业，不是它自己的事业。由此看来，坤与乾的关系显然是这样的：事业总是由乾开始，而由坤完成。乾不能终物，坤不能始物。而在完成事业的过程中，坤要努力奋斗，竭尽才能，自觉地把功劳、荣誉归于乾，不使自己有所成名。这是坤之道，也是地之道。臣之于君，妻之于夫，莫不如此。《系辞传》所讲“乾知大始，坤作成物”，意义略同于此。","W5.N":"六四以阴居阴，不中不正，有天地闭塞隔绝之象，是乾坤道绝，贤者隐遯之时。“天地变化”二句言草木而不言贤人，“天地闭”二句言贤人而不言草木，是互文。古人认为人事与天道一致，常常把社会问题与自然现象连在一起。如《诗·召南·驺虞序》说“朝廷既治”，“则庶类蕃殖”；《书经·洪范》说“日月岁时既易，百谷用不成”，“俊民用微”。这里讲天地“变化”，是说天地交感，变化万物，则草木蕃殖茂盛，而贤人亦出。讲天地“闭”是说天地隔绝，阴阳不通，则草木不蕃，贤人隐遯。贤人隐遯的表达方式是“括囊”。“括囊”是言不出，智不发，身不见，一方面谨慎自守，一方面内充其德，待时而发，而关键的意义还在一个谨字上。括囊谨慎，虽无令誉，亦可无咎。","W6.N":"这一段文字释六五“黄裳元吉”。“黄中通理”释“黄裳”的“黄”义，“正位居体”释“黄裳”的“裳”义。黄是地之色，是代表坤的。“黄中”，坤而居中。居中这一点对于坤来说极重要，它表示柔顺之德蕴藏于内，存之于中，不是表面的，虚假的。下文“美在其中”一语，进一步指明柔顺之美德藏诸中心。中心藏着粹然无疵的美德，则理无所不通，故云“通理”。这是说六五“美在其中”，德藏于内的一面。六五与六四不同，六四“括囊”，藏而不发，六五藏于中心之美德要表现出来，要发挥它的作用，所以又说“正位居体”。“正位”六五居尊位。“居体”，它毕竟是“裳”，故以下体自居。合而言之，“正位居体”，身居高位却能甘处人下，至柔而恭，守静而无倡，处顺而无作。内里蕴藏着柔顺之美，表现出来又能居高位做大事而无嫌于僭，这样的人，可以说它的坤顺的美德已经“畅于四支”，浑身上下，内外左右，无所不在，无所不有，而且更重要的是，它不仅“畅于四支”，又能“发于事业”，把自己的才德用于治理天下国家上。“美之至也”，坤顺之德达到这个程度，可谓到了极致了。古人常用伊尹、周公旦的德行比拟坤六五这一爻，看来不无道理。","W7.N":"此释上六“龙战于野，其血玄黄”。坤至上六，阴发展到极盛，以至于疑于阳。疑，阴阳二者势均力敌，分辨不出大小高下。阴盛到疑阳的程度，势必与阳交战。本是阴与阳战，不曰阴与阳战而曰“龙战”，就是怕人们误以为无阳。曰“龙战”是说阴盛而犯阳，阳来战它。不允许阴与阳均敌。玄是天的颜色，黄是地的颜色。称“血”，说明阴阳都未离乎其类，阴还是阴，阳还是阳。称“玄黄”，表示天地、阴阳混杂难分。但是毕竟“天玄而地黄”，天还是天，地还是地；天尊地卑，乾健坤顺的大分终究不可移易。","Z":"坤卦是64卦的第二卦，它的六个卦画都是阴爻，与乾卦的六个卦画正好相对。64卦自乾坤开始，每两卦在卦画排列上都表现为一定的关系，即两卦的卦画不反则对。对，两卦六爻自初至上阴阳相对，乾坤两卦就是如此。反，前一卦自初至上象卷帘那样反过来就是后一卦，后一卦依同样的方法反过来也是前一卦。乾坤之后紧接着的屯蒙两卦即属于这种情况。还有些是既是对又是反的关系，最为典型的既对又反的两卦是64卦结束的既济与未济。相邻的两卦具有这样的关系，当然不是偶然的，必有其含义，这个问题以后要逐渐涉及到。现在我们先看乾坤两卦。乾卦由六个阳爻构成，代表事物纯阳至健的性质，坤卦由六个阴爻构成，代表事物纯阴至顺的性质。两卦所代表的事物的性质是根本对立的，但同时也是统一的，不可分割的，它们是一个整体。《序卦传》说“有天地然后万物生焉”，《易纬·乾凿度》说“乾坤相并俱生”，“乾坤，阴阳之根本，万物之祖宗”，说得都是对的。它们都明确指出世间万物生自于天地，天地并提而不只言天；《易》中64卦生自于乾坤，乾坤共举而不只言乾。事实上，64卦的其余62卦全由乾坤两卦相与交错而来，乾坤没有了哪一个都产生不了64卦，产生不了易。犹如天地共同生成万物，乾坤亦一起创生易卦。\n天地虽共生万物，乾坤虽并成易卦，但是天与地不平等，天尊而地卑；乾与坤也不平等，乾健而坤顺。乾象天，健而不息；坤象地，顺而承乾。实际上也可以说乾尊而坤卑。天尊地卑，乾尊坤卑，是《周易》贯彻始终的根本思想，所以孔子作《系辞传》开宗明义便讲：“天尊地卑，乾坤定矣”。乾尊坤卑的思想在坤卦里表现得极为清楚。坤卦卦辞与乾卦卦辞真是如同天地之差别，乾卦卦辞唯“元、亨、利、贞”四个字，孔子作《彖传》说乾“大哉乾元，万物资始，乃统天”，作“大象”说乾“天行健”，说明乾象天，而坤卦卦辞则说“元亨，利牝马之贞”，而且加上“先迷后得主，利西南得朋，东北丧朋，安贞吉”的限制之语。孔子在《彖传》说坤是“至哉坤元，万物资生，乃顺承天”，在“大象”说“地势坤”，说明坤象地，同时强调是“顺承天”的。孔子的认识符合经文之意，既正确又准确。“天行健”，乾象天那样没有条件，没有限制地独自运行不已，表现出一种完全独立的刚健性格。它不受制于也不需要受制于另外别的什么力量。坤卦则不然，坤要顺承乾。坤象地那样主静，那样块然不动：它纵然也要动，也要参与生成万物，但那全是在乾的影响下进行的。乾给予万物以始，坤才给予万物以生。乾之元是伟大的，坤之元才是至大的。有了乾之大，坤才跟着也大。坤不能如同天那样独自运行不已，坤的性格是至柔至顺的，它的行为受制于也必须受制于乾，有了乾的“元亨”，才有坤的“元亨”。乾有“元、亨”又有“利、贞”，“元、亨、利、贞”构成乾健的内容，坤因乾之“元亨”而“元亨”，却不能因乾之“利贞”而“利贞”。坤必须“利牝马之贞”，像牝马服从伊刺马管束那样柔顺地服从乾的管束。坤的一切行为都要以乾为先，自己居后，牝马跑到伊刺马前头去是不行的，那就要迷失方向、道路。只有永远跟在乾的后面行动才是正道，才能得到乾的支持、保护。坤一切要效法乾，服从乾。所谓“西南得朋”，为了服事乾，应该团结同类，合力以赴；所谓“东北丧朋”，为了忠于乾，绝然舍弃私党，一心奉公。孔子在《文言传》中把坤卦卦辞的意义讲得更加透彻，说“坤道其顺乎！承天而时行”，可谓一语破的。第一，坤道的实质全在一个“顺”字；第二，坤并非顺承一切，仅仅顺承乾；第三，顺承乾的过程中更注意时的问题，乾依时而行，坤也依时而行。\n“坤道其顺”不仅表现在卦上，也表现在爻中。六二“直方，大，不习无不利”，六三“含章可贞，或从王事，无成有终”，六五“黄裳元吉”，所云全是坤顺乾的柔顺之道，六二“直方，大，不习无不利”，全面概括了坤之德与坤之道。“直方”讲坤之自身修养与坤之德，“大，不习大，无不利”讲坤以乾为先，己居后，莫之为而为的坤之道。六三“含章可贞”及其以下的爻辞尤可说明“坤道其顺”的特点。孔子《文言传》已明言这就是地之道，妻之道，臣之道，坤之道的本质恰是乾唱己和，乾所开始的事业由坤完成，而这只是代乾有终。明明是坤的成就，坤却弗敢居，一切的美都当归之于乾。坤卦诸爻爻义与卦义基本上是一致的，但是因为卦义比较稳定明确，爻义依时而动，比较多变，所以坤卦之爻辞并不与卦义完全一致。六四“括囊无咎无誉”的含义显然是持守、收敛、畏谨，这虽然与卦之“顺”义不无一点联系，但是毕竟不宜理解为“顺”。爻义与卦义不尽相同甚至很不相同的情况以后将经常见到。还有一种情况我们也要看到，64卦中有些卦的卦辞属于对君子做正面指导，告诉人们应当如此而行，这方面最典型的例子是乾坤二卦。也有些卦的卦辞如蒙卦、剥卦，属于反面的告诫，教导人们不要这样做。这后一种情况不是很多。而在384爻中属于后一种情况的则并不少见。尤其各卦的初上两爻爻义属于告诫之辞的不在少数。乾卦卦辞在64卦中意义可谓最佳，佳到无可比拟，然而由于时有不同，爻辞意义亦有差别，初九处于乾健开始之时，故告诫“潜龙勿用”，上九乾健已至于穷，穷将生变，故指示勿亢；“亢龙有悔”，方可不至于得咎。坤卦初上两爻情况又与乾有所不同，乾卦初上言“勿用”，言“有悔”，告诫的是君子自身该当如此。坤卦初上言“履霜”，言“龙战”，告诫君子对于“阴始凝”即小人之道的萌生，要善于防之于微，谨之于始，不使驯致其道，结成坚冰。如果阴之道发展到疑于阳甚乃与阳战的程度，君子就要保持清醒的认识，分辨乾坤，坚信天地终究不能也不应该混杂。在这里，我们进一步发现，虽然乾之道与坤之道都是君子之道，但是乾之道在任何情况下都是君子之道，而坤之道在一定的情况下却可能成为小人之道。《易》之中有一个扶阳抑阴的思想贯穿着。"},"03":{"P":"继乾、坤二卦之后是屯卦。这一卦为什么叫做屯呢？《序卦传》说：“有天地然后万物生焉。盈天地之间者唯万物，故受之以屯。屯者盈也。屯者物之始生也。”从《周易》64卦的结构来说，乾、坤二卦象天地，其余62卦象由乾、坤二卦相交错所产生的万物。屯是乾、坤二卦始交而产生的第一卦，正象万物始生、充塞于天地之间。在古人看来，天地开始产生万物，万物是处于一片混沌之中，阻塞郁结，未有亨通。这个时候，这种状态，就是屯。继乾、坤二卦之后的这一卦，正是反映这种状态的，所以叫做屯卦。从卦画本身来看，屯卦之下卦为震，震义为动；上卦为坎，坎义为险。动而遇险，动在险中，所以这一卦有屯难之义。屯卦《彖传》说“刚柔始交而难生”之“难生”，正是整个屯卦的特点。\n所谓屯难，不同于别的难。它是事业开始时的难，终将被克服。很像幼芽在泥土中萌动，虽暂时郁塞不通，处境艰难，却必将破土而出，茂盛成长。屯卦告诉人们，为了度过屯难之时，取得事业的成功，应从两方面努力，第一要居贞，固守基地，不轻举妄动；第二是“建侯”，即建立起领导机构。","G.N":"屯卦讲的“元亨利贞”，与乾卦不同。乾卦“元亨利贞”四字四义，所说的乃是“天之道”即自然规律。屯卦“元亨利贞”四字二义，所说的乃是“民之故”即社会人事的规律。元亨，大亨；利贞，宜贞固守正。屯有大亨之道，将来必将达到顺利通畅的境界。关键的问题是坚守基地，不轻举妄动。\n“勿用有攸往”，不要有所往。强调处于屯难之时，不要遽图发展，而要建侯。建，立；侯，君。一个国家处于草创时期，最要紧的是立君，即建立起有效的统治秩序。“利建侯”是一个比喻，具有普遍的指导意义。它是说，一个国家，一个集团，一个人，当处于屯难之时，应将着眼点放在解决自身的内部的问题上。","T.N":"“刚柔始交而难生，动乎险中，大亨贞”，刚柔系指乾坤两个三画卦而言，“刚柔始交”即乾坤始交。全《易》64卦除乾坤两卦外，其余62卦皆由乾坤两个六画卦交错而成。屯卦是乾坤两卦之后的第一卦，故云“刚柔始交”。“刚柔始交”犹如天地始生万物，尚未得通畅，故云“难生”。“动乎险中”，屯之下卦是震，震的性质是动；上卦是坎，坎的性质是险。震动而向上，恰遇坎险。既动而遇险，故有屯难之义。这两句话是解释卦名的。“大亨贞”，自此以下释卦辞。“大亨贞”表示屯卦既有屯难之义，也有大亨之义。\n“雷雨之动满盈，天造草昧，宜建侯而不宁”。“雷雨之动满盈”，是大亨之象。屯在乾坤始交之时，处于郁塞未通的状态。然而震有雷象，坎有水象，随着时间的推移，雷雨毕竟要降临，阴阳毕竟要和洽。雷雨充满天地之间，万物欣欣向荣，一派生机，岂有不大亨之理！“天造草昧”，“天造”谓时运，“草昧”是混乱不明，没有秩序。“宜建侯而不宁”，国家处在草创之时，当务之急是建侯即立君，建立统治。但不可以为立了君就无事了，思想上还要忧勤戒慎，不遑宁处。","X.N":"云在雷上而未成雨，自是屯难之象。“经纶”，古人多作二词解，其实应该合起来看，它是一个词。“经纶”就是治理。君子学了屯卦，要用屯卦的思想作指导，去治理国家社会。","Y1.N":"磐即盘。盘桓，难进貌。初九是阳爻，阳爻是刚明之才，刚明之才而居下位，在屯时，实未便前往济屯之难，故盘桓不前。假如不盘桓而遽进，势必遭逢险阻。所以，此时最好的办法是居贞，居贞即守正。人处屯难之中，唯其能守正，方可度过屯难。所谓盘桓不进，并不是一无所为。这时唯一可做而且不可不做的事情是“建侯”。","Y1.XN":"初九盘桓，不是不想进，而是迫于形势不能进。虽然不进，但其志则在行其正。\n《易》以阳爻为贵，以阴爻为贱。初九是阳爻，有刚阳之才，于屯难之时竟能自处于众阴之下，是“以贵下贱”，所以能受到拥护，大得民心。","Y2.N":"这一爻总的意思是盘旋磐桓，犹豫不前。屯与邅都是盘桓不进的意思。如，语辞。《易》中凡重言如字的，皆取两端不定之义。乘马，上马欲行；班如，下马不进。“乘马班如”，意欲行而未遽行。“匪寇婚媾”，意思是说倘非初九侵逼六二，六二便前去与六五婚媾了。亦含有欲行而不得行之意。“女子贞”，六二是阴爻，故可称“女子”。六二阴爻居阴位，居中且得正，所以叫“女子贞”。字，字育，即生育。不字就是不生育。六二居中得正，作为一个女子，该生育却不生育，恰是屯难之象。古人把十看作小盈，把万看作大盈。“十年乃字”，是说六二这个“女子”处于屯难之时，目前不能生育，到了一定的时候才能生育。","Y2.XN":"六二所以有难象，由于它居初九阳爻之上，为刚阳所逼迫。女子生育是正常的，不生育是不正常的。六二居中得正，本应顺利，顺利才是它的正常状态。现在不正常，终究要正常，犹如女子暂时不生育，将来毕竟要生育一样。","Y3.N":"即鹿，就鹿，也就是逐鹿。虞，虞官。无虞，狩猎时无虞人引导。几，几微。舍，停止。吝，与悔相对应。悔属阳，属刚，属动。吝属阴，属柔，属静。刚过为悔，柔过为吝。凡事做过了头，发生错误，便生悔。既悔必吝。吝是失误之后接着产生的委委琐琐的消极状态。\n古人狩猎，必有虞人设驱逆之车将禽兽赶到田野里，然后有所获。若逐鹿而无虞人，则鹿必逃入林中，人无法捉到它。君子遇到“即鹿无虞”的情况，预见几微，认为不如干脆立即停下来。假若一定去干，必陷入吝穷的境地。\n屯之六三为什么会有“即鹿无虞”的处境呢？从卦位来看，一卦之第三爻，不居中，又在上下之交，内外之际，处境最难。屯卦六三以阴爻居阳位，不中又不正，且处震之极，无上之应，本应守静以待，但它居震之极，本性决定它必然化伥然欲动而有所贪求。","Y3.XN":"从，从欲。“从禽”，贪禽，心在乎禽，为禽所蔽。“即鹿无虞”，是因为心里只想得到禽。虽无虞人指引，也要漫往而求之，不知道这是不可行的。犹如人看见利禄就动心，不该求也要求。“君子舍之”，君子是不干这种事情的。在没有虞人的情况下，即使看见鹿，也不去捕，因为那样做的结果必然是吝而困穷。","Y4.N":"六四以阴爻居近君之位，得正，且与九五相得，但它是柔顺之才，缺乏独自度过屯难的能力，应有待而行。所以“乘马班如”，表现出欲进不进，进而复止的样子。六四与初九正应，是已之婚媾。若能求初九往与共辅九五，阳刚中正之君，则吉而无所不利。","Y4.XN":"六四自知力量不足以济屯难，乃往求贤者初九的合作，这是明智的表现。","Y5.N":"膏，膏泽。“屯其膏”，是屯积膏泽而不下施。九五阳爻居阳位，守中居正，处境本来是优越的。但是它处屯难之时，在坎险之中，乘阴爻之上，无得力之人辅助自己，甚乃与外界隔绝，难于有所作为。这就叫“屯其膏”。欲摆脱这种困境，最要紧的是稳健。问题要逐渐地解决，困境要逐渐地摆脱，这叫小贞。小贞才有成功的可能。步子迈得过急过大，急于求成，这叫大贞。大贞，必然归于失败。","Y5.XN":"屯其膏，是怎样一种状态呢？是有德泽，未能发扬光大。","Y6.N":"“乘马班如”是进退犹豫的意思。屯卦二、四、上三爻都说“乘马班如”，但意义有区别。六二与六四之“乘马班如”，都是有所等待的。上六则不然，上六居屯卦之终，处坎险之极，正是屯极当通的时候。但上六是阴爻，与六三又非正应，它没有能力摆脱困境，变屯为通。因此而悲伤至极，哭泣不止，以至泣血涟涟不已。","Y6.XN":"“泣血涟如”的局面怎么能够长久呢？要么屯极而通，要么归于彻底灭亡，二者必居其一，不容更作等待。","Z":"屯卦之屯难不通具有普遍意义。上自国家社会之大局，下至平民百姓之细事，都有遭逢屯难的可能。普遍性中又有特殊性。特殊性表现在六爻上。同是处在屯难的状态，各爻有各爻的情况。初九自为初九之屯，其德可以有为，而时机未到。六二自为六二之屯，其时多艰，最宜等待。九五自为九五之屯，膏泽未得远施，宜渐进不宜急进。其余三爻亦莫不如此。六爻同在屯卦，皆具屯卦的基本特点。六爻所处爻位各异，各爻又各有自己的具体特点。"},"04":{"P":"屯卦之后是蒙卦。屯卦之后为什么是蒙卦？蒙的含义是什么？据《序卦传》说，“屯者，物之始生也。物生必蒙，故受之以蒙。蒙者蒙也，物之稚也。”屯、蒙二卦相邻是有意义的。物始生之后，必处于稚小的状态。稚小的特点是童蒙未发。蒙，就是蒙昧，就是不明。不是物的本体不明，而是物由于受到什么东西的掩蔽而造成的不明。很像镜子之蒙垢，眼睛之蒙翳，若将垢和翳去掉，其本体是明的。蒙卦所强调的是如何启蒙，如何教育的问题。古人说，屯卦取建侯之义，“作之君”，蒙卦取求我之义，“作之师”，是有道理的。\n从卦体看，蒙之为卦上艮下坎。艮为山为止。坎为水为险。上下合而观之，便有山下有险，遇险而止，泉水始出，未有所之之象。这很像人或物之始生，稚小蒙昧，去向未定，所以叫做蒙。","G.N":"蒙，人或其他生物始生，处于童稚状态，蒙昧不明，仿佛它受到掩蔽。但它是能够明的，它必将得到启发，由不明变为明。亨字以下是讲发蒙的基本途径。“我”，在卦中指九二而言，九二是发蒙者。“童蒙”在卦中指六五而言，六五是蒙者。发蒙者与蒙者的关系亦即教育者与受教育者的关系，二者是问题的关键。强调“童蒙”求“我”，实质上等于说，教育的成功与否，主要看受教育者的主动性、积极性。这与《论语》“不愤不启，不悱不发”的思想是一致的。“初筮告，再三渎，渎则不告”，是用占筮作比喻，进一步强调受教育者求教于人，要有至诚之心。“利贞”，是说发蒙者应该守正，不可以邪道发蒙。","T.N":"“蒙，山下有险，险而止，蒙”。这是用卦象解释卦名。内卦是坎，坎为险，险则不可处。外卦是艮，艮为山为止，止则不宜前进。这种不宜处亦不宜进，不知所当为之象，具有昏蒙之义，故取名为蒙。\n“蒙，亨。以亨行，时中也”。自此以下文字是用卦体解释卦辞。蒙与亨是相对立的概念，但是蒙之中包含有亨的意义。因为蒙不能终蒙，它归根结底要被开发，由蒙达到亨。行是对止而言的，既因有险而止，则亦必因有亨而行。时止则止，时行则行。这就是时中。蒙卦为什么有遇险而止之象，同时又有以亨而行之象呢？是因为卦中有时中之义。时中之义，从卦位上表现出来。时中系指九二而言。九二得六五之正应，是谓时。九二又居下卦之中，是谓中。\n“匪我求童蒙，童蒙求我，志应也。”“童蒙”是六五，“我”是九二。不是九二求六五，而是六五求九二，这是因为“志应”。“志应”该怎样理解呢？应理解为二、五两爻相“应”，不是单方面的“应”。六五应于九二，“童蒙”求于“我”，这当然不成问题。但是也要看到，九二应于六五，“我”应于“童蒙”的因素也是存在的。教者虽不先求于学者，但是他必有乐教的精神和志愿，感发学者，学者方能向他求教，志应于他。没有感，何有应，“志应”必是相互的。\n“初筮告，以刚中也。”“初筮”比喻学者初次来求，抱着诚敬之心，求决其惑，教者当告而启发之。“初筮告”，谁来告呢？蒙卦四阴爻都是蒙，二阳爻是治蒙者，但上九刚而不中，只有九二刚而居中，有能力启蒙。\n“再三渎，渎则不告，渎蒙也。”蒙有亨之道，蒙终必亨。亨就是蒙被开发。发蒙要有发蒙的条件。这条件就是上文讲的志应与时中。志应而发，必一发而亨，这就是时中。若志未应而遽欲亨，必告而不发，以至于再三来求。再三来求，表明蒙与发蒙者实际上志未应。志未应而求而告，是违背时中的。违背时中的求和告，便是渎。渎，狎也。狎是严肃的反面。不严肃的筮，神不告。同样，学者不严肃的求，教者也不该教。否则就是“渎蒙”。“渎蒙”，从表面上看，似乎是蒙来渎发蒙者，其实不然。再三来求而再三告之的结果，蒙不但未得开发，原有的素质反而有可能被搞乱，受害的不是发蒙者，而是蒙，故云“渎蒙”。\n“蒙以养正，圣功也。”蒙需要得到养，方能保持它的天真纯正的品性。养蒙，这是圣人之功，不是一般人能做到的。养蒙与发蒙，含义是一致的，而养蒙包含略广一些。对于蒙，最理想的作法，莫过于时其可发而发之，不可发而置之，养其本质，待其自胜。为急于发蒙而凿竅的作法，是要不得的。","X.N":"泉出山下，出而遇险受阻，犹如人之初生，处在童稚阶段，未知所适。此昏蒙之象，故曰蒙。君子学此卦以致用，主要应该果行育德。泉水始出，微细迟缓，但其行果决，虽险不避。山是静止的，泉水自山下涌出，无有穷尽。君子的行动要像水之必行，果决不疑，君子之修德要像水之有本，根底深厚。","Y1.N":"初六是阴爻，且居于下，所以这里所谓“发蒙”之“蒙”，可以理解为社会下层群众。发下层群众之蒙，有利的办法是“用刑人”。“用刑人”，就是制定明确、适当的法规，晓示群众，使之有所约束，有所戒惧，不敢恣肆妄为，然后逐渐引导他们接受教化。“用说桎梏”，说同脱，桎梏是束缚手脚的刑具，假使不采取“用刑人”的办法，一开始就去掉对他们的约束，使其无所戒惧，那结果就要吝了。","Y1.XN":"“利用刑人”的用意是什么呢？是“正法”。正法，是说把法规明确下来，使百姓都知道，让百姓在法的约束中逐渐受教化。","Y2.N":"初爻是概说治蒙的基本办法。三、四、五爻都是蒙者，是治蒙的对象。九二是治蒙之主。九二作为治蒙之主，它应该怎样呢？关键的问题是能够“包蒙”，“纳妇”。包，包容。九二作为治蒙之主，与六五相应，刚明居中，它应该发天下之蒙，将全社会的人都包容在自己的治蒙的范围之内。“纳妇”，从六爻来看，全卦只有二与上两个阳爻，九二刚居中，是发蒙者，是全卦之主，诸阴爻都愿意来归于它，它作为一个阳爻，也极愿意接纳她们。九二既如此有容量，又与诸蒙者有如“纳妇”一般志意相得，也像儿子为父亲克治家务一样，处卑位而任尊者之事，怎能不顺利地完成治蒙之事而获吉呢？","Y2.XN":"“子克家”，是因为“刚柔接”。刚，九二；柔，六五。“刚柔接”，二与五相应。九二之所以能够“子克家”，是因为作为父的六五完全信任他。","Y3.N":"六三是此卦四阴爻之一，在卦中是个蒙者。四爻致蒙的原因各异。初爻因未受教育而蒙，四爻因不学习而蒙，五爻因性质未开而蒙，都有客观上的缘故，唯三爻因主观上修身不济而蒙。所以爻辞告诫治蒙者说：“勿用取女。”六三是不正之女，不要取她。怎见得六三是不正之女呢？六三阴柔，不中又不正。她作为一个女子，本应等待与她正应的上九来求她，而她却见近旁九二这个美好的男子而动心，悦而从之，未能保有其身。","Y3.XN":"为什么要“勿用取女”呢？因为六三这个女子行为不顺，走了邪路。","Y4.N":"六四在此卦中处境最不好。它远于阳爻九二和上九，处于两阴爻之中，又无正应，没有与它亲比的阳爻来开发它，所以叫做困蒙。人处于困蒙之境，若居上位，必失道而寡助；若言学，则必孤陋而寡闻。吝，不足。这样的人是可鄙的。","Y4.XN":"阴为虚，阳为实。在蒙卦，阳刚是发蒙者。六四这一爻为什么会困于蒙而羞吝呢？主要的原因是它距阳刚最远，不能亲贤。","Y5.N":"六五以柔顺居尊位，又下与九二正应，本身有柔顺之德，又能任用有刚明之才的人，以此治天下之蒙，没有不成功的，所以吉。此“童蒙”一语之含义与卦辞“童蒙”，略有不同，卦辞只取蒙昧不明之义，此爻辞则取纯一未发而资于人之义。如果是个居君位的人，他便会做到以童蒙自处，纯一不发，充分信任贤明的臣下，依赖他们治理国家。","Y5.XN":"六五以童蒙自处，诚心求教于九二，吉。此童蒙之吉，是由于六五对九二的顺以巽的态度而得来的。顺，善于接受别人的意见；巽，善于把别人的意见吸取进来，变成自己的行动。顺与巽二者不可缺，犹如明君听取贤臣的教导，既要顺，也要巽。若顺而不巽，那就是从而不改了。","Y6.N":"蒙卦中的两个阳爻是治蒙的。它们治蒙有不同的特点。九二刚而居中，它治蒙的范围包容广大，治蒙的办法是宽的，所以叫“包蒙”。上九刚极不中，它所治之蒙，是昏蒙至极者，它治蒙的手段是猛的，所以叫“击蒙”。击蒙最为要紧的是掌握击的分寸、界限。击蒙必不可太深太过，目的要正确，方法要得当，理由要充分，这就能起到“御寇”的作用。若相反，击之过激过猛，结果很糟，则击蒙者本身就成为寇了。“御寇”好，“为寇”不好。","Y6.XN":"“御寇”是什么意思呢？上面没有采取过于暴烈的手段，却解决了下面昏蒙至极的问题，上下都是顺当的，这就是“御寇”。","Z":"蒙卦是讲教育的。蒙卦所讲的教育基本思想与基本原则主要反映在卦辞中。蒙卦六爻，两阳爻是治蒙者，四阴爻是蒙者。初爻与上爻相对待，初爻用刑以发蒙，上爻用兵以击蒙。二爻与五爻相对待，二爻为治蒙之主爻，包容广大而与五爻相接，五爻为童蒙而求教于二爻。二与五两爻的关系，是典型的教育者与受教育者的关系。三爻与四爻相对待。三爻由于自身的原因而致蒙，四爻由于处境不利而为困于蒙。三爻与四爻代表自暴自弃而不主动接受教育的人。"},"05":{"P":"《序卦传》说：“蒙者蒙也，物之稚也。物稚不可不养也，故受之以需。需者饮食之道也。”依《序卦传》的观点，蒙卦之后是需卦，实非偶然。蒙卦是说物始生之初，处于童蒙阶段，需要养育，所以需卦在蒙卦之后。养育之最大问题是饮食。需卦是讲饮食之道的。\n需字在古代是等待的意思。《左传》哀六年：“需，事之下也”。哀十四年：“需，事之贼也。”两个需字都当等待讲。不过《左传》以为等待不好，《易经》以为在一定的情况下，等待是必须的，好的。柳宗元文讲郭橐驼种树棵棵成活，硕茂早实，没有别的妙法，就是郭橐驼善于等待，种好之后即不再理它。不像有些人那样，生怕树长不活长不好，旦视暮抚，甚至“爪其肤，以验其生枯；摇其本，以观其疏密”。《史记》记曹参当相国无所事事，终日宴乐，而国家平静，生产发展。郭氏种树与曹参治国，事虽有大小，其道理则一致，他们不急于求成，善于耐心等待，其实正是需卦的思想。\n从卦体看，下乾上坎，乾有刚健之性，必然要前进。前进遇坎险而受阻，只能等待。","G.N":"需卦的基本思想是等待，但等待是有条件的。这条件就是有孚。有孚是诚信而充实于中的意思。欲完成某项事业，急躁冒进而不知等待不行，知等待却缺乏赖以等待的实力也不行。汉文景实行清静无为、与民休息的政策，也是一种等待。这种等待之所以得以实行并且取得成功，是因为汉高祖给他们在经济、政治诸方面打下了坚实的基础。从卦来看，中实有孚表现在九五这一爻上。需卦九五乃一卦之主爻。它刚健中正，坎体中实，且居尊位，有有孚得正之象。需，见险而等待，不是不能进，而是能不进。一旦前进，前途必光明而亨通。若能保持贞正，以正待邪，则将虽险无阻，无所不济。即便像涉大川那样的难关，也将突破无疑。总之，有孚，光亨，讲需的道路；贞吉，讲需的实现途径；利涉大川，讲需的效果。","T.N":"需卦的意思是须，须就是等待。需卦之所以有等待的意义，是因为坎在外，坎为险，挡住了内卦乾三个阳爻的去路，使之不能遽进，必须暂时等待。乾卦刚健，按其本性来说，它是要动，要前进的。但是它又能遇险而止，不轻动，不躁进，不陷于险。既能有所为，时行则行；又能有所不为，时止则止，是不会困也不会穷的。需卦为什么会至诚有孚，光明而亨通，守贞正而得吉呢？因为“位乎天位，以正中也”。卦之上五两爻是天位。九五以一阳爻居天位，又得正中，其位其德都十分有利。所以能镇静以待时。时机一旦出现，有所作为，有所前进，则一定取得成功。","X.N":"乾为天，坎为云，云在天上，尚未成雨，有须待之义。坎本为水，不说“雨在天上”，而说“云在天上”，是因为水在天上，只能说是云，不能说是雨。君子学习需卦，把需卦关于等待的思想应用到自己的事业上，就是要善于审时度势，在不该有所为的时候，不要有所为，而要饮食宴乐，积蓄力量。《易经》所说的饮食宴乐，其实是一种比喻，着眼点在强调人于须待之时应积蓄精力，切勿有所作为，与后世昏庸之辈耽于酒色的邪道根本不是一回事。","Y1.N":"在古代，一个国家里有国与野之分。郊以内为国，郊以外为野。郊处于国与野之间。这里讲“需于郊”，是借以比喻初九这个阳爻在需卦之初，距坎水之险最远，贸然涉险犯难的可能性最小。然而初九既是阳爻，有阳刚之性，极易一往无前，犯难而行，也就是最易失去需之常道。所以爻辞告诫说，初九处于郊，最为要紧的是能需，即耐心等待，坚持恒久不变。若能如此，便可无咎。","Y1.XN":"“需于郊”，需待于旷远之地，不到该进之时，不冒险而进也。“利用恒，无咎”，关键的问题是做到恒久不变，即永不犯难而行。这就是所谓“用恒”。“用恒”就是不失常。不失常，其实最难做到。因为刚健之人，或为才能所使，或为意气所动，或为事势所激，极易失去理智之控制，每每犯难而不顾，把事情弄糟。今人常语所云“坚持就是胜利”，与此爻小象之义略同。","Y2.N":"坎为水，水旁有沙，九二去坎险渐近，所以叫做需于沙。需于沙，谓近于险而未至于险。虽未至于患害的程度，但已小有言语之伤了。不过九二不为众言所惑，从容以待，终将得吉。","Y2.XN":"《说文》：“衍，水朝宗于海貌也”。段注：“引伸为凡有余之义。”这里的衍，是宽绰有余裕的意思。“衍在中”指九二而言。九二以刚居柔，且宽裕得当，虽小有言语之伤，亦可从容而待，不为所动，故必终得吉。","Y3.N":"泥，逼近于水。需于泥，虽未进至险难之中，却已濒临险难之边缘。寇，灾害之最大者。“致寇至”，九三过刚而不居中，而且处乾之上，与坎险切近，有招致寇至的极大可能。","Y3.XN":"外，外卦，即坎卦。九三虽切近坎卦，但毕竟不在坎卦，所以说灾在外。对于九三来说，灾既在外，则灾(即寇)有可能至，也有可能不至。寇至与不至，关键在于九三自己。假使寇果然来了，那便是九三自我招致的。九三该怎么办呢？九三应敬慎从事，量宜而进，待时而动，万勿急躁行事。","Y4.N":"血，阴属，有循分自安的特点。“需于血”，是说六四这一爻，阴爻处阴位，它也要取老老实实需待的态度。从卦体看，应该是需卦之内卦三阳爻需坎，而不是坎需内卦之三阳爻。六四亦称需，是因为三阳爻从容不迫，坎虽为险，事实上并不能奈内卦三阳爻何。又，六四柔顺得正，依其本性，它不至于与三阳作难。“出自穴”，六四离开自己所安之处，给三阳让开前进的道路。","Y4.XN":"九四之“需于血”，其意义主要有二，即顺与听。顺，九四顺于与它近比的阳刚中正之九五。听，九四听于内卦三阳之前进，不去拒绝它们。","Y5.N":"九五刚健中正而居尊位，最能反映需卦的意义，是需卦之主爻。“需于酒食”，是一种比喻。本义为主人具酒食以招待客人。引伸到社会政治上来，“需于酒食”便成为统治者治理天下国家的一种成功的办法。即所谓休养生息，使百姓乐其所乐，利其所利，自然而然地走上康乐的道路。屯卦讲治，蒙卦讲教，需卦讲养。养的意思在卦里用酒食表达出来。需卦的这个基本思想包含在九五这一爻中。以酒食养天下、国家，应保持一定的度，既不可过头，也不可胡来，即所谓贞正。贞正则吉，做不到贞正则凶。","Y5.XN":"此“小象”解释九五能够既以饮食宴乐涵养天下国家，又保持贞正而取得成功的依据。九五之所以能够贞正，宴乐不耽于乐，求治不急于治，是因为它处的地位既中且正，有德有权，虽在坎险之中，却也不至于沉溺。","Y6.N":"需卦二阴爻皆有穴象。六四“出自穴”，为下卦三阳之到来让路。上六已至坎险之极端，无处可退避，只能处于险境不动，即“入于穴”。这时有三位未召而来的客人(即下三阳)，对上六构成威胁。上六怎样对待呢？上六是阴爻且处险之终，它只有采取“敬之”的办法摆脱险境。“敬之”对三位不速之客，含辱，忍让，敬而待之，不与之争。上六唯有如此，方可化险为夷，从困境中走出。","Y6.XN":"此不当位，系指上六而言，非谓不召而至的下卦三阳。上六乃阴爻居阴位，实属当位。小象说“虽不当位”，这是什么缘故呢？小象说“虽不当位”是假设语。它的语意是这样的：对待三位不速之客的主要办法是“敬之”。只要做到这一条，无论发生什么事情，其最终结果一定错不了。即使上六不当位，也不至于出大问题，更何况它本来是当位的呢。","Z":"需卦提出一个极重要的人生与政治的哲理：无论国家或个人，遇险陷在前，要审时度势，该前进的固然应前进，暂时不该前进的，则要容忍待时，万万不可急躁骤进，否则必败。这个思想主要表现在刚健中正且居尊位的九五这一爻上。卦辞、彖传、大象讲的全是这个思想。同样面临险陷，而因时间、地点、条件不同，对待的具体态度也有差别。下卦三阳爻，共同的要求是切忌躁进，但初九需于郊，九二需于沙，九三需于泥，距离坎险有远有近，所取之谨慎态度也有重轻之分。六四与上六两爻处坎险之中，与其他四阳爻所处地位不同，但是此两爻爻辞所强调的，从根本上说，依然离不开需待的思想。"},"06":{"P":"讼，是与人争辩是非曲直而待人裁决，亦即诉讼的意思。《序卦传》认为，“饮食必有讼，故受之以讼”。人人需要饮食，饮食必然引起纷争，所以讼卦次需卦之后。这个理由显然是牵强的。但是《序卦传》提出卦的排列次序有其内在必然性的思想，则至为可贵。","G.N":"有孚，中实诚信；窒，窒塞，意不得伸；惕，戒惧谨慎，虽意有不得伸，但不一定强伸；中，和平沉静而不过激。一个人若中实诚信，遇有意不得伸的阻难，能够戒惧谨慎，能不争讼便不争讼，在迫不得已必须争讼的时候，也能保持冷静头脑，和平沉静而不过激，这样就可以获吉。一般人言讼以胜诉为吉，败诉为凶。《易》言讼，随所处论吉凶。若做不到“有孚窒惕中”，虽胜诉犹凶。卦名叫讼，不是鼓励人们争讼，而是希望人们息讼。息讼最好，迫不得已而讼，也以“有孚窒惕中”为吉。\n“终凶”，指上九。上九居讼卦之极，有终极其讼之象。依《易经》的观点，最好是无讼。其次是争讼虽起，但经过调解而中止。最不好的是坚持把争讼进行到底。大人指九五。九五刚健中正，居于尊位，是听讼之主。处于讼的时候，请一位德高尊重的权威人物来调停裁决，是唯一可行而有利的办法。\n讼与需两卦相反对，卦辞都说“有孚”，但需卦说“利涉大川”，讼卦说“不利涉大川”。涉大川是度过大险大难的意思。需卦坎在外，中实而安分、稳当，所以利涉大川，能够度过大险大难。讼卦坎在内，中实而不安分，有血气方刚，使气好胜之象，往往不能自我克制，所以不利涉大川，即没有条件战胜大险大难。","T.N":"讼卦为什么会有讼的含义呢？从讼卦的结构看，上卦是乾，乾健，下卦是坎，坎险。乾健遇坎险，是产生讼的基本原因。如果有健而无险，便不须讼；如果有险而无健，便不能讼。就两个人说，彼险而此健，必生争讼。就一个人说，内险而外健，亦必生内自讼。两人争讼或一人内自讼，都有讼的意义。\n讼卦“有孚窒惕中吉”，是由于“刚来而得中”的缘故。“刚来而得中”说的是九二这一爻。九二是讼卦之主，它以刚处中，有中实之象。因为九二有中实之象，所以才有“有孚”之义，才有窒塞惕惧之义，才有和平沉静而不过之义。卦之取义有多种不同的角度，有的取其象，有的取其爻，有的取其变，有的取其刚柔之相易即卦变。讼卦卦义主要取自九二这一爻。换句话说，九二“刚来而得中”，决定了讼卦的卦义。那么，为什么称九二为“刚来”呢？第一，在一卦上下二体之下体之某爻可以称“来”，第二，居下体之某爻必须是异类方可称“来”，就是说，下体如果是两柔爻一刚爻，只有那一个刚爻可称“来”。如果是两刚爻一柔爻，则只有那一个柔爻可称“来”。讼之九二居下体而且对于两个柔爻来说它又是异类，所以称“刚来”。这是就卦来说的，在爻则又当别论。不过，关于这个问题古人说法不同。朱熹《周易本义》据虞翻、蜀才(即范长生)之说，以为“刚来而得中”是卦变。他们认为，《易》中除乾坤两卦外，其余都是分别由复、姤、泰、否、大壮、观、夬、剥诸卦变来的。讼这一卦自遯卦变来。遯的第三爻降居二，第二爻进居三，亦即九三与六二倒换位置，便变成了讼。汉人提出的这种卦变说不是《周易》本来有的东西，是出于他们的杜撰，经不起推敲。所以宋人苏轼和程颐起而反对，同时提出自己的卦变说。苏轼的卦变说简单来说是这样的：一卦上下二体之一是三震、坎、三艮这三个阳卦中的一个，另一体是三巽、三离、三兑这三个阴卦中的一个。64卦中这样由一阳卦和一阴卦组成的卦共有18个。这18卦每一卦的阳卦原来都是坤，由于乾卦给了它一个刚爻，化掉了它的一个柔爻，而变成了或三震，坎，或三艮。这18卦中每一卦中的阴卦原来都是乾，由于坤卦给了它一个柔爻，化掉了它的一个刚爻，而变成了或三巽，或三离，或三兑。这18个由一阳卦和一阴卦组成，有刚柔相易现象的卦，有卦变问题，别的卦没有。根据苏轼的说法，讼不符合卦变的条件，它没有卦变的问题。苏轼的《彖传》研究出来的，正确可从。在贲卦《彖传》解里卦变说将详细介绍。\n“终凶，讼不可成也”。讼是不得已而为之的坏事情。讼事既已开始，则应见伸则已，不可终极其事。一定要终极其事，则必凶。“终凶”在卦中指上九而言。\n“利见大人，尚中正也。不利涉大川，入于渊也”。争讼之事最要紧的是求得公正的裁决，即尚中正，所以利见大人。大人在卦中指九五而言。九五刚中居正，堪当此任。又，争讼应以理胜而不以力争，以自处平安之地而不涉险难为宜，否则犹入深渊，不得回旋，故云“不利涉大川”。","X.N":"天上行，水下行，天水方向相反，其行两相背戾，这是相争讼之象，所以此卦名讼。君子从这一卦中能够得到什么启发呢？卦辞只讲中吉、终凶，大象补出“谋始”二字，要求人们做事一开始就注意理顺各种关系，从根本上杜绝讼端。","Y1.N":"初六以阴爻居下位，柔弱而难胜。事，讼。这里称事不称讼，因为事方在初起，尚未成讼。如果能“不永所事”，虽已有了一些问题，造成一点小的危害，最终还是吉的。","Y1.XN":"初六柔弱，就其条件来说，它不能讼。而今被迫而讼，最有利的办法，是不把讼事长久地进行下去，否则不但不会胜诉，且患难将至。虽然小有言已不可免，但最终将得吉，这主要因为毕竟是小有言，彼此容易解释，略与之辩，辩明即止。","Y2.N":"九二以刚处险地，为讼之主。九二与九五为二阳爻，两刚不相与而相讼。但九五以阳爻居阳位，居君位而中正，九二当然不是九五的敌手，它与九五之讼根本不能进行。最好的办法是隐退，逃到自己的只有三百户人家的小邑里去藏起来。如此，尚可免灾无事。","Y2.XN":"九二自知不能与九五争讼，乃逃窜以免祸。因为地位卑下的人与位尊势高的人争讼，祸患将如伸手取物那样立刻降临。","Y3.N":"六三阴柔，与初六一样，都不是能讼的。初六虽讼而不永。《易》作者有勉励人无争讼的思想，所以两阴爻都得终吉。旧德其实是旧禄。贞谓坚固自守。厉谓处危境。从王事无成，谓从上九，而不以成功自居。六三处九四与九二之间，乘刚又承刚，但处危境而知畏惧，安分自守，与人无争，所以得终吉。","Y3.XN":"六三当争讼之时，处乘承二刚之危境，而能保持旧禄不失，主要的原因在于它能够从上随人而动，不自主事。","Y4.N":"即，就。命，正理。渝，变。九四以刚健居不中不正之地，按其本性说，是好讼的。但是它没有争讼的敌手。九五君位，不可与之讼。六三阴柔而居下，不至于生讼。初六与九四正应而顺从，不能与之讼。左右前后都没有可与之讼的对象，九四虽欲讼而无由讼，所以“不克讼”。在这种情况下，九四若能克服躁动欲讼之心，复就正理，变其不安贞为安贞，则必然得吉。","Y4.XN":"九四本为欲讼好胜之人，而终于采取理智的态度，反就正理，变不安贞为安贞。这是不失理的表现。不失于理就是吉，失理就是凶。《易》讼不以胜负为吉凶。","Y5.N":"九五在君位，是治讼的人。治讼治得好，是非枉直，论断公正，至于百姓逊路而息争。这是尽善尽美，无可挑剔的大吉。","Y5.XN":"九五为什么治天下讼而能得元吉呢？根本的原因是它居中得正，无偏无私。以中正的态度论断曲直，中而不过，正而不邪，故得无吉。","Y6.N":"讼卦初爻无讼字，此上爻亦无讼字。初爻无讼字，杜讼之始；上爻无讼字，恶讼之终。其中体现了作《易》者反对争讼的思想。上九以阳居上，处于有利的地位，它是逞刚强，一定要把争讼进行到底的人。这样的人一般来说没有好下场，总要惹祸丧身的。即使退一步想，它善讼能胜，甚至于受到鞶带服命之赏，结果也无法保住，必终朝而三次被褫夺。","Y6.XN":"人以穷极讼事而受到服命之宠，是不光彩的，令人憎恶的。","Z":"有一个思想贯穿全卦，就是争讼是坏事，不争讼最好。九五君位居中得正，无偏无私，终能平息天下之讼。初六阴柔，阴柔者不讼，所以初六不永所事。六三亦阴柔，所以唯食旧德而已。九二、九四都是阳爻，虽有争讼之性，但二与五对，自度不可而不讼。四与初对，考虑于理不顺亦不讼。独有上九，处卦之极，与六三对，六三柔弱，不能抵抗，所以上九有胜讼之可能。纵然胜诉，乃至得到服命的赏赐，终亦不免骤遭褫夺之辱。"},"07":{"P":"师就是众，众就是兵。古代国家不设常备兵，寓兵于农，兵农合一。平时耕田，战时集中起来就是兵众，兵众拉出去就可以打仗。师卦的师正是讲如何兴师动众，出兵打仗的。若细分的话，师包括两层含意：一是兵员的集中，组成队伍；二是采取军事行动。\n这个意思从师卦的卦象上可以得到说明。从内外卦的卦体看，水在下，地在上，地中有水，是众聚之象。从内外卦的含义看，坎险在内，坤顺在外，顺行险道，有行军打仗的意思。从六爻看，一阳爻五阴爻，一阳爻在下面为众阴爻之主，有将帅统兵之象。\n师卦列讼卦之后，依《序卦传》的说法，是有其内在原因的。争讼的结果必然造成兴师动众。战争总是由平常的争讼引起的，所以讼卦之后列师卦。","G.N":"贞，正，是说打仗的目的要正确。丈人，才能、谋略、品德和事业都为大家所敬畏的人，是说打仗要选择这样的人做统帅。“吉无咎”，是说解决好这两个问题，打仗才能既取胜又得人心。师卦讲战争主要是讲这两条。《易》作者认为，兴师打仗，最要紧的是把握战争的性质和确定统帅人选。这个思想，即使从现代看，也是可取的。","T.N":"《彖传》的前一段“师，众也。贞，正也。能以众正，可以王矣”是解释卦辞的。以，有左右的意思。意思是说能够左右兵众，使兵众心悦诚服地听从指挥，进行正义的战争。若做到这一点，就可以王天下了。\n《彖传》的后一段，是以卦象解释卦辞“吉无咎”一句。“刚中而应”指九二与六五而言。九二乃阳刚居中，象师众之统帅。六五阴爻居君位，象君。九二与六五正应，象师众之统帅得到君上的完全信任，其才能必得到充分的施展。“行险而顺”，上卦是坤，坤即顺；下卦是坎，坎即险。坤顺象以正义行师得人心，坎险象兵凶战危，所以是险。合起来说，兴师动众，必然毒害天下，但是师以顺动，打仗是为民解除苦难，所以民是欢迎的。胡炳文说：“毒之一字，见得王者之师不得已而用之，如毒药之攻病，非有沉疴坚症不轻用也。”","X.N":"师卦上坤坤为地，下坎坎为水，有地中有水，水聚地中之象。君子学习这一卦应当懂得容民畜众的道理。古代兵农合一，平时秉耒耜的农夫，战时就是执干戈的士兵，所以容民畜众成为讲求军事的重要内容。","Y1.N":"律，纪律。否，不。否臧，不善，是以律的反面，亦即失律。出兵打仗，一开始就要强调纪律，如果做不到这一点，或者做不好这一点，结果必凶。初六阴柔居下，很容易做不到“师出以律”，所以爻辞有“否臧凶”之戒。为什么“师出以律”不说“吉”，而“否臧”则言“凶”呢？因为“师出以律”只是取胜的前提条件，不是唯一条件，不能据此判断胜负，所以不言“吉”。可是若师出不以律，则吃败仗是肯定无疑的，所以“否臧”言“凶”。","Y1.XN":"“失律”就是“否臧”。“师出以律”乃用兵之常，必须如此。是胜是败，是吉是凶，尚难断定。若失律，则必败，所以言凶。","Y2.N":"这一爻讲的是怎样当好统军之将帅。师卦九二居下卦之中，是一卦之主，为众阴爻所归，又与居君位的六五是正应。这极像政治生活中的统军将帅。统军将帅受君上的委任派遣，在外作战，有专制之权。“在师中”这个“中”字应当理解为统帅与君的关系。统帅在外，不专制，不能率军作战取胜；过度专制，则失为下之道。在师专制而得中道故吉而无咎。吉无咎，则必成功，所以能得到王之“三锡命”。周礼，一命受爵，二命受服，三命受车门。“三锡命”是最高的奖赏。本卦卦辞“师贞丈人吉无咎”同本爻爻辞“在师中吉无咎”思想是一致的。","Y2.XN":"孔子作“小象”，更深一步地把爻辞中包含着的哲学思想和政治思想推阐出来。将帅统兵在外，其所以能够做到“在师中吉”，是因为他受到了王的宠信、支持。其所以受到王的宠信、支持，是因为他做到了“在师中吉”。王为什么“三锡命”，给取得战功的将帅以最高的褒奖呢？不是为了好大喜功，是为了怀绥万邦，行仁政于天下。此与卦辞“师贞丈人吉”的思想是吻合的。“师贞”是说出师出于正义，“丈人”是说选择合格的，即“在师中吉无咎”的统帅。","Y3.N":"六三在九二之上，以柔居刚，不中不正。极似一个才弱志刚的人在军中挠权债事，躐位侵主将统军之权，造成任不专一、政出多门的局面。军队在外作战一旦遇此情况，必败无疑。本爻的“师或舆尸，凶”反映的正是这个问题。舆，众；尸，主。“师或舆尸”，是说像九二那样主将有权有威，固然理想，但是军中如果发生“舆尸”的情况，即事权不统一，结果一定是极糟的。","Y3.XN":"“师或舆尸”，必然导致大无功。这是战争中可能出现的最坏的情况。","Y4.N":"此爻实际上是强调作战指挥上的灵活性。古代兵家尚右，以右为前，以左为后。据《左传》，师一宿为舍，再宿为信，过信为次。左次，师后退驻扎。六四以柔居阴，自知一时无力前进取胜，乃因时制宜，知难而退。既可保存自己的实力，又可静观变化，伺机进击。这样做，虽然看来暂时无功，但是毕竟无怨咎，而且随时可以转退为进，夺取胜利。","Y4.XN":"依常情说，出师的目的是击败并消灭敌人，欲消灭敌人，必须进击。但是在一定的情况下，当进击不利的时候，就要采取退舍的策略。主将善于适时应变，不拘一揆，似乎失常，其实没有失常，因为指挥打仗本来就应该灵活多变。","Y5.N":"六五阴柔居君位，与九二正应，是兴师用兵之主。它主要决定两点。一点是出师有名无名，正义还是不正义。另一点是选择什么样的人做统帅。这是战争中最重要最基本的两条。本卦卦辞和九二爻辞讲的都是这个问题。现在六五爻辞还是讲这个问题。可见《易》作者对军事问题的认识已达到相当深刻的水平。禽，禽兽。言，虚词。“田有禽”，禽兽进入田中，侵害稼穑。“利执言，无咎”，把进入田中的禽兽拿住，是应该的，必要的，没有过错。比喻敌人来犯我土，我被迫起而应战，出师有名有义，理所应当。“长子帅师，弟子舆尸，贞凶。”长子指卦中九二，弟子指六三、六四。六五作为王或诸侯，如果既委德才足以率众的人帅师出征，又派庸才小人参知军事，纵然师出正义，也不免覆败。","Y5.XN":"长子指九二，九二阳刚居中，以中行师，善于指挥。六五作为君上，任使它做统帅，是正确的。既用长子帅师，又任用“弟子”六三去分“长子”的权，责任在六五，六五用人不当。","Y6.N":"这一爻的爻辞系就全卦而言，与本爻爻象无涉。大君指六五，上六奉命而行黜陟。“开国承家，小人勿用”，应是“大君有命”的内容。战争胜利，论功行赏，功大者封国为诸侯；功小者承家为卿大夫。体现了严格的等级差别。在论功行赏当中，贯彻一条原则：“小人勿用”。其实师卦从初始到上终，一直强调用君子不用小人。不过到了大功告成，以爵命赏功臣的时候，更要谨慎小心，不可授小人以参与国政的机会。","Y6.XN":"正功，言赏与功相当。功大的大赏，功小的小赏，无功的不赏。师卦一开始就强调不用小人。但退一步考虑，即使小人立了战功，要给予一定的奖赏，却也绝不让小人开国承家，有掌权的机会。否则必然亡国倾家，后果不堪设想。","Z":"师卦是讲战争理论的。古代所能认识的关于战争的几个重要问题，它都深刻地论述了。如“师贞”、“田有禽”讲战争的正义性；“丈人者”、“长子帅师”讲选择军队统帅的重要性；“师出以律”讲丧失纪律的严重性；“弟子舆尸，贞凶”讲指挥权不集中的危害性。“师左次，无咎”，“在师中，吉”，讲将帅指挥战争要有灵活性。此外，师卦从始到终都体现了一个原则：用君子勿用小人。"},"08":{"P":"比字《说文》释“密也”，段注谓比字本义为“相亲密也”。《周易》程传释“比，亲辅也”。用今日语言说，比的意义主要讲的是人际关系。不过古人不懂得人与人之间的关系主要的、基本的是经济关系即人们在生产活动中结成的关系，所以《易》比卦中讲人际关系只讲政治关系，在政治关系中又侧重讲统治与被统治、上与下、尊与卑的关系。\n从卦象来看，比卦与师卦正好相反。师卦是上坤下坎，水在地中，有容民畜众之象。比卦是上坎下坤，水在地上，有亲比无间之象。所以此卦名比。比卦为何次于师卦之后？《序卦传》云：“众必有所比，故受之以比。”","G.N":"《杂卦传》说；“比乐师忧。”比讲人与人之间如何相亲比，在古人看来，天下之吉莫吉于比，所以比卦直言吉，以为比卦不是哪一爻吉，全卦都是吉的。“原筮元永贞，无咎”。原，再。原筮，言比要再三详审、考察之意。64卦只有比卦与蒙卦言筮。蒙卦强调初筮，因为蒙者求师，贵在专诚，再三则不专诚。比卦强调原筮即再筮，因为求与人比或为人所比，贵在谨审，初筮而不再三，则不谨审。无论初筮还是原筮，都是比喻而已，说明求师要专诚，比人要谨审，并非实用蓍龟。比卦所谓谨审包括两个方面：一方面是上之比下，例如最高统治者天子之求天下人都来亲辅自己。另一方面是下之从上，例如诸侯方国以及一切人等之比辅天子。无论哪方面，都要谨审地考虑是否元永贞。元是善，永是久长，贞是正。只有符合元永贞三者才能比而无咎。\n“不宁方来”这个“不宁方”古人理解多误。《周礼·考工记·梓人》说：“毋或若女不宁侯，不属于王所，故抗而射女。”孙诒让《周礼正义》说，“不宁侯谓不安顺之诸侯。易比卦辞云不宁方来，义与此同”。“不属于王所犹言不顺命于王所也。王所谓王所居之处，通王都及巡守朝会之地言之。属犹朝会也”。孙氏的解释，正确可从。“不宁方”就是“不宁侯”，“不宁侯”就是不朝王所、不安顺的诸侯。“不宁方来”，不朝王、不安顺的诸侯现在也来朝王所，也安顺了，说明天子已经做到元永贞了。“后夫凶”，夫谓刚强自立的人，是柔弱者的反面。天下诸侯方国都争先比辅于王，还有少数的人落在后面，不来朝王所，对于这样的人来说，结果肯定是不妙的。","T.N":"朱熹《易本义》疑“比吉也”三字是衍文，可从。“比辅也，下顺从也”，“下顺从也”是解释“比辅也”的。比当辅字讲。辅是车两旁之木。辅与车必然相亲比，不可分离。从卦位看，就是“下顺从”也。“下顺从”指下四阴爻亲比在上之九五。九五象车，四阴象辅。《周易》之内卦外卦多取阴阳正应。其两爻靠近而相得叫做比，但是靠近之两爻也有不相得的。不相得就不为比。比卦特殊，比卦诸爻不论内外应与不应，九五以下四阴爻都与九五亲比。64卦中一阳五阴之卦有六，只有比卦一阳居君位为九五，下面四阴都来顺从它。\n“原筮元永贞，以刚中也”。卦辞言“原筮元永贞，无咎”是泛指全卦说的。但比卦之主爻是九五。无论怎样说，“原筮元永贞”总要落实到九五头上。就是说，九五居尊位，它要谨慎审度，做到元永贞，天下人方能来亲比于它。诸阴爻代表天下人，是否来亲比，要看的也是九五做到没做到“原筮元永贞”。《彖传》则明确指出“原筮元永贞”就是言九五。九五肯定会做到“原筮元永贞，无咎”，正是因为九五阳刚而且居中得正，有刚中之德。然而唯比卦之九五如此，它卦之九五则不必同。\n“不宁方来，上下应也”。原来不安顺、不来朝的方国诸侯，现在也来归顺亲比了，这是什么原因呢？“上下应也”《易》之应字多谓上卦与下卦刚柔两爻相应。这里的应字包括上六在内的五阴爻应于九五，与它卦不同。所以叫“上下应”。所有的阴爻都应于九五一阳，即天下一切人等都来亲比于天子，则“不宁方”自然也来了。\n“后夫凶，其道穷也”。“后夫”于卦中指上六而言。上六代表那些应该来亲比，也有意来亲比，却又迟迟不见诸行动的人。这样的人，不识大体，自然不会有好结果。“其道穷”，意谓其结果必然穷蹙不堪。","X.N":"从卦象看，坤下坎上，地上有水，水地和合，不可分离，有亲比之象，所以叫比。先王观比卦之象，以建立万国，亲抚诸侯。此卦“建万国，亲诸侯”与屯卦的“利建侯”不同。“利建侯”所说的是一个部落、方国内部自己选立酋长或国君。比卦“建万国，亲诸侯”所说的乃是天子封建众诸侯国，并通过封建诸侯以亲比天下。此卦大象与《彖传》所言也有区别。彖传所言为卦中五阴主动与一阳亲比，大象所言乃卦中一阳主动与五阴亲比。","Y1.N":"孚，信在中心。缶，质素无纹饰的容器。初六是比之初始。与人初亲比，最重要的是中心诚信，取得人家的信赖。能够如此，则比人或为人所比，便必将顺畅无阻。若能够诚信充满于内，像装满东西的缶那样，内充实而外无纹饰，达到满腹皆诚的程度，则不但可以无咎，且终究会得到它吉，即得到本非自己应得或非期于必得的好处。这从卦象上可以得到解释。初六不与九五应，且与九五相距最远，但因中诚有信而求比于九五，终必有它吉。大过卦之九四，中孚卦之初九，爻辞中都有“有它”，是戒其有它向之心，此卦初六之“有它”是赞许其有它至之吉。","Y1.XN":"此孔子所作“小象”，以“比之初六”四字概括全部爻辞，寓意深刻，尤其在“初六”之上安排一个比字，更见意全。它强调了三点：一，比的要害在于初始；二，初始的关键在于诚信；三，初始诚信，最终方能获致它吉，若诚信非起于初始，则无它吉可言。","Y2.N":"《易》有内卦外卦之分，始见于此。六二以阴居阴，处中又得正，与九五为正应。二者以中正之道相比，自非一般的比。由卦象看，六二自内卦与外卦之九五比，所以叫做“比之自内”。“贞吉”的意思是说吉与不吉是有条件的。这条件就是贞与不贞。贞则吉，不贞则不吉。贞即正。与人亲比，坚守正道，则必得吉。","Y2.XN":"“小象”认为，当六二自内卦与外卦之九五相比，自己决定比不比，几时比，怎样比的时候，重要的问题是自己如何掌握适当的分寸，使不出现自失的状态。就古代社会的实际情况说，一个士人，应该修身正己以待人之求，不要降志辱身汲汲以求比。历史上的伊尹、吕尚、诸葛亮的行径大概合于这个要求。这种思想恰是孔子“用之则行，舍之则藏”二语的另一种表现。","Y3.N":"《易》中“匪人”一词于此第一次出现。匪人，不是正派的人。这种人物，其类不一，但邪恶是其共同本性，古往今来无时无地不有，问题在于“我”与之比不比。若“我”与之比，则“我”必是“匪人”的同类。爻辞不言凶咎，是因为与邪恶之人亲比，不言凶咎而凶咎自明。九五中正居君位，为比卦之主，诸爻都该与它亲比，才是比得其人。初六居卦之始先，得与九五相比。六二与九五正应，得与九五相比。六四承九五，亦得与九五相比。唯有六三这一爻，自身阴柔不中不正，无由与九五比。三应上，它只能与上六比，而上六为比之无首者，所以叫做“比之匪人”。","Y3.XN":"六三阴柔不中不正，正人不与之比，与之比的是邪恶之人，其结果是可伤可悲的。言可伤可悲，则悔咎自不必说了。","Y4.N":"六四不与初六正应，而就近外比于九五。六二比自内，六四外比之。两爻皆以柔居柔，所以贞吉。六四贞吉，还有一层意义，即六四阴柔不居中，能比于刚明中正的九五，是为得正，得正而吉。这是由爻位上看。若从含义上看，六四比九五是比贤从上，比贤从上必以正道方可得吉。","Y4.XN":"贤与上皆指九五。九五有刚明中正之德，故称贤。九五居尊位，故曰上。六四外比于九五，是既比贤又从上，所以吉。","Y5.N":"九五居君位处中得正，诸阴爻都来求比于它，极似人君亲比全天下。人君亲比天下，采取的办法是显比。显是陷的反面。显比是尽善尽美的比，理想的比。它不私曲隐伏，它不偏不党，光明正大。“三驱失前禽，邑人不诫”，是一种比喻，用以揭示显比的具体意义。“王用三驱失前禽”，古代田猎，划一范围，一面置旃以为门，三面刈草以为长围。猎者自门驱而入，禽兽面向猎者而从门跑掉的，就任其跑掉，不予射杀。禽兽背着猎者，往里跑的，当然跑不掉，都加以射杀捕获。用这“三驱失前禽”作比喻，说明王者亲比天下，采取来者不拒，去者不追，不强求，无隐伏，一切听其自然的态度。“邑人不诫”，邑，居邑，王者之都城，诸侯之国中。邑人是王者近边的人。“不诫”，不相诫约。王者不因为邑人近则丁宁告诫而使来亲己。意谓王亲比天下，一视同仁，没有远近内外亲疏之别。","Y5.XN":"显比之所以能得吉，是因为九五处正得中。九五处正得中，不偏不倚，能够广泛团结绝大多数人，而不是只团结少数的人。“失前禽”，田猎时容许一部分禽兽从门跑掉。爻辞讲这句话是什么意思呢？舍逆取顺，王者亲比天下，听其自然，来者抚之，去者不追。从卦爻看，“失前禽”谓失上六，上六以阴乘阳，逆，不来亲比九五，九五听而舍之，这就是舍逆。四阴爻以阴承阳，顺，皆来亲比九五，九五取而抚之，这就是取顺。“邑人不诫”一语是说明“上使中”的。上谓九五。使，用。中，中平不偏，远近如一。王者之比天下，不因近者而亲，不因远者而疏，对待一切人，态度都一样，坚持中道，不偏不党。","Y6.N":"上六阴爻居卦之终，诸爻不来比它，它也不与九五比，故凶。“无首”是说开始不善，有问题。上六居卦之终，应该说“比之无终”，此何以言“比之无首”？这是因为，古人认为，比这种事情要在开始，开始搞不好，有问于“无首”。与其直言“无终”，不如穷根究源，言其“无首”。","Y6.XN":"爻辞讲“比之无首”，“小象”揭示上六讲“比之无首”的实质，不是真的讲“无首”，是讲“无终”。“无首”与否的问题是初爻的事情，本与上六无关，“小象”若不加以揭示，人们可能误解，以为上六真的与比之初始直接有关。“小象”在此这么一点，便将比之事最重初始的思想突现出来了。","Z":"比卦讲古代统治阶级如何亲比被统治阶级的问题。古人治国平天下，强调恩威兼济，即既用武力征服的一手，又用政治安抚的一手。师卦讲的是武力征服，比卦讲的是政治安抚。自卦而言，一阳爻五阴爻，阳爻九五为卦之主，它居中得正，五爻均应主动从九五。《易》中六爻贵正应，正应则吉。而比卦特殊，比之诸爻不论正应与否，专以比于九五为吉。九五阳刚居中得正，象统治者。统治者亲比被统治者，上级亲比下级，要有一定的原则和方法。《易经》非常强调统治者欲亲比天下国家，最要紧的是自我修养要具备元永贞三条。初六告诫比之事要在初始，初始之比贵在中心诚信。六二指出下比上应该坚守正道，切不可降志辱身汲汲以求。六三提出邪恶之人相亲比的问题。六四与六二义略同。九五是比卦之主爻，所云与卦辞相当，要求统治者亲比天下国家之人要光明正大，宽宏包容，来者不拒，去者不追，要中平不偏，亲疏若一，亲比尽可能多的人。上六重申比之道要在初始，初始不正，终必有凶。"},"09":{"P":"《序卦》：“比必有所畜，故受之以小畜”。人与人之间在发生亲比关系之后必然发生畜的关系。所以《易》比卦之后接小畜。强调卦与卦之间的必然联系，反映《易传》作者的辩证法思想，他认为64卦的排列，绝非偶然的堆砌。每一卦居某一位置，是有内在的原因的。畜当聚字讲，又当止字讲。其实在小畜卦里，聚止两义同时存在。从卦体看，小畜巽上乾下，乾乃刚阳在上之物而今居巽下，为巽所畜止，故曰畜。又为什么叫小畜呢？有两层意思。一是以小畜大，全卦为一阴五阳，六四以一阴爻居阴位，得正，上下五阳爻皆与六四应。《易》以阳为大，以阴为小。此一阴爻畜五阳爻，故曰小畜。又，巽顺畜刚健，是用柔顺即“小”的办法，不是用强力即“大”的办法，也是本卦取名小畜的一个因素。既然小畜以阴畜阳，采取的是阴柔巽顺的办法，则畜止必然是个慢过程，需要有时间创造条件，积蓄力量，不可急就速成。这就是说，小畜与需卦有近似之处。需是须，等待，小畜也有蓄积、等待的意思。二是三阳在下并进、六四以一柔顺之阴爻独当其路，就其力量来说，它所起的作用，所能达到的畜止的程度，肯定有限，故曰小畜。","G.N":"“小畜，亨”，小有所止而亦必有所亨。小畜能够制止某些小的过失，解决某些小的问题。暂时达不到目的，终究是能够达到目的的。从两个三画卦来看，健而能巽，不激不亢，虽暂时未通，而最终必亨。从六爻来看，九二与九五皆以刚健居中，同心同德，其志必行，必行则必通。“密云不雨，自我西郊”，古人解释纷纭，多不中肯。其实这两句话不过是打个比方，用这个大家司空见惯的天气现象比喻小畜这一卦的基本思想。小畜的时代，臣对君的过错，下级对上级的问题，用适当的方法批评、谏止，最终肯定达到目的，雨总是要降下的。然而目前不行，目前六四一阴尚未得到三阳的感应，下级的意见尚未得到上级的理解、赞同。好像阴云虽密布，无奈“自我西郊”，雨一时半晌下不来。“密云”为何“不雨”？因为“自我西郊”。“自我西郊”就是云被风从西方吹来。谚语云：“云行东，车马通；云行西，披雨衣。”吹西风的天气，雨难于降下。","T.N":"“小畜，柔得位而上下应之曰小畜”，这是解释整个一卦成卦之意义的。柔得位，指六四得位，六四以阴爻居阴位，又居上卦，所以叫柔得位。本卦只有六四一个阴爻，上下五个阳爻都来应它，它以一阴畜止五阳，必然力不从心，只能小有所畜，故曰小畜。“健而巽，刚中而志行，乃亨”，这还是从卦体看，但是角度变了。上面讲柔得位，阴畜阳，是从成卦之意义的角度出发的。这里讲健而巽，强调刚中而志行，则是就卦之才即功用而言。内卦是乾，乾健也。外卦是巽，巽顺也。不说乾而巽，不说健而顺，而说健而巽，是用互文法。健而能巽，是小畜卦终必能亨的一个根据。小畜能亨的另一个根据是“刚中而志行”。九二与九五，刚健居中，俱为阳性，依其本性来说，它们一定要前进。又，乾卦居下，必有上行之志。二五刚中必前进，乾卦居下，志在上行，所以畜虽小而能亨。\n“密云不雨，尚往也”，全卦的主旨是阴止阳，即六四一阴爻畜止其他五阳爻。但畜止是个阴阳斗争的过程，不会一蹴即就。《易经》作者是用“密云不雨，自我西郊”这一天候现象比喻小畜阴畜阳的这种斗争态势的。六四畜止下卦之三阳爻，尽管以巽顺柔之，毕竟斗争是激烈、艰苦的。斗争结果尚未分晓，斗争的一方三阳爻还在继续前行，阴畜阳的任务没有完成，犹如“密云不雨”。\n“自我西郊，施未行也”，施未行，谓斗争的主要一方六四，作用尚未充分发挥，这才是阳刚未被畜止住的根本原因，正像天空阴云密布而雨不降，是由于正吹西风一样。","X.N":"乾为天，健；巽为风，顺。巽以柔顺为能事，可以畜止乾健，但不能持久强固，所以曰小畜。君子观小畜一卦之含义，应该“懿文德”。懿，美。文德与道德相对待而言，即仪表、气度、言语、修辞之类。“懿文德”，有细行必矜，独善其身的意思。","Y1.N":"复的意思是返于本位，即原本在什么地方，现在还返回什么地方。小畜卦的卦义是以阴畜阳，而爻义却正相反，它不受阴所畜。初九以阳居阳，位居最下，为阴所畜，今自知不宜急躁冒进，乃潜伏于下，复其本位。初九如此慎重行事，哪里还会有什么过错呢？没有过错便是吉。","Y1.XN":"初九与六四为正应，在畜的时代，初九作为阳刚之才前去接受六四之畜，方为吉。今初九反身归位自守自畜，亦吉；此吉不论应否，据理而断，故曰义吉。","Y2.N":"牵字古人或训牵连，或训勉强，其实二义无甚差别，都有被动的意思。九二的复不是自觉自愿的复，而是被动、勉强、受牵连的复。九二所乘之初九，为阴所畜，已经自复。九二以阳处阴，居下得中，又无上应，所以就受初九之牵连而复居于下，这当然也是吉的。","Y2.XN":"九二处中，不失中道，虽有阳刚之本性而强于进，但毕竟不至于过刚，又与初三二爻属于同体同德，所以能够受乘承二爻之牵连而复。情况略同，初九吉，九二亦当吉，故云：“亦不自失也。”","Y3.N":"舆，车。说同脱。辐应为輹。大畜、大壮皆作輹。《经典释文》亦作輹。辐是车輮，即今语之车辐条。輹，乃车轴缚。车是不能脱辐的。脱辐便等于轮破毂裂，彻底破坏，不堪使用。而车脱輹则是平常之事。脱輹即是轴不转，车停下来不动。“夫妻反目”，自今日而言，不过夫妻关系破裂而已。古人则认为其中有尊卑关系的变化。妻受制于夫，是正常的，不谓反目；若尊卑颠倒，妻反过来制其夫，就成了“夫妻反目”。\n“舆说輹”与“夫妻反目”是比喻一种不好的结果。这种不好的结果完全是九三自己造成的。九三以阳处阳，重刚而不中，它不能自制其动，虽有六四在前畜止它，也畜止不住，结果造成“舆说輹”，不能再前进了。九三还有一个弱点，即它作为一个阳爻与六四密比，产生阴阳相悦的关系，而自身过刚而不中，不但不能以阳制阴，反为阴所制，造成“夫妻反目”的后果。总之，九三的处境极坏，简直是进不能进，退不能退，进退两难。","Y3.XN":"室是家室。君子应有修身齐家治国平天下的品德、能力和志向，而九三竟弄到不能制其妻反为妻所制的地步，说明它不能正其身。不能正其身，不能正其室，当然不可能成就齐家治国平天下的大事业。","Y4.N":"六四是卦之主爻，爻辞意义与卦辞一致。有孚，中心诚信。血，因战斗而流血受伤害。惕，危惧。六四处近君之位，以阴畜阳，以小包大，必有忧惕。它要想免于伤害，免于忧惧，唯一的办法是“有孚”，即以中心诚信去感动对方，取得对方的信任和理解。其中关键是取得九五的信任、理解与合作。《易经》作者认为这是阴畜阳，小畜大，下畜上，臣畜君的一条原则。假使六四以强力畜九五，敌众刚，必见伤害而事不成功，这是六四有孚的必要性。六四以阴居阴，柔顺得位，本性不躁，这是六四有孚的可能性。","Y4.XN":"言“惕出”，则血去可知，这是举轻以包重的笔法。惕惧尚且免除，流血受伤之事当然更不会有了。上谓九五。六四畜九五，阴畜阳，臣畜君，只六四自己有孚还不能收到“血去惕出”的效果，必须九五也有孚，即真正信任六四，做到上下认识一致，目标统一。事实上九五已经做到了这一点，所以六四才能“有孚惕出”。爻辞从六四的角度说话，强调畜人者应有孚。《象传》着眼在受畜者一方，强调九五与六四“合志”至关重要。","Y5.N":"挛如，结合紧密坚固。富，《易》以阳为实为富，以阴为虚，为不富。以，犹《春秋》以某师之以，能左右能驾驭的意思。“有孚挛如”，九五有孚与六四有孚相关联，相呼应配合紧密。六四有孚，是积诚孚信以畜止九五，九五亦推诚以待六四，接受畜止。上下相孚，而后小畜之道成功。“富以其邻”，富谓阳爻九五自己，邻指六四言。五与四近，故曰邻。九五是阳爻，且有孚，它完全能够左右六四的命运。总之，这一爻是强调在小畜之时，六四畜九五，能否成功，九五的修养、志向、态度如何，具有决定意义。","Y5.XN":"九五做到“有孚挛如”，与六四合作无间，主要是因为它不独富。《易》以阴为虚为不富，以阳为实为富。“不独富”有两层含义，一是九五与六四一诚相结，紧密牢固；二是九五不但自己接受六四之畜止，而且能够协助六四畜止下之阳。","Y6.N":"载，积累。月几望，月亮将满盈尚未满盈之时。征，动。小畜开始时之密云不雨，现在已经降下；先前阳刚之德积而尚往，现在已到了极点，不再往了。小畜之时的基本矛盾，即阴畜阳的问题，已经最后解决。旧的矛盾解决，新的矛盾又要发生。“尚德载”，是说阴畜阳已成功，而六四阴柔巽顺之德继续积累，发展。妇，阴，指六四。六四以其柔顺为正，持守不懈，结果必然危厉。犹如月亮即将圆满，要疑于太阳了。阴阳合和，转化为阴阳对抗。在这种情况下，阳即君子的任何不慎的行动都可能招致祸患。","Y6.XN":"此疑不当作疑虑解。应是疑似的意思，阴发展到与阳势均力敌的程度，以致分不出孰阴孰阳。坤卦上六之“阴疑于阳必战”，与此义同。雨已降下，阳亦不进，以阴畜阳，取得了成功，这是“德积载”的结果，不是一朝一夕的事，是六四坚持阴柔巽顺，长期积累造成的。此时矛盾的性质发生转化，阳开始受制于阴，不可随意行动，行动必凶。这是因为什么呢？因为“有所疑”。阴已壮大，甚至掌握了主动权，成为阳的可与之抗衡的对手。","Z":"小畜卦讲阴畜阳到阴疑阳的发展过程，准确地表达了《周易》作者关于矛盾转化的卓越思想。小畜之时，充满着阴与阳的斗争。阴畜阳，阳不受畜，不受畜而失利，接着又受畜，发展到最后，阴由弱变强，以至于达到与阳敌对的程度。这时小畜的矛盾结束，新的矛盾开始。看卦义，密云不雨，阴畜阳，阴与阳的斗争是一个漫长的过程。看爻义，初九、九二小心谨慎，坚守本位；九三过刚不中，为六四所制；六四与九五双双有孚，阴阳合和，九五与六四达到了和谐、统一。然而和谐与统一是相对的，暂时的，至上九，既雨既处，阴与阳的关系发生变化，阴疑于阳，阳受制于阴，新的矛盾开始了。"},"10":{"P":"履这个字的含义是什么呢？《杂卦传》说：“履不处也。”不处就是动，就是进。《说文》又说：“礼，履也。所以事神致福也。”履就是礼，就是当时社会人们立身处世的准则。如此说来，履的意义有两层，从它的外表看，履是实践，是行动；从它的内含看，履是礼，是人们实践、行动所必须遵循的准则。履卦所注重的是后面一层含义，就是礼的问题。而礼是十分复杂的，所谓经礼三百，曲礼三千，千头万绪，广说难尽；履卦乃抓住礼之用和为贵这一关键性问题，加以条分缕析，重点发挥。它认为，人处天地间，只要能柔顺和悦，谦卑自处，则无险不可涉，纵然履虎尾，也无妨。这一思想从卦体上也看得出来。履兑下乾上，兑柔乾刚，乾在前，兑在后。乾在前行，兑蹑于其后，有柔履刚之象。以柔弱履刚强，刚强再猛再烈，也必将被驯服。柔和谦卑竟能使柔弱者履虎尾而无咎，天下还有什么难关不能攻克呢！这样的卦为什么放在小畜之后呢？《序卦传》说：“物畜然后有礼，故受之以履。”履即礼，礼与物之畜聚相联系，事物多了，人也多了，势必产生小大尊卑美恶的差异，所以在小畜之后接着讲履。","G.N":"卦辞开口便说“履虎尾”，取象十分奇特。履，有所蹑而跟进的意思。紧蹑老虎尾巴走路，可谓人世间最危险的事情，然而老虎却不咬你，保你亨通无事。卦辞以此强调人立身处世，行之以礼，以和悦谦卑待人接物，即便遇上最凶猛的老虎，也将安然无恙。卦中有“履虎尾”之象。乾刚在前，故称虎，兑蹑其后，故曰履虎尾。八卦之中以兑为至弱，以乾为至健。以至弱蹑于至健之后，自然有危机之象。卦中也有“不咥人”之象。兑是悦体，以和悦履乾刚，则有不被咥而致亨之可能。","T.N":"孔子作《彖传》，揭示卦辞“履虎尾，不咥人，亨”的意义，十分准确地抓住了两点，解释极得要领。他说，履是柔履刚，不是刚履柔。可见这一卦里的二体不论上下，乃是论前后。柔履刚是世界上最危险的一种履，给这种最危险的履找到解决的办法，其他各种情况的履便可不论了。这是第一点。第二点，指出“履虎尾”之所以竟能“不咥人，亨”的根据，是“说而应乎乾”。履卦兑下乾上，兑柔乾刚，兑以柔履乾之刚，唯一可行的办法是对乾要悦要应。悦是和悦，应是恭敬，二者不可或缺，但根本的态度是兑必须谦卑自处。苟能如此，虽刚暴亦不难驯服。悦而应乾，乃兑之妙用。\n这是从柔即兑一方面说。刚即乾的一方面应该怎样，能够怎样，卦辞没有讲，孔子《彖传》做了必要的补充、引申。上文言“说而应乎乾”，就卦之二体言。此言“刚中正”，乃以九五一爻言之。九五于此成为三画卦乾的代表。“柔履刚”之刚系指上卦乾而言，现在“刚中正”的刚说的是九五一爻。两个刚字是相承的。九五刚不徒刚，而且居中得正，刚而中正，必然不过刚；不过刚则必处事不偏，把握尺度，无过与不及。推及人事，刚而中正之人一旦践帝位，君临天下，一定“不疚”。“不疚”即无瑕可指，无懈可击。“中正”则“不疚”；“不疚”则光明。居君位而光明，方知和悦不是胁肩谄笑，恭敬不是奴颜婢膝。\n这样，《彖传》把蕴藏在卦辞中的深刻的思想发掘出来了。履的问题与世间一切问题一样，都有两个方面，既有说而应乾的一方面，也有九五中正、不疚、光明的一方面。两个方面是互相制约，彼此关联的。这个辩证法的思想，既属于《易经》本身，也属于做《易传》的孔子。","X.N":"“大象”多讲《易》在政治上的应用，而且每每论及国家政治生活中的大事情。履卦“大象”谈的是等级制度问题。孔子重礼，礼的实质正是等级制度的反映。礼几乎与夫妇、父子之尊卑上下等级关系同步产生于父权制时代，此后便成了文明社会等级制度的重要支架。孔子在政治上是向后看的，所以他对礼对等级制度特感兴趣。\n上天下泽，乾为天，兑为泽，天当然高高在上，居至尊的地位，泽当然在下，居至卑的地位。举至尊与至卑，其间一切等级差别全包括了。尊卑上下即等级差别。反映等级差别的就是礼，将礼付诸实行就是履。孔子所以指出，统治者观履之象，学履之卦，其价值乃在于“辨上下，定民志”。\n“辨上下”，把尊卑贵贱的界限严格划清楚，不得混淆逾越。“定民志”，使百姓从思想认识上解决问题，尊者处尊，卑者处卑，各守己之位，各安己之分。","Y1.N":"《杂卦传》：“履，不处也”。履是一定要行动的。九是阳刚，是一定要前进的。问题在于如何行动，如何前进。处履之初，等于出门的第一步或者一个人初涉世事，刚刚踏上人生的道路。这时候，应该“素履往”。素，质朴无文饰，事物的本质本色。“素履往”，其实与《中庸》“君子素其位而行”之义正相当。教人安分守己，不贪得非分之利，不觊觎非分之位，贫者安贫，富者乐富。","Y1.XN":"独，专，只。“素履往无咎”，实质上是“独行愿”。“独行愿”是说行动的目的只是要实现自己的夙愿初志，不为情迁，不为物累，即《中庸》所谓：“不愿乎其外。”孟子所说大丈夫“富贵不能淫，贫贱不能移，威武不能屈”，意义同此。","Y2.N":"“履道坦坦”，九二以刚居中，是履道而得其平坦的。幽人，与下爻“武人”相对。“武人”，刚愎自用，恣行罔顾之人，“幽人”是幽静安恬、与世无争的人。九二以阳居阴位，且得中，处境甚好，前途是坦易的。但九二是阳刚之才，依其本性，很可能躁进。这时候，唯有能够坚守中心安恬，进退绰绰有余裕的幽人，方可得吉。","Y2.XN":"孔子强调反身修己，他认为人处理好与外界的关系，决定性的因素在自身的修养。为什么“幽人贞”会得吉呢？原因不在于神明赐予，不在于命运决定，也不在于处境有利，而在自身的主观努力。中，中心，内心世界。幽人之所以得吉，是因为幽人能够坚守内心的安恬清静，不为纷华盛丽而乱其操守。不自乱，外界谁也乱不了自己。","Y3.N":"卦辞言“履虎尾，不咥人，吉”，爻辞言“履虎尾，咥人，凶”，卦与爻相反，这是什么缘故呢？凡卦辞以某一爻为主，则爻辞与卦辞意义相同，如屯卦卦辞“利建侯”，初九爻辞亦“利建侯”。凡卦辞以上下体而论，则爻辞与卦辞不同，如本卦卦辞云“履虎尾不咥人吉”，而六三爻辞则曰“咥人凶”。\n六三以阴居阳位，不中不正，以此为履，必出问题。走路应平衡适中，而六三行不中，说明它是个跛子。走路需目正视，而六三视不正，说明它又是个一只眼。跛者行不中，但能行；眇者视不正，但能视。事情坏就坏在这里。六三无视自己的致命弱点，眇而自以为能视，跛而自以为能履。两个能字充分表现出一派自专自用、恣行罔顾者的形象。这么样去“履虎尾”，老虎绝对不会不咬它。凶是必然的。\n“武人为于大君”，是指出另一种情况。武人是刚暴之人，其才虽弱，其志却强，它能够不顾强弱，勇猛直前。这样的人如果在一位足智多谋的大君即天子的领导下，充分发挥它勇猛不怕死的长处，或许是可取的，有益的。","Y3.XN":"六三阴柔而不中不正，却不知道自己有致命的弱点，执意冒昧前行，无异于履危蹈祸。如同眇者自以为能视，跛者自以为能行。然而在智者看来，与盲人夜行差不多。孔子告诫以两个“不足”，唤醒人们万勿强不能以为能。最后指出六三之所以致祸的原因是它以阴爻居阳位，位不当。亦即柔弱其里，刚强其外。因为位不当，所以显出志刚来。从虽才智不足但志向刚强这一点看，六三如果作为一个“武人”在“大君”的指使下，发挥它志刚的长处，或许可能起到积极作用。","Y4.N":"以一卦言，乾为虎，所以六三有履虎尾之象。以爻言，九五为虎，所以九四也有履虎尾之象。六三与九四同有履虎尾之象，为什么三凶而四吉？因为六三本眇本跛，里柔外刚，而自以为能视能履，得凶，自属必然之事。九四则不然，九四小心翼翼，愬愬然若履薄冰。九四何以能如此？九四以阳居阴，亦不中不正，但它本身是阳刚，居阴柔之位，处多惧之地，里刚外柔，刚而能柔。它恐惧自处，愬愬而行，理当获吉。","Y4.XN":"九四内刚外柔，不仅有它愬愬知惧的一面，更有它上进而不处的一面。所谓“愬愬终吉”，是说它上进的志愿能够实现。","Y5.N":"夬音怪，刚决，决断的意思。《彖传》说“刚中正，履帝位，而不疚”正是指九五说的。而九五爻辞却与此相反，爻辞强调九五夬履贞厉，指出九五有危象。这是为什么呢？这里又看出《易》作者具有深刻的辩证法思想。他总是善于从正面的东西中找出反面的东西，从一派吉利的形势中发现不吉利的征兆。九五以刚中正履帝位，下面有人悦而应它，它有权有威有势，对待一切的事情，它完全可以果决独断，即所谓“夬履”，不会遇到任何阻碍。但是它以刚居刚，过刚而不能以柔济之，犹如人君，英明刚决有余，而包容兼听不足。若守此道长久不变，则必有危厉。","Y5.XN":"为什么说“夬履”必有危厉呢？孔子说，因为九五的条件太好了。九五刚中正且居至尊之位，居高临下，自专自决，无所畏惧，然而问题恰恰出在这上面。","Y6.N":"考，考察，检验，总结。祥，不仅谓吉祥，实包括凶咎在内。《说文》段注说：“凡统言则灾亦谓之祥，析言则善者谓之祥。”考祥，考察、总结其吉凶。旋，周旋完备。上九居履之终，履已宣告完成。现在可以回过头来看看其所履行之情况如何了。犹如一个人到他生命完结的时候，人们要据他一生的实际表现，论定他善恶成败之多少大小。善多吉，恶多凶。若自始至终周旋无疚，尽善尽美，则曰元吉。元吉，大吉，无以复加的吉。","Y6.XN":"在上，履已到达终点，“元吉在上”，是说履至终极，才有可能获元吉。履不至上是不可能得到元吉的。这是解释上九获元吉的条件、原因。一个人如果最终获得了元吉，便是大有福庆。这是解释元吉的含义。吉而曰元，庆而曰大，既有勖勉履善终始一贯的意义，又有强调视履考祥以为借鉴的作用。","Z":"小畜与履都是一阴五阳之卦，其意义都是主于用事的。小畜阴居第四爻，在上卦，以柔畜刚即以柔制刚，是制人的。履卦一阴居第三爻，在下卦，以柔履刚即以柔行刚，是行己的。履卦贵柔，六爻都以履柔为吉，以履刚为凶。九二坦坦贞吉，九四愬愬终吉，上九其旋元吉，三爻都是履柔的。六三咥人凶，因为它以柔履刚。初九与九五也是履刚的，虽所履皆正，但初九仅得无咎，九五不免于危厉。《易经》本来扬刚而抑柔，但它绝不简单化地看问题。它注意到了阳刚有喜动而好决的弱点，若任刚而行，必多可悔之事。"},"11":{"P":"泰，通。《易经》明于天之道，察于民之故，既讲自然界的规律，也讲社会人事的道理。它认为自然界有规律，社会人事也有规律，而且两种规律有其一致性。泰卦就是明显地把自然界的规律与社会人事的规律放在一起对待的。在《易经》看来，天地之间与人类社会有时会出现一种不多见的交通和畅的最佳状态。这种状态，这种时代，就叫做泰。泰是怎样来的呢？《易经》认为，在自然界中，天与地相交，万物因而发育成长，顺遂和畅，这就是泰，就是通。但是天毕竟在上，地毕竟在下，天与地实际上不能相交。于是古人说，不是天地之形交，是天地之气交。天为阳，阳气下降；地为阴，阴气上腾。阴阳和畅，则万物生遂。由此看来，所谓天地交，实质上是阴阳交。阴阳是代表万事万物对立斗争的两个方面。它们不但处于斗争的状态，有的时候，也会非常和谐地统一在一起。古人的这个认识，是有道理的。\n由天之道而察民之故，情况是相似的。不过人事不论天地而论君臣上下君子小人罢了。君是阳，臣为阴；君子是阳，小人为阴。如同阴阳二气可以交通一样，君臣之间也可能推诚而志通。君子居上居内，小人居下居外，君子小人各得其位；君子小人各在其所当在的位置，这也可以理解为一种阴阳交通的形式。\n天地相交，二气相通，从卦上面反映了出来。泰卦乾下坤上。天在下，表明天气下降；地在上，表明地气上升。在上的往下降，在下的往上升，二者必然相交。若否卦则不然。否卦坤下乾上。天在上，天气未曾下降；地在下，地气未曾上升，二者必然不相交。\n《易经》64卦，把泰卦安排在履卦之后，是有原因的，不是偶然的，体现了《易》作者的思想。《易》作者按照历史发展的顺序，自乾坤二卦往下安排，大体上有一个发展的脉络可见。乾坤反映天地即自然界的初始，自然界先于人类产生；屯蒙讲天地间万物与人类之初生。有人有物便出现养的问题，故有需；有需有养便有争。争的结果，产生讼。较大的争执要用战争解决，所以讼卦之后是师卦。对于该争取又能争取的力量则必加以团结亲比，故有比。小畜以生聚，履以辨治。接着是泰。泰是《易》作者心目中最理想的时代，是上古社会的极治，大概相当于尧舜时期。泰过而否，否而泰，自此而后社会历史一治一乱地发展，而真正的、理想的泰似乎不会再来了。\n《易》作者的这种历史观自今日看来当然是不科学的。但是我们如果历史主义地看待古人的思想，便不难发现，《易》作者的历史观有其可取的、合理的因素。第一，他认为人类社会历史是个可以认识，可以理解的过程；第二，这个过程有其内在的动力和规律，没有超自然超人类的神明摆布它。","G.N":"《易》以阴为小，阳为大。往，自内往外去；来，自外往内来。内是下卦，外是上卦。“小往大来”，阳气下降，阴气上升，阴阳和畅，万物生遂，这是自然界的泰。由自然界引伸到人类社会，则大是君上，小是臣下。“小往大来”，是君以礼使臣，臣以忠事君，君臣志同道合，关系和洽。阳为大，是君子；阴为小，是小人。“小往大来”，是小人往外去，君子居于内。君子得位，小人处下。总之，泰卦反映的时代特点是通。通，反映在卦上就是小往大来。小往大来，在自然界，表现为天地相交，二气相通。在人类社会，表现为君臣志通，君子小人各得其位。卦不言元吉、元亨而言吉亨，是因为泰的程度有所不同，言吉亨则把大小不同的泰都包括了。","T.N":"两个交字解释泰字的意义。“天地交”不是天地之形交，是天地之阴阳二气交。君臣上下之交也不是形交而是志同，志同是志同道合，思想一致。这里对天地阴阳君臣上下无所抑扬，只强调交与不交的问题。\n阴阳健顺君子小人诸句以内外释大小。一方面说，阳健君子居内，阴顺小人居外，在内在外，各得其所；另方面也有重内轻外，于阴阳有所抑扬的意思。\n“君子道长，小人道消”，是以六爻的消长为义。阳爻加多，阴爻便减少。于人事，君子道长，小人便道消。至此，态度明朗化，对阴阳不止抑扬而已，而是好阳而恶阴，以阳长阴消为福。但是，道长道消，论道不论人。君子道长，说君子之道占上风；小人道消，说小人之道在下风。亦即总的趋势是正气压倒邪气，君子得信任赏识，小人遭疏远冷落。但这不是说泰的时代只有君子无有小人。什么时代都少不了小人，因为没有小人便没有君子。","X.N":"后，南面之君，天子诸侯。它卦“大象”言君子、先王，此卦言后，因为言君子则包括卿大夫，言先王则不含诸侯。法天地交泰，财成辅相，以左右民，是只有南面之君才有资格干的事情，与卿大夫无涉。由此可以看出，《周易》作者心中的中国古代国家制度是君主专制型的。\n财成与辅相二句，意义与它卦类似，还是讲学了这一卦，要效法这一卦的思想，用以指导实践。这一卦有一点特殊性，是专就天子诸侯讲的，而且内容比较大，比较宏观。天子或诸侯，应当体会天地通泰之象，裁(财与裁同)制天地之道，使之成为对人民生产生活有用的东西。如天地有寒暑，统治者便因之而治历法，定四时成岁，然后告朔，视朔。还要辅相天地之宜，根据自然界生物生长发育成熟的规律，教民稼穑畜养。左右是扶助的意思。“以左右民”，用财成与辅相的办法，扶助人民。","Y1.N":"“拔茅茹”，说的是物。用物比喻初九之爻象。茹，连茹，此茅之根与彼茅之根在地中相牵连。拔了这根茅，必然连带拔出那根茅。初九便是这根茅，九二九三便是那根茅。初九阳刚居下，正遇天地交泰之盛时，它必然要上进。不但自己上进，还要连带九二九三一起上进。汇，类；征，动。君子就如同拔茅一样，自己上进，还要引导自己的同类即同志，一道上进。这当然是吉的了。","Y1.XN":"初九为什么拔茅茹以汇征得吉呢？因为“志在外”。初九与六四正应，故曰“志在外”。初九以阳感阴，六四应初九，以阴从阳，恰是阴阳二气相交通之象。","Y2.N":"九二以阳刚得中居柔，上与六五正应；六五以柔顺居中得正，下应于九二；六五与九二有君臣相得之象。九二虽居臣位，但深得六五的信任，是成卦之主，内外阴阳全赖它调和浃洽。当泰之时，如何治理天下国家，主要反映在九二这一爻上。九二爻辞讲的包荒、用冯河、不遐遗、朋亡四条，包括了治泰之道的主要内容。包荒，极言包容之广，含量之大。在天地交泰的盛时，统治者最重要的是包荒，大度包容，一切反面的东西都能容得下。然而只是如此，则必无所作为，不能前进。大度包容之下，还要“用冯河”，即刚决果断，勇于改革。“包荒”与“用冯河”是相反相成，不可或缺的两个方面。“不遐遗”与“朋亡”也是相反相成的两个方面。“不遐遗”，不弃遐远；“朋亡”，不结朋党。远人在所怀，近者无可昵，居中不倚，不偏不党。“得尚于中行”，得是庆幸之辞，尚是佑助之意。九二以刚居柔，居下卦之中，上有六五之应，为泰卦之主，具有中行之道。治泰若能做到包荒等四项，则合于九二之德，配合中行之义。","Y2.XN":"“小象”以为包荒是四项中基本的一项。只有做到包荒即大度包容，才能做到用冯河、不遐遗、朋亡三点，所以只举“包荒”一语，不及其他。能“包荒”，便得合乎中道，这是因为什么呢？因为其心迹光明，其度量宏大。","Y3.N":"九三居三阳之上，三阴之下，正处泰卦之中又将过中，恰是泰极之时。泰极否来，这是客观的规律。《易》作者深知此理，乃于九三提出两个“无不”的告诚。陂，偏颇不平。平坦一定变成偏颇，去了的必然要回来。从卦来看，三阳爻降于下，终究会升上去；三阴爻升于上，迟早要降下来。平者陂，往者复，泰极要变否。怎么办呢？“艰贞无咎，勿恤其孚，于食有福”。人不是无能为力的。人完全可以发挥自己的主观能动性。人处方泰之时，应居安思危，所作所为坚守正道，能如此，便可无咎。岂止无咎，若能“勿恤其孚”，还要有福。恤，忧；孚，诚。天道无情而我无忧，我要诚信不移地思我所应思，行我所当行。","Y3.XN":"“无往不复”，是说天地乾坤阴阳之交接，到九三之时，即将发生变化。\n阳在下，必复于上；阴在上，必复于下。泰必将变为否。“小象”用一个际字，有告诚人们未雨绸缪之意。","Y4.N":"翩翩，群飞而向下的样子。《易》以阴虚为不富，六四是阴爻，所以称“不富”。凡言“不富”，皆指阴爻。但阴爻不皆称“不富”。此爻称“不富”，有谦虚不自满的意思。邻，指六五与上六两爻。六四处上卦之下，当二卦之交，是阴阳交泰之爻。六五与上六二阴爻愿意随从六四下降求阳。六四更无须告诫，便与它的两个邻居翩翩相率而来。可谓内外一心，阴阳合德，这正是泰卦应有的表现。","Y4.XN":"《易》凡阳爻为实为富，阴爻为虚为不富。“失实”是解释“不富”的。上卦三阴爻以六四为头头，轻松自然地翩翩而下，是因为它们失去阳爻作依靠，而它们是不能长久失实的。愿，上下交而志同的意思。六四与二邻不戒而来，完全是发自内心的愿望，没有丝毫勉强的因素。","Y5.N":"六五以阴柔居君位，它位极尊而性极柔，它应该也能够与下卦之九二相应，屈己之尊而顺从九二之阳。爻辞取“帝乙归妹”之象说明这个道理。帝乙即商纣之父。归妹即嫁妹。帝王之妹下嫁给臣下，也要降其尊贵，顺从其丈夫。在古人看来，这是合情合理，天经地义的事情。帝王之妹尚且要屈尊从夫，以阴从阳，其他便可不论了。以祉，以之受祉，六五因为能够屈尊从阳而必然受福。元吉，大吉，六五与九二志同道合，在整个治泰的过程中将取得最大的成功。","Y5.XN":"六五之所以必获祉福而且元吉，是因为它以柔居中处君位，有中德，行中道，它任贤从下，绝非出于强迫，乃是它的本性，它的志愿决定的。","Y6.N":"上六在泰的终结处，泰之终结即是否之开端。泰极否来。九三平者陂，往者复，已经有了泰变否的预兆，到了上六，泰变否即将由可能变为现实，形势更加严峻，所以用“城复于隍”来形容。隍是城墙外之干涸的壕堑。城墙本来就是由此掘土累积而成的。有如泰的局面，泰的形势，由长期的辛苦积累而成。现在泰已发展到极点，将要变为它的反面否。也如城墙将倾圮回复到隍里。城复于隍，是个严酷的事实。《易》作者看到这个事实，并且加以肯定。这不简单。他具有了关于质量互变的思想。就一个国家来说，泰极否来，城复于隍，形势极为严重。严重到“勿用师”的程度。古代实行兵农合一的制度，国家不设常备兵，平时耕田是农夫，战时召集起来出征打仗就是军队。用师是把人民召来应付战事。在泰的时候，这样做当然没有问题。现在天下将乱，人心离散，想要用师，办不到了。只能“自邑告命”。邑，所居之邑，指身边近处而言。泰达到变否的时候，国势已成土崩瓦解之状，统治者的权威、命令只在自己的身边近处勉强有效了。即便能够“自邑告命”，而且做到守正，也为时太晚，无济于事了。","Y6.XN":"爻辞中两个命字，意义有别。前一个命字是命令、指示。后一个命字当是古人所云“天命”的命。“天命”不是上帝神灵的旨意，是不以人的意志为转移的客观规律。爻辞这句话揭示出《易》的一个重要思想，即泰极否来，犹如“城复于隍”，是归根结底不可改变的规律。“其命乱也”，一语破的，切中要害。这就是说，“城复于隍”，“天命”变了，该当如此。","Z":"概括地说，泰卦强调的思想有三点。第一，自然界有相反对的两种东西产生交通的现象。这种现象是普遍存在的，贯穿在万物之中，是万物生长发育茂盛的根本原因。因为这个现象太普遍太根本太重要了，所以《易》作者把它比喻为天地之交。天地悬隔，不能形交，乃提出天地之间阴阳二气交。引伸到人事问题上，君上与臣下，统治阶级与被统治阶级，也有上下交而志同的时候。《易》作者的这个思想是正确的。社会确实有相对稳定，生产发展，政治清明的时候。只是《易》作者不曾找到产生泰的历史时代的真正原因，他以为社会人事上的泰是由于上下“志同”即思想相同造成的。其实，不是人们的思想状况决定社会历史的发展，而是社会历史发展的状况决定人们的思想。\n第二，提出平陂城隍，泰极而否的观念，认为一切事物都在无情地变化，由量的变化达到质的变化。这是不以人的意志为转移的客观规律。天道如此，人道也如比。谁也无力抗拒。古人在三千年前能够提出这一深刻的辩证法思想，应该说是伟大的。\n第三，《易》作者在泰卦中有一个重要的政治观点，值得重视。即统治者当处于泰的时候，要特别小心谨慎，做到“包荒，用冯河，不遐遗，朋亡”。既要大度宽容，容忍一切可以容忍的事，也要奋发向前，锐意改革。既要远近亲疏兼顾，团结一切能够团结的人，又要绝去朋比，无私无偏。"},"12":{"P":"否是泰的反面。泰是交通，否是闭塞。泰是天地交通而万物生，否是天地闭塞不通而万物不生。泰是上下交而志同，否是上下不交而志不同。从卦之二体看，否上卦是乾，下卦是坤，天在上，地在下，天地隔绝，不相交通，完全是否之象。《序卦传》说，“泰者通也。物不可以终通，故受之以否。”《易传》作者在这里再次肯定物极必反的客观真理。他正确地认为，泰是通，但是通久必变为不通，泰极而否必来。因此，泰卦之后是否卦。","G.N":"“之匪人”三字，朱熹以为衍文，不无道理。但其余诸家的解释也有参考价值。孔颖达说：“否之匪人者，言否闭之世，非是人道交通之时，故云匪人。”程颐说：“凡生天地之中者，皆人道也。天地不交则不生万物，是无人道。故曰匪人，谓非人道也。”王宗传说：“匪人，所谓非君子人也……匪人得志，则君子之道否塞而不行矣。”吕大临说：“否之匪人，不利君子贞，言否闭之世，非其人者，恶直丑正，不利乎君子之守正。”查慎行说：“卦辞之匪人，即《彖传》爻辞之小人，与‘比之匪人’句法同。”此五人之说，孔、程二人相近，以为“否之匪人”讲的是整个时代不好，否闭不通，无有人道，无有理性。王、吕、查三人则把“否之匪人”理解为小人得志当道。两种看法并不矛盾，可以说是一致的。都不外乎说在否之时，人道不通，正气不伸，小人得志。\n“不利君子贞”，当否之时，小人用事，邪气得逞，是非不分，黑白颠倒，当然不利于“君子贞”。当权的小人和恶劣的形势，绝不容许正派的人维护正义，坚持真理。但是天地之间正气总要存在，君子断不可无，否则否将何以变为泰!\n“大往小来”，乾在上，乾往居外，所以叫“大往”；坤在下，坤来居内，所以叫“小来”。“大往小来”即阳往阴来，是君子道消，小人道长之象，所以“不利君子贞”。","T.N":"否卦与泰卦都由乾坤两个三画卦组成，只是上下位置相反，泰是乾下坤上，否是坤下乾上。所以否之《彖传》只就泰卦的反面说。泰《彖传》说：“天地交而万物通”，否《彖传》则说：“天地不交而万物不通”。泰《彖传》说：“内阳而外阴”，否《彖传》则说：“内阴而外阳”。泰《彖传》说：“内君子而外小人，君子道长，小人道消”，否《彖传》则说：“内小人而外君子，小人道长，君子道消”。有变化的唯两点，泰《彖传》说：“上下交而其志同”，“内健而外顺”，而否《彖传》却说：“上下不交而天下无邦也”，“内柔而外刚”。\n说“天下无邦”不说“志不同”，是强调否之时上下不交的严重性。国家政治生活阻塞、失常。国无人，国将不国；邦无道，有邦同无邦。出现这样严重的情况，当然远远不是志同与不志同的问题了。至于否《彖传》言刚柔不言健顺，那是因为，当否之时，天地不交，上下不交，天地徒具其形而无其用，天起不到健的作用，地也起不到顺的作用。","X.N":"俭德，收敛其德。辟与避音义同。当天地不通，上下不交之时，君子该怎么办呢？应该有才不露，有德不显，有善不形，把自己隐藏起来，超然荣禄之外。不以仕禄为荣，反以仕禄为灾害。使别人发现不了自己，不可能把仕禄加到自己的头上。这其实是“有道则见，无道则隐”思想的表现，与道家出世主义不同。","Y1.N":"《易》为君子谋，不为小人谋。言吉亨，则肯定是说君子，不会是说小人。卦辞与《彖传》皆以为否卦内小人外君子，那么初六阴爻居内卦，当为小人，爻辞何以视作君子呢？这是因为《易》有随时取义的特点，卦爻有时候取义不一致。否卦就是属于这类情况。否之初六与九四本来是正应，但是由于否之时上下隔绝不通，初六失去了与九四正应的意义。因为初六与九四无应，所以“以其汇贞吉亨”。汇，类；贞，正。它应该连结它的同类即二、三两爻，共同守正不动，才能得吉获亨。不可像泰卦那样“征吉”，征是动，在泰卦，初爻动，方得吉；在否卦，初爻如果还是动，那就必然致凶了。否卦初爻坚持守正不动，则吉亨。吉是平安无事，不出坏事，亨是进一步发扬自己的长处，有所通达。","Y1.XN":"“拔茅贞吉”，是爻辞全文的省语。君子处于否塞之时，虽欲进而不可苟进，应引退守正，待机而动，亦即所谓“俭德辟难”。君子俭德辟难，实属无可奈何，而心中不忘君臣之义，志在报君之恩。泰卦初九“小象”曰“志在外”，否卦初六“小象”曰“志在君”，意义无甚不同，都反映“居庙堂之高则忧其民，处江湖之远则忧其君”的思想。忧民忧君的思想也就是儒家的修身齐家治国平天下的思想。这种思想反映了儒家的价值观念。儒家的价值观念与道家根本不同。道家把人看作自然物，追求个人的精神解脱与自由。儒家则特别看重人的价值，认为人生天地之间的意义在于济世，在于为人，在于奉献。否初六“小象”讲“志在君”正是儒家价值观念的重要内容。","Y2.N":"包承，包容承顺。六二以柔居中得正，有至顺之象，是小人处下，施展其阿谀奉迎之本领，以笼络君子，求得自己度过否的难关。包承，对于小人来说，是吉的。但是《易》为君子谋，不为小人谋，小人之吉正是大人之否。爻辞虽先讲小人如何，但最后还是指示大人应该怎样。讲小人是为了交待大人如何对付小人。大人否亨，方可与小人划清界限，不受小人之迷惑，也不受小人之浼，甘处否的困境，缓求未来之亨通。","Y2.XN":"当否之时，上下不交，世道不正，小人包承，笼络君子。大人与君子同类，与小人异类。大人“不乱群”，不与小人混乱，不受小人之迷感、笼络，与小人之“包承”针锋相对。","Y3.N":"六二虽阴柔但居中得正，它可以包承，不易为人识破，故以否亨戒大人。六三既阴柔又不中正，又切近于上，它的面目大家看得清楚，它想迷惑人，笼络人，不易得逞。但它忍耻固位，无心离去，尸位素餐，无所作为。这就是包羞。孔子说“邦无道，穀，耻也”，当否之时，占着位置白吃饭，厚颜无耻，大概正是指六三这种情况。","Y3.XN":"六三本为小人，它目前之所以能够忍辱含垢，只因为它所居之位不中不正，限制它不得施展，一旦由位不当变为位当，这种人十分可能干更大的坏事，君子务必注意提防它。","Y4.N":"命谓天命，不是君命。畴、类；离，丽，附丽；祉，福。九四过中将济，否将要变泰之时；九四以阳刚居近君之位，有济否之才和济否之势。若能既自处于无过、又不肯躁进，则必无咎。因为否极必然成泰。其中有“天命”亦即客观的规律在起作用。大往小来变为小往大来，不唯九四自己受福，与它同畴的诸阳爻，也将附丽于它而一齐受福。","Y4.XN":"九四正处在否过中而将济的时候，既得其时又有其命，所以无咎。但是九四在否将反泰的过程中，远非完全处于消极被动的状态。它是主动积极的，甚至可以说，“有命无咎”的结局，乃是它自行其志的表现。","Y5.N":"休，止息。九四否开始向泰转化，九五已进入息否之时。九五是否卦之主爻，阳刚中正且居尊位，可谓居其位，有其德，得其时。它有条件有力量休否，即拨乱反正，扭转乾坤。休否固属势之必然，但是要将休否的可能性变为现实，九五即大人的刚决果断，奋力推动，具有决定意义。可见，《易经》既强调客观的规律，又重视人的主观能动作用，并没有丝毫的宿命论思想。当元气渐复，泰道将还的时候，人皆晏然安乐，唯大人有戒惧危亡之心，他念念不忘“其亡！其亡！”有如此戒惧危亡之心，必能像“系于苞桑”那样坚固不拔。桑这种树根深柢固。苞，丛生。“苞桑”，丛生的桑树，其固尤甚。《系辞传》说“危者安其位者也，亡者保其存者也，乱者有其治者也。是故君子安而不忘危，存而不忘亡，治而不忘乱，是以身安而国家可保也。”《系辞传》概括的观点，与否卦九五爻辞的思想是一致的。","Y5.XN":"转否为泰，获大人之吉，关键的原因，是九五有德有位。有德有位之中关键是有位。九五处中得正居尊位，握有转否为泰的权柄，具有拨乱反正的力量。","Y6.N":"上九处否之终极，否发展到极点，是该倾的时候了。爻辞讲“倾否”不讲“否倾”，是有意义的。强调否之所以倾，其中人事的力量起极大作用。并非否发展到极点，不须人力便自然地倾覆。泰之上六以阴柔处泰之终，它无能无德保泰，使泰复为否。否之上九是阳刚之才，它有能力倾否，使否变为泰。无论泰至上六复为否，还是否至上九变为泰，当社会发展到极点，即将发生质变的时候，人的作用是不可忽视的。《易经》一方面把社会历史的发展看成是有规律性的，一方面又十分重视人的作用。实际上它已经有了人是历史的主人的思想，至少它不认为人类历史的命运是由上帝主宰的。\n先否后喜，否极时忧在先，否倾时喜在后，有先天下而忧，后天下而乐的意思。正与九五“其亡其亡，系于苞桑”的含义相似。","Y6.XN":"这是讲客观规律与人的主观能动性的关系。“则”字是强调人事的重要。否终必倾，人们在否终将倾的时候，就要主动地去“倾否”，不可等待。“何可长”三字是说天下绝无久否之理，否倾是必然的。人们要因势乘机而动。两句话把天道之盛衰与人事之进退交织在一起。","Z":"否卦与泰卦，上三爻与下三爻都是相应的。但是泰卦上下诸爻在爻义上有相交之意，否卦则没有。泰卦初征而四孚，二中行而五归妹，三陂平而上城复，凡相应之爻爻义是相交的。否则不然。否初拔茅而四有命，二大人否而五大人吉，三包羞而上后喜，相应之爻爻义皆不相交。\n否卦是讲天地不交，世情闭塞的，然而六爻之爻辞不见一凶咎字，这是什么原因呢？因为否六爻阴阳平分，象君子与小人并生于世上，尚未到柔剥刚的时候，小人为害并未见显著。到了剥的时候，一阳在上受五阴之剥，方成小人的世界。否之时，就全卦看，君子道消，小人道长，于君子不利，所以卦辞说“不利君子贞”。但是六爻的各自情况却不尽如此。上卦三爻皆阳，君子在上，否已过中，形势好转，“休否”，“倾否”，已成为势所必然。这时候只要大人君子顺应规律，心存危惧，积极谨慎行事，便可以无咎得吉。下卦三爻皆阴，小人用事，当然无如上卦好，但此时小人亦正处于全身远害之时，自顾犹苦不迭，更无暇无力将其为害君子的愿望变成现实。所以爻辞强调小人“包承”、“包羞”而不言凶咎。"},"13":{"P":"这一卦强调与人同，涉及个人与全社会的关系问题。\n同人卦为什么安排在否卦之后呢？《序卦传》说：“物不可以终否，故受之以同人。”否是天地不交，同人是上下相同。就是说否发展到一定程度，要被同人否定。","G.N":"野字过去多理解为空旷野地，其实这是国野之野。古代在一个国家里，中心地区叫做国，国之外叫做郊，郊之外便是野。野是最边远的地区。“同人于野”，是说同人的面要广要大要远，要同天下之人。我同天下之人，天下之人也皆来同我。能做到这种程度，事情没有不亨通的。这反映了儒家四海为一家，中国为一人的思想。“利涉大川”，是说“同人于野”的效用。即能够胸怀天下，把广大的人群团结起来，没有什么险阻艰难不能渡过。\n“利君子贞”是说“同人于野，亨，利涉大川”是有条件的。不是说只要“同人于野”就能亨，就能利涉大川。贞，正。“利君子贞”是说同人之人，自身要正，要守君子之正道。如果行小人之道，阉然自媚于世，纵然博得人们喜悦而与之同，也绝不会牢固持久。怎能涉得大川，经历艰险呢？","T.N":"“同人，柔得位得中而应乎乾，曰同人”，从卦体的角度解释卦名卦义。柔指六二，乾指九五。六二是卦中唯一的阴爻，是成卦之主。就全卦来说，主要靠它实现同人。它以阴爻居阴位，得其正位，而且又得中，具有与人和同的条件。但是，光是柔还不能独立解决问题，必须“应乎乾”，有乾与之相应，即有乾配合它，它才能同乎人。凡以柔为主的卦都是这样。例如履卦，“说而应乎乾，是以履虎尾不咥人，亨”，又如小畜，“柔得位而上下应之”，大有“应乎天而时行”，都强调柔得位必与乾相应方能成事。\n“同人曰。同人于野，利涉大川，乾行也”。“同人曰”三字是衍文，以下是解释卦辞的。孔子用“乾行”解释“同人于野，利涉大川”。乾行，天之行，天之道。天之行，天之道，其特点是刚健无私。同人这一卦所以能够“同人于野”，能够“涉大川”，是九五的刚健无私在起作用。没有九五，光有柔爻六二自己是不行的。\n“文明以健，中正而应，君子正也。唯君子为能通天下之志”。这是解释卦辞“利君子贞”的。文明指内卦之德。刚健指九五之德，中正指六二与九五两爻居中得正而相应。刚健则无私，文明则烛理，中正则无偏。三者俱有，便是“君子正”了。是君子而行正道，心志自然会与天下人相交通，天下人自然会与之相和同。","X.N":"不说天下有火，也不说火在天下，而说天与火，是说天在上，火向上，二者在这一点上是相同的。这一卦正是取天与火在上向上之象而称作同人的。君子学了这一卦，观了同人之象，用以指导实践，便要“类族辨物”。世间万事万物千殊万别，绝无全然相同的东西。事物总是同中有异，异中有同，同异紧密相联系。道家庄子无视事物有异的一面，强调万物一齐，物我不分。《周易》则主张既求同又存异。同人卦的同是和同的同，有差异的同。所以孔子认为君子观同人之象应该类族辨物。\n类族与辨物是对文。类是动词，比类的意思。族是名词，品类的意思。类族，比类划清人事的差别，善归善，恶归恶，是归是，非归非。辨是区别的意思，是动词。物是品物的意思，是名词。辨物与类族意思近似，是说将万物加以分类而辨别之。","Y1.N":"“同人于门”是同人于门外，不是同人于门内。同人于门外，不分厚薄亲疏，所遇皆同。这样的同，广博而无所偏私，亲者不近，疏者不远，公而待之。同入之始能够如此，将来是吉是凶是悔是吝，当然要看发展，但在目前无咎是肯定的。\n这是同人初九一爻的爻义。爻义要通过爻象表达。九，阳爻，居同人之初而无系应。初与四应，但同人初与四两爻皆阳，所以不相应。这对于初九说来，是无系应。无系应在同人卦有无偏无私之象。","Y1.XN":"孔子用“出门同人”解释“同人于门”。“于门”就是“出门”。走出门外去同人，所同的范围广，是无所偏私之同。这样的同，又谁得而咎之呢！","Y2.N":"同人的范围广好，狭不好。宗是宗党。同人于宗是同人于门内。同的范围仅限于门内之宗党，比同人于门于野狭窄，所以可吝。\n六二是同人卦之主，从全卦的角度看，它柔得位得中而与九五正应，有相同之义，是好的。但从六二这一爻的爻义来看，情况就不一样了。六二与九五正应，正应本来是好的，在同人卦却不好。六二同于自己所系应的九五，它同的范围有了局限，不如初九无所系应，同的范围广，所以初九无咎而六二吝。","Y2.XN":"同人于宗，吝是必然的。按易例，六二与九五虽正应，然而于六二多有戒辞。在同人这一卦尤其如此。六二系应于九五，即专与九五同，好像说只同于有亲情的宗党，而不同于无亲情的外人，其道是可吝的。","Y3.N":"三与上该是相应的，但三是九，上也是九，两爻皆阳，所以九三与上九不是正应。在同人之时，不正应就是不同，不同就是异，异则必有乖争。“伏戎于莽，升其高陵，三岁不兴”，是乖争的表现。但是这个争仍处于戒备阶段，长期没能变成现实。","Y3.XN":"“伏戎于莽”，是“伏戎于莽，升其高陵”的省文。“敌刚”是说九三与上九的关系。敌是应的意思。两个刚爻相应，实际上不相应，而是相异，所以叫“敌刚”。\n杀机四伏，为什么“三岁不兴”，仗打不起来？“安行也”。安行，是不能行。九三是心欲斗而力不能支。","Y4.N":"墉，墙。“乘其墉”，要进攻的意思。九四向谁进攻呢？向初九。九三与上九是“敌刚”的关系，九四与初九也是“敌刚”的关系，即两个阳爻居相应之位而不应。在同人卦里，不应就是异，是异即有相攻之象。这一点，九四与九三的情况是一样的。但是也有不同。九三以阳居刚，所以伏戎于莽，三年不兴，有执迷不返的意向。九四以阳居柔，所以弗克攻吉。有困而能返之义，结果是吉的。","Y4.XN":"“乘其墉”是“乘其墉，弗克攻”的省文。为什么其志欲攻，其势可攻，而结果“弗克攻”，终于未攻呢？因为“义弗克”。“义弗克”，是说由于发现自己于义不正，而终于没有攻。有改过的意思。它能得吉，就是因为它知困能返，能返到正道上来。","Y5.N":"同人卦的特点是内卦由同而异，外卦由异而同。“同人于门”，同的程度高，“同人于宗”，同的程度差些。到了九三“伏戎于莽”，就由同变为异了。至外卦九四，“乘其墉，弗克攻”，还是异，没有同。至九五，情况发生变化，开始由异变同了。“先号咷”是说异，“后笑”是说同。同人至九五，反异归同，同终于占了优势，所以叫“先号咷后笑”。\n九五与谁同？与六二同。九五与六二同不是轻而易举的，需要经过斗争扫除障碍方可实现，所以叫做“大师克相遇”。","Y5.XN":"“同人之先”是“同人之先号咷而后笑”的省文。这是孔子作“小象”常用的方法。“直”就是“正”，“中直”就是“中正”。正写成直，是因为直与克为韵。孔子的意思是说，同人九五为什么先号咷后笑即能由异而归同呢？是因为九五位居中正。九五中正，与六二正应，二者相遇相同是必然的，暂时为九三、九四所阻隔，该同而不能同，故悲而号咷，然而终将得应于六二，故乐而笑。\n“大师相遇，言相克也”。同人内卦由同而异，外卦由异而同。反异归同，需要有大师先克而后才能相遇。大师是军队，克谓战胜。战胜九三、九四的阻隔，然后相遇。","Y6.N":"古代国家以邑为中心，邑外是郊，郊外是野。卦辞讲“同人于野”，有天下至公大同的意思。郊近于野，上九爻辞讲“同人于郊”，有无私的意思，但未达到至公大同的程度，所以不能得吉，不过无悔而已。","Y6.XN":"“于郊”距“于野”尚远，求天下至公大同之志终于未得实现。","Z":"同人卦总的说来有以下特点：第一，卦义是“同人于野”，欲与天下人同。但是有同必有异，有异方有同；同则生异，异必归同。所以九三讲“伏戎于莽”，九四讲“乘其墉”。同人卦六爻竟有两爻讲异，全卦由初至上构成一个自同而异，自异而同的发展过程。初九“同人于门”，六二“同人于宗”，这是同；“于宗”同的程度不如“于门”；至九三“伏戎于莽”，同转而为异。九四“乘其墉”，这是异；经过九五“同人先号咷而后笑”，至上九“同人于郊”异转而为同。第二，六二是同人之主，却未能表现出全卦大同之义。同人的广度，“于宗”不如“于门”，“于门”又不如“于郊”；“于郊”也远未达到卦辞“于野”的程度。同人卦六爻都未能表达出卦义来。"},"14":{"P":"《序卦传》说：“与人同者，物必归焉，故受之以大有。”大有与同人这两卦是相反的。天与火是同人，反过来，火在天上便是大有。同人是我与人同，大有是物归我有。为什么卦名叫大有呢？这卦只有一个阴爻居上卦之尊位，五个阳爻都来归于它，为它所包所有。《周易》以阳为大，以阴为小。众阳爻(大)皆为六五一阴爻(小)所有，所以叫大有。大有是所有者大的意思，也是无所不有的意思。","G.N":"在64卦中，卦辞只言“元亨”而别无它词的，只有大有一卦。卦辞一般都与卦名有关。大有只有一个阴爻六五，六五柔中居尊位，五个阳爻归于它，为它所有，为它所用，所以元亨。乾卦讲元、亨、利、贞，意义包含广大，指整个宇宙而言，而且四个字有四个独立的含义。别的卦讲元亨利贞，只说明一时一事的问题，而且含义与乾卦不同。在乾卦，元的意义是元始，是首出庶物，在别的卦，元的意义主要是大，同时也有善的意思。“元亨”是元之亨，即大亨，不是元与亨。在乾卦，“元亨”是元与亨，不是元之亨。","T.N":"“大有，柔得尊位大中而上下应之，曰大有”。这一句以卦体解释卦名。大有与同人两卦都是由一柔爻五刚爻组成。一柔爻在下卦之中的，曰“得位得中而应乎乾”，我同乎人，是为同人。一柔爻居上卦之中的，曰“尊位大中而上下应之”，人应乎我，我有其大，是为大有。同人之卦主是六二。“应乎乾”，我(六二)去应人。大有之卦主是六五。“上下应之”，上下五阳爻都来应我(六五)。凡一柔五刚之卦，柔在上的，曰“上下应之”；\n柔在下的，曰“应乎乾”。\n“其德刚健而文明，应乎天而时行，是以元亨”。这一句是以卦德卦体解释卦辞元亨的。“大有元亨”，其实“元亨”的意义决定于卦名“大有”，因为“大有”，所以“元亨”。《彖传》又从卦德卦体的角度进一步阐发了“元亨”的底蕴。内卦刚健，外卦文明。“刚健而文明，应乎天而时行”，兼言上下两体而赞其德。“应乎天”，是说外卦之六五应乎内卦之九二。“应乎天而时行”则是健不过刚，明不伤察，天下虽大，无所不通，所以元亨。","X.N":"卦之下体是乾，乾为天；上体是离，离为火。火在天上，普照万物，万物都在它的照耀之中，有大之象，所以叫做大有。孔子认为，君子观大有之象，应当“遏恶扬善，顺天休命”。善恶是人间事，天命是自然的规律。统治者要明察善恶，不违天命。善的要扬，恶的要抑，善恶分明。","Y1.N":"大有初九以阳居大有之初，处在卑下的地位，上面没有系应，必无骄盈之失，所以无交害。无交害谓无交则无害。“匪咎”，大有本无咎，然若以为“匪咎”而以易心处之，则反有咎。必也思艰兢畏，不生骄侈之心，则无咎。","Y1.XN":"“小象”用“无交害也”解释“大有初九”。大有初九以九居初，未与人交，所以无害。","Y2.N":"大车在古代是载重的车，用牛牵引。九二在大有之时与六五正应，为六五所信任、倚重。九二自身又是阳爻，有刚健之才；居柔位，有谦顺之德；又处下卦之中。九二具备这些条件，足可胜大有之任，有大车以载之象。任重行远，必然无咎。","Y2.XN":"“积中”二字补足了爻辞没有讲明的意思。九二取“大车以载”之象，是因为它以阳居阴又得中，谦而能容，道积于其内，很像大车重物载于其中，无往不利，无论怎样震撼击撞，都不会覆败。","Y3.N":"在大有之时，九三虽不居中但却得正，且以阳刚居下卦之上，有公居卿大夫之上之象。亨字，朱熹释作享，是对的。《左传》亨作享，朝献的意思。古文无享字，享献之享，亨通之亨，烹饪之烹，都用一个亨字。据《说文》，亨、享本是一字，故《易》中多互用。是亨是享，要视上下文而定，如这句爻辞的“公用亨于天子”，分明是享献之意，若释作亨通之亨便不对了。公指九三，天子指六五。九三，作为天子之外臣诸侯，处富有盛大之时，能将其所有朝献于天子，是正当的，可取的，而小人则做不到这一点。","Y3.XN":"“小象”用“小人害”解释爻辞“公用亨于天子，小人弗克”。如果是小人当大有之时，处三的地位，就不会“用亨于天子”而要为害了。","Y4.N":"彭字的意义，朱熹说不知道，程颐说“彭，盛多之貌”。程说根据《诗·齐风·载驱》“行人彭彭”和《诗·大雅·烝民》“四牡彭彭”之训，可从。“匪其彭”，盛多的反面，谦损的意思。九四已过中，在大有之时有过盛之象。过盛则极易发生问题。但是另一方面，九四以刚爻居柔位，能够谦损戒惧，警惕自己，不处其太盛，则可以无咎。","Y4.XN":"人在方盛之时，能够看到盛极必得咎的前景，因而注意自我损抑，不使过盛得咎，是“明辩晢”的。“明辩”，明智。“晢”，也是明智。“明辩晢”，明智又明智，非常明智。","Y5.N":"六五是大有卦的成卦之主，五个阳爻都归于它。它是阴爻，柔顺而居中，处在君位，能够虚己而与九二相应。它以孚信待下，下亦以信诚待它，上下以孚信相交通，可谓亲密相得，志同道合。这是大有之时，君臣上下关系的一个方面。六五虽是柔爻却在阳位，所以它有柔顺的一面，也有威严的一面。这就是“威如”。“威如”其实是指君之威仪而言。君要有君的威仪，让人看了畏惧。这是君臣上下关系的另一方面。大有之时，六五以柔居中处尊位，若能做到“交如”、“威如”，必吉。","Y5.XN":"君臣上下孚信交如，你以孚信待我，我以孚信待你，但关键在君即六五这一方面。六五以自己的孚信启发带动了九二诸爻的孚信之志。九二诸爻响应六五，与之“孚信交如”，乃发于心志，并非出于勉强。\n“威如之吉，易而无备也”，这一句各家解释不同。朱熹和程颐解释说，如果君上太柔，没有威严，那么臣下便不畏怕，不戒备了。孔颖达的看法与程朱相反，他以为是六五即君上“易而无备”，不是九二诸爻“易而无备”。六五之所以能够“威如”而得吉，不是因为它防范戒备臣下，恰恰相反，是因为它对臣下坦诚无私，推行简易，无所防备。看来孔氏之说较顺可从。","Y6.N":"《系辞传》说：“佑者助也。天之所助者顺也，人之所助者信也。履信思乎顺，又以尚贤也，是以自天佑之，吉无不利。”程颐和朱熹说“履信思乎顺，又以尚贤也”是上九的事。其实不然。“履信思顺，又尚贤也”，说的是六五，不是上九。六五“厥孚交如”是履信；以柔居尊位，是思顺；以一柔而有五刚，上九独在它的上面，它能尚之，是尚贤。因为履信思顺又尚贤，所以能获得天之佑助，吉无不利。这是六五之德应该得到的结果，至上九表现出来。六五是大有成卦之主，它的结果实际上也就是大有全卦的结果。这种情况在《周易》中并不少见，已经成了通例。如小畜上九“妇贞厉，月几望，君子征凶”，离上九“王用出征”，解上六“公用射隼”，师上六“大君有命”等，均非指上爻而言。","Y6.XN":"说“大有上吉”，是就全卦说的，说大有全卦最终吉无不利，不只说上九一爻。为什么说“自天佑”呢？古人把尚贤看得极重，以为大有之义莫大于尚贤，尚贤是最重要的。大有至六五还能尚上九之贤。大有发展到上九，已到极盛之时，盛极则衰，本来凶该降临了，但是因为六五尚上九之贤，所以竟得到了“吉无不利”的结果。这是天佑的缘故，似乎非人力所能为。不过这个天不是上帝神明，是事物发展的客观必然性。","Z":"大有由下乾上离二体组成。一个阴爻居于五，为五个阳爻所宗，五个阳爻之所有都为六五所有，所以卦名“大有”，而卦辞曰“大有元亨”。元亨就是大亨。大亨当然是再好不过了。至于六爻的爻义也都很好。初九言“艰则无咎”；九二有大车之材，任重而行远，有攸往而无咎；九三讲奉献，故曰“公用亨于天子”；九四能够损抑自谦，所以得“无咎”；六五以柔居君位，既能“厥孚交如”又能“威如”，故“吉”；上九，盛大已发展到极点，本该衰败，但是由于六五“履信思顺又尚贤”，而得“自天佑之吉

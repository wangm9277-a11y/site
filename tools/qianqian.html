":"象曰：久非其位，安得禽也。","Y4.XN":"九四所居非其位，不中而且不正。譬之于猎，纵能久持而不倦，终亦空手而已。","Y5.T":"六五，恒其德贞，妇人吉，夫子凶。","Y5.N":"九二阳爻而位阴，六五阴爻而位阳，二者于位皆不当，而皆能得中。九二所守者刚之中，故悔可亡。六五所守者柔之中，爻辞谓之恒其德贞：德以柔顺为体，而久守此柔顺不移，是即其恒也。然此柔顺之德，妇人守之，位斯为称，故吉；丈夫而守之，则所守者非其分，故凶。","Y5.X":"象曰：妇人贞吉，从一而终也。夫子制义，从妇凶也。","Y5.XN":"六五之恒其德贞，乃妇人之贞；其所系之吉，亦妇人之吉也。所以然者，妇人以专一为节，终其身不更二夫；六五久守柔顺，即以顺从为常，与妇人之从一而终者正相类，故有妇人贞吉之义。夫恒之为道，主于有常，而常之中未尝无变。九三之弊在徇变，六五之弊在泥常；徇变者其德不恒，泥常者德虽恒而有所偏。然六五柔而得中，所守者柔顺之德，是妇人之德，非丈夫之德也。丈夫者，制义者也，义所当从则从，义所不当从则断之于己。使丈夫而唯妇之是从，凶必及之。","Y6.T":"上六，振恒，凶。","Y6.N":"振者，奋而动之，抖擞振作之意，其动也疾。上六之位，阴爻而居阴位，又在一卦之颠。凡处高者宜静，而此爻之地，尤不当动。乃其时为恒之尽，其体又为震之终。恒而至尽，则久者将转而为不久；震而至终，则动者奋发而不能自止。不惟不安于静，其动也且无节。以此为恒，是谓振恒。振恒而凶，非不幸也，势所必至耳。","Y6.X":"象曰：振恒在上，大无功也。","Y6.XN":"恒非以动为尚，静则得之；而位在卦终者，尤非动地。今此爻跳动靡常，平白自生扰攘。若是者，岂徒无尺寸之功，其所丧也抑又大矣。","Z":"《易》道以中为贵，而恒之一卦，视他卦为尤甚。得中则能恒，失中则不能恒，此其大凡也。\n恒之六爻，不取上下相应之义，其得失一系于所居之体与所守之中否。初六处下体之最下，九四处上体之最下，两者皆未至乎恒者也；未至而强持，则滞于恒而不知有变，故初六为浚恒，九四为田无禽。九三据下体之顶，上六据上体之顶，两者皆已过乎恒者也；过则喜迁而难守，故九三为不恒其德，上六为振恒。求其能副恒之义者，独九二与六五耳，以其分处上下二体之中，于恒之旨最能得之。然六五柔而居阳位，所守者柔之中，故在妇人则吉，在夫子则凶；九二刚而居阴位，所守者刚之中，于恒义为最近，独惜其位之不正，未能尽善，仅得悔亡而已。一卦六爻，求其辞之最优者，不过悔亡而止；恒之无完爻，于此可见。\n咸之六爻亦然：不凶则吝，其最善者亦不过悔亡。而咸、恒两卦之卦辞，于六十四卦中却最为吉美。辞之与爻，何以相戾？昔人已尝致意于此。苏子瞻《易传》以两体相合立论：艮与兑合，咸象乃成；巽与震合，恒象乃成。合则其义周全，故卦辞吉。六爻则逐位而列，得于此者失于彼，咸恒之全义遂裂而不属，故两卦皆无完爻，而悔亡为最。此说是否可尽，犹待后论。"}},"33":{"id":"33","cnNum":"三三","name":"遯","pinyin":"dùn","fullName":"天山遯","shortFullName":"天山遯","upper":"乾","lower":"艮","upperNature":"天","lowerNature":"山","lines":[0,0,1,1,1,1],"yaoLabels":["初六","六二","九三","九四","九五","上九"],"blocks":{"P":"《序卦传》释恒为久，以为凡物不能常守一处，势穷则反，故遯承其后。遯之为言退也，即避而去之之谓。就卦体观之，上乾下艮；乾象天，艮象山。天体属阳，其性主进；山则隆然高起，而又以止为体，故有陵越而上、至其所而遂止之象。一欲上行，一至而止，两体相背而不相得，卦之所以名遯者在此。更以爻画言之，二阴自下浸生，正当阴势将盛、阳德渐消之候，小人之党日蕃，君子于是乎宜退，此又命名之一义。十二辟卦之序，遯当六月。","G":"遯，亨，小利贞。","G.N":"遯之世，阴方浸长而阳日退，小人渐握其势，君子于此唯有引避一途。然身可退，道不可退；道非徒不退，且将因退而益伸，此卦辞所以系之曰亨也。小人得路之日，君子见几而作，藏其器用，不使锋颖外露，是亦遯之一种。至“小利贞”云者，小者对大而言。当此阴柔虽长而未极盛，君子未可举其大者正之，唯小小者可以正。故宜缓辔徐图，以逊避为善处，用力于细行末事，一动一止皆不违于正，使彼小人无从伺其隙。","T":"彖曰：遯亨，遯而亨也，刚当位而应，与时行也。小利贞，浸而长也。遯之时义大矣哉。","T.N":"彖辞只言“遯亨”，传则增一“而”字，曰“遯而亨”，其意遂显：亨非固有，乃由遯而得。或问：君子既已敛藏，亨于何有？曰：所亨者非君子之身，亦非其藏之为藏，盖君子退而道因之而亨也。\n“刚当位而应，与时行也”一语，仍承上句而发。“遯而亨”三字当连读，非两事并列：避去在前，亨通在后，有是避乃有是亨；此句则推原其何以致亨。九五以刚德处阳位，既中且正，其下又得六二之中正为己之应。卦才若此，则虽在避世之日，君子固未尝一无所措置；盈虚消息，因时为节，力所逮者犹将勉焉。“与时行”三字，正谓随宜进退，非谓一遯之外更无余事。\n“小利贞，浸而长也”，则以卦画明之。以两卦相校，临之阳居下体者二，传谓之“刚浸而长”；此卦阴居下体者亦二，传则但曰“浸而长”，“柔”字未著。然其实固柔之浸长，谓二阴渐次滋蔓也。君子于此不当奋然兴作，仅可小有所正，职是之由——群阴浸盛，小人之势日张故耳。\n末句“遯之时义大矣哉”，乃孔子赞辞。其旨盖恐人见“小利贞”仅为细行末事，遂置之不思、不为其所当为。不知他日之大有所正，其基正立于此；未来之利贞，即孕育涵养于今日小小之正之中。故叹其时义之大。","X":"象曰：天下有山，遯。君子以远小人，不恶而严。","X.N":"上为天，下为山。山形隆起而其体止，天则运行不息，二者趣向相背，避去之象昭然。君子睹此，于远小人之道有所取法。当遯之时，所以处小人者，莫善于“不恶而严”。恶者，憎恶之谓。胸中果存憎恶而形于辞色，彼必觉之；既觉则怨毒生而中伤至，虽有远之之心，终不可得而远。故憎恶之意当藏，界限之分必峻：所守者义，所持者正，一事之可否不稍假借，使彼知其不可干犯。外不失和顺，内存其贞正，接之以礼而守之以坚，斯二者，即“不恶而严”之实。","Y1.T":"初六，遯尾厉，勿用有攸往。","Y1.N":"一卦之中，初二两画皆阴，是为小人之象。若逐爻而论，则六位所寓者莫非君子，特君子遭遯之六种境地耳。诸卦之例，下位为初，事之始亦归焉；此卦所主在避，先去者贵，处后者贱。初既在六画之末，遂目之为尾。避乱而堕于人后，为人尾闾，其势最险。然则如之何？进而复进，前路或逢其祸；止而不行，免患之数反多。故戒之曰“勿用有攸往”。初六体阴质柔而位在卑下，名位既微，伏处不出即同于遯；苟贸然前往，危厉且有加焉。","Y1.X":"象曰：遯尾之厉，不往何灾也。","Y1.XN":"几微甫动即翩然先去，上也。已落其后而犹逐队奔驰，危矣。往则厉，不往则晦其迹、藏其用，灾复何自而至？","Y2.T":"六二，执之用黄牛之革，莫之胜说。","Y2.N":"“说”当读为“脱”，脱即解去之义。黄者，五色之居中者也；牛性驯顺；革则坚韧难断之物。六爻之中，五爻皆系以“遯”字，独六二无之。盖六二以阴处阴，位既得而体又中，执中正以应乎九五；九五以阳处阳，位得而中亦如之，复以中正亲比于六二。两情相与，固结而不可解，譬若取黄牛之皮为绳，缚而系之，虽有力者亦莫能擘而开之。","Y2.X":"象曰：执用黄牛，固志也。","Y2.XN":"“执用黄牛”，乃“执之用黄牛之革”之省文。所谓“固志”，指六二与九五各以中顺相结，此志既坚，外力无可摇夺，如革之缠缚，无有能脱之者。","Y3.T":"九三，系遯，有疾厉，畜臣妾吉。","Y3.N":"当遯之世，贵乎决而去之，去之惟恐不速。九三则有所系恋，既不能远举，亦不能疾行，故其处境不佳，如身婴沉疾而濒于危。所系者谁？上九非其正应，六二乃与之切近相比，是为六二所牵，遂不得脱。此比也，属暱近之比而非阴阳正应，其相与也，乃君子遇小人之象，非君子之交君子。然则处之何如？曰：畜臣妾而已。臣妾者，妇人与仆隶之谓。古人之论，谓仆妾与细人最不易畜：昵之则僭上，斥之则怀怨。九三欲遯而势不能遯，唯有以畜臣妾之术御之：不使之昵，亦不使之离，憎恶不形而堤防自峻。如是则吉。","Y3.X":"象曰：系遯之厉，有疾惫也。畜臣妾吉，不可大事也。","Y3.XN":"系累在中，欲去不得，故危。危之所自出，困惫也；惫之所自出，疾也。九三处此，惟有以刚自持，待小人以畜臣妾之方而已。盖斯时也，大有所为非唯不当，抑亦不能。","Y4.T":"九四，好遯，君子吉，小人否。","Y4.N":"爻中之“好”，音从上声，与去声迥别，此先须辨者。九四与初六为正应，相与之情本厚。然九四刚健之君子也，当避世之际，虽心有所爱悦，终不为此所牵，断然引去而无迟疑。其去也，襟怀安舒，略无怨尤，不作悻悻忿戾之态，吉之道也。爻辞系以“小人否”，此“否”乃不然之否，非泰否之否。盖好遯之事，君子能之，小人则不能：小人虽至不得已而退，亦必含怒而行，非能好遯者也。故小人无吉。","Y4.X":"象曰：君子好遯，小人否也。","Y4.XN":"遯而谓之好，惟君子能之，小人则否。当去即去，不以情好自累，其去也舒缓自得，不使愠色见于面——此岂小人所能及？","Y5.T":"九五，嘉遯，贞吉。","Y5.N":"嘉者，美善之称。嘉遯云者，视好遯又进一等。九五刚而居尊，得中且正；虽与六二相应，然六二亦中正自守，适足以相济而不相累。惟其内守中正，故可止则止、可行则行，见地既明，措置亦当，于遯之一事最为合宜，是以守正而获吉。","Y5.X":"象曰：嘉遯贞吉，以正志也。","Y5.XN":"志为行之帅，未有其志不正而所动合宜者。九五之获吉，非幸也：中正其体，而所应之六二又中正，两者相求，其志先定于内，故事至而应之无失。人之或行或止，去留进退，得当与否，视其志正不正而已。","Y6.T":"上九，肥遯无不利。","Y6.N":"肥者，宽大充盈之谓，宽绰而有余地，与“疾惫”适相对反。上九以刚德居外体之上，位在事外，处遯之时最为得地，可以高举远引，一往而无留滞。又有一善：内无所应，既无牵引，亦无羁累，胸中不生疑贰。在外既远，于内又无所系，故当遯道穷困之际，独能脱然无碍，决然引退，志量宽舒，恢恢乎其有余。遯若此者，何往而不利？","Y6.X":"象曰：肥遯无不利，无所疑也。","Y6.XN":"上九之利，其要在一“无疑”。四阳之中，此爻为最。就彼三阳观之：三暱于二，四牵于初，五亦系于二，累既各在，疑即随之。独上九上下无交，纤芥不挂，向之所谓疑者，至是尽消。","Z":"遯之六画，四阳二阴。阳以次而退，阴以次而进，此正小人向盛、君子当藏之世也。处此世者，能遯则亨；大事虽未可为，小者犹可正焉。分观两体：艮以止为德，故居下之三画，其义皆在不去——初潜处而不行，二则缠结如革而莫能解，三则被牵而不得脱。乾以行为德，故居上之三画，其义皆在能去——四名之曰好，五名之曰嘉，上名之曰肥。上体三爻，系应愈少则愈善，去二阴愈远则愈善。九四之好，不及九五之嘉；然好与嘉虽皆可称，一则应初，一则应二，皆有所系，皆不能自决于去，其距二阴亦非甚远，是以俱不若上九之肥。上九居卦外之极，内无应援，心无芥蒂，飘然高举；时虽困穷，而去之独决，襟度宽然，绰乎有余，六爻之中最善处遯者也。\n抑此卦所寄，大抵政治之意为多。君子、小人二名，卦中明著之，其所指不在爵位之高下，而在为政者德行与主张之相背。小人之势渐张之日，君子所以自处者当有活法：或严其崖岸而不形憎恶，或奉身而退以俟时变，要于持守不失其正而已。故遯之为道，乃政争中一权宜之策，与道家逃世绝俗、遗弃人事之旨，判然不同。"}},"34":{"id":"34","cnNum":"三四","name":"大壮","pinyin":"dà zhuàng","fullName":"雷天大壮","shortFullName":"雷天大壮","upper":"震","lower":"乾","upperNature":"雷","lowerNature":"天","lines":[1,1,1,1,0,0],"yaoLabels":["初九","九二","九三","九四","六五","上六"],"blocks":{"P":"《序卦传》以退释遯，谓凡物未有久退而不返者，故大壮继遯而起。夫遯之世，阴浸长而阳退避，其义主于违去；大壮则阳之壮也，壮之为言，强盛之谓。天下之理，衰极必盛，消久必长，既已退避，自当转趋壮盛，此其相承之序也。就卦体言，下乾上震，以刚健之质发而为动，动而不馁，是壮之实。阳大阴小，乃《易》之定名；此卦阳画已积至四，越乎三画之中，四阳并进，故有“大者壮”之义。再观其象，雷震奋发于天表，威行于上，亦大壮之所以名也。","G":"大壮，利贞。","G.N":"大壮之世，阳德方盛，吉亨本不待言。然卦辞必系以“利贞”者，正谓壮而不出于正，则其所壮者亦只常人血气之强，非君子所尚之道。处壮之时，所忌莫甚于恃壮；一有自恃之心，壮即失其正矣。观爻可见：阳画而居阴位者多吉，阳画而据阳位者辄凶辄厉。此非偶然，实卦辞垂戒之旨——壮不可恃，尤不可过。\n卦名带“大”字者，六十四卦中仅四见。大有而外，大畜、大过、大壮皆四阳之卦。四阳何以独得大名？盖阴阳之数，至三而适均，至四则偏胜而极。大壮之阳，自初爻递长以至于四，九四一爻实为之主；合全体观之，乾阳包于内，震动施于外，名之所以立也。若以十二辟卦配月，此卦当仲春之二月。","T":"彖曰：大壮，大者壮也。刚以动，故壮。大壮利贞，大者正也。正大而天地之情可见矣。","T.N":"传释卦名，先曰“大者壮也”，继曰“刚以动，故壮”。所谓大者，指刚阳言之；所谓小者，指阴柔言之，此全书之通例。寰宇之内，能壮者唯刚阳，唯大者；阴柔纤小，本无壮之可言。然刚阳之壮亦非无待而然：必也其体为刚，其用为动，动而不息，然后壮可见。“刚以动”三字，正指乾在下、震在上，刚质具而复能以动发之，卦名由此而立。\n“大壮利贞，大者正也。正大而天地之情可见矣”，此释利贞之义。壮之主者为大，故曰大壮；壮而必归之于正，故曰利贞。四字之中，实含三层：一者，壮之主体属乎大；二者，大之势用见乎壮；三者，大之本体止乎正。前二层合观，明刚阳可壮而阴柔不可壮，且刚阳之壮亦限于动之际——所谓壮，自其动者言之。第三层则更进一步：徒壮不足以尽之，必也正焉；正者，自其静者言之。合三层而一之，“大壮利贞”云者，体既宏大，势复强盛，而中无邪僻之谓也。\n万物万事之中，大而未壮者，不足为病；若既大且壮而失其正，则祸必随之。史册所载暴君强梁，其力非不厚，其势非不盛，徒以失正之故，流毒遍于天下。\n正大犹言大正。天地之为物，就大而言已无可复加，就正而言亦无可复加。既大且壮，既大且正，此天地昭著之性，不待深求而可见；见其正大，则天地之情亦见矣。此处“情”字，就静处、显处言天地之实状；《彖传》他处所言“天地之心”，则就动处、隐处言天地之定则，二者所指不同。\n咸、恒、萃三卦，其《彖传》并称“天地万物之情”，而此卦独举天地，不及万物。何也？咸主感，恒主常，萃主聚，凡万物皆可与此三者同其途；至于正与大，则非万物所能与天地并论，故讳而不言。","X":"象曰：雷在天上，大壮。君子以非礼弗履。","X.N":"雷动而上薄于天，声威奋迅，是大而且壮之象。大壮之名，实兼三义：大也，大者壮也，大者正也，《彖传》“大者正也”一语已摄其要。三者浑融为一，天地间至伟之力于是乎见。\n君子玩此象而施之于身，当何如？儒家修己之学，孔子一以反身为本。其所期于君子者，在以全力胜己，而不在以力胜人。胜己之术，莫切于“非礼弗履”——一念一起、一事一为，苟非礼之所许，则断然不履。此与《论语》“克己复礼为仁”之旨，同条共贯。","Y1.T":"初九，壮于趾，征凶有孚。","Y1.N":"趾居一身之下，为举步所由起。初爻处下，其象为趾；于此而逞其壮，是躁动求进之态，凶必及之，故曰征凶。“有孚”二字，通常训为诚信，于他卦皆美辞；此爻则反其读——“征凶有孚”，言往而取凶，灼然无可疑耳。\n初九刚而居刚，际阳壮之时，依常理论宜若无咎，而爻辞乃系以征凶，其故安在？全卦之旨，贵刚之壮；逐爻之旨，则又以济柔为善、纯刚为失。初九之刚有三重：本体阳也，所隶乾体又阳也，所处之位复阳也。大壮本以“刚以动”为义，动而纯刚，则壮有过而无所裁，宜其往而获凶。","Y1.X":"象曰：壮于趾，其孚穷也。","Y1.XN":"处最下而纯以刚用，刚过则行躁，穷而致凶，可断言也。","Y2.T":"九二，贞吉。","Y2.N":"初二两爻，同为阳画，同当阳壮之世，而一凶一吉，判然不侔。其分界所在，唯在得中与否：九二刚柔相济，壮而不溢，故贞吉。\n再析之：二为阴位，九为阳质，质刚而位柔，两者相须，壮势自然有所节。然此犹其浅者，要义在于九二之居中。壮而能中，则动必合度。譬之人禀刚决猛厉之资，而居心持中，临事自审深浅，过者裁之，不及者益之，未有不出于正者。正则吉矣。","Y2.X":"象曰：九二贞吉，以中也。","Y2.XN":"九二之得贞吉，其枢在一“中”字。非徒刚柔相济之效，实由所处得中。贞也、吉也，皆自此一字流出。","Y3.T":"九三，小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","Y3.N":"论九三之才：爻刚而位阳，又当乾体将尽之处；刚胜而无中以节之，故为强梁有力之资。使小人而当此，必恃其强以陵轹乎人。譬如羝羊性狠而力猛，凡前有藩篱，辄以角触之，角终以是而羸。爻辞“贞厉”之意即在此：若循此以往而不知返，危厉之至，犹羝羊之羸角也。“君子用罔”，罔者，勿也、弗也、不也——君子当此，绝不效小人之恃壮陵人。","Y3.X":"象曰：小人用壮，君子罔也。","Y3.XN":"壮者，小人之所长，君子则舍而弗用。“君子用罔”与遯卦九四之称“好遯”者同类：彼以好遯归君子、以否归小人，此以用壮归小人、以罔归君子，皆两造对举而取舍相反之辞。孔子于小象省去一“用”字，径作“君子罔也”，爻义遂无可疑。","Y4.T":"九四，贞吉悔亡。藩决不羸。壮于大舆之輹。","Y4.N":"九四与九二，同以阳画处阴位，刚得柔以为济，故皆不至于过壮。然九四居四阳之末，势已骎骎向上，亦有易溢之虞，爻辞所以先之以“贞吉”：能守正，则吉乃可得。既贞且吉，则进也从容，不至于有失，故又继之曰“悔亡”。\n“藩决不羸”一语，承九三爻辞而来。九三之前有九四为梗，如行遇藩，藩未开而角先伤。九四则不然：其前唯二阴，力薄不足为阻，藩不待触而自决，角羸之患何由而生？途既无梗，车壮而利于行，爻辞遂系以“壮于大舆之复”。复与辐异：辐在轮，复在轴，轴间之复壮健，则车行利便。车强而无败，壮于前进，斯其谓矣。","Y4.X":"象曰：藩决不羸，尚往也。","Y4.XN":"九四之辞，至小象乃下一“尚往”，尚往者，进而不已之谓。爻辞于“贞吉悔亡”之下缀以“藩决不羸，壮于大舆之复”，读者易疑九四居阴而其势不进；小象特举此二字，正明其所言者进，非止也。","Y5.T":"六五，丧羊于易，无悔。","Y5.N":"羊之性刚，此卦取以喻诸阳之方长而竞进者。六五以柔德处尊，居上而驭下，于群阳之并进不与之角力，唯以和易之道驯扰之，使其刚无所施、壮无所用，此所谓“丧羊于易”也。和易者，不假威猛而自然相安之谓。如此处之，可以无悔。","Y5.X":"象曰：丧羊于易，位不当也。","Y5.XN":"六五之无悔，象以“位不当”释之。位之当否，在《易》有定例：刚居刚位、柔居柔位为当，刚居柔位、柔居刚位为不当。当者为美，不当者为劣，此其常也。然有常必有变：有些卦中，不当者反美，当者反劣。大壮即属变例。\n验之六爻：初九、九三皆位当，而其辞一为“征凶”，一为“贞厉”；九二、九四、六五皆位不当，而其辞非“贞吉”即“无悔”。优劣之数，适与常例相反。六五之体，位刚而质柔，正坐不当。夫不当本非美事，而在此爻转为美者，盖以柔处刚，刚柔相调，遂成柔顺和易之德，然后能使强阳之群帖然听命，丧羊于易而无悔也。","Y6.T":"上六，羝羊触藩，不能退，不能遂，无攸利，艰则吉。","Y6.N":"上六居一卦之终，当壮之尽、动之穷，前无所进，后无所退，其境恰似羝羊之角县系藩上，欲退不能，欲遂不得。处此者，动辄窒碍，故曰“无攸利”。然爻辞续言“艰则吉”：艰者，非徒遇艰之谓，乃知其艰而深思熟虑、不敢以轻心处之之谓。如此则吉。","Y6.X":"象曰：不能退，不能遂，不详也。艰则吉，咎不长也。","Y6.XN":"人情于事，视为易则忽，视为艰则慎。祸患之来，十九起于忽。上六曩者以虑事不审而获罪，今则惩前毖后，凡有举措必详必慎，故其咎旋消。","Z":"《杂卦传》曰：“大壮则止。”壮之所施，唯在刚阳之大者，故卦名曰大壮；刚阳之体日增而无所屈，则谓之盛长。方其盛长，即其宜有所止之候。然势方骎骎向上而遽责以止，其事甚难。止之节度，系于所守之正否，故卦辞止于“大壮利贞”四字，无所增益。\n爻辞之指，与卦辞同归。四画皆阳，惟初九以壮致累，余三爻之辞则不离乎贞。《彖传》见之尤彻，直揭“大壮利贞，大者正也”之旨。夫天地可谓至大至正矣，而天地之所以为正，正在刚柔之交相为用。\n征诸六爻：刚处柔、柔处刚者皆利，刚处刚、柔处柔者皆否。是爻位之正者反劣，不正者反优。盖刚阳当长之日，所贵不在得位，而转在不正之位；不正，则刚得柔以相济，济乃所以为正也。此理于九二、六五最著：九二贞吉而位不当，小象曰“以中也”；六五无悔，小象曰“位不当也”。以柔居刚，位非其当，而刚柔相济之正，即由是而出。故知大壮之正，不在位之得，而在刚柔之相调。"}},"35":{"id":"35","cnNum":"三五","name":"晋","pinyin":"jìn","fullName":"火地晋","shortFullName":"火地晋","upper":"离","lower":"坤","upperNature":"火","lowerNature":"地","lines":[0,0,0,1,0,1],"yaoLabels":["初六","六二","六三","九四","六五","上九"],"blocks":{"P":"《序卦传》以晋承大壮，其言曰：物之壮者不可终守，必有所进；晋之取名，即由于此。凡物壮盛之极，自然生出向前之势；有壮为之基，方有进之可言，故两卦相次。以声义求之，晋之与进，音既相袭，义亦相因，并是前行之谓。然卦名独取晋而不取进者，盖晋字于前行之外，兼摄光明盛大之意。卦体内坤外离，离踞坤上，正是明出地上之象——譬如朝日初离地平，冉冉而升，愈上愈显其盛。此景唯晋字足以当之。","G":"晋，康侯用锡马蕃庶，昼日三接。","G.N":"侯之名，非独为天子之臣而已：受封而自有其国，于卿大夫则为君，于天子则为臣，一身而具两重之分。康侯者，非寻常之侯也：其才其势，皆足敷安民治国平天下之用。所谓“用”者，于此不为实义，特语助耳。锡与赐同。古以马与车为重赐，非常物可比。蕃者，孳息之谓；庶者，众多之称。二字连属，则所赐之马，品类既殊，数目亦夥。然则晋之为义何如？诸侯以臣职自效于天子，行有可纪，遂蒙眷遇：马既盈厩，而接见之数且至一日再三。厚赐与亲遇，二者并极乎其至。就古世言之，晋之大者，无过人臣以德功见知于上；而见知于上之极，又无过康侯。凡世所称晋者，康侯一义尽摄之矣。六十四卦之辞，唯晋为异：所举止于一侯，他事不与焉。康侯之晋既如是，则卦辞之亨与其利贞，可推而知，不必更著。","T":"彖曰：晋，进也。明出地上，顺而丽乎大明，柔进而上行。是以康侯用锡马蕃庶，昼日三接也。","T.N":"《彖》之释晋，可分三层：首明字义，次即象与德以释卦辞，终乃归之于康侯。“晋，进也”，是以行训名。然行之外，晋又寓光明盛大之象；二义相合，乃为进而盛。此一层也。“明出地上”云者，卦之上体为离，下体为坤，离居坤表，若日之升于地。四字之用，尤在释名：光盛而势向前，卦之得名，职由于此。“顺而丽乎大明”，此以卦德言也。顺者坤之本然，明而能丽者，离之所擅。合而观之，则柔质依托于光明：在物为坤之附离，在人为顺臣之附明主。“柔进而上行”，稽之全经：上体非离，则《彖传》无“上行”之语；上体为离者八，而言此者止睽、鼎、晋三卦。所目者六五是也——柔顺明丽而居君位。末二语，皆系于康侯之德。康侯者，能安其国者也，柔顺而明。在本国为君，则一国之民赖以安；在天子之下为臣，则天子之明德是承，而眷遇以隆。车马之锡、一日三接之荣，皆此之由。","X":"象曰：明出地上，晋。君子以自昭明德。","X.N":"太阳离地而升，愈高愈盛；然其光非出地而后有。未出之顷与既出之后，一样光景，未尝有所加减。君子玩此象，知吾心自具之明，本不待外求，唯在举而著之而已。《大学》“明明德”之教，正与此合。六十四卦《大象》之中，以君子自作主张之辞立言者，独乾、晋二卦。乾言“自强不息”，是取己之力而用之；晋言“自昭明德”，是取己之明而用之。","Y1.T":"初六，晋如摧如，贞吉，罔孚，裕无咎。","Y1.N":"晋如者，升而上也；摧如者，抑而却也。初六一阴居一卦之始，适当晋之初，初不计较于进退。其进也，顺而动，则谓之晋如；其不进也，抑而却，则谓之摧如。进退虽殊，所守者一于正。正立则吉自随之。然位卑而时浅，上下之情未必相孚。处此者，宜宽不宜迫：躁于求升非也，怨于见抑亦非也。从容自将，咎何由至。","Y1.X":"象曰：晋如摧如，独行正也。裕无咎，未受命也。","Y1.XN":"进有所可，则进而已；退有所宜，则退而止。进而无所矜喜，退而无所沮丧，行吾之正而已。“未受命”云者，初六未有职任之命，既无官司之守，又无谏诤之责，故行止由己，绰然宽然，不窘于进退。","Y2.T":"六二，晋如愁如，贞吉，受兹介福，于其王母。","Y2.N":"晋之六爻，初、三、四、上皆以刚柔相配而应，独二与五不应。六二之质，柔而居中，位复得正，中正柔顺兼而有之，原非锐于求进者流。故其于进也，不以为喜而以为忧，“晋如愁如”之象生焉。能如是，是即所谓贞；贞则吉可前知。自久远者观之，六二终当“受兹介福，于其王母”。介福者，大福也；王母者，祖母也。六二上无应援，自力而进，其事诚难。然中正之德具在，久而人识其贤，必有同德者为之先容，招之使出，进其位，厚其禄，而大福归焉。致之者谁？六五也，六五即王母是已。夫二五之际，苟为正面之应，则取君臣之象；今两阴相与，应而非正，则取妣妇之象。妣妇而系以王母，不曰母而曰王母，其故在于古之昭穆：孙妇之祔，祔于祖姑而不祔于姑，是孙妇与祖姑相配也。《易》之设辞，配即为应；六五之系以王母，正用此例。","Y2.X":"象曰：受兹介福，以中正也。","Y2.XN":"六二何以致福？不过守中抱正而已。惟其中正自持，故不肯徼幸于一旦，而其进也卒不可遏。","Y3.T":"六三，众允，悔亡。","Y3.N":"六三以阴爻处阳位，不中不正，于常理本当有悔。然其所居，为下体坤卦之上，柔顺已极；又与上九为正应，志在上行。初六、六二二阴亦皆有上进之心，故乐见六三之顺乎上，且愿与之偕行。行事而获同志之拥戴，众既允从，其悔自消。","Y3.X":"象曰：众允之志，上行也。","Y3.XN":"六三上应上九，其志本在上行，又为初二二阴所信从，悔于何有。试较三爻：初六未孚于人，众允不足；六二虽受福，尚有所待；至六三，则众志既同，上行之事已不徒为虚愿。","Y4.T":"九四，晋如鼫鼠，贞厉。","Y4.N":"鼫读为硕，《诗》之所刺硕鼠者是也。其性贪食而怯人。九四一阳逼近君侧，以卦辞准之，分位恰似康侯；而爻辞所取，乃与之大异：不予康侯之名，而系以鼫鼠之目。此何故哉？晋之为义，柔者为主；九四刚而处柔，位既失当，揆之时义亦相背而驰。既贪居高位，又无柔顺之节，于在下三阴之将进者，不能不忌而畏之。当晋之世而存保位固宠之私，蹈硕鼠之辙，危厉不待言矣。","Y4.X":"象曰：鼫鼠贞厉，位不当也。","Y4.XN":"九四所病，根在居位不当。析而观之：刚爻而居柔位，此爻位之不当也；以贪昧猜忌之资，窃踞近君之地，能薄而任重，就事理言，亦未始非不当也。","Y5.T":"六五，悔亡，失得勿恤，往吉无不利。","Y5.N":"六五体柔而据尊，依常例当有悔。然晋卦之所主者正在此爻，《彖传》称“顺而丽乎大明”之康侯，即指六五。其为大明之宗，众阴咸顺附之，悔之所以得亡也。顾其才终属柔顺，而时当晋，得失之念最易为累，主大明者不可不察。于众人，于贤者尤然：当推腹心以任之，俾各效其能；勿自用其明，而戚戚于得丧。得失两忘，则所行皆吉，无往不利。","Y5.X":"象曰：失得勿恤，往有庆也。","Y5.XN":"六五居大明之位，开诚以任贤才，不以得失撄其心；循是而行，乃一国之福庆也。","Y6.T":"上九，晋其角，维用伐邑。厉吉无咎，贞吝。","Y6.N":"角者，兽之所戴；邑者，己之所领。上九以刚处晋之终，境最不佳。兽之有角，戴于首而更无可上，其象与上九适相肖也。盖晋之为道，柔则亨，刚则否；而上九又际其穷，前路已无可复进。故取“晋其角”为象：欲进则无地可容，无地可容而犹躁然求进，危厉于是乎生。“维用伐邑”者，谓转此躁求之力，施之于自伐其邑。伐邑非攻人之城，乃反躬自克之谓：敛其外向之心，先治己私。是亦知进知退、以退易进之术也。虽然，吉与无咎，仅可幸得；究其归趣，终属不中不正，无中和之美，绳以严格，吝犹在焉。","Y6.X":"象曰：维用伐邑，道未光也。","Y6.XN":"爻辞于“伐邑”既许其吉且无咎，而复缀以“贞吝”，何也？病在其道之未光。盖以不中不正之资，虽有一时矫刚自克之效，于道终有未尽。功仅足以补过，未足以言光大，故许之而仍惜之。","Z":"言进者三卦：晋也，升也，渐也，而其进之状则各有辨。譬之日升于地，光盛而气锐，晋之进也，三卦之中于义为最。木之初萌，生意方动，升之进也，视晋则逊。木之既长，积渐而高，渐之进也，又视升而逊。若晋之进，则“柔进而上行”者是已：其道尚柔而不尚刚，柔而进则善，刚而进则否。通计六位，阴得其四，阳得其二，而吉凶之数遂分：柔者多吉，刚者多厉。坤体之三爻，质皆柔顺，吉则初、二当之，三仅免于悔而已。至于上三爻，九四、上九并以刚致厉，而终亦吝，六爻之中此为最下——刚而不当位故也。唯六五以柔处尊，适符《彖传》“顺而丽乎大明，柔进而上行”之义，为卦之主，于六爻中独称最善，所往皆吉，无所不利。"}},"36":{"id":"36","cnNum":"三六","name":"明夷","pinyin":"míng yí","fullName":"地火明夷","shortFullName":"地火明夷","upper":"坤","lower":"离","upperNature":"地","lowerNature":"火","lines":[1,0,1,0,0,0],"yaoLabels":["初九","六二","九三","六四","六五","上六"],"blocks":{"P":"《序卦传》释晋为进，以为进而无所止，则伤随之，故晋之后次以明夷；夷者，伤也。此卦离下坤上，日没于地，其体与晋相覆。晋为明盛之世，君道上昭，众贤汇进；明夷则晦乱之世，主德既昏，有明者反蒙其害。日光不入地上而入地中，就人事言，是明者见伤；就时势言，是暗者方盛。两端者，一事之表里也。","G":"明夷，利艰贞。","G.N":"夷之训为伤，《杂卦传》又以“诛”释之，诛、伤其义相通。日既入地，映之于世，即政刑昏乱之秋。士君子不幸而遭此，所可守者唯有两言：知其艰而勿失其正。随俗倾侧、逐人步趋，皆自丧其明者也。“利艰贞”三字，爻辞中噬嗑九四、大畜九三尝一发之，独明夷取以系于卦下，则一卦之全局系焉。圣人于忧患之世，其告语之切如此。","T":"彖曰：明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也。内难而能正其志，箕子以之。","T.N":"“明入地中”四字，是以卦画之象定卦名。晋与明夷两卦，彖传与大象取辞相同，此其例也。\n“内文明而外柔顺，以蒙大难，文王以之”——内体为离，离主文明；外体为坤，坤主柔顺。合而言之，是蕴文明之德于中，而形柔顺之节于外。文王当纣之世，暴虐方张，正赖此道，故身履大难而卒脱于祸。\n“利艰贞，晦其明也；内难而能正其志，箕子以之”——处晦世而求自全，舍艰贞无他路。此语含两义：处艰则藏其明，处艰则守其正，二者相须而不可偏废。箕子其事可当之。当殷纣之时，被发佯狂以自晦，拘囚为奴而不易其守，晦与正两得之矣。纣为箕子之亲，其祸行于宗族之内，故曰内难；文王所系者天下之义，其祸及于四海，故曰大难。难一而已，所系有大小，则所以处之者亦别。","X":"象曰：明入地中，明夷。君子以莅众用晦而明。","X.N":"日既没于地下，而其光不熄，特藏焉耳。君子体此以莅众：不以察察为明，而以浑厚容物，明者自寓于宽厚之中。此非废明而就暗也，蓄其明而不尽用，使人可亲而不可欺，古来论治者多主此义。谚所谓水太清则鱼无所匿，察太甚则人无所容，其旨正合。","Y1.T":"初九，明夷于飞，垂其翼。君子于行，三日不食。有攸往，主人有言。","Y1.N":"初九以阳刚居一卦之始，伤犹未及，祸尚未形。然君子见几于早，不俟难成而后避。“于飞”者，言其去之疾，如鸟之高举。“垂其翼”者，言其行之隐，敛翼低回而下，不欲为人所睹。既决去禄位，则举足即行，虽三日绝粮不以为止；主人即有责言，亦有所不暇恤。","Y1.X":"象曰：君子于行，义不食也。","Y1.XN":"难未作而先去，去之又速，此君子之几也。飞、行、往、不食，事虽殊致，揆之于义则皆不可已。","Y2.T":"六二，明夷，夷于左股，用拯马壮，吉。","Y2.N":"六二以阴爻居阴位，处下体之中而位得其正，柔顺之极，又为一卦之明所寄。此善于因时自处者也。然当晦乱之世，虽善处者亦不能无伤。“夷于左股”，所伤者偏而未深，未足为害。“用拯马壮”者，救之之力强、赴之之时速，故能脱于伤而获吉。然所谓吉，止于免祸而已，非谓此时可进取有为也。","Y2.X":"象曰：六二之吉，顺以则也。","Y2.XN":"二为明之所寄，履晦世而卒免于伤，其故在顺而有则。顺者不抗，则者不流，柔顺之中自有准绳。","Y3.T":"九三，明夷于南狩，得其大首，不可疾贞。","Y3.N":"南者，向明之方，亦前进之谓。狩之为言，取禽兽以去灾害；南狩者，向明而进，除其所害也。大首谓暗类之渠魁，非泛言群众。九三居离体之上，其明至极而在下卦之终；上六居坤体之上，其暗至极而为一卦之首。两爻位均而德反，正为敌应，故有至明克至暗之象。“不可疾贞”者，克其魁首则事定，若夫风俗之移、生民之安，非旦夕可期，不可求治太急。此盖取武王伐纣之事为言。","Y3.X":"象曰：南狩之志，乃大得也。","Y3.XN":"志在南狩，所期者除害而安民；志既得遂，故象以为“大得”。","Y4.T":"六四，入于左腹，获明夷之心，于出门庭。","Y4.N":"下三爻皆在离明之体，位处暗外，是明而被害者也。六四始入坤，坤者，一卦之暗府。既入暗地，则当谋所以去之，勿使暗得而伤我。六四之去为易：居坤之最下，未深陷于暗；体柔而位正，未失其守；爻辞止曰“入于左腹”，可见其陷之浅。求其人以实之，则微子之去殷而适周，其事近是。“于出门庭”者，纣恶已稔，宗社将倾，微子断然远引，出于其族之门外而之周也。“获明夷之心”者，明夷之理得于中，而后举足无所疑。所谓理者，正谓处此晦世当如何自处。","Y4.X":"象曰：入于左腹，获心意也。","Y4.XN":"爻辞举“入于左腹”四字，乃全句之省文；象传称“获心意”，即经之“获明夷之心”，辞异而旨同。微子之行，于宗族为背，于心不能无恻然，非有卓然不移之信，不能决此。故必先有见于弃暗投明之义，而后能胜其亲亲之痛。","Y5.T":"六五，箕子之明夷，利贞。","Y5.N":"《易》之位，五为君。然爻随时变，位号不必尽拘；五虽处尊，有时不得为君。明夷则以上六当君位，六五降而为臣。上六阴居阴位，积暗已极，专以伤明为事，是一卦之主，其象如纣。六五密迩于上，锋芒所及，首蒙其祸，其象如箕子。箕子之难，难在三者皆穷：欲匡正则势不相敌，欲挟救则力不相及，欲引去则义不得去。箕子处之有道：不正、不救、不去，而惟晦其明，被发佯狂、屈身为奴以避其害，其中则守正不移。爻辞所称“箕子之明夷”，即谓所处之难与所处之方如此。","Y5.X":"象曰：箕子之贞，明不可息也。","Y5.XN":"象传以“明不可息”申箕子之贞。身可辱，明不可灭。其晦者形迹，其不晦者此心——即万死一生之中，犹冀君之一悟、国之可复，耿耿一念未尝少衰，是之谓明。使箕子如微子之去，如比干之死，或径露其明而不自藏，则身且不保，而明亦随之而尽。故先儒谓殷有三仁，皆人所难能，而箕子为尤难。","Y6.T":"上六，不明晦，初登于天，后入于地。","Y6.N":"先儒以此爻为纣亡国之象。以六五显言箕子证之，其说可从。上六在一卦之末，为众暗所归，五爻之明皆入其网，求诸史事，非纣孰当之。五爻皆系以“明夷”，独上六变文曰“不明晦”。不明晦者，非晦其明也，本无明而终于晦，表里俱暗，通体皆暗，是晦之至，非晦之用。若夫晦而明、明而晦，虽似晦而中有主，其明自在。天者，位之所在；初登于天，谓始践天子之位。地者，位之所失；后入于地，谓终以失国陨身。","Y6.X":"象曰：初登于天，照四国也。后入于地，失则也。","Y6.XN":"纣初践位，据高而光被四表，未为不善。其后昏乱日甚，卒坠于地，咎在失其准则。准则者，道之别名；失准则即失道也。象于六二许以顺则，于上六斥其失则，两爻遥相映射，褒贬判然。文王以顺则而兴，纣以失则而亡。","Z":"《杂卦传》以“诛”释明夷，诛、伤同实，夷字亦当训伤。合二字言之，谓明为暗所戕耳。验之于象：离在坤下，明体处下，暗体处上，日轮既没，光为地掩，伤明之形宛然。验之于爻：下三爻本属离体，固皆为明；六四、六五虽入坤体，就爻德论，亦未尝不明。故六爻之中，明者五而暗者一，上六独以“不明晦”终。二为明之主，上则昏之主也。\n此与丰略相类而实相反。丰者明中之昏，昏而未失其明；明夷则昏极而明不复。又诸卦之君位多在五，明夷独系于上，此其变例也。\n一卦所论，要不出明与暗相遭之际：下五爻者，明也；上六者，暗之主也。五爻所对，即此昏暗之君，其所以自处，随分而异，而皆不出“明而晦”一义——不以明亢暗，亦不以晦没明。其不同者，所处之位有亲疏远近，所具之力有强弱大小，故或救、或讨、或守、或去，各就其所可能者为之。要之，势不足胜暗，则藏锋以待时，非怯也。六二力足济难，则以拯为救；九三力足反正，则以狩为讨；六五无可如何，则晦明守正，是为箕子；初九、六四无责于世，则全其身、守其正而已，故初一去而不食，四则出于门庭。至于上六，则始终一暗，以昏极而尽。\n其事固当殷周之际，文王、纣王是也。爻辞既明举箕子，彖传复取文王事纣之迹，以证内文明而外柔顺之旨。卦中所寓政理，约有数端：处昏暴之朝，当外晦而内明，文王以诸侯之强而服事殷，箕子被发为奴而自守其正，皆是物也；人主御世，当以明自治、以晦治民，用晦而明，不尽显其察，宽厚容物，斯能合众；若纣之所为，则自治反晦、治民反明，积而至于不明不晦，身为独夫，国随以亡，宜其为《周易》所弃也。凡此数端，不独为纣一人发，后之履尊位者，皆可览而鉴焉。"}},"37":{"id":"37","cnNum":"三七","name":"家人","pinyin":"jiā rén","fullName":"风火家人","shortFullName":"风火家人","upper":"巽","lower":"离","upperNature":"风","lowerNature":"火","lines":[1,0,1,0,1,1],"yaoLabels":["初九","六二","九三","六四","九五","上九"],"blocks":{"P":"《序卦传》有言：夷者伤也，伤之于外者必返于其家，故家人次之。家人者，合一家之人而称之，今语所谓家庭是也。一家之内，伦常非一，而以夫妇为之纲；群伦之间，组织非一，而以家庭为之本。以卦体论，离内而巽外，火燃则风生，风由内出而及于外，正取自家而推及家外之象。平天下必自治国始，治国又自齐家始，昔贤论政，其序盖取诸此。更即六爻观之：六二柔得中正而处内，九五刚得中正而处外，男女各守其位，无有偏侧。卦之得名，实由于此。","G":"家人，利女贞。","G.N":"贞者，正也。家人之卦系以“利女贞”，其意不在泛论家规，而在指明一家之正否系于主妇一人：主妇而正，举家随之而正；主妇不正，则举家皆堕。然则何故独系于女而不及男？此非尊女，适为贱女之证。盖立辞之体以男子为主，女子在其间不过附丽之物，故谓男子齐家之要务，唯在“女贞”二字。昔人言自修身而至于平天下，其目皆属男子，女子与小人并不预焉。质言之，男欲齐家，必藉女之贞；而女之所谓贞，又唯在男子所统之家中乃有意义可言。","T":"彖曰：家人，女正位乎内，男正位乎外。男女正，天地之大义也。家人有严君焉，父母之谓也。父父子子兄兄弟弟夫夫妇妇，而家道正。正家而天下定矣。","T.N":"《彖》曰“女正位乎内，男正位乎外”，所指各有其人。女谓六二：以阴爻居阴位，处下体之中而又当位，故系之以内。男谓九五：以阳爻居阳位，处上体之中而又当位，故系之以外。由此言之，家人一卦所论，其实只是夫妇一伦；内有所主，外有所主，而家之事便已了却。然卦辞仅举“利女贞”而于男子阙如，《彖》则兼举之，何也？《易》之所谓家，本是一夫一妇之制，有夫有妇而后成家，则言家者自不能遗其一偏。卦辞举女而遗男，正是男尊女卑之见于辞者；然细按其意，男固在其中，特未表出耳。合而观之，卦辞之全义，当是男子齐家而利在女贞。\n“男女正，天地之大义也”一语，含义可析为二。其一，古人论天人，主二者相为一致，谓人事之曲折，悉可于天地间求得其据，《易》之由夫妇而推及天地，即用此理。其二，《易》视男女之关系即天地之关系，而天地之关系，天尊而地卑；所谓男女各正，所正者不过尊卑之序而已。试观卦画：阳之九五据上体而居外，阴之六二据下体而居内，尊卑之位判然。\n自“家人有严君焉”以下数句，则孔子于释毕卦辞之后别起一义而推衍之。盖男女各正，乃一家之纲；纲举则目张，父子兄弟诸伦皆由之而正。家既正，天下自定——定者，亦正之谓也。治国平天下必自正家始，此一识见，与今世以个体家庭为文明社会细胞之说，正可相通。","X":"象曰：风自火出，家人。君子以言有物而行有恒。","X.N":"风自火出，君子取以为象。风之行也，由近而及远；教化之施亦然：其源在家，其本则在己之一身。故修身者，政教之始也。修身之目，不过言、行二者：出言必有事可据，不为虚辞浮说；行事必有法可守，不越绳墨，不中道而止。物者，事也；恒者，常也。言之无物则人疑，行之无恒则人怠，家之不成，常由于此。","Y1.T":"初九，闲有家，悔亡。","Y1.N":"初九以刚德而居家人之初。言乎其时，则防闲所当急；言乎其才，则防闲所能为。故处此爻者，能闲而亦当闲也。所谓闲，即预为之防，如圈牢牛马必设栏槛，使不得逸出。闲之之机，全在事端未起之顷；及乎羊已亡而始补其牢，则所补亦何及矣。治家者于初立之日，明条教、定上下，则悔可免；若一听其自便，伦序既乱，子弟日入于非僻，虽有善者，亦无从措手。","Y1.X":"象曰：闲有家，志未变也。","Y1.XN":"防闲之贵早，正为其能消患于未有之先，使心志根本无由转向。若待志已他迁而后禁之，则创艾已深，收拾亦难为力。","Y2.T":"六二，无攸遂，在中馈，贞吉。","Y2.N":"六二阴爻居阴位，得中而正，在夫妇之间为妇，即今所谓主妇者。“遂”者，自专之意。《公羊传》有“大夫无遂事”之文，其“遂”字正作此解。盖大夫奉使出疆，聘问会盟皆当禀命于君，不容以己意径行。妇人之于家，其义亦然。妇职所司，唯在主中馈：一家饮食之事由之而出，祭祀之品亦由之而办。曰“无攸遂”，则凡有所为，必禀承于夫，不敢自断。如此而后谓之贞，亦如此而后得吉。","Y2.X":"象曰：六二之吉，顺以巽也。","Y2.XN":"六二体阴而位阴，又处中得正，故其所守者为妇人之贞，其所获者为妇人之吉。究其所自，则一出于顺与巽而已。","Y3.T":"九三，家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。","Y3.N":"九三刚而居刚，位虽得其正，然不处中也；且踞下体之终，一家之长得势过甚，是严苛之象，而非宽和之象。治家之病，宽严皆能失中，唯中为可。然中既不可必得，则与其失之宽，无宁失之严。严之弊，家人怨咨，上下不安，悔厉并见，而其后必归于吉；宽则妇子嘻嘻相悦，一时若可乐，而终必致吝。盖悔者由凶转吉之机，吝者由吉入凶之渐，吝之究极，未有不凶者也。","Y3.X":"象曰：家人嗃嗃，未失也。妇子嘻嘻，失家节也。","Y3.XN":"世有知和之为美而一味趋和者，不复以礼为之限，其弊有不可胜言。治家之失，莫大于纵：纵则妇子嘻嘻，情好虽昵，而节度已隳。与其如此，毋宁绳之稍峻——伤虽在焉，未为大失。严之失失于苛，苛犹可挽；宽之失失于纵，纵则节坏而不可复收。","Y4.T":"六四，富家大吉。","Y4.N":"阳爻多取富象，《易》例然也，小畜九五是其证；阴爻多取不富，泰之六四、无妄之六二皆然。然则家人六四以阴爻而取富象，其故安在？盖第四爻之地位，诸卦以为臣位，而家人以为妻位；位同而所主异，故其取象亦殊。一家之中，教之责在父，凡礼仪威仪，父为之率；养之责在母，凡食饮蓄积，母司其出纳。则所谓富家者，自非母莫属，而六四当其任。夫富家者未有不事聚敛，聚敛则怨尤易生；六四乃独以富家而膺大吉，盖柔爻居柔位，既得其正，而所处又为巽体，顺以将之，故能聚而不怨。卦中六爻，取阴者唯二与四，皆主妇之象：一主中馈，一主富家，妇职至此而始备。","Y4.X":"象曰：富家大吉，顺在位也。","Y4.XN":"四之在巽，是谓能顺；柔爻而处柔位，是谓当位。顺则内外之情由之而通，当位则一家之计由之而理。二者兼具，富家之所以致，而大吉之所以来也。","Y5.T":"九五，王假有家，勿恤吉。","Y5.N":"假、格二字古相通假，皆主感格为义。九五刚健中正而据尊位，一家之主也；《彖》之“男正位乎外”，所指即此。位尊，故辞以王言。王者之感格其家，非以势力驱之，乃以一身为之表：父止于慈，子止于孝，兄友弟恭，夫义妇听，各安其分而不相陵，相亲相睦而不相狎。如此，则安用忧劳为哉？不待忧虑而吉自至也。","Y5.X":"象曰：王假有家，交相爱也。","Y5.XN":"此感格之验，不在形迹，而在情之相通：一家之中，自父子以至于长幼，其分本有等杀，至是则彼此交孚，欢然无间，爱敬之心油然而生。","Y6.T":"上九，有孚威如，终吉。","Y6.N":"上九阳爻居一卦之终，治家之事至是而毕，故特揭其本，曰反身修己而已。治家所恃者，曰孚、曰威；然威不自立，必自孚而生，孚又非可强致，唯反求诸己而后得。为主者躬行以率之，则一家之心聚，一家之信孚；心聚信孚，而后一家敬而惮之。此“有孚威如”之说也。如此者终获吉。辞系以“终”，可见始未必吉，要其归结，则必归于吉。","Y6.X":"象曰：威如之吉，反身之谓也。","Y6.XN":"《小象》所以申言者，正恐人以威为厉色疾声之谓。上九之威，非自我作之，乃人之敬服耳。敬服不可求之于声色，唯可求之于修己。故治家固须有威，而威必自己先立；己不先立，人未有肯从者。然则治家之要，一言蔽之，曰反身。","Z":"家人一卦，所论者以夫妇之伦为多。卦分六位，所别者男女之等，初未尝以君子小人区其品。阳之四爻，其道皆尚刚严：初九闲、九三厉、上九威，而九五则以王者之格临之，凡皆刚严之为正也。阴之二爻，其道皆尚柔顺：六二守中馈，六四能富家，凡皆柔顺之为正也。\n男尊女卑之意，于卦中见之甚著。男子为主体，女子直附丽焉而存。女子之价值，唯系于其对男子、对家庭所效之力：在家则司中馈，调停家人之间，又务使生计宽然有余。至于权利，则毫发不预。彼惟“无攸遂”是守，而其贞正之效，乃能使一家顺遂而兴隆。《彖》称“女正位乎内，男正位乎外，男女正”，自孔子言之，此乃“天地之大义”。\n虽然，夫为一家之长，权莫大焉，而必以反身修己之道通其情于家人，不得以其威严加诸人上。以是知《易》经传作者所持之家，虽有男制女之弊，其中却无奴隶其人者。家之内外，尊卑相制而恩意行乎其间，此其所以异于后世之门户也。\n尤可注意者，《易》有一义，卓然不凡，屡读而屡觉其可异：即一夫一妇之家庭与文明之世几乎同时而起之观念是也。咸卦经传已著其端，至家人而益加详。夫“正家而天下定”、男女正为“天地之大义”，此二语者，实已道破个体婚制之家为社会细胞之实，其识见之远，非后世礼家所能及。"}},"38":{"id":"38","cnNum":"三八","name":"睽","pinyin":"kuí","fullName":"火泽睽","shortFullName":"火泽睽","upper":"离","lower":"兑","upperNature":"火","lowerNature":"泽","lines":[1,1,0,1,0,1],"yaoLabels":["初九","九二","六三","九四","六五","上九"],"blocks":{"P":"《序卦传》谓家人之后次以睽，其言曰：家道至穷，乖必随之。睽者，乖离之谓，相违而散也。卦体下兑上离：离，火也，其气腾而上；兑，泽也，其流趋而下。在上者愈高，在下者愈沉，两体之势背驰而不相就，此一象也。卦中二阴分处上下：上体之离为中女，下体之兑为少女，女各有家，终当分适，同处而志不同，又一象也。二义相合，卦以睽名。","G":"睽，小事吉。","G.N":"小事吉者，正就睽之时立论。事既已睽，强合无益；若挟忿疾之心驱之使同，只见其愈离。唯以温和柔顺行之，宛转周旋，不争旦夕，积渐而解，事乃可成。","T":"彖曰：睽，火动而上，泽动而下，二女同居，其志不同行。说而丽乎明，柔进而上行，得中而应乎刚，是以小事吉。天地睽而其事同也。男女睽而其志通也。万物睽而其事类也。睽之时用大矣哉。","T.N":"卦名之释，取象于上下二体。“火动而上，泽动而下，二女同居，其志不同行”：火之焰腾，泽之流降，同处一卦而所趋相背；离称中女，兑称少女，共居一室而各念所归，所之亦异。凡物有同而后有异可言。二者同处一卦，是其同；所趋相背，是其异。而此异非微末之差，乃显著而深切者，睽之所以为睽也。既有同，斯有异；既立异，斯求合。若两事本无干涉，则亦无所谓睽——睽必以同为前提。\n既释卦名，次以卦才释卦辞。卦体所示者，动而相违之一面；卦德所示者，违而终合之一面。兑之说附丽于离之明，合之机一；柔进上行，合之机二；得中而应乎刚，合之机三。三者皆向于合。盖睽而不合，则天地万物之生化将息，故睽必有合。合者非强使之同，就其分而各得所安耳。而所以能合者，柔之力为多，吉由柔致，故所系者仅小事吉而已。\n末乃推其普遍之义。“天地睽而其事同也，男女睽而其志通也，万物睽而其事类也。睽之时用大矣哉。”睽若不足为美，然天下无一物可无睽。天高地下，睽之至大者也，而四时错行、品物滋生，正由此出；男阳女阴，睽之最著者也，而交感成形、生育蕃衍，正由此出；万物散殊，睽之最普者也，而各从其类，有类乃有合。设无睽，则天地混而未分，男女漫而无别，万物齐而无殊，合者亦无所施。故曰时用，明其非一方之宜，乃通乎万世者也。睽之时用，于此可见。","X":"象曰：上火下泽，睽。君子以同而异。","X.N":"君子观此象而施于日用，其道在以同而异。睽卦之所寄者，分而终通、离而必遇也；换言之，同未尝离异而独存。故无睽之合、无异之同，皆不足取，大象所以垂戒曰“以同而异”。处众而不失己，即同中存异、自全其性之谓。同者群居之迹，异者立身之本，二者相须而不相掩。此与《论语》“和而不同”之旨相通。盖异尽泯而强为同，如乐去五音之别而求谐，其声不可听。","Y1.T":"初九，悔亡，丧马勿逐自复，见恶人无咎。","Y1.N":"初九以阳刚处卦之初，刚动于下，宜有悔也。阳刚在下而未得位，动则易愆，悔所由生。然与九四为敌应；当睽之时，敌应者反以同德相求，遇而不相疑，悔遂可亡。又初九居睽之始，间隙尚浅，求合之法不在急迫，而在安静以待。譬之逸马，逐之则奔愈远，置而不逐，反自归枥。心气亦当宽绰，崖岸不可遽立。譬有与我交恶者欲来相见，挟忿而拒，则隙益深，甚且终身不复合；一见之下，芥蒂顿消，咎乃可免。","Y1.X":"象曰：见恶人，以辟咎也。","Y1.XN":"初九当睽之始，间隙未深。恶人之来，正可逊接，使睽不更加，斯无咎矣。","Y2.T":"九二，遇主于巷，无咎。","Y2.N":"《春秋》记事，有会、有遇：会者礼数周备，遇者仪节从简。巷者，宫墙外之仄路。宾主相见之常，自庭而升，巷非其路。九二与六五为正应，彖传“得中而应乎刚”，所指即此。九二求见六五之心甚切，遂有“遇主于巷”之事。仪文不备，入自巷而不由庭，循墙而行，其逊也至，其密也至。卦辞所谓小事吉，正合此义，无咎固宜。二之求五，非好为苟合，时睽势隔，不得已而然也。","Y2.X":"象曰：遇主于巷，未失道也。","Y2.XN":"九二之巷遇，虽极谦抑委曲，要非枉道以相求者，故象以为未失道。","Y3.T":"六三，见舆曳，其牛掣，其人天且劓，无初有终。","Y3.N":"六三与上九为正应，志在相合，而阻阂甚重：前则九四如牛之掣，后则九二如舆之曳，进退皆不能自由。六三体阴而居刚位，居刚则志欲行，遂奋力前趋，终至“天且劓”——首被髡，鼻见截，创巨而痛深。然正应之系终不可解，睽至于极则必合，故“无初有终”。初为二阳所隔，是无初；终得上九之合，是有终。","Y3.X":"象曰：见舆曳，位不当也。无初有终，遇刚也。","Y3.XN":"象言“见舆曳”，病在所处之位不当：爻阴而位阳，一也；下据九二，以柔乘刚，二也。“无初有终”者，始为上九所疑而不得前，终乃疑释见纳，相遇而成合。其所以能然，则以所遭者为刚明之士耳。","Y4.T":"九四，睽孤，遇元夫，交孚，厉无咎。","Y4.N":"孤者，无应援之谓。元夫者初九也，以阳处初，故系此称。交孚者，两心相信，不以形迹为间。九四值睽之时，左右皆阴，下又无正应，势危而可以得咎。然亦有利焉：与初九虽非正应，同是阳爻，同居一卦之下，位分相埒；当睽隔之世，两刚同德而相亲，披露肝胆以相与，则危者可安，虽履险而终无咎。","Y4.X":"象曰：交孚无咎，志行也。","Y4.XN":"两刚相信，故险者可夷；睽转而合，孤转而有朋，其志既行，咎无自生。","Y5.T":"六五，悔亡，厥宗噬肤，往何咎。","Y5.N":"六五以阴居尊，当睽之世，宜有悔矣。然柔而得中，下应九二，悔遂可亡。厥宗者，九二之谓——六五亲之若宗族之相与。二五以中道相应，其睽本浅，合之甚易，如肌肤脆薄，齿入即深。所谓“厥宗噬肤”者，九二踊跃而来，六五亦往就之，睽者转而为合，悔既亡矣，咎于何有？夫睽之难合，每由尊卑相亢；五能降尊以下贤，故其合也易。","Y5.X":"象曰：厥宗噬肤，往有庆也。","Y5.XN":"二五以正相应，刚来既易入，柔亦往而承之，庆在其中，非止免咎。","Y6.T":"上九，睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。","Y6.N":"上九本与六三为正应，未尝无与，而爻辞系以“睽孤”，是孤非人孤之，自孤也。以阳刚处上而居卦末，位势已极。孤之所由成，在三种各尽其分：爻在卦终，睽之尽也；以刚处高而难下，刚之尽也；丽于离而任明，明之尽也。凡物尽则反，睽尽则相背，刚尽则愎，明尽则疑，三端并集于一身，遂于亲己之六三横生猜端。视之若豕之负涂，污秽可憎；又疑其“载鬼一车”，罪大而不可近。鬼本无形，而幻见满车，虚妄已甚，乃至张弧而欲射。然物极必反，疑盛则衰：谛视之顷，非豕也，非鬼也，非寇也，乃婚媾耳，于是弛弓而不发。“往遇雨则吉”，雨者阴阳和洽之象；疑既去，睽既合，自今以往，和畅无间，向之猜心荡然不留，故吉。","Y6.X":"象曰：遇雨之吉，群疑亡也。","Y6.XN":"豕也、鬼也、张弧也，皆疑心所结之妄境。有疑则间隔，间隔则独处。及疑团尽释，若阴阳相薄而甘雨降，间隔去而党与来，复何孤之有。","Z":"六爻之序，莫非始离而终遇。下体三爻，皆在离中而未通，各有待焉；上体三爻，则皆反而相与，离者以是而成合。初九之丧马，睽于下者也，至九四遇元夫而其睽释；九二委曲求遇，犹隔于五也，至六五噬肤而其合见；六三见曳见掣，求合无阶也，至上九遇雨而其疑亡。通六爻而观之，一理昭然：天下之事，睽久必合。睽之可久，而未可终；久则复通，终则离绝，此自然之律也。自其主观者言，睽离之两造，当体卦辞小事吉之意，推诚而守正，宽宏而委曲，去私心，释猜疑，如是则睽无不合。"}},"39":{"id":"39","cnNum":"三九","name":"蹇","pinyin":"jiǎn","fullName":"水山蹇","shortFullName":"水山蹇","upper":"坎","lower":"艮","upperNature":"水","lowerNature":"山","lines":[0,0,1,0,1,0],"yaoLabels":["初六","六二","九三","六四","九五","上六"],"blocks":{"P":"《序卦》之次，睽先而蹇后。其说曰：睽者乖离之谓，乖离既甚，则衅隙生而患难作，故蹇承睽而起。蹇之为字，本取行之受阻、欲前而不得前之义。就卦体观之，上为坎，下为艮。坎之德陷，艮之德止。险既横于前，止复拘于后，欲进无路，欲越不能，此卦所以得蹇之名。","G":"蹇，利西南，不利东北，利见大人，贞吉。","G.N":"卦辞以西南为利、东北为不利，此取象之辞，非指实也。读者不可以为处蹇之人当终身趋西南而避东北。按《说卦》分配方位，坤居西南，艮居东北。坤之象为地，艮之象为山。地体平衍，人之履之也安，故谓之顺易；山体峻阻，一入其中则步步皆碍，故谓之艰险。由是言之，所谓利西南，不过谓处蹇者宜居平易以自宽，不可株守险地而自困；所谓不利东北，亦谓险中更止，非计之得者耳。\n至若“利见大人，贞吉”，则就济蹇之人言。国步方艰，非有圣哲者出而任之，难无由解。然济难之具虽在于才，济难之本则在于正。守正而后举措不偏；一涉邪枉，虽侥幸得脱于一时，其行事已不足观矣。","T":"彖曰：蹇，难也，险在前也。见险而能止，知矣哉。蹇利西南，往得中也。不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉。","T.N":"彖传释卦名，先立一语曰“难”，继之曰“险在前”，再继之曰“见险而能止”。三语相衔，蹇之义尽矣。然“难”之名，屯亦有之，读者每易混同，不可不辨。\n屯之难，难在始。物之初生，郁结而未通，其前虽险，其后则有动，是动而出于险中者也。蹇之难，难在阻。险当前而力不逮，其后则为止，是止而安于险中者也。同一“难”字，一动一止，其分在此。\n蹇与蒙亦相类：二卦同具坎艮之体，所异者止之在内在外而已。蒙之象，坎伏于中而为陷，艮居其表而为阻。阻者在表，则欲进者每为所格，志不得伸而识以之昏，故名蒙。蹇之象，险陈于前，而止者居其内。止者在中，非怯于进也，审知险之不可犯，故姑止焉。揆而后动，是谓有识，故彖传以“知”归之。\n“蹇利西南，往得中也。不利东北，其道穷也”，自此以下，乃逐句释卦辞。\n济蹇者贵得地。平易之处，人力易施，故处蹇而择所向，西南为便。西南于卦为坤，坤之德顺，顺则无所龃龉，此其所以利也。然卦辞何以独系于此？盖有九五在。九五以阳刚之质，居中而履正，是“往得中”之象。往而得中，则所至皆坦途，此“利西南”之实据也。\n此处有一疑焉：九五身居上体，正在坎陷之中，安得谓之平易？应之曰：蹇之上体，本坤也。乾以索男，再索而得中男，坤体遂化为坎。坤之转而为蹇，其机全系于九五一爻；而九五之可取者，正在“往得中”之一义。作辞者举其得中之义，而于其陷于险中一节，姑置弗论。卦辞与爻象之不尽相合，此类是也。\n若夫东北，则艮之方也。艮体止而德险，止于险则愈不能出。当蹇之时，势已穷蹙，复择此途，是自投于穷地。不知变而止于危，蹇将益蹇，终无解期，故曰“其道穷”。\n“利见大人，往有功也”以下，则归之于九五。天下之蹇，非一手一足所能济，必有德位兼隆者出而尸之。卦中堪此任者，舍九五其谁？九五既能成济蹇之功，又能纳民于轨物，使邦国复归于正。而所以致此者无他，行大正之道而已。\n蹇之卦体，适足以副之。六爻之中，初六而外，五爻皆居其本位；初六虽以阴处阳，然柔而在下，亦不失为正。正者既众，故系之曰“贞吉”。\n蹇非顺境，乃逆境也。然逆境之中，正赖人谋。有魁梧宏达者出焉，顺时以动，守正以行，则功可就、邦可正。时之艰者，正见用之者之大，故终之曰“蹇之时用大矣哉”。","X":"象曰：山上有水，蹇。君子以反身修德。","X.N":"上为山，下为水。山以峻阻为体，水以深陷为用，内外皆险，此卦之所以为蹇也。\n君子观此象，不向险外求脱，而向身内求治，故曰反身修德。盖身临艰阻，力有不能争，势有不能越，当此而怨天尤人，徒增其塞。唯反求诸己，察己之未尽者而修之；己既无慊，则安处以待时会之转。\n此意在后世犹有嗣响：孟子尝言人之不偶于外者，当转而自责，语在《离娄》篇中，实与此旨相通。","Y1.T":"初六，往蹇来誉。","Y1.N":"往者，自内而进于上；来者，居其所而不动也。\n初六居一卦之初，正在止体，其势可以止。止则安，进则入于险，故往则蹇，来则有誉。誉者非外求而得，止得其时，人自与之。\n然则初六果何从乎？曰：其必不往者，可断言也。其位在止之始，距险最远，见事最先。知其不可进而止，是谓前识；止而待其可进，是谓知时。","Y1.X":"象曰：往蹇来誉，宜待也。","Y1.XN":"此爻之义，重在去就之择：往为失，不往为得。\n或问：不往则蹇何由而出？曰：在待时。时者非可强致。今既非可往之时，则见几而止；他日机至，然后往焉。止非终止，正所以为往之地也。","Y2.T":"六二，王臣蹇蹇，匪躬之故。","Y2.N":"王臣者，六二是也。六二以柔顺之质，处中履正，上与九五相应。所应者既为中正之君，则受知受任，分在股肱，王臣之称由此而立。\n“蹇蹇”叠文，实该两义：其一属九五，君在坎陷之中，是君身之蹇；其一属六二，臣忘其阴柔之弱，欲以身犯难而纾君之忧，是臣身之蹇。两蹇相值，故重言以见其艰。\n以蹇济蹇，事固难济。然其所以犯难者，非为身谋，乃在王室的倾覆是惧。谋不遂而志不衰，功不成而心可录，此其所以可嘉也。","Y2.X":"象曰：王臣蹇蹇，终无尤也。","Y2.XN":"无尤者，无过之谓。志既在君，虽事不克就，于义无责。\n通观一卦，初六、九三、六四、上六四爻，其或往或来，皆视去险之远近、量其势之可否而定。六二独异：它与九五为正应，有君臣之分，故不复计远近，不复问可否，并不著往来之辞，唯以“蹇蹇”尽之。\n或疑其才弱不足任事，而作者不以为不知。盖所取者，为其君而忘身之一念耳。念既无私，则成与不成、吉与凶、得与失，皆可不论。","Y3.T":"九三，往蹇来反。","Y3.N":"九三之往，必蹇。何以言之？九三所应者上六，而上六体柔而位虚，力不足以援九三。外无实援而身入比邻之险，未有不困者，此“往蹇”之说也。\n反则不尔。九三以阳居阳，位得其正，又居下体之上，为一卦众柔所依。下之二阴，势孤而难自立，得九三为之主，则有所附。来反云者，舍上而不之，退归其故处也。\n一出一入之间，既免深入之患，又得二阴之附，其为计也审矣。","Y3.X":"象曰：往蹇来反，内喜之也。","Y3.XN":"内卦三爻，独九三为阳，居二阴之上。阴柔当蹇，不能自济，故二阴之所仰者在九三。象传所谓“喜”，正谓其得所依而归之。","Y4.T":"六四，往蹇来连。","Y4.N":"六四之往，则陷愈深；来则不然，能与在下诸爻联合为一，故往蹇而来连。\n众爻何以肯与之连？其故有三：九三与六四地相比近，情相亲附，一也；初六、六二与六四同属阴类，类同则相与，二也；六四以阴居阴而得其正，下三爻亦各得其正，正同则志同，三也。\n初六之爻，以阴处阳，位非其正；然柔而在下，亦可许以得正。上下既同志，则下三爻皆乐从之，连合之势自成。","Y4.X":"象曰：往蹇来连，当位实也。","Y4.XN":"“当位实”者，即当位而正也。不曰正而曰实，以所论在上下相交之事。交之道，饰貌不如输诚，故取“实”以明之。\n实之所在，可两言而尽。一在于六四：身居上体，不务上行而肯下就，与下三爻同其志，众所归也；又阴居阴位，位与德称，是实也。一在于下三爻：九三阳居阳，六二阴居阴，位皆不忒；初六位虽不当，而柔顺处下，亦不失其实。\n惟其上下皆以实相与，故六四一来，诸爻翕然合为一。若虚文相羁，则虽合必离，安能连乎？","Y5.T":"九五，大蹇朋来。","Y5.N":"一卦之中，诸爻皆以“往”为戒，若谓举足则陷，不如勿动。然天下国家值艰厄之际，人皆敛手，则难何时而解？\n六二、九五独异。二者一居臣位，一居君位，皆义在必往，故六二系以“蹇蹇”，九五系以“大蹇”。\n何以称大？君者，天下之表也。君身在于难中，则四海之难皆聚于一人，此其一。九五既当蹇之时，又身履坎陷之地，险上加险，此其二。合此二义，故谓之“大蹇”。\n“朋来”者，贤臣来助之谓。六二处下卦之中，与九五为应，自九五观之，即其朋类来集之象。然则君得贤辅，何以不系以吉？\n盖大蹇之济，非刚阳中正之臣不能办。六二虽居中履正，其质则阴柔也。阴柔者可以赞助，不可以独任；可以纾一时之急，不可以成拨乱之功。故其事止于“朋来”，而不系以吉。\n《易》中此例可考：六五应九二者，往往得助而有成，蒙、泰诸卦是也；九五应六二者，往往力薄而功亏，屯、否诸卦是也。","Y5.X":"象曰：大蹇朋来，以中节也。","Y5.XN":"九五居中履正，守其节而不移，动止各得其宜，故同类之贤者乐为之用。朋来之义，如是而已。","Y6.T":"上六，往蹇来硕，吉，利见大人。","Y6.N":"上六居一卦之上，更无可往之地。故在它爻以“往”为戒者，至此而戒不在往，反在不来——不来即其往也。初六处于最下，其势无可往，不往即所以为来；上六处极，其势亦无可往，不来即所以为往。两爻地位相反，而理则一。\n蹇至于极，若复株守而不来，则终于蹇而已。唯来而就从九五，兼求九三，得两阳之助，则向之穷蹙者渐舒而为“硕”。硕者，宽大丰裕之谓。\n然所云宽裕，止是蹇势稍杀，非谓蹇根尽拔也。上六之才，柔而不刚，非中非正，本无自脱于蹇之力。虽不能脱，而于蹇极之时得一分宽舒，即是一分之吉，故系之曰吉。\n“大人”指九五，“利见大人”谓上六往见九五。上六之从九五，以其地相切比故也。\n疑者曰：九五在本爻不著济蹇之功，乃至有待于六二之助，何以上六反倚之以为重？曰：爻位异则取义异。九五身处坎中，旁无刚阳之辅，固不能独任济蹇。自六二言之，君弱而臣不能独济；自上六言之，九五德位俱尊，苟得其援，蹇可纾也。一卦之中，各爻取义不同者，往往有之。屯卦初九志在行正，而六二乃以寇视之，亦此类也。","Y6.X":"象曰：往蹇来硕，志在内也。利见大人，以从贵也。","Y6.XN":"“以从贵也”，其为九五无疑。上六与九五，一阴一阳，一卑一尊；曰“从贵”，正欲使读者知辞中所谓大人者定指九五，非他爻所得而当。\n“志在内”之“内”果何所指？旧说不一：或主九五，或主九三，或兼二者。窃谓兼九三与九五为长。九三居内卦，又与上六为正应，上六不可无其援；九五与之切比，尤为其所依归。言上六之志，岂可遗九五？\n小象既言“志在内”，又言“以从贵”，再及九五，似复而非复。“志在内”兼举两爻，“以从贵”独提九五，所以使九五之分量显也。\n又有一事可参：《易》之爻辞称“利见大人”者，乾之九二、九五而外，仅见此爻。且诸卦上六之遇九五，凶吝者比比，得吉者绝少，此爻独吉，是固宜深思而详之。","Z":"蹇之卦辞与爻辞，其义相衔，无甚龃龉。\n卦辞含两意：一曰见险而止，一曰处险当进。此两意，爻辞皆有之。\n六爻之中，除六二、九五，余皆以“往”为蹇。往者进，来者止；往则凶，来则安，是进不如止也。初六距险尚遥，先时而止，识在几先，故彖传以“知”与之。九三居下体之上，退则得二阴之附，故圣人不责其不往，而许其安于所居、能得众心。六四若不下就，则与下体隔绝；一来而三阴翕从，众附之势以成。上六位在穷极，才又柔弱，苟能舍往而就下，则困者渐舒，而吉可冀。\n处险当进之意，则于六二、九五见之。二爻皆不著往来，而一曰“蹇蹇”，一曰“大蹇”，其义正谓当往。九五言“朋来”，六二言“匪躬”，君臣相与以济难，是乃分之不可逃者。譬之国步艰难，疏远者可以退，君相岂可以退？\n然其往也，非贸然而往，必居中得正而后可。此与卦辞“利西南”“利见大人，贞吉”之旨，若合符节。\n辞中“贞吉”一语，亦非虚设：六爻之内，唯初六一位居偏，自余皆安其本位；上六终得吉占，他爻亦不著悔吝之文。盖正者非一人之正，乃上下共由之正；正立则难虽在前，而纲纪不坠。合而观之，蹇者逆境之卦也。处逆境者，贵在知险而不轻进；然止非终事，居蹇之世而任济蹇之责者，君与臣是也。\n卦辞言“利见大人”，爻辞亦言“利见大人”，前后一揆，正为此耳。蹇之卦象，若不足观；然为治者能握其“时用”，举而措之政事，其所裨岂浅鲜哉。"}},"40":{"id":"40","cnNum":"四〇","name":"解","pinyin":"xiè","fullName":"雷水解","shortFullName":"雷水解","upper":"震","lower":"坎","upperNature":"雷","lowerNature":"水","lines":[0,1,0,1,0,0],"yaoLabels":["初六","九二","六三","九四","六五","上六"],"blocks":{"P":"《序卦》之次，蹇居其前，解承其后。其立说之由，谓物无终困之理：难积而极，势必有以散之；散者，解也，故蹇之后受之以解。解之字，古读如蟹，其义为散、为释。盖难之未解，如冰之方结；及其解也，如冰之渐泮，不待力争。以卦体求之，上震下坎：震者动，坎者险。动体居外，险体居内，是动已出乎险外，患难剥落之象也。取诸物象，震为雷，坎为雨；雷雨既作，阴阳二气由乖而和，窒者以通，结者以释，亦解之义。二义相参，解所值者，天下患难初散之世也。","G":"解，利西南，无所往，其来复吉。有攸往。夙吉。","G.N":"西南于卦为坤，坤之德广大而简略，不为苛细。天下方脱于难，元气未复，此时治国，贵在安静，不贵纷更。所谓安静，非一事不理，乃不生事以邀功、不无故而自扰，此即卦辞“无所往，其来复吉”之谓。若实有当办之事，则又不可濡滞：早一日措置，则患去一分；待其溃烂而后图之，所费必倍，此即“有攸往，夙吉”之谓。故处解之世，其要有二：无所事则宁靖为先，有所事则捷速为尚。","T":"彖曰：解，险以动，动而免乎险，解。解，利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼。解之时大矣哉。","T.N":"彖传释卦名，取“险以动”三字为骨。坎之德为险，震之德为动；险伏于内，动形于外，故曰险以动。此三字实兼两头：无险则难之名不立，无难则出难之功无所施。然有难而株守不动，难终不解；动而不出乎险，亦不得谓之解。必也动而脱于险外，而后解之义全。\n取三卦相较，其辨自明。蹇与解，卦画适相倒置；屯与解，卦体适相颠倒。蹇者止于险之下，是束手而听命于险；屯者动于险之中，是姑试而与之争；解则动于险之外，是已脱其身而反制其险。三者的然有高下：止不如动，动于中又不如动于外。\n“解利西南，往得众也”以下，逐句释卦辞。按方位之配，坤实在西南；而众之义，则《说卦》以坤当之。九四一阳上往，入于坤体，坤遂化而为震；阳刚得众阴之附，此“往得众”之实也。“得中”与“有功”，则皆归之九二。盖解为蹇之反：解之九二，其位正如蹇之九五；解之九四，其位正如蹇之九三。故“得中”之目，在蹇属乎九五，在解则移之于二。九二守中而居内，未尝自往；免险之功，则假九四之动而成。是动者四，而所以善其动者二也。\n卦辞既释，彖传复即天道以广之。冬令闭藏，天地之气胶结而不通；春气既至，向之胶结者豁然开解，雷雨由是而兴。雷雨者，造化中解之最巨最著者也。雷雨既降，百果草木之甲皆拆，萌者出、生者长，此又解之散见于万物者。人在天地间，其离合治乱亦有其候；候至而解，则解为时之当，非人力所能遏，故曰解之时大矣哉。","X":"象曰：雷雨作，解。君子以赦过宥罪。","X.N":"此所谓君子，非泛言修德之士，实指有位而操刑柄者，古之所谓治人者也。居上位者观雷雨既作之象，因而有悟：天地之于万物，尚且有闭塞而开解、雷动雨施而草木甲拆之时，则人主之于民，安可无弛刑缓罚之一日？故其所行者，曰赦过、曰宥罪。过者，无心之失；罪者，有意之恶。赦之为言释，宥之为言宽。过误者直释而不罚，罪恶者亦稍宽其罚而不尽法。此非姑息，盖古者司法固有此一格。古有专官司其事，《周礼》司刺之职是也：其法先三赦三宥，而后加刑焉。以此与大象相参，其旨弥显。","Y1.T":"初六，无咎。","Y1.N":"初六处一卦之始，值时之解，患难已去而疮痍未复者也。其质则阴，其位则阳，柔居刚位；上应九四，以阴从阳。柔而能刚，此其德也。以柔顺之资，当解散之会，不竞不争，安处而无事，自处既得其宜，咎之所以免也。《易》中若恒之九二“悔亡”、大壮之九二“贞吉”，与此爻之“无咎”，辞皆止于二字。二字之中，象已具焉，故小象不复别言其象。","Y1.X":"象曰：刚柔之际，义无咎也。","Y1.XN":"此爻与九四为正应，一刚一柔，相与为用。患难既平，天下无事，处之者刚柔各适其宜，于义为无咎。","Y2.T":"九二，田获三狐，得黄矢，贞吉。","Y2.N":"此爻所论，乃处解之世君子去小人之道。田者猎也；古者田猎以除害，非徒供游观。获者捕而取之，引申之即除去之谓。狐之为物狡而善媚，三狐云者，指卦中三阴；三阴在卦，即小人之象。黄为中央之色，矢之为物以直为性；黄矢并称，则中而且直，九二之德似之，亦君子所宜有也。天下之患，自人事观之，未有不自小人而起者。欲解国家之患，必有以处小人，而处之之法最难：纯用柔则不能去，一味用刚而过甚则又激而生变。九二以刚处柔位，刚而不至于过，是刚中带柔；直而不至于极，是直而能节。刚柔相节、直而不绞，斯谓之中直。以中直之德，去狡黠之狐，宜其贞而获吉也。","Y2.X":"象曰：九二贞吉，得中道也。","Y2.XN":"君子之去小人，以直祛邪，固其正也；然直而失中、操之过急，事往往败。九二独能获三狐而吉，所恃者非刚，乃中也。","Y3.T":"六三，负且乘，致寇至，贞吝。","Y3.N":"《系辞上传》释此爻。其文托孔子之叹曰：作《易》者其知盗乎。其释“负且乘，致寇至”也，谓负戴者，力役之事；车乘者，尊贵之器。以力役之人而据尊贵之器，则奸雄睨之而思夺；为上者弛慢、为下者骄暴，则外寇乘之而思伐。藏之不密，是教人盗也；饰之过妖，是诱人淫也。故曰盗之招也。其意若曰：荷担者，役夫之职；安车驷马，有位者之容。今使荷担之徒俨然踞于车中，则旁观者见其器与人不相称，未有不睥睨而欲夺之者。\n自国家言之，名器者，天子诸侯所以驭天下之具。与不以功、授不以德，是自慢其藏也；使不肖者踞贤者之位，是自诲其盗也。祸非天降，皆由己作。故“致寇至”一语含两义：就小人言，僭居非分，必招攘夺；就君上言，轻弃名器、不辨贤否，必招寇戎之伐。\n然则六三何以致此象？六三以阴柔之质，据阳刚之位，正如负担之贱者，忽乘君子之车；既负于背，又乘于车，一身而兼二者，其形可丑，其势必危。","Y3.X":"象曰：负且乘，亦可丑也。自我致戎，又谁咎也。","Y3.XN":"“可丑”云者，指负且乘之小人；“又谁咎”云者，指上慢下暴之国。夫窃据高位，自视以为荣，识者以为辱。国轻其名器，使不肖处高位，寇戎之来，皆其自取，于他人何怨焉。","Y4.T":"九四，解而拇，朋至斯孚。","Y4.N":"解之一卦，其用在去小人。九四以阳处阴，在一卦为君子之身，其所担者，去小人而进君子之责也。小人不除，则君子无所容足，此先后之序不可紊者。“解而拇”云者，拇为足之大指，居身之下，位最微贱；在卦则初六当之，小人象也。解而去之，如去足拇之累，然后君子之朋来。“朋至斯孚”者，非独其人肯来，来而复能相与以信也。句中“而”字，作“汝”解，直指九四之身，谓当自任其事。","Y4.X":"象曰：解而拇，未当位也。","Y4.XN":"九四阳居阴位，不中不正；下应初六，近比六三，所居之地最易为小人所附。故爻辞特加戒慎：必解去此辈，朋类之至乃可信而不疑。","Y5.T":"六五，君子维有解，吉，有孚于小人。","Y5.N":"六五处尊位而为一卦之主，自人事言之，则人君也。然其为君也，以柔居之，非刚明之资，故于君子小人之辨，最当致谨。其用人之道，曰任贤不贰，曰去邪不疑。贤者任之既专，则“君子维有解”：所亲者必君子，所去者必小人，界限截然，昭示于天下，使佞幸之徒无可乘之隙。然犹未足。必也“有孚于小人”——不徒取信于君子，并使小人亦信焉：信夫持正者必见用，枉道者必见斥，舍此无他途。如是则侥幸之念自消，而窥伺之心自息。","Y5.X":"象曰：君子有解，小人退也。","Y5.XN":"所谓君子有解，谓君子见任而小人见退也。此效既著，小人亦自知其不见容于世，非革面从善，则奉身而退，无他路矣。","Y6.T":"上六，公用射隼于高墉之上，获之，无不利。","Y6.N":"《系辞上传》释此爻，托孔子语：隼之为禽，弓矢之为器，发而中之者则人也。器具于身而不轻试，候其时至而后动，何不利之可言？其动也，无结阂留难之患，故发而必中——所云“成器而动”，意正在此。\n解之卦旨在去小人，至上六之时，其去之之法当如何？孔子于爻辞拈出两义：一曰藏器，一曰待时。以今语明之，则条件既具、机会复得之谓也。二者合，则动而无所牵碍，“获之无不利”，隼可必得。\n隼者，鸷猛善击之禽，此爻以之目上六。狐与隼皆喻小人，而所取各异：狐言其柔媚善惑，隼言其凶悍难制。上六以阴柔之质居一卦之极，解道已成而此辈犹未去，可见其为小人中之强梗者，未易拔也。墉者墙也，高墉则墙之高者，上六处高而阴鸷，解极而当其冲，此正射而获之之会。器既素具，又会逢其适，则取上六如取物耳。爻辞称“公”，非以上六当之，谓人世间居公位者；其处解之世，当以此为法以去小人。","Y6.X":"象曰：公用射隼，以解悖也。","Y6.XN":"悖者，乱之大者也。凡乱之所起，究其根株，未有不由于小人。然则所谓解悖，不过去其小人而已。射隼之辞，正去小人之喻。小人既去，乱本自除；本除，则邦国有宁日矣。","Z":"解卦诸爻，君子小人之辨屡见。古人言君子小人，其义有二：或就名分言，指治人者与治于人者，即所谓剥削者与劳动者；或就德行言，指高洁向善之人与卑污趋恶之人。后一义之君子小人，其实亦多出有位之族，尤以政治上有权有势者为然。解卦所分，乃德行之意，非名分之谓。若问一卦归趣，则落在政事上如何处置小人一端。\n六爻之中，初六独无去小人之象，自余五爻皆系乎此。九二“田获三狐，得黄矢”：以阳刚之君子，用直道以祛小人之邪；然其位居中而质不当位，中而不正，故其为直也，直而不过，恰为去小人之至当者。六三“负且乘，致寇至，贞吝”：自国家与君上言，所最忌者，名器轻授、贤否混殽，使小人得窃君子之位。九四“解而拇，朋至斯孚”：言去之不可不力；小人不去，则君子无由而进。六五“有孚于小人”：君之于贤，任之而不贰；于邪，去之而不疑。又使宵小辈晓然知为恶之终无出路，则枉者可直、不仁者自远。上六“公用射隼”：遇强梗之小人，当器藏于身、时来则动，机至则断然发之，不可须臾缓。\n以卦爻相参，上六之义与卦辞“有攸往，夙吉”相当，前四爻则与“其来复吉”大略相合。然二者亦有不尽同者：卦辞重在“无所往”，主于静，所指为患难既解以后之事；爻辞屡言去小人，则若小人犹有存者、患难犹未全解。读者于此，当知辞各有当，不可执一而求。"}},"41":{"id":"41","cnNum":"四一","name":"损","pinyin":"sǔn","fullName":"山泽损","shortFullName":"山泽损","upper":"艮","lower":"兑","upperNature":"山","lowerNature":"泽","lines":[1,1,0,0,0,1],"yaoLabels":["初九","九二","六三","六四","六五","上九"],"blocks":{"P":"《序卦传》以“解”为舒缓，谓舒缓之久必有所耗失，遂以损承其后。就文义求之，二卦之间的脉络并不显豁，此说失之浅率。然个别环节的牵强，不足以推翻整体：六十四卦出于人为排定，排定自有准则，辨证之意即寓其中。作者先有万物相联之见，才会追索卦与卦相衔的那一必然；纵其推求未必尽当，其志要不可没。此种必然本非子虚，卦与卦之间确有内在关联；唯编次成于人手，夹杂粗疏，正不必深怪。孔子序卦，于先后之序看出深意而表章之，其哲学建树较之当初编订者，实有过之而无不及。\n卦之名损，要在减下厚上一义。以卦变言之：内体可视作乾，外体可视作坤；乾之上画移置于坤之上画之位，坤之上画反下而居于乾之上画之位。一往一来，乾坤易位，下有所减而上有所增，损体遂成。损益相反，减下以厚上者为损，减上以厚下者为益。二者所减，同为阳刚之赢余；所补，同为阴柔之不足。然则同一减补，何以下者为损、上者为益？此须自政理求解。民力见夺，膏血上输，形迹上似为下损上益；究其实，上亦未尝不损。邦以民为本，本固则邦宁，根本既伤，枝叶岂能独茂？","G":"损，有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。","G.N":"卦名之损，专就减下厚上立义；卦辞系以“有孚元吉无咎可贞利有攸往”，则已越出此隅，通指凡损而言。无论何人施损、以何事为损，只须所损者当损，皆在所包。名取一端，辞推全体，分际在此，读《易》者所宜先辨也。\n诸语之中，“有孚”为枢纽，“二簋可用享”次之。“元吉”以下十字，皆自“有孚”而出。损而合于时宜、当于理分，为众人所信服，与人心相契，则元吉可致，咎悔可免，守之可以为正，推之可以无往不利。损既有孚，又将何所施用？答曰“二簋可用享”。此语设譬：损之要，在去其太过而归于中，浮末者、有害者去之，根本者、必需者存之。祭礼之繁缛，视他礼为甚；仪文之饰，最易掩其诚敬。饰胜于诚，诚即流为虚伪；减其过度之饰，而后诚敬可全。诚敬者，祭之本也。“二簋可用”云者，明祭不在物之丰薄，心存诚敬，虽二簋之简，亦足以享上帝鬼神。盛黍稷稻粱者谓之簋；其陈于祭也，隆者八，次者四，简者二。数虽殊，而所以将诚则一。此圣人立辞之微指，读者当于文外求之，不可徒求诸器数之末。","T":"彖曰：损，损下益上，其道上行。损而有孚，元吉无咎可贞利有攸往。曷之用，二簋可用享，二簋应有时，损刚益柔有时，损益盈虚，与时偕行。","T.N":"“损，损下益上，其道上行”——道者，损之道也，其行自下而升。由此言之，下既见减，上亦随之而减；减下厚上之效，非下损而上独益，实乃上下俱损，此卦所以名损。使减下而果有利于上，则名当从益，安得谓之损？\n卦辞作“损有孚”，彖传增一“而”字，语势一顿，义乃愈显：损必以信为本，见信于人，然后“元吉无咎可贞利有攸往”可得而系。孔子释此，独于“曷之用，二簋可用享”二句再三致意，所重者在一“时”字。三言递进，自事相而及理则，层层深入：当损之际，能否审时，实为成败所系。\n孔子言行皆不忽于时，故孟子许为“圣之时者”。《易》之一书亦屡以时立教。卦辞质简，时义隐而未发，孔子抉而出之，著于彖传。\n“二簋应有时”：祭用二簋，损繁文、去浮饰，凡以便厚其本、裁抑其末。然损有其限，本不可尽，必要的仪文终不可去。饰未过而强损之，与损之而无节，二者皆失。善其术者，唯在审时：时至则损，时未至则姑俟；当从重则重，当从轻则轻，不可执一。\n“损刚益柔有时”：刚者有余，可减；柔者不足，不可减。以刚之赢余补柔之匮乏，在损为然，在益亦莫不然。二者同须依时：非其时而减，不可；非其时而补，亦不可。举损而益已在其中，时义遂更深一层。\n终之曰“损益盈虚，与时偕行”：损之益之、盈之虚之，一以时为断。既言损益，复及盈虚，是推人事之理以通于自然。上言“有时”，此言“与时偕行”，盖谓损益盈虚之有时，既为主体所当守之则，亦为客体自具之律。至此，时乃成为最普遍之义。","X":"象曰：山下有泽，损。君子以惩忿窒欲。","X.N":"泽处卑而山处高。水之在泽也，腾则为润，坠则为浸，凡所以奉高者无不至，此非损下而何？君子观此，施于修身，莫切于惩忿、窒欲二事。\n忿者，怒之骤发而失其制者也。一念之动，往往偾大事、贻终身之悔，故有忿必惩——惩者，止而息之之谓也。苏子瞻《留侯论》谓：匹夫见侮，奋剑挺斗，不足称勇。真勇异是——事出仓卒而不为动，辱加无端而不为怒。数语可为惩忿作注。\n欲者，私之所在，恶端多由之而起。窒欲云者，闭遏之使不得逞，免其流为祸害。儒者非禁欲之流，所主者寡欲而已，未尝一概以人欲为敌。然窒欲亦自有其时：必以时地为断，非时之欲当窒，适时之欲则不当窒。","Y1.T":"初九，已事遄往，无咎，酌损之。","Y1.N":"已，训“竟”；已事，谓事既毕。遄，训“速”；遄往，谓速去。\n损之为道，兼损刚益柔与减下厚上二义。初九与六四，正应也：六四以柔居上，初九以刚在下。下之刚当损以奉上之柔，上之柔亦惟下之刚是赖。此固无可疑者。可疑者，初九既以己益上，能不自以为功否耳。事毕即行，速去而不居，则咎无自生；若贪天之功以为己美，既非损己益上之义，又失为下之分，咎必及之。然六四之柔，全赖初九之益，初九亦当自审其分，损之有节，不令过，亦不令不及。","Y1.X":"象曰：已事遄往，尚合志也。","Y1.XN":"尚通作上，指六四而言。初九有益于上，上亦惟初九是赖，两心相契，故“遄往”而无咎也。","Y2.T":"九二，利贞，征凶，弗损益之。","Y2.N":"九二刚而在中，所值者损刚益柔之世，其地甚难处：位柔也，体说也，上应六五之柔君也——三者皆足以夺其刚中之守。\n处之之法，惟贞为善。贞者何？守中之谓也。心一有所向，足一有所前，便去中而失正，凶必自此生焉。\n“弗损益之”何以称焉？九二以刚处下，论其常分，当减己奉上、取刚补柔。而此爻所遇独异：一自损，则力薄不足以奉上；惟其不自损，乃能奉上。自人事观之，人当此际，宜守静而不轻进。形迹上若无补于君国；自其本原论之，守道不枉，足以酿成尊德乐道之风，其有造于国家者反大。东汉严子陵钓于桐庐，不肯受光武之官，于皇家若无所效，而所效实大。所谓桐江一丝、系汉九鼎者，刘秀之治赖以有成。此即“弗损益之”之显证。","Y2.X":"象曰：九二利贞，中以为志也。","Y2.XN":"九二以阳处阴，于位为不正，而爻辞许之以“利贞”，何也？小象申之曰“中以为志也”——志之所存，惟中是归。位虽不正，所居则中。\n《易》之为教，时为先，中次之，正又次之。此其所云，正谓中重于正。志既主于中，则正亦在其中矣。盖正者未必得中，而中者未有不正。","Y3.T":"六三，三人行，则损一人。一人行，则得其友。","Y3.N":"下体本乾，三画皆阳；上体本坤，三画皆阴。今取乾之上画，进于坤之上位以益之：坤之上画由阴而化阳，乾之上画由阳而化阴。此“三人行则损一人”之实也。质言之，“三人行”即下体之三阳，“损一人”即三阳之中减去一阳。其于卦义，正合减下厚上、损刚补柔之指。\n“一人行则得其友”，则通六爻而言之。六爻之相与，皆两两为耦：初九与九二，同德而比；六四与六五，亦同德而比；六三与上九，德虽不同，而居相应之地。凡此皆两两相与，即所谓“一人行则得其友”。然则六爻通义，何独系于六三？盖当损之爻，六三是也；此卦之成损，实由此爻，故辞系焉。\n此二语所状，乃天地间最大最显之损益，抽象之义极广。孔子尝于《系辞》推明其指：天地二气缠绵相感，万物由之化育而醇厚；男女精气交构，万物由之生化而不穷。其系此语于《易》，断之曰“言致一也”。所重者，二而已。天地者，二之至大；男女者，二之至著。举此二者，阴阳两仪之凡例尽之。既判为两，则必缠绵交会，精气相构，以底于精醇专一，而万物由之化生。由此观之，凡物之成，必待两而后能一。生成变化之途，所向者一，所由者二。无二则一无所出，二又必引而为一。究其从来，三者去一则耦，一者得配亦耦，所底莫非二焉。耦成于损益，损益之相为用也如此。是故损与益者，通乎天人之常道也。","Y3.X":"象曰：一人行，三则疑也。","Y3.XN":"一人独行，得友而配，则为二；三人并行，必损其一，亦归为二。二立而后一可致，一致而后生化不穷。\n所谓三，不必拘于三数，凡二以上皆可称三。二以上之数，皆当损其所余，而存其二。何也？耦则相亲，奇则相猜。试言猜之所起：一与一相对，彼此相当，自无可疑；一而与两一相对，则疑生焉——两一之中，孰为与我相与者，无从确定。不确定，即所谓疑。然则如之何？曰“三人行则损一人”，损三为二而已。","Y4.T":"六四，损其疾，使遄有喜，无咎。","Y4.N":"疾者，疾病之谓，引申为缺失、过恶。\n六四以柔居上，初九以刚在下，二者正应。初九损其刚以益六四：益之云者，正是以刚补其柔，举六四之疵累而尽去之，故曰“损其疾”。此一说也。又有一义：六四体柔而处上，所应者刚；当损之时而应于刚，是其能舍柔以就刚。舍柔就刚，即去恶而迁善也。\n“遄”属之初九。“使遄”者，六四自损其疾，其机足以动初九，使之速来相益，并力以除其疾。初九之减下厚上，行乎其所当行，其来也速；六四之自去其柔疾，其改也亦速。两皆迅速，而喜兆以成。喜成，则咎无由生。","Y4.X":"象曰：损其疾，亦可喜也。","Y4.XN":"《易》言“有喜”者屡矣，此独系以“亦可喜”，语意似有分别。窃谓此语乃自初九一边立言：六四不护其疾，肯自损以受初九之益，与之相应无间。在初九视之，则为可喜。","Y5.T":"六五，或益之，十朋之龟弗克违，元吉。","Y5.N":"或者，不定之辞。言来益者众，未可指其谁也。\n“十朋之龟”者，龟贝之至重者也，元龟、大龟当之。古者币以贝行，二枚相比而成朋，朋即其计数之名。币品虽不一，而系之以朋者，唯贝为然。龟宝之分，《汉书·食货志》列为四等。其首等曰元龟。其制径尺有二寸。其值准大贝十朋。计钱二千一百六十。\n六五柔顺得中，而所居至尊，下与九二之刚相应：此虚己以下贤、损上以受益之象，人君之象也。天下之人既皆损己以奉之，六五又能虚中以自损，其志甚决——虽以“十朋之龟”之重宝动之，亦不为所摇，不违众志。故得“元吉”。","Y5.X":"象曰：六五元吉，自上佑也。","Y5.XN":"上，谓上九。佑，福佑之也。六三与上九，应也；居下者之分，固当减己以奉上。而上九近比于六五，故其所受于六三者，归之于六五。此之谓“自上佑也”。","Y6.T":"上九，弗损益之，无咎，贞吉，利有攸往，得臣无家。","Y6.N":"上九以刚居损之终。损极则当变，变则不复为损。\n居此者有二涂：一则以刚处上，更取损于下，此得咎之涂也；一则本可以损，而竟不行其损，转以其刚之道施之于下，此无咎、得正、得吉而“利有攸往”之涂也。上九所由，后一涂耳。处上而能“弗损益之”，故“得臣无家”。得臣者何？天下之众咸归之谓也。无家者，归者至众，不以远近内外为限也。“得臣无家”，与“四海为家”为近，大略谓所臣者广，天下之人皆归焉。\n九二、上九两爻，辞同作“弗损益之”，字面无别，而所指迥异。损卦下三爻，其义皆主于贬己以为人。故九二之“弗损”，谓不以己为损；其“益之”，谓有益于人。九二居下体，于分当贬己以厚人，而所处特殊，故有益于人而己无所贬。上九之“弗损”，谓不以人为损；其“益之”，谓有益于己。所益在己，而所损不在人。","Y6.X":"象曰：弗损益之，大得志也。","Y6.XN":"上九处尊位，居尊而“弗损益之”，正君子所当为。君子之怀，欲益人而不欲损人；此爻有之，其志于是乎得伸。","Z":"损之为字，减也、剥也。卦之以损名，取象于减下而厚上。\n然减下厚上，就皮相观之，似下受损而上受利；究之，则上下俱损。譬诸筑台：取台下之土以增台上之高，台愈高而其基愈危，下既危，上亦不能自安。此下损而上亦损之说也。施于政事，则剥下奉上、朘民以肥君者，其始若损民而益君；民力既竭，君之所据者亦倾，终必上下同受其敝，而国不可固。损之所以为损，其义具于此矣。卦名之损，义纯出于反面，未可为训。\n至卦辞之损，则其义甚宽，凡损皆在其中，初不限于减下厚上。国也、家也、一身也，尊卑上下、巨细百为，无不可用损。卦辞之损，大旨归于正面。\n损之为善为不善，视其所损何如。损所当损则善，非所当损则否。何谓当损？一曰“有孚”：中心孚诚，循理而动，不以一己之好恶为断。二曰“有时”：主观之愿，必副乎客观之时。时至则断然行之，时未至则断然止之。合此二者，损乃为善，而元吉、无咎、可贞、利有攸往皆可期。\n损卦有一异乎他卦者：六爻皆应，爻辞亦与卦辞相衔。六十四卦中，此例不多。初九与六四、九二与六五、六三与上九，两两皆正应；诸爻之义，皆可于卦辞求其根据。初九之象曰“上合志”，九二曰“中以为志”，上九则曰“大得志”——命辞各异，旨归不殊，皆可通于“有孚”。九二爻辞“利贞”、上九“贞吉”，则应乎“可贞”；六四“无咎”，即卦辞之“无咎”；六五“弗克违，元吉”，与卦辞“元吉”同揆；“利有攸往”一语的影子，在爻辞中凡三见：初九曰“遄往”，六四曰“使遄”，上九曰“攸往”。上九一爻，尤与卦辞密合：“无咎，贞吉，利有攸往”，全袭卦辞之文；虽不及“有孚元吉”，而“弗损益之”“得臣无家”之云，“有孚元吉”之义已寓其中。尝观六十四卦，爻辞与卦辞多不相蒙，因知卦辞、爻辞殆非一手所作。然则损卦何以独能通贯如此？意者，作爻辞者于此卦体会独深，且有所阅历于当世，故其言与卦辞若合符节——斯说也，或为近是。\n损卦所涵，有极切要之政治思想：君臣上下之利害，当如何调剂，是其所究。卦辞举损而赋以抽象之义，示人以最普遍之途术——无论何阶级、何阶层、何个人，欲藉损以自达，其道在此：有孚者，内诚而外为人所信；有时者，时至而后行，未至则辍。故损不可概许为善，亦不可概斥为不善，唯因时为断。至六爻爻辞，则由抽象而进于具体，以五端示损道之实。五端者何？其一，初九之奉六四、九二之奉六五、六三之奉上九，皆自贬而厚人。其二，六四“损其疾”、六五“或益之”，皆舍己以从人。其三，初九之益人也，不竭其力，犹存斟酌——是谓损之损。其四，九二、上九一辞而两义，要皆不事减削而自相益，是谓不损之损。其五，六三独行而获配，损其一乃得其一，是损中有益也。"}},"42":{"id":"42","cnNum":"四二","name":"益","pinyin":"yì","fullName":"风雷益","shortFullName":"风雷益","upper":"巽","lower":"震","upperNature":"风","lowerNature":"雷","lines":[1,0,0,0,1,1],"yaoLabels":["初九","六二","六三","六四","九五","上九"],"blocks":{"P":"卦序之次，损尽而益承之。盖剥落既穷，势不能不转，转则所收者皆其偿也，此益之所以次乎损。震下巽上，其名何取？就象言之，雷风相薄而互济：风急则雷愈迅，雷震则风愈烈，二者交助，是以为益。就义言之，则与损适相对待。损者剥下以奉上，益者减上以厚下。然则损下何以称损、益下何以称益？盖上下本同一体，下者上之基也。基薄则栋倾，故浚下以自奉，看似上得其利，实则下亏而上亦随之而亏，通体止成一损，卦名遂以损归之。反是，厚下则根深，根深而枝叶自茂。减上以予下，下既裕，上亦未尝独瘠，通体共成一益，卦名遂以益归之。","G":"益，利有攸往，利涉大川。","G.N":"益者，增也。卦名与损相对，而卦辞立义则较名更宽。名之所专指，止于减上厚下；辞之所包举，则凡天下国家人群蒙其利者，皆在其中，不问施者受者为君为臣、位尊位卑。所谓“利有攸往”，谓可以有行、可以有作；所谓“利涉大川”，谓可济艰险、可图远大。诸卦言利往者多矣，兼言利涉者少，益独两言之，正见其以兴利为务。虽然，涉川之利非别有他途，即寓于利往之中。两语并陈，其旨不在复出，而在示人：世间事每有须己力争取而后得者，机会既至，当奋然赴之，力取其可益之效；若迟疑观望，则时不再来。损卦之辞亦犹是也：名止于剥下，而辞所该者不限于此。两卦对观，其例自见。","T":"彖曰：益，损上益下，民说无疆。自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。","T.N":"彖传发端四句，乃为卦名而设。损益二卦相为反复：损为兑下艮上，颠倒之即成益之震下巽上。若自卦变求之，损之成在于损下益上——三者阳爻，升居于上；上者阴爻，降居于三；是刚在下者见削，柔在上者见增。益之成则在于损上益下——四者阳爻，降处于初；初者阴爻，升处于四；是刚在上者见削，柔在下者见增。此卦变之说也。若自政事言之，上有所减，下蒙其惠，民之喜悦遂无有涯际。“自上下下”一语，承“损上益下”而来，所指初无二致，特更深一层：非徒能行此道，且能推而广之，使益之道昭著于天下。\n“利有攸往，中正有庆；利涉大川，木道乃行”，此释卦辞。益之六爻彼此相应，与损正同。所异者，损之九二、六五虽居上下二体之中而位不当，益则反之，九二变六二，六五变九五，既处中，又履正。中正之德用以益天下，天下必食其福，往而何所不利？又不独平居无事时为然，愈当艰危险阻之会，愈见其济变之能；境愈危，时愈难，而益道愈以大行。盖益之上体为巽，巽于木为象，木能浮而济川，故有“利涉大川”之功。\n末五句更就益道加以称美。“益动而巽”，以卦德言其在政事上的效用：震动者奋发而有为，巽顺者渐渍而深入，二者相济，故功业日增，无有止极。“天施地生”，以卦义言其在自然间的征验：天施者，万物所资以始，乾元之大是也；地生者，万物所资以生，坤元之至是也。“其益无方”，则如春夏之交，品汇咸亨，所被者广，无所不至。末二句统天人而合言之：损上益下之施，其枢机全系于一“时”。应益而益，应损而损，不以己意参之。譬之时令，无春则无由发生，无夏则无由长养；以人事言之，年非歉薄，则无所须其与；时无灾伤，则无所用其赈。故“与时偕行”云者，所论实为规律：益非任情而动，乃有其一定之则——气序既迁，天无从靳其施；时会既值，人无从缓其惠。","X":"象曰：风雷益，君子以见善则迁，有过则改。","X.N":"雷风相薄，有交助之功，亦有疾速之势。君子取交助之义，则迁善改过，而益孰大于是；取疾速之义，则见一善便即从之，知一过便即改之，不令片刻迟回。两“则”字下得极有分量，盖孔子于此着眼处，正在雷厉风行、及时奋迅、胸中不作两念上头。","Y1.T":"初九，利用为大作，元吉，无咎。","Y1.N":"益与损同例，其爻辞亦往往与卦辞相为表里。此卦成卦之旨，在于减四以厚初，故初九居成卦之主，其辞所云，即卦辞之意。“利用为大作”，谓兴办大有造于天下之事，与“利有攸往，利涉大川”约略相当。然有一层须辨：初九居一卦之下，位卑而势孤，欲举此大役，非独力所能任，必得六四为之助而后可。既藉其力，则必举之尽善，获元吉，然后可以免咎；若为而未至乎善，未得元吉，则非特己身有咎，并六四亦将因之而受责。《易》中言“吉无咎”者，皆谓先得吉而后咎可免，而此爻之旨尤为明白。","Y1.X":"象曰：元吉无咎，不厚事也。","Y1.XN":"厚事者，重大之役也。初九处卦之底，分居最卑，本不宜肩荷系乎天下利害之举；只缘六四信之任之，居于上而为之援，乃得从容措手。正惟如此，功必须竟，元吉必须得，然后六四之相知为不虚，初九之受任为不忝。假令中道而废，则六四以失举获谴，初九以不胜任蒙讥，两皆不免。","Y2.T":"六二，或益之，十朋之龟，弗克违，永贞吉，王用享于帝，吉。","Y2.N":"益者损之反也。损之六五转置而成益之六二，故两爻取象无别。损之六五居上体，为受人之益者，以损卦之义在剥下奉上；益之六二居下体，亦为受人之益者，以益卦之义在减上厚下。所处虽殊，其为受益则一，故其辞皆曰“或益之，十朋之龟，弗克违”。言益之者众，虽以十朋之龟——货之至贵者——进之，亦不肯违众心而独异，拒来益之人于门外。其分则在此：损之六五所得者元吉，益之六二所得者永贞吉。损六五之称元吉，以其以柔爻居刚位：柔则能虚己受人，刚则能坚守不移，求益之资，此为最备。益六二之称永贞吉，则以其虽处中而体柔，有虚中之象，本易得人之助，又有九五阳刚为正应；然所短者，以柔爻居柔位，爻与位俱属阴。欲其获吉，惟在永守而勿失，久固而不迁。享帝者，祭天也。“王用享于帝”，事之大且严者。六二虚中柔顺，而能久守其贞，是为受益之臣；王者虽用之以奉郊祀，尚当获吉，而况其他。","Y2.X":"象曰：或益之，自外来也。","Y2.XN":"六二处中得正，而中怀虚受，天下之人皆乐趋而益之。此在六二，初未招而至，非其中心所尝期也——本无求益之念，而益自至。若谓“自外来”专指外卦之九五，亦无不可，盖九五与六二阴阳正应，其来相益乃理之自然。然辞既言“或益之”，“或”者不定之辞，见来者非一，则所谓外来者，实兼九五与众人而言之。“自外来”云者，正谓其出于望外，忽然而至耳。","Y3.T":"六三，益之，用凶事，无咎。有孚中行，告公用圭。","Y3.N":"“益之用凶事，无咎”者，六三以阴柔处不中不正之地，按理不当受人之益。然其位在下体之上，是为一郡一邑之长，民命所寄；又阴爻居阳位，与上九阳刚相应，且当震动之极，有刚决果敢之气，居众上而能为民谋利，故可假凶事以行其益，而其咎可免。所谓凶事，指水旱疾疫、岁大不登之时，守令发仓廪以赈饥民是也。“用凶事”云者，正当益之时，六三即借荒政以敷损上益下之实，凶岁得食，民不流亡，何咎之有？然其间有两条件：一曰“有孚”，一曰“中行”，而又必“告公用圭”。孚者，诚信也，上以之取信于君，下以之取信于民。徒有诚而无节，犹未足也，故须中行——中行者，行乎中道之谓。六三身居下体之上，于本卦之位并不居中，何以系以“中行”？盖自上下二体分言之，二与五各得其中；合全卦而观，则三与四同居一卦之中，故益之三、四两爻并称“中行”。世有以此“中行”当春秋晋之中行氏者，谓其人为谁，此说绝无据依，不足采信。“告公用圭”者，圭为古时通意之信物，大夫与外国或君上交涉，遇礼数郑重之场合，则执圭以明己之身份。此卦之“公”，谓六四；六四近君，乃大臣之居要者。六三虽居下体之上，未尝无位，然不得专断，欲行赈济，必先白于六四，是即所谓“告公用圭”；得请而后发粟，其事乃安。","Y3.X":"象曰：益用凶事，固有之也。","Y3.XN":"荒年发廪以赈饥，正是损上益下之见于事者。然仓中之粟，本自民来，取之于彼而复散之于彼，乃民间自有之藏，非别求增益于外也。","Y4.T":"六四，中行，告公从，利用为依迁国。","Y4.N":"益与损互为反卦。益之六四，其位即当损之六三；损六三见损下益上之旨，益六四之辞与之相类，而所明者乃损上益下之旨。就政事论，益下之务莫先于益民，而古者益民之举，其大且重者莫过迁国。六四将何以成此迁国之谋？盖六四一爻，在卦中任益下之责，然位非人君，事不得自专；迁国何等郑重，尤必告于公，待君命而后行。所幸六四与六三同居全卦之中，具中行之德，故能取信于公，得其听从与扶助。“利用为依”，此“用”字谓用六四，与六二“王用享于帝”之“用”同义。“依”字之义，宜取《左传》隐公六年述周室东迁、晋郑是依之文为训：古者诸侯徙都，或依附王室，或依附大国，未有无所依而能立者。然无所依固不利，有所依而不得其本，亦不利——其本维何？益民顺下是也。若徙都之举不以厚下安民为务，则所凭虽强，终亦无利。六四既有中行之德，则所依与所本二者兼而有之。","Y4.X":"象曰：告公从，以益志也。","Y4.XN":"六四之性，本以益民为志者也。志既在民，则其告于公也，言由衷而理有据，此公之所以乐从。","Y5.T":"九五，有孚惠心，勿问元吉。有孚惠我德。","Y5.N":"有孚者，中蓄至诚，而见信于人之谓。惠心者，惠利乎民之心；惠我德者，民以其德为惠而报之也。九五以阳刚之质，处中得正而居尊位，下与六二之中正相应；德如是，才如是，位又如是，而本其至诚以惠养天下，天下之人沐其泽，其获元吉，可以不待言而决。两“有孚”非一义：前一言者，九五之信乎民也；后一言者，民之信乎九五也。上下交信，上有所感而下有所应，其气遂通。九五怀惠下之诚，及其还也，民亦以九五之德为惠。心与德本非二物：自九五自视则曰心，自民视之则此心即德耳。损之六五亲受下之益而元吉；益之九五不过有此一心，其事或未及施设，而“勿问元吉”——吉已前定，无所复疑，其分量视单言元吉者又高一等。即此可见《周易》之中，重民之意已具。","Y5.X":"象曰：有孚惠心，勿问之矣。惠我德，大得志也。","Y5.XN":"“勿问之矣”者，谓既有孚而惠心，则元吉可必，无事致疑也。孔子独拈“勿问”二字而申之，正见人君之有无惠下之心，所系至重。民心转而归其德，此在人君，可谓志满愿足，功无遗憾者矣。然则所志果安在？不在民之惠我，而在君之能致民之惠我——有其道以得之，斯为得志。","Y6.T":"上九，莫益之，或击之，立心勿恒，凶。","Y6.N":"上九居一卦之终，爻体又属阳刚，求益之心过盛而不知足，势极则反：非但不能受益，且将有所失。是故环顾四周，无有以益来者，而反击之者至焉。其故何也？病在“立心勿恒”，故凶。勿者，无也。立心者，立其益下之心也；勿恒者，谓此心不克有常也。损之为道，剥下以奉上，其事出于权宜，非可持之久远；益之为道，减上以给下，乃经常不易之法，所贵者恰在能久。上九适当益下之时，义当守而不变，而势有所不能：以阳刚处益之极，求益无厌，遂使益下者转而为损下，益下之心于是不常矣。推此理以论政事，则为上者取民而无与，侵牟之，朘削之，则民心不惟不与之益，且将起而与抗。","Y6.X":"象曰：莫益之，偏辞也。或击之，自外来也。","Y6.XN":"陆德明《释文》于“偏”字下有注：读与“篇”同，孟喜本则径写作“徧”，训为周匝。二字既相通，则所谓偏辞，实即徧辞。何谓徧辞？以今语明之，即逻辑学中所谓全称命题，或肯定，或否定。“莫益之”一语，正属全称否定：举天下之人，无一肯益之者，不容有例外。若“自外来”，则是出于意想之外而卒然至者——中心本不望其来，而彼竟来，其来也，有必然之势，非人力所能趋避。六二小象言“或益之，自外来也”，上九小象言“或击之，自外来也”，两处除一益一击、一正一反而外，句法悉同。","Z":"益之得名，取损上益下为义；而卦辞所言之益，其界域则加广焉：不限于减上厚下，凡兴利之事举在其中。“利有攸往，利涉大川”，君臣上下、国家一身，无所不施；其所重者，在举大役、拯大难、成一代之业；而所以成之，则在乘时奋发，先事而动，不安坐以俟时之自至。\n诸爻之辞，与卦辞有相应者，亦有不甚相应者。初九“利用为大作”，即卦辞“利有攸往，利涉大川”之旨，此相应者也；其余诸爻，大抵言所以益下之事，与卦辞几无所涉。质言之，爻辞所重，在阐发居上者如何益民、在下者如何受益。六二之“或益之”，六三之“益之用凶事”，六四之“为依迁国”，九五之“有孚惠心”，上九之“莫益之，或击之”，一正一反，交相发明，而曰恤、曰利、曰从、曰益，四者相资，其义遂曲尽而无遗。后世儒家德治仁政之论，或即于此卦有所取资。\n三、四两爻皆系以“中行”，此语殊可注意。盖“中行”殆为尔时习见之语，谓守正奉公、持身不越乎中道也。或有以“中行”为春秋晋之中行氏者，凿空无据，未可置信。"}},"43":{"id":"43","cnNum":"四三","name":"夬","pinyin":"guài","fullName":"泽天夬","shortFullName":"泽天夬","upper":"兑","lower":"乾","upperNature":"泽","lowerNature":"天","lines":[1,1,1,1,1,0],"yaoLabels":["初九","九二","九三","九四","九五","上六"],"blocks":{"P":"夬之在序，承益而列。《序卦》谓益极则必决，此夬所由次也。盖蓄之已盈则势将溃，理有固然，故益之后继以此卦。夬者，决也。决字从水，本状流行之疾，《说文》训“行流”，段注易作“下流”，皆就水之前推、遇物必穿而言。及其施于人事，则转为主除之义：阳当除阴，君子当除小人。观其体，乾居下而兑居上，众刚布于内，一柔据于外；刚长既久，此柔终在见拔之数，适值君子道长、小人衰尽之时。柔据高位而近君侧，去之不快则刚终受制，此五阳之势所以不容自止也。","G":"夬，扬于王庭，孚号有厉，告自邑，不利即戎，利有攸往。","G.N":"夬之成卦，下体五阳并列，上体独余一阴；十二辟卦之列，此当三月。卦辞所论，为阳之除阴与君子之去小人，而大旨一归于戒惧谨慎。“扬于王庭”一语最为紧要：五刚共挤一柔，形似易与，实则未可轻心。何也？此柔在君侧用事，根柢深而耳目广，非徒以力可取。故必先暴其罪状于王庭，使彼无所容身，亦使君上与群下共见其情实。然犹不敢恃也，继之以“孚号有厉”：以诚心呼集同列，而中怀惴惴，未尝一日忘忧。然则将用武乎？曰：不可。“告自邑，不利即戎”——告者，戒也；自者，从也；即者，就也。由所居之邑始，自近而远，递相晓谕，使人知所防；若趋就兵戎、以尚武为事，则未有能济者。既戒其尚武，又系以“利有攸往”，明此时正宜有为：乘五刚逼一柔之势，一举而除之。盖君子苟安于静俟，小人无自消之理。","T":"彖曰：夬，决也，刚决柔也，健而说，决而和。扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。","T.N":"释卦名者，首数语而已：夬之训决，谓以刚决柔也。五刚列下，一柔在上，刚息阴消，故取刚决柔之象而以夬名卦。“健而说，决而和”二语，则释名之后所缀之赞辞。赞辞之设，大抵为下文疏解卦辞先立地步，其用在承上启下。以二体论卦才：内乾主健，外兑主说；刚健而行以和说，则决去之际自然不至戾厉。能和，是夬之极则。刚之于柔、君子之于小人，本无可不决；所虑者术不审、措置一差而事偾耳。\n以下逐句释卦辞。“扬于王庭”者，暴其罪于朝堂大庭也。罪状何居？曰“柔乘五刚”：以柔据尊而压众刚，凭势以凌轹之也。“孚号有厉”，谓君子中藏危惧；危惧愈深，其道愈显。\n“告自邑，不利即戎，所尚乃穷也”：去小人者宜取和缓，不当耀武。若专恃威猛、以兵力为尚，则决而不和，其道必至穷蹙。\n“利有攸往，刚长乃终也”：复之卦辞亦系此四字，彼释曰“刚长”；此则增“乃终”二字。刚自复而始息，至夬而已五，所余一阴耳。再进一步并此一阴而去之，卦成纯乾，刚长之全程至此方毕，故谓之“终”。复如聚土初加一篑于平地，孔子喜其方长，故但书“刚长”；夬如九仞之台仅亏一篑，孔子虑其辍功，故必书“刚长乃终”。二辞之异，正见圣人于将成之际特加之意。","X":"象曰：泽上于天，夬。君子以施禄及下，居德则忌。","X.N":"需之象曰“云上于天”，云升而泽未降，其施有待，故名需。今此卦曰“泽上于天”：泽气上腾，郁极而决，决则沛然成雨，雨下而品物蒙润。君子观此象，当推禄以及于下，而不当畜德以自居。居与施，其指相反：居者闭而不出，积而不散之谓；此所谓德，则恩泽之谓，非德行也。君子所忌，莫甚于畜泽不流；“施禄及下”，散其膏润于下民，斯为得之。","Y1.T":"初九，壮于前趾，往不胜，为咎。","Y1.N":"凡爻辞之系以趾者，十九在初。夬之与大壮，相去止一间：此以五刚御一柔，彼以四刚御二柔，卦画所争，特一画之增损耳。大壮初九戒以“壮于趾，征凶”，夬初九则曰“壮于前趾，往不胜，为咎”；取象既合，命义亦无二致。其意谓：初九刚而在乾，刚性本宜居上，今顾屈于最下，郁郁思逞，遂凭其壮往之气，或奋于趾，或奋于前趾，锐然欲上清君侧之恶；然众寡之势悬绝，一掷必碎。夬多一“前”字，见其勇进更急。“前”于此不作虚字，乃动词，前趾即举趾而前，亦即进也；壮于前趾，犹云壮于进。凡此皆躁动之状。至系以“往不胜，为咎”，特提“不胜”与“为”二字，明其败非时势使然，咎由己作。","Y1.X":"象曰：不胜而往，咎也。","Y1.XN":"“不胜而往”，所状者心也。夬之为戒，在决之际常存危惧：纵有必胜之算，犹不可忽，况本无胜理而贸然前行者乎？咎从何生？生于己而已。处夬之世，先须去胜心；明知力不能胜而犹冀幸一胜，此念尤不可萌。","Y2.T":"九二，惕号，莫夜有戎，勿恤。","Y2.N":"六爻之中，九二最善。其辞尽发卦辞“孚号有厉”“不利即戎”之旨——君子之去小人，须臾不忘忧虞。“惕号”者，内怀戒心，外呼同志，堤防周匝，居安而如履危；小人虽有阴谋，亦无所投其隙。“莫夜有戎，勿恤”云者，莫者日暮之称，奸人昏夜举兵而来，亦无可忧，此又居危而知其平也。欲除小人者必先备小人，备立则患消。惟能惕，故能勿恤；惟能视无事如有事，故能视有事如无事。譬之行师：平日未尝有警，而终日钦钦若大敌在前；及乎接刃，志气反安闲，如不欲战。","Y2.X":"象曰：有戎勿恤，得中道也。","Y2.XN":"“有戎勿恤”非故示镇定、以从容为高也；谓其遇变不惊，以中自守而操胜算，其所恃者固在胸中。以爻象求之：九二以刚处柔，刚而不溢，望之如老成；初九则刚又居刚，如少年喜事而好胜，故不相类。若九四者，刚处柔位与九二同，而优劣迥判，其辨安在？辨在九二得乾体之中，所守者中道也。《易》道贵中；九二位虽不当，既得其中，则位不正而义自正。夬之九二与大壮之九二事状略同，故两卦皆许以得中。","Y3.T":"九三，壮于頄，有凶，君子夬夬，独行遇雨，若濡有愠，无咎。","Y3.N":"此爻之旨，最可玩味：君子之去小人，初不系乎形迹之亲疏，而视其心坚否而已。心苟坚定，则一时与之周旋共处，见疑于同列、受责于友朋，皆不足恤；终能去之，即无咎。《彖》言“决而和”，正谓此。頄者，颧也。所谓“壮于頄”，正指九三之质言之：刚而又刚，位在乾体之颠，阳气尽浮于外，方其蓄意去邪，愤愤之色先见于面，凶固宜矣——此九三之一面，一可能也。然亦有其又一面：九三以君子之身，抱夬夬之志，而外貌济以和柔；而上六独与为正应，于是“独行遇雨，若濡”之象生焉。雨者，上六也；上六为兑之主爻，泽上于天，故取雨。所以应之者非本心然也，故不称应而称“遇”；濡亦特外迹，非真渍染，故又系之以“若”。自外视之，九三似为彼所沾污、与之同流；实则和而不同，“君子夬夬”之守未始摇动。众君子不察，或加愠怒；然此特一时，其终必无咎。","Y3.X":"象曰：君子夬夬，终无咎也。","Y3.XN":"初则“若濡”，继则“有愠”，形迹上几若与小人私有款曲，同列亦为之愤然；而卒归无咎者，以其志在夬夬，去之惟恐不终也。","Y4.T":"九四，臀无肤，其行次且。牵羊悔亡，闻言不信。","Y4.N":"九四阳处阴位，不中且不正，是其病根所在。志未尝不欲去小人，然刚壮之性驱之使亟进，而不知以缓济之，故有“臀无肤，其行次且”之象。臀肉尽则不能安坐，不能坐则势须行，行而次且（即趑趄）却步，欲前不得，处境之艰于此可见。然则如之何？曰“牵羊”而已。羊即九四自谓，牵者自牵也。羊之性善触，角不敝则不已。九四苟能自掣其羊，制住此副狠性，悔可免焉。顾此仅为一可能，成否视其能闻言而信否。而九四未必能信：人当无忧无惧之时，箴规之言最难入耳。","Y4.X":"象曰：其行次且，位不当也。闻言不信，聪不明也。","Y4.XN":"九四之病，根于位不当——不中不正故也。刚而居柔，位既失，故“臀无肤，其行次且”，欲进不能而终不能不进。“牵羊”之语本是忠告，彼亦难纳。孔子于小象，既为之惜，又欲其奋，故曰“聪不明也”。此语于全书凡再见，噬嗑上九即其一也。其意谓耳有所蔽而听不审也。聪本主耳，明本主目；二字合为“聪不明”之句，聪居主位而当耳听之用，明字遂亦带聪义。","Y5.T":"九五，苋陆夬夬，中行无咎。","Y5.N":"苋陆之为物，即俗称马齿苋者，草本而岁一荣枯；其禀阴偏厚，体柔脆而少坚，此其特点。“苋陆夬夬”之象，谓九五切近上六，渐染阴气为深；以决阴之主，而与众阳所欲去者相亲比，宜其有咎。然以刚阳之质，处中正而履尊，志足以决，力亦足以副之，能绝上六而除去之。两夬相叠，谓其决之不已，非一决而遂已也；所决者，上六也。九三应之，九五比之，皆恐其不能决，故各叠两夬字，以见去恶之勇。九五又能以中行之道处此，决之而不过于暴，是以无咎。","Y5.X":"象曰：中行无咎，中未光也。","Y5.XN":"彖之所以勉以中行者，正缘其中之未光；若谓已行中道而犹未见光明，则失其旨矣。曰“中未光”，谓其内有所蔽，识虑之间未透彻也。九五以刚近比于柔，情意之间岂能全无系累？正惟如此，愈须于行事上力践中正。","Y6.T":"上六，无号，终有凶。","Y6.N":"上六处夬之终，阳气盛极，阴气尽消。此时君子当运，小人无权，其消亡已成定局，无可复挽；纵有号咷，终亦归凶。","Y6.X":"象曰：无号之凶，终不可长也。","Y6.XN":"“号”于此取平声，作去声读则失之。彼既至此，消亡之势已成，形格势禁，断难久延；号亦何补。然所不可久者，小人之道耳。决小人之道，非谓必尽决其人也。","Z":"夬卦所陈，乃刚之胜柔、君子之去小人事也。五刚在下而其势方张，一柔在上而其气已索；君子当运，小人失据，其消尽可期，所争者旦暮耳。然卦爻之辞未尝以此少宽，转以戒惧立教，丁宁反覆，不留余蕴，盖谓事之易成者，措之尤当审慎。卦辞“有厉”、九二“惕号”、九四“牵羊”，皆此一意。夬之五刚祛一柔，与大壮之四刚祛二柔情境略近，俱患其刚壮太甚，而以阳居阳者尤烈，初九之“壮于趾”、九三之“壮于頄”是也。是以夬之诸爻，反覆致意：刚之胜柔、君子之去小人，首在自敛其刚壮，归于“决而和”；当决则决，而决中有和，当和则和，而和中不忘决。若九二、九五，则又不在刚而在中：裁之以中道，履之以中行，乃其的也。"}},"44":{"id":"44","cnNum":"四四","name":"姤","pinyin":"gòu","fullName":"天风姤","shortFullName":"天风姤","upper":"乾","lower":"巽","upperNature":"天","lowerNature":"风","lines":[0,1,1,1,1,1],"yaoLabels":["初六","九二","九三","九四","九五","上九"],"blocks":{"P":"《序卦传》论卦序相承之理，谓夬主于决，决则分，分则不能无遇，故姤次之；而姤之诂，正取相遇之义。姤之字，三书互证：陆德明《释文》作遘，长沙帛书作遘，《杂卦》亦作遘，字形虽异而音义同。姤、遘本一字，其训为遇。遇者，未及要约而卒然相值之谓。古者诸侯盟会，先期而后见者谓之会，初无成约而卒然相值者谓之遇，二者之判，在期与不期。然则姤何以处夬后？盖夬之为义为决，决者剖分；姤之为义为遇，遇者会合。凡物浑然未判，则无所谓遇；惟其既析为二，乃有彼此相值之机。分极而合，理势相因，此姤所以承夬也。至其体巽下乾上而名姤，亦有二说：巽为风，乾为天，风行宇下，周历万物而无所不接，一义也；一阴初萌于下，与诸阳卒然相会，非可预计，又一义也。","G":"姤，女壮，勿用取女。","G.N":"姤之世，一阴方萌于五阳之下，自此而二、而三、而四，其势递进不已。阳日退，阴日进，消长之局已定，此“女壮”之所由称也。在《易》家看来，壮大而属于阴类，非吉事而为凶事。何也？女之壮必伴男之弱；男弱女壮，则夫唱妇随、男尊女卑之常分将倒置而失序。是以系辞戒之曰“勿用取女”，非徒为一时之避就，实示人以根本之取舍：凡足以助长阴柔、增益女势者，皆当预为之防，断之于始，不使其有可乘之隙。","T":"彖曰：姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉。","T.N":"彖传先释卦名：“姤遇也，柔遇刚也。”姤之所以为姤，其义止于一“遇”字；而相遇之分际，则在柔之就刚，非刚之就柔，语序先后不可倒置。夬之为卦，五刚并列于内，一柔孤悬于外；刚再长一画，则柔无所依而去，卦体遂纯乎乾。乾当四月，然不得承夬者，以夬后所次实为五月之卦，一阴已生于下，与刚阳卒然相值，非人力所能预期。故孔子于卦名之下特标“柔遇刚”三字，既明姤之实为遇，复明遇之实为柔之遇刚。\n次释卦辞：“勿用取女，不可与长也。”长当读如久长之长，非长幼之长。阴之既萌，如草木穿土而出，日引月长而不可抑；阳日衰，阴日盛，积渐不已，终且尽掩乎阳。如是之阴，固非可与之久处者。譬诸女子，其气禀识量皆压其夫，则夫不能有其家，娶之适以启衅，故戒以“勿用取女”。此一戒，见经传作者于男女之防、尊卑之序持之甚严，崇阳抑阴之意昭然可睹。\n卦名卦辞既竟，乃推言其时义。“天地相遇，品物咸章也”——柔之遇刚，自人事言之诚为可忧，自造化观之则未始不善。阴阳相值，即天地之气交；二气交感，其用至大，万物由之以生，由之以著，形形色色，莫不章明显露。\n“刚遇中正，天下大行也”——刚谓九五。九五以阳刚之质，处上体之中，位既得当，德复不偏，故谓之“刚遇中正”。就政事而言，人君具刚健之德，又居中正之位，则姤之道推行于天下，沛然莫之能御。\n末以“姤之时义大矣哉”叹之。同一姤也，可以为祸，可以为福，其分界全系于一“时”字。时之所宜，遇即为庆；时之所忌，遇即成灾。为祸为福，不系于遇之本身，而系于人之审度与操持。圣人之所兢兢，正在此几微将动未动之顷——朱子“几微之际，圣人所谨”一语，恰可移作此卦时义之注脚。","X":"象曰：天下有风，姤。后以施命诰四方。","X.N":"天穹之下有风，其行无远弗届，遇物即接，此卦象之所以为姤。爻辞称“后”，后何解？《尔雅·释诂》释君之称，罗列十余字，而后居其一；可见此处之后，即王者也。王者观风行为象，施之于政，则有“施命诰四方”之事：诏令自中枢出，达于四境，使人无不知，地无不遍，奉而行之。然姤与观，大象相类而实有别。姤为天下有风，风不择地而吹，故令亦不择地而至；观为风行地上，先王亲履其境，足迹所及终有涯限。广狭之判，正在于此。","Y1.T":"初六，系于金柅，贞吉。有攸往，见凶。羸豕孚蹢躅。","Y1.N":"一卦六爻，惟初六一画为阴，姤之得名由此，故初六者，姤之卦主也。卦辞所谓“女壮”，统全卦立论；此爻则专就一阴之始萌者言之，所指止此一画，故其辞不言壮而言其微。虽然，微者正其可畏处。阴在此时，力尚未充，势尚未张，然其趋向必日进而不已；君子当此，正宜亟谋所以遏之，勿令其得一寸之进。迨其既壮，则虽有大力，亦无从措手矣。\n爻辞分作两层读。“系于金柅，贞吉”为一层。柅者，止车之具，今之所谓制动者也。车行而柅止之，则轮不复转；柅以金为之，则其制之也坚确而无所失。然犹虑其未足，复以绳系之，缠缚重固，车乃绝无前进之理。初六一阴之在下，其微弱最易为人所忽，苟听其自便，异日之祸必自此始。智者见之于早，及其未成而系之，使不得前，则“贞吉”可得。此“贞吉”者，谓安处不动而吉，非谓其行之于正而吉也。\n自“有攸往”以下为第二层，反承上文而申戒。假令君子不系之以柅，而听其有所往，任此一阴徐徐而进，则“见凶”必矣。末复取豕为喻，以尽其意。豕之羸者，瘠弱不足畏也，然其必肥，可坐而待；就其终竟言之，今日之羸，正他日之壮，安得而忽之？“孚蹢躅”者，言其形虽瘠，而跳踉躁动，已有亟趋之势。初六之阴，正如一豕之躁而不驯者；君子宜及其羸瘠之时早为之所，勿使其至于肥壮。凡此，皆见微知著、防患于未然之道也。","Y1.X":"象曰：系于金柅，柔道牵也。","Y1.XN":"小象之解，全在一“牵”字。牵者，曳之使退，非推之使前也。《易》中言牵，自小畜九二“牵复吉”以迄此爻，其义一贯，皆谓掣而挽之，令不得遽进。故“柔道牵也”云者，正谓于阴柔方长之势从而挽拽之，遏其锋而回其势。盖阴柔之道，苟无物以牵掣之，未有不蔓衍而至于盛者。","Y2.T":"九二，包有鱼，无咎，不利宾。","Y2.N":"鱼，阴类也。爻辞之鱼，即指初六一画；“包有鱼”者，九二以此一画之阴纳于己之涵盖中也。九二阳刚而居下体之中，与初六地相邻而情相比，既有包之之责，复有包之之力。责者分所当为，力者才所能及，二者兼具，乃可以言包。\n包之为义，首在制阴，谓遏止阴柔之浸长，不使其骎骎日上；次在容阴，谓居上者处小人于宽厚之中，剂量分寸，不使怨毒激而横决。九二之居中，正得此分寸，故能容而不纵，制而不迫。两义同寄于一“包”字：制为本，容为用；容者亦所以为制之地，非别出一途，初无牴牾。\n至“不利宾”，则就外言之。阴柔之鱼既为此近比之刚中所包所止，则自外而至者无从染指，故曰不利宾。","Y2.X":"象曰：包有鱼，义不及宾也。","Y2.XN":"九二之包，首在遏制初六一阴，勿使之自下而进；就义而言，此阴不当更与外人相值，故曰不及宾。","Y3.T":"九三，臀无肤，其行次且，厉，无大咎。","Y3.N":"此爻之义，与夬九四恰可对看。臀之无肤，则不能安坐；不能安坐，势必起而行；及乎行，又次且踬碍而不前。欲止不得，欲进不能，其困窘可知。九三何以致此？盖其质过刚，其位不中，而当柔阴初生之时，胸中怀一求遇之念，欲得初六而制之。此念既切，虽明知艰阻，亦必勉力以赴；然所处之地分不当越，初六之遇非其所宜求，初六之阴非其所宜制。以意气得失之间，径情而强行，危道也。所幸者，九三毕竟以阳居阳，得位而非失位，未至昏惑而不可返。诚能自审其分，止而不躁，则大咎可免。","Y3.X":"象曰：其行次且，行未牵也。","Y3.XN":"牵字义与前同，仍为掣挽使退。九三之“其行次且”，正见其于初六既不当牵，亦不能牵。初六小象言“柔道牵”，是阴柔可被牵挽之证；此爻小象乃曰“行未牵”，则适与之反，谓九三虽有牵之之心，而其事终不得遂。","Y4.T":"九四，包无鱼，起凶。","Y4.N":"九四与初六本为正应，论分宜任制阴之事，而其实不能有所制。就外缘言，九二近比初六，已收而止之，四无可施之力；就自身言，则咎有不容辞者。九四以阳刚之质居阴柔之位，位既失当，体复不中，既无以容阴，亦无术制阴，与九二“包有鱼”适成反照，故其辞曰“包无鱼”。\n试以夬之九三为比：彼所任者决阴之事，乃不胜其刚，遂“壮于頄”以示威，矜壮而色厉。此爻所任者制阴之事，乃不能含忍，遂“包无鱼”，恶之而远之。一则刚而失于容，一则严而失于容；含弘之度既亏，消弭之方亦穷。故彼系以“有凶”，此系以“起凶”。“起”者，生也，与“有”异字而同指。","Y4.X":"象曰：无鱼之凶，远民也。","Y4.XN":"无鱼之凶，其源在九四不中不正：处心既偏，则于小人不能含覆，而制之之术亦随之而穷。盖容之与制本为一事，不能容者必不能制。推之临民亦然：民不亲我，非民之远，实我自远之耳。","Y5.T":"九五，以杞包瓜，含章，有陨自天。","Y5.N":"九五之于初六，既非比邻，又非正应，两无相遇之因，则亦无施制之隙。制阴而不得其遇，事诚难矣。然九五以阳刚之德，处中正之位，固自有其道，不待遇而后能也。“以杞包瓜”者，杞，木之高而叶大者；瓜，蔓生附地者也。乔杞覆荫，瓜处其下，不见天日，此九五之包初六也。然包者特为之限隔，非遂能尽其事。事之尽也，有待于时，有待于渐。“含章”者，正谓藏美不炫，隐机不露，声色不动，从容以俟之。俟之既久，则“有陨自天”之日至焉：瓜熟而蒂自脱，陨坠于地，初六之阴终亦不能自免。","Y5.X":"象曰：九五含章，中正也。有陨自天，志不舍命也。","Y5.XN":"九五之能含章、能隐忍以待时者，岂有他哉？亦以其阳刚而中正耳。刚则不挠于势，中正则不偏于见，舍是未有不躁进而偾事者。\n小象所谓“志不舍命”，当分三字训之。志者，心之所之，属乎人者也；舍者，违而去之；命者，气数之自然，属乎天者也。谓人之志不逆乎天之命也。夫一阴生于下，浸淫而长，阳日以消，此姤之时之命也，命固不可违。然而九五制阴之志至坚，不苟委于命，乃取“含章”之途，因势而利导之，使此一阴如瓜之熟而自落，终就约束。瓜熟蒂落，不假人力，循乎自然，即“有陨自天”之谓。是知有陨自天，半由命，半由志；尽委于命不可，尽诿于志亦不可。荀卿“制天命而用之”之语，正从此处得来。","Y6.T":"上九，姤其角，吝，无咎。","Y6.N":"上九以阳刚踞一卦之巅，如兽之有角，挺然出于头顶，故取象于“姤其角”。二卦覆而观之，夬之初即姤之上；故两爻地位相当，取象亦相准。夬初曰“壮于前趾”，此曰“姤其角”，其位皆与阴爻相去最远，其势皆有所隔绝而不得相及。\n然二爻之结局则不同。夬初志在决阴，而力不能胜；纵使必于前进，亦终无成功，且不免于咎。姤上则不然：与阴既隔，制阴之事无自而施，故其占止于“吝”。所异者：夬初居卦之始，义当有行，不进则废其职；姤上居卦之终，前无所往，制阴已非其分内，故虽无功而亦无咎。此正如避世之士，天下有乱，既不能拯，亦不复预，清静自守，毁誉两无所加。","Y6.X":"象曰：姤其角，上穷吝也。","Y6.XN":"君子处于姤之终极，与阴不遇，遂亦无所施制；咎固可免，而羞愧终不可掩。凡此，皆由所处已穷之故。","Z":"姤之一卦，其义当析为二端：卦辞所言者，宏观之旨也；六爻所言者，微观之术也——阳之制阴，即君子之处小人是已。柔遇刚则阴日以滋，阴日滋则阳日以削，故姤之为事，未可许为美事；姤之为名，亦未可许为美名。\n然执此以概姤，则又失之。时有所值，势有所宜，则姤固美事，亦美名也。充类至尽，天地之间、人群之内，且不容一日无姤。何则？天地以阴阳相值而成化，君臣以阴阳相值而成治，男女以阴阳相值而成家；相值即所谓姤，有姤然后品物生、邦国宁、种类续。阳刚非不善，然独阳则孤而无所施；必阴阳交济，而后成其为世界。\n所难者，阴阳之消息无恒。此进则彼退，彼盈则此虚，一消一长，循环而未有穷期。人处其间，遂生出如何执持、如何驭使、如何因势利导之一大问题。必也察其几微于未著之先，慎其动作于将发之际，然后可使变化之趋向折而入于利我之一途。此意于何见之？求之六爻而可见。\n六爻之辞，尽取阴阳之辨，一一坐实于君子小人之际。方小人道长、君子道消之时，君子之所以处小人者，其事至不易言。六爻之中，惟九五所见为最深。君子之于得势之小人，不亟攻之，先从而覆冒之，如杞叶之裹瓜然；既裹矣，则含其章、隐其锋，静俟其“有陨自天”，若瓜熟而蒂落者。此中寓有两层：重天道之固然，而不废人力之当尽；尽人事之当然，而不违天道之自然。其余诸爻，亦各有所明。九二“包有鱼”，见欲制小人者必先能容小人；九四“包无鱼”，则反言以见能容然后能制之理；九三“臀无肤”，状制小人之艰，动辄掣肘；初六“系于金柅”，戒人勿以小人之势尚微而轻之，当及其微弱之际早为之制，勿使得逞。\n合而观之，一阴之生，自有其不得不生之故；一阳之制，亦必有其所当施之方。诸爻皆申此旨。若以简单粗暴之术应之，则凶咎之来，未有穷已。\n至若上九“姤其角”，则又别出一格。其人高而远乎阴，既不能及，亦不能制；不同乎乱，亦不能救乎乱，萧然有世外之致。以常理论之，疑若与姤义无涉。然生人之中，此等人物与夫此等情事，所在多有。《易》之作者不遗此爻，正见其虑事之周浃、察情之细密，非一端所可尽也。"}},"45":{"id":"45","cnNum":"四五","name":"萃","pinyin":"cuì","fullName":"泽地萃","shortFullName":"泽地萃","upper":"兑","lower":"坤","upperNature":"泽","lowerNature":"地","lines":[0,0,0,1,1,0],"yaoLabels":["初六","六二","六三","九四","九五","上六"],"blocks":{"P":"《序卦传》以遇训姤，谓物既相遭则必合，故姤之后受之以萃。萃者何？聚也。群之始由于遇，遇而不已则成聚，两卦相承，正取此义。","G":"萃，亨，王假有庙。利见大人，亨，利贞。用大牲吉。利有攸往。","G.N":"卦辞首字“亨”，实为衍文。卦名之下原本不系此字，王肃本独有之，王弼本沿袭而未能刊落；孔子作《彖传》，亦无一语及亨，可为确证。\n“假”读作格，其义为至。庙上着一“有”字，自来说者皆谓其不为义，与“有虞”“有夏”之“有”同科，特语助耳，非谓庙之所有也。合二字而读之，谓王亲至其庙而已。至庙何为？行祭礼也。古者国有大事，兵戎出行之属，天子诸侯必先告于祖考，以示此举上承先人之志，非由己意专断；人心亦由此齐一而凝聚。\n萃卦卦辞所论，要在如何使天下之人合而为一。而在古人看来，聚天下之众，未有捷于庙祭者，故系辞先举“王假有庙”。然徒有庙祭犹不足，必也“利见大人”，又必也“利贞”。大人者，天子诸侯之居上位者也。众聚则易哗，物聚则易竞，苟无王公大人统摄于上，其所聚者势将转而为乱为争。聚又不可以不以其正；正者，非苟合，非悖聚，否则虽合必离，不能固也。\n“用大牲吉”承上句而申之。萃之时，万物充盈，国家殷富，祭享之礼宜用大牲，不当以小为俭，事鬼神贵乎厚而忌乎啬。古以祭祀为国之大事，故所言虽止于祭享，而凡百设施皆在其中。邦国既富，物力既丰，则一切举措宜从厚而不宜从薄。此正大有可为之际，故终之以“利有攸往”。","T":"彖曰：萃，聚也。顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。","T.N":"彖传释卦，只拈一“聚”字，于名义更无他及。以下转就德与体推求其所以能聚：外兑内坤，兑说而坤顺，故曰“顺以说”；九五刚而居中得正，六二在下应之，有应则不孤，众之所以归也。\n“王假有庙，致孝享也”者，言王入庙行祭，于先人之前，尽其心则孝，竭其物则享，总归于一诚而已。王者欲合天下之心，亦当如祭祖之时，先自尽其诚；以至诚对天下，天下自无不合。\n“利见大人亨，聚以正也”者，大人谓居上之统治者，非匹夫之谓。合天下之众者，必其人有其位、有其势，然后能之；无位无势而欲收众心，乱之道也。故聚而出于王公大人，则为以正而聚；不然，则以邪而聚矣。\n“用大牲吉，利有攸往，顺天命也”者，物力有余则礼宜从厚，物力不足则礼宜从薄，此自然之分限。萃当富盛之时，养生送死、享神事人，皆不宜过自菲薄，故祭必用大牲。富盛之世即有为之时，于是有所往、有所为，是乃顺乎天命，非强作也。所谓天命，宋人以天理释之；自今日言之，即事物固有之则，非别有主宰于冥漠也。\n末句“观其所聚，而天地万物之情可见矣”，则孔子释辞既毕而自致其意者。合咸、恒、萃三卦而观，其立辞皆以“天地万物之情”为归，而所从入者不同：自其相感而入者，见情之无隔；自其不易而入者，见情之能持；自其会合而入者，见情之无二。所指虽殊，要皆谓万物各有其则而不可乱也。萃之所论，万物之聚也；聚之之则，唯同而已。王弼谓物以类相从、群以气相别，情同而后合，气合而后群，正此之谓。","X":"象曰：泽上于地，萃。君子以除戎器，戒不虞。","X.N":"外兑内坤，泽水独高乎地，漫而不泄，是萃之象也。水既汇于地上，自无涣散之忧，聚义于是而立，卦名由之而起。君子玩此象而施于政事，则曰“除戎器，戒不虞”。除者，整治修葺之谓；戎器者，兵械也。简阅兵械、修明武备，所以防国家之猝变。孔子何以由萃聚而及于此？其中自有脉络：众既合则争端必起，争而不已则祸乱随之，欲弭争止乱，非临时可办，必先事而为之备。","Y1.T":"初六，有孚不终，乃乱乃萃，若号，一握为笑，勿恤，往无咎。","Y1.N":"初六与九四本为正应，宜其相合而无间。然上体两阳并峙，九四之外又有九五，初六依违其间，向背之心不能专一，既欲就四，又欲就五，所孚于四者遂不能有终，而“乃乱乃萃”之象成焉。两句“乃”字不可混：上一“乃”为语助，无实义；下一“乃”则训为“你”，指初六言之。谓初六既有孚而不能终，其所萃者必失其序而自乱。所幸尚非大患——但能以迫切至极之诚，号呼而求合于九四，九四必欣然来应。两心既接，则“一握为笑”：不过举手之间，向之号咷已化为欢笑，所聚者恰是其分所当然。故戒之曰“勿恤”，言无须忧惧，放胆而前，前则无咎。","Y1.X":"象曰：乃乱乃萃，其志乱也。","Y1.XN":"初六夹于两阳之间，去就两难，故所聚乱而无序。推其病根，不在外而在内：志先摇，思先棼，然后行止随之而失据。","Y2.T":"六二，引吉，无咎。孚乃利用禴。","Y2.N":"引者，援引之谓；孚者，诚信之谓；禴者，祭之简薄者也。二以柔爻处柔位，在内卦之中，其位既正；所应者则九五也。五为中正之君，二为中正之臣，以分以理，皆当归于五。然其事必待五之见招，不可由二之自进；因招而来，与自媒而合，其间邪正判然，唯前者吉且无咎。所谓“孚乃利用禴”，即就此立喻：君臣之合以诚为主，犹之祭享，心存诚敬则仪可略、物可薄，丰俭非所论。","Y2.X":"象曰：引吉无咎，中未变也。","Y2.XN":"六二居中履正，其所守者中道，不因外物而迁。正惟守之固，故不肯自进以求合，必待上之援引；引而后聚，聚而仍不失其中，此象辞所谓“中未变”。","Y3.T":"六三，萃如嗟如，无攸利，往无咎，小吝。","Y3.N":"萃之世以见大人为利，大人即九五。六三之于九五，应既无之，比亦不接，欲求合而路绝，宜其发为嗟叹，举事皆无所利。然穷则变，其涂犹有可出者：六三与九四相比，舍五而就四，四必纳之，因而得无咎。顾此终是舍正应而即邻比，所聚未必出于当然，故犹有小吝。","Y3.X":"象曰：往无咎，上巽也。","Y3.XN":"下体三阴，初与二皆上合于阳，独六三不中不正，上下无所系属，故在萃之时最为失据。然萃者时也，时既当聚，则终不容孤处。居下者既有向进之志，处上者亦不拒其来，两情相纳，故往必有受，虽小吝而获无咎。《象》言“上巽”，上指九四；四居兑说之体，能顺下而受之，故以巽许之。","Y4.T":"九四，大吉，无咎。","Y4.N":"九四之辞，不曰无咎而曰“大吉，无咎”，语势甚峻：非大吉不足以免咎也。萃之比于比卦，其形略似而实不同。比唯九五一阳，五阴共宗之；萃则二阳并立，四阴分系于九五、九四。然五居尊位，四则臣也。以臣位而系众心，下体诸阴顾恋于己，在势为逼，在理为嫌，最易召祸。故其所求者不在小善，必周遍而无遗憾，纤悉皆当于理，至善至美而后可，此之谓大吉。益之初九，处卑而寄重，亦必元吉然后无咎，其例可参。","Y4.X":"象曰：大吉无咎，位不当也。","Y4.XN":"同一无咎，而九四必待大吉，何其责之深也？曰：以其位不当耳。《易》中凡言位不当，就字面说只是爻位失当，就实义说，多是借爻位之失当，点出所处时势之不安。此爻之不当，谓以阳刚之体逼近君上，处非其据而系众望，故危。","Y5.T":"九五，萃有位，无咎，匪孚。元永贞，悔亡。","Y5.N":"九四所患者无其位，九五所患者则在其德。九五为一卦之主，处萃之世，居尊临下，位非不足，所难者德之能称其位与否。有位而无德，则天下之人疑而不附、慢而不服，是之谓“匪孚”。其为状也，若众心私相告语：自其位言，彼固将合我；自其德言，彼实无合我之意。君而见疑于天下，悔必随之。挽之之术，惟在反求诸己，进德不已，能“元永贞”而后悔可亡。元之为训，兼善与长二义，君德之首也；益以恒久贞固，三者具而君道始立。","Y5.X":"象曰：萃有位，志未光也。","Y5.XN":"光者，广也，大也，无所不覆之谓。九五虽有其位，而德未足以副之，众心因而不孚；其志之在天下者，遂滞而不畅，仅及一方，未能充塞而光大。","Y6.T":"上六，赍咨涕洟，无咎。","Y6.N":"赍咨者，嗟叹之声；涕洟者，泪之出于目与鼻者也。上六何以致此？以其居一卦之终，当聚极将散之际，欲合而无从，故悲形于声容。其境略如放逐之臣、摈弃之子，远离于君父，亲昵无由自通；胸中蓄怨艾，而向慕之情又勃勃不能已，是以叹息随之、泣涕随之，皆出于自然而非勉强。然其求合之志终不摇夺，究亦可以得聚，故许以无咎。","Y6.X":"象曰：赍咨涕洟，未安上也。","Y6.XN":"上者，外也。放臣屏子，身既屏于外矣，而心未尝一日安于外，故咨嗟涕泣，哓哓不已。其向君父而求合之念，盖无时或息。","Z":"萃与比相类而不同，宜先辨之。比之卦，内坤外坎，五阴而一阳，阳居尊位；萃则内坤外兑，二阳并峙，四阴分系于两阳。两卦皆以九五为主，此其所同。然比之五阴专奉一阳，其势顺；萃之四阴两属，其情分，故其义较比为繁。就四阴言，所当审者如何得合于五；就二阳言，所当审者如何不失众阴之心。\n九四以臣位而收众望，位不称其势，故必大吉而后无咎。九五刚阳中正，履尊而聚天下，于位无歉，然徒恃其位则未足，其究视德之有无而已。即此观之，萃卦政治之意甚浓。其所言聚，非漫然无所择也：不取上下之苟合，不取朋党之私附，所尚者下之于上、臣民之于君上，而以王公大人为之枢。合于此则为正聚，违于此则为邪聚。卦辞并举“王假有庙”“利见大人”，《彖传》申之曰“利见大人，聚以正也”，义正在此。\n萃又有一异乎他卦者：六爻不论有应无应、当位失位，概系以无咎。此非苟然。物以类相从，群以气相别，人之与物，情性苟同，则不待招而自合。当其或聚或散之际，真情最易见露，此即所谓萃也。故在萃之时，或号或笑，或嗟或咨，或涕或洟，欣戚万端，皆真情之发，无假饰于外，是以六爻皆得无咎。萃之重聚如此，与老庄之贵独、尚孤者，取径适相背驰。《周易》之异于老庄，即此一端亦可见矣。"}},"46":{"id":"46","cnNum":"四六","name":"升","pinyin":"shēng","fullName":"地风升","shortFullName":"地风升","upper":"坤","lower":"巽","upperNature":"地","lowerNature":"风","lines":[0,1,1,0,0,0],"yaoLabels":["初六","九二","九三","六四","六五","上六"],"blocks":{"P":"《序卦传》以萃为聚，谓物聚则上，上者谓之升，故升次乎萃。夫丛集则日厚，厚则日高，高则势不能止而趋于上，此其相承之序也。名卦曰升，取进趋向上之义。以体言之，下体为巽，上体为坤；巽于物为木，坤于物为地。木藏土中，萌蘖之机自不容已，终必破土而日增，升之象于是乎在。","G":"升，元亨，用见大人，勿恤，南征吉。","G.N":"六十四卦之卦辞，专称“元亨”而更无他语者，惟大有与鼎；称“元亨”而兼有他辞、却不着戒辞者，惟升。换言之，通《易》之卦，言元亨而不缀条件、不加限隔者，仅此三卦，其于元亨特加凸显，余卦莫能比焉。若论形迹相近，比之于大有、井之于鼎，各成一组；然比、井所系者，寻常百姓之事，大有与鼎所系者，则在养贤、尚贤。渐与升亦然：同为上进，渐为贤者之渐，升为贤者之升。渐不称元亨而升独称之，其故安在？盖渐者，贤者有所待而后进；升者，贤者适逢其时，前路无梗，直起而登。此其所由异也。至若“用见大人，勿恤，南征吉”，则谓当升之会，才具既成，德业已熟，犹必出而见大人，藉王公圣贤之力以相援引；志之得遂与否可无虑，径向前方行去而已。南征者，前行之谓；前行则吉。","T":"彖曰：柔以时升。巽而顺，刚中而应，是以大亨。用见大人勿恤，有庆也。南征吉，志行也。","T.N":"“柔以时升”四字，乃释卦名者。升者升也，然升有辨焉：其端发于初六，初六居下体巽之下，一阴自此而生，由是节节上行，以至于极。譬之于木，根柢抽芽，渐长渐茂，终成枝条畅达之状。此升有二特：其一，柔之升而非刚之升；其二，因时以升而非躁急而进。然则所云柔者谁指？初六而已；六四、六五不足以当之，上体之坤亦不足以当之。\n“巽而顺，刚中而应，是以大亨”，则释卦辞者也。此处“大亨”当读为“元亨”。凡元亨之系于卦辞，必与卦名相为表里；卦既名曰升，则元亨之义已寓其中。《彖传》更就卦德、卦体两端推寻底蕴，而所推者仍不出卦名之外。此二语者，兼释卦名与卦辞。试以无妄比观：两卦位适相倾，无妄之辞曰“动而健，刚中而应”，此卦则曰“巽而顺，刚中而应”。无妄之体，下卦主动，上卦主健，应之者六二，刚中者九五也；其动也因乎自然，其健也准乎法度，故名无妄，而元亨系焉。此卦则上顺而下巽，刚中者九二，应之者六五；巽以入之，顺以行之，其升也以时，故亦元亨。\n“用见大人勿恤，有庆也”——所谓有庆，即今语之好事。盖既见大人，则其升可必，无复疑虞。在一己，进路既通而无梗，固为好事；推之天下，亦未尝非好事。事之利己而兼利天下者，古人乃以有庆称之。\n“南征吉，志行也”——人之所向者为南，故南征犹言前进。既进不已，则平素欲升之志得伸，而功亦就。","X":"象曰：地中生木，升。君子以顺德，积小以高大。","X.N":"《大象》取地中生木为升，其旨可绎焉。木之在土，自纤细之萌至蔽日之株，中间非一朝夕之力，乃日累月积、从容渐致之过程。当此之际，躁则揠，逆则折，助长则害，惟顺其理、因其时而后可。君子取此象以施于修己与临政：一念必谨，一事必谨，一日必谨。德之行也、政之绩也，皆由小以积之，而后成其高大；若冀一朝而名成事立，遂弃小善而不为，则终无成矣。","Y1.T":"初六，允升，大吉。","Y1.N":"允者，信也。巽之取象为木，初六主巽而居下，木之根柢似之。根在土中，藉地气水泉之润，遂向上长养，终成合抱，此无可疑者也。卦之得名为升，其机全在下体之巽：使有地无木，尚何所凭而升？巽之得名为巽，其机全在初六：使有木无根，犹得谓之木乎？初六之要如此。彖传言“柔以时升”，其所指之柔，正此爻也；六爻之中惟此得大吉，亦以此故。与升相反对者无妄，其例可参：无妄彖传云“刚自外来而为主于内”，所云主者，亦谓初爻；初爻所系甚重，故无妄六爻亦独初九称吉。","Y1.X":"象曰：允升大吉，上合志也。","Y1.XN":"爻辞之“上”，谓上体之三阴。初六在下，以柔上进，其志与上体三阴相同：己欲升，彼三阴亦欲升。众志既合，故其升也为同志所信从而乐助，此“允升大吉”之所以然。","Y2.T":"九二，孚，乃利用禴，无咎。","Y2.N":"孚者，诚信之谓。此爻之辞，与萃卦六二相类。萃以中虚而孚，所应者九五；此以中实而孚，所应者六五。一虚一实，而孚于上则无别。求萃者萃六二，求升者此爻；以柔应刚者萃，以刚应柔者此。位有不同，至诚相感则一，故两卦《彖传》并称“刚中而应”。“孚乃利用禴”，此中孚字不可轻看：有孚则禴为可用，无孚则禴不足恃。禴者，祭之简质无文者也。所谓利用禴，取譬于阳刚之臣而事柔弱之君：惟贯以精诚，去其文饰，咎乃可免。升之时义，柔者为优；九二独以阳刚免咎，所恃者中耳。是故初六之吉由柔，九二之无咎由中。","Y2.X":"象曰：九二之孚，有喜也。","Y2.XN":"“有庆”为好事，“有喜”亦为好事，而所指微有分别。有庆者，己受其福，兼推及于人、及于天下，所被者广；有喜者，仅系于一身，不涉他人。所谓喜，就事之本身言之：其事本善，为之而无所损、无所碍，甚且更生他利，是之谓喜。九二以至诚求升于上，处升之时，此为臣道之最善者；不惟免咎而已，又得行其刚中之守，自将其事理治妥帖。故曰有喜。","Y3.T":"九三，升虚邑。","Y3.N":"九三“升虚邑”，其辞既无凶咎，亦无吉利，是本身兼有善与未善两面。何谓虚邑？凡阳实阴虚，九三以刚才乘时上进，所临者坤，坤三爻皆虚，故有入虚邑之譬。邑非真无人也，取其勇往无前、旁无所顾之意而已。当升之世，进之虽锐，凶咎犹未及焉。然九三刚爻而居刚位，刚之过者也，于升卦贵柔之旨不甚相入：就中德言，九二、六五有之而此无；就柔德言，初六、六四有之而此亦无。诸爻皆有吉与无咎之辞，此爻则阙如。","Y3.X":"象曰：升虚邑，无所疑也。","Y3.XN":"九三之刚，失于太过；一意向前，视险若无，故其动也决而不疑。至于吉凶所归，未可预定，视其自力何如耳。","Y4.T":"六四，王用亨于岐山，吉，无咎。","Y4.N":"爻辞之“亨”，读当为“享”，非亨通之亨。遍检《易》文，言王用享者凡三：随上六享于西山，益六二享于帝，本爻则享于岐山。三处句法大抵相若，其义皆谓王用如此爻之人，以荐于上帝山川，非以此爻当王也。五为君位，凡称王者例归焉，此爻之王正其例。六四之于六五，承之而已；地逼势亲，为臣之最难者也。所可幸者，六四阴爻居阴位，才性柔顺：君欲升则顺之于上，民欲进则顺之于下，而己则安处其分而不越，颇似三分天下而周有其二、犹然服事于殷之周文王。文王以诸侯之位而仍求上进，其所用心、所行事，迥出恒流，最堪取法。使六四而更求上，则将以身代六五矣，非如文王之所为不可。然为之甚难，故必“王用亨于岐山”而后吉，吉而后无咎。其云何？王谓六五；六五使六四承祭于岐山，是六四之驯顺、诚敬、精洁已至其极，六五信之无疑，乃以山川之祀托之。","Y4.X":"象曰：王用亨于岐山，顺事也。","Y4.XN":"顺事者谁？六四也；所顺事者，六五也。其顺事之实，如文王已得天下之半而犹谨守臣节，故系之以“王用亨于岐山”。","Y5.T":"六五，贞吉，升阶。","Y5.N":"“升阶”者，拾级而登，越阶砌而至堂，其地已高矣。位既高矣，尊位是居，其下又有九二刚中为之应，吉若可操券而致；然有一节不可废者，贞是也。此贞字不作正解，而当训为固。六五体阴而质柔，非固守不可。脱也守之不固，中怀两端，待贤而二三其信：朝方任之，暮已疑之，信之不笃，用之不经，则吉终不可得。","Y5.X":"象曰：贞吉升阶，大得志也。","Y5.XN":"升自初六而起，至六五而极。故初六《象》曰“上合志”，六五《象》曰“大得志”，一始一终，其辞相应。","Y6.T":"上六，冥升，利于不息之贞。","Y6.N":"豫之上六曰冥豫，此爻曰冥升，其义一也。何谓冥？极而失其明之谓。豫乐既极，则昏然不知所止，故系以冥豫；升进既极，亦昏然不知所止，故系以冥升。两辞皆非美称。晋之上九曰晋其角，指意亦复相类：进而忘返，惟知有进，不知有退者也。其所以异者，晋上九阳也，阳主刚，故象之于角；豫、升之上六阴也，阴主晦，故象之于冥。至“利于不息之贞”，则上六犹有一节可取：能自反自克，不以盈满自居，故虽冥于升，凶咎不至。","Y6.X":"象曰：冥升在上，消不富也。","Y6.XN":"“消不富”者，损之使不至于盈也。上六冥升而在上位，势位满盈，所当自削，力去其厚实，而不处其盛。","Z":"《易》中言进者三：晋、升、渐是已，而其进各有浅深。晋为明出地上，若日之东升，光明盛长而向上，进之最善者也。升则如木自萌芽以至成材，依时次第而长，前无所阻，其义虽不及晋，抑亦可谓善矣。渐则木已生而日高，然其中犹有所待，故不及升，视晋尤远。\n升之象为地中生木，故其所升者，柔之升而非刚之升。柔之为升，其道在因时。时之未至则不先，时之既至则不后；其进也纾徐而有节，因势而推行，卦辞许以元吉，正为此耳。六爻之辞亦皆尽善，无凶咎悔吝之文，求之六十四卦中，盖不多觏。合六爻观之：贞固者六五，合志者初六，喜者九二，不疑者九三，以顺事自处者六四；上六居末，虽冥于升而犹知自消。统而论之，升卦之象，上下相谐。以政治言之，若同朝共事而一心一德，已进者不抑其下，未进者不陵其上，猜嫌之意无自而生。"}},"47":{"id":"47","cnNum":"四七","name":"困","pinyin":"kùn","fullName":"泽水困","shortFullName":"泽水困","upper":"兑","lower":"坎","upperNature":"泽","lowerNature":"水","lines":[0,1,0,1,1,0],"yaoLabels":["初六","九二","六三","九四","九五","上六"],"blocks":{"P":"升之后为困，其序具于《序卦》。盖自下而上者谓之升，攀升必耗其力；用力不已而不知返，气竭力殚，困乃乘之。困者，疲敝困顿之名也。\n此卦内坎外兑，而系名以困，何也？泽之与水相须，水在上则泽盈，今反居其下，是泽已空枯也。应有而竟无，困乏之象著矣。更以爻位求之：卦中阴爻尽处阳爻之上，阳爻反居阴爻之下；最上之阴独踞两阳之巅，九二之阳则被夹于二阴之间。阳刚皆为阴柔所掩；以人言之，则君子见蔽于小人，正受困之际也。","G":"困，亨。贞大人吉，无咎。有言不信。","G.N":"困者，穷厄委顿、道尽力竭之谓，与亨本相对而相反。卦辞乃以亨系于困，非谓凡遭困者皆可通也，其中自有条件。处穷厄之地，最易激发人之志气，砥砺其坚忍，逼之奋起以求通；是困之势，反能驱人转困为亨。然“贞大人吉，无咎”一语限定甚严：必守正之大人君子，方能化困为亨而获吉无咎，匹夫常人不足与于此。“有言不信”者，方其在困，虽有所陈说而人莫之听；若再三自白，其效往往更劣。","T":"彖曰：困，刚揜也。险以说，困而不失其所亨，其唯君子乎。贞大人吉，以刚中也。有言不信，尚口乃穷也。","T.N":"“困，刚揜也”，此句正为卦名下一解。就卦画而言，困之所以为困，全在阳被阴掩：兑体二阴在上，坎体二阳在下；上六一阴压于九四、九五之顶，九二一阳夹在初六、六三之间。刚受制于柔，君子见抑于小人，名之曰困，其实在此。\n自“险以说”以下，转而以卦德申卦辞之义，所释者正是那个亨字。亨与困本相反而相拒，卦辞却连言“困亨”，即彖传所谓“困而不失其所亨”——身虽在困，道未尝不通。其故安在？内坎为险，外兑为说，合而成卦，是“险以说”也。先历乎险，终归于说；困于始者亨于终，理有固然。然此岂人人可企？处困而亨，唯君子能之；小人当此，则困而已矣。君子于险中自得，小人遇险则溃。孔子有“固穷”与“穷斯滥”之辨，所指即此。\n“贞大人吉，以刚中也”。刚中者，九二、九五是也：二爻皆阳，而分居上下两体之中，故曰刚中。《易》于刚中最所重，盖刚以表其人，中以表其守——君子遭困，尤贵守正不移。卦既具此象，卦辞乃系以“贞大人吉无咎”。“有言不信，尚口乃穷也”，言当困厄，辞气虽工而听者不省；济困之具在事不在言。若舍事而专恃口舌，是“尚口”也，尚口则穷，如行入穷巷，更无出路。","X":"象曰：泽无水，困。君子以致命遂志。","X.N":"彖传释卦名，取“刚揜”之义；大象则别下一语，曰“泽无水”。同一困也，而所执之端各异，足见大象立论自成一格。此非独困卦为然，六十四卦莫不如此。大象与卦辞、彖传，其归趣本无二致；然着眼之处，往往相去甚远。谓六十四卦大象别自为一体系，亦无不可。\n泽本含水，今乃无水，则困之象也。人一旦身处此等境地，将何以自处？大象应之曰“君子以致命遂志”：委弃其身而不惜，必使所怀之志得伸。生与道不可两全之际，则舍生以取义，杀身以成仁，断不苟且求活。古人谓帅可夺而志不可夺，其言正为此发。","Y1.T":"初六，臀困于株木，入于幽谷，三岁不觌。","Y1.N":"初六所处，可谓穷矣，几无自拔之望。凡人之动，行者用趾，止者用臀：行则趾居最下，坐则臀居最下，故爻辞取以为象。株木者，无枝叶之枯干也。至于幽谷，则深陷幽暗、地势卑下之处。觌，见也。\n以阴柔之质而居一卦之底，又在坎险之下，己力既不能自振，唯望九四来援而庇之。然九四阳画而处阴位，既不居中，又未得正，本身且为阴所掩，自救不暇，安能济人之困？于是初六之穷，遂无可解：如据枯木之下而坐，上无蔽覆；又如已坠幽谷之中，暗不见天。乃至“三岁不觌”，久久不获一遇其亨通之日。以人事言之，则沉沦于卑暗陋隘之乡，陷者不能起，坐者不能移，终困而已。","Y1.X":"象曰：入于幽谷，幽不明也。","Y1.XN":"初六困于幽谷而莫能自拔，其咎在己之暗昧无识。","Y2.T":"九二，困于酒食，朱绂方来，利用亨祀，征凶，无咎。","Y2.N":"困有二：身之困与道之困。小人困于口体，衣食不给则困，所争者不过生存；君子困于志行，道不得行、志不得伸，乃谓之困。初六所遭，身困也。卦中三阳皆以君子当之，其困皆道困。九二为阳，故其困属道而不属身，与初六之栖枯木、坠幽谷者，迥不相类。\n酒食，甘旨之谓，有之则生计丰裕可知。绂者蔽膝，施于膝前；朱绂则蔽膝之贵者，唯诸侯与天子之三公得服。“朱绂方来”，是贵位将至之象，可见九二乃位尊权重之臣。既有甘旨可享，又有朱绂可服，在小人视之，亨莫大焉；而在君子，此正所以为困。盖“困于酒食，朱绂方来”者，谓其人虽贵，而实陷于困。其困云何？或平日之主张不见谅于君上，或见挠于异己之党，皆足使之跼蹐难行。\n然则九二将何所措手？其道有二。一曰“利用享祀”：洁粢盛、荐鬼神，冀得上天之鉴而默佑之。古之有位者，未必真有所畏于神，其斋明盛服以承祭祀，不过寄其心于冥漠，使郁结稍舒而已。二曰征则凶：动而有所作为，其祸必随；反之，静守不出，则咎可免。","Y2.X":"象曰：困于酒食，中有庆也。","Y2.XN":"同是受困，而困于酒食者衣食自足，视困于株木者为优。九二处下体之中，中之德具焉，故象言“有庆”。","Y3.T":"六三，困于石，据于蒺藜。入于其宫，不见其妻，凶。","Y3.N":"爻辞之石，谓九四；蒺藜，谓九二。九四以阳刚峙于前，坚如磐石，六三欲进则为其所阻；九二以阳刚踞于后，锐如刺丛，六三欲退则无所措足。前拒后迫，遂成进退两难之势，此六三之所以困也。\n“入于其宫”，宫即三之本位；“不见其妻”，妻即六之象。人既挫于外，未有不还顾其室者。六三妄动于外而致困，退而归家宜若可安，然归亦不得安，并其配而不见。欲出则无路，欲处则无地，名败身危，死期将至，故断之以凶。合三阴而较之，六三所遭独酷，几无术以拯之。","Y3.X":"象曰：据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。","Y3.XN":"所谓“据于蒺藜”，即六三乘九二之刚也。乘刚于《易》为至危，如坐针毡之上，无一刻得安。小象独举蒺藜而不及于石，盖拈其重者，轻者自可类推。不祥者，凶兆之先见也。“入于其宫，不见其妻”，祸端自此而启，覆家陨身之变，将骈至而无已。","Y4.T":"九四，来徐徐，困于金车，吝，有终。","Y4.N":"九四亦阳刚之才，与九二同为有位之人，故其所遇者道困，非身困也。“来徐徐”，谓其来也舒缓而不迫。案《易》之例，自下趋上曰往，自上趋下曰来。九四与初六本为正应，九四欲藉初六之助以自脱于困，然势不可急，故若有告之者曰：姑徐徐其来。\n“困于金车”，金车者，非编户所得乘，乘之者必贵仕。是以九四之困，与初六之栖枯木、坠幽谷者不同科：彼为小人之身困，此为君子之道困。九四与九五两阳并处，同见掩于上六，是其志未得伸之时，唯有敛藏韬晦，缓以俟之。处此虽不免于吝，然爻辞许其“有终”，则终局犹善。","Y4.X":"象曰：来徐徐，志在下也。虽不当位，有与也。","Y4.XN":"九四居上体，而心之所向实在初六，故非孤立而无助者。以阳画处阴位，于位为不当；不当本非美事，然九四“有与”，适足以补其阙。有与者，有同志相与也。所与为何？九五而已。二爻相比而近，所处既同，利害亦一，故九四赖之而“有终”。","Y5.T":"九五，劓刖，困于赤绂，乃徐有说，利用祭祀。","Y5.N":"读此爻者，先须辨“劓刖”二字。前儒于此聚讼已久。王弼本作劓刖，程颐、朱熹承之，训为割鼻、断足。就字义论，其训自有所据；施于此爻，则扞格而难通，盖刑伤之象与下文徐求脱解之意不相属也。然则《周易》原文果是此二字乎？此不可不考。\n《经典释文》所载，荀氏、王肃两本皆不作劓刖，而别为一字，其注曰“不安貌”；又引郑玄，谓“劓刖当为倪伉”。清儒惠栋之《周易述》，则依音以求字，改作“倪仉”，其训亦为不安。其说以声求之：臲、刖音近可通。《庄子·德充符》称“鲁有兀者王骀”，兀者即断足之人，是刖、兀同谓。合而观之，困卦九五之“劓刖”，正当作“臲卼”。又《尚书·秦誓》之“杌陧”，亦即此二字，特传写小异耳。宋人疏于文字，踵王弼之失，遂以割鼻断足为解；清儒重汉学、精考据，惠栋独能正之，其说为长。\n“乃徐有说”之“说”，旧有悦、说、脱三读，此处当读为脱，取解脱之义。赤绂与九二之朱绂同类，皆蔽膝，而赤绂之等稍杀。“利用祭祀”与九二“利用享祀”，其义一也。\n如此，则九五之义略可窥矣：大体与九二相类。九五虽以阳刚居尊位，然在困卦不取其君象，只作常爻看，故取象同于九二；所异者，位愈高则困愈深。居高位、服赤绂之大人，厄于时势，举世莫之见谅，形格势禁，终日惶惶于不安之地。此外更无他径，只合就“乃徐有说”上用功：守志既坚，赴机不急，以宽闲之岁月，徐易此危局。至于心神所寄，既见困于人，则求通于神，“利用祭祀”，于感格鬼神之际得所凭依。","Y5.X":"象曰：劓刖，志未得也。乃徐有说。以中直也。利用祭祀，受福也。","Y5.XN":"其始也，见掩于阴柔，上下皆无应援，危动不宁，正志不得行之候。及其后“乃徐有说”，乃渐次脱于困。所以能脱者，以其中直也。中直即中正，谓居中而履正。不曰中正而曰中直者，取与下文福字协韵耳。“利用祭祀，受福也”，君子困于人，则祈于神，藉感通之顷以自壮，而受其益。","Y6.T":"上六，困于葛藟，于臲卼。曰动悔有悔，征吉。","Y6.N":"六爻之中，九二、九四、九五皆不系以吉，初六、六三又以阴柔而未能免困，独上六获吉，其故何也？\n自外缘言之：上六为葛藟所缠，居杌陧动摇之地，危而居高，其势已与初六之栖枯木、入幽谷、“三岁不觌”者不同——彼安然不动，此则动而不宁。困至上六，已极其量；数穷则变，困极则通，理势然也。自内志言之：上六当乘此可为之势，奋而求出。\n“动悔有悔”，两悔字义别：前者就境而言，谓困极之时，一举足即生悔，随处随时皆在困中；后者就心而言，谓能自知其艰，动则有悔，而不动之悔更深。悔之愈真，则行之愈决；行而能决，脱于困矣。故爻辞断之曰“征吉”。","Y6.X":"象曰：困于葛藟，未当也。动悔有悔，吉行也。","Y6.XN":"上六见缠于葛藟而未能自变，盖困极则通之理，彼犹未之觉，故所处方为未当。然此特一时之滞耳；苟能“动悔有悔”，奋然自力，出困而吉可必。其所以能吉者，全在能行。若效初六之坐以待困，亦安所得吉乎？","Z":"困之要义，在刚为柔掩。困卦所陈之困，可析为二：编户齐民之困，系于衣食，是身困；大人君子之困，系于政事，是道困。困既为已然之实，则卦之所重，不在困之来，而在处之之术、出之之道，此一卦立言之枢纽也。\n卦辞“困，亨。贞大人吉，无咎”，明以能亨许人，而所许者止于守正之大人。盖困而能亨，非夫人之所能；见役于人者，处此唯有一困而已。此卦立言，本为阳刚者设，其抑扬之意见于辞气。\n三阳爻所以自脱于困者，有两端可味。一曰缓：“来徐徐”“乃徐有说”，皆言阳刚既陷，断不可躁，当优游宽绰，徐为之谋。二曰诚：“利用享祀”“利用祭祀”，若以常情观之，近乎媚神；实则揭出一节要义——受困者不可无精神之支柱。人在世间既不见信于人，则转而求诸幽明；其求诸幽明，非必果信有鬼神，特藉此自明其心，寄其志，以自慰耳。\n又有一端：卦辞“有言不信”，所以戒处困求通者，勿恃口舌，而当致力于行事。然行止有时：时机未至而强动，则九二之“征凶”当之；时机既至而犹疑，则上六之“征吉”当之。\n三阴爻皆非善处困者。初六居最下，坐而受困，既无出困之力，亦无出困之念。六三最凶，前后受制，处出皆穷，纯是死局。上六独吉，则因困极必反，时会适逢其可。凡此三爻皆阴柔，阴柔在此卦为庶民之象；庶民者，孔子所谓“穷斯滥矣”之流，固不能如彖传所云“困而不失其所亨”。尊君子而抑庶民，《易》作者之阶级意识，于此昭然。"}},"48":{"id":"48","cnNum":"四八","name":"井","pinyin":"jǐng","fullName":"水风井","shortFullName":"水风井","upper":"坎","lower":"巽","upperNature":"水","lowerNature":"风","lines":[0,1,1,0,1,0],"yaoLabels":["初六","九二","九三","六四","九五","上六"],"blocks":{"P":"《序卦传》把井安在困卦之后，凭的是一条“反下”之理：升腾之势到了尽头，再无可往，困便由此而起；既困，自然回落，回落即归于下。古人打量万物，觉得最能代表“下”的莫过于井，于是让井承接困卦。这一层推演，说来并不圆融。《序卦传》统论六十四卦的先后，大脉络自有其理；若逐卦坐实，却未必都能咬合。至于井的卦体，下巽上坎：坎取水，巽取木，木又主入。木入于下，水升于上，井的样子就此立住。","G":"井，改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。","G.N":"先释“改邑不改井”。邑者，人烟聚居之地。邑无常居，虽安土重迁，而迁徙有时；井则不然，既凿之后，定于一所而不可移。邑可改，民可迁，井自若也。“无丧无得”，讲的是井泉的定：汲之不加损，置之不加益，损益皆无与于井。次释“往来”，谓路上行人，来者来、往者往，络绎不断；“井井”两字须分开读，上一字用作动词，下一字方是名目。合在一处，无非说这些行脚之人，都在这一口井上取水。井是公器，非一人所私有。以上三句，勾勒的正是井的品性：前两句说它经久不改，末一句说它施与得普遍，没有遗漏。\n“汔至亦未繘井，羸其瓶，凶”。汔是几乎、将及的意思，繘则专指绠——垂入井中、系着罐子往上提的那根绳索，羸是败坏，瓶是陶土烧成的汲器。绳系着罐子放下去，水眼看要提上来了，罐子偏偏在这时碎了，水终究没上来。事到将成而败，这个凶，还有什么可疑？","T":"彖曰：巽乎水而上水，井。井养而不穷也，改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。","T.N":"“巽乎水而上水，井”——巽在此作“入”解。器入水中，再把水提上来，井的形制便是如此，卦名即定于此。“井养而不穷也”，点出井之所以为井，全在养人：水不加多，汲不见少，来者各满其欲而去，供养没有尽时。\n“改邑不改井，乃以刚中也”以下数语，是给卦辞作注。卦辞中“无丧无得”“往来井井”两层，与“改邑不改井”本相通贯，故《彖》举其一而略其余；虽略，已包在其中。三句归趣相同，都在说井能持久。持久非凭空而来：二爻、五爻同以阳刚处中位，刚健居中之德备于卦，恒久之效由此生出。\n井的本事在于把水送上来。汲者已近泉眼，半途失手，水终于没上来——这与压根不曾垂绳入井并无分别，同属无功，井也失掉井的职分。至于失手之故、致凶之由，只在陶瓶破裂一端，与水无关。","X":"象曰：木上有水，井。君子以劳民劝相。","X.N":"井之体，巽木在下，坎水在上。水本伏于井底，而木能引之使出，以供人酌饮，是水有上行之象焉。君子观此，知水以向上为功，因推其意以施于政：劳者，抚而养之；相者，劝而使之互助。养民之政行，则如井之养人不穷矣。","Y1.T":"初六，井泥不食，旧井无禽。","Y1.N":"初六阴柔而处最下，上无应与之爻，无引之使上者，故无上水之象。夫井以待汲为用，今乃无水上出，何也？以其水无人取用。人之所以不取，则以井底泥滓积久不淘，水浊而不可食。既不任食，日复一日，遂沦为空废之枯井。枯井既无人来汲，水亦不复上涌，并鸟兽亦不至矣。","Y1.X":"象曰：井泥不食，下也。旧井无禽，时舍也。","Y1.XN":"取象于泥，是初六的处境。此爻何以落到无人取用、形同虚设的地步？只缘它压在全卦最底层，离泉脉最远，所谓“下也”，说的就是这一层。人不来汲，禽鸟自然也不肯落下，一口井便荒成了废井。爻辞说“旧井无禽”，讲的是一时之间，人与禽都把它撇在一边，谁也不再看顾。","Y2.T":"九二，井谷射鲋，瓮敝漏。","Y2.N":"井以出水为事。水能上出，是为有用；不出，或欲出而受阻，便成无用。所以通观井卦，位愈上者愈可许，处下者往往不足观。\n九二所长在才，所短在势。才者何？阳刚是也。势者何？身居下体，上无正应，近而相邻者止一初六之阴，既乏外援，又受牵掣，一腔力量便憋在井下，欲上而不得。爻辞“井谷射鲋，瓮敝漏”，两句话写的都是这一层窘迫。\n所谓井谷，说的是井底盘桓的那处泉眼，水打这儿冒出来。既有泉眼可冒，便知它不是一口淤死的泥井；只是冒得不多，勉强够喂井底的鲋鱼。射，就是注。鲋究系何物，旧注有二说，鲫鱼一说，蛤蟆一说，孰是孰非且置勿论，其为井下阴湿所生则无疑。从井这一面看，九二好比谷中之泉，水只往下淌到鲋身上，再不能往上走一步。换到汲者那一面看，九二又像一口破瓮：有人拿瓮来取水，仿佛可以提上来了，无奈瓮身已裂，边提边漏，水仍上不来。两个比喻合看，井水终究升不上去，井也就失掉了井的用处。\n九二资质不弱，原该有济物之功；功竟不成，卡住的地方只有一处——上头没有人接应它。","Y2.X":"象曰：井谷射鲋，无与也。","Y2.XN":"“无与”即无应援之谓。九二为阳，九五亦为阳，两刚相值而不相求，是以无与。井道以水出为功，九二抱阳刚之才，非不可用，徒以处下体而莫为之应，遂止于“井谷射鲋，瓮敝漏”之地。使其有与，则引之而上，井之功可成矣。","Y3.T":"九三，井渫不食，为我心恻，可用汲，王明，并受其福。","Y3.N":"渫，是淘治。井渫不食四字，说的是井已经淘过，淤泥秽物一概清出，水清可饮了，偏偏没人来舀。\n“为我心恻”——这个“我”不是井自道，是旁人为它难受。下文便是难受的由头：水这样清，汲得，也饮得；假使君上是明白人，势必起用九三这样的贤者，一人见用，众人沾惠。九三的底气正在这里：阳爻居阳位，位既得正，心又向着上六，才算得上有用之才。可惜它处在下体的顶端，位分不足以自展，才具空悬而无所施，与那口清水无人来饮，情形正同。","Y3.X":"象曰：井渫不食，行恻也。求王明受福也。","Y3.XN":"《象》意若曰：水既洁矣而不见汲，可惜也。然所谓“行恻”，非九三自恻，乃行路之人皆为之心恻也。行道者何以恻之？以其“求王明”——冀有明主举此人而用之，使斯人受福，且使众人并受其福焉。","Y4.T":"六四，井甃无咎。","Y4.N":"甃者，累砖以治井之谓。井甃，则井已修矣。六四之德有二：以阴居阴，位得其正，一也；体本阴柔，才力不充，二也。正故能守，柔故不能有所建立，合而言之，惟能自修自守，而无及物之功。以井为喻，则如已敝之井重加修葺，虽不能广济，要可不至废坏，故无大功而亦无咎。","Y4.X":"象曰：井甃无咎，修井也。","Y4.XN":"《象》以一“修”字点出“井甃无咎”之本。井既修治，其及物也虽有限，然尚可为用，不至于弃置。惟其仅止于可为用，故所得者免咎而已，未足语于功也。","Y5.T":"九五，井洌寒泉食。","Y5.N":"洌，训甘洁。井泉品第，以寒为贵；寒而且甘且洁，汲上来清冽适口，人人乐饮。井道走到这一步，可谓无可再加。九五之德配得上这幅景象：阳刚之体，处中得正，又高踞尊位，才无所缺，德无所亏。\n同是清泉，九三何以系以“不食”，九五却系以“食”？分别在水的位置：九三在井甃之下，水还在井里，未曾离井，是待汲之泉；九五则已离井而上，是既汲之泉。所以一则不食，一则食。话虽如此，还有一层该问：这般美泉，爻辞为何不下一个“吉”字？须知井以水出为功，功以升到极处为满；九五虽已上出，究竟未到卦顶，水可食而食之之事尚未落到实处，功未圆满，故只言美而不言吉。","Y5.X":"象曰：寒泉之食，中正也。","Y5.XN":"“寒泉之食”是“井洌寒泉食”的省文。九五能当此象，凭的全是德位两全：质属阳刚，位处上卦之中，又得其正。落回井上说，中而且正，则泉脉恒盈，其性自寒，纵有尘滓也无从侵入。落到人上说，刚健中正之人据位而行，所施必及于众。","Y6.T":"上六，井收勿幕，有孚元吉。","Y6.N":"收者，汲而出之；幕者，覆井之具。水既上矣，慎勿以物掩其口而锢之，当使之常开，俾往来者得以恣取。井本众人之井，非一人所得私；卦辞“往来井井”即此意也。“有孚”者，谓其中有信。信者何？泉源不竭，愈汲而不见其损，久置而不见其益，即卦辞“无丧无得”之云。“元吉”者，吉之至善，无可复加。\n井之功在上出，愈上则功愈著。上六处一卦之极，水已出矣，功已成矣，故系以元吉。六十四卦之终，大抵极则变，变则凶吝随之，其吉者鲜；独井与鼎二卦，至上爻而功成业就，故或称元吉，或系大吉。","Y6.X":"象曰：元吉在上，大成也。","Y6.XN":"元吉这一占，寻常卦里轮不到最末一爻，最末一爻也担不起它。井却把元吉安在第六爻上，且安得稳当。何故？井的用处全在把水送出来，送到尽头，事便做完——上爻正站在尽头处，功已告成。","Z":"井卦六爻，阴阳各三：阳取泉为象，阴取井为象。所以九二系“射鲋”，九三系“渫”，九五系“洌”，说的都是泉；初六系“泥”，六四系“甃”，上六系“收”，说的都是井。\n一爻一象，彼此又不雷同。同为井：初六如刚开挖的土井，六四如整葺过的旧井，上六如取水已毕的井。同为泉：九二如泉脉初通，九三如泉已澄澈，九五如泉堪入口。\n若两爻一组来看，六个位次恰好分成三段。初六、九二居下，一泥一谷，尽是埋没不用的废井废泉。九三、六四居中，一渫一甃，是修治将成、行将见用的井，井道到这里算是立住了。九五、上六居上，一洌一收，是已经见用、效益外显的井，井道到这里才算圆满。\n最后一点该留意：六十四卦之中，爻辞与卦辞的关系有疏有密，不可一概而论。井上六说“井收勿幕”，与卦辞“改邑不改井，无丧无得，往来井井”数语处处对得上，井卦显然属于关系紧密的那一类。"}},"49":{"id":"49","cnNum":"四九","name":"革","pinyin":"gé","fullName":"泽火革","shortFullName":"泽火革","upper":"兑","lower":"离","upperNature":"泽","lowerNature":"火","lines":[1,0,1,1,1,0],"yaoLabels":["初九","六二","九三","九四","九五","上六"],"blocks":{"P":"《序卦传》把革卦接在井卦之后，缘由是：井道历久必弊，弊则不容不革。井之为物，穿地及泉而功成，其处一定，历千百年而不徙，所谓“改邑不改井”者是已。惟其一定而久，淤积随之，颓坏随之，非时时淘浚、处处修补不可；淘浚修补，即是革。井后继革，其理不过如此。革之一字，即今语之改革、革命，本卦所蕴，于世用所关甚巨。\n再就卦画看：下体为离，上体为兑，是火居泽中。水火本相为存亡——水胜则火熄，火炽则水枯。今乃纳二者于一卦，使之互争互耗，此即变革之象，卦名因之而立。又看其位：水在上而其性下润，火在下而其性上炎；在上者屈己而下，在下者抗己而上，两相凑泊，亦两相搏击，变革以生。设若上下易位——炎上者反居上，润下者反居下——则两不相谋，各趋一路，其卦便成睽而非革。革与睽之别，只在上下之序。","G":"革，已日乃孚，元亨，利贞，悔亡。","G.N":"“已”当作已经之已，音yǐ，非辰巳之巳。孚者，信也。革者，除旧而更新之谓。除旧更新，其事至难。旧物相沿既久，人已安之若素，习之若常；一旦骤然而易之，则拂其所习，逆其所安，人心必不能猝然领会，更不肯遽然听从。故变革之始，非得人共信不可；而信之立，又非旦夕可致，须积以时日。“已日乃孚”，正谓此也。\n元亨者，大通也。物至于敝坏穷尽，乃有变革之需；变革所求，敝者使新，穷者使通，是以革而可致元亨。贞者，正也。利贞者，谓宜出于正道。盖变革之事最易失据，必循正而行；若逞臆妄为，未有不败者。果能守正不挠，虽历时久、涉险多，终必有成；有成，则悔自消。","T":"彖曰：革，水火相息，二女同居其志不相得，曰革。已日乃孚，革而信之。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成。汤武革命，顺乎天而应乎人，革之时大矣哉。","T.N":"读《彖传》者，宜先识其体裁：释卦名居首，释卦辞继之，末乃孔子自抒所得。开端“革，水火相息，二女同居其志不相得，曰革”，正是释名之笔。革之卦体，下离上兑；泽本水也，火却在其中。水上火下，两相掩抑，两相煎逼，皆以灭彼为快，势不并存，此革之所以名革。\n难者曰：下离上坎，水亦居火上，何为其卦不名革？应之曰：水有动静之别。坎为流水，昼夜不息，火虽烈，无如之何；兑为止水，凝然一泓，居上而火性上炎，适足以蒸之使涸。能息与否，视水之动止而定，与水火之上下无涉。一义也。\n复有一义：离为中女，兑为少女。两女同居一室，年相若而志不相降，各有所向，终不能合；志既相失，相克相息乃其必然。革名之立，此又其一据。\n“已日乃孚，革而信之”以下，讫于“其悔乃亡”，则释卦辞者也。入手先辨“已”字。旧说三读：一作已经之已，一作戊己之己，一作辰巳之巳。三说相持既久，当以读“已”为定。\n“已日”何解？古书有“浃日”，浃者周匝之谓。干支纪日之法，天干十位而谓之日，地支十二位而谓之辰；十干轮转一周适得十日，是为浃日；十二支轮转一周适得十二辰，是为浃辰。二者皆取周而复始。此处“已日”，谓满此一周，其数为十。\n顾此语特取譬耳，非限以十日。所指者，一周期、一历史段落也。革命改革之事，欲人之晓然其故、倾心其事，必待时日渐积，甚且必经整整一期历史而后可，断无旦暮之间遽告竣者。\n“文明以说，大亨以正”二语，取象于离、兑：离主文明，兑主和说。两“以”字之用，各有攸归。前半归重于文明，谓变革之际而不失文理昭著之度，则事无遗理，人无拂情，众心之所以说，端在于此——故文明者乃“说”所由生。后半归重于正，谓所革一出于正，则推行无碍，塞者去而亨者至——故正者乃“亨”所由成。\n彖传行文，凡以“以”字绾合两事者，前后互易而不碍其义。“顺以动”与“动而以顺行”即其一例，语序既更，意则无改。顾两事并列，必有一端为主；孰主孰从，只可于上下文消息中看取，未可豫立成规。\n“革而当，其悔乃亡”，此释“悔亡”之辞也。“悔亡”本自易晓，所当推明者，革卦何以能悔亡耳。卦辞并举“元亨利贞悔亡”：因利贞而元亨，亦因利贞而悔亡。是利贞者，元亨之根，亦悔亡之根也。利贞之为元亨之根，前文“大亨以正”已尽其说；今当更明其为悔亡之根。然若径云“利贞，其悔乃亡”，则用语重复，故变其辞曰“革而当”。当者正也，正者即贞也，是“革而当，其悔乃亡”与“利贞，其悔乃亡”，辞异而指同。革之事至艰，少有不慎即贻后悔；唯所革一归于当，悔乃可免。\n“天地革而四时成。汤武革命，顺乎天而应乎人。革之时大矣哉”，则孔子自道其所得，就革义而推扩之者也。孔子取当世共喻之至显事例——成汤放桀、武王伐纣——以明人间之革：其举也顺天应人，即循客观之律而动，非任一人之意气所能为。革又系乎时：时未至，不可强革；时既至，亦不容不革。\n此段所发，有两端最要。其一，孔子言天，实指自然与自然之律，非谓皇天上帝，非谓鬼神。其言天地变革而寒暑代迁、春秋迭运，已将主宰之义排而去之，据此可知孔子非有神论者。其二，革命之概念，自孔子始发。成汤、武王之举，被许为顺天应人，即合于律、协于时之革命。治《易》而及此，称述其事，见社会历史行至一定之候必生变革、必有革命，其识见之卓，非后世经生所及。","X":"象曰：泽中有火，革。君子以治历明时。","X.N":"卦体泽中有火，水火交息，故名为革；革者，变之谓也。古人于变，最先注目而最易领会的，莫过于四时代谢——寒往暑来，草木荣枯，其迹显然。君子观此，当于历数上用心：推步日月，厘定节气，使民事有所据依，是谓治历明时。所谓治历明时，乃是因天道以授民时，非谓前代之历法当革而去之。","Y1.T":"初九，巩用黄牛之革。","Y1.N":"革非细故，未可率尔。欲举其事，须候至、须位宜、须才称，又须反复筹度而后发，功乃可立，悔乃可免。以此四者责之初九，则无一而备。候者，时也：初九居一卦之始，革犹未至其时。位者，势也：初九处下，无可以革之势。才者，质也：初九阳刚而体属离，离火躁动，非能顺以济革之质。合而观之，初九身值革之世，而实不可以革；其道唯在以中顺自固，谨守而勿失。\n爻辞取象于牛皮，其义可析：巩者，束而固之；黄者，中之色；牛者，顺之物；革者，兽皮之已去毛者。取坚韧之皮自缠自束，如物之被裹，令其不得动——即所谓以中顺之道自守也。\n此语他见，唯遯卦六二。彼处二爻之位，得中而上有正应，然欲退避则势有所不许；此居一卦之底，独立而旁无援助，虽值时当革而分有所不敢。两爻之旨固不同，至其借牛皮以言固守，则归趣一也。","Y1.X":"象曰：巩用黄牛，不可以有为也。","Y1.XN":"“巩用黄牛”，乃“巩用黄牛之革”之省文。爻辞之意，谓以中顺之道，取坚韧之皮自裹自固，令其不得妄动也。小象所以申之者，正见初九当革之最初，不宜有所作为——质言之，即不当革耳。","Y2.T":"六二，已日乃革之，征吉，无咎。","Y2.N":"“已”读如已经之已，无疑义。此爻之“已日”与卦辞之“已日”，同为过程之称、历史段落之称，非确指某一日。\n然两处所居之位不同，故所指亦别。卦辞系于“乃孚”，其日实在革后：变革既行，须积以岁时，人心方渐喻而渐信。爻辞系于“乃革之”，其日实在革前：变革未举，须先有一番酝酿，使时势徐至于熟，至于旧者不革则人不能安其生，然后举事而无所悔。\n六二柔顺而处中得正，又居离体，为文明所寄，上应九五之阳；凡革所需之条件，至是皆备，可以革矣。然犹必待“已日”而后动；动而恰值其候，则所往皆吉，可以无咎，事必有成。","Y2.X":"象曰：已日革之，行有嘉也。","Y2.XN":"历“已日”之久，而旧者之不可不革已灼然共见，则当决然而发，无所迟疑。爻辞系以“征吉无咎”，小象复言“行有嘉”，正谓及时而革，必著嘉美之效。","Y3.T":"九三，征凶，贞厉。革言三就，有孚。","Y3.N":"六二之与九三，其质大异。二爻皆得其位，而六二阴柔处中，九三则重刚而不居中也。重刚者锐于进，不中者失所裁，合之而为躁动之资。\n挟躁动之资而急求有功，其往必凶。然则固守不出，可乎？亦未为得。时既当革，坐视而不为，事机坐失，危厉随之。\n动则凶，守则厉，将何所出？曰：唯“革言三就，有孚”而已。革固当革，然必斟酌至再，俟众心归附而后发。所谓革言，议革之论也；三云者，言其不一而足；就者，成也、合也。积议至于再三，往复商榷而不厌其详，必俟其理无可疑、其事无不可行，又复“有孚”以收众心之属，然后举而革之。","Y3.X":"象曰：革言三就，又何之矣。","Y3.XN":"议革之言既已再三而成，虑之至审，处之至当，尚何所适哉？无所之也，循革而行斯可矣。","Y4.T":"九四，悔亡，有孚改命，吉。","Y4.N":"下体三爻，皆处当革未革、欲革难革之会，故其为辞一以审重为主：务使变革之举发之有序，动而必克。三爻并明著一“革”字，正见成否未定，尚待人事。及入上体，九四则革道已就，辞中不复著“革”，唯曰“悔亡，有孚改命，吉”。革既成，悔既亡，孚既立，人皆喻之于心而厌足。\n“改命”云者，即后世的革命。《左传》宣公三年载楚庄王问周鼎之轻重，意在窥周，王孙满不数其罪，只以“周德虽衰，天命未改”八字相折——德可以力衰，命不可以力求，是劝其息心也。历数在旧则谓之未改，历数归新则谓之已改。可知改命所指，正是易姓受命、革故鼎新之事。\n然则天命果何物？非皇天上帝之诰命也。孟子有言：“莫之为而为者，天也；莫之致而至者，命也。”天命者，自然而然、不假人为之势耳。其改与不改，改之迟速，一循客观之数，非人之私愿所能推挽。王孙满之对，实以是折之：周室未至倾覆之期，虽问其鼎而不可得。\n古代改命，莫著于周之代殷，亦莫习于人耳。其事盖分为二：武王伐纣，剪殷而立周，取天下而代之，一也；周室既建，周公更定典章，以周礼代殷礼，二也。政权易主，制度易辙，朝代易姓，三者具而改命之实乃全。故改命者，即《彖传》所谓革命也。\n更即爻象求之。九四阳处阴位，于分宜有悔。然其才阳刚，足任革之事；其位过中，适际水火之交，正革之时；刚柔相济，不偏不亢，又得革之用。具此数美，则所革必当，悔虽宜有而终归无有，故曰“悔亡”。","Y4.X":"象曰：改命之吉，信志也。","Y4.XN":"信志者，即“有孚”之谓。小象言“信志”，盖谓革之要不在势位而在孚信：上下一心，众志共向，则改命之举可得吉。","Y5.T":"九五，大人虎变，未占有孚。","Y5.N":"九五以阳刚之质，处至尊之位，而宅中履正，是大人也。革之主体，属之大人。以大人之道而行革，其顺乎天、应乎人，宜矣；其至当而至美，亦宜矣。\n然大人之革，尤有一特异之点：其变谓之“虎变”。盖大人之变，文明外著，义理昭然，无可疑之迹，无可议之私，天下之人共见共闻，知其出于天理之公而非一人之利，故不待卜筮而信之已笃。何以取譬于虎？虎与龙皆有大人之象，一也；大人之变，文理彰明，望而知之，如虎毛之采蔚然在目，二也。","Y5.X":"象曰：大人虎变，其文炳也。","Y5.XN":"大人之革既成，于是出令敷政，辞约而事举，无烦碎之弊，亦如虎文之疏朗，大而分明。","Y6.T":"上六，君子豹变，小人革面，征凶，居贞吉。","Y6.N":"上六之于九五，一卦之终与一卦之极，相去一间而所值迥殊。爻辞于五称大人，于上称君子，同此一革，而所系之名已别。虎变之与豹变亦然：前者属开创，后者属守文——创制者其功赫然，守成者其力隐然。时既移，事与之俱移，象亦随之而变。\n以周室一代征之：文王、武王除暴吊民，开基定鼎，规摹宏远，义理昭著，如虎毛之采彪炳夺目，此大人之虎变也；成王、康王承其统绪，守其成法，涵养光大，使前业益彰，如豹毛之文缜密有章，此君子之豹变也。君子既属有位之人，则所谓小人者，其庶人百姓之谓乎。庶人处受治之地，不预文教，于变革之故未能通晓，往往面从而心不服——“革面”是也。面革者，外貌翕然称善，中情未必有得，更遑论悦怿而诚服。\n至爻辞所云“征凶，居贞吉”，当就时位求之。革道既成，动则生扰，静则得安；居而不出，守而不失，吉乃在是。天下之事，当其未革，急在革；机候既熟，则征为吉；革道既成，所急者不在革而在守，第一义便是“居贞”以固成业。\n九三、上六并系“征凶”，而三系“贞厉”、上系“贞吉”：一守而危，一守而安，其故安在？曰：时不同也。九三在革之先，“征凶”者，戒其备未具而不可妄动；“贞厉”者，又戒其时已可革而不可终不动。上六在革之后，“征凶”者，戒其不可复言革也——革而不已，日求变易，祸必随之；“居贞吉”者，大业已定，要在安而守之，故守正则吉。","Y6.X":"象曰：君子豹变，其文蔚也。（原书脱此条，据通行本补）","Y6.XN":"此爻小象，原书付之阙如，当是传写脱漏。今据通行本补“君子豹变，其文蔚也”一条，其义可与九五“其文炳也”对看：创制之时，功业昭灼，故曰炳；守成之日，润色而已，故曰蔚。蔚者，文理深密之谓。","Z":"革卦通篇所论，革命而已。卦辞“革，已日乃孚，元亨，利贞，悔亡”，一面揭示胜利之前途，一面胪列致胜之条件。“元亨”与“悔亡”，谓其功必成也。\n然成之有道，其道三：一曰“乃孚”——革既起，当勉力以收人心之信；二曰“已日”——信之立非旦夕可几，必经相当岁月，躁急者败；三曰“利贞”——举事不可违正，唯不失正，乃能“乃孚”，乃能“悔亡”。三者皆不可缺，而“利贞”尤为枢纽——正道不立，则信不可久，悔亦终不可亡。\n六爻之辞，与大义相承，而剖析加详：其言革也，有先后之序，有难易之等。下体三爻，皆言革命以前：初九之“巩用黄牛之革”，明其时未至、具未充，一举一动皆不可率；六二之“已日乃革”，则内外之具已集，时为可革，顾犹不可操切，须俟其候之自熟；九三之“革言三就”，议之者众，虑之者周，然后举事而无悔。上体三爻，则言革命以后：九四“有孚改命”，革道已就；九五“大人虎变”，当创业之时，规摹闳阔，天下共见其昭昭；上六“君子豹变”，当守文之日，不事声色，而条理自密。由虎而豹，天下之势为之一变，革之道于是大成。\n孔子《彖传》于卦义阐发最深。“天地革而四时成，汤武革命，顺乎天而应乎人，革之时大矣哉”数语，哲理尤富：既以开掘卦义，亦以自抒所得，非徒为解经设也。彼视四时之迁代为无所主宰之自然运行，而谓人类社会之演进与自然之运行同具客观性，于此未为上帝留一隙之地；又标出“汤武革命”之新义而明其合理，其识见之卓，非后世经生所及。\n至若大人、君子主革命之发动，小人唯“革面”而从之，此论骤看似有可议，实则甚确——史实固如此也。古代之革命与改革，行于治者之内；奴隶未尝自成为独立自觉之阶级，未尝以胜捷之起义倾旧政、废旧制，其于治者所发之斗争，非为政治之附庸，即为行伍之卒伍。此亦足以观古今变革之势矣。"}},"50":{"id":"50","cnNum":"五〇","name":"鼎","pinyin":"dǐng","fullName":"火风鼎","shortFullName":"火风鼎","upper":"离","lower":"巽","upperNature":"火","lowerNature":"风","lines":[0,1,1,1,0,1],"yaoLabels":["初六","九二","九三","九四","六五","上九"],"blocks":{"P":"《序卦》把鼎系在革后，所给的理由是“革物者莫若鼎”，此语其实经不起推敲。两卦本是相耦的：革主铲除，鼎主建置。以除旧归革、布新归鼎，《杂卦》断得最为确当。名之所由立，形与义兼而有之。看六画全形，宛然一具器皿：底下那一画是阴，像器脚；中间三画皆阳，阳以充实为性，实而能受，像器腹；顶上两画，一为耳，一为铉。脚、腹、耳、铉都齐了，鼎的模样便立起来。再看上下两截，上一截当心空虚，下一截托持于下，也还是个鼎。说到义，则是巽居下、离居上，木送进火里，火借木而炽；火既炽，须有器来承受，烹煮之事便从此起。既可烹煮，称它为鼎就有着落。六十四卦拿实在器物做卦名的，仅井与鼎两个。","G":"鼎，元吉亨。","G.N":"“元吉亨”之“吉”，当是衍字，本经止作“元亨”。全《易》卦辞独举元亨、不旁及他辞者，惟大有与此卦，可为例证。元亨者，大通之谓也。然则革之卦辞亦系元亨，其与鼎何以异？曰：革之元亨有戒，鼎之元亨无戒。有戒者，缘事而设条件，条件不副，则元亨不得而成；无戒者，直下承当，更无待于外。其故在二卦所主之事不同：鼎主取新，取新者开创一新局面，规模初立，其势自通；革主去故，去故者拆解一旧格局，千头万绪，牵掣百端，非有“已日乃孚”“利贞”诸般节目相为约束，终难臻于大通。","T":"彖曰：鼎，象也。以木巽火，烹饪也。圣人亨，以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。","T.N":"释名之辞，止“鼎，象也。以木巽火，烹饪也”两句。卦名之鼎，出自真实的鼎器，依其形而立象。语其次第，是先有此器，象乃可仿，卦乃可成，非谓鼎器反过来摹拟卦画。器之鼎，用分两般。一为列于宗庙之重宝，以昭示权柄所归，夏禹所铸九鼎即其类，此种非日常所御，亦不拿来煮食。一为庖厨之常用。古人治牲，先下镬中煮烂，再移置鼎内，调以滋味，火候在底，务令酸咸甘辛各适其分；临食取出，铺在俎上。卦所取象，正是这后一种。巽处下、离处上，风助火势，名为火风之鼎，与鼎底燃薪、鼎中烂肉的情景正合，故卦名曰鼎。\n名既立，又申以“圣人亨，以享上帝，而大亨以养圣贤”两句，指出全卦大义所在。鼎之义与井最近：井以供民食为职，鼎以奉天、待贤为职，而待贤又是落脚处。器之功止于烹煮，烹煮之所成，则上以交神明，下以给人口体。二者之中，事之至大至要者，无非祭天与礼贤。虽然，其礼数却分轻重：祭天之文，下字只用一“享”；礼贤之文，则加一“大”而为“大亨”。朱子尝言，享帝之道以诚为主，用犊足矣——南郊祀天，牲取特性，其牛尚小，角仅如茧如栗，烹之于鼎而荐之，所烹者止此一牲，故祗可称享。养贤则不然，其礼以厚为尚：宴飨宾客车陈太牢而不用特，牛羊豕三牲咸备，牛角盈尺，丰盛已极，故必曰大亨。\n末三句“巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨”，乃疏解卦辞中“元亨”二字的来由。通泰之效，何以独归此卦？试分体求之。下体为巽，巽主顺入；上体为离，离主光明。明体悬于上而其中空虚，在人为双目洞照之状。耳闻之象，卦画里实无之，辞乃连类而称，因目以及耳，属辞之惯例。六五为柔，柔者常居下分，此则上行而践君位，处尊得中，其下又与九二刚阳相配。合而观之：由下言之，是顺理而行、降尊待贤；由上言之，是明睿内充、以柔接刚而不偏不倚。顺而且明，中而且应，大通之致，理有固然。","X":"象曰：木上有火，鼎。君子以正位凝命。","X.N":"鼎之为器，平正厚重，安处而不倾，故有端庄镇重之象。君子取法乎此：内正其位，外凝所受之命。凝者，聚而不散之谓。革、鼎相续，事分两截：前者改命，后者凝命——倾覆旧邦谓之改，奠安新祚谓之凝。荀卿《议兵》篇谓兼并易而坚凝难，所用正是此字。","Y1.T":"初六，鼎颠趾，利出否。得妾以其子，无咎。","Y1.N":"诸爻之例，一爻一象而已；此爻独标二象。“鼎颠趾，利出否”，其正也；“得妾以其子”，则假他事为况，象内藏象。初六压于一卦之底，于器为趾。趾本在下，今

乎中，虽不正亦可以正许之，故曰“正中”。九五亦处中，而五位为君，故德与位兼焉；九二得中而未得位，其德同乎君，其分则臣也。\n庸者，常也。言之常信，行之常谨，谓平居言语必出于实，举动必循乎节。闲者，圈马之栅，所以禁马之逸，亦所以拒兽之入。“闲邪存其诚”，谓外邪不得干于内，而中所固有之诚守而不失。《易》于诚字最所重，以为百行所自出；心苟不诚，则无复可言者矣。唯能闲邪而存诚，故其言可复、其行可法。《易》家以阳为实、阴为虚：实者近诚，故乾之九二言诚；阴虚而后敬心生，是以坤之二爻其辞主敬。诚敬异名，其义相邻：诚者未有不敬，敬者未有不诚。言诚则敬自在其中，言敬则诚亦不能外。\n伐者，自矜其能之谓。虽有益于天下国家，有造于斯民，而不伐其德，不居其功。德博者，其施普，其及远也。化者，教而移之之谓。“德博而化”，谓能化乎物。所谓化，与上言“善世”者无二义；“善世”犹云兼利天下。能化人者必先自化，能善天下者必先善其身。必也出言有恒、制行有常、防邪存诚、济世而不自伐，四者备，然后“德博而化”可言。“君德也”一语，含二义：其一，如上所云自化化人、善身善世之德，本大人之事，非人人所能；其二，九二之身，即具君德之大人也。大人非别有一人，九二虽无君位，而君德固在。","W4":"九三曰君子终日乾乾，夕惕若厉无咎，何谓也？子曰，君子进德修业。忠信所以进德也。修辞立其诚所以居业也。知至至之，可与几也；知终终之，可与存义也。是故居上位而不骄，在下位而不忧，故乾乾因其时而惕，虽危无咎矣。","W4.N":"九三位居下体之上，君德之发见也已久。今既处此危地，其所当事者何事？曰：终日乾乾而不已，勤勉相继而无所间断而已。所勤者何？孔子之对，不外进修德业四字。进德与修业，非二事，乃一事之两面。不可分进德为品行、修业为业务：进德固德，修业亦德。盖进德者，所以治其内；修业者，所以著其外，内治而后外见也。\n“忠信所以进德也”者，进德之基，一出于忠信；能忠信而后德可进。所谓进德，谓此心有向往之志、有日新之机，今日胜于昨日，明日又胜于今日，非徒托之空言，必有其真实者在。忠信云者，实而已矣，真而已矣。譬如播谷：种入于土，宜其日日生长以至于萌芽；然必所播者真是谷种而有生意，否则自始便无从说起。此就内而言也。\n其著于外者，则当“居业”。居者，守而不失之谓，非暂有而旋去也。业亦德也，特德之见于外者耳。合而言之，居业者，守之而不已也。不为俄顷之辍，朝如是，夕亦如是。居业之要，惟在立诚于辞。修辞犹言修其辞令。人之著于外者多端，何以独举辞令？盖言语最足达意，而人顾最易轻之，以为信口而出，无关于得失，故特举以为则。所谓立其诚，即前所谓忠信者是。出言必一字有一字之实，一句有一句之实，不容纤毫假借；口之所宣，即心之所存，表里如一面后已。此之谓立其诚。\n修业、居业，先后异辞，其义岂有二乎？其实一也。业者，德之形于外者。称“修业”者，主于进；称“居业”者，主于守。德之日新，进之说也；德之久存，守之说也。德之进也，贵乎日新；一日不进，则退矣。然进非冥行，必有标的焉，而后趋之，是谓“知至至之”。“知至”者，心知其所欲至之地也；“至之”者，为之而求其至也。此句之要，在一“知”字，知者，自觉之谓。人于未为之先已有此自觉，则去其至也不远矣，故曰“可与几也”。\n居业亦即守业。忠信素存于中，斯其辞可立；而“修辞立其诚”之难，不在始而在久，今日如是，明日亦如是，终身如是，是谓“知终终之”。“知终”者，知其事之当终吾身而行之也；“终之”者，既知之则实行之，不徒知之也。此句之要，在一“行”字，行者，力行之谓。人能终身守此而不变，则“可与存义”矣。存义云者，守义而不失，使“知终终之”之意常存于心也。\n以上皆释“君子终日乾乾夕惕若”。“是故”以下，则释“无咎”。三居内体之终而外体之始，故兼“居上位”与“在下位”之称。处上而惕，故无所骄；处下而惕，故无所忧。乾乾而因乎时，是以处上处下皆得其安，骄与忧两无所施，危地亦可以无咎。","W5":"九四曰或跃在渊无咎，何谓也？子曰，上下无常，非为邪也；进退无恒，非离群也。君子进德修业，欲及时也，故无咎。","W5.N":"三“释”之文，各有所属：“上”与“进”，“跃”之事也；“下”与“退”，“在渊”之事也；“无常”“无恒”，则“或”字之解也。末三语者，又推言其无咎之由也。此爻所争，一“时”字耳。时可上可进，则上焉进焉；时可下可退，则下焉退焉。一随乎时，而不可豫必。君子之当九四，固当如是。然究其归，终以能上能进为是：盖九四进德修业，惟恐后时，故当上即上，当进即进，而无咎也。","W6":"九五曰飞龙在天，利见大人，何谓也？子曰，同声相应，同气相求。水流湿，火就燥，云从龙，风从虎，圣人作而万物睹。本乎天者亲上，本乎地者亲下，则各从其类也。","W6.N":"此七句之纲领，在“圣人作而万物睹”一语。“圣人作”，释“飞龙在天”；“万物睹”，释“利见大人”也。“同声相应，同气相求”六句居其前，皆言同类之感，正以明圣人既作而万物毕睹、天下所以利见之故。九五兼具君德与君位，六爻之中斯为最盛。\n作者，兴起也；物者，人也。圣人兴起于上，众人莫不仰之、就之，受其导而听其教。“本乎天者亲上，本乎地者亲下”，则又推而广之，言两间同类相感之理，其归仍为此二语作解。其在物也，本天者动物，本地者植物：动物之首无不向上，草木之本无不在下。禽兽之头多横生，唯人头真正在上，故其所指，实以人类为言。圣人者，亦人耳；其出也超乎其类，故众心悦而附之。与首上足下之性无以异，皆类之相召也。","W7":"上九曰亢龙有悔，何谓也？子曰，贵而无位，高而无民，贤人在下位而无辅，是以动而有悔也。","W7.N":"“六位时成”，亢亦六龙之一位也；而曰“贵而无位”，何也？上九处一卦之至高，位可谓贵矣，然非君非臣，于政治上初无所居，故虽贵而无位。高而居上，宜为众所归，乃众莫之归焉，是无民也。贤人指九五以下诸爻。贤非无人，且皆在其下，然而不肯为之辅。贵而无位，高而无民，贤人在下而不助，其势至孤，故动则未免于悔。亢龙之时，本不宜动；然人不能终不动，动则悔随之。悔者，过之谓也；有悔，则知其过而又能改，改则事犹可转。此上九之所以终不至于凶也。","W8":"潜龙勿用，下也。","W8.N":"孔子之于乾六爻，玩之也熟，索之也深，《系辞传》所云居则观象、动则玩辞者，正此之谓。然其意不徒自玩而已，盖将示读《易》者以法，使知六十四卦皆当如是读也。《易》之与《书》《诗》异：《书》《诗》之文，一字一句皆有定诂，循训故以求之而可尽；《易》之卦爻辞则不然，其词游移而无定准，或兼数义，或意在不言，训故之术有时而穷，必反复玩索、优游揣摩而后得之。“潜龙勿用，下也”者，谓乾之初爻所以宜勿用，以其居一卦之下，未可以有为也。","W9":"见龙在田，时舍也。","W9.N":"“见龙在田”，龙始出地，其用未畅，以其时之未至，犹有所舍而未遑也。当是时也，有君德而已，未有君位。","W10":"终日乾乾，行事也。","W10.N":"九三终日乾乾，何为乎？曰：行其事也。曰：行其所当行而已。所当行者，修其德业而不敢自息也。","W11":"或跃在渊，自试也。","W11.N":"“试”者，所以释“跃”也。跃可，处渊亦可，然终以能跃为归。时可跃与否，非他人所能代断，必自己尝试而后知之。","W12":"飞龙在天，上治也。","W12.N":"九五德位俱隆，盖有国有天下者之伦也。故其治非一方一隅之治，乃最上至极之治。","W13":"亢龙有悔，穷之灾也。","W13.N":"上九处一卦之末，龙已亢极，积而至穷矣。物之穷者，势不容不变；既变乃通，既通乃久。穷且将化，故必有悔以求其变；不尔，灾至焉，故曰“穷之灾也”。","W14":"乾元用九，天下治也。","W14.N":"此语之“治”，非一室一人一方之治，举天下而皆治之谓也。其为治乱之治，与上“上治”之治有别：九五不过一爻，故曰“上治”，谓以在上之位治在下之人耳；用九而系于乾元，则六爻咸在其中，故曰“天下治”，谓举天下而无不治也。\n上之七条，就人事立说；下之七条，改而以时言。初九之时，阳伏于下而未出，故其辞曰勿用。九二之时，天下向明，故其辞曰在田：气闭则幽，光发则朗；阴以晦敛为体，阳以昭著为用，二爻阳德外见，故有向明之象。九三则与天同运：天行一昼夜而周，未尝止息；九三自朝至夕，乾乾不息，亦未尝止息，故曰偕行。九四则当改革之会：革者，改也。下乾至三而尽，上乾自四而始，两体相接，正在改弦之际，故谓之乾道乃革；此以爻位之次言其取象也。九五之位，德与位称：徒有其位而德不副，则所位者天位而已；德称其位，则天德之谓也。\n上九则时已至极：九三随时而进，故虽危无悔；上九与之俱极，极则穷，故悔。六位之属，两两相配：始在初与四，初潜而四跃；六位之中，惟二与五得中：二处内体，其德为文明；五处外体，其德为天德。二者皆以中而重，非以位之尊卑为轻重也；终者三与上：三能随行，上则同尽。用九而系于乾元，天则于是可见：则者，法也，自然之律也。六爻尽变，乾且为坤，是天道有变非常也。然其变也有节，不逾不过，四时代谢各限其度，冬尽春来，终则有始，莫知所首。四德终始相生，贞穷则元复起，此正天道之节，故其辞曰乃见天则。","W15":"乾元者，始而亨者也。利贞者，性情也。乾始能以美利利天下，不言所利，大矣哉。","W15.N":"此段于卦辞四字重加申说。前文之《文言》多主人事，故元亨利贞析为四德而分言之；至是则由人而返于天，故又合四者而为一说。“乾元”者，举一元以贯四德也。凡此二始，其义皆元也。\n卦辞所谓乾元，果何所指？孔子曰“始而亨者也”。乾元非别有一物，即气之始而亨者耳。亨者，通而长之谓。至所谓利贞，则又非别有一利贞存焉，乃乾元之性情也。何以明之？即以其所能者为验。以时譬之，乾元其犹春乎：春为一岁之始，元亦万物之始。元既为物之所始，则举天下之物而皆利之，无有一物不蒙其泽者。而卦辞“不言所利”，第言利而已，不著其所利之目，正以其所利者至广，包乎两间而无遗；苟指其所利为何物，则范围立隘，而无所不利者反有所限矣。\n“利贞者，性情也”。性情何谓？性情既属之乾元，则所以状之者，健之一字而已。健为其性，其发见则为情。《易》之并言性情，自此始也。性与情，其实一物：自其静者观之谓之性，自其动者观之谓之情。物之生也以春，其始也以元，由是而有动，动极而敛，敛而归于藏，复反于静；贞讫而元又生，静极而动复起。终则有始，循环而不已，生生之机无时或息。若第言性而不言情，则是有贞而无元，有静而无动，止而不行，其去生生不息之健也远矣。","W16":"大哉乾乎，刚健中正，纯粹精也。","W16.N":"乾德之盛，孔子以六字尽之，曰“刚健中正，纯粹精”。六画纯阳，故其德为刚健。“中正”二字，实全《易》之要领，而首发于乾。中者何指？二处内体之半，五处外体之半，皆得中者也；然得中者未必皆正。阳居阳、阴居阴则正，反是则否。乾之九二，阳而居阴，非正也；九五，阳而居阳，正也。故乾卦之中正者，独在九五；九二则中而不正。凡卦必有一爻为之主，乾之主即九五，“刚健中正”四字，正指此爻。\n《易》三百八十四爻，得中者百二十八；百二十八之中，中而且正者六十四，中而不正者亦六十四。此六十四者之内，独乾之九五为刚健中正，盖纯乾之中正也。他卦虽亦有中正，而非纯乾之比。四字虽备，犹不足以尽乾德之妙，故更益以“纯粹精”三字。纯者，二体相重而其气不杂之谓，八纯卦足以当之；粹者，六画之阴阳不杂之谓，乾坤二卦足以当之。乾坤兼纯与粹，他六纯卦则纯矣而未粹。精者，纯粹之至，“纯粹精”云者，纯粹而又纯粹，无可复加之称也。","W17":"六爻发挥，旁通情也。","W17.N":"“六爻发挥”，所发挥者何？即上所云刚健中正、纯粹精者是也。“旁通情”者，谓六爻并作，而乾之义无所不通、无所不尽也。","W18":"时乘六龙，以御天也。云行雨施，天下平也。","W18.N":"六爻之中，唯九五为乾之主；乾之所以为乾者，皆于是乎具。六爻之德，皆统于九五：若潜、若见、若惕、若跃、若飞、若亢，莫非九五之德之散见者也。九五居高位而总六爻，其象为飞龙在天，足以概一卦之全。所谓乘六龙，谓以时为衡，驭此六爻：潜也见也，惕也跃也飞也，一随乎时而无容心焉，此天道自然之节也。龙飞于天，则云行雨施，阴阳和洽，膏泽下被，而天下康宁。乾元利泽之及于天下者，即此可见。","W19":"君子以成德为行，日可见之行也。潜之为言也，隐而未见，行而未成，是以君子弗用也。","W19.N":"前之所释犹有未尽，此复推而广之；此段则释初九也。成德者，德之已成；行者，德之著于动作。君子必其德完满而无亏，然后可以有为、可以有行。德与行非二致：蓄于中而未发者德也，发于外而可见者行也。初九既已成德矣，德既成，则日见诸行事可也；而爻辞乃曰潜龙勿用，戒其勿有为、勿有行，何哉？盖以其时当潜也。潜之为言，隐而未显；隐而未显，则行未有成；行未有成，即德之未成为也。质言之：初九处潜之时，宜隐而不宜见。","W20":"君子学以聚之，问以辨之，宽以居之，仁以行之。易曰，见龙在田，利见大人，君德也。","W20.N":"此段言九二。九二之龙，出地而见于田，位则臣也，德则君也。所谓君德，其目有四：学也，问也，宽也，仁也。学以聚之者，博涉多闻，凡所当学，尽取而无遗。问以辨之者，既聚矣，则质诸闻见更广之人，以正是非、别精粗。宽以居之者，宽谓器量宏阔，从容而不迫；既有学以聚之、问以辨之矣，则所以容之者，非宽不可；宽则众流并入而不相碍。仁以行之者，学聚问辨之后，尤贵有容，终之又在乎行；行之事，一以仁为归。仁于四德为长，而亦兼乎四德，人能乎仁，其余可次第而及。九二之君德，虽曰天资，实由学问而成，非生而具之者；而其用力之地，则全在体仁、行仁而已。","W21":"九三，重刚而不中，上不在天，下不在田，故乾乾因其时而惕，虽危无咎矣。","W21.N":"三之体，刚爻而刚位，两刚相比，重刚之目由此。六位之中，二五得中，三则失之，故系之以重刚而不中。三处三而不处五，是“上不在天”；处三而不处二，是“下不在田”。此二语，究其实仍是言其不中。要之，九三所居，乃危惧之地。虽处不安，而能顺时以自安，朝夕兢惕，故危而不及于咎。","W22":"九四，重刚而不中，上不在天，下不在田，中不在人，故或之。或之者，疑之也，故无咎。","W22.N":"“重”字于九四无取：以阳居阴，非刚之重也，疑是衍文。其“上不在天，下不在田”，与九三同，唯多“中不在人”一语。位有天人地之别：上二爻属天，下二爻属地，中二爻属人。三、四同居人道，而其中又有辨：九三近二而远五，犹不失为人之正位；九四则近五而远二，上邻于天而下远于地，非人所宜居，故曰“中不在人”。合观数语，九四刚而不中，与九三同其类。然三居下位，力欲上进而势阻，故危大而忧深；四则位逼于五，阳气浸盛，上达不难，所难者独在进退两端未能骤决耳，故其忧浅。盖居近君之地，去就可否之间，正宜审而后动；此九四之所以异于九三也，学者当细辨之。“或跃在渊”之“或”，疑辞也。唯能疑，是以无咎。此疑非狐疑之疑，乃两可之际不遽决断、而从容审度之谓。\n“夫大人者”以下，则言九五也。九五是乾之主，乾之德毕萃于此。九五者，有君德而又有君位之大人；大人而具天德，其修养可谓至矣。其心之所存、身之所行，合于天地，合于日月，合于四时，合于鬼神。此语似不可解，而实无足怪：彼固知天命者也，亦从心所欲而不逾矩者也。天命即自然之律。既深知之，又能顺之，则于律之中得其自由，固非异事。其能合者无他，刚健中正、纯粹以精，本与自然之律相通故也。此处之鬼神，非祷祀之鬼神，谓造化之迹，即自然律之效用；吉凶者，成败得失之别名耳。\n自“先天”以下，则又见其动作为天人鬼神所共与。先天而天弗违者，行未有前例之事，创人所未为，而天道不与之相违也；质言之，大人之德与天为一，故其所为，天不能违。后天而奉天时者，事为时势所迫、不容已者，而亦未尝不合于律也。天犹不违，人其违之乎？此所谓人，非一人之身，乃众人之群，即人类社会及其律也。质言之：乾九五之大人，其行事既合于自然之律，亦合于社会之律。","W23":"亢之为言也，知进而不知退，知存而不知亡，知得而不知丧。其唯圣人乎，知进退存亡而不失其正者，其唯圣人乎。","W23.N":"此释上九“亢龙有悔”之“亢”。亢者，过之谓也。凡物之理，皆有两端：进固善，进而过则反为退，有进必有其退；存固善，存而过则反为亡，有存必有其亡；得固善，得而过则反为丧，有得必有其丧。乾至上九，龙而至于亢，此势之所必至、理之所固然，非人力所能避也；然人能知其理，因而顺之，则可以不至于害。顾知之极难：人当亢时，未有不志得意满而忘返者。当进而预虑其退，当存而预虑其亡，当得而预虑其丧；进退存亡之际，权之而各当其分，此唯圣人能之，常人固不逮也。","Z":"《周易》者，有周一代之《易》也。其与殷易之称为《归藏》、又称《坤乾》者，根本之异，在先后之序：殷易坤先而乾后，《周易》则颠倒之而为乾先坤后。此一倒置，实社会意识变迁之表征。\n坤之居首，殷道亲亲之验也；乾之居首，周道尊尊之验也。亲亲者重血胤，故其继统也重母而传弟，足见殷世氏族之制犹盛；尊尊者重名分，故其继统也重父而传子，足见周世阶级之制已固。自亲亲而之尊尊，此历史上一大变革，而《周易》载之；其书之中，最能见此事者，无过乾之居首。故读《易》者，观其首卦，而一代之政教可知已。\n乾为六十四卦之一，六画皆阳，所谓“阳之纯而健之至”者也。其有自身之性质、特点与意义，与他卦同；而其位则与他卦异，于六十四卦中最为特殊，为“阴阳之根本，万物之祖宗”。六十二卦皆自乾坤出，故《系辞传》既以门户喻乾坤，又以衣缊喻乾坤。盖以《易》为效天而作，所载者天行之肖；其所以力言乾坤为诸卦之祖，实由其宇宙观所定。其意以天地为万物所自出，故谓有天地乃有万物，而两间所充塞者莫非物。至天地之所自出，则置而不问。乾坤与诸卦，非并列之数，实本末之相属也。此其宇宙观，虽朴而未为不确；盖其言天地万物之序，不假神道为说，而一准于自然，亦先秦言天者之通义也。\n乾与他卦同，皆合经传二部而成。经者，卦名、卦画、卦辞、爻辞是也；传者，《彖传》《象传》《文言传》是也。《象传》又分大小二体，《文言传》则唯乾坤有之。乾以六阳成体，纯阳而健之至，故其名曰乾。自《彖传》与“大象”观之，乾取象于天；而卦名不作天而作乾者，盖卦名所以表其性、著其义，不所以标其象。取象者，达意之具也；卦之所重，在其性质与含义，不在其象。乾之所以为乾，健而已矣。全卦所讲，一健字也。自卦名以至爻辞，无一语离乎健者。天于众物中最足见健，故取以为象；健为其实，天特其象；名既取实，故舍天而称乾。\n乾之卦辞，四字而已。乾字之义为健，健者，动而不息、变而不穷之谓。合而言之，乾即健；析而言之，则元亨利贞。四字者，正以状天之动变。古人所言之天，其实指日，可谓天即日也。《郊特牲》谓祭天以日为主；《魏相传》亦言天地之变由于阴阳，而纪阴阳者日也。日之运行——实则地之运行，日固未尝动也——致寒暑之推、四时之代。故古人以四时释此四字：元为春，亨为夏，利为秋，贞为冬。贞尽而元复起，冬去而春复来，循环无端，而健之状乃尽见。故元亨利贞者，非四事也，一岁之四节耳。\n乾之卦辞取象于天，其六爻乃取象于龙。卦辞爻辞取象之异，乃六十四卦之通例，大率如此，盖由卦与爻之体不同而然。王氏论卦爻之别，谓卦举一代之纲，爻则随世而迁。卦主一时，未出乎其时者，皆具其时之性；乾之性为健，凡属乾者皆健，就此而言，卦为相对之定，静者也。六爻自下而叠，爻各当一时中之一位，故爻为相对之变，动者也。一静一动，取象自不宜同：卦静，故一象足矣；爻既主变，则一象不足以尽其用，故多取焉；纵六爻同象，其象亦当有动静可指。\n乾既取象于天，天固足以见健矣；若六爻亦取象于天，则六爻徒有健之同，而无各爻之异。爻而无异，则爻之所以为爻者亡。故卦象天而爻象龙。六爻所寓，不过气之消长与君子之出处；状之者必取于龙，以其出于意造，可潜可飞，非实物所得限也。龙为阳物，而变化不测、灵异难知，以龙之动状六爻之动，最为切合。天能见健，龙则不徒见健，且能见健之变。卦爻取象之不同，益见卦性之一定——乾终古为健，无时不然——而爻象之无方：乾可为天，亦可为龙。读《易》者，其毋执象以为实，毋谓甲之必象乙。此其所以异于他卦者，非好为奇也，势有所不得已耳。\n乾之传，首《彖传》。彖者，释卦辞者也，其体通常有二：一释卦名，一释卦辞。八纯之卦，例不释名，直释其辞。释辞之据，或德，或象，或位，有兼三者，有取其一二者；而乾独三者咸备，故其文最富。乾之《彖传》首言天，是据卦象为说；继言六位以时而成、乘六龙以御天，明六位之中九五为尊，处天位而备六爻之德，是据卦位为说。就其内容观之，《彖传》每杂象与天道而言，而以人事终篇。可见卦之所象皆属天道，而语天道者，正欲落于人事。乾之《彖传》即其例也。\n乾《彖传》所含哲理至富，而“乾道变化，各正性命，保合太和，乃利贞”一段尤可玩味：其言万物由元亨以进于利贞，言利贞之为境，而提出万物经乾道之变而各正其性命、保合太和之说。“性命”一辞，古人释者甚众，多入烦碎；其实谓凡物各有所据以成其为此物者耳。“各正性命”，则既许万物之同，又许万物之异：两间之每一物，皆有其生成存在之理、之值、之意，各自生，各自长，各自尽，无一超然者主宰于其上。即此可见《易》与宗教异趣。物不徒各正其性命，又各能保合太和。“保合”为动辞，所保所合者，太和也。太和者何？阴阳二气之交而适相和者也。物之敛而成熟者，莫非二气交畅之所为。屡以物之成归之于二气之交畅，可见其于万物内部之和、之一，三致意焉。《易》言万物各正性命，各得其宜而不相害；言万物保合太和，中涵阴阳冲和之气：所摹写者，一生机洋溢、和气充盈、和而有别、一而不齐之世界。儒家贵和之旨，乃至中国传统文化贵和之思，其源盖出于此。\n乾于《彖》《象》之外，又有《文言》。《文言》者，发《彖》《象》未尽之蕴，多端多层以释卦辞爻辞；后之坤卦亦然。卦爻之辞、《彖》《象》之传，固已明白，而孔子必别为一传，反复申之，其意殆欲使学者知卦爻之辞至活，自不同之角度、不同之层次观之，可有不同之解，当细玩而徐绎之。若执一义以为尽，谓此外别无所有，则终身不能知《易》。孔子之详析乾坤，正为学《易》者立一范，使于其余六十二卦，皆以此法求之。六十四卦之读法，盖尽于此矣。凡此皆所以示人读《易》之法，非徒为一卦发也；善学者由是推之，则六十二卦之理，皆可循途而至。"}},"02":{"id":"02","cnNum":"〇二","name":"坤","pinyin":"kūn","fullName":"坤为地","shortFullName":"地地坤","upper":"坤","lower":"坤","upperNature":"地","lowerNature":"地","lines":[0,0,0,0,0,0],"yaoLabels":["初六","六二","六三","六四","六五","上六","用六"],"blocks":{"P":"坤者，六十四卦之第二也。其画六，纯阴无阳。“坤下坤上”者，注家语也，谓内体三画为坤，外体三画亦坤，两坤相叠而后卦成。与坤相耦者乾，其画六，纯阳无阴。二卦对观，各有面目；合而观之，则一体之两面，析之则两伤。\n卦之性随画而变：三画之乾也健，重之则健之至，三画之坤也顺，重之则顺之至。世未有徒顺而无健者，亦未有徒健而无顺者。顺者有所承而后见，健者有所施而后彰，二者互为其根，相反而适以相成。古人取譬于天地、阴阳、男女，正以明此两两相须之势，非可孤举也。\n是故先儒论乾坤，未尝析而二之：既谓阴阳之所自出、万物之所由生，又谓《易》之所从入、所从蓄。举乾而坤在其中，举坤而乾在其中；单举乾则偏，单举坤则废。《序卦传》曰“有天地然后有万物”，此盖两仪并举，示物所自出，非独标一天也。推之卦画，其理亦同：诸卦之成，两体共之，未有孤举一体而能成者。天下无无地之天，故卦中亦无无坤之乾。\n天之与地，同起同运，未有天先而地后；乾之与坤，亦然。言万物之首，必兼天地，不可曰天为物首而地不与；言诸卦之首，必兼乾坤，不可曰乾为卦首而坤不与。以坤承乾，序之次也，非人力所排，验诸周人观物之旨而合。\n其哲学之蕴，可分两层。其一，古易《连山》首艮。艮之为义，今难确指；然其不重乾坤，则可推而知。既不重乾坤，则诸卦出于乾坤之说，自无由而立。此见夏人于此理未有觉，至周而万物本于天地之义始明。其二，《归藏》之编，坤先乾后，殷人固已尊二卦而首之；然乾元之所以统天、坤元之所以顺承天，其旨彼未之窥也。天地育物之识既阙，则诸卦本乎乾坤之论，亦无自而生。迨《周易》出，首乾而次坤，于是二义始备：物本于天地，卦本于乾坤，而《易》之为门户、为蕴蓄者，亦昭然无所隐。","G":"坤，元亨利牝马之贞。君子有攸往，先迷后得主，利西南得朋，东北丧朋，安贞吉。","G.N":"“元亨利贞”四字，乾之卦辞也。天道之流行，其变有四层，作者即以此四字标之，而乾之纯刚至健亦即于此见焉。孔子舍字而求其义，以为此四者，德之目也；凡人与事与物，四德具足，便已禀得乾健之性。此四德所涵之乾健，超乎一物一事之上，故其为体至虚，其及物至普。\n坤之卦辞亦系“元亨利贞”，独于“贞”上加“牝马”二字。此二字者，所以为贞立限也：坤之所贞，非通义之贞，乃牝马之贞。限之既立，贞之疆域由全而偏；四德本自相权，至是判为“元亨”与“利牝马之贞”，而“利牝马之贞”复自为一层，凡三。三者之中，轻重又不系乎“元亨”而系乎“利牝马之贞”。“君子有攸往”以下，悉就此一层推衍而出。凡辞之偏重者，其义必有所归；识其所归，则辞不烦而旨自见。读《易》者每患其辞之难通，而不知难通之处，正作者命意之处。故读坤辞者，先解此句，则全条脉络自通。\n北方牧马之俗，可取《黑鞑事略》证之。其言曰：牡马择其尤壮者充种，名曰伊刺，不去其势，余则多阉；阉者与骒马各别为群，伊刺自领骒马而不入其队，一群骒马常以一伊刺统之，多至五六十匹；牝马逸出，伊刺必追逐啮踢，驱之使返，邻群阑入，亦咬踢而逐之。观乎此，则牡之统牝，牝之听命于牡，其分定矣。刚者常为主，柔者常为从。牡之贞在能统，牝之贞在能从，二者各有其贞，非可相假也。\n坤之性，一言蔽之曰顺。所顺者谁？曰乾。坤既事事承乾，则乾之所亨者，坤亦与有之，故乾系“元亨”，坤亦系“元亨”。然坤之于乾，顺而不同：乾之所系者“利贞”，坤之所系者“利牝马之贞”，增此二字，面目乃别。坤于天下无所取利，所取者唯在顺从乾健而勿失其正。或问：既以顺为事，何亦系以元亨？曰：元亨者二卦之所同，其德之交也；利贞者二卦之所异，其分之别也。\n“君子有攸往”一句，提挈下文，非泛设也。君子将有所为，将有所行，事无大小，皆以“先迷后得主”为则。然此则也，施于处坤顺之地者，非通一切人言之。处坤顺之地，则当顺从处乾健之地者；坤常居乾之后，断不容与之争先。位之所在，即分之所在，分定而后动，动乃不失其时。为主者乾，坤则承之，未闻坤之自为政也。既曰迷又曰得主，二者对举，其义一正一反：迷则失其所主，而得则主之在我也。欲得主而不失，其道何由？曰：居后而不居先而已。\n“不敢为天下先”，老子列为三宝之一，其说疑即自坤辞此类语转出。老子之书，染于殷易《归藏》者深，贵柔而右母，故其立训如此，斩截无回护，凡处皆然，与《周易》之有限度者判然两途。然《周易》之尚后非无界也：坤之于乾，让其先而自处于后，奉之为主而自安于配，所论止此一重而已。若谓凡物凡时皆不宜为先，则《周易》无是说也。\n“利西南得朋，东北丧朋，安贞吉”，西南东北之义云何？昔有援邵雍先天后天方位为说者，展转求合而终不可通；程子朱子并以西南属阴、东北属阳，视诸家为长。阴西南而阳东北，此说相沿已远，非起于近世。《礼记·乡饮酒礼》辨坐次，以为坐之四面即四时之象，而气有严凝温厚之别：严凝者西发而北盛，名之曰尊严气，又曰义气，温厚者东发而南盛，名之曰盛德气，又曰仁气；宾主之位即依此而立——宾尚义故处西北，主尚德故处东南，介辅宾而居西南，僎辅主而居东北。此说与坤卦之西南东北，恐同出一源，皆西为阴、东为阳之旧闻也。\n然则得朋丧朋，果何所指？曰：得朋固利，丧朋亦未尝不利；朋者同类之称，得丧云云，皆承上文“得主”一语言之。坤所求者，一主而已，主得则安，主失则殆。顾坤之顺也，由何道而始得所主？曰在“东北丧朋”。东北属阳，为乾之位；就坤之对乾言，贵乎忠诚不二，忠非貌从而心违，必也丧其所党，无牵于故旧，无昵于侪流，然后可谓不二。“西南得朋”，西南属阴，为坤之位；就坤之为乾效力言，贵乎竭其全力，欲竭其力，其要却在得朋。丧朋得朋，一事之两面耳：不结私党以效忠，合众力以效劳，二者兼尽，坤之于乾乃无遗憾。其入也异途，其归一而已。坤之职有二：事乾与率众是也；率众而不党，事乾而不二，斯两得之。“安贞吉”者，坤之顺乾出于中心悦服，非勉强而然，吉之道也。\n《说卦传》云“乾为马，坤为牛，震为龙”，而乾之爻乃取龙，坤之卦乃取马，二者若不相值，或者疑焉。是不然，且正相合。传之所列，随举以为例耳，非谓乾必象马、坤必象牛、震必象龙也；至其取象，本无定程，执一以求之则滞矣。盖象者所以寄意，得其意则可，袭其迹则拘。取龙于乾之六爻，取马于坤之一卦，非苟也：健之状似龙，顺之状似马，惟其能尽，是以取之。牛非不温顺也，然不足以表坤之顺于乾：坤所顺者唯乾，他物非其所顺；牛则于物无不顾，顺而无别，非坤之顺也。独牝马不然，于他物一无所顺，所顺止于牡。牝之听命于牡者如此，取以状坤之于乾，可谓肖矣。取象之精，构意之巧，后人读之，唯有叹服。","T":"彖曰：至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆，含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞，君子攸行。先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。安贞之吉，应地无疆。","T.N":"“至哉坤元，万物资生，乃顺承天”——坤元之义，尽于此三句。乾之彖则曰“大哉乾元”。同为赞元，一称大，一称至，其别安在？盖乾之取象为天，天体茫无畔岸，物无不函，坤之取象为地，地体厚而有涯，其德则无所不届。以量言，坤固让于乾矣，然坤事事取则于乾，积久不已，终亦底于乾之域。大者本然之体，至者究竟之称，故其元不曰大而曰至。\n天地合德而物以生，此处不容有阙，废其一则两者俱废。然乾之辞曰“万物资始”，坤之辞曰“万物资生”，其分系乎始、生二字者，果何说也？可取人之成形为喻：父授子以气，性命之基自父而立；母授子以血，躯壳之具自母而成。资始云者，万物于乾得其气之端；资生云者，万物于坤得其形之质。就所凭者言，乾之所授不缘他助，无待者也，唯无待故能大、能无疆；坤之所受必缘乾动，有待者也，唯有待故止于至、限于量。坤不能独致其大，必待乾行而与之俱行，大乃见焉。气既立矣，形乃凝焉，先后之序固如此。\n三句之中，“乃顺承天”最宜着眼，坤之面目尽在是矣：所顺所承者唯乾，主归于乾，配归于坤。坤固以顺承为职，乾亦赖坤之顺承而后成，万物之生，正在两家合德之中。然合德非等夷之谓：造化之役，乾操其柄，坤效其力，坤之行为，唯于承乾而行之际乃有意义。\n“坤厚载物，德合无疆，含弘光大，品物咸亨”者，释亨也，而归趣仍在乾主坤配之分。无疆云者，天之盛德也。天之运行，自其动与历时观之，终古不息，《易》所谓“天行健”是已；自其静与据空观之，覆帱无外，则谓之无疆。厚非一日可致，积顺既久，厚乃自成。地在天之下，其所负者即天之所覆，故其德合而无疆——坤之能载与乾之无涯相埒，地配天、坤配乾之谓也。\n坤德之配乾既明，乃极称其盛。“含弘光大”四字，旧解逐字为训：含者包之无遗，弘者蓄之无竭，光者被之无远弗届，大者统之无外。坤德深厚若此，物入其中而莫不受，事举其中而莫不办，举天下之大，无有能越其范围者。坤之所以堪为乾配，正恃此深厚之量。光大即广大。光之为训，可训照曜，亦可训广远，此处理作广远，于义最安。广者于含弘之上更加一层，非复同义叠出，盖欲人于坤德之厚，体会愈深而愈不能已。万物托处此深厚之中，生育长养，绰然有余地，其亨通固其所也。\n“牝马地类，行地无疆，柔顺利贞，君子攸行”——此下数语，专就卦辞后半发挥，非泛设也。地类者阴类也，阴类非他，坤是已，牝马而系之地类，明卦辞之牝马乃坤顺之表德，质言之，坤顺之象取诸牝马也。牝马之致远，必以乾之无疆为疆，随其所至而效之，未敢自出其途。何以征之？“柔顺利贞”一语即其征。合四句而连读，其说可通：坤之象犹牝马，受牡马之束，动静一以柔顺为正而承乾以为归，推之人事，出处语默亦唯此之为则。分而观之，一为象，一为德，二者各有所当，未可偏举；总而名之，坤以从乾为正路，君子法之而已。\n“先迷失道，后顺得常。西南得朋，乃与类行。东北丧朋，乃终有庆”，凡六句，释卦辞“先迷后得主，利西南得朋，东北丧朋”三语。坤之动也，随乾而俱，此其所守之正。若舍乾自用，悍然居其前，则所向迷谬，坠于旁蹊，究其实并坤之所以为坤者而亡之。“常”者一定不易之称，“后顺得常”云者，谓唯安于后、唯乾是从乃其常耳：先焉则逆，后焉则顺。“类”者俦辈之谓，“与类行”者，率其俦辈而偕往也。西南属阴，为坤之位，坤之事乾，能合其俦辈协力以趋，此得其正，亦得其利。然必更尽“东北丧朋”一节，功乃圆满，即所云“乃终有庆”。东北属阳，为乾之位，坤之事乾，须于意向上与俦辈画疆而守，勿相朋比为党，乃为完满，乃为有成。合而观之：能聚己之众而不树私党，两面俱至，方尽坤顺乾健之职分。\n“安贞之吉，应地无疆”，释“安贞吉”也。此语大率就人身上说：人之禀有坤德者，器宇深沉，才美内敛，与地之无疆恰相孚应；能安而不扰，能正而不倾，如是之人，吉必归之。坤彖三言无疆而所指各异：“德合无疆”者，坤之德配乾之德，所指在乾，“行地无疆”者，坤随乾之行以为行，所指仍在乾，“应地无疆”者，人法地之德，所指乃在坤。所指虽三，其兼具空间之无穷与时间之久长则一。","X":"象曰：地势坤，君子以厚德载物。","X.N":"乾之大象曰“天行健”，坤之大象曰“地势坤”，两句铢两相称。所偶者三：天地也，行势也，健与坤也。天地为偶，人皆知之；行与势为偶，则须一解。行者，道也，是名词，天行即天道。天道主乎动，动之品格为何？曰健。坤不云地行而云地势，盖以地道主乎静（此古人语，实则地亦未尝不动），故以势言之。云天行，是标天道之品格；云地势，亦标地道之品格。顾乾则直名曰健，坤乃祗举卦名，不以顺称，此又何说？古人于此有异说。朱子以为一时用字之偶，非有微旨，治《易》者无事深求。此说为长。坤之训即顺，故地势坤不妨读作地势顺。若就地形观之，顺固无从看出。至谓冈峦起伏、高下相仍即可以为顺，则凿空之谈，未足据也。王弼尝言：地之形无所谓顺，顺在其势。思过半矣；至势之所以顺，则犹未之及。孔颖达申之曰：地形方直，非顺也；顺者其势，势以承天而顺耳。此为得其实。地何以顺？尊卑之位既定，地自居卑而下承乎天，更无他故。推之于卦，乾刚而坤柔，坤之所以顺，亦犹是耳。\n厚德载物之语，昔人有谓地以厚故顺，使地而薄，则冈陇倾陷，顺无由见。此亦牵强。地之厚乃其本色，厚德之名由此而立；至于顺，则如上所云，以其承天而顺，与地之厚初不相涉。然即坤德论之，顺与厚亦未尝无涉：人之秉性，柔者多宽，宽者多柔，二者常相为因。大象言厚德载物，盖欲治《易》者师地之厚而以之受物：胸次如大地之广，天下之人与物皆纳其中，俾人人得所安处，下至羽毛鳞介、草木之微，亦皆托命于我。若胸量狭隘、刻薄而多诈，则所必斥也。","Y1.T":"初六，履霜坚冰至。","Y1.N":"初六者，阴爻而在初位也。阴爻之目有二，曰六曰八，名异而实同。别之则六为老阴，老则化阳，故称变爻；八为少阴，少则守故，故称不变。筮家所占在变不在不变，是以《易》中一百九十二阴爻，一例系六，更无系八者。\n“履霜坚冰至”五字，其旨易晓。其为辞也，托象而不直陈。象者何？借一物之形状，寓一理之曲折，理不自吐而假物以吐之。此实《周易》命辞之大法。夫理既可言，何苦舍直而就曲？盖直言之则执一而遗百，其弊恒至于死且偏；唯取象以寓，义乃圆融，旨乃周匝，无往而不通。\n六十四卦、三百八十四爻，其取象也，若有一定之程，而实则变动无方。乾之卦辞曰“元亨利贞”，所取者天也，然未尝明言，非读《彖传》不悟其指。及其为六爻，则又舍天而取龙。坤与乾为偶，乾辞既取天，坤辞宜莫如地，而乃取牝马；至六爻所象尤杂，竟无一及马者。\n就本爻观之：霜既践矣，冰之坚也，可计日而待。此喻阴之生于下，其萌至微，其势则必底于盛。由是以推人事，欲人于几先有觉，于未形有备，不俟其渐之既成而后图之。阳之见消于阴，刚之见败于柔，君子之见剥于小人，迹其所由起，不过毫发之微；驯至其后，则弥天塞地而莫可如何。故贵乎毖于小、慎于微；当其力尚弱、势未张时，早辨而豫为之防，勿使其蔓延而已。","Y1.X":"象曰：履霜坚冰，阴始凝也。驯致其道，至坚冰也。","Y1.XN":"“坚冰”二字，疑是衍文。履霜与坚冰，非一时之事；言履霜为阴气初凝则可，言坚冰为阴气初凝则不可。裴松之注《魏文帝纪》，录太史许芝所引，则“初六”冠于“履霜”之上，而“坚冰”二字不在其列。由是推之，古本当作“初六履霜”，转写浸讹，遂衍为今文。\n驯之为言狎也，习也。“驯致其道，至坚冰也”者，谓霜既践矣，阴气已凝，积而习之，其势必至坚冰。以人事言之，“其道”即小人之道；小人之道始亦甚微，唯积渐而狎习之，因循不已，遂以大盛。爻辞言“坚冰至”，着眼在事之究竟；小象言“至坚冰”，着眼在事之发端。\n乾初九之小象曰“阳在下”，坤初六则曰“阴始凝”，特标阴阳二字。盖明九之为阳、六之为阴，而全部《易》书，不过三百八十四爻阴阳相待、相错而变化之历程。有人见经文不著阴阳二字，遂断《易》不言阴阳，其说甚谬。九六即阴阳，乾坤亦即阴阳。孔子不唯于二卦初爻发之，他处称引不一而足：《系辞》分言之，则曰“乾，阳物也”，曰“坤，阴物也”；合言之，则阴阳相配而其德合，刚柔异质而其体立；推极其用，则阴阳迭运而道在焉，阴阳不测而神在焉。使《易》而果不言阴阳，则《易》亦无以为《易》矣。\n阴阳初非怪诡之物，特事物对待相反而又相成、变动不居之两端耳。《易》之所以异于他书者，一面承认二气之合、两不可无；一面又谓阳淑而阴慝，阳善而阴不善，凡高朗、美善、正当者悉归诸阳，凡卑下、丑恶、悖谬者悉归诸阴，持扶阳抑阴之论。","Y2.T":"六二，直方大，不习无不利。","Y2.N":"六十四卦各有一卦主，为一卦之表；卦之品格，赖主爻而显。乾之道寄于九五：位为君，象为天，刚健中正四者不阙，而坤之主则不在六五而在六二，盖坤之纯粹，唯六二足以当之。六五虽居尊位而爻体属阴，位则为阳，中得而正未也，六四爻位俱阴，正得而中未也，六三以阴居阳，中正两失，求其柔顺中正四者咸备者，唯一爻耳。六二者，又居臣位而具地象，故爻辞“直方大，不习无不利”，于坤之本质可谓摹写无遗。此可分两面观。\n其一，就三者分别言之，方之一字，独为坤所专有，乾不与焉。乾以圆为体，坤以方为体，方圆既立，坤之面目乃与乾对峙而见。静者坤之本，方者坤之德，二者相因而成。《系辞》以“其动也直”状乾，《彖传》以“大哉乾元”赞乾，凡此皆乾之所以为乾者，坤无与焉。\n既非坤德，坤之主爻何以连直与大方而并举？曰：坤无自德，取乾之德而德之，处处以效法从事。圆者乾之体，坤则转而从方，是以坤虽至静，其德独以方称。直之名属于乾，而坤未尝无之：彼既直矣，此亦与之俱直，非坤所得而自擅也。乾之覆帱无外，坤亦配之而无外，是以其大与之齐。然则方之与直、与大，三者何以能联而为一？以事理推之，未有不能直而能方者；直者其始，方者其成，及其充积既久，则未有不以宏阔为究竟者。譬如几何家言线、面、体：无直线则面不成，无面则体不立，无体则大奚自而生？此正见坤之本色：坤惟效乾、因顺乾，绝不独自表襮，而其德亦必托乾而后立。\n其二，乾圆而主动，坤方而主静，故曰“不习无不利”。不习云者，坤之所行一本乎天成，未尝以己意参之，随乾而动，无复矫揉增损于其间，如此则于坤无所不利。此意与《老子》之无为相近——老子之学出于殷易《坤乾》，此语殆《坤乾》旧闻之仅存于《周易》者。","Y2.X":"象曰：六二之动，直以方也。不习无不利，地道光也。","Y2.XN":"爻辞“直以方”，以字不作物所之介，而作承接之连，直而方者，兼举直与方之辞也；然则直与大既当归乾，坤之六二顾乃兼举之，何也？曰：坤之动也。孔子释此爻，特标“六二之动”四字，正为此发。\n乾刚坤柔，乾动坤静，此固然矣。然则坤也，岂徒柔而遂无刚德，徒静而遂无动几哉？俱不然也。坤之性为顺，所顺者乾；其一动一静，皆视乾以为程，乾动则俱动，乾行则俱行，未始自擅。坤虽至静，苟乾之气机及之，则顺之而俱动；动机一发，遂不可遏抑屈挠，于是坤乃有直。\n坤所本有之方，其见于外者，亦待六二之动而后著。乾之气机一及，坤即承之，凡物之洪纤高下，一一赋以定分，确乎其不可迁。物既各定其分，是即六二之动，而坤之方亦在是焉。故曰坤柔而含刚，坤静而含动；坤之所以能直而方者，正赖此耳。\n光之为字，其训有二：照曜其一，广大其二，此处实当作广，故地道光云者，犹言地道之广也。六二何以能“不习无不利”？孔子答曰“地道光也”。六二居坤之正位，坤之全德于此爻见之；“不习无不利”非独一爻之能事，实全坤之通性，故曰地道光。盖坤之德，静以为体，动以为用；体静故能受，用动故能成。坤德之直且方，即所谓地道之广也。而直方之所以为直方，初无他奇：取乾之德以为德，取乾之行以为行，己则循理而动，莫之为而为耳。此非“不习无不利”而何？","Y3.T":"六三，含章可贞，或从王事，无成有终。","Y3.N":"六三处不中不正之地，既不足比六二，又与六四有别。六四以阴居阴，纯乎阴柔，无一线阳气；六三则以阴爻处阳位，阴中藏阳，半动半静，故有“含章可贞”之象。章者，文之成者也，本属外见之物；然其体终属乎阴，阴以静为德；又兼坤含弘光大之美，居下体之上而为得位，故能韬其章采，久守弗泄。\n然六三居阳，动之几已伏其中；故“含章可贞”非谓终其身韬晦而已也，复系之曰“或从王事”：王事当前，则起而任之，效其力焉。此“从”字最吃紧：从者，随人而成事，不尸其始，彼唱则此和；非其事主也，命下而后动。“王事”之王，谓乾也。他卦多以第五爻为君，坤则不然，六爻皆属臣道。\n“或”字尤可玩味。乾九四曰“或跃在渊”，坤六三曰“或从王事”，二爻皆在进退未定之会；然言退，则曰在渊、曰含章，言进而及于跃、及于从王事，则皆缀一“或”字。此正见作《易》者之意：进宜慎，不宜亟。凡《易》之例，阳以进为德，阴以退为德；乾九四以阳处阴，坤六三以阴处阳，阴阳杂居，进退未判，故于其进也致其叮咛。若夫纯阳纯阴之爻，则无待乎戒：阳之德主进，其居阳位者不期进而自进，予乾九三见之，“乾乾”是也；阴之德主退，其居阴位者不期退而自退，于坤六四见之，“括囊”是也。\n“无成有终”，则就“从王事”而更进一层。坤之六爻皆臣位，所君者实乾。六三既从乾之事，便有一个如何从法。其一，必当能“无成”，而亦唯其能无成。所谓无成，非碌碌而靡所就也；事既济矣，而不居其功，美则推之于君。其二，虽无成而必“有终”：功虽不居，分内之事却须鞠躬尽瘁，纤悉不苟，做成做彻。若以“无成有终”为当作十分而仅作五六分，留其余以待后人，则失之远矣。","Y3.X":"象曰：含章可贞，以时发也。或从王事，知光大也。","Y3.XN":"“含章可贞，以时发也”——含章非终藏而不发也。平日不发，至当发之时则必发。经文所谓时，盖属之从王事，非泛言也。含与发两相待者也：平日无所含，则他日无所发；发不待时，则所谓发者亦漫然而已，又何含之足云。锋颖易见者，其于含也必不能；不能含者，其发也必不当乎时。故含章与以时发，非二事，乃一事之两面。\n“或从王事，知光大也”，实当作“或从王事，无成有终，知光大也”读。知光大者，识之广也。六三何以能“或从王事，无成有终”？其本在“知光大”：识见既远，襟度自宽。识远而襟宽者，自然含晦。常人之欲晦也，非无其志；然识量既陋，所从事者不过矫饰于外、埋光于迹，本原之地初无真见，故一善一功，辄跃然不能自禁，欲其含也难矣。譬之器小水多，任尔遏抑盖藏，水终必溢；若器大而有容，水自不泛，初不待费力。此非勉强可致，本于识量之素定故也。","Y4.T":"六四，括囊，无咎无誉。","Y4.N":"六四之于六三，其境不同。六三以阴处阳，动与静参焉，退固可也，进亦无不可，故含章之事与从王之事，皆其所宜。六四不然：纯阴而处乎阴，位在危疑，上与下隔而不通，前无承而后无应，贤者当此，唯有卷怀而退藏。然六四恰是知几之士，能以柔道自将，故其辞曰“括囊，无咎无誉”。括囊云者，束囊之口使勿泄，中之所蓄，一物不出；默然自守，不善固无所为，善亦无所为，善恶同归于一括，而形迹尽泯。为恶则咎至，不为恶则咎免；为善则誉生，不为善则誉亦无。世之君子多知咎之能伤，而不知誉之亦可畏；盖誉之所集，咎每因之，二者未尝不相随。庄子之书，谓善不可为以近名，恶不可为以近刑，惟缘督而以为常；其指与此爻正合。","Y4.X":"象曰：括囊无咎，慎不害也。","Y4.XN":"小象言“括囊无咎”而不及“无誉”，是省文，“无誉”固在其中。“括囊”之实为谨，“无咎无誉”之实为不害：唯其括囊，故咎誉两无；唯其能谨，故害不及身。孔子以“慎不害”三字，抉出爻辞之底蕴。","Y5.T":"六五，黄裳，元吉。","Y5.N":"黄者，五色之一也。其在象也何主？旧有二说：一以青赤白黑黄配东西南北中，黄当中央，为中之色；一以天玄地黄相对，玄既象天，则黄当象地。此爻之黄，将属中乎？抑属地乎？先儒两存而未决。今以文义参之，后说为优。\n请陈其据。上六之辞于本爻为紧邻，曰“龙战于野，其血玄黄”。玄黄对举，则玄之为乾为天为阳，黄之为坤为地为阴，不待烦言而解。《仪礼·士冠礼》记冠服，有玄端、玄裳、黄裳、杂裳之目。郑康成注分三等：上士之裳玄，中士之裳黄，下士则杂，杂者前玄后黄。其释杂裳，即引《易》“夫玄黄者，天地之杂也，天玄而地黄”为证——此语实在坤《文言》解上六之文中。郑君以玄当天色、以黄当地色，无可议者。夫六五言黄裳，上六言玄黄，两爻相接，一黄字岂容二诂？此一说也。\n再由事理审之。五位本已得中，中之为中，不待色而后显；必以黄为地色、为坤之表，然后此字非虚设。此又一说也。\n古之服制，被于上者为衣，系于下者为裳；裳之形略如蔽膝，束之于腰。衣象乾而在上，裳象坤而在下。黄与裳连文，坤柔顺之道于是乎寓。乾以上为尊，坤以下为正，故二与五虽同居中位，而乾之天德独著于九五，其辞曰“飞龙在天”；坤之地道独著于六二，其辞曰“不习无不利”。位与德，本不必相值。阳德而居下位，乾之九二是已，二固非乾之本位；阴德而处高尊，坤之六五是已，五亦非坤之本位。“元吉”者，大吉之谓。通其辞意，盖谓人值坤之时，位虽贵盛，犹当自守柔顺之节，如此乃获大吉。","Y5.X":"象曰：黄裳元吉，文在中也。","Y5.XN":"“以时发”者，六三之辞；“文在中”者，六五之辞。两爻之文，宜合而参之。六三言“含章”，美蕴于中而未出；然出有其时，时至则不容终閟。六五言“黄裳”，美已形于外矣；顾其形于外者，非缘饰而然，中实有以为之地，故系之曰“文在中”。位有中、不中之别，所处亦因之而异：六三居非其中，则章贵乎敛，必俟时可而后吐；六五柔顺处中，黄裳之象既彰，正昔之含者今已发之候。虽然，文非自外袭取也，其德素具于中，特乘时以出之耳。","Y6.T":"上六，龙战于野，其血玄黄。","Y6.N":"一卦之体，可拟于一代之世；一爻之位，则此世中之一阶段也。乾之六位，自下而上，潜、见、惕、跃、飞、亢，节节相生，而悔居其终，首尾完具，自成一条。此一条者，乾健自呈自变之迹也。坤之自初讫上，亦复成条；然坤之所以为坤在顺——顺乾也，顺阳也。故其六爻所写，正是坤之顺乾、阴之顺阳，逐位而进，一位深于一位。\n初六之履霜，阴气方凝而未厚也；六二之直方，阴柔中正之德已完具而无缺也；六三之含章，美蕴于中而不炫于外，然已豫为期于为乾效劳，功成而不处也；六四之括囊，顺之积渐深，遂底于晦藏缄默也；六五之黄裳，坤顺之道几乎纯美，位高而守柔自下也；上六则盈极而溢，顺化为逆，向之顺乾者，今且敌乾而与之争矣。\n爻辞不系以阴与阳战，而曰“龙战于野”者，讳其实而不予其名也——阴之能敌阳，作《易》者所不承。曰“战于野”，一若祸不始于阴之相陵、坤之相亢，而阳者乃自出而与之角者；此与《春秋》书“天王狩于河阳”，笔法正同。古之制，都邑所居谓之国，国郭之外谓之郊，郊又其外，则谓之野。辞系于龙而不系于阴者，明战之者阳也；阴抗乎阳，非可言之事，故讳而称龙。辞系于野而不系于国者，明其地在外也；阴之相逼于阳，亦借此掩其迹耳。\n“其血玄黄”之解，或以为血战，甚者附会血流漂杵，皆非也。此语所重，在玄黄二字，血特其寄焉者耳。天之正色玄，地之正色黄；玄黄并陈，则天地糅杂、乾坤混淆之象也。夫天地糅杂、乾坤混淆，在古人之意，最为不祥之尤。故爻辞虽不著悔吝之文，而“其血玄黄”之祸，较悔吝为尤烈。","Y6.X":"象曰：龙战于野，其道穷也。","Y6.XN":"上爻者，数穷将变之位也。乾之《文言》以“穷之灾”释亢龙之悔，坤之小象以“其道穷”系龙战之辞，二说归趣无殊。盖道之至上，穷斯至焉；穷则不得不变，变而后通。乾之悔，生于乾道之极；坤之血战而玄黄交杂、天地失位、阴阳失辨，亦生于坤道之极。极者穷之别名，穷者变之由来也。","Y7.T":"用六，利永贞。","Y7.N":"用六之指，与乾用九同揆，其义皆主乎老而不主乎少。用九者，乾之六阳爻皆以九为用而不以七；用六者，坤之六阴爻皆以六为用而不以八。筮而遇坤，六画虽尽属阴，其数则或六或八，未可一律。老阴主变，少阴主不变：六者老阴也，其数当变，八者少阴也，其数不移。筮法所取，唯动是占，静者则置之。\n设令所遇六画俱六，则六者尽为变爻，即持此六者以下。六变则化七，七者阳也，六画尽化，卦遂自坤而之乾。坤之化乾，体虽易而性未亡；性未亡，而乾之气息已入乎其中。作者有见于此，别系一辞曰“利永贞”：柔之不能自守者势必化刚，而化刚之后又未可纯作刚看，故所利唯在永贞。\n二卦同此四字，而所主不同：乾之所主在元，举元则足以统亨与利贞；坤之所主在贞，贞立而元亨自归之，故其贞必系以牝马。坤之所以为坤，一顺乾而已。合德以育物，则元亨之占，乾有之，坤亦有之；奉乾以为君，则承之而无违。专举永贞而不及元亨者，非有阙也，于变卦之际，特欲人识其顺承之一面尔。","Y7.X":"象曰：用六永贞，以大终也。","Y7.XN":"阳饶阴乏，乃《易》之通例。用六之占，六画其数尽六；六为老阴，动而化七，六画遂皆阳矣。始焉阴小，终焉阳大，故象曰“以大终”。","W1":"文言曰：坤至柔而动也刚，至静而德方。后得主而有常，含万物而化光。坤道其顺乎，承天而时行。","W1.N":"六十四卦之中，孔子所最重者惟乾坤。谓其二卦义蕴深阔，非他卦所得比肩，故特立《文言》以申之，往复剖析，不厌求详。坤之《文言》凡七节，自卦辞以讫六爻，次第而释；今所读者，其释卦辞之节也。\n卦辞已有《彖传》畅言之矣，此复为之辞，得无赘乎？曰：非也。彖之所务，在疏其文义；文言之所务，在挈其纲领。涵泳既久，卦旨乃握，乾之《文言》亦犹是。然两家体例实有不同。乾辞止于四言，一字一义，非逐字剖之则其蕴不彰，故乾之文言不惮其烦。坤则不然：所取者仅“后得主”三字，余皆赞辞，而用力之处独在“顺承天”。其故安在？盖坤之取象纷错，卦取牝马，爻中所象尤杂，义不易循，故不如乾之可按字而求也。\n“坤至柔而动也刚，至静而德方，后得主而有常”，此三语者，坤之骨也。乾刚而坤柔，乾动而坤静，此其本性固然；然坤之柔非枯槁之柔，必于逐乾之动而柔乃可见。乾体刚健，运行无已，坤承之而以长万物、以负万物；长之负之，皆动之事也，有动则刚者形焉。乾动而坤与之俱动，乾刚而坤与之俱刚，非坤自能刚也，从乾而刚耳。至若坤之静，静本无迹，无可指摘，欲观其静，当于其德之方者求之。静无可指，而方有定形；即方以求静，则坤之所以为静者见矣。方者何？即六二“直方”之方。乾以影响下及，坤受而范铸群品，动植万殊，一一赋以定形，确然可守，推之四海而不变，此方之实也。由是观之，坤体柔矣，而动则刚；坤体静矣，而德则方；其所以然者，在让乾居前而己随之。“后得主”三字，乃坤一定之分，柔与静皆植根于此。\n抑犹有辨。《老子》之教，柔与后并尚，谓柔弱可以胜刚强，而以先动为戒，其言若与坤道合；按其实，则判然两途。其道崇柔而黜刚，右阴而左阳，位坤于首；其所云不先，谓凡事皆当处后，无问所遇。《周易》则不然：让乾居前，坤则随之而已，非谓凡物凡时皆当处后也。此一差别，关系甚巨。寻其源，《老子》出于殷易《归藏》，《归藏》编次，坤居乾先，故其立论如此；《周易》于《归藏》非无因袭，然已取而改造之，向之坤先乾后者，至是反而为乾先坤后。此则根本之变，非小小异同也。\n“含万物而化光”，其旨与彖辞所称“含弘”“咸亨”者相贯，前解已具，兹不复陈。\n末二语“坤道其顺乎，承天而时行”，实为一篇之结。至柔也，至静也，后得主也，诸目虽殊，所归则一“顺”字。健为乾之本，顺为坤之本，犹两仪之各有其性。“坤道其顺乎”，斩截明白，无复游移。虽然，所顺者谁？曰天，曰乾，非漫然无所择也。其为顺也，亦非贸贸：天之行也有候，坤之行也亦如其候，天不先，地不后，步趋悉合。此语一出，坤顺之蕴遂无毫发遗憾。反而观之，卦辞“利牝马之贞”，其意亦涣然冰释矣。","W2":"积善之家，必有余庆；积不善之家，必有余殃。臣弑其君，子弑其父，非一朝一夕之故，其所由来者渐矣，由辨之不早辨也。《易》曰“履霜坚冰至”，盖言顺也。","W2.N":"此孔子读坤初六之辞而申其义者也。所谓余庆，福流于子孙；所谓余殃，祸延于后世。善恶之积，其被于后者如此其远，故君子慎其所积。\n凡祸根之先伏者，其发也恒在久远之后。弑君弑父，事之至烈者也，而原其始，非一朝一夕之故，其来有渐，积而至焉。方其萌芽，往往微而不著，人不知辨；迨其既成，则溃裂而不可救。孔子举此，正以明“履霜坚冰至”之指。\n然孔子又谓此语“盖言顺也”，则疑窦生焉。顺者，坤之本性、坤之至德，与乾之健并立而为正；而初六所陈，乃阴道由微浸盛之序。阴道者，小人之道也。以小人道长之象而系于坤，其与卦辞、《彖传》及本篇首节所言之坤道，岂不枘凿？\n曰：是当通全《易》之体例观之。乾之卦辞与爻辞，意向尽同，皆就正面立说：卦辞言健，爻辞亦言健，所异者爻辞就其动处言之耳。坤则不然。坤之卦辞言顺、言坤之德，皆属正面，故大象以“厚德载物”承之；而爻辞乃有取阴道为小人者，其意向适与卦辞相背。此非偶失，乃《易》之常法。\n初六之辞，谓阴之浸长终成大害云尔。其所云“顺”，亦一顺字，而非卦辞“顺承乾”之顺；此种顺，在君子则当逆而制之，非可顺而徇之也。卦爻之辞相异、甚且相违者，后此诸卦犹屡见之，读者宜先具此识。","W3":"直其正也，方其义也，君子敬以直内，义以方外，敬义立而德不孤。直方，大，不习无不利，则不疑其所行也。","W3.N":"此释六二“直方大，不习无不利”也。六二为坤之卦主，体柔而处中，位正而应乾，坤之诸美毕具于一身，卦辞所标坤之性质，举无遗者。故其立辞之指，与卦辞一揆，皆所以教君子。\n坤之道既在“直方大，不习无不利”，君子法之，其施于身者当何如？孔子乃一一指之。\n“直其正也”——直之中有正在焉。径情直行、上上下下而无检者，未可以言直也；直必济之以正，中扃洞启，无纤毫回曲，然后为直。“君子敬以直内”，敬者，心主于一，不为杂念所间，临事专一以往，不苟且以赴之谓也。\n“方其义也”——方之中有义在焉。规规于隅角、尺寸自守者，未可以言方也；方必济之以义，事至而剖其是非，直者直之，曲者曲之，所当行则行，所当止则止，然后为方。\n“敬以直内”，所以治其内也；“义以方外”，所以正其外也。内外两障既立，则无事之时，方寸澄然，不染一尘；有事之时，是非判然，是者从之，非者去之，矩矱森然，各当其可。为人之道，尽于此矣。\n“敬义立而德不孤”——二者既立，其德自不孤。何谓不孤？内有所养，外有所资，交相灌注，其及物也远；自近及远，横乎四海，凡向善者莫不翕然相应，与之合辙，是之谓不孤。不孤也者，大之别名也。敬立义立而德自不孤，则“直方大”三字，已落于一人之身矣。\n“直方大”既备，则“不习无不利”：不待增益造设，一任自然，循乾之轨，不假作为。如是，则“不疑其所行也”——坦然酬酢万变，无复回惑自疑于所为之是否。此孔子申解之终也。","W4":"阴虽有美含之，以从王事，弗敢成也，地道也，妻道也，臣道也。地道无成而代有终也。","W4.N":"此释六三之爻辞，而所以释之者，就坤乾之分言之。\n坤非无才美也，有其美而必“含之”：不形于外，不使成名。凡此，皆为“以从王事”，效其力于乾之事业而已。夫坤岂力不能成名者哉？乃“弗敢成”耳——不敢自居于成也。\n爻辞于“或从王事”之下系以“无成有终”，正谓坤虽有美而不居其名，虽有功而不伐其劳，然而事之在己者，必使之纤悉毕举、首尾俱彻。《文言》更进一层，拈出“代有终”三字：所谓有终，非坤自终其所始，乃代乾而终之；所成者乾之事，非己之事也。\n由是坤乾之际可一言而尽：始者属乾，终者属坤；乾不代坤之终，坤不僭乾之始。方其事之行，坤固当竭力殚能，奋然而任之；及乎功成，则举功劳荣誉悉归于乾，己不居焉。坤之所以为坤、地之所以为地，胥在是矣。以臣事君、以妻事夫，其义举不外此。《系辞》分属二卦，谓始事者乾，成物者坤，旨正相类。","W5":"天地变化，草木蕃；天地闭，贤人隐。《易》曰“括囊无咎无誉”，盖言谨也。","W5.N":"六四之体阴也，其位亦阴，不中而不健，有天地否塞、上下不交之象，正当乾坤之道断、贤者引退之时也。\n“天地变化，草木蕃；天地闭，贤人隐”，此互文也：举草木则遗贤人，举贤人则遗草木，其实兼之。古以天人之际相为表里，故论治乱常借自然之象为验。朝政清明则庶类由之蕃育，《驺虞》之序所言是也；岁功失序则百谷由之不登、俊民由之隐伏，《洪范》之篇所陈是也。\n“天地变化”，谓阴阳交感、万物化生，其时草木畅茂，而贤者亦出而用世；“天地闭”，谓两气隔绝、不相往来，其时草木不遂，而贤者亦退而家居。\n贤者退隐之状，取象于“括囊”。括者结之，囊者受物之器；结其口而不泄，则言不出于口，智不发于外，身不彰于时。一面谨守自持，一面内蓄其德以待可为之日。而一篇之要，终在“谨”字。括囊而谨，誉虽不闻，咎亦不至。","W6":"君子黄中通理，正位居体，美在其中，而畅于四支，发于事业，美之至也。","W6.N":"此释六五“黄裳元吉”。全句当分两截读：上截为黄字作解，下截为裳字作解。\n黄者地之色，坤之表也。言“黄中”，谓坤之居中。居中一义，于坤最要：顺德蕴于内、存于中，而非饰于外以欺人者，故以中言之。下文“美在其中”，正承此而申之：中心所藏，纯然无滓，则于理无不通贯，故曰“通理”。此就六五之美藏于内者言也。\n六五与六四不同。六四“括囊”，藏而不出；六五所藏，则当显之于用，故又曰“正位居体”。“正位”者，六五居尊也；“居体”者，其取象毕竟是裳，故自处以体之在下者。合而观之：身据高位而甘居人下，柔而能恭，静守而不为先，顺处而不自造，此其所以为正位而居体也。\n内蕴顺美，外则居尊任事，大有所为而不嫌于僭逼。如是之人，其坤顺之德已达于四体：自顶至踵，表里上下，无一处不充，无一息不贯。而犹不止此：达于四体者，又必“发于事业”，举其才德以施于邦国天下之治。至此，其德可谓“美之至也”。古人多以周公、伊尹方此爻，其说殆非无据。","W7":"阴疑于阳必战，为其嫌于无阳也，故称龙焉。犹未离其类也，故称血焉。夫玄黄者，天地之杂也。天玄而地黄。","W7.N":"此释上六“龙战于野，其血玄黄”也。\n坤至于上，阴之盛极矣，遂“疑于阳”。疑者何？阴阳相敌，力齐势均，高下小大无所差别之谓也。阴盛而至于与阳相疑，则其势必出于战。\n本阴与阳战也，而辞不曰“阴战”，乃曰“龙战”，何也？惧人之以阳为无也。曰“龙战”，则阴盛犯阳、阳起应之，战之名有所归矣。作《易》者之意，断不容阴与阳均敌，故其辞如此。\n玄者天之色，黄者地之色。称“血”者，明阴阳皆未离其类：阴自为阴，阳自为阳，未尝混而同之。称“玄黄”者，明二者杂糅而难辨也。虽然，杂者其形，别者其分：天之色终玄，地之色终黄，尊卑之位、健顺之序，终不可以毫发迁就，此则辞外之旨也。","Z":"坤于六十四卦居次二，六画莫非阴也，与乾之六画适相为偶。卦之有序自乾坤始，而相邻两卦，其画不反则对。对者，两卦六爻自初讫上，阴与阳一一相值，乾坤当之；反者，前卦自初至上如卷帘倒卷，即得后卦，后卦倒卷，复还前卦，屯蒙之属当之。亦有兼斯二者，则六十四卦之终，既济、未济是已。邻卦而系以此关系，断非偶然，其中必有义焉，后当随卦而及。盖卦画之序非苟然者，一反一对之间，前卦之终即后卦之始，消息盈虚寓焉。今先论乾坤。\n乾之六画莫非阳也，其性至健而无杂；坤之六画莫非阴也，其性至顺而无违。二者所表，判然相戾；然相戾者未尝不相须，废其一则两俱不立，合之乃成全体。《序卦传》云天地建而后庶物生，《易纬·乾凿度》云乾坤并生，无分先后；又谓二卦为阴阳所自出、万物所由祖。三说皆是。其指有二：言庶物，则天地并为其本，未尝独举其一；言易卦，则乾坤并为其本，未尝偏任其一。何以言之？六十四卦之中，余六十二卦莫非二卦相与交错而成；废其一，则卦不立，易亦无自而生。天地合而庶物生，二卦合而易道成，其理一也。\n顾其生物虽同，而位分迥别：天高而临，地下而承。二卦虽并立成体，而其分未尝齐：乾以健为德，坤以顺为德。乾取象于天，运行无已；坤取象于地，承顺无违。质言之，乾处尊、坤处卑。此义贯乎《周易》之终始，故《系辞》开篇即曰“天尊地卑，乾坤定矣”。所谓尊卑，非以强弱言，乃以先后主从言：主者常居先，从者常处后，非人力所张，实理势之自然。其在坤卦，尤昭昭可验。\n试以两卦之辞相较。乾辞止于四言；孔子作《彖》，赞曰“大哉乾元”，谓其“万物资始，乃统天”，作大象则曰“天行健”，皆所以明乾之象天。坤辞则曰“元亨，利牝马之贞”，又缀以“先迷后得主，利西南得朋，东北丧朋，安贞吉”诸限语；孔子作《彖》，赞曰“至哉坤元”，谓其“万物资生，乃顺承天”，作大象则曰“地势坤”，皆所以明坤之象地，而于“顺承天”致意焉。两两相形，其相去如天壤。孔子之解，悉符经文之本指，无溢美，无曲说。\n“天行健”者，乾之象天，无待而自行，无有涯涘，无有止息，其性独立无倚，刚健自遂，非受人制，亦不待人之制。坤异于是：其所守者承乾之职也，非敢自用。坤之象地，主静而块然；非其不动也，其动也必缘乾而动，其参与于生物也必在乾之影响之下。\n乾以其元始万物，坤乃以其元生万物。乾之元大矣，坤之元则至矣——有乾之大，坤乃从而大。坤不能如天之自行不息，其性柔顺，其行受制于乾，亦当受制于乾；有乾之元亨，而后有坤之元亨。\n乾兼具四德，合而为乾健之内容；坤之于乾，元亨则同之，利贞则异之。故坤之所利，在乎守顺之贞：如牝马之受辖于伊刺，柔顺以听其约束。坤之元亨既受之于乾，则其贞亦不得不受之于乾。凡坤之为，必以乾居先而己居后；牝马而超于伊刺之前，未有不失其道者。唯常居乾后，乃为正路，乃能得乾之扶助与护持。要之，坤之于乾，惟法是守，无所自遂而已。\n“西南得朋”者，为服事乾计，当合其同类，并力而趋；至于“东北丧朋”，则所以效忠：屏去朋党，专志于公。二者相济，坤之职乃尽。\n孔子《文言》申卦辞之义，较《彖》为尤透，其言曰“坤道其顺乎，承天而时行”，可谓一言而蔽之。析之有三：其一，坤道之实，尽于一顺字；其二，坤非无所不顺，其所顺者独乾，而非漫及于物；其三，顺承之际，尤有时焉——乾以时行，坤亦以时行，未敢先，未敢后。\n此一顺字，非独卦辞有之，六爻之辞亦莫不然。六二之“直方大，不习无不利”，六三之“含章可贞，或从王事，无成有终”，六五之“黄裳元吉”，凡此诸爻，皆状坤之承乾，柔而不违者也。就中六二一爻，实举坤之全量而尽之：言“直方”，则其自治之功与所得之德在焉；言“大”与“不习无不利”，则让乾居前、己随其后、不假作为之旨寓焉。\n六三以下，其证此顺字尤切。孔子固已揭之：地之事天，妻之事夫，臣之事君，其道一也。坤之所以为坤，在彼倡而此和，彼有所始而此为之终；虽终之，代终而已，非己之终也。功在坤而坤不居，美在坤而坤不有，举而归之于乾。此非谦抑之虚文，乃分定而不可越也。\n通观坤之六爻，与卦辞之指大略相承；顾卦辞主常，爻辞主变，变则不能尽合。六四“括囊，无咎无誉”，其意归乎守、归乎敛、归乎畏；虽于“顺”义亦有一线之通，而遽以顺释之，则未可。此后诸卦，爻与卦相违者往往而有，不足异也。\n抑又有一端：卦辞之体，或顺导之，示其所宜由；或逆折之，禁其所妄趋。顺导者，乾坤为之冠；逆折者，蒙、剥之属近之。二者相较，顺导为多而逆折为少。若夫三百八十四爻，则逆折之辞浸多，而初、上两爻，尤以戒告居其大半。\n乾之卦辞，在六十四卦中最为纯粹，可谓无对；然时迁则辞异。初九当健德初萌，故有潜龙之戒；上九健德已极，极则将反，故申亢龙之悔。如是，乃可无咎。\n坤之初、上则异。乾所戒者在己，故曰勿用、曰有悔；坤所戒者在物，故曰履霜、曰龙战。霜之始凝，小人之道所由起也，当及其未盛而图之，图之于早，慎之于微，毋令积渐而成坚冰。若阴势已张，至与阳相疑相攻，则为君子者宜昭然有别：乾坤之分不可混，天地之位不可易，持此以观变，斯可矣。\n合而观之，乾道、坤道皆君子所当行，而其间有大辨焉：乾道无适而不可，坤道则有时而流为小人之道。此《易》所以扶阳而抑阴也。"}},"03":{"id":"03","cnNum":"〇三","name":"屯","pinyin":"zhūn","fullName":"水雷屯","shortFullName":"水雷屯","upper":"坎","lower":"震","upperNature":"水","lowerNature":"雷","lines":[1,0,0,0,1,0],"yaoLabels":["初九","六二","六三","六四","九五","上六"],"blocks":{"P":"屯者，乾坤之次，卦之第三也。其名何自而取？《序卦》之意，谓两仪既判而后有物，物充塞乎两间，故二卦之后受之以屯；屯之训为盈，又训为物之初生，盈者言其充塞，初生者言其始萌也。六十四卦之次，乾坤统体于天地，自余六十二卦，则天地交感所成之万象是已。屯适当交感之初步，故为诸卦之首出者，其象为群生方萌、弥漫于上下。古人论开物之初，以为群品杂糅而未判，气机壅阏，通泰无自而开；如是之时、如是之状，命之曰屯。乾坤之后所以继以此卦者，正取此义。若夫卦画，则下震上坎：震，动也；坎，险也。以动之体，行乎险之中，此屯难所由起也。《彖传》“刚柔始交而难生”一语，最得全卦之要领。\n虽然，屯之为难，非他难可比。盖发于经营伊始，而必终于克济。新芽处土中，屈而未伸，一旦裂土而出，遂成畅茂——其势然也。屯卦垂教，亦在是：欲济此难而收其成，两途并进。其一曰居贞，固其本根而不躁举；其一曰建侯，使统率有所归。","G":"屯，元亨利贞，勿用有攸往，利建侯。","G.N":"乾、屯两卦，辞同而指异，未可一例视之。乾之四言，字各一义，凡四义；其所昭示者，天之道也，自然之序也。屯则不然，四言而两义：元亨为一时，利贞为一时；所昭示者，民之故也，人事之理也。元亨者何？大通之谓。利贞者何？宜固守而不失其正之谓。故屯虽艰难，而大通之几已寓其中，久之自底于畅遂。然其枢机，全在固守本根、不遽动而已。\n“勿用有攸往”，谓不宜有所前往。其旨盖谓：艰屯之日，缓于开拓而急于立侯。建之为言立也，侯之为言君也。国方草昧，莫先于有君；有君则统纪立，号令行。“利建侯”三字假事为喻，而其理可推于万事：小之一身，大之邦国，凡值此者，所当用力，皆在己之内治，不在外求。","T":"彖曰：屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。","T.N":"“刚柔始交而难生，动乎险中，大亨贞”——刚柔云者，乾坤两三画卦之名也；始交云者，乾坤之相交也。全《易》六十四卦，乾坤自为纯体，自余诸卦，莫非以乾坤之六画相错而成。屯次乾坤，实交错之最先者，故曰“刚柔始交”。交矣而通畅未致，譬天地之始生物，气未条达，故曰“难生”。“动乎险中”者，下震上坎：震之德主于动，坎之德主于险。动而向上，适与险会，动与险会而难象成焉。此二语，所以释卦名也。\n自“大亨贞”以下，乃释卦辞。屯固主难，然难之中未尝无大通之理存焉；二者相须，非相掩也。\n“雷雨之动满盈”，则大通之象也。二气初交之际，郁塞方甚。然震之象为雷，坎之象为水，积时既久，雷必作，雨必降，阴阳必谐。及夫雷雨弥满，充塞无间，则百昌之生，勃然竞出，谓之大亨，不亦宜乎。\n“天造”者，时运之谓；“草昧”者，晦冥纷纠、未就条理之谓也。邦国初造，先务在立君以正其统，故曰“宜建侯”。虽然，君立而遂谓无事，则不可；居心犹当忧勤戒惧，不敢即安。","X":"象曰：云雷屯，君子以经纶。","X.N":"雷动于下，云兴于上，雨泽未施，此正屯之象也。“经纶”旧解析为二字，实则一辞，谓经理而经纬之。君子观屯之象，取其义以自用，举而措之邦国天下。","Y1.T":"初九，磐桓，利居贞，利建侯。","Y1.N":"磐读为盘。盘桓，谓欲前而却、迟迟其行也。初九，阳也；阳之才刚而明。有其才而位乎下，当屯之世，未足与俱济，故盘旋而不进。使其不盘而径进，险阻将乘之。然则处此者奚宜？曰居贞。贞者何？正而已。正立乎中，则难可出也；舍正而他图，未有能济者。抑盘桓非漠然无事也；可操而不可废者，唯“建侯”耳。","Y1.X":"象曰：虽磐桓，志行正也。以贵下贱，大得民也。","Y1.XN":"初九之盘桓，非不欲进，势格之而不得进也。身虽未进，而所存之志则归于正。《易》家之例，阳为贵，阴为贱。以阳刚之尊，肯屈居于众阴之下，此贵而下贱者也；惟其能下，故众所归附，得民为最厚。","Y2.T":"六二，屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。","Y2.N":"一爻之旨，总归于踯躅却顾、迟回而不决。乘马者，跨马将发；班如者，旋复下马。欲行而终未即行，此其状也。句中“如”字，语助耳。《易》辞凡叠一“如”字者，大抵两端未定之辞。屯、邅二字，并是难行之貌。\n“匪寇婚媾”者：二所属意，在六五；使非初九以刚逼处于下，则二已就五而成婚媾矣。是亦有行意而卒不获遂之辞。\n“女子贞”者：二本阴爻，女子之象；以阴居阴，位中而正，故系以贞。“字”训为育。育者，女子之常；不字，则废其常矣。位中体正之女，当育而不育，屯之时为之也。十者数之小盈，万者数之大盈。“十年乃字”，盖言今日不育，积之十年，终有育时。","Y2.X":"象曰：六二之难，乘刚也。十年乃字，反常也。","Y2.XN":"六二之难，起于所居在初九之上，为阳刚所迫。生育者，女子之常；不育则失常。二以阴居阴，得中得正，本宜顺遂，顺遂方是其常。今虽失常，终必复常，犹女子一时不育，其后毕竟有育。","Y3.T":"六三，即鹿无虞，惟入于林中，君子几，不如舍，往吝。","Y3.N":"即鹿者，就而逐之也。虞，山泽之官，行猎必以为导；无虞，则无导之者。几者，动之微、兆之先见也。舍，止而不为。吝与悔相对待：以阴阳刚柔动静分配之，悔归于阳、归于刚、归于动，吝归于阴、归于柔、归于静；过刚者流于悔，过柔者陷于吝。盖行而过当，过则舛，舛则悔生；悔而不已，未有不流于吝者。所谓吝，正指失误既成之后，委靡颓堕、不能自振的那副光景。\n古者田猎，虞人职其驱逆：以车驱禽兽，使之离林莽而赴平野，猎者乃得而取焉。无导而逐，鹿且窜于深林，虽有善猎者，无所用之。君子见微而知著，故弃之若浼；强求不已，则吝与穷俱至。\n六三之遭此，何也？请以位求之。凡卦之画至第三而变，其位既偏而不中，又介乎上下之间、际乎内外之界，进退皆难措足。屯之六三，以阴处阳，不中不正，又居震体之终，上无正应。揆之以理，宜静俟而已；然震动之极，其性难安，遂不能自制，有躁动而外求之志。","Y3.X":"象曰：即鹿无虞，以从禽也。君子舍之，往吝穷也。","Y3.XN":"从，如其欲之谓。“从禽”者，贪也；心逐于禽，而智为所掩。其所以然者，志专于得，故无导亦前，不暇问其济否。人之嗜利禄者亦然：心一动于外，遂强求其所不当求。“君子舍之”，言君子不为是也。使无导者在侧，鹿虽当前，君子不顾；为其所得不偿所困也。","Y4.T":"六四，乘马班如，求婚媾，往吉，无不利。","Y4.N":"六四之才，柔也；其位，则近君而得正；其于九五，又相得也。然柔者难独任，非借力不能济屯，故宜有待而动。故其辞曰“乘马班如”：已驾而复下，行而复辍。所与为正应者初九，是固己之婚媾也。苟能下求初九，与之俱进，以夹辅九五之尊——九五刚而处中——如此则吉，且无往而不利。","Y4.X":"象曰：求而往，明也。","Y4.XN":"六四自知力不能济屯，转而求贤者初九与己协力，此正其明处。","Y5.T":"九五，屯其膏，小贞吉，大贞凶。","Y5.N":"膏者，膏泽也。“屯其膏”，谓蓄聚润泽于上而不下及于物。九五以阳居阳，守中处正，本属优裕之地；然身在屯难，陷于坎险，下乘阴爻，左右无得力之助，甚且内外隔阂，遂难有建树。此即“屯其膏”之谓。欲解此困，首在持重。积渐以理其纷，纾徐以脱其困，是之谓小贞；小贞则功可期。若举步太骤、程限太迫，求成于旦夕，是之谓大贞；大贞未有不败者。","Y5.X":"象曰：屯其膏，施未光也。","Y5.XN":"所谓屯其膏，状其虽有德泽，而未能光显于外也。","Y6.T":"上六，乘马班如，泣血涟如。","Y6.N":"二、四、上三爻，辞同而旨异，皆系以“乘马班如”，皆状其踌躇进退也。六二、六四之所待者在人，故徘徊而不遽前；上六则无所待。上六处一卦之终，又踞坎险之极，屯之将通，其在此时乎。然阴柔之质，与六三又非正应，欲自拔于困而转屯为通，力有不能。于是忧愤填膺，泣下不止，至于血随泪出，涟涟而未已。","Y6.X":"象曰：泣血涟如，何可长也。","Y6.XN":"血泪纵横若此，岂能久乎？究其所至，非屯尽而通，则终底于亡；两者之外，无可复俟。","Z":"屯之为屯，其义固不限于一时一事也。大而邦国天下之大势，小而匹夫匹妇之细故，皆有时而蹈之。然普遍之中未尝无殊异，殊异者，六爻之分是也。同处一屯，而所遭各别：初九之屯，才可有为而时犹未至；六二之屯，外迫于刚，所遇多艰，最宜静俟；九五之屯，泽壅于上而不下逮，宜渐不宜骤。余三爻者，亦各有其故，不可一概而论。盖六爻共在一卦，故屯之共性咸备于身；所居之位既殊，故其个性亦随位而见。合而观之，屯之大体明；分而观之，六爻之曲折尽。"}},"04":{"id":"04","cnNum":"〇四","name":"蒙","pinyin":"méng","fullName":"山水蒙","shortFullName":"山水蒙","upper":"艮","lower":"坎","upperNature":"山","lowerNature":"水","lines":[0,1,0,0,0,1],"yaoLabels":["初六","九二","六三","六四","六五","上九"],"blocks":{"P":"屯之后次以蒙，其序非偶然也。《序卦传》谓物既始生则必稚，稚即蒙，故屯蒙相衔。凡物初生，皆在幼弱；幼弱之征，在童蒙未启。蒙者，昧而不明之谓。然此不明不起于本体，乃为他物所蔽而然——镜面著尘，目睛生翳，尘翳既去，明固自若。故一部蒙卦，所重惟在开其蔽、善其教，非徒纪象数也。昔贤谓屯之主建侯，是立君以统之；蒙之主求我，是立师以导之。君师二义相承，其说可从。\n卦体上艮下坎：艮为山而主止，坎为水而主险。合而观之，山压于上，险伏于下，遇险不前，泉脉初涌而尚无所往，蒙之象也。人之初生、物之始育，稚昧而前路未分，正与此符，是以名蒙。物生既遂，不可无诲，此屯蒙相次之理也。","G":"蒙，亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告，利贞。","G.N":"蒙之为义，就人及庶物之初生言：其时童稚，识见未开，若有所蔽。然蔽者非其本色，明乃其本色，故终必受启，由昧转明，此亨之所以可致。“亨”字以下，即言启之之方。\n卦中所谓“我”，九二是也，司启者当之；“童蒙”则六五，被启者也。二者相对，即教者与学者之分，全卦肯綮系于此。辞先言童蒙求我，而不言我求童蒙，用意甚明：教之成否，视学者有无自发之志。孔子云“不愤不启，不悱不发”，正与此合。“初筮告，再三渎，渎则不告”，假占筮为喻，见求教者须出以诚悃，一而不渎。末言“利贞”，则戒启之者自守以正，不得以邪径诱人。","T":"彖曰：蒙，山下有险，险而止，蒙。蒙，亨。以亨行，时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。","T.N":"“蒙，山下有险，险而止，蒙”——此以两体之象定卦名。内体为坎，坎之德险，涉乎险则不可以久居；其外则艮，取象于山，德在于止；既已止矣，岂宜更有所往。既不可安，又不可进，人于此茫然莫知所措，昏蒙之状具焉，卦所以名蒙也。\n“蒙，亨。以亨行，时中也”——以下乃即卦体以释卦辞。蒙与亨若相反而实相因：蒙者不能终蒙，终必开发，开发则亨。行与止对举，缘险而止，亦必缘亨而行；当止而止，当行而行，是之谓时中。一卦之中，止象与行象并见，何也？以有位焉，足以见时中。位者何指？指九二。二得六五之正应，此之谓时；二居下体之中，此之谓中。\n“匪我求童蒙，童蒙求我，志应也”——“童蒙”谓六五，“我”谓九二。求之者在下，应之者在上，故曰非九二求六五，乃六五求九二。其机在“志应”。志应非一厢之辞：六五应二，固已；九二之于六五，亦有应之者存。教者未尝先求学者，然其中自有乐教之诚与作人之志，默感而潜发之，学者乃肯来求，是与教者之志相应也。无感则无应，志应必两面相赴而后成。\n“初筮告，以刚中也”——初筮者，学者初至，执诚敬之心，求解其惑；为之师者，当告而启之也。告者谁属？卦中四阴皆为蒙，二阳皆为治蒙之人。上九刚而过中，未足当之；刚而处中者独九二，能任启发之责，故曰“以刚中”。\n“再三渎，渎则不告，渎蒙也”——夫蒙非终于蒙者，其势必开，开则谓之亨。亨者，蒙之究竟，非与蒙相戾也。然开之有其具，具者何？前所言志应、时中而已。两志交孚而后发，发焉而无所壅，一启即达，是乃所谓时中。若志不应而急于求亨，则告者虽勤，发者无自，浸假而求者遂至于再三。至于再三，则其志之未尝应，亦已著矣。求不以时，告不以分，两俱失之；失则渎矣。渎者，狎也；狎者，敬之反。筮不以敬，神弗告；学不以敬，师亦不当告，告则“渎蒙”。世以为渎在蒙之渎师，实则不然：屡求屡告，蒙者未获开发，而本有之质先已淆乱，受其损者乃蒙，非师，故曰“渎蒙”。\n“蒙以养正，圣功也”——蒙必有所养，天真纯正之性乃能不失。养蒙之功，圣人之事，非恒人所能办。养与发非二事，而养之义稍宽。故治蒙者，当视其机之至与未至：机至则为之开，未至则姑舍焉，全其天资，俟其自化。若求效太急，穿凿以强开，则所伤多矣。","X":"象曰：山下出泉，蒙。君子以果行育德。","X.N":"山下出泉，甫出而阻于险，如人方在幼眇，趋舍未定。昧然无所向，此蒙之象，卦名所由立也。君子有取于斯，非徒玩象，将以措诸事为，其道有二：行也，务于必果；德也，务于有本。泉之初发，涓滴缓弱，然其赴壑也决，遇险不避；山体凝然不动，而泉自其下涌出，昼夜不舍。故其动也如水之必行，断而不疑；其积也如水之有源，本深而未流长。","Y1.T":"初六，发蒙，利用刑人，用说桎梏，以往，吝。","Y1.N":"初六体阴而处最下，故爻辞之“蒙”，可目为编户庶民。启斯民之蒙，其便在于“用刑人”。所谓用刑人，非以苛法虐之，乃立为明确定当之科条，布告于众，使知所畏守，不敢纵恣，然后渐摩而纳于教化。“用说桎梏”，说读为脱；桎梏者，械手缚足之具。若舍立法示禁一途，甫发其端即尽撤防闲，使之无所忌惮，则终必有悔，故曰吝。","Y1.X":"象曰：利用刑人，以正法也。","Y1.XN":"爻辞言“利用刑人”，其旨归在“正法”。法者，悬一定之程于上，使人共见共喻，日用饮食之间皆在规矩之中，久而与法相安，教化自生，非以刑立威也。","Y2.T":"九二，包蒙吉，纳妇吉，子克家。","Y2.N":"初爻所陈，治蒙之通法也。三、四、五三爻皆在被治之列，而主其事者为九二。二之治蒙，其要安在？曰“包蒙”，曰“纳妇”。包者，含容之谓。二以刚明处中，上应六五，其责在开天下之蒙，举一世之人皆纳诸所治之域，无间于亲疏远迩，不遗一夫。“纳妇”者何取？合卦观之，阳爻惟二与上，二刚而居中，为发蒙之主、一卦之宗，众阴莫不愿归，而二亦乐受之。既有此量，复与诸蒙者情意相得，若纳妇然；以卑下之位居尊长之事，又若冢子代父持家者。如此而治蒙不竟、不获吉者，未之有也。盖兼覆并容，乃能化之。","Y2.X":"象曰：子克家，刚柔接也。","Y2.XN":"“子克家”之故，在“刚柔接”。刚谓九二，柔谓六五，接者，两相配合之谓，即二五之应也。为父者委任于子而无猜，为子者乃得尽其才；九二之能负荷家事，正由六五举国听之而不疑。","Y3.T":"六三，勿用取女，见金夫，不有躬，无攸利。","Y3.N":"六三于四阴之中，亦被治者之一。诸爻致蒙之由各别：初失于未受教，四失于不务学，五失于材质未开，皆缘外而然；独三不然，其蒙出于自修之不力。故爻辞为治蒙者戒：“勿用取女。”三之女，非正也，取之则累。何以知其不正？三以阴柔之质，位既不中又不当，为女者宜待其正应之上九，乃不待而悦于近侧之九二，见可欲而心动，舍正从邪，身且不自守，何取焉。","Y3.X":"象曰：勿用取女，行不顺也。","Y3.XN":"戒以“勿用取女”，正为其行不顺也。顺者循理之称，三舍正应而即近，舍理而行，故不可取。","Y4.T":"六四，困蒙，吝。","Y4.N":"一卦之中，六四所处最穷。九二、上九皆在其远，左右又皆阴，无正应之援，亦无邻近之阳为之发，是以谓之困蒙。处困蒙者，出而任事，则失道而鲜助；退而向学，则鄙陋而无闻。吝之为言，不足也。不足者，可鄙之辞。","Y4.X":"象曰：困蒙之吝，独远实也。","Y4.XN":"虚者为阴，实者为阳；蒙卦以阳刚任发蒙之责，故实处即贤者所在。六四之困而可羞，其要在于去阳最远，欲亲贤而无由，非其才之尽劣也。","Y5.T":"六五，童蒙，吉。","Y5.N":"六五体柔而履尊，下与九二为正应。柔顺者其所禀，刚明者取诸人；以柔御刚，以己从贤，以此临蒙，何功不遂，宜其吉也。此爻所谓“童蒙”，与卦辞稍异：卦辞第取其昧，爻辞则取其心纯一未发、有待于人。使居是位者能体此义，必自处以童幼之愚，不先自用，推诚委任，举国柄而付之贤臣。","Y5.X":"象曰：童蒙之吉，顺以巽也。","Y5.XN":"五能自居童蒙，倾心以问于九二，是以吉也。其吉之所由，在“顺以巽”。顺者，虚己而受人之言；巽者，能纳人之言而形诸事为。二者相须：有顺无巽，则闻善而弗行，所谓从而不改者也。明主之听贤臣，兼此二美，故言入而政举。","Y6.T":"上九，击蒙，不利为寇，利御寇。","Y6.N":"卦中二阳皆任治蒙，而所施不同。九二刚而得中，所覆者广，其法主宽，故曰“包蒙”。上九刚之极而失中，其所治乃昏昧之尤者，非痛加惩创不能入，其法主猛，故曰“击蒙”。虽然，击之道难言矣：其要在权其轻重，审其限界。施之不过其分，名正、术当、理足，则足以“御寇”；一有溢出于分者，操之过蹙，击之过暴，为害反大，治之者自身亦陷于寇矣。故御寇为上，为寇则不取。","Y6.X":"象曰：利用御寇，上下顺也。","Y6.XN":"所谓“御寇”，谓居上者未尝用暴烈之威，而昏顽者自格，上安其位，下循其分，两得其顺，斯之谓御。","Z":"蒙卦所论，教之事也；其纲其旨，多见于卦辞。全卦六爻，阳二为治蒙之人，阴四为受治之蒙。初与上相对：初以刑立防而启其端，上以兵示威而攻其痼。二与五相对：二居下而统众，含容最广，五以童稚之姿就而受教，一施一受，教者学者之典型具焉。三与四相对：三之蒙生于己，四之蒙困于时。之二爻者，皆自弃而不求教之类也。六爻之序，实以两两相形见义，其义固相待而成；读者循此以求，全卦脉络可得而寻也。"}},"05":{"id":"05","cnNum":"〇五","name":"需","pinyin":"xū","fullName":"水天需","shortFullName":"水天需","upper":"坎","lower":"乾","upperNature":"水","lowerNature":"天","lines":[1,1,1,0,1,0],"yaoLabels":["初九","九二","九三","六四","九五","上六"],"blocks":{"P":"卦序蒙后承需，《序卦传》释其故，谓物之初生，蒙昧而稚弱；稚者非养不育，而养之最切者，饮食为大。需之所由系于蒙后，其义具于此。作者排比诸卦，先后非任意，观此可知。\n需字古训为待。《左传》哀六年称“需，事之下也”，哀十四年又称“需，事之贼也”，二处皆作等待解。然左氏视待为事之害，《易》则谓势有不得已，待乃不可废，待而善，且为利。柳宗元记郭橐驼种树，植毕即去，不复省视；他植者则朝夕抚弄，甚至剥肤以验其枯荣，撼根以察其疏密，树反萎败。橐驼独能使树无不活，且硕茂早实，其术无他，善俟而已。《史记》称曹参为相，日夜饮醇酒，不事事，而民安其业、生产日殖。种树与治国，事之巨细不同，而理未尝异：皆不急近功，能舒徐以俟其成。此正需卦之义。\n更验之卦体：下乾上坎，乾性刚健，势必欲前，遇坎之险而阻，则舍待无由。乾不因险而改其健，亦不因健而轻犯乎险，此需之所以为需也。","G":"需，有孚，光亨，贞吉，利涉大川。","G.N":"“需”以等待为义，而等待非无所待之谓。所待者时，所恃者“有孚”。孚者，信也；有孚，谓诚意充积于中，非外貌之从容可比。\n作事而不知俟，一味求速，未有不偾者；然亦有明知当俟，而中无凭据，则其俟也为空俟。能俟与有可俟之具，二者相须，缺一不可。\n勾践困于会稽，屈己事吴，未尝与之争锋，似乎一无所为矣。然其十年生聚、十年教训，府库日充，士卒日练，故一旦乘衅而动，终以复国。向使徒有忍诟之心，而无积聚之实，则虽俟百年，亦何益哉？\n求之卦画，中实之象唯九五当之。此爻刚健而不偏，居坎体之中，位又在至尊，孚信内充而所守不失其正，故合卦以其为主。其遇险而止，非力不能进也，能自裁而不肯轻进耳。逮时至而进，光明亨通自随之。持之以正，以正制邪，则险在前而不足为碍，何施不济？虽大川之险，亦可越而过之。\n卦辞三层，各有专属：“有孚光亨”，言其所行之路；“贞吉”，言其所致之由；“利涉大川”，言其所收之效。","T":"彖曰：需，须也，险在前也。刚健而不陷，其义不困穷矣。需，有孚光亨，贞吉，位乎天位，以正中也。利涉大川，往有功也。","T.N":"需训为须，须亦即待。卦所以取此义者，以坎在体外，坎者险也，横据于前，内卦三阳为其所格，势不得遽进，故暂止而俟。\n乾之体刚健，就本性言，本主动、主进；然其动也有节，遇险则止，不轻举，不躁趋，亦不至陷没于险中。时当行则行，是有所为；时当止则止，是有所不为。有为有不为，此其所以不困不穷也。\n凡此三善——孚、亨、吉——所自来，非偶然也。《彖》举其故曰“位乎天位，以正中也”。卦中上、五两爻为天位，九五一阳居之，既得中，又得正，位与德两皆有利，故能静以俟时；时既至而有所施为，则功无不成。","X":"象曰：云上于天，需。君子以饮食宴乐。","X.N":"乾象天，坎象云。云浮于天而未坠为雨，正是有所须待之候。坎本水也，此处不言雨而言云者，水之在天，凝而未降，只可名云，未可名雨，故取云而不取雨。\n君子观光此象，移等待之理于当世之务：审时度势，时未可为则不为，退而饮食宴乐，以蓄其力。所谓饮食宴乐，乃设譬之辞，重在养精蓄锐于将发未发之际，非教人耽嗜也。后世昏庸之主沉湎酒色，自隳其志，与《易》旨判然两途，不容混为一谈。","Y1.T":"初九，需于郊，利用恒，无咎。","Y1.N":"古者国野异制：郊门以内谓之国，郊以外谓之野，而郊适居二者之间。“需于郊”之取象，正谓初九居需之初，于坎水之险相去最远，仓卒蹈危之事，在诸爻中为最少。\n然初九体阳，阳刚之资勇于赴前，最易一往而不返，亦即最易失其待之常度。故爻辞就其所处而戒之：处郊之时，所贵惟在能待，积日累久而不易其守。守之既固，则咎无从生。","Y1.X":"象曰：需于郊，不犯难行也。利用恒，无咎，未失常也。","Y1.XN":"需于郊者，谓迟回于空阔之地，时未当进，则不冒危而前。“利用恒，无咎”云者，其要只在恒久不移，即终其身不犯难而行，是之谓“用恒”。恒者何？不失其常而已。\n然不失常一节，实为至难。刚健之士，或激于才气，或动于意气，或迫于事势，一念猝发，理智不能制，往往径情直前，偾事而后已，此处最宜自省。\n今人恒言“坚持就是胜利”，语虽浅近，其意与此爻《小象》所云，大略相类。","Y2.T":"九二，需于沙，小有言，终吉。","Y2.N":"坎为水，水滨有沙。九二之位，去坎险已杀其一间，故取“需于沙”为象。沙者，水陆之交，进而逼于险，退犹未入于险，是近之而未至者也。\n患害虽未及身，口舌之伤则已不免。然九二不为浮议所摇，宽然处之，俟其自定，终必获吉。","Y2.X":"象曰：需于沙，衍在中也。虽小有言，以终吉也。","Y2.XN":"衍字之义，《说文》以为“水朝宗于海”之貌，段注推而广之，谓凡物有余皆得名衍。此爻所用，正取宽绰有余之意。“衍在中”云者，所指即九二也。\n九二刚而居柔，刚不至于亢，柔不至于靡，宽裕适中，绰然有容。故口舌之伤虽小有之，亦能徐以待之，外言不能摇其中；其终获吉，理固宜然。","Y3.T":"九三，需于泥，致寇至。","Y3.N":"泥者，水边湿淖之地，其去水也逼矣。需于泥，虽未身入险难之中，而险难之界已到，所谓危在顷刻者也。\n寇谓外患，害之大者。九三之质过刚，位又不居中止，而在乾体之上层，与坎险紧相邻接，此其势最有招寇之虞。","Y3.X":"象曰：需于泥，灾在外也。自我致寇，敬慎不败也。","Y3.XN":"外者，外卦，谓坎也。九三邻于坎而未入于坎，故曰灾在外。\n灾既在外，则来与不来，两皆可能，而其柄实操于九三之手：使之来者九三，使之不来者亦九三。若寇果至，是九三自召之也，于外物何尤？\n然则为九三者宜何如？曰：敬以事之，慎以出之，量其宜而后进，俟其时可动而动，毋以一朝之忿尝试于危地。","Y4.T":"六四，需于血，出自穴。","Y4.N":"血属阴，其性循分而安，不乐争斗。“需于血”者，六四以阴爻居阴位，其所取者，亦惟安分待时之态而已。\n然就全体观之，需者当是内卦三阳之需坎，非坎之需三阳。六四亦系以需者，盖三阳雍容徐进，初无急迫之形；坎虽险，实无如三阳何。况四之为爻，柔顺而当位，验其本心，初无撄三阳之锋之志。\n“出自穴”，则谓六四舍其所安之地，退避一旁，使三阳得路而前也。","Y4.X":"象曰：需于血，顺以听也。","Y4.XN":"此爻之义，可自两端观之：其处己也主于顺，其接物也主于听。顺者何？九五刚中而正，与四相比，四以柔承之，不敢自专也。听者何？内卦三阳方进，四不塞其途，听其自来而已。","Y5.T":"九五，需于酒食，贞吉。","Y5.N":"九五刚健中正而处至尊，需卦之义于斯为盛，故一卦之主在焉。“需于酒食”，设譬之辞也。其本义不过主人治具、酌酒进食以款宾。推之政事，则人君所以经理天下国家者，亦有其道：省事而静，与民休息，使之各安其业、各遂其欲，则不待驱迫而自趋康乐。此即所谓“需于酒食”也。\n三卦相承，各有专主：屯以治，蒙以教，需以养。养之义，卦中无以明之，故假酒食为喻，需之根本旨趣，实具于此爻。\n虽然，以酒食养天下，亦有其节：过则伤，率则乱，必也守正而不逾，乃为得之。正则吉，失正则凶。","Y5.X":"象曰：酒食，贞吉，以中正也。","Y5.XN":"《小象》此语，所以明九五既能以宴乐涵养天下，又能守正而成其功者，其故安在。\n盖九五所居，既得其中，复得其正，有德以副其位，有位以行其德。故虽处坎险之中，而其乐也不流，其求治也不迫，终不至溺于所安。","Y6.T":"上六，入于穴，有不速之客三人来，敬之终吉。","Y6.N":"需卦两阴爻并为穴象。六四之“出自穴”，是避而下体三阳，让之以进路也。上六则已抵坎险之尽处，前无可往，退无可避，惟有宁处险中而不动，此“入于穴”之所以取象。\n当是时也，下体三阳不召自至，其势汹汹，于上六有逼。上六阴也，又居险之终，肩负既弱，力不能抗，所能自免者，独有“敬之”一途。\n所谓敬之，于三客则含垢忍辱，逊以相接，敬而不争，不与校曲直。如是，则险可转平，困可自脱。","Y6.X":"象曰：不速之客来，敬之终吉。虽不当位，未大失也。","Y6.XN":"《象》所谓不当位者，主上六立说，非斥三阳之闯然自至也。上六阴居阴位，于例正当，而《象》乃云“虽不当位”，其故可思。\n盖此为假设之辞，非判其位之失也。意谓处三客者，术惟在敬；敬既尽，则事变虽繁，终必无所陨越。就令其位不当，犹不至有大失，而况其位本自不差乎？","Z":"需卦所标，为人生与政治之通义：险陷当前，未可以力取，则当审时度势，可进则进，不可进则容与之俟，躁急而骤趋者必败。此义于九五见之最著——刚健、中正而居尊位者也。卦辞、《彖》、《大象》，皆由此立说。\n然同是险陷，而时异、地异、势异，则所以待之者亦不能一律。内卦三阳，所同者戒躁进而已；至其地去险有远近，则操持亦有重轻：初九需于郊，最远而最缓；九二需于沙，渐近而稍谨；九三需于泥，逼险而愈严。次第秩然，不可紊也。\n六四、上六则身履坎险之中，其地与四阳异，故其辞有顺听、敬慎之别；然推本而言，终亦不外乎待之一义。"}},"06":{"id":"06","cnNum":"〇六","name":"讼","pinyin":"sòng","fullName":"天水讼","shortFullName":"天水讼","upper":"乾","lower":"坎","upperNature":"天","lowerNature":"水","lines":[0,1,0,1,1,1],"yaoLabels":["初六","九二","六三","九四","九五","上九"],"blocks":{"P":"讼之所以为讼，说的是彼此争执是非曲直、等候第三方判定，也就是今人所谓打官司。《序卦传》称“饮食必有讼，故受之以讼”：口腹之需人人皆有，需求相撞便起摩擦，故需卦之后紧接讼卦。以此说明卦序，理据其实单薄。然而它认定六十四卦的先后并非随手编排、其中有不得不尔的次第，这一识见却极可珍视。","G":"讼，有孚，窒惕，中吉，终凶。利见大人，不利涉大川。","G.N":"卦辞四字，宜逐字拆看。“孚”者，中心笃实、内无所虚饰之谓；“窒”者，前有阻塞、所欲遂者不得遂之谓；“惕”者，戒惧在心，纵被阻而不敢强求必通之谓；“中”者，情气和平，不发于激之谓。四者既备，其人内诚而外慎：可以不争，斯止之；势不得已而涉于讼，神志犹清，辞气不躁。吉之归也，正在于此。\n世俗以胜负论讼，赢者称吉，输者称凶。《易》则不尽然，吉凶随其所处之位而断，不执一辙。四字之中苟有阙焉，虽幸而胜，凶固在也。由此知卦名之立，非以劝人兴讼，实以劝人息讼。能息者最上；不得已而讼，亦唯守此可以无咎。\n“终凶”之辞，斥上九而为言。此爻踞一卦之末，争讼推求至此，更无去处，故系以此。就《易》所许，全然无争者上也；讼端既起、得人居间排解而遂中止者次也；执意到底、务求一决者最下也。“大人”者谁？九五其人也。刚健之主而位乎至高之地，一卦之中司听断者属之。当群疑交争之际，求一位德望足以压众者出而评断，此外更无可行而有利之路。\n需、讼二卦反对成偶，发端并标“有孚”，而下语遂分：一云“利涉大川”，一云“不利涉大川”。大川者，险之大者也；涉者，越而过之之谓也。坎在需为外体，中实而能安分，行止有节，险虽在前而足以越之；坎在讼为内体，则中实而不能安分，血气方刚、好胜使气之象寓焉，自制之力常不敌其锋。非不欲渡，无其具也。","T":"彖曰：讼，上刚下险，险而健，讼。讼，有孚窒惕中吉，刚来而得中也。终凶，讼不可成也。利见大人，尚中正也。不利涉大川，入于渊也。","T.N":"讼之名义，卦体已具。上体为乾，其德健；下体为坎，其德险。凡讼者，两相持之名也，非两有所挟，则无由而成。健者恃力而不肯屈，险者设机而不肯平，两者相值，而讼之所由起也。假令有健而无可险之地，气无所激，讼且不兴；若徒险而无健以副之，虽欲讼而力不逮，讼亦不成。此自两人对言：一人怀险，一人恃健，胜负之心相持于中，争端必作。更就一人之身言之：心伏险机而外示强健，则胸中先已交战，是谓内自讼。凡此二端，皆讼义所摄也。\n卦辞许吉，何以必系于“刚来而得中”？此语所目，九二当之。九二为一卦之主，刚而在中；刚则能立，中则不过，实积于内而无所虚饰，是谓中实；有孚之义，即由此立。窒塞之象亦由此生，惕惧之象亦由此生，和平不过之象亦由此生。夫卦义所取，本非一途：或据其象，或据其爻，或据其变，或据刚柔之相易——末一说即所谓卦变。讼则舍众途而独归重于九二。质言之，讼之所以为讼，系于“刚来而得中”一句而已矣。\n“来”字何解？其义有二：处下体之爻，可系以“来”，一也；处下体者又须于同体诸爻为异类，方得称“来”，二也。故下体二柔而一刚，来者惟此一刚；二刚而一柔，来者惟此一柔。九二居下体，初六、六三皆柔，独此为异，刚来之称由是而立。然此就全卦立论；分爻而观，则又别论。\n旧解于此，言人人殊。虞翻、蜀才（范长生）倡之于前，朱子《周易本义》承之于后，均以“刚来而得中”为卦变。其说谓：六十四卦之中，除乾坤两卦，余者悉由复、姤、泰、否、大壮、观、夬、剥八者转出，讼则自遯而来——遯之九三下居于二，六二上进于三，两爻互换，讼体以成。然汉人所创，非《周易》本有，出于附会，按之卦画，窒碍多端。苏轼、程颐起而非之，各出己意。苏说大略：一卦分为二体，一体必在震、坎、艮三阳卦之列，一体必在巽、离、兑三阴卦之列；六十四卦中具此格者，凡十有八。十八卦中之阳体，其初皆坤，乾以一刚畀之，消去一柔，乃成震、坎、艮；其阴体，其初皆乾，坤以一柔畀之，消去一刚，乃成巽、离、兑。刚柔互易之迹止见此十八卦，过此则无，故卦变之论亦惟此十八卦足以当之。持苏说以量讼，讼不入其格，自无卦变可言。苏氏由《彖传》推得，其说可从；委曲详见贲卦《彖传》解。\n何以云“不可成”？盖讼者，势迫而后应，非人所乐就，其发端已非美事。既入其中，则理得而止为善，见伸即已，不当终极其事；推而至于究竟，凶乃随之。爻中当此者，上九是也。\n至若“利见大人，尚中正也；不利涉大川，入于渊也”，则谓讼之所贵，在得公平之断；而断之能平，惟出中正，故大人宜见。九五刚而居中，位复得正，任此有余。又讼之事，当以理屈人，不当以力角胜；当自处平夷，不当履险。险一入焉，如坠深潭，回旋无所，故曰“不利涉大川”。所谓渊者，即坎体之险；讼而涉之，是自投于不测也。","X":"象曰：天与水违行，讼。君子以作事谋始。","X.N":"天之气上腾，水之流下注，二者背道而行，两不相下，此即争讼之象，卦所以名讼。君子观之，何所取法？卦辞但言“中吉”“终凶”，仅就末流言之；大象更补出“作事谋始”四字，盖欲人于举事之初便条理其间的人我分际，使争端无自而萌。","Y1.T":"初六，不永所事，小有言，终吉。","Y1.N":"初六以阴爻而居下，才弱力微，本非能讼之人。爻辞称“事”而不称“讼”，正因衅端初萌，案未成也。苟能于此时歇手，不将此“事”拖长，则虽已生些小违言、略损于己，终局仍归于吉。","Y1.X":"象曰：不永所事，讼不可长也。虽小有言，其辩明也。","Y1.XN":"以初六之柔弱论之，原无兴讼之资。今乃为人所迫而卷入其中，善处之法，唯在不使此事久悬。若一味缠斗，非徒胜不可冀，祸患且将随至。其曰“小有言”，则口舌之扰势所难免；然毕竟只是口舌，双方易以情理解释，稍与剖辩，是非既明即可罢休，故终获吉。","Y2.T":"九二，不克讼，归而逋，其邑人三百户，无眚。","Y2.N":"九二以刚爻陷于险中，是一卦之主讼者。然其所对者九五：两爻皆阳，刚与刚不相求而相抵，衅由是起。顾九五以阳处阳，位为至尊，德又中正，九二岂其匹哉？强弱既悬，讼固无由而成。计之上者，莫如引退，遁入所属三百户之小邑，伏而不出，庶几可以远祸。","Y2.X":"象曰：不克讼，归逋窜也。自下讼上，患至掇也。","Y2.XN":"九二自审力不能与九五相抗，遂避匿以自全。盖以下讼上，卑而犯尊，祸之来也，如俯身拾物，顷刻及之。","Y3.T":"六三，食旧德，贞厉，终吉，或从王事无成。","Y3.N":"六三以柔质处下体之上，与初六同类，同属不善讼者。初六虽已涉讼，然不使其久。息争既为作《易》者之本怀，二阴爻遂俱得终吉之许。“旧德”者，旧日所受之禄也；“贞”谓守而不移；“厉”谓身在意危之地；“从王事无成”者，谓随上九之后而动，功成而不居其名。六三介于九四、九二之间，下乘九二之刚，上承九四之刚，处境可谓危矣。然危而知惧，止于分内，不与人竞，此其所以终吉也。","Y3.X":"象曰：食旧德，从上吉也。","Y3.XN":"六三当讼之时，前后皆刚，乘承俱危，而旧禄竟能不失。其故无他：能顺上而随人动，不肯自专生事而已。","Y4.T":"九四，不克讼，复即命，渝安贞，吉。","Y4.N":"“即”，就也；“命”，正理也；“渝”，改也。九四之质刚健，其位则偏而不正。以此质居此位，说它本性有争讼之好，并不为过。然而环顾四周，竟无一人可为其敌：九五在上，君也，非所敢讼；六三阴柔处下，力不能生讼；初六与之正应，方顺从之不暇，尤非可讼之列。左右前后既无可争之人，欲讼而无所施，故曰“不克讼”。当此之际，苟能收其躁竞之心，转就正理，化不安之贞为安贞之守，则吉可必也。","Y4.X":"象曰：复即命，渝安贞，不失也。","Y4.XN":"好胜而思讼，是九四的初念；及至临事，却肯以理智折之，转身向理，把不安之守换作安贞。此即所谓“不失”。得理者吉，失理者凶；胜负两字，在《易》的讼义里本无位置。","Y5.T":"九五，讼元吉。","Y5.N":"九五高居君位，职在听讼。断狱而曲直分明，剖决公平，其效至于民皆让路、争端自弭。此非仅无过，乃尽美尽善之元吉。","Y5.X":"象曰：讼元吉，以中正也。","Y5.XN":"九五之治讼而获元吉，其故安在？所恃者中与正耳。中则不偏，正则不私。以是心而辨曲直，发之不过于中，守之不流于邪，元吉之效，由此而立。","Y6.T":"上九，或锡之鞶带，终朝三褫之。","Y6.N":"讼卦六爻之中，初与上两爻的辞里都找不到一个“讼”字。初爻不载，是塞其源于将发；上爻不载，是绝其流于已极。一始一终，皆寓作《易》者不取争讼之意。上九以阳爻踞卦之顶，地势既便，遂凭其刚强，非把讼事办到尽头不肯罢手。似此之人，例无善果，鲜有不招祸自殒者。就令退一步说，他果善于争讼而卒获胜，甚且因此受车服之赐，荣宠亦不可久保，曾不终朝而三度见夺。","Y6.X":"象曰：以讼受服，亦不足敬也。","Y6.XN":"以穷极其讼而博得服命之荣，本非光彩，适足为人所鄙。","Z":"通观一卦，有一义贯乎其中：讼为不祥之事，唯无讼乃为至善。九五居君位，执中守正，不偏不私，天下之争终赖之以息。初六柔也，柔者不竞，故“不永所事”；六三亦柔，故仅“食旧德”而已。九二、九四俱属阳爻，皆具好争之性：然二对五，揣度力量不敌而止；四对初，审于理有未顺而亦止。所余者独上九，处卦之终极，其所应者六三，六三孱弱不能与之抗，故上九有取胜之望。然虽胜矣，甚或受服命之赏，终亦难逃一朝褫夺之耻。"}},"07":{"id":"07","cnNum":"〇七","name":"师","pinyin":"shī","fullName":"地水师","shortFullName":"地水师","upper":"坤","lower":"坎","upperNature":"地","lowerNature":"水","lines":[0,1,0,0,0,0],"yaoLabels":["初六","九二","六三","六四","六五","上六"],"blocks":{"P":"师者，众也；众者，兵也。古无养兵之制，籍民为兵，耕战同途。平居则耒耜力田，有警则征集成列，扶犁之夫一朝而荷戈，聚之即为众，驱之即可战。师卦所言，正是聚众用武、陈兵对敌之事。析而言之，其义有二：一为征集丁壮、编次行伍；二为发号出令、实行攻取。\n卦象所昭，可征者三：其体则地覆于上、水伏于下，水储地中，众聚之形也；其德则内怀险而外示顺，履险以顺，行军之状也；其爻则一刚五柔，孤刚处下而众柔听命，将帅之柄也。\n其列于讼卦之后，《序卦传》以为有故：争讼不已，势必聚众而相攻；兵端每起于户庭之隙。故讼终而师继之，卦次之所以然也。","G":"师，贞，丈人，吉无咎。","G.N":"贞之为言正也，谓举兵之名分不可不正。丈人者，才略、谋虑、德行、勋业四者俱高，为众所敬惮之人；帅师必属之此人。名正而帅良，斯得吉而无咎——战则克，人亦不以为暴。师卦论兵，扼要处止此两端。《易》之作者盖谓：兵事所先，一在辨此役之曲直，二在择统兵之其人。此语置之今日，犹未可废。","T":"彖曰：师，众也。贞，正也。能以众正，可以王矣。刚中而应，行险而顺。以此毒天下而民从之，吉又何咎矣。","T.N":"《彖传》前半释卦辞。“师，众也。贞，正也。能以众正，可以王矣”云者，其要在“以”字。以者，执而用之之谓，非徒拥众之谓。能执兵众之柄，使之说服心服、乐为所用，而所向又出于正，则天下可王。盖众而不正，是聚而为乱；正而无以用之，是令不行于三军。二者相须，缺一则不成。\n后半则取卦象以明“吉无咎”。“刚中而应”，就九二、六五两爻立说。九二以阳处下体之中，位在臣而才足统众，是帅之象；六五以柔居尊，是君之象。二爻相应，则阃外之寄专，君不疑其将，将得尽其能，功所由成也。“行险而顺”者，上体坤为顺，下体坎为险。顺者，师以义动而民悦；险者，兵凶战危而可畏。二义合观：兴师之举，毒害及于天下，然动而合顺，为生民除患，故民从之而不怨。胡炳文尝释“毒”字，谓王者之举兵本非所乐，犹猛药之攻疾，非沉锢之症则不轻试。","X":"象曰：地中有水，师。君子以容民畜众。","X.N":"坤为地而在上，坎为水而在下，水行地中，聚而不散，此师之象也。君子观此，得容民畜众之道焉。古之制，民即兵也：扶犁者释耒而操戈，无待外求，故牧养其民、安集其众，即为讲武之本。兵制与民政，在当时固一事耳。","Y1.T":"初六，师出以律，否臧凶。","Y1.N":"律者，军中之纪律也。臧者，善也；否者，不然之辞。二字连属，则指军法之废坠，与“以律”适相背，是谓失律。兵出之日，法度即当先立；苟立之而不行，行之而不尽，凶必随之。初六体柔而位卑，最易弛于约束，故爻辞以“否臧凶”为戒。然则“师出以律”何以不言吉，“否臧”何以独言凶？盖纪律者，制胜之阶，非制胜之券。守律而或败，亦有之矣，故不可径断为吉；若律一失，则败形先具，无可幸免，是以直言凶也。","Y1.X":"象曰：师出以律，失律凶也。","Y1.XN":"否臧之义，即失律也。军行而法度自随，此用兵之常经，非可以成败论者；胜负未形，吉凶难豫决。独至纪律一弛，则败征已著，故断之以凶。","Y2.T":"九二，在师中，吉无咎，王三锡命。","Y2.N":"此爻所陈，乃为将之道。九二处下体之中，一卦之主也，诸阴所归，而六五居中位尊，与之相应。以位言则臣，以望言则帅，政事中之统兵者，其象如此。受钺而出，专征于外，权不得不重。“在师中”之“中”，当就君臣分际上理会：阃外之事，制不在上，则事机屡失而功不成；制之太过，则尾大不掉而失臣节。惟专而能中，斯为得耳；得则吉且无咎。所谓无咎，非徒免祸而已，其功效必著于成功。功既可成，故终受王“三锡命”之宠。周官命数有等，爵服车马以次而加，三命为极盛之数。此与卦辞“师贞丈人吉无咎”之旨，固相通也。","Y2.X":"象曰：在师中吉，承天宠也。王三锡命，怀万邦也。","Y2.XN":"小象之作，孔子盖就爻辞所蕴的义理再推一层，政治与哲学两端皆在其中。将在外而能“在师中吉”，何所凭？凭君之信也。君之所以信之，又何所凭？凭其能“在师中吉”也。二者相因，如环无端，交相为用。王之三锡其命，非喜其有功而宠之，实欲绥怀万邦、广行仁政于天下。此正卦辞“师贞丈人吉”之注脚：“师贞”者，师出以义；“丈人”者，所择得其人，即爻辞所谓“在师中吉无咎”者也，其义与爻辞互为表里。","Y3.T":"六三，师或舆尸，凶。","Y3.N":"以位次言之，六三居九二之上；以爻德言之，质柔而位刚，中正两皆失之。此等人物厕身行伍，正如才不足以驭众而志则甚刚者，越过等夷而攘主将之权，遂令号令不一、各有所禀。兵在外而事权歧出，未有不败者。“师或舆尸，凶”，正为此设。舆者众也，尸者主也。谓师中若众自为主、人各持一议，则虽有九二之贤为其帅，亦无以善其后。","Y3.X":"象曰：师或舆尸，大无功也。","Y3.XN":"事权既分，主者不一，故劳而罔功。兵家之至凶，无逾于此。","Y4.T":"六四，师左次无咎。","Y4.N":"此爻所重，在临敌应变之活法。军礼之制，右尊于左，故以前行为右，以后却为左。军行止舍之次，《左传》有说：留一日者曰舍，再宿曰信，逾信而后谓之次。左次者，卷甲而退屯也。六四体柔而位阴，自度力不足以进，遂因时权宜，避坚而退。退则力不耗，隙可乘，静俟其变而后动。一时虽若无功，究竟无隙可议，且转圜在我，进击之机未尝失也。","Y4.X":"象曰：左次无咎，未失常也。","Y4.XN":"论者常谓：出师以求胜，欲胜必进。然势有不可进者，退而屯焉，正所以为进之地。主将能度势赴机，不守一辙，形似违常，实未尝违常——兵者本无定形，应变即其常也。","Y5.T":"六五，田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。","Y5.N":"六五体柔而据尊位，其下与九二相应，一卦之用兵者属之。其所当决者二事：师出有名与否，一也；付托得人与否，二也。名不正，则士气不扬，天下且得以曲议我；帅不良，则众心不服，虽众亦不能为用。此二者实兵家之根柢，卦辞与九二爻辞反复言之，至此而又言之，可见《易》之作者于军事研虑甚深。禽者，野兽之通称；言为语助。所谓田有禽，谓野兽阑入畎亩，残其禾稼。“利执言，无咎”，谓执而取之乃分所当然，非过举也。以喻寇犯吾疆，不得已而应之，名正事顺，无可讥议。“长子帅师，弟子舆尸，贞凶”：长子谓九二，弟子谓六三、六四。君人者既以众付之贤者，复使不肖者厕其间而分其柄，则师虽义举，终亦覆败而已。","Y5.X":"象曰：长子帅师，以中行也。弟子舆尸，使不当也。","Y5.XN":"九二阳刚而处中，以中道用兵，故长于指挥，此长子之实也。六五居尊而任之专，本无可议。所失在既任长子，又使六三辈参焉，权从中掣，咎当归于用人者。","Y6.T":"上六，大君有命，开国承家，小人勿用。","Y6.N":"此爻之辞统全卦立义，与上六一爻之象无涉。所谓大君，六五是已；上六居其末，受命而司黜陟。“开国承家，小人勿用”八字，即“大君有命”所命之事。战事既毕，第其功而加赏：勋大者胙之以土，列为诸侯；次者食其采邑，秩比卿大夫。等级森然，不可稍逾。而酬庸之际，仍守一戒：小人不得进用。盖一部师卦，自初至上，君子小人之辨屡屡致意；及大功告成、授爵行赏之时，尤当审慎，一使小人得柄，国事遂多故矣。","Y6.X":"象曰：大君有命，以正功也。小人勿用，必乱邦也。","Y6.XN":"正功者，赏必称其功也：功大者厚，功小者薄，无功者不与。师卦发端即戒用小人之意，然亦当曲尽其情——小人而确有战功，酬之可也，使开国承家而预闻政事则断不可。不然，倾家亡国之祸，将由是起。","Z":"师卦所论，皆兵家之大纲。古人对战争所能有的几层识见，此卦皆已深切著明：“师贞”与“田有禽”，明出师当以义；“丈人”“长子帅师”，明统兵必得其人；“师出以律”，见纪律一失则祸烈；“弟子舆尸贞凶”，见事权不一则害深；“师左次无咎”与“在师中吉”，则言临机制变之不可拘。而通卦首尾，又贯一义：亲君子而远小人。"}},"08":{"id":"08","cnNum":"〇八","name":"比","pinyin":"bǐ","fullName":"水地比","shortFullName":"水地比","upper":"坎","lower":"坤","upperNature":"水","lowerNature":"地","lines":[0,0,0,0,1,0],"yaoLabels":["初六","六二","六三","六四","九五","上六"],"blocks":{"P":"比之训为密，许慎之说也；段玉裁推其本义，以为止是彼此相亲而无所间。程《传》别立“亲辅”一解，于卦旨为尤切。以今日语言表之，此卦所论，大率属人际相接之事。然古人不悟人际之根柢实在经济，即众人于生产之际所结之关系，故比卦言人际，仅及政治一域；政治之中，又偏重治者与被治者、尊卑上下之序。\n以卦象言，比与师适相颠倒。师以上坤下坎取象，水之伏于地中者也，其义主于容畜；比则上下易位，水出地上，象其相就而无间，卦名由此而立。至其所以继师，《序卦传》谓众既聚矣，则必有亲，此比卦之所以次也。","G":"比，吉。原筮元永贞，无咎。不宁方来，后夫凶。","G.N":"《杂卦传》以乐、忧分属比、师。比所论者，人相亲密之道；古人视此为天下之美事，故卦辞径下一“吉”字，非谓一爻独吉，乃谓通卦皆吉。\n“原筮元永贞，无咎”何解？原者再也，原筮即反复稽考、再三审度之谓。六十四卦言筮者，唯比与蒙。蒙所重在初，童蒙求师，贵乎专一诚笃，频复则诚散；比所重在再，或我求比于人、或人求比于我，皆当谨审，仅筮于初而不复审，则虑有疏漏。二者皆取譬为言，非真执蓍龟以决，其旨一主于诚、一主于审而已。\n审有二路：上之比下，如天子欲天下之尽来亲辅；下之从上，如诸侯方国与凡有众者之归附天子。所审者同，皆问其果元、果永、果贞否。善足以统之者元也，久足以持之者永也，正足以守之者贞也。三者兼副，比乃无咎。\n“不宁方”一语的训解，历来最号难通。《考工记·梓人》载射侯之祝，有“不宁侯”之目，指诸侯之不安顺者，不入王所则张其像而射之。孙诒让《周礼正义》申其义，以为与《易》辞同指：所谓不入王所，即不顺命于王所，王所指都城与巡守朝会之地，属则朝会之谓。其说可从。由是言之，方与侯一也，其人不入王所、不顺王命，故被以此名。今乃来朝、乃安顺，是天子的元永贞有以感之。所谓后夫，谓其人以刚强自树，不能屈己以下人；柔者易使，刚者难屈，故独后者属之。方国诸侯争先亲比于王，而一二落后者独不肯至，其为结局，自无善理。","T":"彖曰：比吉也。比辅也。下顺从也。原筮元永贞无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也。","T.N":"卦辞首句“比吉也”三字，朱子《易本义》断为衍羡，以为无当于经；其说可从。“比辅也，下顺从也”两句，后句乃前句之释。比取辅义；辅者，车旁夹木也。辅之于车，相依而不可须臾离，此即卦位所示“下顺从”之象。所谓下顺从，谓在下四阴爻亲比于上之九五：九五取象于车，四阴取象于辅。\n《周易》内外两体，多以阴阳正应为说；至若两爻相邻而情相亲，则谓之比。然相邻者未必相得，不相得则比之名不立。比之为卦则不系于此：其诸爻之于五，初不问内外之体，亦不问其应与否，凡居五之下者，四阴悉以亲比归之。六十四卦中一阳五阴者六，而阳居君位、为九五者独比卦，其下四阴翕然从之，此其所以异也。\n“原筮元永贞，无咎，以刚中也”。卦辞本泛言全卦，而比之主爻实在九五，故“原筮元永贞”终须归着于九五之身：处尊位者能审慎自度，果元、果永、果贞，天下乃肯来比。诸阴所象即天下之人，其来与不来，所验者正此三字。《彖传》径指“原筮元永贞”为九五发，盖以九五阳刚而居中得正，具刚中之德，故必能“原筮元永贞，无咎”。然此唯比之九五为然，他卦之九五则未必然。\n“不宁方来，上下应也”。向之不安顺、不来朝者，今乃归而亲比，何也？曰“上下应”也。《易》言应，多指上下两体刚柔相对；此处之应则异，合上六而在内，五阴并应于九五，故名“上下应”。合五阴而共趋一阳，天下之人毕赴于天子之象也，不宁之方，安得不至？\n“后夫凶，其道穷也”。后夫者，上六是也。上六所象，乃宜比、亦欲比而迟回不发之人。识不达于大体，终必无善果。“其道穷”云者，谓势穷途蹙，无可复之谓。","X":"象曰：地上有水，比。先王以建万国，亲诸侯。","X.N":"坤在下、坎在上，是水行于地。水与地相入相和，分擘不开，亲比之象具焉，卦所以名比也。先王于此得建国亲侯之法：裂土而封万国，即因封国以亲抚诸侯。\n屯之“利建侯”与比之“建万国，亲诸侯”，名若相近而指则殊。“利建侯”者，一部一国自择其君长，其事止于一方；比之封建，则天子裂土以命列国，即由是而联络天下，其事在于四海。即以大象与《彖传》相较，亦各有主：彖传所云，五阴之自往比一阳；大象所云，一阳之自来比五阴。","Y1.T":"初六，有孚，比之，无咎。有孚，盈缶，终来有它吉。","Y1.N":"孚者，信之蓄于中者也；缶者，器之素朴无文者也。二者相配，见诚在其内而外不假饰。初六处比之始，方与人初相接，所恃以取信者，无他，中心之诚而已。诚立，则无论我往比人、人来比我，皆通达而无梗。\n更进一层：诚满于中，如物之实缶，内充而不事雕绘，至于满腹皆诚，则不惟可以免咎，终且获“它吉”——所谓它吉，非分所应得，亦非意中所必期，而自外来者也。\n此于爻象有说：初六与九五不应，且去五最远，然恃其中之诚信以求比，终亦必得其吉。大过九四、中孚初九皆系“有它”之文，其义为戒，戒其心有他向；比之初六则反是，乃喜其有它来之吉。","Y1.X":"象曰：比之初六。有它吉也。","Y1.XN":"小象取“比之初六”四字总括爻辞，语简而意足；缀一比字于“初六”之上，全爻之旨尤显。其所标举者三：比之枢要在初，一也；初之枢要在信，二也；信立于初，故终能得它吉，三也。使信非肇于初，则它吉无所从来。","Y2.T":"六二，比之自内，贞吉。","Y2.N":"内体外体之别，于《易》中首发于此爻。六二处下体之中，以阴居阴，位既得正，而上应九五，其应也正。两爻各以中正相与，其所比者，固非寻常之相亲。自卦画观之，六二居内体而比于外体之九五，故爻辞谓之“比之自内”。\n“贞吉”云者，非漫言吉也，吉有条件存焉：贞则吉，不贞则否，其条件即在一贞字。贞之为言正也。凡与人比，守正而不苟，吉乃可必。","Y2.X":"象曰：比之自内，不自失也。","Y2.XN":"小象之意：六二居内而比于外，其比与不比、早比与晚比、以何道比，皆由己裁；此时所难者，在自持分寸，使不至失其身。以古制言之，士当修己正身，待人主之求，不宜贬志屈身、奔走以苟合。莘野之伊尹、渭滨之吕望、隆中之诸葛亮，其出处大略如是。此与孔子“用之则行，舍之则藏”之语，实为一意之两面：见可而进，非有所慕；见否而退，非有所怨。","Y3.T":"六三，比之匪人。","Y3.N":"“匪人”之文，六十四卦中自此始见。匪人者，非正人也。若而人者，品类至杂，而邪僻为其同然之性，古今无处无之。所贵者在辨：我苟与之比，则我亦即其类矣。爻辞不著凶咎，非无凶咎也，比于邪人，其凶咎不待言而自见。\n九五以中正履尊，为一卦之主，诸爻皆当比之，方为比得其人。初六居一卦之先，得比；六二与之正应，得比；六四上承之，亦得比。独六三之质柔而位不当，中道又乖，于五无由而比。三之上应者为上六，而上六正“比之无首”者，故六三所比，遂落于匪人之手。","Y3.X":"象曰：比之匪人，不亦伤乎。","Y3.XN":"六三之质柔而位不当，中道亦乖，正人无肯与之者；其所追随，尽邪僻耳。可伤可痛既已著明，则悔吝之来，无待悉数。","Y4.T":"六四，外比之，贞吉。","Y4.N":"初六与六四，其位本非相应；六四舍之，转而附近之九五，是谓外比。二之与五，由内而往；四之与五，自外而附。二者同以柔居柔，故皆系“贞吉”。\n六四之贞吉，尚有一义：其质阴柔，其位不中，而所比者乃刚而明、中而正之九五，是谓得正，得正则吉，此自爻位言也。若自其义言，则六四之于五，是比贤而从上；比贤从上，非以正道行之，吉不可得。","Y4.X":"象曰：外比于贤，以从上也。","Y4.XN":"所称贤、所称上，皆目九五：其德刚而能明、中而能正，故以贤目之；其位尊而履极，故以上目之。六四之于五，既以为贤而比之，又以居上而顺之，吉所由也。","Y5.T":"九五，显比，王用三驱失前禽，邑人不诫，吉。","Y5.N":"群阴之所归者，九五也。九五阳刚而履尊，位乎中且得其正，其受众阴之求比，犹人君之为天下所依。人君之比天下，其道曰“显比”。显者，陷之对也：陷则伏匿而暗昧，显则发露而坦然。唯其发露而坦然，故无私曲，无隐匿，无偏无党，正大而光明，比之至善者也。\n“三驱失前禽，邑人不诫”，皆设譬之辞，所以状显比之实。田猎之制，先定其界，闢一面为门，悬旃以表之，余三面则芟草成长围；猎者由门驱入，禽兽有迎人而逸出门外者，则听之，不射；其背人而入于围中者，无从复脱，尽射而取之。取此以譬王者之比天下：至者受之，逝者听之，不强其所不欲，不设隐伏之机，一切任其自然。\n“邑人不诫”者：邑，王所都之地，兼诸侯封内言之；邑人则密迩王居之民。诫，约也。王不以其近在肘腋而丁宁要约，强使亲己。盖言王之比天下，视之无二，不复分内外远近。","Y5.X":"象曰：显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。","Y5.XN":"显比之得吉，其本在九五处正而得中。正故无所私，中故无所倚；无所私倚，是以能合天下之众，而非仅结一二之私党。\n“失前禽”何谓也？猎时故纵禽兽之逸出门者。其义无他，逆者舍之、顺者取之而已：王者之于天下，任其自至，不驱之来，亦不禁其去。验之卦爻，失前禽者失上六也。上六以阴乘阳，其势逆，不肯来比，九五舍而不校，是舍逆也。若四阴者，以柔承刚，其势为顺，莫不输诚于五；五受而安之，此取顺之说也。\n“邑人不诫”，则“上使中”之谓。上指九五；使者，用也；中者何？不倚于一偏、不以远近异视之谓也。其比天下也，近不偏厚，远不偏薄，众寡同视，守中而无党。","Y6.T":"上六，比之无首，凶。","Y6.N":"上六以阴质处卦之末，众爻无一来比者，己亦不肯下比九五，凶之所由也。“无首”云者，谓其始之不善，已有疵病在焉。\n然上六居卦之终，宜曰“比之无终”，而爻辞乃言“无首”，何也？盖古人之意，比之事必慎于始；始有不善，则当于“无首”处责之。与其径断曰“无终”，不若溯其本而言“无首”之为深切。","Y6.X":"象曰：比之无首，无所终也。","Y6.XN":"爻辞系以“比之无首”，小象则发其底蕴：上六所云“无首”，非果论首也，实论其终。夫首之不立，乃初爻之责，于上六分上本无所涉。使小象不加别白，读者将疑上六之身与比之初政直相关涉。只此一点，而比道最重初始之旨，遂跃然可见。","Z":"比卦所论，乃古之治者何以亲比于被治者。古人平治天下，主张恩威并行：武功以慑之，文德以怀之。师者武功之属，比者文德之属也。\n就卦体言，一阳而五阴，阳爻九五为之主。五既处中而居正，余五阴皆当主动以从之。《易》例六爻贵正应，应以正则吉；而比独为变例：爻之吉凶，不以应断，而以其去五之远近顺逆断。九五阳刚而中正，是治者之象。治者之比被治者、上之比下，必有其经与法。\n《易》于治者之欲亲比天下国家，最致意于自修：元、永、贞三者备，而后比可得而久。初六戒以比道在始，始之比贵于中诚；六二言下之比上当守正，勿贬志屈身以苟求；六三则举比于匪人之戒；六四之义与六二略同。九五为一卦主爻，其辞与卦辞相准，责治者以正大光明、宽宏有容，至者受之，逝者听之，持中而不倚，亲疏一等，所比者务求其众。上六居终而系以无首，所以申言之者，正谓始既失之，末流无可复救耳。"}},"09":{"id":"09","cnNum":"〇九","name":"小畜","pinyin":"xiǎo xù","fullName":"风天小畜","shortFullName":"风天小畜","upper":"巽","lower":"乾","upperNature":"风","lowerNature":"天","lines":[1,1,1,0,1,1],"yaoLabels":["初九","九二","九三","六四","九五","上九"],"blocks":{"P":"凡物相与，久则必有以相统摄者，故比之后次以小畜，此《序卦》“必有所畜”之谓也。人群既已亲比，其势自不能无所属；六十四卦之次第，即依此理而相承。于此可见《易传》作者深于辩证：诸卦先后相序，非漫然凑合，一卦之位，皆有其不得不然之故。\n畜字兼聚、止二谊，小畜一卦，两谊并存。就体言之，巽居乾上，乾本刚阳而宜居上，今反屈于巽下，为巽所止，此畜之实也。\n其名何以加“小”？有两说。其一，以微者御众也。卦中阳画居五，阴画止一；六四之阴恰值阴位，质与位相得，而上五阳又尽趋之。阳巨阴细，本《易》家通例，今乃使独阴总统五阳，卦名遂标以“小”。其二，巽顺之畜刚健，所操者柔道，是即所谓“小”，非凭强力之“大”，此亦得名之一因。\n柔道相畜，其效必缓，非旦夕可期，须假时日以养其势。故小畜与需卦最近：需者须也、待也，小畜亦含蓄积等待之意。又三阳在下并力而前，六四独以一条柔顺之阴横当其冲，论其分量、论其所可止者，皆有限涯，此又一名“小”之由。","G":"小畜，亨。密云不雨，自我西郊。","G.N":"止之者有限，而通之者自在其中，此“小畜，亨”之义也。过之小者能止，事之小者能济；目前虽未即，其后必至。以两体言，健而以巽行之，不抗不随，故塞于暂而通于久。以六爻言，二五皆刚而居中也，其心同，其志一，欲有所为，无有不行者。“密云不雨，自我西郊”二语，历来解者纷然，大抵未得其要领。其实此二语者，特借习见之天时，以形况一卦之旨耳。小畜之世，臣之事君、下之事上，见其失而以善道匡救之，终必有成，雨固当落也。顾今则未也：六四孤阴，三阳犹未之应；下之所陈，上犹未之纳。譬如云虽厚积，而起处偏在西郊，则雨未可以旦夕望。云厚而不成雨，何耶？病在“自我西郊”耳。西郊云者，风自西来，挟云而东之谓。乡里旧谚，以云头所向占晴雨：向东则道途可行，向西则蓑笠不去身。西风既作，雨自难期。","T":"彖曰：小畜，柔得位而上下应之曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。","T.N":"所谓柔得位，指六四言：其画为阴，其位亦阴，又宅于上体，质与位两不相违，是之谓得位。一卦之中，阴画仅此一条，而五阳咸向之；众刚环集，孤柔独当，力所不给，则所畜者自无由大，卦名所以系之“小”也。\n“健而巽，刚中而志行，乃亨”，仍就卦体立论，而着眼处已换。前一层推柔之得位、阴之制阳，是求卦之所以成；此一层举健而巽、刚中而志行，是即卦之才用而言。内体乾也，其德健；外体巽也，其德顺。所以舍“乾而巽”“健而顺”而独取“健而巽”者，互文以见义也。巽行乎健之中，刚者不亢，此小畜终得亨通者，其据一也。其据之二，则在“刚中而志行”：九二、九五刚而在中，同属阳性，循其本性必求上进；加以乾之体在下，其势自欲上升。在上者刚而得中，其势必前；在下者乾而居卑，其志务上。二者合，则所畜之小，不足以碍其亨。\n“密云不雨，尚往也”，一卦大旨，在柔之止刚，即六四独力拦阻其余五阳。然拦阻本是一段阴阳相持的历程，断非一举可定。《易经》作者遂借“密云不雨，自我西郊”之象，摹写此中相角之势。六四之止下体三阳，虽出以巽顺，其争仍激烈而艰难。胜负未分，三阳依旧联翩而前，柔者之功未竟，此正如云气满空而雨终不落。\n“自我西郊，施未行也”。施未行者，谓相角之主的一方，即六四，其力尚未尽出，此正是刚者终未被制之根由；犹之天半阴云而雨竟不下，只因西风方紧。","X":"象曰：风行天上，小畜。君子以懿文德。","X.N":"乾之象为天，其德健；巽之象为风，其德顺。巽之所长正在柔顺，以此约束乾健，能收一时之效，却难以牢固久持，故所成者仅小畜而已。君子于此卦，当思“懿文德”。懿者，美也。文德与道德并举而相对：道德主乎内，文德著乎外，举凡仪容、气象、辞令、藻饰皆属之。所谓懿文德，谓细行必谨，穷居亦能自善其身。","Y1.T":"初九，复自道，何其咎，吉。","Y1.N":"复者，还归本位之谓：原在何处，仍还何处。小畜一卦，卦义为阴之畜阳；至于爻义，则适相反，阳皆不肯受阴之畜。初九阳爻居阳位，又处一卦最下，本为阴所制；然它自知不宜躁进，遂潜伏于下，回守其故处。如此审慎，过从何来？既无过，吉可知已。","Y1.X":"象曰：复自道，其义吉也。","Y1.XN":"初九之于六四，正应也。畜之时，挟刚而前，受彼之畜，固吉；今乃不肯进，退守其位，以己畜己，亦未见其不吉。吉之所在，不以相应与否为断，惟揆之于理，理得则吉，故《象》曰“其义吉”。","Y2.T":"九二，牵复，吉。","Y2.N":"牵之一字，旧有二训：一曰牵连，一曰勉强。二者其实相去不远，皆含受动于人之意。九二之复，非出于本愿，乃为人所牵、勉强而从。其所乘之初九，已先受阴之制而自复矣。九二以阳爻处阴位，在下而得中，上又无应，于是随初九之牵而退居下位，此亦吉也。","Y2.X":"象曰：牵复在中，亦不自失也。","Y2.XN":"中而能守，是九二之所长。刚质未泯，故亦欲前，然刚而不过，此其可返之资一；初九、九三与它同气，牵之者众，此其可返之资二。两资既具，遂随众而退。事势与初九相类，初既得吉，二岂独不然？《象》所以云“亦不自失”也。","Y3.T":"九三，舆说辐，夫妻反目。","Y3.N":"舆者，车也。说读为脱。辐当作复，大畜、大壮并作复，《经典释文》亦同。今人所谓辐条者，古名之曰辐，谓其属乎辕也；复则车轴之转也。辐不可脱，脱则毂裂轮残，车立废而不可用；复则不然，轴停而车止，本属寻常。\n“夫妻反目”，自今人视之，不过伉俪情断；古人则于此窥见尊卑之变。妇之事夫，分所当然，未足为异；惟上下易位，反使夫受制于妇，斯为反目。\n二者所设，皆为不善之结局；而致此结局者，非他人，九三自为之也。九三以阳处阳，刚而又刚，不得其中，动不能自敛；前有六四，欲止之而力有不逮，遂成“舆说复”之象，欲进无路。“夫妻反目”则由另一短处而来：九三以阳爻与六四紧相比邻，阴阳相悦之情自生，而它刚而过中，既无以阳制阴之力，反为阴所制，遂成反目之祸。合而观之，九三所处至为窘迫：欲前则阻，欲退则不能，正是进退皆穷。","Y3.X":"象曰：夫妻反目，不能正室也。","Y3.XN":"室谓家室。君子之德，当自修身始，次齐家，次治国，终及天下；九三乃落到不能制妻、反为妻制的地步，是其身之不修已可见矣。身不能正，则家不能正；家不能正，则齐治平之大业更无从谈起。","Y4.T":"六四，有孚，血去惕出，无咎。","Y4.N":"六四为一卦之主，故其爻辞与卦辞同旨。有孚者，中心诚笃之谓。血，指争战负伤而见血。惕，忧惧之意。六四密迩尊位，柔者而欲止刚，细者而欲容巨，其中不能无忧。所以远害而释惧者，无他，一“孚”而已：内蓄其诚，以之相感，彼乃信我而谅我。而枢机所在，尤在取信于九五，得其一诺之助。柔之畜刚、小之畜大、下之畜上、臣之畜君，在《易经》作者看来，同守此一通则。倘六四恃强力以制九五，与众刚为敌，则必见伤而事偾，此有孚之所以必要也。至若阴爻而处阴位，柔顺得所，气质本不浮动，则又其能孚之资也。","Y4.X":"象曰：有孚惕出，上合志也。","Y4.XN":"爻辞但言“惕出”，则血之已去不言可喻，此举轻以该重之笔法：忧惧尚且获免，流血负伤之事更无待言。上者，九五也。六四之畜九五，以一阴而当众刚，仅恃己之有孚，未必能致“血去惕出”；必九五亦有孚，真能信六四，上下所见相同、所趋如一，然后可。事实上九五正已如此，六四乃得有“有孚惕出”。爻辞就六四一面立言，重在畜人者当有孚；《象传》则转从受畜者一面看，谓九五与六四“合志”乃成败所系。","Y5.T":"九五，有孚挛如，富以其邻。","Y5.N":"挛如二字，写其系属之密、胶结之牢。《易》家以实属阳而虚属阴，实则称富，虚则不富。“以”字从《春秋》“以某师”取义，盖谓操纵在己、能左右之也。“有孚挛如”，盖言二爻之孚相引相属，结而不可解。柔者积诚以格刚，刚者推诚以纳柔，两诚相与，而小畜之功于是乎成。“富以其邻”，富者九五自谓，邻者六四是也，两爻相比，故目之曰邻。九五既为阳爻，又有孚，六四之进退实操于其手。要之，小畜之世，柔之能止刚与否，其柄不在柔而在刚：九五之素养、所期、所执，实为之主。","Y5.X":"象曰：有孚挛如，不独富也。","Y5.XN":"九五之能与六四相挛而无间，其根在“不独富”三字。阴阳有虚实之别，实者称富，虚者不富，此《易》之定名。所谓不独富，析之有二：一者，以其诚与六四相结，纽而不解；二者，非惟己受其止，更能佐六四以止在下之阳。","Y6.T":"上九，既雨既处，尚德载，妇贞厉，月几望，君子征凶。","Y6.N":"载者，积也。月几望，谓月将圆而未至满。征，动也。向者密云而不雨，今则雨矣；阳之德本蓄而求进，至此已极其量，无可复进。阴之制阳，小畜之宿题也，至是乃了。旧者既去，新者复起。“尚德载”者，柔之制刚既有其效，而六四之德方日积日厚，未见其止也。妇者阴也，指六四。柔顺者，六四之正也；固执而弗渝，则危厉随之。譬若月轮将满，势且与日争明。和者转而为敌，合者转而为争。当此，凡阳之所属而君子所行者，一举动失检，祸即及之。","Y6.X":"象曰：既雨既处，德积载也。君子征凶，有所疑也。","Y6.XN":"此疑非疑惧之疑，乃疑似之疑：阴之盛已与阳比肩，二者遂浑而难辨。坤卦上六之辞，以“疑”字系于阴极之处，而继之以“战”，可与互证。雨落而阳止，柔者之功遂成；然此岂一朝可致？“德积载”云者，正谓六四守柔不懈、累之以渐，非一日之积也。至是而局势必易，制人者反为人制；阳之一动，凶即随之，是以不可妄动。其故安在？曰：有所疑耳。阴既充盈，操柄在己，阳乃不得不以敌体相视。","Z":"小畜之篇，自柔之制刚说起，终之以柔之疑刚，首尾一贯，而《周易》作者于矛盾递转之旨，亦于此可见。当小畜之世，阴阳相争无处不在。柔欲制刚，刚初不肯；不肯而终诎，于是乎受制；积之以渐，柔者浸强，遂与刚相亢。小畜之局既终，新者又起。以卦义言，密云不雨之象，见其争之纡缓而持久。以爻义言：初、二皆知谨守，不肯轻动；三则以刚之过而失中，反见制于六四；四与五交孚相应，刚柔相谐，一时归于和同。然和同者，相对而暂焉者也。迨上九既雨既处，两气之势又易，柔疑于刚，刚屈于柔，而新者以生。"}},"10":{"id":"10","cnNum":"一〇","name":"履","pinyin":"lǚ","fullName":"天泽履","shortFullName":"天泽履","upper":"乾","lower":"兑","upperNature":"天","lowerNature":"泽","lines":[1,1,0,1,1,1],"yaoLabels":["初九","九二","六三","九四","九五","上九"],"blocks":{"P":"名卦曰履，其义安在？《杂卦传》以“不处”释之——不处者，非静止之谓，乃动而有所往、行而有所至也。《说文》则曰“礼，履也，所以事神致福也”，是以礼训履。合而观之，履之一名实具表里二重：形于外者为践履、为躬行；蕴于内者为礼，即人所以立身、所以应世之准的。卦之所主，不在其表而在其里，礼是已。顾礼之为道，至为烦密：经礼三百，曲礼三千，条目纷纶，不可猝数，广陈则难以究竟。履卦于是舍其节目而挈其纲维，独就“礼之用，和为贵”一义，条分缕析而发挥之。\n其立论盖谓：人生两间，苟能以柔顺和悦为心、以谦卑自下为度，则险阻当前无不可越，虽虎尾在前而蹑之，亦不足为患。此非空言，卦体具焉。兑居于下，乾居于上；兑之德柔，乾之德刚；刚者居先而趋，柔者在后而蹑，柔之践刚，象固如此。以孱弱蹑强梁，强梁虽猛，终必就范。柔者既能驯至烈之刚，则天下尚有何关不可破？卦之次于小畜，《序卦传》亦有说焉：物既畜聚，礼乃随之而生，故履承小畜。盖聚之既久，物阜人稠，小大、尊卑、美恶之等由是而出，等既出则礼生，履者，礼之见诸行事者也。","G":"履虎尾，不咥人，亨。","G.N":"辞之发端，突标“履虎尾”三字，取象可谓奇崛。履之为言，随而蹑之也。虎尾在后，紧随不舍，天下之至险莫过于是；而虎卒不加噬，通亨如常。此辞所寄，盖谓人之涉世，一举一动必准于礼，待人接物一本于和悦谦卑，则虽遇猛鸷，亦复何伤。\n象之可指者二。乾纯刚而居前，刚之至者莫如虎，故取虎象；兑至柔而随后，蹑之者兑也，故曰履虎尾。八卦之中，健无过乾，弱无过兑；以弱尾健而行，险机已伏其中。然兑为悦体，悦以承刚，则刚者无所施其暴，此“不咥”之象，而亨所由致也。","T":"彖曰：履，柔履刚也。说而应乎乾，是以履虎尾不咥人，亨。刚中正，履帝位而不疚，光明也。","T.N":"《彖传》释此辞，所执两端，皆得要领。其一曰：履者，柔之践刚，非刚之陵柔。观此可知，卦中二体当分先后，不当分上下。柔而践刚，危孰甚焉；至危者既获其解，则余可类推而不必缕陈。其二曰：虎尾见蹑而终不遭噬、且以亨闻者，其故在“说而应乎乾”。兑下乾上，柔以承刚，除悦与应，更无他道。悦主和顺，应主敬慎，二者相须而不可偏废；然其枢纽，则在兑之自处卑下。能如是，虽暴戾者亦可驯。兑之妙用，正于此见。\n右为柔者一边言之。刚者一边当如何自处、能如何自处，卦辞未尝及，孔子乃补其所未备而引申之。前之举“说而应乎乾”，统二体为说；此之举“刚中正”，则独归之九五。上体之乾，无所寄则虚，寄之九五而其体乃实，故举九五即所以举乾也。“柔履刚”之刚，指全体之上体；“刚中正”之刚，指单爻之九五。两名相承，本非二物。虽然，九五之刚，未尝孤行。其位中也，其位又正也；刚得中正以为节，斯无过刚之患。过刚者患在偏，不偏则事得其平，权度在握，不堕一隅。以之人事，刚正而宅尊位者，举措之间自无遗憾，此即所谓“不疚”。疚者，病也；行事无缺漏可寻，欲指其疵而终不可得，斯无病矣。盖中正为本，无憾为效，光明又因无憾而著。处至尊而心体澄然，乃能和悦而不流于媚，恭敬而不堕于谄。\n由此言之，卦辞所含之微旨，《彖传》抉发殆尽矣。履之为义，非单举一端可尽。悦以应乾者，柔之事也；中正而不疚、不疚而光明者，刚之事也。举世间事理，莫不有两端相待。两端交相约束，彼此系属，不可举一而废一。相倚相生之理，既具于《易》象，亦出于作传之孔子。","X":"象曰：上天下泽，履。君子以辨上下，定民志。","X.N":"《易》家言“大象”，多属政治之谈，而所涉又往往为一国之大政。履之象辞，独拈出等级一义。孔子以礼为教，礼之实质，非他，等级秩序之映于仪文者而已。溯礼所自来，与夫妇父子之别同其岁月，皆在父权初立之时；自兹以降，遂为文明之世等级结构所倚以为柱者。孔子之论政，志在复古，故于礼、于等威，措意最深。\n上天下泽者：乾象天，兑象泽。天穹然居上，其位至尊；泽洼然处下，其位至卑。标此一尊一卑于两端，而其中间之层层差等，已尽举而无遗。差等既立，表而出之者为礼，行而致之者为履。故孔子告在上者：观此卦之象、体此卦之义，其效不在他处，而在“辨上下，定民志”。\n辨上下者，贵贱尊卑各有其界，秩然井然，不容搀越。定民志者，则不止于外，直从人心上落著：居尊者安于尊，居卑者安于卑，位各有守，分各有归。","Y1.T":"初九，素履往，无咎。","Y1.N":"《杂卦传》以“不处”释履，不处则行，行则有所往。初爻为九，阳刚之质，其势必求进。然则所当究心者，不在行与不行，而在行之何由、进之何向。履之初，譬诸启户而初举一足，又如人方涉世、甫上人生之涂。当此之时，辞曰“素履往”。素者，无文饰之谓，物之本然、不假雕绘者也。以素而往，其义与《中庸》所称素位而行者适相印合：守其分而止，利不逾分，位不越等，贫安其贫，富乐其富。","Y1.X":"象曰：素履之往，独行愿也。","Y1.XN":"“独”者，专一之辞，亦“惟此而已”之辞。“素履”而“无咎”，质言之，不过“独行愿”三字。愿者，夙昔之初志；行者，求有以自践。所慕在己，故不为情所迁；所守有定，故不为物所役。《中庸》所戒乎愿外者，即此意也。孟子所举大丈夫，禄位不足以荡其中，困厄不足以易其守，威怒不足以折其气，其于独行愿也，盖有合焉。","Y2.T":"九二，履道坦坦，幽人贞吉。","Y2.N":"九二之才刚，其位居中，所履者因之平衍无碍，爻辞所以称“履道坦坦”也。若“幽人”之名，则与六三之“武人”相形而立：武人刚愎自任，纵恣而无所顾；幽人恬静自持，与物无竞。二以阳爻处阴位，又得下体之中，所处甚安，前路本自宽平。顾其为阳刚之才，循性而动，最易躁求。于此能守中之安恬、进退皆绰有余地者，独幽人耳。","Y2.X":"象曰：幽人贞吉，中不自乱也。","Y2.XN":"孔子之教，重在反身。人之接于外物，其得失之机，不系于外而系于己之修养。然则“幽人贞”之吉，果何自而来？曰：非鬼神之默佑，非命数之预定，亦非所处之地有利于我，而在我自力之能持。中者，中心也，内境也。幽人内守安恬，纷华美丽不入于心，故其操不改。己能自立，则外物虽环攻而莫能夺之。","Y3.T":"六三，眇能视，跛能履，履虎尾，咥人，凶，武人为于大君。","Y3.N":"卦辞曰“履虎尾，不咥人，亨”，六三之辞乃曰“履虎尾，咥人，凶”，同为一卦，辞正相反，其故可得而言乎？盖辞之系于一爻者，爻辞与卦辞每同其指，屯初九之亦称“利建侯”是也；辞之统二体而系者，爻辞遂与卦辞异趣，本卦则其验矣。\n六三阴爻而据阳位，不中不正，以之践履，未有不失者。行路之度，身贵平衡而适中；三之行也偏而不中，是其为跛。视物之则，目贵端直而向前；三之视也斜而不正，是其为眇。然行虽踦，足犹可移；视虽偏，形犹可辨。患正在此：三不自知其短，谓眇者亦能睹，谓跛者亦能趋。两个“能”字，画出专断自用、肆行不顾之状。如此而蹑虎尾，虎安得不噬？凶固其所也。\n“武人为于大君”，则又别申一义。武人者，性暴而才疏，志气却勃然，不以强弱自量，奋身径前。使斯人而听命于多谋之君、受制于天子，则其轻死之勇，未必不可用也。","Y3.X":"象曰：眇能视，不足以有明也。跛能履，不足以与行也。咥人之凶，位不当也。武人为于大君，志刚也。","Y3.XN":"六三质本阴柔，位复不中不正，于自身致命弱点茫无所觉，遂悍然直前，是履危而蹈祸者也。自谓能睹能步，正此之谓；自明者视之，其去盲者夜行也无几。孔子两言“不足”，所以警人：力所不至，不可强饰以为能，强饰则徒取败耳。末复推其致祸之根，曰“位不当”——阴爻而宅阳位，柔藏于内，刚饰于外，故其状似志刚。虽然，志刚亦未尽无可取：使六三而为“武人”，受“大君”之驱使，用其所长，或亦能有所树立，未可一概弃也。","Y4.T":"九四，履虎尾，愬愬终吉。","Y4.N":"卦以全体取象，则乾为虎，而六三当其履；爻以一位取象，则九五为虎，而九四当其履。三、四皆有履虎之象，而三凶四吉，何也？三本眇本跛，柔在中而刚饰外，自许能视能行，凶乃其分。四则不然，其心常存戒惧，一步之出，若将坠乎冰窟。夫四以阳处阴，中正两失，然体刚而位柔，居四之多惧，刚蓄于内、柔见于外，是能柔其刚者也。以惧自将，跬步不敢肆，吉所以归之。","Y4.X":"象曰：愬愬终吉，志行也。","Y4.XN":"九四刚寓于内、柔著于外，既怀戒惧之心，亦具上进不已之志，非徒以畏葸自全者。所谓“终吉”，正谓其上进之愿终得遂也。","Y5.T":"九五，夬履，贞厉。","Y5.N":"夬之为字，读与怪同，其义则刚断而决之也。《彖传》所云“刚中正，履帝位而不疚”，所指正是九五。乃其爻辞反以“夬履，贞厉”为言，明著危象焉，抑又何说？此可见《易》家之识：每于正面勘出反面，于满目顺遂之中察见不顺之几。九五刚而中正，履至尊之位，下焉者悦而应之，权、势、威三者毕集于一人之身，百务皆可独断而决，是即“夬履”，宜若一无所阻者。然爻刚而位亦刚，纯乎刚而不用柔，在人君则为察断有余、容纳不足之象。执此以往而不知所变，危厉其能免乎？","Y5.X":"象曰：夬履贞厉，位正当也。","Y5.XN":"“夬履”何以必致危厉？孔子归之于九五所处之过优。刚而中正，复踞至尊，俯临天下，自专自决而无所忌惮。然危厉之萌，即伏于此。","Y6.T":"上九，视履考祥，其旋元吉。","Y6.N":"考者，察验而总其成之谓。祥之一字，所包者广，非徒吉称，凶咎亦在其内。段玉裁注《说文》，谓析言之，则惟善者得谓之祥；统言之，则灾异亦蒙祥名。是故考祥之义，不过总核一生之所行而断其吉与凶耳。旋者，周匝而完备之意。上九居一卦之尽，履之事既终，前此之所行，可返观而审之矣。犹之人至盖棺，其平生行事之实具在，旁人参稽而评其善恶成败之数：善多则吉，恶多则凶。若首尾周匝，一无所疚，美善咸备，则命之曰元吉。元吉云者，吉之至大而更无以上之者也。","Y6.X":"象曰：元吉在上，大有庆也。","Y6.XN":"“在上”者，履已底于终也。“元吉在上”，言履必极于终境，元吉乃可得而致；未至其极，则元吉无由而生。此释上九得元吉之条件与缘由。人而终获元吉，是福庆之大者，此释元吉之义。吉而冠以元，庆而系以大，一则勉人履善当终始一贯，一则示人视履考祥可为鉴戒。","Z":"小畜、履之为卦，阳众而阴寡，一阴周旋于五阳之间，其义皆主于施用。小畜一阴居四，处上体之中，柔能畜刚，故其用主于制人。履之阴在三，处下体，柔以履刚，是柔行刚也，其用在于行己。履以柔为贵，故六爻之中，履柔则吉，履刚则凶。九二坦坦而贞吉，九四愬愬而终吉，上九其旋而元吉，此三爻皆履柔者。六三之凶，咎在以柔而蹑刚。初九、九五所履亦刚，履虽皆正，然初九止于无咎，九五则有厉存焉。《易》之常道，扬刚而抑柔；然其立论未尝执一。阳刚喜动而好决，此其短也，任刚而不返，悔吝必多。"}},"11":{"id":"11","cnNum":"一一","name":"泰","pinyin":"tài","fullName":"地天泰","shortFullName":"地天泰","upper":"坤","lower":"乾","upperNature":"地","lowerNature":"天","lines":[1,1,1,0,0,0],"yaoLabels":["初九","九二","九三","六四","六五","上六"],"blocks":{"P":"泰之为卦，其义主于通。通者何？上下相与、彼此相得之谓。字书训泰为安，然安自通出：未有上下隔塞而能久安者。故论泰必自其通始。\n凡物之相交，有以形交者，有以气交者。天覆于上，地载于下，高卑之位既定，形固无自而接。古人知其不可形求，乃转而论气：天之阳气下沉，地之阴气上升，二者絪缊于两间，万物由之而发生长养。此《易》家言“天地交”之实义，非谓两块形体真能相合也。由是言之，天地之交，究其实乃阴阳之交。\n阴阳之名，本以标举万物之对待。对待者易至于相克，然相克之中亦常有相济之几；当其相济，则对立者转而为和会。古人于此处看得分明，遂不以其对待而疑其可通。此一识见，在古代思想中最为难得。\n推此以观人事，其理不异，特所易者不在天地而在人伦之位分。君与臣，君子与小人，皆一阳一阴之拟。气既可通，则君推诚以待下、臣竭诚以事上，志意相孚，自非不可能之事。至若君子居内而在上、小人居外而在下，各止其所当止，不相侵越，这同样是阴阳相交的一种形态。\n此义之寓于卦者，观其体可见。泰之体，乾居下而坤居上：天本在上而反处下，是天气下行；地本在下而反处上，是地气上腾。一降一升，两相迎就，其势不得不交。否之体适反：坤下乾上，天在上而其气不下，地在下而其气不升，两不相就，其势不得不塞。二卦卦画只差上下一位之互易，而通与塞判然相反——《易》之以位示义，此为最显。\n又《易》之卦序，泰居履后，非随意排比。自乾坤以下，大致依史迹为次：乾坤立天地之始，见自然先于人文；屯蒙记人物之初生；有生必有养，故需继之；有养必有争，故讼继之；争之大者聚众以战，故师继之；可合者当亲比之，故比继之；小畜者，聚其所蓄；履者，辨其分守；至此而泰。作者盖以泰为最盛之世，上古极治之象，略当尧舜之际。过此则泰极而否，否极复泰，一治一乱相寻不已，而纯然完满之泰，遂不复见于后世。\n此种史观，自今日衡之，疏阔处正多。然若历史地观之，亦有两端可采：其一，视人群之事为一可识可解之历程，非冥漠而不可究诘；其二，谓此历程自有其内发之动力与不易之律则，非有神明高高在上而操持之。此两端，在古人之思想世界中皆非易事。读古书者，贵在知其所示之问题，而不必尽同其答案；未可以其结论之疏，而尽弃其用心。","G":"泰，小往大来，吉亨。","G.N":"泰卦先识一“通”字。通不在辞句上求，在卦画上求：乾之三阳本宜在上，今乃居下；坤之三阴本宜在下，今乃居上。阳屈而下济，阴顺而上应，两相就而无所隔，此卦画所示之通也。\n卦辞“小往大来”，即以名例表此画。阳大阴小，是《易》之通称；自内出外曰往，自外入内曰来，内谓下体，外谓上体。泰之画，阴出居外，阳入居内，合而命之，故曰“小往大来”。\n此象落于人事，随取义而分两路。取位分言，大者君、小者臣：君不以尊自居而下其礼，臣竭其力以事上，上下之情通而治道立。取贤否言，阳者君子、阴者小人：小者退处于外，大者居位于内，正人当路而名分不紊。两路所本则一，皆自此出。\n通不在形迹相接，而在气志相感：其在天地为阴阳往来，其在朝廷为君臣相信。\n卦辞不系“元吉”“元亨”而独系“吉亨”，盖泰等第有大小浅深，举此则凡得通者皆该。","T":"彖曰：泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺。内君子而外小人。君子道长，小人道消也。","T.N":"彖传释泰，两用“交”字，此其立义之枢。所当先辨者：交非形接。天地之体，一上一下，终古不接；其所交者，气也。君臣上下亦然，堂陛森严，形迹本相隔绝；其所交者，志也。志同云者，非谓趋附相同，谓其所向所期者一而已。此处于天地、于阴阳、于君臣上下，皆未尝分高下，只辨一交与不交，此其立言之慎。\n以下数语，则就内外之位以明大小之别。阳健而君子，故居内；阴顺而小人，故居外。内外各止其所，是一义。然既以内外分大小，则以内为重、以外为轻之意已寓其中，于阴阳遂不能无所抑扬，是又一义。两义并见，读者当分别观之。\n至“君子道长，小人道消”，则不复就位言，而就六爻之消息言。阳爻增一分，阴爻即减一分；其在人事，君子之道长一分，小人之道即消一分。至此而作者之态度始明：非徒抑扬而已，乃于阳有所喜、于阴有所抑，以阳之浸长为吉。\n然犹有一义不可不讲：所论者道，非论其人也。君子道长云者，言君子所守之道渐居优势；小人之道消，则其所守者渐屈。合而观之，不过正气胜而邪气退。非谓泰之世遂无一小人。无小人则亦无所谓君子，古今岂有纯君子而无小人之世？","X":"象曰：天地交泰，后以财成天地之道，辅相天地之宜，以左右民。","X.N":"此所谓后者，非泛称有位之人，乃指南面而治者——天子与诸侯是也。他卦于此，或言君子，或言先王。言君子者，卿大夫亦在其中；言先王者，诸侯不在其列。此卦所系之事——法天地交泰之象、财成辅相以左右其民——非有位者不能行，故特称后以专之，与卿大夫无与。由这一称谓的取舍，亦可见作者所设想的古代政制，是君权独揽的形态。\n财成、辅相二语，与他卦大象之例相同，其旨仍在学卦以法卦，不徒为解说。所异者，此卦专为天子诸侯说法，所涉亦较宏阔。所谓财成，是就天地自然之运加以裁度（财与裁通），使本来无用于人的，转成为民生日用所资：如寒暑之来，本非为人设，为政者则因之以治历、定四时、成岁功，而后有告朔、视朔之节。所谓辅相，是顺万物生长成熟之序而助成之，如教民稼穑、畜养之事。左右即扶助之义：“以左右民”，谓以财成、辅相二者扶助其民，非别有一术。","Y1.T":"初九，拔茅茹，以其汇征，吉。","Y1.N":"拔茅连茹，是取象，不是实指。茅之为物，根株相牵，拔其一则余者随起——初九所处，正是此势。初九以刚居下，恰当泰运初开，天地之气方交，其进也有不能不进者；而其进也，又不独进，必携九二、九三与之俱。汇者类也，征者行也。君子处世，己欲立而立人，己欲达而达人，其自处也如此，其处人也亦如此，与此象正合。吉之所由，不在独进之勇，而在能率其类以俱进。","Y1.X":"象曰：拔茅征吉，志在外也。","Y1.XN":"《象》以“志在外”三字答之。所应者六四，四居外卦，初之志唯在于彼，故《象》以“在外”言之。阳感而阴从，一感一从，二气乃交。爻辞取象之由，至此方有着落。","Y2.T":"九二，包荒，用冯河，不遐遗，朋亡。得尚于中行。","Y2.N":"九二刚爻而居阴位，位在下体之中；与之相应者，六五也。六五柔顺而处中，位复得其正，其下所应，正是九二。一刚一柔，彼此相求，是君臣相得之象。九二虽在臣位，而为六五所倚信，实为此卦之主——内外诸爻阴阳之调燮，皆于此爻取则。治泰之道，故亦于此爻尽之。\n爻辞所列，凡四事焉：包荒、用冯河、不遐遗、朋亡。四事之中，各有其对，非平行而列。包荒与用冯河为一对：盛时之患，常在含容太过而无所立，故既贵其能容，复贵其能断。容而不能断，则宽为废弛；断而不能容，则严为刻薄。二者相反而实相须。不遐遗与朋亡为一对：前者不弃于疏远，后者不昵于亲暱。远者亦怀，近者不偏，然后为公。四事毕，而治泰之方尽于此矣。\n“得尚于中行”，得谓幸而得之，尚谓有以助之。以刚处柔，是能自抑；在下体之中，是能守中；上有六五相应，是能得君。三者具，而中行之德全矣。治泰者能行此四事，则其德与九二合，而其道与中行契。","Y2.X":"象曰：包荒，得尚于中行，以光大也。","Y2.XN":"九二并陈四事，而《小象》独释“包荒”，用意可推。四者之中包荒为本，余三由之而出：能容而后能断，故及“用冯河”；能容而后能公，故及“不遐遗”“朋亡”。本立则末自举。\n“包荒”之所以即为“中行”，不只在量之广，更在心之明：心无所系则容不至纵，量无畦畦则包不至杂。故《象》言“光大”，正指此心之无私。","Y3.T":"九三，无平不陂，无往不复，艰贞无咎，勿恤其孚，于食有福。","Y3.N":"九三之位最可玩味：三阳在己下，三阴在己上，处上下二体之交，过此则中，故曰泰之将极。泰极则否，非人力所能禁，此理之常。作者于此处连用两“无”字，正是提撕警觉之意。陂者，倾侧不平之称。平者必陂，往者必复——就卦画验之，三阳降而在下，终有升上之时；三阴升而在上，终有降下之日。升降互易，泰安得而不变？\n然则处此者奈何？爻辞曰“艰贞无咎，勿恤其孚，于食有福”。天道虽有其必至之势，人却非全然无措。处泰而知艰，守正而不移，则可以无咎；更进一步，能“勿恤其孚”，且将有福。恤者忧也，孚者诚也。天之将要我如何，我不必预为之忧；惟守其诚，思其所当思，行其所当行，此即处泰极之善术。","Y3.X":"象曰：无往不复，天地际也。","Y3.XN":"“无往不复”四字，是说天地阴阳之相交，行至九三已近于变。阳之在下者终必复上，阴之在上者终必复下，泰之转否，正在此际。《象》下一“际”字，正是将变未变之候，其意在于未雨而绸缪。","Y4.T":"六四，翩翩不富以其邻，不戒以孚。","Y4.N":"翩翩二字，写群鸟连翩下飞之态。“不富”在《易》为阴爻之通称：阴虚而不足以自赡，故谓之不富。然阴爻亦有不称不富者，此爻独称，则兼取谦退不自盈满之义。邻指六五、上六。六四之位，当上下二体相接之处，阴阳于此乎相际。六五、上六二阴愿随之而降以求阳，六四不待告诫，遂率二邻翩然而来。上下之情既通，阴阳之德相合，泰卦之象，于此为备。","Y4.X":"象曰：翩翩不富，皆失实也，不戒以孚，中心愿也。","Y4.XN":"阳实阴虚，故阳称富而阴称不富，此《易》之定例。“失实”二字，即所以释不富之故。上体三阴以六四为率，翩然相随而下者，正以失阳为依，而虚不可久，故求合于阳。所谓愿，正取上下相与、志意相合之义。不待告诫而自来，全出中心之欲，非有所勉强。","Y5.T":"六五，帝乙归妹，以祉，元吉。","Y5.N":"六五居尊而体柔。柔者难自立，尊者难下人——此爻恰在此两难之间。其解在应九二：以己之尊，下从阳刚，则柔者得所依，尊者得所辅。爻辞取“帝乙归妹”为象，正为此发。帝乙，商纣之父；归妹，嫁女之谓。虽以天子之妹而适诸侯大夫，亦当损其贵势、屈而从夫；古人视为当然，无所疑议。以天子之妹且然，则其他可知。福非外至，随德而来；六五能下，故其受福也宜，爻辞系之曰“以祉”。元吉者，大吉也：六五与九二志合，治泰之功，于是为盛。","Y5.X":"象曰：以祉元吉，中以行愿也。","Y5.XN":"六五之必得祉福而元吉，正以其柔而居中、居尊而处位：有中德，故能行中道；任贤下从，非屈于势，实由其性与志。柔而不亢，尊而能降，所以受福而大吉。","Y6.T":"上六，城复于隍，勿用师，自邑告命，贞吝。","Y6.N":"上六当泰之尽处。尽则变，故泰之终即否之初。九三所谓“平者陂，往者复”，特其兆耳；至上六则否之来，已由兆而为实，故取“城复于隍”为象。隍者，城外无水之壕。城之成，本取土于隍；城之坏，亦复归于隍。泰之世，积累世之力而后成；及其极也，一倾而反其初——与城之复于隍，其事正同。\n此一象极酷，而作者不为之讳，且直下肯定。在古代思想中，能承认盛极必倾为一不可免之数，已属难得；其中实含量积而质变之意。就一国言之，泰极否来至于城复于隍，其危已甚，故戒以“勿用师”。古者兵农不分，无常备之卒：平居为农，有警则征以为兵。用师者，征民以赴战之谓。当泰之盛，此举固无不可；及祸乱将起，人心已离，虽欲征之而民不应，师不可用矣。所可为者，惟“自邑告命”。“自邑”云者，谓号令所及止于国中，不能逮远。国势既已土崩，号令所及，仅存肘腋之间。虽能自邑告命而又守其正，亦已晚矣，无救于败。\n读此爻者，每叹《易》之不为盛世讳。盖治乱相因，非一姓一朝所能免；知其必有此日而预为之备，则泰可稍延。此作者立象之深意，不在纪其实，而在警其先。","Y6.X":"象曰：城复于隍，其命乱也。","Y6.XN":"两“命”字异义：一为命令之命，一为天命之命。天命非谓有神司之，谓事势之所必至，不以人意而转移者。此语实揭出《易》之一大义：泰之必否，如城之必复于隍，终非人力所挽。“其命乱也”四字，断之至决——命已改易，理当如是，更无可说。","Z":"泰卦之义，可析为三。\n其一，天地间恒有对待之二物相与交通，此象至普，贯乎万物，为生生之本。以其至普而至要，故取天地之交以为喻。天地悬绝，形不可合，乃立阴阳二气之说以通其说。引而至于人事，则上与下、君与臣、治者与被治者，亦有其相交志得之时。此说非诬：世固有上下相安、生业蕃息、刑政清明之候。然泰世何由而生，作者未之能知，乃以“志同”——谓上下思虑之一致——当之。夫非思虑造历史，乃历史之境遇造思虑，此其所蔽也。\n其二，平陂往复、城隍相因，立泰极则否之义，谓万物皆在迁流，积渐而至大变。此理不以人好恶而止，在天为必然之数，在人为不可违之势。先秦之人已见及此，不可谓非卓识。\n其三，作者于泰卦寄一政治之见：处泰者当倍加敬慎，行包荒、用冯河、不遐遗、朋亡四事。宽以容众，而不断则弛；刚以决事，而不容则刻。远者不遗，近者不昵，朋比尽绝，而后其公可见。四者相须，如四时之成岁，缺一则泰不可久。此治泰之全术，亦处盛之要道也。\n凡此三点，一属天道观，一属变易观，一属治术论，合而观之，可见作者于盛衰之际用心最深，言之最切。其结论或有不逮于今，其所提之问题则至今犹新，此读《易》者所当分别也。"}},"12":{"id":"12","cnNum":"一二","name":"否","pinyin":"pǐ","fullName":"天地否","shortFullName":"天地否","upper":"乾","lower":"坤","upperNature":"天","lowerNature":"地","lines":[0,0,0,1,1,1],"yaoLabels":["初六","六二","六三","九四","九五","上九"],"blocks":{"P":"否者，泰之反也。交则为泰，塞则为否。二气往还而万物萌，泰之谓也；二气隔绝而生机息，否之谓也。上下一心而志合，泰之谓也；上下相睽而志离，否之谓也。观其卦体，乾据上而坤处下，天高而地卑，判然分属，曾无一脉相通，否之象于是乎备。《序卦》谓通者不可久恃，故泰之后继以否。夫泰之必趋否，非人力所能止，乃消息盈虚之自然。作者于此复申物极则反之旨，以见通极而塞、治极而乱，其理不爽。","G":"否之匪人，不利君子贞，大往小来。","G.N":"朱熹径以“之匪人”为羡文，谓当削去；其说固有所据，然他家所释亦未可尽废。孔颖达以为世当否塞，本非人道往来之候，故以此三字系于卦名之下；程颐推本于生化：凡呼吸于两间者莫非人道，二气既隔则物不遂生，人道由是而断，故系之以匪人，明其非人道之谓。二人立论虽异，而同归一揆：所谓匪人，非谓某人，乃谓举世失其常道，闭塞而无人理。王宗传别立一解，谓此所谓匪人，即非君子之流；此辈一朝得势，则君子之道壅遏而不行；吕大临承其意，谓当此之世，憎直而丑正者盈朝，守正之士最受其病；查慎行则取句式相较，谓其与“比之匪人”同其格调，所指亦即彖传与爻辞所称之小人。王、吕、查三家，皆以匪人指小人得位而言。两派所据不同，然不相抵牾：一就时势言，一就人言，合而观之，不过谓当否之世，正道隐伏，邪僻得行，君子失所凭借而已。\n“不利君子贞”者，小人当事，邪气方张，黑白易位，是非无准，守正者适以取祸，故曰不利。柄政之小人与方坏之世局，必不容直道自持之士，此其势然也。然天地间正气终不可绝，君子者正气所寄，使君子尽去，则否无自而倾，泰无自而复，故君子虽不利于一时，而不可不贞。\n“大往小来”，就卦画求之：乾本居上而今反在外，是阳之往，故称大往；坤本居下而今反在内，是阴之来，故称小来。阳往而阴来，则君子之气日消、小人之势日长，卦辞之所以继之曰“不利君子贞”者，正为此也。","T":"彖曰：否之匪人，不利君子贞。大往小来，则是天地不交，而万物不通也。上下不交，而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子，小人道长，君子道消也。","T.N":"否与泰同出乾坤二体，所异者惟上下之位：泰乾在下而坤在上，否坤在下而乾在上，一反之耳。故否之彖辞，处处就泰之成说反取。泰言二气交感而品物咸亨，否则言二气间隔而生生之道绝；泰言阳居内而阴居外，否则言阴处内而阳处外；泰言君子在位、小人退听，君子之气日增而小人之气日减，否则言小人得路、君子失势，小人之气日增而君子之气日减。三者皆反泰而立。\n惟有两处不尽依样翻转。其一，泰云“上下交而其志同”，否不言志之不同，而云“天下无邦”；其二，泰云“内健而外顺”，否不言内顺外健，而云“内柔而外刚”。称“天下无邦”而不称志异，所以极言其祸之深：政令梗于上，情伪隔于下，国无其人，国将不国，虽有邦而与无邦等，此岂志同志异之可比。至若舍健顺而言刚柔，亦有说焉：否之时二气不接，上下不亲，天地徒存其形而无其用，天不复主于健，地亦不复主于顺，故第以刚柔标其体，而不以健顺责其用。","X":"象曰：天地不交，否。君子以俭德辟难，不可荣以禄。","X.N":"俭之为言，敛也，谓收束其德而不外施。辟读为避，音义并同。夫人当二气隔绝、上下之情不通，将何所措手？其道在有才而不自衒，有德而不自章，有善而不自见，退藏于隐约之地，视爵禄之事若与己无与。非惟不以为荣，且以为患：荣之所在，祸之所集也。深自覆匿，使人无从物色，则彼高爵厚糈自无缘而加乎其身。此即“有道则见，无道则隐”之旨，与道家弃世绝物者流，判然不同途。","Y1.T":"初六，拔茅茹，以其汇，贞吉亨。","Y1.N":"《易》之为书，为君子谋，不为小人谋，凡言吉言亨，所指必在君子，非所以语小人。然而卦辞、彖传皆以否为内小人而外君子，初六以阴居内卦之初，按例当属小人，爻辞乃许之以贞吉亨，其故何也？盖《易》有随时取义之法，卦与爻所取不必尽同，否卦即其一例。初六与九四，本位相应者也；惟当否之时，上下隔绝，声气不通，初六虽有应而应道已废。既无实应，则所以自处者，惟“以其汇贞吉亨”而已。汇者，类也；贞者，正也。谓当连合二、三两阴，同守其正而不妄动，然后吉可得而亨可致。若如泰卦之初，则以“征”为吉——征者，动也。泰之初阳动而上升，故动则吉；否之初阴，动则陷于小人之党，故动则凶。守正而不动，乃否初之吉亨。析言之：吉者，安然无事，不召外患之谓；亨者，蓄其所长，终有所通达之谓。","Y1.X":"象曰：拔茅贞吉，志在君也。","Y1.XN":"“拔茅贞吉”，举一语以概全爻，非爻辞之全也。君子身在否塞之世，非不欲进，然进必以道，不可以苟；苟不可进，则退而守正，蓄力以待可为之机，是即所谓俭德辟难。其为俭德辟难也，岂得已哉？势有所格，不得已而藏焉耳。虽然，其身退，其心未尝一日忘君臣之义，倦倦焉思有以报上。泰之初九，小象曰“志在外”；否之初六，小象曰“志在君”。二者措辞略异，而指归无别：皆以为身在朝列则念民瘼，身处草野则系君心，其忧一也。此忧民忧君之怀，即儒者由己及家、由家及国以及天下之序所自出，其价值取向于是乎见。儒者与道家居己接物，根本相违：道家居人物于自然之列，所求者在个人精神之解脱与自适；儒者则尊人之为人，以为生于两间，其分在济世，在为人，在有所施予。否初小象之“志在君”，正此取向之显者。","Y2.T":"六二，包承，小人吉，大人否亨。","Y2.N":"包承者，含容而承顺之谓。六二体阴，处下卦之中，位复得正，其象为至顺。小人而居下位，挟柔媚之姿，行谄谀之术，以此要结君子，为自脱于否难之计，此包承之实也。在小人言之，计得而遂，固可称吉。然《易》之作，本以导君子，非为小人设教；故小人之吉，适为大人之否——彼之所利，即此之所病。爻辞先著小人之情状，终乃归重于大人，非为小人谋，乃借小人之情以告大人待之之术。大人必也断然自守，与之判然分疆，内不为所惑，外不为所浼，安于否之困而不求速解，然后否可亨，而未来之通可俟。","Y2.X":"象曰：大人否亨，不乱群也。","Y2.XN":"否之时，上下之情不通，世风颓败，小人以包承为术，要结君子。大人者，君子之伦也，与小人臭味既殊，自当“不乱群”——不与之杂处，不堕其术中。彼以柔媚来，此以介然守，两相对峙而不为所移。","Y3.T":"六三，包羞。","Y3.N":"六二阴柔而位乎中正，其包承之迹深稳，骤观之未易窥破，故爻辞以“否亨”为大人戒，欲其早辨。六三则异是：阴柔而不中不正，又逼近于上体，踪迹显露，人得而见之，虽欲蛊惑要结，其术难行。然其病不在无术，而在无耻——能忍耻辱以固其位，眷恋而不忍去，居职而无建白，素食而无所事事，是之谓包羞。孔子云“邦无道，穀，耻也”，当否之世而安享其禄，冒然不以为愧，殆即六三之谓。","Y3.X":"象曰：包羞，位不当也。","Y3.XN":"六三其人本小人耳。今之能含垢忍辱而不敢逞者，非其心有所畏，实以所处之位不中不正，事权不属，无由自展。假令它日位变而当，则凭借既厚，为恶必更烈。此君子所以于此类人不可不早为之备。","Y4.T":"九四，有命无咎，畴离祉。","Y4.N":"命者，天命也，非人主之命。畴训为类，离训为丽，附丽之谓；祉则福也。九四已过乎中，否运将终而泰运将至，是其时会。以阳刚之质而居近君之地，才与势兼有之，济否之具于是乎在。处此者，苟能自守而无过差，又不敢躁急于进，则咎自无从生。盖否极则泰来，其中有天命焉，所谓客观之律是已。及大往小来者转而为小往大来，非独九四身享其福，凡与同畴之诸阳，亦皆附丽于四而并受其祉。","Y4.X":"象曰：有命无咎，志行也。","Y4.XN":"九四适在否已过中、将济未济之会，时与命两得，是以无咎。然其于转否为泰之际，初非兀然听命、一无所为者；盖深察机先，奋然自任，所谓“有命无咎”，正其志得行之效，未可徒诿之于命。","Y5.T":"九五，休否，大人吉，其亡其亡，系于苞桑。","Y5.N":"休者，止息之义。否运至九四而始有转机，至九五则息否之时已至。九五为一卦之主，阳刚而处中得正，又居至尊之地，位、德、时三者皆备，故有休否之资与休否之力——所谓拨乱世而反之正者是也。然休否虽系乎势之必至，而势者虚位，必待人而成：化可为为实有，全赖九五其人刚健果决，竭力推挽，此中有决定之分。由是观之，《易经》于客观律则之外，独重人之能动，未尝一委于前定，宿命之说无与焉。及乎元气浸复、泰道将还，众人方晏然自以为安，而大人独怀危亡之惧，念念然若不能自保，曰“其亡其亡”。惟其惧之也深，故其守之也固，如物之系于苞桑，摇之而不动。桑之为木，根入土也深；苞者，丛生之称，丛生则根株相纠，其固尤甚。《系辞传》推言之：位能自危则安，体能自亡则存，政能自治则治；君子所以履安而戒，居存而惧，值治而忧，身与国乃可长保。其言与九五爻辞之旨，若合符节。","Y5.X":"象曰：大人之吉，位正当也。","Y5.XN":"否之转泰而获大人之吉，其枢在九五之德与位。德位兼隆，而位尤为要：惟有尊位，故操转旋之柄；柄在手，故其力足以反正。德以立其本，位以行其权，二者相须，而权为可见之效。","Y6.T":"上九，倾否，先否后喜。","Y6.N":"上九居否之终，否道穷极，倾覆之时至矣。爻辞曰“倾否”而不曰“否倾”，此中自有微旨：若云否自倾，则成亏消息一委于气数；云“倾否”，则倾之者有人在，见否之得倾，人力居多，非谓运穷则物自坏也。试观两卦之终：泰末上六，柔而据极，德不足持盈，能不足保泰，泰于是复返为否；否终上九，刚而有力，能拨而反之，否于是转为泰。泰终而复否，否终而变泰，皆值社会将变、旧质将易之会，此时人之举措，所系甚重。《易经》既以消息盈虚为有定之序，又拳拳于人之自为，盖已寓人为历史之主之意，至少不谓人群之命数操于上帝。至若“先否后喜”，则就一人之心境言：否之将极，忧在先；否既倾，喜在后。先天下之忧而忧，后天下之乐而乐，其意与九五“其亡其亡，系于苞桑”之戒，正相仿佛。","Y6.X":"象曰：否终则倾，何可长也。","Y6.XN":"此节所论，实为律则之必然与人力之自为如何相济。“则”字下得吃紧，正指人事不可废：否终必倾，而当其将倾，人即以倾之为事，非可安坐而俟。“何可长”三字，则言否之不能久据，其覆乃必然之势，人所为者，在审机而乘之。二语相参，天时之消长与人力之进退，遂交织而不可分。","Z":"否、泰二卦，六爻逐位皆有配：下体之三与上体之三，一一相值。然泰之配也，其义相求；否之配也，其义相隔。泰则初之征、四之孚相应，二之中行、五之归妹相从，三之陂平、上之城复相因——凡位相配者，义亦未尝不交。否则初之拔茅、四之有命，二之见否、五之获吉，三之含羞、上之终喜，位虽相配，而义则各止其所，不相往来。\n否之世，天地不交，人情闭塞，似宜多凶；而六爻之辞，竟无一凶咎之文，何也？盖否之六爻，阴阳各半，其象为君子与小人并生于时，刚犹未受剥，小人之害未至昭著。必待剥之时，一阳在上而为五阴所剥，然后尽归小人之手。就全体言之，否固君子气消、小人气长，不利于君子，故卦辞著“不利君子贞”之戒。若逐爻分观，则又不尽然。上体三爻纯阳，君子居之，否已逾中，势将反矣，休否倾否，有必至者；于斯时也，大人君子循其律则，心存危惧，慎以将之，则咎可免而吉可获。下体三爻纯阴，小人用事，其地固不及上体；然当此之时，小人方以全身远害为急，自救不暇，亦无余力以遂其害君子之心。故爻辞惟著其包承、包羞之状，而不系以凶咎。"}},"13":{"id":"13","cnNum":"一三","name":"同人","pinyin":"tóng rén","fullName":"天火同人","shortFullName":"天火同人","upper":"乾","lower":"离","upperNature":"天","lowerNature":"火","lines":[1,0,1,1,1,1],"yaoLabels":["初九","六二","九三","九四","九五","上九"],"blocks":{"P":"同人者，与人相合之义，所论在个体与群伦之际。其序居否之后，其故可得而言。《序卦传》之意，谓天地闭塞之势不可终穷，穷则必变，而同人承之。否主隔绝，同人主会通；隔绝之极，反于会通，此二卦相次之旨也。","G":"同人于野，亨。利涉大川，利君子贞。","G.N":"“野”之一字，旧解多作空阔无人之地，然此乃国野分域之野，非泛言旷野也。古之建国，中心聚落称国，国以外称郊，郊以外称野，野处最远之边际。卦辞系“同人于野”，盖谓所同之范围须闳大而辽远，直欲合天下之人而一之。我往同于人，人亦来同于我，交相为同，则事无窒碍。儒家视天下如一家、合万民为一体之说，即寓于此。“利涉大川”云者，承上文而指其效：量足以包举天下，能联属广众，则无险不济。\n虽然，前语非漫然许之之辞，“利君子贞”乃所以限之。贞之为言正也。同于人者，身必居正，必由君子之途而后可。若以小人之术行之，柔媚取容，阿世求悦，虽暂得众之欢心而与之合，其合也必易离，恶能越大川、历危难。","T":"彖曰：同人，柔得位得中而应乎乾，曰同人。同人曰。同人于野，利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。","T.N":"“柔得位得中而应乎乾”，此以卦体定名、释义者也。柔者六二，乾者九五。六爻之内，阴独此一画，故六二当成卦之主，一卦同人之功系焉。阴居阴位，其位既正，又处下体之中，与人和同之资于是乎具。顾柔道不能自任，必“应乎乾”而后可：上得乾以为应、以为辅，然后能同于人。凡柔主之卦皆然。履称“说而应乾”，故“履虎不咥”而亨；小畜称“柔得位”而“上下应之”；大有称“应天时行”：其要皆在柔得其位、必得乾应，而事乃克济。\n“同人曰”三字，上下文义不属，当是衍文；自“同人于野”以下，乃释卦辞者。孔子标“乾行”以发之。乾行者，天道之运行是已；其性刚健，不以私意间之。同人能广同于野、能济大川，实九五刚健无私之德为之主动；使无九五，而独任六二之柔，则不能办。\n“文明以健，中正而应，君子正也。唯君子为能通天下之志”，此释“利君子贞”之辞。内体离，其德为文明；九五之德为刚健；二五各居上下体之中、位正而相求，是为中正。无私者刚健之效，烛理者文明之功，不偏者中正之验。三者兼焉，“君子正”之名立矣。由正而行者，其心量所周，自能贯澈天下；天下之感而应之，亦不期合而自合。","X":"象曰：天与火，同人。君子以类族辨物。","X.N":"《大象》不云“天下有火”，亦不云“火在天下”，而系以“天与火”，其故可思。天体居上，火性炎上，二者所同正在此一“上”字。卦之取名同人，即取天与火并处在上、其势向上之象。君子玩此象而施之于事，则有一事焉，曰“类族辨物”。盖天下之物，千殊万别，求其尽同者无有也。同者未尝不藏异，异者未尝不寓同，二者相依而不可判分。道家者流，如庄周，置事物之差殊于不顾，而主齐物之论，混同物我而无所甄别；《周易》则不然，同与异两存而不偏废。同人之同，乃和同之同、有辨之同，非混然无别之同。孔子之系此象，正谓玩同人者当以类族辨物为务，其旨盖在此。\n训诂之义，当先辨其虚实。“类”者，动字也，比而合之之谓；“族”者，名字也，品类之别也。合二者为言，则比类以析人事之差等，使善恶不淆、是非不混焉。“辨”者，亦动字也，区别之谓；“物”者，亦名字也，品物之称。辨物与类族义实相通，皆析万物而别其类者也。","Y1.T":"初九，同人于门，无咎。","Y1.N":"“同人于门”，谓合众于门之外，非于门之内也。既越户限，则恩疏远近之等悉泯，接于前者无不可与同。其同也博而无畸重轻：昵者不因近而见亲，远者不缘疏而见弃，惟秉公以相接。后此之吉凶悔吝，别有其渐，未可豫断；就今日之位言之，则可许其无咎。\n是爻之义，须自爻象求之。初九，阳也，处同人之始，其上未有阴焉与之相牵。初与四位居相应，而此卦两爻皆阳，阳不纳阳，是以其为无系。同人之道贵公，无所系者，公之至也。","Y1.X":"象曰：出门同人，又谁咎也。","Y1.XN":"孔子释“同人于门”而曰“出门同人”，明“于门”即“出门”之义。举足出户，就门外而求同，其所同者广，斯为不偏不党之同。既已如是，尚有何人得而咎之。","Y2.T":"六二，同人于宗，吝。","Y2.N":"同人之道，所同者愈广则愈善，愈狭则愈不足取。宗者，宗党之谓。“同人于宗”，即合众于门内，所同止于一门之宗党，视“于门”“于野”皆为狭隘，是以可吝。\n然六二一爻，本职为同人之主。自全卦言，其柔得位、得中，而与九五为正应，有与人相同之义，未可谓不善。自爻义言则不然。正应本美事，独在同人之卦为病：六二惟其所系应者是同，所同既囿于一，其量自狭，不及初九之无系应而所同者广。此初九所以无咎，而六二所以吝也。","Y2.X":"象曰：同人于宗，吝道也。","Y2.XN":"“同人于宗”之吝，非偶然而致，乃其道自取。案易之通例，六二与九五虽为正应，而爻辞于六二往往有戒，在同人一卦为尤著。盖六二之所系应者九五，专意与之相同，譬若仅厚于有亲之宗党，而于无亲之外人概从摈弃，其为道也，吝亦宜矣。","Y3.T":"九三，伏戎于莽，升其高陵，三岁不兴。","Y3.N":"三之上应在上六，然此卦三为九、上亦为九，两刚相值，非正应也。当同人之世，应乖则不同，不同则异，异则乖争随之而起。“伏戎于莽，升其高陵，三岁不兴”，即此乖争之形于爻辞者。顾其争也，伏而未发，历三岁之久终未及于实事，则犹在戒惧备御之节，未成兵祸也。","Y3.X":"象曰：伏戎于莽，敌刚也。三岁不兴，安行也。","Y3.XN":"爻辞“伏戎于莽”，乃“伏戎于莽，升其高陵”之省文。“敌刚”者，目九三与上九言也。敌训为应：两刚相值，名相应而实相拒，是谓“敌刚”。兵端既伏，而“三岁不兴”、师终不举，何也？“安行也”。安行者，无所措步之谓。九三有斗心而无斗力，故久而不发。","Y4.T":"九四，乘其墉，弗克攻，吉。","Y4.N":"墉者，垣墙也。“乘其墉”，越墙而薄之，有进攻之势焉。所攻者谁？初九是已。九三之于上九为“敌刚”，九四之于初九亦然：两阳爻分居相应之位而实不相应也。同人之世，不应则异，异则相攻之象生，此九四与九三所同者。然而有辨：九三阳而居刚，刚过则锐于进而不知止，故“伏戎于莽”，迟至三年不兴，其意向在执迷不复；九四阳而居柔，柔则有所回旋，故虽已乘墉而“弗克攻”，终得吉，其义在困而能返。","Y4.X":"象曰：乘其墉，义弗克也。其吉，则困而反则也。","Y4.XN":"“乘其墉”三字，举首句以该全爻，“乘其墉，弗克攻”之省也。心已动于攻，力又足以攻，而讫不闻加兵者，曷故？病在“义弗克”耳。义弗克云者，非力不足，乃自省其据义不正，遂止而不为，其中固有迁善改过之意。其所以得吉，正坐此知困而能反，反之于正也。","Y5.T":"九五，同人先号咷而后笑，大师克相遇。","Y5.N":"合六爻而观之，同与异凡两变：内体之趋向，自合而离；外体之趋向，自离而合。“同人于门”，所同者普，其程度为高；“同人于宗”，则已有所限而稍杀。及九三“伏戎于莽”，遂由同入异矣。入外体，九四“乘其墉，弗克攻”，犹是异而未同。至九五而机势一转，异乃复归于同。“先号咷”者，异之状；“后笑”者，同之效。同人之道至九五而反正，同卒胜异，故系以“先号咷后笑”。\n九五所同者何？六二是也。然九五之与六二，非可安坐而合。其间必有事焉：排去阻隔，然后相遇，故曰“大师克相遇”。","Y5.X":"象曰：同人之先。以中直也。大师相遇，言相克也。","Y5.XN":"“同人之先”，省文也，全辞当作“同人先号咷而后笑”。省首句以包下文，乃孔子系《小象》之常法。“直”之与“正”一也，“中直”即“中正”。所以变“正”言“直”者，取与“克”字同韵耳。孔子之意若曰：九五何故先号咷而后笑，能自异而复于同？由其位居中正也。中正而与六二为正应，其卒相遇而相同，乃理之必至。特一时为九三、九四所间，宜同而不得同，故悲而号咷；然终必得应于六二，故乐而笑。\n“大师相遇，言相克也”。一卦之变，先合而后离，复由离而合。离之复合，非徒拱手可致，必大师先克其阻，而后相遇之实成。大师者，军旅之称；克者，战而胜之之谓。胜九三、九四之隔，然后六二可得而遇也。","Y6.T":"上九，同人于郊，无悔。","Y6.N":"古之建国，必立邑以为枢，邑之四周曰郊，郊之四周曰野，其界秩然。“同人于野”者，卦辞之辞，寓天下至公大同之量焉。郊与野相邻，去野为近，故上九“同人于郊”，亦有无私之意；然所及犹未至于至公大同之地，是以不得言吉，仅止于无悔。","Y6.X":"象曰：同人于郊，志未得也。","Y6.XN":"郊去野犹一间；上九之量，止于无私而未及大同，其愿终不酬。","Z":"同人一卦，其可举者二端。一曰卦义在“同人于野”，期与天下之人相合也。然同之所起，必与异俱：有异而后有同，同立则异生，异穷则复归于同。故九三言“伏戎于莽”，九四言“乘其墉”，六爻之中乃有两爻言异。自初迄上，全卦实为一自同趋异、复自异返同之序：初九“同人于门”、六二“同人于宗”，同也；而“于宗”之量不及“于门”；至九三而变为异；九四“乘其墉”，异之尤者也；历九五“先号咷而后笑”，逮上九“同人于郊”，乃转异为同。二曰六二虽为一卦之主，而不足以尽大同之旨。以广狭为次，则宗最狭，门次之，郊为最广；然较之卦辞之野，郊犹隔一尘。是知六爻之辞，皆未足以发卦义，主爻之德亦未能概一卦之全也。"}},"14":{"id":"14","cnNum":"一四","name":"大有","pinyin":"dà yǒu","fullName":"火天大有","shortFullName":"火天大有","upper":"离","lower":"乾","upperNature":"火","lowerNature":"天","lines":[1,1,1,1,0,1],"yaoLabels":["初九","九二","九三","九四","六五","上九"],"blocks":{"P":"大有之次同人，以其相反也。天与火为同人，倒转之则火在天上，是大有矣。同人者，我往同乎人；大有者，物来归于我。序卦所以系大有于同人之后，谓物有所归，其序固然。卦名所取，在爻位：六位之中，阴仅一爻而居第五，五者尊位，五阳环列而归之，尽在所包之内。阳大阴小，《易》之通例；五阳之大尽属一阴，所有者既大，故曰大有。大者言其量，有者言其无所不备。","G":"大有，元亨。","G.N":"六十四卦之中，卦辞止书“元亨”而无他语者，独大有此一卦。卦辞之于卦名，例相联属，故释此二字，当先辨“大有”之所以为大。全卦六爻，阴止六五一位，柔顺而得上体之中，又据尊位；其余五爻皆阳，悉归之而为所有，悉听之而为所用。所有者大，则亨自随之。然“元亨”之解，尚须与乾卦相较。乾之元亨利贞，笼罩宇宙，四字各为一义，其元训始，谓首出庶物；他卦言元亨利贞，止就一时一事立论，义与乾殊，其元多训大，兼有善义。故他卦之“元亨”，当读为大亨，乃元之亨，非元与亨并列；乾之“元亨”，则元、亨各自为义，不当以元之亨概之。","T":"彖曰：大有，柔得尊位大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。","T.N":"彖传释名，取诸卦体。其言“柔得尊位大中而上下应之”者，柔即六五，尊位即五，大中谓其德充盛而居中也。同人与大有，同为五刚一柔之卦，而所主迥别：柔在下体之中者，卦主为六二，其辞曰“应乎乾”，是六二自下而上应乎阳刚，我同乎人之义，故为同人；柔在上体之中者，卦主为六五，其辞曰上下应之，是五阳自四面而来应我，我有其大之义，故为大有。合二者观之，可得一例：一柔五刚之卦，柔居上则称上下应之，柔居下则称应乎乾，辞异而位使之然。\n至“其德刚健而文明，应乎天而时行，是以元亨”，则又从卦德卦体推明卦辞。就文势论，“元亨”之实，本系于卦名：唯其为大有，是以元亨。彖传不复止于名义，更即刚健文明之德，扶出其底蕴。内体乾，刚健；外体离，文明。兼举上下二体而总赞其德，故曰刚健而文明。“应乎天”者，指外卦六五下应内卦九二而言。刚而不过于刚，明而不伤于察，则天下虽广，无有窒碍，此元亨之所由致。","X":"象曰：火在天上，大有。君子以遏恶扬善，顺天休命。","X.N":"下体为乾，乾象天；上体为离，离象火。火在天上，其光下烛，万物无不入于照临之中，所含者广，故取大有名卦。君子观此象，法其照临之无私：恶者遏之使不行，善者扬之使可见，是谓遏恶扬善；天命有常，顺而不违，是谓顺天休命。人事有善恶，天道有常度，二者非一，而居上者兼体之：明足以辨善恶，敬足以奉天则，善有所彰，恶有所止，而赏罚之分明自寓其中。","Y1.T":"初九，无交害，匪咎，艰则无咎。","Y1.N":"初九居大有之始，以阳处最下，位卑而分浅，上无系应之亲，亦无党与之助，故骄盈之失无自而生，是谓无交害。交者交接之谓，未有所交，则害无由起。爻辞复系以“匪咎”者，大有之时本不当有咎，然自以为无咎而处以轻易之心，则咎反由是而招。唯念艰难，持之以戒惧，不萌侈泰之念，乃能终保其无咎。","Y1.X":"象曰：大有初九，无交害也。","Y1.XN":"小象标举“大有初九”而以“无交害也”释之。九居初位，未与物接，既无攀援，亦无争竞，故害不及身。","Y2.T":"九二，大车以载，有攸往，无咎。","Y2.N":"古之大车，任载重之物，驾以牛而行。当大有之世，九二处下体之中，上应六五，为君所倚信。其体则阳也，刚健之材足以任事；其位则阴也，能以谦抑自下；又居下体之中，动不失中。材、德、位三者兼备，故能荷大有之重，有大车以载之象。任既重，行复远，其无咎也宜矣。","Y2.X":"象曰：大车以载，积中不败也。","Y2.XN":"爻辞但言“大车以载”，其所以能载之理未彰，小象以“积中”二字补之。九二以阳居阴，又得下体之中，谦而不盈，中而能容，所有之道蓄于内而不外驰。以车喻之，重物实于箱中，行止由我，虽震撼击撞之交至，未有倾覆之患。","Y3.T":"九三，公用亨于天子，小人弗克。","Y3.N":"九三于大有之时，位不居中而得其正，又以阳刚踞下体之上，其分位相当于公侯列于卿大夫之上。爻辞之亨，朱子读为享，其说是。观于《左传》，其用亨也，率当读享，义取朝献。享献、亨通、烹饪三义，古皆假亨字为之，本无专字；许慎之书，亨、享同条，谓其本为一字，经中遂互见。然则孰为亨、孰为享，断以文义为准。此处云“公用亨于天子”，其为朝献甚明，若作亨通解，则文不成义。公者九三，天子者六五。九三为天子之外臣，等於诸侯，当富有盛大之世，能以己之所蓄输献于王，于分为当然，于事为可取。此唯知礼者能之，小人则局于吝啬，有所不能。","Y3.X":"象曰：公用亨于天子，小人害也。","Y3.XN":"小象以“小人害也”申爻辞“小人弗克”之义。使小人而当此时、居此位，非但不能输献于上，且将挟其所有以为害。","Y4.T":"九四，匪其彭，无咎。","Y4.N":"彭字之训，朱子阙如，程子则曰“彭，盛多之貌”，其说盖取证于《诗》之语例。“匪其彭”者，正与盛多相反，谓损之又损也。九四之在卦也，去中已远，值富有之会，盈满之势成焉；势盈则易倾，衅隙多由此起。然九四以刚爻而居柔位，刚质柔用，能自抑损，知戒知惧，不肯履其极盛，是以无咎。","Y4.X":"象曰：匪其彭无咎，明辩晢也。","Y4.XN":"处方盛之势而能逆睹盛极必致咎之几，先自裁抑，不使盈满召祸，此非明智者不能，故曰“明辩晢”。辩者辨之明，晢者照之彻，合而言之，谓明智之至。","Y5.T":"六五，厥孚交如，威如，吉。","Y5.N":"六五者，大有之成卦之主也，五阳之所归。以阴爻而居尊位，柔顺得中，能虚己以下应九二之阳。上以诚信接下，下亦以诚信奉上，彼此孚通，情意相属，可谓亲密而志同。此大有之世，君臣相与之一面。然六五以柔爻处阳位，柔顺之中自有凝重之气，故曰“威如”。威如者，状其威仪，非言刑威；君有其仪，望之而可敬可畏，则下不敢慢。此又君臣相与之另一面。柔而居中，居尊而不失其威，交如、威如两得之，吉可知矣。","Y5.X":"象曰：厥孚交如，信以发志也。威如之吉，易而无备也。","Y5.XN":"上下孚信相通，固非一事之所能成，然其机则在君。君先之，臣后之，感应之理然也。六五先以己之孚信发其端，九二诸爻之志因之而兴，应之于下，与之孚交，皆出于心志之自然，非劫于势而强相从也。至“威如之吉，易而无备也”一语，说者各异。程朱之意，谓君道过柔则无威，无威则下不畏服，因亦不复为之戒备。孔颖达则反之，以为“易而无备”属之六五，不属九二诸爻：六五之所以威如而吉，不在设防以御下，正在推诚以接下，坦然而无私，简易而无所猜防，故人自敬之。二说相较，孔氏为长。","Y6.T":"上九，自天佑之，吉无不利。","Y6.N":"《系辞》训佑为助：顺者天所助，信者人所助。人苟履信、思顺而兼尚贤，则佑自天降，吉无不利。程朱以此四事属之上九，窃谓不然。就六五验之：“厥孚交如”者，践乎信也；柔而后尊，不自满假，安乎顺也；五阳并峙而最上者尊，居尊之君顾肯下之，崇乎贤也。三德备于一身，天佑之所由基，故吉无不利；此六五之德所必至之效，而于上九发见之。六五为成卦之主，其效即全卦之效。\n《周易》全书，辞系于终爻而义归他爻者，其例不乏。小畜之上九，系以妇贞月望之戒；离之上九，言王用出征；解之上六，记公之射隼；师之上六，述大君有命。诸爻皆居卦终，而辞之所指，不尽在本爻。明乎此，则大有上九之辞，不宜独系于上九也。","Y6.X":"象曰：大有上吉，自天佑也。","Y6.XN":"称“大有上吉”，非为一爻而发，乃统全卦言之，谓大有之终，吉无不利，不独上九为然。何以系以“自天佑”？古人于尚贤一事，推之甚至，以为大有之世，义莫重于尚贤；而大有至六五，犹能尊上九之贤而下之，是尚贤之实也。上九之位，盛之极也；盛极必衰，凶宜及之，而竟得吉无不利者，由六五之尚贤也。此似非人力可致，故归之于天。然所谓天者，非有神明司其赏罚，乃事理相推之必然耳。","Z":"大有之体，下乾上离。一阴居五，为五阳所宗，五阳之所有，悉归六五，故名大有，辞系“元亨”。元亨者，大亨也；大亨之占，无以复加。六爻之义亦皆可观：初九言艰则无咎；九二器足以容，如大车之受重，致远而不败，所适无咎；九三致其奉献，故曰“公用亨于天子”；九四能自损抑，是以无咎；六五以柔处尊，孚交而威如，故吉；上九盛极当衰，赖六五履信思顺而又尚贤，终得自天佑之、吉无不利。\n经传之旨，颇寓辩证。初九“匪咎，艰则无咎”，见咎之不系于外而起于自取：富盛之地，最易生愆，念艰而不敢自安，则咎无由至。九四“匪其彭，无咎”，当得势之顺境，苟能自裁自损，咎亦可以不生。故咎与非咎，本无常定：慎则咎者可弭，肆则无咎者亦可以生愆。其间转移之机，非无所待；而所待之成否，多由人之自勉与否。六五“厥孚交如，威如，吉”，信与威并著，当大有之世乃得吉，是已见事之两面。\n通观全卦，自初迄终，皆以知艰为无咎之要，而于虑始慎终致意尤深。小象于初则系“大有初九”，于上则系“大有上吉”，中间诸爻不复冠以大有，非偶然也：盖谓克艰于初，乃有终之天佑；慎终如始，而一以艰自处，斯为大有之道。"}},"15":{"id":"15","cnNum":"一五","name":"谦","pinyin":"qiān","fullName":"地山谦","shortFullName":"地山谦","upper":"坤","lower":"艮","upperNature":"地","lowerNature":"山","lines":[0,0,1,0,0,0],"yaoLabels":["初六","六二","九三","六四","六五","上六"],"blocks":{"P":"谦之所以承大有，《序卦传》尝言其故：物既有大，则不可复求盈满，是以谦承其后。此序非苟然者，其中固有义焉。凡物之进也有涯，至其涯则盈，盈则不能不革，革而向其反面以去。取譬于天：日行至中而后西斜，月魄既圆而后渐蚀；征之于人，治道极盛而乱兆生，势位极隆而衰机伏。欲使衰乱不及其身，舍常持抑损之心，别无他术。作者于大有之后系谦，其深于辩证可见；凡以告人者，富且盛矣，则谦抑愈不可已也。\n谦之名义若何？程颐谓有德而弗自居，朱熹谓虽有而不居，两家立说相通。以卦体观之，坤在上而地为象，艮在下而山为象。山形高峻，地势卑下，高峻者顾居卑下者之下，非有德而弗居者乎？\n古人于谦致力最笃，以其利博而害寡。六十四卦之中，他卦率系以悔吝凶咎，独谦则下三爻尽吉、上三爻尽利；合全卦而观，谦即自亨，不假他条件而后然。谦之可贵，于此可睹。","G":"谦，亨，君子有终。","G.N":"不论何人，苟以谦巽自持，皆无不亨。谦之致亨，不待他助，本无所须。然暂焉行之易，终其身守之难；所贵者正在此终身不改之一节。能安于谦而久不变者，惟德充之君子；小人则勉强于俄顷，末路每不能继。程颐尝析其故：君子通达乎理，是以安

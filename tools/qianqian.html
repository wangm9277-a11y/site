与九四相配而反踞其上，遂成倒趾之形。趾倒则失常，失常则非吉。然趾既翻覆，口腹向下，久积之秽遂可尽倾，“利出否”是矣。否者，污败之物。宿垢一荡而空，于器为舍旧取新、去滓存清，则又未必不吉。此一翻转，正所以为利。\n“得妾以其子”者，借彼况此。文异而旨同。妾之分卑，子之分尊。妾身具两面：论其位则微，论其效则能诞育嗣人，生承祭主丧之子。以礼言，君子不当幸妾，幸之则失常而非吉；然幸而得子，宗祧赖以不坠，则亦未尝不吉。爻辞所以示人者，观物之法也：见其可憎，更须于可憎之中寻其所可取。倒趾、纳妾，皆可憎者；而倒趾可以涤秽纳新，纳妾可以得嗣承家，可取者即在其中。迹若有咎，究其实则无咎。","Y1.X":"象曰：鼎颠趾，未悖也。利出否，以从贵也。","Y1.XN":"趾居于下而承鼎身，此其常也，于理无违。今乃颠而居上，则常者变、顺者逆矣。然象辞不以为悖，而曰“未悖也”，何也？鼎趾既翻，宿秽得以尽倾，于致洁纳新实有助焉——逆之中仍有顺者在，故曰未悖。至“利出否，以从贵也”一句，语意兼摄下文，实并“得妾以其子”而释之，特省其文耳。从贵云者，初六上应九四之谓。出否而可以取新，取新即是从贵；得妾而可以生子，生子亦是从贵。两事殊途，同归于从贵。","Y2.T":"九二，鼎有实，我仇有疾，不我能即，吉。","Y2.N":"九二刚而在下体之中，中不空乏，于鼎为贮实之状。仇谓相偶，犹《诗》所云“君子好逑”。疾者，忌而害之也。初六以柔逼近而相邻，两阴阳相附则情易牵，情牵则隙易启，柔之图刚，常由于此。故在九二言之：“我仇有疾”——与我为匹者，逼近而窥，势必忌我。处之奈何？曰“不我能即”。守其中，持其刚，外不与校而内不可犯，严而不厉，使彼无罅可投，欲近而不得近。如是则吉。","Y2.X":"象曰：鼎有实，慎所之也。我仇有疾，终无尤也。","Y2.XN":"中实之鼎，譬如士之有材具。材具既足，则举足之际最宜审量，“慎所之”一句尽之。趋向一差，材适足以助其失，故不可不慎。九二于此最有分寸：舍初六之近昵，而应六五于上，弃迩即正，正是慎行的凭据。尤者，过也，亦怨之所从起。既已执中守刚、动不逾闲，则彼虽有相害之图，终苦于无可乘之隙、无可指之愆；加罪无辞，其怨自解。","Y3.T":"九三，鼎耳革，其行塞。雉膏不食。方雨，亏悔，终吉。","Y3.N":"鼎三与井三，取象各别，而用意大略相通：两爻皆处下体之终，有其才而未逢其用。井之九三，阳刚而位正，才足有为，譬如清冽之泉伏于井底，汲者未至，甘美虚设。鼎之九三，阳刚而在巽之上，刚而不失其顺，才堪任事，所少者惟在上者一顾之知、一拔之用耳。然而三与五之间本无相应之途，上下隔塞，情意难通，故有“鼎耳革，其行塞”之象。耳者，指六五而言；革者，变也、改也。鼎之移徙，必以铉贯耳而后举；今耳忽有变，举无所施，则五之行止为之中滞，无从下达于三。就九三之身观之，则如“雉膏不食”：雉之美者在膏，膏在鼎中，本是可食之物，而食与不食，其权在人，不在物。然此特一节耳。更有“方雨，亏悔，终吉”一层：六五为文明之主，九三上承之，又能力持刚正，五终当求三而用之。五阴三阳，阴阳相协，和则为雨。始也不遇，故有悔；终也相遇，故得吉。","Y3.X":"象曰：鼎耳革，失其义也。","Y3.XN":"《象传》所谓义，多指道、指理；失义即失道。此曰“失其义”，非谓九三所行悖于道，乃谓其爻所处之位不得其道。何由而失？《易》例，爻与爻之间有比、有应、有乘、有承，四者所以通其情。今“鼎耳革，其行塞”，所指为三与五之关系，而三之于五，非比非应，亦非乘承，往来之路既绝，故谓之失义。失义者，失道之异辞也。","Y4.T":"九四，鼎折足，覆公餗，其形渥，凶。","Y4.N":"此爻之蕴，孔子早已道破。《系辞传》举三类可忧之象——德不厚而踞高位，识不广而图大事，力不胜而负重任——断曰如此者少有不败；因引本爻为证，而总之曰“不胜其任”。然则折足、覆餗、形渥之祸，其来何处？可分数端。鼎中之实，聚于二、三、四三画，九四适当其满处，满则易欹，一也。九四以刚质而处上体之底，又与初六为配：仰则承君，俯则接下，两副担子并压一肩，本非其力所堪；且所配之初六先已倒趾，以倒趾之耦为倾覆之缘，足折而食倾，势所必至，二也。以人伦言，九四身居辅弼，担天下之事，正当旁求明智以自辅，却舍此不为，下与初六相结，引不堪用之柔佞而授以职，是德不称位、才不逮事，败坏可期，亦折足之象，三也。凡此非出偶然：易中九四与初六为配者，大抵受损而无益，可类推而得。\n“覆公餗”之餗，前儒聚讼。昭公七年《左传》记正考父家庙之鼎有铭，言稠者自此出，稀者亦自此出，取以充饥而已。粥之稠者为饘，饘即是餗。据此，鼎中所盛非他物，乃或厚或薄之糜粥。所覆而系以公者，缘其地望切近君所，职在辅弼。渥者，沾湿之状。足既折，器随仆，粥浆四溢，淋漉沾衣，形状狼藉不堪。耻集于身，殃及于身，故曰凶。","Y4.X":"象曰：覆公餗，信如何也。","Y4.XN":"居辅弼之地，受天下之托，而才不副位、德不胜任，终至足折、食倾、身沾，狼狈若此，则所谓信者，尚于何处求之？","Y5.T":"六五，鼎黄耳，金铉，利贞。","Y5.N":"鼎之德，须待人提挈搬移而后及物；滞于一处，则腹虽充积，不过一件陈设。欲其可提可移，两物不可或缺：耳必空其中，铉必利其贯。六五兼有之。其处一卦之上，正当受贯之地，是耳之象；上九横亘于外，穿耳而过，是铉之象。耳不泛称，而曰“黄耳”。黄者，四方之中色；耳而系以黄，明其腹中空然，无所壅塞。此一层最要：中苟窒实，铉虽良，无自而入。上九为阳画，故曰“金铉”；金亦非泛称，取其在物坚牢，可任重力。空耳受坚铉，提举之事遂无障碍。然此特六五现成之凭藉耳。六五柔画而据刚位，所处不正；要使空耳纳铉从可能而进于实然，仍须人以守正济之，故爻辞于黄耳、金铉之下，更缀“利贞”二字。","Y5.X":"象曰：鼎黄耳，中以为实也。","Y5.XN":"《易》之通例，阴虚而阳实，六五为阴爻，宜若无实德之可言。然《易》道尤重乎中：六五所据者中，即以中为实。其能主一卦、得鼎之道，正坐此耳。","Y6.T":"上九，鼎玉铉，大吉，无不利。","Y6.N":"两卦之爻，皆以最上为极致。食在器中不为用，烹熟取出而其用乃见，故鼎上九系以“大吉无不利”；水藏井底无功于人，待汲而上而其功乃成，故井上六系以“元吉”。上九之画，一阳横陈耳端，铉也。同一铉而随所对异名：自六五之柔望之，阳刚也，故曰金铉；就上九自身言，以刚居柔位，刚而不失温润，则曰玉铉。玉之为物，刚柔两不相胜，动静皆不过分。上九处功成致用之时，所贵在善自位置；玉铉之德适逢其会，故大吉而无不利。","Y6.X":"象曰：玉铉在上，刚柔节也。","Y6.XN":"上九何以取玉铉为称？为其“刚柔节”也。节者何谓？上九体质刚而所履则柔，刚柔相济，适可而止，与乾上九之亢而有过者迥异，此之谓刚柔之节。","Z":"六十四卦中，径以器立象者，井与鼎二者。井以全体为井，鼎亦以全体为鼎。器有分量，卦有六位，逐节可配：足居底，初爻当之；腹居中大，二、三、四三爻当之；耳在顶，五爻当之；铉在外，上爻当之。而爻辞所系，又各随其部分之职司而立。足在下以承一身，初六之辞由是而有倒趾；腹居中可以受物，二、三、四三爻遂分系有实、雉膏、公餗；耳踞鼎顶，六五居之，遂有黄耳之目；铉匝器外，上九居之，遂有玉铉之目。四者凑泊，鼎形乃完。器之诸节相须，卦之诸爻亦相须。九四位在腹而辞称折足者，以其与初六为配，所折之足归之初六也。六五位在耳而辞称金铉者，以其比于上九，所贯之铉归之上九也。至若六五为耳，九三亦系以耳，则缘三、五之间本无应，故有耳革之象。此皆爻象互取，不拘本位的明验。故读鼎爻者，先辨位与辞之相权可也。\n至于义，则鼎与大有相类者多。大有之辞不旁及而止言元亨，鼎亦然；大有终爻得吉无不利，鼎之终爻更加一“大”而为大吉无不利。其故安在？两卦并以尊贤、养贤为骨也。而此意又全系于终爻与第五爻之际：上九刚德为贤之表，六五居高而以贤自下，尚贤之义即在此。辞中元亨之效，验之于终爻之辞而后见。两卦复有一同异于他卦者：其大象俱系以天命。大有之象，取天以昭事，而曰休其命、顺以承之；鼎之象，取木火以明功，而曰正其位、凝以守之。一者顺之，一者凝之。夫所谓命，无为而自成，无召而自至，乃事势之必然，即迁变之条理，非别有一神明据其上而予夺之。顺之与凝，皆循其条理而尽人之力焉耳。"}},"51":{"id":"51","cnNum":"五一","name":"震","pinyin":"zhèn","fullName":"震为雷","shortFullName":"雷雷震","upper":"震","lower":"震","upperNature":"雷","lowerNature":"雷","lines":[1,0,0,1,0,0],"yaoLabels":["初九","六二","六三","九四","六五","上六"],"blocks":{"P":"器必有所主，主之者必以亲且长。《序卦》次震于鼎，其辞曰“主器者莫若长子”，正为此发。宗法之世，承祧之责专属家嗣，长子于礼最尊，故其任亦最重。《说卦》配乾于父、配坤于母，而以“震一索而得男”属之，震之为长男由此。长男职在主器，则鼎后不容无震，序固宜然。更即卦画求之：二阴居上，一阳郁于其下，郁极思奋，奋而上出，动象以成，卦名以立。然则动之一字足以尽震乎？未也。震兼惊惧、振奋二义，不徒曰动者，正缘其中有雷气勃发之象，非一动字可了。","G":"震，亨。震来虩虩，笑言哑哑，震惊百里，不丧匕鬯。","G.N":"震卦卦辞所论，不落于事为，而落于人心。人心于此有二端：一曰惧，一曰不惧。二者若冰炭之不相入，何以同条而共贯？不知惧与不惧本非两事，乃同一修养在浅深先后间的两种呈露，分之为二，合之则一。凡人之情，临事而能戒惧，戒惧之至，自生出镇定来；所谓不惧，非莽撞之谓，正从戒惧中炼出。惧植其根，不惧成其效，此震之所以亨也。\n“震来虩虩”，说的便是临事知惧。雷未作而惧先动，雷既作而惧仍在，故“震来”不在身外之境，而为心内之感——“震来”二字，即是惧也。虩虩读如隙，乃状此惧之貌者。惧与虩虩同起同住，非两截心境。合而观之，谓其畏惧周环、反覆顾虑，不敢一刻自安。此种畏惧属小心戒慎一路，与畏葸退缩、胆小怕事者判然不同。\n后半三句，意脉另转：平日临事知惧之人，一旦猝逢大变，反能不惧。不惧之验，在“笑言哑哑”——大事压顶，言笑犹和，举止如常，有事而若无事，此非常人可及的气度。“震惊百里，不丧匕鬯”二句，一面为前句补足，一面点出位高任重者尤须具此涵养。\n请言其状：疾雷作而声闻百里，闻者莫不惶骇，独主祭之人气息安闲、颜色不改，手中匕、鬯不因雷而坠，祭事依旧行去。雷之至也，俄顷之间，思虑未及安排，人之应之，几乎出于本能，故古人以此为验养之准的。匕者，祭时升鼎中牲体于俎上的木器；鬯者，以秬黍之酒调郁金而成，气芳味厚，为酒之上品。祭事非一，而主祭者亲执者惟此二事。卦辞取譬于此，谓人无论遭何危厉，皆当从容不失其度；自天子、诸侯而下，至卿大夫之家的大宗、小宗，身系一家一国，尤当如是，虽山崩地坼亦无所动。古人于此类涵养再三致意：《书》称“纳于大麓，烈风雷雨弗迷”，《孟子》言大丈夫“威武不能屈”，皆谓负天下之责者，当大事、处危境，不可无不动之守。","T":"彖曰：震亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出，可以守宗庙社稷，以为祭主也。","T.N":"《彖传》于震之卦名不着一语，径引卦辞“震亨”二字而已。其意若曰：震之所以亨，只在人临事由惧而得亨，更无余义。\n“震来虩虩，恐致福也”——人遇事而生戒惧，因戒惧而反求诸己，行必审慎，则祸可避而福自随，是惧乃致福之阶。“笑言哑哑，后有则也”——此句当分两层看：事之易为者，亦不可无所戒惧，此一层；事之难且危者，仍当谈笑自若、不动声色，此又一层。则者，法也，常也；有则，谓出处语默一循其常，不为外变所夺。\n“震惊百里，惊远而惧迩也”——惊主雷言，雷声所及者远且广；惧主人言，人之怀惧者近在身侧。雷威如此，人自不得不惧；然为人君继体之长子，却不当以此而惧，正须“不丧匕鬯”。\n“不丧匕鬯，出可以守宗庙社稷，以为祭主也”——此句之前，《彖传》脱“不丧匕鬯”四字。出者，继世而主祭之谓。长子果有“震惊百里，不丧匕鬯”之养与度，则一旦先君捐馆，便可出承世祀，荷天下之重矣。","X":"象曰：洊雷震，君子以恐惧修省。","X.N":"洊者，再也。上下二体皆震，是雷声相续而至，故曰洊雷。君子于此象得两事焉：曰恐惧，曰修省。此二者，乃君子自身之洊雷——心存戒惧为一雷，因戒惧而检身改过又为一雷，两重叠至，与天雷相应。然其根在平日，非素无戒惧，待雷鸣而后仓卒生畏。戒惧先立乎中，修省随形于外，洊雷之象，不待外求。","Y1.T":"初九，震来虩虩，后笑言哑哑，吉。","Y1.N":"震之初九，其辞与卦辞几于全同，所增惟“后”“吉”二字；小象又全袭《彖传》。求之三百八十四爻，此例更无第二。\n其故安在？震之一卦，本以人心之修养立义。其旨盖谓：人所遇无论难易危安，事小亦当存戒惧、反身修省、措置审慎；事大亦当从容镇定、胸中不摇。此等工夫，须自初发处立定；初时不立，待变故既生而仓皇补苴，断无及理。作爻辞者以此系之初九，职是故也。抑又有一义：震之用见于下体，初九居下体之下，刚明在内，一卦之主在焉，卦义之显，莫切于此爻。\n“后”“吉”二字尤耐寻味。有此二字，则“震来虩虩”与“笑言哑哑”两层，先后本末犁然可分：先有临事戒惧之心，能戒惧而修省，然后能“笑言哑哑”，即事至而谈笑自若、和适安详而不为所动。惧者其始，不惧者其终；不惧之能，实自能惧中来。二者兼尽，吉斯系焉。以轻重论之，“震来”之惧为根本，“笑言”之不惧为效验，判然不可倒置。","Y1.X":"象曰：震来虩虩，恐致福也。笑言哑哑，后有则也。","Y1.XN":"小象文字与《彖传》全同，义亦无别，兹不复释。","Y2.T":"六二，震来厉，亿丧贝，跻于九陵，勿逐，七日得。","Y2.N":"柔爻而履柔位者，六二是也。中德既充，位复得正，处震之善，无逾此爻。\n先释“震来厉”。震之方来，其势逼人，当其冲者危不自安。此处“震来”与卦辞同指，皆就心上说，非谓雷自外来。六二之危，危在乘刚：柔居刚上，所据者非其地，故其惧视诸爻为深，几几乎不可终日。\n然迹其实，咎未及身。有中德者，遇事自有分寸，处之曲当。\n次释“亿丧贝”。亿者，度也，量也：六二默自审量，知所处未善，势必暂弃其宝货，甚且举其所至重者而弃之。既不可保，则舍之无所顾惜。\n跻者升也，九者数之盈也，陵者高阜也。“跻于九陵”，升高远举之谓；物既舍矣，一听其去，“勿逐”者，不更为之追也。\n“七日得”云者，谓为时既至，向所失者自还。此语亦见于既济六二。两处皆以七日为期，其义何居？其说具于王引之《经义述闻》：计日之法以旬为准，五日为半，不足半而约称三，逾半而约称七。盖欲见还为日无多，不出旬外，故系之七日。其说可从。","Y2.X":"象曰：震来厉，乘刚也。","Y2.XN":"初九刚爻也，六二在其上，所谓“乘刚”者，乘此爻耳。小象之标“乘刚”，合本爻凡五见：屯六二、豫六五、噬嗑六二、困六三，及此爻。困六三所乘，乃坎体之中爻；余四爻所乘，皆震之初九。凡“乘刚”之爻，大抵凶中藏吉，或始塞而终通。","Y3.T":"六三，震苏苏，震行无眚。","Y3.N":"柔质而宅刚位，所履不正，“苏苏”之象由是而立。苏苏者，非惊惧之容，乃神气消索、志意颓然之谓。\n平居尚尔委靡，况又值震动之时，其致眚也固宜。眚者，过也，灾之小者。\n爻辞对举“震行”，正与“苏苏”相反：一进一退。三若乘此一震，翻然易辙，由三进四，脱阳位之不当，就阴位之本分，则祸转为福，眚化为无眚。许之如此，见其尚有可救。","Y3.X":"象曰：震苏苏，位不当也。","Y3.XN":"遇震而惧，固其所宜；惧而至苏苏，则非。惧得其正者为善，苏苏则馁而不振。六三何以苏苏而缓散若此？无他，柔质而居刚位，既不处中，又不当位，其气自不能固。","Y4.T":"九四，震遂泥。","Y4.N":"卦辞言亨，九四独系“遂泥”，二者正相背而驰。泥者，滞溺之名；遂者，往而不返之意。二字相缀，所写是身陷泥涂、欲反无由、欲拔无力之状。\n震之道本具两面：就象言，动则通；就人言，惧而修省、奋而振作，亦通。“遂泥”则并此两端而尽失之——居震不能戒惧以自守，求动不能鼓勇以前行，震之所以成其为震者，至是澌灭无余。譬如人当困心衡虑之日，胸中虽有远图，一步亦不得展。\n此象何以独系于四？初与四皆阳，同居下体，皆不处中，似无差别。然初九一阳振于二阴之下，独得动之本相，故其辞合于卦辞；九四刚而处柔，健德先亏，又为四阴所夹，欲振无阶，故其辞与卦辞相悖。","Y4.X":"象曰：震遂泥，未光也。","Y4.XN":"光者，广也；“未光”，谓其志不得舒，所就者狭。九四所以“震遂泥”，正坐所处之地：刚健既失，重阴复困，才力无所施，志气无所达，故未光也。","Y5.T":"六五，震往来厉，亿无丧有事。","Y5.N":"六五与六二，其致有相类者。二、五皆言“震厉”，皆谓能以戒惧之心应物，一也；皆居中以宅心，有中德而能亿度事理，二也。其异则在所居之体：六二居下震之上，故曰“震来厉”；六五居重震之上，雷声往还而至，故曰“震往来厉”。来亦厉，往亦厉，着一“往”字，见其无时无处不在戒惧之中，此正六五持守之密。\n二、五又有一异：同以得中取胜，而所守之物不同。六二曰“丧贝”，六五曰“无丧有事”。有事者，祭事也；无丧有事，谓祭祀之权、社稷宗庙之奉不自我而坠。六二位卑，所有者宝货而已；货可失，失而可复。六五履至尊，所守者宗庙之重器；此其重，一坠则终不可复。","Y5.X":"象曰：震往来厉，危行也。其事在中，大无丧也。","Y5.XN":"小象申爻辞，先出“危行”二字。行而系之以危，见戒惧不止存于念，且著于动履：事事先以自危为心，则无时敢慢，亦无时得安。\n“其事在中”一句，最是六五命脉。《易》之为教，莫重于中。二、五得中，位虽偶失，大抵犹善；三、四得位，而中则无之，往往反凶。盖中者自合乎正，正者未必能中，此《易》家一大纲也。\n中德既立，故能守其所守而不坠，可以长为祭主。“大无丧也”之“大”，实作动词读：所大者，无丧有事而已，所以嘉其得中而能守也。得中为本，无丧为效；本立而效从，未有两倒者。六五一路关键，究竟只在一“中”字。","Y6.T":"上六，震索索，视矍矍，征凶。震不于其躬于其邻，无咎。婚媾有言。","Y6.N":"何谓索索？气索而神散，存者无几。何谓矍矍？目动而心摇，守者不固。“震索索”，惧之过也，过则志气殚索；“视矍矍”，亦惧之过也，过则视瞻徊徨、心神无主。上六兼此二象，实由其质本阴柔，位不中不正，而又处震动之极，三者相积而致。\n人既至索索、矍矍，最当收束其行动，使惧不再深，庶可止于未败；不然必凶。躬者，上六之身；邻者，切近于身者也。上六之病在惧之过甚，其对治之方，则在豫为之防：当其未甚，先有以节之，使不至于甚。“震不于其躬，于其邻”，正谓雷威已震及近旁而未及己身之际，即先立控制之法，不令其极，如是则可无咎。\n婚媾者，与之亲昵、相与为伍之人也。此辈识见浅陋，志在偷安，但知相诱以逸乐，不察祸患之将萌；见其首领上六乃能见几而豫为之备，遂群然“有言”，非议纷起。上六于此，惟行其所当行，众口之嚣，可置之不问。","Y6.X":"象曰：震索索，中未得也。虽凶无咎，畏邻戒也。","Y6.XN":"上六之惧至于过甚，皆由过中而失中道。过中失道，宜若有凶；而终得无咎者，正以其能因邻之戒而知惧，未至极而先变其所守，故不至于索索、矍矍之甚。","Z":"读震一卦，当先知象与辞相贯、卦与爻同条。本卦取象于雷，六爻亦无不以雷为骨；卦辞所陈，是临事能惧与临事能不惧的一副心肠，爻辞反复，亦只此一副心肠。合而观之，脉络自见。\n全卦之主，初九当之。其辞与卦辞同，其小象与《彖传》同，三百八十四爻中更无第二例。所以然者：震体由两震叠成，初、四二阳实为之基，舍此则震不成其为震。\n然二阳所居，相去悬绝。初九一阳起于二阴之下，动之机最真，震之端最始；雷未发而觉之最先，惧既生而修之最先，卦义之显，赖此爻为多。九四虽亦一阳在二阴之下，顾以阳处阴，位不中不正，又为四阴所裹，溺而不能出：居震则失其守，求动则无其力。此正如志士失路，胸有筹画而进退皆穷。故震之亨，系于初而不系于四。\n二、五同为阴爻，二当位而五不当位。二之当位诚善，五之不当亦复何害？《易》道尚中，中视正为尤重；中德既得，正即寓乎其中。二者同得其中，而位之高下悬绝，取象遂分。中德在二，则失者可还；中德在五，则守者不可夺——所守者何？宗庙社稷是已，一坠则永无复理。\n合六五之辞与卦辞、《彖传》而观，可见此书所期许者，一在秉德之君子，一在居位之人君；小人、庶民，非所专为设也。\n三失其位，其象遂不逮于二：二听其自还，三则须行而后免眚。上六以柔居震之终，索索矍矍，满纸惊惶，气索而志殚；以气象论，去六三之“震行无眚”尚隔一层，视六五之“无丧有事”则更远。\n末辨一义：震所写者，心之动也，非事之变；是感于境者，非境之实。质言之，此卦主心，不主物。"}},"52":{"id":"52","cnNum":"五二","name":"艮","pinyin":"gèn","fullName":"艮为山","shortFullName":"山山艮","upper":"艮","lower":"艮","upperNature":"山","lowerNature":"山","lines":[0,0,1,0,0,1],"yaoLabels":["初六","六二","九三","六四","六五","上九"],"blocks":{"P":"《序卦传》以震为动，谓万物不能终古动而不息，动极则必有所止，故以艮承其后；艮者，止之谓也。动与止本自相因：有动则不能无静，既止则复将有行，二者循环相待。震既主乎动，艮则主乎止，先后之次由此而定。然卦名取艮而不用止，其故可得而言：艮于止义之外，兼有山之体段，含安重坚确之意，非一个止字所能尽。再就卦画推之：一阳横亘于两阴之上。阴主翕受，故两阴盘处其下而不摇；阳主发舒，此阳已造其巅，前路既穷，欲奋而无所施。静者在下，止者在上，二义合而艮之名立焉。抑又有一义：艮之止与畜之止不同。畜止者，为人所制而不得进；艮止者，自安于其所而止。","G":"艮其背，不获其身，行其庭，不见其人，无咎。","G.N":"此四句之中，惟首句为纲，后三句皆由之而生，亦即所以申明首句者。若将卦辞删繁就简，径作艮其背无咎亦可。止固可以无咎，然非无条件者：苟不择地而止，咎未必免；必也艮其背，斯得无咎。所谓艮其背，谓止之于所当止，其处既当，其分亦得。既言所当止，则何时而止之义已寓其中，非独计其地也。然则取象于背，何也？盖人身之中，止而不动者惟背，动而不息者皆非背；且背在身后，目不能自见。静与此二者兼之，他部皆不能具，故为最善之喻。求之于卦，其据有二。先自卦体求之：下二画皆阴，上一画独阳，各据一隅而不相涉，判然两分，静峙而无所交通——此非相背而两不相睹者乎？不获其身者，就之更进一层：止于背则并其身而不见，其为背也甚矣。更以爻位言之：艮乃八纯之一，六画之中，上下两两相对而气不相通，此又背而不睹之一证。行其庭不见其人者，又推而进之：一卦之内，诸爻相去不过寻丈，而彼此漠然不相顾；辟如数人共步一庭，面面而過，竟若无人焉。其为背也，抑又甚矣。","T":"彖曰：艮，止也。时止则止，时行则行。动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。","T.N":"艮止也以下数语，乃释卦名者。艮之训止，人皆能言之，而止之为义实不简单。若谓块然不动方名为止，则失之矣——止之中正自有行者在，此意常人猝难领会，故孔子特为点出。止有二焉：守其所当行而弗迁者，止在行中；守其所不当行而弗为者，止在行外。从事一业，久而不懈，此以其行止者也；行之既久，察其势已迁，事不可复为，遂断然舍去，此以其止止者也。二者之行，皆须审其所处：所当止者何在，即止于何在，是即艮其背之谓。此处所谓所，兼空间言之，而究以时间为归。时止则止，时欲其止则止；时行则行，时欲其行则行。或止或行，一断于时，时者其权衡也。时未至而强止，与时的已过而犹不止，其失均也。《易》之教贵时，孔子之论亦贵时，时的观念在儒家哲学中位置甚重，非一节之论可比。斯言也，盖孔子之所以称许乎止者。以卦象求之：艮之为体，画既确定，义复显著，有敦笃坚实之风，光明之说由是而起，故《易》中凡言光明，大抵系于艮之一体。就人心言，事有定准则众心有底，有底则所见自明。譬之举一大事，主之者志坚而不移，守其法度而不摇，众信其必行，则心安而目明，不复旁皇瞻顾。光明云者，非徒景象之谓，乃其道之可据可信者也。\n艮其止以下，则释卦辞也。卦辞曰艮其背，彖传易之曰艮其止，可知背之即止，二语一义。止其所也一句，正解艮其止：背者，止之地；艮其止者，止于其所当止之地而已。前已言之，所当止之地，要以得时为重。至上下敌应不相与也，则以爻言之。卦分二体，其位相敌之两爻，例有相应之义。位敌而一阴一阳，则阴阳相求，情通而气接，有往来之利焉；若阳与阳并、阴与阴并，则两刚相抵、两柔相靡，是之谓敌应。敌应者不相与，不相与则不相往来，于是各止于其分而不相涉。爻既各安其位而莫相闻问，此三句之辞所由系，而无咎之所由得也。","X":"象曰：兼山艮，君子以思不出其位。","X.N":"艮之上下二体皆山，是谓兼山。雷风水火泽之相重者，两两之间皆可有往来；独两山并峙，终古不相通，各据其位而互不干犯，此止之象也。君子取法乎此：两山并立，各安其分而不相陵夺，故居心亦有所守，不至越畔而驰，是谓思不出其位。此处思、位二字最吃紧。思者，心之官则思之思，谓思虑、谓念头，与行事相对而言。位则与彖传止其所之所同训，指其时与其地。析其句读：此句以思为主，以不出其位状之，所答者在思之状态，不在思之对象。若倒置主谓，以思为动字，谓此句答所思为何物，则失之矣。思当如何？质言之，所思者不出乎其位而已，位之外未尝措意。有所止而后不流，不流而后能定。以今语达之，思想须切合实际：过其所当则流为空想，不及则堕于固陋。","Y1.T":"初六，艮其趾，无咎，利永贞。","Y1.N":"趾者，一身之最下者也。百体之中，其先受意者莫如趾；将行未行，此物已先动矣。人事之止，其类有二：其一止于行，所当为者持之不变；其一止于止，所不当为者亦持之不变。孰为当为，则发轫之初即为之；孰为不当，则发轫之初即不为。如此而后可以无咎。盖于始而止，犹未必能持之于终；而始且不能止，更何终之可望？初六能止于始，是以无咎。然初六之才，阴而柔者也，止于始矣，能保其终乎？故系之曰利永贞——欲其久守而不迁，贞固以抵于末，毋至半涂而辍。","Y1.X":"象曰：艮其趾，未失正也。","Y1.XN":"以位言之，柔爻而据刚位，初六本不得为正；以义言之，所当止者既能止之于始，则亦未可遽谓之失正。","Y2.T":"六二，艮其腓，不拯其随，其心不快。","Y2.N":"六二处中而履正，于止之道盖知之而能守之者：何事宜居持守之列，是为止于行；何事当在不为之列，是为止于止，其辨甚明。然身居下位，上无正应，凡有举动，皆为其上之九三所牵制，不得自遂，故有艮其腓之象。腓者，胫后之肉，不能自运，必待股动而后动者也。象既如此，其义可知：六二于止之行止，胸中了然，及夫见诸施行，则操柄不在己，而听命于人。操柄者谁？九三也。九三以一卦之主而司止之权，然刚而不中，又居下体之末，于止之所宜既未能自明，复不肯降心下问于六二。六二虽有中正之德，终不获见信于彼。于是不拯其随：九三之失，六二无由正之，徒违其本心而与之俱行；外貌委顺，若无痕迹可寻，而其中固怏怏也。","Y2.X":"象曰：不拯其随。未退听也。","Y2.XN":"听者，从也。退听云者，谓舍己而从于下。六二之于九三，非不欲正其失，特以其言不见听纳，乃曲意相徇，是盖有所不得已，非本怀也。","Y3.T":"九三，艮其限，列其夤，厉薰心。","Y3.N":"九三者，两刚相叠，位则正矣，而于中未得也；又居下体之末，正当上下相衔之处。于止道之实、止道之本，彼盖未尝知，亦未尝守也。夫止道莫贵于时：当持与否，视时而进退，无定执也。彼时宜为，则为之不倦；此时宜辍，则辍之不疑；一以时为转移而已。时者非外物，即事之势也。九三则不然，其视止也，至死而至定，至决而至绝。一事之止，一题之止，既止则终不复改。譬之有国于此，因一时之故，与他邦断其使聘，在当时固出于势之不得不然，于理为顺，于事为利；乃不问时势之已迁，永与不相闻问，卒之与世相睽，自屏于一方，自锢于一隅，向之合理者转而为悖，向之有益者转而为害矣。其在人身，则艮其限是已。限之为言，界也，当其上下二体交会之处，今人所谓腰胯者是。腰胯既为所止之地，则上下二体从此断隔，脉络意思不相贯注，如人身中截而判为二物。列其夤者，又申艮其限之义而足之。列，裂绝也；夤，膂也，联结上下体者也。夤既裂绝，则一身判而为二。厉薰心者，言其祸之烈。厉，危也；薰，灼也。危厉迫而熏灼其心也。九三过刚而不中，身处止之时，以为止必求其尽止，静必求其尽静，不知动静行止之各有其时，胶固以求静，而危厉之来适所以焦其心，坐卧皆不能安。","Y3.X":"象曰：艮其限，危薰心也。","Y3.XN":"九三艮其限，其病根所在，正在不当止而强止、当转而不转耳。欲求其静，而危厉反灼其中，终至躁扰而不能自安。推原其故，则以九三不具中德也。","Y4.T":"六四，艮其身，无咎。","Y4.N":"六四亦无中德，然以阴爻处阴位，纯然静体。当止之时，心静而身安，行止各以其时，视九三之艮其限者为胜，故曰艮其身无咎。其所以言身者，以爻位度之：六四居下体之上、上体之下，适当人身腹以上、膈以下之界，身之名所由立也。就爻义而言，则有两层。一者，六四既入上体，不复有九三分判上下之病；所谓艮其身，谓不分畛域，总一身而止之，不为躁动所摇。二者，艮其身亦寓自止其身、反而求诸己之义。人之于己，所当理者言行二者而已：时可则出，时未可则含；含之不以为屈，出之不以为躁。其止也，一准于时。一则在总持，一则在反己；二者具，而咎以亡。盖三过刚而躁，四柔顺而静，其得失之分，正系于此。","Y4.X":"象曰：艮其身，止诸躬也。","Y4.XN":"止诸躬者，即艮其身之异文也。不曰其而曰诸，正以见止之所在为身，而事由己了，非假外求。","Y5.T":"六五，艮其辅，言有序，悔亡。","Y5.N":"辅者，口也，出言之器。六五居上体之中，其位与口相当，故曰艮其辅，谓止之于口也。然止非漫然而止，其所凭者时也：时可止，则止而不疑；时未可止，则虽欲止而不得。故有止而谓之止者，亦有行而谓之止者。口之止，非闭而弗启之谓；可默则默，可语则语，语默一视其时。发而有次，疾徐高下各得其节，斯谓之序。六五以阴爻处阳位，其位不正，于法宜有悔；然居上体之中，有中德焉，能艮其辅而使言有序，则悔可亡。","Y5.X":"象曰：艮其辅，以中正也。","Y5.XN":"正字盖衍。其证有二：《周易》之文多韵，六四小象云止诸躬，上九云以厚终，则此当作以中也，韵乃相协；又六五以柔爻而据刚位，位之不正，夫人知之，安得系之以正？曰以中者，明其所以能止也——处上体之中，中德具焉，故口不妄出。","Y6.T":"上九，敦艮吉。","Y6.N":"敦者，厚也，笃实之谓。上九者，阳刚而在止之终者也：刚则能守，终则不移；守而不移，其积也厚，故系之曰敦艮。凡卦至上爻，事已造其极，理当转趋反面；而艮之上九独过而不为亢，止非惟不变，且益敦厚而笃实。初六止于趾，仅免于咎；上九言敦艮，乃独得吉。二爻相形，则此卦之意可知：开手不苟，固已可贵，而收束之善，尤其所重。譬之行善，一日为之易，终身不渝难；白首而不失其守，斯为尤难。上九何以致吉？卦之阳爻惟二：三与上也，皆处二阴之上，同有主一卦之分量。然三居两体之间，止非其时，故危；上处一卦之末，止适其时，故吉。时之不同，而吉凶判焉。又按：临之上六系以敦临而吉，复之六五系以敦复而无悔；二卦之外体同乎坤，坤者地也，地势卑下而所积者厚。艮之外体则为山，山者地之隆然特起者也，其厚加于地一等，故其辞以敦艮言吉。又通《易》六十四卦，上爻多凶，得吉者什一而已；而外体为艮者八，曰蒙、曰蛊、曰贲、曰大畜、曰颐、曰剥、曰损、曰艮，其终爻无不得吉。然则上九之吉，非适然也，象实为之。","Y6.X":"象曰：敦艮之吉，以厚终也。","Y6.XN":"爻象所示：艮之终爻，孤阳踞两山之上，积厚而止于其所，此厚终之象也。以义言之，凡止，起手非难，收束为难；能收者鲜，故可贵在终。起处既止，究竟亦止，二者无阙，乃可许为能止。而非旦夕可致也，必也日积月累，蓄之愈厚，而后敦艮成焉，吉所由应也。要之：吉生于有终，有终生于积厚。","Z":"艮之取象，与咸同出一辙，皆假人身以明之，所取部位亦大略相准，特相去一间耳。其所以差者，取心之爻不同故也。咸之心在四，由四而上推，则五当其背，上当其口；艮之心在三，由三而上推，则四当其背，五当其口。至若初爻，艮以为趾，咸以为拇，名异而实同，皆谓足也。腓与随二事，于两卦错出：言腓者，咸艮之第二爻同之；言随者，咸系于三，艮系于二，参互以求，其例自见。\n艮之止，止乎己而不止乎物；其所操者在我，不在外也。以今语释之，则坚持二字近是。持其所当为，止也；持其所不为，亦止也。既可止于止，亦可止于行，故止有静有动：守其不为者，静之止也；守其必为者，动之止也。世人多以静训止，其实非也。与止相对者，不止耳；静则另一义，虽相涉而不可混。与不止相对者，止耳；动亦另一义，虽相涉而不可混。此二辨不明，则止之义终晦。盖止之为德，随所处而皆善，故六爻之辞，凶咎悔吝一无所缀。\n究其实，艮所言者，人之自持自制之力耳。止既为坚持，则坚持之首务，在有始有终，故初六艮其趾仅曰无咎，而上九敦艮乃言吉。坚持不能无所倚，尤赖在上者之助；然在上之人苟明有失，己力不能正之，惟相随而去，是可憾也，故六二艮其腓不拯其随，系以其心不快。至于操持之大端，则系乎审时之明：时可用力，虽艰而不退；时不可用，虽易而不为。若于至不当持之际而持之，积而至于胶固，譬犹拘其身之上下使不得屈伸，或隔绝其上下使不相通融，祸害必随，故九三艮其限列其夤，系以厉薰心。\n持守之事，大抵属自修，反而求之己者也。于己有所止，于物无所强；止以其时，而不执于一隅。六四艮其身而系之无咎，职是故耳。其尤要者，则见于出言之口。言之所当发，必发之；所不当发，必不发；发而轻重疾徐皆有次第，不妄出焉。如是，虽有悔亦归于无。"}},"53":{"id":"53","cnNum":"五三","name":"渐","pinyin":"jiàn","fullName":"风山渐","shortFullName":"风山渐","upper":"巽","lower":"艮","upperNature":"风","lowerNature":"山","lines":[0,0,1,0,1,1],"yaoLabels":["初六","六二","九三","六四","九五","上九"],"blocks":{"P":"艮之为止，非终驻而不返也。止极则思通，屈久则必伸，此消息相乘之常，而《序卦传》所以以渐承艮也。渐者，进之名，而进不足以尽之。虽然，渐之为进，非直遂之进，乃渐进；渐进者，缓进也。而其缓又非漫无节度，缓生于有序：步不失次则行迟，序不乱则至稳。质言之，不逾次第而徐徐以往，是之谓渐。即卦体观之，下艮上巽，木生于山，山厚其基，木成其高。高非无因，非偶值而然，正如人之进而有渐，故卦以渐名。","G":"渐，女归吉，利贞。","G.N":"《易》中以男女夫妇为言而实寄哲理者，凡四卦：咸、恒、渐、归妹是也。四者所寄各有所偏。咸与恒，多就一家之内言之，所重者在夫妇；渐与归妹，则就女子出嫁一事言之。若就中所重而析之，则恒、渐二卦，伦纪之意为多；咸、归妹二卦，情好之意为多。取象既分，卦义遂别。\n渐之取象曰“女归”。归者，女之适人也。卦即借此一事，揭出人事当循序而进之理。此与咸之“取女”判然不同：取女者，男求女而娶之；女归者，女适男而归之。本是一事之两面，而所取各异。咸取“取女”，所明者天地万物相感而通；而渐独标“女归”，其所欲明者，乃人事之节次也。\n然则“女归”何以能明渐进？盖古之嫁女，非可率意而行。必先有媒妁通言，而后纳采、问名，而后纳吉、纳征，而后请期、亲迎，六者次第而举，一节不可缺。循此而行，则为正，为合礼，其吉可知。若不循此而合，是奔也；奔者不吉。渐之所以取“女归”，正取其节节有序。盖礼之所详，即渐之所寄；舍礼而言渐，则渐无所附丽矣。\n或又问：世间循序之事岂少，何独取于“女归”？曰：以其为日用间最习见、最易解者，故取以为喻。若夫高远难知之事，虽有序可循，亦不足以喻众人。\n“利贞”二字，在《易》中凡三义。一曰戒辞。如损之九二，以阳处阴，居兑说之体，迹近乎苟合，故系此二字以戒之，欲其知所自守而不流也。凡戒辞者，本无所利可言，特虞其失，故预为之防。其二，事为因而贞为果，言利贞者，实以此贞归之于事，若嘉其能贞然。其三，贞为因而事为果，谓惟其贞，故事之成也利。渐之“利贞”，当属第三。嫁女一事，其本自归于正，非有待于外；事既正矣，则行之于世，吉自随之。非戒之使正，亦非以贞为事之所获，乃言正其本而吉自至也。\n渐与归妹，皆言嫁娶，而所映者，乃古时女子适人之两途。渐之言“女归”，是常、是正：男家藉媒妁、备六礼，迎而为嫡妻，即所谓夫人。所映于理者，循序而进也。归妹则不然：其所咏者，古婚嫁中之一变，侄娣之制是已。\n其制云何？《公羊传》记庄公十九年事，述此颇详：诸侯之娶，取于一国而止；二国则以媵往，侄娣从而俱行。侄者，兄之子；娣者，女弟。聘一次而备九女，终不复娶。隐公七年书“叔姬归于纪”，何休注其故，谓叔姬乃伯姬之媵，所以晚归者，有待于母家也；盖其未行者，八岁即著于籍，十五而随嫡以往，二十而始事君子。\n合传与注而观之，诸侯之婚，终其身止于一聘，一聘而备九女。九女之内，居首者一人为嫡，是所谓夫人。夫人之女弟，或兄之女，亦媵而从行，其数二焉。二女或年幼，未任远适，则留于母国，俟十五而后行，至二十乃共寝处。此二女者，于夫人为侄为娣，统而名之则曰媵。娶妇之国，所出者一夫人与二侄娣；此外二国又各以二女来媵，此二女亦得媵名。而每一侄，复各有二侄娣随行，幼者亦留于母家，及笄乃往焉。故九女之内，侄娣居其六。侄娣随其姑姊同适一人而不相离，此其制之大略也。\n侄娣之嫁，视嫡为异者二端：其一，年未及笄，则嫁期每迟；其二，六礼不备，及时遣之而已，无纳采问名诸节。归妹一卦，所咏正是此事。\n斯制也，群婚之遗风，而当时所许，故在礼为合，与苟合之奔者不同。然比于嫡之正，终无渐次可循。归妹之取义，即在此等处：不循序之弊与见许于礼之可，两义并存而不相掩。\n要而论之：渐所取者，礼之次第；归妹所取者，俗之权宜。一正则一变，其有教于人事则同归。","T":"彖曰：渐之进也，女归吉也，进得位，往有功也。进以正，可以正邦也。其位，刚得中也。止而巽，动不穷也。","T.N":"“渐之进也，女归吉也”。渐固含进义，然渐与进非一。晋之与进，几乎同实；渐之与进，则进之一目而已。言“渐之进”者，正以别于他进；三字之中，眼目全在渐字。其进也，能如嫁女之有序而不躐，则吉。\n以下数语，皆所以释“利贞”、为之立据者。渐与归妹相反为对：归妹之二、三、四、五皆失其位；及其下体之兑进而为上体之巽，此四爻遂皆得位，而九五又不止得位，兼得其中。惟其进而得位，故九五以阳刚居阳位，又处上卦之中；刚而得中，是谓往有功。\n“进以正”以下，与“进得位，往有功”义本相蒙。义既相同而复举之者，盖郑重言之，以见渐之所以利贞，实由二、三、四、五诸爻各正其位，而九五尤得中也。“进以正”即前之“进得位”，“可以正邦”即前之“往有功”；以正、得位者其因，有功、正邦者其效。\n“其位”谓五。居五者为阳爻，故曰刚得中。特标“刚”字，恐读者以得位归之六二之柔中耳。\n艮下巽上，故曰“止而巽”。下体止，则凝重而不躁；上体巽，则欲动而不迫。渐之进之气象，具见于此，而“动不穷”即谓是。惟其得正，惟其刚得中，故渐之进之义可以曲尽，而卦辞系以“利贞”也。","X":"象曰：山上有木，渐。君子以居贤德善俗。","X.N":"渐之象，上巽为木，下艮为山，木托根于山而始得其高。凡高必有自，非凭虚而起，此其所以为渐也。君子于此得进德化俗之方：以之居贤德，以之善风俗。居者，积累而使之厚也。德为己之所得，修之于身；俗为众之所成，移之于乡。二者一内一外，皆非旦夕可期，必积渐而后见效。既知须渐，则用力当自细微始，久之大者自成。旧说疑“贤”字为衍文，可备一解。","Y1.T":"初六，鸿渐于干。小子厉，有言，无咎。","Y1.N":"卦辞取嫁女为象，至于六爻，则一以鸿为言。鸿者雁也，水鸟之属。其飞成列，其行以时，往还有节，与渐之义正合。古者婚礼用雁，取别有序之义；雁既入于婚礼，遂与“女归”相系，此诸爻所以皆言鸿。\n干者，水涯也，于水为最近。雁之飞也，自近及远，自下及高，未有躐等而举者；其栖也常在水中，及时而起，亦自有先后之次。初六居一卦之下，质又阴柔，才力本弱，上无应援，固非能远飞者。其渐于干而止，乃分所宜然，非有所阻而不得进也。\n“小子厉，有言，无咎”：小子，谓幼而无识者。所见止于目前，不能计及久远，见鸿之进止于水涯，遂以为本可高举而故止于此，口出怨言。然有言亦不足为病，渐于干者正也，其进固当如是，何咎之有。","Y1.X":"象曰：小子之厉，义无咎也。","Y1.XN":"所谓无咎，非幸免也，义之无咎耳。小子所执者，事之迹；初六所循者，理之常。渐之义在是，故其无咎在我。析言之：居下则势当进，一也；体柔则不肯躁，二也；上无应则不生倚赖而妄动，三也。三者合，而渐之德成。向使惑于小子之言，奋刚锐以前驰，则渐之义先失，非徒不进，咎且随之。","Y2.T":"六二，鸿渐于磐，饮食衎衎，吉。","Y2.N":"六二以阴处阴，柔顺而中正；上应九五，视初六之孤而无援，其势大异，故可渐于磐。磐者，水傍巨石，视涯涘为进矣。渐于磐，进于干一等，而托身既固，危厉不作。所以然者：二居中得位，五亦居中得位，两中正相与为应，所依至稳。故“饮食衎衎”，和乐自得，吉可必也。","Y2.X":"象曰：饮食衎衎，不素饱也。","Y2.XN":"“饮食衎衎”乃设譬之辞，写六二得所依而归安，非谓其虚食于磐。夫子虑读者滞于文，故以“不素饱”点破之。素之为言空也、白也，素饱犹《诗》之素餐。曰不素饱，则非徒饱食而无所述作也。","Y3.T":"九三，鸿渐于陆。夫征不复，妇孕不育，凶。利御寇。","Y3.N":"陆之为地，高而平坦，即今之所谓平原。九三居下体之上，其象为鸿渐于陆。三以阳居阳，刚而过中；上又无应。当此之时，以平陆自安，抱正而需时，于渐道为最近；一念欲前，一事欲举，皆非所宜。然三质本过刚，又值时之渐，最易不当进而进，失渐之道以取凶。爻辞所以有“夫征不复，妇孕不育”之戒也。\n夫谓九三，妇谓六四。征，行也；复，反也。三、四相比，一阳一阴，情易相昵，最易不待礼而合。三苟不能自守而与四合，则行而不返，虽孕不育，凶无可疑。然则三之所宜者，拒寇于外而已，婚媾非其所求也。凡横逆之来不以正者，皆寇也；居正自守，俟时可动，拒其外诱而不纳，斯为御寇。其利其凶，全系于能御与否。","Y3.X":"象曰：夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。","Y3.XN":"“夫征不复”，失渐之正也。一失而不复顾，是自绝于其类。群者类也，丑亦类也。一卦六爻，大抵皆善，而三独以失正取凶，此其所以为“离群丑”也。妇人必由夫妇之正乃能有子；三与四以私相合，于“女归”之渐道有违，故孕而不育，曰“失其道也”。既离其类，又失其道，则如之何？曰“利用御寇”：守正于己，遏恶于外。然犹不止此，并使宵小之徒不至陷于不义，故曰“顺相保也”。","Y4.T":"六四，鸿渐于木，或得其桷，无咎。","Y4.N":"鸿之足，趾相连属，不能握枝，故其性不宜栖木。今六四已入巽体，巽为木，是鸿渐于木矣。据非其地，处非其所，境之不佳可知。四上无应援，下则据九三之刚；刚者志在前进，岂肯屈居柔下？故四之自处，如鸿之巢于树，摇摇而不安。\n然四亦有其可恃者：上承九五，以阴承阳，于“女归”之义为合。若能顺以事上，则危者可安。譬如鸿之在木，本难措足，或得横出之枝，平阔可依，则亦可以少安。故曰无咎。安危之机，系于能顺与否而已。","Y4.X":"象曰：或得其桷，顺以巽也。","Y4.XN":"四之由危而安，其故安在？阴爻处阴位，得其所居，一也；体属巽，巽则能顺，二也。顺者不肯与物争，巽者不胶于一执，是以能转不安而为安。","Y5.T":"九五，鸿渐于陵，妇三岁不孕，终莫之胜，吉。","Y5.N":"陵者，高岗，鸿之所止以此为最高。九五履君位，故取象于陵。五与二为正应，两皆居中得正，具中正之德，于“女归”之义最为脗合，就境遇论，五宜莫善于此。然当渐之时，无论休咎，皆不能猝至，必有其序。妇谓六二。五与二之间，九三、六四实隔之，蓄而不得合，故有“妇三岁不孕”之象。三岁者，言其久，非定数也。\n五有中正之德，终必越三、四之阻而与二合。不正之于中正，能相抗于一时，而不能争于久；“终莫之胜”，谓终不能胜之也。五之吉，可前定矣。","Y5.X":"象曰：终莫之胜吉，得所愿也。","Y5.XN":"“终莫之胜吉”，渐之吉也。五与二挟中正以敌三、四之阻，持久而后胜，邪不能久干，卒遂其合，所谓得所愿也。","Y6.T":"上九，鸿渐于陆，其羽可用为仪，吉。","Y6.N":"一卦之中，“鸿渐于陆”两见：九三言之，上九复言之。象重复出，说者遂生异义。宋人疑之，欲改陆为逵。逵者，云路也。其所以改者，取韵为证：谓仪字与陆不叶，而与逵叶。然韵有古今，彼所据者宋音；当《周易》成书之时，逵、仪未必同部。陆自为陆耳，改字之说，未足凭信。\n孔颖达谓此二爻皆在卦之上，故同得陆名，其说得之。上九居一卦之终，为渐之极，又出乎位之外；其所进者高而且洁，不以位为累，故其辞亦曰“鸿渐于陆”。譬之贤者之高致，出乎进退之表，就俗眼观之，若无所益于家国；然“其羽可用为仪”，其风概，其不恋于位之操守，正堪为世楷模。无用之中，自有一种大用。","Y6.X":"象曰：其羽可用为仪，吉，不可乱也。","Y6.XN":"小象标“不可乱”，所指者志也。上九居于无位之地，其迹若诚无所用；然其心洁，其守固，位不足以为荣，故亦不足以为累，浮沉乎进退之外而中自有所主。如是者，非外物所得而摇之也。惟其志如此，取其一羽以为仪则，可以为天下式，吉之所由系也。","Z":"渐以“女归”立义，故爻之吉凶，一以应与不应、合义与不合义为断。阴阳相应而合于卦义者善，不应而违之者否。初六无应，故有小子之厉；六二应九五，故安于磐石而“饮食衎衎”；九三无应，故有夫征不复、妇孕不育之象。六四之无应，与三正同，而集木得桷，终获无咎，所异者在其所承：上事九五，柔以奉刚，于女归之义有合焉。上九又别为一例：其位居卦末，其地无位，乃不以无应为病，而反以无应为吉。盖惟其无应，是以不为位所羁，浮游于进退之表，而其吉即在此。\n诸爻之中，其情最曲者为九五。九五与六二，一卦惟一之正应。自五而言，己为夫，二为妇。正应相求，结合宜无难，所苦者三、四居其间，阻而不得通。\n然六二处之而“饮食衎衎”吉，九五处之而“妇三岁不孕”，其故在名分之异。六二之位，犹处子也；《杂卦传》云“女归待男行也”，正谓此。待人而来娶，乃其分内，故能以柔顺中正之质，从容俟时，不急求进，而吉。九五则为当娶之男，娶女之事，彼当自任；三、四之阻，于彼为不利，遂使一时不得与二合，而有“妇三岁不孕”之象。然中正之德在我，邪不能胜，且必为我所胜，故终有吉。"}},"54":{"id":"54","cnNum":"五四","name":"归妹","pinyin":"guī mèi","fullName":"雷泽归妹","shortFullName":"雷泽归妹","upper":"震","lower":"兑","upperNature":"雷","lowerNature":"泽","lines":[1,1,0,1,0,0],"yaoLabels":["初九","九二","六三","九四","六五","上六"],"blocks":{"P":"《序卦传》以进释渐，以为有进则必有归，遂以归妹承其后。渐之字义不在进，然实含前行之势；行而有所止，止处即归，故渐亦未尝无归义。归义既具，则归妹之承渐，序次有固然者。至若卦画，二卦互为反对，象与义遂歧而为二。渐之所取，女归是也——女归者，女之适人也。适人自有其序，六礼相循，故渐之义系于归字；所映照者，乃古时女子出而为嫡妻、为元配之一类婚姻。归妹之所取，归之妹是也——妹者，随人而嫁者也。义既系于妹字，妹即少女；少女不俟聘而自往，所映照者，则古时女子出而为侄娣、为媵妾之一类婚姻。此类结合无次第可循，故归妹之义，与渐之渐进适相翻也。","G":"归妹，征凶，无攸利。","G.N":"取嫁娶为义者，咸、恒、渐、归妹四卦也。前三者，卦辞或称吉，或称利，皆属美善；归妹独系以凶。若遍检六十四卦，通篇无一善语者，唯否与归妹耳。然则征凶、无攸利之断，果何自而来？先析其体：兑为内，震为外，是谓说以动。悦而后动，于人情本无所拂，所病者动非其所耳。再察其位：二、三、四、五，居皆不当；初、上虽各得其位，然阳反居阴之下，于分终为未安。位既失矣，义亦随之。盖内兑为少女，外震为长男，以少处长之下，其势自然自卑而奉尊；此心既由悦而起，则悦意为先，实行在后。于是悦慕日滋，夫妇之义日削，古人目为不正，卦辞之断，正坐此也。要之，此卦不可动，动则招凶；不可往，往则失利。","T":"彖曰：归妹，天地之大义也。天地不交而万物不兴。归妹，人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。","T.N":"卦中所言之婚，非后世之常礼，实古者侄娣之制。此制之远源，则为更早群婚之遗蜕。当《周易》成书之世，群婚余习未尽，而男尊女卑之见已深。以是之故，其制含一义焉：女不自待男家之聘，径就乎男。于礼有阙，故系之以征凶、无攸利。\n然此事尚有不可抹杀者在。归妹所言，究竟为阴之从阳、女之从男，为男女相悦之情。情之动也，未必尽循礼文，却自有其理。孔子于此看得极真。其为《彖传》，不先数其凶，反先表其合理，并及其有助人类蕃衍之功。意若曰：男感而女应，两相配合，遂令种姓相续、世世不穷；此与天地二气相遇而万物萌生，同一自然，同一合理。既申此义，乃郑重标出一语：归妹所关，乃人之终始，未可视为寻常嫁娶。终者，男女之相配；始者，生育之相续。两端合观，所归仍在一男女之伦。\n至“说以动，所归妹也”一句，可分两层。就卦德言，悦在兑而居下，动在震而居上，是先有感悦，后有行动。悦而后动者，率情而往者也；咸卦则止而后悦，其节大异。就卦象言，阴处阳下，女先乎男，不待男之求而自就，则就之者在女。内体为少女，外体为长男，少从长者，则所归者乃少女而非长女，是侄娣而非嫡室。其欲嫁者女也，而所嫁者少女也；合二者而观，名目斯立。德主情，象失礼，情胜而礼屈，凶象于是乎生。\n爻辞又云“征凶，位不当也。无攸利，柔乘刚也”。是知致凶之由，于所归者妹、说以动二者之外，复有位不当、柔乘刚两目，凡四端，相缘而非各不相涉。盖由悦而发者，鲜能自守其正；居中四画既已失据，则阴据阳上之咎相随而至。位乱于中，刚柔各失其耦；势逆于三五，柔者反加乎刚。二者交病，凶之所以不免也。家人、睽、渐、归妹皆言男女：家人当中之爻各得其位，故所归者正；睽则当中之爻皆失其位，故所至者乖。渐、归妹二卦，吉凶相判，而所以判者亦无他焉——爻居其所则顺而吉，爻去其所则逆而凶。","X":"象曰：泽上有雷，归妹。君子以永终知敝。","X.N":"雷动乎泽上，阳先发而阴应之，女子从人之象寓焉，卦名归妹以此。此卦立言，多就女子、且多就少女一边说。然则君子读之，易地为丈夫、为男子计，其戒安在？孔子举四字以对，曰“永终知敝”。永终云者，男女配偶，继嗣不绝，使其传可久也。敝者，终之反也。知敝云者，既期其终，则当知终之必有敝；知其为敝，而豫为之图，然后嗣续可以无间。即一夫妇而言，永终者，偕老之谓也；知敝者，谓归妹之合最易起于睽违、终于弊坏，君子不可不早见。归妹之于恒、渐，其道迥别：恒巽而动，渐止而巽，皆有所持循；此则悦而后动，少女以情牵而动，情偏则义薄，初无道义为之根柢，历时稍久，弊必生焉。君子知其可敝，故逆为之备，而图所以永其终。推之他事，亦岂独袵席之间有反目。凡天下事，有终必有其敝；君子治事，当虑终于远，而防敝于始。","Y1.T":"初九，归妹以娣，跛能履，征吉。","Y1.N":"初九处一卦之下，上无正应。应者既无，则其分止于娣，不得为嫡。其为娣也何如？刚阳之质，而居说体之下，是贤而能巽者也。然娣非正耦。德虽可取，所就者不过洁身自好、以事君子；若欲有所建树，则势所不许。譬之跛者：足虽偏废，犹能践地，然仅免于废，致远则不能。\n古者婚嫁之礼，先聘而后娶，六礼次第而修，其进有渐；成婚之年，亦著为定限。聘问不修而嫁，则谓之失礼；年齿不伦而为耦，则谓之失时。独侄娣不然。随嫡而往，聘问虽阙，礼家不以为阙；许其待年，年齿纵相悬绝，亦不闻有失时之议。于此可见，此制为当时所共许。卦辞统摄一卦而言征凶，初九独系以征吉，其故正在此。","Y1.X":"象曰：归妹以娣，以恒也。跛能履吉，相承也。","Y1.XN":"凡嫁而不由礼聘者，皆不得为常。然使所居者为侄娣，随嫡而往，则礼文虽略，其分自若，未可概斥为不正。“跛能履吉”云者，正以其无内主之份，而能安分自处，佐嫡夫人以共奉君子也。","Y2.T":"九二，眇能视，利幽人之贞。","Y2.N":"九二所言之娣，与初九同旨。“眇能视”与“跛能履”，取譬虽异，所指则一：跛者双足一正一欹而犹能步，眇者双目一昏一明而犹能见，皆以喻娣之处偏侧。娣在夫妇之伦中不得有所施为，然于佐助嫡室一事，毕竟能效其力。九二之于初九，又有别焉：九二刚而得中，见其志守坚定、才德兼备，此其所以高于初九。然所处之境反不如初九。初九无所应；无应固非佳事，却正定其安于娣位。九二则有应，而所应者乃以阳应阴：己本有妇象，又复应阴，是类之相反者也。应而反类，视无应者为更劣。九二居此，可见其为娣虽有夫，而所遇非良夫，遗弃之虞，无时不在。所赖者刚中之德，故曰“利幽人之贞”：如幽囚之人失其自由而能自守其志，确然不拔，终始不改，则娣位可保，不至生变。","Y2.X":"象曰：利幽人之贞，未变常也。","Y2.XN":"夫虽不贤，九二以娣之身守幽人之正，执志不移，以其贤事其不贤，此乃分所当然，非有过，亦非不及。","Y3.T":"六三，归妹以须，反归以娣。","Y3.N":"六三柔质而居刚位，所处已失其当，外又无应，是为难嫁之女，故取象于“归妹以须”。须之为言姊也，娣之为言妹也。二者相待而名：为姊者可以适人而主内，为妹者则唯随姊而居次。六三位既失当，本妹也，而欲冒姊之名，以取正室之位。其事必不可成，终乃“反归以娣”——仍以妹之身，随姊而处于娣列。","Y3.X":"象曰：归妹以须，未当也。","Y3.XN":"六三位不当，本非正女，乃欲以不正之术自嫁，是即“归妹以须”；其术终不能行，仍须“反归以娣”，循其分所当循之途。推原其故，病根只在一“位不当”上。","Y4.T":"九四，归妹愆期，迟归有时。","Y4.N":"九四之与六三，其象颇近：四失位而绝应，三亦失位而绝应。然而辞不相同，何也？二爻大段虽同，析之则有辨。三也，柔加于刚，而又越乎中；四也，刚处乎柔，而犹未及中。均之不正，则刚处柔者为胜；均之不中，则未及中者为优。四失位无应，其嫁已后于时。然刚处柔、未及中，其后期也，盖有所俟焉——或俟良耦，或俟年于父母之国，非无人问聘而艰于行者。故其迟归也，出于自择，有其时而无失其期，时至则终归而已。三则异是：位不正，应又绝，柔而据刚，且越乎中；其嫁也，乃以难行而取“归妹以须”之僻涂，强自求售者也。","Y4.X":"象曰：愆期之志，有待而行也。","Y4.XN":"四之缓于婚期，由己志之自决。志何以在愆期？曰“有待而行”。行之为言嫁也；有待而行者，非无嫁之心，特须俟其可嫁之时耳。总之，迟速之柄在四，非他人所得而与。","Y5.T":"六五，帝乙归妹，其君之袂，不如其娣之袂良。月几望，吉。","Y5.N":"帝乙嫁妹之事，泰卦六五既言之，此爻又言之。一书而两见，则商王帝乙尝以妹降婚，非虚语矣。六五据尊位，诸妹之中无如其贵者，故取帝乙嫁妹为象。古者诸侯娶必九女，嫡、媵、侄娣咸备，著为定数，虽人主不得而逾。帝乙之嫁其妹于臣家也，所居者侄娣之位，非正夫人之位。六五之女，门第之贵，有类帝乙之妹；亦循礼义之数，降为人之娣。“其君之袂，不如其娣之袂良”，言其被服之盛，乃反胜于嫡也。虽然，盛有所止：娣而僭嫡，则夺嫡之嫌生，嫌生则凶。六五虽贵，然得中而有应，故能自安其分，不以娣加乎嫡。譬之“月几望”：月近于望，将盈而未盈。如是则吉。","Y5.X":"象曰：帝乙归妹，不如其娣之袂良也，其位在中，以贵行也。","Y5.XN":"帝乙以妹嫁人为娣，而娣之服御反胜其嫡。此由六五位尊而得中，以贵盛之身出降故也。","Y6.T":"上六，女承筐无实，士刲羊无血，无攸利。","Y6.N":"归妹一卦，本为古婚嫁中侄娣之制而设，故六爻之象，无不取乎娣。上六之体，阴虚而外绝其应，爻辞所以有筐无其实、羊无其血之云。筐之所盛、羊之所出，皆祭事所不可阙者。古者诸侯承祭其先，亲刲牲以取其血；夫人则治苹藻之属，实诸筐篚，以待荐。故九女同娶，而缀祀之事，独嫡夫人得与之，侄娣不得参焉。士大夫之家，其礼亦大氐然。盖妇人之于祭，本有奉筐荐藻之职，然必其为嫡而后可。上六阴爻居阴位，下复无应，内虚而外无实，有其名而无其分。自其妇人言之，若可与夫共主祭事；按其实则无此职，以其为娣不为嫡也。故其所承者，特空器耳，中无所有，无所用于祭。祭必夫妇偕；妇之筐既虚，则夫之刲羊亦无血。藻无可荐，血无可献，而祭终不成。非无夫也，为妻者非其人也。以卑贱之娣，值上六阴极之时，所处至艰，动与静皆无所利。","Y6.X":"象曰：上六无实，承虚筐也。","Y6.XN":"所承者虚筐耳，迹若可以荐，而实无物可荐。以妇人言之，夫非无也，而妻之名不属焉。位既卑矣，又值上六阴柔虚极之时，故其境至于此。","Z":"渐与归妹，反对之耦也。渐之体，艮内而巽外，风山渐是已，中爻四画各安其位。其取象在女归：嫁女之家，六礼不阙而后成礼，先后之序森然；作《易》者即于此序拈出一“渐”字。凡事之推行，宜有次第；犹嫁女之宜有节文。二者同为一理。\n归妹之体，兑内而震外，雷泽归妹是已，中爻四画尽失其居，又有柔据刚上之疵。卦既以归妹为名，而所寓之理头绪纷然，最难执定；作《易》者于此，竟不能别立一名以括之，唯可云其所取，与女归适相背耳。名之不立，正见其义之难言。\n然二卦之抑扬，作者之意未尝不明。渐之辞，先许以女归，谓循礼而嫁，其吉不待言；复系以利贞，为其守正而固也。归妹之辞，则一言以断之曰征凶，又申之曰无攸利：其凶亦不待言。一予一夺之间，见其为嫡则正、为庶则非，断然可识，非偶然之笔也。\n即此取象，可觇殷周之际婚娶之实与论婚之变。父系既立，耦以一对一，此制先出，遂据主流；群婚余习，则缘多妻之形以存，居辅位而不废，遂与正耦并行。殷世已有之，周人因而不革，著为礼数——后人所称嫡庶者是。作《易》者取象于女归、于归妹，正于观念上认此制为当然。\n嫡庶既判，女子之嫁遂分为二涂。为嫡者，于礼无违，于理无悖，无可更议，故渐卦只取渐义而足。为庶者——其媵于诸侯者，又谓之侄娣——周人对之，心迹颇相抵牾：归妹之辞致其讥贬，谓其动先乎男，而年又少乎男，礼有所愆，时有所失；而六爻之文，往往有称许之语，不尽抹杀。\n孔子作《彖传》，乃发其中所藏之微旨。其意以为：侄娣之设，所关甚巨，女子虽处庶位，其义不可轻；且确然以此制与传世继体相绾，而传世继体，又与天地交感、万物化生同其自然。尚有一层，孔子未及明言：嫡庶之别，所以系男统之嗣续者也。男统而无嗣续，则嫡长子何自而生？嫡长子而无继世之资，则贵族宗法何自而立？宗法不立，则西周诸制何自而建，西周之世何自而安？是知孔子以归妹为天地之大义，实本于其深通《易》理、熟谙殷周之故，非夸辞也。"}},"55":{"id":"55","cnNum":"五五","name":"丰","pinyin":"fēng","fullName":"雷火丰","shortFullName":"雷火丰","upper":"震","lower":"离","upperNature":"雷","lowerNature":"火","lines":[1,0,1,1,0,0],"yaoLabels":["初九","六二","九三","九四","六五","上六"],"blocks":{"P":"《序卦传》次卦，以为物有所归则其势必大，丰之所以承归妹而起也。此解殊嫌牵合。然其欲使六十四卦之序一一皆有说，用意未可厚非；诸卦相承，本有脉络可寻者，亦有两卦偶邻而实无必然之关者，其强为之辞，无足深怪。以卦体论，下离上震：离为明，震为动。明则物无所遁，动则事无所滞；能照能行，盛大之基立矣。","G":"丰，亨，王假之。勿忧，宜日中。","G.N":"丰者，盛大之名。物至盛大，未有不亨。然此卦之盛，非寻常充积可拟，乃绝无对待、无可比方之盛。举天下以观，唯王者之所统足以当之：其位则尊无与二，其财则富莫与京，其民则众莫能匹，其地则广莫能限。四者备，而其大乃成。然则孰能致此？曰“王假之”，言非王莫能至也。\n盛则有亨，亦复有忧。月满必亏，日方中而即昃；凡物越其涯量，衰即随之。盛之中已伏衰机，是可忧也。而卦系之曰“勿忧”，盖有说焉，知“宜日中”而已。所谓日中，指昼漏方半、日轮当空之时，光最强、最盛、最无所不至。止于此处而不过，则盛可久；一过正午，日即西斜，渐就沉落。推此自然之序以观人事，亦复如是：人主之治，盛极必衰，知其然而持盈守成，不使所盛越其分限，则衰可迟。由此观之，丰卦所论，不在丰之何物，亦不在丰之何状，而在致丰与保丰之道。此其所以异于寻常言丰者也。","T":"彖曰：丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食。天地盈虚，与时消息，而况于人乎，况于鬼神乎。","T.N":"释名之法，此卦取德：丰者大也，明以动故丰。然则“明以动”云者，答的是致丰之方，非丰之名义。虚字于此最宜分辨：“而”与“以”同为承接，用“而”者两端齐等，用“以”者侧重在前。“明以动”既侧重在明，则动为宾、明为主，所谓以明而动、动不离明者是也，盛大之业由是而成。反言之，处丰者不可不明，一有昏翳，即无致丰之理。“刚以动”之重“刚”，“顺以说”之重“顺”，其归一也，取例正同。若径以“明以动”为丰之名义，则失其旨矣。\n至与噬嗑相较，又有辨。二卦之为道，皆不离乎明与动，而其次第不同：噬嗑先动而后求明，动焉而明未至，亨犹未可期，必待明得而后通。丰则明具于先，不烦外索，明立而后动，亨不期而自至。二卦之所由分，正在此。\n“王假之，尚大也；勿忧宜日中，宜照天下也。”丰之盛，非王莫致。王有天下，所据既大，则所以守之治之者亦不容不大，故曰尚大。此“大”兼二义：所治之天下至广，一也；保治天下之道至隆，二也。道惟何？以盛大之明普照天下，无远不周，无微不至而已。欲得此境，必常如“日中”之时，光照最足最遍。日未中，照有不及；日已中，又将昃。过此则光杀而斜景继之，故所贵者止于方中之顷，不令其有过焉。此释卦辞也。盖明之所被者广，则所保者亦广；照之所遗者多，则所保者亦狭，此尚大之实也。\n“日中则昃，月盈则食；天地盈虚，与时消息，而况于人乎，况于鬼神乎。”孔子既释卦辞，复推其未尽之意。所谓未尽，非别有一义，乃辞所未及而义本自具者。经此推衍，上古质朴艰涩之卜辞，遂转为深具理致的哲学言说。其机起于“宜日中”一语：日至于中，盛极将昃；月至于望，盈极将食。耳目习见之象，被标举为自然之常。由此更进一层：盈虚非日月所独有，乃天地之通律，“与时消息”是也。盈虚消长，无物能外，其进退一以时为断；时定则变之性定，时者，变之所依也。天地之间，盈者必虚，虚者复盈，往复无端，非人力所得而止。以一卦之辞而抽出如是辩证之结论，使个别命题获普遍之义，其事甚不易。盖其所至，已轶出筮辞町畦之外矣。\n“而况于人乎。”天地尚且有消息，人岂能独免？此便涉天人相与之说。古人论人事必系于自然，以为天人一体：天有某律，人间亦当有某律，故人宜顺天。顺天之论，道家主之最彻，然其弊在视人为自然之一部，几于泯没人之主体；儒家则力将人从自然中提出，重其在自然之前的主体地位，既承认自然之约束而主顺应，又隐含人之当改造自然之意。古人言自然，其名多假“天”字，而“天”之训甚杂，未可一概。约言之：治人者自政治言之，则“天”为超乎自然、具有意志之主宰；说理之士则以为“天”即自然，即离人心而独立之广宇。道、儒两家所言之天，皆属后义。故儒者言天而不废人事，言顺应而不失其自主。至孔子《彖传》所云天地，明指自然，无可疑者。\n“况于鬼神乎”之鬼神，亦非宗教所谓超自然之神物。宋人辨之最晰：程颐称为“造化之迹”，张载以为阴阳之“二气良能”，朱熹则就天地之全体立论，谓鬼神只是其功用留下的形迹，仿佛有人在其中操持，而实无其人。三家之旨合而观之：天地之变无穷，万物之生不已，奇妙莫测而实有轨辙可循，若有人焉默主其间，而究无其人。此无形体、不可见而可察者，《周易》名之曰鬼神。以今日之语当之，则所谓客观规律者是已，不因人之好恶而有所移易。宋人之说为得，其识足以代表儒家全体，儒者固不信有超乎自然、能主宰自然之鬼神。","X":"象曰：雷电皆至，丰。君子以折狱致刑。","X.N":"此卦之画，火内雷外，卦名遂系以雷火。孔子于大象言“雷电皆至”，电者何物？其在八经卦，则离是已。凡八经卦各有定德：乾健、坤顺、震动、离丽，此德终古不易，取象虽百变而其德自如。德者其体，象者其用，二者未可混而一之。所取之象则不拘一格：乾可天可马，离可火、可日、亦可电。离兼火与电，此处取电为切，故曰“雷电皆至”。君子之取于斯象者，实在“折狱致刑”一事。狱者，讼也；折之者，察其曲直而断焉。刑者，罚也；致之者，权其重轻而加焉。情伪不悉，则断有枉；轻重失当，则罚有淫。电主照，照则足以察狱；雷主威，威则足以行刑。明与威两不相废，废其一则狱疑而刑僭，故必兼之而后法行。此与噬嗑之“电雷”复有辨，而今本噬嗑象辞或误作“雷电”，当作“电雷”为是：彼则照在前、威在后，先立乎法，故曰“明罚敕法”；此则威居上、明居下，法已立而施于断狱，故曰“折狱致刑”。","Y1.T":"初九，遇其配主，虽旬无咎，往有尚。","Y1.N":"配主，谓九四。旬者均也，尚者嘉也。初九之辞独不及“丰”，为其居卦之初，功候尚浅，未可语丰。“遇其配主”者，九四于初九为匹、为耦，初九方将往从，与之并力以就丰功。“虽旬无咎，往有尚”者：二爻俱是刚体，以常理论之当为敌应，而乃能相从协力，共趋于丰，则不但无过，且有可嘉。或问：两刚相值，宜其相拒，何以免咎？曰：他卦论应，率取刚柔相配；此卦所贵，在明与动之互济。初九当明之始，九四当动之始，明有待而动有承，彼此交资，虽不相应，实过乎应。","Y1.X":"象曰：虽旬无咎，过旬灾也。","Y1.XN":"两刚并峙，贵在势均。势均则彼此相安，可以无咎。若初九不甘其均，求出九四之上，则平衡既失，咎乃随至。","Y2.T":"六二，丰其蔀，日中见斗，往得疑疾，有孚发若，吉。","Y2.N":"蔀者，覆蔽之名。“丰其蔀”者，当丰之时，宜乎光明四达，而光反为物所掩也。六二柔而在中，位得其正，且为离体所主，其象如日在天中。斗者，北斗也，在爻则指六五。日中而见斗，所陈者正是二与五之际：二本处日中，正当白昼昭昭，乃忽睹唯夜分始见之斗柄，是昼化为夜，明为暗夺也。六五以柔质据尊位，君之昏者也；二往而附之，必生猜忌。二之计无他，唯“有孚发若”：尽己之诚以感五之心，五苟有悟，则蔽撤疑亡，猜嫌转而为信，终亦获吉。二所以有此象，要因明与动不相资：二之明能自守，五之动则不能行，一明而一不能动，两不相济，故丰不可几。其不成之象，已昭然于昼见斗柄之际。然二终是离体之主，才具中正，能以诚信感发之力，转“往得疑疾”之困，而卒归于吉。","Y2.X":"象曰：有孚发若，信以发志也。","Y2.XN":"所贵乎六二者，其诚足以动五之心也。心苟为所动，吉乃可必。二之虚中，是其孚之所自出；五之虚中，是其可感之所在。诚之所至，宜无不入。","Y3.T":"九三，丰其沛，日中见沫，折其右肱，无咎。","Y3.N":"沛读为旆，凡蔽障之物皆是。沫者，无名之细星。“丰其沛，日中见沫”，视六二之“丰其蔀，日中见斗”为更甚。二之蔀，如日食未尽，斗犹可辨；三之沛，则如全食，虽细星亦昭昭可见，明尽为暗所代矣。三居明体之上，刚而得位，本非昏者也，然所遇之暗较二与四为尤甚，其故安在？病在上六之不我资。盖丰之成，必待明动相资。三与上为正应，而上是柔爻，居无位之地，又当震之终；震终则止，遂至不能动。有明而无动可合，此“丰其沛，日中见沫”之象所由生也。三负至明之资，而置身至暗之地，虽怀欲为之志，其明已亏，力无所措；强作则有咎，故唯“折其右肱”。人之动作，右肱是用；右肱既折，则无可为之事，无可为则咎亦无从生。","Y3.X":"象曰：丰其沛，不可大事也。折其右肱，终不可用也。","Y3.XN":"以境论之，三不逮二远矣。二虽受蔀，然所应者六五，位中而德正，尚可期其孚感，可与共图大功；三则所见者上六而已：以柔处震之尽，有动之名而无动之实，昏塞已甚，非能共大事者。三既自知所处如此，则断断不可有所施为，此“折其右肱”之所以取象也。","Y4.T":"九四，丰其蔀，日中见斗，遇其夷主，吉。","Y4.N":"九四之“丰其蔀，日中见斗”，取象与六二正同。就一义言：四以刚处柔，虽为震体之主，而位不过乎臣；己既不中，所遇之君又柔暗，欲成丰大之业，势有不可得，此蔀斗之象所由著也。就又一义言：四与初九并是阳爻，又各居一体之初，位分相当，有明动相须之谊。初九“遇其配主”，九四“遇其夷主”，皆此谊之发。盖明之主，求动以为主，故以四为配；动之主，求明以为主，故以初为夷。两爻相值，适在可为之会，故所系之辞，一则称吉，一则称往有尚。\n此处有一疑当辨：四与二辞既同，义亦相类，果无以异乎？曰：蔀斗之象虽一，所由致者则异——四坐不中，二坐居中也。四之吉，取助于初九也，明动交资而不足于己，故屈而下求焉。二之吉，守中自持而已。","Y4.X":"象曰：丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主吉，行也。","Y4.XN":"蔀与斗，二爻、四爻所指皆六五也。四之蔀，病在其位：以刚爻而居阴位，处高而不中，故德不称其任。其斗之见，病在幽昧：上为柔暗之君，下为不中之臣，昏翳相乘，光遂为所掩。至“遇其夷主”而获吉，则缘四能降心下求初九，两刚相与，此其行本自可吉。","Y5.T":"六五，来章，有庆誉，吉。","Y5.N":"丰之六爻，着“丰”字者四，而初与五独无。初之无丰，其时未至，功未及也；五之无丰，则身履至尊，所庆在得贤，不以蓄积之饶为盛也。六五质柔而志暗，端居上位而识不明，六二目之为蔀，遂裹足不往，往则猜疑必起。然二负章美之资，处下而能明；五虽暗，而所禀者柔而处中，能招之使来而任之。如此，福祉令名自然归之，吉不待言。一卦之主，舍五无属，卦辞“王假之”，盖为此爻发也。至其卦义所归，则在使明光四被于天下；六五足当此任：其体非明，而其德在中，能致二之美，藉其才以就丰大之业。成之以中，守之以中，其道与卦辞所云“勿忧”“宜日中”者，若合符节。","Y5.X":"象曰：六五之吉，有庆也。","Y5.XN":"然五所处者君位也，则其所致之盛，非一人之盛，天下共之；其所受之休，非一己之休，天下共之。庆之在天下，即庆之在五也，故爻系以“有庆”。","Y6.T":"上六，丰其屋，蔀其家，阙其户，阒其无人，三岁不觌，凶。","Y6.N":"六爻之中，上六最劣，亦唯此爻言凶。上六与六五皆不能无过：二、四之蔀，实由五致，二应五，四承五也。然五之中德自在，虽能加蔽于人，而己终不为所蔽，故犹得“来章”之吉。上六不然：三之“丰其沛”，由其正应而致，此犹可解；至若既蔽于人，又复自蔽，则凶有所不免，其情与明夷上六相类。推其故：以柔质居丰之季、动之末，位非所安，高而昏，自弃于众，蔽之深者也，几于不可救。“丰其屋”者，广其宫室之谓，譬其轩然自大、气盈志满、纵恣而无节。“蔀其家”者，屋日以广，效乃大谬：门闾未崇，而一身一家先自障隔，孑然孤立。“阙其户，阒其无人”，则深居简出，目中惟己，旁无他人；己既无视于人，人亦相忘于己，往还之道绝，故窥其门内，空无一人，孤绝至矣。斗也、沫也，尚犹可见；上六之昏，乃至户内无人，并人而亦不见。“三岁不觌”，三岁言其久，觌即见也。其自闭于内，既不睹人，人亦莫睹之，如是者久而未改。蔽既深锢，无术自解，凶之来也必矣。","Y6.X":"象曰：丰其屋，天际翔也。阙其户，阒其无人，自藏也。","Y6.XN":"“丰其屋”，谓上六当丰之极，处高而不下交，自绝于人，其势如飞鸟之在天。“阙其户，阒其无人”，此孤绝之局，非由外铄，乃其自藏而自造者也。高、蔽、藏三者，皆其自取，凶亦自致，总由丰大之过。扬雄尝云“炎炎者灭”，又云“隆隆者绝”：观雷观火，盈实之至，终有收声藏热之时；而高门巨室，鬼得而窥之。语意与丰之上六，适相符契。","Z":"丰之吉凶，一断于明与暗。内三爻处离体，明在其躬，故或吉或无咎；外三爻处震体，明非所有，能借明者吉，不能者凶，此一义也。其次，此卦论交，重在同德相求、明动互济，而阴阳相应之常例在所不拘。初与四皆刚，他卦遇之则为敌，此卦则以为得力；三与上刚柔正应，他卦所贵，此卦乃最凶，三伤其右肱，上且及于凶咎。取义不同，故吉凶相反如此。"}},"56":{"id":"56","cnNum":"五六","name":"旅","pinyin":"lǚ","fullName":"火山旅","shortFullName":"火山旅","upper":"离","lower":"艮","upperNature":"火","lowerNature":"山","lines":[0,0,1,1,0,1],"yaoLabels":["初六","六二","九三","九四","六五","上九"],"blocks":{"P":"旅承丰后。夫盛极者无所复容，故居不保其宅；居不保，则人谓之羁旅。序卦之次，正以是故。以卦体求之：下艮为山，山有定形而不可迁；上离为火，火无常舍而炎上。有定者竟舍之而去，无常者反附物而丽，皆去其所止而不居，旅之名所由立也。火且不在卦中而在卦外，尤见其丽于外。","G":"旅，小亨，旅贞吉。","G.N":"旅者已去其居，然犹未入于困，故有亨之道，所亨者小，非大通也。就卦才论之：一卦之主为六五，体柔而处中，又顺乎阳刚。柔则不亢，中则不偏，顺则不争，处旅所贵者备于此，此其所以小亨。若大亨，则须阳刚中正者为辅于下，旅之诸爻无是，故不能大。然亨虽小，正不可一日离。旅之得吉，正在守正；非谓所亨既小，便可稍宽其守。世或疑小亨者可苟合取容，此说非是：境遇虽有广狭，所守则无两辙。","T":"彖曰：旅小亨，柔得中乎外而顺乎刚，止而丽乎明，是以小亨旅贞吉也。旅之时义大矣哉。","T.N":"右彖传一段，于卦名无所发挥，专就卦辞立说。其所以能“小亨”而“旅贞吉”者，柄在六五。六五为卦主，体柔而居外卦之中，且俯就二刚之间。柔则能屈，中则不偏，在外则知所处，顺刚则不肯自用——处屈以求伸者，正旅道之所尚。此就爻德言也。再合二体观之：下艮主止，上离主明。止则不为躁动所摇，明则不为邪暗所蔽，故能寄迹他方而守其正。六五备此数者，小亨与贞吉所以并系焉。\n末复叹曰“旅之时义大矣哉”。古人重去其乡，寄居异国、流落他方，视之至重。天下之事，无非随时而各适其宜；然旅之境地最难审处，旅之义蕴亦最难穷尽。操持得宜，则因旅而兴；失其操持，则因旅而亡。亨之效虽狭，而所关者如此，此仲尼所以特著其为大。","X":"象曰：山上有火，旅。君子以明慎用刑，而不留狱。","X.N":"火行于山，则动而不留；山止于下，则静而有定。静者能照，动者不居，此旅之所以为旅。君子取之以治狱：狱者两造之争，最忌昏惰。山体静，故其断也明；火性动，故其去也速。明则情伪不能遁，慎则轻重无所枉；既决则遣之，不使系于囹圄。判决者，刑之成也；留狱者，案悬而不决也。草率则冤，淹滞则弊，二者皆足为害。","Y1.T":"初六，旅琐琐，斯其所取灾。","Y1.N":"琐琐者，细碎猥下之谓；斯，犹此也。初六以柔弱之质，当行旅发端之地，志气既卑，识见复短，所养者口体之末，所遗者德义之大。当其困于道途，昼营者蝇头之利，夜计者床笫之私，安能有远到之举？上不足以益国，下不足以庇身，灾之来也，非天夺之，乃自招之。","Y1.X":"象曰：旅琐琐，志穷灾也。","Y1.XN":"爻辞贱其行事，象辞鄙其心志。行事之细碎可贱，实由器量局促、境遇穷迫，所成者小人之褊心耳。","Y2.T":"六二，旅即次，怀其资，得童仆贞。","Y2.N":"六二以柔爻处柔位，既正且中，其德为柔顺而中正，以此涉旅，最为合宜。三者：行而获舍，囊中有财，仆隶效忠——皆此德之所召。次者，舍也，即次谓行旅而有所栖止；资者，财也，怀资谓囊中有以自给；贞者，正也，得童仆贞谓所使令者尽心相与、诚实无欺。客于异乡，栖止有所，资用不乏，仆从可信，人事之善止于此矣。然爻辞不言吉，何也？处旅之时，但得免于祸患已为幸，吉非所敢望也。所谓童仆，即初六。初六上比于六二；在彼自为琐琐无志之人，在此则为可托之仆。","Y2.X":"象曰：得童仆贞，终无尤也。","Y2.XN":"三者之中，得童仆贞尤为纲领。盖行旅困顿之际，苟有忠实者为之奔走服役，则次可即、资可怀，终其身可免尤悔。","Y3.T":"九三，旅焚其次，丧其童仆贞，厉。","Y3.N":"厉者，危也。九三以刚居刚，六二以柔居柔，皆不失位，皆宜有次。位同而辞异，何耶？六二曰即次，是有栖止而安；九三曰焚其次，是栖止虽得而旋毁。六二曰得童仆贞，是得人之忠；九三曰丧其童仆贞，是素有之忠而一旦失之。一吉一凶，判然相反。求其故，则在二柔顺而守中、处下而能谦；三刚而过、居高而不中。既不中而过刚，则焚次丧仆，危厉之来有必至者。","Y3.X":"象曰：旅焚其次，亦以伤矣。以旅与下，其义丧也。","Y3.XN":"下谓童仆。九三刚暴而不中，火既焚其舍，又失仆从之忠，危殆甚矣。旅居之人，亲党绝少，旦暮相与者惟仆隶耳。三待之如途人，彼亦以途人自处而逝，是弃其助也。咎在三，不在仆。象称“以旅与下”，正谓以旅处之道遇其下；其失也，“其义丧也”。义者，宜也、理也。仆之去，于理为当然，非偶然也。","Y4.T":"九四，旅于处，得其资斧，我心不快。","Y4.N":"资读为齐，齐者利也；斧以断物，资斧谓犀利之斧。九四之体，柔也；其位，则上卦之下也。以柔处下，于旅为宜，《爻》系之以“旅于处，得其资斧”。旅于处者，客于他邦而得一栖身之所；得其资斧者，挟自卫之具而不为人所侮。此其善也。然以较“即次”，则有间矣。即次者，暂止之谓，行旅之常，终有归还之期；旅于处者，如寓公之寄食于邻封、人臣之奉使而留质于外，纵无大患，而生计久悬、归期无日，故仅胜于焚次而已。又有未善者：四以刚居柔，位不正，欲早脱旅困而志不得伸，是以“我心不快”。我者，四自谓也。","Y4.X":"象曰：旅于处，未得位也。得其资斧，心未快也。","Y4.XN":"二以柔居柔而当位，故即次；四以刚居柔而失位，故居处。失位则屈而不伸，虽挟资斧以防患，可以无伤，而志之不快，终不能掩。","Y5.T":"六五，射雉一矢亡，终以誉命。","Y5.N":"六爻之位，五为至尊，他卦多系以君道；旅则不可。天子无旅，一出而失其位，故五于此不取君义。然论旅之善处，无如六五：其体柔，其德明，居上体之中而位复得正，处旅之道莫过于此，故系以“射雉一矢亡，终以誉命”。亡者失也，谓发矢虽有一矢之费，非丧亡之谓。以微费易厚获，雉得而矢失，所偿已多。誉谓令名，命谓爵秩；终以誉命者，终必享令闻、受荣命也。","Y5.X":"象曰：终以誉命，上逮也。","Y5.XN":"逮，及也。上逮者，谓其及于上。六五虽不系以君道，实为士大夫之登高位者言之，其位望之隆，于此可见。","Y6.T":"上九，鸟焚其巢，旅人先笑后号咷，丧牛于易，凶。","Y6.N":"旅之道贵谦下柔顺而守中。上九刚而不中，位极乎上，亢烈甚于九三，六爻之中斯为最下。栖高而气盈，危莫甚焉，故取鸟巢为喻。上体为离，离，火也；火燎巢则巢毁，“鸟焚其巢”所由系。其始以加于人上而欣然自得，是为先笑；其终巢毁无归，号咷随之。牛者柔顺之物，丧牛则至顺之性尽失。刚亢至是，凶无所免。","Y6.X":"象曰：以旅在上，其义焚也。丧牛于易，终莫之闻也。","Y6.XN":"九三之“以旅与下”，是遇下如途人；上九之“以旅在上”，是身已处旅而复以尊高自居，骄纵而无所顾忌。故三称“其义丧”，上称“其义焚”，辞异而指同。“丧牛于易”何以言之？小象以“终莫之闻”为释，盖刚亢已极，柔顺之性荡然无存，其所自取者，乃无可复挽之败，非他人所得而喻也。","Z":"卦爻之常，刚者胜柔，故刚必优于柔。旅则反是：柔爻皆善，刚爻多凶。六二、六五以柔顺获吉，九三、上九以刚强取祸。就二、五论，五为上，二次之；就三、上论，上最凶，三次之。九四亦刚也，然以刚居柔，有降屈以下人之象，故“旅于处，得其资斧”，较三、上为优。此一义也。旅之取善，又不专在刚柔，而尤在于中：二、五之吉，非仅以其为柔，实以其得中。初六亦柔也，而“旅琐琐，斯其所取灾”，正坐不得其中，卑贱以自辱。三、上之危且凶，非仅以其为刚，实以其处高而不中。是故柔而得中者最上，柔而不中者亦不足取。可知《易》之所贵者中，中无往而不通；柔则随位为功，未可一概而论。"}},"57":{"id":"57","cnNum":"五七","name":"巽","pinyin":"xùn","fullName":"巽为风","shortFullName":"风风巽","upper":"巽","lower":"巽","upperNature":"风","lowerNature":"风","lines":[0,1,1,0,1,1],"yaoLabels":["初六","九二","九三","六四","九五","上九"],"blocks":{"P":"旅而无容，则必有归；此《序卦》所以次巽于旅，而曰“巽者入也”。旅之为象，犹云浮于天、萍漂于水，行止靡定，宜其无所措足。然天下无久塞之途，容之不可终拒，故旅之后受以巽。巽者，入也。所入何如？非泛然投隙之谓：一阴屈伏于内，二阳自外而至，入而散之。散之者，阳之所以解阴之结，非阴之所以夺阳之位；故巽之所主，在阳不在阴。更即其浅深论之，亦非略涉皮毛、徒具形迹者；必抵其内，察其几微，穿透壅蔽而后已。卦所以名巽，正在此深入之义。","G":"巽，小亨，利有攸往，利见大人。","G.N":"入者，深入之谓；深入事物腹心，然后积弊可去。此义有三证：天壤之间，长风驱云，阴霾为之开霁；在一人之心，则能照见几先，洞知其曲隐；措之国事，则奸慝无所遁形，夙弊可以扫除。三者皆非浮慕于外者所能办。然巽之所为，大抵补偏救敝、举废兴滞而已，与蛊之极坏而更张者异趣，故其占曰“小亨”。既已洞悉其实，则不可徒明而不行，故曰“利有攸往”；行之之际，又必得刚德者为之倡率，故曰“利见大人”。","T":"彖曰：重巽以申命，刚巽乎中正而志行，柔皆顺乎刚，是以小亨，利有攸往，利见大人。","T.N":"《彖》文通篇皆为卦义发论，末乃以“是以”收之。卦体巽下而巽上，二巽相仍，《易》名之曰重巽。风者，巽之德也；其行于天地间，遇物即入，无有障隔。由天而推之人事，君之出令布政，何以异此？然风徒鼓荡而无言，君则不能徒法：必先周知民情、深察事理，而后反覆告戒，故谓之“申命”。重巽如是，故占为小亨。至其爻位，则两体各以阳爻居二与五，而一阴退处于二阳之下——《彖》所谓“刚巽乎中正而志行，柔皆顺乎刚”者是已。刚得中正而志得施行，此“利有攸往”之所本；二五以刚处中正，初四二阴出而承顺之，此“利见大人”之所本。","X":"象曰：随风，巽。君子以申命行事。","X.N":"两巽相仍，前者过而后者继，故谓“随风”。风之拂物也，无隙不达，无往不靡，此巽象也。孔子以为，君子体此卦，当以风之入物者施于政令：命之未出，先为之申明告谕，使民晓然知上之所令可行而且当行；及其既信，乃见之于事，是“行事”也。盖君子之政，不贵空言：所许于人者必先行之，所行既践其所言，则民之从之也，速于风动。","Y1.T":"初六，进退，利武人之贞。","Y1.N":"巽之主于人事，在申命而行之。命令之行，贵乎一定：当进则进，当退则退，最忌游移两端。初六以阴柔处最下，上承刚爻而不得中位，其巽也失于卑屈，畏葸而少断，正是志意恇怯、临事不决之象，故爻辞系以“进退”。所谓“利武人之贞”者，非教之从武，乃取其刚果坚定，以药其柔懦；使初六能勉强自振，如武人之贞固不移，则其弊可去。","Y1.X":"象曰：进退，志疑也。利武人之贞，志治也。","Y1.XN":"《象》以“疑”与“治”对举。两可而莫适为主，是疑；一定而不可摇，是治。治则或进或退皆有定守，无所犹豫。爻辞之意，实不出此二者之间。初六柔而在下，故其象为欲进欲退、中心无主；补救之术，唯在以武人之贞勇决断，去其疑而成其治。","Y2.T":"九二，巽在床下，用史巫纷若，吉无咎。","Y2.N":"床之下，晦昧幽隐，物之不正者恒伏焉。巽而入于其下，是探至幽深之地，凡向所蔽匿、不可示人者，悉在洞见之中，因而措手以去之。《周礼》之制，史司卜筮以决吉凶，巫司祓禳以除灾咎；“纷若”者，言其仪节之繁数。古人于幽隐之祟，必使史巫治之，其来旧矣。就文面观之，若借史巫之力以驱除邪祟；究其实，则九二既能下入幽隐、尽得事情之真，又能反复申命、周匝举事，是取积极之方以图其解决。审命行事而勤恳至此，宜其吉而无咎。","Y2.X":"象曰：纷若之吉，得中也。","Y2.XN":"九二之吉无咎，以其刚而居中也。刚则能断，中则不过；当申命行事纷纭杂沓之际，独能执中而权其轻重，无太过，亦无不及。","Y3.T":"九三，频巽，吝。","Y3.N":"巽之为入，非漫然之入；君人者申命行事，期于洽于人心，乃其所谓入。然“频巽”与“重巽”判然不同。重巽者，一命之申，至于再三，所申始终一命，未尝有所改易。频巽则不然：朝出一令，暮更一令，纷纭变易而无常守，民将茫然不知所属。九三屡行而屡失，屡失而复行，政令终不可立，此其所以吝。","Y3.X":"象曰：频巽之吝，志穷也。","Y3.XN":"《象》推九三之吝，归狱于“志穷”。穷与疑相近而实异。疑者，两途并陈，取舍未定，其病在心之游移；游移可解，为之指明所向则定矣。穷者，非不欲巽，而才力俱竭，更无措置之方；此非告语所能济，故终归于吝而已。九三之至此，由其刚而失中，过乎中道故也。","Y4.T":"六四，悔亡，田获三品。","Y4.N":"六四以柔居柔，四顾无应，前后左右莫非刚爻，乘之者刚，承之者亦刚，处境可谓难矣，宜有悔也。然亦有可取者：上比九五，阴居阴位，所依者尊，所履者正；己虽非刚，而能顺刚以行，故悔可于此而亡。四与初，同处二阳之下者也，而所遇优于初。何也？初在重巽之底，依违于进退之间；四则位高而当位，足以有为，其效见于事功。田者，猎也。古者以猎讲武，除害兴利即寓其中。“三品”旧说分干豆、宾客、充庖三类，其实不必拘定品目，特言所获之盛耳；解卦获狐而此获三品，正见其得之多，非止于一狐。","Y4.X":"象曰：田获三品，有功也。","Y4.XN":"《象》言“有功”，即指田猎之有所获。猎而有获，喻六四申命行事之克著其效也。","Y5.T":"九五，贞吉，悔亡，无不利。无初有终，先庚三日，后庚三日，吉。","Y5.N":"九五为巽之主，其德一言以蔽之曰贞。吉也，悔亡也，无不利也，三者非各有其道，皆自贞出。贞者何？即《彖》文“刚巽乎中正而志行”之中正是已。九五处尊位而司发布命令之权，中正二字于斯为要。惟其中正，故得吉；惟其中正，故内无所疑于心，外无所疑于事，而悔可亡；惟其中正，故命之出也，若泉之有源，达于四境而无不通，此无不利之所由。\n“无初有终”与“先庚三日，后庚三日”，语异而指同，当合而观之。庚之取义有二：十干之序，庚处其后而近于终，一也；庚训为更，为改易，二也。三日者，虚数，非限以三朝，盖谓为日之长。合两语而衡之，其旨在于：国与天下苟有积弊，则不可以不革；革则必立制而申命。立制申命之际，最忌躁妄，须从容审虑。先庚者，命未出而先有其期，以畜聚之、思度之；后庚者，命既出而复有其期，以试行之、总括之。又巽之为卦主于权，就邦国言，其事为改革，为中兴，非移祚易姓之比，尤非社会革命之谓，故曰“无初有终”。九五果能先焉后焉各尽其期，则吉。一爻之中两言吉者，义有轻重：前之吉，九五所本有；后之吉，则缘事而生，成否未可必，系乎能行先后三日之法与否。\n先庚后庚之解，与蛊辞先甲后甲本属一类，昔人号为《易》中难通之例。前儒之说，大别为二：郑玄、王弼各张一帜。郑氏之说，以新令造作之辰当乎甲。命将出而先之三日，配以辛，辛取自新；命既出而后之三日，配以丁，丁取丁宁。朱子《本义》承其绪，以甲居日首而为事端，故前辛后丁；若先庚一义，郑说久佚，准彼例此，尚可推寻。朱子自为之解，则谓庚之谊为更，其所处则为变：前乎此者三日为丁，后乎此者三日为癸；丁者未变而先致其叮咛，癸者已变而后施其揆度。王氏所主则不然：其以甲为创制之令，创制者不沿旧贯，故先焉三日、后焉三日，俟令洽于民而后加诛；其以申命释庚，谓整齐万物不可卒然，民之迷也久，未可直遂，故申之于先者三日，令既昭著，复申三日，然后诛之而无怨。故在王氏之意，甲与庚虽异名，而同归于申命之一事。程子《易传》则祖王氏，谓甲者数之所始、事之所起，与甲乙、甲令之目同科；其治蛊也，必先究其先后之序，以为除弊图久之地。先甲者，溯其已然之由；后甲者，逆其将然之势。由一以及二三，非刻日以为期，正状其谋虑之周匝、推求之悠远。溯其由则救之也有术，逆其势则备之也有具；救得其术，前弊可除，备得其具，后利可延。程子又以甲主事之始，庚主变之始：凡制作政教，系之于甲，取开端之义；凡发号施令，系之于庚，取改易之义。又谓命令之颁，必有所改易而后有事；初之不淑，故系以无初；改而适善，故系以有终。使其事本善，则命无所用，更亦无所施。爻之先庚后庚而终系以吉者，正欲明更革之令，其施设当如是耳。十干之序，以戊己居中位，逾中则更，庚适当其会，故假以为名。更革之举，必自其始而究之，迄其终而要之；此与先甲后甲之指，曾无以异也。\n前所陈郑、朱、王、程四家，其持论之根柢，判然分途。前一家以甲庚为创制或申命之日期，以先后三日为训迪斯民之方；后一家以甲庚为创制之命、改制之令，以先后三日为君上自谋、戒惧审慎之功。前家于甲庚二字之辨，犹失之浑沦；后家则截分而言之：甲主创制，属制作政教；庚主更改，属发号施令。就此末一层观之，《周易折中》所采龚焕之论，最为疏达。龚氏谓蛊之辞系以先甲后甲，巽之爻系以先庚后庚：事坏而至蛊，则宜复其始，甲为事之始，故《彖》以终则有始言先甲后甲；至于事久弊生，势在必革，则庚取更变之义，而爻辞之系，遂以无初有终当之。物坏而更新，则其终复有始；事弊而改易，则无初而有终。开国之君，别立法度以贻后人，则终则有始之谓也；继世而兴者，荡涤前代之秕政，则无初有终之谓也。王、程为得，龚氏特表而出之者也。","Y5.X":"象曰：九五之吉，位正中也。","Y5.XN":"“正中”即“中正”，倒其文者，取韵便耳。《象》言九五之吉，合爻辞两吉而并数之：贞吉之吉，与夫先庚后庚之吉，其致一也——皆缘九五刚居刚位、处中得正而然。","Y6.T":"上九，巽在床下。丧其资斧，贞凶。","Y6.N":"床下为幽隐之地，邪僻者所栖。能入乎其下，见其所不见，察之可谓深矣。察深本足取，九二由是得吉无咎。上九则不然。其在一卦之末，刚而处亢，巽已将极，势不容不变，而彼固守其故；欲袭九二之迹，而时非其时。爻辞两系“巽在床下”，而吉凶顿异：九二得之为有为，上九得之为太过。盖为之而非其时、非其分，则未有不流于过者；过则未有不失。九二“用史巫纷若”而吉无咎，上九乃“丧其资斧”而贞凶，其故在此。“资”旧本作“齐”，以卦次相接、声近而讹耳；齐斧者，齐物之斧，取譬于因时制宜、行权应变之能。处巽之极而刚断已亡，权不可行，犹执此道以终，凶何以免。","Y6.X":"象曰：巽在床下，上穷也。丧其资斧，正乎凶也。","Y6.XN":"“巽在床下”，非美象也，乃过巽之征。上九所以得此象，正缘其位在一卦之上，巽道至是而穷。以刚居亢，应变之权、决断之力俱已尽失，而犹抱此不变，其终必凶，《象》所谓“正乎凶也”。","Z":"《说卦》《序卦》皆以入言巽，《杂卦》则目之为伏；二说似相戾，而实相贯，未可执一而废一也。巽之卦，巽下而巽上，两体皆二阳居上、一阴居下。自阴一面言之，一阴藏于二阳之下，斯谓之伏；自阳一面言之，二阳加于一阴之上，势将入其中而有所制，斯谓之入。二者若相背而实相须：阴苟不伏，阳亦无所施其入；阳苟不入，阴亦无由成其伏。然就卦义言，所重者在入而不在伏。《杂卦》之云伏，特与兑对举而及之：兑以一阴加于二阳之上，其阴见；巽则反是，其阴伏。然则入果何谓？巽之为风，风之及物，无不通彻，入之至也。长风驱云而积阴为之散，即此是已。由是知巽之入非徒入而已，既入则有制存焉。推之邦国，则为人君申命行事：发政施教，务使其命深入乎人心，深达乎事理，以之除奸慝、厘积弊。故巽义为入，而入之中实含制之一义。《说卦》称万物“齐乎巽”，又释之曰“齐也者，言万物之絜齐也”。自其成效而观，入之所致者，万物于是乎齐；齐之为言，即所以制之也。虽有齐物之说，无害于巽义之为入：入者其本，无入则无制，亦无絜齐之可言。\n通一卦而论，初六、六四者，伏于内之阴，四阳之所入而制者也；巽之入义，正取诸此。然析至各爻，则又不尽然：四阳固操入制之柄，初、四二阴亦未尝不可操之。六爻之在巽时，各视其才质与位分以为用。初六体柔而居下，依违于进退，故“利武人之贞”，所乏者刚决耳。六四虽同乎柔，其位则高，其守则正，且承九五之尊，故进退之疑不及于身，而田获三品之效归之。九三、上九之病，同在于过中：三过中而失之刚，是以“频巽”，行而复失，失而复行，终无以使入制之功著，故吝；上则以刚处亢，过中而位虚，其象为“巽在床下，丧其资斧”；如是则不为利而为害，凶无可逭。《易》之道贵中，而巽为尤甚。九二、九五，即《彖》所谓“刚巽乎中正而志行”者：二能尽申命之方，故吉无咎；五以尊位守中正，先庚后庚，始慎而终思，因时以行权，巽道之善无过乎此，故吉之外复言吉也。"}},"58":{"id":"58","cnNum":"五八","name":"兑","pinyin":"duì","fullName":"兑为泽","shortFullName":"泽泽兑","upper":"兑","lower":"兑","upperNature":"泽","lowerNature":"泽","lines":[1,1,0,1,1,0],"yaoLabels":["初九","九二","六三","九四","九五","上六"],"blocks":{"P":"《序卦传》释巽为入，谓既入而后有悦，遂以说承其后；其释兑，则曰说也。前半之说，以入为悦之所由生，恐未必然：深入与喜悦之间，本无相生之序。“兑者说也”一语则可取——兑字本指喜悦，兑、说原是一字之异形，与咸、感同例。咸所表者即感，兑所表者即说，非一义而二之。后人造为“无心之感”“无言之说”，欲于一语之中剖分两意，核之文例，殊无凭据。","G":"兑，亨，利贞。","G.N":"说、悦二字，在兑卦可以互训。此卦上下两体同为兑，每体皆两阳在下、一阴居其上，阴柔显露于外，正是喜意形于容色之象。喜悦何以能通？盖我以喜悦待人，人亦以喜悦相报；彼此相与，途辙自开，亨由是得。“利贞”二字则为警戒之辞：行喜悦之事，须以贞固正当为本。求悦之道虽宽，却非率尔一途即可通。倘若所悦者止于一己之欲，舍正路而营其私，便流为邪媚；邪媚之徒，既难通达，悔吝亦随之而至。","T":"彖曰：兑说也。刚中而柔外，说以利贞。是以顺乎天而应乎人。说以先民，民忘其劳；说以犯难，民忘其死。说之大，民劝矣哉。","T.N":"“兑说也”三字，为卦名之训。喜悦、和悦，皆此字所含。咸卦《彖传》云“咸感也”，取径与此相同：皆以一字释一字，指明本字即是此义。\n“刚中而柔外，说以利贞”，则就卦辞而立说。通观一卦，阴唯一而阳居其二，柔在表而刚居中，阳悦阴、阴亦悦阳，喜悦之义由是而生。二与五皆阳，是刚在中心；三与上皆阴，是柔在外表。此二者，正是兑之所以亨、所以利贞的两处凭据。刚之居中，见其中怀笃实，所悦者不流于伪，贞正可守；柔之在外，见其接物温和，人乐与之，亨通可致。然二者相待而成，去一不可。假使柔外而刚不中，则一味婉顺，所悦者必失其正，是谄媚而非喜悦；假使刚中而柔不外，则气盛少温，人不敢近，是亢暴而非喜悦。必也刚以立体、柔以致用，然后“说以利贞”四字有着落。\n“是以顺乎天而应乎人”以下，乃孔子推衍卦辞之余意。刚中柔外之中，本已兼具天之道与人之道。刚则不屈，不屈则诚；诚者合于天理，是顺乎天。柔则能容，能容则和；和者契于人心，是应乎人。孟子所言“中心悦而诚服也”，与此正是一事。在孔子之意，明王行喜悦之政，所措意者惟在是否合天理、是否当人心，初未尝设一法以求天下之归己。天下中心悦服，乃其合天当人之效验，非其立心之本愿。\n“说以先民，民忘其劳；说以犯难，民忘其死。说之大，民劝矣哉”——圣王既不为邀悦于民而行此道，然其道果能顺天应人，则必有两事随之。一在平居：使民饱食暖衣，养生送死而无憾，是“说以先民”。一在危殆：如兴师用兵，必察民情之向背以为行止，是“说以犯难”。民既先得其所悦，则驱之出力而忘其劳，迫之赴难而忘其死。为上者于此道处之得宜，民且不待督责而自劝。故孔子叹其大也。","X":"象曰：丽泽，兑。君子以朋友讲习。","X.N":"丽者，附着相依之谓。两泽相连，水脉相通，此卦取象正在于此。泽与泽既相依附，则浸润渗灌，彼此皆得其益。君子睹此象而悟：人之相与，亦当如是——于是取朋友讲习之事。所谓朋友，指志趣相同、道术相合者。理有未澈，则相与剖辨，是为讲；事有未熟，则相与履践，是为习。数人聚处，质疑辩难，交相磨砺，其进自速。较之闭户独学、闻见狭隘者，所得多寡相去甚远。且此乐在五伦中最为纯粹，纵稍过其度，亦不至招损。孔门之教，所忧在讲习之废，所悦在时习之熟，所乐在朋来之远；三事相贯，与丽泽相滋之象无二致。","Y1.T":"初九，和兑吉。","Y1.N":"喜悦之中自具一层“和”的意思：悦而不失其和，方是可乐之悦。初九以阳居卦之初，位在说体之下，上与六四虽相应而实无所牵系。惟其如此，故能以和悦为事。析言之：体属阳刚，则操守自定，不至柔媚取容；位处最下，则安分自守，不生攀援之想；外无系应，则随遇而安，胸中不存经营。三者合，而所悦者止于一“和”。既不偏私，吉可知矣。","Y1.X":"象曰：和兑之吉，行未疑也。","Y1.XN":"“行未疑”者，谓其行事尚无可以致疑之处。无可致疑，即未尝见有阙失之可指。初九居说之始而位卑，未得中正，爻辞仅许其吉，小象遂以“行未疑”补足之——正因其未及中正，故须即行迹上验之；若已居中得正，德位兼隆，则无待乎此语矣。","Y2.T":"九二，孚兑吉，悔亡。","Y2.N":"九二阳刚而位下卦之中，中则无过，刚则有守，是内有笃实之德者。其悦人也一本于诚，不以容色言辞相取，故谓之孚兑。悦而不失刚中，宜其吉也。然所处可虑：上承六三，近比阴柔，小人素善媚人，易为所牵，按理当有悔。幸刚中之德足以自持，同处而不与同流，如君子和而不同，则悔可消。","Y2.X":"象曰：孚兑之吉，信志也。","Y2.XN":"初九小象称“行未疑”，此爻则称“信志”，两语正可比观。就处境论，初易而二难。初九与六三相距尚远，形迹未接，故不惟其志可保，即其行事亦无隙可议。九二则与六三相承相比，密迩而处，志虽可保，迹则难明，所以止许其“信志”。两家并得吉占，而九二独多“悔亡”二字，其故即在于此。","Y3.T":"六三，来兑凶。","Y3.N":"六三质柔而失中不正，又处在阳位，其性躁动，不肯自守，遂下即初、二两阳，希其见悦，爻辞所以系之曰“来兑”。来者，往就之辞；来兑者，求悦于人者也。夫悦有悦之道，得之在自然，本非可以意营求；今乃显然而来，了无隐避，则其所行已悖于道。求悦而背道，凶所宜也。","Y3.X":"象曰：来兑之凶，位不当也。","Y3.XN":"上既失中，复不当位，外无正应为之援手。通观六爻，处境最险，凶所由生。九二以刚中自守，其志足恃，此爻无之；初九不惟志可恃，行迹亦复无疵，此爻更无之。","Y4.T":"九四，商兑未宁，介疾有喜。","Y4.N":"“商兑”云者，谓于悦人一事反复审度，权其可否。所悦而合于正，则与之；一涉非道，则宁舍而不为，非漫然苟悦也。“未宁”则承此而言：心常戒惧，不肯自谓已安，遂耽溺于所悦而不返。九四之位本不当，然体实阳刚，故能如是审择而不敢自逸。惟能审择戒惧，故虽为疾迫而终有喜。疾者，喻外邪之相侵；喜者，喻邪之既去。“介疾有喜”，正指九四与六三相近而处，身当邪害之交。设若安溺，则六三之毒必及于己。所幸本质刚健，卓然自守，逼近于病而不为病所染，病亦终有瘳时。","Y4.X":"象曰：九四之喜，有庆也。","Y4.XN":"九四上近九五，居大臣之地，其责非轻。故所谓喜者，不系乎一身之得失；举措所及，天下国家或并受其福。小象改“喜”言“庆”，正为此故。","Y5.T":"九五，孚于剥，有厉。","Y5.N":"阴之侵阳，小人之下君子，其势日长，卦中名之曰“剥”。剥既为小人之称，则“孚于剥”者，谓信之笃而托之深，所信非他，即上六也。九五以阳刚处尊，居中得正，六爻之中最善行悦道者；而其难恰在近比上六。上六本小人之尤，志在剥阳，欲得九五之悦，必以甘言令色自饰，把祸心深藏于内。故爻辞致戒：当此之时，若以一念之诚，遽信其可怜之色、可听之辞，便当知危厉在侧，心存戒惧，毋为所惑。","Y5.X":"象曰：孚于剥，位正当也。","Y5.XN":"小象以位之得正为言，其义与履卦九五相发。此爻独承“孚于剥，有厉”之戒，何也？尊位者易为人所攀，而下与上六柔爻相邻，主宾相逼，遂生出一个怎样应接小人媚悦于己的难题。他爻之处，非如九五之贵且正，此戒自无所施。","Y6.T":"上六，引兑。","Y6.N":"上六之“引兑”与六三之“来兑”，同属小人先施悦于君子，均非美事。然二者亦有辨。六三以柔居刚，性动而外求，直就二阳求其悦己，故系以“来”：来者，昭然就之，无所隐蔽，人易察知，是以六三自受其凶。上六以柔居柔，性静而善诱，不下即阳而阳自赴之，故系以“引”：引者，牵之使来，其迹微，其机隐，方其剥阳，犹以甘言令色自覆，猝难窥破。故爻辞不为上六言凶，而于与之密比之九五致其警戒，欲其常怀危厉，防其谋之得遂。","Y6.X":"象曰：上六引兑，未光也。","Y6.XN":"“光”取宽广之义，“未光”即未能宽广。所当问者：其指何人？曰上六。其何以未能宽广？则以柔乘刚、以小人间君子，本有剥阳之势，而其势终不得张。所以不得张者，引兑一途虽藏其形、伏其机，然受引之九五已存戒心，不落其彀，故所蓄之害竟无所发。","Z":"兑之所以为说，推其究竟，所论者乃人与群伦相接、如何相与为悦一事。人相悦则情通，情通则众无所拂，故卦辞系之以亨。然悦非可以无节者，其先必立乎贞正。悦而离正，则入于邪媚一路，非君子所屑为。悦之内又自具和意，故其义可与《论语》“君子和而不同”相证。\n合全体而观，欲使所悦者不违于道，而“所以利贞”之旨得成，则刚中与柔外二者，阙一不可。验之于人：内有刚健诚笃之实，外有柔和巽顺之文。\n分六爻而察，则同者少而异者多。其一，阳爻之处，其占皆吉；阴爻之处，其占皆凶。刚者自制有节，柔者纵而无度，吉凶之分由此。其二，阳爻虽吉，亦复有等。初九和兑，所悦者公而无私，六爻中最为无疵。九二刚中，德非不美，顾与六三相比，故吉之外又缀“悔亡”。九五以刚中居尊，犹有“有厉”之警，其地反不如九四之“介疾有喜”。此见圣人系辞之意：行悦者若与小人相邻，纵有刚中之资，亦当凛凛自防——小人伺隙而来，所悦在面，所怀在剥。六三之来、上六之引，皆不以道求悦之类。悦生于自然，营求则失；君子惟务行道，不问人之悦否。一涉有意，未有不凶。上六引兑，其求也隐，其迹也微，故自其一爻言之，吉凶悔吝犹在未定；若论其祸人之深，则六三犹浅，此九五所以必守“孚于剥有厉”之戒而不敢一日忘备也。"}},"59":{"id":"59","cnNum":"五九","name":"涣","pinyin":"huàn","fullName":"风水涣","shortFullName":"风水涣","upper":"巽","lower":"坎","upperNature":"风","lowerNature":"水","lines":[0,1,0,0,1,1],"yaoLabels":["初六","九二","六三","六四","九五","上九"],"blocks":{"P":"《序卦传》云：兑为说，说极而后散，故涣承其后。涣者，离也——离即解散之义。人情忧则气血凝滞，悦则气血通畅，是悦之中本含散理；兑终受涣，正由此故。以卦体言之，坎处其下，巽处其上，风行水面，水激于风而离披，卦名之立，实取诸此。","G":"涣，亨。王假有庙，利涉大川，利贞。","G.N":"涣者，离散也。此卦所论，乃天下人心解散之际，如何收拾局面、消解祸难。散乱之世，任其事者非王而谁？王之所恃，首在假有庙。宗庙者，祖考神灵所栖，国有大故则王入而告焉，求先人之佑。祭享一行，同姓者念其源，异姓者亦知所系，宗族之情由此而生，国家之念由此而固，人心遂聚而不复分，艰危遂可度。既有庙以得先助，所图者非细故，乃出大险、济大难，故系以利涉大川。就卦体观之，坎水在下，巽木在上，木浮水上而进，亦涉川之象也。利贞者，利于守正。此贞非戒人之辞，乃言此卦自有贞正之资与其可为贞正之势。盖四、五两爻各居本位而不失，正之所在，故系利贞。","T":"彖曰：涣亨，刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。","T.N":"彖云“涣亨，刚来而不穷，柔得位乎外而上同”。此语当以卦变求之：易中言刚柔往来，其源皆出乾坤二经，涣亦不外是。下体之坎，溯其所自，则坤之六二易为阳而成焉者也；上体之巽，溯其所自，则乾之初九易为阴而成焉者也。刚既来居于内，柔遂得位于外。何谓刚来？刚之体在下是也。何谓不穷？刚虽居下，未尝困极，而所居又适得其中。何谓柔得位乎外？四以阴爻居阴位，位与德称，故许其得位。何谓而上同？四虽不处中，然近与九五相比，比于五即所以从乎中。总之，处内者九二，刚而居中，不为险困；处外者六四，柔得其所，又上比于五。一刚一柔，内外相济，亨之可致者具于此，故继系以利涉大川、利贞。“王假有庙，王乃在中也”——王指何爻？九五也。五在上体之中，居正而不偏，假庙之义于此为最切。“利涉大川，乘木有功也”——以象言之，巽木也，坎水也；木之利涉，恃水以行，舟具而川可越，济险之功由是而立。","X":"象曰：风行水上，涣。先王以享于帝，立庙。","X.N":"风行于水面，是离散之象。先王见之，知散者可聚，乃荐享上帝、建立宗庙，以系属人心。","Y1.T":"初六，用拯马壮，吉。","Y1.N":"初六当涣之始，散端方萌而根株未固，此时图之，用力少而收功多，故为拯涣之会。然以阴柔之质，力不能独任其事。求助何人？此爻于卦中无正应，所幸近与九二相比；九二亦无正应，而才具刚中。两无应者反可相求，二既愿助，又有助之之能。譬之行者假壮马之力，虽远可达；散之未深者得此而早救，是以吉。","Y1.X":"象曰：初六之吉，顺也。","Y1.XN":"初六以柔弱而成拯涣之功，其要只在顺。一则顺九二刚中之才以自助，二则顺天时，乘其难端未炽而施力，故吉。","Y2.T":"九二，涣奔其机，悔亡。","Y2.N":"诸爻之首皆系以涣字，唯初六不然，盖皆谓当离散之时也。九二居下体坎险之内，身处险中，悔之所不免。然使其能奔就凭依之地，则悔可去。奔者，急趋之谓；机者，俯身可倚、安坐可息之具，略如小几。奔其机，即速离危地而就安处。涣之时，初与二俱无正应，独以阴阳相比，势相依赖，事相佽助。自初六言之，二为可托之壮马；自九二言之，初为可凭之机。初得刚中之援，又在难始即拯，故吉；二已陷险，所倚者乃柔弱之质，故其效止于悔亡。","Y2.X":"象曰：涣奔其机，得愿也。","Y2.XN":"九二身在险中，急于依附初六，得一可安之处，悔遂消散，其本愿亦由此而获偿。","Y3.T":"六三，涣其躬，无悔。","Y3.N":"六三与上九为正应。应而在他卦，多不吉，涣则异是。三之应上，有委身事上、忘其私己之象。以质言则阴柔，以位言则不中不正，其初固不能无自营之意；然所处者阳位，所应者上九，居阳而应阳，志得以伸，遂能散其自私之心，而广其济时之志，故无悔。惜乎济时之功非其所能，仅能自免于悔而已。","Y3.X":"象曰：涣其躬，志在外也。","Y3.XN":"六三以柔质而位失中正，本难自振；然所慕者远，故能捐弃己私、以身许上。《象》言志在外者，谓其志之所属，系于上九一爻，而不系于己也。","Y4.T":"六四，涣其群，元吉。涣有丘，匪夷所思。","Y4.N":"六四为成卦之主。以阴居阴，位得其正；上则承乎九五，下则无一爻与之相应。此象也，是谓涣其群——胸中无所隐匿，行事不阿一党，足膺济涣之大任者也。当天下国家离散之时，身为大臣而一心奉公，则必尽解朋党之结、削平割据之势，凡有害于合一之小群，悉从而涣释之。功既及此，则元吉之占，非四谁属。然四之所能，不止解散小群而已，尤在合天下于一，使小者化而为大，此则爻辞“涣有丘”之所指。至若“匪夷所思”，盖言此等规画，非寻常人之智虑所可及。","Y4.X":"象曰：涣其群元吉，光大也。","Y4.XN":"当涣之世，能散小群而聚为一大，受大善之吉，其功既博，其及于物者亦远。","Y5.T":"九五，涣汗其大号，涣王居，无咎。","Y5.N":"涣之为事，有坏处亦有好处。九五“涣汗其大号”，所取者正是好处。人身风寒郁结于内，一发其汗而邪从汗解，则体自安；当此之时，所需者汗也，汗出而病去，乌得而非善？天下国家亦犹是一身。积弊既久，疾必生，险难必见，迟之岁月，患且不可胜言。欲释险解纷，则亦须发一大汗：举积年壅滞沉痼之疾，一旦涤荡而无余。天子诸侯痛切于中、恳恻于外而发之号令，若革故鼎新之大命令者，即其汗也。号令一颁，向者之大难随声而解。九五以阳刚之德处中正之位，而居于至尊，当涣之世，恰如能布大号以纾大难之君，故有是象。“涣王居”者，王居谓人君所居，其实即指天子诸侯之身。若此重任，非他人所能负荷，唯据尊位者任之，乃可无咎。","Y5.X":"象曰：王居无咎，正位也。","Y5.XN":"小象取正位以释王居：五处至尊，故言王居；其德阳刚而中正，故称正位。能荷“涣汗其大号”之重，正由刚而居中、居而守正，譬如北辰安其所而不动。","Y6.T":"上九，涣其血，去逖出，无咎。","Y6.N":"涣有远义。血者，肌肤见伤之验，故此处血字可径作伤害解。“涣其血”与“涣其汗”非一：汗由病郁于内，故发汗以去病；血由害加于外，故涣血以避害。涣之下体，其卦为坎；坎者陷也，陷则伤随之。上九距下坎最远，是以能“去逖出，无咎”——远引而去，害不能及。去者，不复来；出者，不复入。“去逖出”三字，正状其远远相避、终身不再相近之意。","Y6.X":"象曰：涣其血，远害也。","Y6.XN":"在身者，汗可泄以祛疾，血则不可举而泄之；所谓“涣其血”，实论处涣之世如何远避外患之加于己者。孔子虑人误以为发散体中之血，故特标“远害也”以正之。使无此一语，此爻之旨诚有难以遽通者。","Z":"涣兼二义：一则离散，一则治散济散。唯其能治能济，故卦辞系以“涣亨”。所以能治能济者何？在于“刚来而不穷，柔得位乎外而上同”。刚来，九二是也，其德刚阳而位乎下体之中，故不穷。柔得位乎外，六四是也：爻阴而位亦阴，又处外体，位无不当，故许以得位。上同，则言四之巽顺于五也。此义最要：五既居中，四复上而同之，是同乎中矣。当涣之时，二与四同德相亲，各守其中，治之济之，绰有余裕，此亨之所由致。\n六爻之义，大率与卦义相准。独初六不言涣，而曰“用拯马壮吉”，盖其居卦之初，散形未著，及此图之，是以早觉而早救也。自二以下，皆以涣冠首，则散已成，所论不在拯之始，而在治与济。九二“涣奔其机悔亡”，去危就安之谓；六三“涣其躬无悔”，则又进于二，不待外奔而先解一己之散；六四“涣其群元吉”与九五“涣汗其大号，涣王居无咎”，君臣相须，共治天下之散者也；上九“涣其血，去逖出，无咎”，出乎散而远于害者也。合而计之，初、二、上主于拯与出，三、四、五主于治与济，无一不与卦义相贯。"}},"60":{"id":"60","cnNum":"六〇","name":"节","pinyin":"jié","fullName":"水泽节","shortFullName":"水泽节","upper":"坎","lower":"兑","upperNature":"水","lowerNature":"泽","lines":[1,1,0,0,1,0],"yaoLabels":["初九","九二","六三","六四","九五","上六"],"blocks":{"P":"《序卦传》以涣为离散，而谓散者不可终散，故节卦承之。此语最耐寻味：聚极则散，散极而无所收摄，则人各逐其意而无归，势不得不复求检束。名义既立，当问节之所止者何止。《杂卦传》以“止”训节，又以“止”训艮，字同而趣别。孔颖达称节为“制度之名”，朱熹谓“有限而止”，二说相足：节者，为物立限，至分而止，非欲其全然不动也。艮之止则别有在：可动则动，不可动则静，终以不动为归；其所答者为行为之抉择——何事当行，固宜先知，何事当止，尤宜先决。节之止所答者，乃行为之节度：虽当行之事，亦不尽意做去，须有所留，过则失之。卦名之取，以二体观之尤明：兑泽在下，坎水在上，泽既纳水，水复增益，泽之受有涯，满则不受，节象于是乎在。","G":"节，亨，苦节不可贞。","G.N":"卦辞两层并列：先言“节亨”，后言“苦节不可贞”。其义可分层看。所为之事本不当为，则直截不为而已，无节可言。惟事属当为，才有所谓节。虽属当为，而用力未足，尚在欠缺一边，亦无节可言。必也所行皆当为之事，行之又已尽分，却复能自加裁抑，不令溢出于分外，此乃谓之节。到此地位，亨自不待言。然古今之败，未必败于不能节，往往败于节之太过；节之一事，自身亦须节之。凡节易过，过则与不节同归。过中之节即苦节，而苦节不可贞——贞者，久也。苦节者，以苦自持，人不能堪，己亦难继。使强而持久，非但不亨，祸且由此而生。","T":"彖曰：节亨，刚柔分而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财，不害民。","T.N":"彖辞“节亨，刚柔分而刚得中”，以卦变立说者也。节之变，视贲为近而适相反：贲之变，柔来而饰刚、刚上而饰柔；节则反是：柔自外来，所以损夫刚；刚升而上，所以损夫柔。贲病在刚柔各守其质，朴而无华，故以文救之；节病在刚柔并过其盛，漫而无检，故以制裁之。所异者尤在变之所成：贲成于柔得中，节成于刚得中。节以中为贵，刚既得中，亨之所由致也。“苦节不可贞，其道穷也”。亨与穷对举：守中则亨，一越乎中，即为苦节。节而越度，超出中道之外者，是名为苦。过与不及，为害均耳，故其害与无节等。所以不能久者，正以道穷；穷则必变，变则通。苦节本无出路，终须一变：或去其苦而还于中，或竟溃败而止。“说以行险，当位以节，中正以通”。前三句就卦体言，后二句则专属九五。卦以兑下坎上成体，兑说坎险，故有是说。险者，为节言也——节必有所阻，不能尽通；说者，为亨言也——节而人以为说，则其节安徐自然，行乎其所不得不行。既说且险，则所行者非苦节，亨固宜也。至“当位以节，中正以通”，又即九五之身反复明之：当位者，指其势：五处至尊之地，天下国家皆在其手，节之权有所归。中正者，指其德：阳爻阳位，处中履正，天下之心志由是而可通。统全卦而言，其象为说以行险；单举一爻而言，则尊位中正之美备于五。两端所指，皆见其节可说而不苦、可通而不穷，卦辞之亨于是乎在。“天地节而四时成，节以制度，不伤财，不害民”。此下是孔子释毕卦辞后的推衍。其意为：节不独存于人世，亦行于阴阳；天地人三者同此一理，而人世之节即取则于天地。天地之节云者，刚柔交相裁制之谓：刚裁柔，柔亦裁刚，而寒暑迭代由此而立。刚之节柔何如？冬威不可以终岁，春至而截之，使其不得复进，是也。柔之节刚何如？夏炎不可以终岁，秋至而截之，使其不得复进，亦是也。设天地而无所裁抑，则一岁之中唯有大冬大夏，四时之序无从生出。此处曰“天地节而四时成”，革卦彖辞则曰“天地革而四时成”，一字之异，旨趣各别：节主限止，革主改易。后季限止前季而使不得纵，是节；后季革去前季而代之，是革。成岁之功虽同，其所以成则不同也。古人以为天人之理一贯：自然有某规律，人世即有某规律；人世之则可在自然取证，自然之效亦在人世可见。故天有“天地节而四时成”，人即有“节以制度，不伤财，不害民”。此三句所论，实为国家财用出入之事：量入以为出，用财有所止；其止之术，则在立为制度，使费皆有准。无制则侈，侈则伤财；财伤则赋敛加，赋敛加则民病。财既耗，则民亦困，二者事同一体，故孔子有取于“节用而爱人”之训。","X":"象曰：泽上有水，节。君子以制数度，议德行。","X.N":"泽者，聚水之陂也，四围必筑堤防以束之，水乃不得横流。泽所受有量，量尽则溢；有量即有限，有限即节。泽上有水而水不越其涯，卦所以名节。君子观此，取泽之有限以立人事之则，于是制数度、议德行焉。数者，一十百千万之等；度者，分寸尺丈引之差。制数度者，视爵位之高下为等差，凡宫室、冠服、车旗、器用，其大小众寡皆有定式，礼之隆杀由是而立。德蕴于中，行著于外；议德行，则察其所存所发，果能合于礼、止于度否，然后授之以任，使处之各安其分。","Y1.T":"初九，不出户庭，无咎。","Y1.N":"户庭者，户外之庭也。不出户庭，谓闭户自守：足不及门，人不及接，事不及营，言语举动一概加谨。如此，宜其无咎。初九何以能谨密至此？盖其质阳刚而在下位，居又得正；当节之初，正当收敛之时，而初九恰是知节而能止者，时与德相值，故守而不出，咎自无由而生。","Y1.X":"象曰：不出户庭，知通塞也。","Y1.XN":"节之所用，唯在通塞之间。通而无节则溃，塞而无节则死，故辨通塞者，节之能事也。何谓辨？当通则通，当塞则塞，不执一以废时。初九处节之初，时方宜塞；塞而居家不出，是能塞矣。独言知塞，而彖系以“知通塞”，其故安在？盖节之时，通塞无常形，因位而殊。能于塞时见塞，即能于通时见通——两端本相待而立。犹俗语所谓知冷暖、知轻重，言其一而两在焉。","Y2.T":"九二，不出门庭，凶。","Y2.N":"泽初受水，其水未多，所患者渗漏耳，故急在筑塞堤防，勿令外泄——此亦节也，初九当之，是以不出户庭。及水日增而几于盈，则宜开窦决之，使余水有所去——此又节也，九二所当之者也。乃九二不察盈虚之变，犹循初九之旧，闭门不出，则失其节矣。当通而塞，凶之所由致也。","Y2.X":"象曰：不出门庭凶，失时极也。","Y2.XN":"就事理言，水初至而泽腹未盈，宜闭不宜启，初九之守，所以无咎；水已至而将溢，宜启不宜闭，九二仍守，所以取凶。就爻象言，初九以刚处下，时非可为；九二以刚得中，时正可为。可为而不为，凶固其所。推原其故，九二非昧于事，失在候耳——时已过而犹执前辙，过之极也。","Y3.T":"六三，不节若，则嗟若，无咎。","Y3.N":"自卦未成时观之，六三居下体，固以柔裁刚者也；自爻既立后观之，则过中而不正，下乘二阳，上临坎险，其为不知节也明矣。然柔顺而说，本无坚愎之性，故虽失节而能嗟叹自伤。夫《易》者，教人补过之书；既悔矣，尚何咎之可言。","Y3.X":"象曰：不节之嗟，又谁咎也。","Y3.XN":"节已失矣，然能自识其失而嗟伤，悔萌于心，则咎无所归。","Y4.T":"六四，安节，亨。","Y4.N":"六四与六三，同居泽水之交而节否顿异。三也，阴据阳位，位既不当，又居兑泽之终，泽量已满而犹受之，故溢焉而失节。四也，阴居阴位，位与德相配，上承九五中正之君，动必循其轨，是谓安节；安节者，亨之由也。所谓安，非勉强操持之谓：成法具在，执尺度以自律，率由之而已。更以象求之：四居上体坎下，是水之就下者。水溢则节亡，水流则节存。柔顺而位正，又似水行平地，波恬不惊，既有节，且安焉。","Y4.X":"象曰：安节之亨，承上道也。","Y4.XN":"四之得亨，非止一故；其最要者，法乎上而已——九五刚中之德，即四所取以为节之绳墨也。","Y5.T":"九五，甘节，吉。往有尚。","Y5.N":"九五以刚居刚，得中而处尊，一卦之主也。彖辞“当位以节，中正以通”，舍此爻无与属。其节为甘节。甘居五味之中，故能和众味；所谓和，取咸苦酸辛之偏者而剂之，令归两平。甘节云者，节之不丰不啬、适得其分者也。与安节较，二者有辨：安节施于一身，己安而止，他人不必与安；甘节则九五履中处正，以之节天下国家，行于己而亦达于人，举天下尊卑上下皆以为安，不见其苦，吉所由得。此节一行，所被者远，所成者大，故又许其“往有尚”。","Y5.X":"象曰：甘节之吉，居位中也。","Y5.XN":"节以中为贵。九五之获吉，正缘其位处乎中，裁物有度，不偏不倚。","Y6.T":"上六，苦节，贞凶，悔亡。","Y6.N":"上六在节之终，过中已甚。节而过中，人之所不堪，故其节为苦。身在上体之末，险难至是而极，苦味亦由此添一层。苦节不可以贞守，非可久之道也；若执而不舍，久久行之，凶必及焉。使上六翻然知悔，去其已甚而就中道，不复以苦自缚，则凶可解。爻辞“悔亡”，与它卦之“悔亡”字面同，而立辞之意则异，当分别观之。","Y6.X":"象曰：苦节贞凶，其道穷也。","Y6.XN":"甘节属五，卦辞之“节亨”，即于此爻见之；苦节属上，“苦节不可贞”之戒，亦于此爻见之。苦而固守则凶，故戒其贞。节道至上六，势已穷尽，无可复进。","Z":"节者，于事物之运动变化而为之限，使不过其则也。天有天之节，故四时代嬗而不穷；人有人之节，其情伪虽繁，而理则一耳。人之自限其行，形之于法度为制度，是即人世之节也。以卦体分观：下体属兑，泽以止为德——初、二之不出，取泽之受而能蓄；三之溢，取泽之满而不能容。上体属坎，水以流为用——四之安、五之甘，皆于流行中见节；至上六则流尽源竭，苦象生焉。下体取义于泽，泽有受有泄，故其难在通塞；上体取义于水，水有甘有苦，故其辨在甘苦。然通塞甘苦之判，总归于一“中”。节之道，得中则善，失中则否：九五得中而为甘节，卦辞所以言“节亨”；上六过中而为苦节，卦辞所以言“苦节不可贞”。彖传又称“当位以节”，可见六爻之善否，系于位之当否。初九当位，守而止，无咎；九二不当位，宜行而固守，则凶——两爻同辞而吉凶迥别，所争只在位与时。六四以柔居柔，得正而为安节；六三以柔居刚，不正而为不节——两爻相邻而安危异趣，其故亦在当否之间。"}},"61":{"id":"61","cnNum":"六一","name":"中孚","pinyin":"zhōng fú","fullName":"风泽中孚","shortFullName":"风泽中孚","upper":"巽","lower":"兑","upperNature":"风","lowerNature":"泽","lines":[1,1,0,0,1,1],"yaoLabels":["初九","九二","六三","六四","九五","上九"],"blocks":{"P":"中孚之次乎节，有序卦之说在。其辞曰“节而信之”，盖谓法度既设，患在不行；行与不行，系乎人之信否。上守其令而下信从之，节之效始著，此节而信之之实也。故节之后，受以中孚。\n中孚者何？信蓄于中之谓也。其为象，泽上有风：泽本止水，风掠而波兴，感无迹而应无心，至诚动物者似之。以体言，兑下巽上。析而观，二与五皆刚而处中，实也；合而观，四阳居外而二阴藏内，虚也。虚以受之，实以充之，二者相须而信乃成。故就其质言则取乎实，就其本言则取乎虚。合而观之，实者环于外，虚者居其中，中孚之所以得名，其状盖如此。","G":"中孚，豚鱼吉，利涉大川，利贞。","G.N":"“中孚豚鱼吉”五字当连读。卦名与卦辞相接成义，《易》中自有此例：同人之于野、履之虎尾、艮之其背，皆名辞相属而不可断。信之涵于中者，谓之中孚。豚鱼蠢然无知，感之最难；最难者尚且见感，则天下更无不可感之物，其吉可知。持此至诚以履艰危，则大川可涉，险阻无足挠之。然信有辨焉：出于正者为君子之孚，出于偏者为小人之孚，故又继之以利贞。","T":"彖曰：中孚，柔在内而刚得中，说而巽，孚乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。","T.N":"彖传释中孚，先举二事：柔在内，刚得中。此二者缺一，则中孚不成。盖信之发于中者，其体有两面：一面须虚，虚则能受；一面须实，实则能立。中孚之画，兑下巽上，于此两面皆无所欠。所谓实者，上下二体之刚各据其中，不偏不倚是也。所谓虚者，六爻之中四阳绕外、二阴藏内，其中枵然是也。\n此二事落到人身上，其失均足以害信。胸中先自壅塞，则外物牵之，牵之而信不立，此虚之不可无也。胸中空然无一主张，则随物而转，转则信不存，此实之不可无也。\n次举“说而巽”。上体巽，是以至诚下顺于下；下体说，是以有孚上说于上。上下相说相顺，则一卦之诚不独在一人，教化所被者广，故曰孚乃化邦。\n“豚鱼吉，信及豚鱼也”，申上句之义也。豚鱼至蠢，本难感格；而中孚之诚能及之，则其所及者无所不至。涉川之利，取譬于乘木舟虚：以诚履险，其便如乘舟以济，其安如虚舟之无倾覆。\n末言应乎天。天之道公而无私，信而能正者似之。苟中有其诚而所信不正，则诚愈笃而失愈甚，此利贞之所以继于豚鱼之后也。","X":"象曰：泽上有风，中孚。君子以议狱缓死。","X.N":"泽为止水，静而不波；风起而过之，水不觉而动。静者感之端，虚者通之机；风以无形入，水以无心受，此至诚无不通贯之象，中孚所由名也。\n君子得此象而施于刑政，则有二事：曰议狱，曰缓死。议狱者，谳决之前，与众共推之，凡情有可疑、证有不足者，皆令呈露，务于死法中开一生路。缓死者，罪已当死，处决犹缓，于无可解免之中反复搜求其可免。刑定于议，命延于缓，为之主者竭其忠款而无愧，罹其法者亦甘心而无怨。","Y1.T":"初九，虞吉，有它不燕。","Y1.N":"虞、燕二字，注家并训为安。中孚之取义也，全卦之诚聚而为一，不分布于爻位之间，是以六爻皆不言外应；其所尚者，惟在能斩断牵系之一端。何也？孚既在中，则不必取足于外，亦无可求于外；求之于外，其中先虚矣。是以诸爻无应则吉，有应则凶。\n初九之于六四，位本相应，以常例推之当凶。然初九居下而能自安，守其分而不他求，其孚自足，故反得吉。此吉非幸致，正由绝外系而安于下，故爻辞系之曰虞吉。若一念忽动，改其志而求合乎六四，则中失其守，安者去矣，故又曰有它不燕。要之，能虞则安，不能虞则不安，其分止此。","Y1.X":"象曰：初九虞吉，志未变也。","Y1.XN":"初九居一卦之始，所恃者惟在己，自信自守而自安，孚不待外求而在其中。象所谓未变，正指此志未尝摇动、不生他求而言，是以得虞吉。","Y2.T":"九二，鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。","Y2.N":"九二以刚居柔而处下体之中，中孚之实德在焉。凡诚之积于中者，必求通于外，而所通者恒在其同类；故九二之至诚，与同气者相感为最易。\n然其位在六三、六四两阴之下，幽暗掩蔽，其迹不彰，人鲜有知之者。德既实于中，行又不失于信，则虽山川阻隔，同类之远者亦能闻其风声而应之，此爻辞所以取鸣鹤之象也。鹤鸣于幽隐，而雏鹤应之于外；我有旨酒好爵，则与尔共之而不独享。\n辞中名物，各有专属。所鸣者九二也，处二阴之下，爻辞谓之在阴；所和者初九也，初爻之称子称童，乃《易》之恒例。爵谓爵禄，吾为九二自道，尔则指初九，靡者散之之义。好爵不私而分之于人，亦至诚相与之一节。\n孔子于系辞尝推其义：言由己出而及于民，行起于近而见于远。言之善者，虽在千里而人应之；其不善者，虽在千里而人违之。言行者，君子之枢机，荣辱由之而立，天地亦由之而动，可不慎欤。\n孔子所重者在慎言行，与爻辞似落一头，实未尝异。爻辞之意，盖谓诚之至者感人自深，人皆乐就之，初无要结之术。夫诚之发为言行者必善者也；苟恶矣，则已非诚，又何感人之有？","Y2.X":"象曰：其子和之，中心愿也。","Y2.XN":"鹤之鸣，自中而出，初非有求于和；雏之应，亦自中而出，初非有求于鸣。一鸣一和，皆天机之自动，而各出于中心之所愿，非相邀而然也。","Y3.T":"六三，得敌，或鼓或罢，或泣或歌。","Y3.N":"就一卦之体言，中虚之所以成，六三与六四实为之，二者于成卦不为无功。然分观诸爻，则得失判然：六四以阴居阴，位既得正，又逼近于君，上承九五而下不系于初，其守固。六三则阴柔而不中不正，又应于上九。中孚之世，所贵在无应无系；今六三既有正应，是其心摇于外而系于物，自信之力先亡。居中孚之时而独无中孚之实，故爻辞系之以得敌。敌者，匹也，配也。\n人当自持自立之时，而事事倚于匹配，则动静皆不能自主。人以鼓来，我亦鼓；人不鼓，我亦罢。人以泣至，我亦泣；彼转而歌，我亦歌。作止无恒，哀乐无定，一惟外物是视，曾不能坦然自安于中，其视初九之虞吉，相去远矣。","Y3.X":"象曰：或鼓或罢，位不当也。","Y3.XN":"六三之病，根在所处之位：以阴柔之质而居阳刚之位，位不当也。位不当则中无所主，中无所主则行止一听于外，鼓罢泣歌之所以纷然而无定，皆自此出。","Y4.T":"六四，月几望，马匹亡，无咎。","Y4.N":"月几望者，月垂满而未满之称。马匹者，谓初九，六四之配也。马匹亡与六三之得敌，其义适相反对。\n六四之位，阴爻而阴位也，正矣；其地密迩人主，故取月几望为象。此象不系于时，而系于位：近君见信，势分隆重，如月垂满而尚留余地。留余地则可久；若进而不已，至于与九五相亢，则望矣。望者不久即亏，祸败随之，圣人以几望为节，意正在此。\n马匹亡云者，断初九之系而归于九五也。夫四之于五，比近而相亲；其于初，位应而相与。两皆可取，而中孚之世只容一孚；两孚则二，二则非孚矣。六四择所从，舍初九而归于九五，是谓马匹亡。\n得敌者，六三之系于上九也；马匹亡者，六四之绝于初九也。一名一实，而吉凶分焉。六四之绝初九，非任意而然。《易》之取六四应初九者，皆以其上不遇九五耳；使其上果有九五，则所重者在从尊，初九之应自当置诸不问。","Y4.X":"象曰：马匹亡，绝类上也。","Y4.XN":"类者，应也。所谓绝类上者，舍初九之应而事九五也。六三系念上九，得敌者也；六四断念初九，马匹亡者也。得敌为累，匹亡为脱，其得失正相反。所以然者，位有当否而已：六四当位，六三不当位。又按易之通例，四之承五者吉多，三之应上者凶多，不独此卦为然。","Y5.T":"九五，有孚挛如，无咎。","Y5.N":"挛者，系而不可解也。彖传所云孚乃化邦者，即就此爻言之。九五以刚健之资，履中得正而据尊位，外无应与之牵，君之孚于是乎在。\n顾君之孚与臣民异。在下者，内足于己而不涉外，即可谓之孚。人君则必合天下为一心：取四海之人心，以诚结之，使其胶固而不可析，斯无咎。若徒自守其一身之信，而于四海无所系属，君道则有所亏。","Y5.X":"象曰：有孚挛如，位正当也。","Y5.XN":"九五之感通四海，使之合而为一，胶结如挛拘者，其故安在？曰：在所处之位至正耳。阳爻居阳位，处上体之中而当尊，其位既正，故其孚能如是。","Y6.T":"上九，翰音登于天，贞凶。","Y6.N":"上九居卦之外、处爻之上，中孚之道至是已尽。有其名而无其实，故取翰音登天之象。翰者，高飞之意；翰音者，声之高飞而直达于天者也，声闻甚高而实不称之谓。\n上九所乏者，纯诚之心与笃实之行；所尚者，虚名与矫饰。以虚声动天下，天下必不与之，其人终亦无所建立。守此而不变，凶固宜矣。\n此爻与九二适成对照。九二鸣鹤在阴而其子和之，上九翰音登天而人不之应。盖九二之孚藏于内，故愈隐而愈应；上九之孚饰于外，欲以高飞自见、以长鸣取信，而人乃愈鄙之，此其所以无和也。","Y6.X":"象曰：翰音登于天，何可长也。","Y6.XN":"声闻过情者，虽暂赫然，岂能久乎？于此有两条：改辙而归于诚，以信实自本，则犹可全；执而不变，则终于凶而已。","Z":"中孚之旨，一语可尽：诚生于内，内有所主而不外逐。主立于此，则虽豚鱼之顽，亦且感而信之，人之从之也宜矣。\n爻义与卦义，脉络相贯。卦重内实而贱外求，故六爻之吉凶，以有应无应为断：有应者凶，无应者吉。初九之于六四，位本正应，而卦不取应。初九之孚足以自给，不藉外助，有应而不求，故曰虞吉，又曰有它不燕。六四反是：其配在初九，乃舍之而从九五，故曰月几望，马匹亡。\n六爻之中，九二、九五为最。九二之质刚而所居则柔，位适得中，又伏处二阴之下，晦静自守，举无所求于世。盖求物者物不至，无求者物自归，爻辞之取于鹤鸣子和，正为此也。九二无系应，九五亦无系应，而所被有广狭：九二之实德止于一身，未及于人；九五刚健而中正，据尊位而无应与之累，有孚挛如，其德所被者非一人，四海之命皆系焉。君天下者，其德以系四海之心为实，故取中心之诚以为胶漆，使天下与我者结而不能解，斯为君道之极。\n其最下者，则六三、上九是已。六三不中而又不正，鼓罢泣歌皆不由己，动息忧乐尽系于所信之人，是谓得敌——得敌云者，有应于上九之谓。上九又下焉：处外居上，无纯诚笃实之心，徒务虚声，专以矫饰为事，声名与实绩两不相酬，所谓中孚者，至是已不复存。"}},"62":{"id":"62","cnNum":"六二","name":"小过","pinyin":"xiǎo guò","fullName":"雷山小过","shortFullName":"雷山小过","upper":"震","lower":"艮","upperNature":"雷","lowerNature":"山","lines":[0,0,1,1,0,0],"yaoLabels":["初六","六二","九三","九四","六五","上六"],"blocks":{"P":"《序卦传》次小过于中孚之后，其意若曰：信蓄于中者必发于行，行既著则不能无过，故受之以小过。所谓小过，小者过也——所越者在日用细故，所越之分量又微，故二义兼焉：一曰小事过，一曰过之小。卦名所自出，其一取象于山上有雷：雷本动，限之以山，止而后发，声出寻常而不至暴厉，过之小者也。其一就阴阳立义：卦中阴之数四，阳之数二，柔党众而刚数寡，此亦小者过之验也。","G":"小过，亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。","G.N":"所谓过，非越礼败度之谓，乃越出常度而挽之于正，如矫曲者必先过其直。小过之所过者小，所越止于细行，非关天下国家之图；凡饮食起居、进退酬酢之常，皆其地也。君子之行固以得中为贵，然中无常形，有时非稍越一分则不能返于中；所过者正为求中，故当其时而过，亨道在焉。“亨”者，小事得遂之亨；“利贞”者，所过皆归于正之谓。此卦之贞与他卦不同：他卦言贞，取义宽泛，凡不出于邪者皆可附丽；小过之贞则确有所指，即下文“可小事不可大事”与“不宜上宜下”两端是也。处小过之世，可越者唯细故，大纲大纪断不可越；所过宁小而勿大，宁少而勿甚。合于此则正，违于此则不正。“飞鸟遗之音”，言其去人未远，过而不至于邈绝；“不宜上宜下”，言所趋之势当降抑而勿高扬。同为小过，趋上则凶，趋下则吉。以礼为喻：仪节而流于侈、流于慢，是向上也，凶；流于谨、流于啬，是向下也，吉。","T":"彖曰：小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也。","T.N":"“小者过而亨也”：阳之谓大，阴之谓小，此卦阴四而阳二，所过者在阴不在阳，故云小者过。天下事常失于偏，矫之使返于中，其势不能不较常理略有所越；略有所越，偏乃可返。矫枉者必过正，过而反中，用乃不穷，故亨。盖中非径情可至，必以过为阶。\n“过以利贞，与时行也”：《易》贵得中，过本非美。既过则失中，失中即不得为正。卦辞乃系以利贞，其故安在？在“与时行”。处此世者，因时为度，所当越者越之，则越之名可以不立，越之实恰是中道。若时固当越，而执守故常、断然不越，则其失也，反在于不正。\n“柔得中”以下数语，以卦才立论。所谓柔得中，指二、五两爻皆阴而处中也。此德可以任细务，不足以肩巨任。柔顺者堪役使，得中则无偏倚，故小事吉；大事非刚阳莫济。此卦刚阳在三与四，既失位又不居中：失位则才无所施，不中则刚而太过。譬如刚健者本能任重，惜其位不称、德不和，故不可大事。\n“有飞鸟之象焉”以下：此句文体不类孔子彖辞，疑后人解语羼入。飞鸟遗音，喻过之不远；不宜上宜下，指所过之方向。卦辞标其宜下，彖传申其故，归之于逆顺。其趋上也逆，其趋下也顺；逆者取凶，顺者获吉。总之，所过宜顺而不宜逆，宜下而不宜上，宜柔而不宜刚。此三语者，实一卦之枢要。","X":"象曰：山上有雷，小过。君子以行过乎恭，丧过乎哀，用过乎俭。","X.N":"山静而高，雷动而威；雷行于山上，动而即止，故其威不烈。卦之取象，盖如此也。人值此时，一无所矫则事不立，矫之过甚则理有乖，唯小有所越而已。君子体之而施于实事：行过乎恭、丧过乎哀、用过乎俭。凡物皆有定则，不及与过皆失其所以为物。然亦有可以过者：行礼而过谨，礼未亡也；执丧而过戚，丧未亡也；用财而过啬，用未亡也——此数者过之而无伤。其过也，向下而非向上，即卦辞“不宜上宜下”之指。若移而向上，则行流于慢，丧流于易，用流于奢，是“宜上”矣；小过本不宜上，强而行之，凶必随之。","Y1.T":"初六，飞鸟以凶。","Y1.N":"此卦之画，三、四为阳，初、二、五、上为阴。二阳居内，四阴处外，而初与上又处四阴之表，皆阴之过而不获中者，凶所由也。就全卦取象，若合为一体之鸟，则初、上适当两翼之末，其分不当奋飞。初六之位，处艮之下，正是敛翼安栖之时；乃其不能自制，忽然而举，此凶之所以归也。","Y1.X":"象曰：飞鸟以凶，不可如何也。","Y1.XN":"鸟既飞矣，一去而不复还，旁者无从挽之，初六自身亦失其主宰。其凶盖一定而不可解。","Y2.T":"六二，过其祖，遇其妣，不及其君，遇其臣，无咎。","Y2.N":"六二体柔而居下，中正兼备，为小过六爻之最善者。其行也，宜越则越之，宜止则止之，铢两称量而中自在其中；故虽越而未见其越，虽歉而未见其歉。“过其祖，遇其妣”，谓六二之于六五也。遇犹当也。祖指九四，妣指六五。二越四而与五相当，形似逾越，实则不为逾越：二与五同属阴，可比祖姑与孙妇。古者孙妇祔食于祖姑，与之同列，礼固然也，此所谓当过而不为过。“不及其君，遇其臣”，谓六五之于六二也。六二不敢上比其君，而六五转能下与之为偶。二之守柔而不上侵，正见其处下之节；虽未及君，未可责其歉也。合其德而观：越祖而配妣，未见其僭；遇臣而不攀君，未见其阙。迹若有过有不及，实则时宜分量各得其当，是以无咎。","Y2.X":"象曰：不及其君，臣不可过也。","Y2.XN":"小过之世，凡事之小者皆可稍过，独臣之于君无过理。作《易》者于名分之际，盖未尝假借。","Y3.T":"九三，弗过防之，从或戕之，凶。","Y3.N":"九三值时之阴过阳失位，己则以阳居阳而得其正，故为群阴所忌，处境最艰。然则小过之时，九三所当过者何事？曰：唯过为之防，使小人无所施其害而已。而其自身先有一病：刚而又刚，失之太锐。太锐则轻蔑小人，以为不足虑，防遂不设。故欲防小人，必先防己之过刚。惜乎九三势不能然，终将恃其强而疏于周防，鄙夷小节而不屑谨密，卒为所戕，凶所不免。","Y3.X":"象曰：从或戕之，凶如何也。","Y3.XN":"“凶如何”者，言其凶之至甚也。阴盛则阳受其害，小人得势则君子受其害，理之常也。九三不豫防而见戕于小人，祸莫酷于此，故曰凶如何。","Y4.T":"九四，无咎。弗过遇之，往厉必戒，勿用永贞。","Y4.N":"阴过之世，三与四皆刚之失位而不中者，而吉凶判然。三之体纯乎刚，刚上加刚，是以凶。四则刚画而居柔位，刚不至于过，是以得免于咎。“弗过遇之”，正谓其不肯逞刚，所以能因时俯仰、与物相得。然本质终属阳刚，故又当常存戒心：不可妄有所往，不可舍柔而径以刚进，进则有危。“勿用永贞”，则谓阴阳倒置之秋，小人必不肯附阳，九四唯当随顺时势，未可执守其常。","Y4.X":"象曰：弗过遇之，位不当也。往厉必戒，终不可长也。","Y4.XN":"九居四位，位非其当，唯其不当，是以不至于过刚。亦唯不至于过刚，故能“弗过遇之”——二者相因。若不循是而有所往、有所进，危厉立至，九四所宜深戒。安可久处而不思变乎？","Y5.T":"六五，密云不雨，自我西郊，公弋取彼在穴。","Y5.N":"六五之旨，在断其不能有为；即令强欲有为，亦终无成。“密云不雨，自我西郊”：云气四合，雨象已成而竟不降，以风从西起，西风主晴而不主雨也。小过之义，宜下不宜上；六五居上体之中，又处尊位，正是上而未能下者。当此之时，不宜有作，寂静犹可，一有作为则败。“公弋取彼在穴”：公者六五自谓，彼者谓六二。弋之为言，射而兼取。六二处艮之中，上为两阳所蔽，其状如禽鸟伏于坎穴，翼未举也；未举而伏，恰合宜下之指，故六五欲取得之以为己助。然其事必不成——二与五敌应，不为我用。西风自远而至，泽终不下；禽伏于穴，弋者空归。","Y5.X":"象曰：密云不雨，已上也。","Y5.XN":"六五者，阴之数已逾于阳，而反踞其上，两气不相谐协，雨是以不成。","Y6.T":"上六，弗遇过之，飞鸟离之，凶，是谓灾眚。","Y6.N":"上六之过，小人以柔佞而越其分者也。居震之上，其势已高，愈进而不知返，遂陷于亢。亢则无与相遇。终且自投于罗罟，凶莫能免。灾眚云者，眚因灾起，而灾实自招。","Y6.X":"象曰：弗遇过之，已亢也。","Y6.XN":"六五小象称“已上”，见其过犹未极；此称“已亢”，则过而已甚，更无可复过之地。","Z":"先辨名义：阳称大，阴称小，此《易》家之恒辞。卦中阳四而阴二者，以二阴包四阳，大过是也；阴四而阳二者，以四阴包二阳，小过是也。取譬于物，大过如栋之将桡，小过如禽之奋飞。其为义也，主于小、主于下：事而过于大，或所过者大；势而居于上，或志欲向上——皆非所宜。故其系辞曰：小事可为，大事不可为；势宜下达，不宜上腾；盖上者逆而下者顺也。然亦有矫拂之功焉：欲得中者，有时必过乎中；欲矫枉者，有时必过乎正。此特可行于细故，不可施于纲纪；即细故之过，亦自有涯分，未容其甚。过之势又只可趋下，不可趋上。卦义与六爻相为表里，而反显其义者，莫著于初、上两爻。初六居一卦之底，时未至乎过，位又在最下，如鸟之栖宿，本自无患；乃其志欲上腾，不能自制而飞，凶遂随之。上六则柔佞之徒，身处过之极端；进而不已，漫不知返。禽鸟高举而无枝可栖，欲有所遇而终不可得，其势自投于网罟。凶之至此，已非寻常之咎，求其所以，唯灾眚二字足以尽之。六二、六五同以阴柔得中，而所获不同。二之德既中且正，位又居下体，与宜下之旨相契，故其越与不越皆应其时、称其分而恰得其中，六爻之中此为最善。五亦得中，顾所处则尊也；尊位在他卦为美，于小过则否。以其在上体，阴数至五而过大甚，有乖于宜下之义，是以有密云不雨之象，非不欲为，势不能为也。三、四两阳俱不居中，为众阴所窥伺，其所亟者，豫为之防耳。防必过防：周于外、早于几、谨小慎微而不敢忽。九三纯刚自恃，不肯先事而备，故凶。九四刚而居柔，未至于过刚，又在上体之下，是以无咎；但能随顺时势、安静不摇，则亦无患。要而论之，小过之亨有二端：一则可小事而不可大事，二则宜下而不宜上。六爻之中，合此二端者无咎，违之者凶。卦辞许以“大吉”，而爻辞无一条言吉，则以无咎为至。可见小过之义，虚而推之固亨且大吉，实而施之，则处置之难如此。"}},"63":{"id":"63","cnNum":"六三","name":"既济","pinyin":"jì jì","fullName":"水火既济","shortFullName":"水火既济","upper":"坎","lower":"离","upperNature":"水","lowerNature":"火","lines":[1,0,1,0,1,0],"yaoLabels":["初九","六二","九三","六四","九五","上六"],"blocks":{"P":"六十四卦之末，既济、未济二卦相次。以《序卦传》之说，小过之后所以继以既济者，因“有过物者必济”也。此解殊为牵强：过者越也，济者成也，二义本不相蒙，取以相衔，辞费而理不顺。独其说未济也，曰“物不可穷”，而终之以未济，则可谓卓然有见——六十四卦排列之总意，尽在其中矣。\n是二卦之位置，非苟然者。既济之承小过，本无必然之理；假令倒数第三另是一卦，倒数第二之必为既济，犹可前定。盖作者于全序自有全局：六十四卦者，万事万物之一大进程也。乾坤启其端，中六十卦畅其流，既济、未济则其收束处。乾坤所以居首、乾所以先坤，前论已详，兹不复陈。中六十卦两两相耦，耦各有反有对，如环无端，衔续而成此长程。两卦相耦者，或反其体，或覆其画，前后相承，义亦相足；合而观之，则一治一乱、一盛一衰之迹具焉。\n程既有始，则必有终，此倒数第二所以为既济也。既济之象，争息而乾坤毁、物类尽。顾天下之势，未尝有一息之停；乾坤未尝一日而毁，万物未尝一日而尽。其云息、云毁、云尽者，止是旧程告毕、新程方启之谓。故既济之后不容不有未济：争未息、乾坤未毁、物未尽，旧者既终，新者复始。二卦之殿全经，其义与乾坤之冠全经等重，作者胸中“物不可穷”之辩理，藉此而显。凡此皆非偶然之笔，实其观物之通识。《易》之作，不徒纪已然，正以示将然，故终之以未济。读《易》者观其首尾，全书之旨亦略可睹矣。\n卦名之义，古有二说。或主出险济难，或主万物已成已济。先辨其字。既者，事已之词；济者，《尔雅》以渡为训。两字相属，谓其已渡。所渡自非沟浍，必大川焉；引而伸之，遂为脱险解难之称。由体求之：上体为坎，最易诱人作此解，盖上体坎之卦，若屯、若需、若蹇、若节，类多险象。然既济不尽于此，其义较脱险济难为深、为广、为抽象。《杂卦传》以“定”字蔽之，初见似疏，沉思乃知其确。定者何？物进至一境，凝然而成形，暂焉、貌焉不复动摇，斯为定矣。非死寂之谓，亦非终绝之谓，特形态既具、变化不显于外耳。既济而谓之定，则物已造其极可知；《序卦传》于未济所以发“物不可穷”之叹者，正为此也。物既不可穷，则既济之穷，穷于貌而不穷于实。盖定者就一时之形言之，非谓其后之终不复动也。\n六十四卦之中，六爻尽相呼应者八：泰、否、咸、恒、损、益，及既济、未济是也。八者之中，二卦又别。既济六爻无不当位，阴居阴、阳居阳；未济则六爻尽失其位，柔据刚位，刚据柔位。应无不备，位无不正，则抵触尽消、物无余地、万事皆定——既济之所以为既济，其在是乎。此八卦者，皆阴阳交遇之至，故有应；而位之得失，则既、未二卦所由分也。","G":"既济，亨小，利贞，初吉终乱。","G.N":"“小”字盖衍。全经言亨，未有系以“小”者。旅之言小亨、巽之言小亨，其亨本狭，故可云小；既济所亨者大，岂宜蒙以小称？《彖传》曰“既济亨，小者亨也”，玩其辞意，谓不惟道之钜者、德之厚者、位之尊者无所不济，即道之细、德之薄、位之卑者亦与焉；举世之事，无问洪纤，皆底于成，斯之谓既济。设卦辞本有“小”字，孔子何以直举“既济亨”为说？必也断“既济亨”三字为经文，而以“小者亨”为释，然后文从字顺。\n“初吉”云者，既济方开，凡所为者无不利也。“终乱”云者，既济之势不能终吉；及乎其极，穷而必变，变则入于未济。未济六位尽失，于既济为反，自既济观之，是亦乱矣，故曰“初吉终乱”。虽然，象如此，事不必如此。人之居既济，岂必皆底于乱？柄固在人手也。慎终如始，灵明不昧，则终乱之途虽在，犹可挽而归之治。","T":"彖曰：既济亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。","T.N":"彖辞首句，当分两层看：一在“亨”，一在“小者”。亨者，无所不通之谓。既济之世，钜者通，细者亦通，举天下之事而无一隔碍，此其所以为既济也。济之为言，尽也、毕也。苟犹有未通者存，或通于大而滞于小，则名实不相应，未可遽谓之既济。\n次句“利贞”，其故在位。二、四、上以阴居阴，初、三、五以阳居阳，六画各安其分，无一位之或失，正矣；正则守之而安，故系之利贞。\n“初吉”之系于“柔得中”，与他卦异。《易》家恒例，刚中为贵；而既济、未济二卦独取柔中。所以然者，二卦皆以内体为立卦之本：既济之名，成于下体，一入上体，便向未济消息中去，故吉在初者，归美于柔中之六二。柔中者何？六二是已。一卦六位，初、二并属其始。未济之取六五，其理正相反相成：亦以内体为主，行至上体而将反为既济，故亨系于五之柔得中。\n末句“终止则乱，其道穷也”，与卦辞“初吉终乱”相参，而命意有别。卦辞之“终乱”，归重于天，言势之所必至；彖辞之“终止则乱”，归重人事，言其自取。“终乱”之眼在“终”：物之初吉者，终必趋于乱，此通例也。“终止”之眼在“止”：人事居其间，其力甚大——昧于终必乱之理而自画焉，乱斯至矣；明其理而不肯止，乱可免焉。天下之理，不进则退，故人为之系，断不可轻。“终止则乱”非谓终之自能致乱也，谓人之至其终而生止心，乱乃自此而出。以一身言之：燕安无事，志得愿遂，止心萌焉；止心萌则四肢懈、志气惰；懈惰既久，则变故在前而莫之备；莫之备，则乱无所逃。以天下言之：晏安日久，上下苟偷，溺于娱乐而不知返；当此之时，居其位者宜深自震惧，操心如履冰，虑事如对敌，勿令事势至于止极。止极则衰，衰极则乱，道已穷而理必变，非人力所能留也。","X":"象曰：水在火上，既济。君子以思患而豫防之。","X.N":"火在上而水在下，二者皆反其性：润下者居上，炎上者居下。惟其相违，故能相用；相用而功成，既济之象也。然功成之地，患所由生；世非有患，而患每伏其间。君子不忧患之已至，而忧其未形，故以思患豫防为务。人当安阜，辄以为可无忧；以为无忧，则心止而不复进；心止而不复进，则无忧者乃适以为患。所谓思患，非预揣事端，第念终必有患，不敢以宴安自恃；豫防则不待其至，图之于始，使患终不得作。","Y1.T":"初九，曳其轮，濡其尾，无咎。","Y1.N":"初九阳刚处下，上与六四相应，身又在离火之体，其向前之志锐不可当。然当既济之初，所宜者止而不宜者进；进而不已，悔吝随至。难者在于：此爻本性健于趋进，非竭全力不能挽之使住。故必“曳其轮，濡其尾”，然后可以无咎。车将行而自后牵其轮，使不得前，用力之艰可见；狐涉水必高举其尾，今任其沾湿，则终不能渡，用意之决可知。一以力制，一以势阻，皆所以遏其锐进之势也。","Y1.X":"象曰：曳其轮，义无咎也。","Y1.XN":"象辞单举“曳其轮”，乃省文，实兼“濡其尾”言之。其云“义无咎”者，谓曳轮而濡尾，于义为无咎也。义者，道也、理也。就寻常之理而言，阻车之进、湿狐之尾，皆近于失，宜若有咎；然在既济之初九，止进乃其分所当然，故揆之以道，卒归于无咎。","Y2.T":"六二，妇丧其茀，勿逐，七日得。","Y2.N":"彖辞称“柔得中”，所指即六二。此爻阴居阴位，既中且正，与九五之君为正当之应；以理论之，宜得展布。然时为既济，九五已无振作之意，于六二之贤，竟置而不用。既不获用，则皇皇以求济世，何为者？患得患失，日逐于外而不知止，徒自苦耳。莫若抱其中正，静待时之自移；时移则向之所失者，将不求得而自还。爻辞“妇丧其茀，勿逐，七日得”，盖谓此也。\n称“妇”者何？爻柔而位亦柔，纯乎柔者，妇之象也。茀，车茀也。古制，男凭轼而立，女处箱而坐；坐者必以茀障其户，故茀亡则车不行。处此者将求之乎？曰：勿求。既失矣，听其失；不必追，不必索，至七日而自复。七日之说，不独此爻；震之六二，其辞亦同。两处并观，可知古人于复得之期，取七为断。何取于七？日数至十而盈，五者盈之半也；举数不及半，则曰三；逾其半，则曰七。“七日得”云者，谓其复也不出五日之近，亦不入十日之远，非太促，非太缓，终归于得而已。若曰“十日得”，十为盈数，盈则更无所加，是终无得之期也。总之，七者主人事之迟速，非卦气家言。","Y2.X":"象曰：七日得，以中道也。","Y2.XN":"六二今虽不行，终必得行；丧而能复，其本在守。所守者何？中正之道也。道之在天下，未有终废之理，故守之者亦不终困。苟无是道，或有之而不能守，则“七日得”之效无所附丽，亦安从而致之。","Y3.T":"九三，高宗伐鬼方，三年克之，小人勿用。","Y3.N":"六爻之次，隐然自成一程：既济之成，非一朝之故，盖由未济渐进而后至。初与二处卦下，济犹未成，此欲济未济之候也。其时宜止而不宜进，故有曳轮之象，有濡尾之戒；丧茀勿逐，亦慎行之义而已。至三则内体告终，未济者转而为既济。九三刚爻刚位，刚而不失文明之德，其责在克成，其才亦足以克成，高宗伐鬼方之象所由取也。高宗谓武丁，商之贤主，振颓起弊，远惩不庭，国势由未济而复于既济；其功非止一役，举伐鬼方以见例耳。“三年克之”，见中兴之难：非旬月可期，必积岁累功、屡经险阻而后集；一役之勤且三载，况其大者乎？亦见其任之重：非人人可假手，必文明以为德、刚武以为威，如高宗其人者，乃能当之。“小人勿用”，正为此辈而发；使小人参之，不惟无益于济，且将重其乱。","Y3.X":"象曰：三年克之，惫也。","Y3.XN":"惫者，疲敝之谓。以三年之久仅克一邦，师徒暴露，财力俱殚，元气所伤已深，故其状至于疲惫而难振。","Y4.T":"六四，繻有衣袽，终日戒。","Y4.N":"“繻”读为“濡”，舟之渗漏也。“衣袽”，敝坏不用之衣。古之渡者，必贮敝衣于舟中，脱有渗漏，取以塞之。漏之有无，非可前定；衣之储备，则每渡皆然。此事本贩夫舟子所习，不待思索而喻；一经作者采入爻辞，遂超乎器用而寓至理。盖既济之患，不生于外，而生于人心之懈；舟未漏而备衣，正治世之常经也。既济一卦，大旨端在思患豫防；六四居下体之上，既济之成已著，位又多惧，近君而处险，其于无患求患、未患先防，较诸爻为尤急。四以柔质而当此，力不足以制变，惟恃一心之戒惧耳。取“繻有衣袽”为象，恰如其分。更系“终日戒”三字，则戒惧之情益迫，自朝至夕，无顷刻而释于心。患未尝有也，而六四之意，若患之即至者然。","Y4.X":"象曰：终日戒，有所疑也。","Y4.XN":"六四之能“终日戒”，与夫不得不“终日戒”，只在一“疑”字。疑者，疑患之将至也。唯其疑之，故戒惧之心常存而不懈。平常之时，多疑本非美事；至于安危之交，所当疑而漫不加疑，其为害更甚于疑。","Y5.T":"九五，东邻杀牛，不如西邻之禴祭，实受其福。","Y5.N":"“实受其福”，与“得吉”义近。所受者何？“实”也。《易》例：虚者属阴，实者属阳。九五为阳爻，所居之坎又为阳卦，则受此福、获此吉者，非它爻，即九五之躬。\n“东邻杀牛，不如西邻之禴祭”一语，含两义焉：以之戒九五，亦以之许九五。杀牛者，牲牷肥腯，礼之盛者也；薄者何？禴是已，所荐不过黍稷沼毛，无牲牷之奉。东邻、西邻，特彼此相形之辞，非可实指其为何国，尤不可牵合卦中何爻；所喻者，两等祭礼而已。盛祭能致福，而非必致福；薄祭亦能致福，而非必致福。其致与否，不系于物之丰俭，而系于主之诚伪。诚敬之验非一端，而本之大者，在时之当否。过与不及，皆非敬也。时苟不当，牲牷虽备而无灵；时苟当，沼毛虽微而必达。时之义，非择日候辰之谓，谓其心与事相值而无所乖而已。心诚而时乖，与心怠而时合，其失均也。故盛薄者，礼之文；时者，礼之情。文可增损，情不可伪为。礼家尝言：祭以时为大。此语尽之矣。\n爻辞设东、西之喻，所以告九五：祭贵存诚，勿忽于时，勿慕其文而丧其实。何则？九五刚中而履尊，当海宇既济、物力方丰，骄泰易萌，诚敬易减。凡物盛则志溢，志溢则敬衰，此常人之情也。故诏之曰：毋以治平既成，而忘祭之在时不在物。充类言之，九五所宜亟者，时也；“既济”甫至，“未济”已踵其后，此其一端也。\n若就一卦之实势论之，则又有进于是者。既济之基，下体离立之；既济之享，上体坎受之。九五居坎而为卦主，福之所归，舍五其谁？且以刚中而处尊位，不徒受福，实亦尸祭之主，祭之得失系焉。自五言之：人以大牲，我以沼毛，彼丰我啬，然我刚中而实，值乎其时，则受福者终在我。","Y5.X":"象曰：东邻杀牛不如西邻之时也。实受其福，吉大来也。","Y5.XN":"何以盛不如薄？薄者诚啬，然适会其期，会期则为得；盛者诚丰，然有违于候，违候则为失。福之至也，视其中之实，不视其外之饰。祭之所为实者，时而已矣。《易》家以虚属阴、以实属阳；大者阳之类，小者阴之类。象辞“吉大来”之“大”，即爻辞之“实”，其“吉”，即爻辞之“福”。盖言时之既至，福自随之，初不待于营求也。《汉书·郊祀志》载杜邺论祭之言，大旨谓备德于己者，荐虽薄而福自厚，与象辞之意若合符节。","Y6.T":"上六，濡其首，厉。","Y6.N":"卦画之次，初居其始而为体，上居其终而为末；及卦体既立，则上反为首，初反为尾。“濡其首”者，即指上六自身。厉之为言危也，危而未入于凶。危者可转而为安，凶则无可复救。上六当既济之末，跨坎险之巅，质复阴柔，道穷势极，已堕衰乱之域，如狐渡水而没其颅，危亦甚矣。涉险者不虞其后，遂至灭顶，其危可想。夫济者已尽，险者未出，其象所以为濡首也；非水能溺之，时溺之也。卦辞之“终乱”、彖辞之“道穷”，至此爻而尽露。","Y6.X":"象曰：濡其首厉，何可久也。","Y6.XN":"“何可久”，即不可久之谓。此三字含两义：一就理势言，一就告诫言。理势如何？物无终穷，穷则必反；既济既尽，未济将兴，濡首之危，自不能绵延。告诫如何？作者欲上六见危而早悟，溺不可久，久则厉迁于凶矣。《易》之言“厉”，每有微旨，与“凶”、“悔”、“吝”殊科，非斩截之辞。若屯、否之上爻，若离之三，若中孚之上，若小过之四，并本爻之象，皆此类也。其辞曰“何可久”，曰“何可长”，曰“终不可长”，教人翻然改图，勿终陷溺而已。","Z":"在六十四卦之序中，既济所居至为吃紧。其与未济相承，共成首尾相衔之一环；此环于全序为绝对不可缺者，其分量可与乾坤二卦相埒。必具此二卦，而后《周易》事物发展之说，乃见其全、见其彻。\n作者之意，盖视万物为一大程：始必有终，终则复始；生必有灭，灭而更生，相续而不已。程之发端在天地剖判，故乾坤首列；乾坤既判，万物由之以生，故二卦之后，余卦以次而列；其动其变，各有内在之不得不然，程中又分段落，如链相属，故诸卦之次比肩接踵、秩然不紊；程终有尽，物终有解，故其归结处，俨然一既济。既济六爻尽应而尽当位，抵触既消，乾坤几乎息，物类几乎尽。然乾坤终不可息，物终不可尽。\n旧者息而新者萌。旧程之终，即新程之始，是以既济似终而非终，未济不似终而适为终。既济者，适当新旧之交：非新程之始，而绾新程之始；非未济，而含未济。作者置既济于六十四卦之末而不居其末，哲思所运，将“物不可穷”之旨写来既巧且深，余味悠然，千载之下读之，犹令人屡叹。盖其所以为巧者，不假言说，而借卦次之先后示之；所以为深者，不系一卦之义，而系乎全经之结构。\n卦辞与彖，实涵此义。“既济亨”者，六爻尽应尽正，争既止，事既定，钜细皆通也。“初吉终乱”云者，盛极则衰，济极则必反于未济，其势然也。《易》之为教，明天道而必责之人事：既示以必然之数，复勉以可致之功。故虽系“初吉终乱”，人苟知终而不自止，则可以终而无乱。卦爻辞中所以屡致意于无患思患、思患豫防者，其故在此。\n合全卦观之：下体离自初至三，渐入既济，故其辞皆善而无凶咎；惟既处治平，愈不可无思患豫防之心，是以三爻虽无可咎，亦不轻许以吉。初九之免咎，在能止：刚而居下，所应者四，然必曳其轮、濡其尾，不肯轻进，然后无咎。六二则宜静守，事可行也而不轻行，惟需待为得。九三刚居刚位，当内体之尽，历“高宗伐鬼方”之久争，其业始集。而用人尤要：苟以小人间之，则豫防者反为阶乱，故其辞以“小人勿用”为戒。入上体之坎，则去明即险，卦已由既济向未济移步，三爻之辞皆渐失其吉。六四“繻有衣袽，终日戒”，必终日思患防患，常若坐敝舟而水且骤至，庶可免焉；不善之端，已见于此。九五戒其务实不务文、尚诚不尚盛，杀牛不如禴祭，亦以示警：处治平丰盛之时，所贵在守损约、行诚敬。可见既济至九五，以时言之，貌善而实不善。上六则时之不善极矣：濡首之厉，直是未济之世已临，如饮者及于酩酊，如花者及于离披，时运之穷，于斯为甚。然将入未济而未入，濡首止于厉而未及于凶；使人之主观能合于客观，见得明白，则患非必不可避，故小象曰“濡其首厉，何可久也”。"}},"64":{"id":"64","cnNum":"六四","name":"未济","pinyin":"wèi jì","fullName":"火水未济","shortFullName":"火水未济","upper":"离","lower":"坎","upperNature":"火","lowerNature":"水","lines":[0,1,0,1,0,1],"yaoLabels":["初六","九二","六三","九四","六五","上九"],"blocks":{"P":"《序卦传》以“物不可穷”一语收束全书，谓既济之后必继以未济。六十四卦行至既济，乾坤几乎止息，矛盾消解，争竞平复，问题似已尽数了结。然乾坤不容止息，争竞不容平复；正因物不可穷，既济之后遂有未济。盖既济不足以为旧过程之终点——终点之中，本已含着新过程的起点，故殿六十四卦之末者，是未济而非既济。所谓不可穷，指变化本身无有尽期：一程既终，一程复起，程程相续，生生不已。一部《周易》本以变易为骨，六十四卦的次第已寓变化之旨，特未形诸文字。孔子序卦，乃将《易经》中蕴而未发者揭出，“物不可穷”之义由是而明；此义既属《易经》，亦属《易大传》，而尤集中于未济一卦。未济者，未穷也；未穷，则生生不已之谓。观其卦体，坎下离上，火居水上：火性上炎，水性下润，两不相资为用；又六爻之位皆失其当，此其所以为未济。","G":"未济，亨，小狐汔济，濡其尾，无攸利。","G.N":"同系一个亨字，两卦的分量却不一样。既济之世，事无巨细、德无高下，一概通达，无一处窒碍。到了未济，通达者只限于大，小道小德便走不出去。这是一层。另一层在时间的向度上：既济的亨已经兑现，摆在眼前；未济的亨则悬而未决，只是一种可能，成与不成，还得看局面怎么走、人怎么用力。\n汔，是几乎的意思。小狐云者，是对老狐而立的名目。老狐心存戒惧，踏冰而听其声，唯恐一足陷落；涉水时更不敢放下尾巴，所以过得去。小狐全无顾忌，一头闯进水里，看形势几几乎就要登岸，偏偏尾巴翘不起来，沾湿了，终究没有渡过。湿了尾巴而性命还在，已算意外之幸，还谈得上什么好处？卦辞的意思，拢共一句：未济固然可亨，但亨属于老狐，不属于小狐；换文言说，大者通，小者不通。","T":"彖曰：未济亨，柔得中也。小狐汔济，未出中也。濡其尾，无攸利，不续终也。虽不当位，刚柔应也。","T.N":"先看“未济亨，柔得中也”一句。柔而居中可以致亨，这是既济、未济共有的道理，只是得中之人所处的位置不同：既济应在六二，未济落在六五。既济一卦以内部三爻为骨干，走出内体便滑入未济，一滑入便有终乱的结局，所以它的初吉只能记在六二名下——那一爻柔而守中。未济的骨干同样在内，但它走向外体时是朝既济靠拢；亨既只在这靠拢的途中显现，则亨的根柢便只能落在六五，而不在内三爻。\n“小狐汔济，未出中也”，说的是九二。这一爻被压在坎险之内，上边有六五作应，正当将济未济的关口；依理它该脱险，依势它也像能脱险，终于没有脱，原因在它的阳刚。未济之世，阳刚之爻个个失位，才具无处安放，于是才有小狐几济而湿尾的祸患。\n“濡其尾，无攸利，不续终也”。续者，接续；不续终，即起了头却结不了尾。开端很勇决，往后却接不上力，头已经过去，尾巴还拖在水里，前后两截不相连属。既然接不上，往哪儿去都不见其利。既济怕的是终而乱，未济怕的是不能终；两处对看，成终之难可知。还有一层：同样一句湿尾，在既济是戒人审慎、莫要轻进，到未济却成了有始无终、心浮气躁的写照，字面一样，旨趣相反。\n末二句“虽不当位，刚柔应也”，已经不是替卦辞作注，而是孔子注完之后另申己意。六爻全不得位，看上去无一处可济；然而未济自有一份可用的资本——六爻刚柔相配，上下内外都有呼应。能把不利的一面压下去，把有利的一面提起来，审量时势、择善而后动，未济就未必不能济。","X":"象曰：火在水上，未济。君子以慎辨物居方。","X.N":"火之性向上，卦却把火安在上头；水之性向下，卦又把水放在下头。上面的只管往上，下面的只管往下，二者背道而行，既不相遇，也就谈不上彼此为用——未济之名由此而立。\n那么，火在水上，难道不正是万物各安其位的常态？此际先有两家异说：朱子《本义》看得平常，以为水与火本不同类，各安一处即可；程子《易传》却以为火在水上，非其所宜。两说相持，当以何者为断？只看下文“君子以慎辨物居方”那个慎字，便见分晓：假使火水已各止其止，君子何须再慎？正惟其不安，才要慎。\n辨物与居方，是互文见义的一对：物、方都指天下万类的品目。把品类一一剖开、不令混杂，是辨物；剖开之后，再让每一类落在它该落的地方，是居方。这件事干系不小，君子于此必不敢苟，否则如本卦火水错处，便不成局面。两句之中，着力处实在居方——问题不在识其异，而在如何使异者各得所安。\n取来与同人一卦的大象对看：彼曰“君子以类族辨物”，语意邻近，指归则别。同者，皆以辨物为务。异者，同人之辨，是要在纷然相异之中寻出一个共通的所在，以成“和而不同”之局——异者其形，同者和其心；未济之辨却不求合，恰恰要把相异者一一分开，教它们各止于分内。","Y1.T":"初六，濡其尾，吝。","Y1.N":"初六是阴柔之才，又压在坎险的最下层，上与九四为正应。人在险中，必不安于险；上头有个可应之爻，自然想攀援而上：这就决定了它非渡不可。可惜才质本柔，力不副心；九四又不是中正之人，未必肯伸手。于是取象于狐尾沾湿。狐之渡水，所忌在尾。旧谚“狐欲渡河，无如尾何”，谓尾一沾濡便无从着力，济之无望。力不足而强要前行，想渡而终于渡不过，羞与吝都从这里来。\n既济初九也有“濡其尾”，字面相同，用意各别：那一处正当可渡之时，湿尾是慎而不进；这一处本不该渡而抢着渡，湿尾是躁而致败。慎而止，所以无咎；躁而败，所以有吝。","Y1.X":"象曰：濡其尾，亦不知极也。","Y1.XN":"训诂上，极字作终讲。“亦不知极”者，言其不曾料到收场。起步已然这般造次，往后怎样收拾，自然无从预见。《彖传》讥其“不续终”，正与此相发。","Y2.T":"九二，曳其轮，贞吉。","Y2.N":"所谓曳轮，是把车轮倒着拖住，叫车子走不动。九二以刚爻处柔位，居中，又上应六五，论力量足够渡过。但它此刻还在险中，时当未济，不是大有作为的时候；拖住车轮，正是按兵不动、等候时机。能进而自止，所以得正而吉。\n既济初九拖轮，未济九二也拖轮，用意相同，位置不同；位置不同，也就是时候不同。九二刚健而内含中德，尚且要学既济初九的样，可见未济的局面更难措手，比既济更须步步留神，不可冒进。","Y2.X":"象曰：九二贞吉，中以行正也。","Y2.XN":"九二阳爻而居阴位，于位为不正，却系以“贞吉”，何也？盖《易》之例，正者未必得中，得中者则未有不正。九二、六五两爻屡言“贞吉”，正以其居中也。《易》之所贵在中，中既得，正则已在其中。小象“中以行正”四字，即就此点破：九二之所以为正，由其位中而然。","Y3.T":"六三，未济，征凶，利涉大川。","Y3.N":"这一爻向来缠夹。一边说“征凶”，明明不许动；一边说“利涉大川”，又像劝人动。两句顶撞，历代注家都想把它说圆，结果多半凿空附会，读来不能服人。只有朱子《本义》提出：利字上头恐怕脱了一个不字。此说可以细参。古书传抄，掉一个字原不算奇；若补上这个不字，读作“不利涉大川”，通篇就顺了。\n还要看卦的结构。既济以内部为重心，从初九、六二一路走到九三，才渐渐抵于既济：初、二还在路上，到九三才算真到。未济的重心也在内，走到六三，一卦的未济已经走完，再往前便靠近济了——所以六三径直标出“未济”二字。这一爻位于坎险之上，按理该出，按力也像是出得去；无奈时当未济之末，才质又是阴柔，位不中不正，实际并无出险致济的本事，故断以“征凶”。做点小事，勉强还行；要渡大河、平大难、建大功，那是万万不能的。","Y3.X":"象曰：未济征凶，位不当也。","Y3.XN":"六爻尽失其位，本未济之通例；小象独于六三拈出“位不当”三字，其故可思。未济之局，实由六三而成；而居此位者，又属阴柔之质。才柔而位刚，两不相副，六三之所以“征凶”者，正在于此。","Y4.T":"九四，贞吉悔亡，震用伐鬼方，三年有赏于大国。","Y4.N":"九四系以“贞吉”，是告诫之辞，不是现成的占断：这一爻本来带着悔，能守则吉，吉则悔消。可九四既不中又不正，“贞”字从何说起？此处的贞，应读作贞固、固守，用今天的话说，就是咬定不放、始终不渝。\n守的是什么？要答此问，先要问它的悔从何来。悔在它以阳刚之质踩在阴柔的位上，位置站错了。正因站错，它虽然已经走出坎险，未济之运也过了中段，局势开始往既济那头偏，可济之望是有了，真要济成却绝非轻而易举。必须照“震用伐鬼方，三年有赏于大国”的样子，把阳刚之力使尽，长时期撑住不松，才能济、才能吉、才能把悔抹掉。\n伐鬼方这件事，当时人人晓得：功业大，名分正，过程苦。提起它，听的人眼前就现出全力以赴、艰苦卓绝的那股劲，也现出战事平定之后天下安治的那番气象。\n既济九三与未济九四都取此象，根子在两卦既反又对：把既济九三掉转过来，正是未济九四，所以象同。这样的例子《易》中不止一处。损、益相反，损之六五系以“十朋之龟”，翻转即成益之六二，其辞亦同；夬姤之相为反也亦然：一卦之九三、彼卦之九四，其辞皆有“臀无肤，其行次且”之语。但位置既别，同一个象在各卦里就各有分寸：既济走到九三，大局已定，故说“三年克之”，是战事已胜的口吻；未济九四，未济刚过，既济还要去争，故说“震用伐鬼方”，是兵事方张的口吻。“三年有赏于大国”，指三年中间不断犒军。这与师九二“王三锡命”是一路，与师上六“大君有命”又是一路：仗打着就赏，见的是用兵之勤；仗打完再论功，见的是施政之慎。\n最后还有一个疑问：九三、九四都不是君位，凭什么说殷代明王、高宗的故事？须知《易》的取象，有的系于位与人也，有的系于时与事也。这两爻所取的，是上下卦交接之际的那个时，与伐鬼方的那件事，跟君位有无、征伐者是谁，本不相干。","Y4.X":"象曰：贞吉悔亡，志行也。","Y4.XN":"“贞吉悔亡”四字，正是九四志所欲达之地。九三在卦中主未济，未济之运既过，九四恰立于未济转济的关口，时不可谓不佳；济之以全力以赴、如伐鬼方然持久不怠，则济可必、吉可必、悔可必亡。志愿之成，于是乎在。","Y5.T":"六五，贞吉，无悔，君子之光，有孚，吉。","Y5.N":"未济卦里“贞吉”出现三次，三处的分量并不齐。九四那一处，贞是固守，全句是警戒；九二、六五两处，贞该解作正。这两爻的位置其实都不正，然而都居中有位；中既到手，正也就可以附认。所以它们的“贞吉”不是告诫，而是爻象里本来含着的断语。\n六五凭什么贞而吉、吉而无悔？它在离体的中央，是一卦的文明之主；质柔而位刚，下与九二之刚相应。它内怀文明，外能谦抑，向在下之贤者虚心求教，九二也肯为之下。《彖传》“未济亨，柔得中也”一句，说的就是这一爻。由守正而得吉，由得吉而进于无悔，本是分内之事。\n无悔比悔亡又高一层：悔亡是先悔而后无，无悔是本来就没有。遍检全书，四五两爻并出此二辞者，未济之外，咸与大壮亦复如此，事属一类。\n还有一处该留意：此爻之辞前后两个“吉”。头一个由守正而来，是六五之德所生，可叫德之吉；末一个由“君子之光有孚”而来，是事功所结，可叫功之吉。六五是文明之主，所以目为“君子之光”。生当未济之世，却凭自己的才与德把未济翻成既济，使天下国家自乱而趋治，功与德恰相匹敌，故曰“有孚吉”。未济之世，寻常光彩都显得黯淡，六五的光反而加倍，好比雨后的日头、烧残的山色，愈见其明。","Y5.X":"象曰：君子之光，其晖吉也。","Y5.XN":"光盛而后有晖，有晖而后其吉可言。晖者，辉也：光聚之极，向外弥散，乃谓之晖，寻常微弱之光散它不开。爻辞两言吉，各有所指。前一吉出于守正，归之于德，德止于六五一身，故为一身之吉；后一吉出于晖，归之于功，功被于四海，故为天下所共之吉。","Y6.T":"上九，有孚于饮酒，无咎。濡其首，有孚，失是。","Y6.N":"既济走到尽头必转成未济，所以既济上六有湿头之危；未济走到尽头必转成既济，所以未济上九说“有孚于饮酒无咎”。不过凡事都有个界限，一过界，好事也成坏事，于是紧接着又戒一句“濡其首，有孚，失是”：饮酒行乐自当有节，若一味沉湎，喝到连头都湿了，“有孚”也就跟着丢了。","Y6.X":"象曰：饮酒濡首，亦不知节也。","Y6.XN":"此爻借酒言节，欲人守分寸而不过中。\n小象标出“节”字者四条，皆系于坎、离。得中者，蹇之九五也——处乎坎而得其中，刚且中正，故许之曰“中节”。失中者，家人九三与本爻也——九三在离而质刚，过于中不能自制，故讥之曰“失家节”；本爻亦在离，火性本自炎上，又踞一卦之巅，过中不正，故断之曰“不知节”。刚柔相济者，则鼎上九当之：以阳处阴，居离之终，刚而能柔，故其辞曰“刚柔节”。四者合观，《易》之言节，归本于中而已。","Z":"未济与既济，互为反对：将既济六画自下逆数而上，便成未济。全书之中，两卦相为反对者不止此一双；既反而又对者，不过泰、否与此一对；更求六爻两两相应，则六十四卦中唯此而已。其关系之特殊，全书之中惟乾坤尚在其上。乾坤据六十四卦之端，既济未济居六十四卦之尾。乾坤并举，可当《易》之门户；既济未济合观，则兼有收旧、启新两重身份——旧局面于此告终，新局面即于此发端。二者几于不可拆。\n显证有三：湿尾湿首，既济系于初、上两爻，未济亦然，一也；伐鬼方、曳其轮，为两卦共有之象，所异仅在一位，二也；两卦之体，皆取坎离配成，然命意所归，则偏在离，三也。\n先看既济：离居下体，其内三爻所论，皆小心求济之事；上体转为坎险，自六四以上便步步滑入未济，“物不可穷”于此见之。未济则离在上、坎在下，恰说明前者的收梢即后者的起头，既济之中已伏未济之机。内卦三爻，所述皆未济一边的境况：初六之吝在湿尾，九二之贞在曳轮，六三所患者，位不当而征凶也。外卦三爻落在离中，离以明为德，局面因此逐步开朗：九四以伐鬼方受赏，未济已有转济之机，而苦斗一场仍不可免；六五之吉，由君子之光而有孚，一吉未已又进一吉，天下复见治平；上九有孚于饮酒无咎，世道升平，宴饮可无咎，然一涉沉湎而不知节，危机之引线又伏于此。\n置于六十四卦全程而观，既济固为长程之讫点；然物不可穷，讫点方立，起点已萌。合两卦为一体来读，其所昭示者，正是变易之所以相续不断。此义断不可归于循环论。其所已触及者，实为一深刻之理：事物每循否定之否定的形态向前推演。"}}},"pairs":{"乾_乾":"01","坤_坤":"02","坎_震":"03","艮_坎":"04","坎_乾":"05","乾_坎":"06","坤_坎":"07","坎_坤":"08","巽_乾":"09","乾_兑":"10","坤_乾":"11","乾_坤":"12","乾_离":"13","离_乾":"14","坤_艮":"15","震_坤":"16","兑_震":"17","艮_巽":"18","坤_兑":"19","巽_坤":"20","离_震":"21","艮_离":"22","艮_坤":"23","坤_震":"24","乾_震":"25","艮_乾":"26","艮_震":"27","兑_巽":"28","坎_坎":"29","离_离":"30","兑_艮":"31","震_巽":"32","乾_艮":"33","震_乾":"34","离_坤":"35","坤_离":"36","巽_离":"37","离_兑":"38","坎_艮":"39","震_坎":"40","艮_兑":"41","巽_震":"42","兑_乾":"43","乾_巽":"44","兑_坤":"45","坤_巽":"46","兑_坎":"47","坎_巽":"48","兑_离":"49","离_巽":"50","震_震":"51","艮_艮":"52","巽_艮":"53","震_兑":"54","震_离":"55","离_艮":"56","巽_巽":"57","兑_兑":"58","巽_坎":"59","坎_兑":"60","巽_兑":"61","震_艮":"62","坎_离":"63","离_坎":"64"},"orig":{"01":{"P":"这是64卦的第一卦，卦名曰乾，它由六个阳爻组成。阳爻用“—”这个符号表示，因为“—”是奇，奇是阳数。与阳爻相对应的阴爻用“--”这个符号表示，因为“--”是偶，偶是阴数。“乾下乾上”是注文不是经文，是后人用以说明这一卦卦体构成的。这个“乾”指的是三画卦即8经卦的乾。下乾指内卦，上乾指外卦。意思是说，六画卦即64卦之一的乾是由上下两个三画卦乾组成的，内卦是乾，外卦也是乾。所有64卦都是由8个三画卦重合而成的。古人说宓牺画8卦又重64卦，是不可信的，但是不管8卦和64卦谁画谁重，时间非常非常悠久则是肯定的。《周礼·大卜》说：“掌三易之法，一曰《连山》，二曰《归藏》，三曰《周易》。其经卦皆八，其别皆六十有四。”《周易》之前有两种易书，《连山》是夏代的，《归藏》是殷代的。它们和《周易》一样，也是8卦和64卦。这就是说，8卦和64卦的出现不会晚于夏代。先有8个三画卦，用以代表万事万物的8种性质。三画卦乾代表万事万物中乾的这种性质。乾其实就是健。8个三画卦的性质各有一个，无论何时何地都不能变，而取象却各有许多，因时因地而变化无定。三画卦乾可以象天，也可以象马象首象父象君等等。三画卦只有8个，不足以说明千变万化的复杂事物，于是8卦重合为64卦。由8卦而64卦，是人们的认识由抽象上升到具体的过程。64个六画卦所代表的事物的性质比8个三画卦更加具体，所取的象也更加稳定。三画卦乾的性质是健，六画卦是重乾，乾而又乾，其性质是至健。三画卦乾的取象可以是天是马是父等等。六画卦乾的取象比三画卦乾具体、确定，据孔子《象传》“天行健，君子以自强不息”和《序卦传》“有天地然后万物生焉”的说法，我们知道，六画卦乾的取象是天。天是最大的阳物，最大的健。六画卦乾具有同天一样的性质：纯阳至健。《周易》64卦以乾卦居首，这一点不简单，反映殷周之际人们观念上的一大变化。殷人重母统，所以殷易《归藏》首坤次乾；周人重父统，所以《周易》首乾次坤。周代的几乎所有的制度都反映着首乾次坤的观念。《周易》把乾坤两卦放在64卦之首，与周人的自然哲学紧密相关。《周易》的作者认为天地是万物的本原，天地之间唯有万物而已。而“易与天地准，故能弥纶天地之道”，又“与天地相似，”“范围天地之化而不过，曲成万物而不遗”，《易》之为书广大悉备，“有天道焉，有地道焉，有人道焉”。《易》是天地及天地生成万物的摹写，天地及天地生成万物是《易》的原本。天地之道全在《易》的范围之中。乾坤象天地。天地在万物之先，故乾坤居64卦之首。64卦象万物，故屯蒙诸卦列乾坤之后。《易纬·乾凿度》说乾坤是“阴阳之根本，万物之祖宗”，是说得极正确的，与《系辞传》所说“乾坤其《易》之门”，“乾坤其《易》之缊”，意义完全一致。我们研究《周易》应特别重视乾卦及坤卦，既要知道它们是64卦之中的两卦，有它们自身的意义，又不可忘记它们是64卦的祖宗，64卦的根本。","G.N":"上面的是乾卦的符号，用文字表达就是乾。卦的符号非常重要，如果只有文字没有符号，那么《易》也就不成其为《易》了。一卦的思想意义全由一卦由六个卦画组成的符号表现出来。但是光有符号没有文字名称也不行，所以在有了卦的符号之后，又有了卦的名称，同时也有了卦辞。8个三画的符号和64个六画的符号是谁画的谁重的，古人有许多互相矛盾的说法，都不能令人信服。我们今天只能说它们产生于遥远的古代，产生于原始社会。卦的文字名称和卦辞出于谁之手，古人说是文王作的，证据不充分。但是很可能产生于殷周之际。总之，不管卦的符号是谁画定的，卦名和卦辞是谁写定的，它们产生的时代相距甚远，当无疑问。\n“元亨利贞”四个字系于卦之下，谓之卦辞。卦辞也叫做彖，所以孔子解释卦辞的文字叫《彖传》。彖是断的意思，断即判断、概括。彖辞用尽可能简炼的语言概括一卦的卦义。很多卦的彖辞用象表达，如坤卦卦辞“元亨利牝马之贞”取牝马为象表达卦义，乾卦卦辞的“元亨利贞”四字则表面上没有取象，用的是比较抽象的概念。乾卦取象于天，但不是取象于天的形体，是取象于天的性质；天的性质用一个字概括，就是健。乾就是健。健是什么？健是天体有规律地运转，永不停息，什么力量都不能阻止它，改变它。卦辞用“元亨利贞”四个字释健之义。“元亨利贞”就是健。合言之是健，分言之是元亨利贞。古人释“元亨利贞”为春夏秋冬，是有道理的。春夏秋冬是天体运转的明显标志，古人从春夏秋冬的交迭变更中看到天的运动变化，看到天行之健。《论语》记孔子说的“天何言哉？四时行焉，百物生焉，天何言哉！”恰是此义。是春夏秋冬不曰“春夏秋冬”而曰“元亨利贞”，因为若曰“春夏秋冬”就把健的特点说死了，而“元亨利贞”既可以指自然界的春夏秋冬，也可指人事上的问题，比如人的仁义礼智四德，以及其他具有乾健意义的事物。总之“元亨利贞”四字是灵活的，它可以因时制宜地适应一切具有乾健意义的人、事、物。如果说“元亨利贞”指春夏秋冬言，那么元就是春，一岁的开始，万物生发；亨就是夏，万物成长；利就是秋，万物成熟，贞就是冬，万物收藏。若以人的修德而论，元相当于仁，亨相当于礼，利相当于义，贞相当于智。“元亨利贞”四字是四个独立的意义，但紧密相联系而不可或缺。四个字合起来才有健的意义。别的卦的卦辞有的言“元亨利贞”，但有增字，有的言“元亨利”而无贞，有的言“亨利贞”而不言元，有的只言“元亨”，不言利贞，有的只言“利贞”，不言元亨。多一字或少一字，都不浑全，不浑全就没有乾健的意义。只有乾卦纯乾纯刚至健，方可以“元亨利贞”四字当之。","Y1.N":"“初九”是爻题，即乾卦第一爻的名称。“潜龙勿用”是乾卦第一爻的爻辞。爻辞解释一爻的爻义。64卦的爻辞古人或说文王作或说周公作，究系谁作，现在已无法确定，不过如果说爻辞与卦辞非出一人之手，但产生的时间相距不远，都在殷周之际，可能近于事实。“初九”二字包含二义，初是位，九是爻。初是卦之第一位，九是爻中之阳爻。初九，阳爻居初位。画卦时六爻自下向上画，故卦之六爻自下而上依次称作初、二、三、四、五，上。第一爻称初，第六爻应当称终；第六爻称上，第一爻应当称下。当称终而言上，当称下而言初，这是为了表达第一爻与第六爻的关系既有终始之义又有上下之义而采取的互文相通的办法。第一爻言初，则第六爻有终义，两爻是终始的关系。第六爻言上，则第一爻有下义，两爻是上下的关系。若第一爻言初，第六爻言终或第六爻言上，第一爻言下，则只能表达两爻的终始或上下一种关系。阳爻为什么用九表示，这是根据筮法来的。人们为了求得一卦，需要行筮。筮的时候用49根蓍草，经过分二、挂一、揲四、归奇四个步骤，最后得出或七或八或九或六四个数中的一个。七、九是奇数即阳数，若得七或得九，就画一个阳爻。六、八是偶数即阴数，若得六或八，就画一个阴爻。(筮法详见本书《系辞传上》解)。《周易》192个阳爻皆书九而不书七，192个阴爻皆书六而不书八，这是因为九、六变，七、八不变，而《周易》占变爻的缘故。据说比《周易》更古老的《连山》、《归藏》二易占不变爻，可能它们的阳爻阴爻用七、八表示而不用九、六。乾卦取天象，而乾之六爻取龙象，与《说卦传》以乾为天，以震为龙的说法不合，这样的情况在64卦中还有很多，委实令人困惑不解，于是汉人创为互体、纳甲、爻辰、五行、飞伏诸法，傅会穿凿，妄加解释，其说虽详，不通还是不通。这个问题被魏人王弼讲明白了。王弼说：“义苟在健，何必马乎；爻苟合顺，何必牛乎。”只要能把乾健、坤顺的意义表达出来，取什么象是灵活的，不必拘泥。卦代表时代，乾卦这个时代具有健即元亨利贞的特点，所以取象天。爻代表一个时代中的一个阶段。爻是变化的，动态的。乾卦六爻从不断变化亦即动态中反映乾健的特点，它需要有升有降，有上有下，有大有小，有潜有见，有跃有飞，需要灵活多变。什么东西能够如此呢？马不能，天更不能。能够如此的只有龙。龙本不存在，它是人们想象出来，实际上见不到，因而是高贵无比的动物，用它作乾六爻的象，再合适不过。\n“初九，潜龙勿用”，潜，藏。勿用，无所施行，无所作为。乾之初九，阳而处卦之下，正是阳道将萌而未萌的时候，犹如龙在潜伏之中，不能动也不宜动。人处在乾初九的时候，需晦养以待时，勿有所施行，勿有所作为。","Y2.N":"见，现。田，地上。卦有天地人三才，五、上为天道，三、四为人道，初、二为地道。二在地道之上，地道之上就是田，故九二称“见龙在田”。“见龙在田”，龙已出潜离隐，出现在地上，到了该发挥作用，有所施行的时候了。就自然界说，这就是阳气萌发已升至地上，万物即将复苏。就人事说，九二刚健得中，有大人之象。《易》中大人皆指德位兼具的人。九二虽非君位而有君德，而且乾卦不象别的卦那样，往往一爻取一象，一爻代表一人；乾卦诸爻共一象，从潜龙到亢龙，都是那一条龙。它们代表的人也是一个，从“勿用”到“有悔”，都是一个人在不同时间里的不同境遇和表现。这龙是高贵的动物，这人不是凡人，现在又居中，所以称大人。这位有大德的大人既已出世，其恩惠必将泽及于天下，天下人都高兴见到它，故曰“利见大人”。","Y3.N":"以阳居三，故称九三。九三居不得中，故不称大人。但是阳爻居阳位得正，故称君子。爻有阴阳，位也有阴阳。初、三、五是奇数，奇数属阳，阳位。二、四是偶数，偶数属阴，是阴位。阳爻居阳位，阴爻居阴位，为正。阳爻居阴位，阴爻居阳位为不正。得正好，不得正不好。六爻中初与上属于无位之地，不论正不正的问题。二与五都居中，居中比得正重要，居中又得正最好，纵然不得正，因为居中也可视作得正。一卦之中得正不得正关系最为重大的是三、四两爻。九三以阳居阳得正，这一点很重要，使它能够“终日乾乾，夕惕若，厉，无咎”。“终日乾乾”，终日戒慎恐惧，自强不息。“夕惕若”，即使到了晚上，还是心怀忧惕，不敢有一点的松懈。若，语辞。厉，危厉。九三在下卦之上，是多凶的危厉之地，本来要有过咎，由于它刚健得正，能够“终日乾乾，夕惕若”，有咎可以转变为无咎。","Y4.N":"阳爻居四，故曰九四。四迫近君位五，是多惧之地，九是阳爻而居阴位，尤须小心谨慎，不可轻举妄动，时可进则进，时不可进则退，进退依时而定，故有龙或跃或在渊之象。“或”是不定之辞。跃是跳跃。跳跃不同于飞，飞是离渊而去，跃是飞的准备动作，欲飞而未飞的状态。渊是深水，是龙安居之所。或者跳跃而离渊，或者在渊里不动，究竟是跃还是在渊，要视情况决定。九四能够做到这一点。它阳爻居阴位不正，是不利的一面，但是也有有利的一面，阳主进，阴主退，阳居阴位，能够随时进退。又，九四居上体之下，正在由下体进入上体的变革之际，也有进退未定之义。既能待时而出，见可而动，哪里还会有咎。","Y5.N":"阳爻居五，故曰九五。九五刚健居中得正又在君位，在所有的卦里都是最好的一爻。在乾卦与在别的卦还有不同。乾卦是纯阳至健之卦，乾卦九五不仅刚健，且刚健而纯，不仅中正，且中正而粹。刚健中正，纯粹而精，有君德又有君位，表明阳气自下而上，至此已经盛至于天；龙自下而上，由潜而见而惕而跃，至此已经飞上天；若就人说，九五德高位亦高，刚健中正纯粹，已进入圣人的境界。圣人是君子大人中最高明最伟大的，他的修养、智慧、能力和地位足以对任何困难都应付自如，犹如龙飞在天上，圣洁高贵，腾越自由，以至于云雷风雨交集而下，普天之下感受其利。这样的大人是天下人所利见的。","Y6.N":"阳爻居上，故曰上九。上是一卦之中最后一爻。其位处于极，其事已终结，其时已过中，所以比较起来不如初爻好。初爻多得免咎，上爻则每每不可救。卦发展到上爻，无论好事坏事都已达到积微而盛，穷极将变的程度。有的不可变，有的不能不变。坏事坏到极处将要变好，爻辞指示其如何促成变好的办法；好事好到极处将要变坏，爻辞告之以如何保之不使变坏的途径。无论哪种情况，其结果如何，是吉是凶是悔是吝，爻辞都给以简明易知的答案。必成功的，爻辞直云吉；必失败的，爻辞直云凶；吉凶未定，成败得失须看主观努力如何，其知过而能改者，爻辞曰有悔，知过而不能改者，爻辞则曰吝。悔是吉之先；“有悔”，有过知改，有问题知解决，有可能变好。吝是凶之本；“吝”，有过不肯改，有问题不能解决，必将变坏。总之，上爻比较易知，不似其他诸爻那样往往一爻多义，不易知晓。不过也应明白，凡上爻属于悔与吝两种情况者，多不明言悔吝，其义常常在爻辞所取之象中包含着，须读易人自行体会。乾卦上九“亢龙有悔”，意思明显，比较容易理解。亢是过的意思。九五飞龙在天，龙已经到了极高处，阳气已经到盛极之时，刚健中正，好得不能再好。至于上九，龙已亢，阳已过，到了止进而退的时候，继续前进而不退，便要走向反面，故有悔。有悔，有了问题，但是能够注意解决；有了过失，但是能改。亢是上九的客观境遇，悔是上九的主观修养。上九的关键在悔字上，唯其有悔，方能识时通变，使乾道不至于以亢终。","Y7.N":"乾坤二卦与别的卦不同，六爻之后多出一个“用九”和“用六”。乾“用九”是说六爻全用九，不用七。坤“用六”是说六爻全用六，不用八。七、八、九、六是怎么回事？卦由筮得来。根据筮法，行筮时使用49根蓍草，经过四营三变得出一个数。这个数只有四种可能性，不是七就是八，不是八就是九，不是九就是六。九、七是奇数即阳数，得九或得七就画个阳爻。\n六、八是偶数即阴数，得六或得八就画个阴爻。如此进行六次，便可画出六爻而成一卦。九和七都是阳爻，但九是变爻，七是不变爻。六和八都是阴爻，但六是变爻，八是不变爻。在成卦的问题上，变爻九、六和不变爻七、八是一样的，但是在占的问题上，二者就大不相同了。成卦之后，《周易》占变爻，不占不变爻。比如乾卦六个阳爻，其中有几个九几个七不一定。《周易》用九占，不用七占。因为九是变爻，七是不变爻。变爻的意义是，虽然是个阳爻，但它将变成阴爻；虽然是个阴爻，但它将变成阳爻。为什么说九、六是变爻而七、八是不变爻？此与古人的数学观念有关。数的变化过程是质与量的互变过程。阳进而阴退，所以九为老阳，六为老阴；八为少阴，七为少阳。在七、八、九、六四个数中，九为阳数之老，六为阴数之老。老了的东西必发生质变。阳以进为进，九已老，无处可进乃退，退而变为八，于是阳转为阴。阴以退为进，六已老，无处可退乃进，进而变为七，于是阴转为阳。老阳老阴之变是质变，故称变爻。七未老，有处可进乃进为九，阳进仍为阳。八未老，有处可退乃退为六，阴退仍为阴。少阳少阴之变是量变，故称不变爻。知道七、八、九、六是怎么回事又知道九、六是变爻，七、八是不变爻和《周易》占变爻不占不变爻，乾“用九”的意义就明白了。乾卦筮得的六个阳爻有可能全是九，没有七。九是变爻，必变而为六，等于乾卦变成了坤卦。但是，它是坤卦却不同于坤卦，是乾卦却又要变为坤卦。这反映作《周易》的人既有乾坤阴阳对立的思想又有乾坤阴阳相互转化的思想。为了表达乾中有坤，坤中有乾，乾坤转化的思想，作《易》者在乾卦六爻之后巧妙地加上个“用九”，系之以“见群龙无首吉”一句辞。这句辞有乾的特点又有坤的特点。朱熹说“六爻皆变，刚而能柔”，是说得对的。“见群龙”是乾之刚健，“见群龙无首”是坤之柔顺。以刚健为体，柔顺为用，刚健而能柔顺，获吉是必然的。程颐释“无首”为无自为首，意谓资质刚健的英雄人物勿自为天下人之首，而让天下人拥我为首，也是有道理的。总之此“群龙无首”与今语之“群龙无首”含义迥异。64卦全有六爻皆变的问题而独乾坤二卦“用九”、“用六”，这是因为乾坤是易之门，乾坤问题的解决是根本。也还因为乾坤是纯阳纯阴，六爻全变，是全变阳或全变阴，故可云全“用九”或全“用六”。其他62卦不是纯阳纯阴，即便六爻全变，是变阳变阴驳杂不纯，故不可云“用九”或“用六”。","T.N"

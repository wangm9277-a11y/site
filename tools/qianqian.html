  <script>
    const ZHOUYI_BUNDLE = {"gua":{"01":{"id":"01","cnNum":"〇一","name":"乾","pinyin":"qián","fullName":"乾为天","shortFullName":"天天乾","upper":"乾","lower":"乾","upperNature":"天","lowerNature":"天","lines":[1,1,1,1,1,1],"yaoLabels":["初九","九二","九三","九四","九五","上九","用九"],"blocks":{"P":"乾为六十四卦之首。其体六画皆阳，故名之曰乾。阳画作一，取奇数；阴画作二，取偶数，奇偶即阴阳之所由分。“乾下乾上”四字，乃后人为标明卦体而加的注，不是经文。此处之乾，指三画之乾，八经卦之一；下者内体，上者外体。两乾相叠，乃成六画之乾。六十四卦之成，无一例外，都是八个三画卦彼此相重。\n旧说伏羲既画八卦，又重为六十四，相承已久，然无可验证。可断言者，八卦与六十四卦之起，为时极早而已。《周礼·大卜》记三代之易，夏曰《连山》，殷曰《归藏》，周曰《周易》，三书并列，而皆以八者为经、六十四者为别。二易既在《周易》之前，则八卦六十四卦之源，至迟不逾夏代。\n最初只有三画之卦八，每卦表物之一性。乾之三画，所表者健也。八者之性各止于一，亘古不移；而所取之象则甚宽，随地随时而改易：乾之于象，或天或马或首或父或君，都无不可。然而八者终不足以尽天下之事，遂两两相重而为六十四。这一层演进，实即认识由抽象而进于具体：六画之卦，性较切近，象亦较有定准。\n三画之健，犹是一重之健；六画则乾上重乾，健而又健，其性乃至健。象之层面亦然：三画之乾可天可马可父，六画之乾则有所专主。孔子《象传》言“天行健，君子以自强不息”，《序卦传》言“有天地然后万物生焉”，两处合看，可知六画之乾所取者天。天于万物为最阳，于健为最盛。六画之乾，其性即天之纯阳至健；健而益健，此全卦之骨，而六爻之纲也。明乎此，则乾之所以为乾者思过半矣。\n乾之居首，非偶然也，实为殷周之际观念转折之一大标识。母统之重，殷制为然，故其易《归藏》置坤于乾前；父统之重，周制为然，故《周易》反之而乾先坤后。有周一朝之礼法制度，几乎处处寓此先后之意。乾坤之列于诸卦之首，与周人的宇宙论正相应和。\n作《易》者以天地为万物所自出，谓两间所有，唯万物而已。《系辞》云“易与天地准”，其道足以弥纶天地；又云“与天地相似”，“范围天地之化而无过，曲成万物而无遗”。其书该天地而无所不包，故有天道焉，有人道焉，有地道焉。如此则《易》为天地及万物之写照，天地及万物乃《易》所据之底本；盖《易》所摹者，天地之全道，无有遗于其外者也。乾坤取天地之象，天地居万物之先，故其位最尊；屯蒙以下取万物之象，故次之。\n《乾凿度》以乾坤为阴阳之本、万物之祖，其言最当。《系辞传》既拟乾坤于《易》之门，又拟之于缊，语异而指同。读《易》者于乾坤二卦，当具两层眼光：其一，它们是六十四卦中的两卦，自有本卦之义；其二，它们又是诸卦所从出，为众卦之根柢，此层尤不可忽。故读乾一卦，已握六十四卦之枢机；其义既通，诸卦皆可迎刃而解。","G":"乾，元亨利贞。","G.N":"一卦之上，以文字标之，是为乾。符号之设，于《易》最要：苟无其画而仅有其文，则《易》失其为《易》矣。一卦之义，全由六画之配合而见。然画既立而无名以命之，亦不能行于世，故画定而名生，名生而辞系。八经卦之画、六十四别卦之重，果出谁手？古人立说互异，纷然莫衷一是，皆不足以取信。今所能言者，其起于邃古、当原始之世耳。卦名与卦辞之作，旧归文王，其证亦薄，大抵在殷周之间。总之，画者与辞者未必同人，而其时相距甚远，则无可疑者矣。\n卦画之下所系四字，即卦辞也。卦辞又谓之彖，故孔子释卦辞之文曰《彖传》。彖者，断也，谓断其义、括其要。彖辞以最少之字，总一卦之归。诸卦之彖，多假物象以见义，如坤之“元亨利牝马之贞”，取牝马为象；乾之“元亨利贞”，则字面无物，径以抽象之辞出之。\n乾固取象于天，然所取者非天之形，乃天之性。天之性，一字尽之曰健。乾即健也。健之为状，谓天体循轨而行，无一刻之停，无他力能止之、能改之。卦辞之所以用此四字，正为状健。健者，全卦之纲领；四字合而观之为健，分而观之为元、亨、利、贞。\n古人以四时配四字，其说可从，盖四时者天运之显征也。四时代迁，乃天运最显之验；古人于寒暑往复之际，见天之动，见天行之健。《论语》载孔子叹天不言而四时自运、百物自生，正此意也。不径举春夏秋冬而必曰元亨利贞者，盖举四时则健之义为所限；曰元亨利贞，则上可指天时，下可指人事，如仁义礼智四德，以及凡有乾健之义者，皆得以之相摄。四字之所以活而不滞，正在于此。圣人之取象立辞，往往如此：不专系于一事，而后能周于万事。\n以天时言：元当春，一岁之首，物所由生；亨当夏，物所由长；利当秋，物所由成；贞当冬，物所由藏。以修德言：元犹仁，亨犹礼，利犹义，贞犹智。四者各为一义，而脉络相贯，缺一不可，必四者备而后健之全体可见，非可偏举也。\n他卦之辞，亦有具此四字者，然或增字以别之，或有元亨而无贞，或有亨利贞而阙元，或独举元亨，或独举利贞。增损其一，义即不备；义不备，则乾健之实亡。此四字之所以独归诸乾，而他卦不得而假借也。唯乾纯乾纯刚、健之至者，乃能尽此四字而无歉；舍乾而语此，则四字徒为虚设而已。此其所以为乾也。圣人立辞之慎，于此可见；而乾健之义，亦由是而立。","Y1.T":"初九，潜龙勿用。","Y1.N":"乾卦之初爻，其名曰初九。“潜龙勿用”，则其爻辞。爻辞者，释一爻之指者也，与卦辞相为经纬。六十四卦之爻辞，旧有文王、周公二说，今皆无以为定；然谓其与卦辞非一人所作，而先后相去不远，同出于殷周之际，盖近于实。\n就其字而析之，初以标位，九以表爻。卦之六位，画自下起，其首为初，其末为上，其间则为二、三、四、五。初者，位之始也；九者，阳之目也。阳爻而居首位，故系之曰初九。末爻于义当称终，而《易》称上；首爻于义当称下，而《易》称初。此互文相通之法也：首言初，则末自含终；末言上，则首自含下。若首初而末终，末上而首下，则两端之义各止于一，不能兼也。古人属辞，类多如此。\n阳爻之系以九，其源在筮。行筮以四十九策，经分二、挂一、揲四、归奇四节，所余之数不出七、八、九、六。七与九为奇，属阳，得之画阳；六与八为偶，属阴，得之画阴。凡此四节，谓之四营；三变而一爻成，十有八变而一卦具。此筮之所以成卦也。此《周易》所以系九六而不系七八之故也。其法详《系辞传上》。然《周易》阳爻百九十二，皆系九而不系七；阴爻百九十二，皆系六而不系八。何也？九六能变，七八不能变，而《周易》所占者在变爻故也。相传《连山》《归藏》先于《周易》，其所占用不变之爻，疑其阴阳当系七八而不系九六。\n乾之取象于天，而六爻乃取象于龙，与《说卦传》乾为天、震为龙之目不合。此类抵牾，他卦亦多有，读者每以为惑。汉儒创互体、纳甲、爻辰、五行、飞伏诸例以弥缝之，立说愈繁，而窒愈甚。至王弼而其蔽始去。王氏之意，谓取象但求其义之所存：义既主健，虽舍马可也；爻既取顺，虽舍牛可也。象者，达意之具，本无定执。卦者，一时之局也。乾之为时，其德为健，即所谓元亨利贞，故取象于天。爻者，一时之中之一节，变动不居，本属动态。乾之六爻，欲于动中见健，则必也有升有降，有上下，有小大，有潜有见，有跃有飞，其变乃周。孰能如是？马不能，天亦不能，能之者唯龙。龙本非实有之物，出于人意所造，目不得见，故其贵无上；以之状乾之六爻，最为切合。故曰象者活物，死执之则失之矣。观象而求其义，义既得，则象可忘也。执象以疑义，则终身不解矣。盖象之为用，止于达意；义得则象可忘，《易》之通义然也。\n“初九，潜龙勿用”。潜，藏也。勿用，谓不施为。初九之象，阳在卦下。阳道将萌而未萌，故譬之于蛰龙：欲动而不能，亦不宜于动。人之当此，惟有晦处以俟时，未可轻有施为。","Y2.T":"九二，见龙在田，利见大人。","Y2.N":"见，读为现。田，地之表也。六位配三才：五与上属于天，三与四属之人，初与二属之地。二居地位之尽，其上即田，故九二之辞曰“见龙在田”。龙至是已去潜出隐，见于地上，正属施为见效之候。自天时言，阳气之伏者已升而出地，万物将苏；以人言之，此爻刚而不过，居下体之中，是大人之象也。凡称大人，必德位两备者当之；九二无君位而有君德，故亦得此称。\n乾与他卦有一异：他卦往往一爻一象，一爻当一人；乾则六爻共此一象，自潜至亢，所状皆一龙；其所当之人亦只一人，自“勿用”以至“有悔”，皆一人历时而境遇屡迁，表现屡易。龙为贵物，所当者非常人，而又得中，故名之曰大人。大人之德既成而出，其泽必下逮于天下，天下皆愿见之，故曰“利见大人”。","Y3.T":"九三，君子终日乾乾，夕惕若，厉，无咎。","Y3.N":"三而以阳居之，故曰九三。三于位不中，故不以大人称；九三以阳处阳，位得其正，故系以君子之称。位有阴阳：初、三、五皆奇，其位为阳；二、四皆偶，其位为阴。阳居阳、阴居阴者为正，反是则不正。得正为善，失正为不善。初与上处卦之两端，位非其位，正不正无所施。二与五皆得中，中之重于正也久矣；中而且正，斯为最美；即令不正，亦可以中而取之。至于三与四，一卦之得失系焉，正不正所关尤切。\n九三阳居阳而得正，此其能“终日乾乾，夕惕若，厉，无咎”之故也。终日乾乾者，自朝至暮戒惧自强，不肯少懈；夕惕若者，日入犹怀忧惧，不敢自宽。若，语辞；厉，危也。九三居下体之上，正当多凶之地，本宜有咎；唯其刚健得正，昼既乾乾，夕复惕惧，故咎可转而归于无。","Y4.T":"九四，或跃在渊，无咎。","Y4.N":"四而以阳居之，故曰九四。五位为君，四与之邻，处乎危疑之区；九为阳而处阴，尤当谨畏，未可妄动。可进则进，不可则退，迟速一听于时，故有龙或跃或止于渊之象。或者，不定之辞。跃者，踊而起也。跃异于飞：飞则去渊，跃则飞之先声，欲飞而未飞者也。渊者，水之最深，龙之所宅也。或跃而出，或留于渊，二者何从，视时与势而后决。九四能之。以阳居阴，于位不正，此其短；然亦有其长：阳主进，阴主退，阳而在阴，正可随宜进退。四又处上体之初，方下体既终而上体方始，正变革之地，其进退亦未定也。既能量时而后动，见可而后趋，咎安从生。","Y5.T":"九五，飞龙在天，利见大人。","Y5.N":"五而以阳居之，故曰九五。此爻也，性刚而体健，位居乎中，又得其正，而所居者为君位，六十四卦之中，求其兼备如此者，盖未有先之者也。然在乾则又有进焉。乾之体，纯阳而无杂，其至健也；故其九五，刚健之中又有其纯，中正之中又有其粹。刚健中正，纯粹以精，德与位两得，是阳气自下而升，至是而极于天；龙亦如是：始潜，继见，继惕，继跃，而今飞矣。以人言之，则德崇位尊，刚健中正而纯粹，已造圣人之域。圣人者，君子大人中之至高明者也，其养、其智、其才、其位，足以应万变而有余，譬犹龙之在天，高洁自由，云雷风雨交作于下，天下咸被其利。如是之大人，正天下所愿见也。","Y6.T":"上九，亢龙有悔。","Y6.N":"上而以阳居之，故曰上九。末位曰上，六画尽于此。位至于极，事至于终，时已过中，故视初爻为逊。故位在初者多获免，位在上者每难救，其势然也。\n卦之上爻，善不善皆由积微而盛，由盛而穷，穷则当变。盖有终古不变者，亦有势不容不变者。不善而极则将反于善，爻辞示人以促成之方；善而极则将反于不善，爻辞示人以保守之径。其效或吉或凶，或悔或吝，爻辞皆予简明之断。必成者直系以吉，必败者直系以凶。其成败未判、系乎人之自为者，过而知改则系以有悔，过而不改则系以吝。悔者吉之先也，有过而知改，有弊而知去，其势可趋于善；吝者凶之本也，有过而不改，有弊而不除，其势必陷于恶。\n是故上爻之义大抵易知，不若他爻之一爻数义、难于究诘。然亦当知：上爻之属悔、属吝者，辞多不明言悔吝，其旨每寓于所取之象中，是在读者自得之耳。\n乾之上九“亢龙有悔”，辞意昭然，尤易晓。亢者，过也。九五飞龙在天，龙之位已极高，阳之气已极盛，刚健中正，无可复加。及乎上九，龙已亢，阳已过，正当止进就退之时；于此犹进而不退，则必转而之反面，此悔之所由来。有悔者，事已有失而犹可图，行已有愆而犹可改。亢者上九之境地，悔者上九之修持。上九之所以可救，全赖此一悔。能悔，则识时而知变，乾道遂不至终亢。此上爻之所以独重乎悔也，读《易》者所宜深察。","Y7.T":"用九，见群龙无首，吉。","Y7.N":"六爻既毕，乾系“用九”，坤系“用六”，此二卦之所以异于他卦也。乾之“用九”，谓六爻皆取九而不用七；坤之“用六”，则六爻尽六而无取于八。\n七、八、九、六果何物乎？卦成于筮。揲蓍用策四十九，历四营、三变而余一数，其数不出四者：非七即八，非八即九，非九即六。九与七为奇，属阳，得之画阳；六与八为偶，属阴，得之画阴。如是者六，而六爻具，一卦成。九与七同为阳爻，然九为变，七不变；六与八同为阴爻，然六为变，八不变。就成卦言之，变与不变无以异；就占言之，则相去甚远。及其既成而筮，则视其变者以为断，不变者置而勿问。如乾之六阳，孰九孰七，初无定数；《易》则以九占，不以七占，以九变而七不变耳。\n所谓变者，其爻虽阳，势将化阴；虽阴，势将化阳。变与不变，何以分属此四数？其故在于古人之数观。数之推移，乃质与量互转之过程。阳以进为道，阴以退为道；故老阳为九，老阴为六，少阳为七，少阴为八。盖阳数以九为极，阴数以六为极，极则老矣；物之老，未有不变其质者。阳之性主进，九既老，进无可进，势不得不退，退则成八，阳遂为阴。阴之性主退，六既老，退无可退，势不得不进，进则成七，阴遂为阳。九、六之化，越其类而反其性，是为质变，故系之以变爻。七犹未老，可进而未进，进则为九，其阳自若；八犹未老，可退而未退，退则为六，其阴自若。七、八之迁，仅进而益进、退而益退，未离其类，是为量变，故不谓之变爻。\n明乎此四数之别，又明乎九、六能变而七、八不能，与夫《周易》占变不占不变，则“用九”之义可得而说。乾之筮也，六阳或尽得九而无七。九既为变，必化而为六，是全卦竟转为坤矣。然其为坤，固非坤之本相；其为乾，又已将化为坤。于此可见作《易》者既怀乾坤阴阳相对之见，又怀乾坤阴阳互转之见。欲显乾中有坤、坤中有乾、乾坤终始相生之理，乃于乾之六爻之后巧缀“用九”二字，而系之曰“见群龙无首，吉”。此辞也，兼有乾之性与坤之性。朱子之解，谓其尽变而刚济以柔，最得此爻之旨。“见群龙”三字，状阳德之纯、刚健之至也；“无首”二字，状阴德之顺、柔顺之极也。以健为体而以顺为用，健而不失乎顺，吉固其所也。程子则解“无首”为不以己为首，谓刚健之才当使天下推之，而不当自据其首，其义亦通。\n要之，此四字之训，与今人所云者，名是而旨非。六十四卦皆有六爻俱变之事，而“用九”“用六”独系于乾坤，何也？乾坤为《易》之门，乾坤之义明，则诸卦有所统。又二卦之体纯而不杂，六爻俱变，所变者仍归于一，故可总举而名之。其余六十二卦阴阳错杂，虽六爻尽变，其变也驳而不纯，故不得以“用九”“用六”称之。","T":"彖曰：大哉乾元，万物资始，乃统天。云行雨施，品物流形，大明终始，六位时成，时乘六龙以御天。乾道变化，各正性命，保合太和，乃利贞。首出庶物，万国咸宁。","T.N":"“《彖》曰”之称，非其旧也。古本皆作“《彖传》曰”，刻者省文，乃去其一字。卦下所系之辞即是彖，故孔子释此辞之文得名《彖传》。孔子赞《易》，为篇十，为种七，《彖传》其一也。十篇者，世称“十翼”：上彖、下彖、上象、下象、上系、下系、文言、说卦、序卦、杂卦，其序如此。《艺文志》所记《易经》十二篇，正二经与十翼之合数也。是知汉世官本，传附经后而各自为卷，未尝掺而一之。\n其始乱之者，费直也。费氏传古文《易》，取《彖》《象》置于每卦之末，经传之界遂移。东汉之末，郑玄、王弼先后为《易》作注，所用即费氏本。二人既承其例，又欲使读者易晓，乃更进一步，以《彖传》缀于卦辞之下，以《象传》缀于《彖传》之后及诸爻爻辞之下，经与传遂混而为一。费直所授，犹只以彖象列于一卦辞爻既毕之后；郑、王则分之各系其处。独乾卦尚存费氏旧第，《彖》《象》与《文言》皆在全卦经文之后，不与卦爻辞相属。\n《彖传》者，释卦辞之书也。其释之序，大抵先名而后辞，凡以明一卦之义而已。释名之据有三：曰象，曰德，曰体。三者或兼或偏，初无定例。释名之句，首出者尤要，余皆缘之而发。至其释辞，体例亦不画一：或依卦名之义而推衍之，或杂取象德体以说之，甚且名与辞牵混而难分。此不足异，卦名与卦辞本自相贯通，其义一也，故释名释辞，往往互为表里。八纯卦者，乾坤坎离震艮巽兑是也；其中唯坎一卦兼释名，其余七者所释止于辞。乾之《彖传》即不辨卦名，径就其下四字而解之。\n乾之取象为天，卦辞初未之及；孔子推天道以说乾，而其象始著。然乾之象天，非即天也。天指其形体，乾指其性。天之所以为天者健也；不息之健，即所谓乾。名二而实一。天既有健之性，故乾可为天；虽然，健之性非天所独，故乾之所象亦不限于天，而阳、父、君、马皆得而称焉。\n取象何以独取天？盖具健之性者，天为其至大，举天而众物尽摄其中。尤有进者：万物之所由始者惟天，他物虽健而非始。故孔子即以此语状乾元之盛。\n“乾元”者，一义而非二义，谓乾之元，非乾与元并列也。乾之元，即四字中之元。不单言元而必系于乾，正以见其为乾之元而非他物之元；唯乾之元，乃有万物资始、统天之效。元之训，为始为大，指物之初生而言：物非此则无所资以有其始。“乃统天”三字，虽只道一元字，而天地生物之序已尽在其中：有春之发生，而后有夏之长、秋之成、冬之藏。《序卦传》谓有天地乃有万物，与此正相表里：天地为物始，乾坤为卦祖，未有乾而诸卦可得而自生者也。\n“云行雨施，品物流形”，释卦辞之亨也。四者之中，元也、利也、贞也皆有明文可指，而亨独无专释之语；循文求义，此二语之释亨，断然可见。然此亨非泛然凡物之亨，乃乾之亨也。谓乾元既生万物，物遂入于长养之期，天道之行无不通畅，而见之于云雨、形品之间。“云行雨施”主乎气，气者物之质，故为气之亨；“品物流形”主乎形，形者物之貌，故为形之亨。物受资于天，质与形俱立，遂各依其类而分，可以按而别之。流者，如水之流；流形云者，谓自其动处观物之形，形在生生不息之中，既成而未尝凝滞。品物即万物，而不曰万物者，正欲著其分类别形之意。\n右数语皆言天道，而此三句则由天以及人。《彖传》之体，例先象与天道，而后及于人事；盖即天道以论人事，复由人事以见天道，二者本相一致，故言象言天之后，必归之于人。此三句所告者，乃人所以用乾之元亨也。“大明终始”者，欲人于乾道之终始见得分明：元非常住，必终于贞；贞非断灭，即元之复起。又当知六爻之动，一一以时为准：可潜而潜，可见而见，可惕而惕，可跃而跃，可飞而飞，可亢而亢，未尝有一毫成心于其间。六龙之变，一言以蔽之，时而已矣。明乎此，则可以“御天”。所谓御天，谓执此道以驭之，而施之于人伦日用之常。前文之“统天”，言乾具四德，一元足以统贯之，是就乾之体言；此之“御天”，则就乾之用言，谓人当执此道以施于事。\n“乾道变化”以下，若专为利贞而发，其实元亨亦在其中。盖所云者，正谓乾道之变如何而后“乃利贞”；既涉乾道之变，则元亨岂能外之？乾道、乾元，名异而实同，皆主乎变。自其变之所始言之，谓之乾元；自元递进，以至于贞，贞尽则元又生，循环而无端。乾道所陈，亦此四者相生之序，而不称乾元者，所重不在端始，而在其全过程耳。\n“变化”二字，古今异义。今人合为一词，古人则析为二：渐移者谓之变，积渐而至于改质者谓之化。“乾道变化”，历元亨之段，至是而“各正性命，保合太和”，利贞乃成，而全功告毕。\n乾道行至利之候，万物将趋于成，当此之时，物各得其所具之性命、所值之地位与其存在之价值，是谓各得其正。此利之候也。性命二字联为一词，所指则一，盖即凡物凡人所由以成其为此物此人者也。羽者、鳞者、动者、植者，其类至殊，皆缘所禀之性命本不同耳。古人析之曰：道分而命立，一形而性成。《大戴记》与《中庸》皆尝言之。命与性，本一体而两称，特所从观者异耳。所谓道，指气之流衍、生而不穷者，今人所谓自然律者是也。一者，一个、一类之谓。自其出于自然所赋者言，则谓之命；自其为此物此类所以异于彼物彼类者言，则谓之性。性者命之性，出于天而不出于人；命则寓于性中，千态万状，未可以一例齐之。\n“各正性命”云者，既许世界之统一，又许万物之差殊，信一切存在皆有其理，一切相与皆得其和。然物虽长成定形，犹未充、未熟，必更有“贞”之一境。譬如一稻，历夏日照润，已结实矣，而颗粒未满，必待培养凝蓄，至可获之候，其生长之程乃完。此即所谓贞。贞非止息之谓，正所以为后元之地；贞而不已，元乃复生。\n《彖传》释贞，取“保合太和”为说。保合者，谓也；太和者，宾也。太和是气，气者抽象之存在，目不可见，而实即物质，古人拟之为气而字之曰太和。此气者，天地絪缊所成，阴阳交会所凝，冲融而无乖戾，故被以“太和”之名。所谓乾道变化、各正性命，究其实非他，正此气之变化、此气之各正性命耳。及贞之候，则贵乎保合：保者常存，合者常和。气运不已而无所乖戾，物赖以生赖以成；至是则护持而勿失，融合而勿离，久而不散，圆满充塞，无毫发之憾，贞之谓也。即此一段，可见《易》家发展之见：于万物之差殊最所留意，于世界之和洽尤再三致意。\n“乾道变化”以下诸句，皆言天道、言自然之律；此二句乃言人之所以法天而致之用，即用《易》之事也。“乾道变化”至“乃利贞”，言乾道之利贞；此二句，则言以乾道之利贞施于人事，是人之利贞也。\n观“首出庶物，万国咸宁”之语，可知所指在治人者，在圣人，在大人物，而非庶民。有国有天下者，宜取乾道之利贞以为则，居上而物自归，不蕲宁而宁自至。庶物犹万物也。自然界中，物各正其性命，各有所归，皆乾道变化自然之效，初无主宰者存于其间，亦无须有此。移之于人事，则圣人法“各正性命”之意以“首出庶物”，为天下长而已，非以主宰自居；制作非无，然皆顺物之自然，不强人所难。此与“用九”之辞所谓“见群龙无首，吉”者正合；所谓无首，谓不肯以己据首出之名。\n然则“首出”云者，其归趣仍在“无首”也。六位之龙，其隐其显，其危其安，其腾其极，无一不系于时；非唯飞然：潜亦出也，见亦出也，六位之中，位位皆有出。其出也，顺乎天而因乎时，非有所矫拂而然。二语之指，归于一揆：皆戒夫人之自为首耳。\n“保合太和”者，“乾道变化，各正性命”之所致，即四德之贞。物至此时而成熟已极，太和之气历长久之运而圆满具足。推之于世，其理不异：圣人在上而不自表异，任万国各安其分，则争端自息，天下自和。于此可见《易》家一可注意之政治理想：所求者，社会之和洽与理性之统一也。","X":"象曰：天行健，君子以自强不息。","X.N":"右为《象传》。其目有二：“大象”统全卦而立义，次《彖传》之后；“小象”随爻而释，分系于六爻爻辞之下。二体虽同为全卦而发，其法度则迥别。\n《彖传》释名，或据象，或据德，或据体，初无定式；“大象”则专取上下二体，卦德卦体皆置不问。“大象”之立言也，专就人事，而未尝及于天道；《彖传》则必自天道推及人事。《彖传》所陈人事，主于效动趋时，各有专属；“大象”所设，则多系于先王、大人、后、君子，或与《彖传》相发，或别出一义而了不相蒙，大抵孔子借以申易理、施于人事者。\n“大象”之辞极有法度，六十四卦几同一格：前标上下二象与卦名，后示所当为与其所以为之方。其前一层，八纯卦与他卦不同，上经四纯与下经四纯又不同。上经四纯之词，体居其先：乾、坤、坎、离，所系者天行、地势、水洊至、明两作；下经四纯，则用居其先：震、艮、巽、兑，所系者洊雷、兼山、随风、丽泽。\n至于乾坤，其例又殊。他卦皆著一“重”字，明其两体相叠；乾坤则不著重，不云重天、重地。天岂可叠？一而已足，故但曰天行。地亦只一，不可得重，故但曰地势。坤曰“地势坤”，犹举卦名；乾曰“天行健”，则舍名而举德。行者，道也；天行，犹言天道。天道之要，在健。德既在健，名义相即，遂舍乾而标健焉。所谓健，谓其运而不穷也。天体之行，四时代序，昼夜相推，历年千百而未有穷已，亦未有愆忒，健之至也。君子之于健也，取以为则，故自策自励而无时或已。盖其德与天同出，无须借力于外而能自行。息者，止也；不息，即不已。所谓君子，谓有德而居位者，通天子、诸侯、大夫、士而为首；故“大象”之称君子，实赅有职之人。所云先王，盖指开国垂统者；所云后，则诸侯之君耳。","Y1.X":"潜龙勿用，阳在下也。","Y1.XN":"“小象”六节，具于此下；其体随爻为释，与《文言》之浑沦者异。然其说多疏，未若《文言传》之探赜索隐，抉发精微。此六条本当冠以“《象》曰”二字，以别于后文之《文言》。“阳”以释龙，“下”以释潜。爻辞取龙为象，其义颇奇，“小象”虑读者不解，故曰“阳在下”，明爻辞所云之龙，实指阳气；阳气未出地上，犹伏于地下也。\n《易》之卦爻辞，未见阴阳二字。“阳在下”见于乾之初，“阴始凝”见于坤之初，阴阳二字于是始入于辞。名既立，则刚柔、健顺、动静、尊卑、大小、奇偶、进退、往来之属，皆由是而显矣。","Y2.X":"见龙在田，德施普也。","Y2.XN":"见，读为现。田，谓地之表。施，犹今语所谓影响。阳气昔伏于地中，今已腾出地表而昭然可见；虽未及乎跃与飞，然阳既在田，圣人既出，天下之人自必普受其化。","Y3.X":"终日乾乾，反复道也。","Y3.XN":"昼则乾乾不已，至夕犹怀惕惧，不肯以一息自宽，此何义也？是即所谓“反复道”也。三之位，居二体之介，其途有二：可上可下。其动不出二途：由高趋下为反，由下跻上为复。两途循环，所履者一辙而已。易道之变，千转万移，而非漫无纪律，究其极，亦往复于斯道耳。自然之象，足以显此义者，莫如昼夜之代。君子终日乾乾，朝惕夕厉，亦犹盘旋此道而未曾止息。","Y4.X":"或跃在渊，进无咎也。","Y4.XN":"四之位，当二体之交，进退未有定也。其辞曰“或跃在渊”，则或腾而去，或留而处，二者皆听其自择。然其位宜于有为而进，故“小象”曰“进无咎”。爻辞虑其不量时宜而躁进，乃著一“或”字以存疑。","Y5.X":"飞龙在天，大人造也。","Y5.XN":"“小象”之例，以“大人”当爻辞之“龙”，以“造”当爻辞之“飞”；所谓“大人造”，犹云飞龙之在天也。九五之大人与九二异：九二具君德而无君位，九五则德与位兼之。至其云“造”，则谓体乾之健，不循细行，而措施及于天下，圣人分内之事也。","Y6.X":"亢龙有悔，盈不可久也。","Y6.XN":"自初九潜藏以至九五飞天，爻进而善亦进；及乎上九而亢，亢者过也，亦盈也。不独境遇亢，其心亦亢。善既过度，则必趋坏，此“有悔”之所由。“有悔”兼二义：一则其势将坏，一则其心知悔。","Y7.X":"用九，天德不可为首也。","Y7.XN":"揲蓍之际，乾之六爻若尽得九而无七，则九为变爻，当化而为六，全卦遂转为坤。是乾也而将变坤，既变坤而实未尝离乾，此即所谓“用九”。六爻皆九，故谓之天德。天德者，至粹至纯，无纤芥之疵，善之极而无以复加者也。其为德也全，其为准也无偶，不若刚柔仁义之倚于一偏；唯其无偶，故不能为首。譬诸动静阴阳，互为始终，孰先孰后，本不可分。“用九”既是天德，又当乾坤递转之会，其不可为首也明矣。人之处此，慎勿自居人首。自居为首，人反不以为首；唯不自居，乃能实为人首。然此唯具天德者能之，寻常庸众，固未足与论为首与否。","W1":"文言曰：元者善之长也，亨者嘉之会也，利者义之和也，贞者事之干也。君子体仁，足以长人，嘉会足以合礼，利物足以和义，贞固足以干事。君子行此四德者，故曰乾元亨利贞。","W1.N":"自“《文言》曰”以下迄于篇末，皆《文言》之文。《文言》为十翼之一。十翼之中，独乾坤二卦有此，他卦无之。其故盖在乾坤为《易》之缊、之门户、之根柢，六十二卦莫非自二卦而出；以其关系至重，故不惮反复申说，且借以为学《易》者之式，使人知读《易》当如是。至“文言”二字之义，刘瓛谓依文而言其理，故以立名，是否果当，未敢定也。要之，《文言》者，专为释乾坤而作。其中屡见“何谓也”“子曰”之文，疑是孔子答弟子之问，而弟子录之，与《论语》之体裁正相似。其书虽非孔子手笔，而所陈之义必出于孔子，即径以为孔子之作，亦无不可。\n上所引者，穆姜之辞，《左传》襄公九年载之。穆姜之为此言，先于孔子之生。孔子为弟子讲“乾元亨利贞”，举其语以相证，弟子因录之。穆姜所言，大抵当世通行之旧说，非其一人之创解。于此可见以义理解《易》，其来甚早，孔子之前已有之；而孔子《易传》所发挥者，本书中所固有，非凭虚而造。然则《易传》之义，固在《易》之中，亦在孔子之身，两面俱可说得。\n“元亨利贞”四字，初时或一见而可解；自周初以至春秋，历时二百余年，至是乃须疏说，穆姜之论由是而作。其后穆姜之语亦渐不可晓，注疏之事又起。元者，始也，大也。凡善之所自起，皆得谓之元，故元为众善之长。春者，善之长之最著者也，万物之生，未有不自春始。亨者，通也；嘉者，美也。美之会，犹言美之聚。物既春生，至夏而盛茂，凡善之美者，皆会聚于斯，是为亨。利者，收敛而成熟也。秋至而物敛而成，其气肃杀；然肃杀之中自有宜者在，是之谓义。义之和云者，谓虽当肃杀，而物各有所归，秩然而不乱。以人事言之，利者天下安恬之候，人人各止其所，各修其职。贞者，正而固也。冬则生息闭藏，万善至是而究其成。以人事言之，贞者人之脊干，事之所赖以立者；譬之人身，有定向而不移，有定守而不夺，是也。\n“君子体仁足以长人”以下四句，乃就君子之修养言，与天之四德相配而为说。天有其四德，人亦有其四德。见于天者，四时代嬗是其验；见于人者，仁义礼智当其目。元之在人曰仁：君子以仁为体，凡立身行己，一以仁为本。仁者百行之首，唯体乎仁而以之为先，故能长人，为人之长而统之，此“体仁足以长人”之说也。亨之在人曰礼：礼之为数，至三百三千之繁，而条理秩然，与万物之嘉美会聚者适相类，故曰“嘉会足以合礼”。利之在人曰义：物各得其宜而后和，故曰“利物足以和义”。贞之在人曰智：智者事之干也，守正而不迁，固执而不去，故曰“贞固足以干事”。“君子行此四德者，故曰乾元亨利贞”者，孔子既引前人之说，乃自下断语：谓君子者，行仁义礼智之人也；乾道虽深微难测，人能行此四德，则谓之元亨利贞矣。由孔子此断观之，《易》固兼言天道与人事，而所归终在人事。\n“君子”一称，随世而变，非有定指。其初盖为一阶级之名：诸侯之子谓之公子，天子之子谓之王子，则君子者，君之子也，其为贵族、为治人者，不待辨而明。其相对者，则劳力之小人也。孔颖达则以为居上临民、爱民如子者之通称，自天子以至有采之大夫，皆在其列；是亦以君子归之治人者。然此特得其一偏耳。其后世变，君子于阶级之义之外，复有品格之目：德厚者谓之君子，德薄者谓之小人。《论语》所记“固穷”之叹，正为君子言之；若小人，则一穷而无所不至矣。若君子果专指有位者，则“固穷”之语无所施：有位之人，何由而穷？然则君子之名，兼德与位而言，二者不可偏废，而德尤为本。","W2":"初九曰潜龙勿用，何谓也？子曰，龙德而隐者也。不易乎世，不成乎名，遯世无闷，不见是而无闷，乐则行之，忧则违之，确乎其不可拔，潜龙也。","W2.N":"自此以下，乃就君子观乾之象而以之施于修身者，反复言之，其详且尽如此；质言之，即教人所以学《易》之方也。乾坤二卦之《文言》为此，实欲为后之六十二卦立一楷模，使学者知卦爻之辞虽简，而所含至富，苟徒求之字句之间，必无由入。观乾《文言》之于君子修养再三申说，可知《易》虽兼天道与人道，而其用心终在人道一边。以下多用弟子发问、夫子作答之体，条理分明，大较不难通晓。\n“初九潜龙勿用，何谓也”一节，专释“勿用”之义，语语属人事，未涉天道。“勿用”者，隐也。隐非易事，常人不能；能之者必其有龙德者乎。孔子意中之怀龙德者，君子、大人乃至圣人是也，然亦不尽以此自限，常人而修龙德，固未尝不可。隐之一字，最易招误，人每以为见弃于时、不为世用，故孔子推明之：连用三“不”字、两“无”字、两“则”字，以见隐者非时不我用而我不获用，乃明知时之不可为，遂不为耳。其间“遯”字最要，隐之实，即寓于遯。\n“不易乎世”，遯之初境也，犹为浅层，然亦不可少：必其志其说，不为流俗所摇，邦无道则至死不贰，不肯与世浮沉，而后“不成乎名”可几。“不成乎名”，乃真遯也。到此地位，正如《庄子·逍遥游》所记宋荣子：天下尽誉之而不足以劝，天下尽非之而不足以沮；毁誉在人而不在己，斯为真隐。夫隐遯亦可以得名，而必“不成乎名”者，正以其所为遯者，非欲洁身自好、以清高自标也。\n遯世已难，“遯世无闷”则尤难。遯则孤立于世而人不知，在常人最为苦事；而有龙德者自信不疑，行之如常。“不见是而无闷”，更进一境：遯世犹龙之蛰，人尚知其龙也；今则并其是否龙而不可辨，谓之鱼亦可，谓之蛇亦可。如此而心无所动，其去忘我也几希，疑若与老庄清静无为之教同归。然观下文“乐则行之，忧则违之”二语，则断非道家之说。所谓乐，己心以为乐；所谓忧，己心以为忧。行者，为之；违者，不为也。可乐则出而有为，可忧则伏而无所为，终不肯枉道以徇人。此志坚定，“确乎其不可拔”，非外力所得而夺。是入世之怀，与出世之学迥不相侔。要之，隐非逃世，乃审时也；时可则为，时不可则止。龙德之隐，非以自洁，实以存道于己，待时而后动。后世山林之士，避世而不与事，与圣人之隐，相去远矣。此其所以异也。","W3":"九二曰见龙在田，利见大人，何谓也？子曰，龙德而正中者也。庸言之信，庸言之谨。闲邪存其诚，善世而不伐，德博而化。《易》曰见龙在田，利见大人，君德也。","W3.N":"九二之于初九，同具龙德，而所处之时不同，故其修于己、施于世者亦异，非可以一概而论也。总而论之：九二已去乎隐，而未及乎跃，正当乍见于田之候。六爻莫非龙德，而九二所独者，在得中。谓之“正中”，所重仍在其中。二位属阴，九为阳爻，以阳居阴，于正为不得；然以其处中也，中之为贵，于《易》为最，既得乎中，虽不正亦可以正许之，故曰“正中”。九五亦处中，而五位为君，故德与位兼焉；九二得中而未得位，其德同乎君，其分则臣也。\n庸者，常也。言之常信，行之常谨，谓平居言语必出于实，举动必循乎节。闲者，圈马之栅，所以禁马之逸，亦所以拒兽之入。“闲邪存其诚”，谓外邪不得干于内，而中所固有之诚守而不失。《易》于诚字最所重，以为百行所自出；心苟不诚，则无复可言者矣。唯能闲邪而存诚，故其言可复、其行可法。《易》家以阳为实、阴为虚：实者近诚，故乾之九二言诚；阴虚而后敬心生，是以坤之二爻其辞主敬。诚敬异名，其义相邻：诚者未有不敬，敬者未有不诚。言诚则敬自在其中，言敬则诚亦不能外。\n伐者，自矜其能之谓。虽有益于天下国家，有造于斯民，而不伐其德，不居其功。德博者，其施普，其及远也。化者，教而移之之谓。“德博而化”，谓能化乎物。所谓化，与上言“善世”者无二义；“善世”犹云兼利天下。能化人者必先自化，能善天下者必先善其身。必也出言有恒、制行有常、防邪存诚、济世而不自伐，四者备，然后“德博而化”可言。“君德也”一语，含二义：其一，如上所云自化化人、善身善世之德，本大人之事，非人人所能；其二，九二之身，即具君德之大人也。大人非别有一人，九二虽无君位，而君德固在。","W4":"九三曰君子终日乾乾，夕惕若厉无咎，何谓也？子曰，君子进德修业。忠信所以进德也。修辞立其诚所以居业也。知至至之，可与几也；知终终之，可与存义也。是故居上位而不骄，在下位而不忧，故乾乾因其时而惕，虽危无咎矣。","W4.N":"九三位居下体之上，君德之发见也已久。今既处此危地，其所当事者何事？曰：终日乾乾而不已，勤勉相继而无所间断而已。所勤者何？孔子之对，不外进修德业四字。进德与修业，非二事，乃一事之两面。不可分进德为品行、修业为业务：进德固德，修业亦德。盖进德者，所以治其内；修业者，所以著其外，内治而后外见也。\n“忠信所以进德也”者，进德之基，一出于忠信；能忠信而后德可进。所谓进德，谓此心有向往之志、有日新之机，今日胜于昨日，明日又胜于今日，非徒托之空言，必有其真实者在。忠信云者，实而已矣，真而已矣。譬如播谷：种入于土，宜其日日生长以至于萌芽；然必所播者真是谷种而有生意，否则自始便无从说起。此就内而言也。\n其著于外者，则当“居业”。居者，守而不失之谓，非暂有而旋去也。业亦德也，特德之见于外者耳。合而言之，居业者，守之而不已也。不为俄顷之辍，朝如是，夕亦如是。居业之要，惟在立诚于辞。修辞犹言修其辞令。人之著于外者多端，何以独举辞令？盖言语最足达意，而人顾最易轻之，以为信口而出，无关于得失，故特举以为则。所谓立其诚，即前所谓忠信者是。出言必一字有一字之实，一句有一句之实，不容纤毫假借；口之所宣，即心之所存，表里如一面后已。此之谓立其诚。\n修业、居业，先后异辞，其义岂有二乎？其实一也。业者，德之形于外者。称“修业”者，主于进；称“居业”者，主于守。德之日新，进之说也；德之久存，守之说也。德之进也，贵乎日新；一日不进，则退矣。然进非冥行，必有标的焉，而后趋之，是谓“知至至之”。“知至”者，心知其所欲至之地也；“至之”者，为之而求其至也。此句之要，在一“知”字，知者，自觉之谓。人于未为之先已有此自觉，则去其至也不远矣，故曰“可与几也”。\n居业亦即守业。忠信素存于中，斯其辞可立；而“修辞立其诚”之难，不在始而在久，今日如是，明日亦如是，终身如是，是谓“知终终之”。“知终”者，知其事之当终吾身而行之也；“终之”者，既知之则实行之，不徒知之也。此句之要，在一“行”字，行者，力行之谓。人能终身守此而不变，则“可与存义”矣。存义云者，守义而不失，使“知终终之”之意常存于心也。\n以上皆释“君子终日乾乾夕惕若”。“是故”以下，则释“无咎”。三居内体之终而外体之始，故兼“居上位”与“在下位”之称。处上而惕，故无所骄；处下而惕，故无所忧。乾乾而因乎时，是以处上处下皆得其安，骄与忧两无所施，危地亦可以无咎。","W5":"九四曰或跃在渊无咎，何谓也？子曰，上下无常，非为邪也；进退无恒，非离群也。君子进德修业，欲及时也，故无咎。","W5.N":"三“释”之文，各有所属：“上”与“进”，“跃”之事也；“下”与“退”，“在渊”之事也；“无常”“无恒”，则“或”字之解也。末三语者，又推言其无咎之由也。此爻所争，一“时”字耳。时可上可进，则上焉进焉；时可下可退，则下焉退焉。一随乎时，而不可豫必。君子之当九四，固当如是。然究其归，终以能上能进为是：盖九四进德修业，惟恐后时，故当上即上，当进即进，而无咎也。","W6":"九五曰飞龙在天，利见大人，何谓也？子曰，同声相应，同气相求。水流湿，火就燥，云从龙，风从虎，圣人作而万物睹。本乎天者亲上，本乎地者亲下，则各从其类也。","W6.N":"此七句之纲领，在“圣人作而万物睹”一语。“圣人作”，释“飞龙在天”；“万物睹”，释“利见大人”也。“同声相应，同气相求”六句居其前，皆言同类之感，正以明圣人既作而万物毕睹、天下所以利见之故。九五兼具君德与君位，六爻之中斯为最盛。\n作者，兴起也；物者，人也。圣人兴起于上，众人莫不仰之、就之，受其导而听其教。“本乎天者亲上，本乎地者亲下”，则又推而广之，言两间同类相感之理，其归仍为此二语作解。其在物也，本天者动物，本地者植物：动物之首无不向上，草木之本无不在下。禽兽之头多横生，唯人头真正在上，故其所指，实以人类为言。圣人者，亦人耳；其出也超乎其类，故众心悦而附之。与首上足下之性无以异，皆类之相召也。","W7":"上九曰亢龙有悔，何谓也？子曰，贵而无位，高而无民，贤人在下位而无辅，是以动而有悔也。","W7.N":"“六位时成”，亢亦六龙之一位也；而曰“贵而无位”，何也？上九处一卦之至高，位可谓贵矣，然非君非臣，于政治上初无所居，故虽贵而无位。高而居上，宜为众所归，乃众莫之归焉，是无民也。贤人指九五以下诸爻。贤非无人，且皆在其下，然而不肯为之辅。贵而无位，高而无民，贤人在下而不助，其势至孤，故动则未免于悔。亢龙之时，本不宜动；然人不能终不动，动则悔随之。悔者，过之谓也；有悔，则知其过而又能改，改则事犹可转。此上九之所以终不至于凶也。","W8":"潜龙勿用，下也。","W8.N":"孔子之于乾六爻，玩之也熟，索之也深，《系辞传》所云居则观象、动则玩辞者，正此之谓。然其意不徒自玩而已，盖将示读《易》者以法，使知六十四卦皆当如是读也。《易》之与《书》《诗》异：《书》《诗》之文，一字一句皆有定诂，循训故以求之而可尽；《易》之卦爻辞则不然，其词游移而无定准，或兼数义，或意在不言，训故之术有时而穷，必反复玩索、优游揣摩而后得之。“潜龙勿用，下也”者，谓乾之初爻所以宜勿用，以其居一卦之下，未可以有为也。","W9":"见龙在田，时舍也。","W9.N":"“见龙在田”，龙始出地，其用未畅，以其时之未至，犹有所舍而未遑也。当是时也，有君德而已，未有君位。","W10":"终日乾乾，行事也。","W10.N":"九三终日乾乾，何为乎？曰：行其事也。曰：行其所当行而已。所当行者，修其德业而不敢自息也。","W11":"或跃在渊，自试也。","W11.N":"“试”者，所以释“跃”也。跃可，处渊亦可，然终以能跃为归。时可跃与否，非他人所能代断，必自己尝试而后知之。","W12":"飞龙在天，上治也。","W12.N":"九五德位俱隆，盖有国有天下者之伦也。故其治非一方一隅之治，乃最上至极之治。","W13":"亢龙有悔，穷之灾也。","W13.N":"上九处一卦之末，龙已亢极，积而至穷矣。物之穷者，势不容不变；既变乃通，既通乃久。穷且将化，故必有悔以求其变；不尔，灾至焉，故曰“穷之灾也”。","W14":"乾元用九，天下治也。","W14.N":"此语之“治”，非一室一人一方之治，举天下而皆治之谓也。其为治乱之治，与上“上治”之治有别：九五不过一爻，故曰“上治”，谓以在上之位治在下之人耳；用九而系于乾元，则六爻咸在其中，故曰“天下治”，谓举天下而无不治也。\n上之七条，就人事立说；下之七条，改而以时言。初九之时，阳伏于下而未出，故其辞曰勿用。九二之时，天下向明，故其辞曰在田：气闭则幽，光发则朗；阴以晦敛为体，阳以昭著为用，二爻阳德外见，故有向明之象。九三则与天同运：天行一昼夜而周，未尝止息；九三自朝至夕，乾乾不息，亦未尝止息，故曰偕行。九四则当改革之会：革者，改也。下乾至三而尽，上乾自四而始，两体相接，正在改弦之际，故谓之乾道乃革；此以爻位之次言其取象也。九五之位，德与位称：徒有其位而德不副，则所位者天位而已；德称其位，则天德之谓也。\n上九则时已至极：九三随时而进，故虽危无悔；上九与之俱极，极则穷，故悔。六位之属，两两相配：始在初与四，初潜而四跃；六位之中，惟二与五得中：二处内体，其德为文明；五处外体，其德为天德。二者皆以中而重，非以位之尊卑为轻重也；终者三与上：三能随行，上则同尽。用九而系于乾元，天则于是可见：则者，法也，自然之律也。六爻尽变，乾且为坤，是天道有变非常也。然其变也有节，不逾不过，四时代谢各限其度，冬尽春来，终则有始，莫知所首。四德终始相生，贞穷则元复起，此正天道之节，故其辞曰乃见天则。","W15":"乾元者，始而亨者也。利贞者，性情也。乾始能以美利利天下，不言所利，大矣哉。","W15.N":"此段于卦辞四字重加申说。前文之《文言》多主人事，故元亨利贞析为四德而分言之；至是则由人而返于天，故又合四者而为一说。“乾元”者，举一元以贯四德也。凡此二始，其义皆元也。\n卦辞所谓乾元，果何所指？孔子曰“始而亨者也”。乾元非别有一物，即气之始而亨者耳。亨者，通而长之谓。至所谓利贞，则又非别有一利贞存焉，乃乾元之性情也。何以明之？即以其所能者为验。以时譬之，乾元其犹春乎：春为一岁之始，元亦万物之始。元既为物之所始，则举天下之物而皆利之，无有一物不蒙其泽者。而卦辞“不言所利”，第言利而已，不著其所利之目，正以其所利者至广，包乎两间而无遗；苟指其所利为何物，则范围立隘，而无所不利者反有所限矣。\n“利贞者，性情也”。性情何谓？性情既属之乾元，则所以状之者，健之一字而已。健为其性，其发见则为情。《易》之并言性情，自此始也。性与情，其实一物：自其静者观之谓之性，自其动者观之谓之情。物之生也以春，其始也以元，由是而有动，动极而敛，敛而归于藏，复反于静；贞讫而元又生，静极而动复起。终则有始，循环而不已，生生之机无时或息。若第言性而不言情，则是有贞而无元，有静而无动，止而不行，其去生生不息之健也远矣。","W16":"大哉乾乎，刚健中正，纯粹精也。","W16.N":"乾德之盛，孔子以六字尽之，曰“刚健中正，纯粹精”。六画纯阳，故其德为刚健。“中正”二字，实全《易》之要领，而首发于乾。中者何指？二处内体之半，五处外体之半，皆得中者也；然得中者未必皆正。阳居阳、阴居阴则正，反是则否。乾之九二，阳而居阴，非正也；九五，阳而居阳，正也。故乾卦之中正者，独在九五；九二则中而不正。凡卦必有一爻为之主，乾之主即九五，“刚健中正”四字，正指此爻。\n《易》三百八十四爻，得中者百二十八；百二十八之中，中而且正者六十四，中而不正者亦六十四。此六十四者之内，独乾之九五为刚健中正，盖纯乾之中正也。他卦虽亦有中正，而非纯乾之比。四字虽备，犹不足以尽乾德之妙，故更益以“纯粹精”三字。纯者，二体相重而其气不杂之谓，八纯卦足以当之；粹者，六画之阴阳不杂之谓，乾坤二卦足以当之。乾坤兼纯与粹，他六纯卦则纯矣而未粹。精者，纯粹之至，“纯粹精”云者，纯粹而又纯粹，无可复加之称也。","W17":"六爻发挥，旁通情也。","W17.N":"“六爻发挥”，所发挥者何？即上所云刚健中正、纯粹精者是也。“旁通情”者，谓六爻并作，而乾之义无所不通、无所不尽也。","W18":"时乘六龙，以御天也。云行雨施，天下平也。","W18.N":"六爻之中，唯九五为乾之主；乾之所以为乾者，皆于是乎具。六爻之德，皆统于九五：若潜、若见、若惕、若跃、若飞、若亢，莫非九五之德之散见者也。九五居高位而总六爻，其象为飞龙在天，足以概一卦之全。所谓乘六龙，谓以时为衡，驭此六爻：潜也见也，惕也跃也飞也，一随乎时而无容心焉，此天道自然之节也。龙飞于天，则云行雨施，阴阳和洽，膏泽下被，而天下康宁。乾元利泽之及于天下者，即此可见。","W19":"君子以成德为行，日可见之行也。潜之为言也，隐而未见，行而未成，是以君子弗用也。","W19.N":"前之所释犹有未尽，此复推而广之；此段则释初九也。成德者，德之已成；行者，德之著于动作。君子必其德完满而无亏，然后可以有为、可以有行。德与行非二致：蓄于中而未发者德也，发于外而可见者行也。初九既已成德矣，德既成，则日见诸行事可也；而爻辞乃曰潜龙勿用，戒其勿有为、勿有行，何哉？盖以其时当潜也。潜之为言，隐而未显；隐而未显，则行未有成；行未有成，即德之未成为也。质言之：初九处潜之时，宜隐而不宜见。","W20":"君子学以聚之，问以辨之，宽以居之，仁以行之。易曰，见龙在田，利见大人，君德也。","W20.N":"此段言九二。九二之龙，出地而见于田，位则臣也，德则君也。所谓君德，其目有四：学也，问也，宽也，仁也。学以聚之者，博涉多闻，凡所当学，尽取而无遗。问以辨之者，既聚矣，则质诸闻见更广之人，以正是非、别精粗。宽以居之者，宽谓器量宏阔，从容而不迫；既有学以聚之、问以辨之矣，则所以容之者，非宽不可；宽则众流并入而不相碍。仁以行之者，学聚问辨之后，尤贵有容，终之又在乎行；行之事，一以仁为归。仁于四德为长，而亦兼乎四德，人能乎仁，其余可次第而及。九二之君德，虽曰天资，实由学问而成，非生而具之者；而其用力之地，则全在体仁、行仁而已。","W21":"九三，重刚而不中，上不在天，下不在田，故乾乾因其时而惕，虽危无咎矣。","W21.N":"三之体，刚爻而刚位，两刚相比，重刚之目由此。六位之中，二五得中，三则失之，故系之以重刚而不中。三处三而不处五，是“上不在天”；处三而不处二，是“下不在田”。此二语，究其实仍是言其不中。要之，九三所居，乃危惧之地。虽处不安，而能顺时以自安，朝夕兢惕，故危而不及于咎。","W22":"九四，重刚而不中，上不在天，下不在田，中不在人，故或之。或之者，疑之也，故无咎。","W22.N":"“重”字于九四无取：以阳居阴，非刚之重也，疑是衍文。其“上不在天，下不在田”，与九三同，唯多“中不在人”一语。位有天人地之别：上二爻属天，下二爻属地，中二爻属人。三、四同居人道，而其中又有辨：九三近二而远五，犹不失为人之正位；九四则近五而远二，上邻于天而下远于地，非人所宜居，故曰“中不在人”。合观数语，九四刚而不中，与九三同其类。然三居下位，力欲上进而势阻，故危大而忧深；四则位逼于五，阳气浸盛，上达不难，所难者独在进退两端未能骤决耳，故其忧浅。盖居近君之地，去就可否之间，正宜审而后动；此九四之所以异于九三也，学者当细辨之。“或跃在渊”之“或”，疑辞也。唯能疑，是以无咎。此疑非狐疑之疑，乃两可之际不遽决断、而从容审度之谓。\n“夫大人者”以下，则言九五也。九五是乾之主，乾之德毕萃于此。九五者，有君德而又有君位之大人；大人而具天德，其修养可谓至矣。其心之所存、身之所行，合于天地，合于日月，合于四时，合于鬼神。此语似不可解，而实无足怪：彼固知天命者也，亦从心所欲而不逾矩者也。天命即自然之律。既深知之，又能顺之，则于律之中得其自由，固非异事。其能合者无他，刚健中正、纯粹以精，本与自然之律相通故也。此处之鬼神，非祷祀之鬼神，谓造化之迹，即自然律之效用；吉凶者，成败得失之别名耳。\n自“先天”以下，则又见其动作为天人鬼神所共与。先天而天弗违者，行未有前例之事，创人所未为，而天道不与之相违也；质言之，大人之德与天为一，故其所为，天不能违。后天而奉天时者，事为时势所迫、不容已者，而亦未尝不合于律也。天犹不违，人其违之乎？此所谓人，非一人之身，乃众人之群，即人类社会及其律也。质言之：乾九五之大人，其行事既合于自然之律，亦合于社会之律。","W23":"亢之为言也，知进而不知退，知存而不知亡，知得而不知丧。其唯圣人乎，知进退存亡而不失其正者，其唯圣人乎。","W23.N":"此释上九“亢龙有悔”之“亢”。亢者，过之谓也。凡物之理，皆有两端：进固善，进而过则反为退，有进必有其退；存固善，存而过则反为亡，有存必有其亡；得固善，得而过则反为丧，有得必有其丧。乾至上九，龙而至于亢，此势之所必至、理之所固然，非人力所能避也；然人能知其理，因而顺之，则可以不至于害。顾知之极难：人当亢时，未有不志得意满而忘返者。当进而预虑其退，当存而预虑其亡，当得而预虑其丧；进退存亡之际，权之而各当其分，此唯圣人能之，常人固不逮也。","Z":"《周易》者，有周一代之《易》也。其与殷易之称为《归藏》、又称《坤乾》者，根本之异，在先后之序：殷易坤先而乾后，《周易》则颠倒之而为乾先坤后。此一倒置，实社会意识变迁之表征。\n坤之居首，殷道亲亲之验也；乾之居首，周道尊尊之验也。亲亲者重血胤，故其继统也重母而传弟，足见殷世氏族之制犹盛；尊尊者重名分，故其继统也重父而传子，足见周世阶级之制已固。自亲亲而之尊尊，此历史上一大变革，而《周易》载之；其书之中，最能见此事者，无过乾之居首。故读《易》者，观其首卦，而一代之政教可知已。\n乾为六十四卦之一，六画皆阳，所谓“阳之纯而健之至”者也。其有自身之性质、特点与意义，与他卦同；而其位则与他卦异，于六十四卦中最为特殊，为“阴阳之根本，万物之祖宗”。六十二卦皆自乾坤出，故《系辞传》既以门户喻乾坤，又以衣缊喻乾坤。盖以《易》为效天而作，所载者天行之肖；其所以力言乾坤为诸卦之祖，实由其宇宙观所定。其意以天地为万物所自出，故谓有天地乃有万物，而两间所充塞者莫非物。至天地之所自出，则置而不问。乾坤与诸卦，非并列之数，实本末之相属也。此其宇宙观，虽朴而未为不确；盖其言天地万物之序，不假神道为说，而一准于自然，亦先秦言天者之通义也。\n乾与他卦同，皆合经传二部而成。经者，卦名、卦画、卦辞、爻辞是也；传者，《彖传》《象传》《文言传》是也。《象传》又分大小二体，《文言传》则唯乾坤有之。乾以六阳成体，纯阳而健之至，故其名曰乾。自《彖传》与“大象”观之，乾取象于天；而卦名不作天而作乾者，盖卦名所以表其性、著其义，不所以标其象。取象者，达意之具也；卦之所重，在其性质与含义，不在其象。乾之所以为乾，健而已矣。全卦所讲，一健字也。自卦名以至爻辞，无一语离乎健者。天于众物中最足见健，故取以为象；健为其实，天特其象；名既取实，故舍天而称乾。\n乾之卦辞，四字而已。乾字之义为健，健者，动而不息、变而不穷之谓。合而言之，乾即健；析而言之，则元亨利贞。四字者，正以状天之动变。古人所言之天，其实指日，可谓天即日也。《郊特牲》谓祭天以日为主；《魏相传》亦言天地之变由于阴阳，而纪阴阳者日也。日之运行——实则地之运行，日固未尝动也——致寒暑之推、四时之代。故古人以四时释此四字：元为春，亨为夏，利为秋，贞为冬。贞尽而元复起，冬去而春复来，循环无端，而健之状乃尽见。故元亨利贞者，非四事也，一岁之四节耳。\n乾之卦辞取象于天，其六爻乃取象于龙。卦辞爻辞取象之异，乃六十四卦之通例，大率如此，盖由卦与爻之体不同而然。王氏论卦爻之别，谓卦举一代之纲，爻则随世而迁。卦主一时，未出乎其时者，皆具其时之性；乾之性为健，凡属乾者皆健，就此而言，卦为相对之定，静者也。六爻自下而叠，爻各当一时中之一位，故爻为相对之变，动者也。一静一动，取象自不宜同：卦静，故一象足矣；爻既主变，则一象不足以尽其用，故多取焉；纵六爻同象，其象亦当有动静可指。\n乾既取象于天，天固足以见健矣；若六爻亦取象于天，则六爻徒有健之同，而无各爻之异。爻而无异，则爻之所以为爻者亡。故卦象天而爻象龙。六爻所寓，不过气之消长与君子之出处；状之者必取于龙，以其出于意造，可潜可飞，非实物所得限也。龙为阳物，而变化不测、灵异难知，以龙之动状六爻之动，最为切合。天能见健，龙则不徒见健，且能见健之变。卦爻取象之不同，益见卦性之一定——乾终古为健，无时不然——而爻象之无方：乾可为天，亦可为龙。读《易》者，其毋执象以为实，毋谓甲之必象乙。此其所以异于他卦者，非好为奇也，势有所不得已耳。\n乾之传，首《彖传》。彖者，释卦辞者也，其体通常有二：一释卦名，一释卦辞。八纯之卦，例不释名，直释其辞。释辞之据，或德，或象，或位，有兼三者，有取其一二者；而乾独三者咸备，故其文最富。乾之《彖传》首言天，是据卦象为说；继言六位以时而成、乘六龙以御天，明六位之中九五为尊，处天位而备六爻之德，是据卦位为说。就其内容观之，《彖传》每杂象与天道而言，而以人事终篇。可见卦之所象皆属天道，而语天道者，正欲落于人事。乾之《彖传》即其例也。\n乾《彖传》所含哲理至富，而“乾道变化，各正性命，保合太和，乃利贞”一段尤可玩味：其言万物由元亨以进于利贞，言利贞之为境，而提出万物经乾道之变而各正其性命、保合太和之说。“性命”一辞，古人释者甚众，多入烦碎；其实谓凡物各有所据以成其为此物者耳。“各正性命”，则既许万物之同，又许万物之异：两间之每一物，皆有其生成存在之理、之值、之意，各自生，各自长，各自尽，无一超然者主宰于其上。即此可见《易》与宗教异趣。物不徒各正其性命，又各能保合太和。“保合”为动辞，所保所合者，太和也。太和者何？阴阳二气之交而适相和者也。物之敛而成熟者，莫非二气交畅之所为。屡以物之成归之于二气之交畅，可见其于万物内部之和、之一，三致意焉。《易》言万物各正性命，各得其宜而不相害；言万物保合太和，中涵阴阳冲和之气：所摹写者，一生机洋溢、和气充盈、和而有别、一而不齐之世界。儒家贵和之旨，乃至中国传统文化贵和之思，其源盖出于此。\n乾于《彖》《象》之外，又有《文言》。《文言》者，发《彖》《象》未尽之蕴，多端多层以释卦辞爻辞；后之坤卦亦然。卦爻之辞、《彖》《象》之传，固已明白，而孔子必别为一传，反复申之，其意殆欲使学者知卦爻之辞至活，自不同之角度、不同之层次观之，可有不同之解，当细玩而徐绎之。若执一义以为尽，谓此外别无所有，则终身不能知《易》。孔子之详析乾坤，正为学《易》者立一范，使于其余六十二卦，皆以此法求之。六十四卦之读法，盖尽于此矣。凡此皆所以示人读《易》之法，非徒为一卦发也；善学者由是推之，则六十二卦之理，皆可循途而至。"}},"02":{"id":"02","cnNum":"〇二","name":"坤","pinyin":"kūn","fullName":"坤为地","shortFullName":"地地坤","upper":"坤","lower":"坤","upperNature":"地","lowerNature":"地","lines":[0,0,0,0,0,0],"yaoLabels":["初六","六二","六三","六四","六五","上六","用六"],"blocks":{"G":"坤，元亨利牝马之贞。君子有攸往，先迷后得主，利西南得朋，东北丧朋，安贞吉。","T":"彖曰：至哉坤元，万物资生，乃顺承天。坤厚载物，德合无疆，含弘光大，品物咸亨。牝马地类，行地无疆，柔顺利贞，君子攸行。先迷失道，后顺得常。西南得朋，乃与类行；东北丧朋，乃终有庆。安贞之吉，应地无疆。","X":"象曰：地势坤，君子以厚德载物。","Y1.T":"初六，履霜坚冰至。","Y1.X":"象曰：履霜坚冰，阴始凝也。驯致其道，至坚冰也。","Y2.T":"六二，直方大，不习无不利。","Y2.X":"象曰：六二之动，直以方也。不习无不利，地道光也。","Y3.T":"六三，含章可贞，或从王事，无成有终。","Y3.X":"象曰：含章可贞，以时发也。或从王事，知光大也。","Y4.T":"六四，括囊，无咎无誉。","Y4.X":"象曰：括囊无咎，慎不害也。","Y5.T":"六五，黄裳，元吉。","Y5.X":"象曰：黄裳元吉，文在中也。","Y6.T":"上六，龙战于野，其血玄黄。","Y6.X":"象曰：龙战于野，其道穷也。","Y7.T":"用六，利永贞。","Y7.X":"象曰：用六永贞，以大终也。","W1":"文言曰：坤至柔而动也刚，至静而德方。后得主而有常，含万物而化光。坤道其顺乎，承天而时行。","W2":"积善之家，必有余庆；积不善之家，必有余殃。臣弑其君，子弑其父，非一朝一夕之故，其所由来者渐矣，由辨之不早辨也。《易》曰“履霜坚冰至”，盖言顺也。","W3":"直其正也，方其义也，君子敬以直内，义以方外，敬义立而德不孤。直方，大，不习无不利，则不疑其所行也。","W4":"阴虽有美含之，以从王事，弗敢成也，地道也，妻道也，臣道也。地道无成而代有终也。","W5":"天地变化，草木蕃；天地闭，贤人隐。《易》曰“括囊无咎无誉”，盖言谨也。","W6":"君子黄中通理，正位居体，美在其中，而畅于四支，发于事业，美之至也。","W7":"阴疑于阳必战，为其嫌于无阳也，故称龙焉。犹未离其类也，故称血焉。夫玄黄者，天地之杂也。天玄而地黄。"}},"03":{"id":"03","cnNum":"〇三","name":"屯","pinyin":"zhūn","fullName":"水雷屯","shortFullName":"水雷屯","upper":"坎","lower":"震","upperNature":"水","lowerNature":"雷","lines":[1,0,0,0,1,0],"yaoLabels":["初九","六二","六三","六四","九五","上六"],"blocks":{"G":"屯，元亨利贞，勿用有攸往，利建侯。","T":"彖曰：屯，刚柔始交而难生，动乎险中，大亨贞。雷雨之动满盈，天造草昧，宜建侯而不宁。","X":"象曰：云雷屯，君子以经纶。","Y1.T":"初九，磐桓，利居贞，利建侯。","Y1.X":"象曰：虽磐桓，志行正也。以贵下贱，大得民也。","Y2.T":"六二，屯如邅如，乘马班如，匪寇婚媾，女子贞不字，十年乃字。","Y2.X":"象曰：六二之难，乘刚也。十年乃字，反常也。","Y3.T":"六三，即鹿无虞，惟入于林中，君子几，不如舍，往吝。","Y3.X":"象曰：即鹿无虞，以从禽也。君子舍之，往吝穷也。","Y4.T":"六四，乘马班如，求婚媾，往吉，无不利。","Y4.X":"象曰：求而往，明也。","Y5.T":"九五，屯其膏，小贞吉，大贞凶。","Y5.X":"象曰：屯其膏，施未光也。","Y6.T":"上六，乘马班如，泣血涟如。","Y6.X":"象曰：泣血涟如，何可长也。"}},"04":{"id":"04","cnNum":"〇四","name":"蒙","pinyin":"méng","fullName":"山水蒙","shortFullName":"山水蒙","upper":"艮","lower":"坎","upperNature":"山","lowerNature":"水","lines":[0,1,0,0,0,1],"yaoLabels":["初六","九二","六三","六四","六五","上九"],"blocks":{"G":"蒙，亨。匪我求童蒙，童蒙求我。初筮告，再三渎，渎则不告，利贞。","T":"彖曰：蒙，山下有险，险而止，蒙。蒙，亨。以亨行，时中也。匪我求童蒙，童蒙求我，志应也。初筮告，以刚中也。再三渎，渎则不告，渎蒙也。蒙以养正，圣功也。","X":"象曰：山下出泉，蒙。君子以果行育德。","Y1.T":"初六，发蒙，利用刑人，用说桎梏，以往，吝。","Y1.X":"象曰：利用刑人，以正法也。","Y2.T":"九二，包蒙吉，纳妇吉，子克家。","Y2.X":"象曰：子克家，刚柔接也。","Y3.T":"六三，勿用取女，见金夫，不有躬，无攸利。","Y3.X":"象曰：勿用取女，行不顺也。","Y4.T":"六四，困蒙，吝。","Y4.X":"象曰：困蒙之吝，独远实也。","Y5.T":"六五，童蒙，吉。","Y5.X":"象曰：童蒙之吉，顺以巽也。","Y6.T":"上九，击蒙，不利为寇，利御寇。","Y6.X":"象曰：利用御寇，上下顺也。"}},"05":{"id":"05","cnNum":"〇五","name":"需","pinyin":"xū","fullName":"水天需","shortFullName":"水天需","upper":"坎","lower":"乾","upperNature":"水","lowerNature":"天","lines":[1,1,1,0,1,0],"yaoLabels":["初九","九二","九三","六四","九五","上六"],"blocks":{"G":"需，有孚，光亨，贞吉，利涉大川。","T":"彖曰：需，须也，险在前也。刚健而不陷，其义不困穷矣。需，有孚光亨，贞吉，位乎天位，以正中也。利涉大川，往有功也。","X":"象曰：云上于天，需。君子以饮食宴乐。","Y1.T":"初九，需于郊，利用恒，无咎。","Y1.X":"象曰：需于郊，不犯难行也。利用恒，无咎，未失常也。","Y2.T":"九二，需于沙，小有言，终吉。","Y2.X":"象曰：需于沙，衍在中也。虽小有言，以终吉也。","Y3.T":"九三，需于泥，致寇至。","Y3.X":"象曰：需于泥，灾在外也。自我致寇，敬慎不败也。","Y4.T":"六四，需于血，出自穴。","Y4.X":"象曰：需于血，顺以听也。","Y5.T":"九五，需于酒食，贞吉。","Y5.X":"象曰：酒食，贞吉，以中正也。","Y6.T":"上六，入于穴，有不速之客三人来，敬之终吉。","Y6.X":"象曰：不速之客来，敬之终吉。虽不当位，未大失也。"}},"06":{"id":"06","cnNum":"〇六","name":"讼","pinyin":"sòng","fullName":"天水讼","shortFullName":"天水讼","upper":"乾","lower":"坎","upperNature":"天","lowerNature":"水","lines":[0,1,0,1,1,1],"yaoLabels":["初六","九二","六三","九四","九五","上九"],"blocks":{"G":"讼，有孚，窒惕，中吉，终凶。利见大人，不利涉大川。","T":"彖曰：讼，上刚下险，险而健，讼。讼，有孚窒惕中吉，刚来而得中也。终凶，讼不可成也。利见大人，尚中正也。不利涉大川，入于渊也。","X":"象曰：天与水违行，讼。君子以作事谋始。","Y1.T":"初六，不永所事，小有言，终吉。","Y1.X":"象曰：不永所事，讼不可长也。虽小有言，其辩明也。","Y2.T":"九二，不克讼，归而逋，其邑人三百户，无眚。","Y2.X":"象曰：不克讼，归逋窜也。自下讼上，患至掇也。","Y3.T":"六三，食旧德，贞厉，终吉，或从王事无成。","Y3.X":"象曰：食旧德，从上吉也。","Y4.T":"九四，不克讼，复即命，渝安贞，吉。","Y4.X":"象曰：复即命，渝安贞，不失也。","Y5.T":"九五，讼元吉。","Y5.X":"象曰：讼元吉，以中正也。","Y6.T":"上九，或锡之鞶带，终朝三褫之。","Y6.X":"象曰：以讼受服，亦不足敬也。"}},"07":{"id":"07","cnNum":"〇七","name":"师","pinyin":"shī","fullName":"地水师","shortFullName":"地水师","upper":"坤","lower":"坎","upperNature":"地","lowerNature":"水","lines":[0,1,0,0,0,0],"yaoLabels":["初六","九二","六三","六四","六五","上六"],"blocks":{"G":"师，贞，丈人，吉无咎。","T":"彖曰：师，众也。贞，正也。能以众正，可以王矣。刚中而应，行险而顺。以此毒天下而民从之，吉又何咎矣。","X":"象曰：地中有水，师。君子以容民畜众。","Y1.T":"初六，师出以律，否臧凶。","Y1.X":"象曰：师出以律，失律凶也。","Y2.T":"九二，在师中，吉无咎，王三锡命。","Y2.X":"象曰：在师中吉，承天宠也。王三锡命，怀万邦也。","Y3.T":"六三，师或舆尸，凶。","Y3.X":"象曰：师或舆尸，大无功也。","Y4.T":"六四，师左次无咎。","Y4.X":"象曰：左次无咎，未失常也。","Y5.T":"六五，田有禽，利执言，无咎。长子帅师，弟子舆尸，贞凶。","Y5.X":"象曰：长子帅师，以中行也。弟子舆尸，使不当也。","Y6.T":"上六，大君有命，开国承家，小人勿用。","Y6.X":"象曰：大君有命，以正功也。小人勿用，必乱邦也。"}},"08":{"id":"08","cnNum":"〇八","name":"比","pinyin":"bǐ","fullName":"水地比","shortFullName":"水地比","upper":"坎","lower":"坤","upperNature":"水","lowerNature":"地","lines":[0,0,0,0,1,0],"yaoLabels":["初六","六二","六三","六四","九五","上六"],"blocks":{"G":"比，吉。原筮元永贞，无咎。不宁方来，后夫凶。","T":"彖曰：比吉也。比辅也。下顺从也。原筮元永贞无咎，以刚中也。不宁方来，上下应也。后夫凶，其道穷也。","X":"象曰：地上有水，比。先王以建万国，亲诸侯。","Y1.T":"初六，有孚，比之，无咎。有孚，盈缶，终来有它吉。","Y1.X":"象曰：比之初六。有它吉也。","Y2.T":"六二，比之自内，贞吉。","Y2.X":"象曰：比之自内，不自失也。","Y3.T":"六三，比之匪人。","Y3.X":"象曰：比之匪人，不亦伤乎。","Y4.T":"六四，外比之，贞吉。","Y4.X":"象曰：外比于贤，以从上也。","Y5.T":"九五，显比，王用三驱失前禽，邑人不诫，吉。","Y5.X":"象曰：显比之吉，位正中也。舍逆取顺，失前禽也。邑人不诫，上使中也。","Y6.T":"上六，比之无首，凶。","Y6.X":"象曰：比之无首，无所终也。"}},"09":{"id":"09","cnNum":"〇九","name":"小畜","pinyin":"xiǎo xù","fullName":"风天小畜","shortFullName":"风天小畜","upper":"巽","lower":"乾","upperNature":"风","lowerNature":"天","lines":[1,1,1,0,1,1],"yaoLabels":["初九","九二","九三","六四","九五","上九"],"blocks":{"G":"小畜，亨。密云不雨，自我西郊。","T":"彖曰：小畜，柔得位而上下应之曰小畜。健而巽，刚中而志行，乃亨。密云不雨，尚往也。自我西郊，施未行也。","X":"象曰：风行天上，小畜。君子以懿文德。","Y1.T":"初九，复自道，何其咎，吉。","Y1.X":"象曰：复自道，其义吉也。","Y2.T":"九二，牵复，吉。","Y2.X":"象曰：牵复在中，亦不自失也。","Y3.T":"九三，舆说辐，夫妻反目。","Y3.X":"象曰：夫妻反目，不能正室也。","Y4.T":"六四，有孚，血去惕出，无咎。","Y4.X":"象曰：有孚惕出，上合志也。","Y5.T":"九五，有孚挛如，富以其邻。","Y5.X":"象曰：有孚挛如，不独富也。","Y6.T":"上九，既雨既处，尚德载，妇贞厉，月几望，君子征凶。","Y6.X":"象曰：既雨既处，德积载也。君子征凶，有所疑也。"}},"10":{"id":"10","cnNum":"一〇","name":"履","pinyin":"lǚ","fullName":"天泽履","shortFullName":"天泽履","upper":"乾","lower":"兑","upperNature":"天","lowerNature":"泽","lines":[1,1,0,1,1,1],"yaoLabels":["初九","九二","六三","九四","九五","上九"],"blocks":{"G":"履虎尾，不咥人，亨。","T":"彖曰：履，柔履刚也。说而应乎乾，是以履虎尾不咥人，亨。刚中正，履帝位而不疚，光明也。","X":"象曰：上天下泽，履。君子以辨上下，定民志。","Y1.T":"初九，素履往，无咎。","Y1.X":"象曰：素履之往，独行愿也。","Y2.T":"九二，履道坦坦，幽人贞吉。","Y2.X":"象曰：幽人贞吉，中不自乱也。","Y3.T":"六三，眇能视，跛能履，履虎尾，咥人，凶，武人为于大君。","Y3.X":"象曰：眇能视，不足以有明也。跛能履，不足以与行也。咥人之凶，位不当也。武人为于大君，志刚也。","Y4.T":"九四，履虎尾，愬愬终吉。","Y4.X":"象曰：愬愬终吉，志行也。","Y5.T":"九五，夬履，贞厉。","Y5.X":"象曰：夬履贞厉，位正当也。","Y6.T":"上九，视履考祥，其旋元吉。","Y6.X":"象曰：元吉在上，大有庆也。"}},"11":{"id":"11","cnNum":"一一","name":"泰","pinyin":"tài","fullName":"地天泰","shortFullName":"地天泰","upper":"坤","lower":"乾","upperNature":"地","lowerNature":"天","lines":[1,1,1,0,0,0],"yaoLabels":["初九","九二","九三","六四","六五","上六"],"blocks":{"G":"泰，小往大来，吉亨。","T":"彖曰：泰，小往大来，吉亨。则是天地交而万物通也，上下交而其志同也。内阳而外阴，内健而外顺。内君子而外小人。君子道长，小人道消也。","X":"象曰：天地交泰，后以财成天地之道，辅相天地之宜，以左右民。","Y1.T":"初九，拔茅茹，以其汇征，吉。","Y1.X":"象曰：拔茅征吉，志在外也。","Y2.T":"九二，包荒，用冯河，不遐遗，朋亡。得尚于中行。","Y2.X":"象曰：包荒，得尚于中行，以光大也。","Y3.T":"九三，无平不陂，无往不复，艰贞无咎，勿恤其孚，于食有福。","Y3.X":"象曰：无往不复，天地际也。","Y4.T":"六四，翩翩不富以其邻，不戒以孚。","Y4.X":"象曰：翩翩不富，皆失实也，不戒以孚，中心愿也。","Y5.T":"六五，帝乙归妹，以祉，元吉。","Y5.X":"象曰：以祉元吉，中以行愿也。","Y6.T":"上六，城复于隍，勿用师，自邑告命，贞吝。","Y6.X":"象曰：城复于隍，其命乱也。"}},"12":{"id":"12","cnNum":"一二","name":"否","pinyin":"pǐ","fullName":"天地否","shortFullName":"天地否","upper":"乾","lower":"坤","upperNature":"天","lowerNature":"地","lines":[0,0,0,1,1,1],"yaoLabels":["初六","六二","六三","九四","九五","上九"],"blocks":{"G":"否之匪人，不利君子贞，大往小来。","T":"彖曰：否之匪人，不利君子贞。大往小来，则是天地不交，而万物不通也。上下不交，而天下无邦也。内阴而外阳，内柔而外刚，内小人而外君子，小人道长，君子道消也。","X":"象曰：天地不交，否。君子以俭德辟难，不可荣以禄。","Y1.T":"初六，拔茅茹，以其汇，贞吉亨。","Y1.X":"象曰：拔茅贞吉，志在君也。","Y2.T":"六二，包承，小人吉，大人否亨。","Y2.X":"象曰：大人否亨，不乱群也。","Y3.T":"六三，包羞。","Y3.X":"象曰：包羞，位不当也。","Y4.T":"九四，有命无咎，畴离祉。","Y4.X":"象曰：有命无咎，志行也。","Y5.T":"九五，休否，大人吉，其亡其亡，系于苞桑。","Y5.X":"象曰：大人之吉，位正当也。","Y6.T":"上九，倾否，先否后喜。","Y6.X":"象曰：否终则倾，何可长也。"}},"13":{"id":"13","cnNum":"一三","name":"同人","pinyin":"tóng rén","fullName":"天火同人","shortFullName":"天火同人","upper":"乾","lower":"离","upperNature":"天","lowerNature":"火","lines":[1,0,1,1,1,1],"yaoLabels":["初九","六二","九三","九四","九五","上九"],"blocks":{"G":"同人于野，亨。利涉大川，利君子贞。","T":"彖曰：同人，柔得位得中而应乎乾，曰同人。同人曰。同人于野，利涉大川，乾行也。文明以健，中正而应，君子正也。唯君子为能通天下之志。","X":"象曰：天与火，同人。君子以类族辨物。","Y1.T":"初九，同人于门，无咎。","Y1.X":"象曰：出门同人，又谁咎也。","Y2.T":"六二，同人于宗，吝。","Y2.X":"象曰：同人于宗，吝道也。","Y3.T":"九三，伏戎于莽，升其高陵，三岁不兴。","Y3.X":"象曰：伏戎于莽，敌刚也。三岁不兴，安行也。","Y4.T":"九四，乘其墉，弗克攻，吉。","Y4.X":"象曰：乘其墉，义弗克也。其吉，则困而反则也。","Y5.T":"九五，同人先号咷而后笑，大师克相遇。","Y5.X":"象曰：同人之先。以中直也。大师相遇，言相克也。","Y6.T":"上九，同人于郊，无悔。","Y6.X":"象曰：同人于郊，志未得也。"}},"14":{"id":"14","cnNum":"一四","name":"大有","pinyin":"dà yǒu","fullName":"火天大有","shortFullName":"火天大有","upper":"离","lower":"乾","upperNature":"火","lowerNature":"天","lines":[1,1,1,1,0,1],"yaoLabels":["初九","九二","九三","九四","六五","上九"],"blocks":{"G":"大有，元亨。","T":"彖曰：大有，柔得尊位大中而上下应之，曰大有。其德刚健而文明，应乎天而时行，是以元亨。","X":"象曰：火在天上，大有。君子以遏恶扬善，顺天休命。","Y1.T":"初九，无交害，匪咎，艰则无咎。","Y1.X":"象曰：大有初九，无交害也。","Y2.T":"九二，大车以载，有攸往，无咎。","Y2.X":"象曰：大车以载，积中不败也。","Y3.T":"九三，公用亨于天子，小人弗克。","Y3.X":"象曰：公用亨于天子，小人害也。","Y4.T":"九四，匪其彭，无咎。","Y4.X":"象曰：匪其彭无咎，明辩晢也。","Y5.T":"六五，厥孚交如，威如，吉。","Y5.X":"象曰：厥孚交如，信以发志也。威如之吉，易而无备也。","Y6.T":"上九，自天佑之，吉无不利。","Y6.X":"象曰：大有上吉，自天佑也。"}},"15":{"id":"15","cnNum":"一五","name":"谦","pinyin":"qiān","fullName":"地山谦","shortFullName":"地山谦","upper":"坤","lower":"艮","upperNature":"地","lowerNature":"山","lines":[0,0,1,0,0,0],"yaoLabels":["初六","六二","九三","六四","六五","上六"],"blocks":{"G":"谦，亨，君子有终。","T":"彖曰：谦亨。天道下济而光明，地道卑而上行。天道亏盈而益谦，地道变盈而流谦，鬼神害盈而福谦，人道恶盈而好谦。谦尊而光，卑而不可逾，君子之终也。","X":"象曰：地中有山，谦。君子以裒多益寡，称物平施。","Y1.T":"初六，谦谦君子，用涉大川，吉。","Y1.X":"象曰：谦谦君子，卑以自牧也。","Y2.T":"六二，鸣谦，贞吉。","Y2.X":"象曰：鸣谦贞吉，中心得也。","Y3.T":"九三，劳谦，君子有终，吉。","Y3.X":"象曰：劳谦君子，万民服也。","Y4.T":"六四，无不利，㧑谦。","Y4.X":"象曰：无不利㧑谦，不违则也。","Y5.T":"六五，不富以其邻，利用侵伐，无不利。","Y5.X":"象曰：利用侵伐，征不服也。","Y6.T":"上六，鸣谦，利用行师。征邑国。","Y6.X":"象曰：鸣谦，志未得也。可用行师，征邑国也。"}},"16":{"id":"16","cnNum":"一六","name":"豫","pinyin":"yù","fullName":"雷地豫","shortFullName":"雷地豫","upper":"震","lower":"坤","upperNature":"雷","lowerNature":"地","lines":[0,0,0,1,0,0],"yaoLabels":["初六","六二","六三","九四","六五","上六"],"blocks":{"G":"豫，利建侯行师。","T":"彖曰：豫，刚应而志行，顺以动，豫。豫，顺以动，故天地如之，而况建侯行师乎！天地以顺动，故日月不过而四时不忒。圣人以顺动，则刑罚清而民服。豫之时义大矣哉。","X":"象曰：雷出地奋，豫。先王以作乐崇德，殷荐之上帝，以配祖考。","Y1.T":"初六，鸣豫，凶。","Y1.X":"象曰：初六鸣豫，志穷凶也。","Y2.T":"六二，介于石，不终日，贞吉。","Y2.X":"象曰：不终日贞吉，以中正也。","Y3.T":"六三，盱豫悔，迟有悔。","Y3.X":"象曰：盱豫有悔，位不当也。","Y4.T":"九四，由豫，大有得，勿疑，朋盍簪。","Y4.X":"象曰：由豫大有得，志大行也。","Y5.T":"六五，贞疾，恒不死。","Y5.X":"象曰：六五贞疾，乘刚也。恒不死，中未亡也。","Y6.T":"上六，冥豫，成有渝，无咎。","Y6.X":"象曰：冥豫在上，何可长也。"}},"17":{"id":"17","cnNum":"一七","name":"随","pinyin":"suí","fullName":"泽雷随","shortFullName":"泽雷随","upper":"兑","lower":"震","upperNature":"泽","lowerNature":"雷","lines":[1,0,0,1,1,0],"yaoLabels":["初九","六二","六三","九四","九五","上六"],"blocks":{"G":"随，元亨，利贞，无咎。","T":"彖曰：随，刚来而下柔，动而说，随。大亨贞无咎，而天下随时。随时之义大矣哉。","X":"象曰：泽中有雷，随。君子以嚮晦入宴息。","Y1.T":"初九，官有渝，贞吉，出门交有功。","Y1.X":"象曰：官有渝，从正吉也。出门交有功，不失也。","Y2.T":"六二，系小子，失丈夫。","Y2.X":"象曰：系小子，弗兼与也。","Y3.T":"六三，系丈夫，失小子。随有求得，利居贞。","Y3.X":"象曰：系丈夫，志舍下也。","Y4.T":"九四，随有获，贞凶。有孚在道，以明，何咎。","Y4.X":"象曰：随有获，其义凶也。有孚在道，明功也。","Y5.T":"九五，孚于嘉，吉。","Y5.X":"象曰：孚于嘉吉，位正中也。","Y6.T":"上六，拘系之，乃从维之。王用亨于西山。","Y6.X":"象曰：拘系之，上穷也。"}},"18":{"id":"18","cnNum":"一八","name":"蛊","pinyin":"gǔ","fullName":"山风蛊","shortFullName":"山风蛊","upper":"艮","lower":"巽","upperNature":"山","lowerNature":"风","lines":[0,1,1,0,0,1],"yaoLabels":["初六","九二","九三","六四","六五","上九"],"blocks":{"G":"蛊，元亨，利涉大川。先甲三日，后甲三日。","T":"彖曰：蛊，刚上而柔下，巽而止，蛊。蛊元亨而天下治也。利涉大川，往有事也。先甲三日，后甲三日，终则有始，天行也。","X":"象曰：山下有风，蛊。君子以振民育德。","Y1.T":"初六，干父之蛊，有子，考无咎，厉终吉。","Y1.X":"象曰：干父之蛊，意承考也。","Y2.T":"九二，干母之蛊，不可贞。","Y2.X":"象曰：干母之蛊，得中道也。","Y3.T":"九三，干父之蛊，小有悔，无大咎。","Y3.X":"象曰：干父之蛊，终无咎也。","Y4.T":"六四，裕父之蛊，往见吝。","Y4.X":"象曰：裕父之蛊，往未得也。","Y5.T":"六五，干父之蛊，用誉。","Y5.X":"象曰：干父用誉，承以德也。","Y6.T":"上九，不事王侯，高尚其事。","Y6.X":"象曰：不事王侯，志可则也。"}},"19":{"id":"19","cnNum":"一九","name":"临","pinyin":"lín","fullName":"地泽临","shortFullName":"地泽临","upper":"坤","lower":"兑","upperNature":"地","lowerNature":"泽","lines":[1,1,0,0,0,0],"yaoLabels":["初九","九二","六三","六四","六五","上六"],"blocks":{"G":"临，元亨利贞，至于八月有凶。","T":"彖曰：临，刚浸而长，说而顺，刚中而应，大亨以正，天之道也。至于八月有凶，消不久也。","X":"象曰：泽上有地，临。君子以教思无穷，容保民无疆。","Y1.T":"初九，咸临，贞吉。","Y1.X":"象曰：咸临贞吉，志行正也。","Y2.T":"九二，咸临，吉无不利。","Y2.X":"象曰：咸临吉无不利，未顺命也。","Y3.T":"六三，甘临，无攸利。既忧之，无咎。","Y3.X":"象曰：甘临，位不当也。既忧之，咎不长也。","Y4.T":"六四，至临，无咎。","Y4.X":"象曰：至临无咎，位当也。","Y5.T":"六五，知临，大君之宜，吉。","Y5.X":"象曰：大君之宜，行中之谓也。","Y6.T":"上六，敦临，吉无咎。","Y6.X":"象曰：敦临之吉，志在内也。"}},"20":{"id":"20","cnNum":"二〇","name":"观","pinyin":"guān","fullName":"风地观","shortFullName":"风地观","upper":"巽","lower":"坤","upperNature":"风","lowerNature":"地","lines":[0,0,0,0,1,1],"yaoLabels":["初六","六二","六三","六四","九五","上九"],"blocks":{"G":"观，盥而不荐，有孚颙若。","T":"彖曰：大观在上，顺而巽，中正以观天下。观，盥而不荐，有孚颙若，下观而化也。观天之神道，而四时不忒，圣人以神道设教，而天下服矣。","X":"象曰：风行地上，观。先王以省方，观民设教。","Y1.T":"初六，童观，小人无咎，君子吝。","Y1.X":"象曰：初六童观，小人道也。","Y2.T":"六二，窥观，利女贞。","Y2.X":"象曰：窥观女贞，亦可丑也。","Y3.T":"六三，观我生，进退。","Y3.X":"象曰：观我生进退，未失道也。","Y4.T":"六四，观国之光，利用宾于王。","Y4.X":"象曰：观国之光，尚宾也。","Y5.T":"九五，观我生，君子无咎。","Y5.X":"象曰：观我生，观民也。","Y6.T":"上九，观其生，君子无咎。","Y6.X":"象曰：观其生，志未平也。"}},"21":{"id":"21","cnNum":"二一","name":"噬嗑","pinyin":"shì kè","fullName":"火雷噬嗑","shortFullName":"火雷噬嗑","upper":"离","lower":"震","upperNature":"火","lowerNature":"雷","lines":[1,0,0,1,0,1],"yaoLabels":["初九","六二","六三","九四","六五","上九"],"blocks":{"G":"噬嗑，亨，利用狱。","T":"彖曰：颐中有物曰噬嗑。噬嗑而亨，刚柔分，动而明，雷电合而章，柔得中而上行，虽不当位，利用狱也。","X":"象曰：雷电噬嗑，先王以明罚敕法。","Y1.T":"初九，屦校灭趾，无咎。","Y1.X":"象曰：屦校灭趾，不行也。","Y2.T":"六二，噬肤灭鼻，无咎。","Y2.X":"象曰：噬肤灭鼻，乘刚也。","Y3.T":"六三，噬腊肉，遇毒，小吝，无咎。","Y3.X":"象曰：遇毒，位不当也。","Y4.T":"九四，噬干胏，得金矢，利艰贞，吉。","Y4.X":"象曰：利艰贞，吉未光也。","Y5.T":"六五，噬干肉，得黄金，贞厉，无咎。","Y5.X":"象曰：贞厉无咎，得当也。","Y6.T":"上九，何校灭耳，凶。","Y6.X":"象曰：何校灭耳，聪不明也。"}},"22":{"id":"22","cnNum":"二二","name":"贲","pinyin":"bì","fullName":"山火贲","shortFullName":"山火贲","upper":"艮","lower":"离","upperNature":"山","lowerNature":"火","lines":[1,0,1,0,0,1],"yaoLabels":["初九","六二","九三","六四","六五","上九"],"blocks":{"G":"贲亨，小利有攸往。","T":"彖曰：贲亨，柔来而文刚，故亨。分刚上而文柔，故小利有攸往，天文也。文明以止，人文也。观乎天文以察时变，观乎人文以化成天下。","X":"象曰：山下有火，贲。君子以明庶政，无敢折狱。","Y1.T":"初九，贲其趾，舍车而徒。","Y1.X":"象曰：舍车而徒。义弗乘也。","Y2.T":"六二，贲其须。","Y2.X":"象曰：贲其须，与上兴也。","Y3.T":"九三，贲如濡如，永贞吉。","Y3.X":"象曰：永贞之吉，终莫之陵也。","Y4.T":"六四，贲如皤如，白马翰如，匪寇婚媾。","Y4.X":"象曰：六四，当位疑也。匪寇婚媾，终无尤也。","Y5.T":"六五，贲于丘园，束帛戋戋，吝，终吉。","Y5.X":"象曰：六五之吉，有喜也。","Y6.T":"上九，白贲，无咎。","Y6.X":"象曰：白贲无咎，上得志也。"}},"23":{"id":"23","cnNum":"二三","name":"剥","pinyin":"bō","fullName":"山地剥","shortFullName":"山地剥","upper":"艮","lower":"坤","upperNature":"山","lowerNature":"地","lines":[0,0,0,0,0,1],"yaoLabels":["初六","六二","六三","六四","六五","上九"],"blocks":{"G":"剥，不利有攸往。","T":"彖曰：剥，剥也，柔变刚也。不利有攸往，小人长也。顺而止之，观象也，君子尚消息盈虚，天行也。","X":"象曰：山附于地，剥。上以厚下安宅。","Y1.T":"初六，剥床以足，蔑贞凶。","Y1.X":"象曰：剥床以足，以灭下也。","Y2.T":"六二，剥床以辨，蔑贞凶。","Y2.X":"象曰：剥床以辨，未有与也。","Y3.T":"六三，剥之无咎。","Y3.X":"象曰：剥之无咎，失上下也。","Y4.T":"六四，剥床以肤，凶。","Y4.X":"象曰：剥床以肤，切近灾也。","Y5.T":"六五，贯鱼，以宫人宠，无不利。","Y5.X":"象曰：以宫人宠，终无尤也。","Y6.T":"上九，硕果不食，君子得舆，小人剥庐。","Y6.X":"象曰：君子得舆，民所载也。小人剥庐，终不可用也。"}},"24":{"id":"24","cnNum":"二四","name":"复","pinyin":"fù","fullName":"地雷复","shortFullName":"地雷复","upper":"坤","lower":"震","upperNature":"地","lowerNature":"雷","lines":[1,0,0,0,0,0],"yaoLabels":["初九","六二","六三","六四","六五","上六"],"blocks":{"G":"复，亨。出入无疾，朋来无咎。反复其道，七日来复，利有攸往。","T":"彖曰：复亨，刚反，动而以顺行，是以出入无疾，朋来无咎。反复其道，七日来复，天行也。利有攸往，刚长也。复其见天地之心乎！","X":"象曰：雷在地中，复。先王以至日闭关，商旅不行，后不省方。","Y1.T":"初九，不远复，无祗悔，元吉。","Y1.X":"象曰：不远之复，以修身也。","Y2.T":"六二，休复，吉。","Y2.X":"象曰：休复之吉，以下仁也。","Y3.T":"六三，频复，厉无咎。","Y3.X":"象曰：频复之厉，义无咎也。","Y4.T":"六四，中行独复。","Y4.X":"象曰：中行独复，以从道也。","Y5.T":"六五，敦复，无悔。","Y5.X":"象曰：敦复无悔，中以自考也。","Y6.T":"上六，迷复，凶。有灾眚，用行师，终有大败，以其国君凶，至于十年不克征。","Y6.X":"象曰：迷复之凶，反君道也。"}},"25":{"id":"25","cnNum":"二五","name":"无妄","pinyin":"wú wàng","fullName":"天雷无妄","shortFullName":"天雷无妄","upper":"乾","lower":"震","upperNature":"天","lowerNature":"雷","lines":[1,0,0,1,1,1],"yaoLabels":["初九","六二","六三","九四","九五","上九"],"blocks":{"G":"无妄，元亨利贞，其匪正有眚，不利有攸往。","T":"彖曰：无妄，刚自外来而为主于内，动而健，刚中而应，大亨以正，天之命也。其匪正有眚，不利有攸往，无妄之往，何之矣。天命不佑，行矣哉。","X":"象曰：天下雷行，物与无妄。先王以茂对时育万物。","Y1.T":"初九，无妄，往吉。","Y1.X":"象曰：无妄之吉，得志也。","Y2.T":"六二，不耕获，不菑畬，则利有攸往。","Y2.X":"象曰：不耕获，未富也。","Y3.T":"六三，无妄之灾，或系之牛，行人之得，邑人之灾。","Y3.X":"象曰：行人得牛，邑人灾也。","Y4.T":"九四，可贞，无咎。","Y4.X":"象曰：可贞无咎，固有之也。","Y5.T":"九五，无妄之疾，勿药有喜。","Y5.X":"象曰：无妄之药，不可试也。","Y6.T":"上九，无妄，行有眚，无攸利。","Y6.X":"象曰：无妄之行，穷之灾也。"}},"26":{"id":"26","cnNum":"二六","name":"大畜","pinyin":"dà xù","fullName":"山天大畜","shortFullName":"山天大畜","upper":"艮","lower":"乾","upperNature":"山","lowerNature":"天","lines":[1,1,1,0,0,1],"yaoLabels":["初九","九二","九三","六四","六五","上九"],"blocks":{"G":"大畜，利贞，不家食吉，利涉大川。","T":"彖曰：大畜，刚健笃实辉光，日新其德。刚上而尚贤，能止健，大正也。不家食吉，养贤也。利涉大川，应乎天也。","X":"象曰：天在山中，大畜，君子以多识前言往行，以畜其德。","Y1.T":"初九，有厉，利已。","Y1.X":"象曰：有厉利已，不犯灾也。","Y2.T":"九二，舆说輹。","Y2.X":"象曰：舆说輹，中无尤也。","Y3.T":"九三，良马逐，利艰贞，曰闲舆卫，利有攸往。","Y3.X":"象曰：利有攸往，上合志也。","Y4.T":"六四，童牛之牿，元吉。","Y4.X":"象曰：六四元吉，有喜也。","Y5.T":"六五，豮豕之牙，吉。","Y5.X":"象曰：六五之吉，有庆也。","Y6.T":"上九，何天之衢，亨。","Y6.X":"象曰：何天之衢，道大行也。"}},"27":{"id":"27","cnNum":"二七","name":"颐","pinyin":"yí","fullName":"山雷颐","shortFullName":"山雷颐","upper":"艮","lower":"震","upperNature":"山","lowerNature":"雷","lines":[1,0,0,0,0,1],"yaoLabels":["初九","六二","六三","六四","六五","上九"],"blocks":{"G":"颐，贞吉，观颐，自求口实。","T":"彖曰：颐，贞吉，养正则吉也。观颐，观其所养也。自求口实，观其自养也。天地养万物，圣人养贤以及万民。颐之时大矣哉。","X":"象曰：山下有雷，颐。君子以慎言语，节饮食。","Y1.T":"初九，舍尔灵龟，观我朵颐。","Y1.X":"象曰：观我朵颐，亦不足贵也。","Y2.T":"六二，颠颐，拂经于丘颐，征凶。","Y2.X":"象曰：六二征凶，行失类也。","Y3.T":"六三，拂颐，贞凶，十年勿用，无攸利。","Y3.X":"象曰：十年勿用，道大悖也。","Y4.T":"六四，颠颐吉，虎视眈眈，其欲逐逐，无咎。","Y4.X":"象曰：颠颐之吉，上施光也。","Y5.T":"六五，拂经居贞吉，不可涉大川。","Y5.X":"象曰：居贞之吉，顺以从上也。","Y6.T":"上九，由颐，厉吉，利涉大川。","Y6.X":"象曰：由颐厉吉，大有庆也。"}},"28":{"id":"28","cnNum":"二八","name":"大过","pinyin":"dà guò","fullName":"泽风大过","shortFullName":"泽风大过","upper":"兑","lower":"巽","upperNature":"泽","lowerNature":"风","lines":[0,1,1,1,1,0],"yaoLabels":["初六","九二","九三","九四","九五","上六"],"blocks":{"G":"大过，栋桡，利有攸往，亨。","T":"彖曰：大过，大者过也。栋桡，本末弱也。刚过而中，巽而说行，利有攸往，乃亨。大过之时大矣哉。","X":"象曰：泽灭木，大过。君子以独立不惧，遯世无闷。","Y1.T":"初六，藉用白茅，无咎。","Y1.X":"象曰：藉用白茅，柔在下也。","Y2.T":"九二，枯杨生梯，老夫得其女妻，无不利。","Y2.X":"象曰：老夫女妻，过以相与也。","Y3.T":"九三，栋桡凶。","Y3.X":"象曰：栋挠之凶，不可以有辅也。","Y4.T":"九四，栋隆吉，有它吝。","Y4.X":"象曰：栋隆之吉，不桡乎下也。","Y5.T":"九五，枯杨生华，老妇得其士夫，无咎无誉。","Y5.X":"象曰：枯杨生华，何可久也。老妇士夫，亦可丑也。","Y6.T":"上六，过涉灭顶，凶，无咎。","Y6.X":"象曰：过涉之凶。不可咎也。"}},"29":{"id":"29","cnNum":"二九","name":"坎","pinyin":"kǎn","fullName":"坎为水","shortFullName":"水水坎","upper":"坎","lower":"坎","upperNature":"水","lowerNature":"水","lines":[0,1,0,0,1,0],"yaoLabels":["初六","九二","六三","六四","九五","上六"],"blocks":{"G":"习坎，有孚，维心亨，行有尚。","T":"彖曰：习坎，重险也。水流而不盈，行险而不失其信。维心亨，乃以刚中也。行有尚，往有功也。天险不可升也，地险山川丘陵也。王公设险以守其国，险之时用大矣哉。","X":"象曰：水洊至，习坎。君子以常德行，习教事。","Y1.T":"初六，习坎，入于坎窞，凶。","Y1.X":"象曰：习坎入坎，失道凶也。","Y2.T":"九二，坎有险，求小得。","Y2.X":"象曰：求小得，未出中也。","Y3.T":"六三，来之坎坎，险且枕，入于坎窞，勿用。","Y3.X":"象曰：来之坎坎，终无功也。","Y4.T":"六四，樽酒，簋贰，用缶，纳约自牖，终无咎。","Y4.X":"象曰：樽酒簋贰，刚柔际也。","Y5.T":"九五，坎不盈，祗既平，无咎。","Y5.X":"象曰：坎不盈，中未大也。","Y6.T":"上六，系用徽纆，置于丛棘三岁不得，凶。","Y6.X":"象曰：上六失道凶三岁也。"}},"30":{"id":"30","cnNum":"三〇","name":"离","pinyin":"lí","fullName":"离为火","shortFullName":"火火离","upper":"离","lower":"离","upperNature":"火","lowerNature":"火","lines":[1,0,1,1,0,1],"yaoLabels":["初九","六二","九三","九四","六五","上九"],"blocks":{"G":"离，利贞，亨，畜牝牛，吉。","T":"彖曰：离，丽也。日月丽乎天，百谷草木丽乎土。重明以丽乎正，乃化成天下，柔丽乎中正，故亨，是以畜牝牛吉也。","X":"象曰：明两作，离。大人以继明照于四方。","Y1.T":"初九，履错然，敬之无咎。","Y1.X":"象曰：履错之敬，以辟咎也。","Y2.T":"六二，黄离，元吉。","Y2.X":"象曰：黄离元吉，得中道也。","Y3.T":"九三，日昃之离，不鼓缶而歌，则大耋之嗟，凶。","Y3.X":"象曰：日昃之离，何可久也。","Y4.T":"九四，突如其来如，焚如，死如，弃如。","Y4.X":"象曰：突如其来如，无所容也。","Y5.T":"六五，出涕沱若，戚嗟若，吉。","Y5.X":"象曰：六五之吉，离王公也。","Y6.T":"上九，王用出征，有嘉折首，获匪其丑，无咎。","Y6.X":"象曰：王用出征，以正邦也。"}},"31":{"id":"31","cnNum":"三一","name":"咸","pinyin":"xián","fullName":"泽山咸","shortFullName":"泽山咸","upper":"兑","lower":"艮","upperNature":"泽","lowerNature":"山","lines":[0,0,1,1,1,0],"yaoLabels":["初六","六二","九三","九四","九五","上六"],"blocks":{"G":"咸，亨利贞，取女吉。","T":"彖曰：咸，感也。柔上而刚下。二气感应以相与。止而说，男下女，是以亨利贞，取女吉也。天地感而万物化生，圣人感人心而天下和平。观其所感，而天地万物之情可见矣。","X":"象曰：山上有泽，咸。君子以虚受人。","Y1.T":"初六，咸其拇。","Y1.X":"象曰：咸其拇，志在外也。","Y2.T":"六二，咸其腓，凶，居吉。","Y2.X":"象曰：虽凶居吉，顺不害也。","Y3.T":"九三，咸其股，执其随，往吝。","Y3.X":"象曰：咸其股，亦不处也。志在随人，所执下也。","Y4.T":"九四，贞吉悔亡，憧憧往来，朋从尔思。","Y4.X":"象曰：贞吉悔亡，未感害也。憧憧往来，未光大也。","Y5.T":"九五，咸其脢，无悔。","Y5.X":"象曰：咸其脢，志末也。","Y6.T":"上六，咸其辅颊舌。","Y6.X":"象曰：咸其辅颊舌，滕口说也。"}},"32":{"id":"32","cnNum":"三二","name":"恒","pinyin":"héng","fullName":"雷风恒","shortFullName":"雷风恒","upper":"震","lower":"巽","upperNature":"雷","lowerNature":"风","lines":[0,1,1,1,0,0],"yaoLabels":["初六","九二","九三","九四","六五","上六"],"blocks":{"G":"恒，亨，无咎，利贞，利有攸往。","T":"彖曰：恒，久也。刚上而柔下。雷风相与，巽而动，刚柔皆应，恒。恒亨无咎，利贞，久于其道也。天地之道，恒久而不已也。利有攸往，终则有始也。日月得天而能久照，四时变化而能久成，圣人久于其道而天下化成。观其所恒，而天地之情可见矣。","X":"象曰：雷风恒，君子以立不易方。","Y1.T":"初六，浚恒，贞凶，无攸利。","Y1.X":"象曰：浚恒之凶，始求深也。","Y2.T":"九二，悔亡。","Y2.X":"象曰：九二悔亡，能久中也。","Y3.T":"九三，不恒其德，或承之羞，贞吝。","Y3.X":"象曰：不恒其德，无所容也。","Y4.T":"九四，田无禽。","Y4.X":"象曰：久非其位，安得禽也。","Y5.T":"六五，恒其德贞，妇人吉，夫子凶。","Y5.X":"象曰：妇人贞吉，从一而终也。夫子制义，从妇凶也。","Y6.T":"上六，振恒，凶。","Y6.X":"象曰：振恒在上，大无功也。"}},"33":{"id":"33","cnNum":"三三","name":"遯","pinyin":"dùn","fullName":"天山遯","shortFullName":"天山遯","upper":"乾","lower":"艮","upperNature":"天","lowerNature":"山","lines":[0,0,1,1,1,1],"yaoLabels":["初六","六二","九三","九四","九五","上九"],"blocks":{"G":"遯，亨，小利贞。","T":"彖曰：遯亨，遯而亨也，刚当位而应，与时行也。小利贞，浸而长也。遯之时义大矣哉。","X":"象曰：天下有山，遯。君子以远小人，不恶而严。","Y1.T":"初六，遯尾厉，勿用有攸往。","Y1.X":"象曰：遯尾之厉，不往何灾也。","Y2.T":"六二，执之用黄牛之革，莫之胜说。","Y2.X":"象曰：执用黄牛，固志也。","Y3.T":"九三，系遯，有疾厉，畜臣妾吉。","Y3.X":"象曰：系遯之厉，有疾惫也。畜臣妾吉，不可大事也。","Y4.T":"九四，好遯，君子吉，小人否。","Y4.X":"象曰：君子好遯，小人否也。","Y5.T":"九五，嘉遯，贞吉。","Y5.X":"象曰：嘉遯贞吉，以正志也。","Y6.T":"上九，肥遯无不利。","Y6.X":"象曰：肥遯无不利，无所疑也。"}},"34":{"id":"34","cnNum":"三四","name":"大壮","pinyin":"dà zhuàng","fullName":"雷天大壮","shortFullName":"雷天大壮","upper":"震","lower":"乾","upperNature":"雷","lowerNature":"天","lines":[1,1,1,1,0,0],"yaoLabels":["初九","九二","九三","九四","六五","上六"],"blocks":{"G":"大壮，利贞。","T":"彖曰：大壮，大者壮也。刚以动，故壮。大壮利贞，大者正也。正大而天地之情可见矣。","X":"象曰：雷在天上，大壮。君子以非礼弗履。","Y1.T":"初九，壮于趾，征凶有孚。","Y1.X":"象曰：壮于趾，其孚穷也。","Y2.T":"九二，贞吉。","Y2.X":"象曰：九二贞吉，以中也。","Y3.T":"九三，小人用壮，君子用罔，贞厉。羝羊触藩，羸其角。","Y3.X":"象曰：小人用壮，君子罔也。","Y4.T":"九四，贞吉悔亡。藩决不羸。壮于大舆之輹。","Y4.X":"象曰：藩决不羸，尚往也。","Y5.T":"六五，丧羊于易，无悔。","Y5.X":"象曰：丧羊于易，位不当也。","Y6.T":"上六，羝羊触藩，不能退，不能遂，无攸利，艰则吉。","Y6.X":"象曰：不能退，不能遂，不详也。艰则吉，咎不长也。"}},"35":{"id":"35","cnNum":"三五","name":"晋","pinyin":"jìn","fullName":"火地晋","shortFullName":"火地晋","upper":"离","lower":"坤","upperNature":"火","lowerNature":"地","lines":[0,0,0,1,0,1],"yaoLabels":["初六","六二","六三","九四","六五","上九"],"blocks":{"G":"晋，康侯用锡马蕃庶，昼日三接。","T":"彖曰：晋，进也。明出地上，顺而丽乎大明，柔进而上行。是以康侯用锡马蕃庶，昼日三接也。","X":"象曰：明出地上，晋。君子以自昭明德。","Y1.T":"初六，晋如摧如，贞吉，罔孚，裕无咎。","Y1.X":"象曰：晋如摧如，独行正也。裕无咎，未受命也。","Y2.T":"六二，晋如愁如，贞吉，受兹介福，于其王母。","Y2.X":"象曰：受兹介福，以中正也。","Y3.T":"六三，众允，悔亡。","Y3.X":"象曰：众允之志，上行也。","Y4.T":"九四，晋如鼫鼠，贞厉。","Y4.X":"象曰：鼫鼠贞厉，位不当也。","Y5.T":"六五，悔亡，失得勿恤，往吉无不利。","Y5.X":"象曰：失得勿恤，往有庆也。","Y6.T":"上九，晋其角，维用伐邑。厉吉无咎，贞吝。","Y6.X":"象曰：维用伐邑，道未光也。"}},"36":{"id":"36","cnNum":"三六","name":"明夷","pinyin":"míng yí","fullName":"地火明夷","shortFullName":"地火明夷","upper":"坤","lower":"离","upperNature":"地","lowerNature":"火","lines":[1,0,1,0,0,0],"yaoLabels":["初九","六二","九三","六四","六五","上六"],"blocks":{"G":"明夷，利艰贞。","T":"彖曰：明入地中，明夷。内文明而外柔顺，以蒙大难，文王以之。利艰贞，晦其明也。内难而能正其志，箕子以之。","X":"象曰：明入地中，明夷。君子以莅众用晦而明。","Y1.T":"初九，明夷于飞，垂其翼。君子于行，三日不食。有攸往，主人有言。","Y1.X":"象曰：君子于行，义不食也。","Y2.T":"六二，明夷，夷于左股，用拯马壮，吉。","Y2.X":"象曰：六二之吉，顺以则也。","Y3.T":"九三，明夷于南狩，得其大首，不可疾贞。","Y3.X":"象曰：南狩之志，乃大得也。","Y4.T":"六四，入于左腹，获明夷之心，于出门庭。","Y4.X":"象曰：入于左腹，获心意也。","Y5.T":"六五，箕子之明夷，利贞。","Y5.X":"象曰：箕子之贞，明不可息也。","Y6.T":"上六，不明晦，初登于天，后入于地。","Y6.X":"象曰：初登于天，照四国也。后入于地，失则也。"}},"37":{"id":"37","cnNum":"三七","name":"家人","pinyin":"jiā rén","fullName":"风火家人","shortFullName":"风火家人","upper":"巽","lower":"离","upperNature":"风","lowerNature":"火","lines":[1,0,1,0,1,1],"yaoLabels":["初九","六二","九三","六四","九五","上九"],"blocks":{"G":"家人，利女贞。","T":"彖曰：家人，女正位乎内，男正位乎外。男女正，天地之大义也。家人有严君焉，父母之谓也。父父子子兄兄弟弟夫夫妇妇，而家道正。正家而天下定矣。","X":"象曰：风自火出，家人。君子以言有物而行有恒。","Y1.T":"初九，闲有家，悔亡。","Y1.X":"象曰：闲有家，志未变也。","Y2.T":"六二，无攸遂，在中馈，贞吉。","Y2.X":"象曰：六二之吉，顺以巽也。","Y3.T":"九三，家人嗃嗃，悔厉吉。妇子嘻嘻，终吝。","Y3.X":"象曰：家人嗃嗃，未失也。妇子嘻嘻，失家节也。","Y4.T":"六四，富家大吉。","Y4.X":"象曰：富家大吉，顺在位也。","Y5.T":"九五，王假有家，勿恤吉。","Y5.X":"象曰：王假有家，交相爱也。","Y6.T":"上九，有孚威如，终吉。","Y6.X":"象曰：威如之吉，反身之谓也。"}},"38":{"id":"38","cnNum":"三八","name":"睽","pinyin":"kuí","fullName":"火泽睽","shortFullName":"火泽睽","upper":"离","lower":"兑","upperNature":"火","lowerNature":"泽","lines":[1,1,0,1,0,1],"yaoLabels":["初九","九二","六三","九四","六五","上九"],"blocks":{"G":"睽，小事吉。","T":"彖曰：睽，火动而上，泽动而下，二女同居，其志不同行。说而丽乎明，柔进而上行，得中而应乎刚，是以小事吉。天地睽而其事同也。男女睽而其志通也。万物睽而其事类也。睽之时用大矣哉。","X":"象曰：上火下泽，睽。君子以同而异。","Y1.T":"初九，悔亡，丧马勿逐自复，见恶人无咎。","Y1.X":"象曰：见恶人，以辟咎也。","Y2.T":"九二，遇主于巷，无咎。","Y2.X":"象曰：遇主于巷，未失道也。","Y3.T":"六三，见舆曳，其牛掣，其人天且劓，无初有终。","Y3.X":"象曰：见舆曳，位不当也。无初有终，遇刚也。","Y4.T":"九四，睽孤，遇元夫，交孚，厉无咎。","Y4.X":"象曰：交孚无咎，志行也。","Y5.T":"六五，悔亡，厥宗噬肤，往何咎。","Y5.X":"象曰：厥宗噬肤，往有庆也。","Y6.T":"上九，睽孤，见豕负涂，载鬼一车，先张之弧，后说之弧，匪寇婚媾，往遇雨则吉。","Y6.X":"象曰：遇雨之吉，群疑亡也。"}},"39":{"id":"39","cnNum":"三九","name":"蹇","pinyin":"jiǎn","fullName":"水山蹇","shortFullName":"水山蹇","upper":"坎","lower":"艮","upperNature":"水","lowerNature":"山","lines":[0,0,1,0,1,0],"yaoLabels":["初六","六二","九三","六四","九五","上六"],"blocks":{"G":"蹇，利西南，不利东北，利见大人，贞吉。","T":"彖曰：蹇，难也，险在前也。见险而能止，知矣哉。蹇利西南，往得中也。不利东北，其道穷也。利见大人，往有功也。当位贞吉，以正邦也。蹇之时用大矣哉。","X":"象曰：山上有水，蹇。君子以反身修德。","Y1.T":"初六，往蹇来誉。","Y1.X":"象曰：往蹇来誉，宜待也。","Y2.T":"六二，王臣蹇蹇，匪躬之故。","Y2.X":"象曰：王臣蹇蹇，终无尤也。","Y3.T":"九三，往蹇来反。","Y3.X":"象曰：往蹇来反，内喜之也。","Y4.T":"六四，往蹇来连。","Y4.X":"象曰：往蹇来连，当位实也。","Y5.T":"九五，大蹇朋来。","Y5.X":"象曰：大蹇朋来，以中节也。","Y6.T":"上六，往蹇来硕，吉，利见大人。","Y6.X":"象曰：往蹇来硕，志在内也。利见大人，以从贵也。"}},"40":{"id":"40","cnNum":"四〇","name":"解","pinyin":"xiè","fullName":"雷水解","shortFullName":"雷水解","upper":"震","lower":"坎","upperNature":"雷","lowerNature":"水","lines":[0,1,0,1,0,0],"yaoLabels":["初六","九二","六三","九四","六五","上六"],"blocks":{"G":"解，利西南，无所往，其来复吉。有攸往。夙吉。","T":"彖曰：解，险以动，动而免乎险，解。解，利西南，往得众也。其来复吉，乃得中也。有攸往夙吉，往有功也。天地解而雷雨作，雷雨作而百果草木皆甲坼。解之时大矣哉。","X":"象曰：雷雨作，解。君子以赦过宥罪。","Y1.T":"初六，无咎。","Y1.X":"象曰：刚柔之际，义无咎也。","Y2.T":"九二，田获三狐，得黄矢，贞吉。","Y2.X":"象曰：九二贞吉，得中道也。","Y3.T":"六三，负且乘，致寇至，贞吝。","Y3.X":"象曰：负且乘，亦可丑也。自我致戎，又谁咎也。","Y4.T":"九四，解而拇，朋至斯孚。","Y4.X":"象曰：解而拇，未当位也。","Y5.T":"六五，君子维有解，吉，有孚于小人。","Y5.X":"象曰：君子有解，小人退也。","Y6.T":"上六，公用射隼于高墉之上，获之，无不利。","Y6.X":"象曰：公用射隼，以解悖也。"}},"41":{"id":"41","cnNum":"四一","name":"损","pinyin":"sǔn","fullName":"山泽损","shortFullName":"山泽损","upper":"艮","lower":"兑","upperNature":"山","lowerNature":"泽","lines":[1,1,0,0,0,1],"yaoLabels":["初九","九二","六三","六四","六五","上九"],"blocks":{"G":"损，有孚，元吉，无咎，可贞，利有攸往。曷之用，二簋可用享。","T":"彖曰：损，损下益上，其道上行。损而有孚，元吉无咎可贞利有攸往。曷之用，二簋可用享，二簋应有时，损刚益柔有时，损益盈虚，与时偕行。","X":"象曰：山下有泽，损。君子以惩忿窒欲。","Y1.T":"初九，已事遄往，无咎，酌损之。","Y1.X":"象曰：已事遄往，尚合志也。","Y2.T":"九二，利贞，征凶，弗损益之。","Y2.X":"象曰：九二利贞，中以为志也。","Y3.T":"六三，三人行，则损一人。一人行，则得其友。","Y3.X":"象曰：一人行，三则疑也。","Y4.T":"六四，损其疾，使遄有喜，无咎。","Y4.X":"象曰：损其疾，亦可喜也。","Y5.T":"六五，或益之，十朋之龟弗克违，元吉。","Y5.X":"象曰：六五元吉，自上佑也。","Y6.T":"上九，弗损益之，无咎，贞吉，利有攸往，得臣无家。","Y6.X":"象曰：弗损益之，大得志也。"}},"42":{"id":"42","cnNum":"四二","name":"益","pinyin":"yì","fullName":"风雷益","shortFullName":"风雷益","upper":"巽","lower":"震","upperNature":"风","lowerNature":"雷","lines":[1,0,0,0,1,1],"yaoLabels":["初九","六二","六三","六四","九五","上九"],"blocks":{"G":"益，利有攸往，利涉大川。","T":"彖曰：益，损上益下，民说无疆。自上下下，其道大光。利有攸往，中正有庆。利涉大川，木道乃行。益动而巽，日进无疆。天施地生，其益无方。凡益之道，与时偕行。","X":"象曰：风雷益，君子以见善则迁，有过则改。","Y1.T":"初九，利用为大作，元吉，无咎。","Y1.X":"象曰：元吉无咎，不厚事也。","Y2.T":"六二，或益之，十朋之龟，弗克违，永贞吉，王用享于帝，吉。","Y2.X":"象曰：或益之，自外来也。","Y3.T":"六三，益之，用凶事，无咎。有孚中行，告公用圭。","Y3.X":"象曰：益用凶事，固有之也。","Y4.T":"六四，中行，告公从，利用为依迁国。","Y4.X":"象曰：告公从，以益志也。","Y5.T":"九五，有孚惠心，勿问元吉。有孚惠我德。","Y5.X":"象曰：有孚惠心，勿问之矣。惠我德，大得志也。","Y6.T":"上九，莫益之，或击之，立心勿恒，凶。","Y6.X":"象曰：莫益之，偏辞也。或击之，自外来也。"}},"43":{"id":"43","cnNum":"四三","name":"夬","pinyin":"guài","fullName":"泽天夬","shortFullName":"泽天夬","upper":"兑","lower":"乾","upperNature":"泽","lowerNature":"天","lines":[1,1,1,1,1,0],"yaoLabels":["初九","九二","九三","九四","九五","上六"],"blocks":{"G":"夬，扬于王庭，孚号有厉，告自邑，不利即戎，利有攸往。","T":"彖曰：夬，决也，刚决柔也，健而说，决而和。扬于王庭，柔乘五刚也。孚号有厉，其危乃光也。告自邑，不利即戎，所尚乃穷也。利有攸往，刚长乃终也。","X":"象曰：泽上于天，夬。君子以施禄及下，居德则忌。","Y1.T":"初九，壮于前趾，往不胜，为咎。","Y1.X":"象曰：不胜而往，咎也。","Y2.T":"九二，惕号，莫夜有戎，勿恤。","Y2.X":"象曰：有戎勿恤，得中道也。","Y3.T":"九三，壮于頄，有凶，君子夬夬，独行遇雨，若濡有愠，无咎。","Y3.X":"象曰：君子夬夬，终无咎也。","Y4.T":"九四，臀无肤，其行次且。牵羊悔亡，闻言不信。","Y4.X":"象曰：其行次且，位不当也。闻言不信，聪不明也。","Y5.T":"九五，苋陆夬夬，中行无咎。","Y5.X":"象曰：中行无咎，中未光也。","Y6.T":"上六，无号，终有凶。","Y6.X":"象曰：无号之凶，终不可长也。"}},"44":{"id":"44","cnNum":"四四","name":"姤","pinyin":"gòu","fullName":"天风姤","shortFullName":"天风姤","upper":"乾","lower":"巽","upperNature":"天","lowerNature":"风","lines":[0,1,1,1,1,1],"yaoLabels":["初六","九二","九三","九四","九五","上九"],"blocks":{"G":"姤，女壮，勿用取女。","T":"彖曰：姤，遇也，柔遇刚也。勿用取女，不可与长也。天地相遇，品物咸章也。刚遇中正，天下大行也。姤之时义大矣哉。","X":"象曰：天下有风，姤。后以施命诰四方。","Y1.T":"初六，系于金柅，贞吉。有攸往，见凶。羸豕孚蹢躅。","Y1.X":"象曰：系于金柅，柔道牵也。","Y2.T":"九二，包有鱼，无咎，不利宾。","Y2.X":"象曰：包有鱼，义不及宾也。","Y3.T":"九三，臀无肤，其行次且，厉，无大咎。","Y3.X":"象曰：其行次且，行未牵也。","Y4.T":"九四，包无鱼，起凶。","Y4.X":"象曰：无鱼之凶，远民也。","Y5.T":"九五，以杞包瓜，含章，有陨自天。","Y5.X":"象曰：九五含章，中正也。有陨自天，志不舍命也。","Y6.T":"上九，姤其角，吝，无咎。","Y6.X":"象曰：姤其角，上穷吝也。"}},"45":{"id":"45","cnNum":"四五","name":"萃","pinyin":"cuì","fullName":"泽地萃","shortFullName":"泽地萃","upper":"兑","lower":"坤","upperNature":"泽","lowerNature":"地","lines":[0,0,0,1,1,0],"yaoLabels":["初六","六二","六三","九四","九五","上六"],"blocks":{"G":"萃，亨，王假有庙。利见大人，亨，利贞。用大牲吉。利有攸往。","T":"彖曰：萃，聚也。顺以说，刚中而应，故聚也。王假有庙，致孝享也。利见大人亨，聚以正也。用大牲吉，利有攸往，顺天命也。观其所聚，而天地万物之情可见矣。","X":"象曰：泽上于地，萃。君子以除戎器，戒不虞。","Y1.T":"初六，有孚不终，乃乱乃萃，若号，一握为笑，勿恤，往无咎。","Y1.X":"象曰：乃乱乃萃，其志乱也。","Y2.T":"六二，引吉，无咎。孚乃利用禴。","Y2.X":"象曰：引吉无咎，中未变也。","Y3.T":"六三，萃如嗟如，无攸利，往无咎，小吝。","Y3.X":"象曰：往无咎，上巽也。","Y4.T":"九四，大吉，无咎。","Y4.X":"象曰：大吉无咎，位不当也。","Y5.T":"九五，萃有位，无咎，匪孚。元永贞，悔亡。","Y5.X":"象曰：萃有位，志未光也。","Y6.T":"上六，赍咨涕洟，无咎。","Y6.X":"象曰：赍咨涕洟，未安上也。"}},"46":{"id":"46","cnNum":"四六","name":"升","pinyin":"shēng","fullName":"地风升","shortFullName":"地风升","upper":"坤","lower":"巽","upperNature":"地","lowerNature":"风","lines":[0,1,1,0,0,0],"yaoLabels":["初六","九二","九三","六四","六五","上六"],"blocks":{"G":"升，元亨，用见大人，勿恤，南征吉。","T":"彖曰：柔以时升。巽而顺，刚中而应，是以大亨。用见大人勿恤，有庆也。南征吉，志行也。","X":"象曰：地中生木，升。君子以顺德，积小以高大。","Y1.T":"初六，允升，大吉。","Y1.X":"象曰：允升大吉，上合志也。","Y2.T":"九二，孚，乃利用禴，无咎。","Y2.X":"象曰：九二之孚，有喜也。","Y3.T":"九三，升虚邑。","Y3.X":"象曰：升虚邑，无所疑也。","Y4.T":"六四，王用亨于岐山，吉，无咎。","Y4.X":"象曰：王用亨于岐山，顺事也。","Y5.T":"六五，贞吉，升阶。","Y5.X":"象曰：贞吉升阶，大得志也。","Y6.T":"上六，冥升，利于不息之贞。","Y6.X":"象曰：冥升在上，消不富也。"}},"47":{"id":"47","cnNum":"四七","name":"困","pinyin":"kùn","fullName":"泽水困","shortFullName":"泽水困","upper":"兑","lower":"坎","upperNature":"泽","lowerNature":"水","lines":[0,1,0,1,1,0],"yaoLabels":["初六","九二","六三","九四","九五","上六"],"blocks":{"G":"困，亨。贞大人吉，无咎。有言不信。","T":"彖曰：困，刚揜也。险以说，困而不失其所亨，其唯君子乎。贞大人吉，以刚中也。有言不信，尚口乃穷也。","X":"象曰：泽无水，困。君子以致命遂志。","Y1.T":"初六，臀困于株木，入于幽谷，三岁不觌。","Y1.X":"象曰：入于幽谷，幽不明也。","Y2.T":"九二，困于酒食，朱绂方来，利用亨祀，征凶，无咎。","Y2.X":"象曰：困于酒食，中有庆也。","Y3.T":"六三，困于石，据于蒺藜。入于其宫，不见其妻，凶。","Y3.X":"象曰：据于蒺藜，乘刚也。入于其宫，不见其妻，不祥也。","Y4.T":"九四，来徐徐，困于金车，吝，有终。","Y4.X":"象曰：来徐徐，志在下也。虽不当位，有与也。","Y5.T":"九五，劓刖，困于赤绂，乃徐有说，利用祭祀。","Y5.X":"象曰：劓刖，志未得也。乃徐有说。以中直也。利用祭祀，受福也。","Y6.T":"上六，困于葛藟，于臲卼。曰动悔有悔，征吉。","Y6.X":"象曰：困于葛藟，未当也。动悔有悔，吉行也。"}},"48":{"id":"48","cnNum":"四八","name":"井","pinyin":"jǐng","fullName":"水风井","shortFullName":"水风井","upper":"坎","lower":"巽","upperNature":"水","lowerNature":"风","lines":[0,1,1,0,1,0],"yaoLabels":["初六","九二","九三","六四","九五","上六"],"blocks":{"G":"井，改邑不改井，无丧无得，往来井井。汔至亦未繘井，羸其瓶，凶。","T":"彖曰：巽乎水而上水，井。井养而不穷也，改邑不改井，乃以刚中也。汔至亦未繘井，未有功也。羸其瓶，是以凶也。","X":"象曰：木上有水，井。君子以劳民劝相。","Y1.T":"初六，井泥不食，旧井无禽。","Y1.X":"象曰：井泥不食，下也。旧井无禽，时舍也。","Y2.T":"九二，井谷射鲋，瓮敝漏。","Y2.X":"象曰：井谷射鲋，无与也。","Y3.T":"九三，井渫不食，为我心恻，可用汲，王明，并受其福。","Y3.X":"象曰：井渫不食，行恻也。求王明受福也。","Y4.T":"六四，井甃无咎。","Y4.X":"象曰：井甃无咎，修井也。","Y5.T":"九五，井洌寒泉食。","Y5.X":"象曰：寒泉之食，中正也。","Y6.T":"上六，井收勿幕，有孚元吉。","Y6.X":"象曰：元吉在上，大成也。"}},"49":{"id":"49","cnNum":"四九","name":"革","pinyin":"gé","fullName":"泽火革","shortFullName":"泽火革","upper":"兑","lower":"离","upperNature":"泽","lowerNature":"火","lines":[1,0,1,1,1,0],"yaoLabels":["初九","六二","九三","九四","九五","上六"],"blocks":{"G":"革，已日乃孚，元亨，利贞，悔亡。","T":"彖曰：革，水火相息，二女同居其志不相得，曰革。已日乃孚，革而信之。文明以说，大亨以正，革而当，其悔乃亡。天地革而四时成。汤武革命，顺乎天而应乎人，革之时大矣哉。","X":"象曰：泽中有火，革。君子以治历明时。","Y1.T":"初九，巩用黄牛之革。","Y1.X":"象曰：巩用黄牛，不可以有为也。","Y2.T":"六二，已日乃革之，征吉，无咎。","Y2.X":"象曰：已日革之，行有嘉也。","Y3.T":"九三，征凶，贞厉。革言三就，有孚。","Y3.X":"象曰：革言三就，又何之矣。","Y4.T":"九四，悔亡，有孚改命，吉。","Y4.X":"象曰：改命之吉，信志也。","Y5.T":"九五，大人虎变，未占有孚。","Y5.X":"象曰：大人虎变，其文炳也。","Y6.T":"上六，君子豹变，小人革面，征凶，居贞吉。","Y6.X":"象曰：君子豹变，其文蔚也。（原书脱此条，据通行本补）"}},"50":{"id":"50","cnNum":"五〇","name":"鼎","pinyin":"dǐng","fullName":"火风鼎","shortFullName":"火风鼎","upper":"离","lower":"巽","upperNature":"火","lowerNature":"风","lines":[0,1,1,1,0,1],"yaoLabels":["初六","九二","九三","九四","六五","上九"],"blocks":{"G":"鼎，元吉亨。","T":"彖曰：鼎，象也。以木巽火，烹饪也。圣人亨，以享上帝，而大亨以养圣贤。巽而耳目聪明，柔进而上行，得中而应乎刚，是以元亨。","X":"象曰：木上有火，鼎。君子以正位凝命。","Y1.T":"初六，鼎颠趾，利出否。得妾以其子，无咎。","Y1.X":"象曰：鼎颠趾，未悖也。利出否，以从贵也。","Y2.T":"九二，鼎有实，我仇有疾，不我能即，吉。","Y2.X":"象曰：鼎有实，慎所之也。我仇有疾，终无尤也。","Y3.T":"九三，鼎耳革，其行塞。雉膏不食。方雨，亏悔，终吉。","Y3.X":"象曰：鼎耳革，失其义也。","Y4.T":"九四，鼎折足，覆公餗，其形渥，凶。","Y4.X":"象曰：覆公餗，信如何也。","Y5.T":"六五，鼎黄耳，金铉，利贞。","Y5.X":"象曰：鼎黄耳，中以为实也。","Y6.T":"上九，鼎玉铉，大吉，无不利。","Y6.X":"象曰：玉铉在上，刚柔节也。"}},"51":{"id":"51","cnNum":"五一","name":"震","pinyin":"zhèn","fullName":"震为雷","shortFullName":"雷雷震","upper":"震","lower":"震","upperNature":"雷","lowerNature":"雷","lines":[1,0,0,1,0,0],"yaoLabels":["初九","六二","六三","九四","六五","上六"],"blocks":{"G":"震，亨。震来虩虩，笑言哑哑，震惊百里，不丧匕鬯。","T":"彖曰：震亨。震来虩虩，恐致福也。笑言哑哑，后有则也。震惊百里，惊远而惧迩也。出，可以守宗庙社稷，以为祭主也。","X":"象曰：洊雷震，君子以恐惧修省。","Y1.T":"初九，震来虩虩，后笑言哑哑，吉。","Y1.X":"象曰：震来虩虩，恐致福也。笑言哑哑，后有则也。","Y2.T":"六二，震来厉，亿丧贝，跻于九陵，勿逐，七日得。","Y2.X":"象曰：震来厉，乘刚也。","Y3.T":"六三，震苏苏，震行无眚。","Y3.X":"象曰：震苏苏，位不当也。","Y4.T":"九四，震遂泥。","Y4.X":"象曰：震遂泥，未光也。","Y5.T":"六五，震往来厉，亿无丧有事。","Y5.X":"象曰：震往来厉，危行也。其事在中，大无丧也。","Y6.T":"上六，震索索，视矍矍，征凶。震不于其躬于其邻，无咎。婚媾有言。","Y6.X":"象曰：震索索，中未得也。虽凶无咎，畏邻戒也。"}},"52":{"id":"52","cnNum":"五二","name":"艮","pinyin":"gèn","fullName":"艮为山","shortFullName":"山山艮","upper":"艮","lower":"艮","upperNature":"山","lowerNature":"山","lines":[0,0,1,0,0,1],"yaoLabels":["初六","六二","九三","六四","六五","上九"],"blocks":{"G":"艮其背，不获其身，行其庭，不见其人，无咎。","T":"彖曰：艮，止也。时止则止，时行则行。动静不失其时，其道光明。艮其止，止其所也。上下敌应，不相与也。是以不获其身，行其庭不见其人，无咎也。","X":"象曰：兼山艮，君子以思不出其位。","Y1.T":"初六，艮其趾，无咎，利永贞。","Y1.X":"象曰：艮其趾，未失正也。","Y2.T":"六二，艮其腓，不拯其随，其心不快。","Y2.X":"象曰：不拯其随。未退听也。","Y3.T":"九三，艮其限，列其夤，厉薰心。","Y3.X":"象曰：艮其限，危薰心也。","Y4.T":"六四，艮其身，无咎。","Y4.X":"象曰：艮其身，止诸躬也。","Y5.T":"六五，艮其辅，言有序，悔亡。","Y5.X":"象曰：艮其辅，以中正也。","Y6.T":"上九，敦艮吉。","Y6.X":"象曰：敦艮之吉，以厚终也。"}},"53":{"id":"53","cnNum":"五三","name":"渐","pinyin":"jiàn","fullName":"风山渐","shortFullName":"风山渐","upper":"巽","lower":"艮","upperNature":"风","lowerNature":"山","lines":[0,0,1,0,1,1],"yaoLabels":["初六","六二","九三","六四","九五","上九"],"blocks":{"G":"渐，女归吉，利贞。","T":"彖曰：渐之进也，女归吉也，进得位，往有功也。进以正，可以正邦也。其位，刚得中也。止而巽，动不穷也。","X":"象曰：山上有木，渐。君子以居贤德善俗。","Y1.T":"初六，鸿渐于干。小子厉，有言，无咎。","Y1.X":"象曰：小子之厉，义无咎也。","Y2.T":"六二，鸿渐于磐，饮食衎衎，吉。","Y2.X":"象曰：饮食衎衎，不素饱也。","Y3.T":"九三，鸿渐于陆。夫征不复，妇孕不育，凶。利御寇。","Y3.X":"象曰：夫征不复，离群丑也。妇孕不育，失其道也。利用御寇，顺相保也。","Y4.T":"六四，鸿渐于木，或得其桷，无咎。","Y4.X":"象曰：或得其桷，顺以巽也。","Y5.T":"九五，鸿渐于陵，妇三岁不孕，终莫之胜，吉。","Y5.X":"象曰：终莫之胜吉，得所愿也。","Y6.T":"上九，鸿渐于陆，其羽可用为仪，吉。","Y6.X":"象曰：其羽可用为仪，吉，不可乱也。"}},"54":{"id":"54","cnNum":"五四","name":"归妹","pinyin":"guī mèi","fullName":"雷泽归妹","shortFullName":"雷泽归妹","upper":"震","lower":"兑","upperNature":"雷","lowerNature":"泽","lines":[1,1,0,1,0,0],"yaoLabels":["初九","九二","六三","九四","六五","上六"],"blocks":{"G":"归妹，征凶，无攸利。","T":"彖曰：归妹，天地之大义也。天地不交而万物不兴。归妹，人之终始也。说以动，所归妹也。征凶，位不当也。无攸利，柔乘刚也。","X":"象曰：泽上有雷，归妹。君子以永终知敝。","Y1.T":"初九，归妹以娣，跛能履，征吉。","Y1.X":"象曰：归妹以娣，以恒也。跛能履吉，相承也。","Y2.T":"九二，眇能视，利幽人之贞。","Y2.X":"象曰：利幽人之贞，未变常也。","Y3.T":"六三，归妹以须，反归以娣。","Y3.X":"象曰：归妹以须，未当也。","Y4.T":"九四，归妹愆期，迟归有时。","Y4.X":"象曰：愆期之志，有待而行也。","Y5.T":"六五，帝乙归妹，其君之袂，不如其娣之袂良。月几望，吉。","Y5.X":"象曰：帝乙归妹，不如其娣之袂良也，其位在中，以贵行也。","Y6.T":"上六，女承筐无实，士刲羊无血，无攸利。","Y6.X":"象曰：上六无实，承虚筐也。"}},"55":{"id":"55","cnNum":"五五","name":"丰","pinyin":"fēng","fullName":"雷火丰","shortFullName":"雷火丰","upper":"震","lower":"离","upperNature":"雷","lowerNature":"火","lines":[1,0,1,1,0,0],"yaoLabels":["初九","六二","九三","九四","六五","上六"],"blocks":{"G":"丰，亨，王假之。勿忧，宜日中。","T":"彖曰：丰，大也。明以动，故丰。王假之，尚大也。勿忧宜日中，宜照天下也。日中则昃，月盈则食。天地盈虚，与时消息，而况于人乎，况于鬼神乎。","X":"象曰：雷电皆至，丰。君子以折狱致刑。","Y1.T":"初九，遇其配主，虽旬无咎，往有尚。","Y1.X":"象曰：虽旬无咎，过旬灾也。","Y2.T":"六二，丰其蔀，日中见斗，往得疑疾，有孚发若，吉。","Y2.X":"象曰：有孚发若，信以发志也。","Y3.T":"九三，丰其沛，日中见沫，折其右肱，无咎。","Y3.X":"象曰：丰其沛，不可大事也。折其右肱，终不可用也。","Y4.T":"九四，丰其蔀，日中见斗，遇其夷主，吉。","Y4.X":"象曰：丰其蔀，位不当也。日中见斗，幽不明也。遇其夷主吉，行也。","Y5.T":"六五，来章，有庆誉，吉。","Y5.X":"象曰：六五之吉，有庆也。","Y6.T":"上六，丰其屋，蔀其家，阙其户，阒其无人，三岁不觌，凶。","Y6.X":"象曰：丰其屋，天际翔也。阙其户，阒其无人，自藏也。"}},"56":{"id":"56","cnNum":"五六","name":"旅","pinyin":"lǚ","fullName":"火山旅","shortFullName":"火山旅","upper":"离","lower":"艮","upperNature":"火","lowerNature":"山","lines":[0,0,1,1,0,1],"yaoLabels":["初六","六二","九三","九四","六五","上九"],"blocks":{"G":"旅，小亨，旅贞吉。","T":"彖曰：旅小亨，柔得中乎外而顺乎刚，止而丽乎明，是以小亨旅贞吉也。旅之时义大矣哉。","X":"象曰：山上有火，旅。君子以明慎用刑，而不留狱。","Y1.T":"初六，旅琐琐，斯其所取灾。","Y1.X":"象曰：旅琐琐，志穷灾也。","Y2.T":"六二，旅即次，怀其资，得童仆贞。","Y2.X":"象曰：得童仆贞，终无尤也。","Y3.T":"九三，旅焚其次，丧其童仆贞，厉。","Y3.X":"象曰：旅焚其次，亦以伤矣。以旅与下，其义丧也。","Y4.T":"九四，旅于处，得其资斧，我心不快。","Y4.X":"象曰：旅于处，未得位也。得其资斧，心未快也。","Y5.T":"六五，射雉一矢亡，终以誉命。","Y5.X":"象曰：终以誉命，上逮也。","Y6.T":"上九，鸟焚其巢，旅人先笑后号咷，丧牛于易，凶。","Y6.X":"象曰：以旅在上，其义焚也。丧牛于易，终莫之闻也。"}},"57":{"id":"57","cnNum":"五七","name":"巽","pinyin":"xùn","fullName":"巽为风","shortFullName":"风风巽","upper":"巽","lower":"巽","upperNature":"风","lowerNature":"风","lines":[0,1,1,0,1,1],"yaoLabels":["初六","九二","九三","六四","九五","上九"],"blocks":{"G":"巽，小亨，利有攸往，利见大人。","T":"彖曰：重巽以申命，刚巽乎中正而志行，柔皆顺乎刚，是以小亨，利有攸往，利见大人。","X":"象曰：随风，巽。君子以申命行事。","Y1.T":"初六，进退，利武人之贞。","Y1.X":"象曰：进退，志疑也。利武人之贞，志治也。","Y2.T":"九二，巽在床下，用史巫纷若，吉无咎。","Y2.X":"象曰：纷若之吉，得中也。","Y3.T":"九三，频巽，吝。","Y3.X":"象曰：频巽之吝，志穷也。","Y4.T":"六四，悔亡，田获三品。","Y4.X":"象曰：田获三品，有功也。","Y5.T":"九五，贞吉，悔亡，无不利。无初有终，先庚三日，后庚三日，吉。","Y5.X":"象曰：九五之吉，位正中也。","Y6.T":"上九，巽在床下。丧其资斧，贞凶。","Y6.X":"象曰：巽在床下，上穷也。丧其资斧，正乎凶也。"}},"58":{"id":"58","cnNum":"五八","name":"兑","pinyin":"duì","fullName":"兑为泽","shortFullName":"泽泽兑","upper":"兑","lower":"兑","upperNature":"泽","lowerNature":"泽","lines":[1,1,0,1,1,0],"yaoLabels":["初九","九二","六三","九四","九五","上六"],"blocks":{"G":"兑，亨，利贞。","T":"彖曰：兑说也。刚中而柔外，说以利贞。是以顺乎天而应乎人。说以先民，民忘其劳；说以犯难，民忘其死。说之大，民劝矣哉。","X":"象曰：丽泽，兑。君子以朋友讲习。","Y1.T":"初九，和兑吉。","Y1.X":"象曰：和兑之吉，行未疑也。","Y2.T":"九二，孚兑吉，悔亡。","Y2.X":"象曰：孚兑之吉，信志也。","Y3.T":"六三，来兑凶。","Y3.X":"象曰：来兑之凶，位不当也。","Y4.T":"九四，商兑未宁，介疾有喜。","Y4.X":"象曰：九四之喜，有庆也。","Y5.T":"九五，孚于剥，有厉。","Y5.X":"象曰：孚于剥，位正当也。","Y6.T":"上六，引兑。","Y6.X":"象曰：上六引兑，未光也。"}},"59":{"id":"59","cnNum":"五九","name":"涣","pinyin":"huàn","fullName":"风水涣","shortFullName":"风水涣","upper":"巽","lower":"坎","upperNature":"风","lowerNature":"水","lines":[0,1,0,0,1,1],"yaoLabels":["初六","九二","六三","六四","九五","上九"],"blocks":{"G":"涣，亨。王假有庙，利涉大川，利贞。","T":"彖曰：涣亨，刚来而不穷，柔得位乎外而上同。王假有庙，王乃在中也。利涉大川，乘木有功也。","X":"象曰：风行水上，涣。先王以享于帝，立庙。","Y1.T":"初六，用拯马壮，吉。","Y1.X":"象曰：初六之吉，顺也。","Y2.T":"九二，涣奔其机，悔亡。","Y2.X":"象曰：涣奔其机，得愿也。","Y3.T":"六三，涣其躬，无悔。","Y3.X":"象曰：涣其躬，志在外也。","Y4.T":"六四，涣其群，元吉。涣有丘，匪夷所思。","Y4.X":"象曰：涣其群元吉，光大也。","Y5.T":"九五，涣汗其大号，涣王居，无咎。","Y5.X":"象曰：王居无咎，正位也。","Y6.T":"上九，涣其血，去逖出，无咎。","Y6.X":"象曰：涣其血，远害也。"}},"60":{"id":"60","cnNum":"六〇","name":"节","pinyin":"jié","fullName":"水泽节","shortFullName":"水泽节","upper":"坎","lower":"兑","upperNature":"水","lowerNature":"泽","lines":[1,1,0,0,1,0],"yaoLabels":["初九","九二","六三","六四","九五","上六"],"blocks":{"G":"节，亨，苦节不可贞。","T":"彖曰：节亨，刚柔分而刚得中。苦节不可贞，其道穷也。说以行险，当位以节，中正以通。天地节而四时成，节以制度，不伤财，不害民。","X":"象曰：泽上有水，节。君子以制数度，议德行。","Y1.T":"初九，不出户庭，无咎。","Y1.X":"象曰：不出户庭，知通塞也。","Y2.T":"九二，不出门庭，凶。","Y2.X":"象曰：不出门庭凶，失时极也。","Y3.T":"六三，不节若，则嗟若，无咎。","Y3.X":"象曰：不节之嗟，又谁咎也。","Y4.T":"六四，安节，亨。","Y4.X":"象曰：安节之亨，承上道也。","Y5.T":"九五，甘节，吉。往有尚。","Y5.X":"象曰：甘节之吉，居位中也。","Y6.T":"上六，苦节，贞凶，悔亡。","Y6.X":"象曰：苦节贞凶，其道穷也。"}},"61":{"id":"61","cnNum":"六一","name":"中孚","pinyin":"zhōng fú","fullName":"风泽中孚","shortFullName":"风泽中孚","upper":"巽","lower":"兑","upperNature":"风","lowerNature":"泽","lines":[1,1,0,0,1,1],"yaoLabels":["初九","九二","六三","六四","九五","上九"],"blocks":{"G":"中孚，豚鱼吉，利涉大川，利贞。","T":"彖曰：中孚，柔在内而刚得中，说而巽，孚乃化邦也。豚鱼吉，信及豚鱼也。利涉大川，乘木舟虚也。中孚以利贞，乃应乎天也。","X":"象曰：泽上有风，中孚。君子以议狱缓死。","Y1.T":"初九，虞吉，有它不燕。","Y1.X":"象曰：初九虞吉，志未变也。","Y2.T":"九二，鸣鹤在阴，其子和之。我有好爵，吾与尔靡之。","Y2.X":"象曰：其子和之，中心愿也。","Y3.T":"六三，得敌，或鼓或罢，或泣或歌。","Y3.X":"象曰：或鼓或罢，位不当也。","Y4.T":"六四，月几望，马匹亡，无咎。","Y4.X":"象曰：马匹亡，绝类上也。","Y5.T":"九五，有孚挛如，无咎。","Y5.X":"象曰：有孚挛如，位正当也。","Y6.T":"上九，翰音登于天，贞凶。","Y6.X":"象曰：翰音登于天，何可长也。"}},"62":{"id":"62","cnNum":"六二","name":"小过","pinyin":"xiǎo guò","fullName":"雷山小过","shortFullName":"雷山小过","upper":"震","lower":"艮","upperNature":"雷","lowerNature":"山","lines":[0,0,1,1,0,0],"yaoLabels":["初六","六二","九三","九四","六五","上六"],"blocks":{"G":"小过，亨，利贞。可小事，不可大事。飞鸟遗之音，不宜上宜下，大吉。","T":"彖曰：小过，小者过而亨也。过以利贞，与时行也。柔得中，是以小事吉也。刚失位而不中，是以不可大事也。有飞鸟之象焉，飞鸟遗之音，不宜上宜下，大吉，上逆而下顺也。","X":"象曰：山上有雷，小过。君子以行过乎恭，丧过乎哀，用过乎俭。","Y1.T":"初六，飞鸟以凶。","Y1.X":"象曰：飞鸟以凶，不可如何也。","Y2.T":"六二，过其祖，遇其妣，不及其君，遇其臣，无咎。","Y2.X":"象曰：不及其君，臣不可过也。","Y3.T":"九三，弗过防之，从或戕之，凶。","Y3.X":"象曰：从或戕之，凶如何也。","Y4.T":"九四，无咎。弗过遇之，往厉必戒，勿用永贞。","Y4.X":"象曰：弗过遇之，位不当也。往厉必戒，终不可长也。","Y5.T":"六五，密云不雨，自我西郊，公弋取彼在穴。","Y5.X":"象曰：密云不雨，已上也。","Y6.T":"上六，弗遇过之，飞鸟离之，凶，是谓灾眚。","Y6.X":"象曰：弗遇过之，已亢也。"}},"63":{"id":"63","cnNum":"六三","name":"既济","pinyin":"jì jì","fullName":"水火既济","shortFullName":"水火既济","upper":"坎","lower":"离","upperNature":"水","lowerNature":"火","lines":[1,0,1,0,1,0],"yaoLabels":["初九","六二","九三","六四","九五","上六"],"blocks":{"G":"既济，亨小，利贞，初吉终乱。","T":"彖曰：既济亨，小者亨也。利贞，刚柔正而位当也。初吉，柔得中也。终止则乱，其道穷也。","X":"象曰：水在火上，既济。君子以思患而豫防之。","Y1.T":"初九，曳其轮，濡其尾，无咎。","Y1.X":"象曰：曳其轮，义无咎也。","Y2.T":"六二，妇丧其茀，勿逐，七日得。","Y2.X":"象曰：七日得，以中道也。","Y3.T":"九三，高宗伐鬼方，三年克之，小人勿用。","Y3.X":"象曰：三年克之，惫也。","Y4.T":"六四，繻有衣袽，终日戒。","Y4.X":"象曰：终日戒，有所疑也。","Y5.T":"九五，东邻杀牛，不如西邻之禴祭，实受其福。","Y5.X":"象曰：东邻杀牛不如西邻之时也。实受其福，吉大来也。","Y6.T":"上六，濡其首，厉。","Y6.X":"象曰：濡其首厉，何可久也。"}},"64":{"id":"64","cnNum":"六四","name":"未济","pinyin":"wèi jì","fullName":"火水未济","shortFullName":"火水未济","upper":"离","lower":"坎","upperNature":"火","lowerNature":"水","lines":[0,1,0,1,0,1],"yaoLabels":["初六","九二","六三","九四","六五","上九"],"blocks":{"G":"未济，亨，小狐汔济，濡其尾，无攸利。","T":"彖曰：未济亨，柔得中也。小狐汔济，未出中也。濡其尾，无攸利，不续终也。虽不当位，刚柔应也。","X":"象曰：火在水上，未济。君子以慎辨物居方。","Y1.T":"初六，濡其尾，吝。","Y1.X":"象曰：濡其尾，亦不知极也。","Y2.T":"九二，曳其轮，贞吉。","Y2.X":"象曰：九二贞吉，中以行正也。","Y3.T":"六三，未济，征凶，利涉大川。","Y3.X":"象曰：未济征凶，位不当也。","Y4.T":"九四，贞吉悔亡，震用伐鬼方，三年有赏于大国。","Y4.X":"象曰：贞吉悔亡，志行也。","Y5.T":"六五，贞吉，无悔，君子之光，有孚，吉。","Y5.X":"象曰：君子之光，其晖吉也。","Y6.T":"上九，有孚于饮酒，无咎。濡其首，有孚，失是。","Y6.X":"象曰：饮酒濡首，亦不知节也。"}}},"pairs":{"乾_乾":"01","坤_坤":"02","坎_震":"03","艮_坎":"04","坎_乾":"05","乾_坎":"06","坤_坎":"07","坎_坤":"08","巽_乾":"09","乾_兑":"10","坤_乾":"11","乾_坤":"12","乾_离":"13","离_乾":"14","坤_艮":"15","震_坤":"16","兑_震":"17","艮_巽":"18","坤_兑":"19","巽_坤":"20","离_震":"21","艮_离":"22","艮_坤":"23","坤_震":"24","乾_震":"25","艮_乾":"26","艮_震":"27","兑_巽":"28","坎_坎":"29","离_离":"30","兑_艮":"31","震_巽":"32","乾_艮":"33","震_乾":"34","离_坤":"35","坤_离":"36","巽_离":"37","离_兑":"38","坎_艮":"39","震_坎":"40","艮_兑":"41","巽_震":"42","兑_乾":"43","乾_巽":"44","兑_坤":"45","坤_巽":"46","兑_坎":"47","坎_巽":"48","兑_离":"49","离_巽":"50","震_震":"51","艮_艮":"52","巽_艮":"53","震_兑":"54","震_离":"55","离_艮":"56","巽_巽":"57","兑_兑":"58","巽_坎":"59","坎_兑":"60","巽_兑":"61","震_艮":"62","坎_离":"63","离_坎":"64"},"orig":{}};

    // Zero-Blank-Space Multi-Ratio & Orientation Layout Engine
    // Guarantees 100% vertical height coverage (zero top/bottom blank bars) even at 75% or 85% scale!
    function applyViewportLayout() {
      const folio = document.getElementById("folioFrame");
      if (!folio) return;

      document.documentElement.setAttribute("data-orientation", state.orientation);
      document.documentElement.setAttribute("data-ratio", state.aspectRatio);

      const vw = window.innerWidth || 390;
      const vh = window.innerHeight || 844;
      const screenRatio = vw / vh;

      let boxW = vw;
      let boxH = vh;
      let isFramedDesktopCard = false;

      if (state.aspectRatio === "auto") {
        boxW = vw;
        boxH = vh;
      } else {
        const ratioNum = state.aspectRatio === "20:9" ? (20 / 9) : (16 / 10);
        if (state.orientation === "portrait") {
          const targetPortraitRatio = 1 / ratioNum; // 9/20 (0.45) or 10/16 (0.625)
          // Always fill 100% of vertical screen height (boxH = vh) so there is NEVER any top/bottom blank space!
          boxH = vh;
          if (screenRatio > targetPortraitRatio * 1.25 && vw >= 560) {
            boxW = Math.round(vh * targetPortraitRatio);
            isFramedDesktopCard = true;
          } else {
            boxW = vw;
          }
        } else {
          const targetLandscapeRatio = ratioNum; // 20/9 (2.222) or 16/10 (1.6)
          if (vw >= vh) {
            // Device is in landscape: always fill 100% height (boxH = vh) so there is zero top/bottom blank space!
            boxH = vh;
            if (screenRatio > targetLandscapeRatio * 1.12 && vw >= 900) {
              boxW = Math.round(vh * targetLandscapeRatio);
              isFramedDesktopCard = true;
            } else {
              boxW = vw;
            }
          } else {
            // Device is held vertically while previewing Landscape mode: fit targetLandscapeRatio cleanly
            boxW = vw;
            boxH = Math.min(vh, Math.max(320, Math.round(vw / (targetLandscapeRatio * 0.85))));
            isFramedDesktopCard = boxH < vh;
          }
        }
      }

      folio.classList.toggle("framed-card", isFramedDesktopCard);

      // Compute optimal internal scale `s` so content never clips and matches the comfortable ~75-85% visual density on 20:9 phones
      let s = 1;
      if (state.uiScale !== "auto") {
        s = parseFloat(state.uiScale) || 1;
      } else {
        if (state.orientation === "portrait") {
          // Reference internal width: 445px for 20:9 (so a 360px 20:9 phone automatically gets ~80% comfortable scale), 415px for 16:10 / auto
          const refW = state.aspectRatio === "20:9" ? 445 : (state.aspectRatio === "16:10" ? 415 : 410);
          const refH = state.aspectRatio === "20:9" ? 780 : 680;
          s = Math.min(1, boxW / refW, boxH / refH);
        } else {
          // Reference internal width for Landscape Left-Right layout: 960px for 20:9, 900px for 16:10 / auto
          const refW = state.aspectRatio === "20:9" ? 960 : 900;
          const refH = state.aspectRatio === "20:9" ? 430 : 460;
          s = Math.min(1, boxW / refW, boxH / refH);
        }
      }

      // Ensure minimum internal width so 8 trigram pips and landscape matrix never clip even if user picked 100% on a tiny screen
      const minRequiredW = state.orientation === "landscape" ? 840 : 385;
      const minRequiredH = state.orientation === "landscape" ? 395 : 610;
      s = Math.min(s, boxW / minRequiredW, boxH / minRequiredH);
      s = Math.max(0.32, Math.min(1.15, s));

      state.appliedScale = s;

      // Expand internal layout dimensions by 1/s so that after transform: scale(s), the visual box is EXACTLY boxW x boxH with ZERO top/bottom blank space!
      const internalW = Math.round(boxW / s);
      const internalH = Math.round(boxH / s);

      folio.style.width = `${internalW}px`;
      folio.style.height = `${internalH}px`;
      folio.style.transform = Math.abs(s - 1) < 0.005 ? "none" : `scale(${s.toFixed(4)})`;
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function highlightTextHtml(rawText, query) {
      if (!rawText) return "";
      const q = (query || "").trim();
      if (!q) return escapeHtml(rawText);
      const parts = rawText.split(q);
      if (parts.length === 1) return escapeHtml(rawText);
      const escapedQ = `<mark class="search-hl">${escapeHtml(q)}</mark>`;
      return parts.map(p => escapeHtml(p)).join(escapedQ);
    }

    function formatParagraphsHtml(rawText) {
      if (!rawText) return "<p>（原书无此节讲解）</p>";
      const hl = (state.highlightQuery || "").trim();
      const lines = rawText.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      return lines.map(line => `<p>${hl ? highlightTextHtml(line, hl) : escapeHtml(line)}</p>`).join("");
    }

    function loadGuaCommentaryPack() {
      if (__guaPackLoaded || __guaPackLoading) return;

      fetch("qianqian-gua.json")
        .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
        .then(function(pack){

            if (GUA_DATA[id] && GUA_DATA[id].blocks) {
              Object.assign(GUA_DATA[id].blocks, pack[id]);
            }
          });
          __guaPackLoaded = true;
          __guaPackLoading = false;
          console.info("[乾乾学易] 64 卦详注数据包已就绪");
          if (state.guaId !== "01") {
            renderContentZone(GUA_DATA[state.guaId], false);

          if (state.drawerOpen && state.searchQuery) {
            renderDrawerContent();
          }

        .catch(function(err){
          __guaPackLoading = false;
          console.warn("[乾乾学易] 详注数据包载入失败，稍后重试", err);
        });
    }

      if (__origPackLoading) return;

      fetch("qianqian-orig.json")

        .then(function(pack){

          __origPackLoading = false;
          console.info("[乾乾学易] 原书注释数据包已就绪");

    function pickComm(gua, key) {
      if (state.commentaryEdition === "orig") {
        const o = COMM_ORIG[gua && gua.id];
        if (o && typeof o[key] === "string") return o[key];
        if (!__origPackLoaded) {
          loadOrigCommentaryPack(function(){
            renderContentZone(GUA_DATA[state.guaId], false);
          });
          return "正在载入原书详注…";
        }
      }
      const val = (gua && gua.blocks && gua.blocks[key]) || "";
      if (!val && gua && gua.id !== "01" && !__guaPackLoaded) {
        loadGuaCommentaryPack();
        return "正在载入本卦详注…";
      }
      return val;
    }

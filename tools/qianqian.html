无不利”的结果。\n大有这一卦经传都蕴含着辩证法思想。初九“匪咎，艰则无咎”，凡咎皆由自取。人在盛大富有之时极易得咎，若能居富思艰，则可无咎。九四“匪其彭，无咎”，人处在得势太盛的顺境，如能谦损自抑，亦可无咎。有咎可转化为无咎，无咎可转化为有咎。转化是有条件的。人的主观努力在转化中起重要作用。六五“厥孚交如，威如，吉”，既要讲信，又要有威，信与威兼备，在大有之时方可得吉。已经注意到了事物的两个方面。整个大有这一卦从初至终都有知艰则无咎的意向，尤其强调虑始慎终的问题。“小象”初曰“大有初九”，上曰“大有上吉”，其他各爻则不言“大有”。这是有意义的，说明大有全卦含有克艰于初然后有天佑之终，慎终如始而一以艰处的思想。"},"15":{"P":"大有之后为什么是谦卦？作《易》者如此安排并非偶然，是有思想内容的。《序卦传》说：“有大者不可以盈，故受之以谦。”这是说事物发展有个限度，到了一定限度就要满盈；满盈就要发生变化，开始走向反面。在自然界，“日中则昃，月盈则食”；在社会人事方面也是如此，治极则乱，盛极必衰。唯一避免衰乱的办法就是经常保持谦虚。作《易》者于大有之后继之以谦卦，正反映他具有深刻的辩证法观点。他告诫人们，越是富有越是要谦。\n什么是谦？程颐说“有其德而不居谓之谦”，朱熹说“谦者，有而不居之义”，都是对的。谦之为卦，上体是坤，坤为地；下体是艮，艮为山。山是高大的，地是卑下的。高大的东西却居于卑下的东西的下面，这不是“有其德而不居”吗？\n古人极重视谦，谦最有益而无害。观64卦中别的卦都有悔吝凶咎，惟独谦卦下三爻皆吉，上三爻皆利，而且就全卦看，谦则亨，不必更有别的条件，就可以了解其大概了。","G.N":"无论什么人，能做到谦巽以自处，都将亨通。所以谦则必亨，这是没有条件的。但是，一个人做到一时谦巽比较容易，能做到一生谦巽就难了。可是重要的恰恰是能一生谦巽。只有品德高尚的君子才能够安履于谦，终身不易。小人则不然。充其量只能勉谦于一时，而不能有终。君子为什么能够终生保持谦巽而不易呢？程颐说，君子“达理，故乐天而不竞；内充，故退让而不矜”，这种说法是对的。即越是精神贫乏的人越骄矜，越是内心充实的人越谦巽。\n一阳爻五阴爻的卦有六，即剥、复、师、比、谦、豫。剥卦一阳在上，复卦一阳在下，象阳气之消长。师卦一阳在下体之中，比卦一阳在上体之中，象众之所归。谦卦豫卦之一阳在上下二体之际。一阳自上退处于下，居下体之上而在上体之下，便是谦。一阳奋出而上，居上体之下而在下体之上，便是豫。谦卦九三就是“君子有终”之君子。","T.N":"“谦亨，天道下济而光明，地道卑而上行”，这是用卦之上下体的特点解释卦辞“谦亨”的含义。天道是指下卦艮中的阳爻而言。艮中的阳爻必居二阴爻之上，所以艮有光明之象。现在，在谦卦中，艮居下体，本应在上的天道竟屈居于下，这便有谦义。艮虽居下，却不妨碍它有光明之象。光明便有亨义。谦之上体是坤，坤是地道，地道本是卑的，卑也有谦义。地道卑，却升至上体，所以叫做“上行”。“上行”也有亨的意思。\n“天道亏盈而益谦”以下，详尽论证谦的好处，讲天地人鬼都尚谦而恶盈。无论从哪个角度看，盈必招损，谦必受益。自天道看，月中则昃，月满则亏，损有余以补不足，是谦受益。自地道看，高岸为谷，深谷为陵，“变盈而流谦”将高处倾陷，而将多余的部分流注到低处。“鬼神害盈而福谦”，鬼神指造化而言，造化就是自然与人事的客观规律。盈满者往往得祸，谦损者往往得福。以上讲客观世界本如此，不以人的意志为转移。“人道恶盈而好谦”，自人类自身的情感而言，也是讨厌盈满而喜欢谦巽的。可见谦是至德，谦巽不自满的人有可能使自己立于不败之地。“谦尊而光，卑而不可逾”，谦巽对于无论什么人都是至关重要的。位尊的人谦巽不自满，其德更加光大，令人仰羡；位卑的人谦巽不自满，其德人们不能超越、企及。“君子之终也”，位尊也好，位卑也好，只有是道德高尚的君子才能久于其道，保持终身谦巽。谦既是重要的，也是艰难的。","X.N":"这是“大象”。“大象”不是解释卦辞的。它是孔子观这一卦的卦象，学这一卦的卦辞之后，得出的心得体会，告诫人们学习这一卦应当如何推及于人事。“大象”的思想是孔子自己的东西，与《周易》本身无直接的关系。\n“地中有山，谦”。地是卑下的，山是高大的。卑下的地蕴含着高大的山，外卑而内高，有谦之象。孔子认为，君子(天子、诸侯、公卿大夫有地者)统治国家人民应该依据此谦之象做到“裒多益寡，称物平施”。强调的不是君子自身如何谦巽，而是如何用谦的精神治理国家和社会。\n裒，掊，取的意思。“裒多益寡”，裒取多者，增益寡者。“称物平施”，《汉书·律历志》：“权者，铢、两、斤、钧、石也，所以称物平施，知轻重也。”可见“称物平施”是以秤秤物。物有轻重，这是客观的存在。但是在以秤秤物的时候，能否做到平施即轻重持平，却全在人的掌握了。\n统治者学了谦卦，要发扬谦卦的思想，治理国家应裒多益寡，称物平施，就是一方面损有余以补不足，一方面又使远近亲疏小大长短各当其分。这反映了孔子思想中的平均观念和等级观念。","Y1.N":"初六以柔居谦之最下，有谦而又谦之象，所以称“谦谦”。真正能够做到谦谦的是君子，小人不能。凡事做过了头都不好，惟独谦不存在这个问题。君子而又谦谦，“用涉大川”亦吉，居常无事还能有什么不吉呢！“用涉大川”与“利涉大川”不同。“利涉”是强调有涉过险难的实力，此处言“用涉”，是强调君子有谦谦之德，居后而不与人争先，什么样的险难都可渡过。","Y1.XN":"牧，养。自牧，自养。君子何以能够谦谦其德？因为君子能够以谦卑之道自我修养，并且坚持不懈。","Y2.N":"鸣谦，谦见于声音颜色，表现在外面。九三是谦卦之主爻，谦卦之所以为谦卦，关键在于九三这一爻。自九三看，上六与它正应，六二与它相比。雄鸣雌应，阳唱阴和，所以六二与上六皆曰“鸣谦”。\n谦之德本不应形之外，然而六二以柔居柔，居中得正，所以吉。贞，正。正则吉，不正则不吉。","Y2.XN":"“鸣谦君子”是“鸣谦君子，贞吉”的略语。谦而发于声音，本来是不好的，但如果是发自“中心”，是“中心得也”，非勉强而为，便可得吉。","Y3.N":"谦卦只有九三这一阳爻，其他五个阴爻都来尊它，它在谦卦中居重要地位，是成卦之主。所以九三爻辞与卦辞基本一致。卦辞说“谦亨，君子有终”，爻辞将亨字换成吉字，谦字前加一劳字。人既有大功劳，又能谦卑自处是谓劳谦。谦已属不易，劳谦尤为难能。劳谦一时，勉而为之，或不为难；若持久不变，劳谦终生，则非有大德之君子不行。是君子，方能终生劳谦则吉。《易·系辞》说“劳谦，君子有终吉。子曰：劳而不伐，有功而不德，厚之至也。语以其功，下人者也”。讲的正是谦卦九三这一爻的含义。\n九三是成卦之主，一阳处五阴之中，为五阴所尊，本为有大功劳者，应该居上位，现在却止于下体，有劳而能谦之象。","Y3.XN":"“万民服也”，解释爻辞“劳谦，君子有终，吉”。万，盈数，含有大的意思。万民，即广大老百姓。有大功劳而又不矜不伐，甘居下位的人，坚持终生如此，必受到广大老百姓的拥护。所谓“君子有终，吉”，就是这个意思。","Y4.N":"㧑即挥。“㧑谦”，发挥谦德，亦即动息进退都表现出谦德来。“无不利，㧑谦”，无不利于㧑谦，㧑谦是无不利的。六四为什么举动施为必须充分表现谦德才无不利呢？因为四是多惧之地，它本该谨慎戒惧，更何况谦之六五是谦柔自处之君，九三是劳谦之臣，六四处于其间，对上必须恭敬事奉，对下亦当卑巽以让，充分发挥其谦德，不仅是应该的，也是有利的。","Y4.XN":"㧑谦，充分发挥谦德，这在六四来说，是不过分的，合宜的，不违背法则的。","Y5.N":"富，富有，在《周易》里阳被认为是实的，富的，阴被认为是虚的，贫的。以，用，能左右的意思。邻，亲近主人，引伸为臣下、群众。“以其邻”，能够左右臣下、得到臣下、百姓的拥护和信赖。《周易》以“富以其邻”为常，即阳爻居中处尊，能够左右其相邻之阴爻，如小畜之九五即是。谦之六五是阴爻居尊位而能“以其邻”，得到臣下、百姓的信赖、拥护，所以叫做“不富以其邻”。六五不富而能以其邻，属于非常情况。它以柔居君位，具有谦顺之德，能够接触臣下，臣下也乐归于它。但是六五毕竟是阴爻，属坤道；\n坤道不足而不富，很可能有不服它的。有不服，可以征伐，征伐无不利；若无不服，自然不必征伐。谦之九三就与六五不同。六五阴爻不足不富，有不服的，可以征伐，征伐无不利。九三阳爻，有余而有终，万民皆服，根本无须征伐。","Y5.XN":"为什么“利用侵伐，无不利”呢？“征不服”也。六五虽以柔居君位，有谦顺之德，但仍有不服的，谦德所不能服的，便用武力来解决。孔子说“利用侵伐，征不服也”，意思是说，人君应以文德治国，仍有不服，则可以诉诸武力。以武力征不服者，是正当的。“利用侵伐”并不妨碍统治者行谦之道。可见，孔子主德治，倡“导之以德，齐之以礼”，实不排斥必要时采取暴力手段。","Y6.N":"谦卦中上六与六二皆曰“鸣谦”，其所以“鸣谦”，皆与九三有关。六二与九三相比，上六与九三相应。虽然都与九三有关，都叫“鸣谦”，但由于各自之处境不同，结果也就不同。六二谦德发于外，有谦德积于中做基础，所以贞吉。上六谦德发于外，而自身的处境不佳。以柔居柔，是顺之极。居谦之上，是谦之极。以至柔处极谦，谦而至于极，反为过甚，其实不好。它鸣谦，是想求应于九三，但九三是成卦之主，应于众阴，不想单独应于上六。无奈，上六只好通过“利用行师，征邑国”的办法把谦之道表达出来。“利用行师”，利在使用刚武，“征邑国”，征自己管辖的地域。意在自己解决自己的问题。这正是谦的表现。","Y6.XN":"六二鸣谦是因为“中心得”，居中得正，内里充实。上六鸣谦是因为“志未得”。“志未得”，是说上六居谦之极，自己感到谦之不足。谦之不足，便要补足，补足的办法是“可用行师”，即使用刚武。使用刚武，也不可对外，仅仅能够“征邑国”，自己解决自己的问题。","Z":"谦卦之下三爻皆吉。上三爻不如下三爻，但亦皆称利，全无凶咎悔吝。这是谦卦的突出特点。谦卦以谦为主，谦无论在什么情况下，都不会招致祸患。初六以柔居下，谦而又谦，百无一失，君子居此，虽涉大险，亦无患害。六二以柔居中得正，谦德充实于内而鸣于外，正而且吉。九三是成卦之主，有大功劳却又能谦卑居上体之下，君子处于此，必终身得吉。六四上有谦巽之君，下有劳谦之臣，处此多惧之地，动作施为，无所不利于㧑谦。谦德发挥得越充分越好。六五与上六居上体之高处，这在谦卦来说，是不好的。六五或有不服，故不言谦而言利用侵伐，上六无奈而鸣谦亦言利用行师。虽言侵伐，却也都为了行谦，所以皆利而无害。\n孔子给《周易》谦卦作的《彖传》值得注意。孔子讲到天地鬼神和人都贵谦而反对谦之反面盈。人道恶盈而好谦，天道、地道及鬼神与人道一样，也是背盈而向谦。谦好，盈不好。这反映出孔子的一个重要思想，即：人道与天道(地道、鬼神可以包含在天道之内，都是自然)是一致的，人道在天道里必有反映。其实这就是天人合一的观念。这一观念虽然十分质朴，却也是正确的。用今日语言说，就是人类社会的规律与自然的规律有其共同性，由两者抽象出来的认识，不就是哲学吗！不过应当指出，孔子的天人合一观念与后世汉人讲的根本不同。汉人讲的天人合一实质上是天人感应，以为天降灾异于人间，告诫人类去恶向善，视天为有意志的神明，具有鲜明的迷信色彩，而孔子则把人道、天道都看作客观的规律。"},"16":{"P":"豫卦卦名的这个豫字，含义比较复杂。据古人的解释，它至少有三个不同但却相近的义项。逸豫，安逸休闲；和豫，和悦顺畅；备豫，事有豫备，见微而知著。逸豫与和豫，意义相近相通，都有乐(与忧相对)的意思。备豫，看来与乐似乎不相关涉，其实也是有联系的，因为备豫可以这样理解：凡事有豫备，极易获得好的结果；好的结果到手，自然可以安逸和乐了。由备豫而导致安逸和乐还可以有另外的解释。彼一代人创造条件，打下基础，此一代人只管承受就是了，不必劳苦，也会得到安逸和乐。即所谓前人种树，后人乘凉。\n豫卦为什么次诸谦卦之后呢？《序卦传》说：“有大而能谦必豫，故受之以豫。”生活富有，内心充实而能谦巽自处的人，必有安逸和乐的结果。\n豫卦所以名豫，可从以下诸方面得到解释。从卦之德来看，外卦震，“震，动也”；内卦坤，“坤，顺也”。坤下震上，有顺动之象。动而和顺，所以名曰豫。此其一。第二，从卦之主来看，卦主九四以一阳统五阴，五阴都应于它，下面又有坤来顺承，动而上下顺应，所以名曰豫。还有，从卦之二象来看，“震为雷”，“坤为地”，雷出于地上。雷先潜闭于地中，待它动而奋出之时，自然发出声音，其中有通畅和乐之义，故名之曰豫。","G.N":"豫卦为什么有“利建侯行师”的意义呢？从卦之二体来看，豫之外卦是震，内卦是坤。震乃长子，有侯象。坤为众，有师象。所以卦辞言“利建侯行师”。屯卦有震无坤，所以言建侯而不言行师。师卦有坤而无震，所以言师而不言侯。又，从内外卦之卦德看，外卦震，震，动也；内卦坤，坤，顺也。震动于坤之上，动而顺，象天子在上封建诸侯，万民在下“顺从悦服”，有如周克商而大封同姓。坤顺于震之下，顺而动，象天子兴师征战，诸侯从征，民众顺合，有如汤征东西南北而天下不以为怨。","T.N":"“豫，刚应而志行，顺以动，豫”，这是用卦体与卦德解释卦名。豫卦之所以为豫，是因为从卦体来看，“刚应而志行”。此卦只有九四一刚爻，它是一卦之主，上下众阴爻都来应它，顺它，它的志向得以实行，并无阻碍。天下如此，可致天下之豫；一国如此，可致一国之豫；一家如此，可致一家之豫。“顺以动，豫”，内卦顺，外卦动，上动而下顺，所以为豫。《彖传》行文有一个例，凡称卦德，皆内卦在先，外卦在后。豫卦是内卦坤，外卦震，所以《彖传》说“顺以动”，不说“动以顺”。二者之间使用的连词不同，文义也有区别。连词用“而”的，上下两词并重，如小畜《彖传》的“健而巽”，是既健又巽的意思；讼卦《彖传》的“险而健”，是既险又健的意思。两个词的意义轻重相等，分不出主次。连词用“以”的，则上下两词的意义便有轻重之分了。此卦之“顺以动”，是以“顺”字为重，强调的是“顺”而不是“动”。这一卦所以名曰豫，“顺”是重要的，或者说关键在于“顺”。倘若上动而下不顺，或者动而不以顺，也就谈不到豫了。\n“豫，顺以动，故天地如之，而况建侯行师乎”。这是以卦德解释卦辞。“顺以动”，动必以顺为前提，凡人间事，尤其治国平天下之事，必须顺乎天理，应乎人心，亦即合乎规律，不得不动才动；若逆乎天理、人心、规律，轻举而妄动，事情没有不败坏的。自然界的天运地转也是因为“顺以动”才得以豫的。自然界尚且如此，何况人世间建侯行师这种关乎民众死活的事，岂可有违此理，不顺而动！\n“天地以顺动，故日月不过，而四时不忒。圣人以顺动，则刑罚清而民服”。在《易》的作者看来，天地人三才的行动，都必须遵循一定的规律。所谓天地以顺动，其实就是遵循自然规律而动。日月不过与四时不忒不是两回事，是一回事。惟其日月之度不过差，才有四时之行的不愆忒。天地以顺动，统治者效法天地治国平天下，也要以顺动。法律所禁止的，应该正是人民所不想干的；法律所允许的，应该正是人民所想干的。这样顺着民心做事的结果，则刑罚清简而民服从。\n“豫之时义大矣哉”，这是一句感叹的话，意在提醒人们对此卦之意义反复思考，加深认识。《易》64卦都有时有义有用。孔子作《彖传》，只在12卦中言及时、义、用的问题，实际上是举例，不是说另外52卦便无时无义无用。《彖传》讲“时大矣哉”的有颐、解、大过、革四卦，讲“时义大矣哉”的有豫、随、遯、姤、旅五卦，讲“时用大矣哉”的有坎、睽、蹇三卦。其中讲“时大矣哉”的，重在时字。例如颐、大过、解、革四卦，都是大事大变，关键在时字，务必把火候把握好。讲“时义大矣哉”的，重在义字，如豫、随、颐、姤、旅五卦，都好像是细微浅事，但是含有深意。豫卦讲利建侯，屯卦也讲利建侯，但是二卦强调的重点是不同的。屯卦重在时，豫卦重在义。讲“时用大矣哉”的，重在用字，如坎、睽、蹇三卦本来全不是美事，若能掌握得当，因时而用之，则完全可能产生好的效用。","X.N":"古人认为雷从地中出。地中阳气潜闭既久，一旦奋迅而出，阴阳相薄而成雷。雷有鼓动和气，发扬生机，通畅和乐的效用，所以坤下震上这一卦名之曰豫。“先王以作乐崇德，殷荐之上帝，以配祖考”，前一个“以”字作用字讲，后一个“以”字作而字讲。“殷”是盛的意思。“配”是妃、对的意思。先王用“雷出地奋豫”的现象作为样式，象其和之声，取其和之义，制作声乐，发扬光大自己的功德。在祭祀时将这声乐盛大地奏给上帝听，而又将自己的德与祖考相匹对。对上帝用“荐”字，对祖考用“配”字，其实是互文见义。荐之上帝，也包括荐之祖考。祭祀上帝奏乐，祭祀祖考也奏乐，规模都是盛大的。以德配祖考，也包括以德配上帝。总起来说，是讲豫卦的意义很深远，既荐之上帝，又配祖考，这样重要的“作乐崇德”就是受“雷出地奋豫”的启示而作出来的。","Y1.N":"初六以阴柔居初而与豫之主九四相应，象不中不正的小人处在逸豫之时，受到上峰的支持、宠爱，志满意得，忘乎所以，不胜其豫，乃至于发出声音，表现出一副十足的轻浅相。结果必凶无疑。\n鸣是心中有感而发于声音，是感情的自然表达。然而感情的性质有所不同。谦卦上六的“鸣谦”是鸣，豫卦初六的“鸣豫”也是鸣，但是两个鸣的情状、意义是不一样的。谦之上六因感于九三而“鸣谦”，有不乐居上之意，是鸣而求谦，所以吉。豫之初六因感于九四而“鸣豫”，有耽于逸豫之意，是豫而自鸣，所以凶。","Y1.XN":"逸豫是好事，处理不好便是坏事。荒于逸豫是坏事，开始便荒于逸豫而又不知戒惧，尤其是坏事。“初六鸣豫”，在豫之初即鸣，可知器量已尽，志气已穷，怎能不凶。","Y2.N":"豫卦有一个特点，凡与卦之主九四有所系应即应、比的，不是凶就是悔，不是悔就是疾，都不好。如初六与九四应，凶；六三与九四比，有悔；六五与九四比，贞疾。唯六二特立于众阴之中，无系于九四，处豫乐之中而无迟迟耽恋之意。静则确然自守而坚介如石，处优越、顺利的环境不能动摇它的意志。动则善于见几而作，及早发现问题，把问题解决在萌芽状态。识断果决，去之迅速，早上该做的事情，绝不等到晚上。\n六二为什么能够这样？因为六二居中得正，又无系应，有坚确自守之象。但这只是说六二在客观上有居中得正的条件，若要将可能性变为现实，真正获吉，必须在主观上努力做到贞，即守正不移。","Y2.XN":"六二之所以能够介然不动以静守，断然不疑以行动，全部问题的关键在于它以阴居阴，居中得正。","Y3.N":"六三的情况与六二大不相同。六二以阴居阴，居中得正，无系于九四，故介于石，不终日。六三则不然，六三阴柔居阳位，不中不正，且近比九四，故不是“介于石”而是“盱豫”，不是“不终日”而是“迟”。“盱”是张目企望向上看。“盱豫”，包含两层含义，一是一味取悦于上，不能坚持独立；二是下溺于豫，迟疑有待，优游无断。然而六三虽是阴柔却毕竟居于阳位，所以犹有能悔之意。悔的结果如何，要看它的主观上的态度了。若悔的坚决迅速，尚可将坏的处境变好；若悔的迟，则必又有悔了。古有又字通。“迟有悔”即“迟又悔”。","Y3.XN":"六三盱豫有悔，来自于“位不当”，即它所处之地位不中不正。","Y4.N":"九四是豫卦的主爻，豫卦之所以为豫，就是由它决定的。它作为一卦之主，五个阴爻都来悦顺于它，通过它而得到逸豫。这是从爻的角度看。若从象的角度看，它是震之主，震为雷，天下万物莫不由雷以得豫。引伸到人事，它以阳刚承柔弱之后而主天下事，天下由它而致豫。“大有得”即《彖传》“刚应而志行”的意思，五个阴爻都顺附于它这个阳爻，它的志愿得以畅通而无窒碍。\n但是，要把“由豫，大有得”变为现实，九四还必须做到“勿疑，朋盍簪”。由此我们再次看到，爻辞给人所指示的前途，都只是时势发展的一种趋向，一种可能性，无论是好是坏，是吉是凶，是悔是吝，都是有条件的，不是绝对的。《易经》总是强调人们应该如何努力争取好的结果，避免或者尽量减少坏的结果，它没有给宿命论留下任何余地。\n九四欲为天下致豫，其责大任重，独力难支。为使同志同德者心悦诚服地来支持自己，它必须开以诚心，宽大待人，勿自生疑。勿生疑，则“朋盍簪”，志同道合的朋类，迅速地及早地聚合起来，团结起来。盍通合。簪，古人或训聚或训速，今从后训。","Y4.XN":"此与《彖传》“刚应而志行”意同。解释九四所以能够“由豫”，能够“大有得”，其根本之点是九四以阳刚为五阴所应，其志得以大行。全卦唯九四一爻从宏观上考虑问题。其义与全卦之义大体一致。其余五爻则各述己义，比较具体，与卦义不尽同。","Y5.N":"贞而有疾，常疾而不死。六五以阴居尊位，是柔弱之君。柔弱之君处在逸豫之时，必骄侈恣欲，本宜死于安乐而有余。然而有如孟子所说“入则无法家拂士，出则无敌国外患者，国恒亡”，九五没有亡，仅仅有疾而已，而且能够维持较长时间不亡，是由于有九四作为法家拂士来辅弼它，救正它。贞，正。这里的贞，不是自正于己，而是见正于人。“贞疾”，不是说受到人家的救正反而得疾，是说因受到人家的救正而得以恒不死，仅仅得疾而已。","Y5.XN":"六五这个柔弱之君，处逸豫之时，本宜骄侈恣欲而亡，为什么竟仅仅有疾而未亡，因为它乘刚，有九四这个刚阳之臣在下边辅弼它，是正它，使它不敢溺于豫。疾则邻于死，然而“恒不死”，“中未亡也”。从爻象看，六五柔弱不堪，但居中之位还在。若以人体为喻，中气尚存，命脉还在，故不死。","Y6.N":"冥，昏昧。冥豫，耽肆于豫，昏迷而不知返。上六以阴居上，不中不正，又在豫终之时，沉冥汩没，凶象已成，似无可改矣。然而“竟成有渝，无咎”，宜凶而未致凶，其中蕴含着极深刻的事物转化的思想。冥豫，看来似乎坏到了极点，不可救药，而其实正因为在豫之极，物极则反，才包含着变化的契机，反而有向好的方面转化而得无咎的可能。无论什么人处在冥豫的境地，只要改恶趋善，勇于补过，都可能变“冥”之凶为“渝”之无咎。","Y6.XN":"孔子讲“何可长也”，似乎有两层含义。悦豫过甚以至于冥顽不知止，长此下去，必致凶无疑。这是强调问题的严重性。豫已至于极点，达到非变不可的程度。这是说变化的必然性。","Z":"总的说来，豫卦反映出两方面的思想。卦辞与《彖传》的“利建侯行师”，“顺以动，豫”，“豫，顺以动”，从正面阐发致豫之道及致豫之盛。六爻之中只有作为卦之主的唯一阳爻九四表达了与卦辞及《彖传》一致的思想，其余五阴爻之爻辞及“小象”则根据它们在卦中的势位即与九四的关系，从反面说明享豫之凶，指示人们在豫之时趋吉避凶的途径。《杂卦传》所云“豫怠也”，正是此义。\n豫是好事也是坏事。处理好了便是好事，处理不好便是坏事。社会不可无豫，人心不可有豫。所以卦中五阴爻越是与豫之主疏远就越好。六二与九四无比无应，最好。它能知几见微，迅速摆脱豫怠的境况。初六与九四正应，最不好。它沉溺于豫之始而不能自拔，结果必凶。另三爻处于中间状态。六三与六五皆与九四比，都不太好。六三应当速悔，若迟疑犹豫则必又悔。六五由于有人救正它，当豫之时而不得豫。上六居豫之极，豫怠已达冥顽不化的程度。但物极必反，如果此时能够顺势而变，可无咎。"},"17":{"P":"朱熹和清人查慎行都说随是从的意思。把随释作从，是正确的。引伸一步说，从就是通达时变，不拘守故常。但是，是己从物还是物从己，各家意见不一。程颐以为随的含义包括物从己和己从物两个方面。《周易折中》则认为随卦卦义主要在以己随物，物来随己不过是以己随物的反馈。这后一种意见是对的。事情很明白，由于你随人家，人家才来随你。物随己与否是由己是否随物决定的。\n震下兑上这一卦为什么会有随的意义？从卦之二体看，下卦是震，震为阳为动；上卦是兑，兑为阴为说。阳下于阴，此动而彼说，有随的意义。从卦画来看，刚爻都在柔爻之下，也有随的意义。阳卦在阴卦之下，刚爻在柔爻之下，64卦中这两种情况具备的，只有这一卦。这是这一卦取名为随的意义所在。阳下于阴，刚下于柔，联系到社会人事来看，象贵者下贱者，学问多的人问于学问不多的人，这正是随的意思。\n《序卦传》说：“豫必有随，故受之以随。”悦豫是好事，物必来随，所以豫卦之后次以随卦。这样讲，道理自然不是充分的，但它说明孔子已认识到64卦的排列并非出于偶然，他力图找出它们的规律来。","G.N":"随，以己随物，可以获致大亨的结果。但是，随是有条件，有原则的。该随的随，不该随的不能随。随，必须以贞正为前提，然后才能大亨而无咎。如果随不以正，便是诡随了。诡随，结果不会大亨，且要有咎。《左传》襄公9年记载穆姜曾占过随卦，有人劝他赶紧逃走，以免一死，因为随卦卦义是“元亨利贞无咎。”然而穆姜却认为自己即使占了随卦也不可能免罪，原因是他不具有元亨利贞四德。没有四德而随，必有咎。穆姜把随卦的元亨利贞理解为四德，是不对的。只有乾卦的元亨利贞是四德的意思，即四个字有四个含义；别的卦的元亨利贞则不可作如此解。但是穆姜强调随而无咎必须具有一定的条件，却深得随卦卦辞之意。","T.N":"“随，刚来而下柔，动而说，随”，这句话是解释卦名的。“刚来而下柔”句历来有两种解释。一种解释是卦体说。刚指下卦震，震是阳卦，所以称刚。柔指上卦兑，兑是阴卦，所以称柔。“刚来而下柔”是说震作为阳卦本应居阴卦之上，现在却屈居阴卦兑之下，正有以大下小、以贵下贱的意思，这就是随。另一种解释是卦变说。卦变说创于虞翻和荀爽。虞翻用卦变说解释“刚来而下柔”这句话说：“否，乾上来之坤初，故刚来而下柔，动震说兑也。”蜀才也说：“此本否卦，刚自上来居初，柔自初而上升，则内动而外说，是动而说，随也。”(均见李鼎祚《周易集解》朱熹的《周易本义》说同。他们认为随卦是由否卦变来的。这种卦变说有违《周易》的原义，不可从。宋人苏轼阐释的卦变说是可以信据的，他说：“凡易之所谓刚柔往来相易者，皆本诸乾坤也。乾施一阳于坤，以化其一阴而生三子，皆一阳而二阴。凡三子之卦有言刚来者，明此本坤也，而乾来化之。坤施一阴于乾，以化其一阳，而生三女，皆一阴而二阳。凡三女之卦有言柔来者，明此本乾也，而坤来化之。故凡言此者，皆三子三女相值之卦也。非是卦也，则无是言也。”(见《东坡易传》贲卦《彖传》)。苏轼认为六子均由乾、坤交错而来，证之以《说卦传》“乾天也，故称乎父，坤地也，故称乎母，震一索而得男，故谓之长男，巽一索而得女，故谓之长女，”坎再索而得男，故谓之中男，离再索而得女，故谓之中女，艮三索而得男，故谓之少男，兑三索而得女，故谓之少女，苏说是对的。“刚来而下柔”的刚是乾卦的一个刚爻，它来把坤卦的初爻变为刚爻。这就叫做“刚来而下柔。”“刚来而下柔”有随的意义。\n“动而说，随”，这一句是用卦德解释卦名。兑之德是说，震之德是动。由于下卦的动而引起上卦的说。此有所动，而彼无不说。动是随，说也是随。动之随促成说之随，包含说之随。动而说，都有随的意义。\n“大亨贞无咎，而天下随时，随时之义大矣哉”，是解释卦辞的。《周易》很讲究这个时字。孔子对时字有更深的了解。孟子说“孔子，圣之时者也”，用时字概括孔子思想的特点，是十分恰当的。孔子作《易传》特别强调时字。随卦的关键问题是正，随而得其正，然后方可大亨而无咎。失其正则有咎，更谈不到大亨了。不过什么是正什么是不正？这没有固定的标准，须因时而定。所以说，“天下随时”。“随时之义大矣哉”这句赞语，强调“随时”的重要性。意思是说随，并不难，随而能各当其时则不易做到。","X.N":"泽中有雷，雷震于泽中，泽随雷而动，有随之象。君子观看此象，要“嚮晦入宴息。”意思是说，时间在不停地变化，白昼与黑夜交替出现。白天，要自强不息地工作，黑夜则应入内宴息，到什么时候做什么事情，这叫做随时。“嚮晦入宴息”这样的日常生活的事情，要讲随时，其他重大的事情更不待言了。嚮，向；晦，暗。嚮晦，天色要入黑夜了。","Y1.N":"随卦六爻不论应否，只论近比，而且多取以下随上之义。初与二比，则初随二；二与三比，则二随三；三与四比，则三随四；五与上比，则五随上。\n初九是阳爻，是成卦之主。阳为阴主，主谓之官。初九作为为主之阳爻，阴爻应该来随它，才是正常的。但是现在初九处在随之时，不可以主自居，而应知变从权，当随而随。这就是“官有渝”。“贞吉”，“官有渝”必须变而不失其正，故可以得吉。“出门交有功”，走出家门之外，与家族以外的人交，而不要与家族内的亲人交。“出门”是一种比喻，用以表明交的对象不是私暱，能够做到交必得正，交正则无失，无失则有功。交就是随。这里言交而不言随，是因为初九是成卦之主，它又是阳爻，阳为阴主。主不可以随人，所以称交不称随。","Y1.XN":"主变而随人，所从得正方能得吉。所从不正，必有悔吝。“出门”而交，非牵于私暱，其交必正。“不失”，不失其正的意思。","Y2.N":"初九以刚随人，叫做随。六二以柔随人，叫做系。其实讲的都是随。小子与丈夫各指谁？小子指六三，丈夫指初九。《易》以阳为大，以阴为小。六三是阴，故称小子。初九是阳，故称丈夫。六二以阴柔而居中，有系人而不能自立之象。依它的本意，既要系小子又要不失丈夫，然而实际上办不到。从随卦的特点看，六爻不论应而论比，而且取以下随上之义，六二只能随六三。既随六三，便要失却初九，二者不可兼与。从事理上看，一个人处随之时，既随君子又随小人是不可能的。即便一时那样做，归根结蒂还是将随小人而失却君子。凡随之事，正邪善恶是非不能两从。从邪则失正，从恶则失善，从非则失是。六二既系小子六三，便不得兼随丈夫初九。","Y2.XN":"“系小子”应是“系小子，失丈夫”的省语。系小子六三则必失却丈夫初九，因为兼系小子与丈夫是办不到的。纵然主观上想要小子与丈夫两系，而结果也只能系小子而失丈夫。","Y3.N":"随卦的特点是论比不论应，取上不取下，所以六三之“系丈夫”显然指九四，“失小子”显然指六二。六三既然已系九四，则必与六二疏远。有所得，必有所舍。\n卦义以阴随阳为得。六三与九四近比，以阴随阳，极易投契，有求必得。可是六三与九四皆居不当位，非常可能借随的机会求所不当求，得所不当得。这时候在六三来说，重要的是“利居贞”，即守正为好。最好是守正而弗求。","Y3.XN":"这是说，六三系了上边的九四，舍了下边的六二。情况与六二系了六三，失了初九相同。不同的是六二是“弗兼与”，六三是“志舍下”。“弗兼与”，六二本意想既系小子又系丈夫，达到君子小人两从的目的。结果是系了小子，失了丈夫。二者不可兼与。“志舍下”，六三本意就是系丈夫而舍小子，根本不想兼系丈夫和小子。","Y4.N":"九四居九五之下，是近君之位。这样的地位本来就是十分危险的。现在九四又“随有获”，“随有获”谓得天下之心随于己。有可能使它的威望超过人君九五。这样的处境实在太危险。“贞凶”，即谓若守此不变，乃取凶之道。然而补救的办法是有的，那就是“有孚在道”，即所作所为所思所想能够既尽其诚，又合于道。而且加之“以明”，能做到这样的程度，自然无咎了。","Y4.XN":"“随有获贞凶”这句话是说，其义是凶的，“其义凶”，从理论上说其致凶的可能性。如果主观上做出适当的努力，凶是可以避免的。关键在于能否“有孚在道”。“有孚在道”的意义是用实际的表现让人家理解自己的功劳。“明功”不是自我表功，相反，倒是使人了解我心光明洞达，正其义，不计其功。","Y5.N":"嘉，善。孚，诚、信。孚字在此亦有随、从的意思。九五居尊得正而且中实，对六二、九四不嫌不疑，唯善是从。以一片至诚感天下人，天下人亦以一片至诚来随己。“孚于嘉”，就是随于善。随不迳言随而言孚，是因为随之时以得中为好，不宜随之太过，太过就不是“孚于嘉”。随之九五，以诚信中实随天下之善而不过，故称“孚于嘉”。","Y5.XN":"九五能够“孚于嘉吉”，就是因为它既得正又居中。得正，使所随皆善。居中，使随善而不过。","Y6.N":"一般说来，《易》中凡外卦是说兑的，如大过、咸、兑诸卦，其九五与上六二爻，因为都是相说而动，所以都相比而不正。唯随卦不然。随卦以刚下柔为义，其九五与上六有相随之义，而没有不正的问题。\n“拘系之，乃从维之”，意思是既拘系之，又从而维系之，说明随的固结如此。上六不说系小子也不说系丈夫，只说拘系之，这是因为上六所系者是九五，而九五是君是王。“王用亨于西山”，是九五作为王，也随上六，甚至把上六视作贤人，完全信任它，乃至于使之主祭，祭享山川上帝。亨古通享。西山，周之岐山。","Y6.XN":"随至上六，已发展到穷尽的地步。穷就要变，就要由随变为不随。就人事说来，好像一个人表现出高亢绝世，往而不返的意向。然而随之上六与九五有相随之义，尽管艰难，它还是要克服绝世不随的倾向。所以别的阴爻只讲系，上六则讲拘系，讲乃从维之。看得出上六的随分外不容易。","Z":"随卦上体是兑柔，下体是震刚，刚处于柔之下，六爻都是阴爻在上，阳爻在下，即也是刚在柔下，本来应当是柔在刚下，而今则是刚处柔下。刚而能下柔，则无所不能随，所以此卦名曰随。\n随卦六爻，一半是阴爻，一半是阳爻。无论阴爻阳爻，都取相比相随而不取相应。同是随，而初九称交，九四称随，九五称孚，含义有一定的差别。初九出门交有功，强调随之始要无偏系私暱。九四随有获，告诫在随获成功的时候，应“有孚在道”防止使随由好事变成坏事。九五孚于嘉，说明随道己应中实，所随当善。\n六二、六三、上六三个阴爻，皆称系而不称随。系实质上也是随。只是由于它们都是阴柔之才，在随的时候都不免有所系恋，与三个阳爻相比，属于下一等次。"},"18":{"P":"《序卦传》说：“以喜随人者必有事，故受之以蛊，蛊者事也。”以喜说随人是好事，好事长久下去必生出坏事，所以随卦之后次以蛊卦。《序卦传》说蛊是事，其实蛊字不能训为事。蛊字是由无事而生出事的意思，而且生出的是坏事，很像木质的器物由于木气长期不得宣畅而生蠹，元气萎敝，积久而坏。一个人发生疾病，一个社会发生动乱，都属于这种情况，都是坏极而有事。蛊卦巽下艮上，山下有风，风在山下。风能够发舒万物，现在风受阻于山下，万物得不到风的发舒，必久而蛊坏，所以卦名曰蛊。又，从卦之二体看，艮阳卦在上，巽阴卦在下。从卦之六位看，艮与巽都是阳爻在上阴爻在下。阳卦与阳爻都在上，阴卦与阴爻都在下，64卦中独此一卦。刚柔不交，上下不接，有久绝不通而生事之象，所以卦名曰蛊。","G.N":"蛊本来是积渐不通，久而生事的意思，为什么说“元亨”呢？这是因为物极必反。积渐不通达于极点，必然会导致大亨大通。就国家社会来说，乱是治的根源，蛊是饬的前提。既然已经乱了，治的局面总要出现的。\n但是乱不会自动变为治，大亨大通不会自动出现，必须经过人的主观努力。客观的可能性和主观的能动性都是必要的。不植不立，不振不起。社会发生动乱，要经过修理整饬，渡过艰难险阻，方得大治。所以说“利涉大川”。\n治蛊不是易事，必须足智多虑，认真对待，做到“先甲三日，后甲三日”方可。甲是事之始，事之端。“先甲”，在治蛊之先要分析研究致蛊的缘由，总结经验教训，制定正确的治蛊方针方法。“后甲”，在治蛊之后要分析研究事情发展的趋势，制定巩固治蛊成果的方针方法。三是多的意思。“三日”，是看的远，想的深。","T.N":"“刚上而柔下”是解释卦名的。这句话可以理解为卦体问题，也可以理解为卦变问题。从卦体的角度说，艮刚体居上，巽柔体居下。艮之上九，刚爻居上。巽之初六，柔爻居下。上下不通，刚柔不交，故卦名曰蛊。从卦变的角度说，“刚上而柔下”，是说上卦本是坤，乾施一阳爻于坤之上，而为上九，于是柔卦变为刚卦而居上；下卦本是乾，坤施一阴爻于乾之初，而为初六，于是刚卦变为柔卦而处下。“刚上而柔下”，说的是致蛊之由，不是治蛊之道。艮刚居上，巽柔居下，上高亢而不与下交，下卑巽而不能救，上下隔绝不通，所以至于蛊坏。\n“巽而止”，也是解释卦名的。巽，软弱柔顺，遇事进退不决，无奋迅有为之志，有苟且因循之习，又有艮止的阻碍，什么事情也干不了，什么问题也不得解决，积久而至于蛊，是必然的。\n“蛊元亨而天下治也”，此句以下解释卦辞。元亨，是治蛊的方法。天下由蛊而至于乱，乱之终便是治之始。治的途径是大亨大通。大亨大通导致天下大治。\n“利涉大川，往有事也”。天下处在蛊坏之时，有如大川滔滔不易逾济。这时应当勇于涉险，断然而往。当然往则必有无穷的艰险麻烦之事需要去做。须知流水不腐，户枢不蠹。社会处在蛊坏之时，要不怕麻烦和挑战，有所行动，方可济汹涌大川，使乱世转为治世。\n“先甲三日，后甲三日，终则有始，天行也”。孔子把人之道与天之道合起来看。人世间的事情与自然界的事情是一致的。社会达到蛊坏的程度，必然告一结束，转入全新状态；旧的告终，便是新的开始。这种终则有始的规律，犹如斗转星移，四时交替，黑夜过去是白昼，冬日结束，春天接着就来临。","X.N":"风吹至山下，为山所阻挠，不能畅达而回薄，摧败山木，有蛊之象。另一方面，风能振起万物，山能涵养万物。山下有风，又有振起、养育之象。君子处蛊之世，观此卦象，要振起民之心，培育民之德。","Y1.N":"东西久不用而生了虫子，叫做蛊；人长期沉湎于宴乐之中而生了疾病，叫做蛊；社会久安无为而生了弊端，叫做蛊。总之，蛊之产生，不是一朝一夕的事，往往需要一个世代的时间才能表现出来，所以蛊卦诸爻都以父子为喻。\n爻辞有从时位的角度说的，有从才质的角度说的。此爻两方面意义都有。蛊之初六，是阴爻又处下，且无正应；论才能、实力，它不足以治蛊。若从时位的角度看，初六还有有利的一面。它当蛊之初，蛊以刚开始，蛊的程度尚不深，问题比较容易解决。所以说儿子干父之蛊，把父亲造成的蛊坏给治好。有了能治蛊的儿子，父亲可以无咎了。但是要知道，毕竟处在蛊的时候，危险还是存在，万不可以为蛊尚未深而疏忽大意。所以说“厉终吉”。","Y1.XN":"儿子盖父之愆，如禹之于鲧，从表面上看，好像违背了父亲的意志，其实不然。儿子消除父亲的过错，使事功得以完成，实质上正是顺承父志的。考，父亲。","Y2.N":"九二乃阳刚，上与阴柔之六五相应，有母子之象。干母之蛊，不同于干父之蛊。九二刚而不正，六五柔而居尊，刚阳的儿子干母之蛊，如果操之过急，约之过直，很可能把事情搞糟，所以爻辞有“不可贞”之戒。《易》没有不要求贞的，唯独此爻说“不可贞”。“不可贞”，意思是说不要固执己见，径情直行，而要以至诚之心，委曲周旋，做所能做到的，不做不可能做到的。","Y2.XN":"“干母之蛊，不可贞”，是因为九二巽体而处中，以刚系柔，是得刚柔之中。","Y3.N":"九三刚爻居阳位，过刚而且不中，以此“干父之蛊”，不免“小有悔”。然而九三巽体，又得正，基本上能够完满地干父之蛊，即便是有小小之悔，终不至于有大过咎。","Y3.XN":"九三巽体得正，有刚断之才，在“干父之蛊”的过程中虽不免出些小问题，归根结蒂无大咎。","Y4.N":"“裕父之蛊”与“干父之蛊”，义正相反。干，抓紧去干，奋力去干，有如拯溺救焚，时不我待地去把问题解决。裕，宽裕，放松。即问题虽已严重，但它犹优游度日，不肯抓紧去解决问题。六四阴爻居阴位，爻与位俱柔，又居艮止之体。柔者儒，止者怠。儒而又怠，只能增益其蛊，而不可能治其蛊。持此以往，蛊将日深，故曰“往见吝。”","Y4.XN":"“往未得”就是“往见吝”，也就是说，裕父之蛊；不能解决问题，只能使问题日益严重。","Y5.N":"此爻对子干父之蛊或继世之君干先君之蛊，提出了更高的要求。六五居尊得中，具有干蛊之才；同时它又是阴柔之质，具有承顺之德。所以它既能干父之蛊，又能使父不失令名，是所谓“干父之蛊，用誉”。","Y5.XN":"六五干父之蛊，而归誉于父，既解决了蛊的问题，又维护了父亲的声誉。它这样做，表明它是以德承父，不是以才承父。","Y6.N":"蛊卦上九爻辞比较特别，讲“不事王侯”，不讲治蛊，好像离了题，其实不然，它讲的还是治蛊的问题，不过着眼的角度与其他五爻不同而已。\n上九在蛊卦之终，下无系应，处于蛊之外。犹如一个不当事的人，处在天下无事之时，似乎不能有所作为。爻辞曰：“不事王侯，高尚其事”。这个“不事王侯，高尚其事”的意思是说“不事王侯”的本身就是事。不过这个事不是一般的事，而是以“高尚”为事。昔人说：“桐江一丝，系汉九鼎”，其“高尚其事”之谓欤！","Y6.XN":"上九不事王侯，表面看来它很像是超脱现实的人，世事蛊坏的问题它不闻不问了。实际上它也在治蛊，它治的是人心之蛊，不是世事之蛊。它与道家的遯世主义根本不同。所以孔子作“小象”说“不事王侯，志可则也”，说明它的志是可以效法的。","Z":"事情经过长久积弊而至于坏，就是蛊。凡物、人、社会都有蛊的问题。蛊卦之所以曰蛊，其道理就是《彖传》说的“刚上而柔下，巽而止，蛊”。“刚上而柔下”一句讲的是卦变问题。卦变的问题比较复杂，在贲卦里将详加说明。蛊卦卦义不在致蛊之由而在治蛊之道。蛊已成为事实，问题是如何治蛊。治蛊就要有所作为，所以《序卦传》说：“蛊者事也。”卦辞“蛊元亨，利涉大川，先甲三日，后甲三日”，讲的全是治蛊的问题。根据《彖传》的解释，卦辞的意思是说，社会既已乱，则必将变为治，像天行即自然规律那样不可避免，但人事的努力也是重要的，所以要涉大川，要先甲三日，后甲三日。蛊卦辞言“先甲三日，后甲三日”，《彖传》释以“终则有始”。巽卦九五爻辞言“无初有终，先庚三日，后庚三日”。应当注意二者的区别。甲是事情的开始。事情坏到蛊的程度，旧的已经告终，新的即将开始，故云“终则有始”，“先甲后甲”。庚即更改，是事情的变更。事情久了，必生弊病，但尚未至于蛊，进行改革即可。事之初不好，事之终必变好，故云“无初有终”，“先庚后庚”。巽卦九五言先庚后庚，无初有终，好像历史上的变法，盅卦卦辞言“先甲后甲”，《彖传》释之以“终则有始”，好像历史上的改朝换代。"},"19":{"P":"《序卦传》说：“蛊者事也，有事而后可大，故受之以临，临者大也。”程传说：“二阳方长而盛大，故为临也。”临卦由泽地二体构成，地下有泽便是临。地是至卑的，它本不能临物，然而还有卑于地的东西，那便是泽。泽上之地是岸，岸与水交际，泽为地所临。临，实际上是指事物的一种发展态势而言。临卦之六爻下二阳上四阴。在复卦只是初九一个阳爻，到了临卦则发展到初九、九二两个阳爻，正是阳刚盛大之时。阳刚盛大才谈得上临。","G.N":"元亨即大亨，利贞即利于正。元亨利贞，说明元亨是有条件的，条件就是利贞。临卦以大临小，亦即以刚临柔，与复卦不同。复卦乃阴柔至极而阳刚初来，临卦则已来了两个阳爻进迫于阴，所以复卦卦辞只言亨，临卦卦辞则言元亨。但是复卦言亨不言利贞，临卦言元亨则言利贞。言亨不言利贞，因为复卦乃阳刚初来，亨是必然的，不存在什么问题。言元亨又言利贞，因为临卦是二阳浸盛，此时极容易放肆无忌，必守正方能保证元亨。\n“至于八月有凶”，汉人京房据此句推出所谓十二辟卦之说。十二辟卦说即将复、临、泰、大壮、夬、乾、姤、遯、否、观、剥、坤等十二卦，依阴阳消长的规律与一年中的十二个月相搭配。复卦是阴至极而初生一阳，配以建子之月即十一月。然后二阳生是为临卦，配以建丑之月即十二月。然后三阳生是为泰卦，配以建寅之月即一月。至六爻全成为阳爻时，便是乾卦，乾卦配以建已之月即四月。至此，阳长阴消变为阴长阳消，阳至极而初生一阴，是为姤卦。姤卦配以建午之月即五月。然后二阴生，是为遯卦，配以建未之月即六月。然后三阴生，是为否卦，配以建申之月即七月。如此阴长阳消直至六爻全成阴爻，便是坤卦，配以建亥之月即十月。这十二辟卦之说当是根据临卦卦辞“至于八月有凶”这句话推出来的。结合复卦“大象”说的“先王以至日闭关，商旅不行，后不省方”来看，则这种说法不能说没有根据。\n“八月”是说自一阳生的复卦亦即建子之月十一月算起，算至二阴生的遯卦亦即建未之月六月止，凡历八个月。也就是说，八月是自十一月算起的第八个月，不是八月份的意思。\n“至于八月有凶”，实际上是说至于遯有凶。至于遯为什么有凶？因为遯卦与临卦正相反对。临是二阳生，是二阳方长盛大之时，有元亨之义。至于遯的时候，情况发生根本变化，由于阴阳消长，二阳生变为二阴生，阳长阴消变为阴长阳消，所以有凶。不过，有凶不必凶至，有凶只是一种可能性，经过主观努力，有凶可以变为无凶。\n自建丑之月的临卦起，至建未之月的遯卦止，其间除临卦之外，泰、大壮、夬、垢诸卦都有个至于八月有凶的问题，为什么“至于八月有凶”这句话仅仅见于临卦卦辞？这是因为临卦处于阳长阴消的盛大之时，这时候最需要知道事情将向反面发展的趋势，树立履薄临深的意识。复卦一阳初生，尚未达到盛大的程度，“至于八月有凶”的问题没有提上日程的必要。临之后的泰、大壮、夬诸卦阳长已过中，处境逐渐变坏，它们容易意识到发展趋势不好。况且这时候阳德满极而衰的征兆已经出现，到此时才提“至于八月有凶”，就太晚了。","T.N":"“刚浸而长，说而顺，刚中而应”三句是解释卦名的。“刚浸而长”，从一卦的角度说明临之所以为临。浸是渐的意思。“浸而长”，不是暴长，是在不知不觉中渐渐地长。凡渐长的东西都充满着极强的生命力。复卦一阳生，临卦已积渐至二阳生，阳德向前发展壮大，骎骎然有莫之能御之势，所以叫做临。从卦之二体来看，兑说坤顺，说而顺。从兑说，是阳向前进，从容缓和而不迫；从顺说，是阴向后退，应合顺遂而不违。恰是以大临小之象。“刚中而应”是就九二成卦之主而言。九二以刚居中，阳德盛大，并且不过分盛大。九二又与六五正应，则上下相交，阴阳合德，有足够的力量临其所临。\n“大亨以正，天之道也”这句话是孔子用以解释卦辞“元亨利贞”的。\n孔子认为，“刚浸而长，说而顺，刚中而应，”必然“大亨以正”，这乃是天之道，亦即自然的规律。这天之道的实质就是阴阳消长。\n阴阳消长既是自然规律，人便只能认识它，顺应它，不能违背它，更不能改变它。阳长则阴必消，阴长则阳必消，阳长阴消必转为阴长阳消，这是不能改变的规律。卦由复的一阳生发展到临的二阳渐长，这时阳德日盛，阴德渐消，人们最容易因现时的好形势而忽略阳长会变成阳消，阴消会变成阴长，好形势会变成坏形势。“至于八月有凶，消不久也，”孔子指出卦辞“至于八月有凶”的实质是“消不久”。“消不久”，阴消不会太久。现在是二阳渐长，四阴渐消。消到八个月，至遯之时，便不是阳长阴消，而是阴长阳消了。阴消消不久，至于八月必有凶。告诫人们处得意之时，勿忘远忧。孔子认为人之道犹如天之道，虽不可违抗，却可以预为之防，尽可能避免灾害。","X.N":"泽上有地，地下有泽，地与泽的关系是临的关系。临的关系用卦象表示，就是在上之地俯临在下之泽。以上临下则是它的简化说法。临的特点是地临泽，上临下，而不相反；相反便不是临了。地之所以能够临泽，上之所以能够临下，全在于势位。这是自然界的现象，即“天之道”。应用于世间人事上，即“人之故”方面，最大最典型的临是天子诸侯君临天下国家，即统治者统治人民。统治者统治人民实质上是势得位的问题。因为不论统治者如何宣布，阶级社会的国家实质是暴力统治。\n但是孔子作为儒家学派的创始人，他另有一套主张。他主张德治，主张采取道德教化的办法感化人民，反对用行政命令和刑罚等强制手段治理国家。简言之，孔子主张以德服民，反对以力制民。他把自己的以德服民即教民保民的思想同《周易》临卦卦象联系起来，从中找到思维上的根据。\n孔子为此对临卦泽上有地之象有更为深刻的理解。地是土，泽是水；土像统治者，水像人民。土与水总是相浸渍而亲密无间，统治者与人民亦该如此，就是说，统治者应该亲民，亲民也就是教民保民。具体地说，要“教思无穷，容保民无疆”。这从土与水的关系上可以进一步找到根据。水是天下至柔之物，土制水似乎不成问题，可是如果以险隘阻滞它，它必决溃四出而后已。事实上土地是宽厚的，它总是以自己宽厚的胸怀，给予水以广大之居处，使水成为受包容受滋润的泽。统治者对待人民就像土地包容、滋润水而使之成为泽一样。统治者受到土地与泽水滋润浸渍，亲密无间的启示，对人民“教思无穷”。“教思无穷”，在教民问题上，出自诚心，想得深远，无有穷尽。统治者受到土地以自己广大的身躯拥护着广大的泽水之启示，做到“容保民无疆。”“容保民无疆”，在保民的问题上，要像坤土那样大度包容，对于人民无所不容，无所不保，无有界限，无有止境。","Y1.N":"咸与感通。别的卦初爻与上爻不讲得位失位，而以初终之义为重，临卦则以初得位居正为重。临之初九处在阳长之时，又得位居正，与得位居正的六四相应，所以“贞吉”。初九不仅由于自己的势位面临六四；它临六四，更由于它与六四是阴阳相感的关系。它以德感六四，不以势逼六四，六四愿意为它所临。这样的临叫做感临。感临得贞吉是必然的。“贞吉”在《周易》里含义有三种情况，“贞吉”二字在此是并列关系，意思是既贞且吉。初九阳爻居阳位，其位得正，又与六四正应，是以又正又吉。","Y1.XN":"初九咸临贞吉，是因为志行正道。初九所以志行正道，是因为它以阳居阳，又与六四正应。","Y2.N":"九二正当阳德盛大的时候，与居君位的六五相应，所以也叫咸临。九二咸临与初九咸临有所不同。初九以刚居刚得正而吉，九二则以刚中而应得吉。既然是刚爻居中，那么贞是不待言的。至于吉，与初九一样，咸临就意味着吉，吉是已然的。九二是刚中而应，处境优于初九，它不但已然得吉，而且如果有所施为的话，将无所不利。“无不利”是必然的。由此可见，《易》重视正，更重视中，尤其重视刚中。","Y2.XN":"“未顺命”不好理解。朱熹《周易本义》说“未详”，别人更有种种不同的讲法，都不得要领。今存疑。","Y3.N":"卦辞和《彖传》讲临，重点在以刚临柔即以大临小。爻辞除初二两阳爻讲以大临小外，其余四阴爻皆以势位言临，即以上临下。六三以阴居阳，不中不正，又处下卦之上，居说体之极，有临人的位，无临人之德，只有以口舌之甘取悦于下，是为甘临。甘临，是无德之临；无德之临，自然无所利。不过，九三并非一点出路没有。它如果认识到初与二两阳在己之下，正渐长而上进的形势，持谦守正，知危而忧，则有咎可转为无咎。","Y3.XN":"六三之所以“甘临”，关键的问题是“位不当”。\n六三甘临必有咎，知有咎而能忧之改之，咎不至于长久，最终有咎会转变为无咎。","Y4.N":"六四以阴居阴，下应初九，得正又有应。又它在坤体之下，下与兑体最亲近，所以称“至临”。“至临”所以无咎。","Y4.XN":"六三、六四虽然都无咎，但六三须忧而六四无须忧。原因就在六三位不当，六四位当。所谓位当，一指六四以阴居阴得正，一指六四处在上下之际，是临之最佳位置。","Y5.N":"知读去声，是明知之知。五以柔居中，下应九二刚中之贤，任之以临下，如此善取天下之能，善任天下之聪明，正是人君所宜有之知。以此知临天下国家，岂有不吉之理。","Y5.XN":"《易》是贵中的。大君以众知为己知，善取臣下之知慧以临天下国家，重要之点是它能“行中”。“行中”谓行事得中，不刚不柔，既不宽纵废事，亦不以苛察为明。","Y6.N":"敦临，谓以敦厚临下。这是上六的特点。上六与六三不同。六三在下体兑卦之上，兑终而悦，有小人之象，所以叫做甘临。上六居上体坤卦之极，坤终为厚，有君子敦厚之象，所以叫做敦临。又从刚柔关系的角度看，上六与初、二两爻虽没有应的关系，但是一般来说，阴柔必然求于阳刚。初与二两阳刚不必应于它，它却主动以尊而应卑，居高而从下，表现非常笃诚敦厚。本来阴柔在上不宜临；若临，亦必有咎。然而上六有敦厚的特点，它主动地以柔顺刚，所以得吉。得吉当然可以无咎了。","Y6.XN":"“志在内”是指上六应初、二两阳爻而言。上六本无正应，而初、二两阳爻与它也无应的关系。由于它是阴爻，它却要主动与阳刚应。这叫“志在内”。阴柔主动顺应阳刚，敦厚诚笃，所以吉。","Z":"临卦二阳在下四阴在上，是十二月建丑之卦，正是阳道向盛的时候。临有以刚临柔和以上临下二义。卦辞取以刚临柔的意义，它强调以刚临柔固然会元亨利贞，但是要特别注意到事物必向相反方面转化，即阳长阴消将转变为阴长阳消。\n初九与九二两阳爻都是以刚临柔，与卦义是一致的。初九与六四正应，九二与六五正应。它们是阳刚浸长的时候，感动于阴。这个应比它卦的应更重一些，当然要得吉。不仅如此，得吉的原因还在于初九以阳刚居阳位得正，九二以阳刚居中。\n其余四阴爻都取以上临下之义，但是四爻的情况又有不同。六三甘临，乃小人之临，知忧方可无咎。六四至临，由于所处位置优越，故无咎。六五知临，柔而居中处尊，善采众知为己知，所以吉。上六敦临，敦厚诚笃志在从乎初、二两阳，所以吉且无咎。"},"20":{"P":"《序卦传》说：“临者大也。物大然后可观，故受之以观。”观卦的这个观字有两层含义，两个读音。一是自上示下，上边做出个样子给下边看，有如宫阙楼观，是让人们仰望的。卦辞取的就是这个意义。这个观字读去声。二是自下观上，下边观看上边做出的样子，或者上边观看下边的问题。六爻取的就是这个意义。这个观字读平声。\n观卦坤下巽上，风行地上，普遍吹拂万物，有周观之象。又，观卦二阳在上，四阴在下。二阳居于尊位，为四阴所瞻仰，也是观的意思。这是卦名叫观的根据。","G.N":"卦辞的这个观字是自上示下的意思，读去声。为卦二阳在上，四阴在下；在下之四阴仰视在上之二阳，好像天子诸侯居于尊位，做出庄严恭敬的样子，以为臣民仪表，让臣民来观仰他，从中受到感化。那么怎样才能使臣民心悦诚服地受到感化呢？最重要的是要诚敬。卦辞用“盥而不荐”做比喻，是很恰当的。盥与荐是庙中祭祀的两个步骤。祭祀开始时，承祭人先盥手，心中精诚专一，严肃之至。荐是供献祭品。祭祀到了荐的时候，人心已经散慢，不似盥手时那样“祭如在，祭神如神在”了。“不”字在此应作“未”字解。“盥而不荐”是说君上为了给臣民做出庄敬严肃的样子，让他们观仰而受教育，自己必须保持类似祭祀中盥手而未荐时的那种诚敬专一的心境。\n“有孚颙若”，是说臣民这一方面的事情。颙，仰望。在上之君像盥而未荐时那样庄严诚敬，则在下之臣民没有不尽其孚诚，颙然观仰的。","T.N":"“大观在上，顺而巽，中正以观天下”，孔子用卦体、卦德解释卦名。两个观字都读去声，都是为天下仪表而让天下观仰的意思。“大观在上”，指卦中两个阳爻说的。不过，说“大观在上”而不只说“在上”，其中是包括顺而巽及中正以为观在内的。“顺而巽”，下坤而上巽，能够顺而巽。中正指九五而言。九五以阳居阳，居中且正。“以观天下”，卦有在上、顺巽、中正之德，以为天下之观。\n“观盥而不荐，有孚颙若，下观而化也”，是解释卦辞的。为君的人在上面尽诚尽敬，无声无响；为臣为民的人在下面至诚地观仰，从中受到感化、教育。有一种不动而敬，不言而信的妙用在里边。“下观而化”的观字读平声。\n“观天之神道，而四时不忒。圣人以神道设教，而天下服矣”，进一步讲观之道。这个观字应读去声。天也有观之道，人间的观之道是根据天的观之道而来的，或者说，天的观之道与人间的观之道一致，并无两样。天的观之道为什么不只叫天之道而叫“天之神道”呢？神表现在天不言语而四时运行无有差忒上，不是宗教观念上的神。圣人是君主，是统治者。君主体会了天之神道，理解了天不言不语而四时运行，万物生长，无有差忒的奥妙，乃施行自己的德教，自己的观之道。这就是“圣人以神道设教”。圣人以此教天下之民，天下之民没有不诚服的。总而言之，统治者实行的观之道，是以神道设教的，即模仿天之神道，不言而信，不动而敬，使百姓不知不觉中受到潜移默化的影响。这里面反映了孔子的“道之以德，齐之以礼”的政治思想。","X.N":"风行地上，有无所不周之象。先王受此启发，乃巡省天下之四方，考察民情民俗，设教以为民之观。省方是为了观民的(此观字读平声)，设教是为了做民之观的(此观字读去声)。","Y1.N":"观卦之名观有两层含义。卦以观示为义，就是自己做出个一定的样子给人家观看。爻以观瞻为义，就是不是让人家观看而是观看人家。九五是卦之主，其余诸爻都来观它。因为是观嘛，自然是越近越好。近容易看清楚，远则不易看清楚。初六本身是阴柔之质，又处在离九五最远的地方，它看九五是看不清楚的。犹如儿童，蒙昧无知，视力稚弱，看不清事物一样，所以叫童观。小人童观还可以，因为小人(庶民)所见浅薄，不识天子诸侯的为观之道，是正常的事情。如果君子(统治阶级人物)童观，和普通百姓一样，看不清楚天子诸侯之为观之道，那就可鄙吝了。","Y1.XN":"童观是小人之道，不是君子之道。小人卑下而无远见，小人而童观，是可以原谅的。君子应居高瞩远，君子而童观，是可鄙吝的。","Y2.N":"《说文》：“窥，闪也。”是从门内向外偷看的样子。六二与九五正应，六二应当观于九五。但是六二阴暗柔弱，见识不广，九五的刚阳中正之道，它是看不甚明的。有如从门之缝隙向外看，虽可以看见一点，却不可能全看明白。不过六二阴爻居中得正，有顺从中正的特点，如果是女子，窥观，则不失中正而为利了。","Y2.XN":"在《周易》之中，君子小人吉凶不同，男人女人吉凶也不同。恒卦六五“妇人吉，夫子凶”就是证明。这里的意思也是如此。意思是说，若是丈夫，对刚阳中正之九五只能窥观，见其仿佛，同女子之贞，那就可丑了。","Y3.N":"三不居中，二居中，所以一般说来，二好三不好。观卦的情况有所不同。观卦好不好主要看离九五远近，六三在下体的最上头，又在上体的下面。若论远，它远不过“童观”；若论近，它近不如“观国”。它处在上下之间，可进可退之地，它不必观五，它可以自观，观察自己的处境，时可进则进，时不可进则退。所以叫“观我生，进退”。","Y3.XN":"六三以柔顺处阳位，又在上下体之际，能够度量自己的德才与境遇而决定出处进退，是没有失进退之道的。此与《论语》之用舍行藏的思想相同。","Y4.N":"观卦之五爻都以与九五的关系取义。初六阴居阳位而离九五最远，所观不明，所以称“童观”。六二以阴居阴而离九五亦远，所观亦不甚明，所以称“窥观”。唯有六四最切近九五而且得正，所观最明，所以称作“观国之光”。观国实质是观九五。九五是阳刚中正之君，为什么说观国呢？这反映了《周易》作者认为君可代表国家，国与君一体的思想。\n“利用宾于王，”是说六四切近于君上，对君上的盛德光辉看得深切，它最适宜于“宾于王”。“宾于王”，即仕进于王朝，在王朝作官，为王朝效力。古代有贤能的人，则人君宾礼之，所以士之仕进于王朝谓之宾。","Y4.XN":"尚，志尚。尚宾，志愿仕进于王朝，以施展自己的抱负。六四是穷则独善其身，达则兼善天下的人，时无明君则已，如今遇上九五之明君，观见国家之盛德光华，必然要出来做官，以为国家和民众效力。这是六四的志尚。所以叫尚宾。","Y5.N":"卦之其他四爻都观九五，唯六三与九五自观，故云“观我生”。九五阳刚中正居君之位，是观卦之主。天下人民百姓教化如何全是它影响的结果，民风之美恶，臣民之从违，是检验它自己所施德教好坏的尺度。九五作为刚阳中正之君，它欲观己，必先观民，观民方可观己。如果民俗淳正，有君子之风，那就反映九五作为阳刚中正之君施行的确是君子之道。施行君子之道，以德化天下，当然无咎。","Y5.XN":"“我生”，由我所出，由我所生。民之风俗德行均由我所出我所生。观影可以知表，观流可以知源。欲观“我”之德行如何，观民之德行如何就知道了。“观我生”其实是“观民”。","Y6.N":"上九这一爻说“观其生”，是承九五那一爻的话题接着讲下来的。九五居君位，是一卦之主，故云“观我生”。上九不居君位，却还要讲君道的问题，便不得云“观我生”，只可说“观其生”。“其”字指代九五。“观其生”，上九站在君位之外，观九五的问题。上九继续讲九五的问题，所以二爻爻辞一致，只差一个“其”字。“观其生”，是观九五之“生”；观九五之生，便是观民。","Y6.XN":"“志未平”犹志未安。“观其生”，有忧国忧民的意思。上九虽不居君位，但与九五同德同心，以九五之忧为己忧。九五观民以省身察己。民之风俗德行究竟怎样还很难说。九五自己“观我生”，上九要帮助九五“观其生”。这是因为国家治乱未定，盛衰难卜，上九中心忧虑，志意未平。","Z":"观卦四阴在下二阳在上，本是阴盛阳退之时，然而卦不言凶咎；这是因为此卦取义不同。这一卦有阴盛的一面，也有九五阳刚居中得正的一面。卦从阳刚之君居中而当正位的一面取义，而不取阴盛之义。所以观卦卦义讲在上之人君如何中正庄敬而为天下之观的问题。\n卦讲自上示下，爻讲自下观上。自下观上，以远近为义。离九五越近越好。越近，所见越大越清楚越亲切，所以越好。\n观卦里面蕴含着诸如神道设教、用舍行藏、以德化民、轻视妇女等等思想。这些思想是《易经》固有的，是孔子把这些思想发掘了出来。如果不是孔子加以发掘，我们今日便不可能看得懂。而且我们发现，孔子所发掘的《易经》的思想与孔子在《论语》书中表现出来的思想完全一致。我们可以说，《易大传》的思想反映了孔子的思想。\n这一卦里蕴含的思想极其丰富，其中最重要的是“神道设教”的思想。“神道设教”思想的实质是唯物论。这个思想是《周易》的，也是孔子的。在《周易》和孔子看来，神不是有意识的人格化的上帝。神是什么？“蓍之德圆而神”，“阴阳不测之谓神”，“天之神道，而四时不忒”。神就是无言无语的自然界的运动变化。这些变化是人的意志不能左右，有时甚至是不能逆料的。天地阴阳，变化多端，奥妙无穷，好像有一种什么意志在主宰，其实没有。这就是神。天有神道而四时不差忒。人君仿效天之神道，无声无形，尽诚尽信，以观感化物，以德教服民，施行神道于社会，这是以神道设教。统治阶级提倡祭祀，愚弄百姓迷信鬼神，以便驯顺接受统治，而统治阶级自己并不相信真的有鬼有神。这也是以神道设教。“神道设教”是政治上的统治手段，施行“神道设教”的统治阶级自己事实上是不相信鬼神。他们心中的神不过是自然以及自然界不言不语却又变化无穷的奥妙。“神道设教”的这个奥秘，孔子心中明明白白，只是由于时代的原因，他没能斩钉截铁般地揭破。到了荀子的笔下才分明写道：“君子以为文，而百姓以为神。以为文则吉，以为神则凶。”(《天论》)"},"21":{"P":"《序卦传》说：“可观而后有所合，故受之以噬嗑。嗑者合也。”\n噬，咬。嗑，合。噬嗑，口中有个东西间隔着，梗塞着，咬之后才能合上，有噬而后嗑的意思。震下离上这一卦所以取名噬嗑，是因为它确实有噬而后嗑之象。首先，它上面一个阳爻，下面一个阳爻，中间有三个阴爻。阳为实，阴为虚，初上两爻是实，中间是虚，极像一个人张着嘴的样子。其次，只是张着嘴，嘴中没有东西，那就是山雷颐了。而噬嗑这一卦，四是个阳爻，很像嘴中梗塞着个东西，使嘴合不上。若要合上嘴，必须咬才行，所以叫做噬嗑。\n作《周易》的人把口中有物，必噬而后合的道理推广应用到社会人事上来。天下之事为什么往往不得和合呢？就是因为有间在其中。人世间的大事小事都有这个问题，作《周易》的人在这里取大事加以发挥。他根据噬嗑这一卦的卦象，重点讲天下国家用刑狱除奸慝的问题。由此看出，《周易》作为儒家经典著作之一，它很重视刑罚问题。\n噬嗑卦震下离上，有口中有物之象，与颐卦初上二阳，中间四阴不同。而与贲卦三离下艮上的情况极其相似，都是上下两个阳爻，中间有一个阳爻似乎贲卦也有口中有物之象。然而贲卦不曰噬嗑。这是因为凡噬者必下动，而贲卦无震，故不得为噬嗑。","G.N":"噬嗑包含两层意思，一是噬，二是嗑。口中有物梗塞，口不得嗑；不得嗑即是不亨不通。若要由不亨不通变为又亨又通，必噬之以除却口中之物。今既言噬嗑，就是说已经噬了已经嗑了。所以噬嗑这一卦本身就含有亨的意义。噬嗑而亨，由于消除口中窒碍梗塞之物亦即去间。就社会说来，去间的办法是“用狱”。“用狱”与用刑不同。“用狱”之中包括有究治情伪，判断是非的内容。卦不言用刑，爻却言用刑。六爻之象可分作用刑与受刑两部分。初与上是受刑的，中间四爻是用刑的。六五柔而居尊位，是“用狱”之主。","T.N":"颐中有物曰“噬嗑”，用卦体解释卦名，颐就是口。这一卦是震下离上，象口中有个东西梗塞着，口合不上。若要将口合上，则必须噬而去之，所以卦名噬嗑。如果口中无物，那便是山雷颐了。\n“噬嗑而亨”以下数句解释卦辞。卦辞说“噬嗑亨”，孔子于此添一个“而”字，说“嗑噬而亨”，使卦辞的含义更加明确。口中有物则噬，噬则嗑，嗑则亨。\n“刚柔分，动而明，雷电合而章”，说明这一卦三阴三阳，阴阳各半，刚柔相间而不相杂，故称“刚柔分”。阴阳各半而相间的卦不止噬嗑一个，为什么仅在噬嗑这一卦强调“刚柔分”呢？因为“刚柔分”有明辨之象，噬嗑是讲“用狱”的，而明辨乃是察狱之根本。又“刚柔分”与“雷电合”连系起来正构成“噬嗑而亨”的全过程。“刚柔分”是静态的，有上下未动，将噬未噬之象。“雷电合”是动态的，是下动上明，已噬已嗑之时。“刚柔分”，“动而明”，“雷电合而章”，完整地表达了由未噬而噬，由噬而嗑，由嗑而亨的全过程，为“噬嗑而亨”这一句卦辞指出了根据。\n“柔得中而上行”，指的是六五。六五以柔爻居刚位，是为位不当。但是六五以柔得中而居尊位，这一点十分重要。用狱之事，过柔则失之宽，过刚则失之暴。六五不重柔不重刚，而是以柔居刚且得中，用狱最为适宜。《周易》柔下刚上是常例。若柔居上体，则言“上行”，若刚居下体，则言“来”。如讼、无妄、涣等，刚爻居下体，故《彖传》称“刚来”。如晋、睽、鼎以及本卦噬嗑，柔爻本应在下，今居五位，故《彖传》称“上行”。","X.N":"按照《周易》常例，雷电应为电雷。蔡邕熹平石经就是作电雷的。程颐、朱熹也以为雷电当作电雷。电也就是火，电雷噬嗑就是火雷噬嗑。电有明，明可以照物；雷有威，威可以震物。统治阶级观察电雷噬嗑之象，应该效法其明与威，以明罚敕法。\n言“先王”以明罚敕法，不言“君子”以明罚敕法，表明明罚敕法是属于立法方面的事情。“明罚”，则事先将犯什么科，应定什么罪的罚例规定下来，并明确告知民众，令民众有所规避，不致于犯法受刑。“敕法”，是公布于民众的法令制度，要严行告诫，使民众有所畏惧，尽可能不犯法受刑。明罚与敕法都是强调统治者在刑罚的问题上要把注意力放在事先的防范上，而不是放在事后的惩治上。这反映了孔子的思想。孔子主张德治，强调“道之以德，齐之以礼”，但并不一般地反对使用刑罚。孔子对待刑罚问题，有两点值得注意。第一，孔子认为治国首先是靠德教，杀人绝不是好办法。所以季康子问他为政是否可以“杀无道以就有道”时，他说：“子为政，焉用杀。”第二，即便是不得已非用刑罚不可，孔子也力主先教后杀，他说：“不教而杀谓之虐。”孔子的这种思想可以代表整个儒家学派。儒家学派在刑罚问题上的观点与法家根本不同。不能因为荀子礼法并重就说他是法家。","Y1.N":"初九在卦之初，处无位之地，象社会底层的“小人”，亦即“礼不下庶人”的“庶人”。孔子在《系辞传》里对此文有解释。孔子说“屦校灭趾无咎”这一爻是针对小人而言，小人重视利害，不在乎仁义不仁义。小人有了过错，不给他一点厉害，他是不会改的。对小人的最好办法是“小惩而大诫”，在他犯有轻微过失的时候，及时给予适当的惩罚，使之改恶迁善，不会过失发展到严重的程度。这样做，看来是惩治了他，其实是挽救了他，是小人之福。\n校是木制的刑具。屦，鞋，这里作动词用。屦校，把校这种木刑具像穿鞋那样穿在罪人的脚上。灭，没，是遮没的意思，不能释作创伤。灭趾，刑很轻，刑具仅仅遮没了脚趾而已。有了小过，给予适当的轻微惩罚，使之不致于犯大罪，这对于受刑的人说来，是无咎的。","Y1.XN":"“屦校灭趾”，使罪人不得行走。这是表面意义。实质上是通过“屦校灭趾”这轻微的惩罚，警戒罪人勿在罪恶的路上走下去。","Y2.N":"六二与六五有应的关系，六五是用狱之主，六二是用刑之人。六二以柔顺中正之德用刑，刑必当罪，不至于轻重失当，易于使受刑的人服罪。\n“噬肤灭鼻”，是用刑深严之象。肤是禽兽身上与骨头不相连系的肉，如猪的下膀，这样的肉柔脆易咬，甚至嘴巴能咬进肉里，连鼻子也能没进去。“噬肤”，是说用刑很容易就达到了使受刑人服罪的目的。“没鼻”，是说用刑深严。因为六二有柔顺中正之德，刑必当罪，所以即便用刑深严，也是适宜的，不会有咎。","Y2.XN":"六二以阴柔居于初九阳刚之上，故曰“乘刚”。爻辞说“噬肤灭鼻无咎”，指出六二因柔顺中正，具有用刑深严且容易使受刑之人服罪的可能性。“小象”说“噬肤灭鼻，乘刚也”，指出六二的用刑深，是由于乘刚的缘故。","Y3.N":"腊读如息。古人将肉晾干，叫做腊。腊肉，一般指小兽整体全干，它的特点是坚韧难咬和味厚积久而往往有毒。“噬腊肉，遇毒”，咬坚韧不易咬并厚味有毒的肉，结果不但肉咬不动，还要多少中一点毒。六三的情况就是如此。六三是用刑之人，它以六居三，不中不正，刑人而人不服。不仅不服，反遭到受刑人的怨伤。不过问题不大，处在噬嗑的时代，总要噬而嗑之，总要用刑；用刑是必要的，纵然可吝，亦属小问题，归根结底是无咎的。","Y3.XN":"同样是用刑，六三的情况不如六二；六二无咎，六三则小吝无咎。六三为什么小吝呢？关键的问题是它处位不当，不中不正。因为自己不中不正，所以不但不能顺利制服罪人，还要受到一点罪人的毒害。","Y4.N":"就全卦而言，九四是口中梗塞之物，是社会中阻碍安定、和谐的消极因素，是噬的对象，应该除掉的东西。但是就爻位而言，它又是除间的人，是用刑者。《周易》卦之取象与爻之取象往往不同，可能是由于卦辞爻辞非一时一人所作的缘故。\n九四是卦之中间四爻中唯一一个阳爻，以刚居近君之位，是最有能力治狱，最善于解决难案的人。它能够“噬干胏”，干胏是里边含着骨头，比腊肉更难咬的一种干肉。九四却咬得动它，所以它爻都说无咎，独此爻曰吉。九四所以能够咬得动“干胏”，办最难办的案，制服最难制服的罪人，主要是因为它有一个优越的条件：“得金矢”。“金矢”是刚直的意思。“得金矢”，具有刚直不阿的品德。光有刚直不阿的品德还不行，还要在具体的办案用刑过程中做到“利艰贞”，即不怕艰难困苦，敢于守正，坚持原则。","Y4.XN":"九四具有“得金矢”之品德，刚直不阿，它有治狱用刑的能力和条件，它“噬干胏”可得吉。然而可能性不等于现实性。要在具体的办案过程中真正取得成功，得吉，也就是使“吉未光”变成“吉光”，还必须做到艰贞。","Y5.N":"六二噬肤，六三噬腊肉，九四噬干胏，一节比一节难噬，至六五噬干肉反而变易了。为什么变易了呢？因为六五“得黄金”。“得黄金”是说六五具有某些优越的条件。黄，中色，表示六五居中得中道，且在君位。金，刚物，表示六五以柔居刚，且有九四阳刚之辅佐，六五虽然“得黄金”，具有处刚得中的好条件，但是它本身毕竟是柔体，要获致无咎的结果，尚须做到“贞厉”，即既要守正，又要心怀危惧，谨慎从事。","Y5.XN":"一是说爻位不当，此处的“得当”是说事情办得得当。六五本身是柔体，以柔治狱用刑，而能守正虑危，终得无咎，这是主观努力，办事得当的结果。","Y6.N":"何字读去声，与荷字同，是动词，不是疑问代词。校是木制刑具，可能是戴在肩上的枷。上九与初九一样，是受刑的人。它的肩上荷着一个枷，枷着脖项。枷很大，竟将耳朵给没进去了。“灭耳”形容枷大没耳，不是割掉耳朵。割耳的刵刑在古代是轻刑，而这里的“何校灭耳”是重刑之象。\n上九是受刑之人，它为什么受到“何校灭耳”的严重惩罚而得凶呢？是由于它“以小恶为无伤而弗去也，故恶积而不可掩，罪大而不可解”，完全是怙恶不悛，罪由自取。\n《易》卦之初上两爻是始与终的关系，两爻之爻辞一般来说是互相照应的。此卦初九曰“屦校灭趾，无咎”，有小惩大诫之义，即有小过给以轻的惩罚，使它闻过而知改，把过失改正在初始状态。至上九，居卦之终极，罪发展到极点，噬亦发展到极点，罪大已不可解，恶积已不可掩，非处以重刑不可。","Y6.XN":"上九得到“何校灭耳”的重罚，责在它自己，在它自己“聪不明”。应当说耳不聪，何以说“聪不明”呢？“聪不明”其实是说它听之不聪，听不见人家的劝告，长着耳朵却未发挥耳朵的作用。聪字单用，包含明之义在内，这里说“聪不明”，聪与明并用，则聪字便相当于耳了，明是耳的功能。","Z":"研究这一卦，应该注意卦中反映出的《周易》和孔子的法律思想。孔子在“大象”中提出“明罚敕法”的主张，可知孔子并不否认刑罚在治国中的作用。他虽然鼓吹“道之以德，齐之以礼”，力主以德治国，以为“道之以政，齐之以刑”不是好办法，甚至反对为政以杀，但是他并不一概排斥治国用刑的必要性。孔子的法律思想与法家迥异。法家唯法唯刑是用，孔子则强调“明罚敕法”，要求统治者将法与罚公诸民众，使之知，使之畏，使之尽可能不犯法不受刑。“明罚敕法”一语的要害在明不在罚，在敕不在法，在于防民教民，不在于制民刑民。应当说，明罚敕法，包含在孔子德治思想之内，是德治思想的一部分。\n卦辞“噬嗑亨，利用狱”一语表明它的作者已经有了关于暴力统治的观念。口中有物，必噬之方得嗑，必嗑之方得亨。这个道理具有普遍性，在人类社会中可以说无所不在。父母、夫妻、兄弟、朋友诸关系中都有噬嗑的问题，然而《周易》作者却一下子抓住了国家生活中必用刑狱这个最大的噬嗑。这绝非出于偶然，说明已经有了明确的关于暴力统治的观念。\n噬嗑这一卦反映《周易》法律思想中起主导作用的是人治主义，不是法治主义。例如它惩罚罪人，着眼点在人不在罪。初九是初犯，罚轻；上九不听劝诫，至于罪大恶极，刑重。从用刑的人看，问题就更加清楚。九四“得金矢，利艰贞”，六五“贞厉无咎”，所讲的全是用刑者个人品德修养问题。噬嗑卦的人治主义意向还表现在卦的构成上。噬嗑卦的上体是离，离的特点是明，明是治狱的基本要求。执事人员明与不明决定案件办得好与不好。明与不明也是道德问题。在法律实践中执事者单纯重视个人品德修养如何，必然是人治主义。"},"22":{"P":"贲，音毕。《序卦传》说：“嗑者合也，物不可以苟合而已，故受之以贲。贲者饰也。”贲的含义是饰，饰也就是文。文与质相对待。质是指事物的本质，文是指事物的文饰。孔子说的“绘事后素”，很能说明质和文的关系，画画儿有了素白的底子，然后才能涂以彩色。社会人事也是如此。噬而合，合而亨；人群合聚了，必有等级名分，伦序行列。把等级名分，伦序行列表现出来的礼仪制度等等就是文。文对于社会来说是不可缺少的。社会处在合和状态的时候，必须有文以饰其本。所以噬嗑之后次之以贲。\n离下艮上这一卦，就其二体看，下为离，离为火为明；上为艮，艮为山为止。山下有火，文明以止，有文之象。就卦变看，柔来文刚，刚上文柔，刚柔上下相错，亦有文之象，所以这一卦叫做贲。\n儒家讲究贲之道，重视质与文的关系问题。儒家认为人类社会不可没有文饰；若质胜文，没有文饰或文饰不足，社会便不可能发展；若文胜质，即文饰过了头，本质被削弱了，社会也要出问题。荀子批评墨子“蔽于用而不知文”，就是以这个道理为依据的。道家主张法自然，见素抱朴，少私寡欲，一切人为的礼仪制度和道德观念都在坚决摈弃之列。显然这是违背历史发展的需求的。它在后世的政治实践中不如儒家文质的观念受到重视，是不足怪的。","G.N":"贲是讲文饰的。质与文是一个对立面，而质是主要的、基本的。质而有文饰，方可亨通。故曰“贲亨”。亨，应当“利有攸往”，而这里加了个小字，“小”的意思是说文不可太盛，文不可胜质。否则的话，屑屑于文饰而忽略了根本的东西，便会走向反面，亨要变为不亨了。","T.N":"贲亨的亨字应是衍文。“柔来而文刚，故亨”一句是解释卦名的，故贲下不应有亨字。依王弼注“天文也”之前当有“刚柔交错”四字。\n“柔来而文刚”，“分刚上而文柔”，这两句话涉及到卦变问题。卦变问题在《周易》里边是有的。但是什么是卦变呢？古今各家说多纷歧，而以苏轼《东坡易传》和程颐《伊川易传》之卦变说最可信从。《东坡易传》说：“易有刚柔往来上下相易之说，而其最著者贲之《彖》也，故学者沿是，争推其所从变，曰‘泰变为贲’，此大惑也。一卦之变为六十三，岂独为贲也哉！学者徒知泰之为贲，又乌知贲之不为泰乎！凡易之所为刚柔相易者，皆本诸乾坤也。乾施一阳于坤，以化其一阴，而生三子，皆一阳而二阴。凡三子之卦，有言刚来者，明其本坤也，而乾来化之。坤施一阴于乾，以化其一阳，而生三女，皆一阴而二阳。凡三女之卦有言柔来者，明此本乾而坤来化之，故凡言此者，皆三子三女相值之卦也，非是卦也，则无是言也。蛊之《彖》曰‘刚上而柔下’，贲之《彖》曰‘柔来而文刚，分刚上而文柔’。咸之《彖》曰‘柔上而刚下’，恒之《彖》曰‘刚上而柔下’，损之《彖》曰‘损下益上’，益之《彖》曰‘损上益下’。此六者适遇而取之也。凡三子三女相值之卦十有八，而此独取其六何也？曰圣人之所取以为卦，亦多术矣，或取其象，或取其爻，或取其变，或取其刚柔之相易，贲之类是也。夫刚柔之相易，其所取以为卦之一端也，遇其取者则言，不取者则不言也。”《伊川易传》说：“刚上柔下，损上益下，谓刚居上，柔居下。损于上，益于下，据成卦而言，非谓就卦中升降也。如讼，无妄云‘刚来’，岂自上体而来也？凡以柔居五者皆云‘柔进而上行’。柔，居下者也，乃居尊位，是进而上也。非谓自下体而上也。卦之变皆自乾坤，先儒不达，故谓贲本是泰卦。岂有乾坤重而为泰，又由泰而变之理！下离本乾中爻变而成离，上艮本坤上爻变而成艮。离在内，故云‘柔来’，艮在上，故云‘刚上’，非自下体而上也。乾坤变而为六子，八卦重而为六十四，皆由乾坤之变也。”\n据苏程二氏的说法，所谓卦变，其主要之点是这样的，第一，64卦中只有18卦有卦变问题，其余诸卦没有。这18卦的上体与下体由一个阳卦(或王震，或兰坎，或三艮)和一个阴卦(或三巽，或离，或三兑)组成，例如贲，上体震是阳卦，下体离是阴卦；益，上体巽是阴卦，下体震是阳卦。第二，阳卦原来是坤，由于乾卦施给它一个刚爻，化掉它的一个柔爻，而变成三震，变成三坎，变成三艮。阴卦原来是三乾，由于坤卦施给它一个柔爻，化掉它的一个刚爻，而变成三巽，变成三离，变成≡兑。所谓卦变的问题，实质上就是刚柔相易，亦即一卦上下体中阴卦的那个柔爻是乾卦经过坤卦的作用变来的，阳卦的那个刚爻是坤卦经过乾卦的作用变来的。如果一卦上下体都是阳卦或都是阴卦，或者有一体是乾卦或坤卦，就不存在卦变的问题。第三，卦变的所谓刚柔相易，是从成卦的角度说，指乾坤之刚柔相易，不是卦中刚柔升降，简单交换位置。三贲上体来自坤，刚爻上九得自于乾；下体来自乾，柔爻六二得自坤。三贲绝不是泰的上六与九二一升一降，互换位置的结果。第四，《易》中有卦变意义的卦虽有18个，但《彖传》认为实际取卦变之义的只有贲、蛊、咸、恒、损、益六卦。\n“柔来而文刚”，在卦中有什么意义呢？刚为质，柔为文，柔来文刚，是在质胜的时间，恰好有文来调济它，使质文相当，所以卦辞言“亨”。“分刚上而文柔”的含义，不是刚去“文柔”，而是柔有了刚，文有了质，柔才成其为文，不然的话，没有质的文便不是文了。文太盛，须有质去调节；文不可太过，文太过必出问题，所以卦辞言“小利有攸往”。\n总而言之，“柔来而文刚”，强调当质胜的时候必用文加以调济而后可通，故卦辞言“亨”。“刚上而文柔”，强调当文胜的时候必用质加以调济，绝不可使文太过，故卦辞曰“小利有攸往”。“刚上而文柔”之下应有“刚柔交错”四字。这四字有总结上文的意义。柔文刚，刚文柔，刚柔交错；质必有文，文不胜质，质文相当，是自有之理，故曰“天文”。这是从卦变的角度解释卦辞。\n“文明以止，人文也”，是从卦德的角度解释卦辞。卦之下体是离，离为火为明，有文明之德；上体是艮，艮为山为止，有止之德。止有节制、限度的含义。“文明以止”，文明要有节制有限度。这个节制、限度要靠人来把握。把握得好坏如何，就看人的主观能动作用发挥得怎样了。问题决定于人为，当然只能叫做“人文”了。\n“观乎天文，以察时变”，观天文既是观天象，也是观卦象。从卦象来看，刚必有柔，柔不胜刚，刚柔交错，质文适当，这是常；然而有时不免有过刚过柔，过质过文之变，人应随时观察而加以补救。\n“观乎人文，以化成天下”，观人文即观“文明以止”。文明是重要的，但文明必以止，没有“止”加以控制，文明过度，是不行的。止，不是止文明，而是止文明之过度，文明之敝。观察“文明以止”，以教化天下，成天下之礼仪制度。","X.N":"《周易》“大象”共有噬嗑、丰、旅、贲四卦论及用刑问题。前两卦以火雷雷火交互为体，讲用刑强调威与明两个方面。后两卦以火山山火交互为体，讲用刑强调明与慎两个方面。旅卦火在山上，是止而明的意思。慎而明，则办案及时，判决及时，不留狱。贲卦火在山下，明在内，止在外，明而止，则办案、判决都要谨慎，不得草率从事，亦即无敢折狱。折狱以得情实为要，而贲卦讲文饰，恰好与折狱的要求相反，所以孔子学了贲卦告诫人们说“无敢折狱”，治狱务必去文饰而求情实。一切舞文弄法，深文刻核，文致锻炼的作法，都应在反对之列。","Y1.N":"贲卦是讲文饰的，但卦中六爻情况有所不同。内卦三爻“柔来而文刚”，刚已经够了，主要是如何加柔的问题。外卦三爻“刚上而文柔”，柔足刚不足，所以重在刚。初九贲其趾，六二贲其须，九三贲如濡如，都重在柔，而初九由于处在贲之始初之时，贲的程度最轻。趾在人体的最下部，功能是走路。“贲其趾”，文饰表现在趾上，说明刚刚开始贲。“舍车而徒”，不乘车而徒步走，这在趾之行路这一点说来，贲的程度太轻了，几乎达到素而无文的程度。初九与六四正应而互贲，初九讲“舍车”，六四讲“白马”，意义相近。初九居一卦之下，其下无所乘，故云“舍车”。六四处上体之初，其下有所乘，故云“白马”。","Y1.XN":"舍车不乘而徒步走，不是故作清高的一类，是发自内心的一种理性表现。人家以乘车为贲，我独以徒步为贲。","Y2.N":"须，其实就是胡子。胡子对于人说来，主要的用处是文饰脸面，使脸面美观。它不能自立，必须附丽于颐上。倘无颐存在，须亦无从立足，正所谓“皮之不存，毛将安傅”。\n六二无应爻而与九三相比，九三亦无应爻而六二相比，相比则相贲。六二纯阴，是贲卦之主爻，贲卦的基本含义从这一爻能够看出来：文当从质，文饰其质，文不能变其质；文之动止全由其所附之质决定。须与颐的关系恰像文与质的关系。六二与九三相贲，六二是纯柔，柔为文；九三是纯刚，刚为质。六二与九三的关系是文与质的关系，六二随九三之动而动，随九三之止而止。所以爻辞曰“贲其须”。六二“贲其须，”其贲的程度亦即文饰的程度大于初九贲其趾。初九几乎以素为贲，六二则以贲为贲了。胡子尽管要依附于颐，但是它长在颐上，毕竟是真正的文饰之物了。","Y2.XN":"上是九三。兴是兴起，动作。六二依附于它的上爻九三，恰似须依附于颐一样，颐动须动，颐止须止。所谓“贲其须”，实际上是说文是质制约的，事物的善恶美丑决定于它的质，不决定于它的文，它的外在形式。","Y3.N":"九三处在六二与六四两个阴爻之间，下比六二，上比六四，它作为一个刚爻，受到两个柔爻的贲饰，可谓上下交贲。贲至此已达到很盛的地步，所以叫做“贲如”。事物发展到一定程度容易起变化，稍不留意，极其可能走向反面。贲饰太盛，未免有文灭质之患，所以又叫“濡如”。濡，谓贲饰之文采华丽鲜艳，润泽充盈。《周易》中凡说“某如某如”的，都是犹疑不决，两端难定之辞。“贲如濡如”，贲饰得挺充盈却又顾虑贲饰过分，致于文灭质。因此又说“永贞吉”。贞，正也。九三以阳居阳，不是不正，问题在于能否永久坚持守正。能永久守正，不为阴柔所溺，不至于以文灭质，那才是吉。","Y3.XN":"陵，侮，也有胜过的意思。“永贞之吉”，是质不为文所灭，刚不为柔所溺。这种吉要求长久坚持，到底不变。“终莫之陵”，终不可使文胜质。终字与永字相呼应。","Y4.N":"皤，头发白色。翰，马白色。皤、白都有素、质的意思。六四处在上体艮止的开始，正是贲极该当返素的时候，所以爻辞说“贲如皤如”。“贲如”，六四在贲的时候，它当然要崇尚文饰了。“皤如”，但是六四处在离明之外，艮止开始的时候，又与初九刚爻正应，有崇质返素之心。既贲如又皤如，是一种两端未决的矛盾心态，而最终的意思是皤如，是无所文饰。下文“白马翰如”证明了这一点。“白马翰如”指初九，初九“舍车而徒”，与六四皤如之心相互照应，是六四的志同道合者，它“白马翰如”般地来了，它不是六四的寇仇，它是六四的婚媾。六四归根结底是以刚文柔，以质济文；是崇质返素，以朴素为贲。","Y4.XN":"疑，两端不定。从大处看，六四是贲之六四，处在贲的时代，它理应“贲如”，重视文饰。从细处看，六四处在离明之外，艮止之始，正是由文返质的时候，它的处境决定它素以为绚。两种意向犹疑不定，最终它走向了“皤如”。走向“皤如”，没有问题，也无怨尤。何以知之？“匪寇婚媾”，初九与我志同道合，我“皤如”，它“舍车”，它来与我婚媾，哪里有什么怨尤。","Y5.N":"丘园指上九。丘园是联合结构的词语。丘，古代城邑近处的丘坂。园，城邑外面距城邑很近的园圃。六五是柔爻，与上九刚爻相比。《彖传》说“刚上而文柔”，那么，上九应当文六五，六五要受上九的贲饰。上九是丘园，是安谧素朴之地，不是朝市，不象朝市那般热烈多文。“贲于丘园”，就是贲于上九，也就是六五受上九之贲。整个儿的意思是敦本，是崇素返质。束帛，礼物；戋戋，极少。束帛戋戋，上九给六五以极少的礼物，少到可以认为是吝啬的程度。吝啬是俭，礼与其奢宁俭，俭比奢好。吝啬，表面上看似乎不好，然而最终还是吉的。总之，贲卦外三爻讲的是贲极反朴，以质济文的问题。六五在这个问题上比六四更前进一步。","Y5.XN":"一个吉字包括了爻辞的全部意义。六五能够在文胜贲极的时候祟朴返质，是极难得之事，不是出自中心喜悦是办不到的。“有喜”，心中对于崇朴返质有所喜悦。所谓“知之不如好之，好之不如乐之”，与此正同。","Y6.N":"上九已至艮止之终，《彖传》说的“文明以止”至此已达到最后阶段。崇本返质的程度远远超过六四与六五两爻。六四“贲如皤如”，贲与白毕竟不是一回事；六五“贲于丘园，束帛戋戋”，亦在反本的过程中。上九“白贲”，则白即贲，白与贲变为一回事了。贲至于极点，有饰变为无饰了。说无饰，其实不是无饰，是以无色为饰，以质素为贲。《杂卦传》说的“贲无色”，对贲卦的特点一语概括无遗。贲是五彩艳丽以文饰，白无色是素朴无文，二者截然对立，竟合而曰“白贲”，曰“贲无色”。相反而相成，两个对立之物连在一起，表明《周易》作者具有对立面统一的清醒的辩证法观念。","Y6.XN":"白贲是无有贲饰或者说以质为文，上九处在贲的时代，却以质为文，无有贲饰，是不是行与时违而宜得咎呢？不是的，上九白贲，理应无咎。因为它处于贲卦之上，合该白贲；白贲是符合质与文辩证统一的规律，符合上九崇质尚实的心志的。","Z":"贲卦讲文饰，文饰不可无质，所以贲卦实际上讲的是文与质的关系。上体与下体有所不同。下体“柔来而文刚”，以文为文，主下体之文的，是“柔来”之“柔”亦即六二。六二“贲其须”，须最是虚文之物，自己不能独存，必随九三之兴而兴，随九三之止而止，说明质要有文加以贲饰，然而文离不开质，文质不能分离。上体“刚上而文柔”，以质为文，主上体之质的是“刚上而文柔”的“刚”，亦即上九。上九“白贲”，以无文为文，以无色为贲。说明质与文不可或缺，不过质比文更根本更重要。从六爻看，有三爻不事文华。初九“舍车而徒”，不事文华；六五“贲于丘园，束帛戋戋”，亦不事文华，上九“白贲”，不仅不事文华，甚乃以质素为文。另外三爻，六四“皤如”而贲于初九，六二“贲其须”，必依附于九三，唯有九三之“贲如濡如”，是贲饰之盛，然而也有“永贞吉”之诫。看得出来，贲卦对于文饰的态度是十分谨慎的。在它讲究文饰的时候，强调的不是文饰而是本质。《周易》的这种思想方法值得注意。\n但是，是不是《周易》在质文关系问题上要质不要文或者重质不重文呢？完全不是。道家才是重质不重文，要质不要文的。《周易》以及《易大传》的作者孔子都重质也重文，可谓文质并重。在儒家看来，质文相反相成，是对立面的统一，二者不可或缺而质是矛盾的主导方面。道家老子、庄子都熟谙辩证法对立统一的规律，他们的书中关于这方面的精彩命题比比皆是，唯独在文质关系上他们绝对鼓吹见素抱朴，回归自然，要“牛马四足”，不要“穿牛鼻络马首”，一切人为的文饰的东西一概摈弃，从而陷入形而上学的可悲境地。从社会历史发展的角度考察，道家要质不要文的主张有它无容置疑的反动的一面，实不足取，而《周易》及其传授者儒家学派的文质观则值根于现实之中，顺着历史发展的方向提出问题，思考问题，至少它的思想方法是光辉的。"},"23":{"P":"《序卦传》说：“贲者饰也。致饰然后亨则尽矣，故受之以剥。”贲卦是讲文饰的。事物发展到讲文饰，可以说是亨；发展到亨，就要向反面转化，所以贲卦之后是剥卦。剥是剥落的意思。事物衰落了，残谢了，都可以叫剥。不过剥卦所讲的，乃是阴剥阳的剥。阴自下生，逐渐成长，至今已达到盛极的程度，五阴消剥一阳，阳处在被阴剥落的时候，所以这一卦叫做剥。","G.N":"剥是阴剥阳的时代，阳代表君子，阴代表群小；群小得势，君子“不利有攸往”，亦即不宜有所前进。因为这时阴盛阳衰，小人壮而君子弱，天时与人事均于君子不利，君子宜藏器待时，勿有所往。","T.N":"剥卦是讲什么的？剥卦是讲剥的。剥就是阳被阴剥，阴渐长而阳剥落。从卦象来看，剥是“柔变刚”。“柔变刚”是刚为柔所变，为柔所取代，柔一步步把刚剥掉。原来是六个刚爻的纯乾之卦，一变而为天风姤，一柔在下，五刚在上；二变而为天山遯，二柔在下，四刚在上；三变而为天地否，三柔在下，三刚在上；四变而为风地观，四柔在下，二刚在上；五变而为山地剥，五柔在下，一刚在上，刚几乎被柔变尽，阴柔变刚阳，柔长而刚剥，所以这一卦叫做剥。夬卦五刚在下，一柔在上，《彖传》称之为“刚决柔”。剥卦与夬卦相对，《彖传》不说“柔决刚”而说“柔变刚”，其故在于易为君子谋不为小人谋。君子去掉小人，越痛快越好，所以称决不称变；小人剥落君子，是一个萋菲浸润的过程，所以称变不称决。\n“不利有攸往，小人长也”，是说君子处剥的时代，应当巽言屈身避害，待时而动，原因是此时小人道长，小人得势，君子别无更好的选择。剥卦与复卦相反，复卦《彖传》言“利有攸往”，说“刚长”，剥卦《彖传》言“不利有攸往”，不说“柔长”而直接说“小人长”，是为了警告君子处在小人剥君子之时要保持清醒的头脑，切勿妄动。\n“顺而止之，观象也”。剥卦坤下艮上，有顺止之象，君子观察顺止之象，处在小人剥君子的时代，务须坚贞自守，顺时而止。\n“君子尚消息盈虚，天行也”。“尚”是尊奉的意思。“消息盈虚天行也”，是说“消息盈虚”是自然界变化的规律。世间人事的变化也和自然界的变化一样，是有规律的。君子应尊尚消息盈虚这个规律，不要反消息盈虚这个规律。","X.N":"山本来是高起于地的，现在由于下不厚而颓下来附着于地，这是圯剥之象。圯剥必始自下，下剥则上危。统治者观剥之象，施诸政治，应该“厚下”，恩加百姓，以求得“安宅”。这与《书经》“民惟邦本，本固邦宁”的思想一致。","Y1.N":"“剥床以足”，剥床之足。蔑，灭，没。贞，在这里应作固执讲。阴剥阳，小人剥君子，是自下往上剥。初六乃居下之阴柔小人，所以有剥床足之象。床是人藉以休息之物，常处人之下。床足是床藉以支撑之物，又在床之下。剥床之足，说明阴是先从最下部剥阳把床足给没了。君子处在这种时候，应顺时而止，不要固执而不知变，否则必凶。","Y1.XN":"“剥床以足”仅仅是小人剥君子的开始，接着将渐及于上，所以叫做“灭下”。言外之意是说小人剥了君子之下以后还要继续向上剥。","Y2.N":"辨是床体中的一个部件，床藉以分隔上下。初六已经灭了床之足，现在又向上发展一步，灭到床之辨了。君子处此之时，以认清时势，不固执己见，随时敦尚为第一要义，否则必凶。","Y2.XN":"“未有与”，没有应爻，亦即没有援助，惟其没有应爻，所以六二杂在群阴之中而为剥。六二阴柔居中得正，条件本来不错，完全可以脱离小人的行列，不剥君子，然而它“剥床以辨”，剥了君子，原因就在于没有阳刚来应它。六三虽不中不正，但有应与，情况与六二就大不一样了。","Y3.N":"六三在剥卦初至四四个阴爻中，它是无咎的。它为什么得以无咎？因为它与上九阳刚正应。尽管它仍然属于剥君子的小人行列，但与上九正应，并无剥害君子之意，实际上等于脱离小人一面而倒向君子一面了。","Y3.XN":"六三恰在卦中五阴爻之中，上有二阴，下有二阴，而它独与阳刚正应，脱离了上下之同类，处剥之时而不为剥之事，故无咎。为什么不言吉而言无咎？六三虽已反正从阳，但是力量是孤弱的，能够无咎就算不错了，哪里可能得吉！","Y4.N":"初剥床之足，二剥床之辨，小人一步步向上剥君子，剥至六四，达到极其严重的程度，已经“剥床以肤”，剥到床上人之肉了。对于受剥的君子来说，问题是严重的。爻辞不言贞凶而直言凶，说明凶是无条件的，绝对的。","Y4.XN":"《象传》指出问题的严重性。就卦爻说，上九是阳爻，六五是君位，阴剥阳剥到四这一爻，算是剥到了极点。就君子亦即人来说，剥床之足，剥床之辨，毕竟还未近身，现在剥到肉了，整个儿的身躯面临危险，已经构成灾祸了。","Y5.N":"六五与以下诸阴不同。六五以下诸阴讲的是如何剥阳，至六五则不但不讲剥阳，反倒讲如何承阳了。发生这一变化的原因在于：上九一阳在上屹然不动，六五想剥也剥不了。六五作为一个阴爻有阴柔之性，阴柔的特点是势盛则作威，计穷则顺承。现在它又切近于上九，与上九阳刚相比，既剥不了上九，便只好顺承上九了。\n鱼，阴物，象征六五以下诸阴。宫人，宫中之人及妻妾侍婢之类，象征六五与上九的关系。六五居尊位，是众阴之长，它像贯穿鱼串那样将众阴统率起来，好像宫人侍奉人君那样以顺承上九，获得上九的宠信、庇护；在此阴剥阳的时代，它不剥阳反而顺承于阳，当然是“无不利”了。","Y5.XN":"尤，过失。“以宫人宠”是小人受宠，不是君子受宠。小人受宠本非好事，但是在阴剥阳的时候，六五能够率众阴以顺承阳刚，毕竟没有过失。","Y6.N":"当剥之时，诸阳已被剥尽，剩下上九一阳，像一只硕大的果实一样未被食掉。言“不食”而不言“未食”，说明剩下一阳还在，实非诸阴不想食或者偶然未食，是按照“消息盈虚，天行也”的规律，阳不能尽剥。就像树，虽然被剥了，果实还在，种子还在，春天一旦到来，它还要复生。“君子得舆，小人剥庐”是一个问题的两面观。剥卦发展到上九这个阶段。对于君子来说，是“得舆”。舆，车。此时众阴在下而宗阳，极似天下乱极，人心思治，众心愿载君子。对于小人来说，是“剥庐”。庐，屋。小人剥君子，若剥极于上，将君子全剥尽，那么它将自失所覆，不得安身之地。","Y6.XN":"“君子得舆”，说明天下剥极之时，君子受到百姓的拥护和支持。“小人剥庐”，说明天下剥极之时，小人自食其恶果，它剥君子，实际上等于剥了它自己安身的庐。","Z":"卦辞说“剥，不利有攸往”，是说在阴剥阳的时代，阳是凶的，阳的处境总的说来是不好的。而爻则不同，诸爻谁剥阳谁见凶，剥阳者是不好的。所以，六五以顺承上九，得“无不利”。六三与上九正应，得“无咎”，而初六、六二、六四以剥阳的缘故，均得凶。\n剥卦里有君子与小人、上与民等概念，说明作卦爻辞的时期已经有了明显的阶级关系，社会早已进入文明时代。又从《彖传》可以看得出来，《周易》作者没有上帝鬼神的观念，它认为世间人事的变化与自然界的变化，都受内在的、不以人的意志为转移的规律支配着。还有《象传》讲“上以厚下安宅”，“君子得舆，民所载也”，反映《易传》作者深知巩固统治的关键在厚下安民。它不信上帝鬼神而重民，这是虽素朴但很完备的民本观念。"},"24":{"P":"《序卦传》说：“物不可以终尽，剥穷上反下，故受之以复。”阴阳消长是自然的规律，阴可以剥阳，但是不可能剥尽，剥至极处，阳便要复生了。阳被剥极于上，就要复生于下，其间不会有一忽的间断，所以剥卦之后次以复卦。\n复是反本的意思。从卦来看，一个阳爻在五个阴爻之下，是阴极而阳反。从自然来看，夏正十月阴盛至极，至十一月冬至的时候，阳气反生于地中。从人事来看，阳代表君子之道。君子之道消至极点，就要复反，就要长了。","G.N":"“复，亨”，复则必亨。阳剥极而复反于下，虽只有一阳，看来势孤，但是它是初生的，向上的，前进的，犹如冬至时节阳气复生，万物即将萌发，其生生之势不可阻挡；在上的五阴虽众必然披靡消散，构不成在下一阳的障碍。\n“出入无疾，朋来无咎”。出入谓生长，入谓复生于内，出谓长进于外。阳从内卦开始出生，然后向外卦长进。这与自然界的情况很相似，阳气自冬至起，自地内发生，逐渐向外长进。无疾，无害。复卦只有一个阳爻自下生出，力量是微弱的，但是众阴类侵害不了它。这是有“朋来”使它“无咎”的缘故。“朋”是诸阳，是初九的同类。咎，在自然界则为差忒，在人事则为抑塞。总之是遇到了阻碍。在复的时候，一阳自下而生，必有诸阳来同它协力战胜众阴，克服阻碍而得无咎。\n“反复其道，七日来复，利有攸往”，“道”，阴阳往来消长之道，亦即阴阳交替消长变化的规律。“反复”，谓阴长则阳消，阳长则阴消。“反复其道”，是说阴阳往来消长，合乎规律地变化。“七日来复”，阴自姤卦始生，然后变为遯、否、观、剥、坤，乃至变为复卦。自姤卦一阴生起，阴渐长，阳渐消，经过七次变化而成复卦。在复的时候，阳进阴退，君子道长，小人道消，所以“利有攸往”。在剥的时候，阴进阳退，小人道长，君子道消，所以“不利有攸往”。","T.N":"“刚反，动而以顺行”，既释“复亨”又释“出入无疾，朋来无咎”。剥卦讲“顺而止”，复卦讲“顺而行”，君子处剥处复，或止或行，有所不同，但“以顺”是一样的。顺什么？顺乎自然，顺乎规律。最重要的是“刚反”二字，“刚反”指出了卦辞言“复亨”的根据和实质。天道运行至复的时候为什么能够亨通而了无障蔽？其根本的原因是阳刚消到极点则必来反，来反则渐长，则亨通。\n“天行也”解释“反复其道，七日来复”。“天行”实际上是指天地阴阳运动的规律而言。阴剥阳尽，阴极阳反，一阳生而成复，乃是天地阴阳有规律地运动的结果。\n“刚长也”与“刚反”讲的都是复卦一阳爻的运动，二者的区别在于各自所强调的重点不同，意义也不同。“刚反”强调剥之一阳穷而反于下，成为复，说的是复开始形成时的情况，由于刚自上反于下，剥终于变为复，其结果是亨。“刚长”强调刚既反之后一阳渐长，自下而上，说的是复形成以后的情况，“刚长”的结果是“利有攸往”。剥卦《彖传》言“不利有攸往，小人长也”，这里说“利有攸往，刚长也”，可见易为君子谋不为小人谋。\n“复其见天地之心乎”！什么是天地之心？“心之官则思”，心是主思虑，主预谋，主宰形体的。天地无思虑无预谋，何以言“天地之心”？孔子讲“天地之心”不过是个比喻，天地本无心，但是天地间万物生生不已，阴息阳消，阴极阳长，消息盈虚，无有间断，像似天地有一颗心主宰着自己的意向和行为。孔子说“天地之心”并非真的以为天地有心，孔子只是说天地像似有一颗心。所谓“天地之心”，其实就是孔子在别的卦讲的“消息盈虚”，就是不以人的意志为转移的自然规律。\n自然规律无时无处不在，为什么单在复卦见“天地之心”？因为“天地之心”在复卦见得最显明最亲切。阴剥阳，但阳无剥尽之理，一旦剥穷上，便要反下而成复。复的时候，一阳在下初生微动，处在潜伏之中却又生意油然，其生生之势纵然五阴积累压抑在上，也不能阻挡。阳看来被剥尽了，但不能剥尽；阳看来子然一身，微弱得很，而其实却是强大无比，没有什么力量可以使它停止向上成长。在复的时候最能看清楚自然规律的客观性。别的卦则不然，例如泰卦，三阳之时，万物更新，这时只见物之蕃衍盛大，“天地之心”却不易见。\n邵雍有诗云：“冬至子之半，天心无改移。一阳初动处，万物未生时。玄酒味方淡，大音声正希。此言如不信，更请问包牺。”这诗作得好，它把“复其见天地之心乎”一语解释得极明白。天地之心年年岁岁月月日日无有一时间断改移，却唯有在建子之月，冬至之时看得最真切。因为此时一阳初动，意味着要大动，万物未生，意味着要大生。正如酒方在玄酒味淡时，音方在大音声希时。","X.N":"“雷在地中”，是阳始复之时。先王、后都是指统治者。统治者观复卦之象，应该顺应自然的规律，在冬至这一天采取安静持养的措施，闭上关卡，使商旅停止活动，自己也不省视四方。为什么选在冬至这一天这样做呢？这是因为按照《易经》十二辟卦即十二消息卦的思想，复卦是建子之月即十一月卦。十一月冬至这一天是一年之中阳气初生之时，阳气还微弱，需要以静养动，不使初阳受到侵害。","Y1.N":"原来本有的东西后来失掉了，失掉之后又得到了，叫做复。原来本没有的东西，后来有了，不能叫做复。复卦是讲阳被剥掉之后，现在又来复于初的问题。复有远近早晚，复的近复的早，当然比复的远复的晚要好。初九处在复卦之初，是最近最早的复，所以“无祗悔”而得“元吉”。祗，抵。“无祗悔”是不至于悔的意思。就一个人来说，有了过错就能认识到，认识了就能改，甚至过错还未表现出来就改掉了，不至于达到悔的程度，这就是“不远复”。","Y1.XN":"“不远而复”是君子用以修身之道。修身的问题主要是知过而速改，知其不善而速从善的问题。其中既强调改，又强调早改，快改。","Y2.N":"休，美。休复，休美的复。复的休美，复的好，所以吉。六二为什么能够休复吉呢？因为六二处中得正而且切比于初九，有从阳之志。","Y2.XN":"这里的仁应是人的同音假借字，与“井有仁焉”的仁字相同。下仁就是下人。“下人”与修身的意义连接一贯，“修身”是反躬修己。“下人”是指六二对初九能亲而下之。","Y3.N":"六三以阴处震之极，有躁动之象。一个人犯了错误能够及早改正，改了不再犯，是最好的。而六三不然，六三频复，犯了改，改了又犯，屡失屡复，不如“不远复”与“休复”，所以“厉”。“厉”是危的意思。但是“频复”也有可取之处。屡失屡复，毕竟强于不复不改。就它屡失这一点来说，当然是厉的，就它屡复这一点来说，则是无咎的。","Y3.XN":"屡复屡失，虽为危厉，能复善改过总是好的。","Y4.N":"六四处于上卦之下，上下各有两个阴爻，而自己居在众阴之中，所以叫做“中行”。六四以阴爻居阴位得正，且正应于初九，所以叫做“独复”。六四处在群阴之中而独能复，说明它的主观愿望是好的。不过，若从客观条件来说，它毕竟是以阴居阴，所应的初九正在阳气甚微之时，不足给它以有力的援助，它实际上不能有所作为，所以爻辞不言吉，不言无咎。","Y4.XN":"从道，从初九阳刚之善道、正道。强调六四“中行独复”是从道，表明它不是为谋利。","Y5.N":"敦，厚。初九为复卦之主，六五与初九无系应关系，本当有悔，但由于它所处居中而且能复，所以无悔。六五的“无悔”与初九的“无祗悔”有所不同。初九“不远复”，是弃恶复善刚刚开始，故云“无祗悔”，六五“敦复”，是弃恶复善的行动已经积累很多，故云“无悔”。别卦爻辞讲敦的，都在上爻，如临卦上六言“敦临”，艮卦上九言“敦艮”，皆取积厚至极之义，而复卦于六五即言“敦复”，这是因为复卦上六是“迷复”，“迷复”是迷而不复。实际上复至六五已经达于极点。","Y5.XN":"自考，自成的意思。“中以自考”，是说六五以阴居中，能以其中德自成。自成什么？自成复。六二比于初九而复，六四应于初九而复，六五则与初九不发生系应关系而自成复。","Y6.N":"以阴柔居复之终，有迷而不复之象。迷而不复，昏迷而不知复。犹如一个人犯了错误不知悔改，在歧路上一直走到底，其凶是必然的。灾，是外来之灾；眚是自作之眚。有灾眚，外来之灾与自作之眚兼至。外来之灾也是由自作之眚招致的。问题出在昏迷而不知复。迷而不复，无论干什么都不行，动辄得咎。在这种情况下行师打仗，必以大败告终。在这种情况下治国，则君主必凶。十是数的终极。十年不克征，是说只要迷而不复的状况不改变，便永远“不克征”，永远“有灾眚”，永远“终有大败”，永远“以其国君凶”。","Y6.XN":"复，合于道；迷而不复，与道相反。与道相反，凶是必然的。为什么说是反君道呢？因为爻辞讲“以其国君凶”所以小象释以“反君道也”。人君在上统治百姓，治理国家，本当复天下之善，现在却迷而不复，岂不是反君道！反君道是天下最大的迷复，小象讲“反君道”，其实包括了一切迷复。一般人的迷复，都由于反道而致凶。","Z":"复卦《彖传》说“复其见天地之心乎”，这个“天地之心”极难理解。什么是“天地之心”呢？古人说法不一。有的说静是“天地之心”，有的说动是“天地之心”，有的则强调“天地之心”是天地生物之心亦即天地生生不已之心。所说的都有一定的道理，却都未说到中肯处。所谓“天地之心”就是天地之间万事万物中刚柔相摩，阴阳消长的规律，它无处不在。虽无处不在，却唯有在复的时候看见的最清楚。因为在复的时候，阳似乎已被剥尽乃又复生于下，表面静默不动，实际则蕴含一片勃勃生机，这比任何别的时候都更能说明阴剥阳消，剥极而复的客观规律。\n复卦主爻是初九。初九不远而复，恰与上六相反，上六是远而不复。六五敦复，敦复是复的稳固，与六三相反；六三频复，频复是屡次反复，复的不稳固。六四独复，与六二休复相似；六四应于初九，六二比于初九。"},"25":{"P":"《序卦传》说：“复则不妄矣，故受之以无妄。”无妄，没有虚妄。没有虚妄就是实的意思。在《易》里，阴是虚，阳是实。复卦是阴消之后阳又复长的时候，复以后便是实，所以复卦之后接着是无妄。无妄的构成是震下乾上。震，动也。遵循天之正道而动，可以无妄。若以非正道动，则不是无妄而是妄了。","G.N":"此卦辞应作一正一反两层意思看。“无妄，元亨利贞”，是从正面说。卦的上体是乾，乾本是天道，具备元亨利贞四德。卦的下体是震，震本是动。怎样动？应因天而动，不因人而动，亦即因顺自然而动，不因任人为而动。因顺自然而动，无往而不利，所以能够元亨利贞。“其匪正有眚，不利有攸往”，是从反面说。如果因人而动，不因天而动，亦即不因顺自然而动，而因任人的私意而动，那就不正了。不正则有眚，有眚则不利有所往。有眚是无妄的反面。据《说文》，眚是眼睛上长的翳。眼睛上长了翳，便失去光明，无妄便成为有妄了。","T.N":"“刚自外来而为主于内”，说的是内卦震。根据《说卦传》“震一索而得男，故谓之长男”的说法，我们知道，震自坤变来，乾一索于坤，坤之初爻由阴变为阳，由柔变为刚，于是坤变为震。震之初九这一刚爻是来自外卦乾。正由于震初九是自外卦乾来，所以叫做“刚自外来”。又因为初九这一刚爻处于内卦，且为成卦之主，所以叫做“为主于内”。实际上是说，初九这一爻是无妄卦之主，是无妄之所以成为无妄的关键。孔子作《彖传》，在无妄卦提出了卦主的问题，并未涉及其他诸卦。王弼作《易略例》加以推衍，认为每一卦都有卦主。王弼的这一发现是正确的，无怪为后世学者所普遍接受。\n“动而健”讲内外二体，“刚中而应”讲二、五两爻。内卦是震，震是动。外卦是乾，乾是健。内动而外健，亦即动而健。九五以刚居中得正，所以叫“刚中”。六二以柔居中得正，正应于九五，所以叫“而应”。由于无妄有“动而健，刚中而应”的本性，所以能够“大亨以正”。“大亨以正”，所说的实际上就是元亨利贞。“天之命”即天之道。天之道，用今日通行的语言来说就是自然规律。“大亨以正，天之命也”，与乾卦讲的“元亨利贞”同意，都是说“元亨利贞”是自然规律。\n《彖传》讲“刚中而应”的有师、临、萃、升和无妄五卦，讲“大亨以正”的有萃、临、无妄三卦，讲“天之命也”的则仅有无妄一卦。无妄讲“天之命”，强调“大亨以正”，乃天道自然所致，绝非人力所能为。\n“无妄之往，何之矣。天命不佑，行矣哉”，是解释“其匪正有眚，不利有攸往”的。就人来说，处在无妄的时候，重要的问题是守正，不要希望以非分的办法侥幸获福，也不要希望以非分的办法侥幸免灾。正确的办法是守正道而听自然，亦即不要有所往。处在无妄的情况下若有所往，则“何之矣”，即向何处去呢！无处可去。因为“天命不佑”。“天命不佑，行矣哉”，是说你做事不符合规律，怎么能行得通呢？","X.N":"“天下雷行”，雷是依据客观规律运行的自然现象，春发冬收，并无差妄。“物与无妄”，万物随着雷的发生而发生，无论洪纤高下，飞潜动植，都依着自然赋予它们的所谓“性命”，生长、发展、运动，也并无差妄。统治者应该体会无妄这一卦的精义，把它用到治理天下上，“以茂对时育万物”。茂，勉励。对，针对，顺应。“时育万物”的“时”字十分重要。自然界万物发育生长，都是按照四时的规律进行，统治者统治人民百姓乃至对待草木昆虫之类，也要按照四时的规律进行，使各得其宜。古人极重视“时”，中国历史很早就实行朔政制度就是证明。朔政亦即月令，按季节安排活动，尤其农事活动，什么季节来了，做什么相应的工作。一切活动都不可违背天时。","Y1.N":"初九是无妄之主，所谓“刚自外来而为主于内”。初九阳刚初动，动与天合，以此而往，必无不吉。初九爻辞所讲的与卦辞及《彖传》所讲的有所不同。卦辞讲了无妄的正反两个方面，强调守正则大亨，不守正则“不利有攸往”，《彖传》也说“无妄之往，何之矣”。就是说，就无妄全卦看，往的吉与不吉，利与不利，是有条件的，关键是看能否守正，亦即看它是动以天呢，还是动以人。动以天而往则利，动以人而往则不利。初九爻辞则不然，却说“无妄往吉”，意谓初九尽须往，往则吉，“往吉”是绝对的。\n初九爻辞与卦辞及《彖传》讲的所以不同，在于卦辞及《彖传》讲的是整个无妄这个时代的问题。而初九所讲的仅是无妄这个时代的第一个阶段。因为它是无妄之主，以阳刚居初，它的本性就决定它动必以天，行必守正，因而无往而不得吉。","Y1.XN":"初九以阳刚居初，因顺自然，适应规律，不以私欲妄行，所以不论何所往，都将顺利无所窒碍，能够得志。","Y2.N":"六二以阴居阴，有安分而无所期望之象。由于安分做事无所期望，所以是不耕获，不菑畬。不耕获，是不刚刚耕种就盼望收获；不菑畬，是不刚刚垦荒一年就盼望成为三年熟田。即但做眼前应当做的事，不期望尚未来临的事情的成功。能够如此，则利有所往。","Y2.XN":"富，利。未，非，不。不在耕种的时候就盼望收获之利。","Y3.N":"无妄卦六爻都是无妄，六三以阴柔居三，不中不正，所以有灾，是为无妄之灾。无妄之灾，是无故而有灾，自己没有过失，灾自外而来。比如邑里有人把一头牛拴在那里，行路的人牵牛以去，而住在邑里的人却倒了霉，受到诘问拘捕。这对于邑人来说便是无妄之灾。","Y3.XN":"行人把牛牵走，邑人无故受诬，这是邑人之灾。邑人之灾是无妄之灾。无妄之灾，自己没有办法躲过。自己求其无妄而已，祸福只可听其自然。","Y4.N":"九四与初九相对应，二爻虽皆无妄，但各自处境不同，因而爻义也不同。初九以阳刚处动之初，行乎其所当行，故曰“往吉”。九四以阳刚居乾体，止乎其所当止，故曰“可贞无咎”。初九是往，往而得吉。九四与初九相反，不是往而是可贞。可贞是固守不动，不往不行。固守不动，不往不行，方得无咎。","Y4.XN":"九四可贞无咎，乃由它自身固有的内在原因所决定，非自外铄而来。顺之以可贞，则无咎；逆之以不可贞，则有咎。人处九四的境地而有识于此，则当不往不行，于福不求幸得，于灾亦不求苟免，终必无咎。","Y5.N":"“无妄之疾”与六三“无妄之灾”意义相似又有不同。九五爻辞说“勿药有喜”，是因为九五所处的地位好于六三。九五以阳刚居中得正处于尊位，可谓无妄已至无以复加的程度，是真实无妄，它本无致疾之由，然而却有了疾。此疾乃来自外而非生于内，是无妄之疾。无妄之疾对于九五来说不必怕，应以“勿药”为药，以不治为治，结果必“有喜”。“有喜”是疾病不治自除的意思。《周易》言“疾”又言“有喜”者有三处，此爻之外有损卦六四和兑卦九四，都在外卦，意义亦略同。","Y5.XN":"得无妄之疾，最好的办法是守正安常，泰然处之，疾将自然祛除。如果试之以药，则等于否定了自己守正安常的正确做法，从而破坏了自己正常的生命机制，不仅不能去疾，反而会招致更多的疾病。“无妄之药，不可试也”的道理应用到社会人事上也是如此。治国之人如果实践证明自己的某一政策是正确的，就该贯彻执行到底，纵然有人反对甚乃攻击诽谤，也不可动摇改图。否则，无异于以国试药，后果必然可悲。","Y6.N":"上九这一爻不好，关键在一个行字。眚自行来。上九处在全卦之终，失位而居乾体之极，时已过去，宜静不宜动，宜止不宜行。在这种情况下还要有所前行，无妄便要变为妄了。即使是无妄之行，也会“有眚”，会“无攸利”。\n卦辞言“有眚”，爻辞言“有灾”兼言“有眚”。灾与眚，后果相同，其缘由有别。灾是外来之祸，眚是自致之过。六三失牛，祸自外来，是灾，不是眚。上九轻举妄行，祸是自己造成的，最须警惕戒慎。","Y6.XN":"无妄之行犹《彖传》所说的无妄之往。无妄之行本应是好的，但行不守正，或行不以时，则不好。上九的问题主要是正当乾之穷，处时不利，与乾上九“亢龙有悔”之义同，所以二小象都说“穷之灾也”。此爻爻辞言眚，是就主观意图说的，时穷不当行却偏要行，祸出于己，所以叫“有眚”。此爻小象言灾，是就客观时运说的，由于处时之穷而得祸，祸生于外，所以叫“灾”。","Z":"无妄的根本意义是遵循规律，因顺自然。人在无妄之时，应该不妄求，不苟得，当行则行，当止则止，行止动静，一切依时而定。时的问题在无妄卦表现十分突出。无妄卦六爻皆无妄，然而各爻所处之时不同，其结果也就不同。初九得位，且是卦之主，当无妄之初，所以无往而不吉。上九失位，居无妄之极，时已过去，所以其行尽管无妄，亦不免“有眚，无攸利”。其余诸爻莫不如此。六二与初九类似，言“利有攸往”，处在当动的时候，所以动则吉，动则有利。九四言“可贞”，九五言“勿药”与上九言“行有眚”类似，处在当静的时候，所以动则“有眚”，不动则“无咎”，“有喜”。《周易》极重时的问题，在无妄卦表现尤为明显。\n时的问题其实就是人如何处理主观与客观的关系问题。时变了，人的认识与行为也要变。人要审时度势，因顺自然，根据客观实际选择最佳的对策。在初九和六二的时候，动则得吉，有利，所以动。在九四的时候，不动则“无咎”，所以不动。在六三与九五的时候，不幸而遭遇无妄之灾、无妄之疾，非人力所能逆料避免，此时只能静观时变，别无他途。总之，人处在无妄的时代，最为要紧的是主观符合客观，客观变了，主观必须相应而变。\n无妄卦还有一点值得注意。《周易》于内外爻的关系例以刚柔相应为好，而无妄则不然。初九与九四两刚敌应，敌应本不好，然而在此却好，初九往吉，九四无咎。六二与九五正应，六三与上九正应，正应本应该好，然而在此却不好，六三有灾，九五有疾，上九有眚。"},"26":{"P":"《序卦传》说：“有无妄然后可畜，故受之以大畜”。无妄是有实而无虚妄。有实而无虚妄，故可以畜聚。因此大畜次无妄之后。就卦象说，此卦乾下艮上，天藏于山中，有所畜至大之象。畜有止与聚两层含义。取天在山中之象，则畜为畜聚；取乾为艮所止之象，则畜为畜止。物止便可有所积聚，所以止也是畜的意义。","G.N":"此卦之所以名大畜，是因为卦之下体是乾，上体是艮。至大无比的天被包容在山之中，又乾健为艮所止，都有畜聚之象，而且不是一般的畜聚，是世界上最大的畜聚。就人自身来说，人的最大的畜聚是学问、道德的畜聚。学问、道德的畜聚除浅深多少之外还有一个正与不正的问题。学问、道德既充实又端正才有利于国家社会，所以卦辞曰“利贞”。学问、道德既充实又端正的人应效力于天下国家，此不仅是一己之吉，也是天下国家之吉。假若穷处而自食于家，结果将是吉的反面。学问、道德所畜极大的人，如能报效天下国家，且又显达遇时，肯定会济天下国家之大艰大险。所以卦辞曰“不家食吉，利涉大川”。","T.N":"“大畜，刚健笃实辉光，日新其德”，这是从卦之才德方面进一步解释卦名的意义。刚健是乾之德，笃实是艮之德。刚健，故无私欲；笃实，故不虚浮。上下两体交互影响、渗透，使刚健者愈刚健，笃实者愈笃实，辉光照映，日新又日新。为人能如此，则才德必能畜之不已，日益充实。这是大畜之所以名之曰大畜的根据。\n“刚上而尚贤，能止健，大正也”。上九以阳刚居上，叫刚上。阳刚居上乘六五尊之柔，有尚贤之义。尚贤亦即畜贤。艮在乾之上，能止健。说“止健”，与说“健而止”不同，“止健”的止有畜的意义，“止健”的健应指贤者的德才而言。所以，“能止健”当与“尚贤”同义。为国家畜养贤能之人才，乃是“大正”，是意义最大的正事。孔子在此发掘出《周易》的人才思想。\n“不家食吉，养贤也”，不要穷处而自食于家，要效力国家，食天子诸侯之禄。从国家的角度说，这是“养贤”即畜养人才的措施。孔子继续用人才观点解释卦辞。\n“利涉大川，应乎天也”。国家畜养人才，必将使用人才，发挥人才的作用。从人才自身的立场看，他应该能够“涉大川”，济天下之艰险，为国家解决大问题。而这是“应乎天”的。“应乎天”，应之者是六五，六五是君。天是下体乾。六五应下体乾之中爻九二。这就是“应乎天”。应乎天而行，没有什么艰险不能渡过，没有什么问题不能解决。","X.N":"天至大无比，然而却在小得多的山的蕴含中，没有比这更大的大畜了。君子观此卦象受到启发，乃不断充实畜聚自己的学问、道德。学问、道德虽为二事，却密不可分，均由学而至，由学而大。怎样学？“多识前言往行”，多多学习前贤往哲的言行，藉以修养畜成其德。大畜言畜德，小畜言懿文德，二者都讲畜德，但小畜之文德是小德。","Y1.N":"厉，危厉，危险。已，止。初九以刚居刚，又属于健体而处下，依它的本性来说，它是必然要上进的。但有六四在那里阻止它上进，如果它不顾六四的阻止，一定要上进，则必有危险，而且最终还是上进不了。最好的办法是自己，自止不进。","Y1.XN":"初九是刚健之才，其上进之心为六四所止，必急躁不能堪，非常有可能不顾一切地于不可进而强进。如果真的于不可进而强进，其犯灾是必然的。所以爻辞告诫“有厉利已”。意思是说，不止便要犯灾。","Y2.N":"说同脱。輹是车下缚轴之木，车轴有它才能转动。车停止不行时，輹就脱下来。“舆说輹”，是说车停下不走了。不是被迫不走，是自行不走。九二有“舆说輹”之象，与初九有相同之处也有不同之处。都是阳刚之才，都为外卦之阴柔所畜止，这是相同之处。不同之处在于初九刚正而不中，九二刚中而不正。在《易》里最贵中。初九不中而受畜止，是有所畏而不得不止。九二居中而受畜止，是无所畏而见其不可过刚而自止。","Y2.XN":"“舆说輹”，自止而不进。“尤”是过错。九二以刚得中，有中德，所以能够自止不前，没有冒进之过尤。","Y3.N":"九三以刚居刚，乃纯乾，所以喻以良马。逐，奔驰前进，跑得极快。曰字据朱熹《周易本义》说，“当为日月之日”。闲，练习。舆，车。卫，所以自我防卫。“日闲舆卫”，经常练习车的使用与自我防卫之人。在大畜卦里，二爻相应则相止。初九为六四所止，九二为六五所止。九三与上九都是阳刚，不相应，所以不相止。而且九三与上九既然都是阳刚，便都是力求上进之物，二者有同志之象。九三欲上进，上九不但不加以畜止，反而与其合志而进。于是九三可以如良马驰逐一般上进了。然而事情都应从两方面考虑。越是在看来没有问题的时候越要艰难其事，小心戒慎。九三处乾体，刚健居正，且有上九与之应，所以爻辞告诫其知难而不失正，应“日闲舆卫”。若能如此，方可“利有攸往”。","Y3.XN":"九三之所以会“利有攸往”，关键的问题是上九不畜止它，而与它合志。别的卦刚柔相应为得，大畜卦刚柔相应则为畜止。别的卦刚柔相敌为不相与，大畜卦刚柔相敌则为合志。","Y4.N":"童牛，没有长角的小牛。牿，牛角前面放的横木，使牛不能用角顶人或触物。六四处在上卦，上卦艮，取止义。六四以阴柔居阴位得正而与初九相应，相应则相畜止。六四是畜止初九的。初九居全卦之下，是诸阳中最微弱的，六四容易畜止它。犹如改正错误，解决问题，在错误、问题处于萌芽状态时就及早加以改正、解决，必然容易而且有效。“童牛之牿，元吉”讲的道理正是这样。六四好比那个牿，初九好比童牛尚未露头的角。\n未等牛角长出就采取措施加以防范，使它不至于顶人撞物，当然是再好不过，所以爻辞曰元吉。","Y4.XN":"六四畜止初九，畜止的对象小，畜止的时间早，畜止最易成功有成效，所以元吉，元吉所以有喜。","Y5.N":"豕，猪。豮，给猪去势。猪是刚暴的动物，它往往用自己锐利的牙齿伤人。六五居君位又得中，能以柔道畜止九二。但是不象六四畜止初九那样容易了，因为九二的刚暴之性已经长成，已经形成的问题再来解决，当然没那么容易。然而问题也能解决，办法是抓住关键。好比猪用它的牙伤人，治猪的牙不行，要治猪的性，给它去了势，刚暴变温顺，有牙也不再伤人。六五畜止九二，虽不容易，但毕竟可能成功，所以吉。","Y5.XN":"六五的情况与六四有所不同。六四畜止刚健于初始，从止物的角度看，是最好的，所以称元吉。六五则止刚健于渐长之时，从止物的角度看，不如六四好，所以仅称吉。但是从二者所处的位来看，六四不如六五好。六五居君位，为君者做事影响广大，所以称有庆。六四的影响限于己身，所以称有喜。","Y6.N":"何字音贺，义与荷同。衢，四达之路。天衢，比喻通达无碍。上九应与九三合看。别的卦多以刚柔相应为得，大畜卦初九与六四相应，九二与六五相应，相应却不相得而有止象。唯独上九不同，上九与九三虽为两刚相遇，却德同志合。九三要前进，上九也要前进。上九居大畜之终，畜止已至极点，该转为通了。上九又是大畜之主，它负荷尚贤之大任，遇应天行道之时，有如天衢荡荡，任其驰骋。集中地体现了卦辞“不家食吉，利涉大川”和《彖传》“刚上而尚贤”的养贤用贤的思想。在国家，是培养和使用人才的问题；在个人，则是为国家社会做贡献的问题。","Y6.XN":"上九可为贤人，亦可为养贤用贤之人。无论何人，其德已经蕴畜充分饱满，至此要发挥它的作用了。蕴畜在己身的叫做德，应用到国家社会，把己身蕴畜的德落实到实践上，就是道。上九身荷重任，遇大畜之时，当大畜之极，其作用将得以充分施展，有如“荷天之衢”，四通八达，毫无阻碍，可谓“道大行也”。","Z":"根据孔子在《彖传》和《象传》里的解释，大畜卦的主旨是畜聚及畜止。卦辞、《彖传》及“大象”主要讲畜聚，爻辞及“小象”主要讲聚止。孔子又将大畜卦的卦义由抽象上升到具体，径直理解为养贤用贤的问题。\n六爻主要讲畜止，但也关联着畜聚的意义，归根结底在说明着养贤用贤的问题。初九有厉，知难而止。九二得中，能脱輹而自止，知时之应止而止。九三与上九因敌应而志合道同，知时之宜进而进，进则如良马驰逐，但须有所限制，不可锐于进。六四童牛之牿，善将邪恶消灭在未萌初萌的状态。六五解决问题善于抓住关键，有如豮豕之牙。上九畜极而大通，畜道之行，无所阻碍，通达如天之衢。从尚贤的角度考察，有厉、脱輹，相当于“家食”，贤者为大川所阻，未得进用。牿牛、豮豕，不肖者受到及时的教育和根本上的救治。至良马逐，贤路渐开，虽仍有坎坷，但日闲舆卫，则贤者可进矣。到何天之衢的时候，大川已涉，险阻已去，贤路广开，畅通无碍。"},"27":{"P":"《序卦传》说：“物畜然后可养，故受之以颐。”物已经畜聚了，接着的问题是如何来养它，使它得以生息。因此大畜之后次以颐卦。颐卦震下艮上，中间四个阴爻，上与下各一阳爻。与噬嗑卦比，噬嗑卦中间多九四一个阳爻，像口中有物；将口中之物去掉，就像人的口。口的形象是中间虚，上下实，而且上止下动，极似人在吃饭。人口饮食，用以养人之身。养亦即颐，故卦名曰颐。但颐具有普遍性的意义。依孔子的理解，天地养育万物，君主养贤养万民以及人之养身养德，都在颐义的含盖之内。","G.N":"颐之义尽管含盖广泛，然而归纳起来不过养人与自养两方面。观颐，观其所养。观其所养，不是观其所养的对象，而是观其所养之道即怎样养。自求口实，观其自养。观其自养，是观其养身养德之道即怎样自养。养人与自养，最重要的问题是看他养的正与不正，正则吉，不正则不吉。","T.N":"“颐，贞吉，养正则吉也”，养的问题关键是正与不正。什么是正什么是不正，《易经》只作了一般性的指示，具体的理解必须因时因人因事而定。儒家孔孟荀在这个问题上的观点也是极灵活的。一般来说他们重义轻利，他们赞赏伯夷、叔齐不食周粟的义，但对于普通百姓则主张把吃饭穿衣问题放在首位。孔子明确说百姓“富”了，“庶”了，方可进行教育。孟子更说百姓凶年“救死唯恐不赡”，哪有时间讲究礼义！\n“观颐，观其所养也。自求口实，观其自养也”。观其所养与观其自养，是从两个方面说，归结起来还是一个养字。无论养人或自养，所要看的端在养之道正与不正。正与不正并没有一个一成不变的标准。养以道义或养以衣食，所谓正，以孰为先，全视所处时宜而定。\n“天地养万物，圣人养贤以及万民。颐之时大矣哉”。孔子认为养的问题是个关乎天地自然，国家社会，生民百姓的大问题，把自然与社会两个方面全纳入养的问题中来。天地养万物当然是有一定规律的。雨露阳光的施与，四时阴阳的交迭，没有差忒就是正。圣人养贤以及万民，应与天地养万物一样，也是有规律的。圣人是统治者，统治者养人主要是养贤的问题。通过养贤，以养百姓。","X.N":"山下有雷。上止下动，有口颊之象。与口颊相关的事，一是言语，一是饮食。君子观颐之象，要慎言语，节饮食。祸从口出，病从口入；言语一出而不可复入，饮食一入而不可复出。所以，言语与饮食二事最应慎重对待。就个人说，言语就是言语，饮食就是饮食；就国家说，言语包括政策法令，饮食包括税收赋入。国家的“言语”尤须慎，国家的“饮食”尤须节，绝不可悖出悖入。","Y1.N":"舍，弃。尔、我，你、我。灵龟，明智的龟。龟可不食而长寿。朵颐，口颊蠕动欲食甚乃垂涎的样子。初九与六四相应。初九是阳刚之才，论其才智完全可以像灵龟那样自养而不求养于外，但现在它居于动体，不免贪欲之心动而求养于外，结果阳反观阴朵颐，必凶。爻辞借用六四的口气讲话：“舍尔灵龟，观我朵颐”，你本来是灵龟，不需求养就活着，现在怎么舍弃了灵龟的特性，看到我就流口水？初九阳刚本应养阴，现在却要求养于阴，必凶。","Y1.XN":"初九是刚健明智之才，本来是可贵的。依孟子的说法，养其大体为大人，养其小体为小人。今初九以阳刚之才竟“观我朵颐”，企求小体之养，则其才亦不足贵了。","Y2.N":"颠，颠倒的意思。拂经，违背常经的意思。颐卦六爻不是讲颠就是讲拂。讲颠的是求养于下，讲拂的是求养于上。六二因与初九比，乃求养于初九，但未达到目的，又违背常经越过六五往求养于上九，结果既触犯了六五，亦未得到上九之养，征凶是必然的。","Y2.XN":"失其类，六二失掉六五。六二与六五都是阴爻，为同类。","Y3.N":"拂颐，是求养于上九。六三与六二不同，六二比于初九，有初九可求；六三无它可求，只能求养于上九。上九与六三为正应，六三求养于上九是正当的，故曰“贞”。贞，为什么凶呢？这是由六三的本质决定的。六三以阴居阳，不中不正，且居动之极，乃履邪好动之辈，它为满足私欲，求养于人，必无所不至，凶是不可避免的。十，数之终。“十年勿用”，是说终不可用，无所往而利。","Y3.XN":"“十年勿用”，问题十分严重。因为六三的过错不是一般的小问题，而是“道大悖”。颐卦卦辞说“颐贞吉”，此爻辞与之根本相反，说“拂颐贞凶”。所以说“道大悖”。悖，逆。“道大悖”，根本违背了养人或自养之道。易爻辞言“贞凶”的共八条，屯、师、随、巽、节、中孚，都在外卦，唯颐之六三与恒之初六在内卦。它们在外卦都有应爻，问题出就出在其自身阴柔不中不正上。","Y4.N":"六四以阴柔居大臣之位，既得正又与初九正应。自己阴柔，所以不能自养，更不足养天下，于是求养于在下之贤者初九。以上求养于下，叫颠颐。六四柔顺而正，初九必满足它的要求，所以吉。从初九的角度看，求养于六四则不好；而从六四的角度看，求养于初九则吉。又，同是颠颐，在六四吉，在六二则征凶，原因是六四在上体，颐之上体三爻所求在道，即求养大体，所以都吉；六二在下体，颐之下体三爻所求在物，即求养小体，所以都凶。\n“虎视眈眈”，虎向下盯视一物而不他顾的样子。“其欲逐逐”，继继以求，不达目的不罢休。六四求养于初九，像老虎攫食那样，盯住一物则专一而不贰，继继而不歇，非达到目的不可，这是六四居上而求德又求养于下的正道。六四能如此，所以无咎。自养于内，不食而长寿，龟是最好的代表，所以初九取龟为象。求养于外，不专不恒则事不济，最好的代表是虎，所以六四取虎为象。","Y4.XN":"六四颠颐，居大臣之位，以上求养于下，得初九阳刚之应，达到了求养的目的，所以吉。“上施光”，光犹广、大。就国家来说，这等于君主通过养贤将德政广泛施于全国，解决了养贤以及万民的问题。","Y5.N":"拂经，在下而求养于上。居贞，居守贞固，不宜有所行动。六五以柔居中处于君位。君本应是养人养天下的，但它自己是阴柔之才，养人养天下的问题只能靠臣下去办。六五与六二非正应，所以求养于上九。上九阳刚居上而下乘阴柔，能够解决六五委托它解决的问题。六五作为君主坐在那里贞固不动就可得吉。但是涉大川不行，遇到大艰大险的事情，还是依靠臣下去处理。","Y5.XN":"六五拂经居贞之所以能够得吉，是因为它自己虽无阳刚之才却能以柔顺之德以从上九，借助上九的力量以养天下。其实这就是《彖传》所讲的“圣人养贤以及万民”之事。","Y6.N":"阳为实，阴为虚。实，养人；虚，求养于人。颐卦中间的四阴都求养于上下二阳，而二阳又以上九为主。上九是艮止的最上一爻，四阴爻都由它而得以养，所以叫做“由颐”。由颐当得吉。然而它毕竟是人臣，以人臣当养天下之重任，必须常怀危厉，戒慎恐惧，方可得吉，所以叫做“厉吉”。“利涉大川”与“厉吉”相联系。“利涉大川”里面包含着厉与吉两层意义。因为是要解决大艰大险的问题，所以危厉；因为能够解决大艰大险的问题，所以吉。","Y6.XN":"“大有庆”，非一人之庆，乃天下之庆。上九之厉吉，不是它自己的功劳，是由于有六五对它的信任、依赖和顺从而获得的。这与六五“小象”的说法恰相对应。六五居贞之吉，不是它贞固自守得到的，是由于它“顺以从上”，借助上九的力量获得的。","Z":"颐卦所讲的主要是养的问题。养的问题从人与人的关系来说，包括养人与自养两个方面；从养的内容来说，包括养德与养体两个方面。养人为公，是好的。养己为私，是不好的。养己又有养德与养体之分，养德为大，养体为小。这是就一般的情况而言，什么是好，什么是不好亦不可一概而论，要依具体的情况而定。例如卦中上体艮的三爻，一般说都是养人的，养人为公，好。然而六四却是求养于初九的，不是养人。不是养人为公为什么也得吉？这是因为六四有柔顺之性，以阴居阴得正。卦中下体震的三爻，都是不能养人而求养于人的。凡求养于人的都志在于物不在于德，所以都凶。卦辞讲“颐贞吉”，颐得正就好。六三以阴居刚，不中不正，是履邪好动之辈，合该致凶，可是初九以刚居刚得正，六二既得正又得中，理应得吉为什么却凶呢？这是由于它们所处的时不好。可见《易》里正与不正的标准不是死的，要依时而定。从而亦可见《易》的思维虽有模式却也十分灵活。《易》思维的灵活性反映了生活本身的复杂性。"},"28":{"P":"《序卦传》说：“颐者，养也。不养则不可动，故受之以大过。”世间万事万物都养而后成，成了则能动，动了就产生过的问题。所以颐卦之后次以大过。大过为卦巽下兑上，泽在木上。泽当润养于木，而今竟至把木灭掉，有大过之象。大过是阳之过。阳为大，故阳过称大过。推广开来，凡事超过一般的水平，达到非常的程度，比一般常见者大，都可谓之大过。大过的过不是“过犹不及”的过。“过犹不及”是说做事要求中，不使不及或过头。不及或过头都是不中，应当纠正，而大过强调的是大小强弱的大，不存在纠正的问题。","G.N":"栋，屋脊檩木，用以承担椽木和瓦。桡，弯曲。大过是四阳之卦，《易》中四阳之卦共有十五个，独有此卦名大过，不是因为阳多于阴，是因为四阳集居于卦之中，二阴分居于卦之本末。初六为本，上六为末。两头太弱，中央过强。四阳是栋，两头寄托在本末之上。本末皆阴柔无力，不能担当重任，所以有栋桡之象。在此栋桡的时候，必须有所往，即有所作为方可亨。从国家政治生活方面看，大过是国家出现了危机，必须大有所作为，方可转危为安。","T.N":"“大过，大者过也”。大者过就是阳过。卦中四阳集聚连接居于中央，其间二五两阳居中用事，二阴被摈斥于外，这是阳过，阳过即大过。\n“栋桡，本末弱也”。刚过与本末弱是一个问题的两个方面。栋之所以桡，既由于刚过也由于本末弱。\n“刚过而中，巽而说行，利有攸往，乃亨”。从六爻之象看，中四爻强，本末弱，有栋桡之象。从六爻之才看，问题是能够得到解决的。中四爻虽然刚过，但二、五两爻都得中用事，能以中道处理问题，初上两爻又以巽顺和悦而行，能得人心，具备这样两个条件，有所往，即有所作为肯定会亨的。\n“大过之时大矣哉”。大过之时之所以大，由于大过之时必有大过之事。大过之事，如立君、兴国、改俗等等，不得其时不成，得其时而无其人亦不可成。大过之时，正是有大过人之人材发挥作用的时候。","X.N":"泽本润养于木，而今竟把木给灭没，事情发展太过了，是谓大过。君子观大过之象，以立其大过人之行。所谓大过人之行，无如“独立不惧，遯世无闷”，即在处理国家事务时，能做到进则敢作敢为，天下非之而不顾；退则无怨无尤，举世不见知而不悔。","Y1.N":"《系辞传》说；“苟错诸地而可矣。藉之用茅，何咎之有！慎之至也。夫茅之为物薄而用可重也。慎斯术也以往，其无所失矣。”依据孔子这段话的解释，此爻的主旨是强调做事须小心谨慎。如做大事只有一般的小心谨慎还不行，非敬慎之至不能成功。初六处大过之始，阴居巽下，无犯于刚，做事至慎至谨，有如东西放在地上，已经可以了，却又于下面垫上白茅，使它百无一失。","Y1.XN":"“藉用白茅”是柔在下之象。初六以阴柔处于大过之下而与四正应，故云“柔在下”。柔在下对刚在上而言。高以下为基，刚以柔为本，初六虽弱，而敬慎善处，却可以支撑九四之栋不至于倾。","Y2.N":"梯字迄无确解，程颐训作根，近是。今从程说。九二这一爻处在阳过的时候。阳过了，不好。所以把它比喻为枯杨、老夫。但是九二处在刚过之始，得中而居柔，无应于五，而切比于初六，是刚过之人而能以中道与阴柔相济，恰似杨虽枯却能生梯，出现生机，夫虽老竟得女妻，能成生育之功。由于九二刚过而未至于极，又与初六相比，有老夫得女妻之象。它卦以刚居刚得位为善，大过则刚已过，须有柔来相济，所以大过刚爻皆以居柔不得位为吉。","Y2.XN":"九二阳过而与初六近比，有老夫得女妻之象，老夫乃阳之过，今得到女妻相济，遂有重新获得生育的功能。","Y3.N":"卦辞讲栋，指中间四个阳爻，至于爻辞则把栋落实到九三与九四两爻，而栋桡之象独归于九三，这是因为九三以刚居刚，过刚而不中的缘故。处大过之世，做出大事业来，必须有人支持、辅佐。九三过刚，有违中和，遇事不能与人和，没有人来支持、辅佐它。它胜任不了大过之重任，结果必如栋之桡，房倾屋败，凶。","Y3.XN":"九三有栋桡之凶，关键的问题是它无辅，而且不可以有辅。自爻象看，九三本与上六正应，上六可来辅佐它，但是它处大过之时，不过而不中，居巽巽亦将变，与上六志不相从；上六无意来应它，它也无系上六的愿望。自事理看，栋当房屋之中，亦不可以加助；栋桡之凶，是不可避免了。","Y4.N":"栋隆，栋隆起向上，义与栋桡相反。九四以刚居柔，能用柔相济，可担当大过之任，有如栋非但不桡，反而隆起向上，所以得吉。九四以刚居柔，刚柔相宜，已经够了。而它又与初六正应，牵系于阴柔，是谓有它；有它则使九四有累，虽不至于出大问题，也是可吝的。\n九四与九三都在卦之中间，都有栋象，然而九三栋桡凶，九四栋隆吉。其原因有三：一，九三以刚居刚，九四以刚居柔。二，九三居下卦之上，下卦上实而下虚，下虚则上易倾。九四居上卦之下，上卦下实而上虚，下实则可赖以支撑。又九三居九四之下，九四在九三之上。在下故有栋桡于下之象，在上故有栋隆于上之象。","Y4.XN":"九四之所以有栋隆之吉，原因在于它“不桡乎下”，不与初六相系应。如果它牵系于初九，桡曲以就下，便不会得吉而有吝。","Y5.N":"士夫，年轻之男子作丈夫。在大过卦里，刚虽过，若与柔切比便好。\n九二与九五都与柔切比，所以都有生意。虽然都有生意，但生的势头却大不一样。九二当大过之始，得中而居柔，且所与者为初六，初六是本，生机方长，有枯杨生梯，老夫得女妻之象，往无不利。九五则不然，九五当刚过之极，且以刚居刚，所比又是上六；上六是过极之阴，是末，表明生机已至浅且竭的程度，故有枯杨生华，老妇得其士夫之象。枝头生出华来，解决不了树干已枯的问题，小伙子纵然年轻力壮，娶的是老妇人，生育依旧无望。它不像九三栋桡那样有凶，也不像九四栋隆那样得吉，它介于二者之间，无咎亦无誉。","Y5.XN":"枯杨生出华来，说明枯杨尚有一线生机。然而华生于末，非但不能解决根本的问题，反而会使它仅存的些许阳气将迅速耗尽。它怎么可能长久呢！老妇指上六，士夫指九五。上六乃阴过之极，合称老妇，九五是阳过之极，何以称士夫，九五虽非少，与老妇比则为壮，故得称士夫。老妇不能生育，得其士夫依然不能生育。这对于九五来说，同枯杨生华一样，看上去挺好，其实不是什么美事。","Y6.N":"上六居大过之极，处无位之地，泽灭木之象由它这里表现出来，因此有过涉灭顶之凶。它是阴柔才弱之辈，又当阳过至极的时候，无它可做的事情。事情若由它主持，必遭灭顶之凶。这是一方面。从另一方面看，上六有上六的长处。它既是阴柔又是说之主，有从容随顺之德，在任何情况下都不会由于刚激而把已经不利的形势弄得更加不利。它的委蛇斡旋，在大过之极的时候，是无害的，人们不会怨咎它。","Y6.XN":"不是说过涉之凶不可咎，是说上六处在有过涉灭顶之凶的时候，以其有柔顺和说之德，善于斡旋委蛇，不至于把事情弄得更坏，不应受到怨咎。","Z":"大过这一卦将古代社会政治生活中常见的刚过现象加以抽象，使之具有普遍的理论意义。卦辞的概括最为简炼明晰。栋桡可以理解为一种极危险的社会势态，君过强而臣弱，上过强而民弱，政治过强而经济过弱，都可以含盖于栋桡一词之中。冲破这外观还算平静实则充满危机、令人窒息的形势，将历史推向前进，出路只有一条，即卦辞指出的“利有攸往”，有所作为，有所行动。孔子在《彖传》里说：“大过之时大矣哉。”孔子已经认识到了大过讲的是关乎国家命运的大问题。他在《象传》里给政治家们指出了处大过之世的行动准则。即用则独立不惧，毅然前行；舍则遯世无闷，不见知而不悔，自守以待时。《周易》的这一深刻思想，甚至在现代我们还可以感觉到它的伟大活力。\n大过卦还有一点值得注意。易卦诸爻有相应之例，如二与五应，初与四应，三与上应。大过则不然，大过六爻排列成上下对称的形式，即中间四阳爻，上与初二阴爻，它不以相应为象，而以中分反对为象。如三与四对，皆取栋象，四隆而三桡；二与五对，皆取枯杨之象，五生华而二生梯；初与上对，初取藉用白茅为象而强调慎，上以过涉灭顶为象而戒以凶。适用这一易例的，大过卦最为明显，另外还有颐、中孚、小过三卦。又它卦以阳爻居阳位和阴爻居阴位为得正；得正好，不得正不好。大过卦由于阳已经过了，若再以阳居阳，则更加过了，所以大过诸爻以阳居阴者皆吉，以阳居阳者皆凶。大壮卦诸爻取义与此略同。"},"29":{"P":"《序卦传》说：“物不可以终过，故受之以坎。”这句话反映作《序卦传》的孔子已具有关于事物发展到极限定向反面转化的明确观念。坎与大过意义相反。大过是阳之过，坎是阳之陷。一阳居二阴之中，有陷之象，所以坎也是陷。阳的发展也不可过，阳发展至一定程度便要变为坎陷。坎陷的意思也就是险难。卦名习坎，习字根据《彖传》“习坎，重险也”的说法，是重的意思。坎上加坎，险上加险，故称习坎。《易》纯卦八，七卦卦名都用一个字，唯独坎卦上加一个习字，其原因古人解释颇多歧异。有的说其余七卦如乾、坤、震、艮，其德是健、顺、动、止，都是好事，是正面意义的概念，独坎卦之德是险，险不是好事，是反面意义的概念，所以卦名加个习字，强调险之重，险之难，提醒人们特别注意，这样理解，也不无道理。","G.N":"孚，信，有孚，有信。坎为水，水的性质是流，向下流。无论在什么情况下，水向下流的性质是不会变的。这就是有信。有信是说水有信。“维心亨”也是说水“维心亨”。心，水之心。水本无心，说水有心，只是说水的行动总是不停地流向低处，像有心在支配它的行动一样。“维心亨”，水流向大海，经历千山万壑，形体常处在艰险之中，而心则是亨通的。也就是说，水的性质是不变的，永远奔流，亨通而不为险阻所止。“行有尚”，程传释为行“能出险有可嘉尚谓有功也”可从。","T.N":"“习坎，重险也，”此句释卦名义。卦义是险。卦名所以叫习坎，是因为坎卦是两个坎重叠在一起。坎是险，习坎就是重险。\n“水流而不盈，行险而不失其信”，此二句释卦辞“有孚”，关键在“水流而不盈”上。流与盈相反。流是说水就下而向前行，盈是说水满盈而不流。所以此处说水流而不盈，其实是水流而不止的意思。水按其本性说，它是永远流的。它纵然是在险难中也是不舍昼夜地流，“而不失其信”。\n“维心亨，乃以刚中也”。是说“维心亨”是由于卦中九二与九五二爻都是刚而居中。在卦中，“刚中”是好的。坎卦“刚中”，所以“维心亨”，所以“有孚”。“行有尚，往有功也”，是说行险而不失其信，可以嘉尚，能够走出艰险，摆脱困境，取得成功。\n“天险不可升也，地险山川丘陵也。王公设险以守其国，险之时用大矣哉”。这几句话是孔子作《彖传》时附带讲出的自己的体会，不是解释卦辞的。孔子作《易传》时很注意如何将《易经》的思想应用到现实政治生活中去。坎卦是讲险的，而且是重险，一般说对于人是不利的。但是孔子却看到险在一定的情况下也有有利的一面。即他考虑到险可用以守卫国家，防止外敌侵袭。从“王公设险以守其国”来看，这一思想肯定不是《周易》固有的，因为《周易》成书于殷周之际，那时候还没有“王公设险以守其国”的事情。例如武王伐纣，队伍从今日西安出发，很顺利就到了河南，一路上并没有设险阻碍它。到了春秋时代，秦穆公派兵向东扩展，袭郑回军在崤山遭遇晋军截击，结果全军覆没，匹马只轮不返。这主要是桃林之塞帮了晋军的忙。春秋以前不闻有设险守国的事情。孔子当时还是作为一个新问题提出来。至战国，设险已被普遍用于国家的防御上，各国不但修城，而且修长城。证明险在一般情况下是有害，而在特定的时候，它不但有用，而且有大用。所以孔子在此感叹说：“险之时用大矣哉”。","X.N":"洊，再，仍。坎为水，内坎至外坎又至，前水至后水又至，故习坎。君子观“水洊至”之象，要“常德行，习教事”。“常德行”，谓德行有常而不改。“习教事”，谓教育的事情贵在熟习而不间断。","Y1.N":"习坎就是重险，初六以阴柔居习坎之下，而且没有应援，已入于坎险之中，无力出险，故曰凶。窞，坎中之陷处。“入于坎窞”，进入险中之险。","Y1.XN":"初六为什么会进入坎中之陷处，又为什么入了险而不能出险？因为它以阴柔居初，不正。即不守正道，所以入了险便出不来。犹如小人遇险难，指望凭侥幸摆脱，而不依正道办事，结果只有越陷越深。","Y2.N":"九二陷在二阴之中，进入了险地，肯定是有险的。但是九二与初六不同，九二毕竟是刚中之才，虽不能出险，求得一点小济，解决一点小问题还是可能的。九二不要因为小而不求。大是由小积累而来的。","Y2.XN":"九二“求小得”，是由于它未出乎中。君子处险而不为险所困，因为他能心安于险之中，不求大得，亦即从实际出发，求其小得，做现在所能做到的事。","Y3.N":"来，自上往下来；之，自下往上去。六三处在下坎之上，正是下坎之险已终，上坎之险将至的时候，上边是险，下边也是险。“来之坎坎”，来也是坎，之也是坎，来之皆坎，进退皆险。处于这种境况，应姑且伏枕以待不要有所作为，否则将陷险益深，“入于坎窞”了。","Y3.XN":"在“来之坎坎”的时候，不宜急躁求速出险，但六三以阴处阳，不中不正，必急于求速出险，结果肯定达不到目的。","Y4.N":"樽酒，一樽酒。簋，盛黍稷亦即盛饭的器具。圆的叫簋，方的叫簠。缶，质朴无文的瓦器。贰，副。“樽酒，簋贰，用缶”，放上一樽酒，附以一簋饭，而且以缶为尊，以缶为簋。这说的是古代燕享之礼，古代燕享之礼最讲究仪节和排场，而今却“樽酒，簋贰，用缶”，简单之至，质朴之至。纳约，谓进结于君。牖，窗子。古人的居室一般是户在东，牖在西。牖是室内唯一的采光的地方，亦即唯一的明处。人的认识也有像牖一样的明处。若想使人弄明白一个不易明白的问题，也要从他的“明”处开导，从他的蔽处说是说不通的。战国时赵太后不同意让爱子长安君使齐做人质，谁劝也不听，触龙一说就通了。触龙没有别的妙法，只是赵太后关心的是儿子长安君的长久富贵，触龙就以如何使长安君长久富贵，必须令他出做人质进说。触龙进言抓住了赵太后思想上的明处，因而取得效果。“纳约自牖”就是说与人交结，使人信赖自己，要从他思想的明处，做他的思想工作。\n六四这一爻取“樽酒，簋贰，用缶，纳约自牖”之象，是君臣关系问题。六四近君，居大臣之位，处多惧之地，又当坎险之时，它应该像宴会时只用“樽酒簋贰用缶”，那样质实无华，并以“纳约自牖”的办法，取得君上的理解和信任。这样做，终必无咎。","Y4.XN":"际，交接，交际。“刚柔际”指九五、六四。刚柔际相交接。九五与六四之间的关系在爻位亦即君臣之间的关系。“樽酒簋贰”是六四爻辞的略语。“小象”意谓：爻辞所说的全部内容是讲刚柔际、君臣间的关系问题的。","Y5.N":"“坎不盈”，水因其流而不至于盈。祗，抵，适。“祗既平，无咎”，既达到平，乃得无咎。九五以阳居中，有刚中之德，所以能保持流而不盈的品德，虽尚未出险，却也终得无咎。","Y5.XN":"九五与九二都有刚中之德，而处境有所不同。九二坎有险，九五坎不盈。坎有险，意在强调险的存在。坎不盈，意在强调出险的途径。出险的途径是不盈，不盈亦即未大。九五阳刚居中得正，可谓大矣，但不敢自大。不自大方可保持水流而不盈的状态。","Y6.N":"系，拘系。徽、纆，用以拘系犯人的绳索。三股曰徽，两股曰纆。丛棘，囚禁犯人的地方，其实就是牢狱。在周围土墙上插上带刺的东西，不使犯人跑掉，所以叫丛棘。“系用徽纆，置于丛棘”，用绳索拴上，投入牢狱。“三岁不得”，据《周礼·司圜》“收教罢民，能改者，上罪三年而舍，其不能改而出圜土者杀”的记载，是犯人被囚禁三年后仍不得免，最后被处死。这当然是凶了。三年，很多年，不必实指三年。上六为什么会有如此严重的凶象呢？因为上六自身是阴柔之辈，又处在坎险之极，已经陷入深险，没有出险的可能了。","Y6.XN":"上六所以致凶，推原其原因在于失道。此“失道”系指上六以阴居险之极，所处时位不济而言。","Z":"习坎这一卦为我们提出了险概念的普遍性意义和处险行险的一般性原则及其具体指示。险概念的最初的易象根据是阳陷，阳陷入二阴的包围、挟持之中。阳陷入困境，所以险。推衍开来，天有天之险，地有地之险，人世有人世之险。险必为害于人，有时也可能为人所用而有利于人。于是险概念又由抽象上升到具体，成为可以言状，可以分析的了。\n《周易》取“水流而不盈”为象，指出人处险行险的可行性原则。人处险境时，应像水那样不顾一切地向前流去，即卦辞说的“有孚”和“维心亨”。人处险境，身困于险，心不可困于险。“哀莫大于心死”，心不死就有出险的希望。水在坎险之中总是就下而行，人困于险则应守正道，做应该做也能做的事，不存在一丝侥幸念头。\n六爻爻辞不见一吉字，可见处险之险，出险之难。初上二爻处在二、五两阳爻之外，所以最凶，没有出险的希望。二小得，五不盈，弄得好，或可能出险。三、四情况介于初、上与二、五之间。三要善于等待，四要质实谨慎。如此方可无咎。"},"30":{"P":"《序卦传》说：“坎者陷也。陷必有所丽，故受之以离。”据《说卦传》，“离，丽也”。离的性质是丽。丽是附丽的丽，不是美丽的丽。陷于险难之中，必有所附丽，所以坎卦之后次以离卦。离卦六爻，阴附丽于上下之阳，所以是丽。离卦二、五两爻是阴，阴为虚，有虚之象，离所以为明。离又为火，火的外部特征是虚，不能自成自生，必附丽于他物而明。","G.N":"离即丽，附丽的意思。在现代汉语里离是附丽的反义词，为什么古人说离是丽呢？这与古人的语言习惯有关。古人往往一字两用，用它的正义又用它的反义。比如乱字，有时便当作它的反义词治字用。古人使用离字也是如此。\n离，丽也。附丽是普遍现象。自然界和人类社会，万事万物都存在着此一物与彼一物，此一事与彼一事的附丽关系。就人来说，无论什么样的人，他生活在人世间，总要有所附丽。人事上要有所依靠，事业上要有所专攻，思想上要有所信仰，理想上要有所追求。这些都是人之所丽。人之所丽的问题，解决得好不好，能否亨通，首要的问题在于所丽的对象正与不正。其次则是自己如何做了。卦辞指示的做法是“畜牝牛”，牛是温顺之物，牝牛则是温顺又温顺之物。就是说人在确定了正确的附丽的对象之后，要修养成如同母牛那样的温顺。牝牛般温顺的品格，绝非短时间所可成就，要有长期的磨炼才行。所以用一个“畜”字。畜即养，养则非一朝一夕事。","T.N":"“离，丽也。日月丽乎天，百谷草木丽乎土，重明以丽乎正，乃化成天下”，这一段话是解释卦名的。离的含义是附丽，附丽的现象普遍存在于天地万物之中，日月附丽于天而动而明，百谷草木附丽于大地而生而长。这是人们极易看到的丽。卦名之离，所反映的就是这个意义。“重明以丽乎正”，进一步以卦之二体解释卦名。离为明，离卦上下二体都是离，所以叫重明。“丽乎正”，丽于正，正是卦之二五两爻，主要的则是六二，因为六二以阴居中得正，是成卦之主。自事理上说，“丽乎正”是说凡所丽的对象是什么可以不问，但必须是正，人应是正人，事应是正事，物应是正物，道应是正道。\n“柔丽乎中正，故亨，是以畜牝牛吉”，这段话是解释卦辞的。卦辞讲“亨，”讲“畜牝牛吉”的根据是卦有“柔丽乎正”之象。柔指六二与六五两个阴爻，中正指二与五两个爻位。六五以柔居五，是柔丽乎中，六二以柔居中得正，是柔丽乎中正。《彖传》言“柔丽乎中正”，把六二与六五都包括了。正因为是丽乎“中正”，所以亨；正因为是“柔”丽乎中正，所以“畜牝牛吉”。“柔丽乎中正”一语回答了两个问题，一是所丽的对象是中正，所以亨；二是丽者自身是柔，像牝牛一样温顺，所以吉。","X.N":"作，兴，起。“明两作”，同一个明出两次，是作而又作，有时间上的连续性。大人观离之“明两作”之象，受到启示，应用到政治上，乃“以继明照于四方”。大人一词就道德学问说是圣人贤者，就政治地位说是天子诸侯。继，相继不绝。统治者要把前人的明德，世世代代继承下来，发扬光大，并把它普照于天下四方。","Y1.N":"离卦下体三爻，初爻象早晨日出，二爻象曰当中午，三爻象曰过午后。履，践，藉。错然，交错，纷错，杂乱无绪。早晨起来，“履错然”，开始了一天的工作。工作的开始很重要，事情的结果如何，往往在开始的时候就已经埋下了根子。这时候最需要敬慎小心，敬慎小心可无咎，否则便要得咎。初九居离卦下体，有如日之初出，又是以刚居刚，极易锐意躁进，故有“履错”之象。但初九以刚处明体，也有明智聪察的一面，可能敬慎以处之，果能如此，可无咎。","Y1.XN":"履错然而欲动，却又敬慎不敢妄动，是为了避免得咎。初九以刚居刚而处下，有急于上进的一面，以刚居刚而处明体，又有敬慎不敢妄进的一面。","Y2.N":"黄，东西南北中五种色中的中色。在古人的审美观念中黄是最美好的颜色。六二以阴居阴得正，且居离下体之中，是离卦的主爻。《彖传》说“柔丽乎”中正。“是以畜牝牛吉”，指的就是它。它在离卦六爻中自德言是至美至善的，德、时、位俱佳，没有一点问题，所以爻辞许以“元吉”，用最好的颜色中之色比喻它，说它是“黄离”。“黄离元吉”与坤卦六五“黄裳元吉”类似。","Y2.XN":"黄是中色，爻辞用黄字概括六二的特点，主要是抓住了六二居中这一点。六二居中又得正，但中最重要。言中，正也就包含在内了。","Y3.N":"离卦初为日出，二为日当中午，三为日昃。日昃，日已偏斜，是天将向晚的时候。就人生说，日昃好像进入老年阶段，最好的年华已经过去，生命将至垂暮。九三正是这样，它处下体之终，光明几近终点。就是说，它的处境很不好。更不好的是它以刚居刚，过而不中，就是说，它没有中德，不能正确地对待老和死的问题。它的心志慌乱了，以至于哀乐失常，“不鼓缶而歌，则大耋之嗟”。缶，瓦器。古人击缶而歌以乐。耋，垂老之人。嗟，哀叹。人到老年，正确的态度是既不以迟暮为忧，亦不以达生为乐。而六三却不然，它不是击缶而歌，不当乐而乐，便是兴垂老之叹，不当哀而哀。是以凶。","Y3.XN":"日倾了，人老了，这是自然规律使然。日倾了就要下落，人老了就要死去，怎么会长久！明者知于此，乃不乐生，不忧死，不歌不嗟，听其自然而己。","Y4.N":"九四阳居离卦上体之初，不中不正，过明过刚，其刚盛之势有如火之骤起，突如其来。其燥暴之气焰有如火在燃烧，所以有死如、弃如之象。\n祸已至于死弃的地步，凶自不待言。","Y4.XN":"九四“突如其来如”，刚烈昏暴，造成焚、死、弃的结果，为天下人所不容。从根本上说，不是天下人不容它，是它自煎自焚，咎由自取。","Y5.N":"坎离两卦皆贵中。离卦六二与六五都居中，所以都得吉。但是六二辞安得元吉，六五辞危得吉。关键在得位不得位。六二以阴居阴处中又当位得正，六五以阴居阳处中但不当位不得正。六五由于不当位不得正，所以有危象。然而六五毕竟以柔居中，足以和济离卦之阳燥，所以能够居危而知危，忧盛而危明。其畏惧之深，至于出涕，其忧虑之深，至于戚嗟。所以得吉。","Y5.XN":"六五之所以得吉，还与它丽得王公之正位有关。它居于王公在上之位，又能明察事理，知忧知惧，所以得吉。","Y6.N":"上九以阳居上，承四五之后，在离卦之终，刚明已达到极点。唯其刚明至极，所以能够担当察邪恶行威刑的使命。王将派它征伐不义。它对它所征伐的对象一定会恰当处理，“有嘉折首，获匪其丑”。首，头头，首恶人物。丑，胁从，一般群众。只惩治首恶分子，对胁从的一般群众则不问罪，不伤害。这样做，必无咎。","Y6.XN":"王者之师出征，是为了正邦，正邦对于王者来说，也就是正己。所以，王者之师一般是征而不战，迫不得已才战；虽战，不过折其首恶而已，绝不伤残民众。","Z":"离卦所讲的是附丽亦即社会中人与人之间的一种关系以及如何对待这种关系的问题。它借卦象爻象表达出来的关于附丽问题的思想极为丰富、深刻。离卦与坎卦共同的特点是贵中，不同的是，坎是阴险之卦，亟须刚来济之，而且坎为水，水性就下，以刚中则不陷，故坎之《彖传》说“维心亨，乃以刚中也”。是坎卦既贵中又贵刚。离卦是阳燥之卦，亟须以柔来和之，且离为火，火性炎上，中顺则不突。故离之《彖传》说“柔丽乎中正”，“是以畜牝牛吉也”。离卦贵中又贵柔贵正。不过离卦的贵柔是以柔济刚，刚柔相济，与老聃贵柔，以柔胜刚的主张，不可同日而语。\n离卦更强调中。六二与六五两爻因为各居上下体之中，所以均得吉。离卦尤以柔、中、正三者兼具为最佳，是故六五以柔居中而不当位，只得吉，而六二以柔居中又当位得正，得元吉。六二是成卦之主，在离之时，一切美好的品德，都从它身上集中地表达出来。它“柔丽乎中正”，获得“黄离”的至美至善的称誉。卦辞“利贞亨，畜牝牛吉”的思想，可以说就蕴藏在六二这里。九四在离卦里则是最不好的一爻，它从反面强调了柔、中、正三者在处离之时的重要意义。九四刚躁而不中不正，其性似火之骤烈，不容天下人，亦不为天下人所容，落得个“焚如，死如，弃如”的后果，是必然的。《周易》经传作者于离九四所阐述的思想，具有极深刻的哲学意义，值得特殊注意。余如初九之警始观念，九三不乐生不忧死的意识，以及上九“有嘉折首，获匪其丑”的古老的军事思想，都是构成离卦多方面、多层次的丰富的思想网络中的重要部分，亦不应忽视。"},"31":{"P":"《序卦传》说：“有天地然后有万物，有万物然后有男女，有男女然后有夫妇，有夫妇然后有父子，有父子然后有君臣，有君臣然后有上下，有上下然后礼义有所错。”依据《序卦传》的看法，上经30卦至离卦结束，从咸卦开始共34卦为下经。下经第一卦咸卦不是接着离卦而来的，它是一个新的开始。这样一来，《周易》全部64卦似乎有两个开始，第一个开始是乾坤二卦；乾坤二卦被看作易之缊、易之门。全部64卦都是由乾坤二卦产生的。咸、恒二卦是又一个开始，这个开始比起第一个开始来，是低层次的，它应该包括在由第一个开始展开的全部过程之中。《序卦传》用“有天地然后有万物”比喻第一个开始。天地比喻乾坤，万物比喻64卦。用“有万物然后有男女，有男女然后有夫妇”“然后礼义有所错”比喻第二个开始。用男女、夫妇比喻咸卦与恒卦，用男女、夫妇之后产生的父子、君臣、上下、礼义等比喻咸、恒之后诸卦。孔子这样比喻的本始目的无疑是要说明乾坤居全《易》之首，咸恒居下经之首，是有根据的，天经地义的。但是他却无意中明确地表述了他的朴素而实质上正确的宇宙观和社会历史观。\n咸音义同感。古代的感当写作咸，心字是后世加上去的。咸卦的咸字取交相感应的意义。交相感应的问题，最直观、最常见、最容易被人理解和接受的表现是男女、夫妇之间的关系，而且夫妇关系是人伦之始，是文明社会一切现象之所以产生的最初契机，所以把咸卦咸字的感应意义用夫妇关系加以说明是再合适不过了。\n从卦体看，咸卦兑上艮下。兑为少女，艮为少男。男女相感深，少男少女相感尤深。从卦德看，艮是止，艮笃实，止诚慤；兑是说。男子以诚实的态度与女子交往，女子说而应之，男女交亲，于是结成夫妇。\n64卦以乾坤为首，乾坤象天地，乾象天，坤象地，天地被看作二物。\n下经以咸恒为首，咸恒象夫妇。但是，咸象一夫妇，恒也象一夫妇，夫妇被看作一事。不是咸象夫，恒象妇，咸恒在这一点上与乾坤情况不同。","G.N":"咸是感，不只是男女相感，世间万物，社会人群，都有相感与不相感的问题。例如君臣相感，上下相感，父子相感，亲友相感，等等，只要是相感了，那么，相感双方的关系必然和顺而亨通，什么问题都好解决。然而相感有个条件，必须“利贞”，即利在于正。相感而不以正，便不能亨了。“取女吉”，是说取女如是方能得吉。","T.N":"“咸，感也”。这句话解说的十分明白，孔子的意思是说，咸就是感。在《周易》成书的时代只有咸字尚无感字，至孔子时则已从咸字中分化出了感字。\n“柔上而刚下”。“柔上”指上六，柔爻在上体。“刚下”指九三，刚爻在下体。柔上刚下有阴阳交感的意义。咸卦之所以名咸，就是因为它有“柔上而刚下”的特点。咸卦上体是兑，两刚爻一柔爻，为什么不顾两个刚爻而单说一个柔爻？下体是艮，两柔爻一刚爻，为什么不顾两个柔爻而单说一个刚爻？这是因为这一卦有卦变之义，而就表现在上体那一个柔爻和下体那个刚爻上。上体三兑本来是三乾，由于坤卦施给它一个柔爻，化掉了它的居上位的那个刚爻，于是而成三兑。下体艮本来是坤，由于乾卦施给它一个刚爻，化掉了它的居上位的那个柔爻，于是而成艮。就是说，此卦之所以为泽山咸，关键在于上体那个柔爻和下体的那个刚爻。《易》中有卦变意义的卦共18个，上下体都由一个阴卦和一个阳卦组成。《彖传》认为实际上从卦变取义的只有六卦。咸是其中之一。关于卦变的问题请参阅本书贲《彖传》解。\n“二气感应以相与”，咸卦艮下兑上，艮为山，兑为泽，山泽通气。又咸卦内外六爻无不相应。山泽通气，内外相应，总起来说叫做二气相应。阴阳二气上下相交相感相应而和合，所以叫“相与”。\n“止而说，男下女”。止是艮止，说是兑说。“止而说”是指咸的上下二体有笃诚相感之义。“男下女”，指艮少男在下，兑少女在上。总之是从上下二体的角度进一步讲二气相感应的问题。\n“是以亨利贞，取女吉也”。是说由于“柔上而刚下，二气感应以相与”，又由于“止而说，男下女”，所以“亨利贞，取女吉”。\n“天地感而万物化生，圣人感人心而天下和平。观其所感，而天地万物之情可见矣”。《彖传》的这一段话和坎卦的情况一样，是孔子在解释卦辞之后附带谈了自己的体会。孔子把感的意义推广到自然界和人类社会上来讲，而着眼点，则是在人类社会。《周易》是政治性很强的书，它讲天之道，讲民之故，最后总是落到民之故上。这里讲的圣人显然不是一般的人，是指统治阶级的王侯而言。因为圣人感天下人之心，所以天下人之心才和平安宁，老老实实接受统治。这是孔子当时的政治观点，这个观点是由当时的历史条件决定的。古代统治阶级能否感被统治阶级的心，这个问题要分析地看。至少孔子认为统治阶级应该如此，能够如此。天地万物之情是什么本来是不知道，孔子认为通过观其所感，就知道了。\n复卦《彖传》讲“天地之心”，此卦以及恒卦、萃卦《彖传》讲“天地万物之情”。心唯言天地，而情则言天地万物。心只见于复一卦，情则所见之卦多。看来，所谓“天地之心”，讲的是阴阳消长，生生不已的自然规律。所谓“天地万物之情”，讲的是阴阳消长这个自然规律的几种外部表现。","X.N":"泽在山上，山泽二物有相感相通之象。君子观山泽通气之象受到启示，于是“以虚受人”。“以虚受人”是虚其心以受人之感。所谓虚其心，是宽容大度，中无私主，不先存成见在胸，因而人愿意来感我。","Y1.N":"拇，足之大指。“咸其拇”，是说初六在下卦之下，有其感未深之象。拇属于足，足不动，拇虽动也未足以进。","Y1.XN":"初六与九四正应，初六咸其拇，感于九四，九四在外卦，所以叫“志在外”。","Y2.N":"腓，小腿肚。人欲举步前进，足未动，腓先动。腓动，足才动。六二以阴居下体，上与九五正应，其处境与人体之腓相似，有躁动妄行，急于求应之象。如果它真的那样行动，必凶。不过六二毕竟柔顺中正，若能安居不动，以待九五来求，则吉。","Y2.XN":"六二就其才说，居中得正又应于九五，本来很好。只是它处于咸的时候，容易先动以求九五。先动以求应则凶。若居则吉。居，不是绝对不动，只是不先动，不妄动。不先动不妄动也就是顺，就是顺理而动。顺理而动吉，不顺理而动凶。","Y3.N":"股，在身之下，在足之上，不能自由，乃随下而动。足动它也动，足止它也止。九三处下体之上，处境与股相类。九三以阳刚之才处在止体之极，本来宜静不宜动，但是九三“执其随”，看初、二两爻躁动，它也要随之而动。执，固执不变，一定要跟着初、二动。往必致吝。","Y3.XN":"不处，动。初、二两阴爻皆有感而躁动。九三自身虽是阳爻，看人家动，自己“亦不处”，即也随着动。阳刚之才，行为不能自主，反而志在随人，这种作法是很卑下的。","Y4.N":"《周易》爻辞言“贞吉悔亡”者计四卦，皆占在先而象在后。巽卦在九五，大壮、未济和本卦都在九四。九以阳刚居四，本来是不正的，不正则当有悔。“贞吉悔亡”，是说如果能正的话，则得吉而无悔。正与不正，悔与无悔，全就感上说。感而不以正则有悔，感而以正，则吉而无悔。四是人的心，四又处在上下之间，有往来之象。“憧憧往来”，“往来”应如孔子说是自然界“日往月来，寒往暑来”的往来，是自然界里此感彼应，彼感此应的现象。人对外界的人与物的往来感应亦如此，即顺应自然之理去感去应，不掺杂自己的私心。“往来”之前加上“憧憧”二字，就变成有私心的不好的往来，不是顺应自然规律的往来了。憧憧，为一己之私心私利而忙迫不安地去感应，去往来。今天给甲一点好处，以求感恩，明天又给乙一点恩惠，以求回报，把往来放在心上，切切不肯放下。“朋从尔思”，以私心去感，只感了少数人。这少数人成了你的朋友。这种朋友，其实就是朋党。\n《系辞传》对咸九四这条爻辞曾作了说明，它说：“《易》曰：‘憧憧往来，朋从尔思。’子曰：天下何思何虑，天下同归而殊途，一致而百虑。天下何思何虑，日往则月来，月往则日来。日月相推而明生焉。寒往则暑来，暑往则寒来。寒暑相推而岁成焉。往者屈也，来者伸也。屈伸相感而利生焉。尺蠖之曲，以求伸也。龙蛇之蛰，以存身也。精义入神，以致用也。利用安身，以崇德也。过此以往，未之或知也。穷神知化，德之盛也”。孔子这段话是从正面批评了“憧憧往来，朋从尔思”的人。认为自然界的感应是无私的，有规律的。人的感应也应同自然界的感应一样，顺应规律，无有私虑，当感自然感，当应自然应。","Y4.XN":"“贞吉悔亡，未感害也”，是说感而出自私心则有害，感而未有私心则未为害。无系私心于感，也就是守正，正则吉，则无悔。“憧憧往来，朋从尔思”是以私心相感。以私心相感其所感的面必窄，只有少数私朋而已，故云“未光大”。光，广。“未光大”，影响未能扩大，未能普及于天下人。","Y5.N":"脢，后背上的里脊肉，正当心的背面，与心相背而不见。九五居尊位，应当以至诚感天下人之心，但是它下应于六二，又比于上，如果系二而悦上，那就把所感的面缩得太小了，不是天子诸侯应当做的。“咸其脢”，九五应当像背上里脊肉那样，与其私心相背，感它见不到的更多的人。这才是人君感天下之正道。这样做了，可得无悔。","Y5.XN":"末，指上六言。爻辞讲“咸其脢”，告诫九五要背其私心，以至诚感天下人之心，所以这样告诫，是因为九五确实有问题。它“志末”，与上六近比，便总想感于上六而已。","Y6.N":"辅，牙车，在口中。颊，腮。舌动则牙车也动，腮也随着动。三者配合着动，人就说出话来。本来用一个口字即可，却用了辅颊舌三个字，有厌恶的意思在内，犹如今日谓善巧辩的人讲话为摇唇鼓舌一样。上六阴柔居兑之上，为兑之主，而且处在咸之极，故不能以诚感人。光是用口舌感人，言而无其实，其结果是感而无应，其为凶咎不言而知。","Y6.XN":"滕、腾通用。腾口说，发挥、腾扬口舌言说的作用。咸道已到了末端，别的办法没有了，只剩下口舌言语了。","Z":"孔子《序卦传》在这一卦讲的话较多，全面表述了他的宇宙观和社会历史观。他说：“有天地然后有万物。”“天地”就是自然界，自然界是怎样产生的，自然界之前还有什么，孔子没有讲。就是说，孔子不认为自然界是由无变为有的，不认为自然界是被创造出来的。把这里的话同《系辞传》“易有大极，是生两仪”的说法联系起来看，孔子的宇宙观无疑是唯物论的。\n孔子讲“有万物然后有男女，有男女然后有夫妇”，道出了人类早期历史中的一个基本事实，即人类曾经有个群婚阶段。一夫一妻制是在群婚制衰落之后产生的。孔子还发现了一夫一妻的个体婚制在原始社会向文明社会转变中具有关键性意义。他说：“有夫妇然后有父子，有父子然后有君臣，有君臣然后有上下，有上下然后礼义有所错。”把国家的产生一直追溯到“有夫妇”，显然已经看到了个体婚制的确立最终导致文明时代的来临。甚至揭开了礼的秘密：礼与阶级社会同步产生，礼在它的华丽外衣里面包含着严酷的等级制度。孔子在《中庸》里讲“仁者人也，亲亲为大。义者宜也，尊贤为大。亲亲之杀，尊贤之等，礼所生也”，更进一步认定礼从阶级关系和血缘关系两个方面反映等级制度。孔子当然不知什么是历史唯物主义，但是他的关于古代历史的认识所达到的理论高度在他那个时代是无与伦比的，即便用今日马克思主义的眼光看，孔子的理论仍有相当大的意义。\n《周易》中卦辞与爻辞讲的内容往往不一致，咸卦尤其明显。卦辞讲“取女吉”，以男女婚姻取象，从天地万物与人类社会宏观的角度讲感应的问题。六爻爻辞则根本不讲“取女吉”，更不讲男女婚姻之事。各爻都从人体取象，从微观的角度讲感应问题。初爻咸其拇，二咸其腓，三咸其股，五咸其脢，上咸其辅颊舌，感的都是人身的一个部位。用一个部位去感外界事物。四比较特殊，四居上下体之间，在咸卦里它是代表心的。它不讲咸其心。“心之官则思”，古人认为心是主思虑的，所以代表心的九四，主要讲人在处理与外界感应的过程中如何端正思想的问题。\n咸卦以人身取象，情况与艮卦极相似。所不同者，咸卦讲感，艮卦讲止。感者动，止者静。咸卦诸爻不如艮卦吉多凶少。尤其上爻二卦大不同。咸卦上六咸其辅颊舌，不好。艮卦上九敦艮吉，很好。\n卦辞与爻辞所说的往往不同，甚乃多少有一点矛盾，这是个值得注意的问题。它告诉我们，卦辞和爻辞很可能不出于一人之手。"},"32":{"P":"《序卦传》说：“夫妇之道不可以不久也，故受之以恒。恒者，久也。”咸卦讲的是夫妇之道，夫妇之道贵在长久，终身不变，所以咸卦之后次以恒卦。恒的含义是久常。恒卦何以有久常的含义？咸卦艮下兑上，少男在少女之下，以男处女之下，有男女交感的意义。恒卦则不然。恒卦巽下震上，长女在长男之下，男居尊，女处卑。又，恒卦震在外，巽在内，是男动于外，女顺于内。依照古人的观念，这是一夫一妻制家庭关系的常理，恒没有交感的意义而有久常的意义。","G.N":"恒是常久。常久之道，可以亨通，亨通则无咎。常久之道而不可以亨通，则必有咎。恒有二义，一是无咎的恒，一是有咎的恒。无咎的恒亦即不易之恒。这种恒因为是正的，所以无咎。有咎的恒亦即不已之恒。这种恒因为不正，所以有咎。前一种恒，“利贞”，宜守正而不移易；后一种恒，“利有攸往”，宜有所行动，有所改变。这两种意义的恒合起来看，才是全面的，正确的。任何只强调其中的一种意义而忽视另一种意义的理解，都是不对的。","T.N":"“恒，久也。刚上而柔下，雷风相与，巽而动，刚柔皆应，恒”。这是解释卦名的。恒是什么？恒就是久。“刚上而柔下”，“刚上”指九四，“柔下”指初六。刚在上体，柔在下体，刚上柔下，这从名分上说，是正常的，正常就有恒久的意义。“刚上而柔下”是卦变的问题。上体震本为坤，乾以一刚爻施给坤，化掉坤的一柔爻，成为震。下体巽本为乾，坤以一柔爻施给乾，化掉乾的一刚爻，成为巽。“雷风相与”，这是从卦象说明问题。有雷则有风，雷风相须，交助成势，这是一种常道。“巽而动”，下体巽，巽是顺；上体震，震是动。顺而动，事物合乎规律地运动，是常久之道。“刚柔皆应”，恒卦六爻刚柔皆应，刚柔皆应，是正常的道理。由于这四方面都有常久的意义，所以卦名曰恒。\n“恒亨无咎，利贞，久于其道也。天地之道，恒久而不已也。利有攸往，终则有始也”。亨而无咎的恒，必是正的。正的恒，才是久于其道的恒，天地之道就是恒久而不已也。“利有攸往，终则有始也”，是说恒不是一定不动不变的。天地间没有一定不动不变的恒，不动不变便不能恒了。事物穷则变，变则通，通则久，故随时变易，方是恒久之道，所以卦辞言“利有攸往”。“利有攸往”就是“终则有始”；“终则有始”就是变化。总之，恒中包含着“不恒”，“不恒”中有恒。\n“日月得天而能久照，四时变化而能久成。圣人久于其道而天下化成”。这里从自然界讲到人类社会，亦即所谓“明于天之道而察于民之故”。讲“天之道”，是讲自然规律，讲“民之故”是讲社会历史，而归根结底重在“民之故”，重在社会历史。日月与四时都因变化而能久能成。社会也是如此，“圣人”能够“久于其道”，即恒而能变，变中有恒，坚持正确的恒久之道，有秩序的社会生活才能化育而成。\n“观其所恒，而天地万物之情可见矣”。观“日月”、“四时”、“圣人”所行的恒久之道，“天地万物之情”便可以看得出来了。关于“天地万物之情”的理解问题，已详前卦。","X.N":"雷与风作为自然现象，表面看来，雷迅风骤，变化无常，然而看其实质，则有不变者存。一年之中，雷总是要起，风总是要发。雷起风发，雷迅风骤，雷风总是相须相与。君子学习恒卦，知道雷风虽变，必有不变的道理，自己做事便要立不易方。世间的事物虽然酬酢万变，妙用无方，而君子做人做事则要有所树立，有卓然不可移易之方。","Y1.N":"浚，深。贞，固。无攸利，利有攸往之反义。恒，久也。恒之道贵久。\n天下事都有个日就月将积渐的过程。处在恒的时候，尤其应该注意及此。初六居恒之始，更当作常久打算。但是初六以柔居刚，体巽而性躁，于事求望太深太遽，想要一锹掘个井，故曰浚恒。固守这一条道走到底，必凶，必无所利。","Y1.XN":"浚恒之所以凶，要害在于始求深。恒贵久，久自渐中得。初六为恒卦之始，本应以渐为常，而它却遽求深入。欲速则不达，结果必凶。","Y2.N":"《周易》爻辞中有大壮九二言贞吉、解初六言无咎及本爻言悔亡，三条都只言结果如何而不论及其所以然，大概是因为爻象可以自明的缘故。悔亡，是本应有悔，由于某种原因，悔由有可以变为无。在恒卦，居得正位才是正常的。九二以阳居阴位，不得正，是不正常的，不正常应该有悔。但是《周易》最重视中，恒卦尤其贵中。九二以刚居中又与六五正应，是处得中，动也得中。能恒久于中，正也就包含在内了。九二中德之胜，足以亡其悔。","Y2.XN":"九二以阳处中，能恒久于中，所以悔亡。六五虽也处中，但是以阴居中，所以有“夫子凶”之戒。","Y3.N":"九三位虽得正然，过刚不中，志从于上，不能久于其所，故有不恒其德之象。不恒其德，是变化无常的人。善的人可与共事，恶的人可不睬他，唯善恶无常的人不好办。当他表现善的时候，你方与之共事，可是不久他又变了，变坏了，你不得不承其羞。同不恒其德的人打交道，最好的办法是与之分手，若把同他的关系贞固下去，必吝。","Y3.XN":"有德而不恒的人，不但为人所不容，自己亦当有无所逃于天地之间的感觉。","Y4.N":"田，田猎。禽，统称飞禽走兽。“田无禽”喻如长期田猎，但没有捕到禽兽，劳而无功的意思。九四以阳居阴位，既不得正又不居中。不中不正，纵然恒久，也不会有成就的。","Y4.XN":"九四不中不正，处非其位，比如田猎，纵然能守恒持久，亦将无所获。","Y5.N":"九二以阳居阴，六五以阴居阳，都位不当却又都得中。九二刚中，故悔亡。六五柔中，“恒其德贞”，是以柔顺为德，以柔顺之德为常。恒其柔顺之德，在妇人则为正，故吉。在丈夫则不为正，故凶。","Y5.XN":"六五恒其德贞，是妇人之贞，吉也是妇人之吉。为什么在妇人则贞则吉呢？这是因为妇人从一而终，从一个丈夫一直到死。六五恒其柔顺之德，以顺从为恒，恰似妇人从一而终。所以六五有妇人贞吉之义。恒卦的含义主要是常，常中也包含着变。九三偏于变，是不恒其德，六五偏于常，是恒其德。但是六五柔中，柔顺以为德，是妇人之德，不是夫子之德。夫子有制义之权，只宜妇人从他，若他从妇人，必凶。","Y6.N":"振，快速的动，抖擞的动。上六以阴居阴在上位，宜静不宜动。而今六处恒之极，又在震之终。恒极就要转变为不能恒，震终则动而不能止。不仅不能安静，其动甚至不能节制。以此为恒，就是振恒，振恒而致凶，实属事之必然。","Y6.XN":"处在恒的时期，以安静为宜。处在恒之上位，尤应以安静为宜。乃躁动无常，无事自扰，岂止无功，必大无功。","Z":"《周易》贵中，恒卦尤其贵中。中就能恒，不中就不能恒。恒卦六爻没有上下相应的意义，其爻主要从居上体还是居下体，得中还是不得中表现出来。初六在下体之下，九四在上体之下，都未及于恒，泥于恒而不知变，所以初六浚恒，九四田无禽。九三在下体之上，上六在上体之上，都已过于恒，所以好变而不守恒，所以九三不恒，上六振恒。只有九二与六五比较好，因为它们居上下体之中，最能把握恒的意义。六五以阴柔居阳位，以柔中为恒，所以只能是妇人吉，而夫子则凶。九二以阳刚居阴位，以刚中为恒，最得恒卦之义，但由于它位不得正，亦不能做到尽善尽美，只得悔亡而已。悔亡在恒卦里已是最好的爻辞，可见恒卦无完爻。咸卦六爻也是不凶则吝，最好的也不过悔亡而已。但是咸、恒二卦的卦辞在64卦中则是最吉的。卦辞与爻辞不一致的问题，古人已经注意到了。苏轼《易传》以为艮兑合而后为咸，巽震合而后为恒。二体合起来看，所以卦辞吉。六爻分开来看，见此而不见彼，咸、恒之义被肢解了，所以咸恒无完爻，最好的不过悔亡而已。这个问题尚可进一步研究。"},"33":{"P":"《序卦传》说：“恒者久也，物不可以久居其所，故受之以遯。”遯者退也。恒是久的意思。什么事情久了，总要走向反面，久必变为退，所以恒卦之后继之以遯。遯的含义是退，是避而去之。卦由乾艮二体组成。乾为天，艮为山。天在上，是阳物，有上进的性质。山是高起之物，又是止之体，有上陵而止不进之象。一个要上进，一个上陵而止不进，乾艮相违遯，故卦名遯。又卦中二阴自下而生，是阴将长而阳渐消的时候，小人渐盛，君子当退而避之，也是卦名遯的根据，遯卦在十二辟卦中为六月之卦。","G.N":"遯是阴长阳消的时候，小人渐得势，君子此时应当退避。身退道不能退。道不仅不能退，道还要进一步伸张。故云遯享。小人道长，君子知几而退藏其用，不露圭角，也是遯。“小利贞”，小是大小的小。遯之时，阴柔虽长却尚未达到甚盛的程度，君子此时不可大利贞，但可小利贞，可迟迟致力，逊避善处，务在勤小事细行，举动不失正道，使小人无隙可乘。","T.N":"“遯亨，遯而亨也”。卦辞言“遯亨”，《彖传》加个“而”字，变成“遯而亨”，说明“遯亨”是遯而后亨。君子遯藏起来了，还怎么能谈到亨呢？不是君子亨，也不是君子藏亨，而是君子遯藏之后，君子之道亨。\n“刚当位而应，与时行也”。这句话还是解释卦辞“遯亨”的。“遯而亨”是说能遯而至于亨。这一句是进一步说明怎样遯而亨。九五以阳刚居阳位，居中得正，又下与六二以中正相应。以这样好的卦才，即便在遯藏的时候，君子还是可以有所作为的。可以随时消息，尽量做自己所能做的事。“与时行”不能理解为只是遯，遯了以后什么也不干。\n“小利贞，浸而长也”。临卦二阳在下，《彖传》说：“刚浸而长。”遯卦二阴在下，《彖传》说：“浸而长。”不说“柔浸而长”，实际上是柔浸而长，二阴慢慢地长。君子在遯的时候，不宜大有作为，只可小利贞，原因在于群阴浸长，小人渐盛。\n“遯之时义大矣哉”。这最后一句，是孔子加上的赞叹之语，意在告诫人们不要因为是“小利贞”，是细行小事，而不屑思，不屑为。“小利贞”往往会成为利贞的基础。将来的利贞，正是在此“小利贞”中包含着，准备着，所以说遯之时义大矣哉！","X.N":"天下有山，山在下高起而又止，天在上，上进而相违，正是遯避之象。君子观遯之象，受到启发，知道了应该如何远小人的问题。在遯的时候，远小人的最好办法是“不恶而严”。恶读憎恶的恶。对待小人，不可使他知道你憎恶他，否则他必加害于你，你想远小人也远不了。但是与小人的界限要严格划清，在原则问题上绝不对小人让步，让小人知道你是不可侵犯的。“不恶而严”，亦即外顺内正，待彼以礼，自守以坚之意。","Y1.N":"自整个一卦看，初与二两个阴爻是代表小人的。就卦中六爻看，则六爻都代表君子，代表君子在遯的六种不同情况下的处境。在别的卦都以初为下为始。遯是讲往遯的，跑在前面的为先进，初在后面，当然就是尾了。在逃遯的时候，落在后面，做了尾巴，处境极危险。怎么办？与其继续向前跑，遇上灾难，不如停下来不动更有把握免灾。所以要“勿用有攸往”。初六以阴柔居下，位卑名微，不往也就等于遯了；若往的话，危厉就将更加严重。","Y1.XN":"发现问题的征兆而先行遯去，固然好。遯已落在后边，还要跟着往前跑，就危险了。往有危厉，不往而晦藏，还有什么灾呢！","Y2.N":"说读如脱，义同。黄，中色。牛温顺之物。革，坚韧之物。六爻中五爻皆言遯，唯六二不言遯。六二以阴居阴，得位处中，以中正顺应于九五。九五以阳居阳，得位处中，也以中正亲合于六二，六二与九五之间的合和亲密的关系，其牢固的程度有如它们之间用黄牛之皮执系着，谁也休想把它们拉开。","Y2.XN":"执用黄牛，是“执之用黄牛之革”的省语。固志，六二与九五以中顺之道相固结，其心志甚坚定，没有什么力量能够把它们之间拘系着的黄牛之革脱掉。","Y3.N":"在遯的时候，君子最好远去速去。但是九三系遯，有所牵系，不能远去速去，因而处境不好，就像得了疾病而有危险一样。九三系遯，系谁呢？它与上九非正应而与六二切比，是被六二牵系住而不得远遯速遯。九三与六二的关系是暱比不是正应，是君子与小人的关系，不是君子与君子的关系。九三对待小人怎么办好呢？可行的办法是：畜臣妾。臣妾是小人与女子。依古人的观念，惟女子与小人为难养，近之则不逊，远之则怨。九三在欲遯不能遯的情况下，应以畜臣妾的办法对待小人，不远亦不近，不恶而严。这样方可得吉。","Y3.XN":"在遯的时候，因有系累不能遯，其危厉是由困惫造成的，其困惫是由疾病造成的。九三处此困境唯一可行的办法是以刚自守，对小人畜之以臣妾之道。因为此时是不可以也不可能做大事的。","Y4.N":"好字当读上声，不读去声。九四与初六正应，与初六的关系很好，很亲密，但九四是刚健之君子，在遯的时候，虽有所好爱，亦能不为所系恋，毫不犹疑地毅然遯去。遯的时候，也能够从容无怨，心情舒展，不作忿戾之行。如此则必得吉。小人否，否是不的意思，不是泰否的否。君子能好遯，小人则不能好遯，纵然迫不得已而遯，也是悻悻然忿戾而行，不会是好遯。因此，小人不能得吉。","Y4.XN":"君子好遯，小人则做不到好遯。君子当遯便毅然遯去，不为所好爱者牵系。遯也从容无怨，绝不悻悻然形于色。小人则办不到。","Y5.N":"嘉，嘉美。嘉遯，嘉美的遯，比好遯更好的遯。九五阳刚居中得正，虽与六二有所系应，但六二也居中得正，在遯的时候，不会妨碍九五。九五以中正自处，时止时行，从认识到行动，它都能够对遯的问题做出最恰当最得体的处理。所以获贞吉。","Y5.XN":"思想正，行动才能正。九五之所以嘉遯贞吉，是因为它居中得正而与六二之中正相应，亦即因为它志正。人之行止，遯与不遯，处理得好不好，关键在于能否正其志。","Y6.N":"肥，充大宽阔，绰绰然有余裕，疾惫的反义。上九以阳刚之才居外卦之极，在遯的时候，处这个位置好，它可以飘然远逝，无所疑滞。上九还有另一个优越之处，就是它无应于内，无牵无累，无所疑虑。居外处远和内无系应这两点，使上九在遯这个穷困的时候能够无挂无碍，无所疑虑，刚决而退，心志宽阔无比，绰绰然有余裕。如此之遯，无有不利。","Y6.XN":"上九能够肥遯无不利，最重要的原因是它无所疑。在四个阳爻中，上九情况最好。九三切比于六二，九四应于初六，九五应于六二，都有所系；有所系则不能不自疑，至上九则毫无挂碍，一切疑虑全部消失。","Z":"遯卦六爻四阳二阴，四阳渐退，二阴渐长，是小人浸盛，君子遯藏的时代。君子处在这种时代，遯而亨，虽不可为大事，但可小利贞。至于六爻，下三爻与上三爻的情况明显不同。下三爻属于艮，艮是止，所以初六不往，六二执革，九三系遯。上三爻属于乾，乾主于行，所以九四好遯，九五嘉遯，上九肥遯。上三爻越是无系应越好，越是远于二阴越好。九四好遯，但不如九五嘉遯。九四与九五虽好遯，嘉遯，但它们都有所系应，都有所疑于遯，也都与二阴不算最远，所以都不如上九肥遯。上九在卦外之极又无系无应，心无疑虑，超然而遯；虽当困穷之时，却能果断遯退，可谓心地宽阔，绰绰有余裕，是最善处遯的人。\n遯卦表达的主要是政治思想。它明确地使用了君子和小人两个政治性概念。君子和小人不反映政治地位尊卑高下的差别，它们反映的是政治家们个人道德观念道德行为和政治主张上的对立。在小人逐渐取得优势的政治环境中，君子应当采取灵活的对策，遯藏的对策，即在坚持原则的前提下，或者对小人不恶而严，或者暂时遯去，以待时变。遯卦讲的遯，只是政治斗争中的一种灵活的策略思想，与道家追求出世，忘却尘俗的人生哲学根本不同。"},"34":{"P":"《序卦传》说：“遯者退也。物不可以终遯，故受之以大壮。”遯是阴长阳遯，遯的意义是违去。大壮是阳的壮，壮的意义是强盛。事物衰则必盛，消则必长，既遯则必壮，所以遯之后次之以大壮。大壮卦下体是乾，上体是震，以刚而动，有大壮的意义。《周易》里阳刚为大，阴柔为小。此卦阳刚已达到四，过中了，有大者壮的意义。又卦有雷威震在天上之象，也是大壮的意义。","G.N":"大壮即是阳之壮，吉亨自不待言。但是大壮利于贞正，大壮而不贞正，君子做事而不循正理，便是一般的壮，不是合于君子之道的大壮了。大壮之时最怕的是自恃其壮，自恃其壮就不正了。卦中以阳爻居阴位为吉而以阳爻居阳位为凶为厉，正反映出卦辞“大壮利贞”的用意是大壮不可自恃其壮而过于壮。\n64卦卦名有“大”字者凡四。除大有是五个阳爻外，其余大畜、大过、大壮三卦都是四个阳爻。四个阳爻而称大壮，这是因为卦中阴阳之势至三而平分，至四就算极盛了。大壮之阳爻已自初长至四，九四一爻是成卦之主，为卦又是乾阳在内，震动于外，所以叫做大壮。大壮在十二辟卦中是二月之卦。","T.N":"“大壮，大者壮也。刚以动，故壮”。解释以大壮名卦的意义。《易》中刚阳为大，阴柔为小。天地之间唯刚阳能壮，大者能壮，阴柔不能壮，小者不能壮。但是并非刚阳或大者在一切情况下都能壮，必须在“刚以动”的情况下才可谓壮。“刚以动”，为卦乾下震上，是刚体而且在动，所以称大壮。\n“大壮利贞，大者正也。正大而天地之情可见矣”。此解释“利贞”的意义。大壮是大者壮，大壮利贞则是大者正。可见卦辞“大壮利贞”四字具有三个层次的含义。首先指出壮的主体是大，其次说主体之势是壮，最后强调大的静态特征是正。前两个层次的含义告诉我们，唯大者即刚阳能壮，小者即阴柔不能壮。大者只是在动的状态即刚以动的时候，方能壮。壮是从动态的角度看。最后一个层次的含义是说大者只是壮还不够，还不足说明问题，还要正。正是从静态的角度看。总起来说，“大壮利贞”一语的意义是体大，势盛而无邪僻。天地间万物万事大不必壮，大而不壮，并无凶咎。若大壮而不正，则凶必不免。暴君与强梁可谓大且壮矣，然而不正，贻人以祸患无穷。\n正大亦即大正。天地乃大中之大，可谓至大。天地乃正中之正，可谓至正。大而且壮，大而且正，是天地之显著特点，是显而易见，有目共睹的。看见天地之正大，便看见天地之情了。“天地之情”是从静态从显处看天地之特点，而《彖传》说的“天地之心”则是从动态从隐处看天地之规律。又咸、恒、萃三卦之《彖传》皆言见“天地万物之情”，本卦只言天地，不涉万物，这是因为咸之所感，恒之所恒，萃之所聚，万物皆可与天地同，唯其正与大未可与天地同日语。","X.N":"雷奋迅于天上，乃大而壮之象。大壮，包含了“大者正也”的意义。也就是说，大壮，实际上含盖了大，大者壮，大者正三层意义。大、壮、正三者合为一体，便构成天地间一种伟大的力的体现。君子观大壮之象应当怎样落实到现实人生中来呢？孔子是主张反身修己的。他要求君子把最大的力量用在战胜自己上，战胜自己的最好办法莫过于“非礼弗履”。“非礼弗履”的思想与《论语》“克己复礼为仁”是一致的。","Y1.N":"趾，在身之下而主于行的东西。壮于趾，用壮于初，急于前进，结果必将得凶。有孚，有信，在别的卦里“有孚”的含义是正面的，在此则取反面意义。“征凶有孚”，有所前进，则致凶是肯定无疑的。初九以阳刚居阳位，处在大壮之时，本应无咎，何以“征凶有孚”呢？从全卦来看，大壮是阳刚之壮，以刚壮为义。而从爻来看却恰好相反。大壮各爻以用柔为好，用刚不好。初九自身是阳刚，所在乾体，也是阳刚，所居阳位，又是阳刚。大壮本是“刚以动”的，刚不可太过，而初九以刚居刚用刚，是过于刚而壮于行，故“征凶有孚”。","Y1.XN":"初九在下而居刚用刚，过乎刚而壮于行，其穷困而致凶，是必信无疑的。","Y2.N":"九二与初九同为阳刚，同处大壮之时，初九征凶而九二贞吉，两爻有根本上的差别，其原因在于九二刚柔得中，不过于壮。二，柔位；九，刚质。以刚之质居柔之位，刚柔相须，不过于壮。更重要的是九二居中。九二壮而处中，其动必正，犹如一人虽气质刚决猛厉，但因为能处中，遇事深浅有度，善于自裁其过而济其不及，没有不得正的。得正则吉。","Y2.XN":"九二之所以贞吉，最根本的一点是它处中。九二的贞，九二的吉，全从中上来。","Y3.N":"九三以刚居阳而处壮，又在下体乾之终，过刚不中，是强有力的人。如果是小人当此，他将恃刚用壮，陵犯于人。就像刚狠强壮的羝羊一样，总要用它的角(亦即它的壮)去抵触它面临的任何藩篱，结果必以羸其角而告修。“贞厉”谓如此干下去而无反顾，则必如羝羊触藩羸角那样招致危厉。“君子用罔”，罔，勿，弗，不。如果是君子当此，便不会像小人那样恃刚用壮陵人。","Y3.XN":"小人用壮，君子不用。爻辞“君子用罔”语意与遯九四“君子好遯，小人否也”同，都是君子小人并言而义相反之辞。孔子小象去一用字，迳言“君子罔也”，使爻义更为明白了当无疑。","Y4.N":"九四与九二一样，都是以阳居阴，刚有柔来济，因而不至过于壮。但九四居四阳之终，也有容易过于壮的一面，所以爻辞说“贞吉”，守正道方可得吉。既“贞吉”了，则能从容以进，无有失误，所以爻辞又说“悔亡”。“藩决不羸，”是承前面九三爻辞“羝羊触藩，羸其角”而言。九三为前面的九四所阻，如遇藩篱，藩未破，角却羸了。九四的前面是二阴，二阴构不成九四前进的障碍，藩无须触已经决开，角羸之虞自然不会有。九四前进的道路既通，便有“壮于大舆之輹”之象。輹不同于辐，輹在轴，辐在轮。在轴之輹强壮，利于车行。“壮于大舆之輹”，谓车强无病，壮于进，利于行。","Y4.XN":"至九四说“尚往”，“尚往”，其进不已的意思。爻辞在“贞吉悔亡”四字之后又说“藩决不羸，壮于大舆之复”容易使人误以为九四居柔为不进，小象乃提示以“尚往”，告知人们九四“藩决不羸”是进，不是不进。","Y5.N":"六五用和易的办法把羊的刚很给丧失掉了。羊性刚，羊在这里象诸阳方长而并进。六五以柔居中，对于向上并进而来的诸阳，善于用和易的办法制服之，使诸阳无所用其刚，无所用其壮，这就是“丧羊于易”。六五如此则可以无悔。","Y5.XN":"六五丧羊于易无悔，是由于位不当。位不当，在《易》中指爻位不当。以刚居刚位或以柔居柔位，是位当。以刚居柔位或以柔居刚位，是位不当。位当好，位不当不好。这是《易》之常。有的时候。即在有些卦里，位不当好，位当不好。这是《易》之变。大壮卦的情况属于后一种。大壮卦六爻凡位当的如初九、九三二爻都不好，一为“征凶”，一为“贞厉”。凡位不当的如九二、九四、六五三爻都好，不是“贞吉”便是“无悔”。六五位是刚而质为柔，以柔居刚，是位不当。位不当本来不好，然而在此，不好变成了好，因为正是由于以柔居刚，刚柔调济，使六五具有柔顺和易之德，才能帖然制服强壮并进之诸阳，“丧羊于易”而无悔。","Y6.N":"上六所处是壮之终，动之极，一卦之穷，正是进无可进，退无可退的时候，很像羝羊之角挂在藩上，不能退也不能遂。处于这种困境的人，“无攸利”，什么也不能干，干什么也不行。但是“艰则吉”。所谓艰，乃知其艰而熟思深虑，不敢轻易以处之。如此则吉。","Y6.XN":"人之处事，以为易则粗心大意，以为艰则深思熟虑。上六过去因做事不详审而获咎，今知过而改，做事详审而不轻率，所以其咎不长。","Z":"《杂卦传》说：“大壮则止。”大壮是大者壮，大者壮即阳刚盛长。阳刚盛长正是阳刚当止则止的时候。阳刚正在盛长而要求止，并非易事。要把握好止的度，最为重要的是解决好正的问题。因此大壮卦辞只讲了“大壮利贞”一句话。爻辞的意向与卦辞一致。四个阳爻除初九有壮之累外，其余三爻都言贞。《彖传》对此认识得更深刻，它明确指出：“大壮利贞，大者正也。”大正莫如天地，天地之正莫如刚柔相济。表现在大壮六爻之中，以刚处柔或以柔处刚皆利，而以刚处刚或以柔处柔都不好。爻位则不正好，爻位正反而不好。阳刚盛长之时所需要的正，恰是爻位之不正。唯其爻位不正，刚方可得柔之济，刚柔相济才是大壮所需之正。这一点于爻中表现最为明显的则是九二和六五。九二贞吉，但爻不当位，小象释之以“以中也”。六五无悔，小象释之以“位不当也”。以柔居刚，爻位不当。也正因为爻位不当，才得刚柔相济之正。"},"35":{"P":"《序卦传》说“物不可以终壮，故受之以晋。晋者进也。”凡物既壮便有晋的趋势。晋必自壮来。物必壮方有向晋发展的可能。所以大壮之后次之以晋卦。晋与进同音同义，都是前进的意思。卦之所以名晋不名进，是因为晋字除进义以外，还包括明盛的意思。为卦下体是坤，上体是离，离在坤上，有明出地上之象，仿佛太阳冉冉自地平线上升起，越升越光明盛大。这一壮观景象恰好可用一个晋字表达出来。","G.N":"侯，诸侯，对天子称臣，对卿大夫又为君，具有君与臣两重身份。康侯，怀才抱势足以康民治国安天下之诸侯，用字在此无实在意义，只是个虚字。锡，义同赐。马及车是古代的重赐。蕃，息。庶，多。蕃庶，言所赐之马种类多，数量也多。晋是什么？晋就是能康民治国乃至平天下之诸侯，作为天子之臣，受到天子的恩宠，以至于天子赐之众多马匹，一日之中多次亲见他。赐之厚，宠之亲，达到了最高的程度。这是讲古代世间最大的晋，莫过于人臣有德有功受恩宠之晋。人臣受宠之晋，莫过于康侯之晋。康侯之晋将人世间的一切晋义全包括了。《易》中64卦卦辞以晋为特殊。它专以康侯为义而不及其他，然而言康侯之晋如此，其亨其利贞不言可知。","T.N":"“晋，进也”，解释卦名晋的意义。晋，就是前进的进。晋除有进义之外还有明盛之义。合二义而言之，晋是进而盛的意思。\n“明出地上，顺而丽乎大明，柔进而上行”，这段话从卦象和卦德两个方面解释卦辞。晋卦下体坤，上体离，离在坤上，有明出地上之象。“明出地上”一语主要是解释卦名的。“明出地上”，有明盛之象又有进象，所以卦名之曰晋。“顺而丽乎大明”，此以卦之德释卦辞。坤之德顺，离之德明与丽。坤附丽于离，以坤之柔顺附丽于离之大明。犹如顺德之臣上附于大明之君。“柔进而上行”，在64卦中，只有上体是离的卦，其《彖传》才有说“上行”的。在上体是离的八个卦中，也只有睽、鼎和晋三卦之《彖传》讲“柔进而上行”。“柔进而上行”指卦中六五以柔顺明丽之德居君位而言。“顺而丽乎大明”和“柔进而上行”两句都是讲卦辞康侯之德的。康侯，安国之侯，它柔顺而明，在自己的诸侯国内，作为一国之君，能康一国之民。在天子的统辖下，作为一方之侯，能顺附天子之明德，受到天子的宠信，所以它既得车马重赐，又一昼日之间三见接于天子。","X.N":"日从地面上升起来，越升越明盛，但是日的光明是未出之前就有的，日出之后的光明与日出之前一样，并无增损。君子观此卦象，应该自己将自己固有之德即明德昭示出来。其实这与《大学》“明明德”的思想是一致的。64卦大象以君子自我口气讲话的只有乾与晋两卦。乾卦大象说“自强不息”，意谓我

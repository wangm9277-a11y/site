<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>小工具 · wmv587</title>
<style>
  body{margin:0;background:#0b0b0d;color:#ececf1;font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       max-width:640px;margin:0 auto;padding:56px 22px}
  a{color:#5ee0a8;text-decoration:none}
  h1{font-size:28px;letter-spacing:-.01em}
  p{color:#8b8b96}
  .box{margin-top:18px;padding:16px 18px;background:#141418;border:1px solid #232329;border-radius:14px}
  button{background:#5ee0a8;color:#08251a;border:0;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
  input{background:#0b0b0d;border:1px solid #2c2c34;color:#ececf1;border-radius:10px;padding:9px 12px;font-size:14px;width:100%}
  .out{margin-top:12px;color:#c9c9d1;font-size:14px;word-break:break-all}
</style>
</head>
<body>
  <p><a href="/">← 返回</a></p>
  <h1>小工具</h1>
  <p>全部在浏览器里跑，不上传任何东西。</p>

  <div class="box">
    <strong>乾乾学易</strong>
    <div class="d" style="color:#8b8b96;font-size:14px;margin-top:6px">六十四卦经传精研与上下卦推演</div>
    <div style="margin-top:12px"><a href="/tools/qianqian.html" style="background:#5ee0a8;color:#08251a;border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600;display:inline-block">打开</a></div>
  </div>

  <div class="box">
    <strong>时间戳转换</strong>
    <div style="margin-top:10px;display:flex;gap:8px">
      <input id="ts" placeholder="输入 Unix 秒 / 毫秒，或留空取当前">
      <button onclick="run()">转换</button>
    </div>
    <div class="out" id="out"></div>
  </div>

<script>
function run(){
  const v = document.getElementById('ts').value.trim();
  let t = v ? Number(v) : Date.now();
  if (!v) t = Date.now();
  else if (t < 1e11) t = t * 1000;
  const d = new Date(t);
  document.getElementById('out').textContent =
    d.toLocaleString('zh-CN', {hour12:false}) + ' · ISO ' + d.toISOString();
}
run();
</script>
</body>
</html>
